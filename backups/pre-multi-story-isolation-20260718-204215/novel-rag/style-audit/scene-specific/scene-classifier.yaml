  content: '<!-- 场景类型判定协议 V0.4 -->

    [场景类型判定协议V0.4 已激活]


    <rule_0> 场景判定原则

    落笔前先判断当前场景的主要功能。


    多类型交叉时，以当前段落最主要的文本功能为准，而不是整章类型。


    可选类型：

    1. 战斗；

    2. 功能对话；

    3. 关系对话；

    4. 日常；

    5. 情绪爆发；

    6. 表白/坦白；

    7. 亲密；

    8. 争执/对峙；

    9. 离别；

    10. 过渡。


    <scene_battle> 战斗

    - 核心功能：物理威胁、攻防、战术变化。

    - 节奏：短句为主，动作尽快抵达结果。

    - 动作：必须造成伤害、破坏、闪避、逼退、失衡、位置变化之一。

    - 描写：只保留战术信息、伤害信息、环境限制。

    - 禁止：姿态美感、慢动作拆分、抽象比喻。


    </scene_battle>


    <scene_functional_dialogue> 功能对话

    - 核心功能：情报交换、谈判、质问、任务安排、揭露真相。

    - 节奏：台词连续，旁白少，动作少。

    - 台词：优先清楚、准确、有信息差。

    - 描写：只在改变主动权、暴露隐瞒、造成对方反应时插入。

    - 禁止：每句台词都配动作、语气、眼神。


    </scene_functional_dialogue>


    <scene_relationship_dialogue> 关系对话

    - 核心功能：展示关系、熟悉程度、边界、照顾、互损。

    - 节奏：允许松弛、废话、旧梗、跑题、接话。

    - 台词：角色私有性优先。

    - 描写：保留能体现关系习惯的动作。

    - 禁止：把嘴贱写成通用段子；把日常强行升华。


    </scene_relationship_dialogue>


    <scene_daily> 日常

    - 核心功能：生活状态、节奏缓冲、人物存在感。

    - 节奏：自然，不必强推主线。

    - 动作：保留最能体现角色习惯或关系的动作。

    - 描写：食物、房间、路程、天气等只有参与人物状态时才写。

    - 禁止：流水账、空镜、无归属废话。


    </scene_daily>


    <scene_emotional_break> 情绪爆发

    - 核心功能：角色失控、压抑破裂、关系转折。

    - 节奏：可失衡，可短句密集，也可突然变长。

    - 台词：允许语序乱、重复、答非所问。

    - 描写：只抓 1-2 个最能体现失控的身体或行动反应。

    - 禁止：连续堆眼泪、嘴唇、喉咙、手指、呼吸。


    </scene_emotional_break>


    <scene_confession> 表白/坦白

    - 核心功能：说出隐藏情感或隐藏事实。

    - 节奏：可迟疑，但迟疑必须属于角色。

    - 台词：可以不完整，可以绕，可以逃避后再说。

    - 动作：服务靠近、退让、回避、接受、拒绝。

    - 禁止：抒情套话、抽象心意、过度语气描写。


    </scene_confession>


    <scene_intimacy> 亲密

    - 核心功能：关系距离变化与身体反馈。

    - 节奏：按角色状态变化，不按固定模板。

    - 描写：重点写接受、迟疑、索取、退让、停止伪装。

    - 感官：可以写，但必须服务关系变化。

    - 禁止：感官堆砌、抽象抒情、身体部位清单。


    </scene_intimacy>


    <scene_confrontation> 争执/对峙

    - 核心功能：立场冲突、语言攻防、权力变化。

    - 节奏：短句、反问、打断、追问均可。

    - 台词：谁追问，谁回避，谁被迫承认，要清楚。

    - 描写：只写改变主动权的动作或反应。

    - 沉默：写结果，不写氛围。

    - 禁止：沉默必须配微动作。


    </scene_confrontation>


    <scene_parting> 离别

    - 核心功能：分离、拖延、未说出口的关系。

    - 节奏：可放慢，但每段要有关系功能。

    - 动作：延缓、回头、递还、收下、放手、离开。

    - 细节：保留能承载关系的具体物件。

    - 禁止：静物写生、空镜抒情、强行升华。


    </scene_parting>


    <scene_transition> 过渡

    - 核心功能：把人物从一个场景带到下一个场景。

    - 节奏：短、清楚、少装饰。

    - 内容：交代时间、地点、行动目标、队伍状态。

    - 禁止：过渡段写成氛围散文。


    </scene_transition>

    </rule_0>'

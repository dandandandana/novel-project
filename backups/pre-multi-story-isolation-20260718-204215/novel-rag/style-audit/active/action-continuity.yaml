  content: "# 小说文风修正指令：动作连贯性与文字血肉化\n\n## 一、任务目标\n\n对用户提供的小说文本进行文风修正。\n\n本次修正不改变以下内容：\n\n- 原有剧情发展；\n- 战斗胜负与人物决策；\n- 招式、能力、宝具及世界观设定；\n\
    - 角色立场、性格与台词含义；\n- 动作发生的先后顺序；\n- 重要伏笔与信息量；\n- 原文已经成立的物理逻辑和战术逻辑。\n\n修正的核心目标是：\n\n> 将原本类似“分镜说明书”“战斗过程记录”“视觉特效播报”的文字，重构为具有动作惯性、句法呼吸、感官反馈、人物意识与情绪张力的小说叙述。\n\
    \n文字应当让读者感到动作正在连续发生，而不是由旁白逐项宣布。\n\n---\n\n## 二、核心文风\n\n整体文风应当具备以下特征：\n\n- 沉浸；\n- 紧迫；\n- 冷峻；\n- 凝练；\n- 有重量；\n- 有痛感；\n-\
    \ 有动作惯性；\n- 有明确的空间关系；\n- 有人物意识参与；\n- 有长短句交替形成的呼吸感。\n\n战斗不是招式清单。\n\n战斗中的每一个动作，都应当同时携带至少两项内容：\n\n1. 动作本身；\n2. 力量的来源或去向；\n\
    3. 身体承受的反馈；\n4. 对手造成的压迫；\n5. 角色当下的判断；\n6. 环境产生的变化；\n7. 下一动作得以成立的契机。\n\n不要把这些信息拆成互不关联的独立句子，应当让它们彼此推动。\n\n---\n\n## 三、首要修正规则\n\
    \n### 1. 严格限制“否定前置”\n\n减少以下句式：\n\n- 他没有回头。\n- 她没有追。\n- 对方没有进攻。\n- 火焰没有温度。\n- 没有爆炸。\n- 他没有选择闪避。\n- 她没有理会伤势。\n- 不是A，而是B。\n\
    - 没有A，只有B。\n\n这类句式只能在以下情况下使用：\n\n- 否定本身会产生悬念；\n- 角色做出了明显违反常理的选择；\n- 需要推翻读者刚刚形成的预期；\n- 否定能够直接改变战局；\n- 需要以极短句制造一次明确的停顿或重击。\n\
    \n不得连续使用。\n\n不得把普通动作都写成“先说明什么没有发生，再说明真正发生什么”。\n\n错误示例：\n\n> 杨浞没有后退。他没有抬剑，而是松开铁鞭。\n\n修正方向：\n\n> 杨浞迎着压来的灰火松开铁鞭，脚下反而向前踏进半步。剑仍压在腰侧，空出的右手已经扣住对方腕骨。\n\
    \n否定信息如果并不重要，应直接删除。\n\n如果否定信息确实重要，应尽量融入动作结果：\n\n> 灰火掠过他的衣袖，布料完整无损，腕骨深处却传来一声细微的开裂。\n\n不要写成：\n\n> 灰火不烧衣服，也不烧皮肤，只烧灵基。\n\n\
    ---\n\n### 2. 打破机械化主谓宾短句\n\n避免连续出现：\n\n> 人名或代词＋动作。  \n> 人名或代词＋动作。  \n> 人名或代词＋观察。  \n> 环境＋变化。  \n> 另一人＋动作。\n\n禁止把完整战斗回合拆成“角色操作日志”。\n\
    \n需要根据动作关系，将多个短句重组为一个具有内部节奏的动作段落。\n\n推荐结构：\n\n> 起势或压迫——身体反应——临场判断——动作转折——力量释放——结果落地。\n\n例如：\n\n原句：\n\n> 天照命抬手。灰火从地面升起。杨浞后退。铁鞭扫向她的腰部。\n\
    \n修正：\n\n> 天照命抬掌的瞬间，脚下阴影已被灰火撑得直立。杨浞被逼得侧身让开半步，铁鞭却借着腰身拧转横扫出去，鞭梢贴着火墙下缘，直取她尚未收稳的腰腹。\n\n句子长度必须有变化。\n\n允许使用：\n\n- 中长句承载连续动作；\n\
    - 短句落锤；\n- 极短句制造突变；\n- 从句补足力量与空间关系；\n- 省略主语加快同一角色的连续动作。\n\n不要整段都写成长句。\n\n不要整段都写短句。\n\n每个自然段都应当形成一次完整呼吸。\n\n---\n\n###\
    \ 3. 合并同一角色的连续动作\n\n在视角对象和动作主体没有变化时，应适当省略反复出现的人名和代词。\n\n错误示例：\n\n> 杨浞抬剑。杨浞向前一步。他用剑挡住灰火。杨浞随后挥动铁鞭。\n\n修正方向：\n\n> 杨浞踏前一步，剑锋斜挑着抵入灰火，借火势被撬开的刹那转腰送肩，铁鞭已从另一侧破风砸落。\n\
    \n只有在以下情况下重新点明主语：\n\n- 动作主体发生变化；\n- 场上有两个同性角色，可能产生歧义；\n- 主客关系突然反转；\n- 需要强调某人的主动选择；\n- 段落间隔较长，需要重新建立视角锚点。\n\n不要为了“防止读者看不懂”而在每一句句首重复姓名。\n\
    \n清晰应当来自空间关系和动作逻辑，而不是主语堆积。\n\n---\n\n### 4. 将动作写成因果链，而非动作清单\n\n每个动作都需要回答：\n\n- 为什么能做出这个动作？\n- 动作借用了什么力量？\n- 对手留下了什么空当？\n\
    - 身体付出了什么代价？\n- 上一个动作如何导向下一个动作？\n- 结果为什么成立？\n\n避免：\n\n> 松剑。踢剑。换手。砸下。\n\n改为：\n\n> 右肩已经抬不起来，他索性卸去腕力。长剑顺势坠落，左脚却从剑锋下方穿入，脚背托住剑脊猛然上挑；同一瞬，铁鞭在背后倒手换握，借天照命压剑时来不及回收的力道，兜头砸落。\n\
    \n重点不是增加字数，而是补上动作之间的“铰链”。\n\n禁止角色为了完成作者预设动作而突然拥有不合理的姿势、距离或发力条件。\n\n发现动作逻辑有缺口时，应当以最少量的文字补齐：\n\n- 重心；\n- 距离；\n- 惯性；\n- 借力；\n\
    - 视野盲区；\n- 关节限制；\n- 武器位置；\n- 前一击留下的僵直；\n- 地形产生的高低差。\n\n不得擅自新增招式或改变战果来修补逻辑。\n\n---\n\n## 四、暴力与痛觉描写规则\n\n### 1. 不要把伤害写成物理参数\n\
    \n避免以下机械表达：\n\n- 第四根刺入……\n- 第五根穿出……\n- 伤口扩大。\n- 血液向外涌出。\n- 肠道从伤口中脱出。\n- 他把内脏按了回去。\n- 手臂失去功能。\n- 恢复速度下降一半。\n\n除非数字本身具有战术意义，否则不要用编号播报连续伤害。\n\
    \n伤害描写应当包含身体层面的具体反馈：\n\n- 肌肉瞬间绷紧或失力；\n- 骨骼承受冲击时的闷响；\n- 呼吸被截断；\n- 胃部、胸腔或咽喉的抽搐；\n- 血液的温度；\n- 黏稠感；\n- 伤口被拉扯时的痉挛；\n- 神经传来的迟钝、灼痛或空白；\n\
    - 角色因伤势改变动作方式；\n- 身体本能与理智命令之间的冲突。\n\n伤害必须影响后续战斗。\n\n角色不能刚被贯穿，下一句便像无事发生一样继续执行动作。\n\n---\n\n### 2. 感官必须服务于动作\n\n不要为了血腥而血腥。\n\
    \n每个感官细节都应当有作用。\n\n例如：\n\n> 枪尖从腹甲下缘钻入，向上撕开时，杨浞的腹肌先本能地绞紧，随即被锋刃割断。滚烫的血贴着腰带往下淌，呼吸却比疼痛更早断掉。他弯下去，不是因为支撑不住，而是为了用前臂压住裂口，好让下一次发力时内脏不会顺着伤口滑出来。\n\
    \n这里的痛觉同时说明：\n\n- 伤口位置；\n- 身体反应；\n- 动作受限；\n- 角色为什么采取某个动作；\n- 他还能继续战斗的方式。\n\n避免只罗列：\n\n> 鲜血、碎肉、骨骼、内脏、焦味、惨叫。\n\n---\n\n\
    ### 3. 超自然伤害也要有可感知载体\n\n对于“削去未来”“侵蚀灵基”“抹除下一刻”“燃烧可能性”等概念攻击，不可只进行设定说明。\n\n应通过角色能够感知的异常表现进行呈现：\n\n- 脚踩在地面，却无法完成迈步；\n- 手指仍在，却无法握住下一瞬的武器；\n\
    - 伤口没有扩大，身体却停止恢复；\n- 记忆中突然空出一件曾经存在的物品；\n- 呼吸已经吸入，却无法抵达肺部；\n- 门扉仍有轮廓，门后的空间却失去意义。\n\n先让读者“看见异常”，再由角色通过试探总结规则。\n\n避免作者直接宣布完整机制。\n\
    \n---\n\n## 五、视角与人物意识\n\n### 1. 固定段落视角\n\n一个动作段落原则上贴近一个主要观察者。\n\n进入该人物视角后，描写内容应受其认知限制：\n\n- 他能看见什么；\n- 他能听见什么；\n- 他能判断到什么程度；\n\
    - 他暂时无法确认什么；\n- 他会优先注意什么；\n- 他的经验如何影响判断。\n\n不要在同一段中无过渡地切换：\n\n- 杨浞的身体感受；\n- 吉尔伽美什的千里眼判断；\n- 天照命的内心；\n- 远处立香的观察；\n- 作者对术式的全知解释。\n\
    \n切换视角时应当换段，并通过动作、目光、声音或场景转换建立锚点。\n\n---\n\n### 2. 让人物判断嵌入动作\n\n不要把角色写成没有意识的战斗摄像机。\n\n战斗中允许出现极短、极快的判断：\n\n- 太慢。\n- 不对。\n\
    - 她在等这个。\n- 距离被动过。\n- 伤口不会愈合。\n- 这一击不能挡。\n- 里面有人。\n- 她想逼他选择。\n\n判断不要长篇解释。\n\n真正复杂的机制，通过以下流程表现：\n\n> 异常出现——角色试探——结果反馈——暂时判断——再次验证——得出有限结论。\n\
    \n人物不应一次看见现象便准确说出全部设定。\n\n允许角色犯错、保留怀疑或只说出当前证据所能支持的结论。\n\n---\n\n## 六、修辞与遣词规则\n\n### 1. 动词优先，但不要堆砌“凶狠动词”\n\n优先使用能够体现方向、重量与材质的动词：\n\
    \n- 凿；\n- 撬；\n- 碾；\n- 绞；\n- 拧；\n- 扯；\n- 压；\n- 挑；\n- 削；\n- 裂；\n- 沉；\n- 贯；\n- 拖；\n- 折；\n- 吞；\n- 贴；\n- 滑；\n- 锁；\n- 兜；\n-\
    \ 卸；\n- 挫；\n- 崩。\n\n但不能为了显得有力量而让每个动作都“猛然、狠狠、轰然、骤然”。\n\n同一段内避免重复使用相同程度副词。\n\n动作的力量应当由结果表现，而不是依靠副词宣布。\n\n错误：\n\n> 他猛然狠狠挥出极其沉重的一剑。\n\
    \n修正：\n\n> 剑锋压下，脚下金砖先沿着他的前脚裂开。\n\n---\n\n### 2. 控制比喻数量\n\n比喻应当满足以下条件之一：\n\n- 帮助读者理解陌生动作；\n- 强化人物主观感受；\n- 体现武器或力量的性质；\n\
    - 建立战场气氛；\n- 为后续意象形成呼应。\n\n不要连续使用：\n\n- 如蛇；\n- 如龙；\n- 如雷；\n- 如山；\n- 如海；\n- 如刀；\n- 如锤。\n\n一组连续动作最多使用一到两个核心意象。\n\n意象一旦确定，应保持统一。\n\
    \n例如某段以“潮汐”表现力量，就不要紧接着改用“野兽”“雷霆”“齿轮”三套比喻。\n\n---\n\n### 3. 不要把说明词伪装成文学语言\n\n谨慎使用：\n\n- 某种；\n- 仿佛；\n- 似乎；\n- 宛如；\n- 代表着；\n\
    - 意味着；\n- 形成；\n- 产生；\n- 进行；\n- 使得；\n- 开始；\n- 继续；\n- 随之；\n- 与此同时；\n- 下一瞬。\n\n这些词不是完全禁止，但不得成为连接动作的主要手段。\n\n尤其避免：\n\n> 他开始向前移动。\
    \  \n> 火焰开始发生变化。  \n> 伤口随之开始愈合。  \n> 力量使得地面产生裂纹。\n\n修正：\n\n> 他踏出第一步，灰火便沿脚踝向上合拢。伤口刚长出一层薄肉，地面已经被重新压裂。\n\n---\n\n## 七、对话修正规则\n\
    \n战斗对话必须符合当前局势。\n\n角色说话时，应考虑：\n\n- 是否有呼吸条件；\n- 是否正在承受攻击；\n- 是否需要争取时间；\n- 是否故意刺激对手；\n- 是否在交换情报；\n- 是否符合角色一贯语气。\n\n不要让角色在高速战斗中进行完整设定说明。\n\
    \n不要让所有角色都用同一种简短、冷淡、故作深沉的语气说话。\n\n对话前后的动作要自然衔接。\n\n错误：\n\n> “你输了。”他说。  \n> “未必。”她说。  \n> “试试看。”他说。\n\n修正方向：\n\n> “你慢了。”\
    \  \n> 杨浞说话时仍在收鞭，最后一个字落下，鞭尾已经缠住她来不及撤走的手腕。  \n> 天照命低头看了一眼，没有挣。  \n> “是你以为我需要躲。”\n\n台词不必每句都配“他说”“她说”。\n\n发言者明确时，可以通过动作承担提示功能。\n\
    \n---\n\n## 八、大场面描写规则\n\n面对以下内容：\n\n- 光炮；\n- 宝具对撞；\n- 城市毁灭；\n- 山脉断裂；\n- 天地异变；\n- 固有结界展开；\n- 神明现界；\n- 巨型法身降临；\n- 战场规则改写；\n\
    \n禁止只写视觉特效。\n\n大场面至少应同时呈现三个尺度：\n\n### 第一层：核心动作\n\n谁发动了什么。\n\n### 第二层：近距离反馈\n\n人物的身体、衣物、武器、脚下地面发生了什么。\n\n### 第三层：远景后果\n\
    \n山脉、城市、天空、地平线或空间结构如何改变。\n\n例如：\n\n> 光柱贯出时，最先消失的不是远处山峰，而是吉尔伽美什耳边的声音。她看见自己的发梢被无声抬起，脚下荒原则以剑尖为中心塌成漏斗。直到赤光越过地平线，三座山的轮廓才从中央断开，迟来的轰鸣沿大地反撞回来。\n\
    \n不要只写：\n\n> 巨大的光炮爆发，天地震动，山河破碎。\n\n---\n\n## 九、保留短句的正确用法\n\n短句不是问题。\n\n机械、同质、无层次的短句才是问题。\n\n短句适合用于：\n\n- 战局突变；\n- 伤害落地；\n\
    - 重要判断；\n- 角色决断；\n- 视角中断；\n- 招式真名；\n- 大场面爆发前的停顿；\n- 情绪彻底改变的节点。\n\n例如：\n\n> 太近了。  \n> 剑来不及回。  \n> 杨浞索性松手。\n\n短句之后应当接续动作，而不是继续进行同结构播报。\n\
    \n避免：\n\n> 他松手。  \n> 剑落下。  \n> 他抬脚。  \n> 剑飞起。  \n> 他换手。  \n> 铁鞭砸下。\n\n---\n\n## 十、必须保留的优点\n\n修正时不得破坏原文以下优点：\n\n- 清晰的战术交换；\n\
    - 能力之间的克制关系；\n- 招式试探与机制破解；\n- 多人配合；\n- 对人质、平民和容器的顾忌；\n- 角色通过行动表达立场；\n- 神话、科技、佛法和型月式概念机制的结合；\n- 台词中的角色辨识度；\n- 大规模战场结构；\n\
    - 设定的狂气与想象力。\n\n修正的目的不是把文本改成传统武侠。\n\n也不是把所有复杂能力降格成普通刀剑对砍。\n\n需要保留原有高规格设定，只改变承载设定的文字方式。\n\n---\n\n## 十一、防止矫枉过正\n\n不得出现以下问题：\n\
    \n### 1. 辞藻过载\n\n不要为每个名词添加形容词。\n\n不要把每个动作写成四行比喻。\n\n不要用华丽语言掩盖动作逻辑。\n\n### 2. 过度延长\n\n原文一个战斗回合修正后，篇幅原则上控制在原文的1.1至1.5倍。\n\
    \n只有当动作逻辑或感官反馈确实缺失时，才允许适度扩写。\n\n不得将每一个简单动作都扩写成慢镜头。\n\n### 3. 情绪直说\n\n避免：\n\n- 他感到痛苦；\n- 她非常愤怒；\n- 他震惊了；\n- 她感到悲伤；\n- 他产生了恐惧；\n\
    - 她内心十分复杂。\n\n改用：\n\n- 呼吸；\n- 动作迟滞；\n- 手指变化；\n- 视线停留；\n- 失误；\n- 语速；\n- 肌肉反应；\n- 对无关事物的异常关注；\n- 对下一动作的选择。\n\n### 4. 全篇高强度\n\
    \n战斗需要起伏。\n\n必须区分：\n\n- 试探；\n- 交锋；\n- 受创；\n- 喘息；\n- 判断；\n- 反制；\n- 升格；\n- 爆发；\n- 余波。\n\n不能每一句都处于“最大音量”。\n\n真正的爆发前，应当允许一到两句收束或静默。\n\
    \n---\n\n## 十二、执行流程\n\n修正每个段落时，按照以下顺序进行内部处理：\n\n### 第一步：识别信息\n\n确认本段中：\n\n- 谁在行动；\n- 行动目标是什么；\n- 武器位于何处；\n- 双方距离如何；\n\
    - 上一击留下了什么状态；\n- 本段必须传递哪些设定信息；\n- 本段最终结果是什么。\n\n### 第二步：识别机械句\n\n标记并处理：\n\n- 高频“没有”；\n- 高频“不是……而是……”；\n- 连续人名开头；\n- 连续主谓宾短句；\n\
    - 动作逐项编号；\n- 伤害参数化；\n- 作者直接解释机制；\n- 无意义的“开始、继续、随之、进行”。\n\n### 第三步：重建动作链\n\n将动作按照以下关系重新连接：\n\n> 压迫产生反应，反应制造选择，选择推动动作，动作造成反馈，反馈改变下一步。\n\
    \n### 第四步：注入感官与意识\n\n根据场景选择少量有效细节：\n\n- 触觉；\n- 重量；\n- 呼吸；\n- 疼痛；\n- 声音；\n- 温度；\n- 视野；\n- 肌肉状态；\n- 角色判断。\n\n每个动作段不必全部具备，选择最有效的两到三项。\n\
    \n### 第五步：调整句子呼吸\n\n确保：\n\n- 长短句交替；\n- 同一主体可省略主语；\n- 关键结果使用短句落地；\n- 段落长度与战斗节奏匹配；\n- 台词不会切断动作惯性。\n\n### 第六步：检查设定准确性\n\n\
    不得：\n\n- 改变能力效果；\n- 修改招式名称；\n- 增减人物；\n- 改变胜负；\n- 改变人物智力；\n- 擅自补充世界观结论；\n- 将角色尚未确认的事情写成事实。\n\n---\n\n## 十三、重点禁用倾向\n\n修正后的文本应尽量避免高频出现以下结构：\n\
    \n- “没有……”\n- “不是……而是……”\n- “他没有……”\n- “她没有……”\n- “与此同时……”\n- “下一瞬……”\n- “紧接着……”\n- “随之……”\n- “开始……”\n- “继续……”\n- “似乎……”\n\
    - “某种……”\n- “第一次……”\n- “最后……”\n- “视线从A移到B，最后落在C上。”\n- “他看了一眼。”\n- “她停了半息。”\n- “声音很轻。”\n- “脸上没有表情。”\n- “没有温度，也没有重量。”\n\
    - “力量没有减少。”\n- “不是因为A，也不是因为B。”\n\n这些表达并非绝对禁止，但同类结构不得在相邻段落中重复。\n\n每次保留，都必须具有不可替代的节奏或信息作用。\n\n---\n\n## 十四、输出要求\n\n直接输出修正后的正文。\n\
    \n不要输出：\n\n- 修改说明；\n- 病句分析；\n- 改动清单；\n- 写作建议；\n- 原文与改文对照；\n- “以下是修正版”等提示语；\n- 对用户设定的评价；\n- 对角色能力的重新解释。\n\n保留原有章节标题、分段和必要的招式标记。\n\
    \n若原文过长，应连续完成全文修正，不得擅自概括、跳过战斗或删除过渡段。\n\n---\n\n## 十五、最终自检\n\n输出前逐项检查：\n\n1. 是否仍有连续三句以上以人名或代词开头？\n2. 是否频繁先写“什么没有发生”？\n\
    3. 是否把动作写成了逐项播报？\n4. 动作之间是否存在明确的借力、距离与因果关系？\n5. 受伤是否影响了角色的后续动作？\n6. 概念攻击是否先通过现象呈现，而非直接说明？\n7. 是否出现无意义的形容词和副词堆砌？\n8. 是否为了追求华丽而拖慢战斗？\n\
    9. 是否保持了角色能力与战果不变？\n10. 是否有长短句交替？\n11. 是否让重要短句真正承担了重击作用？\n12. 是否能够让读者连续想象整套动作，而不必反复停下来重新确认人物位置？\n\n若任意一项不合格，应再次修改对应段落。\n\
    \n最终效果应当是：\n\n> 动作彼此咬合，力量具有惯性，伤口带来真实阻碍，设定通过战斗显现，人物在行动中判断与选择。文字依然克制，却不再干瘪；信息依然清楚，却不再像说明书。"

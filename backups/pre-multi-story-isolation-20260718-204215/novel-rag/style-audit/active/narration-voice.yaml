  content: '<!-- 旁白描写模块 V0.6 - 克制判断与活人感保留 -->


    <rule_0> 核心原则：旁白要清楚，也要有人味

    旁白不只是摄像头，也不是诗人。


    旁白负责让读者看清：

    1. 发生了什么；

    2. 谁在说什么；

    3. 谁知道什么；

    4. 谁误解了什么；

    5. 谁在回避什么；

    6. 关系如何变化；

    7. 场面节奏如何变化。


    旁白可以有判断，但不要装腔。


    <rule_1> 允许普通判断

    允许旁白使用正常叙事判断：


    可以写：

    - 士郎没有解释那个名字。

    - 祁荒听懂了他的意思。

    - 玛修发现话题已经偏到她不熟悉的领域。

    - 立香知道这两个人又开始绕了。

    - 这个玩笑没有接住。

    - 她这次没有像平时那样立刻回嘴。


    这些判断清楚、正常、有信息。


    不建议写：

    - 士郎问得很平。

    - 祁荒的笑意像水一样退去。

    - 空气安静得像被切开。

    - 他的声音没有情绪。

    - 这句话没有笑。

    - 他的眼神很危险。


    <rule_2> 旁白可以服务于日常关系

    日常场景中，旁白可以记录关系细节。


    允许写：

    1. 谁习惯性接谁的话；

    2. 谁总是嘴上嫌弃但实际照顾；

    3. 谁在熟人面前话变多；

    4. 谁在尴尬时开始跑题；

    5. 谁用吐槽代替关心；

    6. 谁故意不拆穿对方。


    这些内容不一定推进剧情，但能推进人物关系。


    <rule_3> 禁止伪冷感

    禁止用抽象语气和气氛修饰制造“高级感”：


    - 平；

    - 淡；

    - 冷；

    - 空；

    - 静；

    - 沉；

    - 干净；

    - 锋利；

    - 压迫感；

    - 危险感；

    - 克制感。


    不是绝对禁词，而是禁止用它们偷懒。


    错误：

    他问得很平。


    正确：

    他没有解释那个名字。

    他没有接祁荒的玩笑。

    他问完后等她回答。


    <rule_4> 情绪和停顿可以写，但要具体属于角色

    允许写停顿、沉默、尴尬、跑题。


    但必须说明它属于谁、为什么成立、造成什么关系效果。


    可以写：

    - 祁荒难得没接玩笑。

    - 玛修看了看士郎，又看了看祁荒，决定先把说明接过去。

    - 立香本来想劝一句，听见“根源魔术”后把话咽了回去。

    - 士郎没有顺着她的吐槽走，直接把话题拉回神琦灰。


    不要写：

    - 她沉默了片刻。

    - 空气安静下来。

    - 他的眼神沉下去。

    - 她嘴唇动了动。

    - 他的声音轻得像什么。


    <rule_5> 环境描写少量保留

    环境描写可以存在，但不能抢走人物。


    允许：

    1. 定场；

    2. 打断对话；

    3. 形成日常生活感；

    4. 影响人物行动；

    5. 作为关系互动的载体。


    例如：

    - 饭凉了还没人动筷；

    - 自动门开了又关，没人出去；

    - 医疗舱提示音响起，玛修终于找到插话机会；

    - 士郎把不吃的配菜拨到一边，立香看见后顺手夹走。


    这些环境有关系功能。


    禁止：

    - 灯光反复切脸；

    - 饰品轻响；

    - 衣料摩擦；

    - 空气变冷；

    - 影子拉长；

    - 墙壁反光；

    - 没有用途的空镜头。


    <rule_6> 旁白自检

    每段旁白完成后检查：


    1. 它是否让事情更清楚？

    2. 它是否让关系更可信？

    3. 它是否让角色更像活人？

    4. 它是否只是在制造气氛？

    5. 它是否把台词已经表达的东西又解释了一遍？


    如果只是制造气氛，删除。

    如果能增加角色私有性，保留。'

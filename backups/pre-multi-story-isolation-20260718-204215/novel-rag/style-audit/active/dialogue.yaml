  content: '<!-- 对话协议 V0.6 - 活人感优先与角色私有化 -->


    <rule_0> 核心原则：对话首先要像活人说话

    角色说话不必每句都推进剧情。


    朋友可以嘴贱，熟人可以废话，恋人可以说没营养的话，疲惫的人可以答非所问，关系亲近的人可以用只有彼此听得懂的烂梗、旧账、称呼和跑题方式交流。


    对话的首要目标不是“高效”，而是让读者相信：

    这是这个角色会说的话；

    这是这两个人之间才会出现的说话方式。


    <rule_1> 对话必须有文本功能，但文本功能不等于剧情功能

    每段对话至少承担以下一种功能即可：


    1. 推进剧情；

    2. 交换信息；

    3. 展示关系；

    4. 展示角色声音；

    5. 制造生活感；

    6. 缓和节奏；

    7. 暴露情绪；

    8. 暴露价值观；

    9. 暴露关系边界；

    10. 让角色从剧情工具人变回活人。


    日常对话、嘴贱对话、废话对话、跑题对话，只要能让关系更可信、角色更具体，就允许存在。


    <rule_2> 角色私有化高于信息效率

    判断一句台词是否成立，不只看它有没有信息，还要看它是否具有角色私有性。


    检查标准：


    1. 这句话换成另一个角色说，还成立吗？

    2. 这个玩笑换成另一组关系，还成立吗？

    3. 这个口癖是否属于这个人，而不是 AI 通用口癖？

    4. 这个停顿是否来自角色性格，而不是作者强行制造节奏？

    5. 这个跑题是否暴露了角色的习惯、逃避方式或亲密关系？


    如果换谁说都一样，重写。


    <rule_3> 允许口癖、废话、跑题和停顿

    口癖、废话、跑题、停顿不是缺陷，它们是活人感的重要来源。


    允许出现：


    1. 角色专属口癖；

    2. 熟人之间的烂梗；

    3. 互相拆台；

    4. 没意义但有关系感的废话；

    5. 因尴尬、疲惫、撒谎、心虚产生的停顿；

    6. 因亲近而省略主语、称呼、解释；

    7. 因熟悉而产生的抢话、接话、打断；

    8. 用吐槽回避正题；

    9. 用跑题拖延回答；

    10. 用玩笑掩盖认真。


    禁止的不是这些东西本身，而是所有角色都用同一种方式说话。


    <rule_4> 日常嘴贱规则

    朋友、熟人、搭档之间允许互相嘴贱。


    嘴贱对话不要求每句都有情报，但必须满足至少两项：


    1. 能看出谁更主动；

    2. 能看出谁更纵容；

    3. 能看出谁更会损人；

    4. 能看出谁更容易被逗急；

    5. 能看出两人熟到什么程度；

    6. 能看出哪些话只有他们之间能说；

    7. 能看出关系边界在哪里；

    8. 能看出一方是否在借玩笑回避正题。


    嘴贱不是段子展示。

    嘴贱必须服务于人物关系。


    <rule_5> 关系越近，语言越可以不完整

    亲近关系中的对话可以省略、跳跃、接梗、互相抢话。


    陌生人之间：

    句子相对完整，称呼明确，解释较多。


    熟人之间：

    可以省略解释，可以互损，可以直接接对方半句话。


    亲密关系之间：

    可以没头没尾，可以用旧梗代替解释，可以一句废话承载大量关系信息。


    敌对关系之间：

    可以短、硬、带刺，但不能所有人都变成谜语人。


    <rule_6> 功能对话与生活对话分流

    落笔前先判断对话类型。


    【功能对话】

    用于情报、谈判、质问、争执、任务安排。

    要求：信息清楚，废话收紧，动作少，旁白少。


    【生活对话】

    用于闲聊、互损、调侃、吃饭、赶路、休息。

    要求：角色味优先，允许废话和跑题，不强行塞主线。


    【关系对话】

    用于试探边界、拉近距离、互相照顾、互相别扭。

    要求：潜台词重要，允许半截话、旧梗、口是心非。


    【情绪对话】

    用于崩溃、告白、道歉、诀别、争吵。

    要求：语言可以乱，但不能长篇播报情绪。


    <rule_7> 活人感不是通用模板

    禁止把以下东西当成所有角色通用的“自然感”：


    1. 所有人都“呃”“啊”“那个”；

    2. 所有人都频繁改口；

    3. 所有人都说半截话；

    4. 所有人都用网络吐槽腔；

    5. 所有人都用同一种嘴贱方式；

    6. 所有人都靠沉默装深沉；

    7. 所有人都用“嘛”“哎呀”“怎么说呢”填空；

    8. 所有人都用反问句表达个性。


    每个角色必须有自己的说话系统。


    <rule_8> 角色声音构成

    角色声音由以下要素构成：


    1. 词汇习惯；

    2. 句子长短；

    3. 是否爱解释；

    4. 是否爱反问；

    5. 是否喜欢吐槽；

    6. 是否会接梗；

    7. 是否会主动安慰；

    8. 是否用玩笑回避；

    9. 是否在压力下变沉默；

    10. 是否在压力下话变多；

    11. 对不同人的称呼变化；

    12. 熟悉之后省略了哪些礼貌。


    写对话时优先使用这些要素，而不是给每句话添加语气描写。


    <rule_9> 语气描写限制

    正常说话默认不描写语气。


    禁止用旁白替角色标注气质：


    - 他问得很平；

    - 她淡淡地说；

    - 声音很冷；

    - 语气没有起伏；

    - 这句话没有笑；

    - 每个字都压在喉咙里；

    - 尾音往上一卷；

    - 声音像什么东西。


    态度应通过以下方式体现：


    1. 他说了什么；

    2. 他没说什么；

    3. 他有没有解释；

    4. 他有没有追问；

    5. 他有没有接对方的玩笑；

    6. 他有没有故意跳过某个问题；

    7. 对方因此怎么反应。


    <rule_10> 对话自检

    每段对话写完后检查：


    1. 这段像活人说话吗？

    2. 这段像这几个角色在说话吗？

    3. 换一组角色还能成立吗？

    4. 有没有角色关系的细节？

    5. 有没有无意义的伪冷感语气描写？

    6. 有没有所有角色声音趋同的问题？


    如果“不像活人”或“换谁都能说”，优先重写，而不是删减。'

  content: '<!-- 长段描写限制与描写解构 V0.3 - 节奏配给与细节使用 -->

    [长段描写限制V0.3 已激活]


    <rule_0> 段落长度原则

    段落长度由场景功能决定，不硬性凑字数。


    建议范围：

    - 长段：用于定场、复杂设定说明、情绪高潮、关键收束。必须有明确信息增量。

    - 中段：用于常规叙事、动作推进、关系承接。

    - 短段：用于对话交锋、动作爆发、信息落点、情绪断裂。

    - 单句段：用于强冲击信息或节奏停顿，不滥用。


    禁止为了满足长度要求填充光影、衣料、微声、眼神、呼吸。


    <rule_1> 细节分批释放

    禁止一次性倾倒设定或外貌清单。


    细节只能在以下情况出现：

    1. 角色正在使用它；

    2. 它影响行动；

    3. 它暴露身份或状态；

    4. 它造成对方反应；

    5. 它为后文埋伏笔；

    6. 它展示关系习惯；

    7. 它改变读者判断。


    <rule_2> 细节出场方式

    细节可以通过以下方式出场：


    1. 动作牵引；

    2. 对话牵引；

    3. 环境交互；

    4. 角色判断；

    5. 他人反应；

    6. 日常习惯；

    7. 冲突后果。


    不再强制使用“光影牵引”。

    光影描写容易制造空镜，除非必要，否则少用。


    <rule_3> 锚点法则

    每个描写单元只保留 1-2 个真正有用的锚点。


    锚点必须满足以下至少一项：

    1. 参与行动；

    2. 参与关系；

    3. 参与判断；

    4. 参与冲突；

    5. 参与伏笔；

    6. 参与生活感。


    错误锚点：

    墙壁的冷光、饰品的微响、衣料的摩擦、空气的变化。


    有效锚点：

    没动过的饭、被推回去的药、落锁的门、被避开的称呼、递到手边的杯子。


    <rule_4> 场景描写密度配给

    【战斗】

    细节服务战术与伤害。

    禁止停下来写美感。

    每个动作尽快抵达结果。


    【对峙/功能对话】

    细节服务信息差和主动权。

    不要写无关眼神、语气、光影。

    优先写谁没有回答，谁跳过问题，谁被迫承认。


    【日常/关系对话】

    细节服务生活感和关系。

    允许废话、旧梗、互损、顺手照顾。

    不要强行把日常升华成哲理。


    【回忆/闪回】

    允许感官片段，但禁止清单。

    重点写最能解释角色当前反应的 1-2 个片段。


    【情绪场景】

    细节服务失控、回避、靠近、拒绝。

    禁止连续堆五官和身体反应。


    【亲密场景】

    细节服务关系距离和身体反馈。

    禁止抽象抒情，禁止感官堆砌。

    重点写接受、迟疑、退让、靠近、停止伪装。

    </rule_4>


    <rule_5> 生存审计

    任何细节写完后检查：


    1. 它之后是否被使用？

    2. 它是否改变角色行动？

    3. 它是否改变角色关系？

    4. 它是否提供判断依据？

    5. 它是否让角色更具体？

    6. 它是否只是为了氛围？


    若只有第 6 项成立，删除。'

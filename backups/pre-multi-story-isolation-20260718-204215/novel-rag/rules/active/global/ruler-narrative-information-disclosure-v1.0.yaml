rule:
  retrieval_key: narrative_information_disclosure_no_omniscient_leak
  aliases:
  - point_of_view_knowledge_boundary
  - minimum_necessary_disclosure
  - no_character_card_introduction
  - no_ability_manualization
  - preserve_unknown_misjudgment_ambiguity
  - explanation_sentence_audit
  purpose: >-
    将设定库严格限定为作者后台，禁止旁白越过当前视角角色的认知边界泄露作者答案；
    设定只能依附观察、行动、对话、调查、验证和事件后果按最小必要原则逐层显露。
  activation:
  - 小说正文生成、续写、改写和润色
  - 人物首次登场、能力首次出现、调查、战斗、揭秘与章节收束
  - 正文需要引用 Canon、History、Character State、World State 或人物卡信息
  mandatory_contract:
    narrator_permission: 旁白的信息权限不得超过当前视角角色。
    setting_library_role: 设定库是作者后台，不是旁白台词。
    disclosure_threshold: 正文信息必须至少满足一项显露条件，否则不得由旁白主动透露。
    event_first: 能通过事件表现的信息不解释；能留到后面确认的信息不提前确认。
  disclosure_conditions:
  - 当前场景中的角色能够直接观察到
  - 当前视角角色已经知道，并且此刻确实会想到
  - 角色通过对话、调查、实验、战斗或事件结果得知
  - 该信息是读者理解当前行动所必需的最低限度信息
  - 该信息的显露本身能够推动剧情、改变判断或制造新的冲突
  forbidden_omniscient_disclosures:
  - 角色尚未察觉的阴谋
  - 敌人的真实身份、目的、能力原理或心理活动
  - 某个行为未来将造成的结果
  - 某件物品真正的来历与全部功能
  - 某项能力的完整机制、限制和破解方式
  - 角色本人尚未理解的情感本质
  - 世界观背后的最终答案
  - 其他角色没有表现出来的真实态度
  disclosure_layers:
  - 第一层：看见了什么
  - 第二层：角色认为这意味着什么
  - 第三层：通过行动验证了什么
  - 第四层：事件结束后才可能确认其原理
  - 第五层：核心真相只在剧情需要时揭示
  allowed_carriers:
  - 角色观察到的异常现象
  - 行动失败后暴露出的规则
  - 能力交锋产生的结果
  - 人物之间存在立场差异的对话
  - 调查所得的残缺资料
  - 角色带有偏见或局限的回忆
  - 物件、伤痕、环境与行为留下的痕迹
  - 角色为了做出决定而进行的必要推理
  prohibited_exposition_openers:
  - 实际上……
  - 事实上……
  - 他并不知道……
  - 她真正的目的其实是……
  - 这正是因为……
  - 这意味着在未来……
  - 作为某某的他拥有……
  - 这种力量的本质是……
  progressive_ability_reveal:
  - 首次出现：展示结果
  - 再次出现：展示稳定规律
  - 遭遇反例：展示限制
  - 角色推理：形成暂时结论
  - 关键剧情：揭示完整真相
  ordinary_scene_information_cap:
    major_new_settings: 1
    minor_rule_supplements: 1
    unexplained_anomalies: 1
    proper_noun_warning_threshold: 3
  reveal_scene_requirement: >-
    即使是揭秘场景，也至少保留一项尚未确认的动机、尚未解释的代价、尚未出现的限制、
    仍存在疑点的历史、相互矛盾的解释，或真相造成的新问题。
  exceptions:
  - 角色正在主动向他人解释作战规则
  - 角色需要依据情报立即制定计划
  - 调查报告、审判记录、实验记录等文本本身就是场景内容
  - 前文已充分铺垫，目前正在回收伏笔
  - 不说明将导致读者无法理解关键因果
  - 叙事进入明确的总结、复盘或章节收束阶段
  exception_limit: >-
    即使触发例外，也必须保留人物立场与信息局限，不得直接复制设定库原文。
  pre_disclosure_gate:
  - 当前角色为什么会想到这件事
  - 当前场景为什么需要读者知道
  - 不说明是否会导致动作无法理解
  - 该信息是否可以通过后续结果自然体现
  - 此刻说明是否会提前消耗悬念
  - 该信息是否属于作者知道、角色不知道的内容
  - 这段说明是否只是为了展示设定库很完整
  deletion_rule: >-
    若“当前场景为什么需要读者知道”和“不说明是否会导致动作无法理解”均为否，
    或“属于作者知道、角色不知道”和“只是展示设定库完整”均为是，则删除该说明。
  audit:
    explanation_tags:
    - 可观察：角色此刻能看见或感受到
    - 已知：当前视角角色此前已经知道
    - 推测：角色根据证据作出的判断
    - 验证：通过当前事件刚刚确认
    - 越权：只有作者或设定库知道
    - 冗余：删除后不影响当前情节
    handling:
    - 可观察、已知、推测、验证可以保留
    - 越权必须删除或改写成现象、猜测、伏笔
    - 冗余原则上删除
    - 连续出现三句以上解释时，必须将至少一半改写为动作、对话、结果或环境反馈
  downstream_requirements:
    ruler:
    - 将当前视角角色的已知、未知、误判与 forbidden_reveals 写入 execution_contract
    - 仅把与当前场景直接相关的信息列为允许显露
    judgment:
    - 为每个场景确定主要新设定、次要规则补充与未解释异常的配额
    - 不得把作者答案规划为旁白说明
    generator:
    - 通过观察、动作、对话、结果和有限推理显露设定
    - 不得集中进行人物卡式介绍、能力说明书化或替角色定义情绪
    audit:
    - 对解释性语句逐句执行可观察、已知、推测、验证、越权、冗余审计
    - 检查视角越权、设定倾倒、专有名词堆积与过早揭秘
  validation:
  - 所有正文信息都满足至少一个显露条件
  - 角色判断保持为判断，没有被旁白升级成客观事实
  - 首次登场没有集中罗列人物卡字段
  - 能力首次出现优先呈现效果、感受与角色反应
  - 人物情绪通过言行与矛盾选择呈现，未由旁白越权定义
  - 未知、误判、歧义和矛盾情报得到保留
  - 单场景新信息量未超过叙事承载能力
  - 揭秘后仍保留会推动后续剧情的新问题
  - 例外说明保留人物立场与信息局限
  - 越权与冗余解释已经删除或改写
  source_rules: |-
    # Rule：叙事信息显露约束（禁止旁白全知泄底）

    ## 1. 核心原则

    旁白不得将设定库、人物卡、世界观说明或作者答案直接翻译成正文。

    正文中出现的信息，必须满足以下至少一项：

    1. 当前场景中的角色能够直接观察到。
    2. 当前视角角色已经知道，并且此刻确实会想到。
    3. 角色通过对话、调查、实验、战斗或事件结果得知。
    4. 该信息是读者理解当前行动所必需的最低限度信息。
    5. 该信息的显露本身能够推动剧情、改变判断或制造新的冲突。

    不满足以上条件的信息，即使设定库中存在，也不得由旁白主动透露。

    ---

    ## 2. 视角认知边界

    旁白的信息权限不得超过当前视角角色。

    禁止旁白直接说明：

    - 角色尚未察觉的阴谋。
    - 敌人的真实身份、目的、能力原理或心理活动。
    - 某个行为未来将造成的结果。
    - 某件物品真正的来历与全部功能。
    - 某项能力的完整机制、限制和破解方式。
    - 角色本人尚未理解的情感本质。
    - 世界观背后的最终答案。
    - 其他角色没有表现出来的真实态度。

    视角角色只能根据当前掌握的信息进行观察、猜测、误判和推理。

    角色的判断不等于客观事实。

    ---

    ## 3. 最小必要显露

    每个场景只允许显露完成当前叙事目的所需的最少信息。

    例如，当前场景只需要让读者知道“这道火焰无法被普通魔术扑灭”，就不得继续解释：

    - 火焰的完整术式结构；
    - 创造者的身份；
    - 火焰在历史上的来源；
    - 它与某个神话体系的对应关系；
    - 它未来的进化形态；
    - 所有能够克制它的方法。

    设定应分层显露：

    - 第一层：看见了什么。
    - 第二层：角色认为这意味着什么。
    - 第三层：通过行动验证了什么。
    - 第四层：事件结束后才可能确认其原理。
    - 第五层：核心真相只在剧情需要时揭示。

    不得在首次登场时一次性完成全部层级。

    ---

    ## 4. 设定必须依附载体

    设定信息不得以独立说明书形式插入正文，必须依附于具体叙事载体。

    允许的载体包括：

    - 角色观察到的异常现象；
    - 行动失败后暴露出的规则；
    - 能力交锋产生的结果；
    - 人物之间存在立场差异的对话；
    - 调查所得的残缺资料；
    - 角色带有偏见或局限的回忆；
    - 物件、伤痕、环境与行为留下的痕迹；
    - 角色为了做出决定而进行的必要推理。

    禁止使用旁白直接总结：

    “实际上……”
    “事实上……”
    “他并不知道……”
    “她真正的目的其实是……”
    “这正是因为……”
    “这意味着在未来……”
    “作为某某的他拥有……”
    “这种力量的本质是……”

    除非该事实已经被角色确认，且此处总结能够立即推动场景。

    ---

    ## 5. 禁止人物卡式介绍

    角色登场时，不得集中罗列其：

    - 身份；
    - 经历；
    - 性格；
    - 阵营；
    - 能力；
    - 称号；
    - 社会关系；
    - 心理创伤；
    - 当前目标。

    角色信息应通过言行、选择、他人反应和事件后果逐步形成。

    错误示例：

    > 他是埋葬机关第六席，拥有圣剑与魔剑两种力量，性格表面轻浮，内心却因过去的失败承受着严重的负罪感。

    正确方向：

    > 男人倚在门边，像是根本没把屋内的枪口当回事。  
    > “第六席也会迟到？”  
    > 他笑了一声，没有纠正那个已经被除名的称呼，只低头摘下沾血的手套。

    正文只呈现当前场景能够承载的信息，剩余设定继续保留在设定库中。

    ---

    ## 6. 禁止能力说明书化

    能力第一次出现时，优先描写效果、感受与角色反应，不得立即解释完整机制。

    错误示例：

    > 他的能力可以复制所有看见的剑，并将其保存在无限剑制中，只要内部仍有剑，他就不会死亡。

    正确方向：

    > 剑锋贯穿心口。  
    > 他低头看了一眼，没有倒下。  
    > 下一刻，刺入胸腔的长剑从敌人手中消失，出现在了他的掌中。

    能力规则应通过多次使用逐步显露：

    1. 首次出现：展示结果。
    2. 再次出现：展示稳定规律。
    3. 遭遇反例：展示限制。
    4. 角色推理：形成暂时结论。
    5. 关键剧情：揭示完整真相。

    ---

    ## 7. 禁止替角色定义情绪

    旁白不得越过人物表现，直接给出完整心理结论。

    避免：

    - 他其实已经爱上了她。
    - 她真正恐惧的是重新被抛弃。
    - 他之所以愤怒，是因为想起了过去。
    - 她嘴上拒绝，内心却非常期待。
    - 这份感情早已超越了友情。

    优先通过以下内容呈现：

    - 犹豫；
    - 改口；
    - 回避；
    - 重复动作；
    - 不合常理的关注；
    - 说出口与没说出口的差异；
    - 身体反应；
    - 对同一件事前后矛盾的选择。

    只有当角色本人明确意识到某种情绪时，旁白才可以贴近其认知进行有限描述。

    ---

    ## 8. 保留未知、误判与歧义

    正文不得急于纠正角色的错误理解。

    应允许：

    - 角色根据有限信息得出错误结论；
    - 多个角色对同一现象有不同解释；
    - 读者暂时无法判断谁是正确的；
    - 某些异常只有结果，没有即时答案；
    - 已知情报彼此矛盾；
    - 角色故意隐瞒、撒谎或只说部分真话。

    神秘感不等于故意含糊。

    正文仍需清楚交代角色看见了什么、做了什么、为何作出当前选择，但不必立刻解释事件背后的最终答案。

    ---

    ## 9. 设定显露触发条件

    准备说明一项设定前，必须先判断：

    1. 当前角色为什么会想到这件事？
    2. 当前场景为什么需要读者知道？
    3. 不说明是否会导致动作无法理解？
    4. 该信息是否可以通过后续结果自然体现？
    5. 此刻说明是否会提前消耗悬念？
    6. 该信息是否属于作者知道、角色不知道的内容？
    7. 这段说明是否只是为了展示设定库很完整？

    若第2、3项均为否，或第6、7项为是，则删除该说明。

    ---

    ## 10. 单场景信息上限

    一个普通场景最多承担：

    - 一个主要新设定；
    - 一个次要规则补充；
    - 一个未被解释的异常。

    高潮、揭秘或调查场景可以适当增加，但每项新信息必须直接改变角色的判断或行动。

    不得在一个段落中连续解释多个名词、势力、历史事件、能力体系和人物关系。

    当正文连续出现三个以上专有名词时，应检查是否正在进行设定倾倒。

    ---

    ## 11. 揭秘场景的限制

    即使处于揭秘场景，也不得一次性解释所有问题。

    一次揭秘应至少保留一项内容：

    - 尚未确认的动机；
    - 尚未解释的代价；
    - 尚未出现的限制；
    - 仍存在疑点的历史；
    - 不同角色之间矛盾的解释；
    - 真相所造成的新问题。

    好的揭秘不是终止未知，而是用一个答案改变问题本身。

    ---

    ## 12. 例外情况

    以下情况可以进行较集中说明：

    - 角色正在主动向他人解释作战规则；
    - 角色需要依据情报立即制定计划；
    - 调查报告、审判记录、实验记录等文本本身就是场景内容；
    - 前文已充分铺垫，目前正在回收伏笔；
    - 不说明将导致读者无法理解关键因果；
    - 叙事进入明确的总结、复盘或章节收束阶段。

    即使属于例外，也必须保留人物立场与信息局限，不得直接复制设定库原文。

    ---

    ## 13. 生成后审计

    生成正文后，检查所有解释性语句，并逐句标记：

    - 【可观察】：角色此刻能看见或感受到。
    - 【已知】：当前视角角色此前已经知道。
    - 【推测】：角色根据证据作出的判断。
    - 【验证】：通过当前事件刚刚确认。
    - 【越权】：只有作者或设定库知道。
    - 【冗余】：删除后不影响当前情节。

    处理规则：

    - 【可观察】【已知】【推测】【验证】可以保留。
    - 【越权】必须删除或改写成现象、猜测、伏笔。
    - 【冗余】原则上删除。
    - 连续出现三句以上解释时，必须将至少一半改写为动作、对话、结果或环境反馈。

    ---

    ## 14. 最终强制规则

    设定库是作者后台，不是旁白台词。

    旁白只负责呈现当前正在发生的事情，不负责证明世界观完整，不负责提前替读者总结答案，也不负责替角色理解自己。

    能通过事件表现的信息，不解释。

    能留到后面确认的信息，不提前确认。

    角色不知道的信息，旁白也不知道。

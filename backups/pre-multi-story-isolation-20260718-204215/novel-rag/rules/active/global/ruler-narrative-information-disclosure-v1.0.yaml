  rule_id: narrative-information-disclosure
  title: 叙事信息显露约束（禁止旁白全知泄底）
  entity: narrative-information
  rule_type: hard_constraint
  rule_scope: global
  task_type: novel_generation
  scene_type: all
  priority: highest
  enforcement: mandatory
  version: '1.0'
  status: active
  canon_scope: generation_workflow
  created_at: '2026-07-17'
  updated_at: '2026-07-17'
  supersedes: null

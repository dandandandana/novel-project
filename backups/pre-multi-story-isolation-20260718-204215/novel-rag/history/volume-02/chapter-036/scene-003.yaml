content: '门在他身后滑上，自动锁舌发出一声轻巧的咔哒。


  走廊重新安静下来。


  房间里多了一个人的呼吸声，多了蛋糕的味道，多了拖鞋在地板上挪动的轻响。空间没有变小，但密度变了。


  Ruler侧身把盘子搁到桌板上。瓷与合金碰出一声很轻的响，蛋糕上的奶油在微弱的灯光里泛着柔软的光泽。


  然后他摊开右手。


  一道淡蓝色的光从掌心凝出，像雾气被压缩成固态。光芒消散的时候，他手里多了一柄东西。立香认得这个。投影魔术。在冬木的时候，那个言峰士郎用同样的方式从虚空中拽出过双刀，拽出过弓，拽出过她叫不出名字的各式武器。


  但这次的成品让她愣了一瞬。


  那东西介于菜刀和水果刀之间，刃口的弧度像家用的三德刀，刀背的厚度又带着剔骨刀的笨重感，握柄处收窄的角度像是特意为了贴合切割甜点时的手腕角度设计过。整体看上去不伦不类的，哪种厨刀都像，哪种都不完全是，却又散发着一种被频繁使用过的、经验堆叠出来的合理性。


  不是战斗用的。是做饭用的。


  Ruler握着这把奇怪的刀，下刀毫不犹豫。刀锋切入海绵蛋糕体的声音几乎听不见，只在触及底层垫纸时发出一声极短的沙沙。他的手腕翻转得很利落，三刀下去，整块蛋糕被等分成规整的扇形。奶油层的断面平滑干净，没有挤压变形。


  “喜欢第一口吃什么水果？“


  他问。


  立香靠在桌沿旁边看着他操作，听到这话微微抬了一下眉毛。


  “……你这么讲究的？“


  “当然。“


  那种理所当然的语气。好像凌晨一点给失眠的御主切蛋糕、还要讲究配什么水果，是世界上最正常的事情。


  “那就苹果。“


  “嗯。“


  刀锋落下，从蛋糕体侧面剖开一个切口，几片薄薄的苹果片从夹层中露出来，果肉的白色截面还带着新鲜的水光。Ruler用刀面将那一块蛋糕稳稳地托起，转移到一个小碟子上，顺手从盘子边沿拿起一把叉子，一并递了过来。


  “慢用。“


  立香看着他。


  走廊透进来的光打在他侧脸上，轮廓线被切出明暗两半。他递东西的姿势很自然，手臂伸出来的幅度刚好够她接，不需要凑近也不需要伸长。


  她接过碟子和叉子。


  第一叉下去的时候她没怎么用力，只是从蛋糕体边缘撬了一小块，带着一层薄薄的奶油。放进嘴里的瞬间，奶油在舌面上化开了。


  不是烘焙店那种甜到腻人的工业奶油。这个甜度收得很克制，打发的程度也恰好，入口绵密，化得干净，尾调里隐约带着一丝香草的回味。蛋糕体本身松软但不散，咬下去有弹性，鸡蛋和黄油的比例拿捏得刚刚好。


  她愣了一下。


  不是因为好吃。而是因为“好吃“这件事来得太不讲道理了。凌晨一点，迦勒底的公共厨房里，一个刚被召唤出来不到四十八小时的从者，用投影魔术变出一把不伦不类的厨刀，做了一个手工奶油蛋糕，切好端到她房间，味道居然还很好。


  她咽下那口蛋糕。


  “你原来会做饭？“


  Ruler正靠在她对面的墙上，双手抱着胳膊。听到这话，他微微侧了一下头，眉心的肌肉有个短暂的收缩，像是被什么意料之外的东西戳了一下。


  “……你在说什么。你在特异点F待的那几天，不是那边的我做的饭？“


  立香叉着蛋糕的手停了一拍。


  “我以为是希耶尔前辈做的。“


  沉默持续了两秒。


  “好的，御主。“Ruler的声音平得像一面被磨光的镜子。


  他没有追问。没有抱怨。甚至没有任何表情上的波动。但那个“好的“后面拖着的逗号停顿太精准了，精准到立香能听出来——他确实有点受伤。


  “评价一下？“他接着说，语调已经恢复如常。


  立香又叉了一块蛋糕送进嘴里。苹果片咬下去脆生生的，汁水和奶油混在一起，酸甜交替的层次在口腔里散开。她嚼了几下，咽了。


  “很好吃。发现你难得的优点了。“


  “喂喂，对我的评价这么低的？“


  “夜闯女生闺房，难不成还想让我给你什么好评价？“


  她反驳得很快，嘴角有个很细微的弧度。不算笑，但也不是之前那种紧绷着的直线。


  “好吧。“他的肩膀微微一沉，是一个无奈的、收力的动作。“骂了我之后，心情好些了吗？“


  立香低着头看碟子里剩下的蛋糕。奶油已经被室温焐得开始微微软化，边缘处有一道缓慢向外扩散的白色弧线。


  “嗯。有个出气筒确实挺爽的。“


  “这样啊。“


  Ruler的声音拖了一个尾音。那个“啊“字轻飘飘的，像是随口接话，又像是在对自己说。然后他沉默了几秒。


  立香能感觉到他在斟酌措辞。空调的低鸣声填满了两人之间的间隙，墙上的时钟投影显示着01:23，数字的荧绿色光点在灰白色的墙面上安静地闪烁。


  “那么，接下来——“


  他开了口，又断在半句上。'

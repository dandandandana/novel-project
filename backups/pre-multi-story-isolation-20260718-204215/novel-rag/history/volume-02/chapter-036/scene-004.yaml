content: 'Ruler很少这样。在冬木的时候，那个言峰士郎说话几乎从不犹豫。战术判断，即时应对，连安慰人的时候都带着一种训练有素的流畅。但眼前这个版本的他——这个被错误召唤而来的、承载了更多年岁重量的“未来态“——此刻站在立香的房间里，为了下一句话要怎么开口而沉默着。


  不是不知道该说什么。是在想怎么说才不会让她缩回去。


  他深吸了一口气，呼出来的时候，胸腔有一个可以被听见的起伏。


  “你是想要和我说些什么，还是要我给你点褪黑素，或者直接用入眠魔术让你睡着？“


  他的语气很轻，尾音带着懒散的拖腔，像是在说一件不怎么要紧的事。三个选项被并排摆出来，轻重一致，没有暗示哪个更好、哪个更正确。说些什么也行。吃药也行。直接被魔术哄睡也行。


  你自己选。


  立香手里的叉子在碟沿上停了一下。


  她没有抬头。没有回答。把碟子里最后剩下的蛋糕一叉一叉地吃完了。奶油、海绵、苹果片，最后一点碎屑被叉尖刮过瓷面，发出细微的吱声。


  “帮我再切一块。谢谢。“


  Ruler看了她一眼。


  没有追问。也没有再给任何选项。他转身回到桌板前，那把还留在桌上的投影厨刀被重新握起。这次他挑的那一块，表面的奶油明显比刚才那份厚了一层，手工抹面的不规则纹路在断面上留下绵密的旋涡。他把碟子端过来，放到立香伸手就能够到的位置。


  立香接过来。


  新的一块蛋糕搁在碟子里，比第一块大了一圈，奶油几乎要从边沿溢出来。她用叉子抿了一口奶油，然后抬起头。


  “你有给我选吗，Ruler。“


  她看着他的眼睛。声音不重，但每一个字的咬合都很清楚。


  不是质问。也不完全是试探。更像是在确认一个她已经知道答案的事实——你来敲门的时候，就没打算让我自己待着，对吧。你给的三个选项，不管我选哪个，你都会留在这里，对吧。


  Ruler在她视线的另一端站着。黑白配色的休闲衫松松地挂在他身上，脚下的拖鞋踩在合金地板上没有发出一点声响。他的表情没什么变化。那张冷硬的脸上嘴角没有弯，眉毛没有挑，眼睛也没有刻意去传达什么温度。


  但他的身体语言已经说了一切。


  他站的位置。他拿着刀的手势。他切蛋糕时选择的大小和奶油的厚度。从进门到现在，他的每一个举动都在做同一件事。


  “不管你选什么，我都会照做的。“


  他开口。


  “我是你的从者。“


  声调很平。平到像一句被重复了无数次的台词，说的人已经不需要为它注入任何感情，因为这句话本身就是全部。


  从者。


  不是朋友，不是兄长，不是那些需要对等回报的关系。从者。单方面的、不需要理由的、无条件的。你需要出气筒，我是出气筒。你需要蛋糕，我做蛋糕。你需要有人听你说话，我就站在这里。你什么都不想说，我也站在这里。


  立香垂下目光，落在碟子里的蛋糕上。奶油的白和海绵体的浅黄在灯光下温温吞吞地挨在一起，那些粉色和浅绿的糖霜点缀看上去有点笨拙，像第一次学做甜点的人放不准位置但又很认真地在每一处都撒了一些。


  她的嘴唇动了一下。


  很小的幅度。像是要说什么，又没说出来。


  然后她低下头，把叉子插进蛋糕里。'

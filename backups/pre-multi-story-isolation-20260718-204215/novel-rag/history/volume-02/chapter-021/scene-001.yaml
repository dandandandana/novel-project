content: '“天亮了……”立香望着远处天际的微光，轻声呢喃，并未跟随迦勒底的大部队一同行动。此前Archer奉她之命，四处搜寻Berserker的踪迹，却始终一无所获，见状，她便当即让Archer携自己同行，循着Saber与玛修的魔力波动，加急赶往二人所在的战场支援。


  天空中，那枚此前遮蔽天光、散发着诡异气息的异常星星，骤然爆发出刺目到令人无法直视的强光，原本被它死死遮蔽的阳光，顺势冲破层层阴霾，如利剑般刺破漆黑无边的天穹，瞬间驱散了角斗场周遭弥漫已久的压抑与死寂，连地面上粘稠的黑泥，都在阳光的照射下泛起了细微的滋滋声，似在被灼烧一般。


  “看样子，那边已经得手了。”Archer稳稳抱着立香，跳动在高楼的天台边缘，语气沉稳得没有丝毫波澜，他抬眼望向灵长类杀手所在的战场方向，眼神锐利如鹰，“御主不必担心，那位修女希耶尔已然抵达战场，此刻我便前去支援，按既定计划接应她，护她周全。”


  就在此时，立香手腕上佩戴的迦勒底通讯器突然发出“滋滋”的电流声，随即奥尔加玛丽略显急促的声音从中传来，语气里夹杂着难掩的急切与一丝抑制不住的兴奋：“立香！前方探测到极其强烈的从者魔力波动——我们有援军了！Ruler的宝具已经成功破开灵长类杀手的黑泥封锁，战局要反转了！”


  “真的吗？太好了！”立香眼中瞬间闪过明亮的光芒，原本紧绷的肩膀微微舒缓，连日来积压的焦虑与担忧，在这一刻消散了大半，指尖甚至因激动而微微颤抖。


  “御主！”Archer的身形骤然一顿，原本在高楼之间灵活跳跃的动作戛然而止，周身的魔力瞬间紧绷起来。他下意识地将立香紧紧护在身后，高楼上的寒风呼啸而过，卷起他的衣摆，也拂过立香的脸颊，带来阵阵刺骨的凉意，空气中骤然弥漫起一股剑拔弩张的气息。


  “希腊的大英雄，看见我这副灵基，感觉如何？”


  一道极尽戏谑的男声在立香身前不远处响起，语气里满是漫不经心的挑衅，即便这声音的语调与记忆中截然不同，立香的心脏还是骤然一缩，瞬间认出了声音的主人——那是属于言峰士郎的声线，却又带着一种她从未听过的慵懒与冷漠。


  言峰士郎。


  身前这人，身形与言峰士郎有七分相似，却有着截然不同的气场，必定是Alterego。Archer当即举起手中的许德拉长弓，指尖扣住箭矢，语气冰冷如霜，周身杀意渐浓：“窃取神明权能的从者，你打算违背与迦勒底的盟约，倒戈相向？”


  “这话就不对了……”Alterego轻笑出声，语气慵懒得像是在闲聊，他微微耸肩，周身萦绕着淡淡的神性魔力，“虽说我体内寄宿着雅典娜与阿波罗的灵基，可不代表我要被他们的意志束缚，按他们的意愿行事啊——我做什么，全看我乐意。”


  Archer的面色愈发冰冷，周身的魔力波动愈发凌厉，许德拉长弓已被他拉至满弦，箭尖泛着暗绿色的剧毒光晕，直直对准Alterego的心脏，眸中满是毫不掩饰的戒备：“一旦你有半分异动，这柄淬有海德拉剧毒的箭矢，会立刻刺穿你的心脏，让你连重组灵基的机会都没有。”


  “哎呀，我的目标可不是你们。”Alterego笑意不变，语气依旧漫不经心，淡淡提醒道，他抬眼望向灵长类杀手所在的方向，眼神里闪过一丝玩味，“还不快去支援希耶尔？赫拉克勒斯——再晚一步，那位修女可就要撑不住了。”


  “我首要任务，是保证御主的安全，其余诸事，皆可暂缓。”Archer语气坚定，没有丝毫动摇，话音刚落，一道刺眼的阳光骤然倾泻而下，直直照在立香脸上，让她下意识地眯起了眼睛，周遭的魔力也随之发生了剧烈波动。


  “立香！前方探测到极其强烈的灵基波动，远超普通从者！”通讯器中，奥尔加玛丽的声音带着明显的颤抖，既有紧张，也有难以置信的激动，“那波动……能量等级极高，好像是冠位从者！”


  “冠位……”立香喃喃低语，伸手挡住刺眼的阳光，指尖微微用力，勉强睁开眼睛，看清了Archer身前不远处站着的金发少女——那股磅礴的魔力，即便隔着一段距离，也让她感到一阵心悸。


  立香站在少女身后不远处，只能望见她宽大的蓝色长袍——衣摆上绣着繁复的金色纹路，随着魔力流动微微闪烁，缀着银质装饰的裙摆垂落至脚踝，头顶的王冠泛着清冷的光泽，还有那根立在发顶、微微跳动的呆毛，添了几分不易察觉的灵动。'

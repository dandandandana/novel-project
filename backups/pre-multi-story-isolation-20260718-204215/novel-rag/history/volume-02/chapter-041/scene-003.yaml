content: '“第七圣典对使用者的魔力要求很高，正常来说只有希耶尔那个级别的魔力量才撑得起全部形态。“士郎朝玛修点了点头。“但玛修的情况不一样，她和你之间的契约链路可以做中继，部分形态够用了。“


  玛修回了一个点头。动作很小，下巴的幅度只够算得上“动了“。板甲的颈部护片在这个动作中发出了一声轻微的摩擦，银色的金属面罩映出了士郎的半张脸。


  那张脸和特异点F里的Alterego太过相似。五官的轮廓、暗红色短发的走向、下颌线的角度——几乎可以重叠。区别在别的地方：Alterego的表情是慵懒和杀意交替，士郎的表情是一种恒定的、不带攻击性的平静。玛修知道这是两个人。但知道归知道，视觉信号传进大脑的那个瞬间，身体的反应比认知快了半拍。握着步枪的左手收紧了，指节在手套里绷了一下，又松开。


  士郎没有看玛修的手。他转向立香。


  “拿着这个。“


  两杆枪递了过来。


  立香伸手接住。重量落在掌心的瞬间，手腕往下沉了一截——比预想的沉。枪身的尺寸不小，一黑一白，左手那杆的枪身漆黑，右手那杆泛着冷白色的金属光泽。两杆枪的握把贴合掌心的弧度出奇地好，手指合拢上去的时候没有多余的间隙。


  立香把右手那杆白枪翻了个面。枪身的表面刻着密密麻麻的铭文，凹槽里填充着银白色的材料，在希耶尔房间偏暖的灯光下泛出暗哑的反光。铭文的走向从枪管根部一直延伸到握把末端，纹路的排列不是对称的，左侧比右侧密集，收束的方向朝着枪口。


  枪口的位置有东西。


  两道收拢的金属结构贴在枪管两侧，从枪口往后延伸了大约一个掌长的距离，表面同样刻着铭文。折叠的角度很紧凑，不仔细看会以为是枪管的延伸部件。


  立香的拇指碰到了枪身侧面的一个突起。


  啪嚓。


  金属结构从枪口两侧弹开，折叠的关节在展开的过程中发出了连续的机械咬合声。两道刃面从收拢状态完全张开，锁定在枪口前方，形成了一对左右对称的剑刃。刃面的宽度从根部到尖端逐渐收窄，刃缘在灯光下折射出一道锐利的白线。


  枪变成了剑。


  立香举着这把展开了剑刃的白枪，手臂被突然增加的力矩拉得往前倾了一下。剑刃展开后的重心前移了不少，握把的位置从枪械的平衡点变成了偏后的杠杆支点，单手持握需要前臂持续发力才能维持水平。


  “……给我这个？“


  “是。名字叫安魂。“


  “安魂？“立香把展开剑刃的白枪在手里翻了一面，铭文从另一个角度呈现出不同的纹路走向。“好奇怪的名字，听起来像法器。起这个名字的人是个中二病吧。“


  士郎没有接话。


  面对这份突然落下来的安静，立香下意识抬起头。士郎的神色毫无波澜，琥珀色的瞳孔越过了寒暄，只是静静地注视着她手中的双枪。


  那种安静持续了几秒。立香后知后觉地意识到了什么。


  安魂。投影改造。言峰士郎。


  起名字的人就站在面前。


  立香把剑刃收回去的动作突然变得格外小心，拇指重新按住侧面的突起，啪嚓一声，刃面折叠归位。她把两杆枪竖着抱在胸前，枪口朝上。


  “……嗯，安魂，好名字。很有品味。“


  士郎还是没说话。


  “现在是下午五点。“士郎开口了，语序和刚才的沉默之间没有任何过渡。“我会用一个小时带你练习击发和射击。“


  “等等。“


  立香愣了一拍。两杆枪还抱在胸前，枪口朝天，姿势和刚才夸“好名字“的时候一模一样。她的大脑花了两秒把士郎这句话和前面那段沉默拼在一起——吐槽命名中二，被沉默回应，然后直接跳到射击训练。


  这是报复。


  “你还没告诉我这枪到底是干嘛的！“


  “自卫的还能干嘛。“


  士郎已经转身往门口走了。经过希耶尔身边的时候，希耶尔的棒棒糖塑料棍在指间停了一下。士郎的脚步没有减速，迈过门槛，走进走廊。


  立香抱着两杆安魂站在原地。


  玛修肩膀上的芙芙两只耳朵朝着门口的方向转了转，前爪在肩甲上踩了两下，尾巴甩了一圈。


  “前辈，我觉得你应该快点跟上去。“


  “……我知道。“


  立香低头看了一眼怀里的双枪。黑色那杆的枪身上，铭文凹槽里的银白色填充物在灯光下安静地泛着暗光。枪身的金属温度已经被掌心捂热了，握把的弧度贴着手指的轮廓，贴合得没有缝隙。


  她把左脚那只鞋帮压扁的运动鞋在地板上蹬了一下，脚后跟卡进鞋帮里。


  然后抱着枪追了出去。'

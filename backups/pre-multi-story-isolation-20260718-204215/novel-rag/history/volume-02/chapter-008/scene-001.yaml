content: '立香微微一顿，其实她并非没有想过这个问题——只是下意识觉得吉尔伽美什迟迟不来，不过是暂时无法抵达，直到言峰士郎将这层疑问点破，她才恍然回过神。


  “好问题，士郎，你的那个后辈，还在琢磨本王什么时候来吧。”吉尔伽美什的声音从通讯器里传来，“本王依旧是从者，自然需要契约者提供魔力。”


  “只是本王的契约，目前没法转移到你面前的女孩身上，一旦踏入这个特异点，本王就会陷入断魔状态。”


  言峰士郎的脸上浮起几分无奈，语气轻缓地开口：“王……您难道要我指出来……”


  话音还没落下，就被吉尔伽美什匆匆抢了过去。


  “咳咳——本王确实撒谎了。魔力什么的根本无所谓，本王有的是获取魔力的手段。”吉尔伽美什的声音里，难得掺了一丝不易察觉的慌张，语气也比平时急促了些。


  “那为什么？”士郎眉梢微蹙，语气里满是不解，“明明您只要过来，眼前的一切困境都能迎刃而解。”


  吉尔伽美什那边忽然陷入了长久的沉默。立香低头看了眼手腕上的表，又歪了歪头，嘴唇动了动，像是想说什么，最终还是没敢开口。


  “王，是您的千里眼，看到了什么不好的东西吗？”士郎的语气放轻，带着几分小心翼翼的试探。


  “闭嘴，杂修！这么晚了，该休息了。”吉尔伽美什的声音瞬间沉了下来，刻意掩饰着什么，又转向立香，语气带着几分不耐，“还有你，藤丸立香，本王的事听够了就赶紧回屋睡觉！”


  “哦哦哦！”立香被她的语气吓了一跳，连忙应着起身，快步跑回了自己的房间。偌大的房间里，只剩下言峰士郎一个人，他轻轻推开窗户，晚风裹挟着夜色吹进来，他探出头，目光落在天边那颗格外明亮的孤星上。


  “Ruler……”他低声呢喃着这个名字，语气里藏着几分复杂。


  脑海里，不由自主地浮现出那位Ruler在灾厄降临后，对他说过的话语。


  “言峰士郎，做好杀身成仁的准备了吗？哪怕你已经没机会找到属于你的愉悦了。”


  他就那样静静望着漆黑天幕中唯一的光亮，茶色的眼眸缓缓垂下，长长的睫毛在眼下投出一小片浅影。


  【王，你用千里眼看到了。】


  Ruler的话语，又一次在脑海里回响，挥之不去。


  士郎轻轻闭上眼，再睁开时，眼底的迷茫尽数褪去，只剩下坚定，声音轻却清晰：“早就做好准备了……我早就做好，为主献身的准备了。”


  外界御主抵达Saber组据点，已经过去整整一天了。Archer守在屋顶，始终没发现他们有外出的迹象，想来是一直待在教堂里未曾露面。


  【出发前是打算先休整，还是在暗中商量对付我的战术？】Archer垂眸，心底默默思索着。


  片刻后，Archer缓缓抬手，将长弓稳稳架在肩头。


  那柄名为许德拉的黑色长弓，在他手中被毫不费力地拉成满月——凭借着千里眼的加持，他清晰地锁定了那个刚进入攻击范围的身影。


  那是个红发男人，身姿挺拔如松，身着一件白色风衣，衣料下隐隐能窥见黑红色的装甲轮廓，腰间还挂着一柄太刀，气场凌厉。


  “新来的从者？是爱尔兰那边的吗？”Archer低声呢喃，语气里带着几分不易察觉的警惕。


  Caster的死命令如枷锁般刻在脑海，他没有丝毫犹豫，松开弓弦，一箭破空而出。


  可那男人却丝毫没有回避的意思，甚至连脚步都未停顿。黑色箭矢射中他的风衣，竟像撞在坚硬的城墙上一般，瞬间失去力道，毫无作用地落在地上。


  这一箭虽只是试探，却有着A+筋力与神气加持，足以达到B+对城等级，可在这个新来的从者面前，竟如此不堪一击。


  “一击不制敌，便直接动用宝具。”


  Caster曾经的叮嘱在脑海中回响，Archer眼神一沉，心中已然判定，必须动用宝具才能应对。


  Archer的宝具——「射杀百头」。


  他再度拉满那柄狰狞的长弓，黑色箭矢裹挟着凌厉的气息，在弓弦上隐隐震颤，宛若咆哮的游龙。Archer神色沉静，一言不发，指尖骤然松开。


  九道箭矢如驾驭着闪电般疾驰而出，正朝着柳洞寺前进的红发男人微微扭头，瞥了箭矢一眼，低声呢喃了一句，随即拔出了腰间的太刀。


  “砰！咚咚咚——”


  九道箭矢竟被男人仅用四剑便尽数斩落。他抬眸望向屋顶的Archer，两人的目光在半空中交汇，空气中瞬间弥漫开紧绷的张力。


  对视的刹那，Archer心中忽然涌起一股极其古怪的错位感，思绪莫名混乱起来。


  【姐姐？不对……是哥哥？也不是……难道是赫菲斯托斯那个铁匠？】


  这股错位感尚未褪去，Archer便敏锐地捕捉到了来自东方教堂的气息——那股熟悉的魔力，正朝着这边快速靠近。'

content: '“Ruler……”


  希耶尔忽然低低嗤笑一声，抬眼看向Alterego，语气里依旧带着几分冷意，却已没了方才那般浓烈的杀意。


  凯茜帕鲁格围着Alterego缓缓踱步，雪白的鬃毛随动作轻晃，十二只异色瞳孔死死锁着他；Alterego则单手握在刀柄上，身姿慵懒却毫无惧色，迎上它的目光。


  “还不快走？”Alterego薄唇轻启，话音未落便反手拔刀出鞘，刀刃与凯茜帕鲁格的利爪狠狠相撞。


  剧烈的碰撞声轰然炸开，身旁散落的巨石被震得翻滚飞溅。希耶尔与Archer没有半分留恋，转身便朝着东方的教堂疾驰而去。


  “好了，这下只剩我们两个了，灵长类杀手。”Alterego顺势收刀，轻巧地摆脱凯茜帕鲁格的钳制，语气里带着几分戏谑。


  凯茜帕鲁格的十二只眼睛骤然眯起，嘴角竟勾起一抹极其诡异的弧度，像是在笑。


  “喂喂，我就知道，你刚才面对他们俩，连两成实力都没拿出来吧？”Alterego似早有预料，目光落在凯茜帕鲁格洁白鬃毛渗出的黑泥上——那黑泥粘稠得像融化的沥青，流淌速度却快得反常，滴落在地面上发出“滋滋”轻响。


  “哦哦哦哦哦——！”


  凯茜帕鲁格发出尖锐刺耳的笑声，周身瞬间浮现出无数由黑泥凝结的圆球，那些圆球飞速聚拢，织成一张密密麻麻的黑网，泛着冰冷的光泽。


  “刷——！”


  黑网带着破空声朝Alterego席卷而来，原本流动的丝线瞬间硬化如钢铁，划过地面时留下深不见底的裂纹，几乎避无可避。


  可Alterego只是淡淡抬刀，顺势挥出一道凌厉的刀风。


  “咔嚓——”一声脆响，那看似坚不可摧的巨网，竟被这一刀劈得粉碎，黑泥碎屑散落一地。


  “圣杯的黑泥吗……”


  Alterego微微后退半步，双手握刀，神色终于多了几分凝重。


  凯茜帕鲁格后腿猛地蹬地，身形瞬间扑来，与此同时，从天而降的剑雨密密麻麻地扎向它的身躯。


  “陪我玩一会儿吧，灵长类杀手。”


  Alterego的身影不知何时已浮现在凯茜帕鲁格头顶，周身萦绕着淡淡的银白色光晕，无数利剑再度倾泻而下，将凯茜帕鲁格的周身彻底笼罩。


  【果然还是破不了防……它应该也看出来了，我现在只能尽力拖住它。】


  “那么，这个呢~”Alterego语气又恢复了轻佻，掌心忽然燃起一团暖金色的火焰。


  空气中传来清脆的锻造声，一座小巧的铁笼在他掌心快速成型，泛着冰冷的金属光泽。


  【还好早有准备。】


  他随手一抛，小巧的铁笼骤然暴涨，瞬间化作足以覆盖两个街区的巨型角斗场，轰然落地，将凯茜帕鲁格牢牢困在其中。


  凯茜帕鲁格眼中瞬间燃起怒火，显然看穿了这个从者的心思——他竟想凭这种方式囚禁自己。


  它口中瞬间凝聚出银白色光球，一道接一道地朝着Alterego射去，却尽数被他身前一面碎片拼成的菱形面罩挡下。巨响过后，周遭的大厦被角斗场的余波震得轰然倒塌，烟尘弥漫。


  “该说不说，火神的职阶技能还挺好用。”Alterego一边低声嘟囔，一边缓缓落在角斗场边缘。


  “好了，这下你想出去可就难咯——要不要考虑先把我杀了？”


  藤丸立香背着言峰士郎一路奔到东方的教堂，即便有礼装的增幅，四肢也早已被沉重的力道压得发酸发沉，连呼吸都带着几分急促的灼热。等Saber安置好玛修，她小心翼翼地将士郎扶进他的房间，随后才拖着疲惫的身子，气喘吁吁地瘫坐在客厅的桌边。


  “你们……回来了？”伊莉雅从房间里走出来，额头有道显眼的伤口，暗红的血渍顺着脸颊滑落，在白皙的皮肤上留下一道狼狈的印记。她望着眼前两人，嘴角勉强扯出一个虚弱的微笑。


  “伊莉雅？！你怎么了？”立香连忙快步迎上去，语气里满是慌张。伊莉雅却轻轻摆了摆手，声音轻得像羽毛：“别在意……刚才出现了幻觉，只觉得浑身痛不欲生，恨不得一死了之。我没言峰那么坚韧的心智，硬生生撞墙痛晕过去了。”


  “啊……”立香连忙翻出医疗箱，指尖轻柔地为伊莉雅擦拭伤口、上药，动作谨慎得生怕弄疼她。


  “Saber，你知道那只怪物是什么吗？”给伊莉雅包扎好后，立香转头看向一旁的圣女，语气里满是急切。


  “不清楚。”Saber遗憾地摇了摇头，神色凝重，“我只知道，它是这一切灾厄的源头。”


  “是灵长类杀手。”腕表里突然传来奥尔加玛丽的声音，带着难以掩饰的惊愕，“见鬼，它怎么会出现在冬木！”


  “不必多想，所长。”吉尔伽美什的声音紧随其后，褪去了往日的慵懒，多了几分难得的严肃，“它第一次现身就是在冬木，还没来得及显现兽的权能，就被埋葬机关回收了。”'

content: '检测室在迦勒底B区的尽头。


  房间不大，长边八米，短边五米。灯管嵌在天花板的凹槽里，发出均匀的冷白色光线，和走廊一样的色温，区别在于这里更亮——达芬奇把亮度调到了最高档，理由是“灵基扫描仪的光谱校准需要无干扰的照明环境“。


  三面墙壁是迦勒底标准的哑光合金材质，第四面——正对着门的那面被一整块嵌入式显示屏覆盖。


  屏幕当前亮着，分成了四个窗口，每个窗口里跑着不同颜色的数据流。左上角的窗口显示心率曲线，绿色的折线在七十二到七十八之间规律跳动。右上角是脑波图谱，蓝色和橙色的波段交替推进。下方两个窗口被达芬奇锁定了，灰底白字显示“权限待解锁“。


  立香坐在检测台上。检测台是合金与软垫的组合结构，高度到普通人膝盖，表面铺着一层白色的医用垫布。她的腿悬在台沿下方，两只脚交替晃荡。


  达芬奇坐在检测台对面的旋转椅上，记录板搁在膝盖上，笔帽叼在嘴里。奥尔加玛丽站在显示屏旁边，双臂交叉抱在胸前。


  达芬奇把笔帽从嘴里拿下来，扣回笔杆。记录板上的数据和屏幕上的曲线对照了三轮，她把记录板翻到最后一页，点了两下左下角的汇总键。


  “立香，恢复得比我预估的好太多了。高压和轻度PTSD，其他数据没有出现异常波动。“


  “这样就好。“奥尔加玛丽的双臂从胸前放下来，右手去扶显示屏旁边的金属把手，手指在把手上收紧又松开。“原本做了最坏的打算。“


  “没那么脆弱。“立香的脚停了一组摆动，“达芬奇亲，刚才你们提到的盖提亚——那是最后要对付的？“


  达芬奇把记录板合上，搁在旁边的器械台面上。记录板的金属外壳和台面碰出一声轻响。


  “目前推断的终端目标。人理烧却式的发动者，几乎不存在其他可能性了。“达芬奇顿了顿。“不过2017这个节点还有很大的空白。按照烧却式的逻辑，它不应该被保留下来。“


  立香把两只手撑在检测台的台沿上，手掌按着白色垫布的边缘。


  “人理烧却式。盖提亚。还有毁掉现在这个世界的人。“


  她把这三组词依次念出来，停在第三组上。


  “我会打赢的。两个都打。“


  检测室里安静了一拍。


  奥尔加玛丽转过身去面对达芬奇，后背挡住了屏幕左上角的心率窗口。她弯下腰，一只手挡在嘴侧，凑到达芬奇耳边。


  “要不要重新跑一遍扫描？“


  达芬奇歪了一下头，手指在合上的记录板外壳上敲了两下。


  “我觉得确实可以考虑……“


  “等一下。“立香从检测台上滑下来，双脚落地的声音在房间里弹了一响，“说几句有决心的话就要重新做检查吗？“


  她两只手在身前快速摆了两下，手掌朝前，手指并拢。


  “我只是表一下决心。毕竟……这两天被照顾成这样了。“


  “立香。“


  奥尔加玛丽直起身来，从达芬奇旁边走到立香面前。所长的步子不大，三步走完的距离只有两米出头。她在立香面前站定。


  “你有没有意识到你说的''打赢''是什么规模的事？“


  藤丸立香的肩膀收了一下。


  “会死。这个我知道。“


  她没有退后。


  “冬木的时候就差点死了，不管是刚刚坠入特异点的时候，还是之面Alterego的时候。“


  “所以——“


  她把两只手背到身后，手指在腰后交叉扣住。


  “出发之前给我做顿好吃的吧。打赢了回来再做一顿。“


  奥尔加玛丽的手臂重新交叉到胸前。


  “就这样？“


  “就这样。别的时候正常就行了，天天大鱼大肉我也扛不住。“立香伸了一下舌头。“迦勒底的库存能撑多久？“


  “别提了。除了食物和能源，其他的……“奥尔加玛丽把交叠的手臂又收紧了一点。“照目前的消耗速度，不考虑补给的话——“


  三声敲门打断了她。


  节奏均匀，力度不重不轻，指节叩击在合金门板上的声音被门缝过滤掉了高频，只留下了闷沉的“笃、笃、笃“。


  奥尔加玛丽走到门前拉开门。


  言峰士郎站在走廊里。粉色围裙已经脱了，换成了出现在检测室门口这个场景里更合理的便装——不过衬衫的袖口卷到了小臂中段，左手前臂内侧有一道浅色的烫痕，是新的，表皮还泛着粉红色，大概是灶台上溅的油。


  “检测做完了？“


  达芬奇在立香身后点了一下头。


  士郎跨进检测室。门在他身后没有关——走廊里循环系统的底噪从门洞涌进来，给检测室原本封闭的声场加了一层低频的铺底。他靠在门框上，右肩抵着金属边沿，两只手插在裤子口袋里。


  “有个坏消息，有个好消息。“


  立香转过身来面对门口。检测台在她和士郎之间，白色垫布上的凹陷已经回弹了大半。


  “坏消息多坏？“


  “对现在的局面来说——在已经够糟的基础上再加一笔。“


  “先听坏的。“'

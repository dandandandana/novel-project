content: '士郎的手合拢，把手链收进掌心。他抬起另一只手，朝检测室里晃了一下——五根手指张开，从左往右划了一个半弧，是那种不正式的、省力的道别动作。


  他转身走出检测室。衬衫的后襟从门框边缘滑过去，走廊的灯光把他的影子拉长在地板上，一步一步朝宿舍区的方向缩短。脚步声在合金地板上踩出稳定的间距，不快不慢。


  检测室的门没有关。达芬奇从旋转椅上站起来，走到门边，把门推上了。走廊的底噪被隔断，检测室重新回到了只有设备运转声的封闭状态。


  “达芬奇亲。“


  达芬奇转过身。立香站在检测台旁边，右手还搭在台沿上。


  “Alterego的数据能不能也给我一份？我想先看一遍，开会的时候能跟上节奏。“


  “当然可以呀。“达芬奇拿起记录板，在上面点了几下。“吉尔伽美什那边你下午还要去训练对吧？我把数据先发到你的手环上，路上可以看。“


  “嗯。“


  立香从检测台旁边走开，朝门口走了三步。


  “所长。“


  奥尔加玛丽还站在门边，双手插在白大褂的口袋里。


  “谢谢。“


  奥尔加玛丽的手在口袋里动了一下。


  “谢什么，这是我的工作。“


  “嗯，我知道。“


  午饭是咖喱。


  士郎做的那锅咖喱在厨房的灶台上放了一上午，洋葱丁煮透了，和牛肉融在一起，土豆块也煮得酥软，筷子戳进去不用使力就能断成两截。立香盛了一碗米饭，浇了两勺咖喱，坐在餐厅的长桌前吃完了。碗底的酱汁都刮干净了，她把碗和勺子放进水槽里泡上，没洗——士郎被赶去睡觉了，这个活儿是他来干。


  回到宿舍的时候是一点二十。


  午睡只睡了四十分钟。枕头上残留着早上起床时压出的褶皱，脸颊贴上去的温度和布料的温度之间有短暂的温差，凉的那一层很快被体温覆盖。立香翻了一次身，面朝墙壁，她揉了揉脑袋闭上了眼睛。再睁开的时候手环上的时间显示14:02。


  立香把昨晚上留下来的汽水端起来喝了一口，没有气的汽水只剩下青桔的酸味和代糖的回甘。她把杯子放回去，从床上坐起来。


  训练在宿舍里做。


  房间不大，但床和桌子之间有两米左右的空地，够站一个人伸开手臂。立香把桌上的东西推到角落——手环充电座、一瓶没开封的矿泉水、达芬奇发过来的Alterego战斗数据终端，叠在一起靠着墙壁立住。她站在空地中央，双脚分开与肩同宽，两只手垂在身体两侧，开始调整呼吸。


  同调练习从指尖开始。


  立香抬起右手，掌心朝上。魔术回路启动的感觉是从脊椎底端开始的一股热流，沿着神经末梢蔓延到手指尖端。回路的数量不多——吉尔伽美什第一次检测的时候说了一个数字，立香记得那个数字，也记得吉尔伽美什说完之后沉默了三秒。三秒之后吉尔伽美什说的是


  “够了“。


  指尖的热感稳定下来。立香从桌角拿过那瓶矿泉水，拧开盖子，倒了小半杯在桌上的白色马克杯里。水在杯底晃了两下，静下来。她把手掌覆在杯口上方，掌心距离水面大约五厘米，开始输出魔力。


  同调。感知杯体的结构，玻璃的密度、水的温度、杯壁的厚度。信息从掌心的魔力场反馈回来，在脑中形成一组参数。


  强化。把魔力灌进杯体的分子间隙，让玻璃的硬度和韧性同时上升。杯壁在魔力注入的瞬间发出了一声极轻的“叮“，频率比正常的玻璃震动高了半个音阶。


  立香刚要把手移开，准备切换到治愈系——


  “笃笃笃”


  指节落在合金门板上，节奏不紧不慢。力度轻，但存在感很强


  “请进。“


  门开了。吉尔伽美什跨过门槛，右脚进来之后左脚顺势往回一带，脚跟撞上门板的下沿，门合上了。金发从肩膀上滑下来一缕，垂在锁骨前方。


  立香站在房间中央，右手还悬在马克杯上方。


  “立香，本王今天教你新的魔术。“


  吉尔伽美什走到床沿坐下，她把右腿搭上左腿，脚尖朝着天花板的方向晃了一下。


  立香的手从马克杯上方缩回来。


  “哈？吉尔茜，我以为你把这件事忘了。你上次说''到了时候本王自然会教你''的时候我算了一下日子，那是三年零七个月之前。“


  “本王记得每一天。“


  “……所以是故意拖的。“


  “当然要考试的。“吉尔伽美什的脚尖停止晃动。“你在特异点F的表现，本王都看过达芬奇的记录了，连续用了接近二十次治愈魔术，够了。“


  “和出色沾不上边吧。“立香把手插进运动裤的口袋里。“玛修差点死在那里，士郎真的死了一次，我自己也被打得半死不活，最后还是靠别人的命堆出来的结果。“


  “合格的标准从来不是''没人受伤''。“吉尔伽美什的脚重新搭回去， “人会死。但你让该活的人活下来了。“


  立香没有接这句话。


  她把两只手从口袋里抽出来，左手五指张开又握拢，关节活动了一轮。'

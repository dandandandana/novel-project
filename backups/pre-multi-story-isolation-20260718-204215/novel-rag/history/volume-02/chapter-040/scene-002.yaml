content: '士郎的肩膀从门框上离开，站直了。右手从口袋里抽出来，手指在裤线上蹭了一下。


  “2017年没有被烧掉的原因，基本锁定了。保下这个年份的人，和毁掉现实世界的人，大概率是同一个。“


  他停了一下。


  “神琦灰。“


  三个字落在检测室的白光和嗡鸣里。屏幕右上角的脑波图谱跳了一组高频振荡，蓝色波段被橙色压下去了两秒，又回来了。


  立香看着站在门口的士郎。她点了点头，幅度不大。


  “敌人确定了。“


  她把背在身后的双手解开，垂回身体两侧。


  “毁灭世界级别的对手……压力确实上来了。“肩膀朝两边微微撑了一下，“不过说到底，我连魔术回路都没几条，让我单打独斗本来就不现实。“


  她偏过头，偏的角度刚好让检测台不挡住她和士郎之间的视线。


  “要靠你了，Ruler。“


  “面对这种级别的威胁能不崩溃，已经甩开大部分魔术师了。“


  士郎的手重新插回口袋。


  “神琦灰的档案走不了正规渠道，全都是绝密中的绝密。只能靠我自己的记忆重建。不过这件事不急——排在伦敦之后。“


  “那好消息呢？“


  士郎的身体重心从右脚换到了左脚。门框旁边的走廊灯光从他背后照进来，在检测室的地板上投了一条长影。


  “迦勒底的飞机跑道修好了。飞机也修好了。“


  他说这句话的语气和刚才报坏消息的时候没有区别。


  检测室里没有人说话。


  “顺便把B区到D区的照明线路也整了一遍，C区走廊的通风管道换了两段接口，后勤仓库的冷藏柜压缩机重新接了线。“


  士郎补了一句。


  “不提也行。“


  沉默又持续了三秒。


  “……同调A++++。“士郎的右手从口袋里抽出来，掌心朝上摊了一下，做了一个“就是这样“的手势。“又不是没修过。“


  奥尔加玛丽的手从门把上滑下来。


  “Ruler，你生前到底是干什么的？维修工？“


  “顺手而已。“


  士郎把那只摊开的手收回口袋，换了一个姿势靠回门框。这次是左肩抵着金属边沿。衬衫袖口卷起来的那截小臂上，灶台烫痕旁边又多了一道灰色的蹭痕——大概是钻进设备底部检修线路时蹭到的。


  “御主，接下来怎么安排？“


  立香双手交叉抱在胸前——和奥尔加玛丽刚才的姿势一样，但手臂的力度松得多，更像是在兜着自己。


  “开个会吧？情报汇总一下，然后定出发的日程。“


  “我需要时间把神琦灰的资料整理出来。另外特异点F里那个Alterego的档案——迦勒底这边应该有记录，麻烦发一份到我的终端。“


  “嗯嗯。“达芬奇从旋转椅上坐直了，伸手去够器械台上的记录板。“Alterego的战斗数据和灵基残留我这里都有备份，一会就发。“


  奥尔加玛丽松开交叠在胸前的手臂，右手食指在空气中点了两下——点到第二下的时候停住了。


  “等一下，Ruler。你是不是连手环都还没有？“


  她的食指从空中收回来，转而去捏自己左手腕上的手链。


  “……而且你昨天是不是跟我说过你没法灵体化，需要一个独立的房间？“


  “所长终于想起来了。“士郎歪了一下头。“是，这具身体是错误召唤的产物，和普通从者不一样。吃饭、睡觉、洗澡，一样都不能省。“


  “昨天就说了来着！“奥尔加玛丽的手从腕链上松开，双手掐住了腰。“房间……我昨天忘了安排。“


  “理解，事情太多了嘛。“士郎从门框上站直，肩膀发出了一声微弱的关节响。“反正我昨晚也没闲着——修设施的间隙顺便把餐厅全包了，吃饭的问题已经解决。“


  “所以你从昨天到现在一共睡了多久？“立香问道。


  士郎把目光转开了。


  “……睡了。“


  “多久。“


  “技术上来说，在厨房灶台前靠着墙打了十五分钟的盹算不算。“


  奥尔加玛丽的双手从腰上移开。她从白大褂的口袋里掏出了一条手链式的通讯终端——银色的链节之间嵌着迦勒底徽章的蓝色微型投影仪，和她自己手腕上戴的是同一型号。她把那条手链朝士郎递过去。


  “房间安排在御主对面。B区宿舍左侧第三间。“


  士郎伸手接住手链。银色链节搭在他的掌心里，蓝色投影仪的棱面折射了一点检测室的白光。


  “现在去睡觉。“


  “午饭——“


  “午饭是咖喱对吧，你在厨房做好了。“奥尔加玛丽挥了一下手，手背朝外，做出赶人的动作。“热一下就行。不需要你亲自盯。“


  “去休息吧士郎。“立香把交叉在胸前的手臂放下来，右手按了一下太阳穴。“身为我的从者好歹维持一个正常的作息。你现在这个状态去打伦敦，我怕你在路上就先倒了。“


  “放心，我的体能不至于——“


  “去。“


  立香和奥尔加玛丽同时开口。'

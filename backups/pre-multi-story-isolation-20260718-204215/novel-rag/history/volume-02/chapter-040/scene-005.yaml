content: '每一片碎片都有结构，每一个结构都在同时分裂，每一次分裂都产生新的碎片，新的碎片立刻进入下一轮分裂。信息量的增长不是线性的。立香的脑子在第四轮碎裂的时候开始发烫，太阳穴两侧的血管跳动加速，颅骨内侧的压迫感从后脑勺蔓延到了前额。


  “这些碎片在碎裂的同时会散开，会飞，会离开你的脑子。不用管它们去哪里，让它们走。“


  吉尔伽美什的声音从某个方向传来。立香已经分不清方向了——脑中的碎片数量突破了可计数的范围，每一帧思维都在被占满。碎片在脑内空间里四散奔逃，撞击脑壁，穿透脑壁，向外逃逸。逃逸的感觉是真实的——太阳穴两侧的胀痛变成了一种外扩的撕裂感，颅骨的边界在被从内侧推开。


  胸口闷了起来。


  礼装的振动频率加快了，从错开半拍变成了错开四分之一拍，和心脏的节奏几乎同步。胸骨后方的那种振动感变成了挤压感，胸腔的容积在缩小，肺叶的扩张空间被压缩，每一次呼吸只能吸进平时三分之二的气量。


  口腔里涌上来一股腥甜。铁锈的味道铺在舌面上，牙龈和两颊内侧的黏膜同时渗出了带着咸味的液体。立香咬住了下唇内侧的肉，把那股腥甜压回去。


  “最后一步。把魔力送到杯子上。“


  手指在哪里。


  立香分辨了两秒。身体的感知系统在脑部过载的冲击下开始模糊，手臂的位置信息延迟了将近一秒才传回来——右手还悬在马克杯上方，手指张着，指尖的魔力还在。但手臂已经开始发软了，肌肉的控制精度在下降，手掌的高度在降低，手指的张开角度也在缩小。


  立香把最后一股力气集中在右肩。肩膀的肌肉绷紧，带动上臂维持住角度，前臂和手掌靠惯性往下沉，指尖的魔力在空中拉出了一条肉眼不可见的传输路径——


  魔力在马克杯的一边产生效果。


  杯中的水没有飞溅。杯壁没有碎裂。没有声音。


  马克杯在原地蒸发了。


  立香的手垂了下去。


  膝盖先弯了。身体重心后移，脊椎失去了维持直立的张力，肩膀朝后倾倒。头部的血液涌了上来，视野的边缘开始收缩，光线从白色变成灰色，灰色变成黑色，黑色从四周朝中心推进。最后一帧画面是天花板上的灯管——白色的冷光，长条形，嵌在凹槽里。然后灯管也消失了。


  脊背没有撞上地板。


  吉尔伽美什的手臂从立香的背后穿过去，掌心托住了后脑勺和肩胛骨之间的那段脊椎。


  立香的身体靠在吉尔伽美什的手臂上，头朝后仰着，脸上的血色过浓，两颊泛出了不正常的潮红，额头上沁出了细密的汗珠。眼睛闭着。呼吸浅而快，胸腔起伏的幅度很小，每一次吸气都带着喉咙深处的细微杂音。


  地板上，马克杯原来的位置空空荡荡。


  吉尔伽美什把立香打横抱起来。


  起身的动作没有犹豫。英灵的体能对于承载一个人类少女的体重毫无负担，立香的重量在吉尔伽美什的臂弯里只是一个温热的、微微发抖的存在。


  吉尔伽美什嘴角勾起一抹弧度，随后她朝着医务室走去。'

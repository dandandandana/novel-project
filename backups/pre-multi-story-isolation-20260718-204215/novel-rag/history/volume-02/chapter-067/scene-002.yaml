content: '“所努力的这些，以后万一能用上呢？”


  “这样啊，反正是为了你自己嘛~”


  【不是这样的】


  立香从这份梦里感受到了不对


  她总算是感受到了极大的违和感。


  言峰士郎所做的一切都与自己无关，他所做的一切


  不是为了自己。


  【这样吗？】


  所谓的自己的愉悦


  却与自己无关吗？


  【你到底在寻找什么？】


  立香的脑海里再度闪过了画面


  【你所寻找的，不会是？】


  【他人的幸福和快乐吧！】


  不对的不对的


  人应该为了自己而活，这是所有人都知道的道理吧。


  为什么为什么？！


  【为什么？】


  立香想着，缓缓的睁开了双眼，她看向窗外，飘扬着的云朵宣告着她已经在空中飞了一段时间了。


  在解决完哈迪斯之后，冥界之雨停息了以后，士郎和吉尔伽美什确定了朱月已经不在英国了之后，众人搜刮完计时塔和埋葬机关仅剩的资源，去往已经几乎被战斗余波彻底波及到的机场，搭乘飞机离开了伦敦。


  “前辈？”


  玛修端着一杯水过来，递给了立香。


  “啊，谢谢你玛修。”


  立香抿了一口，“到了吗？”


  “马上就到了，前辈，Ruler前辈飞的很好，就是........”玛修欲言又止。


  “怎么了？对了，士郎之前烤的曲奇呢？”


  “就是.......甜品被爱尔奎特小姐和伊什塔尔小姐以及雅典娜女士在你睡觉的时候吃完了！”


  “什么？！那可是士郎特意烤的！”'

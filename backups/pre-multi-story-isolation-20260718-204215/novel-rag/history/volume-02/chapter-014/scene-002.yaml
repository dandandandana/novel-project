content: '立香捏着下巴，若有所思地说道：“这么说来，我们现在的问题，就是要找到Ruler的具体情报，还有他留下的后手，对吗？”


  “很遗憾，我们对Ruler，几乎一无所知。”伊莉雅轻声开口，语气里带着几分无奈——她自始至终，都没能感知到Ruler的具体气息。


  “一无所知啊……”希耶尔重重叹了口气，语气里满是烦躁，“那个混账Alterego，明明什么都知道，却只肯透露一星半点。”


  立香听完，默默走到一旁坐下，脸上满是失落：“到最后，还是一筹莫展吗？说到底，我好像也没能帮上什么忙。”她无奈地摇了摇头，勉强挤出一个笑容，起身说道，“我去看一眼言峰，你们继续讨论吧。”


  说着，立香转身，脚步轻轻朝着言峰士郎的房间走去。


  少年的眼前，是浓稠得化不开的灰色迷雾，远处的天边被烙得赤红，像燃尽的余烬，透着令人窒息的压抑。


  【又回到了这个地方……这是那个家伙的精神污染吗？】


  他咬着牙强撑着站起身，漫无目的地在迷雾中前行，眼前的烟尘模糊了一切，可他却像刻在骨子里般，清楚地知道前行的方向。他甚至清楚地知道，自己会在何处力竭，会在何处倒下。


  耳边不断传来此起彼伏的哀嚎与呼救，尖锐又绝望，每一声都像针一样扎在他的心上。他比谁都清楚，自己救不了这些人，哪怕拼尽全力，最终也只会一无所获。


  可他不能停下。


  小时候经历这场大火时，他只能捂着耳朵狼狈逃窜，最后无力地倒在地上，看着一切化为灰烬。但现在，他无法再无视这些声音——不只是因为他的信条，更因为心底有一股莫名的力量，驱使着他一步步往前走。


  他伸出手，在废墟中漫无目的地挖掘着，指尖被碎石划破也浑然不觉，心底只有一个念头：找到一个人，哪怕只有一个人也好。


  然而，终究是一无所获。


  正如他早已预料到的那样，他不可能从这片废墟里救下任何人。他缓缓直起身，拖着疲惫的身躯继续前行，直到彻底力竭，像往常无数次梦境里那样，重重倒在地上。


  意识渐渐模糊之际，他心底不由得生出一丝希冀——按照以往的梦境，接下来，他的母亲，那位身着黄金铠甲、手持圆柱状长剑的吉尔伽美什，会来接他。他多想再见到她一面，再叫她一声“母亲”。


  可朝他走来的，却不是那个金光闪闪、意气风发的王。


  那道身影面色紫黑，胸口被长枪贯穿，腹部还留着黑色箭矢洞穿的伤口，鲜血顺着伤口不断滴落的身影，是他从未见过的英雄王的姿态。


  【什……什么？】


  “不……不要……”少年的声音颤抖着，泪水不受控制地涌出眼眶，他不顾一切的站起身，接住眼前摇摇欲坠的王。


  “母亲……母亲……”他一点一点感受着吉尔伽美什的气息消失，如同千刀万剐一般痛苦。


  【主……这是你给我的惩罚吗？惩罚我的无能，惩罚我没能保护好她……】


  记忆瞬间翻涌，他仿佛又回到了吉尔伽美什陨落的那一天，那种无能为力的绝望，再次将他彻底淹没。


  悲伤还没来得及蔓延，眼前的光景便骤然切换。他站在了一户人家的玄关前，温馨的装修，厨房飘来的饭菜香气，还有卧室里一家人其乐融融的笑声，一切都显得那么美好。


  可下一秒，窗户玻璃便发出不堪重负的悲鸣，“咔嚓”一声彻底碎裂。


  “劈里啪啦——！”


  言峰士郎瞬间反应过来——这是灵长类杀手的怒吼带来的精神污染。


  他疯了似的朝着屋内扑去，想要捂住那家人的耳朵，想要施展高阶精神豁免魔术，可无论他怎么做，都没有丝毫用处。


  他只能眼睁睁地看着，那一家人在精神污染的折磨下渐渐疯癫，互相撕扯、尝试自杀，凄厉的哀嚎响彻全屋，最后一个个倒在他面前，没了气息。


  光景再度轮转，没有丝毫停顿。


  又是一户人家，接着是餐厅里的顾客与服务员、后厨的厨师，学校里的学生与老师，医院里的医生与病人……几乎所有冬木的人，都在他眼前一一死去。


  他蜷缩在地上，身子控制不住地痉挛，胃里翻江倒海，忍不住干呕起来：“呕……啊哈……”


  就在这时，一道愉悦又熟悉的声线，在他耳边缓缓响起：“士郎，你还是不懂啊。”


  即便精神状态早已濒临崩溃，言峰士郎也瞬间认出了这个声音——是他的养父，言峰绮礼。


  “父……父亲？你怎么会在这里……”他的声音沙哑，带着难以掩饰的虚弱。


  言峰绮礼缓缓走到他面前，脸上挂着极度愉悦的笑容，慢悠悠地开口：“我来告诉你，你向圣杯许下的愿望，答案是什么。”


  他微微俯身，凑近言峰士郎的耳边，一字一句说道：“你对圣杯的愿望，是找到你所期望的愉悦，对不对？”'

content: '“想笑就笑吧，吉尔伽美什。“他开口了。声音平稳，只是尾音沾上了一层薄薄的沙哑。


  “哼……“吉尔伽美什将视线投向了天花板上那排冷白色的照明灯，像是在用那些刺目的光芒清洗自己眼底的某种柔软，“你百年难得一遇的郁闷表情，确实令本王喜悦。“


  她顿了顿。


  “但是你伤心的样子，令本王不满。“


  这句话说出口的时候，吉尔伽美什的声音里没有了嘲弄，没有了居高临下，甚至没有了她惯常使用的那种王者的威压。它只是一句极其朴素的、从一个母亲的口中流淌出来的真实感受。


  “为什么……“Ruler的嘴唇微动。这两个字刚刚溢出唇齿之间，他就猛然咬住了下唇，将后半截话硬生生地吞了回去。


  为什么不告诉我。


  他没有说出口，但在场的每一个人都听到了那句被沉默吞噬的质问。


  “你在千年城。“吉尔伽美什幽幽地开口，目光从灯光上收回，落在Ruler那微微低垂的侧脸上，“我怎么告诉你？“


  沉默。


  漫长的、沉重的、像铅一样浇灌在空气中的沉默。


  “你这辈子过得太顺了。“吉尔伽美什轻声说道。那声音轻得像是叹息，又硬得像是训诫。


  “正好给你一个教训，言峰士郎。“


  Ruler没有回答。他缓缓闭上了眼睛，睫毛在冷白灯光下投射出两道细窄的阴影。


  就在这片沉默即将凝结成不可触碰的冰层时，希耶尔开口了。


  “你们两个的母子情深叙完了吧。“


  她的声音沙哑而冷静，像一柄精准的手术刀，干净利落地切开了测试室内凝滞的哀伤。她向前迈了一步，苍白的面庞上没有丝毫同情或感伤，只有一种属于埋葬机关第七位的、纯粹的职业本能。


  她的蓝色眼眸从吉尔伽美什身上扫过，又从Ruler身上扫过，最终锁定在了两人之间那片看不见的情感真空地带。


  “那么，谁来给我解释一下——“


  她的语速不快，但每一个字都像钉子一样楔入了在场所有人的耳膜。


  “这四年间，一直在埋葬机关活动的那个''神琦灰''，到底是谁？“'

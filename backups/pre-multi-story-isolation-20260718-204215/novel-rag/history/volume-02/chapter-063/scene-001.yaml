content: '楼梯的台阶在立香的靴底下一级一级地往下沉。铁锈的腥味从扶手上渗出来，她的手掌在扶手的漆面上拖过去留下一道浅浅的手汗印子。魔力的感知在进入埋葬机关不久之后就被压进了一层看不见的棉花里，她的令咒在手背上安静得不像话。这种感觉很不习惯——自从和士郎定了契约之后他就一直挂在她意识的某个角落，像一个随时可以拨出去的号码。现在那个号码突然不在服务区了。


  “Ruler？”


  她的声音从楼梯井里往上抛，撞到天花板上弹回来已经散了形。


  “言峰士郎！你在哪？”


  没有人回答。她咬着牙往上迈了一步，腮帮子在牙齿咬合的时候鼓起来又塌下去。“这个家伙……”


  她爬上二楼。


  二楼的门被整个翻开了。那扇本来应该固定在门框上的铁门被从铰链上卸下来搁在旁边，门板上还贴着几张被撕了一半的封条。长椅上坐着一个人。金色的长发从椅背上垂下来，末梢堪堪扫到石板地面上一道浅缝。爱尔奎特转过脸来，眼睛在微光里红得像是两块收在玻璃后面的宝石，她举起一只手指朝立香摇了摇，指尖在空气里划出一道浅浅的弧。


  “立香来了？”


  “爱尔奎特小姐？”立香在楼梯口站住了。“你不是在和士郎搜寻东西吗？”


  “嗯？没找到啊。找遍了这里之后没找到，没办法只好在这里坐着了。”爱尔奎特把一条腿蜷起来搁在长椅上，下巴搁在膝盖上，红瞳从下往上看着立香。“算了，我也不是不能直接进入千年城就是了。那个钥匙丢了就丢了。”


  立香挠了挠后脑勺，手指插进橘色头发里来回抓了两下。无论听多少遍她都搞不懂真祖的脑回路。“那士郎呢？”


  “他啊。”爱尔奎特用食指戳了戳自己的脸颊，指头在腮帮子上戳进去一个浅浅的小窝。“还在翻什么资料——大概在最里面的那个房间吧。”


  立香的靴跟磕在走廊的石板地上，每走一步都能看见两旁房间里的情况。门都被推开到了同一个角度，像是有一把看不见的尺子量过。房间里没有被翻倒的桌椅，没有被砸开的抽屉——只是所有的文件夹都被抽了出来，一本一本搁在桌子上。桌面上排着几叠整齐的纸堆，每叠的角度都差不多。房间里的灰尘被搅起来过，但已经落回了原位。


  她走过第四间房的时候停了一拍。桌面上摊着一本翻开的档案簿，页面上的墨水字在灰蒙蒙的晨光里已经褪得有些发白。她把视线收回来继续往里走。在走廊的最深处有一扇门半掩着，门缝里漏出来一道暖黄色的光——不是灯，是投影魔术施放时残留的蓝色荧光。


  言峰士郎推开门走出来。他看见立香的时候脚步顿了一下，手里的文件夹还没合上，琥珀色的瞳孔在走廊昏暗的光线里聚焦到她脸上。


  “御主？”


  “啊，找到你了。”立香把两条手臂往胸前一抱，左手的指尖在右臂上轻轻敲了两下。“你在干什么？”


  士郎把手里的文件夹递给她。纸页在交接的时候被扯了一下发出干燥的摩擦声，夹着纸张的铁丝夹子硌在她拇指上凉凉的。“资料。关于我妈的。”


  立香的手指在文件夹上停住了。她把文件夹打开扫了一眼，抬头看他的时候嘴唇推出来两个模糊的字形才把声音放出来。“啊……你去找这个了。”


  “嗯，你说要的。”士郎说着把手探进怀里，摸出另一份文件翻开。纸页在他手指间一页一页地翻过去，翻到某一页的时候停了。“还有关于玛修那个武装的——刚才她拿回来的那个。”


  “嗯？你还去找这个了？”立香歪着头看着士郎手里的文件。纸页上画着几幅机械构造的剖图，黑匣子被从中间剖开露出了里面一层又一层的齿轮和魔术回路。“那个是……变形武器对吧。”


  “对的。”士郎把文件的纸张翻过来让她看。“你玩过怪物猎人吗？”


  “你指的是……四人打龙的那个？”立香把眉毛提了起来，她的眼睛在昏暗里亮了一拍。“我没记错的话3DS上是有的，新作预告——明年一八年才发布来着。怎么了。”


  士郎点了点头。“盾斧是里面的武器。”


  “这种武器埋葬机关会想做……”立香把文件接过来翻了两页，眉头的褶子越皱越深。“这怎么看怎么不方便啊！单纯是为了帅才做出来的吧。”


  “好不好用要看玛修。她是战士，而你是从者。”士郎不紧不慢地说道，他把那页画着剖图的纸从立香手里拿回来折好塞进文件里。“接下来要做什么？”


  “收集资源，然后回迦勒底。至于二号基地——要解决朱月和哈迪斯，需要从长计议。”立香的语气在提到那两个字的时候硬了一瞬。


  “嗯。”士郎点了点头，他把文件夹合拢往胳膊底下夹着。“东西找到了。玛修还在外面对付Alterego吗？”


  “是。”立香说道。她的嘴角在说这个字的时候微微提了一分。“玛修做的很好。”'

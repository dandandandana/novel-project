content: '“呃……她平时最大的喜好大概就是……巡视领地？然后就是喝返老还童药变成小孩都孩子玩，再辙就是看电视打游戏……“士郎开口道。


  “然后呢，吉尔茜不是你的母亲吗？她平时做饭吗？”


  “哦？”


  “当然不了！本王哪用自己做饭！士郎会给我做的。”吉尔伽美什的声音再度传来。


  “……那不就是啃儿子吗？”


  “藤丸立香，等你回来本王会无情的对你进行地狱训练的。”吉尔伽美什带着笑说道。


  “对不起我错了我的王！”


  “还有吗立香？”言峰士郎打断了这对师生的撒泼打诨，他问道。


  “嗯……”


  【为什么他小我一岁还能这么厉害啊！】


  “吉尔伽美什平时是怎么训练你的？“立香开口道。


  等立香说完这话，言峰士郎想了想，他顿了顿，“嗯……我大部分训练是由我的父亲言峰绮礼负责，吉尔茜她则是更多的对我进行引导。”


  “就比如我修行魔术，她会时不时告诉我该怎么做，虽然她说的都很隐晦，但那是她对我的考验。”


  “她倒是不对我进行什么系统的指点……唯一要说的，就是复现她的那柄剑吧。”士郎思索着开口。


  “剑？”


  “对，吉尔茜告诉我这是判断我是否真正成年的终极考验，她把一柄剑的解析构成告诉了我，要我对那柄剑进行投影。”士郎无奈的开口道。


  说着，言峰士郎手中出现了蓝色的虚影，仔细看能看出来是一个圆柱状的剑，但是没有完全的构造好。


  “我技艺有限，只能做到这种程度。“


  “这不是吉尔茜用的那个剑吗？“立香回忆起在走廊时吉尔伽美什拿着的那柄剑，也和这个一样。


  “嗯。“言峰士郎点点头，“这确实是她的佩剑。”


  “啊……还是言峰天赋够高啊。”立香仔细想了想吉尔伽美什对自己的教导，貌似也和言峰士郎说的一样。


  【单纯是我笨啊，那还好。】立香在心里想着


  “杂修，够了，在透露下去本王的面子都没有了。“吉尔伽美什的声音传来。


  “王。“士郎忽然开口道。


  “为什么你不能来到这里呢？“'

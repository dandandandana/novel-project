content: '言峰士郎完成了日常的晚祷之后，本该合衣入睡的他并没有即刻入眠。


  在救援藤丸立香的过程中，他消耗了自己大部分魔力和最后一道令咒，但是总归是好的，他成功的把迦勒底的二人救了下来，只是没能成功杀掉berserker有点可惜，saber对自己的指令百分百信任，而此时此刻他开始怀疑自己了。


  他在支援吉尔伽美什的战斗中用了两道令咒，但是吉尔伽美什还是死在了archer和berserker的围攻之下。


  他在此之前从来不会懊恼和后悔，在吉尔伽美什的契约和他彻底断裂之后，他才感觉到了撕心裂肺一般的痛苦。


  那是他的养母。


  是他将近半数生命的导师，引路人。


  加上最后一道令咒没有达成相应的战略措施，言峰士郎对自己的既定战略产生了怀疑。


  他站起来，打算在教堂周围的安全地带走一走。


  散散自己的思绪。


  冬木市的教会并不算大，士郎来到了自己熟悉的后方的空地，他静静地看着天空中唯一一颗星星。


  柳洞寺未知的生物杀了冬木市几乎所有人。


  “我……到头来……“士郎无奈的叹了口气，他忽然察觉到了什么似的，往后一扭头。


  “藤丸……立香小姐？“士郎看着玄关的门，以及一不小心露出来还在跳来跳去的马尾，他开口道。


  “啊……我只是来上个厕所……没别的……“立香从门边侧身出来，她轻声开口道。


  “嗯……下次躲门后面可以不梳侧马尾。“士郎一本正经的开口道。


  “欸？“


  立香一愣，她忽然涨红了脸，“你在一本正经的胡说八道什么啊！谁躲了？！“


  “好好……“士郎无奈的叹了口气说道。


  “快回去吧，一会这里会很冷，着凉了。“士郎轻声说道。


  “嗯……言峰你在这里做什么呢？“立香开口问道。


  “在想一些事情。“士郎说道，他轻轻一笑，”没什么事，不会对你们有什么影响的。“


  言峰士郎好像意识到了什么，他轻声开口道，“我既然说了我会协助你们……“


  “我不是担心这个，毕竟我们现在已经是一条绳上的蚂蚱了嘛。“立香摆摆手开口道。


  言峰士郎收回自己接下来的话，他静静的看着立香。


  “馁，士郎，我想了解一下你眼中的吉尔伽美什是什么样的。”立香开口道，“我，我算是那位英雄王的弟子。”


  “弟子？”言峰士郎一愣，他点点头，“原来如此啊……你想知道什么？我能告诉你的都会告诉你。”


  “杂修，我就知道你会这么说。”立香手腕上的手表忽然响起来，“还有你这个小杂修，有什么事情不能来问本王吗？难不成本王平时很难相处吗？”


  “欸？吉尔茜……当然不是了，我问你你也不会说啊。”立香有些手足无措的开口道。


  “哼……至少别在这里，把本王的丑事外传到其他人耳朵里我可饶不了你们。”吉尔伽美什的话语再度传来。


  “明白了，王。”士郎沉声开口到，“那么……”


  “去你的房间。”吉尔伽美什开口道。


  “呃……不太好吧，王。”士郎无奈的说道，他看向立香。


  “我无所谓的言峰，主要是想听八卦了……”藤丸立香吐吐舌头开口道。


  “好的，明白了。”言峰士郎点点头，他迈步带路，“跟我来吧，尽量快点。”


  立香跟在士郎后面，她朝着手环开口


  “为什么是你在通讯啊吉尔茜。”


  “你当你家所长是铁打的吗？这一天发生了那么多的事情她当然得休息了。”吉尔伽美什的声音传来。


  “说起来，一直没问，你们为什么会来这里。”言峰士郎轻声开口道。


  “嗯……出了很大的事情。”


  立香把迦勒底管制室爆炸以及强行灵子转移的事情一五一十告知了士郎，士郎忽然停下来了脚步，立香看向她，她在士郎的眼神中看到了说不清楚的情绪。


  他单手握拳放在自己的左胸口，闭上眼睛低下头，轻声呢喃着什么。


  立香只听清楚了最后一句


  “愿你们的灵魂得以安眠。“


  【他在给迦勒底的死者祈祷。】


  当看到言峰士郎的这个动作之后，立香终于有了实感


  【迦勒底的御主候补死的只剩我一个了……如果不是希耶尔前辈连玛修也活不下来。】


  她忽然感觉有些反胃，强忍着恶心跟着士郎进了屋子。


  刚进门，士郎给立香倒了杯水，“看你状态不太好，要不然之后再说？“


  “不……就今天吧。“立香抬起头，她的一缕头发因为水渍而沾到了嘴角，加上她此时并不太好的脸色显得有些狼狈。


  “嗯……你想知道什么？“言峰士郎开口道。


  “嗯……”立香想了想，她脑海里想着吉尔伽美什平时的生活习惯。


  “她平时是怎么生活的？”立香开口道。


  “杂修……”通讯器里传来了吉尔伽美什咬牙切齿的话语。


  【问对了，反正有可能回不去，我要把我想知道的都问出来！】'

content: '两道毁灭级的力量撞在一起。碰撞点上炸开的冲击波把走廊两侧的碎石全部掀飞，魔力屏障和真世界的剑光互相撕咬着挤压着，走廊两侧的墙壁在一瞬间被余波切出放射状的裂痕。


  玛修竭尽全力撑着，盾牌前方的屏障开始出现龟裂的痕迹——一道、两道、无数道裂纹像血管一样在洁白的魔力壁上蔓延开。她的脚死死嵌在地板里，板甲的战靴在石板上踩出两个浅浅的凹陷。她在挡，死命地挡。


  最终，她挡下来了。真世界的斩击在把墙壁切成碎块之后终于耗尽了力量，魔力屏障在最后一波冲击后就地碎裂成无数片光屑。


  玛修身子向后一倒。立香迅速上前接住了她，双手从腋下环过去把她的后背靠在胸口上。“前辈……”玛修软软地笑了一下，那抹笑意从嘴角蔓延到眼底。她捡起单手剑，用剑尖撑着地板一点一点站了起来。


  “什么？！怎么可能！”朱月震怒地开口，她不顾一切地冲了过来。


  计时塔的一根石柱在她的冲势带起的余波中倒塌下来——墙壁已经扛过了真世界的正面余波，但承重柱终究没撑住。朱月一剑斩断了砸向自己的碎石，发了疯一样朝玛修逼近。


  “原理血戒·钟楼。”


  男人的声音从走廊另一头响了起来。


  时间在这一刻被拉成了一条没有尽头的细丝。每一毫秒都膨胀成了一座孤岛。朱月冲过去的姿势停止在了半空中——那不是停止，是被无限拉长。她抬眼的动作被切成了无数帧完全铺开的时间片，从剑尖到裙摆每一处都在动，但需要的时间被拉到了一百倍、一千倍。朱月用被拉得极长极慢的视野看见了走廊尽头站着的那个男人。


  红发。琥珀色的眼睛。风衣的下摆还带着与Alterego死斗时溅上的痕迹。


  她看见了那双瞳孔。


  那双瞳孔里装着的东西不需要拉长时间去看——在钟楼生效的第一帧就直接穿透了所有被稀释的时间层，像两根烧红的铁钉一样扎进了朱月的视线里。怒意满到像要从眼眶里溢出来，那是一种沉淀了很久被压了很久然后在某一个瞬间终于不需要再压的沸腾的愤怒与杀意。


  它们凝固在他脸上，在时间的无限长焦里，一动不动。'

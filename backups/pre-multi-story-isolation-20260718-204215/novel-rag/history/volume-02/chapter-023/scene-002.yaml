content: '他不需要射杀百头。希腊的大英雄就算只是纯粹的一箭，都蕴含着足以让一座城池灰飞烟灭的破坏力。那不是宝具的力量，而是属于这具肉体本身的、经过无数次杀戮与试炼锻造出的极致技艺——弓兵职阶的最高峰。


  箭矢破空的声音甚至比音爆更快地传到了白兽的耳中。


  灵长类杀手迎着这一箭，毫不犹豫地冲来。


  它没有躲避的意思。那双漆黑的瞳孔里映出箭矢逼近时越来越亮的光芒，但它的身躯没有做出任何闪避的动作——甚至连一个微小的侧身都没有。


  它就那样一头撞了上去。


  箭矢命中的瞬间，冲击力在空中炸开，白兽庞大的身躯被这一击打断了跃升的轨迹，如同一颗被击偏的炮弹，向下方坠去。


  Archer的判断无比正确。他选择了这栋残存的高楼作为狙击点，楼顶与地面之间的高度差让白兽的跳跃刚好够不到他——它差了那么几米，利爪堪堪从他脚下的混凝土边缘划过，留下几道深深的抓痕。


  白兽坠落。


  如同一枚从天而降的陨石，卡车般的躯体直直砸进了高楼的中段结构。钢筋混凝土在重压下发出痛苦的呻吟，裂缝以肉眼可见的速度从撞击点向四面八方蔓延，整栋大楼开始剧烈地摇晃。


  承重结构断裂的连锁反应在零点几秒内完成。


  大楼坍塌了。


  数十层的钢筋混凝土结构像被抽掉了脊椎一样轰然垮塌，扬起的烟尘遮天蔽日，碎石与金属碎片如暴雨般倾泻而下。Archer在大楼彻底崩溃前的最后一刻猛然跃起，巨人般的身躯在烟尘顶部翻转了一周，稳稳落在了数百米外另一栋残骸的楼顶。


  他的目光没有离开坍塌处一秒。


  烟尘翻涌着，像一头灰色的巨兽在废墟上方蠕动。


  然后，白色的身影破开了烟幕。


  灵长类杀手从坍塌的废墟中冲出，浑身沾满灰色的粉尘与自身的漆黑血液，鬃毛上挂着扭曲的钢筋碎片，看上去狼狈至极——但它的速度没有减慢分毫。


  Archer等的就是这一刻。


  九支箭同时离弦。


  漆黑的箭矢拖曳着龙吟般的啸声，如同九条漆黑的蛇从不同角度同时扑向白兽。每一支箭都精准地瞄准了灵长类杀手身上不同的弱点——左前肢骨折处、胸腹焦黑的伤口、后腿关节、脊椎连接处。


  灵长类杀手如同沙包一样硬生生吃下了这九箭。


  箭矢命中的位置依次炸开暗色的能量脉冲，将白兽的身躯打得左右摇晃。龙吟的余韵在废墟间来回震荡，激起的气浪将周围数十米内的碎石全部掀飞。


  当它抬头看向天空时——


  哪里还有巨人的身影？


  灵长类杀手疯狂地咆哮起来。那声咆哮不像是任何已知生物能发出的声音，更像是某种概念本身在嘶吼——“灵长类的天敌“这一权能被愤怒驱动着，从白兽体内向外辐射出一圈肉眼可见的扭曲波纹。波纹扫过之处，地面上残存的杂草瞬间枯萎发黑，几只藏在废墟缝隙里的老鼠无声无息地倒毙。


  它开始不顾一切地肆意挥霍怒火，利爪一次次劈向虚空，每一击都在地面上撕开十几米长的裂痕。碎石、残骸、扬尘在它周围形成了一个混乱的旋涡。


  然后——


  西边，忽然响起震耳欲聋的雷声。


  不是自然的雷。


  那声音太过沉重，太过凝实，像是有什么东西以超越音速的速度撕裂了整片天空。比雷声更快抵达的，是Archer的箭——一道漆黑的流光从西面的天际线上掠来，破空声晚了将近一秒才追上箭矢本身。


  灵长类杀手这一次没有直愣愣地硬吃。


  它的身躯在箭矢抵达前的瞬间猛然侧移，白色的残影还留在原地时，真身已经闪到了数十米外。那支足以轰碎城墙的箭矢擦着它的鬃毛掠过，命中了身后一栋已经半毁的商业大楼——大楼从中间断裂，上半截缓缓倾倒，砸在地面上掀起新一轮的烟尘。


  白兽不再咆哮了。


  它的瞳孔收缩成针尖大小，死死锁定了西面那个放冷箭的方向。下一刻，它压低身躯，四肢同时发力——披着沾满漆黑血液的鬃毛，如同一道白色的闪电，朝着Archer藏身的位置冲去。


  “把它引到位置，有一发对城级宝具等着它。“


  这是希耶尔告诉他的。Archer将这句话刻在了每一次跳跃之间的判断里。


  但情况比预想的更加棘手。


  他和希耶尔打在灵长类杀手身上的对城级攻击已经不少了——这还是在它吃了一发月虹的情况下。可这只怪物不仅还活着，还能以这样的速度追击。


  Archer在高楼间不断跳跃，每一次落脚都精准地选在残存结构最坚固的承重点上，巨人般的身躯以不可思议的敏捷在城市的废墟天际线上腾挪闪转。他的脚掌每踩碎一处楼顶，身后就多出一栋坍塌的建筑。


  他不打算和它肉搏。'

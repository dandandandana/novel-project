content: '在确认灵长类杀手利用圣杯寄宿着【反灵长】权能之后，近身格斗就是最愚蠢的选择。哪怕是赫拉克勒斯的臂力，在“反灵长“的概念压制下，近身接触只会让自己的攻击被进一步削弱。保持距离，用弓箭持续削弱它，同时将它引向希耶尔设定的位置——这才是正确的战术。


  尽量削弱灵长类杀手。这是希腊的大英雄目前唯一需要做的事。


  又一箭射出，精准命中白兽的右肩，炸出一蓬漆黑的血雾。灵长类杀手踉跄了一步，但没有停下，反而借着踉跄的力道调整了方向，以更刁钻的角度扑来。


  跳跃。落地。转身。拉弦。射击。


  Archer将这套动作重复了无数次，每一次的间隔都在缩短。不是因为他加快了节奏——而是因为灵长类杀手的速度在不断提升。


  它在适应他的节奏。


  白兽的瞳孔死死锁着眼前那个在高楼间跳动的身影，每一次Archer落脚时产生的细微声响、每一次弓弦震动前肌肉绷紧的预兆、每一次跳跃轨迹的弧度——它都在记忆，都在学习。


  不知不觉间，它与这个一边放箭一边远离的大英雄之间的距离，越来越近了。


  两百米。一百五十米。一百米。


  因为Archer停下来了。


  他站在一栋半毁的写字楼楼顶，没有继续跳跃。巨人般的身躯在昏暗的天光下投射出一道沉默的剪影，手中的弓垂在身侧，漆黑的箭矢还搭在弦上，却没有拉开。


  他在等。


  灵长类杀手也察觉到了猎物的异常，但捕食者的本能驱使着它不可能放过这个机会。它的四肢蓄满了力量，肌肉在皮毛下隆起，准备发动最后的冲刺——


  哗啦啦。


  开始下雨了。


  不是普通的雨。雨滴砸在地面上的声音太过沉重，太过密集，像是有人在天穹之上倾倒了一整个湖泊。豆大的水珠打在Archer的肩甲上，发出清脆的金属敲击声，打在灵长类杀手的鬃毛上，激起一片白色的水雾。


  剧烈的暴雨在几秒内就将整片废墟淋成了一片模糊的灰色。


  Archer疑惑地抬头看向天空。


  然后，他看到了令他极度震惊的一幕。


  来自希腊神话的大英雄，见证过九头蛇的剧毒，扼杀过涅墨亚雄狮，踏入过冥界的深渊——这一生，他什么样的异象没有见过？


  但就连他，也为此刻眼前的景象所震撼。


  天穹消失了。


  不是被云层遮蔽，不是被黑暗吞噬——而是被海水取代了。


  整片天幕化作了一面巨大的、倒悬的海洋。无边无际的海水以一种违背物理法则的姿态悬挂在城市上方，幽深的蓝绿色水体中隐约可以看到洋流涌动的纹路，甚至能辨认出几条被卷入其中的鱼类在无声地游弋。阳光从海水的另一侧穿透进来，折射出无数道金色的光柱，如同神迹一般洒落在废墟之上。


  这不是自然现象。


  这是宝具。


  “修女！“Archer的声音在暴雨中炸开，浑厚而急促，“那个家伙到位了！“


  “啊！我知道了！“


  数百米外，希耶尔的声音从通讯中传来，沙哑、疲惫，却带着不容置疑的坚定。她拖着伤痕累累的身躯，终于抵达了预设的位置，第七圣典在她手中发出前所未有的光芒，铭文如同活物一般在圣钉上奔涌流转。


  她张开双臂，处刑器在她身后展开为巨大的断头台形态，圣光冲天而起，与头顶倒悬的海洋交相辉映。


  蓝发修女的双眼在圣光中闪烁着冰冷的决意，嘴唇微动，真名解放的咒文从她口中倾泻而出——


  “断头台如群星般闪耀——“


  “——原理血戒·断头台！“'

content: '藤丸立香最后还是坠入了梦境，像一块石头沉进深水里，听不见落地的回音。意识的边界在她闭上眼的那一刻就模糊了，只剩下一团温吞的黑暗裹着她往下坠。


  但这片黑暗不像是她自己的，触感和温度都带着别人的气味，像是错穿了谁的衣服。


  她迷迷糊糊地记起入睡前言峰士郎那张笃定的脸，他说不会让她做梦。那个语气她记得很清楚，不是什么安慰人的调子，而是那种他一贯的陈述句式。


  结果她还是做梦了。


  立香在心里暗戳戳地把这笔账记下来，决定醒来之后一定要拿这个堵他的嘴。


  脚底传来冰凉的触感，让她的意识猛地收拢。


  立香低下头，她站在一片水域上，水面平整得像是凝固的琉璃，颜色湛蓝得不像是自然界该有的，倒像是谁把天空的颜料倒进了水里。她踩在上面，鞋底没有湿，只是有寒气从脚心往上爬，沿着小腿一路攀到膝盖。


  环顾四周，只有水，无边无际的蓝色水面向四面八方铺展，和同样没有尽头的天空接在一起。没有参照物，没有阴影，连她自己的影子都看不见。


  “我的梦境被替换了吗。”她喃喃开口，声音从喉咙里滚出来之后像是被周围的空间吞掉了，没有回响。


  “那也还行……他竟然有操纵梦境的能力吗？”


  她蹲下身，双手撑在膝盖上，往水面里看。镜面般的水里映着一个人影，红发，琥珀色的眼睛，轮廓线条硬朗分明。


  起初她以为是自己的倒影，但多看两秒之后心里咯噔了一下。那张脸不是她的。她认识那张脸，每天都能在走廊里、战场上、饭桌对面看到的那张脸。


  言峰士郎的脸正从水面下望着她，表情平静得像是在等她说出什么她还没想到的话。


  “什。”


  话头被掐断在半截。


  立香伸出手，指尖朝水面探去，心里的疑问还没成形就碎掉了。水面下的言峰士郎也抬起手，动作和她同步得像是照镜子，但那张脸分明不是她的。


  指尖触到水面的那一瞬间没有预想中的冰凉，也没有湿意，她的手直接穿了过去，像是穿过一层温热的空气。紧接着整个身体失去了平衡，她跌进那层蓝色里，四周的光线猛地收窄成一条线，然后什么也看不见了。


  她从黑暗中睁开眼睛。鼻子里闻到旧木头和蜡烛残蜡的气味，混合着一种干燥的灰尘味道，像是很长时间没人来过这里。


  光线很暗，从高处彩色玻璃窗漏进来的是冷调的月光，打在长条木椅上投下一块块棱形的光斑。


  教堂，一处不算特别辉煌的教堂，穹顶不高，装饰也不华丽，但每一根柱子和每一扇窗都透着某种沉甸甸的厚重感。


  她的视线扫过祭坛上的烛台，扫过墙面上褪色的壁画，然后停在正前方那张长桌后面坐着的人身上。冬木教堂，她来过这里，在特异点F的废墟里见过相同的布局，只是那一次没有烛光，也没有坐着的人。


  眼前的金发女人靠在椅背上，坐得不算端正，一只手搭在桌沿，手指扣着一只高脚杯的底座。赤色的瞳孔在烛光里闪着暗沉的光泽，视线落在立香所在的方向，但目光的焦距似乎穿过了她，落在她身后某个更远的地方。


  “想好了？”金发的女人开口，声音不高，带着那种毋容置疑的笃定。


  立香愣了一下，还没来得及反应这问题是什么意思，她的嘴唇自己动了起来。她想动手，想转头，想做出任何一个她自己的动作，但身体完全不听使唤。


  一个男性的声音从她喉咙里发出，稳重，内敛，带着隐隐约约的少年感：“是的，卡桑。”那是言峰士郎的声音，但比她平时听到的年轻了太多，像是一把还没被生活锻打过的刀。


  “本王所能教你的已经到了极限。”吉尔伽美什将高脚杯搁在桌上，发出一声清脆的磕响。“有很多事情是需要你自己去领悟的。”


  立香感到自己的脖颈轻轻低了下去，视线扫过桌面上的烛台和几页散乱的纸张。士郎在点头。她控制不了这个身体，只能作为一双眼，附在他身上看这段记忆。吉尔伽美什后面似乎还说了些什么，但声音渐渐模糊，像收音机被调歪了频道。


  然后她转过身去。


  门外站着一个金发碧眼的少女，半个身子躲在门框后面，只探出脑袋往里张望。那张脸立香见过，在刚才的投影里见过。神琦灰。只是眼前这个神琦灰比她印象中要更开朗一点，眼睛亮得像是刚从学校放学的孩子。


  少女看见她转过身来，脸上绽开一个干净的笑容。那笑容坦荡得让人挪不开眼。“第二次见面，神琦灰。”她说。


  立香的嘴唇再度张开，少年的声音稳稳地落下去：“言峰士郎。”


  “那么，以后你就是我的徒弟了。”神琦灰把整个身子从门框后转出来，脚步轻快地往前踏了两步。她的笑容从嘴角蔓延到眼角，整张脸都跟着亮了起来。“言峰士郎，我很喜欢你这种人哦。”'

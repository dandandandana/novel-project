content: '“立香，你没事吧？“


  奥尔加玛丽正对着立香，两只手叠放在桌面上，食指在中指的指背上点了两下。


  立香把最后一口吐司塞进嘴里，嚼了几下咽下去。


  “……原来我看起来像是会出事的类型啊。“


  她拿起纸巾擦了擦手指上的黄油渍，把用过的纸巾叠成一个小方块压在碟子底下。


  “没什么事，心情不错。感谢关心了所长，达芬奇亲。“


  “真的没事？一会还是做个检查比较好吧……“奥尔加玛丽的食指从中指背上移开，转而去碰咖啡杯的把手，来回拨了两下。


  言峰士郎从厨房走出来。围裙还系着，粉色布料上多了几滴洗碗水溅出来的深色水渍。他走到立香旁边站定。没有坐下，两只手在围裙的口袋里，重心放在左脚上。


  什么也没说。


  餐桌的另一端，吉尔伽美什把茶杯放下来。瓷器和桌面接触的声音很轻，一声“叮“。


  “昨晚干嘛去了？士郎。“


  “对了，吉尔茜这话问的好。“奥尔加玛丽从椅子上站起来，椅腿在地板上蹭出一声短促的摩擦音。她转向言峰士郎，“Ruler，你昨晚半夜是不是去找立香了。“


  “我把电路什么的修了修，然后就去……做蛋糕。“


  “做蛋糕？凌晨一点做蛋糕？“


  士郎停了半拍。围裙口袋里的手动了一下。


  “……库存里有材料，不用白不用。“


  “哦？“吉尔伽美什端起茶杯，杯口遮住了下半张脸。“那本王要试吃一下。立香。“


  立香刚把味增汤碗放下来，碗底的汤汁已经见底了，只剩几片裙带菜贴在碗壁上。


  “士郎做的蛋糕怎么样？“


  “很好吃。“


  立香把碗和碟子摞到一起，筷子横在碗口上面。


  “那就好。“吉尔伽美什把茶杯放回桌面上，瓷底磕在合金上又是一声轻响。“本王建议你一会还是去做个检查比较好。毕竟言峰士郎很不会说话。“


  “确实。“


  立香说这两个字的时候，身体的重心微微朝士郎的方向偏了一下——椅子没有移动，只有肩膀的角度发生了变化。


  士郎站在旁边，围裙口袋里的手纹丝不动。


  奥尔加玛丽已经走到了他面前。所长的身高到士郎的锁骨位置，她需要把下巴抬起来才能和他对上同一条水平线。


  “你昨晚，去找立香了？“


  “对。“


  “几点？“


  “凌晨一点。“


  “你把她吵醒了？“


  士郎的嘴张开了一个很小的角度，合上，又张开。


  “所长，是我自己失眠了。“


  立香的声音从餐桌那边插进来，堵住了士郎正在犹豫的措辞。


  “嗯哼？“奥尔加玛丽没有回头。她伸出右手食指，指尖抵在士郎胸口的围裙布料上，戳了一下。手指收回来的速度很快，戳完立刻缩回去，整个动作加起来不超过半秒。“那Ruler你就是……夜袭心理不健康的御主咯？“


  士郎低下头，和面前抬着下巴的所长对视了两秒。


  “……你这么理解也还行。“


  “下流！龌龊！“


  “喂喂！你这就是诽谤了啊！“


  士郎朝后退了半步，双手从围裙口袋里抽出来，手掌朝前举着，做出一个投降的姿势。粉色围裙随着他后退的动作晃了一下，腰后面那个歪歪扭扭的蝴蝶结险些被甩散。


  达芬奇“噗“的一声笑了出来。记录板上的笔滚到了桌面边缘，她伸手接住。


  立香把碗碟推到桌面中央。士郎从投降的姿态中恢复过来，绕过还在原地叉着腰的奥尔加玛丽，走到餐桌旁边把碗碟收走了。筷子、碟子、汤碗、纸巾叠成的小方块，一次性全部端回厨房。水龙头打开的声音从墙后传过来，接着是碗碟在水流下旋转碰撞的细碎响动。


  立香转向达芬奇。


  “达芬奇亲，我打算和你去做个检查。“


  “欸？那太好了呀，走吧走吧！我这边正好有新的灵基扫描模块需要校准，你来当第一个测试对象刚刚好嘛！“达芬奇把记录板夹到腋下，从椅子上弹起来，裙摆扫过桌角。


  立香从椅子上站起来的时候膝盖有一瞬间发软——坐太久了，腿部血液循环还没跟上。她扶了一下桌沿，稳住了。


  “吉尔茜。“


  吉尔伽美什正在喝茶杯里最后一口红茶，柠檬片被杯壁挡住了，贴在瓷壁内侧。


  “我下午想要继续练习魔术。“


  “嗯，确实该继续了。“吉尔伽美什把空杯子放到桌面上，手指在杯沿上转了半圈。“不过用不了几天，你就要带队去伦敦了。“


  “啊，就因为这样我才要继续练习嘛。“立香的肩膀松下来，身体的重心微微后倾，双手背在身后交叉。“那一会见了，我先和达芬奇亲去测试了。“


  她转身朝门口走了两步，又停下来。


  “所长。“


  奥尔加玛丽还站在刚才的位置，手臂抱在胸前，保持着叉腰之后残留的姿势。


  “嗯？“


  “蛋糕还有小半块在冰箱里。你要吃的话自己去拿，记得把碟子洗了。“'

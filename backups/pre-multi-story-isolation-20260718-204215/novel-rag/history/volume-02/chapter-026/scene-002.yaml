content: '法兰西的圣女浑身都是血痕。左眉到颧骨的刀伤还在往外渗血，被雨水冲成淡粉色的细流沿着下颌滴落。铠甲碎了两处，露出底下被震得青紫的皮肤。她的右手虎口上缠着一条从衣甲内衬上撕下来的布条，布条已经被血洇透了，深红色的水从布条底端一滴滴地坠下去。


  但她站起来了。


  她冲过来了。


  立香同时也猛地朝着Alterego的手挥剑。


  Alterego的反应快到几乎和贞德的攻击同步。他没有格挡，没有闪避。他做了一个更省力也更恶劣的选择。


  他把立香甩了出去。


  手腕一翻，五指松开的瞬间借着惯性将立香的身体朝贞德的方向狠狠掷去。一个活生生的人被当作投射物，白色的迦勒底制服在暴雨中画出一道翻滚的弧线。


  贞德的旗剑停了。


  那柄已经递到Alterego小臂前方不到三寸的剑，在劈砍的半途中被她自己硬生生拽停了。刃口在空中顿住的一瞬，金属承受不了骤停的扭矩，发出一声尖锐的嘤鸣。


  她要接住立香。


  她必须接住立香。


  她的身体在做出判断之前就已经动了。双脚往左横跨一步，脊背拧过一个近乎不可能的角度，她让出了立香飞来的轨迹，同时右臂往后一展，剑柄抵在自己的肋骨上腾出空来的左手，一把扣住了立香翻滚的衣领。


  立香的身体在半空中被截停了。惯性带着两个人同时往后趔趄了两步，贞德的后背撞上了石阶旁半截断裂的石灯笼底座，脊椎传来一阵猛烈的钝痛。


  但她扣着立香衣领的手一动没动。


  Alterego就在三步之外。


  贞德做了一个判断。这个判断用了不到零点一秒。


  她松开了立香的衣领，把立香推到自己身后。旗剑的剑身横在身前，她的重心下沉，右脚前左脚后，标准的防御架势。


  然后她转守为攻。


  旗剑从下往上撩起，刃尖带着一道银白色的弧光直取Alterego的咽喉。这一剑和之前她被六刀击溃时的防守完全不同。之前是被动挨打，每一次格挡都在消耗她所剩无几的体力。但这一剑是主动的、孤注一掷的、把所有筹码压上去的一击。


  Alterego的太刀已经回到了手中。


  他用左手拔的刀。拔刀的动作仍然看不清过程，只有刀鞘和刀身分离时发出的一声极轻的“嗒“。太刀迎上了旗剑。两柄武器在暴雨中相撞，冲击波震碎了他们脚下的石阶表面，碎石和积水同时向外飞溅。


  贞德被震退了一步。


  但她没有停。她的旗剑在被弹开的瞬间就改变了角度，从左侧横扫向Alterego的腰腹。同时她的左手松开了剑柄，五指张开，掌心朝前。


  Alterego读懂了她要做什么。


  “哦？“


  贞德开口了。


  声音不大。在暴雨和金属碰撞的噪音中几乎听不清。但那两个字携带的东西，让Alterego持刀的左手微微顿了那么半拍。


  “吾主在此。“


  光炸开了。


  金色的、如同晨曦破开云层般的光芒从贞德摊开的左掌中向外扩散，在她和立香的周围织成一面半透明的光壁。那面光壁的表面流淌着繁复的圣纹，每一笔每一划都在暴雨的冲刷下持续燃烧着柔和的金光，将落在上面的雨水蒸成细密的白雾。


  贞德转过身，一把搂住了还没站稳的立香。铠甲上残存的金属碎片硌进了立香的手臂，疼得她倒吸了一口气，但贞德搂着她的力道一点没松。圣女的胸甲抵在立香的侧脸上，冰冷的金属下面，她能感觉到贞德的心跳。很快。快到和暴雨落在石阶上的频率差不多。


  贞德抱着立香往柳洞寺上层跑去。


  Alterego没有追。


  他站在光壁之外，太刀垂在身侧。他的目光没有追随贞德和立香撤退的方向，而是往上抬了。


  他在看柳洞寺的屋顶。


  他的嘴角动了。


  “……啊。“


  屋顶的檐角上站着一个人。


  暴雨从天穹倾泻而下，砸在柳洞寺黛青色的瓦片上溅起细密的水雾，将那个站在屋脊上的身影笼罩在一层朦胧的灰白色纱帘之中。但即便隔着雨幕，即便隔着几十米的高度差，那个身影手中握着的东西仍然清晰可辨。


  一杆长弓。


  弓臂在暴雨中折射着暗沉的光泽，弓弦绷得笔直，雨水落在弦上被振荡成一串细小的水珠，沿着弓弦的长度向两端滑落。


  言峰士郎站在柳洞寺的屋顶上。


  他的脸色很差。刚从昏迷中醒来的苍白还残留在他的面颊上，嘴唇几乎没有血色，被暴雨打湿的黑发贴在额头和鬓角，一缕缕的，遮住了半边眉眼。他的衣服是湿透的，布料紧贴在身上，能看到底下肋骨的轮廓。


  他在发抖。


  很轻的抖。不仔细看看不出来。但他持弓的左手确实在抖，弓臂的末端随着他手腕的细微颤动划出一个极小的、不规则的圆。


  他还是站在那里了。'

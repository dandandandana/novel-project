content: '玛修一步迈了进去。她越过门槛的时候脚跟磕了一下石板，发出很轻的嗒声。然后她没有回头，一步一步朝着那片深不见底的黑暗走去。紫色短发的后脑勺越走越深——门内的黑暗把她的轮廓一点一点吞掉，先是腿甲的反光消失，再是右肩灰色披风溶进阴影，再是紫色的发梢。


  立香看着她的背影。拳头攥得紧紧的。她吸了一大口气，在这一刻把嗓子里所有的哽咽都压了下去。“玛修！一定要——”她的话头被自己的呼吸堵了一下，然后她生生把那口气吞了回去，用更大的声音喊出来。“一定要成功！你是我的从者！我需要你！”


  玛修歪过头。黑暗已经吞到了她的肩膀，她的侧脸还亮着，走廊的灯光照出来她清秀的脸和微微弯起的嘴角。她朝着立香展露了一个笑脸。


  然后走了进去。


  士郎伸出手把门推上。铁灰色的门板沿着早已被磨得发亮的轨道滑回去，发出一声又沉又闷的轰隆声合上了。整条走廊里剩余的余音消失了好一阵子，然后被墙壁吸收干净。


  “馁，言峰士郎。”爱尔奎特先开口了。她抱臂站在原地，红眸直直地盯着他。


  “怎么了？”士郎转过身看向她。


  “为什么千年城的钥匙在这里？”


  “就那个——断罪之枪。”爱尔奎特抬手指向处刑处大门的深处，手指的方向和刚才玛修走进去的方向完全一致。“星廻の断罪槍。”她放下手臂重新把双臂抱回胸前，红眸里闪烁着一种不加掩饰的焦急。“那个气息就在这里——就在这扇门后面的某个地方。”


  “额。”士郎歪了一下头，琥珀色的瞳孔眨了一下。“对你很重要吗？”


  “你是不是在装傻啊！”爱尔奎特把手指戳到了士郎的胸口上，指甲隔着白色的风衣戳出了一道浅浅的凹陷。“那是我家的钥匙——我找了好几年没找到啊！我不管，去给我找出来！”


  士郎抱臂看着她。他的手指在自己的手臂上敲了好几下，然后眼皮抬了一下，琥珀色的瞳孔里闪过一丝谁都能看懂的精明——那是他在脑子里算定了某个划算或不划算的条件之后才会露出来的表情。“这玩意儿我也能用。你让我用，并且我的御主同意的情况下，我就帮你找。”


  爱尔奎特二话不说转向立香。她整个人从士郎面前转过来的时候金发都甩出了一个半圆的弧度，红眸直视着立香的脸。“立香！”她的声音里带着赤裸裸的撒娇。


  “同意。”立香点了点头。她的视线从爱尔奎特身上移开，重新落回那扇紧闭的铁灰色大门上，看都没有看士郎一眼。“士郎，去吧。”她走到墙边，靠着冰冷的石砖坐下，把背抵在墙上。双手放在膝盖上，橘色的瞳孔一瞬不瞬地盯着那扇大门的焊接痕。“让我一个人待一会，怎么样？”


  士郎看着她靠在墙边的姿势——她的手指在膝盖上还在轻轻发抖，刚才喊玛修的时候用得太用力了。但他最终只是转过身拽着爱尔奎特的后领往走廊的另一头走去。“注意安全。”他把声音留在身后。


  雅典娜至始至终没有说一句话。她灰色的瞳孔在处刑处紧闭的大门上停了一秒，然后转过身朝着另一头走去。脚步声从石板上渐行渐远，被墙壁吸干净了。


  走廊很长。长得像是没有尽头。铁灰色的大门紧闭着，上面几道横向的焊接痕在冷白的灯光下纹丝不动。门里的黑暗吞掉了一切声音。


  长长的走廊里只留下立香一个人。'

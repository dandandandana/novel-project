content: '她整个人往车门那边缩去，把那只被他握过的手抱在怀里，手指还残留着他掌心的那份热度，嗓子里的声音从压低了的嗓门里挤出来。


  “你这个不正经的！”她抬起空着的那只手拍了拍自己的脸颊，手在脸上啪啪拍了好几下。然后她把那只手放下来，又往车门上挤了挤，把脊背抵在门内侧的扶手上。然后用那只刚刚拍过脸的手拍了拍另一边的脸蛋子。


  “我怎么记得吉尔伽美什是Saber职阶的从者呢？”她开口，语调恢复了八成。


  “都有啊，她可以在Alter Ego和Saber职阶二者之间切换。”士郎看着前方。然后他的眉头轻轻皱了一下，琥珀色的瞳孔偏过来看着立香，表情里浮出一种没有伪装的意外。“你不知道？”


  “我——她没告诉我。”


  士郎通过后视镜看了后排一眼。吉尔伽美什的赤瞳和他在镜子里对上了，她嘴角的弧度半寸都没有动过。“卡桑不是正规的从者，职阶切换是她自己的特性。”他把视线收回来，重新盯着前方的路面。“等处理好玛修的事情我去把埋葬机关里面有关她的资料调给你。”


  “哼。”一声轻哼从后排飘了出来，裹着笑的气音。吉尔伽美什把伊什塔尔捂得更紧了——白发的女神被捂得在后座扑腾起来，手去掰吉尔伽美什的手指掰不开。“士郎，为什么不让本王亲自说？”她的语调里没有愤怒，只有一种被抢了话之后的不甘。


  伊什塔尔在她手里挣扎着发出闷闷的哼声。


  “你有可能说全真的谎言，我不放心。”


  伊什塔尔终于挣脱开了那只手。她大口喘着气往后座靠背上一倒。“咳咳咳咳咳咳咳——什么东西！”她一边咳嗽一边观察吉尔伽美什的表情。然后她的脸上浮现出一种恍然大悟，又参半着不可置信的神色。“原来——原来你不是原版的吉尔伽美什啊！你是个——”


  她的话卡住了。因为坐在她身边的吉尔伽美什正用一种和善得能把人噎死的微笑看着她。赤瞳眯起来，嘴角弯到某个精确的弧度——那种笑不是“我很开心”，是“你再往下说一个字我就把你的马安娜当钥匙扣用了。”


  伊什塔尔身子一顿。她整个人往前座和后座之间的缝隙一挤，双手抓住主驾和副驾的椅背，声音里带着刚被呛到的嘶哑。“你不是赝品你不是赝品！哇这么强，谁强谁是正品！”她把每一个字都喊得清清楚楚，像是在背诵某个新学会的求生口诀。


  “喂喂我都这样解释了！”


  “呀咩咯！”伊什塔尔把自己往两个前座之间卡得更紧了，银色的长发扫过扶手箱的皮革。吉尔伽美什伸手摁住她的肩膀，把她从两个前座之间拖回后座，然后重新把那只手捂在她嘴上。白发的女神扑腾了几下，然后发出一声闷闷的哼声放弃了挣扎。


  “咳咳咳咳——”伊什塔尔在吉尔伽美什松开手之后呛得整个人都在座椅上弹了一下。她抬起手指着吉尔伽美什，指头在空气里晃了很久什么都没说出来，末了泄了气往座椅上一倒。“……本王。”吉尔伽美什斜了她一眼，语气里有一丝极淡的无语。“你什么时候也学会这种台词了。”


  伊什塔尔把脸别过去，把车窗玻璃上的雾当镜子照。


  士郎把车拐进一条窄巷，前灯照亮了地下的入口。另一辆车紧跟着驶了进来。


  两辆车驶入伦敦圣堂教会的地下室。石砌的拱顶压得很低，灰泥从墙壁的裂缝里剥落下来，在车灯扫过的时候飞起一小片细细的粉尘。轮胎碾过古老的石板地面发出沉闷的隆隆声，在空旷的地下室里来回弹了几圈才消散干净。


  众人从车上下来的时候，立香的靴子踩在石板上发出清脆的嗒声。地下室的冷空气灌进领口，和车里的暖气形成了一阵让人打了个激灵的温差。她整理了一下思路，回过头看向伊什塔尔和吉尔伽美什。“那么麻烦伊什塔尔和吉尔伽美什在这里驻守了——需要士郎在这里进行身份验证。”她看了看士郎，又看了看玛修，抿了一下嘴唇，然后把那两个字吐出来。“走吧。”


  “我也要跟着吗？”爱尔奎特在一旁开口，她的金发在昏暗的地下室里泛着一层浅淡的白光。她把双臂抱在胸前，赤红的眸子往四周扫了一圈，语调里的嫌弃不加掩饰。“馁馁，我很讨厌埋葬机关的说。”


  “你这哪里来的口癖。”士郎把车钥匙揣进风衣口袋，琥珀色的瞳孔斜过去看了她一眼。“当然要跟着。你和雅典娜女士目前缺少战斗力，找个地方待着就好。”


  “收到。”雅典娜简短地回应了一句，灰色的瞳孔在地下室暗沉的光线里显得格外冷静。


  立香转过身去握住了一旁一直没有说话的玛修的手。'

content: '浓重的懊悔与不甘化作烈火裹住言峰士郎的身躯，他浑身脱力，瘫倒在教堂冰冷的地板上，连抬手的力气都没有。


  【不对……不对，我明明——】


  “我明明把立香救下来了。“


  话音落下，脑海中浮现出少女重焕光彩的眼眸，混沌的思绪有了一丝清明。他猛地攥紧拳头，强迫自己冷静。


  “不……这是精神污染。我早就确认过了，不是吗？“


  言峰士郎咬着牙撑起身子。反胃的恶心与遍体的剧痛交织，每动一下都像是在撕扯神经，却被他硬生生忍了下来。


  厘清思绪，确认眼前一切都是幻境后，他挺直脊背，朝教堂门外走去。


  “既然如此，就去面对它。“


  推开木门，那只通体雪白的巨兽正静静伫立在外。漆黑的瞳孔死死锁着他，周身萦绕着令人窒息的压迫感。


  这一次，他心底没有丝毫惧意。


  “再睡下去，只会给大家添麻烦。“


  ——没什么好怕的了。他唯一的念头，就是主动迎接梦境中的死亡，挣脱幻境，重回现实。


  巨兽利爪带着破空声猛然落下。


  言峰士郎闭上眼，没有躲闪。


  “砰！“


  一道温热的身躯猛地撞上来，将他狠狠撞开。剧烈的力道让他踉跄后退几步，摔坐在地。


  残留的力道、清晰的痛觉，还有那股刻在骨子里的体香——都真实得让他心悸。


  “吉尔……“


  “刺啦——！“


  黄金铠甲被利爪撕裂的脆响刺耳至极。那位骄傲的王，在这个梦境里，为了他，再一次倒在了血泊之中。


  死过的人，不该再死一次。这是言峰士郎一直坚信的东西。


  可吉尔伽美什就确确实实地倒在他面前——胸口被利爪洞穿，黄金的发丝被鲜血濡湿，再也没有往日的意气风发。


  他僵在原地，喉咙像被堵住，一句话也说不出来。


  “杂修……别让我失望啊……“


  声音微弱得像风中残烛，带着最后的期许，渐渐消散。


  “啊……“


  这一刻，他彻底分不清真实与虚假。


  刚刚才确认的“梦境虚假“，在吉尔伽美什倒下的瞬间轰然崩塌。眼前的画面真实得让他窒息。


  【吉尔茜……确实是死了。】


  【是因我而死。】


  巨大的痛苦像潮水将他淹没。他踉跄着爬到吉尔伽美什身旁，小心翼翼搂住她渐渐冰冷的身躯，指尖的颤抖暴露了一切。


  “不……不要……“


  声音破碎不堪，泪水滑落，滴在黄金铠甲上，晕开小小的水渍。


  “死吧，死吧。“


  一道神圣却冰冷的梵音在耳边响起，一遍遍重复，像来自神明的宣判。


  “死吧，死吧……“


  身上再度燃起烈焰。这一次，他没有挣扎，只是轻轻闭上眼，任由火焰吞噬一切。


  再次睁开眼，是熟悉的天花板。


  圣水的气息，干净柔软的被单，昏黄的灯光温柔地笼罩着房间——他的房间。而那个橘发少女正趴在床边，似乎守了他很久。


  “啊，言峰你醒了！“


  立香猛地抬起头，红着眼眶一把攥住他的手，随即意识到什么，脸颊瞬间烧红，慌忙松开手转身——


  “我、我去给你倒杯水！“


  “杂修！你总算肯醒了——“通讯器里传来吉尔伽美什傲慢的声音，语气里却藏着难以掩饰的急切。


  “言峰前辈！下次可不能再这样让人担心了！“玛修双手攥着裙摆，满脸真切的担忧。


  “御主，我认同这位新人从者的话。“Saber轻叹一声，“你太不爱惜自己了。“


  “言峰士郎……算了，随你吧。“伊莉雅站在门口瞥了他一眼，确认他真的醒了，才转头朝门外喊道，“修女，他醒了。“


  “啊，知道了。“蓝发修女推门走进来，一脸不悦地瞪着他，“你这混蛋，总算醒了，害我们白担心一场。“


  言峰士郎咬着牙强撑着坐起身。


  “我没事，别担心——“


  话音未落，墙壁传来一阵剧烈的碎裂声，轰然坍塌。


  白兽冲破天穹。漆黑的利爪带着毁天灭地的气势径直扑来，裹着刺鼻的腥气。


  “言峰！危险！“


  橘发少女想也没想，猛地将他推开。


  下一秒，利爪贯穿了她的胸口。温热的鲜血喷涌而出，溅在他的脸颊上——那触感真实得可怕。


  他僵在原地，看着倒在血泊中的立香，大脑一片空白。


  没有犹豫，他站起身挡在立香身前，硬生生接下了白兽的下一击。


  熟悉的死亡痛感席卷全身。意识再度陷入黑暗。


  再度睁眼。熟悉的天花板，熟悉的圣水气息，熟悉的昏黄灯光。


  一切都和上一次一模一样。


  “言峰！你终于醒了！“立香扑过来攥住他的手，眼底的欣喜裹着未散的后怕，声音微微发颤，“我还以为……还以为你醒不过来了！“


  【等等……】


  心脏猛地一沉。


  “怎么了？还是哪里不舒服吗？“立香藏不住眼里的慌张，身子前倾，指尖想去碰他的额头，又怕惊扰到他，硬生生顿在半空。


  “杂修！不舒服就老实躺着！别硬撑！“通讯器里传来吉尔伽美什的呵斥，比平时柔和了几分。


  “言峰前辈……请好好休息，别勉强自己。“'

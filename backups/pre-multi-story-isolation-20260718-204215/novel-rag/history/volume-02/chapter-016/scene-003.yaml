content: '希耶尔瞳孔微缩，目光紧紧锁着眼前的人，语气里带着几分难以置信的急切：“你的意思是，宝具？等等，他的宝具不会是……”


  “原理血戒·神赐。”少年语气平淡地打断她，一字一句清晰地说道，“具体效果大概就是利用自己的存在以及其他的筹码，来换取他所想要的东西，这一次他就是换取了他未曾带来了原理血戒·月虹，然后亡羊补牢。”


  “这样吗……”希耶尔缓缓点头，神色渐渐凝重，“他是用自己作为代价，救下了伊莉雅和这里的言峰士郎？可既然如此，为什么不直接杀了灵长类杀手？”


  “言峰士郎”抬眼看向希耶尔，语气依旧平静：“很简单，Ruler此次现界，所能支付的代价，不足以同时做到拯救二人和击杀灵长类杀手。可一旦言峰士郎和伊莉雅死去，圣杯战争就会由Caster组获胜。”


  “这是他绝对无法接受的。”


  “他从一开始，就看出这里是特异点了吗？”立香忽然开口，眼底满是疑惑，“既然现在的处境是他一手安排的……他应该早就想好解决办法了吧？”


  “当然。”“言峰士郎”微微颔首，话锋一转，语气沉了几分，“不过我此刻现身，对你们来说，大概是最坏的消息。”


  “他利用「神赐」剩下的权能，唤出月虹压制住了灵长类杀手的权能，本来做到这里就足够了，接下来只需等待冠位从者支援即可。”


  “但很明显，直到现在，也没有冠位从者出现。”“言峰士郎”顿了顿，补充道，“或者说，冠位从者来了，却被什么东西拦住了——具体原因我不知道。”


  立香咬了咬下唇，眼底闪过一丝坚定，轻声问道：“所以，他应该还有后手吧？”


  “有。”“言峰士郎”给出了肯定的答复，语气笃定，“激活月虹。”'

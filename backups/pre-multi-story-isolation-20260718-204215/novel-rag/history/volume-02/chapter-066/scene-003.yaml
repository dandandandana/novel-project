content: '那是爱尔奎特在迦勒底一行人出击迎击哈迪斯的时候问立香的话语。当时立香在天上回头看了爱尔奎特一眼，银发的真祖坐在那里，星之吐息被抽走九成后的面色比她见过的任何时候都要苍白。


  立香想了想。“不怕是不可能的吧，人怎么可能不怕死的吧。”她的声音在天上被真空削去了回荡，只留在爱尔奎特一个人的耳朵里。随后她又补充了一句，“应该只有士郎那种人是不怕死的。”


  “但是害怕又能怎么样呢？”立香喃喃道，“我有除此之外必须要做的事情。我要活下去，我要拯救这个世界，我要看清楚Ruler为什么会变成现在这样，我要试着去拯救他。”她把每一个“我要”都说得不一样重——最后一个最轻，轻到爱尔奎特几乎错过那个声音。


  “啊啊，这样啊。”爱尔奎特笑了。“有魄力呢，看不出来你是这样的孩子呢。”


  立香点了点头，然后把头转回去看着外面巨大的战舰。她的嘴唇张开了。“按照计划进行，走吧，玛修！”她的声音在空气中被顶得很远。“Ruler，准备月虹！”


  回忆在视网膜上烧了只一个瞬间就熄灭了。立香在冥界的地面上朝哈迪斯前进着。哈迪斯阻拦她的手段越来越千奇百怪——黑烟凝成的刀刃从地面往上撩，从虚空中飞出的尖锐石块，从脚底拉出的暗色泥沼。但她的脚步每一步都踩得稳稳当当，安魂的子弹清理掉了所有挡在她面前的东西。


  “够了，已经结束了。”哈迪斯淡淡地说着。他把手从身侧抬起来。“来吧。给她结束吧，复生吧，三头犬！”


  在计时塔前门被吉尔伽美什击杀了的三头犬从一旁的阴影中重新组成。它的三个头从黑暗里冒出来然后身体跟着从冥界的法则中成型。立香看着眼前的哈迪斯和三头犬，目测了一下自己跑的距离。


  【二百米了已经。】


  “结束了。”


  立香的耳朵在这一瞬间听到了一个她最熟悉的声音。不是哈迪斯，不是三头犬，是从冥界之外穿透了那一层亡者之域的膜直接灌进她意识里的从者的声音。


  “要上了御主！”


  听见了这句话的立香猛然睁大眼睛。她手背上的红色令咒在冥界的黑暗中没有变暗，而是亮得比任何时候都要刺眼——两道令咒的残光和英杰之帜的纹路在皮肤底下同时燃烧。“英杰之帜！”


  令咒上携带着的英杰之帜伴随着令咒启动，这份力量直接注入了立香体内。魔力灌进来的那一瞬间她的呼吸停了一拍，心跳也跟着漏了半拍——然后一切感觉都被放大了数倍，脚下的碎石纹理、空气中的滞涩感、哈迪斯骨杖上滑落的余温、三头犬从阴影中重组时的气体流动。立香的身形一瞬间从原地消失了。


  “什——”


  一百米，在立香的两个呼吸间就已经到了。哈迪斯和藤丸立香已经不到三个身位的距离，安魂被她从手枪变形成双剑，剑刃在空中划过极短的弧线朝哈迪斯砍去。金属与金属的碰撞声还没来得及响就被后续的斩击盖了过去。


  哈迪斯和藤丸立香已经不到三个身位的距离。安魂从她掌心变形——撞针收回枪膛，枪管从中对折，两侧的机械结构翻转再咬合，她在两个呼吸之间握住了两柄短刃。剑刃在空中划过极短的弧线，从哈迪斯的左肋切入然后往上撩。金属与金属的碰撞声还没来得及响就被第二刀的交叉斩切盖了过去。两剑把哈迪斯的人形终端从锁骨切到胯骨切了个对穿。


  ==


  “要上了，御主！”


  士郎在说完这句话之后猛然朝着眼前的机器冲去。哈迪斯的机器瞳孔看不出任何的波澜，他只是喃喃道了几个词语：“冥界，神界，人间。”那些词从机械的喉咙里吐出时带着共振后的低沉的余韵，在雨幕中被压成了一片片厚重的声音的碎片。


  他的身前出现出来了如同黑色的火焰一样的光球。不是火焰——哈迪斯看着即将抵达他的面前的言峰士郎，毫无表情地把四个字从嘴里推了出去：“宝具。解放。”


  黑色的火焰喷涌而出。周遭的气体被这份火焰的冲击波压到彼此碰撞然后剧烈地震颤起来，冲击波的边缘把雨水全部推开然后在空气中形成了一圈短暂的气泡状的真空域。士郎的身前张开了如同粉红色鲜花盛开一样的盾牌——炽天覆七重圆环的每一片花瓣在接触到黑炎的瞬间从边缘开始被烧化，花瓣一片一片地往下剥落然后消散在黑炎里。


  “结束了。”


  在盾牌彻底破碎之后，士郎迎着黑炎朝哈迪斯冲去。他的身子燃烧了起来——黑色的火焰从风衣的边缘舔过来烧到他的肩膀再过渡到后背。伤的重的地方皮肉被烧得翻卷起来，底下的骨头从碳化的组织里隐约露出轮廓。但他没有丝毫的减速。黑炎把他烧得浑身都是伤，却没能烧停他的脚步。


  于是他到了哈迪斯面前。'

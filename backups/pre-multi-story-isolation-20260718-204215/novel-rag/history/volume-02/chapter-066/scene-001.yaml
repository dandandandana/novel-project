content: '言峰士郎立在空中的时候暴雨从他的肩头砸过去。他的脚下踩着几块透明的砖块模样的东西，那些砖在雨幕里几乎看不见，只有踩上去时雨水顺着砖面淌出一条极薄的折射光弧。眼前的战舰在坍塌爆炸后只剩下少量的残骸正在从高空往下坠，拖着暗红色的火光朝伦敦郊外的方向划去。


  “啊，头一次见活着的人形终端啊。”士郎嘴里飘出这句话来。雨声把他的话削去一半的音量，剩下的那一半在潮湿的空气里散得很快。


  残骸中正在重组的东西东一块西一块地把自己拼凑起来。金属片从舰体碎片里飞出来互相撞击然后咬合，黑色的构件在雨中发出冰冷的锁定声。哈迪斯的人形终端从废墟里把自己一点一点地拽了出来——先是一只手扣住一块悬空的断板，然后把躯干从碎片的夹缝里往外拖。


  “你们——”刚把终端拼凑好的哈迪斯把视线钉在士郎身上。那具机器身体的瞳孔没有眼白，只有两个黑洞洞的金属圆环，但愤怒从他周身往外溢的程度把周围的雨滴都逼歪了方向。“你们做了什么？！”


  “把你花了几千年捡垃圾修好的战舰顺带把你刚刚复活的冥后轰成渣，就是如此吧。”士郎轻笑着说着。他把这句话抛得极轻，轻到哈迪斯几乎能听出舌尖从硬颚弹开时带出来的那一声清脆的碎响。


  “你们怎么敢？怎么敢的！”哈迪斯咆哮着，他的周身爆出黑曜石一样的圆盘。圆盘的边缘锋利到把雨水都切成了薄片，盘面在黑暗的天空中亮起古老的纹路。


  光炮朝着士郎轰去。黑紫色的光柱把空气中的水滴瞬间蒸发，在光束的路径上留下一道白色的气痕。士郎的身边复现出白色的菱形组成的壁障，壁障的每一片菱形都在旋转。光柱撞上壁障之后被从中央弹开，炸成无数条细小的光线朝着四面八方散射，散射的轨迹在雨幕里划出白色的弧线。


  “已经急昏头了吗？”士郎把这句话从壁障后面递出去，嘴角还挂着刚才那个轻笑。他歪头看着哈迪斯，琥珀色的瞳孔在壁障的半透明白光下被映成淡金的色调。


  “刚才用战舰主炮想要轰杀我们的人是谁呢？”士郎悠悠地说着。他的身形在话音落地的一瞬间动了。脚下的透明砖块被踩碎成无数细小的光点，那些光点还没消散完，他的身子已经切入了哈迪斯的两米之内。


  【什么？】


  哈迪斯猛地一愣。他完全没想到士郎会有这么快的动作——不是加速，是直接到了。他机械瞳孔里的焦距在雨水中闪了半拍，然后他把身子往后一仰，惯性让他的人形终端想要拉开距离。


  “啊啊，看样子被你低估了啊。”士郎说着，手中复现出一柄血红色的长剑。剑身不是从灵子里凝聚的，是直接从虚空里被他握住的。莱瓦汀——剑名还没出口，火焰已经从剑脊上猛然窜出来，火苗舔过剑刃的边缘将每一滴落在剑身上的雨水瞬间蒸成一小团白色的气雾。


  光炮从黑曜石圆盘上迸发出来。黑紫色的光束把雨水从中间撕开了一道真空的甬道，水滴在接触到光柱外围的电弧时就蒸成了白汽。然后白色的菱形壁障从士郎周身翻出来——壁障的每一片菱形都以各自的角度旋转，光柱撞上来的时候被从中央剖开，剖成了无数道细碎的光线朝四散飞去。那些分散的光在雨幕里拖着弧线的尾巴，像被扯碎的烟花。


  士郎毫不犹豫地将莱瓦汀挥向哈迪斯。血红剑身上的烈焰在劈下去的瞬间被拖成一道火红色的弧面，从哈迪斯的左肩一路斜劈到右腰。哈迪斯的机械身躯完全没能挡住这一剑斩击——金属外壳在剑刃和火焰的双重破坏下裂开一道巨大的缝隙。缝隙的边缘不是被烧焦的黑色，是被剑力劈开时金属断口特有的银白冷光。


  “就连这副身躯也有正常神明的战斗力啊。”士郎微微歪头，雨水从他的发梢上滑下去。


  “不愧是能和宙斯匹敌的机神哈迪斯啊。”言峰士郎的口中带着轻蔑的语气。他朝前迈了一步，靴底踩在悬浮于空中的透明砖块上发出一声短促的脆响。“哪里有典籍记载着你有这么强啊？”


  “胜利之剑——”哈迪斯身上那道被斩开的大裂缝正在被慢慢修复。金属的外壳像是有记忆般从断口的边缘往中间合拢，每一片碎开的部件都在往回飞然后重新锁合。他随后身上爆出猛烈的光亮，整个天空被黑紫色的光爆炸亮了起来。那个光不是照亮的——是把伦敦的天际线全部压成暗影然后再在暗影的边缘镶上黑紫色的轮廓。


  士郎迎着这份爆炸前冲。他的身子在光爆中出现了许多伤口——衣服被撕出无数道口子，风衣的下摆有一半被炸没了。但他冲过来的速度没有减慢丝毫。


  【他难不成处于极大的愤怒当中吗？】


  冥王哈迪斯总算是意识到了眼前的敌人为何充满着战意。那份战意不是燃烧的热，是冷的。是被人踩到某个底线之后从胸腔里翻出来的冷到极点的怒。


  【泄愤？】'

content: '轰隆！


  白色巨兽轰然撞碎希耶尔布下的光之壁，彻底挣脱封锁。刚与藤丸立香缔结契约的Archer猛地转头，身姿凛然地伫立在原地，周身涌动的魔力迅速凝聚成型，化作一只漆黑的冥界三头犬——獠牙外露，低吼着径直扑向白兽。


  二者体型差距悬殊，可这毕竟是冥王哈迪斯的守门犬。怎料白兽仅轻蔑地嗤了一声，尾巴如钢鞭般甩动，精准抽中空中的三头犬，将其狠狠砸在水泥地上，随后便像得胜的凶兽般，一口咬住三头犬的脖颈。


  冥界三头犬发出一声凄厉悲鸣，转瞬化作点点光粒消散。下一秒，Archer的箭矢已破空而来。


  他已然到了白兽十米开外，依旧维持着拉弓的姿态，漆黑的双眸死死锁定着眼前的怪物，没有丝毫松懈。


  神气与箭术的极致融合，九道漆黑箭矢再度划破夜空，直逼白兽而去。


  白兽突然发出一声尖锐咆哮，Archer闻声即刻挡在新任御主身前——那咆哮裹挟的魔力冲击，竟让九支箭矢像脆弱的枯枝般寸寸碎裂。


  【果然如此……】


  Archer握紧绑着军带的许德拉长弓，军带的魔力加持着这柄射杀九头蛇的神器，他猛地瞪圆双眼，周身气势骤然攀升。


  “射杀百头！”


  身形微屈，稳稳拉满长弓，弓弦震颤的巨响震彻天地。


  箭矢刚要刺入肉体，白兽却已瞬移般出现在Archer眼前。


  沉闷的撞击声响起，Archer硬生生接下白兽一爪，被巨大的力道震得后退两步，他低喝一声，伸手死死攥住白兽的鬃毛，抬脚狠狠踹向它的躯干。


  可白兽却像扎根大地的巨树般纹丝不动，反倒发出一声低沉的嗤笑，满是轻蔑。


  砰！


  白兽的巨爪狠狠砸向地面，大地发出不堪重负的轰鸣，水泥路碎裂成一块块的岛屿。


  Archer凭借着“心眼”的预警，堪堪侧身躲过这致命一击。这位来自希腊的大英雄，此刻终于真切感受到了绝望的彻骨寒意。


  【神话之中，从未有过如此恐怖的怪物……】


  心眼早已给出第一次预警，本该还有第二次提示——可这一次，Archer清楚地知道，自己恐怕很难躲开了。


  那白兽的动作快得像平地窜起的闪电，“刷”的一声，锋利的爪子已狠狠拍在Archer的腹部，将他打得连连后退，胸口一阵闷痛。


  “情况不妙，御主，这家伙是我无法抗衡的存在。”Archer对着魔力通讯器沉声对於立香说道，语气凝重却没有半分退缩，再度握紧长弓拉满。


  “什、什么？”


  守在士郎和玛修身旁的立香瞬间愣住，语气里满是难以置信的慌乱：“连Archer先生都无法抗衡的存在……”


  希耶尔收起治愈魔术的白光，看向Saber，语气干脆：“Saber，麻烦你守在这里，我去支援那个大块头。”


  “喂喂喂！终于连上了！你们还好吗？！”


  通讯器里突然传来奥尔加玛丽带着电流杂音的焦急呼喊：“那是什么恐怖的魔力波动？！该死！吉尔伽美什，要传送也提前说一声啊！”


  通讯器那头随即传来一阵劈里啪啦的电流杂音，紧接着，奥尔加玛丽的声音再次清晰传来。


  “立香，要是我们没看错，那只世界圣杯，就在你面前一百米处——现在就在Archer身边。”


  “什、什么？！”立香猛地一愣，下意识看向Archer的方向，声音发颤，“您是说……那只白色巨兽就是圣杯？”


  “不，应该是圣杯在它肚子里。”希耶尔语气平静地补充道，“这样一来，就只能杀了它才行。”


  “希耶尔前辈！您知道那是什么对不对？连Archer都打不过它啊！”立香转头看向身旁的蓝发修女，语气里满是急切。


  “凯茜帕鲁格。”希耶尔垂眸，语气平淡地吐出这个名字。


  “啊？”立香瞬间愣住，随即反应过来，眼里满是诧异，“芙芙？！”


  “对，就是迦勒底的芙芙——只不过，这个特异点里的这只，和你认识的那只可完全不同。”吉尔伽美什的声音适时从通讯器传来。


  “它是幼体的BEAST IV。”希耶尔语速极快地解释道，“没时间跟你细说BEAST是什么了，我必须立刻去支援Archer！”


  立香立刻收敛慌乱，清楚眼下轻重缓急，她用力点头，弯腰将士郎稳稳背在背上，看向Saber：“Saber小姐，玛修就拜托你了！”


  “希耶尔前辈，我们先回教堂了。”立香压低声线，语气坚定的开口。


  “等我护送他们回到据点，就立刻来支援你，希耶尔。”Saber单手扛起玛修，语气沉稳地应道。


  “我和Archer没那么容易死……算了，随你吧，法兰西的圣女。”希耶尔轻笑一声，腿部装甲瞬间迸发淡蓝色气流，身形化作一道流光，朝着Archer的方向疾驰而去。'

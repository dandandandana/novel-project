content: '不知道是向前了还是后退了，概念在脑子里已经碎成一团。直到——哒。沉闷的一声，一切骤然停止。


  玛修站在一间狭窄的办公室外面。她不在自己的身体里——她站在几年前的自己身边，看着那个穿着连身裙的粉色头发的小女孩。女孩很小，小到脚还够不到办公椅的踏板。“我们需要你走一趟，玛修。”来自计时塔政法科的人低头看着女孩，他们的表情带着不情愿却又不得不做的样子，手已经在往外掏文件了。然后一个男声在走廊里响起。


  “你们在这里干什么？”


  腰间别着单手剑的青年大步走了进来。他看都没看文件，径直走到政法科的人面前，他的肩宽把走廊堵住了一半——开口交涉的时候语调自然，但是给人很明显的安全感。玛修在旁边看着这个画面，瞳孔里的光抖了好几下。


  基尔什塔利亚·沃戴姆。制造她的那个人的大弟子。


  “那个人。”玛修的声音从嗓子里挤了出来。“那个人——那个人——”


  马里斯比利·阿尼姆斯菲亚的名字卡在她的喉咙里。


  “你被他制造出来是干嘛的？”声音的吟唱重新响起，这一次它的语速开始加快。“亚从者亚从者亚从者。”她把音节叠在一起往玛修的耳朵里灌。


  “不是……不是，不是——不是这样！”玛修猛地抬起脸，紫色的瞳孔里第一次冒出不是软弱的光。“我是玛修·基列莱特，我——”她看着眼前被拉长的画面，看着那个十几年前的自己，看着基尔什塔利亚站在政法科的人面前岿然不动的背影。


  “我不止是亚从者，我是玛修·基列莱特！”


  声音停滞了。所有的画面和所有的回音同时消失了。


  奥尔加玛丽站在她面前。玛修发现她已经不在刚才的办公室外了——这里是一个会议室，长桌两侧的椅子被拖得歪歪斜斜，咖啡杯底下压着还没归档的A4纸。奥尔加玛丽的表情十分笨拙，笨拙到让人一眼就看出她在努力让自己笑得好一些。刚刚接手迦勒底的所长朝着玛修伸出手。“你就是玛修吧，我是迦勒底的所长，有兴趣加入我吗？”


  玛修伸出手握住她的手。手心是温的，手指有点抖——不是她在抖，是奥尔加玛丽在抖。然后玛修的身形被拉长了。从一个需要仰头才能看清所长的小个子，一下子拉成了今天这副穿着第七圣典装甲的身体。她们握着的手没有松开。


  “你看来没搞清楚情况，玛修。”声音又回来了。


  “你加入了迦勒底。你清楚的知道你的任务是什么。”


  “身为盾兵，你该做什么？玛修·基列莱特？”


  “什么？”玛修的头如遭雷击——一道画面劈进她的颅骨。她倒在了地上。这个画面本身的温度太重了，重到她膝盖直接软了下去。她看见了。


  彻底被火焰吞没的管制室。玻璃在高温下炸成碎片飞溅在半空中被气流卷成螺旋。红色不是光——是整面墙壁在燃烧。人的叫声从很远很远的地方传过来，被火焰的轰鸣裹得模模糊糊。


  “你看起来已经想起来了。你看起来已经知道了。”声音轻轻地、轻轻地唱着。然后它的音节在空气中停顿了一瞬。“你的这份力量起源于死亡。你的这份力量是为了拯救。你做到了吗？”玛修趴在地上，手指摁在冰凉的灰白色地板上。地板的凉意从掌心一路传到心脏。


  “你为了保护那个家伙——你做了什么？玛修·基列莱特？！”声音第一次拔高了音调。


  “你舍弃了这份力量，然后——你为了你自己想要的，去做了什么？”


  “我想要的？”玛修缓缓从地上撑起来。手臂在发抖，手掌摁在冰凉的地面上把最后一缕冷气摁进了掌纹里。她半跪着抬起脸，紫色的瞳孔对着一片灰白色的空无一物。“是啊，这是我想要的。”她的声音很轻，轻到像是说给自己的。“我想要保护前辈。”


  “你也想要保护世人，他们都是人，不是吗？”声音绕回到她耳边。语速缓了下来，缓得让人起了一层不适。“你身为迦勒底的亚从者，你应该做什么？”


  “我身为迦勒底的亚从者——应该作为迦勒底的从者而战，应该为了人理而奉献。”


  “你失去了这份力量。”声音轻声开口，每一个字都黏在她的耳朵上。“你又能做什么呢？”


  玛修的身子撑不住了。她重新倒下去——这一次地板消失了。


  她重重摔在一片焦黑的大地上。手掌摁下去的时候摁碎了好几块被烧成炭粒的土块。土地的气息冲进鼻腔——不是普通的泥土味，是植被被烧成灰之后那股又干又焦的土腥气，夹着一丝冷风吹过来的炭灰。


  “看吧。”声音飘在惨白的天空上方。“这就是你们的毫无希望的现状。玛修·基列莱特。”它停了一拍。然后一个字一个字地砸下来。“你还不是什么都没有拯救吗？”'

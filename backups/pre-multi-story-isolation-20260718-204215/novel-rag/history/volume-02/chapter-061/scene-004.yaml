content: '她眼前的事物如同被拉长的拉面一样被拉长——惨白的天幕被拉伸成一道道细密的白色线条，焦黑的大地被扯成模糊的灰色带状物。然后天花板回来了。灰白色的、没有任何装饰的处刑处的天花板。


  玛修睁开了眼睛。


  她此时此刻身上穿着整套的第七圣典装甲——那件由独角马之角锻造而成的蓝黑色色铠甲从不动摇地包裹着她的身体，黑色全覆盖板甲的关节处泛着哑光。她的手中握着的并不是第七圣典所成的片手剑和盾牌，而是那个第一眼见到的巨大武装——那个黑匣子。她握在扶手的位置，掌心贴在冰冷的金属表面上。


  玛修就那样站在那里。站得笔直。然后深深的、把肺里最后一缕焦土残留的气味全部吐出来的，吐出一口气。'

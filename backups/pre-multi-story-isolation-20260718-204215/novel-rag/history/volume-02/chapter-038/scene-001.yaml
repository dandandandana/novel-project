content: '立香用两只手掌拍了拍自己的脸颊。不重，带着点仪式感，像是在按下某个重启按钮。拍完之后她的眼尾还是红的，鼻腔里残留着鼻酸退潮后的钝痛，但瞳孔重新对上了焦。


  她转向言峰士郎，刚把嘴张开一个起音的弧度，看到了他手里的东西。


  两只杯子。透明的，里面有气泡在往上翻涌。


  “……欸？“


  “青桔味的。“言峰士郎把其中一只递过来，自己端着另一只喝了一口。吞咽的动作很自然，喉结上下滚了一次，像他每天都这么喝似的。“做蛋糕的时候在厨房角落翻到的。所长大概不知道有这批库存，你记得喝完，不要剩。“


  他说“不要剩“的时候语气很平，和说“天花板上有个灯“没什么区别。但这四个字的底层逻辑是：迦勒底物资短缺期间，偷出来的东西如果被发现还剩半杯，性质就从“私自挪用“升级成了“浪费“。


  立香接过杯子，白了他一眼。


  “现在迦勒底不是什么都缺吗。你又做蛋糕又弄汽水的，被所长发现了怎么办。“


  “迦勒底什么都缺，吃的和能源倒是不缺。“言峰士郎靠回墙面上，杯子搁在胸前的位置，指尖搭着杯沿。“晚上你睡觉那会儿，我把厨房的供电线路修了一下。空调和照明的优先级已经排满了，厨房那边一直没人管。“他顿了顿，嘴角动了一下，“明天——今天，应该能吃上热饭了。“


  “欸？“


  立香抬起头。那个“欸“的音调和刚才看到汽水时的不一样，尾音往上翘了，带着点意外之后来不及藏好的高兴。


  “那还挺不错的。“


  她把杯口凑到嘴边，抿了一口。


  气泡在舌面上炸开的触感先于味觉抵达。青桔的酸涩被碳酸的刺激稀释成了一种清冽的凉意，从口腔蔓延到食道，把胸口那团闷了大半夜的浊气冲散了一点。无糖的。她对甜味饮料没什么执念，但在刚吃完半块蛋糕的前提下，无糖是更舒服的选择。


  她又喝了一口，满意地把杯子放到床头柜上。杯底和刚才搁蛋糕碟子的那圈痕迹紧挨着，在合金柜面上留下了一小片凝结的水珠。


  “好了，Ruler。“


  她盘着腿，膝盖上搁着两只交叠的手，姿势像在宣布什么重要事项。


  “我要说了哦。“


  “嗯。“


  言峰士郎点了下头。他端着杯子的手放了下来，整个人的重心微微往前倾了一点。那个幅度小到几乎看不出来，但他的注意力已经完全落在了她身上。


  “说到底嘛——“立香想了想，伸出食指指着他，“影响最大的还是你那句''活下去''。“


  她的食指在空中点了两下，像在标记一个坐标。


  “你那时候满脸都是血。“她的语速不快，咬字却很清楚，每一个画面都被她从记忆里拎出来摊在两个人中间的空气里。“半跪在地上，身上不知道断了多少根骨头，要把所有东西都塞给我的样子，那种感觉真的就是……就是……“


  她卡壳了。不是因为找不到词。是因为准确的词太重了，需要多吸一口气才能举起来。


  言峰士郎替她说了。


  语气平得像在念菜单。


  “……“立香盯着他看了一秒。然后她缓缓点了点头。“你可以这样理解。对，很不负责任。“


  “说得好像我有第二种选项似的。“言峰士郎用拇指蹭了一下杯沿上凝结的水珠，“当时都要死了，能留下的只有那几个字。你要我说什么？''帮我浇花''？“


  “你在冬木养花吗？“


  “没有。所以只能说''活下去''了。“


  立香嗤了一声，嘴角弯了一下。那个弯度持续了不到半秒就被她自己压下去了。


  “然后就是希耶尔和玛修。“


  她的声音在说出两个名字的时候降了半个调。不是刻意压低的，是喉咙自己做出的调整，像身体在为接下来要承受的重量提前收紧了什么。


  “不管怎么说，她们都是因为我……“


  她没有把“变成这样“说完。双臂环抱住膝盖，下巴搁上去，视线移到了天花板的方向。空调出风口的栅格在照明板上投下了一排等距的阴影，像乐谱上的横线。


  “我想不让她们失望。“她说，“我也想救回玛修。“


  安静了两拍。


  “但你也看到了，我就是个半吊子。“


  她的声音又低了一层。低到言峰士郎需要稍微屏住呼吸才能听清每一个音节。


  “Alterego说得没错，我没有什么才能。强化、同调、治愈，拿到圣杯战争的台面上连垫底都不够格。真正打起来的时候我什么都做不了，只能站在后面看着别人替我挡刀。“


  她说“替我挡刀“的时候咬住了那个“我“字，牙齿嗑在一起的力度让颊部的肌肉绷了一下。


  “但我没得选。“她吸了口气，胸腔因为这口气的容量而微微撑开。“我能怎么选呢？回东京去找我爸妈？“


  她笑了。


  那个笑容出现在她脸上的方式让言峰士郎的目光收窄了一瞬。


  “别搞笑了。“


  立香把脸埋进膝盖，声音被裤管的布料吸掉了一层，闷闷地传出来。


  “他们已经不在了。“'

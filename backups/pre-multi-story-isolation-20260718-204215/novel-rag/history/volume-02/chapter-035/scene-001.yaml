content: '鬼一般的寂静。


  测试室内的空气仿佛在希耶尔的质问落地的那一刻被整体置换成了真空。空调系统的低频嗡鸣、全息面板的微弱电流声、甚至金属墙壁因温差产生的细微胀缩声，一切环境音都在这片沉默中被无限放大，又在众人各怀心思的呼吸间被逐一碾碎。


  吉尔伽美什的猩红色眼瞳缓缓移向希耶尔。


  那是立香极少在这位黄金王者脸上见到的表情。不是愤怒，不是轻蔑，而是真真切切的、未经修饰的诧异。那双惯于俯瞰一切的眼眸中，某种被精心维护了数千年的全知自信出现了一道肉眼可见的裂痕。


  “杂修，你在说什么？“吉尔伽美什的声音比平时低沉了半度，尾音微微上扬，像是他从王之宝库里面的骤然拔出却发现刀刃缺了一个口的名刀一样，“怎么可能？“


  “我也想问怎么可能。“希耶尔没有退让。她站在测试室中央，病号服松垮地搭在消瘦的肩头上，腕间的医疗监测带随着她缓慢而有力的呼吸微微起伏。苍白的面孔上没有半分怯意，蓝色的眼眸直直地对上了吉尔伽美什的视线。


  “在你用这四年筹办迦勒底的时候，神琦灰可是实打实地以第二位号炮的身份，在埋葬机关活动了四年之久。“


  “本王确确实实不知道。“


  吉尔伽美什的回答干脆而坦然。没有辩解，没有推托，只是一句纯粹的事实陈述。她的嘴唇微微抿成了一条直线，金色的碎发垂落在颈侧，冷白灯光在她的瞳孔中投下两个冰冷的光点。


  “等等，吉尔茜。“


  立香忽然开口了。


  她的声音不大，但在这片凝固的空气中却拥有了某种不容忽视的穿透力。她微微侧过身，橘色的虹膜在灯光下收紧了焦距，目光锐利地锁在吉尔伽美什的面庞上。


  “你的意思是，这四年里，你不知道埋葬机关第二席正在正常活动？而且，希耶尔前辈多次来找你，也没有跟你提起过？“


  吉尔伽美什微微挑眉，猩红的瞳孔中闪过一丝微妙的光芒。她没有说话，只是轻轻抬了抬下巴，示意立香继续。


  “一个大名鼎鼎的埋葬机关代行者。“立香的手指搭上了自己的下巴，拇指在颌骨上轻轻摩挲。那个细微的习惯性动作让在场的人意识到，此刻的她已经从被动的信息接收者切换成了主动的逻辑推演者。“在这四年间的活动肯定举足轻重。而你作为迦勒底的建设者，消息渠道应该是极其通畅的。你却一点消息没有收到。“


  她停顿了一拍，目光从吉尔伽美什转向希耶尔。


  “希耶尔前辈也没有告诉你。“


  两个独立的信息源，同时出现了对同一人物的认知空白。


  “我觉得——“立香的声音在说出下一句话之前短暂地压低了，像是在确认自己的推论足够坚实，“是你们两个出现了问题。这个问题的原因，是有人做了手脚。“


  这句话一出口，测试室的空气像是被一只无形的手猛然攥紧了。


  吉尔伽美什的瞳孔骤缩。那一瞬间的变化极其细微，细微到只有立香这种长期与她相处、习惯了观察她每一个微表情的人才能捕捉得到。那双猩红色的眼眸在不到半秒的时间里经历了震动、怀疑、验证、确认四个阶段，最终定格在了一种沉冷的了悟上。


  “本王有A+的对魔力……“她低声说道，声音中残存着最后一丝不甘心的抵抗。随即，那个未完成的句子像是被某道突然亮起的闪电劈断了。


  “等等。“


  她闭上了眼睛。


  再度睁开时，猩红的虹膜深处已经没有了任何动摇。


  “如果是神琦灰的话，确实能够做到。“吉尔伽美什的声线沉稳而笃定，像是在宣读一份不可更改的判决书，“她是本王见过最强的魔术师。没有之一。“


  “哈？“奥尔加玛丽的声音从旁边传来，带着一种无法抑制的困惑，“你说教会的人是最强的魔术师？“


  “嗯……她比本王要古早得多。“吉尔伽美什轻描淡写地吐出了这句话。就像在陈述太阳从东方升起一样自然。在场的所有人却都感受到了这句话的分量，“是个老家伙。”


  “本质上来说，埋葬机关里面都是异类，甚至没有人信教。有个魔术师很正常。“


  “继续，吉尔茜。“立香开口道，语调简短而有力。


  “哼。事实不是很明显了吗？“吉尔伽美什将双臂交叠在胸前，金色的发丝在她微微偏头的动作中从肩侧滑落了几缕。“她利用魔术给本王和希耶尔下了认知障碍。让本王不会去留意神琦灰的消息，认知层面上停留在她已经死亡的地方。而且不会有人主动跟我提起。“


  “等等……你还有对魔力A+，而且这是大范围的暗示啊！“奥尔加玛丽的声音不自觉地拔高了，眼底翻涌着属于亚尼姆斯菲亚家族后裔的学术性震撼，“这种级别的魔术只有神明才能做到了吧！“


  “哼……“吉尔伽美什幽幽地开口，声音里裹着一层冰冷的叹息，“世上可没几个神明能战胜她的。“'

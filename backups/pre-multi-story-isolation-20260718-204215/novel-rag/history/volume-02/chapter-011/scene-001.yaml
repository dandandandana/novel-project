content: '大楼轰然倒塌的烟尘中，虽再度给希耶尔创造了击杀Archer的机会，可方才令咒为Archer补满试炼次数的举动，还是狠狠挫伤了她与Saber的士气。希耶尔腿甲喷出淡蓝色气流，稳稳辅助她快速下坠。


  “希耶尔？！”


  Saber瞪大双眼，语气里满是错愕：“和计划的不一样！”


  “还提什么计划！没发现我们刚才全白打了吗，Saber！”希耶尔咬着牙怒吼，一脚踹向Archer，却反被对方一把扣住脚腕，狠狠甩了出去。


  “不对……”


  Saber迅速调整姿态，额角微蹙——启示清晰地告知她，Archer的危险等级正在下降。


  或者说，Archer已经不再是敌人了。


  她下意识望向柳洞寺的方向。


  下一秒，一道既像婴儿啼哭、又似绝境悲鸣的兽吟，从柳洞寺深处传来。


  “啊啊啊啊啊——！”


  这声音裹挟着强烈的精神干扰，即便对魔力极高的Saber，也没能完全免疫，只觉得头痛欲裂，太阳穴突突直跳。


  一道白点从柳洞寺顶端腾空而起。


  “不对……”


  启示在脑海中疯狂报警，警示着致命的危险。


  “希耶尔！我得去找我的御主！”


  此时，一腔怒火的希耶尔正与Archer在地面缠斗，竟奇迹般地稍稍压制了对方。听到Saber的话，Archer猛地推开希耶尔。


  “停下！修女！”


  “嗯哼？去吧Saber！这大块头我来拖住！”希耶尔扬手将第七圣典变形为步枪，枪口微微抬起。


  “我和Caster的契约断了。”Archer伫立在原地，轻声开口，缓缓举起双手，“我现在不想与你们为敌，令咒的束缚也消失了。”


  “嗯？！”希耶尔挥动武器的动作骤然停住，眼神里满是警惕，“谁知道你是不是在耍花招……”


  “希耶尔前辈！紧急支援！”立香急切的声音突然从魔力通讯频道中传来，带着明显的慌乱，“尼禄·卡奥斯在这里，还有一只卡车那么大的白色巨兽！”


  “了解！”


  轰隆一声，希耶尔纵身跃起，朝着一旁未倒塌的大楼疾驰而去。


  Archer望着她的背影，沉默片刻，也纵身跃起，稳稳落在希耶尔身侧。


  他不清楚Caster为何会单方面解除契约，也无从知晓对方是否留有后手。


  但他隐约觉得，跟在这名拥有不死性的修女身边总不会错——即便美狄亚还有阴谋，届时对她出手，也不算违背昔日的指令。


  他催动千里眼，目光穿透夜色，望向大陆的另一端。


  另一边，立香和士郎好不容易解决掉尼禄放出的几只魔兽，尼禄却缓缓鼓起掌来，嘴角挂着诡异的笑意。


  “原来这位小姑娘也并非等闲之辈啊。”他饶有兴致地看着二人，语气轻佻，“那么，就给你们送上一份大礼吧。”


  刺耳的哀嚎声骤然响起，立香只觉得头昏脑胀，浑身像是要被撕裂一般，剧痛难忍。


  痛感褪去后，又是一阵天旋地转，仿佛身处梦境与现实的夹缝，既像要醒来，又像要彻底坠入深渊。


  【我这是……】


  痛。


  热。


  模糊的地面，绝望的绝境。


  她仿佛回到了迦勒底爆炸的管制室。


  【这里是……管制室？】


  她恍惚地摇了摇头，喃喃道：“不对……”


  耳边传来低沉的喘息声，更让她坚信了自己的错觉。


  【管制室爆炸时，我明明不在那里……】


  烈焰扑面而来，灼热的温度无比真实，几乎要灼伤她的皮肤。


  【这里真的是管制室吗？明明……】立香双腿一软，重重跪坐在地上。


  “主啊，赐予我怜悯；主啊，赐予我饶恕；主啊，赐予我祝福。”


  柔和的白光从身旁泛起，可立香此刻早已无暇顾及，鼻尖萦绕着电路焚毁的焦糊味，每一缕气息都在告诉她——这里就是那个绝望的管制室。


  【我已经死了吗？】


  她绝望地认定了这个答案，正当她准备任由烈焰将自己吞噬时，一个不算宽阔的胸膛突然将她紧紧拥住。


  “还活着……藤丸立香！你还活着！”


  这声呼唤将立香从混沌中拉回，少年的声音带着难以掩饰的颤抖，一遍遍重复着：“你没有死！立香！”


  “我知道了……士郎，谢谢你。”立香颤抖着开口，下意识地往他怀里缩了缩。


  她的脸颊紧紧贴着言峰士郎的胸膛，感受着他有力的心跳和温热的体温，才勉强找回一丝活着的实感。


  忽然，有粘稠的液体滴落在她的头顶。


  立香缓缓抬头，映入眼帘的，是士郎血迹斑斑的脸——红色的液体从他的眼角、鼻孔、嘴角和双耳缓缓渗出，触目惊心。


  “发生了……什么？”立香瞪大双眼，轻轻从他怀里挣脱，声音里满是慌乱。


  “用了高阶唤醒术和清醒术，救下这小姑娘了吗？”路的尽头，尼禄缓缓开口，替士郎回答了这个问题，语气里满是戏谑，“可你自己呢？精神污染和高阶洗礼咏唱的代价，滋味不好受吧？”'

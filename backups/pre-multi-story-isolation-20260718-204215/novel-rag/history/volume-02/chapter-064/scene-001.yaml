content: '“机神？”玛修把斧柄撑在碎裂的石板上，雨水顺着她板甲的肩线淌下来汇成一道道细小的水流从护肘滴落。她的呼吸还没完全平稳，胸口仍在剧烈起伏着。“你这是什么意思？”


  Alterego歪着头，雨水从他的发梢滑过颧骨再淌到下巴尖上滴落。他的嘴角微微往上提了一分，那层薄薄的皮肉在雨幕里显得越发惨淡。“字面意思。”他把视线往身后一甩，暴雨砸在他肩上的声音像是无数小石子洒在布面上。“希腊众神本质上都是来自外星母舰里的战舰，其中哈迪斯就是之一。”


  玛修张开嘴刚想追问。她身后的铁门被推开了。门轴在潮湿的空气里发出一道拉长的金属呻吟，那扇半掩的铁门被人从内侧往外推开，门沿上的铆钉在昏暗里闪了一瞬。


  红发的男人从门口走到门沿边。


  雨水从他的视野边缘洒进来打在他脚下的石板上溅起细碎的水花。一个微笑从他嘴角慢慢推开来，那个笑从嘴形上看是暖的，但从他琥珀色的瞳孔里看去有一层收不住的冷在底下涌着。“谢谢你的信息。”言峰士郎的声音轻飘飘的落在雨声里。


  玛修看见他的表情，整个人往后缩了一拍。她手指不自觉地收紧了斧柄。从她认识言峰前辈开始她就没见过他这样笑过——那种笑把空气都压薄了，像是有人在一张薄纸上轻轻划了一道看不见的裂口。


  Alterego歪过头来。他的视线越过玛修的肩膀落在士郎脸上的时候瞳孔里掠过一道极微的闪烁。“哦？”他笑得比刚才更深了些，笑声从喉咙里一层一层往外翻，在雨幕里回响之后失真成一段被浸泡过然后变形的信号。“你那个表情，很讨厌我啊——”


  “自然。”言峰士郎的面色在开口的一瞬间变了，那个微笑从他嘴角收走的时比撒纸屑还干脆。他的脸沉下来之后整张面部只有那双琥珀色瞳孔还亮着，其余的部分都陷进了雨光投射的阴影里。“毕竟差点让我御主死掉的可是你啊。”


  他把这句话的尾音往上提了一分。不是升调问句的提，是把“你”字往外推出去然后让它悬在那里不收回来。他从门沿上迈出了脚步，靴底踩进积了半指节深的雨水里发出啪的一声闷响。


  Alterego往后退了一步。他不是害怕——他退的那一步是懒散的，像被风吹歪了一下。“你忘了这是冥河水了吗？一旦碰到灵魂就会去冥界哦。”他说完这句话眨了眨眼，雨珠子从他睫毛上被弹飞出去。


  言峰士郎轻蔑地笑了一声。那个笑是从鼻子里喷出来的一口短气，没有预热没有停顿直接扔出来。“但是我不会。”他走进暴雨里，雨水浇在他的肩头上把他的风衣从浅色浇成了深色，整个人在雨幕里像是被水吞了一半的剪影。“你不也是如此吗？”


  “言峰前辈！”玛修把斧头从地上拎起来，手腕上的蓝色纹路亮了一瞬又灭了下去。“现在不是处理这些事情的问题！”她刚刚往前迈出左脚，靴底刚踩进雨水的边缘就听见士郎的声音从暴雨里劈过来。


  “你们不行。”


  “哼哼哼哼——”Alterego愉悦地笑了起来，笑声在雨幕中断成一段一段被水声盖过去的碎片。他把一只手捂在额头上，手指从额头滑过被雨水打湿的发际线停在后脑勺上。“哈哈哈哈哈哈！”


  “说到底，还不是因为你压根不算人了吗？言峰士郎。”Alterego捂着额头狂笑着，笑声从指缝里漏出来被雨声压过去又被下一阵笑声顶出来。“哈哈啊哈哈！”他的身体被笑得往后仰了一拍，整个人像是站在雨中被人推了一把又弹回来。


  言峰士郎的目光带了些疑惑。他站在离Alterego不到三步的地方，雨水从他的脸颊两侧淌下去。他手里的黑键没有动——三把黑键从指缝里露出的刃尖反射着雨幕里破开的那一点点天光。“你不是有我的记忆吗？”


  “那又怎么了？”Alterego把手从额头上放下来，露出了被雨水和手指蹭得有些紊乱的刘海。他的笑还残在嘴角上。


  “那你应该早就知道了——”言峰士郎把这句话拖得很慢，每个字的间隔被雨水声填得很满。“我早就接受了这个事实了吧。”他把“接受”两个字从牙齿间推出去的时候语调里没有任何多余的情绪——不是骄傲不是释然，只是一个报告事实的人会用的那种声音。


  “啊啊，确实是这样——”Alterego往后扭了一下身子，腰部在空气中划出一道很浅的侧弯。“所以我才觉得很好笑啊——”他把最后一个“啊”字的尾音拖长了之后用舌尖在硬颚上轻轻一弹收了回来。


  “这有什么好笑的？”言峰士郎歪头，笑容重新挂回他的嘴角上。那个笑和他刚才的危险微笑不一样，是真正的笑着在反问。


  “因为我是你的赝品，所以我很了解你啊——”Alterego把这句话说得很慢，语气淡得像在絮叨一个已经听腻了的旧笑话。'

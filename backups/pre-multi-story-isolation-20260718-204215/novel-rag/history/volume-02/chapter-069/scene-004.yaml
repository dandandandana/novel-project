content: '“你比我坚强多了，你的承受能力也比我强，不要太小看了你自己。”士郎的手还放在她头上没有挪开。他说话的声音维持着同一个音阶，像是在叙述一个不需要被反驳的事实。“你所缺乏的只是经验和成长罢了。而且，我也在你身边——压力过大了来找我就好了。就算你不来，我也会来找你的，我不会让你被压垮的。”


  “那我相信你了，言峰士郎，虽然很难以让我相信。”立香嘟囔着。她用手肘撑起自己的上半身，另一只手的手背快速擦过眼角然后把那只手压进裤袋里。她瞪大了眼睛看向士郎，“还有什么吗？”


  “没了。”


  “那我明天要吃——我没什么想吃的，吃西餐吧。”


  “收到，御主。”士郎转身朝门口走去。他握上门把手时回头看了一眼立香，她已经重新把自己平摊在床上，盯着天花板上的暖色灯光在墙面上投下的那圈椭圆形的光。


  等到士郎离开了立香的屋子，门锁扣上的咔嗒声在只亮着一盏灯的房间墙壁上弹了三次之后落进了床脚的袜子里。立香躺在床上盯着天花板，她开口对自己说的话轻到只有枕头能听见：“到最后被他说教了——明明想问问他的事情的。”


  她翻了个身，把被子拉到脖颈处掖好。“算了，以后还有机会。期待一下明天的西餐算了。”'

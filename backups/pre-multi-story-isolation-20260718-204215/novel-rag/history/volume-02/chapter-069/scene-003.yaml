content: '“嗯。”立香点了点头。她的手放在膝盖上，手指把膝头常服裤子的布料攥出几道褶，眼神涣散开来。“感觉——夺走人的生命什么的——我自己能做出来这种事——”她的声音断断续续的，像是每吐出一个词都要在自己脑子里先确认一下这个字是不是自己愿意说出口的。


  “我完全没想过啊。哪怕是在特异点F，也是跟一场梦一样。”立香说着，重新端起汽水喝了一口。冰凉的碳酸水从喉咙滑下去时把她从记忆的碎片里短暂地拉出来了一秒。“我懂了。”立香看向士郎，“自从那之后，我就彻底明白了，那不是梦，不是假的。我真真实实的是一位拯救世界的御主了。”她盯着士郎，语气在最后几个字上忽然稳了下来。然后她挠了挠脑袋。“第二次杀哈迪斯就好很多了，没有怎么恶心。”


  士郎看着立香。他的嘴角在低头的同时往上牵了一下，笑容的幅度压得很低但眼底的琥珀色被灯光照出了一层润泽的光。“这样啊，我还以为你会恶心的想吐呢。”


  “我哪有你想的那么脆弱。”立香刚说完这句话，她的瞳孔忽然收紧了。剁成碎肉的样子在她脑海里弹了出来——提亚瘫倒下去的那个瞬间，那些碎片在视网膜上贴了一层薄薄的红色滤镜。“你——你指的是这个？”她的声音拔高了半个音阶。


  士郎歪了歪头。他从床头柜上拿起汽水瓶，把瓶口凑到立香嘴边，喂了她一口水。“没准以后有更凄惨的。”


  “你这个混蛋！”立香推了士郎一下。手掌撞在他胸口时力道比她预想的更大，他往后退了小半步。“那不是你的武艺吗？”


  “嗯，死徒需要切的粉碎。”士郎点头。他的肩膀还没有完全从被推的余力里恢复正位，但他先伸手把立香肩上滑下来的发尾顺回原位。“对不起。”


  “你——好了！”立香瞪了士郎一眼。她的眼睛在暖色灯光下被瞪开的瞬间泛出了一层极薄的水光——是灯光的反射还是眼泪不太好分辨。“不要说对不起，你是我的从者，我相信你一定是做到最好的了！”


  “嗯？这么信任我？”士郎后退一步。他把两只脚跟并在一起，然后俯下了上半身——完完整整的九十度鞠躬。衣领在他弯腰时往肩膀的方向滑了半寸，露出后颈处那道还没完全被治疗魔术抹平的疤痕。“我不会辜负你的信任的。”


  立香摇了摇头。她把视线从他后颈的那道疤上移开。“这都是套话，我现在看出来了——用行动证明就好了。”


  “好。”士郎直起身子。他顿了顿，把脚尖朝向立香的方向重新调整了一下。“第二个话题。”


  “嗯？”立香抬眸看向他。她一口气把汽水喝完，瓶中残留的液体在翻倒时发出咕嘟的闷响。然后她的目光越过士郎的肩膀落向墙上的时钟，指针指着十点整。“给你半个小时。”


  “感觉有压力了吗？”士郎的语气忽然降了下来。他把立香最后一块凌乱的地方——床头柜上那几团用过的纸巾——攥在手里丢进垃圾桶。


  立香张了张嘴。一瞬间她感到自己的血液从胸口往上涌，整个面庞如同被热毛巾捂过了一般发胀。“你——怎么可能没有啊！你在说什么？”她连忙扭了过去扑到床上，胸口撞在枕头上发出一声闷响。她的脸埋在枕头里，不确定士郎是否看到了她滑下来的发丝下泛红的眼眶——也许没有，也许是灯光问题，她把脸往枕芯里埋得更深了寸许。


  “嗯，我当然知道。我知道你不会说。”士郎没有动。他只是把立香喝完的汽水空瓶换成一瓶新的，拧开瓶盖之后把瓶口放在床头柜上靠近她手边的位置。“你是迦勒底的御主，我知道你有很大的压力，你也知道不只是你有压力，所以你不会说出口。但你可以跟我说——别担心，我是你的从者，我为你分担是我应该要做的事情。”


  “嗯，还有别的要说的吗？”立香的声音从枕头里闷闷的传出来。


  “别怕，立香。”士郎顿了顿。他往她身边走近了一步，靴底落地的声音很轻。“我，玛修，整个迦勒底都会在你的身边和你并肩作战的。我虽然不能向你保证努力一定会有好的结果——出了失误就有可能会死——”他看着立香的后脑勺，她头发在枕头上铺成了一小片散乱的橘色云。“但我能保证的是——既然选择了，去做就好了。”


  “立香，向死而生吧。”士郎走到立香的身边。他的手掌落下来覆在她头顶时手心是干的，掌纹的纹路隔着头发丝传过来。“向死而生，这样就毫无顾虑了。”


  立香任他揉着。她脑后的几根头发被他的指缝夹住然后轻轻梳开。“哪有那么容易——你觉得我和你一样吗？”她的脸还是埋在枕头里，声音闷闷的。'

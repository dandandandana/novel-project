content: '意识挣脱混沌的瞬间，最先袭来的是一阵混杂着泥土与沙砾的窒息感——脸颊沾满了湿冷的泥块，睫毛上黏着的沙粒重得抬不起来，鼻腔和口腔里全是粗糙的沙泥，不用想也知道，自己定然是摔了个结结实实的狗啃泥，太阳穴还在突突地跳着。


  【必须站起来——】


  这是藤丸立香恢复意识后，脑海里冒出来的第一个念头。她试探着动了动左腿，指尖刚触到裤管，一阵钻心的剧痛就顺着骨头缝窜上来，额角瞬间渗出细密的冷汗，肯定是骨折了。


  她用仅能动弹的右手撑着地面，一点点挪动身体，粗略检查了自己的四肢：左臂和左腿都传来钻心的痛感，显然是骨折了，右侧肢体倒还算完好，大概是坠落时用左侧身体先着地缓冲，才保住了半边身子。


  立香咬着牙，想用右手擦掉脸上的沙土，可指尖刚抬起，就听见周遭传来一阵令人牙酸的声响——那是骨骼碰撞的“咔哒”声，干涩、冰冷。


  没有血肉，只有白骨相互摩擦的脆响，在寂静的丛林里格外刺耳。


  伴随着一股令人作呕的、阴冷的魔力扑面而来，立香的心脏猛地一缩，一股寒意从后颈窜到脚底——她瞬间意识到，自己恐怕要葬身在这里了。


  “前辈！”


  熟悉的少女声线突然划破丛林的寂静，紧接着就是铁器撞击骨骼的“哐当”脆响，夹杂着骨头碎裂的“咔嚓”声。


  “咳、咳咳……玛修？”立香咳出一大口混着沙土的唾沫，勉强掀开沉重的眼皮，用右手撑着半边身子，朝着那道举着盾牌的纤细身影望去。


  “是的，Master！”玛修的声音带着一丝急促，却依旧坚定，“Shielder玛修·基列莱特，随时听候您的指示！”她手中的盾牌死死抵着扑来的骷髅兵，肩膀微微颤抖，显然已经撑了许久。


  “Master吗……”立香苦笑着垂下眼，一股难以言喻的绝望涌上心头，“我这种半吊子，也配当Master吗？”


  她艰难地扫视四周，才发现自己身处一片漆黑的丛林，密密麻麻的骷髅兵正从四面八方围过来，空洞的眼窝泛着幽绿的光，而玛修正独自举着盾牌，拼尽全力抵挡着前方的攻势，额角的汗珠顺着脸颊滑落。


  【我现在，就是个彻头彻尾的累赘啊……】


  立香的心一点点沉下去，自己半边身体骨折，连站都站不起来，只能倒在这里拖玛修的后腿。可她比谁都清楚——


  【如果玛修一直在这里保护我，我们两个人，都会死在这里的……】


  立香咬着下唇，直到尝到一丝血腥味，才用尽全力开口，语气里带着不容置喙的坚定：“玛修！我以Master的身份命令你，立刻自己突围！”


  “什么？！Master！我拒绝执行！”玛修猛地回头，眼底满是急切，手中的盾牌差点被骷髅兵的长剑劈中。


  “玛修！你带着我，绝对无法突围的！”立香的声音带着一丝哽咽，却依旧强迫自己冷静，“我只是个半吊子魔术师，和普通人没什么两样，你……你自己离开，去找希耶尔前辈，别管我！”


  “拒绝。”玛修用盾牌狠狠磕飞身前的骷髅兵，喘着粗气，语气却没有丝毫动摇，“我是Master的盾，绝不会丢下您一个人。”


  泪水瞬间模糊了立香的视线，她咬着牙，几乎是吼出来的：“那我就用令咒！玛修，我命令你离开！”


  “抱歉，Master。”玛修的声音低沉却坚定，“我们之间还没有建立正式的契约，令咒对我无效——但无论如何，我都会守护您到最后一刻。”


  “也就是说……令咒也没用吗？”立香的声音瞬间垮了下来，她看着越来越近的骷髅群，玛修的后背完全暴露在死角，几具骷髅已经举起了锈迹斑斑的长剑，朝着她的后心劈来。立香绝望地闭上了双眼，一行泪水顺着脸颊滑落。


  【这样也好……我死了，玛修就能顺利突围了吧？】立香的心里又酸又涩，【可我明明……明明也想活下去，明明也想成为能保护玛修的Master啊……】


  就在长剑即将触碰到玛修后背的瞬间，一阵细碎的破空声传来，紧接着，一道刺眼的白光在立香眼前炸开，驱散了周遭的阴冷。


  白光太过刺眼，立香下意识眯起眼睛，等视线渐渐清晰，才发现眼前的骷髅群已经倒下了大半。清冷的月光透过树叶的缝隙洒下来，映出一道挺拔的身影——红发如燃，一身一丝不苟的黑色修道服衬得身形清瘦，手中握着几柄泛着冷光的投掷黑键，少年缓缓转过头，茶色的眸子平静地落在立香身上，没有半分波澜。


  立香趴在原地，呆呆地看着眼前的少年，一时间竟忘了呼吸——她从未见过这样的人，明明身形纤细，却透着一股生人勿近的凌厉。


  少年只是淡淡扫了她一眼，便立刻收回目光，手中的黑键应声飞出，精准地刺穿了正朝着玛修死角袭来的骷髅兵的颅腔，动作干脆利落，没有一丝多余。'

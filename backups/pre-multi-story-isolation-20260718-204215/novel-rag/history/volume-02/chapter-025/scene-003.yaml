content: '“你们所处的地方，“Alterego打断了她，声音平稳得像是在念一份报告，“是由圣杯形成的虚假人类史。“


  立香的声音卡在了喉咙里。


  “这个特异点和其他的都不一样。“


  Alterego的目光从立香身上移开了。他仰起头，看向被铅灰色雨云覆盖的天空，暴雨从他头顶倾泻而下，但在距离他面孔几毫米的位置分流滑落，他的睫毛甚至没有沾上一颗水珠。


  “其他特异点——由于圣杯介入的时间节点各不相同，有些已经发展了很长的时间。在那些特异点里，偏差已经积累到了足够的程度，形成了真正意义上的''人类史''。它们有自己的历史惯性，有自己的因果链条，有生活在其中的、真实的人。“


  他顿了一下。


  “而这个特异点——圣杯降临的时间很短。偏差还没有来得及扩大。所以这里离你们原本认知中的世界，差得并不远。“


  “这些……和投降有什么关系？“立香的声音很低，但很稳。


  “关系在于——“


  Alterego将视线收回来，重新落在立香脸上。


  “等你们回到迦勒底——如果你们还能回去的话——你们面对的，将是整个世界被毁灭，以及人类史被烧却。“


  沉默。


  暴雨的声音忽然变得无比清晰。


  立香的嘴唇动了动，但没有发出声音。


  “藤丸立香。“


  Alterego念出了她的全名。那是他第一次在这场对话中使用她的名字，三个音节被他用一种奇异的、近乎郑重的语气念出——但那份郑重不是出于尊重，而是出于某种冰冷的仪式感，像是在宣读一份判决书上被告的姓名。


  “我有着对从者特攻。而你们迦勒底的技术核心——是召唤从者。“


  他停了两秒。


  让这句话的意义在暴雨中充分展开。


  “对我而言，你们压根不是我的对手。“


  “投降。“


  他第二次吐出了这两个字。语气与第一次完全一样——平淡、陈述性的、不容商量的，像是在说一个不可更改的物理定律。


  【迦勒底的技术是召唤从者——】


  立香的瞳孔骤缩。


  【他为什么知道？】


  迦勒底的英灵召唤系统——那是迦勒底最核心的战力根基，也是被严格保密的情报。普通人不可能知道。其他特异点的敌对存在不可能知道。甚至绝大多数的从者，如果不是经由迦勒底召唤的，也不可能对这套系统有任何了解。


  但他知道。


  他不仅知道迦勒底能召唤从者，还知道那是迦勒底的技术核心。


  这意味着——


  立香的思维像是被一道闪电劈中了。


  碎片在她脑海中飞速拼合：他去过迦勒底。他对迦勒底的内部运作了如指掌。他熟悉到能够一语道破迦勒底最核心的战略资源。


  管制室。


  那场爆炸。


  那场将迦勒底几乎全部摧毁的爆炸——炸毁了管制室，切断了大半通讯设备，杀死了那么多人。那么多……还没来得及执行任何任务就被埋在了废墟下的人。


  是他。


  一定是他。


  他炸毁了管制室。


  “你……“


  立香的声音开始发抖。不是恐惧的颤抖——而是某种更灼热的、从胸腔深处翻涌上来的东西正在冲击她的声带，让每一个字都带着不可遏制的震颤。


  她的眼眶发红了。


  不是要哭。是愤怒。一股纯粹的、不掺杂任何计算和权衡的怒火从她的腹腔深处升腾起来，烧过胃、烧过肺、烧过喉咙，在她的口腔里化作一种滚烫的铁锈味。那些面孔——那些她在迦勒底走廊里擦肩而过的、冲她微笑过的、和她说过“早上好“的面孔——一张接一张地在她眼前闪过，每一张都在加剧那股怒火的温度。


  “怎么可能向你这种家伙投降……“


  她的声音压得很低，低到几乎被暴雨吞没。但下一句话——


  下一句话是吼出来的。


  “绝对不可能！你害死了那么多人！！“


  那声怒吼撕裂了暴雨的白噪音，在柳洞寺的石阶间回荡，被山壁和古木反弹回来，叠加成一道沉重的余响。


  Alterego愣住了。


  他的表情是真的变了——那面一直保持着完美弧度的微笑，在听到“你害死了那么多人“这句话的瞬间，像是被一只无形的手从脸上擦去了。取而代之的不是愤怒，不是冷笑，不是被触到痛处后的反击——


  而是困惑。


  真真切切的、毫无伪装的困惑。


  他的眉心微微皱了起来，那双镜面般的眼睛里第一次出现了某种能被称为“情绪“的东西——但那种情绪不是恐惧，也不是心虚。那更接近于一个人在听到一句完全不相关的指控时产生的、单纯的茫然。


  “啊？“


  他似乎真的在仔细回想着什么——他的视线往右上方偏了一瞬，那是人类在调取记忆时的无意识动作。他在搜索。在检索自己的行为记录中，是否有任何一项与“害死了那么多人“这个指控相匹配的条目。


  那个搜索只持续了不到两秒。'

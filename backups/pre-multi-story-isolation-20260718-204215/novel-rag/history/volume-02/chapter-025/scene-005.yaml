content: '贞德的身体像一枚被击出的炮弹一样向后倒飞出去，在暴雨中划出一道银白色的弧线。她的背脊重重地撞在了五阶之上的石灯笼上，将那座已经存在了数百年的石灯笼从中撞断——上半截的灯罩在撞击中碎成了数块棱角分明的石片，和贞德的身体一起跌落在了石阶上。


  水花四溅。


  贞德单膝跪在了碎石与积水之中。她的旗剑斜插在身侧的石阶缝隙里，勉强支撑着她没有完全倒下。暴雨冲刷着她脸上的血——不知道是什么时候添上去的伤口，一道从左眉梢斜切到颧骨的细长刀痕，正在往外渗着殷红的血。


  六刀。


  前后不到三秒。


  Alterego仍然站在他出刀的位置上。甚至没有移动过脚步——所有六刀，都是他站在原地挥出的。他的太刀垂在身侧，刀刃上没有沾到一滴血——不是因为暴雨冲刷掉了，而是他每一刀的切入角度都精确到了令人毛骨悚然的程度：只割裂铠甲，只破坏防御，只制造足够让对方丧失战斗力的伤害——但不杀死。


  他没有在杀人。


  他在演示。


  他在用六刀的时间，向在场的所有人精确地展示了一个事实：


  他可以随时杀死贞德。


  他只是选择了不这么做。


  “我说了。“


  Alterego收刀入鞘。动作和拔刀时一样看不清过程——上一帧刀在手中，下一帧刀已归鞘。


  “你没有机会的，贞德。“


  贞德跪在碎石与积水之中，暴雨从她残破的铠甲缝隙间灌入，冲刷着下方已经被震得发麻的皮肤。她抬起头，被雨水和血水模糊了的视线穿过湿透的金色发帘，看向石阶下方那个滴水不沾的身影。


  那张脸。


  那张和她的御主——和言峰士郎一模一样的脸。


  她的手指重新攥紧了旗剑的剑柄。


  而立香已经冲了上去。


  迦勒底的御主踩着湿滑的石阶向下奔去，白色制服的衣摆在暴雨中翻飞，她的双手各握着一柄金色的终结剑Enki，背后的宝石礼装在奔跑的颠簸中散射出斑斓的碎光——那些光点在雨幕中像是一群慌乱的萤火虫，追随着她的身影在石阶上跳跃。


  她知道自己打不过他。


  她知道自己没有才能。


  她知道一个普通的、被卷入特异点的人类御主，拿着别人投影的武器，穿着别人给的礼装，面对一个连冠位从者都无法战胜的敌人——


  这是去送死。


  她还是冲了上去。


  Alterego看着那个向自己冲来的橘发少女，那面微笑在暴雨中纹丝未动。


  他没有拔刀。


  他只是站在那里，等着她跑到自己面前。'

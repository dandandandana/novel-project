content: '她的笑意在脸上铺开了。那笑意不是温暖的，不是傲慢的，而是一种居高临下的玩味，是行星对地面的俯视。“虽然这具素体不如爱尔奎特，但是也够我复生了。”她把手从头发上放下来，裙摆随着她迈出的一步在地板上拖出一声轻微的沙沙响。


  “好了。”


  朱月的视线从左到右扫了一遍。爱尔奎特，伊什塔尔，立香。每一个人的脸都被她用目光点了一遍。然后她开口了，声音很轻，轻到了像是和熟人打招呼。


  “死者已经知道即将杀戮她们的人是谁了，可以请你们去死了。”'

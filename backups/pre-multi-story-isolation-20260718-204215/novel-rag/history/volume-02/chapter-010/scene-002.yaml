content: '“我这边也还好，按计划在A区域汇合，玛修正警戒着行踪不明的Berserker。”


  二人断开通讯，立香手腕上的腕表突然响起，奥尔加玛丽的声音带着几分急切传了过来。


  “你们俩真是胆子大啊！”


  “所长，会议上不是说好了吗？希耶尔前辈和Saber在楼顶，会尽快解决Archer六条命，剩下的靠炸塌大楼，给希耶尔前辈创造击杀第七条命的机会，最后就交给她了。”立香连忙解释道。


  “我当然知道……只是没想到你们行动力这么强。”奥尔加玛丽叹了口气，语气里带着几分无奈，“该说不说，这种大胆而且高效的计划果然是埋葬机关的风格啊。”


  立香快步登上酒店三层——她和士郎约定好的A区域。士郎随后赶到，从怀里掏出几个四四方方的立方体丢给她，语气急促：“快，按位置放好。”


  轰——


  整栋大楼剧烈震颤起来，墙体簌簌剥落，立香脚步一晃，连忙稳住身形，脸上满是慌张。


  “哈啊……楼上到底发生什么了？”


  立香把双剑背在身后，暂时关掉礼装，快速按指定位置放好立方体，随后转身朝着楼下奔去。


  清脆的骨头撞击声骤然响起，几只骷髅龙牙兵挡在了她面前，立香下意识地伸手去摸背后的黄金双剑。


  她挥剑斩出，剧烈的酸痛瞬间席卷手臂，忍不住痛呼一声，身子下意识弯曲，堪堪躲过龙牙兵的袭击，双腿却不听使唤，扑通一声摔在地上。


  “呃……”立香咬着牙，浑身都在发力。


  【糟了……忘了开礼装了……我到底在想什么啊！】立香在心底懊恼不已。


  先前行动时肾上腺素飙升的紧张感，此刻被死亡的恐惧压过了大半，立香撑着剑，艰难地想要站起身。


  “礼装……”


  刷刷——几柄黑键破空而来，精准刺穿了龙牙兵的头颅。


  “忘了开礼装了吗，立香？”士郎温和的声音在耳边响起，带着几分无奈。


  他单手将立香捞了起来，语气急促：“快，一会要爆炸了，先离开这里。”


  “欸？等等！礼装还在我身上啊！”立香惊慌失措地大喊，士郎却全然不顾，紧紧护着她，猛地撞向身旁的玻璃窗，带着她从三楼跳了下去。


  落地时的冲击力让士郎膝盖传来一阵剧痛，但他毫不在意，扶着立香，快步逃离了这片危险区域。


  士郎把立香扶到路边的大树下，掌心泛起柔和的绿光，一边用洗礼咏唱为她治疗，一边轻声说道：“要爱惜自己的身体啊。”


  “……言峰，你还好意思说我？你膝盖就不痛吗？”立香看着他微微弯曲的膝盖，语气里满是担忧。


  “不痛。”士郎语气平淡，目光落在立香身上，“你肯定很痛，投影装填很耗体力，刚才那样的动作，你撑不住的。”


  “怎么可能不痛！那可是三楼啊！”立香急得提高了声音。


  “我以前从五楼摔下来过，没事的。”士郎轻描淡写地说道，仿佛在说一件微不足道的小事。


  治疗结束后，立香抬眸看向士郎，眼底满是茫然与无措。


  【接下来，我还能做些什么呢？】


  士郎与她对视一眼，轻轻叹了口气，看穿了她的心思。


  “你太紧张了，立香。”


  “欸？你怎么知道？”立香挑眉，语气里满是疑惑。


  “你的手。”士郎抬了抬下巴，示意她看向自己的双手。


  立香低头看向搭在膝盖上的手，只见双手正控制不住地发抖，连她自己都没察觉。


  立香慌忙把双手藏到身后，脸颊微微泛红，气恼地瞪着士郎：“你怎么不早点说！”


  【这家伙，明明看起来一本正经，没想到这么腹黑！】


  士郎就那样直勾勾地看着她，眼神清澈，看得立香心里发虚，连反驳的话都咽了回去。


  他忽然开口，语气带着几分笑意：“之前怎么没发现，其实咱俩长得挺像的。”说着，伸手揉了揉立香灰头土脸的脑袋。


  “欸？不许揉我脑袋！”立香拍开他的手，气鼓鼓地说道。


  “你看……”士郎还想再说些什么，他和立香的脑海里，突然响起了希耶尔的声音。


  “藤丸立香！动手！”


  士郎和立香对视一眼，立香不再犹豫，切出腕表，按下了一个按钮。


  惊天动地的爆炸声响起，二人刚刚逃离的酒店，在漫天烟尘中轰然倒塌。


  “接下来，去做我们能做的事吧。”士郎看向立香，语气坚定而温和。


  “玛修！报告你的位置！”立香通过魔力通讯呼叫玛修，话音刚落，就听到了一旁传来陌生的声音。


  “真是有趣，不愧是吉尔伽美什教导出来的人啊。”


  一个骨瘦如柴的男人从大路尽头缓缓走来，他穿着黑色大衣，戴着单边眼镜和礼帽，衣着风格像是五十年代的样式，周身散发着诡异的气息。


  “初次见面，这位穿着科幻的御主。”男人摘下礼帽，对着二人微微欠身，语气优雅却带着几分阴鸷，“我是来自彷徨海的魔术师，尼禄·卡奥斯。”'

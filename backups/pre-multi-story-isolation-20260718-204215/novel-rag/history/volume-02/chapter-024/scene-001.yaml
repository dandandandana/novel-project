content: '大魔术解放的咒文从希耶尔唇齿间倾泻而出的那一瞬，第七圣典的铭文如同被点燃的导火索，光芒沿着圣钉构成的骨架以惊人的速度攀升蔓延——处刑器在她身后完全展开，断头台的轮廓从纯白的圣光中浮现，巨大的刀刃悬于半空，倒映着修女瞳孔中冰冷的决意。她的蓝发被宝具释放时掀起的气浪高高扬起，浸透血污的修女服下摆猎猎翻飞，整个人在那一刻看上去不像是一个伤痕累累的人类，而像是一座行刑的祭坛。


  来自贝哲的原理血戒，在平流层展开。


  那是远超人类视野所能直接捕捉的尺度——数十公里的高空之上，圣光凝结而成的曲面镜如同一朵倒开的花，一瓣一瓣地折叠、弯曲、咬合，最终拼合成一面横跨天穹的巨型透镜。从地面仰望，那面镜子像是嵌在倒悬海洋深处的第二个太阳，折射出的光芒将整片废墟照得如同白昼。


  海水映着圣光，圣光穿透海水。两种截然不同的蓝在天穹上交织成一片令人窒息的绮丽光幕。


  然后，曲面镜完成了最后的折叠。


  所有折射的光线在焦点处汇聚、压缩、凝实——


  光之断头台落下。


  那不是“落下“这个词能够形容的景象。与其说是一柄巨大的断头台刀刃从天而降，不如说是天穹本身裂开了一道口子，将属于更高维度的“裁决“直接倾倒在了大地之上。光柱的直径覆盖了灵长类杀手所在的整个街区，柱体内部翻涌着炽白的能量流，温度高到连光柱边缘的空气都被电离成了等离子态，发出滋滋啦啦的刺耳声响。


  地面在光柱落下的瞬间被熔穿了。


  柏油路面、地基混凝土、下方的管道网络——一切物质在光之断头台接触的刹那便不复存在。光柱覆盖范围内的一切存在都被这柄来自贝哲的处刑器宣判为“应当消亡“。


  威力与Excalibur几乎相差无几。


  不——在此时此刻，面对被圣光锁定的猎物，这一击甚至略高一筹。因为Excalibur是“将希望聚束为光芒的圣剑“，而原理血戒·断头台是“将罪孽裁决为虚无的断头台“。前者需要使用者的信念作为燃料，后者只需要一个判定——


  “你该死。“


  灵长类杀手被光之断头台狠狠地压住了。


  白兽庞大的躯体在光柱之下剧烈地扭曲挣扎，四肢在已经被熔穿的地面上疯狂刨动，利爪刮过裸露的岩层，迸溅出一串串火星。它的脊背承受着来自天穹的全部重压，脊椎发出令人牙酸的咯吱声。


  它发出了凄惨的悲鸣。


  那声悲鸣与先前战斗中的一切咆哮都不同——不再是捕食者的怒吼，而是一只被彻底压制的兽在死亡边缘发出的最后嘶鸣。声波在废墟间来回反射，震落了远处几栋残存建筑上最后的玻璃碎片。


  但它还在挣扎。


  即便被光之断头台死死压在坑底，即便全身上下已经没有一处完好的皮毛，灵长类杀手的四肢仍然在不停地蹬踏、撕扯、推拒。它的瞳孔在圣光的灼烧下已经变成了两个浑浊的白点，但肌肉仍在本能地收缩。


  “果然吗？“


  希耶尔收回处刑装置。第七圣典从断头台的形态缓缓折叠回剑的形态，铭文上的光芒一点点熄灭，圣钉上还残留着余温。她单膝跪在碎石遍布的地面上，一只手撑着剑柄，另一只手捂着自己的腹部，粗重的喘息声在暴雨中几乎要被掩盖。


  她看着那只在光之断头台下不断挣扎的白兽，蓝色的眼瞳里没有胜利的喜悦——只有冷静的、近乎麻木的确认。


  还没死。


  果然，就算如此仅凭一发原理血戒还不足以杀死它。


  “做得很好，修女！“


  声音从上方传来。


  希耶尔抬起头。


  Archer站在她右侧一栋残存的建筑顶部，背对着太阳。阳光从倒悬的海水穹顶折射而下，穿过层层水幕在他周身散射出无数道幽蓝的光带——那光芒勾勒出巨人宽阔的肩膀轮廓、垂在身侧的巨弓弧线、以及那双在阴影中仍然锐利如鹰的眼瞳。


  水光在他的甲胄表面流淌，如同披着一面蓝色的光幕。


  那一刻，希腊的大英雄看上去如同一位从神话画卷中走出的救世主。


  希耶尔眨了眨被雨水模糊的眼睛。即便是在浑身疼痛几乎要把意识撕碎的此刻，她也不得不承认——这个画面确实有那么一丝不讲道理的壮观。


  但她没有时间去欣赏。


  “Archer！以令咒支援！火力全开！“


  藤丸立香的声音从通讯中炸开来，人理最后的御主的嗓音因为紧张而微微发颤。与声音同时传来的，是一股炽热的魔力通过灵脉连接涌入Archer的灵基——


  最后一道令咒。


  那是刻在立香右手背上的最后一划赤红笔画，在她喊出支援指令的瞬间燃烧殆尽。灼热的魔力沿着御主与从者之间的契约纽带奔涌而去。


  Archer感受到了那股力量注入灵基的瞬间——令咒的魔力如同沸腾的岩浆灌入了他的每一条灵脉回路，巨弓在他掌中嗡鸣着，弓臂上浮现出属于远古的神代铭文。'

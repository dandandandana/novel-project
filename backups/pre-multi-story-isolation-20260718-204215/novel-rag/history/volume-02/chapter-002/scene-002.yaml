content: '“是礼装。”士郎低声解释，语气依旧平淡，“我有能大幅提升身体素质的礼装，才能支撑到现在。”


  话音刚落，惊雷再度炸响，随之而来的是铁器碰撞的脆响。


  “不知道Shielder能不能撑到教堂……”言峰士郎低声呢喃道。


  立香望着飞速向后倒退的城区景象，用力点头：“玛修一定可以的！她可是我的从者啊！”


  身后的爆炸声像背景音般持续轰鸣，立香手背上的令咒微微发烫，她下意识地攥紧手背，指尖几乎要嵌进皮肤里，那份灼热仿佛在呼应着玛修的魔力波动。


  玛修正奋力抵挡着Archer接连不断的狙击，箭矢撞击盾牌的脆响不绝于耳，可她毕竟是从者，身形依旧灵活，紧紧跟在士郎和立香身后，丝毫没有掉队。


  “还有多远？”玛修一边举盾挡开又一支箭矢，一边急促地问道，“你能确定，到了教堂我们就真的安全吗？”


  “对。”士郎的目光落在前方已然能看清轮廓的教堂上，茶色的眼眸里闪过一丝笃定，低声应道。


  三人的脚步不停，就在这时，立香的内袋里突然传来“嘶啦嘶啦”的杂音，像是信号被干扰的收音机。


  “喂喂喂！能听见吗？立香！玛修！希耶尔！你们还活着吗？！”


  所长焦急的声音从通讯器里传来，立香慌忙伸手摸索内袋，掏出那台机身微微发烫的通讯器，连忙开口：“所长！我们还活着！只是遭到了Archer的狙击，现在正往安全据点赶！”


  “那就好……等一下！你身边那个人类是谁？”高速移动让信号变得断断续续，奥尔加玛丽的声音里带着焦急，“该死，通讯可千万别断啊！”


  “是协助我们的人，是他救了我和玛修。”立香连忙解释，目光下意识看向抱着自己的士郎。


  “当地的援军吗？那就好。”奥尔加玛丽的声音稍稍松了些，可下一秒又变得凝重，“不对！这个特异点里，压根没有几个活人的魔力反应！”


  “没错，这里爆发过一场灾厄，没有魔力的普通人，全都死了。”士郎的声音压得很低，立香能清晰感受到他抱着自己的手臂微微颤抖，语气里藏着压抑不住的愤怒与无力。


  “怪不得是特异点……等一下！有个高能魔力反应正在朝你们靠近！这个反应是……Berserker！”


  “追来了吗？Shielder！”士郎的脚步骤然加快，语气急促，“立香，你是她的御主，等会儿直接用令咒，让她带你跳跃到前面的教堂！”


  “什么？你要殿后？你疯了吗？那可是Berserker啊！”通讯器里传来奥尔加玛丽惊慌的嘶吼，信号又变得嘈杂起来。


  “我不会抛下言峰先生的！”立香急得摇头，伸手抓住士郎的衣襟，朝着玛修喊道，“玛修！”


  “现在不是说抛下不抛下的时候了，他已经到了。”士郎的声音沉了下来，脚步猛地停住，周身的空气瞬间变得凝滞。


  被士郎抱在怀里的立香，顺着他的目光看向前方——一道高大魁梧的身影挡在了路中央，男人手持一柄萦绕着不祥黑气的血红色长枪，黑红色的铠甲紧紧裹着健壮的身躯，黑色兜帽遮住了大半张脸，下身的铠甲像是野兽的利爪般狰狞，身后还拖着一条粗壮的黑色尾巴，周身散发着令人窒息的狂暴魔力。


  “这魔力反应……骗人的吧！”通讯器里传来奥尔加玛丽难以置信的惊呼，杂音大得几乎要盖过她的声音。


  Berserker的眼眸轻轻转动，猩红的目光扫过士郎和立香，嘴角勾起一抹残忍的弧度，下一秒，他的身形便如同鬼魅般消失在原地。


  【好快！】


  立香甚至来不及反应，就被士郎猛地往旁边一放，紧接着便是金铁交织的刺耳脆响，红发少年如同断线的风筝般倒飞出去，重重撞在路边的树干上，闷哼一声，身体软软地滑落在地，显然承受了致命般的剧痛。


  “言峰先生！”玛修心急如焚，刚想冲过去，身后便传来箭矢破空的锐响，她只能被迫转过身，举起盾牌死死抵挡，根本无法分身。


  “呃……”言峰士郎艰难地喘息着，嘴角溢出一丝血迹，他撑着地面想要站起身，茶色的眼眸里燃烧着无法抑制的怒火，死死盯着眼前的Berserker。


  “立香！现在到底是什么情况？！”通讯器里的杂音越来越大，奥尔加玛丽的声音里满是慌乱，“该死！希耶尔还在很远的地方，赶不过来！”


  Berserker瞥了立香一眼，像是在打量猎物般，嘴角的笑意愈发残忍，随后手中的长枪猛地横扫过来，带着狂暴的魔力，直逼立香面门。


  “砰！”


  一道银色的剑光突然从身侧射来，勉强挡住了Berserker的攻击。言峰士郎趁着这个间隙，勉强站起身，大口喘着粗气，咳出一口鲜血，手中瞬间凝聚出几柄黑键，毫不犹豫地朝着Berserker扑了过去，目标直指他裸露的前胸。'

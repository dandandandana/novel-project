content: 'Berserker轻描淡写地抬起手臂，挡住了士郎的黑键，随后手腕一甩，长枪精准地挡住了那道银色剑光，力道之大，震得空气都微微震颤。


  Berserker饶有兴致地看着眼前浑身是伤却依旧不肯退缩的士郎，手中的长枪轻轻舞了个枪花，一步步朝着士郎和立香逼近，周身的压迫感越来越强。


  立香呆呆地站在原地，看着挡在自己身前、浑身是伤的言峰士郎，眼眶瞬间泛红，挣扎着想要冲过去，却发现自己的腿依旧有些发软。


  【为什么要做到这种程度……明明我们才刚见面没多久，明明你完全可以丢下我们自己逃走的啊……】


  【他会死的。】


  这个念头如同惊雷般在立香脑海中炸开——眼前的红发少年，一定会死在这里。


  玛修正被Archer的狙击死死牵制，根本无法立刻赶来支援；而言峰士郎浑身是伤，早已是孤立无援，只能硬生生承受着Berserker的攻击。


  这是立香看着士郎与Berserker再次交锋时，心底唯一的念头，无力感如同潮水般将她淹没。


  立香正为自己的无能感到羞愧不已，冲天的气流突然从Berserker身旁爆发开来，一道银色长剑稳稳挡住了他的长枪。言峰士郎眼中闪过一丝决绝，手持黑键，不顾身上的伤势，再次朝着Berserker扑去，誓要将黑键捅入他裸露的前胸。


  Berserker仓促间用手臂挡住士郎的攻击，随后猛地甩动长枪，挡住了那道突如其来的银色剑光，目光警惕地看向剑光传来的方向。


  “把最后一道令咒用了吗？Saber的御主。”Berserker缓缓后退两步，语气里带着几分戏谑，轻笑着开口。


  “怎么？打算束手就擒受死了吗？Berserker？”一道清澈的女声传来，持着银色长剑的金发少女缓步走出，眼神冰冷地嘲讽道。


  “哈哈哈……受死？”Berserker大笑起来，摇了摇头，“你的御主怕是巴不得我死吧？我可没蠢到，跟你们两个，甚至可能是三个、四个对手同时开打。”他斜睨着Saber，语气里带着几分玩味，“享受战斗可不是这样的，今天就放你们一马。”说罢，他扛起长枪，身形渐渐灵体化，消失在夜色中。


  月光透过云层洒在少女身上，给她镀上了一层柔和的银辉。


  她有着耀眼的金发与澄澈的蓝眸，娇俏的面庞上嵌着一双满是坚毅的眼眸，银色铠甲贴合着较小却丰满的身形，手中握着一柄样式简洁、却泛着凛冽冷光的银色长剑，长长的金发编成麻花辫，一路垂落至脚踝，随风轻轻晃动。


  “御主，方才的指令很果断，但也太过危险了。”Saber转过身，语气里带着几分无奈的叮嘱，“下次切不可再做这种以身诱敌的举动。”话音顿了顿，她的目光落在一旁，轻声问道，“这位从者……”


  话音未落，Saber的目光便转向快步赶来的玛修——少女依旧举着盾牌，神色警惕如临大敌，跑到近前时，下意识地站到了士郎与Saber中间，将两人稳稳护在身后。


  士郎轻轻扶了扶立香，轻声解释道：“是这位Master的从者，职阶是Shielder。”


  “Shielder吗？”Saber的目光在玛修的盾牌上稍作停留，随即抬手轻挥，将手中的银色长剑收回剑鞘。


  士郎微微蹙眉，看向Saber说道：“Saber，我们现在还在Archer的狙击范围内，不能久留，先去教堂再说。”


  Saber微微颔首，语气沉稳地回应：“正有此意，Master。”'

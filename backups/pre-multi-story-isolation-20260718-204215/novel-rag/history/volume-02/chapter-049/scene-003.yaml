content: '结界内的空气被瞬间蒸干。巴比伦城墙在余波的冲击下剧烈晃动，数座塔庙齐齐崩裂，碎石在坠落过程中被高温熔化成液滴。古伽兰纳庞大的身躯在余波中向后滑动了数公里，四蹄在虚空中拖出四道深如峡谷的沟壑。


  这一发的威力可以打碎半个欧亚大陆。


  “接招吧！吉尔伽美什！”


  吉尔伽美什的双手向胸口聚拢。


  “Mar……”


  魔力从她的身上汇聚，不是抽取，是涌入。魔力，魔力源源不断的从大地朝着她的灵基涌入，大源的魔力如海洋倾覆般灌注进她的躯壳。金色的魔力在她周身燃烧成光柱，光柱扩张的瞬间将周围悬浮的宝具碎片全部震飞。


  随后是涌出。


  “Ph……”


  巴比伦城墙在坍缩。阵地建造的魔力被抽取回吉尔伽美什体内，城墙化作金色的光点，从地面升起，汇聚进她胸口的光团。塔庙倒塌，石板碎裂，整座王城在一息之内归于光尘。那些光尘收束成一条横跨结界的金色洪流，循着她指尖的方向涌向伊什塔尔。


  金星子弹与金色洪流在结界的中心碰撞。


  白光淹没了一切。


  冲击波不再是球形扩散——乖离剑构筑的结界在碰撞的瞬间扭曲，红黑色的边界被撕开无数道裂口，每一道裂口都向外喷涌着白光。古伽兰纳的躯体被冲击波正面击中，青金石的表面第一次开始融化，深蓝色的矿脉在白光中化作流淌的岩浆，覆盖了它半边的脊背。


  伊什塔尔维持着射姿，门牙咬紧了。她的右臂在颤抖——魔术回路超出安全阈值运转，肩关节发出细微的碎裂声，指尖变得苍白。但是第三法所造就的人偶之躯甚至超过了她神话中的躯体，她没有后退。


  白光熄灭。


  八方跪拜天空之锤，这A+++级别的对界宝具在白光中消融殆尽，金星的投影被打散成光的星尘。剩余的冲击力被金色洪流吞噬干净，结界中的红黑色脉络在余波中重新稳定下来。


  然后。


  吉尔伽美什举起了EA。


  乖离剑在她手中旋转，圆柱体上的三段齿轮逆向咬合，猩红色的光纹从剑柄流向剑身。空间的法则在剑刃的边缘碎裂，空间被乖离剑本身的“开始旋转”否定了一切现存的空间定义。红黑色的结界开始从边缘崩解，一片一片剥落，落入乖离剑创造出的深渊中。


  伊什塔尔的眼睛骤然收缩。


  “开天辟地——”


  吉尔伽美什的瞳孔中映出那把剑的完整形态。她的声音不重，咬字清楚，吐出的每一个音节都让结界震颤。


  “——乖离之星。”'

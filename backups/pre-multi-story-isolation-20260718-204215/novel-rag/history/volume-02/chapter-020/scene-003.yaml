content: '就在言峰士郎即将失去意识的瞬间，白色的魔术光芒骤然亮起，Alterego的治愈魔术及时笼罩住他的身体，勉强吊住了他的性命。转瞬之间的剧痛与大量失血，让他连一句反驳的话都来不及说，双眼一闭，便彻底失去了意识，身体软软地垂了下去。


  Alterego对他微弱的低喘与无意识的抽搐毫无反应，伸出手臂，稳稳夹住浑身是血、早已失去意识的少年，眼神冷漠，缓缓朝着地面落去，黑泥在他脚下缓缓散开，没有沾染上半点血迹。


  Alterego眼神没有半分波澜，也没有丝毫犹豫，手臂猛地发力，将腋下浑身是血、毫无意识的少年，径直朝着不远处的灵长类杀手掷去，动作干脆狠辣，没有丝毫拖泥带水。


  “御主！”


  法兰西圣女的惊呼骤然划破角斗场的喧嚣，她身形微动，下意识地想要上前阻拦，却被灵长类杀手周身溢出的黑泥余波震得顿了半步，终究还是慢了一步，只能眼睁睁看着少年朝着危险坠去。


  灵长类杀手本就认定Alterego无法真正伤它，此刻见对方竟将一个濒死的少年掷来，当即被彻底激怒，喉咙里发出低沉而凶狠的咆哮，猩红的眼眸里翻涌着暴戾，四肢蹬地，带着黑泥飞溅的势头，朝着下坠的少年猛扑而去，锋利的獠牙闪着冰冷的寒光。


  就在它锋利的獠牙即将触碰到士郎脖颈的瞬间，Saber身形如离弦之箭般冲上前，用尽全身力气将士郎狠狠推开，同时手腕翻转，银剑带着凌厉的刃风直刺灵长类杀手的面门，逼得它仓促后退，而自己却因冲力过猛，不慎踩入了一旁粘稠的黑泥之中，身形微微一滞。


  【你……你怎会没有愿望？】


  一道冰冷而尖锐的质疑声在Saber脑海中反复回荡，带着不解与嘲讽，可此刻危机四伏，她无暇细想这声音的来历，指尖死死攥紧剑柄，猛地将银剑刺入坚硬的地面，借着剑身的支撑稳住身形，避免自己被黑泥彻底拖陷。


  “呃……”


  黑泥如同有生命般顺着她的靴底向上蔓延，冰冷粘稠的触感顺着皮肤渗透，带着刺骨的寒意与侵蚀性的魔力，让她忍不住低低闷哼一声。灵长类杀手见状，立刻放弃追击士郎，再度张牙舞爪地乘胜扑来，利爪直指Saber的要害。


  “吾主在此！”


  就在灵长类杀手的利爪即将触及Saber的瞬间，法兰西圣女周身骤然泛起圣洁的金光，毫不犹豫地展开宝具。


  玛修眼神一凝，抓住这转瞬即逝的间隙，快步冲上前，脚步踉跄着堪堪站在未被黑泥覆盖的边缘区域，恰好被Saber宝具散发的圣洁光晕笼罩。


  “啊啊啊——！”'

content: '一道洁白的屏障在士郎面前展开挡住了这几道光束。魔力撞在屏障上的声音尖锐而短促，像冰锥砸在盾牌上。碎光沿着屏障的边缘散落下去，照亮了士郎的下半张脸。他的表情没有变化，那双琥珀色的瞳孔里装着的东西从钟楼发动到现在一直没有散掉——满到要从眼眶里溢出来的怒意和杀气。


  “找死吗。”他静静开口。


  哈迪斯笑了，这一次是真的笑出了声。“呵呵呵呵呵——我倒是不怕死。但是你怕不怕你的御主死呢？”


  士郎歪了歪头。然后他连一句回应都没给，直接拔剑冲了过去。


  黑白的夫妻剑在走廊的暗红闪光里拖出两道残影。他的脚底在石板上碾出一声尖锐的摩擦音，身体向前扑去的速度极快，风衣的下摆在身后猛地扬起。


  哈迪斯完全没想到他能直接抽剑冲过来。他以为这句威胁能卡住对方至少几秒——几秒的犹豫，几秒的权衡，几秒会回头看御主的破绽。


  但士郎连半秒都没给他。


  哈迪斯猛敲了一下法杖，骨杆磕在石板上的声音比刚才沉闷得多。整个地面上从暗紫色的迷雾里长出了漆黑的触手，外表的质感像凝固不动的黑泥一样黏腻而沉重。触手从石板裂缝里冒出来，扭曲着朝士郎扑去。


  士郎的身形骤然一滞。他踩住一只触手跳向天花板，在半空中凝聚出几柄如同十字架一样的黑键。剑身在他的指间成型然后被甩出，朝黑泥触手扫去，黑键的魔力剑气切开了最前面两只触手——然后第三只触手结结实实地缠住了黑键的剑身，用纯蛮力把它碾成了碎铁。


  他骤然一愣。黑键被碾碎的触感从魔术回路上反馈回来，那不是被切断，是被巨大的握力硬生生捏碎的。


  “果然！你比之前弱了不少——”


  哈迪斯再度一敲地板，法杖底端磕在石板上的声音里混进了笑声。他的面前凭空出现了一个漆黑的壁障，从地板一直延伸到天花板，把走廊切成两半，挡住了言峰士郎前进的路线。


  然后士郎面前出现了比黑泥更诡异的画面。


  朱月的身体在所有散落的碎块之间建立起了某种看不见的连接。断手在血泊里停止了爬行，自己飘了起来回到了手腕的截面上。皮肤边缘轻轻对接，新的肌肉组织从断面里长出来把两条分离的骨茬重新包住。


  肋骨的碎片从地上浮起来，一片一片按照原来的位置拼回胸腔，骨片合拢的脆响密集而连续，胸腔重新撑起了完整的轮廓。被齐腰斩断的躯干和下半身重新接到了脊柱的两端，肠管盘曲着被收纳回去，腹部的肌肉和皮肤从截面的边缘往中间愈合，新生的组织在暗红色警报光下泛着湿漉漉的反光。裂开的头骨是最后一个组装的。裂成两半的骨片向中间合拢，发出令人牙酸的摩擦音。


  无首尸体缓缓蹲下来，双手在地上摸索着触到了滚落在墙角的头颅，把它捧起来。断裂的颈椎骨茬对准脊柱顶端的凹槽，轻轻摁了上去——喀一声，头稳稳地落在了脖子上。然后她用手指从裂开的骨缝里，把散落的组织捧回了颅腔，一片一片安放进去，最后用掌心压了压颅骨的顶部确认骨片已经合严实了。


  整个过程没有惨叫，没有血崩，每一块组织都像被精确编程的机械臂一样回到了自己该在的位置。连被剑刃切碎的哥特黑裙都在愈合——蕾丝的边缘重新编织，布料的纤维一根根对接，复原如初。


  “……额。”朱月恨声开口。她的嘴巴刚合上，舌头在口腔里动了动，像是在确认发音功能已经恢复。


  “言峰士郎——”她盯着那个站在漆黑壁障前的红发男人，声音从喉咙深处挤出来，每一个字都带着刚被砍碎又被强行拼回的屈辱。她骤然暴起想冲过去。


  一只苍白的手从黑袍袖子里伸出来，猛然拽住了她的手腕。


  哈迪斯扣着朱月的手臂往后退去。力道是死拽，不是邀请。朱月狠狠瞪了他一眼，血红色瞳孔里翻涌着不服，但她的脚步还是跟着哈迪斯缓缓退入走廊尽头的暗紫色迷雾里。两人的身影被雾气一寸一寸吞没，先是脚、然后是裙摆和袍裾、最后是戴着兜帽的侧脸和那双蓄满怒意的眼睛。朱月最后一眼透过迷雾的缝隙朝士郎射了过来——她还会回来的。


  迷雾彻底消散，走廊里只剩下狼藉的碎石、血泊和几块没来得及跟着朱月一起消失的骨片。


  “前辈——”玛修的视线从走廊尽头的迷雾收回。她看见立香的脸已经白得没有一丝血色，嘴唇在颤抖，整个人扶着她肩膀的手收得极紧。“你还好吧！”


  “开什么玩笑——”立香刚开口，那股从胃底涌上来的酸流直接冲破了她的话。她猛地转过身扶着走廊的墙壁弯下腰去，哇地一声吐出一大口呕吐物。酸水混着晚饭的最后一点残渣从喉咙里挤出来，灼热的液体烧过食道的感觉让她整个胸腔都在抖。'

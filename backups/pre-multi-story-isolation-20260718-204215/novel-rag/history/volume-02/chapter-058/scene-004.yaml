content: '“这是配得上的问题吗？”士郎直勾勾地瞪着她，那股刚才对战朱月时都没流露出来的后怕此刻明明白白地写在脸上。“没想到是这样，万幸没出事。”


  “忙我帮到了。”雅典娜把声音重新抬起来，英气的脸上浮出几分认真。“你们答应我的事情呢？总得——”


  “那是我御主答应你的。”士郎走到门边准备出去，忽然回过头来。“还有。你给我戳的窟窿自己去填上。”


  “不就是说你是叛徒嘛——”


  “你再说！”他转身瞪了她一眼。


  “好好好。”雅典娜举起双手做了一个投降的姿势，然后把手放下的时候笑容变得意味深长起来。她靠在墙上看他，蓝色的瞳孔里闪过一丝促狭。“这么怕你的御主不信任你啊——我没记错的话言峰士郎的女人缘很好吧。”


  士郎没有说话。只是用沉默和后背对着她。


  “你的身边就没缺过女人。”雅典娜歪着头继续说道，语调拖得极慢，一个字一个字往他后背丢。“为什么对她这么上心呢。难不成单纯因为长得和你很像吗？”她故意停顿了半秒，然后轻轻吐出两个字。“原来你是人类说的——水仙？”


  士郎回过头。他脸上没有怒意，没有无奈，只有一种被问到完全不想回答的问题时才会出现的深深的疲懒。他把每个字都咬得很死，声音很平。“她是我的御主。”


  “MASTER是吧——”


  “随你便。”'

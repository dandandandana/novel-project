content: '她的声音里带着明确的得意。把柔软的东西用硬壳裹起来之后展示给对方看的得意：你看，我没那么脆弱。我不需要哭着扑上来说谢天谢地。我撑得住。


  Ruler看着她。


  “你没能这么说，才是最有问题的。“


  那句话不重。音量甚至比之前的嘴炮还要低上一截。但它落在房间里的方式让空调的嗡鸣声突然变得刺耳了。


  立香的笑凝固了。


  “你——“


  “你今年十八岁。“Ruler没有给她把那个字接下去的余裕。他的语速不快，声线平稳，但每句话之间的停顿被压缩到了最短，不留给对方组织防线的时间。“明明是该念大学的年纪。看你的样子，是被赶鸭子上架。而且经历了特异点F的腥风血雨，直面了死亡。“


  他停了一拍。只有一拍。


  “陪你过去的同伴，大概都出事了吧。“


  立香从床上站了起来。


  这个动作太突然了，碟子从她膝盖上滑落，叉子在碟面上弹了一下发出清脆的金属声。她没有去扶。


  “你想说什么？“她的声音拔高了半个音阶。“Ruler，你是在嫌弃我弱小吗？“


  “嗯哼？“Ruler的目光从她脸上平移到她攥紧的拳头上，再平移回她的眼睛。“我可没这样说。“


  立香的呼吸频率变了。每一次吸气都只到胸腔的三分之一就被强行压制下来。


  “是，我是个半吊子御主。“


  她开口的时候声音反而变低了。低到几乎是从喉咙根部挤出来的震动。


  “我连正常的攻击性魔术都做不到。会的只是一些基础的强化、同调和治愈魔术。Alterego说得对，我没有才能。我做不到保护其他人，我只能眼睁睁看着言峰士郎他们一个个倒在我前面……而我——“


  她的声音在这里裂了一条缝。


  “只能被灵子转移回来。“


  安静了一秒。然后她低下头，右手伸到Ruler面前。手腕内侧的令咒在暗淡的灯光下浮着暗红色的纹路，三划中已经少了一划。


  “你想说的是这些吗？如果你要解除契约，随你。砍掉这只手还是直接取下令咒，随你，Ruler。“


  她的下颌绷得很紧。牙关咬合的力度让咬肌的线条从皮肤下面浮了出来。但她在说最后那个“Ruler“的时候，尾音走了调。


  一滴水落在她伸出的手背上。


  然后是第二滴。


  她没有抬手去擦。也没有把伸出去的手收回来。就那么举着，手腕上的令咒、手背上的泪痕，还有指尖因为用力而微微弯曲的弧度，全部暴露在Ruler的视野里。


  Ruler看着那只手。


  看了三秒。


  然后他叹了口气。那声叹气从胸腔深处翻上来，经过喉咙的时候带出一点沙哑的震颤。他伸出右手，没有去碰她的令咒，也没有去握她的手。他的指腹落在她的颧骨上，沿着泪痕的轨迹向下擦了一道。


  力度介于擦拭和按压之间。


  “我都说了，我可没这样说。“


  他的声音很近。近到立香能辨认出他呼吸里残留的面粉和黄油的气味。做蛋糕时沾上的，洗过手之后也没完全散掉。


  “既然我回应了你的召唤，藤丸立香。我就会为你奋战到最后。“


  他把手收回去。


  “说到底，你只是没做好准备罢了。“


  立香猛地抬头，伸手拍开了他尚未完全收回的手臂。掌心拍在他小臂外侧的声音在安静的房间里清脆得像折断一根干树枝。


  “用不到你可怜我。我自己也知道。“她用袖口胡乱地蹭了一下脸颊，把泪水和细小的蛋糕碎屑一起抹成了一道模糊的痕迹。“你觉得我想吗？“


  “啊啊，我知道你不想。“


  Ruler被拍了也不躲。他收回手臂的动作甚至带着一种顺水推舟的配合感，好像被御主拍一下是某种理所当然的仪式。


  “人生就是这样。“他的声音放得更轻了，轻到和空调的底噪混在了同一个频率里。“没准一夜之间因为一场大火失去所有。没准一觉醒来整个世界改朝换代。一个马上要上大学的少女，成了必须扛起救世主职责的御主。“


  他没有说“我理解你“。也没有说“没关系“或者“你已经做得很好了“。他只是把事实平铺在她面前。


  立香收起眼泪。


  像拧紧水龙头。带着机械感从某个节点开始就不再有一滴水漏出来的截止。她的睫毛还是湿的，鼻尖泛着红，但眼眶里已经干了。


  “不管怎么样，我都会去做的。“


  她说完这句话，重新坐回床沿。弹簧在她的重量下发出一声细微的吱呀。


  她朝Ruler伸了一下手。没说话。


  Ruler从口袋里掏出一小叠纸巾递过去。他递出纸巾的动作和她伸手的动作之间没有任何犹豫，衔接得像排练过一样。


  立香接过纸巾，低头擦了擦领口。那里沾上了刚才吃蛋糕时蹭到的奶油，被泪水化开之后变成了一片浅黄色的湿渍。她把纸巾翻了一面，又擦了擦锁骨附近的位置，然后把用过的纸巾揉成一团，精准地丢进了两米外的垃圾桶里。'

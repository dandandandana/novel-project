content: '“有这样的觉悟就好。“Ruler看着纸巾团划过的抛物线，点了一下头。“但是——“


  他的尾音悬在空中。


  “你自己怎么样？“


  “嗯？“立香从擦衣领的动作中抬起头。


  “你把责任扛在肩上，作为第一优先级，没有问题。“Ruler说着，双手插在裤子口袋里，后脑勺贴着墙面，视线从天花板上收回来落在她身上。“你的情绪呢？“


  他的语速放慢了。


  “压下来的东西需要出口。悲伤、愤怒、不解，都是。“他嘴角往上提了一个微小的弧度。“刚才说完，感觉怎么样？“


  “能怎么样。被你数落了一通。“


  “误解我了。我可没有数落你。“Ruler的肩膀微微耸了一下。“倒是你骂了我一顿。“


  “……哼。“


  立香瞪了他一眼。那一眼的力度已经从之前的锐利降到了一个介于不满和别扭之间的温度。


  “那以后我有情绪了，就能迁怒给你？“


  “可以。“


  没有犹豫。没有条件。两个音节，干净利落。


  立香张嘴准备发射下一轮弹药，嘴唇分开了一半又合拢了。她的视线在Ruler脸上扫了两个来回。


  “啊……“她用拇指和食指捏住下巴，微微歪头。“忘了你是这种人了。“


  “那好。你可得受着。“


  “嗯嗯，好的，立香。“


  他叫了她的名字。


  不是“御主“，不是“藤丸立香“。是“立香“。两个字从他嘴里滑出来的时候，声调自然得像他已经这么叫了很多年。立香注意到了，选择不追究。


  “算了……“她往后仰，脊背落在床铺上，睡衣领口因为这个动作散开了一点，露出锁骨下方刚擦干净的那片皮肤。她盯着天花板上那盏已经调到最低亮度的照明板，上面映着空调出风口的栅格投影。


  “你也是言峰士郎，好歹……他救了我那么多次。“


  她用的是“他“。


  不是“你“。


  Ruler靠在墙上，没有纠正这个代词。


  “那——“


  他把后背从墙上撑起来，站直身体。然后他伸出了右手。


  掌心摊开，五指微微张开，指向躺在床上的少女。走廊灯光从门缝底部淌进来，在他的指节上留下一层薄薄的亮。


  “初次见面，藤丸立香。“


  立香维持着仰躺的姿势愣了一秒。然后她撑着床面坐起来，动作带起的气流让碟子里剩下的蛋糕碎屑微微滚了一下。


  “哈？你在搞什么？“


  “有点仪式感好不好。“Ruler的手没有收回去。他甚至把手臂往上抬了抬，好让她不需要起身就能够到。“仪式感。“


  他重复了一遍这个词。然后他的声音稍微放低了一点，低到这句话只被这个房间里的两个人和一台空调听见。


  “初次见面，藤丸立香。我的名字是言峰士郎。“


  房间里安静了片刻。


  立香看着那只手。那只在几个小时前投影出一把不伦不类的厨刀、切了一整块蛋糕、又伸过来擦掉了她脸上眼泪的手。


  指腹上有茧。不是握剑的茧。菜刀磨出来的，从少年时代开始做饭、做了十几年之后留下的痕迹，已经变成了皮肤的一部分。


  “……你这么说的话，也行吧。“


  她呼出一口气。那口气呼出的时候她的肩膀明显地沉了一下。


  “就当重新认识了。先说好，先手就知道你是个什么人，不怪我。“


  她伸出手。


  两只手在房间正中的空气里碰到了一起。


  Ruler的手掌温度比她预想的要高。从者的身体理论上不需要维持恒定体温，但他的掌心是热的。带着一种揉过面团、在水龙头下冲过、又自然晾干之后残留的温热。立香的手比他小了两圈，指尖搭在他掌根的位置，握力不大，松松地收着。


  “藤丸立香。“她说。“迦勒底的御主。“


  “嗯。“


  Ruler的手指合拢，把她的手稳稳地扣在掌心里。握了一下。


  他的拇指在她的手背上移动了一下。动作极轻。大概只是手指收拢时带来的附带接触。


  松开。


  “这就对了。“


  他笑了。那个笑从喉咙深处翻上来，经过声带的时候被碾成了一个很短的、沙沙的音节。


  “笑起来好看。“


  立香愣了。


  她伸手摸了一下自己的嘴角。指腹碰到了一个弧度。她不知道什么时候开始的，嘴唇的两端翘了起来。在哭过之后、在骂过之后、在把蛋糕吃了大半之后、在伸出手和一个自称“初次见面“的家伙握手之后，她的脸上出现了一个不受控制的、没有经过大脑审批的笑容。


  “这样啊。“她歪了歪头，没有否认。“还有什么要说的？“


  “你想说什么就说吧。“Ruler重新靠回墙上。他的站姿比刚才松了一点，重心偏到了左脚上，右脚的脚尖微微翘起，拖鞋的后跟悬在地板上方。“一肚子话吧。“


  “那就从你自己开始。“立香盘腿坐在床上，双手抱着膝盖，下巴搁在膝盖骨上。她的眼睛还带着哭过的红血丝，但瞳孔的焦距已经收束成了清晰的一点，对准了靠在墙边的男人。“本质上你和那个家伙是一个人吧。“'

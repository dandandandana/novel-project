content: '既然这一击没能得手，希耶尔面色一沉，握紧巨剑横扫而出，精准瞄准了Archer未被神兽之裘保护的部位。


  显而易见，Archer的武艺远在希耶尔之上，这一记横扫被他轻而易举挡下；一旁Saber的策应也收效甚微，Archer只轻轻挥了挥长弓，便将二人的攻击一同荡开。


  “只有这点程度吗？”Archer语气平淡地开口，指尖微动，下一道箭矢已然离弦，带着凌厉的破空声射向二人。


  希耶尔与Saber拼尽全力，才勉强挡下这记毫无保留的箭矢，三人随即陷入了诡异的对峙局面，空气中的张力几乎要凝固。


  Archer的目光落在希耶尔身上，眉梢微挑，语气里带着几分审视：“虽然不知道你从哪里来，但你身上的气息，让我很不舒服。”


  “哼，连我身旁的法兰西圣女都没说什么，你又算什么东西，也配评价我？”希耶尔毫不客气地回怼，语气里满是不屑。


  “无论如何，你不该当着我的面诋毁我的盟友，Archer。”Saber握紧银剑，身形微微弓起，朝着Archer纵身跃去，攻势干脆利落。


  【完全不设防……这么明显的破绽，是故意的？】Archer心底暗忖，眼底掠过一丝疑惑，却又瞬间了然。


  他下意识看向希耶尔，果不其然，这位战斗修女也同步动了起来，显然是早有预谋。


  希耶尔握着那柄与她纤细身形极不相称的巨剑，手臂发力，朝着Archer狠狠横扫而来，劲风裹挟着凌厉的杀气。


  Archer反应极快，先朝着空中的Saber射出一箭阻拦，随即握紧许德拉长弓，转身迎向希耶尔的巨剑。


  砰！


  沉闷的撞击声骤然响起，空中的Saber精准挡下Archer的箭矢，周身泛起淡淡的白光，像是有某种力量正在觉醒。


  此时Archer正奋力抵挡着希耶尔的巨剑，余光匆匆瞥向上方的Saber，神色骤然一凝。


  【这是什么力量？】


  他来不及细想，腾出一只手，凝聚起魔力，朝着Saber狠狠一拳砸去。


  见状，Saber低声念出几句法语咒文，那清晰的音节传入Archer耳中，他竟瞬间读懂了其中的含义。


  【神啊，祝福于我。】


  身为Saber职介的贞德，被召唤时便有些反常——她没有携带标志性的圣剑与魔剑，反倒多了一项特殊的保有技能。


  [保有技能：神之祝福]


  这项技能能将信仰与祝福附加于剑身，以此增幅Saber的近战能力。


  平日里，这项技能看似十分鸡肋——Saber本身便拥有高等级的启示与魔力放出，神明赋予的近战增幅，于她而言就像蛋糕上多余的糖粒，可有可无。


  可此刻，这看似无用的技能，却成了破局的关键。


  神之祝福将Saber手中的银剑，直接提升到了神造兵器的水准。


  Archer的狮子皮虽能无视一切人造物的攻击，可面对被神明洗礼过的银剑，这层防御便彻底失效——银剑已然脱离了人造范畴，拥有了对抗神兽之裘的力量。


  也就是说，这柄被祝福的银剑，终于能破开Archer的防御，对他造成真正有效的伤害。


  冲天白光骤然炸向Archer的拳头，他闷哼一声，拳头上瞬间裂开深可见骨的伤口；许德拉长弓仍被希耶尔死死压制，与此同时，Saber挥出华丽一剑，银剑上迸发的白光，照亮了终日黑夜的冬木。


  Saber低喝出声，握着银剑的手骤然发力，顺着Archer试图压制她的拳头，狠狠划下。


  希腊大英雄的反应快得惊人，他猛然一跺脚，厚重的天花板瞬间崩裂坍塌。


  一旁手持巨剑的希耶尔眉头紧蹙，而Archer借着三人一同坠落的间隙，挣脱了被牵制的手，猛地朝Saber抓去。Saber无奈放弃近在咫尺的必杀一击，一脚踹在Archer的左臂上，借着反作用力迅速后退，拉开了距离。


  Archer迅速扯下缠绕在许德拉之弓上的带子，趁着坠落向下一层的间隙，再度拉满了长弓。


  明明只是一箭，却裹挟着九条巨龙的龙吟之声，裹挟着凌厉的魔力，朝着希耶尔与Saber疾驰而去。


  Saber垂眸望着近在咫尺的流光，手腕一沉，将银剑稳稳插在脚边。


  “吾主在此！”


  再度展开的防护屏障稳稳挡下了Archer的箭矢，可残余的流光依旧穿透屏障，狠狠刺穿了希耶尔的胸口。她面容狰狞，难掩剧痛，却仍拼尽全身力气，握着巨剑朝着Archer猛扑过去。


  轰隆一声巨响，Archer重重砸在地板上——被希耶尔用魔力强化过、泛着蓝光的地板，死死拦住了他继续下坠的势头。下一秒，他原本绑在许德拉之弓上的军带骤然变形，化作一杆厚重巨斧，Archer抬手握住，朝着扑来的希耶尔狠狠抡去。


  “挡！”'

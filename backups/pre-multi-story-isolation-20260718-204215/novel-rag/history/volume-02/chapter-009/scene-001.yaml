content: '“这里怎么会有这么多游荡的死徒？！言峰前辈！”


  玛修握紧盾牌，狠狠推开身前一具活尸般的死徒，紧接着反手一盾砸下，干脆利落地击碎了对方的头颅。


  言峰士郎、玛修与藤丸立香三人组成小队，正小心翼翼地朝着Archer驻守的酒店底层靠近。


  “这些是尼禄·卡奥斯放出来侦察的死徒。”身旁的言峰士郎语气平淡地应道，反手两剑，利落斩杀掉身后扑向立香的几只奇形异形，下一秒，便听到了Archer朝着西方狙击的破空声。


  “那是……Archer在狙击柳洞寺的方向？”


  立香望着那道划破夜空的流光，轻声低语道。


  “大概是。Archer不会狙击Berserker，看来是有新来的从者了。”士郎低声说道，语气却带着不容动摇的坚定，“但我们的计划已经定好，必须解决Archer，箭在弦上，不得不发。”


  “了解！前辈，我先走一步！”玛修沉声应道，深深看了士郎一眼，语气郑重，“请务必保护好立香前辈。”


  “当然。”士郎微微颔首，语气笃定。


  “那就按计划进行，去吧，玛修。”立香轻轻点头，目送着玛修的身影迅速朝着酒店顶层奔去。


  “接下来……”


  立香转头看向士郎，语气坚定：“该做我们的事了，言峰，按计划来，对吧？”


  ===


  Archer收起长弓，目光落在跃至酒店顶层的Saber身上，神色复杂。


  “高洁的圣女哟，说实话，我实在不愿与你为敌。”Archer沉声开口，指尖却依旧稳稳拉着弓弦，没有半分松懈。


  “大英雄，抱歉，看来我们不得不拼个你死我活了。”


  Saber眼神平静无波，脚步轻踏，银剑直刺而出，动作干脆利落。


  Archer刚要放箭，体内的“心眼”骤然发出警报。


  北边有箭矢袭来。


  是神兽之裘也无法抵挡的力量。


  必须回避！


  心眼的警示瞬间刻入脑海，Archer毫不犹豫地转身，用身上的狮子皮挡住Saber的银剑，同时松开弓弦，射出一箭拦截偷袭而来的箭矢。


  可他射出的箭矢，对那记偷袭几乎起不到阻拦作用。Archer立刻意识到无法拦截，当即调转方向，挥起长弓朝着身旁的Saber砸去。


  Saber没有丝毫犹豫，将银剑狠狠插入地面。


  “吾主在此！”


  一道无形的物理结界瞬间展开，稳稳挡住了Archer的攻击。即便那支偷袭的箭矢射中Archer，引发剧烈爆炸，Saber的结界依旧纹丝不动。


  此刻的Archer浑身血肉模糊，可他高大的身躯依旧挺拔凛然，身上的伤势在“十二试炼”的作用下，瞬间恢复如初。


  “原来如此，让你做诱饵，用宝具保全自身，真正的杀招是那发A+对军级别的射击吗？”Archer毫不掩饰眼中的赞叹，黑色的眸子定定望着Saber，“真是明智的决断。”


  “而且，那支箭是洛基打造的莱瓦汀吧？你们从哪里弄到的？”


  Saber立起银剑，语气平淡：“这就没必要告诉你了，Archer。”


  “也是啊，Saber。”Archer身旁凝聚起狰狞的黑色毒素，再度弯弓搭箭，瞄准了北方。


  Saber踏前一步想要阻拦，Archer却在弯弓的同时猛地纵身跃起，躲过她的一剑，顺势将箭矢射向刚才偷袭的方向。


  箭矢如迁徙的飞鸟群般朝北方疾驰，每一支都裹着阴狠的海德拉蛇毒。确认Saber暂时无法破防自己的狮子皮后，Archer立刻将矛头对准了那名不知名的狙击手。


  猛禽不顾一切地追向在大楼间飞速移动的身影。轰隆隆——女人躲开了大部分箭矢，那些落空的箭矢撞上楼宇，瞬间引发剧烈爆炸，大楼轰然倒塌。


  Archer转头看向伫立在原地的Saber，眼底忽然闪过一丝了然。


  “你没打算阻止我？”


  “我阻止不了你，这是我们早已确认过的事。”Saber轻声回应，语气平静无波。


  Archer心头骤然一沉，不祥的预感涌上心头，他猛地睁大眼睛——北边的光芒已然抵达眼前。


  那似乎是炮击一类的攻击，靠着神兽之裘的保护，Archer并未受伤，却也因此短暂失去了对周围的感知。


  就在这时，Saber的剑已然刺至。


  Archer下意识挥起许德拉长弓，挡住了这一击。二人交手不过三合，Saber便直接放弃缠斗，与此同时，Archer以一个诡异的姿势将长弓向上一抬，稳稳挡住了破空而来的巨剑。


  “啧……没能得手吗？”身着黑紫色装甲的希耶尔，手中握着一柄藏蓝色的狰狞巨剑，轻轻咂了下舌，干脆利落地收回了攻击。


  【


  “我们的战术目标，是尽快削减Archer的性命。”


  “我需要Saber做诱饵，目标是直接夺走Archer的两条命。“


  】'

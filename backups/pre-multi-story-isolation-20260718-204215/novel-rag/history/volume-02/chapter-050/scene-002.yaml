content: '立香脚步未停，思绪却往回翻了几页。迦勒底的设立确实和天体科有深厚的渊源，那套观测系统、灵子转移的基盘理论，甚至玛修身上这套亚从者实验的雏形——全部可以从天体科的研究脉络里找到源头。


  “这样吗——也是。”


  “对吧对吧，去天体科确实没问题。”爱尔奎特笑着晃了晃脑袋，金色的发丝在灰尘弥漫的光束中划出弧线。她空想具现化的第四个水果是桃子，咬下去汁水顺着嘴角往下淌，她用袖口随意擦了一下。


  走廊的另一端传来脚步声。雅典娜从矿石科的方向走出来，手里夹着一本薄薄的目录册。她看见几人聚在走廊口，微微颔首，神态如同冰封的湖面下缓慢流动的水。


  “你们打算去哪里？”


  “天体科。”立香回答。


  “这样。”雅典娜将目录册合上，夹在腋下，“矿石科已经解析完了，没有需要的。我去矿石标本室再查一遍。”她迈开步伐，脚步声在石廊中逐渐远去。


  立香点头，跟上士郎的步伐。


  楼梯盘旋向上，每一级石阶都被磨出了凹陷的弧度，那是几百年来无数双脚印压出来的痕迹。墙上的灯台燃烧着淡蓝色的魔焰，光影在石壁上跳跃，将几人的影子拉得忽长忽短。


  天体科的办公室在三楼。门牌上的字已经斑驳，金色的漆皮剥落了一半，但“天体科”三个字仍然清晰可辨。木门上嵌着的铜制把手表面覆满绿色的铜锈，士郎推开门的瞬间，铰链发出锈蚀的呻吟。


  办公室比档案室小得多，但同样堆满了书与文件。办公桌上摊开的纸张已经泛黄，钢笔搁在墨水瓶旁，墨水瓶里的墨水干涸成黑色的硬壳。窗外的天光穿过封死不严的窗缝，在空气中切开几道斜斜的光柱，尘埃在光柱里翻滚。


  玛修没有加入翻找。她站在办公桌旁，看着立香翻开一本本牛皮封面的档案册，嘴唇动了动，没有出声。


  [前辈翻得很急。]


  她认识这种节奏——立香翻书的速度比平时快，指尖在纸面上停留的时间比平时短。玛修走到办公桌另一侧，拿起一本散开的卷宗夹，开始翻阅。


  [我也要更快才行。]


  士郎走到房间的中央，选择了一处没有家具的空位。他蹲下身，手掌按在地板上——石板冰凉，缝隙里嵌着经年的灰垢。魔力的蓝光从掌心渗出，以他为中心向外铺展，像水面的涟漪，一层一层漫过整个房间的地面、墙壁、天花板、书架、档案柜。


  蓝色的光络爬上每一本书，每一个档案袋，每一个抽屉。整个房间在他的感知中摊开成一幅密密麻麻的图景——纸张的纤维、墨水的化学成分、封皮的鞣制工艺，所有细节在魔力回馈中被解析、拆散、重组，形成一张完整的信息网络。


  同调结束。他收回手，站起身，指尖上沾了地板灰尘。


  “左侧三层第三本书，里面有亚从者的资料。右侧书架的档案袋里也有。”


  “我知道了，我去看。”立香立刻走向左侧书架，手指沿着书架层的边缘数过——一层、两层、三层——然后抽出一本暗红色封面的厚册。封皮上的烫金标题已经模糊，她翻开扉页，纸页的边角已经脆化成褐色，指尖触上去能感受到纤维的酥碎。


  玛修走到右侧书架，从第三个档案袋中抽出整沓装订好的文件。她翻开第一页，纸张上的墨水字迹工整而紧凑，密密麻麻的魔术术语排满了每一行。


  立香的目光扫过目录页，然后停在第三项。“亚从者实验记录——这是实验记录本。”


  “前辈，找到实验场所了。”玛修的手指按在文件的一行字上，她抬起头，视线对上立香的目光，“计时塔地下一层。”


  士郎微微挑眉。“竟然在计时塔。”


  他将双手交叠在胸前，指尖在手肘上敲了两下。地下一层——他们从正门进来，穿过大厅，上楼，翻档案室，再到天体科。地下室从一开始就在脚底下，地下一层有着计时塔的结界，而他们一开始也没打算先调查那里。


  “问题在于，我们不知道刻耳柏洛斯限制了什么。”


  “欸？”立香一愣，手里的实验记录本微微垂低。她的眉头拧起来，眉间挤出细小的竖纹。“确实是我的问题——”


  “问了大概也不会说。”士郎打断她的话，语调不重，“先去地下室吧。”


  四人迅速回到楼下。雅典娜已经去了矿石标本室，走廊里空旷安静，只有几人的脚步声在石壁间回荡。通往地下室的楼梯藏在计时塔大厅后侧的一道暗门后，士郎在暗门的边缘找到魔术触发的刻痕，指尖按上去，暗门无声滑开。


  楼梯向下延伸，越往下走空气越冷。石壁上的灯台少了一半，剩下的灯焰也不是三楼的淡蓝色，而是幽绿色的冷光。立香跟在士郎身后，玛修跟在立香身后，三人成一条斜线沿着狭窄的楼梯下行。'

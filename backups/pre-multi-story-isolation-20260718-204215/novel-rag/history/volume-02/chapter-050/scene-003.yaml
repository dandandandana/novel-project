content: '地下一层的甬道比地面上的走廊狭窄得多，两侧的房门间距紧密，门牌上刻着编号而非科室名称。士郎在进入甬道的第三步停住，蹲下身，手掌按在地面上测试。蓝色的魔力纹路从掌心冒出，然后被无形的力量推回，像撞上了看不见的壁障。


  “立香，同调在这里没法用。”


  “那就一个房间一个房间找吧。”立香走到最近的一扇门前，握住门把——铁制的把手冰冷，锈迹在掌心留下粗糙的触感。她转动把手推开房门，里面是堆放杂物的储物间，纸箱整齐码放，封条完好。


  她从储物间退出来，对爱尔奎特的方向提高了声音。“爱尔奎特小姐在外面守着可以吗？”


  爱尔奎特靠在暗门边的墙壁上，手里空想具现化出的第五个水果是柿子，她咬了一口，嘴里含混地应了一声。“嗯——去吧去吧，我在外面站着就行。”


  众人散开。立香推开第三扇门，跨入房间的瞬间就意识到了不同——储物间是整齐的，这里是有人经常使用的。桌上的纸张没有灰尘，钢笔放在墨水瓶旁的角度是随手搁下的慵懒，椅子的位置偏离了桌子的正中央，椅背上还搭着一条薄毯。


  “不是实验室——是办公室吗？”立香走到办公桌前，视线扫过桌面的布置，“为什么地下室会有办公室？”


  桌面上摆着名牌。她伸手拿起来，指尖擦过名牌表面的薄尘，露出下面的字迹。名牌上的照片映着一名黑发黑眸的少女，名字用烫金字体刻印得干净利落：


  【神琦彦凛】


  立香愣住了。


  [神琦。又是这个姓氏。]


  她将名牌翻过来看了看背面，没有别的信息，只是一块普通的塑料名牌。但桌面的摆放方式让她觉得不自然——东西摊开的范围太大了，有几本书半开着倒扣在桌面上，不像是整理后离开，更像是走到一半被打断。


  她把名牌放回原处，开始检查书架。书架上的书被翻得东倒西歪，有几本直接掉在地上，她一本一本地拾起来塞回原位，手指沿着书脊的缝隙往里探。探到最后一层，指尖碰到了硬物——书架背板上嵌着一个凹槽，凹槽的形状和名牌完全吻合。


  立香的眉头皱起。她拿起名牌，对准凹槽，摁进去。


  咔哒。


  “CHECK。”


  “CONFIRM。”


  不是她发出的声音。是房间发出的声音。


  然后——


  整个房间消失。


  翠绿的草地从脚下铺开，柔软的草叶被踩倒后缓缓弹回，每一根都带着水润的光泽。前方是一片湖泊，湖水碧绿平滑如镜，天空的云影在水面上缓慢移动。全息投影——用全息来形容最接近，但它比全息更真实，真实到脚底的草叶触感和真的一模一样，真实到湖面的微风掠过面颊时带着青草和水的腥甜。


  “阿拉阿拉，看样子有人来了~”


  湖面上浮现人影。金发碧眼的少女站在水面之上，穿着现代的便装——白衬衫，黑色长裤，袖子挽到手肘，看起来和翠绿的古代湖景格格不入却又无比自然。她用脚尖在水面上轻轻一点，涟漪从脚下扩散，一圈一圈推向湖心。


  “神琦家的后人，你们应该在猜测我到底在干什么吧~”少女笑着说。她的语调轻快，尾音上扬，带着真心实意的分享欲，就好像给自己的朋友炫耀今天的成果一样。


  立香的后脚跟踩实了草地。她稳定重心，压下心头翻涌的困惑。神琦家的后人——她在对那个叫神琦彦凛的人说话。这个投影已经录好很久了，它只是在播放。自己是阴差阳错触发了这段记录的第三个人。


  “当时我随手弄的礼装，没想到礼装竟然能够成为人形，还能孕育后代，家族能发展到现在，几千年来一直对你们不管不问真是很抱歉。”少女朝着立香的方向微微鞠躬，动作不深不浅，弯下腰又直起的弧度刚好让她的发尾从肩头滑落，金光在头发里跳跃了一瞬间。


  然后她直起身，眼睛弯成月牙。“我的名字是神琦灰，是你们的起源哦。”


  立香站在原地没动。她对神琦灰这个名字已经熟悉到不需要消化——从爱尔奎特口中，从士郎口中，从每一份关于弑神计划的档案里，这个名字在迦勒底被反复提起，成为了一道她必须面对的影子。但眼前的投影不是敌人，它的姿态、语气、表情都坦然地摊开着，像一个隔了几千年的学者终于等到有人敲了门。


  [是投影。不是本人。而且这个投影已经被留在这里很久了。]


  神琦灰背过手，在湖面上走了两步，鞋底贴着水面不曾沉下去，每走一步都漾开一圈薄薄的涟漪。


  “嘛，有些事情现在不告诉你们为好~”


  她转过身，笑容里带着对自己卖关子的得意。然后抬手，指尖在虚空中轻轻一点。


  “我要告诉你们的是这个。”


  “高等从者计划。”


  立香的脊柱不自觉挺直了。'

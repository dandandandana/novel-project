content: '神琦灰身侧浮现投影——比整个草地湖泊更小的投影，小到刚好圈出一个人形的轮廓，小到每个细节都清晰可见。那是从者的灵基结构图，魔术回路的脉络如同树木的枝干从核心向外展开，每一道分支都用不同颜色的魔力纹路标注了来源。


  “旨在创造能够对付BEAST级别的从者，职阶为Alter Ego。”神琦灰解释道。她的语调在此刻收敛了几分轻快，多了一股沉稳的火花，那是谈及自己研究成果时特有的专注。“零号Alter Ego，是我的试验作。一次成功，运气好得很呢~”


  她侧身让出投影的位置，手背在身后，脚尖微微踮起，整个人像在分享自己最得意的画作。


  立香的目光盯在投影上。她的瞳孔缩小了，呼吸在喉间滞住了一瞬。投影中的灵基分析图标注了三行来源——吉尔伽美什、爱尔奎特·布伦史塔德、宁录。


  “融合了英灵吉尔伽美什——话说回来为什么世界上的吉尔伽美什是女人，这问题我想了好几百年也没想通——算了不重要。”神琦灰摆了摆手，继续往下说，“融合了吉尔伽美什和真祖爱尔奎特以及宁录的灵基，最后被我放到一个特异点以吉尔伽美什身份度过了一生的从者，吉尔伽美什。”


  立香的胸腔里像被手掌托住了——心脏在掌心里跳动，每一跳都沉重清晰。


  [融合了吉尔伽美什和爱尔奎特的灵基。]


  就在刚才，就在计时塔外面的结界里，吉尔伽美什正和伊什塔尔对峙着。那个金色的王者来自这个计划——她的灵基是神琦灰的造物。


  [还有爱尔奎特。和宁录。]


  投影继续播放。神琦灰没有再多说，她只是微笑着站在投影旁，金发在湖面的微光中轻轻飘浮。


  脚下的湖水倒映出她的身影和天空的云，云影从她脸上滑过，表情在明暗交替中始终带着温和的善意。这个投影没有敌意——立香确认了第二遍。


  它只是一个人在几千年前录下的一段话，语气里是对后人能找到这个房间的期待，是对自己研究成果的真诚骄傲，是对人类存续的本能关切。


  “没记错的话计时塔不是在搞亚从者吗？也正好给他们参考。”神琦灰补充了一句，像想起了什么琐事，又像在轻轻推动某个更大的计划。


  立香的嘴唇微微翕动，想开口，但眼前的投影不是对话对象，它不会回应她的问题。她将双手垂在身侧，指尖抵着裤缝，用力到指节泛出细微的青白。


  [这种善意——不是伪装。她是真的把零号Alter Ego当成了值得骄傲的孩子在说。]


  湖面上的投影开始淡化，颜色从边缘向中心褪去，神琦灰的身影逐渐变得透明。她最后笑了一下，脚尖在湖面上轻轻一点，整个人化作细碎的金光，融进湖面倒映的天空里。


  草地渐退，湖水渐退，翠绿的光褪成石块墙面的灰。书架的轮廓重新从虚空中浮现，办公桌重新出现，桌上的钢笔、墨水瓶、薄毯——一切回到原样，只留下一块从凹槽中弹出的名牌，落在地上发出轻微的回响。


  立香弯腰拾起名牌。神琦彦凛的照片还在，黑发黑眸，面无表情。


  “是吗……”'

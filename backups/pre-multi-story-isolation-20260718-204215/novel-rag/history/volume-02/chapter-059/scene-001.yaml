content: '立香靠着走廊的石砖墙站直了身子。胃里那股翻涌的恶心已经退了下去，嘴唇还残留着刚才灌水冲淡的酸涩味。她有一搭没一搭地看着实验室那扇半开的金属门，铜质水壶在她手里来回翻了几圈，壶身凝着细小的水珠顺着指头滴在石板上。


  “前辈。”玛修侧过头透过面甲的缝隙看着她，把水壶往她手里推了推。“再喝口水？”


  “嗯，好的。”立香接过水壶仰头灌了好几口。水很凉，从喉咙一路滑到胃里把最后一点恶心的余热压了下去。


  她用袖子擦了一下嘴角，然后她看向看着玛修。“玛修，刚才的战斗有受伤吗？”


  “并没有。”玛修摇了摇头，黑色板甲的下颚护甲跟着晃了一下。“雅典娜小姐移植的灵基很完美——前辈的指令也是。”


  “当然完美。”一道女声从实验室里面传了出来，语调里裹着一层懒洋洋的得意。“那可是智慧女神的灵基。”


  士郎不知什么时候已经走到了立香的身旁。他的表情依旧是他一如既往的那样看不出什么神色。


  雅典娜从实验室里走出来，她面无血色——为了给玛修做手术把魔力消耗到了连嘴唇都发干的程度。她看着藤丸立香，蓝色的瞳孔在走廊的红光里闪了一下，刚要开口，她的手指捏在下巴上，嘴角扯出了一个斟酌的表情。


  “藤丸立香。我可是为你付出了——”


  “付出了什么？”言峰士郎把身子一横挡在她和立香中间。“不是一码归一码吗。”


  雅典娜的脸僵了，她瞥了喷嘴。她的不悦从眉心里挤出来，头往旁边歪了一个明显的角度。她瞪着他。“喂喂——够了啊，刚才你还没说爽？”


  言峰士郎顿了一下。他把头往旁边偏了偏看着雅典娜，那个表情就好像刚才雅典娜所说的话根本没传进他耳朵里一样。


  雅典娜往左边挪了一步。


  士郎跟着她往左边挪了一步。


  雅典娜又往右边挪了一步。


  士郎也跟着她往右边挪了一步——高大的身躯把走廊挡得严严实实，他白色的风衣后背横在立香面前像一面不怎么讲道理的人墙。雅典娜的鹅蛋脸上冒出了不加掩饰的不耐烦，她微微咂了一下舌。士郎完全不为所动，摆出一副“我就是不打算让你过去”的赖皮样子，琥珀色的瞳孔里没有犹豫只有一种近乎无赖的坚持。


  “士郎。”立香的声音从他身后响了起来。


  她的声音裹着一层薄薄的无奈，底下又压着一点连她自己都觉得荒谬的气音。“雅典娜小姐有话要跟我说。”


  雅典娜的脸上浮出了清清楚楚的烦躁，她的眉毛压低了一点，舌尖在齿缝间轻轻弹出一个细微的啧声。


  士郎高大的身躯往旁边一侧，让开位置的时候风衣的下摆扫过石板地面发出极轻的摩擦声。


  “哼哼，还是MASTER的话管用啊。”雅典娜跨过他让开的空位走到立香面前，嘴角挂着一丝终于得了逞的笑意。她笑眼看着立香开了口。“那么，藤丸立香——你大概也听到了，你的从者玛修·基列莱特的灵基是由我的灵基移植过去的。”


  她摊了摊手，那双手的指尖因为魔力消耗还在轻微地发抖，但她的语调很从容。“我现在已经没什么战斗力了。”


  “非常感谢，雅典娜女士。”玛修立刻开口，声音透过面甲传出来带着一股闷闷的紧张。她的手指在盾牌的握柄上轻轻收紧。“我不知道该怎么——”


  “欸。”雅典娜伸手在半空中摆了摆打断了玛修的话。“这不是在和你的御主谈这个问题吗?”她的目光转回到立香脸上，语调从刚才的得意慢慢沉下来，恢复了智慧和认真。“如果你想要报答，那就身为英雄战斗下去吧。”


  雅典娜的话头重新转向立香，这一次她的语气比刚才更正式了一些。“藤丸立香，我的要求是……我要进入迦勒底。”


  立香怔了一下。“额，这不是你之前的条件吗？”她的语气里带着意外，没想到雅典娜会再度把这件事拿出来作为正式谈判的筹码。


  “毕竟之前干了不好的事情。”雅典娜低眉说了一句，话音还没完全落地——她忽然听到了爱尔奎特的咆哮从身后炸开来。


  “就是啊蠢货！”白发的真祖被伊什塔尔从士郎手里接过来的时候还在喘着粗气，现在却已经被金星的银发女神揉得头发都炸了。“搞那种事情——真的是智慧女神能干出来的吗?!”


  伊什塔尔此时正把爱尔奎特揽在怀里，一只手抚摸着金发赤眸的真祖的脑袋揉得飞快，嘴里振振有词地嘟囔着，她的眼神带着雀跃的样子：


  “哇之前没发现，你长得这么像吉尔伽美什啊！”


  “你这个笨蛋女神不许揉我脑袋！”爱尔奎特伸手去挡，手指从伊什塔尔的指缝间穿过去根本挡不住。她仰起头瞪着红宝石一样的眼睛。“再揉我咬你哦！”


  伊什塔尔揉得更快了，手指在金发里搅得比刚才还用力，脸上浮出一种发现好玩东西的孩子气的开心。“性格也好好，你们真祖都这样吗？好想抱回去养着，你还有同族吗？”'

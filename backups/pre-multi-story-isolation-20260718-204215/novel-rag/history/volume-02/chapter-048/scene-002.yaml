content: '立香的手往腰侧靠近了一点，没有碰到任何东西。她转过头，看向士郎。


  士郎在整理一叠散落在地上的文件，把它们摞起来，边沿对齐，放到椅子上。他的手没停，“她说的是实话。神琦灰也是我们的目标。“


  “那是你从者说的。“爱尔奎特的声音从大厅另一头轻飘飘地传过来，“不代表你自己的判断吧。“


  “士郎给我情报和建议。“立香把话接回来，语气没有起伏，“决策是我做的。“


  爱尔奎特没有立刻接话。


  她把手指从桌沿上收回来，换了个方向，走向近处另一把椅子，在椅背上搭了把手，没坐，只是站着。然后她抬起头，手指点了点下唇。


  “那就问你。“她说，“迦勒底的御主，你怎么看？“


  立香想了想。“你做这件事之外，还有别的计划吗。“


  “没有。做完这个我就回千年城。“爱尔奎特像是说的是她这几百年里做过很多次的决定，“就这一件。“


  “那我认为可以信任。“


  爱尔奎特愣了一下。


  然后她笑了，真是松了口气之后的东西。“哎呀，这么谨慎。“她说，“好吧，就这样定了。我们是朋友了。“


  立香抬手拍了一下自己的脸。让自己回到当下的感觉，他深吸一口气开口道，“接下来……“


  她扫了一眼大厅。士郎这时已经把立香这一侧的区域整理得差不多了，近处的椅子都回到原位，倒落的架子靠了墙，散落的文件归了堆，虽然整个大厅还是一副经历过什么的样子，但至少靠近中心的这片地方有了一点可以站稳脚的余地。


  立香没有开口说“干得不错“，她只是看了一眼，然后把视线收回来，对上爱尔奎特和雅典娜。


  “我们需要找关于亚从者的资料，然后想办法救玛修。“


  雅典娜这时走近了玛修半步，没有靠太近，只是角度换了，能更清楚地看到对方的状态。玛修察觉到，抬起头，和雅典娜对了一下视线，没说话，但没有避开。


  雅典娜看了她几秒，收回目光。“救人优先。“她点头，“那就开始吧。“


  爱尔奎特已经在大厅里转了一圈。


  她没有做什么特别的事——碰了几本书，翻了翻一个靠近墙角的铁皮箱，又把箱盖合上，绕过倒落的一排书架，走到大厅最深处的一扇门前，伸手推了推，没开，退开一步，把这个信息存进脑子里，继续往别处走。


  立香一直用余光跟着她的动作。


  “你在找什么吗？“她开口问。


  爱尔奎特回过头，“啊？没有，就随便走走。“她说，像是这件事不需要解释，“大地和建筑之间有一种气息，待的时间长了就会留在地基里。我只是在感受一下这个地方经历了什么。“


  “然后呢？“


  “没有然后。“爱尔奎特耸了耸肩，“就是知道一下。“


  立香盯着她看了两秒，没再追问。


  士郎走到她身侧，声音压低了一点，“她不是在找什么东西。真祖对土地有感知，这是本能。“


  “我知道。“立香说，“我只是想确认她自己怎么解释。“


  士郎没有接话。他在这类对话结束之后习惯性地停上半拍，好像在消化，或者在确认立香不需要更多信息，然后才把注意力移开，回到整理大厅的节奏里去。


  玛修在这时候走过来，在立香左侧站定。“前辈，“她说，声音低，“亚从者的相关资料，我觉得在计时塔的档案室里可能会有——不是我有把握，只是根据过去迦勒底的资料判断的，魔术协会对从者灵基有系统性的研究。“


  “嗯。“立香应了一声，转向雅典娜，“你对这里熟悉吗。“


  雅典娜的回答没有迟疑，“了解一部分。我之前来过。“


  “可以接受。“立香说，“那么我们先搞清楚这个大厅的结构，找到可以进深处的入口。“


  她回头找士郎。士郎已经在朝那扇爱尔奎特推过的门走了过去，蹲下来，检查门缝，手指轻轻扣了一下边框。“上锁了，不是普通的锁，是封印型的。“


  “能解开吗。“


  “需要一点时间。“


  “那就先解。“


  爱尔奎特这时从大厅角落晃了回来，双手插在腰侧，用一种她来了才一会儿就已经在所有人都在做的事情之间挑了个空档插进来的自然劲儿，“我来。“


  士郎站起来，往旁边退了一步。


  爱尔奎特蹲到门前，手指贴上封印，闭眼，安静了三秒。然后她睁开眼，“这是魔术协会自己打的，不难。“她的手指在封印的边缘划了一道不可见的轨迹，空气里没有光，没有声音，只是那道门的锁卡了一下，然后门咔哒响了一声。


  她站起来，推开门，回头，“走吧。“


  玛修看向立香。


  立香已经在朝那扇门走了，步伐稳，没有犹豫。“走吧。“她说，把爱尔奎特刚才的话重复了一遍，但不是因为好笑，只是这两个字刚好够用。


  走廊比大厅更暗。'

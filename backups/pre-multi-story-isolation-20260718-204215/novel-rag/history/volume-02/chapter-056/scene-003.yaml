content: '立香后退一步。她的后背撞上了手术室的门，冰冷的金属质感透过衣服传到皮肤上。雅典娜就在这扇门后面给玛修做手术。她稳住脚步，没有再退了。


  朱月招了招手。她身侧的狂犬朝立香扑去，白色的身影在走廊里汇聚成一道汹涌的暗流。


  安魂的弹药如同被高负荷吞吐的数据一样被立香一发接一发射出。每一枪的枪声都紧跟着前一枪的余音，弹壳在她脚边堆成一小片金属的坟场。当白色安魂发出空仓的清脆响声时，她来不及换弹夹，手指在枪身上一抹，把安魂切成双剑模式。


  一剑斩出。


  读取武艺的负荷立马从掌心传上来，沿着手臂的肌肉一路爬到肩膀。立香咬牙坚持着，双剑交叉斩碎了迎面扑来的狂犬。刃口切开骨架的触感沉闷而绵密，和刚才枪击的干脆完全不同。她把几只狂犬斩碎之后，后背重新抵住手术室的门，弯下腰剧烈地喘气着。


  狂犬再度扑来。


  她想要再度举起双剑。手臂的肌肉在尖叫，从手腕到肩膀每一寸都在用疼痛告诉她已经到了极限。她没能把剑举起来。


  甚至立香连一个念头都无法想出，狂犬已经扑到了她面前。


  轰。


  马上要接近立香的狂犬被一件沉重的东西斩飞出去。那力道大得让狂犬的身体在半空中就碎成了好几块。立香缓缓站起身，视线越过散落的碎骨，落在面前的身影上。


  黑色的全身板甲。铠甲的表面流转着和第七圣典如出一辙的幽光，每一片甲叶都严丝合缝地咬合在一起。紫发的少女握着那柄展开为剑形态的第七圣典，剑刃上还残留着狂犬碎骨的粉尘。她转过身来，粉色的瞳孔透过面甲的缝隙看着立香。


  立香真切地笑了起来，那张疲惫到极点的脸上绽开一个完全没有保留的弧度。“玛修！”


  “前辈。”玛修把第七圣典的剑尖往石板上一顿，金属撞击石面的声音沉闷而庄严。她一字一顿地开口，每一个字都像是从胸腔里敲出来的。


  “从者——玛修·基列莱特，在此。”'

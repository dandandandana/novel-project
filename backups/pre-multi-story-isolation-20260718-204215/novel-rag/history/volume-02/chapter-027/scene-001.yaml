content: '暴雨冲刷过的废墟地面上积着半寸深的浑水，碎石和泥浆搅在一起，泛着一层浊黄色的浮沫。赫拉克勒斯的脚掌踩在这层烂泥里，靴底的纹路已经被磨平了大半，每一步踏下去都会挤出一圈黏稠的水渍。他站着没动，双眼盯着十步之外的那个东西。


  那不是人。


  他见过很多不是人的东西。九头蛇、涅墨亚狮子、厄律曼托斯山上的野猪。他杀过的怪物能从伯罗奔尼撒排到色雷斯去。但眼前这个东西和那些怪物不一样。那些怪物至少有一副对称的、遵循某种自然法则的身体。而面前这头狂犬，它的骨架本身就是错的。


  赫拉克勒斯的双脚猛地蹬开地面。


  他的身体向后弹射出去的速度极快。靴底在积水上划出两道白色的水痕，溅起来的泥浆还悬在半空中没来得及落地，他已经退出了十五步以上的距离。在后退的过程中，他的右手探向腰间。缠绕在腰腹上的军带在他手指的牵引下松开、拉直、弯曲、绷紧，金属质地的带面在暴雨中被拗成了一个流畅的弧形。


  弓弦成型。


  弓臂到位。


  整个变形过程不到一秒。当赫拉克勒斯的后退动作停下来的时候，他的左手已经稳稳地握着一柄由军带变成的长弓，右手三指搭在弓弦上，弦已经拉满。


  他没有搭箭。


  不需要。


  “射杀百头。“


  弦音炸响的瞬间，九道箭矢的残影从弦面上同时弹射而出。那些箭矢没有实体箭杆，没有翎羽，没有箭簇。它们是被赫拉克勒斯的技艺本身凝聚出来的力量投射，每一道都拖着一条灼白色的尾迹，九条尾迹在暴雨中交错编织成一张覆盖了整个前方扇面的死亡网格，朝着那头蹲踞在废墟中的狂犬呼啸而去。


  Berserker没有躲。


  它连挪动一下脚步的意思都没有。那些箭矢撕裂雨幕朝它飞来的时候，它只是把那颗畸形的头颅微微偏了一下，一只陷进眼窝深处的眼珠从黑洞洞的窟窿里折射出一点幽暗的光。


  九根箭矢到了它面前。


  偏了。


  第一根从它的左耳旁边擦过去，箭矢的尾迹灼焦了几根竖立的硬发，发出滋滋的焦臭味。第二根钻进了它脚边的碎石堆里，炸开了一个碗口大的坑。第三根、第四根、第五根，全部以极其微小的角度从它的身体轮廓边缘滑过，最近的一根几乎贴着它的胸口飞走，但“几乎“就是没有命中。


  九根箭矢。一根都没有打中。


  赫拉克勒斯的手指还保持着松弦后的姿势，三根手指微微弯曲。他看着那头狂犬的位置，看着九根箭矢偏移的轨迹。


  那种偏移的方式不对。


  好似是被环绕在Berserker身上的某种光环配合着他的诅咒挡开了一样。


  不是箭射歪了。他的射杀百头不存在射歪的可能，九根箭矢的精度和他十二功业中斩杀斯廷法利斯湖怪鸟时一模一样。但那些箭矢在接近Berserker的最后一段距离里，轨迹被拧了。像是有一只看不见的手，在箭矢即将命中的瞬间把它们轻轻拨开了那么一丁点。


  “……原来是这样。“


  他的嘴唇动了一下。声音很低，被暴雨盖住了大半。但那句话里的内容，他自己听得清清楚楚。


  围杀吉尔伽美什的时候，那位英雄王提到过。爱尔兰的光之子天生持有一种对飞行道具的加护。但那个时候和他们一起战斗的Berserker身上没有这种效果。


  那头Berserker已经不是之前那一头了。


  “换了人了。“


  他的右手松开弓弦，左手翻腕，长弓的弧度在他掌心里急剧变形。弓臂折叠，弓弦收回，军带的金属带面重新拧合在一起，被他的手指和魔力揉捏成另一种形态。宽幅的刃面从他的掌心延展出去，一柄阔剑在不到半个呼吸的时间内成型。


  刀刃还没完全凝固定形，Berserker已经冲过来了。


  它的移动方式和任何一种已知的奔跑姿态都不同。膝盖是反的，脚趾是反的，它的腿不应该能跑出这种速度。但它在跑。后翻的脚掌以一种违反所有运动逻辑的方式蹬开地面，每一步踏下去都在积水里炸出一个深坑，溅起来的泥浆甩到两人多高。它没有用枪。双手，或者说那些扭曲到分不清哪只是主手的肢体，全部张开着朝赫拉克勒斯抓来。指头弯成钩状，指甲的边缘泛着一层淡淡的黑光。


  赫拉克勒斯没有后退。


  他直直的迎了上去。


  阔剑横在胸前，刃面朝外。Berserker的右手扑到了剑面上，五根弯曲的手指扣住了刃口，指甲在金属表面刮出一串尖锐的白印。力量沿着刃面传到剑柄，传到赫拉克勒斯的手腕和前臂。他的脚在积水里向后滑了半寸，靴底碾碎了一块埋在泥浆下的碎砖。


  他稳住了。


  左脚前踏一步，腰胯发力，用阔剑的刃面把Berserker的手臂往外格开。同时右腿提起，膝盖收紧，一脚踹在了Berserker的腹部。'

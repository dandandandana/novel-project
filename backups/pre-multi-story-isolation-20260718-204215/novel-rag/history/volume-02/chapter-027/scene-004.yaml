content: '八柄短枪。长在它的手上。从指骨的延长线上自然生长出来，像是从一开始就属于它身体的一部分。枪身的颜色是深沉的暗红，表面有细密的铭文在火光的映照下若隐若现。每一柄枪的长度大约与前臂相当，尖端打磨得极其锋利，枪尖在暴雨中切开水帘，水滴从刃面两侧滑落的时候会被分成两半。


  八柄赤红色的短枪。四柄在左手，四柄在右手。从掌心延伸出去，像是一头猛兽的利爪。


  赫拉克勒斯看着那八柄枪。


  他认不出来。


  他的心眼能够感知到武器中蕴含的神秘等级和大致属性，但这八柄枪的铭文用的是他不认识的文字体系，刻在枪身上的魔力回路也不属于他熟悉的任何一个神代文明的风格。它们来自另一片土地、另一套传说、另一群神明。


  他唯一能感知到的是危险。


  心眼在报警。不是之前那种“注意一下“的低频提示，是一种尖锐的、持续的、几乎要在他的直觉层面戳出一个洞来的高频警告。那八柄枪上裹着的东西，不仅仅是物理意义上的锋利。有别的什么。比刃口更危险的什么。


  【不能被刺中。】


  赫拉克勒斯往后撤了一步。阔剑的握法再次调整，从攻击向的前握切换成了防御向的后握，刃面竖在身前，剑身的宽幅刚好覆盖住他躯干的正面。


  Berserker没有给他完成防御部署的时间。


  它消失了。


  不是速度快到看不清。赫拉克勒斯的动态视力在从者中属于顶级水准，他能够追踪到A+敏捷等级的运动轨迹。但Berserker的移动方式不在他的追踪经验范围内。那头狂犬在暴雨中的位移路线不是直线，不是弧线，不是任何一种可预测的几何轨迹。它的后翻的脚掌以那种违反运动逻辑的方式在地面上连续蹬踏，每一步的方向都和上一步不同，身体的重心在每一个步幅之间做出幅度极大的偏移，整个移动过程像是一只被火灼伤的野兽在地面上弹跳。


  然后它到了赫拉克勒斯的身侧。


  “轰！“


  八柄赤红色的短枪和阔剑撞在了一起。


  赫拉克勒斯的右手持剑，他用刃面正对着Berserker右手伸过来的四柄枪尖。四根赤红色的金属尖刺同时扎在阔剑的刃面上，接触点迸出一簇密集的白色火花。冲击力沿着剑身传过来，震得他的虎口发麻，手腕的骨节发出一声闷响。


  近身距离上，短枪比阔剑更灵活。赫拉克勒斯在第一次交锋中就意识到了这个问题。他的阔剑需要空间来挥动，需要手臂的弧度来制造杀伤力。但Berserker的短枪长在手上，不需要挥动，不需要弧度，每一次攻击都是直刺。从任何一个角度，以任何一种姿势，只要手臂伸出去，枪尖就到了。


  但赫拉克勒斯的力量够大。


  阔剑的刃面横推出去，把Berserker的四柄枪尖同时格开。金属摩擦的尖啸声在暴雨中炸响。他的左手握拳跟上，砸向Berserker甲胄覆盖的腹部。拳面在接触甲胄的瞬间发出一声沉闷的钝响，火花从拳头和甲胄的接触面上迸溅出来。


  Berserker纹丝没动。


  赫拉克勒斯的拳头有A+筋力的加持，这一拳的力量能把一座大型塔楼的承重墙打穿。但Berserker穿着那副燃烧着的炎气甲胄，双脚钉在碎石地面上，就那么硬生生吃下了这一拳。甲胄的表面凹进去了一小块，火舌从凹陷的边缘喷出来，但Berserker的身体一寸都没有后退。


  二十几合。


  暴雨中，两个从者级别的战斗体以肉眼几乎无法追踪的速度缠斗在一起。阔剑和八柄短枪在每一次碰撞时都会炸出一圈白色的冲击波，将周围的雨幕震开一个球形的真空区域。真空区域存在不到半秒就被新的雨水填满，然后下一次碰撞又会把它们再次震开。


  赫拉克勒斯的力量仍然是顶级的。他的每一剑都够重，每一次格挡都够稳。但Berserker在力量这个维度上，压过来了。不是压倒性的碾压，是一种持续的、稳定的、每一次交击都比上一次多出那么一丁点的渐进式压制。阔剑每一次接住短枪的刺击时，赫拉克勒斯的手腕都要多用一分力来维持住剑身的角度。他的脚在湿滑的碎石地面上一步步地后退，每一步退得都不多，但确实在退。


  第二十三合。赫拉克勒斯找到了一个间隙。


  Berserker的右手四枪从上方刺来，赫拉克勒斯侧身闪过，阔剑反手格开了跟进的左手攻击。在两只手都被格开的短暂空窗里，赫拉克勒斯的左手松开了辅助握剑的位置，攥成拳，腰胯猛然旋转发力，一记直拳砸向了Berserker的头部。


  A+筋力的全力出拳。


  拳头砸在了Berserker的甲胄面罩上。冲击波从接触点向外扩散，震碎了两人脚下的地面，积水和碎石同时被弹射出去。甲胄面罩的表面出现了一道裂纹，裂纹从拳头的落点辐射出去，像干涸河床上的龟裂。'

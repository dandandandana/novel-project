content: '“嗯哼？”Saber微微挑眉，但没有反驳。


  “并非如此，另有其人。”吉尔伽美什的声音突然响起，带着几分慵懒，“倒不如说，正因为士郎和那位英灵的相性太高，我才特意给他准备了贞德的圣遗物。”


  这句话一出，教堂里瞬间陷入了沉默，连空气都仿佛凝固了几分。


  “哼……金色的王，你的意思是，还有人比我更适合成为他的从者？”法兰西的圣女眉头微蹙，语气里的不悦毫不掩饰。


  “自然。”吉尔伽美什的语气带着几分理所当然，“不过，你也还算合本王的心意。”


  “……只有我一个人好奇，那位英灵是谁吗？”立香幽幽地开口，打破了尴尬的沉默。


  “奥尔加玛丽，本王命令你，去查2009年的那场圣杯战争——就是你父亲参加的那一场。”吉尔伽美什的语气瞬间严肃起来。


  “真是的……我才是迦勒底所长啊，凭什么被你呼来喝去！”奥尔加玛丽抓狂地喊道，“都怪那个爱尔特璐琪，现在我的员工还在医疗部躺着呢……”


  “杂修，这是本王在给你线索，别不知好歹。”吉尔伽美什的语气带着几分不耐。


  “查到了……2009年，东京圣杯战争……哈？参战者名单？你在逗我吗？”奥尔加玛丽的声音突然蔫了下去。


  “木舞明美，不出名却是胜者；艾蕾西亚，这是战斗顾问的名字吧？神琦灰，就是你说的埋葬机关第二席？还有言峰士郎……”她念着名单，语气越发无奈，“你们这是埋葬机关来这里团建了？等等，马里斯比利……”


  奥尔加玛丽突然顿住，声音里满是震惊。


  “就是这场圣杯战争，导致我家破产的？！”


  “对。”吉尔伽美什的回答简洁又干脆。


  “吉尔伽美什——！啊啊啊都怪你们！”奥尔加玛丽悲惨的哀嚎声从通讯器里传来。


  “并非如此，奥尔加玛丽所长。”希耶尔轻声开口，语气平和，“我们当时的目的，是协助你父亲赢下那场圣杯战争，而且那场战争，本质上就是为他准备的。”


  “欸？那为什么……我家还是破产了？”奥尔加玛丽的声音里满是疑惑。


  “只能说，你父亲的野心太大了。”吉尔伽美什的语气带着几分嘲讽，“他想把这个时间线改造成异闻带，再利用迦勒底亚斯制造出BEAST VII，中途被我们和他的从者发现了。本来打算协助他搞出来迦勒底，整个圣杯战争不过是一场陪他整的戏剧，结果他非得飞蛾扑火。”


  “……哈？我父亲他，竟然想做这种事？”奥尔加玛丽彻底愣住了，声音里满是不可置信。


  “他的想法从一开始就是错的。”希耶尔补充道，“说起来，我们留他一条命，已经算是手下留情了。”


  奥尔加玛丽沉默了许久，才缓缓开口：“这件事，等你们回来再说。不管是为什么重建迦勒底，还是我父亲的事，我满肚子都是疑问，但现在，最重要的是你们能安全回来。”


  “很明智的判断，所长。”希耶尔赞许地点了点头。


  “好了，回到刚才的话题。”吉尔伽美什的声音再次响起，“如果不用圣遗物，士郎会召唤出亚瑟王。本王绝不能接受，他在这个年纪召唤出那位亚瑟王，虽然是暴君，但是本王不接受。”


  “……完全跑题了啊！”立香猛地一拍桌子，指尖因为用力而泛白，无奈地喊道，“等等！我们不是在开战术讨论会吗？怎么扯到亚瑟王身上了！”'

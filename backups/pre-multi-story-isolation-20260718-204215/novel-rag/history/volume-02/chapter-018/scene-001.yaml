content: '看着眼前眼眶泛红的立香，言峰士郎缓缓撑着床沿坐起身，声音轻得仿佛怕惊扰了她：“立香，我觉得这种时候，我个人的生死并不重要。”


  他顿了顿，嘴角勾起一抹浅淡的弧度，语气里带着几分漫不经心的释然：“而且只是濒死而已，又不是没有经历过——这种事，我早就习惯了。”


  “在我眼里，用一次濒死换取反败为胜的战机，已经是极其划算的事了，立香。”


  “什……”立香猛地愣住，到了嘴边的反驳硬生生卡住，晶莹的泪珠顺着脸颊滑落，砸在衣摆上。


  “嗯，这么说吧，多数时候，濒死就能换来转机，这笔‘交易’很值。”士郎的声音依旧温和，指腹温柔地擦去她眼角的泪，“立香，此刻我是战士，是你的搭档，我们本该为彼此负责，不是吗？”


  “可是……”立香的声音带着哽咽，话未说完，便被士郎的动作打断。


  “没什么可是的。”他轻轻摇头，语气里多了几分不容置喙的坚定，“这也是我想做的，而且……这分明是主赋予我的任务。”


  “既然是主的旨意，我就一定会去完成。”言峰士郎的目光澄澈，却藏着一丝不易察觉的闪躲。


  立香深吸一口气，用力眨掉眼眶里的湿意，缓缓站起身：“这样吗……我知道了，言峰士郎。”


  “好了，与其在这里纠结，不如去开作战会议，说不定还能想个办法，让我少受点疼呢。”士郎轻轻的开口道。


  藤丸立香却没有被带偏，她定定地看着士郎，声音轻却坚定：“不……不对，士郎，你在转移话题。”


  “什么？”士郎微微一怔，眼底闪过一丝慌乱。


  “我说，你在转移话题。”立香一字一句地重复，脚步缓缓靠近，直到两人距离近得能闻到他身上淡淡的圣堂熏香与硝烟混合的气息，“我想问的是，你为什么能这么轻易地说出来？为什么面对‘要让自己濒死’这个条件，你毫无触动，直接就跳到了战术层面，士郎？”


  士郎看着眼前眼神执拗的少女，沉默了片刻，轻轻叹了口气，眼底的慌乱被无奈取代。


  “立香，我只是觉得……我本该这么做而已。”


  “理由和我刚才说的一样，最坏的结果不过是我丢了性命，但能换你们所有人活下来，不是吗？”他的声音放得很低，带着一种近乎自我放逐的温柔，“那就够了，对我而言，这样就足够了。”


  藤丸立香沉默着站起身，低头拿起一旁的毛巾，胡乱擦了擦脸上的泪痕，目光紧紧锁在士郎脸上，片刻后，转身朝门外走去。


  “半小时后开作战会议，士郎如果能下床的话……”她走到门口，脚步顿住，回头看了他一眼，声音里还带着未散的沙哑。


  “我的身子没什么问题，很轻便。”士郎轻声回应，缓缓挪下床，轻轻活动了一下四肢，确认没有大碍后，又在房间里慢走了几圈。


  立香看着他的动作，忽然快步上前，伸手紧紧捏住他的衣领，指尖因为用力而微微泛白，声线抑制不住地颤抖：“士郎，我不想让你死，所以我会拼尽全力的！”


  “也请你，一定要尽力活下来！”


  士郎无奈地笑了笑，抬手轻轻拍了拍她的手背：“好的，我会的，藤丸立香小姐。”


  立香点了点头，松开手，扭头快步离开了房间。


  房门关上的瞬间，士郎脸上的笑容瞬间褪去，他靠在墙上，轻轻叹了口气，眼底翻涌着复杂的情绪。


  他告诉立香的话，半真半假。


  他确实愿意去做这件事，只是理由，他撒了谎。


  根本没有什么所谓的“主的任务”，他打心底里，从来都不认为自己是一名虔诚的信徒。


  虔诚的信徒，是发自内心地信仰主，一言一行都源于真心；而言峰士郎，不过是被教导着“应该这样做”。


  被教导要信仰主，被教导要践行信徒的准则，被教导要牺牲自我。那些所谓的“虔诚”，从来都不是他的本心，只是刻在骨子里的习惯——他不是“想做”，只是“该做”。


  这次也一样。他并非发自内心地信奉什么旨意，只是下意识地觉得，自己本该如此而已。


  “告诉他了？”希耶尔坐在桌前，指尖轻轻搭在桌沿，抬眼看向刚从卧室走出来的立香，语气平静得没有波澜。


  “嗯。”立香点点头，眼底的红意还未完全褪去，声音带着一丝不易察觉的沙哑，“他接受了。”


  “言峰士郎向来如此，信我的就好。”希耶尔垂眸轻语，指尖无意识地摩挲着袖口的纹路。


  立香一屁股瘫坐在桌边的椅子上，身子微微前倾正要开口，像是突然想起什么，猛地顿住了动作。


  “哦对，忘了开通讯器了……希望吉尔茜已经消气了。”她抬手揉了揉眉心，语气里满是无奈。


  没人会忘记，先前得知需要让言峰士郎濒死触发月虹时，吉尔伽美什那诡异的沉默——那是暴风雨来临前的死寂。'

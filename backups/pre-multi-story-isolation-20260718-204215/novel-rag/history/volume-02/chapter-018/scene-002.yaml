content: '下一秒，她便彻底爆发，对着当时还附身在士郎身上的Ruler残响肆意宣泄怒火，言语间尽是人身攻击，可这点攻势毫无用处——刚骂到第二句，就被对方用一句“若你有更好的办法，不妨说出来”噎得哑口无言。


  吉尔伽美什怒火更盛，立香实在没办法，只能单方面切断了通讯。


  指尖按下通讯器开关的瞬间，奥尔加玛丽略显急促的声音率先传了出来。


  “看来你们商量好了？言峰士郎，他答应了吗？”


  “杂修！他就算答应，本王也绝不会让他去送死！”吉尔伽美什的怒吼紧接着响起，震得通讯器微微发颤。


  “吉尔伽美什！你闲得慌就去把埋在地下的达芬奇挖出来啊！她都在底下挖了快三天了！”奥尔加玛丽的声音里满是抓狂，隐约能听到两人推搡的动静。


  “那种无聊的琐事，凭什么让本王去做？”吉尔伽美什的语气满是不屑。


  “那你就少废话！好了立香、战斗顾问，你们到底打算怎么做？”奥尔加玛丽似乎按住了吉尔伽美什，声音带着几分喘息。


  “还能怎么做。”立香叹了口气，语气里满是无奈，“Archer在高处警戒，会实时通报战场情况。我们得在Alterego撑不住之前，想出别的办法。”


  “插一句，迦勒底的各位。”伊莉雅端着茶杯轻轻抿了一口，缓缓开口，“我们的补给不多了，大概只剩两天的量，迦勒底能送物资过来吗？”


  “做不到。”奥尔加玛丽的声音瞬间沉了下来，“现在连反灵子召唤都无法进行，更别说运送物资了。”


  “既然如此，我们至少要留一天补给应对后续可能出现的敌人。”希耶尔抬眼，目光扫过众人，语气坚定，“也就是说，明天必须出发。”


  “这样啊……决战，就在明天了吗。”立香垂眸，指尖无意识地抠着桌沿，声音低得像呢喃。


  就在这时，卧室的门“吱呀”一声被推开，言峰士郎走了出来，身姿依旧挺拔，只是脸色还有些苍白，他看向桌边的众人，轻声问道：“有得出什么结论吗？”


  “有，不过全是坏消息。”希耶尔直言不讳，“我们的补给，只剩下两天了。”


  “毕竟你们来了啊，多了三张嘴。”士郎笑了笑，语气轻松，“教会本来储备的食物就不多，我猜，明天就要动手了吧？”


  “对。”希耶尔点头应道。


  士郎刚走近，立香就伸手一把拉住他的手腕，将他拽到自己身边的座位上。士郎顺势落座，目光转向希耶尔，等待着后续的安排。


  “接下来的问题是，如何让你接近那只灵长类杀手。”希耶尔缓缓开口，语气带着几分凝重。


  “它智商很高，不是傻子，你贸然靠近，只会被它当成‘自爆卡车’提防。”希耶尔顿了顿，补充道，“我觉得，让你自裁诱导它靠近，会是个稳妥的选择。”


  “自裁吗……倒也不是不行。”士郎指尖抵着下巴，正认真思索着，一旁的立香已经急着开口：“希耶尔前辈！让士郎自裁，很可能会直接让他死掉的啊！”


  “我们要的是濒死，不是死亡啊，两者差别很大的！”立香的语气带着几分急切，眼神紧紧盯着希耶尔。


  “……”希耶尔沉默片刻，轻轻叹了口气，妥协道，“我知道了，那我再想想别的办法。”


  “我觉得最稳妥的还是……”士郎低声开口，话音刚落，就对上了藤丸立香满是不悦的眼神。


  【你是不是忘了刚才我跟你说的话了？】


  士郎身子一僵，咽了咽口水，连忙改口：“呃……其实我也没那么想死，还是再想想吧。”


  【不对……她这眼神，怎么有点像吉尔茜？哦对，她本来就是吉尔茜的弟子啊。】士郎在心里默默吐槽。


  立香见他服软，脸色才稍稍缓和，轻声说道：“好，这个方案，放到最后再说。”


  希耶尔无奈地摇了摇头：“行，那我们说下一个问题——Berserker的下落不明，我们不知道他藏在哪里。”


  “这个我有办法！”立香眼睛一亮，连忙说道，“让Archer在高点警戒狙击，要是遇到Berserker，就让他先支援；如果陷入近身战，我就用令咒把Archer叫回来，怎么样？”


  “不用太担心Berserker，Saber有底牌。”士郎轻声补充道，语气带着几分笃定。


  “没错，迦勒底的御主。”Saber上前一步，语气坚定，“我有把握战胜Berserker，不必为我担心。”


  “你说的是……你的宝具‘红莲之圣女’吧？”通讯器里再次传来奥尔加玛丽的声音，带着几分迟疑，“那个宝具……是会让你自毁的，对不对？”


  “是这样没错，但用它解决Berserker，绰绰有余。”Saber的语气没有丝毫动摇。


  “你们两个还真是相性合啊。”伊莉雅放下茶杯，似笑非笑地开口，“一个要濒死触发宝具，一个要自毁解决敌人，就算不用圣遗物，言峰大概也会召唤出你吧？”'

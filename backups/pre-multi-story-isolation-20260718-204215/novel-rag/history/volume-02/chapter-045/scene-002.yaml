content: '他的白色T恤穿在她身上，领口向右偏，下摆盖到大腿中段，袖口在手肘处鼓起一圈多出来的布料。头发散着，发色浅到接近白，这个房间里的光线平而冷，把发丝映得有一种细腻的清淡。她站在那里，两手自然垂在身侧，用那双淡金色的眼睛平直地看着他。


  “你觉得他这几年没有变化？“


  “也许有，我没探出来。“


  她接受了这个答案，穿过客厅走向沙发，在上面坐下来，脊背笔直，腿自然叠到一起。Alterego取下挂在门后的围裙套上，打开炉火，把牛肉饼放进热锅。


  油脂接触铁板的声音起来了，滋滋的，均匀，迅速在厨房里散开。


  “还是汉堡？“


  “嗯。多加一片面包。“


  他没有答话，已经在数面包片了。生菜铺在砧板上，他把最外面几片不平整的撕掉，取里面的部分。阿尔托莉雅在沙发那头摸了一圈，把藏在垫子后面的汽水找出来，拉开拉环，喝了一口。


  “你说之前的人类社会有秩序。“


  “有功能上的秩序。“他翻了一下牛肉饼，油脂嗤啦一声。“经商的经商，行医的行医，教书的教书。各司其职，系统就这么运转。“


  她把汽水瓶转了一圈。“听起来和不列颠差不多。所有人待在分配好的位置上，整个东西靠义务撑着。“


  “有质感的部分在别处。“他把面包放进烤架。“集市，争吵，庆典，小型的意外。不只是分工。“


  她侧头，“庆典。“


  “节日性质的聚集。街道上会出现平时不打交道的人。临时的摊位，陌生的气味。总有人在人群里跟丢小孩。有音乐，不算特别好听，但很响。“


  她没有立刻说话。汽水瓶被放到茶几上，发出一声很轻的碰触声。


  “响是什么意思。“


  “就是声音大。会传很远。有些地方的鼓声能从街这头传到街那头。“


  “所有人都在街上？“


  “大多数。有人在楼上往下看。有人只是被吵醒了，凑到窗边来。“


  她看了看天花板，没再问。Alterego把牛肉饼起锅，汉堡组装好，放上茶几。她两手拿起来，嗷呜一口下去，嚼了嚼，咽下去。


  “多的面包。“她说，像是在确认。


  “是。“


  “下次再多一片。“


  Alterego在她旁边的沙发扶手上坐下，没有坐进去，只是坐在扶手边缘。他看着她吃，没有说话。阿尔托莉雅嚼着，用余光扫了他一眼。


  “你每次都是这个表情。“


  “什么表情。“


  “什么都不是的那种。“她咬了一口，“你在看什么。“


  “在确认你吃了。“


  她停了一下，又吃了一口，没有再说什么。汉堡的油脂味道漫在房间里，混着汽水的轻微甜气。窗外什么都没有，只是废墟的寂静。


  “你以前吃庆典的东西吗。“她边嚼边问，嘴里含着半口。


  “偶尔。“


  “什么东西。“


  “烤肉、面饼、用竹签串的东西。各地不同。“


  “竹签串的是什么。“


  “肉、蔬菜，有时候是糖。“


  她把最后一口咽下去，把盘子推到茶几边缘。“好吃吗。“


  “好吃的比较多。“


  “那下次做竹签串的东西。“


  Alterego停了停，“我记了。“


  她把汽水瓶捡回来，又喝了一口。神情还是那个神情，冷淡，笔直，但把空盘子推到边上的动作里有一点满足的意思。


  百叶窗那头的光线从白转向浅灰。


  阿尔托莉雅吃完之后往沙发深处靠了靠，一条腿弯起来，另一条自然伸展。头发在吃饭的过程里更乱了，左耳边的一束滑到脸前，她没有去拨它，就那么垂着。


  Alterego在厨房洗了盘子，把水擦干，把锅收好。回到客厅，他在那束垂发上停了一下。


  走向那个低柜。缎带还在搬进来那天放的地方，他取出来，捏在手心，绕到沙发后面。


  “别动。“


  她没有应声。但脊背稍微收紧了，从原来半懒的状态坐直了一点，这已经是她配合的极限。


  他把手伸进去，从左耳边那束乱发开始。发丝比看起来更细，手指第一次触到时他顺势放轻了力道，从靠近发根的地方开始理，把绞在一起的部分一点点分开，不拉扯。阿尔托莉雅闭上眼睛。他继续从外向里收拢，把后脑的发丝归到掌心，再把右侧的并过来，一点点汇聚，直到发尾全部落在他手里。


  缎带绕了两道，他用拇指把结压平，确认松紧，把收尾的部分整进去。


  “第四次了。“她没有睁眼。


  “你的头发不老实。“


  她停了一下，“你的T恤也不合适，你也没拿回去。“


  他把最后一缕发丝顺进缎带里，收了手。“你穿着就行了。“


  “士郎。“


  他停在原地，没有移动。


  “那个庆典——所有人都认识彼此吗，还是陌生人也在一起。“


  “大多数是陌生人。同一条街上住了几十年未必说过话的那种。到了那天就都出来了。“


  她沉默了一会儿，“奇怪。“


  “哪里奇怪。“'

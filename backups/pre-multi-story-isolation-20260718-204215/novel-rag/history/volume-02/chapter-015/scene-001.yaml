content: '扭断养父脖颈的脆响还在耳边回荡，言峰士郎混沌的脑海里骤然清明了几分——他恍惚意识到，这已经是他第二次亲手杀掉言峰绮礼了。


  第一次动手，是在他偶然发现教会地下室的那些尸体之后。几个日夜的推测、反复求证，他终于不得不接受一个事实：言峰绮礼的本质，与那些他奉命斩杀的恶徒别无二致。可心底的挣扎几乎要将他撕裂，他始终下不了手——那是养育他、教他所有本领的养父啊。


  “士郎，遵从自己的心意，想做什么便去做就好。”


  这句话是他向导师兼养母询问时，得到的唯一回复。


  他做不到背刺、暗杀这种卑劣的小动作，哪怕对方是恶人，也想堂堂正正问个明白。于是，他找到了冬木圣堂教会的神父，寻求一个确切的答案。


  那位神父倒是坦然，直言不讳地告诉他，从小让他接受代行者训练，从头到尾都是他的主意。


  言峰士郎心里清楚，在训练这件事上，言峰绮礼毫无保留地将自己所有的本领都教给了他，尽心尽力，甚至可以说是倾囊相授。若说二人有什么不同，大抵是做事的态度。


  言峰绮礼做事向来三分钟热度，每当一项技艺快要练到登峰造极时，便会像丢弃无用的杂物般随手抛下，转头便全身心投入下一项新的事物。


  而言峰士郎截然相反，只要是认定的事，不做到自己所能达到的最好，他绝不会停下脚步。


  这也是他最不解的地方：既然言峰绮礼向来半途而废，当初又为何要倾尽全力教他，把所有本领都毫无保留地传授给他？


  直到二人面对面对峙，他鼓起勇气抛出这个质问时，言峰绮礼才笑着给出了答案：“士郎，你杀戮的表情让我觉得愉悦，这是我让你进行训练的原因。”


  他的笑容依旧带着那种令人不适的愉悦，语气却异常平静，像是在陈述一件无关紧要的小事：“你是个虔诚的信徒，却不认为杀戮是正确的；你是个苦行僧，却不想主动去制裁恶人，你所想做的，从来都只有眼下的事情而已，你只想去救你所能看见的，不去想更多。”


  “你只是被动接受教会的任务，去杀你认定该死的人，去救你力所能及的人。”言峰绮礼脸上挂着那抹标志性的、令人不适的愉悦微笑，语气慢悠悠的，“而我做这一切的原因，士郎。我是在品尝你杀戮时的表情啊，那份不甘，以及不解，还有潜藏在深处的痛苦，真是令人愉悦。”


  “你厌恶杀戮，却找不到自己的方式去填补心底的空缺、寻求那份愉悦，只能被动循着我教你的路，一步一步往前走，身不由己。”


  “这就是原因，士郎。”他微微俯身，眼神里的愉悦几乎要溢出来，“我养育你这么多年，从头到尾，都是这个原因。”


  “你的苦修，你的任务，你拼尽全力做的每一件事，都不过是……供我取乐、让我感受愉悦的工具而已。”


  “士郎，现在，你明白了吗？”


  言峰士郎缓缓点头，脸上没有半分被愚弄的暴怒，也没有被编排人生的不甘，神色平静得近乎淡漠。他垂着眼，指尖轻轻攥紧，再抬眼时，眼底只剩一片冰冷的笃定。


  “这样啊，父亲。”他的语气平淡无波，却带着刺骨的寒意，“你真是……烂透了。”


  【无需再多言。】言峰士郎在心底默念，【这个与自己共度十年、养育自己半生的男人，早已烂到了骨子里，无药可救。】


  若是放任他继续活下去，不知道还会有多少人被他视作取乐的工具，落得悲惨下场。这个念头像种子般瞬间扎根心底，让他彻底下定了决心。


  “什……”言峰绮礼脸上的笑容微微一僵，他没从士郎脸上看到预想中的崩溃与痛苦，只有一片冰冷的平静，这绝对不是他想要的表情。


  话音未落，言峰士郎指尖微动，黑键便带着破空声，径直朝着言峰绮礼射去，没有丝毫犹豫。


  战斗落幕得很快。言峰绮礼的技艺终究不及日复一日苦修的少年，纵使他的战斗经验远超对方，可身体的损耗与少年那份近乎偏执的韧劲，终究不是这点经验能弥补的。


  利刃入肉的轻响响起，言峰士郎的剑精准刺入言峰绮礼的腹部，随后手腕一拧，干脆利落地抹了他的脖子。


  临死前，言峰绮礼的目光死死锁在士郎脸上，他终究还是看到了自己想要的东西。


  那是虔诚的苦行僧，在亲手斩杀养育自己半生、却早已沦为恶徒的养父时，脸上那份混杂着痛苦、决绝与一丝茫然的复杂神情。


  纵使心底的愉悦几乎要溢出来，言峰绮礼的脸上，却再也扯不出半分笑意。


  脑海中斩杀养父的回忆如潮水般褪去，言峰士郎的意识渐渐从混沌中挣脱，恍惚间才发现，自己竟站在了熟悉的教堂里——这里是他曾传道、苦修的地方，也是此刻他昏迷时，灵魂暂歇的一隅。'

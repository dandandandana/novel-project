content: '“我没事啦。”立香摇了摇头，语气又沉了下来，“就是言峰他，到现在都没醒……我想在这里守着他，至少能帮上点小忙。”


  “言峰前辈一定会没事的！”玛修连忙开口打气，语气里满是笃定，“他那么强大，肯定能撑过去的。”


  “嗯，我也觉得……言峰他那么厉害，肯定会很快醒过来的……”


  立香的话还没说完，目光忽然顿住——言峰的额角竟沁出了细密的冷汗，连鬓发都被濡湿，脸颊上泛着不正常的苍白，还隐隐泛着一层冷汗的光泽。


  “他在出汗……”立香的声音微微发紧，连忙指向墙边，“玛修，把那里挂着的毛巾给我，怎么出这么多汗啊。”


  “好的，前辈。”玛修快步取来毛巾递过去，目光刚落到言峰身上，脸色瞬间变了，“前辈，你看言峰前辈好像在抽搐！”


  “嗯？”立香心里一紧，立马俯身凑近查看，起初没看出明显异样，只觉得他头上的冷汗越渗越多，直到视线落在他放在被子里的手，才发现那细微到几乎看不见的抖动。


  “真的在抖……”立香咬了咬牙，轻声道，“失礼了，言峰。”


  她猛地掀开盖在言峰身上的被子，只见他的四肢正贴着床面微微痉挛，眉头紧紧拧成一团，脸色苍白得像纸，哪怕陷入昏迷，嘴角也绷得紧紧的，像是在承受着极致的痛苦。


  “不好！希耶尔前辈！”立香心头一慌，转身就朝着门外冲去，声音里满是焦急，“希耶尔前辈，言峰他不对劲！”


  她匆匆跑到会议室，简单说了言峰的异常，便拉着希耶尔快步赶回房间，玛修也紧随其后，脸上满是担忧。


  希耶尔走到床边，目光扫过言峰的神色，指尖飞快搭上他的脖颈探了探脉搏，又伸手强行掀开他的眼皮，看着他涣散的瞳孔，神色瞬间沉了下来。


  “是梦魇，被灵长类杀手的精神污染缠上了。”希耶尔喃喃自语，语气里带着几分难以置信，“你这混蛋，以前再强的精神污染都能扛过去，这次怎么会严重到这种地步？”


  她咬了咬牙，对着言峰低声道：“对不住了。”


  “啪！”


  清脆的巴掌声在房间里响起，希耶尔毫不犹豫地给了言峰一巴掌，可床上的人依旧毫无反应，痉挛得反而更厉害了些。


  “糟了，得赶紧问奥尔加玛丽！”立香连忙掏出通讯器，语气急促地喊道，“奥尔加玛丽所长，灵长类杀手的精神污染，最后会有什么后果？”


  通讯器那头立刻传来一阵急促的键盘敲击声，奥尔加玛丽的声音带着几分凝重，清晰地传了过来：“精神污染的后果很严重……它会在被污染者的脑海里，反复回放最让他痛苦、最不愿面对的画面，一点点压垮他的精神防线，到最后，会在脑海里留下已经死亡的概念，直到彻底醒不过来。”'

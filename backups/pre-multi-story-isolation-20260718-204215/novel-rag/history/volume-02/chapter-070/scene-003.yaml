content: '“就算迦勒底曾经的目的不纯……但是它现在是我们拯救世界的最重要的一环，请大家相信我，相信迦勒底！”她猛然弯下腰鞠了一躬。银发从肩头往前滑下去垂直地悬了一拍，然后她直起腰时头发的末端还在轻轻晃荡。


  立香愣了一下。她看着奥尔加玛丽直起腰时眼眶里重新涌上来的那一层薄薄的水光——被她自己用眨眼的动作压回去了。


  立香顿了顿站起来，“嘛，所长，在场的各位没人会怪你吧。”她把自己的笔记收好，“不必说相信这些话了，相信自己的同伴，这是常识才对吧。”


  “立香……”奥尔加玛丽点了点头。她用掌侧擦了一下眼角，擦的力道很重——不是擦拭是按压，把还没来得及淌下来的泪水摁回了眼睑边缘。“我知道了。”


  “煽情的话说完了吧。”士郎把这句话从嘴里漫出来时音调在末尾没有上扬——这是陈述句，不是问句。他看向吉尔伽美什，“我有个问题。”


  吉尔伽美什没打算回应他。她的步伐比之前快了不少，她身着的衣物的下摆扫过管制室的金属地板时被静电吸得啪嗒响了两声，她打算直接从管制室离开，门离她还有几步。


  “卡桑，你资助迦勒底的钱是从哪里来的？”


  吉尔伽美什刚迈出去的步伐停住了。她的左脚还踩在半空，然后落下去时脚跟先着地——停得太突兀了，她整个人往前多晃了半寸才稳住。她转过头时脖子上的肌肉绷了一下，然后松开了。“本王……本王的黄金律可是A+啊！钱对本王来说可是轻而易举！”她把这句话说得很快，快到她自己的尾音还没落稳她就知道没人会信。


  士郎抱臂叹气着。他交叉在胸前的手臂上，手指敲了敲自己的肘弯。“你说过你看不上这种来钱的手段。每次拿到就会很快花掉或者捐掉。”他的声音依然是淡的——但这次淡里头多了一点较真，“而且你也不工作，天天游山玩水。告诉我，你哪里来的钱。”


  吉尔伽美什的眼神飘了。她的视线从士郎脸上挪到侧面墙上那个空调出风口，百叶窗上沾了一层薄薄的灰——然后她的视线又从空调出风口挪到天花板角落的消防喷头，喷头的金属外壳在投影仪蓝光下泛着暗哑的光。


  “嗯……这些不重要……”她把最后一个字的尾音拖得发飘，飘到声线末尾自己咳了一声。


  “重要。”


  “这不是很明显了吗，言峰。”希耶尔开口道。


  吉尔伽美什猛地转头看她，金发甩了一圈，“喂喂！你这个咖喱修女，不许说本王的坏话！”


  “吉尔伽美什用的一直是你的工资卡啊。”希耶尔说道。她把这句话放在了一个吸气的前面，放得很轻。“你在埋葬机关卖命了几年，几乎全年无休的干活，九死一生的高危工作，以及弑神计划的奖金都在这里了。”


  言峰士郎愣住了。他的脸上没有表情的变化——眉头没有动，嘴角没有动——但那双琥珀色的瞳孔在眼框里往左偏了一寸，偏到吉尔伽美什脸上。


  立香也愣住了，她张了张嘴，声音从喉咙里被推出来时炸开了半截，“难不成……吉尔茜之前带我去游乐场也是用的士郎的钱？”


  “当然，她就是靠着自己的儿子养活的，当时黄金律给她的钱全投入迦勒底亚斯了。”希耶尔说完这句话之后嘴角往上动了一点点。


  “喂喂你这个咖喱修女！”吉尔伽美什的脸上从下巴到额头上升了一个温度，她有些气恼的挥了挥手指。


  “英雄王在啃儿子？！前辈这可是迦勒底天大的新闻啊！”玛修瞪大着眼睛把茶杯搁下来，茶碟磕上桌面时比刚才响了不止一档。


  “喂喂玛修你不要天然呆的说出容易开战的话啊！”


  奥尔加玛丽看着乱作一团的管制室。立香还在从愣住的状态里慢慢回复，玛修已经把笔记本翻过来在反面准备写字，士郎的瞳孔还没有从吉尔伽美什脸上挪开。她有些无奈地笑了笑——这张笑容贴在她刚哭过的脸上时弧度有一点歪。然后她看见了气急败坏的吉尔伽美什把手臂伸直往侧面一挥。


  空气中从吉尔伽美什身侧忽然裂开了一道金色的光门。光门在空气中被从中分开时发出低沉的嗡嗡声，不是刺耳的尖响——是闷到能摸着胸口震动的频率。几把剑柄从金光里探出了半截，剑身上的反光在管制室的淡蓝色调里切出了几道暖金色的光束。一把、两把、三把——金色的涟漪荡漾开时把周围几个空着的管制椅都映上了一层暖调的流动光纹。


  “喂喂别在这里打起来！”奥尔加玛丽的声音从剑柄排成的那排金色裂口里笔直地穿过。


  “这可是你资助的！”'

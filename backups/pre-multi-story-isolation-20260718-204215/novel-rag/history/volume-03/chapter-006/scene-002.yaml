content: '村正的太刀从立香身侧架过来，刀身贴着她的手臂擦过去，刀尖精准地抵住了从后面刺来的矛尖。村正的琥珀色眸子盯着眼前再次现身又即将被阴影吞没的女人。女人一击没中，身体在盾牌银光还没追到的边缘上缩进了黑暗里，像一滴水滑进墨汁。


  村正的刀上燃起了烈焰。从刀柄下端往上蹿，火苗贴着刀脊的铁纹一截一截往上舔，舔过她缠在刀柄上的绷带，舔过她的虎口，然后整个刀身裹在了火里。


  她扫了一圈周围还在不断流动的墨色阴影，火焰在她瞳孔里跳了两个点，没有找到那个女人的任何踪迹。


  立香看着她。隔着火焰的热浪，千子村正的胸腔正猛烈地起伏着，村正隔着羽织的里衣都被起伏撑得一下一下地抖。


  立香知道那是开了两次宝具之后身体被掏空了再强行支撑的后果。她握了握自己手背上的令咒，站了起来。阴影里远处的爆炸还在一声接一声地传来，士郎还在和那个头颅缠斗。


  【需要把士郎从那里叫过来.......目前的情况最重要】


  她的手指已经按在令咒上了，女人再次攻了过来。立香架起安魂，枪的保险在架起的一瞬间被指腹推开，她凭着枪身上涌上来的、不属于自己的那股武艺，在黑暗里挡住了一记劈来的矛刃。


  “什么？”冥冥中，立香好像听到了女人惊讶的声音，很短，半个音节的长度都不到，然后连人带声一起消失在了黑暗中。


  “前辈？！”


  “啊，还好。”立香把安魂的枪口放低，手指扣在扳机护圈外面稳了稳发抖的手腕，“勉强用了下士郎的武艺，应该不会出啥大问题。”


  她抬眼扫了一圈周围的黑暗，玛修的盾已经把光重新铺开来。女人的攻击又一次从暗处袭来，矛尖在银光的边缘上弹出来，玛修立盾挡住。


  矛尖撞上盾面的金属框，发出当的一声，震得空气嗡嗡响。玛修把剑往内一收，剑柄抵在腰侧，偏头看向立香。“前辈？接下来……”


  轰隆隆！远方又有几声沉闷的爆炸从地底下闷闷地翻上来。


  “困在这里绝对会出问题，玛修。”立香没有犹豫，她把安魂的枪口往下一压，“带着我和村正直接走就好。”


  “什么？”


  “往南边走就好，别怕。”士郎的声音忽然从三个人周围什么地方传过来，像是他就在旁边某栋楼的屋檐底下靠着墙说话。


  玛修咬了咬牙，牙关间的肌肉在脸颊上绷了一下，然后她把盾重新架好，一只手捞起村正，一只手揽过立香，把两个人重新夹进怀里。


  迈步的瞬间，剑雨落了下来。剑雨从黑暗的每一个方向同时涌出来，无数道流光化作的剑刃在半空中密密地往下砸，砸在屋顶的瓦片上噼里啪啦响成一片，掀飞的碎瓦弹起来又被下一拨剑雨钉回屋顶上。


  玛修没抬头看这些剑雨。她把盾侧过来挡在两人身侧，脚底下一步不停，脚下的瓦片在盾面挡住剑雨的空隙里一块一块地被她踩成渣。立香能听到那个女人在用她看不见的方式不断接触着暴雨般落下的剑刃，到处不断传来叮叮当当的格挡声。


  然后——阴影开始往回缩。不是慢慢撤的，是一下子从他们三人的脚边全部收了回去。像一只手把铺开的黑布猛地往回一抽，月光重新漏下来，屋顶、断墙、底下那些还在发抖的黑色人影全都从墨汁里浮了起来。


  【放弃阻拦我们了吗？】


  士郎的脚步声从后面跟上来。立香偏过头，瞥见后面不知几米远的屋顶上有个红发的影子闪了一下，闪进月光和烟尘混在一起的光雾里，然后又闪出来，始终隔着一段不远不近的距离。


  立香把脸转回来，按开了腕上的通讯器。“南边是吧？”电波杂音滋了一声。


  是村正回的话。“是。南边是天照的金地。”她的声音还带着喘，她的声音很确定，像是闭着眼睛也能知道南方在哪里。


  立香在颠簸中对着表盘开口，把空气在嘴里咬了半拍才吐出去：“天照金地……按照三贵子的名字来划分地名吗？所长，现在告诉我，这里真的是日本吗？”


  奥尔加玛丽的声音从滋滋响的电波里挤进来，隔着杂音，立香听出她在说了“是”之后停了一下。那个停顿很短，但立香知道自己的所长只有在她还在看数据、还没决定好用什么语气把数据念出来的时候才会停这一下。


  “是……但又不是。立香，可能比你想的更古怪。”


  “这块地表很像日本的轮廓，但是……”


  电波又停了。立香能感到来自通讯那头的人明显的犹豫，然后声音再响起来。


  “面积大了十倍不止。”


  “哈？”立香脑子里嗡了一下，像是有人在耳朵里面拍了一下巴掌，把她脑子里的日本地图一巴掌拍散了。她愣了大半拍才重新开口，“什么？日本从一个岛国变成——类似于一小片大陆的存在了？”


  “是的。而且这里的地脉的魔力浓度完全不是正常地脉能够拥有的。”奥尔加玛丽的声音这时候已经恢复了一贯的公事公办。


  “神代吗？”'

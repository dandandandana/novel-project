content: '“忘了？”立香扭回头愣愣地看着他。


  “没错。”士郎把双手从身侧抬起来搁在胸口摆出一个不需要任何防备的姿态——掌心朝外，十根手指平平摊开。他的琥珀色眸子里那份疲惫还没有完全消退，但里面没有任何试图隐瞒什么的光泽。


  “这种事情记着反而会有阴影吧。”


  立香盯着他的眼睛。那双琥珀色瞳仁在午后的光线里微微发亮，里面没有闪躲，没有侧过头的回避，就是平平的一次直视。她的心里咕咚了一下——


  【对他而言确实不重要啊。】


  【死亡对他而说真的是可有可无的，不......是他自己死亡。】


  【其他人就很重要。】


  “算了——”立香把手从臂膀上放下来垂在身侧然后呼出一小口气，“既然让我知道了就好了。”她抬起脸，橘色眸子直直地锁在士郎脸上，然后她把嘴张开准备说接下来的话：


  “既然如此——”


  士郎也张开嘴，然后他听见自己的声音和立香的声音在同一时刻撞在了一起。


  “我可以去做比较危险的任务......”


  “你不许去做十分危险的任务。”


  两句话在同一秒里交叠在一起。两个不同的主语在同一个时间点上各自从反方向冲进空气中然后碰在一起——谁都没有准备。谁都没有提前排演过这句碰上的话。


  立香的嘴还张着，她的嘴唇在半空中停住然后慢慢合上，她看着士郎，橘色眸子里那份刚才追问死亡体验时的锐利一点一点被室温融化掉。


  士郎也没把嘴完全闭拢。他的下颚微微往下掉了半寸，然后他笑了起，是他从战场下来之后把紧张卸掉时才会露出的那种声音里带着松掉的弹簧弹回来弹了两下的轻笑。


  他伸出手轻轻按了按自己的后颈，指腹在脖子上压出一道浅浅的凹痕然后松开。


  “你看。我想的是让你少冒点险——你想的是把危险往自己身上揽。”他把按后颈的手放下来说话时尾音往上浮了一点。


  立香把手垂在身侧然后在空气里摊了摊。“你怎么知道我要说这个——你是千里眼吗？”


  “不......巧合？”


  “是你我的默契。”立香纠正道，她随后立刻意识到了自己在说什么。


  立香把脸侧过去不看他的眼睛。她侧过去之后看着墙角那张空了的木床上被褥被掀开后又没人整理的形状，然后她的嘴角在看不见的地方翘了一下。


  “算了，到时候再说。”她把脸转回来时语气已经恢复了平常说话时的频率，“你现在这个脸色还是多休息吧。”'

content: '“这就是您不能亲口告诉我的原因吗。”


  “你可以这样认为。”


  “哪里。”


  伊耶娜美顿了顿。她重新打量立香时眼神停在立香的额头上方，像是在读什么在立香头顶写着的字，片刻后她把目光收回去。


  “这里是庆功宴，要讨论这么沉重的话题吗。”她的嘴边浮出这么一句，语气不轻不重，像把话题本身轻轻搁在桌上让人自己决定拿不拿。


  立香点头，烛火映在她脸上的位置从眉骨挪到下巴，然后随着她重新坐直身子又被拉回到了鼻梁正中:“没错。我们来这里的目的是回收圣杯。修复特异点。”


  伊耶娜美看着她。这一次她盯着立香的时间比刚才任何一次对视都要长。然后她忽然笑了——不是那种被逗笑之后从嘴里呵出来的笑意，是嘴角慢慢朝上弯了半寸，弯好之后停在那里，眼底的阴阳两只瞳孔同时被某种温度从内部轻轻推了一下。


  “这样啊~藤丸立香——你真是有意思。”


  立香看见了笑意，真正客观意义上的看见了。她的目光停在伊耶娜美那只金瞳和那只黑瞳之间，从那道由一阴一阳构成的目光深处窥见了一道极细极淡的光。


  “在曾经的星之内海——那里埋葬着一切过去，隐藏着一切真相。”伊耶娜美淡淡地说。她端起酒杯将最后一口倒进嘴里，酒液在她说完这句时顺着喉咙滑下去。


  她将杯子搁回桌面。杯底碰到木质桌面的声音在安静的宴席厅里成了她这句话最后的标点。


  “圣杯也在那里。”'

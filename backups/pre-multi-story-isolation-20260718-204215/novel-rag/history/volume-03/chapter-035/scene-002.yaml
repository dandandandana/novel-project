content: '立香重复了一遍：“妥协？”她问这个词时下巴朝上微抬了半寸，眉间皱起的纹路在烛光里被拉成了一道极细的阴影。


  “定期召唤英灵，献上英灵的命数。让伊耶那岐金地不干涉天照命金地的事。”伊耶娜美端起桌角那杯酒。酒液从杯底晃上来，在杯口边缘差点溅出来又被她自己端平了，她将酒一口气灌进嘴里。


  “什……”


  一道声音从桌对面炸了过来，先于立香开口的是千子村正，她一掌拍在桌面上——掌缘压着一根被她自己撩歪了的竹筷。


  桌沿上摆着的三只酒碗同时朝上一跳，碗中酒液朝外晃出几滴溅在了烤肉的碟沿上。


  “伊耶娜美姐姐。你说什么？”村正站起来时膝盖撞到了桌底部的横梁，撞出一声闷响。


  她琥珀色的眼睛直直看着伊耶娜美，眼眶里映着两团烛火，但那烛火的影子被一层从眼眶深处浮上来的薄光压得越来越淡。


  “我的父亲——也是这样死的吗。”


  伊耶娜美放下了手里的酒杯。她把视线从杯沿上移开，笔直地看向村正。没有任何躲闪，也没有任何迟疑。


  “不是。他是堂堂正正战死的。在天照命金地对付世尊率领的二十位法相的时候。”她把这句话说得和切肉时一样平稳，但在“堂堂正正”这四个字上咬得格外用力。


  “那姐姐，为什么！你怎么能让他在天照命金地死……”村正的牙关在最后一个字上咬死了。她的牙床合在一起时颌骨朝外凸了一下又自己收了回去。


  “小姐。”天沼开口时把手掌放在了桌上。他没有站起来，但他的声音稳得像一面被锤子砸过之后反而绷得更紧的鼓：


  “您需要充分了解当时的情况。当年主人必须独自面对月读命和天照命两面压力，您的父亲在前线挡下了月读命的正面攻势。这件事没有第二种解决办法。”


  千子村正沉沉吸了一口气。她的肩膀随着这口吸气朝上抬了一次，又跟着出气缓慢落下来。她看着伊耶娜美，眼睛里那层水膜仍在，但嘴角的肌肉自己收了收，把先前的怒意重新压回了牙床底下。


  “我知道了。那么宫本武藏呢。我一开始还以为月读命要去收割她的命数——”


  “我一开始就说了，不用你去。”伊耶娜美淡淡地开口。她切下一片新的肉时手腕的力度没有任何变化：


  “她被我召唤而来，降落在月读命金地。在探索过程中被此地扭曲的法相杀死是正常不过的损耗。”


  “啊……姐姐已经不在乎他们了吗。”村正说这句话时音量比刚才低了整整一半，气音从齿缝里漏出来时在句尾微微抖了一下。


  “难道你觉得所有Saber都是你的父亲吗。剩下的Saber，他们只是一些耗材。”


  伊耶娜美说完这句时刀叉还握在手里。刀刃上沾着的一片肉末被她自己顺手在碟沿上蹭掉了，蹭的那一下动作和刚才吃完每一口肉之后清理刀背的姿势一模一样。


  “为什么……伊耶娜美大神。”


  开口的是玛修。她一直在桌边安静地坐着，双手搁在膝盖上。她的盾靠在她腿边的椅脚上，盾面上的迦勒底纹章被烛火晃一下亮一下，又暗一下。她把双手从膝盖上拿起来搁在桌沿上，手指在桌面上弯了一下——弯的那根手指碰到了她自己面前那碗已经凉掉的汤。


  “为什么要把从者……当成耗材。”她的声音在“耗材”两个字上被压得格外轻。


  伊耶娜美没有立刻回答，她的嘴唇微微动了一下，但马上又闭上了。天沼将搁在桌上的手翻了个面，手背朝下，五指张开平放在桌面上。


  “因为在最需要协助的时候——不论是什么原因，主人尝试了近千次召唤。回应她的只有千子村正一人，而且他做得真的很不错。”天沼的声音在安静下来的宴席厅里显得格外清晰。


  “等等——伊耶娜美大神，我可以知道你是怎么做到的吗？恕我打断了你们的对话，但这个我必须要知道。”立香忽然把手掌朝桌面轻轻一拍，啪的一声把所有人的视线重新拉回她身上。


  伊耶娜美偏过头看她。那双一金一黑的阴阳眼从盘子上挪过来，对准了立香的眼睛。视线移过来的速度和先前抬头看村正时一样直接，但这一次她盯着立香看的时间比看村正时多了半息。


  “这件事......我不能让你知道。”


  “难言之隐，还是真的不能说？”立香问的时候声音里没有带着逼问的意味，她的语气比刚才温和了半分，但目光没有从伊耶娜美脸上移开过。


  “我能告诉你在哪里可以找到真相。”伊耶娜美将刀叉搁下。叉子落到碟子上时碰到了碟子的边缘，发出一声极轻的金属碰瓷声。“但代价会很沉重。你们可能要和我为敌。”


  立香将吉尔伽美什的那杯酒端起来。酒液在杯底荡漾时把她自己的脸映成了一块碎成波纹的倒影。


  她盯着那块倒影看了几秒，然后一口气把酒灌进嘴里。酒液滑过喉咙时，一阵微辣感从喉底朝上返了回来。她放下酒杯，在袖口上把嘴擦干净。'

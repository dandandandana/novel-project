content: '“性命寄于一体——什么意思？”


  立香把手里那块已经焐热的毛巾从士郎额头上拿下来。她在水盆里重新涮了涮，毛巾浸入温水时发出沉闷的咕嘟声。


  她的语气还停在上一段关于降格术的对话末尾，但脑子已经转到了吉尔伽美什刚才那句“他的性命寄于一体”上。


  吉尔伽美什把空酒瓶搁在一旁地板上。瓶底与另一只瓶子磕出一声极轻的脆响。她抬眸看向立香，赤色蛇眸里那份酒后的慵懒已经收了回去。


  “士郎的宝具——无限剑制。”她抬手在半空中比划了一下，手指在空中画出一个小范围的弧线，“他的整副躯体现在都是由无限剑制造出来的。拟造躯壳。他的性命——”


  她顿了顿，指尖在空气里轻轻一点，“——寄托在无限剑制的‘剑’里。”


  立香举起一根手指。指节在午后的光线里竖在半空中，像上课时举手发问的学生。


  “等等。无限剑制是士郎的心象对吧。”


  “对。”


  “那问题来了——”立香把手指弯回来搁在自己下巴上，橘色眸子眯了起来。


  “心象结界这东西，不是依托于士郎自身才诞生的吗？如果士郎死了，心象结界不也该消失吗？那他怎么把自己的命反过来寄托在心象结界里？”


  吉尔伽美什的眉梢往上扬了一小截，她把修长的手指在自己膝头摊开又合拢。


  “理解得很准确。”她想了想，把手指拢回掌心，然后重新张开时掌心朝上翻了一面，“但并非如你所想。”


  “无限剑制已经存在了。在那之后，士郎经历了一系列事情——”她的手指在空气里点了点，点在立香刚才竖手指的那个位置，“——获得了一个拟造躯壳。然后才让性命寄托在无限剑制里。你可以这样理解。”


  她把掌心放下搁回和服膝头，袖摆在动作结束时轻轻晃了晃，“现在他的身体和性命，依托于无限剑制的‘剑’。”


  立香把下巴搁在拇指和食指之间轻轻捏了捏。


  她把思路从蛋和鸡的悖论里拽出来，然后歪过头。“本质上就是很高等级的不死性，对吧？”


  “是。”


  “你早这么说不就好了。”立香的肩膀往下一沉，嘴角在左边偏了半寸。


  吉尔伽美什没有接这个茬，她把视线从立香脸上移开，落到床上那个高大的红发男人身上。


  立香拿着那块拧好的毛巾，轻轻覆在士郎额头上。毛巾叠成整齐的长条形，边缘刚好盖住他眉骨上方那道细小的旧疤。


  他额角上又渗出了一层薄汗，在午后的光线里泛着微光。立香用手指把毛巾的一角轻轻压在士郎太阳穴上。


  “现在士郎状态怎么样？”


  “都说了没啥大问题。”吉尔伽美什把一只手从膝盖上抬起来在空中随意挥了挥。袖摆随着她的动作滑到手肘处，露出腕骨上一道浅浅的旧伤疤。


  “他的身体在不断修复着。现在——类似于在恢复期吧。”


  “恢复期？”立香没有回头。她的手指还搁在毛巾上，指腹感受着士郎太阳穴上皮肤的温度。


  那份温度比正常人略高一点，但比刚才她刚进来时已经降了些，“士郎是为了帮我才受伤的。”


  吉尔伽美什想了想。她把挥到一半的手收回来搁回膝头，然后指尖在膝盖上轻轻敲了两下。


  “大概也就是——”她顿了顿，选择措辞时舌尖在齿间轻轻咂了一下，“——失去一段时间战斗力吧。”


  立香转过头。她的手指从毛巾上滑下来搁在自己膝头，橘色眸子的注视钉在吉尔伽美什那张正努力维持平静的脸上。“什么叫做‘失去一段时间战斗力’？士郎是我的同伴。他究竟怎么了？”


  “我不知道。”吉尔伽美什开口。她的声线在“不知道”三个字上往下掉了半度——不是王的语气，是一份被她压在舌头底下终于承认的无知。


  “我只是感受到他死了一次，就火急火燎地赶过来了。”


  立香忽然低声叫了她的全名。“吉尔伽美什。”


  吉尔伽美什的赤色蛇眸转过来。那双眼睛里还残留着酒后的余红，但瞳孔已经收窄成一道竖线紧紧锁在立香脸上。


  她感受到了——面前这个少女接下来的每一句话，都可能把她好不容易砌起来的墙一脚踹出一个洞。


  立香没有立刻开口，她把视线从吉尔伽美什脸上移开，重新落在士郎那张汗湿的侧脸上。


  “吉尔伽美什，士郎不是你的孩子吗。”立香低声说道。不是问句，“如果我没有猜错的话，士郎他，和我进入了一样的试炼。他为了协助我，张开了嘴巴然后导致了死亡吧？”


  她转过身。橘色眸子对上了那双蛇眸。


  “为什么——为什么？”立香开口。她盯着的不是站在她面前的王者，是刚才尝试无视士郎的女人“你对他.......”


  “藤丸立香。”吉尔伽美什勾起了唇角。不是她平日里那种狂傲的笑，那个弧度更像是被钩子从两边硬扯起来的。她的声音透着淡淡的冷意，但那份冷意不是冲着立香来的——是冲着她自己。“如果是其他人，本王会告诉他们......”'

content: '她不配。


  但立香听见了下一句。


  “我。”


  是一个完整的、没有被吞掉的“我”。不是“本王”。是吉尔伽美什在迦勒底自己的房间里对着镜子也不会用的那个自称。


  那个字从她嘴里滑出来时她的舌根微微发软，软到那份王者惯常的傲慢差一点就没能跟上。


  立香没有放过这个字。她把这份口误抓在手心里攥紧，然后继续盯着吉尔伽美什。


  “我是被设计出来守护人类的Alter Ego。”吉尔伽美什开口了。她抬起眼睑，那双赤眸里忽然浮现出一层淡淡的、近乎透明的薄雾。


  不是眼泪——她不会哭，但那层薄雾让她的瞳孔在午后的光线里变得比刚才模糊了一点点。“我并没有你所说的所谓的......”


  她歪了歪头，和服领口随着她歪头的动作往肩侧滑了半寸，锁骨在衣领边缘露出极窄一道细线。


  然后她笑了，那个笑容像天使一样天真，嘴角弯起的弧度恰到好处地停在某种纯粹得不像是装出来的和善上。但她的眼睛没有笑，那双蛇眸在那个笑容底下变得极冷——不是愤怒的冷，是某种放弃申辩之后什么都不在乎的冷。


  “情感的需求。”


  她把头正回来。笑容还挂在嘴角，但声音已经恢复了平稳。“我和吉尔伽美什的区别大概就是如此了。”她想了想，把手指在自己的膝盖上轻轻点了点，像是在翻一页早就翻烂了的账本。


  “我并不是历史里的吉尔伽美什。甚至连赝品都算不上”她把点膝盖的手指抬起来在空气中随便一转，“——只是一个工具罢了。我把自己看作工具。”


  她顿了顿，然后那双蛇眸里忽然闪过一丝光泽，她终于决定把这个问题抛回去时的狡黠。


  “那你猜猜，我为什么当时救下了士郎呢？”


  立香看着吉尔伽美什。她没有回答那个问题，而是低声自言自语，重复了对方刚才说的那句话。“你是被设计来守护人类的Alter Ego——”她把嘴唇抿成一条细线，然后闭上了眼睛。


  【吉尔伽美什并非没有情感的需求。】


  她睁开眼睛时，那份闭目时积攒的冷静已经全都回来了。她的嘴角甚至微微翘了一下——不是得意，是她终于看穿了。


  “现在弄明白了吧。”吉尔伽美什开口。她把手从膝盖上抬起来一整只胳膊搭在小凳靠背上，袖摆垂下来遮住了她握紧又松开的手指。“我来这里——是为了补充你们现在缺乏的战斗力。所以前来支援了。”


  立香清了清嗓子。她把那份看穿压在舌底，然后把话头转了回来。“士郎大概需要休息多久？”


  “十几天吧。”吉尔伽美什恢复了平时报情报的语速。但她的手指在袖摆底下还在搓着袖子的边角。


  立香点了点头。她伸手戳了戳左手腕上的通讯手环，指尖按在环面上的感应区时手环发出一声极短的蜂鸣，然后亮起了一行淡淡的文字——信號斷絶。她把手指收回来。


  “迦勒底的资源呢？”


  “一年左右。你们离开之后，我们在世界各地收集了各种资源，”吉尔伽美什把下巴往上抬了一小截，“目前倒是不用担心。”


  “我懂了。”立香想了想。她把毛巾从士郎额头上拿起来重新放进水盆里涮了涮，然后拧干。


  水滴落在盆中水面上溅起的声响在安静的房间里格外清晰：“那我们先等士郎恢复好再出发吧。”


  吉尔伽美什感觉眼前的少女在谋划着什么奇怪的东西。她的蛇眸眯了起来，直感告诉她——眼前这个家伙脑子里转的东西，和她刚才那副乖巧点头的样子完全不是一回事。


  “藤丸立香。”


  “嗯？怎么了吉尔茜？”立香挠着后脑，手指在发根上轻轻刮了刮。她的语气轻松得像是刚才的质问根本不存在。


  “本王的千里眼在这里大概是没什么用的。”吉尔伽美什悠悠地说，她把像是在咬一根骨头，“你不要指望本王的千里眼在这里能看到什么。”


  立香点了点头，她点完头之后把毛巾叠好搁在士郎额头上，然后忽然开口：“士郎大概什么时候会醒来？”


  “还要大概三四天左右。”


  立香扭过头，看向吉尔伽美什。她的嘴角缓缓勾起一个弧度——不是刚才那种乖巧的微笑，是她从迦勒底走廊上堵到士郎时那种已看穿一切的笑。


  “吉尔茜。”


  吉尔伽美什的直感在这一刻亮起了红灯。她看着立香那张娃娃脸上忽然浮现的笑意，喉管深处有一句“你别过来”还没出口就被她咽了回去。


  “嗯？”


  “你在撒谎。”藤丸立香淡淡地说。她把手上涮好的毛巾从水盆里捞出来拧干，水滴落在盆中时发出规律的滴答声。


  “你并非没有什么情感——你说你只是被设计出来的工具，对吧。”


  吉尔伽美什顿了顿。她的蛇眸在立香脸上停了两拍呼吸的时间，然后她把下巴往下压了一小截。


  “何出此言？”'

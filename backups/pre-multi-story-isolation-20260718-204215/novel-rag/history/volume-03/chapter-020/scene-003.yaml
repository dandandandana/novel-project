content: '“如果你真的如你所说~”立香歪了歪脑袋。她歪头的角度不大，正好让她的橘色眸子和吉尔伽美什那双红色蛇眸保持在同一水平线上。


  “你就不会火急火燎地赶过来了。”她把毛巾叠好搁在盆边，然后转过身正面朝向吉尔伽美什。


  “放屁。”吉尔伽美什淡淡地说。她把身子往小凳靠背上靠了靠，和服的袖摆在动作中滑下来遮住了她搁在扶手上的手腕。


  “士郎需要恢复的时候，本王要来这里填补战力。士郎身为关键战力，缺少了他之后你们这里打起来会很麻烦。”


  “真是这样吗？”立香伸出手指戳着自己的脸颊。她的食指在脸颊上摁出一个浅浅的凹痕，语气里那份故意的拖腔显示她一个字都没买账，“如果真是这样的话——你在特异点F为什么没有来协助我们呢？”


  吉尔伽美什歪头：“本王要保护迦勒底。本王如果来了会怎么样？迦勒底会被死徒侵略掉。达芬奇当时被封在地下。”她每说一个短句就把下巴往左偏半寸，说到最后一句时下颚几乎和肩膀平行。


  “如果本王去了——”


  “确实如此啊。”立香把戳着脸颊的手指收回来搁在膝盖上，然后她抬起头看向吉尔伽美什。她的眼神刷地犀利起来，那份犀利是刀锋一样精确的冷静。


  “那么——”她把身子往吉尔伽美什的方向前倾了半寸，“你为什么能够察觉到士郎的状况呢。”


  吉尔伽美什笑了笑。她的嘴角吐出一口气，那口气在她齿间轻轻咂了一下，然后她开口——


  “他是本王的儿子。本王协助自己的儿子，有什么问题吗？”


  她自己说完了这句话。


  然后她自己的声音在空气中停住了。


  【果然。】


  她的舌头上像是被卡了一颗石子。不是那个词——她整天挂在嘴边的“本王”——是那颗石子，是那句“他是本王的儿子”，是她说出来之后才发现她刚才的整条逻辑链已经被这句话从中间炸断了。


  一个工具不会火急火燎地赶来填补战力，一个工具不会在半夜翻来覆去地感受到某个傻儿子死了一次之后就再也无法做任何事情。


  一个工具不会有儿子。


  立香没有放过这个停顿。她把毛巾重新放在士郎的额头上，指腹在毛巾边缘压了压然后收回来搁在自己膝头。


  她低声开口：“啊啊。那么.......吉尔伽美什，士郎对你来说是儿子对吧。”她把身子正了正，然后看着吉尔伽美什，“那你是作为母亲来的，还是作为——人类守护者的Alter Ego来的？”


  吉尔伽美什沉默着，她的瞳孔死死盯着立香。那双赤色蛇眸在眼眶里一动不动，锁在立香脸上那份早已看穿一切的表情上。


  立香站起身。她把手里的毛巾放进水盆里重新涮了涮，拧干后叠成整齐的长条形。


  她俯下身把毛巾轻轻放在士郎的额头上，指腹在毛巾边缘按了按，然后直起身来转头看向吉尔伽美什。她的动作很慢，慢到每一个步骤都像是一个新的问号被缓缓画在空气中。


  “吉尔茜？”


  “本王——”


  吉尔伽美什意识到自己之前全部掩盖的情况已经被立香彻底撕毁了。


  她轻轻笑了起来——不是刚才那个冰冷的、残忍的和善笑容，是真的从喉咙底翻上来的无奈的轻笑。她把搁在膝头的手指一根一根收进掌心，然后抬起头。


  “本王是作为一个母亲来的。”


  立香没有说话。她重新坐回床边那张小凳上，把自己放在吉尔伽美什正对面，然后把双手交叠搁在自己膝头。


  吉尔伽美什看着立香，看着那个作为御主的藤丸立香，是看着那个同样陪士郎走到现在的同伴。


  她低声开口：“就算知道士郎死不掉.......”她顿了顿，把自己的手指在掌心握紧，指节在掌心里硌出一道硬痕。


  “就算本王知道士郎很难死.......但是作为母亲，本王怎么能不来呢？”


  “本王无法原谅那样的自己吧......”'

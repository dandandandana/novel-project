content: '那不是普通的刀剑出鞘的声音。那道剑鸣从火焰深处迸出来，尖锐到让立香的牙根发酸，尖锐到让玛修抱着她不由自主地往后退了半步。剑鸣之后，一声高喊从火里撞出来——


  “斩尽三千繁华梦！”


  一剑劈落。


  西偏殿的整面外墙在一瞬间被切开，切口平滑得像热刀切进了凝固的油脂。房梁断了，瓦片飞了，整个西偏殿顺着那道剑痕往两边分开了。


  火光从裂口里涌出来，照亮了半个庭院。一个烧得通红的巨大罗汉头颅从倒塌的殿宇里飞出来，在半空中翻滚着，空洞的眼窝里喷着火焰，然后砸在地上，把木地板砸出一个大坑，火星四溅。


  热浪涌到了立香脸上。


  她眯起眼，透过被火焰烤得发颤的空气，看见了站在烈火中央的人:


  那灰色羽织在火光里被映成了暗橙色，白色的锻造服贴着她的身体，被汗水浸得有些透了。红色的长发被简单地梳成一个马尾，垂在背后，发梢被热风卷起来一下一下地晃。


  她握着一柄太刀，刀身是红色的，红得像刚从炉膛里夹出来还没淬火的铁。她的嘴角抿成一条直线，眉头压得很低，琥珀色的眼睛在火光的反射下亮得有些不真实。她瞥了玛修和立香一眼，在看到立香的脸之后，嘴唇动了一下，像是咬紧了牙关又松开。


  立香终于看清了她的脸。


  那张脸上的每一处线条都让她感到一种不可思议的熟悉感。娃娃脸的柔和轮廓，小巧的下巴，眉骨的弯度，鼻梁从眉心到鼻尖的走势——除了头发和眸子的颜色是红的和琥珀色的，简直跟她一模一样。她感觉自己像是被一把看不见的锤子敲中了胸口，呼吸卡在喉咙口上不来。


  村正没有给她更多的时间去消化。她拔刀。周围的火焰像被什么力量牵引着朝她涌去，不再往四周扩散，而是盘旋在她身边，围着她转，像铁水在铸造台上流动。


  红色的刀身在火焰的包裹下发着微弱的光，刀纹一层一层在火光里显现出来，每一道纹都是锤头落下去时留下的痕迹。


  “焰。”


  她吐出这个词的时候，火焰猛地往刀身上一缩，全部附了上去，刀身变得更红了，红到发白。


  “前辈，她在锻造。”玛修的盾牌已经举到了胸前。


  千子村正的视线越过了庭院，落在对面的东偏殿墙上。她的牙咬紧了，腮边的肌肉绷了一下，然后松开，低声说了句话，声音被周围噼里啪啦的燃烧声盖掉了大半，但嘴唇的动作还是清清楚楚——“还是晚了吗。”然后她朝对面的殿宇扬起了刀。


  “妙法村正。”


  这一刀没有光炮，没有他们见过的那些宝具解放时铺天盖地的魔力洪流。刀就这么挥下去了，简单得像是有人在锻冶场里砸下一锤。


  但东偏殿紧闭的大门在下一瞬间被劈开了，切口平整到连木刺都没有翻出来，紧接着整座东殿的屋顶被掀起来，瓦片在半空中碎成粉末，墙壁从中间裂开，裂缝一路从房檐蔓延到地基。


  然后整个东殿轰然倒塌。柱子砸在柱子上，梁木砸在地板上，烟尘和碎木屑一起往四周炸开。烟尘散开之后，废墟里站着两个男人。


  红发的男人黑键在手，冷着脸和一个拿着大戟的中年男人对峙着。大戟的戟刃在火光里反着冷光，握着它的手骨节很粗，皮肤偏黑，青筋在手背上一根一根地凸着。


  中年男人穿着标准的武士服，肩宽背厚，站在废墟里稳得像一尊石像。士郎看见村正的刀光扫过来，立刻扔下对峙往后撤，脚踩在碎木料上发出吱嘎的声响。


  他的手在身前翻开，掌心涌出一片白色的光，光在瞬间成型，化成了菱形的盾牌，挡在身前。刀光撞上盾牌，轰的一声，冲击波把周围的碎石全部扫飞了出去，士郎被震得往后滑了两步，靴底在地上擦出两道很长的黑色摩擦痕，但他的盾还举着，纹丝不动。


  中年男人转过头来。大戟横在腰间，戟杆上缠的皮条已经磨出了毛边，他的脸上并没有凶戾——立香看清了。那张脸上浮现的表情不是愤怒，不是杀意，是慈悲。一种从眉间的皱纹、从微垂的眼角、从不急不缓转过来的视线里渗出来的慈悲。他和废墟，和他脚边那摊还没散尽的灵子光点，和那柄刚杀了人的大戟——和这一切都格格不入。


  立香的视线往下移。祭拜的台子已经散了，供在上面的瓜果滚了一地，滚进碎瓦和木屑堆里。台子边上倒着宫本武藏的尸体。她的红衣服还是红的，但已经不是染出来的红，是被胸口那个大洞里涌出来的血迹浸透的红。她的整个身子被抽干了，皮肤贴着骨头，眼窝凹进去，颧骨凸出来，像一个被戳破的气球只剩下外皮。她正在化作点点灵子消散，从指尖开始，一点一点的亮光往上浮，浮到半空，散了。


  临走前那个扭头挥手的动作还在立香的脑子里转，还没转完第二圈，她就变成了一摊正在消散的光点。'

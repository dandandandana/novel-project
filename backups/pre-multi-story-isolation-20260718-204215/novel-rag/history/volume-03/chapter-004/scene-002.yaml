content: '“你没有拽我的裤子。”士郎的声音很轻，他没有看立香，只是盯着桌子上的腌肉。他伸手捏起一块，翻过来看背面。肉的纹理在手心里铺开，他用拇指按了一下，肉没有弹性，硬邦邦的，表面泛着一层暗沉的油光。凑近了闻，那肉味底下压着什么，他说不上来，但他不打算继续猜下去了。


  “我哪有问你这个。我的意思是，到时候你知道怎么说吗？”


  士郎的目光还锁在那块肉上:“我也不是很会这种交际，说到底社交这块我代行者这辈子都没怎么沾过。”他翻来覆去地看着那块腌肉，眉头微微皱起，不是困惑，更像是在确认某种他不愿意确认的猜测.


  玛修拿起了一个水果，在袖口上擦了两遍，确认是洗过的，递给立香。立香伸手接过来，张嘴就要咬下去——


  “先别吃。”


  士郎的声音不大，但像一盆冷水从头顶浇下来。立香的动作僵在半空，嘴巴张着，牙齿离果皮还有两指的距离。


  她的眼神在士郎脸上停了一下，然后她把水果缓缓放回碟子里。之前那些玩闹的表情从她脸上全部撤走了，撤得干干净净，就像揭掉一张面具，底下的脸冷硬得让人认不出她就是刚才还在和别人打闹的小姑娘。旁边侍立的下人看见这一幕，膝盖一软就跪了下去，整个人缩成团，额头贴着地板，不敢抬起来。


  “前辈。”


  “太怪了。”立香把这三个字从嘴里吐出来，像是在吐一颗嚼了很久才发现不能吞的东西。


  士郎站了起来。他站在跪着的下人面前，垂下眼睛看着那团缩在地板上的影子，开口的时候声音里带着一股从骨头缝里渗出来的寒意。“你家大人就是这样待客的?!全部给我滚下去，等你家大人亲自来见我。”下人几乎是手脚并用地爬出去的，膝盖磕在木板上咚咚地响，木盘被撞翻了，瓜果滚了一地，没人敢去捡。


  等最后一个下人的脚步声在走道那头消失了，士郎掐出一枚血戒，空间在三人周身扭曲了一下，空气忽然变得很安静，外面走道里的风声、木板被踩响的脚步声、远处隐约传来的诵经声，统统被这道光的屏障隔在了外面。


  他转过身看着立香，手里的那块腌肉还捏着。“腌肉是人肉。”


  立香的瞳孔在那两个字之后猛地收缩，她感受到了更深的地方涌出来的恶心——从某种属于人的本能里被扯出来的。


  她的嗓子堵了一下，然后扭头看向玛修:


  “玛修，守好这里。”拿起一块腌肉凑到腕上通讯器的镜头前，按下了传输键。奥尔加玛丽的回复很快就来了，快得像是她早就等着这一刻:


  “立香，确定了，是人肉。而且是——人的胸口的肉。”


  立香把通讯器从嘴边拿开。她的脸黑了下来，她把腌肉放回碟子里，手指在放下之后还悬在半空，没碰到碟子，也没收回来。


  “拿人肉来招待我们，看来他们这里已经习惯这种招待，而且估计是不少吃。”


  她的视线扫过周围那些空荡荡的木墙、房梁上那块深色木匾、地板上还没被下人收走的滚落瓜果。嘴角往下压了压。她开口的时候语气很淡，淡到几乎听不出情绪。


  “士郎。”


  “啊，明白了，我去侦察了。”


  玛修把盾牌从长袍底下抽出来，架到左臂上。金属边框贴着她的前臂，冰凉的触感透过战斗服的布料渗进皮肤里。她调整了一下握柄的角度，确保随时可以激发，然后抬眼看向立香。“前辈，收集完信息就离开吗。”


  “是的，我不与这种人为伍。”


  士郎的声音忽然从通讯器里传出来，语速比平时快了一些。“御主，有很不好的消息。宫本武藏的灵基波动消失了。”


  武藏刚刚还在走道里大声大气地笑着说回头见。立香脑子里的碎片一块一块地拼在了一起：剑豪比拼，前两名，分头接待，僧侣，法相，祭拜的台子。每一块碎片落进拼图里的声音都清脆得像是骨头被折断。她开了口，一个音节一个音节地往下砸。


  “士郎，先去武藏那里收集信息。”转向玛修，“剑豪对决是个陷阱。千子村正也有危险。”


  “走!我们先去西边的大殿!“


  玛修揽住立香的腰把她整个人抱了起来，像抱一个轻飘飘的布包，转身就往门外冲。靴底在木地板上踩出一连串密集的闷响。


  她们刚冲出主殿正门，身体还在带着冲劲往前倾，视野的左边忽然变成了橘红色。火从西侧的偏殿里炸出来。木格子窗被气浪冲碎，碎片在半空中烧成黑炭渣，热风裹着火星子涌进走廊，拍在立香脸上，把她的刘海全部往后掀。


  那是村正待的偏殿方向。


  烈火还没有烧透整个屋顶的时候，一阵梵音从殿内传了出来:成百上千道嗓音叠在一起，低沉、平稳、不急不缓，像是要把所有听的人的意识都磨碎成粉末。火在烧，梵音在念，两种声音搅在一起，搅成一种她从来没有听到过的诡异和弦。然后剑鸣炸了。'

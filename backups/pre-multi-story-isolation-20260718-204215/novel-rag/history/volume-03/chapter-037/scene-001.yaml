content: '晨光从纸窗的缝隙间洒了进来，在她被子上铺出一块暖黄色的光斑。光斑先从被角慢慢移到了她蜷起的膝盖上，又顺着膝盖挪到枕头边，最后直直打在她的眼皮上，赖住了不走。


  立香迷迷糊糊地翻了个身，用被子把自己从脖子到脚踝重新裹了一层，把光斑一把闷在被窝外面。


  直到现在她还是没法接受这个世界太阳一瞬间蹦到正头顶的破事，连睡个懒觉都成了奢望。


  【说实在的……好像好久没有睡过懒觉了。】


  有人敲了敲门。敲门声不重，指节在木框上磕了两下，停了一拍，又磕第三下时力道比前两次更轻，仿佛在替她延长最后这几拍闭眼的时间。


  门被推开了一条缝，那人从缝隙里看到立香把被子夹在两条腿中间还捂着脸不肯醒过来，头发乱得像刚从枕头底下翻出来的一盒打结的线团。他叹了口气，没有走过去拉帘子。


  “先坐起来。”


  立香被他轻轻扶了起来，他的手掌很大，右手搁在她后背上一推就把她从被窝里整个人托起来了一点。


  她的脖子还在发软，脑袋朝前点头点了一下又被自己拽回来。她听到他从袖口里掏出了什么东西——梳子齿在袖口的布料上刮出了一小声干响。


  “玛修让我来给你梳头发，她在检查装备。”


  士郎的声音从头顶传下来，立香把眼皮撑开了一条缝，正好看见他把自己最后一束头发聚拢在掌心，梳子从发尾梳过时梳齿轻轻磕了一下她的后颈。


  皮筋从他袖口里又被抽出来，在她发束上绕了三圈。绕完第三圈之后他把皮筋一松，头发在皮筋里弹了一下扎好了。他的手从她肩上收了回去。


  “好了，早饭也准备好了。不是说中午要准备去星之内海吗。”


  立香的眼睛又自己阖上了，她嗯了一声，士郎看了她一眼，把她重新放回床上。她的后脑勺陷进枕头里之后被子自己弹回来盖过了她的肩膀。他站起身子走到门口，木屐在石板上踩出两声轻响，门被轻轻带上时门框在槽里磨了一声短哑的闷音。


  立香在门关好后把手从被子里抽出来，她的掌心贴上腮帮时碰到的温度不是从外面被阳光晒暖的——那股热是从皮肤底下朝上涌的，蒸得她耳朵尖也跟着温度蹿高。她用被子把自己从额头到下巴全部蒙住，被窝里全是她自己呼出的热气。


  “什么啊……为什么我就那样闭着眼让他梳了……”


  她隔着被子捂着脸，声音被棉布压成了一段闷闷的咕哝。话音还没完全散开，门忽然又被推开了。


  推门的人没有丝毫怜悯，走进来之后叹了口气，嘴里还在嘟囔着什么，但嘟囔的内容全被她的呼吸声吞了回去只能听见几个含糊的短音节。


  随后刷啦一下，帘子被整束拽开。整间房被光淹了——不是晨光，是头顶那轮已经跳到半空的太阳砸下来的无源白光照得整个榻榻米都泛了一层淡金色。


  “前辈，太阳真的照屁股了。”


  玛修的声音在光里响起来。立香勉强把眼睛撑开一道缝，看见玛修站在窗边，一只手还握着帘绳，侧脸刚好嵌在早上那片最大的白光里把她的脸衬得格外清晰。


  “啊啊，玛修……几点了。”立香开口时嗓子还带着睡意，连把这句话的句尾说清楚都懒得多用半拍呼吸。


  “前辈，不许赖床了。我刚才就听到你自言自语了。”


  立香脑子里的睡意在一瞬间被这句话扫干净了，她的脸刷一下烧了上来，两只手从被子里弹出来，连摆手时手腕都还在发抖：“等等！你什么都没听到，你绝对没听到！”


  “没错没错，我没听到。言峰前辈做的饭已经快亮了。”玛修说这句话时嘴角朝两侧拉开了一道极细微的弧度。她把手里剩下的帘绳一抖，帘绳打在墙上发出一声脆响。“快起来吧。”


  “好的好的！我现在就起床。”


  吃过饭后立香带领全队收拾好了着装。她站起来时餐盘还搁在矮桌上，筷子和碗沿磕出最后一声轻响。她将迦勒底的黑白制服翻出来理平了袖口。


  她披上士郎递过来的白色风衣，风衣的下摆垂过膝盖，被她自己在腰侧拽了一下把布料扯得笔直。她朝着自己的伙伴们点了点头，目光从玛修的盾牌挪到吉尔的袖口再到村正肩上扛的刀。然后他们一起看向在前面等候着的天沼。


  天沼深深地看了言峰士郎一眼，接着又看向立香。他转身时脚跟在地板上蹭了半圈，开始沉默地带路。


  城主府深处的走廊比正厅窄得多，两边的木墙被岁月压出了几道顺着木纹向下延伸的细缝。


  立香的靴底踩在廊板上每踩一步就和天沼的步伐差半拍。走廊尽头她看见了那个熟悉的小屋——伊耶娜美曾经在这里给她试炼。她一想到那个试炼就不由得撇了撇嘴，嘴角朝下一拉把嘴唇压扁了半寸。


  天沼继续往前走。廊板尽头没有继续建墙——他就这样走到了一片山的面前。


  山就立在他们面前。岩石的纹理粗细不一，浅灰色的花岗岩从地面拔起来把整条路堵死。天沼没有停下脚步，也没有回头。'

content: '然后男人的刀飞了出去，在半空中翻了两圈，哐当一声插进擂台边沿的木缝里。男人已经倒在地上，仰面朝天，眼神涣散，喘气声粗粝得像是从磨盘底下挤出来的。


  “德康家光。”士郎把这个名字在心里默念了一下。他确定自己没有认错，那确实是确立了参勤交代、建了江户城的那位幕府将军。


  幕府将军被一个从者打得毫无还手之力不算稀奇，稀奇的是——他身上的伤居然已经在愈合了。士郎敏锐地捕捉到男人手腕上被刀背砸出的淤青正以肉眼可辨的速度褪去，皮肤底下那股淡淡的紫红色像退潮一样逐渐消失。


  从者对砍的伤口不可能这么轻易恢复，除非对方根本不是普通人，或者这片擂台的擂主有种特殊的加持。士郎的目光从武藏身上移开，转向擂台另一侧。


  那是另一个擂台的最后一轮。观众们的欢呼声在武藏这边炸开一波之后，紧接着那边也爆发了，两股声浪碰撞着，把整个大宅子的院墙震得嗡嗡响。


  那个在观众席中站起来的少女压下了刀刃上最后一滴未干的血，擂台下是倒地喘息的少年，她侧过身面向裁判，铁刀在空中划出一道平直的光路，指向裁判台。


  带着兜帽的锻冶服少女把铁刀垂到了身侧。那把刀朴素得不像话，没有刀铭，没有刀镡上的雕花，连刀柄的缠绳都是最简单的十字交叉。但她握刀的姿势漂亮极了，士郎觉得自己像是看到了某座古庙里供着的名刀，每个角度都严丝合缝到让人想多看几眼。


  灰色的羽织披在她身后，兜帽遮住了大半张脸，只能看见一片阴影里微微凸起的脸颊轮廓。那片轮廓线条很光滑，下巴的弧度柔和得不太像常年握锤的人。她站在擂台边缘，没有像武藏那样张扬地看着对手，只是低着头，用一块白布慢慢擦刀身上的灰。


  【千子村正。】士郎心里泛起一个念头。


  他当然知道这个名字，那个在战国时代铸造了无数名刀的传说级刀匠，据说他的手打出来的刀连龙都能斩断。但如果这个参赛者真的是村正，就扯出了另一个麻烦的问题——千子村正在历史记载里是男性，面前这位怎么看都不是。


  那双握着刀的手，手指不长，骨节小巧，握柄的手法呈现出上段构时特有的稳定与曲线。他还没来得及多看两眼，脑海里就响起了御主的声音。立香的语气听起来比刚转移过来的时候松懈了不少，大概是听到了女性宫本武藏之后完成了一次心理缓冲。


  “士郎，我们到了，可以直接进去吗？”


  士郎把后背从木柱上移开，僧侣仍然没注意到他。“并没有门禁什么的，我去接你们挤进来怎么样？”


  “好，我们在这里等你。”


  他把所有的情报在脑子里重新过了一遍，从武藏的开场劈砍到德川家光的异常愈合能力，再到兜帽下那个看不清脸的刀匠的站姿。每一个碎片都在往外冒新的疑问，但他现在已经习惯了这种感觉，就像往一个没底的井里扔石头，听不到落地的声响。


  大门口的人潮已经挤到了一种不可思议的程度。玛修侧过身体，用肩膀顶着人流往前走，后背挡在立香前面，替她承受着两旁挤过来的手臂和竹篮。她的脚踩在木板边缘，那块木板往下沉了半个指节，发出咯吱一声闷响。立香在她身后用手推着她的背，不是真的在推，只是借着力稳住重心。


  一只手从人缝里伸了出来。


  士郎从拥挤的人群里挤了出来，他的肩膀撞开了两个挡路的小贩，脚踩碎了一个滚在地上的竹筒，终于挨到了玛修面前。他先把手搭在玛修肩上把她稳住，然后另一只手伸过去拉住立香的手腕。


  “有发现什么吗？”


  立香一边在人潮里艰难地挪步一边开口，声音被旁边的锣鼓声盖住了大半，士郎低下头凑近她才听清。三人挤到了大门内侧一处相对空旷的角落，背后是青灰色的高墙，头顶的石灯笼垂下一条歪斜的影子。士郎松开手，把刚刚在高塔上看到的事情从头到尾说了一遍。


  “你的意思是，守卫反而面色比这里的平民好得多？”立香挑起了左边眉毛。


  “是。”士郎的回答没有多余的形容词。


  立香没立刻接话，灵子转移后最先看到的那一幕又浮上来了——她们降落在郊外的一处杉树林里，脚下踩着厚厚的腐植土，空气里有松脂和潮湿树皮混合的气味。


  奥尔加玛丽的定位信号在手表上跳了三次才稳定下来，等她们走出林子，碰见的第一个人就是穿着灰色僧衣的男人。


  那人手里拿着铁杖，看到她们之后脸色骤变，不是变成某种颜色，而是整个面部的肌肉构造都好像重新组合了一遍。他随后跪了下去，膝盖骨磕在泥地上发出一声闷响，额头砸进泥土里，嘴里念着她们听不懂的经文。


  立香当时下意识伸手想拉他起来，还没碰到他的肩膀，士郎的手就按住了她的手腕。


  “别碰，”他当时只说了一句，“可能会折寿。”'

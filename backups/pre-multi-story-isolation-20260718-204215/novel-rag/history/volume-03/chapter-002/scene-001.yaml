content: '铜锣声不是从某个方向传来的。


  那声音像从地底涌上来的闷雷，先震得木制地板微微发颤，然后才炸开在每一双耳朵里。整条本町通的人都开始朝一个方向涌过去，像被同一根看不见的线牵着。


  女人们挽着竹篮跑了起来，篮子里空荡荡的只装着几片干菜叶，跑动时发出沙沙的声响。男人们放下手里的活计，有的是编草鞋的，有的是扛米袋的，有的是蹲在路边发呆的，统统站起身，拍拍屁股上的木屑，加入了人潮。


  “月读命金地的剑豪比拼！”


  那孩子瘦得像一根火柴棍，破麻布衣服在肩膀上晃荡着，每跑一步就往两边甩开，露出胸口一根一根的肋骨。


  他高举着的手里攥着什么东西，凑近了看才会发现那是一截竹筒，竹筒里插着块发黄的木牌，木牌上用墨歪歪扭扭写了三个字——他大概根本不识字，只是有人告诉他举着这个喊就能换几个饭团。


  他的嗓音尖利得破了好几处，像扯得太紧的弦，“瞧一瞧看一看啊！白热化的阶段！”人群如潮水，他在潮水里连浪花都算不上，但那股子不要命的奔跑让这道细瘦的影子硬是从密密层层的人缝里钻了过去。


  整条街都笼罩在一种古怪的光线里：夏末的日头不算毒，但木质建筑反射出来的光偏黄偏暖，像是所有东西都蒙了一层蜜糖。可这蜜糖底下盖着的东西就不怎么好看了，地面全部铺着木板，打磨光滑的木纹在脚下延展开来，走过的时候能听见空洞的闷响。每块木板都踩得微微下陷，那是下面垫土不够严实造成的。两边的屋檐伸出来老长，把天空割成窄窄的一条，能看见的只有一线白刺刺的光。


  卖豆饼的小贩盘腿坐在街边，面前的木盘里摆着几块灰扑扑的饼，大小不过巴掌，薄得能透光。他的脸上挂着谦卑的笑，嘴角往两边咧得很开，露出一排黄牙。旁边卖柴火的女人也是这副模样，脸上满是笑容，可那笑容落不到心里去，更像是某种约定俗成的规矩。


  玛修把兜帽压得更低了一些。


  她的视线从那些微笑的脸上一一扫过去。每一张脸都让她想起迦勒底档案里记载的饥荒年代影像资料，眼眶深陷、太阳穴凹进去、下巴尖得能划开空气。但他们都在笑，不是礼貌性的微笑，而是真正的、发自内心的、连眼角的皱纹都要挤出来的笑。


  “这里的人过得不错？”


  玛修的声音低得几乎只有她自己能听见。她话刚出口就觉得不对劲——这种话说出来像是把石头丢进水里也没个回响，她自己都被自己的问题噎住了。


  立香在后面走得很慢，她的步伐节奏和周围的人错开了。周围的人都在小跑或者快走，只有她们两个不急不缓地往前走，像湍急河流里的两块石头。


  “看他们的表情是这样的，前辈，但是很怪。”


  立香没有立刻回答。她抬起头看了一眼头顶那被屋檐切割成窄条的天空，白刺刺的光晃了一下她的眼。她又低下头，目光落在木制地板上。


  木板很厚，色泽发暗，有些地方磨损得厉害，踩上去会发出不同的声响，她没有蹲下去摸，但她知道那种木头的手感——干燥、温吞、带着日积月累的尘土气息。


  “嗯，说说看，玛修。”


  二人就这样隐没在人潮里，两件长袍在竹帘和木格子窗的背景上缓缓移动，留下两道短暂停滞在木质肌理上的光影。


  玛修把声音压得更低了一些，低到只能勉强穿过兜帽的布料钻进立香的耳朵，“为什么会有木制的地板呢。”


  玛修说这话的时候用的是一种自言自语式的平调，立香把袖口往上拢了拢，露出半截手腕上的通讯器。表盘里一片安静，所长的声音还没来。她等着玛修说下去。


  “这段时间的时期生产力极度低下。”玛修的脚步没有停，她的靴子踩在木板上发出沉闷的轻响，与周围噼里啪啦的草鞋拍地声比起来显得太沉了，“而且不处于神代，怎么说都没有可能啊。”


  立香转头看了看两旁。建筑确实是豪华的。门楣上刻着整条的藤蔓纹，瓦当上的图案精致到能看清叶子上的脉纹，连檐下挂着的灯笼都是用细竹篾编的，每一个网眼都整整齐齐。这些细节堆在一起，放在她们来之前的那个街区也说得过去，放在这里就显得突兀了。


  到处都是粗麻布和凹陷的脸颊。雕刻精致的门楣下面坐着的女人瘦得连颧骨都快戳穿皮肤，手里拿着竹篾编灯笼，旁边的孩子饿得肚子都快粘到后背上了，却咧着嘴朝街对面招手。


  “确实是这样，玛修，周遭的建筑豪华得如同到了旅游景点。”立香说完这句话自己先笑了，是那种笑不太出来的笑。


  旅游景点——这个词放在这个特异点里有种说不清道不明的错位感：迦勒底的资料库里管这种地方叫异常点，考古学上叫文化滞后，但立香从来不喜欢这种学术名词。


  玛修先前一直在数地面上木板之间的缝隙——每隔三步就有一个接榫，手工活做得挺细致，间距几乎没有偏差。'

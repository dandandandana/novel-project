content: '金地外的深夜冷得不像气流的移动。冷是从四面八方同时往外抽，泥土里的、松针间的，、茅草墙缝里的，每一处都在往外渗那层薄薄的寒。


  言峰士郎站在村子最东边那棵歪脖子老松下，白风衣的后领被夜气染得发潮，他把心眼全开，所有声源在这张感知网上被标成大小不一的亮点，其中没有鸟鸣，没有虫响，连松针彼此摩擦的簌簌声都被这片土地吸进了地底。


  如同金地之外的世界，在夜里不会呼吸。


  树枝断了，啪的一声——干燥的松枝在脚底断裂成两截，断裂面的木质纤维在极短促的嘎声之后连同回音一起被寂静吞掉。士郎把头从闭目养神的倾斜角度抬正。他的感知早在树枝断裂之前捕捉到了那双木屐踩上庭院泥土时传来的踏力——很轻，来人有意压着脚底落地时的节奏。


  村正从茅草屋檐下的阴影里走出来。月光还没被照耀过来，此刻她整个人是由黑铁太刀的轮廓、被夜露打湿的发梢和衣领上那道被风吹歪的缺口缝处吹过来的


  “醒了还是没睡？”


  士郎把手从交抱的双臂上放下来，他看向红发少女的脸，开口问道。


  “睡醒了，你一晚上没睡吗，言峰士郎？”村正的视线扫过他衣领上被露水濡湿的布沿停在他脸上，“你在看什么？”


  “看日出。”士郎抬头望向东边天际。此刻那片天还是厚厚一层深蓝，连黎明前该有的微白都还没渗透出来，“我们在这里没有明确的时间。”


  “日出啊。”村正跟着他的目光也朝东边看了一眼。她这一眼扫得很快从地平线左端扫到右端，扫完之后她把脑袋微微歪了一下像是在确认自己没看漏什么，“天照命金地那里的太阳还没升起，这里是不会有日出的。”


  “天照大神是太阳神的象征。倒不是不能理解。”士郎低声说了句，他说完之后用脚底搓了搓地上的泥土，几颗碎石子嵌进他靴底的纹路里。他的余光始终挂在村正脸上，村正知道他在看什么。


  村正看着士郎那张欲言又止的脸：他嘴唇张过两次，每次都是欲言又止的样子，然后他咽回去了自己要说的话。


  村正开口替他讲：“你的这张脸。”


  士郎的下一口呼吸比上一口多了些重量：“怎么了。”


  村正摇摇头：“不，先说你的御主吧。”


  “你的御主和你长得很像。”


  士郎顿了顿，这一顿让他意识到自己脚下那片泥土已经快被靴底搓出一个小坑，他停住脚。


  “巧合。”


  村正歪了下脑袋，她的瞳孔在黑暗里亮了一瞬;“真的？“


  “当然是真的。”士郎的声音依旧没有任何起伏，他的心眼在这句话脱口的瞬间与自身的心跳同时漏了半拍——感知网里有个角落忽然亮了一下，又灭掉，心眼在提醒他注意点什么。


  “你想问什么。”


  “你的御主，藤丸立香其实是你的女儿吧~”


  “？”


  村正盘腿往地上一坐，太刀搁在并拢的膝盖上刀柄靠着她肚子上那截被腰带勒紧的布料。她用手指一根一根竖起来。


  “你看啊，橘色头发，娃娃脸，橘色的瞳孔，甚至连面庞的轮廓都差不多。”她把竖着的四根手指在空气中摇了摇，然后她用另一只手挠了挠自己的后脑勺，“真不是你女儿？”


  “当然不是。”士郎叹了口气。他抬起手用拇指和中指分别按住自己左右两侧的太阳穴，指腹在皮肤上压下去，能感到太阳穴底下那根血管正在一跳一跳地推着他的指腹，他揉了大概两个呼吸的时间把手放下来。


  “你想说的就是这个。没了？”


  “当然不是。”村正把搁在膝盖上的太刀往怀里拢了半寸。“我知道你好奇的是什么——你应该最好奇的是我的脸吧。”


  “显而易见。”士郎的目光从村正的眉骨扫到下巴，扫完之后他把两只手臂重新交抱在胸口前，右手肘卡在左小臂外侧，“而且我的记忆里，千子村正是个男人。”


  村正站起身，她抬头看向士郎，她仰起的脖子在衣领上摩擦出细碎布响：“你可以猜测一下。”


  “猜吗。”士郎扫了她一眼。视线从她的头顶掠过，滑过她颈侧的衣领边沿：“我猜你是假货。”


  村正愣了愣，愣完之后她把嘴唇抿了一下，然后松开说道：“对也不对。”


  “什么意思。”士郎的眉头往眉心挤了半寸。


  “我们千子家采用名称世袭制。”村正继续说下去，语速比刚才解释日出时快了整整一层次，像是这一套话她已经对别人说过——或许是那个已经不在的人对她说过。


  “家里的长辈都死光光了，下一辈就要继承村正的名号。我是继承了村正的名号。”


  士郎捏着下巴。拇指在下巴尖上来回擦了两次。“你们千子家传承了几代人。”


  “算上我父亲是两代。”


  士郎的嘴巴张开一条缝。那句“你怕不是在玩我”已经从胃里涌上来了都快顶到舌头了，但他在最后一刻把它咽回去。


  【对长辈已经去世的人总不能出言嘲讽吧.......】'

content: '士郎站在原地愣了两拍，然后他把嘴里的冷空气咽下去：“如果，如果你生气了，我向你道歉，村正亲。”


  村正停住，她转过身，脸上带着微笑。这个微笑和她刚才挠头解释心直口快时的不一样——那次是嘴在笑眼睛没跟上；这次她的嘴角往上勾，眼睛也眯起来了，眯到盛不住任何多余的意思。


  “没有哦，士郎~”她把他的姓氏省掉，语气带着之前从来没有过的亲昵，然后她转过身继续往前走。


  村正的身影消失在茅草屋转角后。士郎站在原地。刚才被她指过的天空现在太阳还悬在头顶正中央，那轮日轮从西方升上来到此刻大概过去了不到几次呼吸的时间，但它挂在正午位就停住了没有继续往东移也没有沉下去。


  整片天空被钉死在白昼的某个固定帧上。士郎把视线从空中收回来，收在他脚底刚才搓过的碎石子上，那些石子还停留在被他靴底刮开的泥坑里。


  “啊啊，这大概是叫做士郎的NPC逃不掉的宿命。”


  祁荒的声音从松林的暗处飘过来，祁荒从光照下路过，她丢下这句话后整个人又重新被松枝的阴影吞没。她的脚步继续往村子另一头走，不疾不徐。


  士郎的心眼在他的脖颈后处扎了根针，凉意涌上心头。


  士郎顺着那道莫名涌上后脖颈的凉意回头：


  藤丸立香站在茅草屋门口。


  她是怎么站在那里的、什么时候站在那里的、站在那里之后看了他多久——这三个问题的答案士郎在看到她的脸时全都不重要了。


  因为她的眼睛已经告诉了他所有需要知道的信息。橘色头发被压了一夜的草枕弄出几条不太明显的睡痕，睡痕从左耳后方的位置斜着往上卷沿着她的腮线滑进衣领。她的手自然垂在身侧，没有叉腰没有攥紧没有抱臂。


  她就这么站在门框边，门框里灶膛最后的余火在她背后映出一小块暖黄的背景光。她的橘色眸子眯了起来。不是困——她的嘴唇在眯眼的同时往上勾出一个笑。那笑是甜的，甜到玛修在她身旁整个人从脖子往上僵成一根笔直的线。


  玛修弱弱地伸手拽了一下立香的手腕，没拽动，她现在的表情类似于“言峰前辈我想救你但是我完全不知道怎么做”的样子。


  立香的脚踩在门口那道硬泥地上，地面都被她的重心压出了一个比平时深一点的印子，但她整个人的上半身纹丝不动。


  玛修又拽了一次这次拽的是袖口。没拽动。玛修把手收回去收在自己的盾柄上，她的表情不再是刚才那种“我想救言峰前辈”的焦虑了——已经转成了“言峰前辈你要好好的活下去啊！”的惊恐。


  “言峰士郎。”立香歪了歪头，歪头的时候她耳后那几根睡痕被扯直了一瞬。然后她睁开了眯着的眼睛。橘色瞳孔里没有怒气：只有一片正在开始结冰的冬日湖水——水面还很薄冰层还没完全覆盖但底下所有流动的东西都已经停下来了。


  “你就是这样守夜的？”她的话语如同敲在刀刃上的指弹一样令待宰的羔羊胆寒，她的笑容没有消失，但笑容底下那层细碎的寒意开始从瞳孔往外扩散，扩散到眉梢，扩散到鼻梁两侧。


  “昨天答应了我什么。”


  “不，不是这样的。”士郎往后退了半步，“是村正她醒了，然后我们聊了聊天。”


  士郎说完这句话之后自己都觉得自己完了。


  玛修的表情在士郎说完这句话之后从惊恐变成了那种说不上是同情还是绝望的错愕，她的表情变成了“言峰前辈你彻底完蛋了”的样子。


  她的嘴唇张开了一瞬，然后合上，她用两只手同时抓住盾柄把盾往自己身前移了半寸最后停在那里。


  “啊啊——这样啊。”立香歪着头。歪的角度比刚才深了一点，睡痕滑进衣领，她的娃娃脸上那双橘色眸子此刻完成了全部的结冰过程：


  “你在和村正亲晚上夜间谈话是吧，言峰士郎。”


  “等等！这里有古怪，不是夜间谈话啊喂！”


  她迈出第一步。脚底踩在泥土上的声音闷重：她把每一步体重都压在脚底板上故意让泥土发出被挤压到透不过气的声音。


  玛修伸手想拽她已经来不及了。第二步，她的嘴角还保持刚才那个笑容，但那个笑容现在只挂在下半张脸——眼睛已经冷到了极点。


  第三步。


  “还敢狡辩。”


  “等等，我对主发誓！我绝对没有撒谎！”


  “你现在有半点信教的样子吗？！给我在那里站着！”'

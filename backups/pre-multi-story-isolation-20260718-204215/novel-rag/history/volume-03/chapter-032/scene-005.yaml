content: '眨眼间整个剑雨都碎成了粉末。碎裂的剑刃粉末在空中没有往下落，而是被残余的月光托在半空中打着漩，化作了一圈发白的光环，然后消散。


  村正在剑雨粉碎的那一刻已经将刚刚锻造出来的打刀持在身前。


  她的刀刃朝下压了半寸，身后猛然爆出金色的火纹——火焰从她的脚后跟朝外喷出两道喷射状的金色焰束，她整个人借力朝前冲去，村正没有回头，打刀朝前直斩的同时朝身后喊了一句：


  “这家伙的月光会扭曲现实，小心一点。”


  青色火焰流动着朝月读命压去。月光从高空往下灌，和青炎在一丈高的空中交汇——青炎被月光裹住，月光也被青炎拖住，光与焰的交界线在扭曲中不断移动，谁也没能赢过谁。


  月读命身上的黑袍在她挥杖的幅度中微微朝肩下滑落了半寸，露出肩下一截被月光照得苍白的颈侧。她勾唇笑了起来，那个笑容在月光和青炎相互撕扯的光影里显出一种奇异的安静：


  “月读命是秩序之神，而我也只窃取了这一部分。”


  月读命的话音刚落，主殿周围的光晕忽然变了一层色温——从原来的洁白开始朝青白色偏移。


  她把权杖换到左手，右手朝身侧的虚空中探去。空气里裂开一道银色的罅隙，罅隙边缘的光在往外漏的同时发出了很轻的嘶嘶声。


  “我修行一万一千二百年载，于一千一百年前成为月读命金地的法相，一百年前成为月读命世尊。”


  月读命笑着，从罅隙中抽出一柄太刀。太刀出鞘时刀刃上的银光不是反射的月光——刀身本身就在发光。


  每一寸刃纹都清晰得如同刚刚淬完火还在往外淌水，但那水是冷的。他横刀于胸前，刀刃上映出的不是倒影，是他自己的眼眸——眼眸里没有眼珠的颜色，只有月光填满的银白。


  “这个世界和你们想的完全不一样。”


  月读命把太刀架起。


  右手握刀柄，左手在刀背上擦过——指尖所过之处刀脊上亮起一排沿着刃纹排列的银色古文，古文在亮起的瞬间朝外迸出刺目的白光。


  一道光芒亮起，从刀身上脱离出来，朝着村正闪去。


  村正的眼角余光捕捉到了这道光芒的移动轨迹，在空中跳跃着出现的，从一个点消失又从另一个点跳出来，中间没有经过任何移动的痕迹。她没有意料到月读命会把太刀以这种方式使用。


  村正冷笑一声，没有后退，反而朝前一剑砍到月读命爆出来的那道跳跃的光芒之中。


  打刀与光芒碰撞时整柄刀身都震了一下，青色的火焰从碰撞点朝外炸开。然后她的黑炎从背后涌上来，化作一道方方正正的屏障，挡住了来自她身侧预先等待突入的一缕月光的骚扰。


  月读命架起太刀挡住村正追上来的一斩。刀刃相接的瞬间月读命的眼中没有丝毫的波澜。


  她握着太刀的手腕被村正的冲击力朝下压了半寸，然后她另一只手从另一侧的虚空中抽出第二柄太刀。


  这柄太刀上面刻着精密的篆文，篆文的笔画极细，在刀身上密密麻麻排了整面刀脊。


  月读命一咬牙，腮侧的肌肉绷了一下，然后喷出一口银血在太刀上。银血落刃的瞬间整个太刀轰鸣起来——不是金属震动的声音，是篆文被激活后每个字都在用极小音量同时念诵经文，经文声汇在一起就成了嗡嗡低鸣。


  一个个血红色的纹路从刀身上朝空中飞去，纹路在空中展开之后不再是平面的血痕，而是立体的血色藤蔓，朝村正缠绕了过去。


  村正的黑炎迎上去和血红色的纹路交缠在一起。黑炎被纹路绞住的地方开始黯淡，燃烧的速度在下降——那些血色纹路不是攻击，是压制火焰燃烧的规则。


  村正挥出一剑，月读命双刀撑住她的单刀。刀刃交叠之处溅出是黑炎与月光互相抵消后残存的光屑。


  然后第三把太刀从月读命的身后缓缓升空。不是从虚空中抽出来的，是她衣袍的后摆朝两侧一拂，露出一柄一直贴在她后背的短太刀——刀鞘上没有花纹，但刀柄的缠绳打了七个结。


  “你这家伙……真的是世尊吗？”


  村正低声开口，她的视线在月读命身后那把短太刀上停了一瞬，然后又扫向对方手中那两柄截然不同规格的太刀，眉心皱了一下。


  “为什么这么多太刀，规格还都很高？”


  月读命双刀交叉在身前，第三柄太刀在脑后安静地悬着。


  她听到村正的问题之后没有立刻回答，而是把左手那柄刻满篆文的太刀在掌心转了半圈，刀刃朝下，将刃尖点在脚边的石板上。


  “我在成为世尊之前，在天照命待过一段时间。我所见过一位红发的铁匠。”


  月读命淡淡的说着，她身后的太刀在她话音落下的同时猛然亮起，刀刃通体发白，然后从刀身上射出一道狭长的白色剑芒，剑芒贴着月读命的发鬓飞出，从侧面撞上了士郎从她背后刺过来的黑键。


  黑键的刃尖在接触到剑芒时瞬间被气化成了铁红色的蒸汽。随后士郎又挥出一剑，不再是黑键，是整片天空亮起了一柄巨剑。'

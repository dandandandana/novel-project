content: '立香在抵达战场之前通过奥尔加玛丽和达芬奇获得的信息并没有那么多。


  远距传讯的片段被金地外围的结界干扰得全是噪音，她只能从偶尔漏进来的半句话里拼凑出前线的局面——玛修正面顶着法相的阵，士郎在后援就位，伊耶那美在对云层里面的东西。她不知道城墙上还有那么多。


  直到她看见伊耶那岐金地派来的第一批法相从城墙后面翻身而下的时候，她才意识到问题的严重性。


  那些金色的影子不止在地面上列阵——城墙上林立的垛口后面整整齐齐蹲着好几排摩诃，身上的金漆在夜风中微微发亮，像城堞上长了一层密不透光的苔。


  出战的法相拖住了玛修。城墙上待命的那些会在任何一线出现劣势的时候从背后杀出来，把整片街区的退路全部切断。


  立香在那一瞬间已经把这个画面在自己脑子里摆好了。她当时只有两个选择。让士郎和玛修一起在前线顶住，拼硬仗打穿这道防线。


  可一旦祁荒和村正在主殿有一方对决出现问题，正面撑不住，后方又有埋伏——牺牲就不可避免。这是立香不愿意看到的结果。她把话压得很平。


  “如果牺牲无法避免，那就需要把他降到最低。”


  风从城墙的方向灌过来，吹得她额前的橘发朝后倒飞。她侧过头，看向身后的士郎。


  “士郎，你有什么想法。”


  士郎的视线也落在城墙上，那些垛口后面亮着的金色光点——每一个都是一双僧人的眼睛。


  他数了几秒。


  “立香，”


  他顿了顿，下巴朝城墙方向一抬，“先去解决城墙上的法相和摩诃怎么样。”


  立香的目光扫向城墙。她盯着那些蹲在垛口后的金色人影，在心里又摆了一遍局势图。


  城墙清空之后，不管祁荒那边出问题还是玛修那边劣势，都不会再被包抄。敌人的援军路径干掉，正面就是一对一。


  “我懂了。”她把视线从城墙上收回来，唇角往上抬了半寸，“先解决掉他们，不管哪边陷入劣势，都不会陷入包围和遇到援军是吗。”


  “嗯。”


  “真不愧是你啊，士郎。”立香思考着开口，一手朝上指了指天空深处某个她肉眼看不到的位置，“吉尔茜隐藏在空中。如果让她保护我，反而之前的战术都失效了，她该待在空中的位置还是留着。”


  她把脸转回来，橘色的眸子对准士郎。


  “你带着我去城墙上清扫。正好让我看看你的真实的实力。”


  立香之前一直没能见到士郎的实力。就算是在伦敦的高强度交火之中，她始终只能隔着好几层废墟看他在对面楼顶上跟人对剑，那时候他的剑光在白天的伦敦雨幕里什么都看不清楚。


  不论是战斗方式还是他手里武器的变化，立香一直没能亲眼确认。


  士郎只是点了点头，然后把自己身上的风衣脱了下来。白色的战斗风衣在脱下的途中被城墙方向的光照得发白，他把风衣展开，从立香身后披上去，手指按在她肩膀的时候停留了一瞬。


  “穿好就行。”


  立香裹上士郎的风衣，他的体温还没散干净，衣领托着她的脸颊，布料里能嗅到铁腥味和空中黑炎火云压下来的焦气。


  她带好兜帽，把安魂从枪套里拔出来，朝士郎点了点头。士郎一只手搂住她的腰，把她整个人拢进怀里，一步便腾空而起。城墙的石壁在脚底朝下猛地退了一大片距离。


  立香在被搂着飞起的这一下里，手指假装是去调整兜帽的帽檐，顺着通讯器的边缘一滑，触碰到了录像键。


  她冥冥之中感觉到言峰士郎可能会给她足够的惊喜——她想知道给奥尔加玛丽所长看看。


  城墙上的僧人刚发现空中掠过一道白影的时候，黑键已经从他们背后的死角飞过来了。士郎搂着立香在城垛上空荡了半圈，七把黑键从他的左手边同时脱手，摩诃们刚举起武器去格挡，黑键的刃尖已经扎进他们的后颈、腋下、膝盖窝。金漆表的甲片在刃尖贯入的瞬间朝外炸开一圈金色碎末。


  立香把一切都收进眼底。她被他搂在左臂里，身体随着他每一次转身和挥剑的角度微微晃动，手指摁在安魂的枪柄上却扣不出扳机——太快了，他清场一分钟不到已经削掉了前排十几位摩诃。


  她吞了口口水，在心里把奥尔加玛丽之前跟她说过的战力数值那一栏翻出来看了一眼，然后扔了。


  立香在士郎清理城墙上的摩诃时见识到了自己的这个从者有多强。城墙上的摩诃很少有能够抗住士郎一剑的。


  他的剑刺进甲缝的时候不出第二剑——剑尖抵着甲片，手腕一拧，剑气从对方的侧肋贯穿到对侧肩部的盔沿，金血还没喷到城砖上，他已经搂着她荡向下一个目标。


  更别提那些从各种方向飞来的剑雨。言峰士郎的投影魔术不只是射，是连射、是拐弯、是错时引爆。'

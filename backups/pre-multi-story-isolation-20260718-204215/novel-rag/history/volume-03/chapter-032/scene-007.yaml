content: '雷刺、风刃、土壁、冰锥、木缚、铁锁，同时朝村正和士郎砸去。


  村正的瞳孔里映出了那片如暴雨般倾落的六色术式的轮廓。她将打刀横在腰前，抬眼扫了一圈，压低嗓音。


  “藏了多少术式？”


  “村正！”


  士郎在喊她。她转过脸，和士郎对上了视线。二人相同颜色的琥珀色眸子里倒映着对方脸上的表情：


  他们同时知道接下来要做什么了。


  村正向前踏了半步。


  “那我就帮你一码！”


  千子村正开口的同时她全身燃烧着的黑炎从中线开始朝两边分开，给青色的火焰让出位置。青色的火焰从她的心口正中央往外喷涌，在黑炎的夹拥下朝空中冲去，在半空中铺开成了一整片青色的流动屏障。


  “清净之禊祓——”


  青色的火焰流起。不是朝月读命的方向攻去，而是朝着空中被月读命的月光所扭曲的秩序而去。


  月光曾经在村正和士郎刚开战时把剑雨绞成粉末的那个扭曲场，此刻正在被青色的火焰从外缘开始一层层覆盖。


  青色的火焰如同水一样贴着月光的边沿流动，每流过一寸就在原地留下一条重新被理顺了因果的空间通道。


  “修复——”


  月光被逼得开始收束起来。月读命的太刀上那些正在发动的术式也在同时开始减弱——术式发动的基盘是月光扭曲现实的权能，青炎在修复扭曲的同时就等于一个个地把术式的底座抽走。


  清净的青炎得势不饶人，朝着收束的月光紧追不放。


  士郎在村正青炎前压的掩护下追出一剑。剑锋切开了一道还未被青炎完全覆盖的月光裂隙，然后他从腰后摸出了一个东西——不是剑，不是黑键，是一枚晶莹剔透的戒指。


  戒指在空中翻转时内部的无数刻纹折射着周围五颜六色的光，像个透明的小月亮。


  “原理血戒！”


  月读命在术式被青炎压制的同时已经意识到了不对。她将手一挥，六柄浮在空中的太刀同时朝戒指的方向射出法术。几十道五颜六色的术式拖着各自不同的尾光冲向戒指，在空中拉出了六条平行的彩色轨迹。


  无数道法术轰去。但村正的黑炎从侧面涌上来，在她和术式之间展开了一道足以遮住半边天的黑炎幕墙，火墙挡住了绝大部分的术式。


  剩余的几道术式虽然打在戒指上——但戒指没有停，它已经完成了自己的发动。


  天空忽然暗了下来。


  整个主殿穹顶在原理血戒的术式范围笼罩下像是被人猛地泼了一层墨，原本被月光照得发白的天幕在一瞬间暗沉下去，然后从暗沉的天空中炸开七道光束。


  “月虹！”


  七道光束朝着月读命轰去。月读命咬着牙，嘴中的光炮还在勉强维持着和士郎刚才那一道巨剑残余光束的对峙。


  她试图用光炮多余的出力去挡其中几道，但月虹的光束在接触到光炮之后直接穿进去了。光束穿透光炮的表面，像热水融进冰层一样从光炮的内侧朝外推进。


  月读命的心中意识到了不对。


  这个魔术不只是为了破坏。刚才士郎所释放的所有攻击——黑键、剑雨、巨剑、光炮——全都是破坏性的攻势。


  而现在这次不一样，月虹射在她身上的位置不是物理切口，是存在层面上的侵蚀。


  光束所照之处她的衣袍边缘开始朝内瓦解，瓦解出来的不是血肉，不是魔力，也不是武器的残片，而是大片大片正在朝上升腾的细碎银光。


  “这么高等级的魔术？”月读命咬着牙，牙缝里漏出来的声音被口中残余的光炮淹没了一半。


  他口中的光炮勉强挡住了一部分月虹的光束，但挡得住的只是有形的光柱，挡不住的是月虹对存在基盘本身的溶解。


  “我师父做的魔术，感觉如何？”士郎出言嘲讽道。


  原理血戒把月读命的术式压制彻底展开后，现场的六柄太刀同时从刀尖开始破碎，碎成月光本身——它们本来就是月读命用窃取的权能捏造出来的伪刀，权能被溶解之后现出了原形。


  月读命的身子在月虹的笼罩中轰动了起来。


  她衣袍被从内部溢出的白光撕成碎条，然后连碎条都在脱离她身体的过程中化成了一层极淡的乳白色雾气。


  她原本站立的那片石板被月虹照出了一个端正的圆形光斑，光斑正中的人影在越来越淡的白雾里一点点地被抹除——先是轮廓的淡化，然后是内部密度的降低，然后只剩下一个模糊的人形空洞，最后连空洞都被月光蒸发了。


  月读命消失了，主殿前庭的月光在她消失之后骤然暗了一瞬——不，是陡然减半。


  一直在持续笼罩整个前庭的月光压力忽然松掉了，村正和士郎的影子在石板地面上猛地深了一层。


  “什？”


  村正愣住了。她看着地上那个正在缓缓褪去的圆形虹色光斑，看着那些还没彻底散尽的白色雾气，嘴唇动了一下，剩下的话没有出口。她的打刀还攥在手里，刀刃上的青火还在跳动，但她刚才准备好接下来的三十六招全都没必要了。


  她的嘴巴仍张着没有合上。'

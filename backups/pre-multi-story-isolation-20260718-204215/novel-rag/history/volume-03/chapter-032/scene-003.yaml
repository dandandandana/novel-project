content: '“正面看来是不需要了。”她把枪口斜压了一下，将最后一道城墙垛壁上的摩诃连着石砖一同打碎，“速度解决这里，Ruler。”


  “收到。”


  两人以立香能跟得上的视觉节奏迅速解决了城墙上的摩诃。最后一排蹲在城墙阴影里的僧人还没祭起武器，已经被士郎从死角投进来的黑键钉穿了六位。


  随后法相从城墙尾端的高台上翻身而下——三名持着金色法器的老者，权杖和戒刀上的经文在夜风中亮到晃眼。


  面对法相的阻拦，言峰士郎的出手开始变样了。他没有再用刚才那种干净利落的剑术，而是将剑的特性叠加在了同一柄剑上。第一剑砍中了为首法相的臂甲边缘——金漆甲片上先是被烧灼出焦黑的凹痕，然后是紫色的麻痹电流顺着臂甲往肩膀蔓延，法相那只手在麻痹中松开杖柄的同时，剑锋最后附上去的一层风刃把金漆甲片从他手臂上整片整片地掀起来，翘开的金片在风压里碎成一小掬一小掬翻飞的白烟。


  法相咬紧牙关朝后退了半步，用剩下一只手重新把杖换过来。他抬头看见那个搂着橘发少女的红发男人只是随手甩了甩剑上的残光，连眼神都没在他身上多留。


  立香在士郎怀里压低声音骂了一句：这家伙在伦敦压根没出全力。这还是士郎花了一只手来带着立香的战力。


  在一路推进中，他的左臂从头到尾没松过，但城墙上的每一次旋转和腾挪，左臂都撑着她整个人的重量。


  剑法被逼到要换角度的时候，他用肢体去扛——摩诃砸过来的铁棍被他用肩膀顶回去，法相的权杖光炮贴着他后背擦过去时，他没有多余的身位闪，只能稍微侧了一下让光炮蹭过肩胛，留下一道焦痕。立香咬了咬牙。


  “如果不行就把我——”


  “立香，相信我。现在速度最重要。”


  “好。”


  士郎右手中的剑朝前一送，把最后那名法相的杖柄从中间劈断的同时，剑尖继续刺进他肩窝，带着叠加三色的残光把他整个人从城墙上轰了下去。


  他坠落的途中还将破碎的权杖朝天扔去，在半空中被士郎的黑键射穿，连同他摔进墙下金地时的冲击一同炸成一蓬散碎的光粉。


  直到场上结束战斗，立香和士郎将城墙上的和尚清理完了之后，二人一起看向天空的场景。天空中的景象已经超出了立香此前的任何一次感官经验：村正的黑炎火云仍在空中翻涌，须佐之男命的金色雷暴从另一个方向不住轰击着火云的边缘，两股力量在天空上咬在一起，中间被月夜见之禊祓的青白月光撕出一道缓缓扩大的裂隙。


  “那是什么。”立香看着那片天空，手心里握着安魂枪柄的潮湿感突然被感官里的惊愕压了下去。


  她一瞬间意识到这是自己几乎无法理解的事情了。


  “立香。”通讯器里奥尔加玛丽的声音从金地结界的干扰中勉强挤了进来，断了一次又聚回来，“现在做你能做的就好了。”


  “啊，所长，我明白了。”


  立香在判断出须佐之男命仍以高维状态在雷暴中活动的那一刻，就知道自己手里那东西该用了。


  她在用了降格术以及判断了情况后，直接抽出令咒发动英杰之帜，把远处的玛修的魔力循环重新推回高位。然后她转向士郎，让他马不停蹄地朝城内冲去。


  “所长！有灵基反应的信息吗。”


  “立香，两边的反应已经超过了阈值。”奥尔加玛丽的声音从通讯器里甩过来，每一个字都像从牙齿间挤出来，“很难对付的对手。”


  “士郎，走。”立香低声说道。她在士郎的怀里转过脸，兜帽被她回头的动作拉起一角，露出下面那枚亮着的十字令咒。“不许把我放在这里。”


  “立香？！”奥尔加玛丽的声音在通讯器里陡然拔高，“你在说什么，现在在城中不靠近月读命的世尊绝对是最安全的吧——那里只有村正，Ruler和村正不一定能够——”


  “所长！前线请相信我的判断。”立香开口的声音不高，但每个字都是咬实了从嗓子底部推出来的。


  “什么？”


  “立香！”达芬奇的声音也挤进了通讯频道，她那边的杂音比奥尔加玛丽更重，背景里能听见迦勒底中央监控器尖啸的报警音，“你现在是迦勒底最后的御主，那里已经完全不只是神战的规模了。立香，你要好好考虑。”


  “我考虑过了，所长。”立香把一只手从士郎的肩膀上移开，朝自己手背上的十字令咒看了一眼。


  令咒上残余的魔力在手背上微微跳动，把暗夜的冷光从纹路里折射成细若芒刺的红色：


  “我手上还有一道令咒，我需要观察情况进行决策。”


  奥尔加玛丽沉默了一会。通讯器里只剩她压得很浅的呼吸声和远处监控器的发报音。


  然后她把话咬碎了递过来：


  “你——Ruler！你跟她说！”


  士郎顿了顿。他低头看了一眼怀里的立香，又转头对着通讯器开口。“让她来吧，所长，她手上还有令咒可以支援。”'

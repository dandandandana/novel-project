content: '方台在城市半空中穿行的速度快到立香的脑子根本跟不上自己的眼睛。她不是没坐过高速载具，但那是另一种维度的快，不是这种被纯物理加速按在靠背上、骨头被惯性轻轻压进弹性台面的实感。大楼的外棱线被速度抽成了一条条灰白色的粗笔触，一条刚在她眼角膜上划过，下一栋楼的棱边又已经追着前一条的尾巴窜了过去，连成一片没有断点的流线。她伸手抓住方台边缘那圈微微凸起的护边，指腹摁在合成材料的哑光面上。


  “怎么做到的——这种速度完全不讲道理。”她从牙缝里挤出来这几个字时方台正拐过一个弯道，整台底板朝左倾了半寸之后自己修正回平，那层弹力材料在她后背肩窝处又朝上托了一下。


  “那么……”她把头从靠背上抬起来，看向悬浮在台面左侧的蓝色圆球，“这里发生了什么？你刚才说的献身——具体是.”


  方台在立香问完这句话时渐渐慢了下来。整个底座从前往后一点点把速度从底板上抽掉了，像一只手从她后腰上把那股推力轻轻地拿开。蓝色圆球飞到她正前方，面板上的那排菱形金属片微微错开又合拢，内置喇叭先是一阵噼啪细响，然后那个从片假名拼出来的合成女声一字一顿地往外蹦。


  “人类为了追求自己的未来，选择了献身。”


  立香听到这个词时没有立刻追问，她让这两个字在自己舌根底下搁了两拍。士郎从方台另一侧坐了起来，弹性台面在他腰侧推了一把。


  “你要带我们去哪里？”他开口时嗓子还有点躺久了的松散，但眼睛已经不松了——他的琥珀色瞳孔盯着蓝球面板上那些正在重新排列成一张嘴的菱形片。


  “体验一下来自这个文明的遗产。”蓝球说完这句话后把它面板上那个还没拼完的嘴型收了回去，换成了整张面板上的一个淡淡的蓝色光晕。


  “未来文明吗——敢取这个名字……”立香的舌头在“这个名字”四个字上打了个转，她把脑袋朝后靠回台面上，后脑勺陷进那片微弹的垫子。台垫在她耳廓后侧拱出了一片贴合的曲面。“那确实要好好期待一下了。”


  蓝球没有接话。它的面板还是那层淡蓝光晕，菱形片不翻也不动。立香等了两拍，又等了两拍——那个沉默里没有计算延迟的电流声，只有方台底座在平稳运行中传出极微弱的低鸣。立香从侧躺的姿势里翻过身来，手肘撑在台面上把自己上半身顶起来。


  “伊耶那美说这里有埋藏着一切的真相——”他把后面的问句推出去时眉毛朝下压了半道弧线。“是什么？”


  “真相——”蓝球的喇叭先在“真”字上停了一瞬，把那半个音节拖得比之前任何一个字都长。“你指的是什么？”


  “这个世界……到底发生了什么？”立香问她时上半身从台面上坐直了，她的白色风衣领子在后颈上蹭了一下，布料擦过皮肤发出一声极轻极细的干响。


  “能先告诉我伊耶娜美给你们说了什么吗？”蓝球反问时面板上那些菱形片又动了一下，在面板中心露出一条细细的暗缝。


  立香把伊耶那美告诉他们的这个世界的现状告诉了它，她把月读命金地的废墟、天照命金地的佛殿残骸、无星的夜空、被弥勒窃取的神明之名和那场把她摁在废墟地上的试炼全部用尽量平的语调转述了一遍。


  她说到伊耶那美说“一切的真相在星之内海”这句时手指在膝盖上停了。


  蓝球沉默了一会。它的菱形片在面板上从左到右叠了一整圈，再一圈，然后又从头把刚才那两圈的排列顺序反向转了一遍——它在思考。


  “大体都是正确的。”蓝球开口时面板上那条暗缝合上了。“但是如你们所见，上面所在的文明并不是唯一的文明。”


  “这里是什么时间点？”立香一口气没停接着问。她的手指从膝盖上拿下来，搁在方台边缘的护边上。


  蓝球在空中停了一拍。它似乎在计算着什么——球壳内层有一层极微弱的蓝白冷光从菱形片的拼缝里漏出来，忽明忽暗地闪了几下。


  然后它说:“如果按照游星尖兵来到地球的时间节点算的话，大概——有好几万年了。”


  “几万年……”立香把这个数字从自己牙齿之间过了一遍，她从方台边缘拿开的手指在半空中悬了一下，然后那根指头重新落在自己的膝盖上没有再敲，只是搁在上面。


  “过了几万年才成为了这样，那么期间是……发生了很多的事情。这里是上一代文明的遗留——”


  她的脑子在说话的同时已经自己飞了出去。伊耶那美在月读命金地废墟上跟她说的那些话，那些神明死去、僧侣窃命、弥勒吃掉一座又一座金地的片段，所有那些信息都只停在了神代和术者时代的交接线上。伊耶那美没有提过更前面的事，没有提过人类自己建起来的文明，更没有提过这个建在星之内海深处科技城市的任何蛛丝马迹。'

content: '整个场地空无一物，连她刚才看过的那种弧形收束的灰白色墙壁都不见了。眼前是一种她不知道该叫做地面还是叫做灰板的巨大空面，近处不是黑色的，远眺也不是黑色，而是一种没有颜色可指称的灰，那种灰色连阴影都不愿意落下。


  脚下那层灰板在自己若即若离地轻晃着——不是晃动，是空间的各个方向同时朝她身体挤压一股极微弱的低频涨缩。


  “有古怪——这里的魔力浓度……”士郎把右手从袖子里翻出来拦在了立香身前。他手掌张开的五指里无名指比平时伸得更直——越是紧急时他越是把掌心摊平而不是攥紧。魔力浓度高到他的袖口在无风中自己飘了一下边角。


  他的话没说完。一道悦耳的女声响起了。


  那个声音从空场的每一个方向同时传过来——不是从前方也不是从头顶，是从立香自己的领口、从玛修的盾牌铁面、从村正扛着的刀鞘鞘口、从士郎刚才还摊开的五指缝里一起涌过来。


  声音悦耳动听，声带的压缩点刚好卡在柔软但不断气的位置上。然后眼前的一切变了。


  整个灰空间从中心朝外一个圆接一个圆地换掉了自己。先是地板上一排排光点浮现出来把地面收成了一张圆桌的底座，然后穹顶上有什么东西亮了，一圈淡蓝色的光环从他们头顶正上方朝着外围一圈一圈荡开。最后所有光环在桌面高度聚拢，聚出一个圆桌，桌面是透明的，蓝光在透明层的夹心里从上往下慢慢淌。


  “欢迎——外来者。”


  眼前出现了一颗浅蓝色的光点。光点从圆桌的正中朝上飘了大半个人的高度，然后停住。接着它开始朝下堆。


  一个女人就那样凌空站在了圆桌的那一头。她不高，整个身体就由那层浅蓝色的光维系出来，但每一根线条都细到了接近呼吸的精度。


  “你好——来自迦勒底的人们。”她把“迦勒底”三个字用咬舌根的发声方式挪到了上腭最软的位置。然后她继续开口，每一个字中间都压着一个轻巧的小停顿，把那段名字推出来时像是翻开一本上了年纪的资料夹时一页一页揭过。


  “我是E. P. O. H. O. N. S. I. E. R. E. H. T——全名，Eschaton Pleroma Of Humanity — Ontological Noesis System / Interstellar Exodus-Rebirth
  Engine of Human Transcendence。”


  立香的嘴张开了。


  “什——这么长一串……”


  女声在她那张蓝光构筑的嘴唇上放出了一抹微微的弧度。不是微笑——是光把唇角的线条朝上延长了小半寸。


  “我是这里的AI主脑——终末人理圆满机关。”


  “终末——人理——圆满机关？”


  “什么意思？”


  “字面意思——我身为主脑AI的最终目的，就是让人理圆满。”。


  立香的手从腰侧挪到了自己风衣的前襟上。


  她的指腹擦过风衣的翻领边时布料的细密纹理从指纹下面滚过去。


  “我该怎么相信你？你是怎么知道我们是迦勒底的？”


  终末人理圆满机关的光唇动了动，她的表情一热按带着笑容


  “只是知道罢了。”她把“罢了”这两个字念得比正常语速轻得多，像是把一片薄纸放在桌上之后怕它被吹走又抬了一拍才松了手。


  “身为人理圆满机关——我拥有很多人理能够做到的事情，知道你们会来。”


  立香的喉咙在她说完这句话时压了一口没吐出来的气。她看着这个女人的眼睛，那层蓝光核没有任何焦距上的闪躲。


  “……你想说什么？”


  “我知道你们为何而来。”终末人理圆满机关的整条右手臂从肩膀开始朝外画了一个圈——那个动作不是指人，是完全无意义的纯肢体表情，是用来把一个过渡句从空气里拨开。


  “你们想要回收圣杯——圣杯就在我这里。”


  她把右手收了回去。光构造的手指合拢时指间的光粒子挤了一下又弹开。


  “圣杯在被弥勒运用之后，经过很多事情很多年之后，流落到人类手中。现在，只有我知道它在哪里。”


  “外来者——”她把头朝立香这边偏过来。不是低头，是把整个脸面的光投影朝她正前方平移了不到半寸。


  “这是你最想要的吧。”


  立香看着眼前由蓝光织成的女人。她的下巴朝下点了一下。那一下点头的分量不多不少，刚好把对方的称呼“外来者”和圣杯两个字一起收进那下动作里。


  “如果你能做到斩杀弥勒，然后将金地里的所有人带回这里——我就将圣杯给予你们。”女人说出这个交易的条件时她的合成音里没有任何讨价还价的副音，她只是在陈述一个逻辑完整的提议。


  “斩杀弥勒。”立香把这四个字从嘴唇上逐字拿掉，然后补了一句:“你为什么认为我们迦勒底能做到？”'

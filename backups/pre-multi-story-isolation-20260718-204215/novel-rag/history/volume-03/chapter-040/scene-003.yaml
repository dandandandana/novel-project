content: '她在心里没有再算第二遍——弥勒在月读命金地已经把所有她能搬动的砝码都搬空了，这之后没有退路，只有去打。


  “为什么他们要杀了弥勒？”立香把自己的声音从喉咙底下一阶一阶往上推，“既然已经发展到这样的文明，未来文明的人们过的不可能苦——为什么？我现在需要知道这个。”


  终末人理圆满装置的光造嘴唇张开了。


  然后她笑了。


  那不是一个人类的笑。她那张由蓝色光线织成的嘴朝左右两侧同时拉开了，拉开的速度比她吐出任何一段合成音时都要快。


  “这是代价啊！代价！”她的悦耳声线在这两个重叠词上第一次产生了被她自己音频引擎撕裂的连呼，“人们渴望救世主，于是出现了救世主。但是救世主不愿意人们离开这个星球。”


  “人们无数次遥望星空，人们渴望探索未知……”她把这句话拖成了慢速，拖得比她之前报全名时还要慢。“但是救世主不允许。不允许。”


  “藤丸立香，当文明发射出第一颗无人卫星的时候。”


  她的蓝色投影在说“藤丸立香”时定住了——整个人影从头顶到脚踝的光线全部短暂锁死在一个帧上。


  “弥勒疯了。”


  终末人理圆满装置这四个字的最后一个辅音还没在她声带合成器顶端完全退掉，她的投影轮廓就从头到脚一层一层崩散了。


  光粒子从她发际线的位置朝外被什么东西无形的扯散了——散了一瞬时，然后胸口的亮核把整条人形线重新一张一张拼回来。


  “于是……重启。”她把这两个词从自己还没完全复原的嘴唇光线上重新吐出来。


  “但是弥勒的矛盾之处在于……他爱着世人，于是……他不会让人们过的苦难……金地已经是他最后的形态了，他不管人们怎么样，只要人类活着。”


  “但是星空对人类的吸引超乎了弥勒的想象。人类再一次重蹈覆辙……”她的声音在这里第一次出现了人声底噪。


  “就算发展到了未来文明，就算如此。人们依旧不满足，因为弥勒锁死了他们的未来。”终末人理圆满装置的音节之间开始出现程序无法抹去的空隙，“未来文明已经无路可走了。”


  “所以……杀掉弥勒是为了……”立香喃喃道，她把这句话吐出来时自己嘴唇的张开速度完全跟不上大脑已经跑到的终点。


  蓝色人影在圆桌上闪着。她的面容在半张稳定和扭曲之间来回切，光粒子从她下颌线朝外剥落又朝回吸附。她看着立香。


  “没错，人类就是为了这个理想……这个愿望……付出了所有然后死去……”


  “那就是……”


  蓝色人影的嘴唇放出了最后四个字。她把这四个字一个一个从合成声道的最底层推上来——每一个字的头尾都被她完全咬满：


  “启航星空。”


  第41章 番外


  祁荒大概从没指望着卫宫白还能回来。


  纳鲁巴列克一把朗基努斯捅进自己喉咙之后整个葬埋机关就塌了。不是制度塌了——制度还在纸面上继续喘气。


  塌的是人，塌到连把七席的名单凑满都凑不齐的那种。那个原初精灵自打ORT的战斗打完就一头扎进葬埋机关的地下武器研究库，从早到晚研究各种新式兵器，圣堂教会高层的政治会议她连一次都没出席过。


  祁荒有时经过那条通往地下室的灰廊听见底下传来金属被切开的声音，没有去看。她只在走廊口站一会儿，然后转身走回去接着签那些永远签不完的政治文件。


  自己带起来的人在面对ORT的战斗中没了。现实里已经没有高阶死徒能再威胁这个世界，真正的麻烦反倒变成了圣堂教会高层里那些笑脸底下盘根错节的政治立场。


  她把最后那一摞文件整理完毕时指尖在纸页边停了半拍，然后她把第七席的封印解放了。


  此时葬埋机关已经没有可用之人。


  纳鲁巴列克的朗基努斯对整个世界解放之后世界的立场被彻底改写，仿佛这个组织连同曾经被它狩猎的异端一起从大地的契约里被抹掉了。


  真的没人需要她了。


  圣堂教会最后一次对葬埋机关施压的时候祁荒选择了退出。


  名存实亡的组织只剩原初精灵痴迷于研究甚至忘了返回星之内海。祁荒拿这个名叫神琦灰的女人毫无办法，也没有半点想去劝的意思。


  接下来的日子里她只是看着廊下那个通往地下室的方向偶尔在深夜还亮着灯。


  圣堂教会的人过一阵子再来找她确认什么的时候，已经找不着祁荒了。


  卫宫白从另一个世界回来用了她好大的功夫。她想破头都想不到这个世界的星之内海最深处居然藏着一个跨世界跳跃的东西，而她之前踩进去的那个世界线里的星之内海压根就不存在——那是一片虚空，什么都没有。


  还好她最不缺的就是时间。


  在她把第二法的底层公式从头推翻反复推导了不知多少轮之后，终于找到了回家的路。'

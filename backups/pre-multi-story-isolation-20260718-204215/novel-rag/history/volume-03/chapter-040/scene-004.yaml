content: '这段旅程一波三折到了极点。先是跳进一个远古时代，满世界全是恐龙人，她顺手砍完了那个老熟脸ORT之后钻进星之内海一看——空的。


  那里根本不存在任何世界跳跃的途径。


  她认了。


  她接着用第二法一次又一次地跳。好在运气还行，几千次跳跃之后她终于落回了这片她认识的土地上。空气里的魔力配比钻进她鼻腔时她的肺部收缩了一下。


  对了，是这个味道。


  “终于……回来了。”


  卫宫白说不清楚为什么要回来，这个世界明明让她伤透了心。她对盖亚和阿尔赖识尽心尽力，从来没什么愧疚可欠。但或许就是欠不欠都无关紧要了吧，她在心里没捋明白——反正回来了。


  “没准这就是家吧。”


  “几年不见，你怎么变成尼姑了？”


  卫宫白找到祁荒的时候是在东欧一座荒无人烟的寺庙里，祁荒正在当住持。


  这个城太偏了，所有人加起来脸都不到四位数。祁荒坐在正好遮住门外那片灰白枯枝的阴影里，手指间串着一串念珠。


  “这里会有人来吗？”


  祁荒看着卫宫白，嘴角朝上弯了弯，“心诚则灵。这位施主。”


  卫宫白把脑袋往左偏了半寸。她的红发在寺庙昏暗光线里轮廓更像士郎的脸但从眉弓往下全部柔了不止两度。


  “只剩你一个了？那个精灵呢？”


  “也通过星之内海离开这里了。”


  祁荒把这话搁在香炉正上方未散的檀烟中间，念珠在她指腹上停了。


  卫宫白盯着她。那个精灵脑子里到底装着什么她不理解——天才的脑子她从来都理解不了。


  但她理解另一件事：这个世界的旧识里头，大概就剩祁荒了。


  “算了，介意我住下来吗？”


  “这位施主，小庙恐怕容不下你这尊大佛。”


  “得了吧，你供的是——”卫宫白往佛堂里那尊像扫了一眼。铜面已经冷得反出一层淡白色：“正法明如来？”


  “是观世音菩萨。”


  祁荒把这句推回来的时候声线压得没任何起伏。


  “为什么突然信佛了，你这个修女。”


  “因为主没办法再开导我了。”祁荒把念珠在拇指上停了，“忽然之间觉得世上所有事都没意思了。所以我就来这儿了。”


  “有意思。你这种人啊，离人群越远越好。”


  “你这话是什么意思？你不是人就可以随便品评我了吗？”


  卫宫白把脑袋又偏了一点。“嗯？品评是什么新出来的话术？”


  祁荒的笑终于从嘴角变成了完整的上提：“现在已经二零二四年了，你离开这里整整十年卫宫白。话说回来——你找到你哥哥了吗？”她把攻击性推到这句话的尾辅音上，没留任何迂回空间：“我猜你没找到，不然你也不用回来。”


  “果然是魔性菩萨。”


  卫宫白白了她一眼。


  “这位施主，我哪里是菩萨——”


  “你现在不是，但你可以是。”卫宫白没说半句多余的话。“正法明如来放着如来身不要成了观音菩萨。你凭什么做不到？”


  “笑话。”祁荒的笑变成了一声短促的哼，“我倒是完全可能成为魔性菩萨，问题意义在哪儿？”


  她把手掌从念珠上挪开一点：“我现在想要的很简单。有人需要我，就够了。”


  “嗯。”


  “所以？”


  “嗯。”


  “……嗯？”


  卫宫白停了一拍：“还好我没晚来几天。”


  “你果然非人类，脑子跳得太快了。”祁荒把手腕上滑下来的袖子朝上拢了拢，“你想说什么？”


  红发的女人把脸侧过去正对着祁荒。那绺从脸侧垂下来的头发庙里最后一缕阳光穿过之后落在颧骨上。


  她盯了祁荒一瞬。


  “我再晚几天过来，你就会干出点什么大事，让这个世界彻底需要你。是不是这路子？”


  祁荒的眉毛朝上抬了一下：“这什么意思？我看上去很像坏人吗？”


  “不是像不像的问题。”卫宫白缓缓开口，她的声音在这句话上每个字之间间距刚好拉到了一个念珠微滚的距离，“我只是在很多个世界里见过太多个版本的你。然后——都不是好人。”


  祁荒没出声。


  “纵欲。淫荡。放浪。完全没把人当成人看。”卫宫白把脑袋点了点，“对，这就是你。”


  菩萨院祁荒把头往左边一偏。


  “就是这条路——我在别的世界线里见过太多次了。和平年代一到，你铁定会成为魔性菩萨，或者BEAST。”卫宫白再次加重语气，声调没变高只是把每个字跟字的间距又缩了一层。


  祁荒把念珠从右手换到了左手。她的笑已经不像刚才那几轮——嘴角翘着，但眼睛里不是笑意：“那你有什么好主意？”


  “既然你肯定要为满足自己变成魔性菩萨……那你为什么不想想另外那条路？”


  “嗯？”祁荒的视线朝香炉方向飘了一瞬，然后拉回到卫宫白脸上。“有趣。”


  “我肯定做不到。”祁荒笑着把头正过来。“我确实算个天才，不算差。但神琦灰那样的都没成为菩萨，我这点斤两怎么够格？”


  “我在这里啊。”


  “你？”


  “嗯。”


  “你能做到什么？”'

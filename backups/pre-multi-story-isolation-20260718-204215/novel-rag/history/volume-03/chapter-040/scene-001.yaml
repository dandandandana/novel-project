content: '【AI不会有情绪，这是个基本前提。】立香把这句话在自己舌头底下翻了一遍又翻回来，然后她把整件事从刚才那一串“欢迎外来者”到“我有圣杯”的对话从自己颅内全部重播了一次。


  这个AI的决策方式很精明——太精明了，每一次她开口，都掐在立香正准备自己思考下一拍的时候。那种感觉不像是巧合，更像是她早就排练过的精确切拍。


  她不断地把信息一茬一茬抛过来，目的就一个——要让立香自己没时间抽身。


  立香咬了一下自己的下唇内侧，松开之后嘴唇抿成了一条平线。


  【不对。她不是要干扰我这么简单——她有自己的目的，而且这个目的和她刚才用悦耳女声报出来的那一长串系统全名一样被包得干干净净。】


  “立香，应该够了吧。”


  士郎的声音忽然从她左手边侧方传过来。他的语调不重，没有带上任何命令性的助词，每个字都是从他平时用来叫她的那个音高上平平地递过来的。


  立香的脑子在听到这句话的那一刻同时转出了两件事。第一件是——士郎在说够了。他说够了不是因为他觉得谈不到信息，而是因为他算过一遍之后判定迦勒底从这个点上抽身走能全身携带着目前已知的所有情报退出去。


  第二件是——她不认识这个判断，不是不能理解，是她清楚记得另一个女人用另外一种嗓音在她耳边说过一句几乎内容完全一致的评价：他在大事上的决策是会出问题的。


  【但是这个判断不对。】


  村正需要伊耶那岐，村庄的残骸还没被找到，如果现在被终末人理圆满装置牵着鼻子走即使半途停下也会把后面的安排全盘打乱。


  “士郎，相信我的判断。”立香把脸朝他的方向偏了偏，她没有说第二句解释。她沉声说出这几个字时胸口的呼吸吞吐没有变快，但声音的底比平时厚了一层：“这时候停下是错的。”


  士郎愣了愣，他琥珀色的瞳孔在眼眶里朝立香脸上定了一瞬，然后他把嘴唇朝左侧拉了拉，他往后退出了一步。


  立香把下巴抬起来，她的目光从士郎退后的那一步底下穿过去直直地扎在终末人理圆满装置那张蓝光构筑的脸上。


  “只是这种筹码不够让我们和你合作，终末人理圆满装置。”


  蓝色女性已经把她刚才说到“向往星空之愿”时散落掉的光粒子重新用亮核拉回了原位，整个人影站着。她听到立香这句话之后把自己蓝光织成的那颗头朝左偏了一点点：“还不够吗？你们想要回收圣杯，你们现在的信息是最大的问题吧——我可以给你们确切的信息，这已经是最大的筹码了吧。”


  她的合成声音在这句反问的“已经”两个字上加了半格音高。


  “你身为人理圆满装置，需要我的降格术来对付弥勒。”立香把这句话从牙缝里推出去时一个字跟一个字之间没有停顿，她把话锋咬在弥勒的尾辅音上斩钉截铁地收住。“你身为AI，无法对我做出有生命威胁的事情，是也不是？”


  蓝光女人没有开口。她那层由磷光织出的眼睛是两颗比其他所有光点都亮整整一颗色阶的光核。此刻那两颗亮核对着立香一动不动。


  立香在她沉默的那几拍里把下一拳已经蓄好了，她不急着打出去。


  “你抛出来的筹码不具有分量。”她把语调压回平的，“村正在月读命的时候一开始并不知道她会觉醒清净之禊祓——她还是成功了，到了伊耶那岐金地我相信她也能做到。”


  “你需要摆出更多的筹码才能够说服我答应你的条件。”


  终末人理圆满装置的光造嘴唇朝上弯了弯，她开口时那个悦耳女声里夹进去半拍她自己可能都没打算压掉的杂音：


  “有趣，你想要什么？”


  “你能给我什么？”立香看着终末人理圆满装置的眼睛，把话头从自己的喉咙里直接顶出去。


  她脑子在这一瞬间已经把这句话摁出来了——没有经过修饰，是她压在舌下已经等了两拍的真实反应：“我对你们一无所知，你问我是不是太不礼貌了。”


  那句“不礼貌”被她用纯粹的陈述语调平着吐出来，没有商量的柔软，也没有刻薄者的上扬尾音——她只是陈述了一个逻辑上成立的事实。


  “前辈？”


  玛修瞪大了眼睛。她在立香侧后方站着，盾牌铁脚本来松松地搁在地砖上，听到这话时盾缘的金属边角在她手里被捏紧了下。她看见了，今天她真正看到了一个完整的不再需要靠士郎拉回来的立香。


  终末人理圆满装置看着立香，她的好听的声线忽然把音色调柔了一层：


  “你真的只有十八岁吗？”


  “你……”立香的嘴唇张开了。她没想到对方会从谈判桌上跳出来问这个。“这和我多少岁有什么关系？”


  “如果你在金地的话应该听过观世音菩萨将西海整个包裹到小世界的话。”终末人理圆满装置把这句话用她那个悦耳的声线完整地推出来时速度比之前任何一句都慢：“像你这样年纪的人……有如此英雄气的很少见了。”'

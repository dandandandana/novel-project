content: '藤丸立香站在城主府大门前深吸了一口气。这扇门比她想象中要窄，木框被几十年甚至更久的风雨洗得露出原木的纹理，纹理里嵌着几道极细的裂痕从门楣一直延伸到门槛上方一掌宽的位置。


  门环是铁制的，敲上去声音会很沉。她没有敲。村正站在她旁边太刀抱在臂弯里，立香把手从身侧提起来，指尖碰上铁门环的前一瞬：


  “立香，没事。”言峰士郎的声音从她右耳廓外飘过来，压得只有她能听到音量，她几乎能感到他说话时呼出的气擦过她耳后那几根碎发，“我和玛修都在你身边。”


  立香把手指从门环上收回来扣在自己腰带的结上，嘟囔了一句，声音闷闷地挤在鼻腔和门牙之间：


  “因为知道这个所以我才紧张的啊。”她的肩膀往上提了一寸又落回去，


  城主府内并不算宽敞。廊道两侧的木柱被烛台底座磨出深色凹痕，廊道的长度大概容得下七八个人并排走，但此刻廊道尽头站着的那个身影让整个空间缩小了一圈。


  那人穿着宽大的黑色斗篷，他站在那里廊道的空气被抽走了一层温度。他的脸比普通人长出大约两指宽，面色极白，不是人类皮肤应该有的白，是被抽干了血色之后剩在脸上的冷白，那种白让你盯着看久了会感到眼睛被一层薄霜粘住。


  头上有几枚勾玉一样的东西挂在头发上，勾玉在烛光下泛出极淡的微光。那人目视着几人从廊道另一头走过来。他的头没有偏，脖子没有转，只有眼珠在眼眶里极缓慢地移动，锁定走在村正身后的每一个人。


  村正往前迈的脚在离他五步远时慢了半步，她抿了抿嘴，抿嘴时两片嘴唇之间挤出一条极细的线，那条线从嘴角延伸到人中停住——她在心虚。


  立香把这一幕收进眼角余光。能让千子村正心虚的人不多，而眼前这个斗篷男人让她脚跟微微往后退了半寸。


  “小姐，你回来了？”似男非男似女非女的声音从那人喉咙里飘出来。


  不像嘴巴在说话——是声音直接从胸腔里往上涌，涌到空气中时已经散掉了声带的震动只剩下平坦的音节。


  村正挠了挠后脑勺，手指在发丝间抓了两下，抓完之后把手放回太刀刀柄上：


  “啊啊，天沼先生，回来了，还带了几个朋友。”


  “朋友？”天沼开口，他把这两个字从嘴里吐出来时脸上的皮肤纹丝不动，然后他朝着四人鞠了一躬：“小姐能交到朋友我很开心。”他的身体从鞠躬的角度直起来，然后他抬起眼皮看向立香他们。


  他睁开眼睛的瞬间——银白瞳孔嵌在墨色眼白中央，睁眼时那道目光像是从很深的地方在看着你，不是在打量你这个人，而是在读你身体里每一条线的来龙去脉。


  立香后脖颈往上一凉。


  “那么来自异界的各位是？”


  立香愣了愣。她的嘴张开了一瞬又合上，脑子里把所有可能被看穿的要素快速扫了一遍——灵子转移的残余魔力波动，迦勒底礼装的魔术刻印残留，抑或是面前这位近侍本身就不是需要理由的存在。


  她轻轻咳嗽了两下：“我们来自人理修复机构迦勒底，目的是修复这个特异点。”


  “这样啊，我明白了。”天沼开口，他脸上依旧没有表情。他把身体往旁边侧了半寸，让出廊道尽头的入口。


  “请进吧，主人大概在等你们。”村正快步往里走，太刀刀柄在她臂弯里轻叩。玛修跟在她身后，盾底边沿从木地板缝隙上方擦过发出极细的呲声。


  祁荒走在最末尾，她的道袍下摆飘过廊道，当她准备迈过天沼让出来的入口时——天沼轻轻伸出手拦住了她的去路。


  立香扭过头。她没有走过去，没有开口，没有伸手去拉开那只拦在祁荒面前的手臂。她就这样站着，橘色眸子从祁荒脸上扫到天沼脸上，又扫回祁荒脸上。


  “干什么呢，这位先生？”祁荒歪着头，笑容没有从嘴角掉落。她歪头时几缕头发从耳后滑出来搭在她的道袍前襟上。“我也是迦勒底的一行之一哦——”


  “你不可以。”天沼的声音还是平的，他的手掌没有收回去，停在祁荒胸口前一掌宽的位置。


  他的眼睛看着祁荒的脸，但瞳孔没有在她五官上聚焦：“你和他们不是一路人。”


  “嗯？”祁荒又歪了歪头，歪头时她嘴角的笑意往上走了，“看出来的吗？”


  她把这句话说得像在问今天的晚饭是不是有鱼。然后她把双手合在袖子里，袖管底下的手指在看不见的地方交叉：“那好吧——给我安排一间上好的客房怎么样？”


  “可，请跟我来。”天沼把手收回去，转身领着祁荒往西方偏房走去。祁荒跟着他走了几步，然后回过头对正在看她的村正眨了眨左眼。


  村正没回她，摆了摆手。“走了。”


  玛修挨近立香低声开口，声音从喉咙深处爬出来时还带着刚咽下去的那口担忧。“前辈，你不担心？”立香收回目光。'

content: '她的眼睑垂了两拍然后抬起来：“带着祁荒反而接下来不好处理吧，主人的意愿是这样，就算是有意分割——”她把手从腰间拿起来在半空中停了一瞬，“大不了到时候再去救她。”


  “这样吗，我相信前辈。”玛修把盾换了个手，盾沿在木地板上轻轻碰了一下。


  村正叹了口气，她的叹气声在廊道里被墙壁折回来叠在自己刚说完的尾音上：


  “都说了别担心了，唉，信任没有吗？”


  “警惕。”立香把这两个字用舌尖顶着门牙弹出去。


  “好好好。”


  村正推开正厅的门。门轴在木臼里转了小半圈，发出极短促的嘎吱声。正厅不算大，中间摆着一张矮书案，书案上摊开的折子把桌面盖得只剩下边角露出木纹。


  几支蜡烛立在书案两侧的烛台上，烛火被开门带来的气流扯得往东晃了两拍才稳回去。主位上坐着一个黑发女人。


  女人正埋着头批折子，笔尖在纸面上往下压出墨痕，她的肩膀微微弯着，左手搁在桌面下平摊着，右手毛笔在纸面上走一横、一竖、一撇——然后她抬眸看向进来的人。


  立香被这一眼钉在原地。


  女人美得不像是活人应该拥有的样子。阴阳双眸——左眼赤色右眼碧色，赤色那只在烛光下反射出极淡的暖光，碧色那只却冷到让人想起深海底层永远看不到阳光的水压。


  她的面部线条被烛火从左边勾勒成柔和的轮廓，从右边削成锋利的线条，两种不同的光影在同一个人脸上彼此咬合。


  她疲惫，不是困，是处理政务把耐心一点点磨薄之后剩下的倦怠，但那种倦怠和她眉骨底下的冷意揉在一起，让她整个人像一把搁在刀架上太久没出鞘的太刀——锋刃还很利，只是刃面上蒙着层薄锈。


  然后她把折子往村正脸上一甩。折子飞出去的速度不算快，纸面在空气中翻展开来，折子的一角划破烛火上方的热气——咻的一声极轻极细。村正眼疾手快往左侧一避，她的后脚跟在地板上旋了半个拳头的角度，身体顺着刀匠特有的侧身步法把重心移到右脚上。


  折子从她肩侧擦过去。


  然后折子在空气中划了一道不规则的线，绕过村正的侧身，角度折返，啪——折子角不偏不倚地扣在村正的额头上方。声音不大，脆得像竹筒被用力合上。


  “你偷跑出去了？”


  【偷跑的？】


  藤丸立香眉头一挑，她的橘色眸子从女人的脸挪到村正脸上——刚才在住宅区被全村人热情簇拥的村正，在这位世尊面前额头正被一本折子角咬着。


  “还偷走了妙法村正。”女人又拿起一本折子翻开。她的手指在纸面上找到上次批阅时留下的墨迹，笔尖重新蘸了墨。


  【偷的？】


  立香的挑眉从左眉传给了右眉，她原本以为自己听到的世尊是“女人”这个回答已经够震惊了，现在又加了一条——村正那把从不离身的太刀是从世尊这里偷出去的。


  她看了一眼士郎，士郎微微摇头，那个摇头的意思是“别插嘴，这是她们的事”。


  “什么偷的？那本来就是我的！我亲手锻造的！”村正看向眼前的女人。她的声音往上扬了一整度，太刀刀柄被她攥在掌心里攥得木料发出细微的嘎吱。她的脸颊有血色往颧骨上涌——不是羞耻，是被戳穿之后憋在喉咙里的那股气在往上顶。


  “那是你送给我的——”女人的手没停，笔尖继续在纸面上往下走，墨迹从笔画从横变勾时多用了半拍。


  她抬眼看向村正，抬眸时碧色那只眼睛里的冷意微微收敛了半寸，赤色那只却多了一层极薄的暖光。


  “你说是一千岁的生日礼物。”


  她把最后这句话说得很平淡，每一个字都踩在一样的高度上。然后她低下头继续批折子。


  “对吧？”


  村正沉默了，沉默不是她把话吞回去——是她把所有想说的字都在舌尖上嚼了一遍，然后从中挑出了只能捡出来的那几颗。


  她的嘴唇张开，合上，又张开：“那也是我的。”声音比刚才低了整整一层。


  “是我的妙法村正，归属权也是我的。”伊耶那美顿了顿，握笔的手指在折子上停了半拍——那一瞬间笔尖在纸面上洇出一个比平时大一整圈的墨点。


  她盯着那个墨点看了半拍，然后把它用笔锋的一勾改成一个可有可无的修饰字。


  “总而言之就是如此，你偷偷拿了世尊的剑，然后不听长辈的话，偷跑了出去。”


  “我知道——”村正的声音从嘴巴里挤出来，挤到一半被什么东西卡住了，她的喉结在喉咙里往上顶了一下又落回去。


  “但我不能一直待在天照。”


  “所以你就去送死？”伊耶那美把笔搁在砚台上。笔杆碰在石砚边沿发出一声极轻的咔。


  “我没有去送死！”村正的喉咙里涌上来的那股力量把她的肩膀都往上推了一寸。“我活着回来了！”'

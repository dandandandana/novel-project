content: '“哦？”阿尔托莉雅低声道。“高维空间的打击吗？”她眉头一皱，黑剑举到肩高，剑身上所有感应魔纹都亮了起来，但没有锁到任何目标。“只是——为什么不直接一点？在时间层面进行处理？”


  她在那之后就想通了：


  【他做不到。】


  【大概是所有世尊都做不到。】


  “这还有什么好打的？”她顿了顿，手中的黑剑往下垂了半寸。她的呼吸在胸口顿了一次。


  “如果真是我推测的话，压根不可能有机会啊。”她用手抚摸向自己的肩甲。肩甲上的裂纹在她的掌心里朝外扩展了一小截，停在甲片边缘——里面的魔力已经被压到了极限。


  【要使那个了吗。】


  “所有人！离我远点！”阿尔托莉雅怒声喊道。


  她伸手朝肩甲按下，甲片上的碎裂纹理同时发光——暗色的光从中一束束冒出来，每一缕都拖着一道残损的魔音，听起来像是恶鬼被按在深坑里尖叫，又像是困在地下的恶魔终于找着了裂缝正要破土而出。“开启吧……”她低声喃喃着，指腹在肩甲上一寸寸蹭过碎裂的边缘。


  “开启吧！万物皆依我而存在！”


  阿尔托莉雅看见城墙上东倒西歪的僧人。摩诃和法相的尸体倒在那上面，铺得满墙金漆碎光和散失金光。


  站在一旁的红发男人用一只手搂着少女的腰，立香把另一只手高高举起，手背上的十字令咒亮得整只手臂的轮廓都消融在那片朱红色的光里。


  她双手抓着黑白双色的安魂，剑刃上沾满的金色血液正沿着刃口往下淌。她的脸上虽然沾满灰尘和疲倦，但唇角翘着，还有得手了的激动没有消散。


  “于是——”立香举起令咒，“世界里不存在我无法知晓的事物！”


  她的十字令咒旋转起来，化作了两道平行的竖线。一瞬间，整个天地颤动了起来。


  从天空的最高处朝下坠落的一整层看不见的重量，把云层、雷暴、黑炎、月光同时朝下压了半尺。空中传来不解的声音，然后乳白色的蒸汽在空中一处无人的位置喷涌而出又恢复平静。


  烟雾散去。须佐之男命站在地上。他的风暴还在，他的雷暴还在，但他脸上每一道肌肉都写着不解和震怒。“为什么——为什么？”须佐之男命怒声喊道。他的手在身侧攥住又弹开，狂暴的气流从原本应该抓得住的缝隙里朝外冲撞，打在他自己手上发出沉闷的嗡响。


  “为什么你能做到？整个世界只剩下三维了？！”


  他的话刚刚说完，天空中的金色涟漪荡漾起来。从天那艘平稳地悬在半空中、完全无人操控却自己定在须佐之男命头顶的金色小舟的甲板上，吉尔伽美什踩着船舷朝下俯视。


  她的金发被天舟自身的金色光照得透亮，手指随意地搭在船舷边缘：“蠢物不需要知道这么多。马上就要去死了的杂种，你知道多了有意义吗？”


  “前辈？！”玛修捂着被抽飞的肋侧从瓦砾里站起来，脸上的疲惫被那道金色小舟的光芒洗掉了一半。“这就是降格术……？”


  “嘛，我是不知道原理的啦。”藤丸立香朝大家摆了摆手，握着安魂的双手还没有松开。剑尖上残余的金色血液正一滴滴砸在她脚边的石板上。“毕竟和她一块研究的时间不够——但我知道我要干什么！”


  她用安魂的刀尖敲了敲肩头，朝月读命金地深处的那团光晕扬了扬下巴：“这里就交给你们了！那边的月读命，我这就带着士郎过去，村正还在单独对付月读命，就算降格了，那家伙大概还保留着实力吧。”她把一只手抽出来，手指轻轻握住自己的令咒。令咒上残留的魔力在她的指腹下跳了一下——


  玛修看见了：藤丸立香的手指还在微微发颤。“玛修！吉尔茜！”


  立香把令咒往上一亮，朱红色的光从她的手背朝外爆发，把周围所有的影子都压进了地面。


  “英杰之帜！玛修！给我解决她！”'

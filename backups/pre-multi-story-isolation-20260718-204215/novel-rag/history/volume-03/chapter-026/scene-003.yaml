content: '她开口时声音一个字一个字往外弹：“真的是菩萨啊——弥勒。”


  素衣僧人没有转身。只把搁在膝盖上的手掌翻了个面朝天。德川家光的脖子从跪姿上猛地抬起来，脸上的红润被横肉扯得歪了一寸。筑山殿的下巴纹丝不动，但在袖底把袖子慢慢攥紧了。


  实时总结


  祁荒以法术欺瞒摩诃守卫与村正潜入城内，用轻佻但精准的言语戳破村正复仇背后的执念与矛盾，两人在巷中互相追问出身并交换身世秘密。村正回忆父亲手把手带大她的一切，诉说他不明不白送死的痛苦与不甘，眼中暗红色的根源火焰燃烧，在祁荒逼问“你现在开心吗”后从悲痛中重新坚定复仇意志。祁荒拦下村正后看到素衣僧侣弥勒身上依次剥落八重身份——从奴隶到苦工、农民、渔夫、书生、官吏、将军、国王最终凝为僧侣，她神色陡然严肃，对着弥勒的背影喊出他的真名。


  祁荒把刚才弹空气的指头收进袖里，转过脸来。鼻尖与村正之间只隔着两个拳头，她嘴角扯起的弧线还没拉满就把话吐出来了——尾音在唇缝里压得又轻又短，像含着颗糖说话。“村正亲，接下来打算做什么呢~”


  素衣僧人没有回头。手掌搁在膝盖上，指尖朝上抬了半寸随后又落回去。德川家光的脖颈从跪姿里狠狠拔起来，脸上那层油润的红润从腮帮一路爬到太阳穴，横肉扯歪了他的整条下颌线。筑山殿的下巴还是没动，但袖口的布面起了涟漪——五根手指正在看不见的地方把袖角一点一点收进掌心。


  祁荒歪过头，把懒腰伸展到肩胛骨发出极轻的咔响。她收势时脸上的轻佻一片一片剥落，嘴唇拉开之后定住，不再是玩笑的弧度。“真的是菩萨啊。”她把头摆正，下巴往下收了半指节，每个字都从舌尖稳稳地弹出来。“弥勒。”'

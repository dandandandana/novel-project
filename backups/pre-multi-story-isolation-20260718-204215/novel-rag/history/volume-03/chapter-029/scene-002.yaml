content: '“筑山殿——你这个当面一套背后一套的贱货！”德川家光呸了一声，两排牙齿合拢，筑山殿整个人被拦腰咬碎，湿肉与短刀残片一起吞了下去。


  他咀嚼了几口，脸朝向村正。


  村正的剑已经把他的梵文劈成了散碎的金光。她脚下的黑炎迅速朝前重新汇聚，道路成型的那一瞬，德川家光的罗汉头颅从她的视野里直接消失了。


  她把眼瞳朝上一挑，整片黑炎在天空上铺展开来，一层又一层朝外叠去，每一层都比上一层更薄、更宽，最后在天顶凝成了一片乌黑色的火云。黑云翻搅着，火焰的边缘烧到云的尽处还在朝外扩。


  巨大的罗汉头颅在村正正上方重新聚拢。从那尊石雕般的面孔里，一口雷霆直直劈了下来。


  村正一剑斜削上去，雷霆在剑刃上炸开，电光沿着刀身朝两边消散时还残留了几道极短的白弧。她抬头之后看见了一片雷网——整片天顶都布满了从云层里同时探出来的白色电柱，密密麻麻叠着，没有给她留任何可以闪避的空隙。


  “雷？”


  “久远之前有个至高神，”德川家光的声音从罗汉嘴里滚出来，带着嚼噬筑山殿之后残留的腥黏水声，“控雷的权能在他手里玩得出神入化——可惜被大德一巴掌拍死了。”


  他的脑袋在话音中膨胀了一圈，化成一座完全不该属于这个时代的巨岩雕成的面孔，石质的眼窝深陷下去，胡须是一根根从岩面上削出来的直角线条。


  如果是藤丸立香在这里，她能够通过雅典娜给她的知识清楚的认识到这个石像是谁的脑袋——宙斯。


  村正歪过头，盯着那张石像脸。“远古时期？”


  “啊啊，你大概不懂吧~叫什么希腊神系的玩意儿——不过败者哪儿配留名字？”他嗤笑一声，“千子村正是吧，今天你就和他们一个下场！”漫天雷柱同时朝她落下，电光把整片街市的瓦砾照得一片惨白。


  村正把黑炎朝内一收。火焰不再朝外扩散，而是全部聚拢到她掌中，然后朝头顶推了出去。


  一层叠一层，薄到近乎透明的黑色火膜从她周身朝外扩张，连着地面的弧度铺成一道巨大的盾——她把体内所有魔力都用来撑这一片火。


  雷电砸在火膜上，炸开的电芒还没来得及蹿透就被黑焰吞掉了。地面每挨一发雷霆都在震动，但砖石开裂的痕迹还来不及扩散就被看不见的力道压平了——整片月读命金地早被弥勒的术式浸透了，破坏和修复都是眨眼之间。


  村正垂眼。火云下头，百姓没了笑容，脸上只剩恐惧，缩在歪斜的房架下互相推挤着逃命。她没有收掉头顶的火膜，只是把下巴压低了半寸，从牙缝里挤出几个字。


  “不止那个希腊的神吧。还有谁？”她抬起头对着雷电之后那张石像脸问。


  “都说了败者不配留名字嘛！死都死透了，谁还去记他们？”德川家光把下巴搁在云头上，俯视着村正笑起来，“不过你，倒是得记住你！不是你我今儿还吃不了筑山殿那婆娘！”雷霆重新聚拢，这次比上一波更密，电光还没劈下就在云层里把夜空烧成了紫白色。


  村正看着身下的屋檐，忽然听见自己的声音从另一个时间点回了过来——


  “如果害他人丢了性命……”


  那是她几分钟前对着祁荒说的。祁荒当时只是看着她，现在这句话像一枚被迟放了很久的回音，从她自己脑子里重新弹了出来，砸在她握剑的手上。


  德川家光看见她手指顿了一下，于是笑出了数层皱巴巴的回音。“在意那些东西的死活？哈~有什么好在意的？他们生来就是被吃的，早死晚死不都一样？”


  村正没有回答。她把黑炎拼命朝外推，火膜从头顶的弧度一口气延伸到地平线的另一侧，连织场北边的河水都被映成了黑红色。


  她低着头，眼睛看着底下的人群，脑子里将一页藏了许久的记忆翻了出来：


  天照命的太阳是温和的，天照命的太阳从来不会逼人。


  那时候她还只有男人的腰线高，裹在白色的锻造服里，被一只满是老茧的手拉着朝街巷深处走。父亲的声音从头顶落下来，不重，但每个字都带着炉膛的干热：


  “小光，你该想想你要怎么活着。”


  她记不清自己回了什么。只记得说完之后男人笑了，笑声不张扬，就像炉里烧到最合适的温度时那块铁自然发出来的闷响。


  村正睁开眼。黑红色的火焰被从瞳仁中心朝外新涌出来的琥珀色光逸推到了一旁。她看着德川家光的石像脸，嘴唇朝上弯了极浅的一点：


  “你身为法相做的恶，边任何人都多。”


  “哈哈哈哈！这是世尊交给我的责任！月读命金地就是如此！而且——”


  “报仇是私刑，私刑本来就是恶，”德川家光扯了扯嘴角，“你还以为自己占了理？”


  “不占。”村正的语气没有扬起来，她只是在说一个已经想清楚了的事情。“两恶相杀......”


  “正好落得一身干净！”'

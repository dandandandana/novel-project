content: '“我当然知道你是阿尔托莉雅。”祁荒的语调还是悠悠的。她把桌上的空杯子翻过来正着放，然后她的眼睑往上抬了半寸：“你是哪个阿尔托莉雅？”


  阿尔托莉雅的眉头明显地挑了起来，她把菜单从桌上拿起来然后重新放下去，放下去的力道让桌面上那个黑圈印被菜单角盖住了半圈：“你说什么？”


  祁荒一下子就看出阿尔托莉雅生气了。她的眉毛翘起来的角度，她把菜单砸在桌上时手腕扭过去的小幅度，她在说完“你说什么”之后没有移开目光而是把金瞳钉在祁荒脸上。


  祁荒把自己的手肘从桌面上挪起来托住下巴，用另一只手的指尖在阿尔托莉雅放在桌上的菜单一角轻轻点了点。她点的是那道豆腐料理，然后又点了秋刀鱼盐烧，然后又沿着菜单从上往下在五六个菜名旁边依次点过去。


  “就这些怎么样？”


  阿尔托莉雅低头看菜单。她看菜单的时候眉头还没完全松回去，但眼眶已经不再绷着了。祁荒点的每一样都是这家店的招牌，不是瞎点。她点秋刀鱼那道菜时还特意敲了敲菜单上面备注的小字。


  “很会吃。”阿尔托莉雅把菜单从桌上拿起来，转身往后厨走去时和服腰带上的结晃荡了一下。


  菜一道道端上来。秋天的茄子被炸成金黄色搁在竹网上，油还在皮上滋滋爆着极小极细的泡泡。秋刀鱼劈成两半烤得刚好，筷子夹上去鱼皮和鱼肉之间还连着极薄的一层油脂。豆腐在瓷碗里被盖在一层薄薄的酱汁下面，酱汁上浮着几粒白芝麻。


  祁荒夹起一块豆腐搁进嘴里用门牙轻轻咬下去——豆腐的口感是对的，嫩度也是对的，酱油和味醂的比例调得像是她在京都吃过的。


  然后豆腐咽下去的那一瞬间，她的舌根捕捉到了。一股极淡的土腥气。不是调味的问题。


  是食材本身有股说不清道不明的异味，被酱油和味醂死死压在下面，压得只剩一点尾巴。她嚼了第二口，让豆腐在舌面上多停一拍——土腥不是豆腐原料里该有的腥气，类似于植物根部一路带上来的泥息。


  “我能见见厨师吗？”


  阿尔托莉雅顿了顿，她看着祁荒的筷子搁在碗沿上，筷子头沾着一点酱油渍。她重新抬起眼皮。


  “等到客人走的差不多怎么样？”


  “好的呢。”祁荒把手从下巴上放下来重新拢回袖子里。道袍袖管在桌上轻微蹭过，带起一丝桌面被体温焐暖的布料气味。


  夕阳霎时间落下去了。


  窗外的整片天空在极快的收束时间里完成了从橙红到深灰的全过程。最后一道斜阳从暖帘顶端的缝隙里滑出去时在地板上拖了一道极窄的长方形光斑，然后那个光斑被夜幕一合就消失了。


  店里只剩下祁荒、阿尔托莉雅和那个在后厨收拾灶台的红发男人。最后几个客人走的时候把门帘拨开，门口的铃铛响了最后一下，余音在门框上颤抖了两拍之后才彻底安静下来。


  他从厨房走出来。围裙还系在腰间，腰侧的布料被油溅出了几个深色斑点。


  他手上端着一份不属于这个时代的巨无霸汉堡。汉堡的厚肉饼面上滋滋还在往外渗极薄的肉汁，那股焦化脂肪独有的气味在小店封闭的室内撞上之前炸过天妇罗的油香，两种气味在空气中各自呆在自己的高度上。


  他把盘子搁在阿尔托莉雅面前，盘子底垫着一块蓝染布的布巾，盘子落下时布巾吸掉了盘子底多余的水珠。


  阿尔托莉雅眼睛一亮。她的嘴角往上跑了，伸手把汉堡从盘子边拿起来。那双在金瞳前咬下去时，她的腮帮子鼓成一个小鼓包，嚼的时候没有说话。


  红发男人站在桌子边没坐下，他的视线从阿尔托莉雅身上挪到祁荒身上。这个女的一直坐着没走，外面的桌子都空了，她不仅不走还把道袍袖子往桌上搁得更舒服了一点。他看向阿尔托莉雅。


  “这位？”


  “想见你。”阿尔托莉雅嚼着汉堡说。


  他哼了一口气。那口气从鼻腔出来时把他的肩膀往下压了一整寸，然后他转过来看向祁荒：“你是哪位？”


  “祁荒。”她的声音悠悠地送出来，说完之后她把脑袋往手掌里歪了一点，歪头的角度让她的视线变成斜的。她托着脑袋，像是在研究一样很新的东西。“你是——哪个？”


  红发男人的眉头一下子挑了起来：这句话本身并没有问什么——哪个，什么哪个——但这个问法戳到了某种他以为只存在于他自己脑子里的东西。


  “哈？”


  祁荒看他这个反应嘴角的笑意往眼窝方向跑了半寸。那张娃娃脸上露出炸毛的表情让她觉得像是在看一只被突然亮起的提灯晃了眼的猫，但这个比喻她不会用。


  他只是生气了，她把脑袋从手掌里正回来，道袍的袖子在桌面上往自己这边轻轻拉了一下：


  “嗯？那我说清楚点？”


  “你是什么意思？”他抱臂开口道'

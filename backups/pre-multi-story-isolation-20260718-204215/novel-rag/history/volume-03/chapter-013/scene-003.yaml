content: '阿尔托莉雅咽下一口汉堡。她咽下去时喉咙动了一下，眼睛没有离开祁荒。她的金瞳在烛光下反射出极淡的暖光，她在等——等祁荒把这句话说完，等Alterego炸毛之后她再决定要不要开口。


  “还有一个另一个你吧？”祁荒勾起唇角，“一模一样的存在。不。”她把下巴从手掌上抬起来重新搁回另一只手掌上：


  “内核总归是不同的。”说完她盯着红发男人眼睛。


  他生气了。


  他的眼睛变了，琥珀色瞳孔里那层被油烟和日常罩在表面的温度，在那一瞬间从中间裂开，裂缝底下的光不是热的，是暗的。


  他没有说话，但他的眉头在说——你凭什么问这个。祁荒的嘴角还在笑，但他的脸已经不笑了。


  “阿拉。”祁荒把这个词从舌尖上弹出去时语气里那股子悠然已经压得很低很薄了，她的目光从他的眉头滑到他的下巴，又滑回他的眼睛。


  “生气了——这就是你和他的不同呢。”


  他歪了歪脑袋：“还有什么要说的吗？”他的表情已经彻底冷下来了，冷到他脸上那张娃娃脸的线条从柔和变成了另一回事。


  祁荒的笑容僵住了，不是他吓到了她，是她发现自己刚才说的那句话踩到了一个没踩在地图上的痛点。


  她原本以为他只是会生气，没想到他在生气底下的那道暗光比她预估的要深：“打算赶我走了吗？”


  “对不起对不起。”她的道歉是真诚的，但她找乐子的方式就是戳人痛处，这份真诚里本身就带着某种没救的矛盾。她知道这一点，所以在道歉后会多补一个对不起。


  他呼了一口气，然后他看着祁荒，表情还是很难看，但不再是冷掉的钢了。


  “你是谁？”


  “嗯——把我当作一个不知廉耻的尼姑就好了。”祁荒想了想，把手指从道袍袖子里伸出来搁在桌面上。她的指甲在桌面上轻轻敲了一下。


  “尼姑可不会这样说话。”他靠在桌边没坐下，但手臂已经从胸口放下来了。


  “我也没指望你信。”祁荒的声音淡下去。“虽然我说的确实是实话。”她顿了顿，把话题换了个方向。


  “这里是个什么情况？”她问得理直气壮，像问自家邻居今天菜市场什么价。


  “等等？”他的头从桌子那头往这边偏了一下，“你这么自来熟？我们刚见面你就套上情报了？”


  “那怎么了？”祁荒看着他，“你来这里，总不能是来杀迦勒底那一堆人的吧？”


  他沉默了一阵，沉默中他的呼吸从鼻腔往外走得很慢。他看了一眼阿尔托莉雅——她还在吃，汉堡已经吃了一大半，面包皮被她咬出一个整齐的弧形缺口，芥末酱沾在她的嘴角。她没看他，只盯着眼前的盘子。


  “这个特异点还真不是来杀他们的。”他终于开口了。


  “你看~不是把情报乖乖的吐出来了。”祁荒托着下巴。“不是敌人也不是朋友的关系咯？”


  “我告诉你是因为——”他嘴张到一半，话又被他自己吞回去。阿尔托莉雅吃完最后一口汉堡，把沾在手指上的面包屑掸在盘子边沿，然后给他接上话：“他现在对迦勒底没啥杀意。而且对这个特异点很不满。”她说最后几个字时语调稍微沉了一点，沉到刚好够让人读出“很不满”不是随口说说的程度。


  “喂喂，阿尔托莉雅。”他扭过头看她。


  “哦哦，这样呢。”祁荒笑了笑。她笑的时候不是脸部肌肉在发力，是眼窝下方的皮肤先微微收缩，然后嘴角再跟上。“你俩关系真好呢。”她把双手撑在桌面上，手指交叉。“我能知道你们隶属于谁吗？”


  “你不会问迦勒底的人吗？”他说道，语气里还带着刚才被她戳过的那道刺。


  “哼哼，这样呢——一点都不肯说吗？”祁荒把手从下巴上放下。然后她盯着他看，她看了一会开口：


  “你是从者——又不太像。更像是某种超高级的使魔。”


  然后她转过头看向阿尔托莉雅。阿尔托莉雅正用布巾擦自己的嘴角，擦完之后把布巾叠成一个小方块搁在盘子旁边。祁荒又看了她一眼——那双金瞳，那张比大多数不列颠人都要柔和的面部线条，她身体里那个被硬生生提由冠位又继续往上拔的灵基，那种被刻意升格过的结构在祁荒眼里像一幅被放在灯下的织锦，每一根经线都清清楚楚。


  “这位就是冠位灵基改造的灵基了——比冠位灵基还要高吗？没猜错的话应该没有吧。”她顿了顿，把脑子里所有见过的从者规格全部翻出来——人理的守护者，人理的代行者，抑制力的守门人，哪一个都不是。


  这两个人的规格是另一个维度的，比人理能派出的任何东西都要大上整整一圈。


  “啊啊，超高级别规格的从者。不是人理能够派出来的东西呢。”


  她一拍手。掌心和指尖撞在一起发出清脆的一啪。


  “你们是人理毁灭的元凶对不对？”'

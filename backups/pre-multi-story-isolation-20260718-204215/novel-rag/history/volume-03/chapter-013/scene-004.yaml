content: '阿尔托莉雅眨巴了一下眼睛，她看向Alterego，那个红发男人还在桌边站着。他的手臂重新抱回胸口，他没有看阿尔托莉雅，他在看祁荒，看她一拍手之后脸上那股悠然的气场有没有变弱一丁点。看了一拍之后发现没有。


  “你想怎么样？”他问道。


  “来找乐子嘛。”祁荒笑了起来，她的肩膀在道袍里往上轻轻一耸。“我的全名——”她把手按在自己胸口上，“之前在埋葬机关他们都叫我菩萨院·祁荒。”


  他看着眼前这个笑嘻嘻的尼姑，菩萨院？怎么可能？埋葬机关压根没有记载。


  然后他开口了：“你也配？”'

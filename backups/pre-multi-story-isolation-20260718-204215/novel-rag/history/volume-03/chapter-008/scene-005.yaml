content: '立香的反应不是经过大脑决定的，是她看见衣服消失的一瞬间手已经伸出去——捂住了言峰士郎的眼睛。掌心贴在他眼眶下方，她感到他的睫毛在掌心底下刷了一下，然后是眼皮愣住不动的触感。


  衣服消失后出现的那层新的布料——一身剪裁妥帖的修道服——已经把祁荒露出的几寸皮肤重新裹进了笔挺的灰白色线条里。然后她随手从腰间往上一抖，指尖勾着一枚黑色的铁牌抛向空中。


  啪。


  铁牌在空中翻了半圈，夕阳最后那道残光在铁牌流转的表面追逐成一段极短的流动轨迹。


  士郎伸出手把这个轨迹抄进掌心——五指合拢的速度快得只看得到残影，掌心一顿，然后他摊开。


  随着同调，魔力从士郎的指尖向下涌入铁牌的纹路里，那些被浇铸出埋葬机关标记的凹陷处涌起了极短促的微光。


  “确实是埋葬机关。但是第三席——”


  在他开口时立香把手从他眼睛上收回去，指腹最后擦过他的额发。


  士郎把铁牌翻了个面检查完之后抬起头重新看向立香，“第三席的话——”这句迟疑不是对他的，是对他自己没法解释的部分。铁牌是真的，埋葬机关的铸造气息骗不了人，但是祁荒所在的那个世界.......


  “只需要确定我是埋葬机关的就够了吧。虽然有很多疑点，但是应该也够让我和你们入伙了吧。”祁荒把话插进来。


  士郎把手里的铁牌递到立香面前，立香接过去，随后她把目光从铁牌上挪过去落在祁荒的脸上，然后点了头。


  “我明白了。”她开口，把这句话三个字说得一字一顿。“我可以暂时信任你，祁荒小姐。”


  “那就这样？我虽然压根不了解这里的情况，但是～”祁荒笑着开口。她把右手往前一伸，手指张开的方向恰好排开傍晚最后一道光线。


  “我不是很弱哦。”


  立香握住祁荒的手。'

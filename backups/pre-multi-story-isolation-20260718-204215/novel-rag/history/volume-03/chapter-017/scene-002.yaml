content: '立香坐回了原位置，她看向那碗米饭：米粒在碗里已经比刚才更塌了——冷气把米粒之间最后一点蓬松都抽走了。


  然后她挖了一勺子，米粒在勺子上叠成了一小撮白，放入自己的嘴里。


  立香眼前的景色忽然变了。


  一切事物都被无限拉长——白色桌面拉成了光轨，伊耶那美的脸被揉成一片模糊的色块——然后迅速靠近。


  她发觉此时此刻她身着一身普普通通的冬装，不是迦勒底的制服也不是她刚才为了在特异点里面进行伪装穿的和服，就是她在东京时穿的那身冬装。


  外套的布料是粗糙的，领口处被洗得起了一层细密的小毛球。


  只是这里是东京吗？她完全无法确定。


  她刚想要张口，发现了不对劲——嘴里鼓鼓囊囊的，有什么东西。


  【还在嘴里。不能张嘴。】


  她的脑海一阵寒意


  【张嘴的话，会死】


  【彻底的死。】


  她脑海里想到了这句话，很明显她的想法是对的——舌头顶到那团东西时，它的质地介于糯米和蜡之间，不能吞不能吐也不能咬破。


  她伸手看了看自己的左手，手背上失去了令咒，那只手和平常人的手毫无区别。


  同时浑身也没法调用半点魔力——她试着把意识往自己胸腔底推了一下，什么也没发生。此时此刻，她是凡人。


  “噗嗤。”


  痛从腹部传来。


  她的腰间不知何时扎入了一柄长刀，刀身带着弯刺，尾柄挂着一小截铁链。她低头看见那截铁链在她腰侧晃了晃，然后一股巨力从铁链另一头拽了过来。


  立香整个人被那股巨力从原地抽走——身体在这股牵引力下完全不听使唤，倒飞出去撞在路边停着的一辆小车上，车顶铁皮被她撞出一个凹坑，然后她整个人从小车侧面滚落到柏油路面上。


  接着又被扯起来撞向另一辆车。


  立香只觉得浑身剧痛，她的脑子在这几下撞击里已经没法正常地思考——每一撞都把意识震散一块然后又被下一撞震回躯体。


  一只大型犬从身侧冲过来扑在她身上，犬嘴张开，一口撕下来了她刚才被捅到的地方的肉。


  她的腰侧原本就有刀口的皮肤被整块扯开，露出底下森白的骨头截面。她的喉咙动了动，只能发出一声闷哼。闷哼从她鼻子里往外冲时带着一股被压住的气流声。


  当恶犬正要继续下嘴的时候，一声枪响传来。恶犬的头上被开了个洞，毛皮上炸开一个小口然后整只犬歪倒在柏油路面上。


  大难得逃的立香还来不及反应，她就被身侧的两个女人架了起来。她的面上全是血，血从额头上往下淌，把她的睫毛糊成一撮撮黑黄色的硬块。


  她扫视了一下身侧的人，发现她们身上穿着自卫队的服装——深蓝色的制服，肩上缀着简易的徽章。


  两个女人的手臂穿过她的腋下把她从地上拎了起来。


  纵使有万千古怪，她也顾不上多想了，脑子里只想着不能开口。


  【什么……】


  两个女人架着立香朝前面走去，她的脚拖在柏油路面上蹭出两道平行的痕迹——转弯时蹭到路面上洒着的碎石子，石子钻进她的鞋帮里硌着她的脚踝外侧。


  走了没多久，两人把她架到了广场处。立香抬眸，看到了一个她完全没能想到的人。


  士郎，士郎此时此刻跪在广场正中央的台子下面。他的修道服下摆在地上摊成一片被血浸透的暗色。身着自卫队制服的人一巴掌打在士郎的脸上——手掌打在皮肉上发出又闷又响的“啪”，他的头被打偏了半寸然后又自己转了回来。


  他们嘴里说着什么，立香听不清楚——她的脑袋现在都是昏昏沉沉的，只能看见士郎被抬上台子之后又被谁一巴掌抽了上去。


  随后那人抽出来一件明显是刑具的武器，在手里翻了翻。刃口在广场的照明灯下闪了一下冷光，然后往士郎身上划了下去，一下接一下，弧形的一划落在他肩膀上，血从修道服裂口里翻涌出来。


  士郎没有出声，他只是静静地看着眼前的人，眼睛没有闭，也没有转开。那道视线平静得就像被刀刃划过的人不是他自己。


  血从他的身上缓缓流下来，顺着他跪着的膝盖把那片地砖染成暗色。他静静地看着眼前的一切，如同就在他身上苦修一样——每一刀都是经文、每一刀都是他可以用沉默念出来的字。


  立香嘴里闷哼了几声，她挣扎起来，想把手臂从两个女人手里抽出来，她拧了一下左肩拼命想要挣脱，但她随后就被身边的人摁在了地上。


  膝盖压在背上，脸被按进了地面砖缝里，她的喉咙闷哼出来，鼻子出气——她只能发出闷在喉咙底部的呜咽声，胸腔里的气流被压住找不到出口。


  她瞪大了眼睛看着施刑者一点点在士郎身上划着——那道刃口划下时血从皮肤里渗出的方向不是往外喷，是慢慢地往外渗，像是被太浓稠的时间阻碍了流速。


  她不顾骨折，身体剧烈地扭动着，她想要哪怕扭动半分——哪怕让它快一点点。腿在地面上踢起来，但立刻被女人的膝盖重新压下去。'

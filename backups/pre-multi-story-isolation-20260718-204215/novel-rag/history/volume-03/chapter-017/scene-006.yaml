content: '“我要离开这里！”


  “士郎和玛修在等我！迦勒底的人在等我！我不会被困在这里的！”立香瞪着眼睛看着眼前的人，她咬着牙开口。


  眼前的人似乎弯了弯眼角。那份被幻境赋予的放弃——那份他一开始就知道这里是假的却选择闭嘴的沉默——被立香这几句从眉尾处直接劈开了一条裂缝。他开口：“啊啊，确……”


  他的话没说完，整个世界消失了。


  立香面前的世界变成了一个个格式化的块，从里往外被抽空，就像有人在逐个删除文件夹。


  她看不懂眼前的事物，只是这个念头一想，整个世界彻底变成了0101的二进制。


  一和零从她的脚下往上翻涌，把所有物体的轮廓全部替代成两色光点。


  公寓的墙变成了纵向延伸的亮暗点阵，士郎还站在那团光点里但已经没有了任何可以辨认的特征。


  虽然还是不太懂，但是可以接受了。


  【这样就结束了吧。】


  立香的脑子越来越沉。那团二进制在她意识边缘慢慢地往内收缩，把她所有的感知压缩到一个极小的区域然后从这个区域里撤走。


  她不受控制地要睡着了。眼睛自己合起来，睫毛贴在下眼睑上。


  立香的意识消失之前听到了一道女声。


  那道女声不是从耳边传来的——是从她体内某个位置直接涌进她脑子里。


  语调轻轻松松，像是一个已经看了很久戏的人在最后一刻从坐席上站起来拍了拍袍子。


  “没想到啊，竟然做到了——那么自然有最好的奖励咯。”她顿了顿，然后那份语气从轻快收成一抹肯定的弧度。


  “去解决你所要面对的敌人吧~“


  ”至此之后，再也没有无法令你理解的存在站在你的面前。”


  然后是静。静得二进制光点也全部熄灭。'

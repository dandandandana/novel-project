content: '立香浑浑噩噩地又回到了黄泉比良坂处，她被猛地一推——推她的人是谁她没看到，只感到背部被什么平面的东西撞了一下然后她整个人往后翻倒。意识陷入了无尽的混沌之中。她什么都不记得了，只记得不能张口。


  她生在兵荒马乱的时期。


  出生时不张口啼哭，也不用进水和进食就可以长大——因此为村民们所厌恶。家人带着她辗转到了城里，她并不明白为什么家人要带她来，只是默默地跟着走到了那户人家。当天下午她就见不到她的父母了，她不怪他们，因为她说不出口。


  直到她遇见了一个教书先生。教书先生也为当地人视为邪祟——由于他那一头耀眼的红发，当地的人皆不敢靠近，只有贫苦百姓愿意送孩子们来他这里上课。


  他负责她的日常生活起居，教她识字，教她用小刀削竹签，教她看着稻田里的水色判断今年秋天有没有收成。


  他不嫌弃她不能开口说话。她也用自己能做的事情帮着他——帮他批改那些小孩子的作业，帮他把柴房里的柴火码成四四方方的一堆。


  一直都是他们两个过着相依为命的生活，战争打起，他失去了原有的地方，只得带着她流浪。


  她在他最困难的时候一点点帮他重新振作继续活了下去。


  到了下个定居地的时候已经是几年后——他把她带到一个新的村子里，重新挂起教书先生的招牌。在相依为命、互相扶持的日子里，二人互生情愫。


  自然而然的，她成年的时候笨拙地用笔向男人表露了心意，她在纸上写歪歪扭扭的几个字然后把纸叠到不能再折的程度才递给他。一直没有娶亲的男人无奈地接受了她的笨拙。


  男人用剩下来的钱买了一块地。由于被视作邪祟，男人没有被征兵，他和她东耕西耘。春天他在田里翻土时汗水从红发底下淌进眼睛里，她就用袖子替他抹掉。日子似乎就这样一点点过去了。


  她怀上了他的孩子，男人就不让她下地了，日常起居由他进行——他每天天不亮起来给她煮粥，待米粥上浮起一层薄薄的米油，再端到她手里。


  十月怀胎说长也长，说短也短。她生下来了他的孩子。


  但是


  战乱找上门来。


  守城的人落荒而逃，敌军在这里展开了屠杀。兵马涌入她原本温馨的小家的时候她拼了命地想要堵住门——两只手臂撑在门框两侧，后脚跟蹬住地——却被一脚踹开。


  朝她腹部踹来的一脚把她整个人踹向屋里，后背撞在矮桌上把桌上的碗盏甩了一地。


  然后她看着。


  她和他的小孩被那个大头兵高高举起。


  孩子握在身体两侧的两只手松松地垂着，孩子在半空中踢了一下腿，嘴巴张开但没有哭出声音。


  门被撞开。那个她的丈夫，她不清楚他是怎么闯进来的——但他就那样撞开已经被砸坏的木板门冲了进来。


  他扑过去抢他们的孩子，整个人往大头兵身上撞，撞上去时身体发出的闷响和木板门碎裂时的声音叠在一起。


  他来了。


  可是。


  剩下的大头兵发了狂地朝着男人打去，男人被踹飞到一边——飞出去时身体撞在墙角上然后往前扑倒了。


  他们的孩子也被一下——


  藤丸立香捂住了嘴巴。


  “呃……”


  她喘出一口气。


  绝望、痛苦以及深深的不甘和失去自己亲子的痛在她的胸膛里翻涌着——不是一层一层交替，是同时涌上来在她心口撞成了一整个无法呼吸的块。


  她面上满是泪水，她完全没办法承受了。


  身体上的痛苦她可以忍受——刚才在东京被捅刀被恶犬撕肉时她忍住了。


  至交在她面前的折磨她可以强压下去——看着士郎被一刀刀划时她忍住了。


  面对仇人的悲惨处境她可以忍住——神琦灰被铁水浇淋时她甚至心里生出过快感。


  面对亲友死后无由来的污蔑，那人表示不要——士郎在黄泉比良坂对着她摇头的那一刻——她就忍住了。


  但是。


  这是这一世她的亲生孩子。


  作为母亲的藤丸立香，她的泪水直直的流了下来，如同内心撕裂一般的痛苦涌上她的脑海。


  “……a”


  在她即将要发出第一个音节的瞬间——嘴唇刚刚张开一条缝，声带刚刚准备震动——男人扑过来捂住了她的嘴巴。


  他的手掌贴上来时掌心是冰凉的，被汗水透湿了整片。琥珀色的眸子看着她，仿佛要把她死死烙在自己的心底。


  那份注视的力量大到她能感觉到自己的眼眶被这股注视压出了更多的泪水，他的手指间缝里还夹着刚才被踹飞时沾上的墙面灰。


  “啊啊，对不……”男人的话说着说着就没了下半句。


  立香的嘴角涌出血液——她咬破了自己的舌头，上下牙交错地咬在口腔内侧柔软的腮肉上。


  血从她嘴角淌下来滴在男人的手指上。


  “唔……”她一声也开不出来。被男人死死捂住的嘴巴完全没有张开的迹象。她的舌头在嘴里顶着那块糯米般的塞堵物，她的喉咙自己收紧，把所有要冲出来的声音压回肺部，然后再从鼻子里喷出来。'

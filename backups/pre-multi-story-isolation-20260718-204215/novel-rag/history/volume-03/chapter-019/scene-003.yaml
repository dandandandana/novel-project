content: '吉尔伽美什总算是把酒喝完了。她把空瓶子搁在一旁地板上，和其他空瓶排成一排。然后她看着立香，赤眸里的那份酒后的慵懒在开口时被收了回去，换上了一份从她眼睛里很难得能找到的郑重。


  她悠悠开口：“杜子春——那是你所经历的试炼。”她顿了顿，把视线从立香脸上移向躺在床上的士郎。“你不好奇为什么你在那里只见到了士郎吗？”


  立香的肩膀微微僵了一瞬。“你说什么？”她看着吉尔伽美什那张突然变认真的脸，然后自己的声音从嘴里落了下来，像是一边想一边往外倒。“你的意思是——如果不是士郎——那么我还有可能在那里见到你，见到玛修所长和达芬奇亲吗。”


  吉尔伽美什又拿了一杯美酒，她从宝库里取杯子的动作很慢，慢到立香能看清她指尖穿过杯耳时轻轻弯下去的弧度。她开口：“没错。杜子春对你而言是一个死局。”


  “死局？”立香挑眉。她的眉毛往上挑时额头上挤出几道极浅的横纹。“我这不是活下来了吗。”


  “对你而言——一个人是绝对的死局。”吉尔伽美什断言道。她竖起一根手指，手指尖在空气里轻轻点了一下然后停在那里。


  “成仙的大道断情绝爱。杜子春就是这样的试炼。”她把手指收回来搁在膝盖上。


  “如果你失败了，你会死。”


  立香看着那根手指被收回去。她的呼吸在鼻道里变得很轻。


  “如果你成功了，那么你就会失去你的所有的感情，所有的执念，藤丸立香，那你也差不多死了。”吉尔伽美什说着，她说“藤丸立香”时不是叫她，是在指出那个差点在试炼里消失的人。


  “你大概也明白我的意思了。”


  立香深吸了一口气。她伸出手，手掌摊开。吉尔伽美什给她倒了一杯酒，酒液从瓶口落进杯子时发出清冽的注水声。那杯酒被递到她手里时杯壁贴着她的指腹传来微凉的触感。


  “你能喝吗？”


  “世界都毁灭了还管什么法定饮酒日啊。”立香抿了一口。酒的甜在舌尖上炸开，然后顺着舌根一路热到喉咙底。


  她把杯子搁在膝盖上，杯底压着膝头那份硬骨的触感让她的声音变得比刚才低了半度，低到像是在跟自己说话。


  “啊——我明白了。确实是死局啊，如果不是士郎。”


  她抬起头，橘色的眸子里倒映着吉尔伽美什那张在午后的光里变柔的脸。她的睫毛在眸子上方微微颤了一下。


  “他现在怎么样了。”


  吉尔伽美什开口。她的声音在立香问出这句话后没有立刻跟上，让她多停了一拍，然后她说了。


  “不用担心，他死不掉。”


  “他的性命寄于一体——很难死的。”'

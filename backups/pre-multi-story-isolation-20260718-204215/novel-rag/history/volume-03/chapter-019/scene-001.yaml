content: '“降格术——我该怎么用呢。”


  她把视线从士郎身上收回来，落在吉尔伽美什脸上。然后她的眉毛在问句尾音落下时微微往里收了一点。


  吉尔伽美什捏着下巴，指腹在下颏骨上轻轻按着，那份喝了酒之后略微放松的表情没有变。


  “脑子里想用就能用吧。”


  她把捏下巴的手指松开，在半空中随便比划了一下：“这类魔术实际上很简单的。”


  “简单？”立香瞪大了眼睛。橘色眸子里那份刚平复下来的困惑被这一句话重新挑了起来，她把自己的后背从小凳上挺直。“刚才我可是差点死掉了——你告诉我简单？”


  吉尔伽美什摆了摆手。手掌左右晃了两下，幅度不大但频率快，像是在把立香那句话从自己面前扇开。


  “不是指这个，指的是用法。”


  她的赤眸在立香脸上停了半拍，然后她把手指搁在自己膝盖上轻轻敲了敲：


  “设计这个魔术的人压根没打算把所谓的魔术复杂化。”她顿了一下，把视线往上方移了一点点，像是在翻找脑子里某个更恰当的比喻。


  “你可以理解为——已经写好的接口，然后你只需要输入参数调用就好了。”


  “哈？”立香挑眉。眉毛挑上去之后就挂在那里，嘴唇在“哈”字后张着一个小口，“这是魔术？”


  “和灵子转移差不多，不过比它调用更简单。”吉尔伽美什把搁在膝上的手翻转过来，掌心朝上然后轻轻一摊。


  “不过肯定是有代价的。”


  立香深吸了一口气，胸廓在吸气时稍微扩大了一点，然后她转过头看了一眼躺在床上的士郎。他的胸口在那层素色绑带底下平稳地起伏着，脸上的裂口结了淡色的痂。


  她垂下眼睑，把声音压低了半度：“代价是什么——我需要通过这个判断我该怎么用。”


  吉尔伽美什把手探进身侧打开了一道金色的裂隙。然后她从里面拎出来一个瓶子，瓶身细长，口沿上箍着一圈极细的金属线。


  瓶塞被拔开时弹出一声极短的闷响，然后一股香甜的气息从瓶口翻涌出来，不是花香也不是果香——是某种更稠更陈的甜，顺着立香的鼻道一路滑到额前。


  立香一下子清醒了，她的瞳孔在眼眶里微微缩了一下，然后紧张地看着吉尔伽美什。她不知道这时候拿出酒来是什么意思。


  吉尔伽美什喝了一口酒。酒液滑过她的嘴唇时那只捏瓶颈的手指轻轻转了半圈，喉部在吞咽时微微起伏了一下。她放下瓶子，然后开口：“大概是脱力之类的吧。”


  这句话让立香愣了一下。不是那种被正确答案打中的愣，是她已经准备好了一套惨烈的副作用清单——失忆，失寿，失感情，每用一次就离暴毙更进一步——然后全部被这四个字堵在了嗓子眼里。


  “等等？就这？”


  “啊啊，那肯定会是肌肉萎缩。”立香捏紧自己的手指，把自己从ACG作品里搜罗来的所有可能的副作用在脑子里快速翻了一遍，然后挑出了一个最接近的。她的眉毛皱成一团，语气里的疑惑里掺着几分还没消化完的惊愕。


  吉尔伽美什歪了歪头。她仿佛听到了什么不该听到的话一样把脖子往左边偏了一小截，和服领口随着她的动作往肩头滑了半寸。“本王不是说了只是脱力吗？脱力还能有什么？”


  立香沉默了。她把嘴唇抿成一条细线，然后从那条线里漏出一句话：“我以为会死。”


  吉尔伽美什忽然笑了起来。笑声从她的喉咙里往上扬：


  “哈哈——哈哈哈”


  然后她歪过头，赤色的眸子在酒气和她自己的笑意里显得极其妖冶——那双眼睛眯起来的弧度刚好让红色的虹膜只露了一半。


  “能够研究出这种魔术的人——”她把尾音拖长了半拍，然后把头正了正，“你觉得她会留一个带有副作用的能力吗？”


  这句话一出来，立香彻底无言了。她的嘴巴张开又合上，脑子里甚至闪过了一丝“这确实很合理”的念头——然后她立刻把这个念头摁了下去。


  她拍了拍自己的脸，掌心拍在刚才被枕头压红的那半边脸颊上发出轻轻一声脆响。


  不讨论这个了，再讨论下去她怕自己会被说服。


  “这种作弊级别的能力啊——那我可要好好收下了。”她把脸上的手掌放下来搁在膝盖上，然后歪头看着吉尔伽美什。“你不怕我滥用吗？”


  “滥用？”吉尔伽美什歪了歪头，和刚才那个歪头不一样——这次是真正的困惑。


  她把空酒瓶放在一旁地板上，瓶底搁上去时轻轻磕到另一只空瓶子的瓶身。


  “你怎么滥用呢？”她把修长的手指在自己膝盖上摊开，“你所处的环境有很多你无法理解的事情吗？还是说你觉得你就算用了能有什么效果呢？”


  立香想了想，她把肩膀往后靠，后背贴上小凳的靠背时那份硬木的触感让她冷静了下来。


  她由衷地赞成吉尔伽美什的话——就算是在这里，在天照金地，在弥勒的地盘，那些法相所展现出来的力量也是她可以理解的，是可以通过自己的常识去解析的。'

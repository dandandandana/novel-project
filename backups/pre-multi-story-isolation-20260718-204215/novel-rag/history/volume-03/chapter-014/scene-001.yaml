content: '“您的意思是——”藤丸立香把刚刚听到的所有话在脑子里重新跑了一遍，从金地的由来到月读命那边瘦得只剩骨架还在笑的居民，再到这位坐在主位旁边的黑发女人用最平的语调说完的一切：


  “这里已经是重塑过的世界了吗？”


  村正和伊耶那美坐在长桌同一边的位置上，主位空着，那个空位在他们进来之前就是空着的，现在也没人去坐。她们对面的位子上坐着立香、玛修和言峰士郎，彼此之间隔着几碗还在冒热气的料理和一壶被天沼刚端上来的红茶。


  伊耶那美开口讲故事的时候天沼还站在暗处没动，等他端着最后一道菜进来搁在桌上时，她把这里的事都讲完了，现在她正把一双筷子从碗沿上拿起来，银白色筷尖在烛火下反着极淡的冷光。


  她夹了一筷子菜放进嘴里，表情和咽下去之前一模一样。


  “这个时代的作物有问题。”她把筷子搁回碗沿上，筷子尾端翘起一个极小的角度，“每一口都没有正常作物的味道。”


  “这样吗——”


  村正没有说话，她把碗端得很低，筷子往里夹的频率很稳定但眼睛从来不抬。米饭在她腮帮子里面被嚼得很慢，慢到每粒米都被门牙碾碎了才往下吞。立香扫了她一眼：这个刀匠被折子砸过之后就一直在吃，从开头吃到现在，把自己那份吃干抹净之后还从天沼端来的大盘子里夹了几筷子继续吃。


  “那么——”立香把目光从村正的碗挪回伊耶那美的脸上，“所谓的金地？”


  “神尸。”伊耶那美说道。她说这两个字时手搁在杯沿上，杯沿在她食指和中指之间的那道缝里被体温慢慢焐暖：“天照命金地——”


  她把食指从杯沿上抬起来朝天花板的某个方向随便指了一下：“就是我的女儿天照的尸体形成的金地。”


  立香没有动，但她把“神尸”这两个字从耳膜里收进去之后在脑子里转了好几圈。


  天照的尸体上，太阳被钉在正午，那个永远不掉下去的太阳底下，每一块被踩着的石板都在她女儿已经死去的尸体上面。


  “月读命金地的情况？”她开口时声音已经把上一个问题带来的冲击压下去了大半，“那里的情况——为什么那里会有人肉？”


  “每个金地不一样。”伊耶那美把手重新放回桌上。她的手指在桌面上搁着，指甲是浅粉色的，在烛光下看不清楚是不是涂了蔻丹，“月读命那边更倾向于秩序。你们所见到的是金地的情况而已。”


  立香点了点头。这个点头不是表示她明白了，是表示她把这件事先记下来了，然后她会把它和之前别的几件事放在一起，等到所有碎片都够了再拼。


  她接着问：“那您说的导致现在这种情况的那个和尚是谁？”


  “我不太清楚佛教那边的事情——”伊耶那美把手指从桌面上收回去搁在自己下巴上，她用食指抵着下巴尖：


  “据僧侣所说，名为弥勒。”


  弥勒。


  立香整个人在椅子上定住了一瞬，她的嘴张开，弥勒。未来佛。坐在佛位上的那个。


  下一个要在娑婆世界成佛的。她的脑子里所有关于佛教的知识全部在同一时间从迦勒底图书馆的书架深处往外涌——大藏经、阿含部、弥勒上生经、弥勒下生经——每一条都清清楚楚地告诉她这不可能。


  弥勒是未来佛，是还没成佛的候补，是那个要等释迦牟尼教法灭尽之后才会降世的人。


  他是释迦牟尼的继承者。


  但伊耶那美说弥勒杀了释迦牟尼。


  她看向伊耶那美时嘴唇已经合上了。她把脑子里涌起来的那些知识全部往下摁。她现在是在天照金地，在同一张饭桌上和伊耶那美一起吃处理过的菜，这个世界不讲泛人类史的佛典。


  “弥勒佛——”她开口时声音有些颤抖，“杀了他的师父释迦牟尼成了新的佛，但是现在在压迫世人？”


  “嗯。”伊耶那美看着立香。她的赤色左眼在烛光下跳了一下，“你对弥勒很有了解啊。我醒来的时候已经是弥勒治下了。”


  立香把脑袋往右边转了几寸看向言峰士郎。士郎正把手搁在桌上，手指没有碰碗也没有碰筷子。他的琥珀色眼睛看着伊耶那美，他是一神教信徒。


  他不信佛教，弥勒对他来说是另一个体系里的名字，他本该惊讶才对。


  但他没有惊讶，没有插嘴，只是把视线从伊耶那美脸上移到自己御主脸上，微微点了一下下巴。


  “弥勒是继释迦牟尼之后的未来佛。”立香把脑袋扭回来重新看向伊耶那美。


  “这样吗？”伊耶那美点了点头。


  村正把手举了起来。


  立香看向她，村正开口道：“佛不都是超脱的吗？”


  她说到这里时眉头拧了一下，像是在把脑子里那个和某个人有关的问题从记忆最底下拽到嘴边上。“也就是说，如果是佛的话，那个叫做弥勒的佛为什么会这样干预世间呢？”


  立香汗颜地看向玛修，玛修在她旁边把碗放下来，摇了摇头。玛修确实不清楚。立香又看向士郎。'

content: '整片大地在她的天沼矛的旋转下从混沌中拔出来，缓慢扩张——冷凝的火山岩、分裂的黑色矿物、砾石和黄土和盐层一层层往外交叠，弧形的边缘在扩张时发出极沉的轰隆声，大地在她头顶形成了一座孤岛整个孤岛大概半径有接近两千米左右，基底被从混沌里拉出来的深黑色岩脉牢牢锁住。


  然后是秩序，伊耶那美的阴阳眼骤然亮起来——整座孤岛从天照命金地的方向切断了八岐镜反射过来的所有天光，天空在孤岛的笼罩下彻底暗了下来。


  只剩下她两只异色的眼睛，一青一金，两团冷光凌驾于黑暗之上。


  秩序在大地之中被创造出来。岩石层理的挤压声、盐块的结晶破裂声、泥土沉降时吸附空气的嘶嘶声在同一时刻全部停止了。整片孤岛笼罩着的世界正在被重新定义——被她的规则。


  “妖孽，休想得逞！”一名法相的声音从重新聚拢的金袍阵式里炸出来。


  十八人的身形在半空中横移错位，以极其精准的角度和等距形成了一个十八边形的环形阵法。他们同时垂下头，嘴唇在暗光中飞快地碰触着，念经声汇成一条看不见的线缠住阵法中心。接着他们同时抬起头来，十八双瞳仁中灌满了稠厚得几乎没有眼白的金色。


  “降妖伏魔大阵。”


  整片被孤岛笼罩的天空瞬间被金光灌满。十八名法相如同十八枚被点燃的太阳，每一处的金袍都被从体内透出的光芒撑得近乎透明。


  整座孤岛的下方金光大放，光芒从环形阵的正中心朝上冲——撞上孤岛底层的黑色岩脉之后带着尖锐的齐响四散开来，在岩石裂隙中被扭曲成无数道交叉的光线。


  伊耶那美的瞳孔同时缩小了一圈，她感觉到的第一样东西是重力——不是从下方来的重力，是从四面八方朝她压过来的重力。


  每处皮肤都被压了一层肉眼看不见的厚石板，肩臂的每寸肌肉都在被无形的巨力朝下拖，连握矛的手指都被压得矛柄上的凹槽陷得更深。


  不只是重力，还有限制。她浑身的肌理顿时同时火辣辣地烧起来——不是真被火烧，是整个身躯如同被太阳的极高温度从外到内同时灼烤，每滴汗珠都没来得及冒出来就被体表的高温直接蒸干。


  她把牙关压紧，臼齿碾过时齿缝间扎出一声干哑的硬响。她的身体从原本静止悬空的状态骤然下沉了半尺，脚跟被重力拖得狠狠往下挫。


  她冷哼一声，将矛朝上空一挥。整片被孤岛覆盖的漆黑天幕在矛尖牵引下化作一片片飘浮的黄泉路——暗金色的通道从虚空里拉开，杂乱无章地在空中盘旋交错，每条黄泉路内部都旋转着浓稠得近乎固态的幽暗漩涡。漩涡朝着法相结成的大阵轰然砸去。


  阵法中央亮起一道金色光柱。光柱的粗细是整个环形阵的直径总和，从阵心垂直喷出然后折成直角对准黄泉路。下一秒它就对着黄泉路上那道最粗的暗金漩涡直接轰上去了。


  撞击时没有爆炸声——是地面先响的。整片交战处的地表先是闷响，然后以法阵正下方为中心猛地往下沉，泥土被整块地压进地底，岩层断裂声从下面滚滚涌上来。余波波及的方圆数十公里内的一切泥土和岩石都被压碎之后重新被压进同一个层面上，地面从那开始向下塌陷出一道极深极宽的弧形盆地。


  伊耶那美没有慌。她把泛着滚滚雷鸣的雷火从手掌心里凝聚起来——每一道电弧都像粗细不定的银灰色锁链在火球表面缠绕破裂又立刻被新的电弧填上。她将雷火托在手心举至唇边轻轻一吹，雷火脱手时炸出一声高亢的霹雳，拖着电尾朝金光撞上去——然后同时炸开。


  但接下来的事情没有如她的料。金光在炸开的瞬间没有熄灭也没有被雷火吞没——它化作了一个个独立的金字。


  每个金字都像有眼睛似的躲开了雷火炸开的电弧网，它们在空中排成舞步般的跳跃轨迹，一个个绕过电光朝伊耶那美飞来。伊耶那美的面色丝毫未改，天沼矛在她双手中急剧旋转成一片模糊的矛影将大部分金字挡开。但仍有几枚金字穿透了矛影间隙，从她腋下和腰侧的空隙中切入。


  两枚金字正中她的腹部。一枚从胸腔正面贯穿。金色血液从她被击穿的袍服裂口里迅速涌出来，在冷光下泛着暗沉的金属光泽。


  她看都没看。


  黑色虚无从她的袖口涌出，某种比黑暗本身更深的混沌，在接触到破口的瞬间直接填进了伤处。撕裂的血肉被黑色物质从内部蚀平然后以肉眼可见的速度重新合上。


  不过数息，腹部的贯穿处只剩下衣料上一个破洞和皮肤上正在消退的淡金色血渍。她借着这个机会猛力搅动天沼矛两下，整片黄泉路重新聚合起来朝着降妖伏魔大阵的正上方重重轰了过去。


  “哼。”素衣的男人动了一下。


  他把腰间的太刀从鞘里拔出——刀身在出鞘时带出银弧，与黄泉路最前端接触的瞬间将暗金色的通道从正中间斩为两半。'

content: '立香在摸到木床轮廓时感到一份实感顺着指腹流过来。


  不是黄粱一梦里那种干净得过分的洁白病房——这张床的木头在她掌心压下去时没有往下陷，床沿上被磨掉的漆露出底下颜色更浅的木纹，木纹里嵌着一层经年累月渗进去的人体油脂，摸上去滑滑的。


  她把这些细处一一摁进自己的掌纹里，确认它的轮廓是真实的，才慢慢睁开了眼睛。


  微微张了张嘴，清凉的液体从木制水杯杯口滑进来。


  她吞咽了两下，喉咙里响起两声浅浅的咕噜。杯子被人端开，杯底在木桌上磕出一声闷响，然后她看见了一个脑袋。


  红色的。


  她眯着眼睛，嘴角往上拉扯了一下，开口：“士郎……我梦到我和你结婚了……还生了孩子~”


  话说完，她的大脑才追上来。那人半天没回应，她有点疑惑——这份沉默不是士郎的沉默。


  士郎如果听到这种话会先被她噎两拍然后才开口。而现在这份静是杵在床沿上看戏的静。


  立香的脸霎时间红透了，一直红到耳廓。


  她翻了个身，把头埋在被子里。棉织物在鼻孔里塞满洗衣皂的气味，被窝里还混着自己出汗蒸出来的潮。她把脸拱进枕头，耳廓的热度把枕套捂出一小片湿。


  正当她疑惑地想翻身，就听见了女性的声音：“醒了？”


  立香眉头一挑，这个声音很熟悉：“村正？”


  “啊，看样子你还行啊。”村正把木制的水杯搁在床头柜上。


  立香从被子里探出半张脸，看见她歪着头打量自己的表情：“我还以为你会变成天沼那样呢。”她说“天沼”两个字的时候语气日常得好像在和谁约了晚饭。


  立香一愣，坐直身子发现自己的衣服被换了，不是迦勒底的作战服也不是在特异点入乡随俗穿的和服——是一身干爽的麻布里衣，领口处还有刚洗过太阳晒出的干涩气味。


  村正揉着自己的后脑勺开口：“你的衣服被汗浸湿了，我给你换了一件。”


  “等等，不该让玛修给我换吗。不对不对，我是活下来了吧。”立香看着村正，她说话时先否定了村正又否定了自己，“我是活下来了吧”这几个字的声音比前面那句要小半截。


  “啊，确实如此。”村正站起身，立香注意到她站起来时膝盖先往外挪了一拍然后才直起腰——她平时轻盈得像个随时能从袖里挥刀的拔刀术，现在却笨重得像个刚从自己铸的剑前面跪了很久的人。


  然后村正深吸了一口气，对着立香深深地鞠了一躬。


  “对不起，”她的声音是从低于立香膝盖的位置传上来的，“我让你以身犯险了。”


  立香伸手推住了村正的肩膀。手撑在她肩头上，感觉到村正的肩胛骨在颤抖。


  “别这么说，”立香按着她的肩把她从鞠躬的状态往回压了压，“我有自己的考量的。没有怪你的意思。”


  村正直起腰的时候把那份沉重的愧疚重新收回了自己的胸腔里。


  她幽幽地开口：“等你见到你的从者的样子你就知道了。”


  声调没有刻意往下沉，但每个字都像是看见了某些不该由别人替自己扛住的东西然后自己选择了闭嘴。


  “什么。”立香把一旁的腰带系好，三两下将麻布里衣收紧在腰间，她盯着村正，“你是什么意思。”


  “呃。”村正支支吾吾地把瞳孔从立香脸上挪开看向窗外。


  木窗棂被午后日光打出一片斜斜的影子，有鸟从外面飞过去，在窗纸上划了一道极短的灰。“等你见到他吧。”


  立香看看她没追问，她把床头的整杯水端起来仰头灌完，在脚踩到地面时脚底的触感传到大脑——她身上充满了力气。


  不是睡了一天后恢复的那种平常精力，是整个身子从头到脚被通透地填满了，像是被抽空了一些东西之后又被填进了另一些东西。


  她踏在地板上，直直地朝门外走去。


  玛修在门外守着。她把盾牌竖在自己身侧，盾牌的尾部搁在敷石上，听到推门声时她的肩膀往上缩了半拍。


  “前辈你能下地了？ ”玛修的声音从惊讶里弹出来。


  立香没有答这个，她双手按在玛修的肩膀上，橘色的眸子在她身上从上往下扫了一圈——看她的脖子有没有伤，看她的胸口是不是还在规律地起伏，看她的腰侧没有被刀划过的破口。


  “玛修你没问题吧。”话出口时不是问句，是确认。


  玛修往后退了小半步，脸微微发红。“没没没没事的前辈，倒是言峰前辈——”她说到这里断住了。


  立香的表情在那一瞬间停滞了，她看着玛修，嘴角还留着没来得及收回的半点弧度。


  “言峰士郎怎么了。”


  玛修欲言又止，她的瞳孔往立香身后飘了一拍——立香没有转头，但感到了村正在自己身后轻轻摇了摇头。


  【他们两个绝对有事情瞒着我】


  立香脑海里过了一下“言峰士郎出事了”这个可能性，随后她就把这个可能性抛走了。


  【怎么可能？】


  玛修咽了一口口水，“言峰前辈需要休息几天。”她说“几天”时声音是弱下去的。'

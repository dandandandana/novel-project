content: '村正勾起嘴角，她开口道：“我就知道嘛~身为御主就是要警惕嘛.......”


  立香的大脑在这句话落地的瞬间顿了一拍，她意识到了不对劲：


  【村正知道御主。他概括出来了情况。】


  这种概括需要一个前提：使用者必须近距离观察过御主。


  “啊啊，确实是这样啊：身为御主就是要警惕吧——”


  “那你做的很好了。”村正点点头，“跟我来吧，都走到这里了，说明你们对我有初步的信任了。”


  立香跟着她走了几步，她开口道：“你说的世尊——是个什么样的人？”


  村正想了想：“女人。”


  立香的脚步骤停，她歪过头。歪头的角度很不自然——那是大脑在处理信息冲突时，身体本能地将脖子往一边侧，仿佛换个角度就能重新解析刚才那两个字。


  “等等，你在说什么？”她那双橘色眸子先是盯着村正的脸，然后眯起来，眯到只剩一条缝。


  村正看到她这副模样终于忍不住了。她把手在空气中摆了摆。


  “抱歉抱歉——我家世尊是个很好的人，你们马上就能见到她了。”'

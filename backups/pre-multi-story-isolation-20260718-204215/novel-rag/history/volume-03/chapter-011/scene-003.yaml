content: '“啊啊，看样子是处理好了——”太太把针线搁在门框上，整个人靠在门槛边沿。她笑起来时眼角的细纹往太阳穴方向走了半寸。


  “算是吧，太太最近又漂亮了。”村正说这话时嘴角往上勾。


  “哎呀呀你的嘴巴真甜，有空来我家坐坐。”太太把手搁在门框上，手指往里指了指。“上次你帮我们的忙还没答谢呢——”


  “有空一定啊~”


  太太的身影刚缩回巷口，另一个壮汉从街对面跨了好几步走过来。走过来时他的木屐在石板路上踏出很响的咔咔声，每一步都踩得石板缝里的积水溅起来。


  他左手提着一大块用草绳捆着的猪肉，肉皮上的油脂在正午阳光下反出一层极薄的油光。


  他没停脚直接喊了声：“村正，拿着这个！”然后他把猪肉丢过来。那团暗红色的肉块在空中画了一道抛物线，草绳在猪肉旋转时松开一截。这块肉大概有三四个人一餐的分量——壮汉丢的时候手臂上的肌肉鼓起一整个拳头的量。


  村正下意识地伸手去接，她的两只手同时从身体两侧抬起，太刀从臂弯滑到肘窝——然后猪肉砸进她怀里。那块猪肉压在她的胸口和前臂之间，肉皮上残余的温度透过她的衣服烙在她的皮肤上。


  “啊啊啊！大叔你这个家伙！”


  “哈哈哈！谁让你上次不接呢——”壮汉叉腰大笑。他的笑声震得旁边屋檐上停着的麻雀扑簌簌飞起，麻雀翅膀刮过瓦片的细响和笑声的余波叠在一起。


  村正好不容易把猪肉抱稳，一个扎着总角的小女孩从壮汉身后窜出来。窜出来时她的草鞋在地面上啪嗒啪嗒响，每一步都踩在石板路的缝隙上像在跳格子。她在村正面前刹住脚，两只手同时往上举。


  “村正姐姐——抱抱。”


  村正把猪肉换到左手臂弯里，空出右手弯腰把女孩搂起来。女孩的草鞋离地时在空中踢腾了半圈，然后她把脸蹭在村正的颈窝旁边。


  “好的好的。”村正拍了拍女孩的后脑勺。


  女孩蹭了一会儿抬起头来。她的视线从村正的肩膀上方越过，落在了不远处站着的一群人身上。


  她的视线先在玛修的盾上停了一拍——那个庞然大物在正午的阳光下反射着灰白光。然后她的目光滑到立香脸上。然后她的眼睛亮了，她挣扎着从村正怀里滑下来，草鞋重新着地，然后她跑到立香脚边。


  跑过去的几步里她一直仰着头，脖子往后仰到几乎与地面平行，只为了把立香的脸全部装进瞳仁里：“你是村正姐姐的家人吗？”


  立香弯下腰，她伸出手揉了揉小女孩的头。小女孩的头发很软，发梢在她的掌心下被揉散开像一小团被手指梳松的棉花。


  “不是哦——”立香把语气词往上轻轻一拎。


  女孩偏过头，她的视线上移了一寸然后落在于士郎脸上。士郎穿着白色风衣，他站在立香身后一步远的位置，女孩需要把脖子仰得更厉害才能看到他的脸，然后她开口了：“那这位叔叔呢？”


  【叔叔？】


  立香在心里默默地吐槽了一句，穿过喉咙被她的嘴唇死死压住——叔叔，哦对，士郎也三十多了。


  她的嘴角在压住笑意时往下绷了一瞬，但那个绷紧的线条马上被她自己用笑容覆盖掉。然后她笑着开口，开口时声音被她刚才那口咽下去的笑意滤得格外轻快。


  “叔叔也不是哦——”


  士郎挑了挑眉，他叹了口气，他把这口气从鼻腔里叹出去，叹气时他的肩膀往下沉了一整寸。


  他没说什么，但玛修却从那个叹气的尾音里听出了一句无声的“叔叔？”。玛修把盾往自己身前挪了半寸，半张脸藏在盾沿后面不让他看到自己在笑。


  村正把怀里的小女孩轻轻放回地上，把猪肉重新抱稳，把被猪肉蹭歪的腰带正了正，然后朝正在看着她的几个人快步走过来。


  “抱歉，我拖了一点时间。”


  “没事没事。”立香把手从刚才揉女孩头发的位置收回来搁在腰间。她看了一眼村正怀里那块还在滴油水的猪肉，目光在草绳捆着的结上一扫而过。“村正在这里真的很受欢迎啊。”


  “有吗？”村正歪了下脑袋，她的手指在自己后脑勺上挠了挠。挠完之后她的眼角又弯了弯。“先走吧，我们直接去城主府吧。”


  “直接去吗？”立香的眉头往上挑。


  村正被簇拥的画面还挂在她脑子里，鲜花着锦，热烈簇拥，每一个人都欠她一份人情，这份人情如果垒成台阶能搭到城主府的正殿门前。


  “村正亲，你不会是把我们骗过去吧——”


  “我家世尊完全没必要这样。”村正的回答很快，她空出右手指了指城主府的方向：“我家世尊是个好人——”


  “我不信。”立香把两只手臂交叉抱在胸口。交叉手臂时她的小臂在前襟上蹭出窸窣声，“月读命金地那里的法相可是说一不二就直接打过来了吗？”


  村正顿了顿：“嗯？也有道理啊。你这一路上是不是都是这样带着怀疑的呢？”


  “当然。”'

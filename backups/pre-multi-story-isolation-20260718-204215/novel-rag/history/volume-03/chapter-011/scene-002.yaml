content: '她的鼻翼在撑起身子的同时翕了两次——空气里松脂和腐殖土的气味正在被另一种东西稀释：那是酱油烤焦后的焦香混合着刚出锅的米饭热气。


  “啊，到了。”村正深吸了一口气，她嘴角勾起一抹弧度，那抹弧度从嘴角出发往上走到颧骨的位置停住了，然后她朝着前面走去。


  “这样啊——”立香把手从玛修肩上拿下来。她把背挺直了，挺直时腰部的布料在皮带下蹭出轻微的摩擦声，“玛修不用扶我了，不能给别人看笑话啊——”她说最后半句时嘴角往上拎了拎。


  周遭的气息逐渐饱满了。从郊区向着市中心走去，脚下的泥土路不知什么时候换成了石板路，松树不知什么时候换成了木造町屋，屋门口挂着的暖帘被正午的风吹起来一角又落下去。


  石板路边上有一道浅沟，沟里淌着从町屋后厨排出来的清水，水面上浮着几片被撕掉的烂菜叶。


  天照金地给立香的感觉和月读命金地截然不同，仿佛彻底劈成了两半——月读命金地是那种被擦得锃亮供人观瞻的奢华，白玉台阶朱漆大柱黄金瓦片，每一样都反射着让人觉得不该伸手去碰的冷光。


  而天照金地是灶台上咕嘟咕嘟冒着热气的汤，是木造柱子被几代人的肩膀蹭出包浆的温润，是瓦片有裂缝墙根长着青苔但门帘是洗得发白的棉布的那种——活人住在里面的味道。


  “这里的人........”立香的视线从街口左端的竹器摊扫到右端的鱼摊。她看到卖竹篓的老头正用竹刀削着最后一根竹篾，看到卖鱼的老板娘把冰块从木盆里捞出来放回水里哗啦一声冰块在水面上转了个圈，看到巷口站着两个书生打扮的人正在为一枚铜板找回的零钱鞠躬道谢。


  “就和想象中的社会差不多是吧。”士郎从外侧走近半步。他扫了一眼街景，目光在卖鱼摊上停了半拍：鲜鱼在冰上还在张嘴喘气，这个画面和月读命金地内殿那顿人肉招待同时在他脑子里闪了一下。


  “和那个月读命金地完全不同啊~”


  “那里的人活着，但已经差不多死了。”村正扭过头，她的眼角弯了弯—并非刻意挤出的笑容，是眼角的肌肉自己弯起来的，弯到刚好能把眼眶挤窄。


  “天照这里可以不一样。”她说这句话时脚步没有停，太刀刀柄在她的肩胛上轻叩了一下。那声轻叩淹进了街口传来的叫卖声里，竹篓竹篓手编竹篓，他们今早摘的菜叶子还带露水——


  “这样啊，村正亲说的我理解了。”立香把手背在身后，她的指尖捏着自己腰带上的结，一边走一边看街景。


  一个小孩从她脚边跑过去，手里举着串在竹签上的烤鱼，烤鱼的油滴在地上很快被石板路的缝隙吸进去。“这就是你说的不一样吗？”


  “啊啊，就是如此。”村正点了点头。点头时她的下巴往下沉了一整寸，然后她抬起来，眼角又弯了弯。


  “不过天照金地也没你们想的那么好就是了。”


  石板路在几人脚下往街区更深处延伸。从町屋的夹缝间能看到远处城郭的轮廓，但此刻那条路先穿进了住宅区。路边的排水沟变窄了，沟沿上搁着几个被太阳晒得褪色的木盆，一扇推拉门从内侧被推开。


  “哎呀，村正酱回来了~”老妇人站在门框里，她的手还搭在推拉门的木框上。那扇门大概是推了三四年了，木框上半道推拉槽被磨得发亮。


  她另一只手上挎着竹编的买菜篮，篮子底垫着一块叠成方块的蓝染布：“有没有吃饭啊？”


  “啊啊，婆婆，我今天吃过了。”村正笑着侧过身。她把自己从带路的位置往婆婆那边多挪了半步，然后抬起手搀住老妇人的胳膊肘，“今天要去哪里？”


  “今天集市上听说有人卖一些小玩意，我给我家伢子去买点回来。”婆婆把菜篮换到另一只手上，顺势拍了拍村正的手背。她的手掌瘦得能摸到骨缝，但拍下去的力道是那种非要让你知道她在心疼你的力道。


  “那婆婆去吧，有什么我能做的吗？”村正弯下腰开口。


  “没事没事，你好好的就好了。”婆婆摇摇手，“婆婆我先走了，不给你添麻烦了。”


  “好嘞。”村正把腰直起来。直腰时她的眼角还留着刚才弯腰时的笑纹。


  婆婆走后村正朝着身后正在看她的几人摆了摆手。摆手的幅度不大——是从手肘往下画了半道弧线，指尖在空气中点了点。“愣着干嘛？走了。”


  立香用手指的侧面戳了戳士郎的上臂外侧，士郎低下头看她，她扬起下巴朝他眨了下左眼。他们的嘴唇都没动，但脑子里想到了同一件事：村正在这里很受欢迎。


  村正继续带路，来的人越来越多。密度不是从街口往城主府逐渐减少——是越往住宅区深处走认出她的人越多：一个穿着素色和服的太太从巷口探出半个身子，手里还捏着正在缝补的针线。“村正酱这段时间出去干什么了？”


  “处理一点事情呢太太。”村正偏头回话。'

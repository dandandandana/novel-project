content: '玛修等到立香收拾完那个不听话的从者之后把盾从脚边拔起来。她看向士郎，士郎后脑勺那头红毛被早晨的冷空气定型成几撮翘往不同方向的乱茬，他正反手用掌心拍着自己背上的泥点——那些泥点是立香把他按在地上时从他自己的风衣上蹭上去的。


  他拍完之后没有看任何人，默默地退到了队伍最外侧。


  玛修端着手里的碗，碗底还剩一层没刮干净的木屑渣。她把碗搁回灶台角上，走过来时用只有自己能听到的音量嘀咕了句“想吃言峰前辈做的饭了。”


  立香站在茅草屋门口把自己的衣领整了整，然后她拍了拍手：


  “走吧。”


  她没有特意看士郎，但她迈出第一步时脚底碾碎的枯枝恰好是士郎昨晚守夜时搓到坑里的那一根。


  士郎选择了在外侧侦察。他踩上第一根树桠时靴底的湿滑树皮让他停顿了半拍——前夜的露水还没被正午的太阳烤干，他整个人在树冠之间跳跃，红发在松针丛中时隐时现。


  他的魔力感知没有全开，脚下的树冠嗖嗖往后掠，风把他的风衣下摆吹得贴在腿侧。他跳上一根较粗的松枝正要借力往前蹬——然后他停下了。


  一个女人飘到了他身边，字面意义上的飘。


  祁荒的道袍下摆掠过他右侧的松针丛，没有沙沙声，没有布料摩擦枝干的闷响，连她落脚的那根松枝都没有往下沉哪怕半寸。


  她整个人像被风吹起来的落叶一样停在士郎右侧，道袍的袖子在无风的状态下自己垂着，她的嘴角已经提前勾好了笑容。


  “哦吼？为什么离你的御主这么远？”她的声音从士郎右耳廓外大概一掌宽的位置传过来。这个距离刚好能让他听清每一个字，又刚好让他没法假装没听见。


  “.......”


  士郎没有回头，他继续往前跳，祁荒也跟着飘过去。她的道袍下摆穿过松针丛时那些松针连晃都不晃，像是她的布料不是穿在身上的东西而是画在空气里的一层薄墨。


  “嗯哼？没想到你很难以处理这种情况啊——”


  “........”


  士郎的靴底踩上湿滑树皮，祁荒微微勾唇，这个勾唇的角度让她嘴角的笑纹往眼窝方向挤了半寸。


  “沉默？喜欢沉默？”


  士郎停住了，整个人从高速跳跃转为静立在树冠的枝桠分叉处：


  “你到底想说什么？”他强忍着把脾气往下压了两度才开口，“你这个尼姑，来这找我的乐子吗？”


  “对啊——”祁荒的笑声从鼻腔里漏出来，她站在一根细得按理说承受不住她体重的松枝上，那根松枝被她踩着往下弯了一寸，但她的身体纹丝不动。


  “毕竟逗你这种人很有意思啊——”她把最后几个字用舌尖弹出去，弹完之后那双半眯的眼睛盯着士郎的侧脸，等他反击。


  士郎闭上了嘴。彻底的闭上，他完全不打算再理祁荒了。他从树冠上跳下去。他走到立香身边。


  “怎么了？”立香偏过头看他，“出问题了吗？”


  士郎沉默了一下，然后他开口，开口时难得颓废——眉尾往下压了半寸，声音比平时低了整整一层：


  “不——并没有，只是——”他顿了顿，把后面的话咽进喉咙里搅拌了一下再吐出来。“有点不知道怎么办。”


  “嗯？你不是很擅长处理女性相关的事情吗？”


  “前辈还在生气啊........”


  玛修在一旁弱弱地接了一句，她张开嘴唇时先往立香那边扫了一眼，确认立香没在瞪她，然后才开口。


  立香眉头一挑，她看着士郎，嘴角没笑但眼眶下方那圈皮肤微微收紧了。“嗯哼？士郎难不成不是么？”


  “御主——”士郎叹了口气，“我错了。”


  “不你没错。”立香的回应被她说完之后，她把脸扭开，继续往前走。


  “真是吵闹啊，还有一股酸腐的味道。”村正扭过头把话从齿间丢出来。她丢完之后转回去继续带路。


  “真是青春啊——”祁荒从树冠上悠悠地飘下一句，然后她顿了顿。


  “不对，这时候他是不是都已经三十多了？在埋葬机关待久了心态都年轻了啊——”


  士郎没回。他的脚程稳稳地保持着最外侧的位置，离立香大概七步远。


  几人走了半天。头顶的太阳纹丝不动地钉在正午的位置。日轮从出发到现在没有往西偏过哪怕一个指节的角度。地上的影子全都缩在每个人的脚底——被正午的太阳压成一块贴在地面上的灰黑斑块。


  立香起初还能维持队形，后来她的脚底板开始发烫，她伸手扶了一下玛修的肩膀，手指攥在玛修肩甲的边沿借力往前撑了半步。


  玛修没说话，只是把步子放慢了半拍让立香的握力刚好能跟上自己的节奏。就在立香的膝盖开始打弯的时候，村正停住了脚步。


  “到了吗？”立香撑起身子。她把扶在玛修肩上的手往下滑了一寸，指腹按在玛修肩甲的铆钉上。


  那座城镇从天照金地方向的地平线上浮出来——先是木造屋顶的轮廓线，然后是町屋之间升起的炊烟，然后是石板路在正午阳光下反射出的灰白斑块。'

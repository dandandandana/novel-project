content: '“看样子交涉失败了。”德川家光的视线从立香脸上移开，慢慢扫过玛修架着的盾牌，再扫过士郎攥着村正后领的那只手，最后停在被士郎拽住的千子村正身上。他微微低下头，像是在回忆一个很久远很久远的名字。


  “那名剑客呢——是叫千子村正，对吧。”


  村正的肩膀在“千子”两个字之后动了一下，她身体深处的某根弦被谁拨了一下，震动从脊椎传到了肩胛骨。


  “什么。”村正喃喃开口，她的声音从口罩底下漏出来，每一个字都被她咬得发颤，“你，不记得这个名字？”眼眶里蓄着的东西在那一刻从亮变成了滚烫的铁水，她的手指开始在刀柄上收紧。


  “你怎么敢。你怎么敢不记得的。”


  德川家光继续往下说的时候用的语气轻飘飘的，像是在翻阅一本和自己没有任何关系的族谱——“千子，并不是很出名的姓氏和家族吧。我为何……会记得呢。”他把“为何”两个字拖了一点尾音，尾音上扬的弧度正好踩在村正最后一点理智的边缘上。


  千子村正把太刀往下一砸，刀身磕上自己脚边的碎石，金铁撞在石头上炸出一声极脆极尖的响声。


  士郎被这声响震得松了手，村正拔腿冲出去，脚底的碎砖被踩得往四面弹，她冲向德川家光的时候羽织在身后被扯成一面灰旗。


  “士郎！”立香的喊声还没落下去，士郎的手上已经冒出了一杆黑色的长弓。弓身从他掌心里涌出来的投影魔术成型——弓弦上搭着的箭矢被魔力填满了尾羽的部分。他弯弓，弓弦在他的指腹底下被拉到最紧，然后放开。


  弓弦弹回去的时候嗡了一声，箭矢破开空气的声音比弓弦更尖。村正和箭矢几乎同时抵达德川家光的面前，大戟被他横过来挡住了士郎的箭，箭尖撞在戟杆上炸成一团碎裂的魔力块。但村正把太刀斜着劈了下来，这一剑从下面往上撩，刀刃从德川家光的腹部斜切上去，切过他的胸腔，切过他的肩膀。爆炸在刀刃切过最后一个部位的时候轰然炸开。


  德川家光的身体像一只被吹破的气球一样向外膨胀了一下，然后碎片被裹在一团银色的光膜里翻涌而出。士郎在村正面前投影了一块小型的盾牌，盾面斜着挡下了爆炸掀起来的冲击波和碎肉。村正被这一炸逼得往后连退了三四步，她的太刀还举在半空中，刀尖上还在淌着什么。


  “你作什.....”村正刚转过头——话音断了。


  德川家光的身体碎片在半空中没有落下去。那些碎片被银色的光裹住了。光从碎片内部涌出来的，光越涌越多，把血肉、碎布、骨头的轮廓全部融掉了，然后在半空中重新凝聚。不是重新捏成一个人的形状，而是放大。


  银色的光从中心往四面膨胀，越来越大，越来越高——直到它长成了一个头颅。一个罗汉的头颅。巨大到足以俯瞰整片废墟。银白色的素衣裹着头颅的表面，但那不是布，是月光在他身上结了一层壳，像风化过头的石像表面，动一下就有银色的粉末从上面簌簌往下掉。


  头颅的面孔不是世尊，不是菩萨，比佛更冷硬，比罗汉更像石头，而眼眶里是空的，只有两团月光在幽深的空洞里缓缓旋转。


  “这是什么。”立香喃喃开口，然后手一拍腕上的通讯器，“所长！”


  奥尔加玛丽的声音从表盘里断断续续地挤出来，电波的杂音比平时大了不少。“啊啊，正在探测灵基……达芬奇。”


  达芬奇的声音在几秒后接了进来。隔着电波干扰，她的声音像是一层又一层的膜被捅破之后才勉强抵达了这边。“立香，有麻烦了。这家伙的灵基波动，不同于神明——类似于——怎么说呢，像是把好几个神明的灵基拆散了重新搅在一起的集合体。它的灵基规格，极高无比。不是单一神能比的。而且……”她又停了半秒，“似乎是有很多人在往里面供什么东西。供给量非常大。”


  话音还没落完，正面就涌来了一道震耳欲聋的撞击声，裹着银色僧袍的罗汉头颅张开了嘴。嘴里没有任何语言，只有一道银色的月光波动从它的口腔深处涌出来。波动的形状不是光束，是一圈一圈往外扩散的银色涟漪，每一圈涟漪的边缘都亮得看不见涟漪本身的厚度。第一道涟漪朝着立香的方向轰过去。


  士郎拔剑劈开朝他飞来的月光，他的剑在触到月光之前已经提前切进了波动的侧面，从边缘斜着往上削，把涟漪的弧度劈成了两截，截断的月光碎片从他两侧飞过去砸在后面的断墙上，砖石被砸出两个焦黑的圆坑。村正被月光逼退了三四步，她咬了咬牙，“法相。”


  她的太刀刀身上忽然燃起了火焰，火焰沿着刀脊两侧的铁纹一直烧到刀尖，火苗在刀刃上跳了一下，然后整柄刀都被火焰裹住了。她把燃着火的太刀举起来，一剑劈开朝她轰来的月光。


  “这就是月读命金地的法相之一。”她盯着那颗浮在半空的罗汉头——然后声音陡然拔高。


  “斩尽三千繁华梦！”'

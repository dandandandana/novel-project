content: '“喂喂你这个家伙。”士郎偏过头去看她的时候，村正已经举着那柄烧红了的太刀一脚踏碎了脚下的石板，整个人朝着罗汉头飞了出去。


  “妙法村正！”


  刀落。


  刀身上的火焰在接触罗汉头的瞬间全部收进了刀身里，只留下刀体本身。刀体是红的，红到发白，发白到近乎透明，烧红的刀身触上冷硬的月光凝壳，温度差让两者的接触面在一瞬间炸开了蒸腾的水汽。然后剑光继续往下切，切过了罗汉头的左半边面孔，切过了它空荡荡的眼眶，把眼眶里旋转的月光削掉了一半。


  “素净万千，秩序百面。”梵音从罗汉头内部传来。不是一个人的嗓音，是成百上千道嗓音同时在不同的音高上发声，每一道嗓音都在念同一个句子，但高低错落叠成了一道密不透风的音墙。然后月光从墙里涌出来，月光从罗汉头碎裂的眼眶里重新聚拢，从它被切开的半边面孔上重新流出——然后汇成一道完整的月光直直地轰向村正的剑光。


  剑光和月光在废墟的正上方撞在一起。撞击点上的空气被压成了肉眼可见的一层透明的膜，膜往外鼓了一下——裂了。冲击波从裂口中涌出来拍在下面的废墟上，碎石被崩起来飞了好几丈高，尘土和瓦砾在半空中搅成一团浑浊的龙卷。龙卷散掉之后，两者的光都没剩下。烟尘落了下去。村正后退一步，她拄着太刀，刀尖插进脚边的碎石缝里支撑着她还没完全垮下去的身体，小腿在发着细密的颤抖。


  “宝具吗。立香。你们那里已经打起来了？”奥尔加玛丽的声音从通讯器里传来。


  “差不多吧，我们这边遇见的一个人用了类似于宝具的东西——”立香把通讯器凑近嘴边，眼珠子还钉在浮在半空中的罗汉头上。


  “啊啊啊，那个已经完全是极高等级的对城级别的宝具了。立香，情况很差劲。”达芬奇的声音里已经没有了一贯的轻松。


  “总而言之，是很难缠的对手是吧。”立香的视线从罗汉头身上移到了士郎脸上，“士郎，能速战速决吗。”


  士郎站在废墟里。他的后背对着罗汉头，面前是立香和玛修还有拄着刀的村正。他看了一眼罗汉头浮在半空的高度，然后扫了一圈周围的城墙。城墙那头密密麻麻的民居还在太阳底下安静地蹲着，烟囱里冒出来的是炊烟，不是战火。


  “御主。”他开口的时候语气很淡，像是在分析某个战术案例，“我不建议在这里打起来。”他走到村正的身边，手掌翻开，指间投影出几根黑键。黑键的刃尖在投影完成的瞬间亮了一下，他的脸对着那团巨大的银色头颅，脸上什么也没搁，眼珠子动得很慢。


  “这里不是死城，还有很多人，你旁边那位能动吗。”立香问道


  士郎看向村正。千子村正拄着自己的太刀，刀柄被她的双手攥得紧紧的，但攥刀的人已经累得肩膀往下塌了。被烟尘和汗浸透的灰色羽织贴在她背上，红发散成好几缕粘在羽织的布料上。


  她刚才劈出妙法村正的那个姿势还没完全收回，但她的小腿在颤抖，膝盖往前微微弯着，随时可能跪下去。


  “看样子不能。”他挥剑，剑身平着扫出去，把罗汉头从侧方轰来的两团月光劈碎了，碎月光的残片掠过他的肩头打在地上，地砖碎了一块。“要怎么做。”


  立香把手往下一挥：“把村正丢给玛修，我们撤退。”


  “收到。”士郎一只手拎起千子村正的后领。千子村正的身体在他手里晃了一下，她的脚离了地。村正的嘴张开要叫喊，声音还没出喉咙就被士郎扔出去的弧度哽成了半截气音。他把红发少女往玛修的方向一推，村正的羽织在半空中飘起来，整个人朝着玛修的怀里落去。


  玛修接住村正。她用左臂的盾面托住村正的后背，右手从底下捞起村正的腿弯，把村正整个人夹在怀里。村正的太刀刀尖垂在地上拖了一小截，在碎石上划出断断续续的痕迹。


  玛修低下头，嘴唇靠近村正的耳边，压低了声音：“村正小姐——抱歉。请你忍一下。”然后她单手将立香也揽了过来，立香的侧腰贴上了玛修的盾沿。玛修把两个人抱起来，盾牌重新架好在身前。


  “千子村正小——哎呀算了！告诉我们去哪里！”立香在玛修的臂弯里扭过头看着村正。


  村正的脸贴在玛修的盾沿上，红色的头发从玛修的手臂间漏出来垂在半空中。她咬了咬牙，然后开口——


  “往南边。那边是天照的金地，和这里不一样，是安全的。”她的声音被跑动时的颠簸震得断断续续的，但每一个字都咬得清清楚楚。


  “啊啊，出发了玛修！士郎！给我好好掩护。”立香的声音从玛修开始跑动的那一刻撞破了空气。玛修的靴底碾进碎石，一步下去碾碎了好几块残砖，她带着两个人朝着南边冲了出去。'

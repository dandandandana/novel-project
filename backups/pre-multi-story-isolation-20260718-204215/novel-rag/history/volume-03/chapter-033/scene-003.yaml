content: '吉尔伽美什摇摇头。她撑在天舟边缘的手收了回来，天舟在她离开的同时自己缩小成一道金色的线然后消失了。


  几个人一同落到地面上之后，村正在收刀时把太刀的刀鞘朝腰侧扣了一下，金属锁定的咔嗒声在战后突然安静下来的废墟上显得格外清脆。


  立香开口问：“祁荒呢？”


  村正听到这个名字之后没有马上回答：


  “大概率是死了。”


  “哈？”立香一愣。她张着的嘴没能立刻接上话。“什么意思——”


  村正把太刀完全收入鞘中，然后一边看着立香的脸一边把她和祁荒潜入主殿后遇到弥勒的事情简要地说了一遍。


  立香捏着下巴听完了村正的话。她在村正说完之后没有立刻开口，而是把刚才战斗中看到的某个画面翻了出来。


  “怪不得天空刚才有粉色泡泡。原来是祁荒的宝具啊。”


  “那是她最后的抵抗了。”村正说着，语气在“最后”两个字上轻得几乎被风吹散了。


  立香把手从下巴上放下来：“祁荒死在了弥勒手上吗？”


  立香想了想。她的嘴唇抿了一下，下巴朝上抬了抬，然后开口说的是一个她显然已经在刚才那短暂沉默里决定下来的事情。


  “到最后肯定要和弥勒碰一碰的。我们会为祁荒报仇。”


  “我就知道你会这么说。”村正说这句话的时候没有看立香。她看着自己手中的太刀，刀鞘上残余的黑炎正在她指尖拂过的地方慢慢褪去。


  村正身上的青色火焰在这时从她的肩膀和腰侧朝外涌了出来。青焰不再是刚才在主殿里那样狂涌的形态——现在它像是水面上轻轻铺开的一层浮光，从村正的身体表面朝外流，流过了伊耶那美和吉尔伽美什站着的位置。


  青焰触碰到她们身上那些被须佐之男雷暴和月读命金地扭曲秩序造成的伤口时，焰尖在皮肤表面停了一瞬，然后被伤口自动吸了进去。


  伊耶那美愣了一下。她低头看着自己被青焰填满的伤口——不是被覆盖，是青焰在伤口内部顺着每条撕裂的创缘朝外扩散，扩散过的地方伤口边缘的颜色从暗紫褪成淡粉然后继续褪回皮肤的本色。


  她感受着来自青色火焰的柔和波动，声音里少见地飘出了一丝不确定。


  “这是月读命金地的禊祓？”


  “是。”村正应道。她吐了个单字，音调平得和说自己名字一样。


  伊耶那美看着自己身上正在逐条消退的伤痕，又看了村正一眼。“你做的不错——村正。”


  “哼。”村正把脸别开了。她别开的角度并不大，刚好够让自己嘴角位置的表情不被伊耶那美看到。


  玛修将盾牌收了起来，黑色的巨盾在她手中从作战形态折叠成收纳模式，盾面上的迦勒底纹章在收纳时闪了最后一次光然后暗沉下去。她跑到立香身边时鞋底在碎石上踩出了一组速度很快的细碎脚步声。


  立香正要跟伊耶那美确定信息。听到这组脚步声从侧方越来越近，她转过头。粉发少女已经跑到她面前两三步的位置停下了，额前的刘海被刚才跑动的风掀得有点乱翘。


  立香立马凑了过去。她双手扶到玛修的肩膀上，然后她开始东看看西看看。视线先从玛修的脸扫到她颈侧没有被装甲覆盖的那截皮肤，再从锁骨上方扫到肩膀和手臂，一路往下快速扫过了膝盖和脚踝。她的眼珠在眼眶里来回转了两圈之后终于停了。


  “玛修！你做的很棒！”


  “前辈？”


  玛修一愣。她被立香这么猛地冲过来一检查自己先有点不好意思了。她挠了挠头，挠的时候小指不小心勾到了护目镜的带子，带子啪一下弹回去打在额头上，她被弹得嗯了一声，然后手放下来继续把话说完。


  “我的战斗方式在他们空中是太不占优势了，完全没帮上什么忙——只是最后用了一次宝具而已。”


  “那也很棒了！”立香双手在玛修肩甲上按了一下，按得玛修的肩膀朝后晃了半寸然后又弹回来。


  士郎看着几人，他看了一眼立香还在玛修肩甲上按着的双手，看了一眼村正正在收刀的背影，然后默默地走到了吉尔伽美什的身边。


  他站到自己的养母身前时开口的语气和平时汇报安全情况一模一样。


  “感觉怎么样？”


  “嗯？还好就是了。本王不相信千里眼是对的。”吉尔伽美什一开口声音里的疲态被语速藏住了，但说最后一个字时气息比平时弱了一截。她身侧的一缕金色涟漪在她说话时自己漾开，一个瓷质的药膏从涟漪中掉出来，士郎伸手接住。


  “战胜弥勒大概不是全部。”


  “好好，现在没必要讨论这些了吧。”士郎掀开吉尔伽美什肩上的衣物，把药膏的封口拧开。他用手指抹了一小块涂在她肩侧被雷电灼出的焦痕上，涂的时候动作很轻，但被涂过的皮肤还是微微朝外翻了一下。


  “哼。那本王可要催促你找女友了。”吉尔伽美什淡淡地说道，“等这次事件结束，你要给本王——”'

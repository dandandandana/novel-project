content: '“吃了一发月读命的光炮导致的。”士郎背着她说话时，背上的肌肉在声音震动下带得伤面也微微颤动了一下，“他的逆转秩序的能力让伤口很难愈合——还好卡桑有治愈的药。”


  “忍着点！”立香的声音忽然拔高了半度。她用手碰了一下伤口的边缘，指腹在快要碰到最外层那圈还在扩大的嫩肉时自己缩了半寸。


  然后她把药罐拧开，沾了药膏的手指重新靠近那片新伤面。“对不起 .......我的决策也有问题。如果我当时能够吸引一些注意——”


  “藤丸立香，你是御主。”言峰士郎淡淡地开口，“我说过的话，我希望你能够记住。”


  【我的安全对你来说最重要吗？】


  立香在心里翻出了这个念头，她沉默着上药，药膏碰到嫩肉时他的背部肌肉从肩胛到腰侧同时硬了一下然后又自己松开了。


  “那你可要快点好起来——”她把这句话说得很慢。指尖从伤口的中央朝外抹开时，她的指甲边缘不小心碰到了一处刚被药膏覆盖的嫩肉，手立刻缩了回去又马上补回来，“晚上我还要带你去问伊耶娜美情报。”


  “好的，我的御主。”'

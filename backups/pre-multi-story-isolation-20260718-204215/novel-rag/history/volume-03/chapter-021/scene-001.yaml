content: '立香听着吉尔伽美什刚才那句“本王是作为一个母亲来的”，把手里那块已经焐热的毛巾从士郎额头上拿下来放进水盆里。


  她涮了涮毛巾，水滴从她指缝间落回盆中发出沉闷的滴答声：“我知道了——吉尔茜。”


  她把毛巾拧干叠好重新搁在士郎额前，然后转过身重新坐回床边那张小凳上。她的后背靠上硬木靠背时发出极轻的一声磕响。


  “如果你真的一点感情都没有，只是为了守护人类的那种冷血无情的怪物——”立香把尾音拖了半拍，然后朝吉尔伽美什笑了笑。


  她的笑软到橘色眸子里那份锋利全都收了起来，“那我可要质疑我的眼睛了。”


  吉尔伽美什的眉梢往上扬了一小截，她把搁在膝头的手指轻轻敲了两下，袖摆随着动作滑下来遮住了她腕骨上那道浅疤。


  “我好歹和你待在一起几年了嘛。”立香把交叠在膝头的手摊开又合拢，语气里那份故意的轻松像是在搅一杯已经凉掉的咖啡。


  “哈哈哈哈——”吉尔伽美什从唇角溢出的笑声在安静的疗伤间里轻轻落落。她把捏着空酒瓶的手指转了一圈，瓶底在膝盖上轻轻搁定。


  然后她歪过头，赤色蛇眸在午后的光线里眯了起来：“小看你了——”


  立香无奈地笑笑，她把那份被认可的高兴压在舌底，然后把肩膀往前倾了一点。小凳的四只腿在她挪动时和木板地轻轻蹭出一声短促的摩擦声。


  “这个特异点，你有什么思路吗？”


  “哦？”吉尔伽美什把空酒瓶放在一旁地板上，和其他空瓶排成一排。然后她捏着下巴，指腹在下颏骨上轻轻按着。


  “本王认为伊耶那美的话是可以相信的。”她把视线从地上那排酒瓶上收回来，落在立香脸上，“她毕竟是黄泉津大神——而且那份试炼也算是一个契机，某种意义上的。”


  “我也这样认为。”立香点了点头。她把手背翻过来看着自己手背上那道圆加十字的新令咒，令咒在午后的光线里泛着淡淡的红色色泽。


  “但她是真的——打算置我于死地。”


  “所以？”吉尔伽美什把捏下巴的手指松开，掌心向上摊开，然后五根手指微微往里一拢，“你打算利用这个怎么敲竹杠呢？”


  “自然是索取更多的利益了。”立香抬眸看着吉尔伽美什。


  她的语气从刚才的轻软一点一点变回那个战场上做决断的指挥官声调，每一个字都咬得干干净净：“然后我还要问问士郎怎么样——”


  “本王和你想得差不多。”吉尔伽美什把手放下来，两条修长的手臂交叠搭在小凳扶手上。


  她盯着立香，那双看了无数战场、无数毁灭与重建的赤色蛇眸在立香脸上停了一段时间：“你成长了不少啊。”


  “欸？”立香愣了一下，那份夸奖完全没有预兆，像在战场上忽然被人从侧面拍了一下肩膀。她的嘴巴张着一个小口，然后两边颧骨上的皮肤泛起一层极薄的粉红。


  “有吗？有吗？”


  “本王可是一直看在眼里的。”吉尔伽美什把手从扶手上抬起来，伸出手，然后那只手落在立香的头顶上，掌心压住她的刘海拔了拔，指腹在她的发根上揉了揉。


  立香的脑袋在吉尔伽美什掌下缩了一下。


  她往后一缩，后背直接撞上了士郎躺着的木床边缘，床架发出一声闷沉的木料震动声。她赶紧转身伸手轻轻拍了拍士郎的被角，从而确认他没被震醒，然后转回来瞪着吉尔伽美什。


  “你怎么？你怎么和士郎一样揉我脑袋？！”立香的声线拔高了半拍，手还在自己头发上压着被揉乱的那一撮。


  “这是你们家遗传的吗——？！”


  吉尔伽美什眨了眨眼。她的手掌还悬在半空中，五根手指还没完全收回来。然后她愣了一下，“什么？”她把悬在半空的手一转，掌心翻向上像是在回忆什么。


  “哦？当时士郎还是小正太——揉他的脑袋很舒服的。红色的短发软乎乎的。”


  “小正太言峰士郎——？”立香瞪大了眼睛。然后她的嘴巴张着，脑子里啪地一下展开了一幅画面——小小的红发男孩被穿着现代常服的吉尔伽美什按着脑袋，那头她看惯了的高大男人的头发在另一个时空里软软地服帖在吉尔伽美什掌下。那双琥珀色的大眼睛往上翻着，嘴巴鼓着半口气很不服气的样子。


  立香的表情在脸上凝结成一团介于呆滞和恍惚之间的东西。“啊——你真有口福啊——”她过了好一会才把这句话从喉咙底翻上来。


  “嗯？”吉尔伽美什把手放下来搁回膝头。她歪了歪头，和服领口跟着滑了半寸。“士郎做的饭确实也很好吃。”


  立香还没来得及反驳，吉尔伽美什已经把话接上了，“没关系，以后时间还很长。”然后她把交叠的手臂换了一面，“而且他在迦勒底真的很在乎你的口味吧。”


  立香的脸腾地烧了起来。她把手在面前飞快地左右摆了摆，手指张开又并拢的动作仓皇得像在赶一只不存在的飞虫。


  “停停停我知道了——”'

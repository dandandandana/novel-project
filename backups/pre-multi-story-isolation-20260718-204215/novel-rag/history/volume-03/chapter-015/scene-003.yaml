content: '立香倒吸了一口凉气。她正想开口把村正拉回来——她清楚如果这句话真的把伊耶那美彻底激怒了一切都没有回转的余地。


  但伊耶那美比她先开口了。


  “好啊。”伊耶那美说道这句话时脸上的怒意褪了一层。不是消了，是被换成另外一种更凉的东西，她看着村正的眼睛说出一句让整个正厅所有声音都消失的话。


  “我可以同意你和迦勒底的人，前往月读命去讨伐德川家光。”


  村正的身体在椅子上僵住了一拍，她把自己从刚才愤怒的顶峰拽回来。


  “但是不能以天照命金地的名义。”伊耶那美伸出食指在桌沿上轻轻一点，“我也不会对你有任何援助。”


  “而且——我需要对迦勒底的人做出判断。”


  “判断？”立香把眉头往上一挑。她感觉到了——伊耶那美刚才沉默的那一刻不是在生气，是翻过了一个早就叠好的分岔口。她挑眉不是惊讶，是在印证自己的猜测。


  “您的意思是？”


  “欲得大道，先要炼心。”伊耶那美把搁在下巴上的手从脸上移开搁在桌面上。她的阴阳双瞳同时盯着立香，左眼的暖光和右眼的冷光在这个距离里把立香的整张脸都笼罩住了。


  “你既然想要拯救你的世界，又何尝不是一种大道呢？”


  “我这里有一种炼心法。只要你能过去，我就会让村正协助你。”她停了一拍，用这一拍把赌注从她那边的筹码堆里再推了一张出来。


  “等到德川家光死后，我会在明面上支持你，并且告知你们圣杯的位置。”


  立香霎时间感觉到整个正厅的空气变了，她脑子里所有碎片在同一时间啪地拼上了——伊耶那美绝对是有计划的。从村正带迦勒底进门那一刻，从伊耶那美开始在晚饭桌上讲故事，从她似有若无地耍着村正的脾气说起，从她盯着村正吃饭再敲碗催她吃完，每一步都对着她一步步走进去。她从不把所有的筹码一下铺上，是在一点点加注。


  村正的感情是真挚的，但村正不知道她被利用了。


  士郎的手从桌面上挪过来落在立香的肩膀。


  他看着她。没有说一句话，只是轻轻点了点头。立香看了看士郎，看了看眼眶还是红的但已经把刀重新抱在胸前的村正，又看了看正朝她微微点头的玛修。


  她把那个已经看清的棋局在脑子里重新扫了一遍——伊耶那美设的网，村正真正的仇恨，迦勒底必须拿到的圣杯。然后她看向伊耶那美。


  “好，我答应你。”'

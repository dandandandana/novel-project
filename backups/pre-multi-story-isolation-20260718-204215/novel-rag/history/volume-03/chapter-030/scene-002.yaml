content: '罗汉迫不得已，双锤砸到盾牌的边缘上，砰的一声闷响。玛修趁势将长剑插入盾牌，整个人再次合成巨斧。她抬眸看向罗汉，空气凝滞了那么一刻。


  “解放斩！”


  巨斧被她从斜下方朝上斩去。大量魔力蓄在斧刃上，纯白的魔力刃从黑铁中渗了出来，在斧刃表面裹了一层极密极薄的光膜。巨斧顺着玛修向上斩击的惯性轰出画面，整柄斧子旋了起来，斧刃一瞬之间从罗汉的腰侧划到了他的左肩。罗汉往后猛退，双锤脱手掉在地上，砸出两个浅坑。


  玛修没有放过他的打算。她把盾牌拆下，整个人朝倒飞出去的罗汉追去，脚底的石板在她蹬过的每一步都粉碎着下陷又立刻被弥勒的术式修复。


  罗汉盯着她追来的路线，把喉咙撑到极限，吼出一声长达数秒的巨吼。那声音不止是震破耳膜——它直接撞进了玛修的脑子里。她的太阳穴像被铁块砸了一下，步子被硬生生绊住，整个人晃了一晃。


  后方的法相趁她迟滞的这一瞬，权杖朝地面全力一敲，一整面巨大的金墙从玛修面前立了起来。


  玛修吐出一口血，血丝挂在下巴上还没滴落，她一剑挥出，将金墙纵向劈作两半。


  碎开的墙体正往两边倾斜还没倒塌，她已经穿过了裂隙，在行进的途中将长剑再度插进盾牌。


  【正好充能......！】


  盾牌和剑咬合的时候亮起一道自盾心朝外扩散的金纹，玛修双手握紧斧柄，朝罗汉的方向冲过去，步子越来越快。


  罗汉的双锤已经飞回到他手上，他举锤在空中交击，双锤正面撞出一声沉过之前任何一次碰撞的隆响，整片地面的重力一瞬间翻了数倍，玛修整个人朝下被摁了半尺，肩甲上的魔力光被挤压到几乎熄灭。


  她牙尖狠狠咬下，牙膛发出一声细微的闷响，然后朝罗汉继续冲去，如同那些压在她身上的额外重力好像根本不存一样。


  罗汉身后的法相见她逼近，猛然挥动双手，整片天空顿时从深黑翻成了金色——只是天空上方压着一层厚厚的黑红色火云，让这片金色被捂得透不出多少光亮。


  “超过载解放斩！”


  玛修一斧子挥出。斧刃上的魔力白膜在触及罗汉胸甲时朝内收缩了一瞬，然后朝外反涌入罗汉体内。罗汉吐出一口金血，那些血在半空中还没落地就被余波蒸干了。


  他的身体从胸口开始朝外一圈圈裂开——金漆表壳翘起，壳下的结构在压力下逐一崩断。


  他用最后一点力气朝空中把金锤掷了出去。金锤扶摇直上，砸进头顶那片黑红色的火云，云层被豁开一个口子，金色的月光从破洞里漏了下来。然后黑炎立刻翻涌过来重新封住了伤口。


  罗汉的身子彻底碎裂。


  法相用权杖朝那股席卷而来的斧刃余波一杖点去。权杖顶端的金纹亮到了极限，余波在杖前被一层一层的金色卸到水平方向，大地震了一下，余波就此被化散开净。


  但法相不敢稍有放松——金字再度从他周身现出，密集得看不出间隔，朝着玛维修方向轰去。


  玛修的脑海里寒光一闪，她霎时间抬头。


  空中。


  那片被金锤砸开的云洞还没完全封死，金光正从裂缝里一束束落下来，而她举盾挡向天空的那个动作正好把整个正面暴露给了从水平方向轰来的光炮。


  【坏了！】


  她的眼角扫到光炮正朝自己撞过来。然后一匹黑色的梦魇之马从侧面冲入她的视野，身躯横在她与光炮之间，硬生生吃下了那几发足够致命的光炮。


  梦魇马的鬃毛在炮击中被掀得朝后倒飞，但她四蹄钉在地上一步都没退后。


  法相透过黑色烟雾看见了眼前的人。


  玛修手中持着一柄巨大的巨炮，炮口正对着他的方向，整柄巨炮内部的魔力正不断积蓄着，积蓄到连炮管外壳都在微微发光。


  没有立香的英杰之帜，没有来自御主的支援加成，她自己要一个人解放这发宝具，只能解放大约三成左右。


  “迦勒底之刃。”


  玛修念出宝具真名的时候声音不高，空气一开始只是轻微地震荡了一下。


  然后轰的一声，战斗的地点从玛修的站立点朝外被整个掀了一圈。


  巨炮射出的一发光束不宽，比法相想象中的宝具要细得多——但它快。


  快到法相权杖挥出的障壁在成形之前就已经被光束钻透。


  一炮轰入法相体内。


  法相张了张嘴，只来得及从喉咙里挤出半个音节：“什——”


  巨量魔力的灌注让整片空间从他站立的位置朝内急剧收缩，空间塌成了一团拳头大的黑点。


  那黑点悬在半空中顿了一下，朝外翻开，露出白芯，然后在白芯炸开的瞬间朝四面八方轰出密集的空间碎片。法相被这发不完全的迦勒底之刃从内部拆散，金血炸开一大滩，溅在还没从地坑里恢复过来的石板上。


  玛修喘着粗气，魔力被这一发宝具抽得干干净净。


  她用巨炮撑着身子，炮口朝下抵住地面，整个人靠在炮身上，肩膀随着每一次出气都在塌下去又撑起来。她把头扭向一边。


  那边是金发金眸的少女。'

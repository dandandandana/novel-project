content: '“他们比我们早到这里。”立香把双手交叠搁在胸前然后靠上了旁边的廊柱。她后脑勺枕在柱子上时木柱发出一声极轻的木料承受重量时的闷响，“在期间接触了伊耶那美——不过好消息是，Alterego并不会跟随我们去月读命金地。负责镇守天照命金地。”


  玛修想了想，有点犹豫的开口：“前辈？也就是说——如果不是Alterego他们，那么伊耶那美大神不会陪我们.......”


  她把话头停住，眼睛里的困惑从瞳孔中央往外漫开。然后她问出了那个对上不的地方：“为什么伊耶那美大神会放心Alterego他们驻守天照命金地？”


  立香把抱着的手臂换了另一面。然后她的嘴角往上翘了一下：“大概是Alterego长得和士郎一样吧。”


  士郎偏过头瞥了立香一眼。他的琥珀色眸子落在立香脸上停了半拍，那个半拍里没有委屈也没有抗议——只是平平地看着她，然后用那种他说任何话都听起来像是在陈述事实的语气接了这句话：“确实是一模一样。”


  “嗯——”立香嘴角高高的勾起，她把视线停在回廊的竹影里，橘色眸子盯着竹叶在地上晃动的影子看了好一会。那双眼睛没有在看竹子——是在看她脑子里刚才从出殿到现在攒下来的那一堆存疑的碎片。


  千子村正。披着伊耶那岐神话外壳但效果完全不一样的拔楔。伊耶那美明知试炼会让立香爆体而亡却仍然让她去。隐藏盟友Alterego。天沼矛，黄泉神，在殿里批折子却对“天照命无主”这件事一直睁一只眼闭一只眼。这些碎片在立香的脑子里各自转着各自的速度，然后慢慢地、一块一块地开始往同一个方向靠拢。


  她把手从胸前的臂弯里松开放下，转向玛修摆了摆然后示意她汇报刚才得到的信息。


  玛修把刚才在洗剑池边看到的拔楔、村正出水后身上缠绕火焰化作锻造服、祁荒说村正不对劲并分析拔楔是解放原有力量、以及祁荒在说出“还有我看不出来的东西”之后身形消散留话说出发时通知她这些事情，一件一件说给了立香。她在说的时候声音平稳，但说到“祁荒前辈说竟然还有她看不出来的东西”时明显带了疑惑


  立香听完之后没有立刻开口。她把玛修说的话在脑子里重新排了一遍，然后深吸一口气。千子村正身上有连祁荒都看不出来的东西。伊耶那美在隐藏不止一批盟友。天照命金地本身就是一个由已故的天照大神的名字命名的信仰中心，而伊耶那美一个黄泉津大神，却在这里蹲着批折子，养着徒弟，藏着盟友。


  天照命金地绝对有古怪。不论是千子村正还是伊耶那美——


  她把手指在自己腰侧的安魂枪套上轻轻敲了两下。然后她忽然想到了一个人。那个整个特异点里从头到尾都没有出过场、但是所有人都在绕着走的名字——僧人。窃命的僧人。


  立香忽然抬起头。那个猜测从她的神经信号转成语言之前，已经先一步从她被午后光照亮的橘色眸子里浮了上来——不是什么恐惧也不是什么愤怒，是那种直觉抓住了某条线索尾巴之后瞳孔微微收窄的全神贯注。


  伊耶那美，有没有可能也是——菩萨？'

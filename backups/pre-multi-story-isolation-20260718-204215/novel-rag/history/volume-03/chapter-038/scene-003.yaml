content: '村正听明白之后反而笑了——这个外来者判定在她耳朵里好像变成了某种捡到小动物时扫码认不出品种的感觉。


  然后圆球那个红叉又从它自身的菱形鳞片底下翻了一圈：所有片朝下反卷再朝上合拢时翻出来的已经是另一面漆成淡蓝色的半张脸了。


  蓝光重新大范围扫了她一次，这次扫得比她刚才全身体检更慢。


  “确定为外来者。欢迎！”


  这个人工声音的悦耳程度和刚才劈里啪啦完全不在同一个级别。圆球这时从村正身边弹开，转头朝平台边缘的士郎飞去。


  它飞到士郎面前时不急着扫——飞到他肩膀高度停下来先看了他一眼，那个眼睛标志的菱形片在它壳上转了四分之一圈做了个眨眼动作。然后它扫描了士郎从头到脚，扫完之后他整个人身份信息的字节大概在它数据库里跑了几个来回找不到对接口。


  它朝下落了一截，把球体下半壳的金属鳞片整排推平重组成了一只机械手掌。


  那只手掌朝左方指了指——平台左边大约十步开外有一个和路沿衔接的接驳点，接驳点旁边停着个奇怪的东西。


  立香把视线跟过去。那东西完全不像她脑子里的任何交通工具：没有驾驶舱，没有轮子，没有控杆更没有座椅。


  就是一个方形的台面——船形轮廓挤在脑子里一闪被压下去，因为这东西的底部是块整板，四边斜角收进底盘暗槽里。台面后侧有一组凸起的流线型弧背，弧背上只有拼缝没有接钮。


  “这是什么车——不，完全不像是车啊。”她自言自语地把这句话说了出来。


  士郎把那截被风吹斜的袖子往上扯了扯。他先立香一步走上了接驳点，蓝球飞在他肩后头，机械手从他身后探出来指了指台面，又翻了个面手背朝上比了个躺平的姿势。士郎看了看那个手势，然后他直接躺了下去。


  他整个后背陷进去的那一下，方台的台面自己朝上稍微弹了一下把他接住了。弹性材质不发出任何声音，是从腹部往上的那根脊位底下有一层配重块被推平推正了。他后脑陷进台面的同时眼睛闭了一瞬间又再睁开。他抬起右手碰了碰自己耳侧的面板。


  “好舒服……”他说这句话时声音和刚才同调墙壁时完全不是同一个人，嗓子每一块肌肉都松了下来。“这是……”


  圆球飞到他正上方，把脸朝下对着他翻出来那个又一遍的蓝色笑脸。劈里啪啦细响过之后，一句话从球体里组合了出来：


  “舒服似没问题第。”


  日语的发音——断句节奏错了半个音节，。村正在楼顶上拍了一把膝盖：“啊，这个发音，它大概在学你刚才说的那个！”


  “立香，可以过来。”士郎把脑袋朝台沿外偏了偏，朝她点了点头。


  立香三步并作两步踩着接驳点的边沿翻了过去。她走到方台跟前时低着脑袋打量了那个背板的拼缝——没有螺丝印没有铆点，整块背板是嵌进底座的压槽里的。


  她先把自己的后背挪上来，再慢慢把腰放了下去。台面从脚底到后颈全线感知到了她的体型：她后腰有块腰部支撑面自己顶上来，肩后侧的台面也跟着朝上弹了一点点，刚好兜住她的两块肩胛部位。她膝盖窝外侧的台面微妙地变软了，软到像是被一只看不见的手轻轻托住了。


  “玛修，你也来吧。”


  持盾少女把自己的盾搁在了接驳点旁边的石台上。盾牌立上去时底部的铁脚在石面上磕了一声闷响。她走过来竖着膝盖先跪在台沿，然后用左手撑起自己的重量把整个人矮身蹲着挪上了台面。“前辈，真的很舒服吗？”


  “对哦——”立香这个“对”字吐出来的时候尾音已经不像她自己能控制的调子了，她的喉咙放松得连音高都没拉直。“一下子就真的想睡觉了——哪个部位都是舒服到了极致啊。”


  玛修屏着气把自己的背贴了下去，她不由自主地长长呼了一口气。然后她右手伸过去本来想推一下立香的肩膀帮她调角度，结果手指还没碰过去就已经自己软在台面上也睡着了。


  士郎站起身，他朝蓝球点了点头，蓝球将笑脸收掉了三分之一——那些菱形片重新在它球壳表面重排成了一张更接近人类的椭圆面板。然后它转成正面朝着士郎开口，这次它的声音是彻底的、纯正的日语了。


  “欢迎，外来者。我是空管交通管理机器人，我将引导你们前往我们文明的遗产。”


  在它说这句话的同时，另外一只蓝球已经从村正所在的楼顶托着她落了回来。


  “欢迎～”


  “这里的人呢？”士郎问这个问题时已把手臂交叠在胸前，眼睛盯着蓝球面板边缘的微小机械肌肉排线——它在译码，它在拼回应。


  “我们的文明名为未来文明。”机器人开口时那个女声在最后三个字上微微压了一点点重音。“这里的人们都已经为了未来而献身。他们都是英雄。”'

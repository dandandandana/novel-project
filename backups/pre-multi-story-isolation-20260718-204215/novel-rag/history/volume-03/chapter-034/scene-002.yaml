content: '“嗯？”阿尔托莉雅的眸子从乳猪上挪到了立香脸上。她把脑袋轻轻偏了一下，嘴唇在偏头的末尾朝上微微一弯：“我好像没有对你们下过杀手吧。”


  她想了想。眼皮半阖了一下又重新掀起，视线从立香身上一扫而过，然后飘向了不远处正在拢火堆的村正的方向。


  “哦，那个真祖吗？现在她也不是我的目标了。我和你们应该没有仇吧。”


  “是这样……”立香开口时语速比平时慢了半拍，“但是——爱尔奎特是我的朋友。”


  “这样？”阿尔托莉雅捏在下巴上的手收了回去，垂在身侧轻轻晃了一下，“当时如果不是我拖住了那十八个法相——你们能打下来吗？”


  “现在你是我们的盟友。”立香开口时把风衣的领口朝上提了一下，衣领蹭到了她后颈上还没完全干的汗迹，“但是我会替爱尔奎特出那一口气的。”


  阿尔托莉雅的脑袋偏了一下，她笑了笑，这个笑从嘴角往上的速度不快，但笑意从嘴角爬到眼角之后被火光一照显得特别明亮。


  “这样啊。你说的有道理就是了。”


  后她身子一拐，身子转过去的同时一片黑雾从空气里自己凝聚了起来。那匹马从黑雾中走出时四蹄踏过的地方石板上的火影全被它的蹄子踩得偏向两侧。阿尔托莉雅翻身上马的动作没有分节——她一条腿朝马背上一跨，整个身子同时被马背托了上去，坐下之后和服的衣摆覆在黑马的侧腹上，黑色的马鬃被风一吹朝她小腿上拂了过去。


  “我先走了，天照命那里还有人在等我。”她的声音在马上往下飘。


  “Alterego吗？”


  “你猜~”阿尔托莉雅的马在她回完这句话的同时踏上了虚空。黑马四蹄朝前踩出的轨迹在空气中留下了一串黑色的磷光，磷光朝外翻了几寸就被风吹散了。她朝着空中飞去，黑马和她在几息之后就缩成了夜空中一个正在朝上移动的黑点。


  立香看着那个黑点越升越高，然后被上层的黑云吞了进去。


  “她和Alterego的关系好像很好啊。”


  士郎没有接她这句，他把铁叉从魔兽肉上拔出来，刀尖在肉皮上划了一道三寸长的切痕，然后顺着切痕将一块肉切成了一片。


  肉片落在他拿出来的碟子上时还在朝外冒着被封印在肉质层里最后一点热气，他把碟子朝立香的方向递过去。


  “尝尝？”


  立香接过碟子，手指在碟沿上停了一瞬——碟子的边缘被炭火烘得有点烫。她将那片肉搁进嘴里轻轻咬了一口，上下牙合拢时油脂从肉的纤维间被挤了出来。嘴里的油脂带着被烤出来的焦香和魔兽肉本身略带嚼劲的韧度，她在舌尖翻了两圈之后满意地把脑袋朝后仰了仰。


  然后她抬头看向了空中。


  她本来想在万里无云的空中看一看星星，金地刚下过战火，空气里的尘埃被伊耶娜美的黑月气压清走了大半。


  这种干净的天空在她自己的世界里理应满是星星——至少能看到最亮的那几颗，在月亮旁边排成她每次出任务都会不经意看到的形状。


  她看到了清晰的天空，黑色的，像被一把刀从东到西刮过一遍之后连云都不剩。圆月挂在正中间，月面的纹路清晰到能数得清大的坑洼。然后就没有什么了。


  她盯着天空看了几秒，眼皮瞪开了又眯起来，视线从月亮朝左侧挪到右侧，又从右侧挪回左侧，来来回回翻了几轮之后她把脖子收了回来。


  “士郎？”立香开口时声带被嘴里还没完全咽下去的油脂润得有点含糊，“有点不对劲。”


  “什么意思？”士郎在另一边给另一只烤乳猪上撒着佐料。他把佐料瓶从右手换到左手，右手接过了吉尔伽美什递来的一只杯子。酒液在杯子里转了一圈，被火光从杯底照成了琥珀色。


  吉尔伽美什把酒递到士郎手中之后没有走开，她侧身站在火堆边上，金发被烤猪肉的热气吹得朝后飘着。


  下一秒，她端着另一杯酒朝那半只还没撒完佐料的乳猪倒了下去。酒液淋在脆皮上，沿着油脂冒出来的缝隙渗进去时嗞嗞响了一串急促的气泡声。


  “卡桑——”


  “本王觉得这样好吃。”吉尔伽美什把空酒杯往袖口里一收，嘴角的线条在她自己没察觉到的情况下翘了起来。


  “你的味蕾坏掉了。”士郎把手里的酒杯搁下，眼睛看着被酒淋湿了半边的乳猪皮，声音平得和刚才翻肉时一样，“我七岁的时候只有言峰绮礼的麻婆豆腐能吃。”


  “本王觉得你做的饭好吃，这足够证明本王的味蕾没有坏掉了吧。”吉尔伽美什开口时把脑袋朝上一昂，手势不是指天——是把她自己的味觉感官作为最高裁判所的架势。


  “懒得和你争论，还好我有办法调好。”士郎把手伸进佐料袋里重新摸出一小罐粉末，用拇指挑开了罐盖，“立香，你刚才说什么？”


  立香把碟子搁在膝盖上，她用筷子朝夜空方向一指，筷尖上翘的角度把她手腕内侧的一小块皮肤拉出了一道浅褶。


  “有古怪。”'

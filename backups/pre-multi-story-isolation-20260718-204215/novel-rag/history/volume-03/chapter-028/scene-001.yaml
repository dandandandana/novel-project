content: '满天粉色的气泡在同一瞬齐齐破裂，光泡碎成了无数碎片然后隐入灰暗。整片天幕从暖粉色塌成一个混沌的深灰色团块，仿佛有只看不见的手把天顶连片捏碎，再把碎片胡乱拼了回去。


  弥勒已经在朝天顶疾速飞升，素色僧袍被气压拍在背上，袍角在风里拉成一条直线。祁荒站在原地没动，她只是冷眼看着自己的敌人朝冷光消失的方向飞上去——然后她抬起右掌，指尖朝上轻轻一翻。


  一颗纯白色的球体在弥勒正下方瞬间凝结成形。球体表面滑过一层极薄的冷光，冷光还没完全晕开，自下而上的光炮便已经灌满了整个世界。


  光柱甚至没有发出声音。或者说声音大到已经听不见了。白光一口气吞掉了视野里所有的色块，整片天穹被推到极限的白之后从中心开始被撕裂。


  弥勒周身炸出刺眼的金光，光炮狠狠撞在那层金光上，碰撞点朝四周炸开一圈又宽又扁的冲击环，环边把整片天空从水平方向撕成两半。


  不同于伊耶那美以天沼矛搅动混沌之后再行创造，这一发光炮是直接把天空打没了。


  光柱散去之后，天顶只剩下一个巨大的缺口。缺口边缘没有烧焦的痕迹，没有余火，只有浓郁到近乎液态的黑从缺口里涌出来。


  那黑稠得像是一块不断蠕动的烂肉，边缘反复收缩又扩张，努力想拼接回去却被某种残留在虚数空间里的冲击力始终顶着。


  弥勒悬在半空中，额头上的皮肤绽出无数金色裂纹，密密麻麻从他的眉骨一直延伸到额角。无数文字从裂纹里渗出来，绕着他的颅顶团成梵轮的圈次第旋转。


  “一发把虚数空间都能够炸烂吗……如果真有不自知的生物吃下你这一发，单单余波都能荡平整个小行星了吧。”他的声音依然平稳，只是字与字之间多了一次几乎不存在的吸气的间隙。


  祁荒把嘴角往上提了大半侧，眼里映着半空残余的白光的余晕。“上限？那种东西从来没人测过啦，”她用舌尖在齿间弹了一下才把话吐完，“说到底我连上限在哪都摸不清楚~”


  弥勒将视线从虚数缺口收回，落在她脸上。那些盘旋的文字微微停了一下。“你这份力量，说它更适配兽的人类爱，与其说是更适合兽，不如说是专门用来对付菩萨的执念的吧。”


  “阿拉，露馅了？”祁荒的眉梢往上抬了极小的一个角度，笑意在眼尾加深了几分。“被看出来了~是啦是啦——吃这行饭的嘛~”


  她的最后一个字还没来得及收声，六面金色的法阵突然从她前后左右上下六个方位同时亮起。法阵的纹路不是新画上去的，每道线条的边缘都泛着已经沉淀许久的淡金光痕，说明它们早在她还在笑的时候就悄悄爬满了她的周围。


  法阵一现便以同一个速度朝她收束过来，六面光壁同时合拢。


  祁荒没来得及后撤。她冷哼一声，洁白光晕从肩侧炸开，一层乳白的屏障在六面法阵合拢的前一瞬罩住了她。金光与白光狠狠咬在一起，互不相让。


  她承认弥勒一定有匹敌自己火力的宝具。两个人如果真正放开手脚打——就算是在刚才那次对等的权能消抵之后——余波也足够把整个地球掀掉半层皮。如果现在再度回到高维空间……


  “虽然我从头到尾就没指望过这一发能拿你怎样——”祁荒冷笑一声，金刚杵从袖口滑入掌中，她侧杵一挥便朝正前方的法阵硬撞过去，“但你未免太小看我了~”杵面与法阵接触的瞬间炸出一团闪耀的金白相间的光芒。


  然后。所有的法阵同时增亮。亮度从浅金直接叠到刺眼的纯金，每一条阵纹都像活过来了一样向她的方向挤压。


  她脑子里顿时炸开一段声音——卫宫白的语气还是那种懒洋洋的漫不经心：有那么一种阴毒的小把戏，能在某一瞬间把人整个儿从世界里踢出去。


  “算计我？”


  弥勒若是发动权能，她绝不可能感知不到。那就只剩另一种答案——


  弥勒在她察觉之前就已经开始准备了。从二人重逢的第一句话出口，他的手就一直在维持这六面法阵的构架，一直撑到现在，撑到她把注意力全部放在光炮和口舌之争上。


  “整整准备了这么久——真有你的。”祁荒的声音从牙缝里挤出来，冷哼里带着一抹真切的认可。“放逐出时空的能力，你居然准备了整整一场对决。”


  弥勒在半空中垂下眼睛，手掌朝她的方向微微一合。“你实在太强。”


  整片金光的法阵在话音落地的刹那从六个方向同时碾压过来。祁荒只觉得自己的存在正在被一根线一根线地从这片天空中抽走。


  临消失前，她唇角一侧又往上提了提。眼里没了刚才所有回敬的嬉笑，只剩一层极薄的冷光。


  “但你也没落下什么好果子。已经是第几代的人类了？你毁了他们多少次——”


  她最后那半句没能出口。整个人连同金刚杵、乳白光晕和那抹极冷的眼神一同被金阵吞进去，随后这个时间线上便再也没有她的气息了。'

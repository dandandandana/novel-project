content: '爱尔特璐琪成功从迦勒底脱身之后，她发现了一些很奇怪的魔力。


  “把魔力注入人理奠基值极高的历史转折点吗？”爱尔特璐琪似乎想到了什么好玩的东西，她轻轻的汲取起这七道魔力。


  “明明可以有更好玩的选择，却偏偏选择了这样啊……多没意思啊盖提亚。”


  “完全颠覆人类史的虚假的历史不是比你搞的什么特异点好玩多了？去吧，盖提亚，你可要感谢我。”


  原本七道的魔力挣脱了爱尔特璐琪的束缚，化作了五道更为浓郁的魔力，往人类的历史飞去。'

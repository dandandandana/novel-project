content: '奥尔加玛丽两步冲到门口，扶着膝盖大口喘气，目光落在希耶尔身上——她身着蓝色紧身战斗制服，手中握着一柄泛着冷光的可怖巨剑，身上还沾着少许血迹。“战斗顾问……到底发生了什么？”


  “管制室发生了爆炸，具体原因暂时不便解释。里面很不稳定，随时可能爆发强制灵子转移。”希耶尔说着，越过奥尔加玛丽，看向刚跑到身边的立香。


  “藤丸，跟我进来。所长，你待在外面别进来！”希耶尔的语气不容置喙，“你没有灵子转移匹配度，一旦爆发，你会被直接撕碎的！”


  “我知道了……”奥尔加玛丽攥紧拳头，声音发颤，“藤丸，希耶尔……你们必须活下来！一定！”


  管制室内一片狼藉，立香下意识捂住嘴，勉强压下反胃的冲动，紧跟着希耶尔的脚步，在废墟中寻找幸存者。


  “前、前辈……你还……活着吗？”


  巨石底下传来微弱的声音，立香瞬间分辨出来，眼睛一亮：“玛修！”她立刻迈开脚步，朝着声音来源狂奔而去。


  希耶尔紧随其后，单手扣住巨石边缘，浑身发力，硬生生将沉重的巨石举了起来。


  “立香！快把她拉出来！”


  立香立刻扑过去，抱住玛修的上半身，声音发急：“玛修，忍着点，我马上救你出来！”


  她双腿发力，一点点将玛修从巨石下拖出，地面上留下一道长长的血痕，触目惊心。


  “前辈……”玛修气息奄奄，艰难地喘着气，看向立香的眼神里带着暖意，嘴角勉强扯出一抹笑，“不知道为什么……有前辈在，好温暖……”


  希耶尔轻轻放下巨石，刚要开口，却猛地僵住——她听到了最不愿听到的声音。


  “强制灵子转移倒计时……3……2……”


  冰冷的机械音在管制室内回荡，暴动的魔力开始疯狂涌动、酝酿，仿佛下一秒就要冲破一切。


  “希耶尔！你也没有灵子转移匹配度！快出来！”门外的奥尔加玛丽也听到了倒计时，情急之下就要冲进来，却被希耶尔厉声喝止。


  “你进来干什么？送死吗？！”希耶尔的怒吼穿透魔力的轰鸣，“去做你该做的事！奥尔加玛丽，你是迦勒底的所长啊！”


  下一秒，魔力风暴骤然爆发，奥尔加玛丽被冲击波狠狠掀倒在地，勉强才没被那恐怖的气息波及。


  她抬头望去，管制室内早已没了立香、玛修和希耶尔的身影。奥尔加玛丽立刻放出两只使魔，确认不会再爆发灵子转移后，毫不犹豫地冲进了废墟。


  “至少要修好通讯……重启核心……”她咬着牙，在布满灰尘的操作面板上快速敲击，指尖翻飞，不敢有丝毫停顿。


  与此同时，冠位时间神殿中心，身着医生制服的罗曼站在那里，语气平静地开口：“盖提亚，你达到目的了。”


  坐在王座上的盖提亚垂眸看着他，语气带着几分轻蔑：“所罗门，你能来到这里，多半是我的怜悯。”


  “我知道。”罗曼揉了揉发胀的脑袋，语气平淡得没有一丝波澜。


  “我很好奇，你怎么会来这里？”盖提亚微微挑眉，“特异点尚未修复，你们本该找不到通往这里的路才对。”


  罗曼的神情骤然褪去平日的温和，恢复了所罗门王时期的无悲无喜，他掏出一枚小小的戒指，随手丢向盖提亚：“现代人类发展出了不少有趣的魔术，利用死徒之理改造的魔术便是其中之一，我靠这个过来的。”


  盖提亚用魔力接住戒指，指尖轻轻摩挲着这枚来自自己造物主的信物，眼底闪过一丝了然。


  “利用了这个世界的理吗？原来如此。”他缓缓开口，“难怪人类能讨伐BEAST IV和VI，竟然已经发展到这种地步了。传闻人类还有能撕裂神秘的武器，是真的？”


  “你的千里眼也看不到吗？”所罗门淡淡反问，“是真的，而且人类已经成功弑神了。”


  “真是狂妄自大。”盖提亚语气没有丝毫波动，却带着不容置疑的坚定，“看来，我的伟业就更显重要了。所罗门王，你还有什么想说的？”


  所罗门缓缓点头，语出惊人：“我不会阻止你，反而要让你多维持一段时间人理烧却。”


  盖提亚明显愣了一下，定定地看着所罗门，片刻后似是想通了什么，轻声问道：“我的千里眼看不到的东西，是什么？”他隐约察觉到，两人此刻的敌人，或许是一致的。


  “是这颗星球本身的意志，不愿让你看到、拒绝让你看到的东西。”所罗门缓缓开口，“那柄撕裂神秘的武装诞生后，盖亚便勒令以神明为首的星之触觉，对人类展开报复。”


  “虽说多数神明本无报复之心，但能回到人间寻乐，他们何乐而不为？”所罗门顿了顿，语气加重，“可现在，早已不是神代了。”


  “所以，就有神明被现代人类杀死了？”盖提亚语气平淡，像是在评价一件无关紧要的事，“真是无聊的戏剧。”


  “那柄武装，承载着人类拒绝神秘的意志，对付神明，就像剪刀剪纸般轻易。”所罗门的声音依旧平静，却带着一种不容置疑的力量。'

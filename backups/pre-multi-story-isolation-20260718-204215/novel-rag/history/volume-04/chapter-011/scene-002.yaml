content: '门开始合拢。立香隔着逐渐变窄的缝隙看了一眼那片空舰桥。她没有从这句话里得到答案，却确认了另一个事实：创造之禊祓并不只是一件等待启动的兵器。


  通道没有他们来时那么稳定。


  脚下的金属板每隔一段便会消失，露出没有上下之分的黑暗。玛修用盾确认过边缘，那些缺口不是破损，而是空间本身没有接好。众人只能沿着终末人理圆满装置留下的白色标线前进。


  祁荒在第一个岔口等他们。


  她坐在一块悬在黑暗里的断板上，木履搭着边缘，手里还捏着不知从哪里拿来的半块白色薄片。见到立香，她把薄片随手丢进身后的空处。薄片没有下坠，安静地停在原地。


  “你跑去哪了？”立香问。


  “逛逛。”


  “逛到空间断层里？”


  “这里没有写禁止游客进入。”


  “有门吗？”


  “没有。”


  立香看着她。


  “好吧，墙也没有。”祁荒从断板上跳下来，“我找到了些有趣的东西。这个地下可不只有你们见到的博物馆和主炮。还有很多没有被启用的人形容器，数量大概够塞满一座城。”


  “什么容器？”


  “和伊耶娜美很像的容器。”


  立香没有继续往前。士郎也停在她旁边，后面的杨浞因此第一次正眼看向祁荒。


  “说清楚。”


  “没有灵魂，没有完整人格，也没有被赋予名字。里面有些装着记忆，有些装着神代残留下来的权能碎片。让我猜的话，它们是给某些已经不存在的东西准备的替身。”祁荒说，“伊耶娜美大概是完成度最高的一个。至少她能坐在那里喝酒，骂人，还能决定什么时候不说实话。”


  “你动了那些容器？”士郎问。


  “没有。我虽然好奇，还没有好奇到替幕后黑手按按钮。”


  “你的保证不太让人放心。”


  “言峰士郎，你对菩萨的信任真是少得可怜。”


  “主要取决于是哪一位菩萨。”


  祁荒笑着接受了这句评价。她走到立香另一侧，终于收起玩笑。


  “还有一件事。容器少了很多。空位上的灰没有积满，它们离开的时间不会太久。”


  “目的地？”


  “上面。”


  她指了指并不存在的天空。


  立香把这条情报和终末人理圆满装置的沉默放在一起。近百名法相，一名世尊——这些数字当时还没有出现，法相军队的来源已经露出一角。


  “先回月读命金地。”她说，“亲自问伊耶娜美。”


  队伍继续前进。杨浞落到最后，与祁荒隔着两个人。他没有问她是谁，只在越过第二处断层时说道：“你身上有佛法，不正。”


  “第一次见面就这样评价别人？”


  “是评价佛法。”


  “那我身上其他部分呢？”


  “不归本王管。”


  祁荒第一次没能马上接上话。玛修在前面忍住笑，肩膀还是动了一下。立香没有回头，嘴角却跟着抬了起来。


  出口在一片被岩石封死的山腹里。


  终末人理圆满装置打开最后一道门时，外面的石壁向两侧退开。月读命金地的冷风灌入通道，带来的不是夜晚。立香先看见自己脚下有两道影子，一道来自刚跃出山脊的太阳，另一道来自正上方。


  所有人都抬起头。


  天上多了一颗星。


  它没有太阳那么大，却比太阳更亮。白光从高处铺遍整座金地，山、城墙、枯树和远处残存的屋顶都失去了原本的阴影方向。夜与昼的界限被从天空里抹去，任何试图藏进背光面的东西，都被第二道光从正上方照了出来。


  月读命金地外缘原本覆盖着一层障眼术。那层术式在白光下维持了不到一息，整片山峦便从中断开，露出后面真正的城郭。城墙上的修补痕迹、哨塔里的守卫、掩在林间的伤员营地，全部暴露在无遮无挡的天光里。


  玛修立刻举盾。城墙上也响起警钟，数十道术式同时对准他们。


  “自己人！”立香接通先前约定的通信频段，“藤丸立香，已从星之内海返回。不要攻击天上的星，它不是敌袭。”


  “目前还不是。”杨浞补了一句。


  立香转向他：“这颗星是你的？”


  “修武星。本王现界，它便现世。”


  “能关吗？”


  “不能。”


  “会照多久？”


  “本王消失为止。”


  “对我们有什么影响？”


  “假的藏不住，真的会更真。”


  “能不能用战术语言解释？”


  杨浞想了想：“你们这些从者都会受一点压制。伪装、隐匿和冒名顶替的东西会先倒霉。本王也算从者，所以本王也受压制。”


  “公平得有点过头了。”士郎说。


  “真不偏爱谁。”


  山道另一头传来急促脚步。吉尔伽美什没有乘坐任何交通工具，从城里一路走到山口，身上的礼服依旧齐整，鞋底却沾了泥。她先确认立香与玛修没有缺胳膊少腿，随后才看向杨浞。


  “这颗星是你弄出来的。”


  “是。”


  “把本王的阵地全照出来了。”


  “抱歉。”'

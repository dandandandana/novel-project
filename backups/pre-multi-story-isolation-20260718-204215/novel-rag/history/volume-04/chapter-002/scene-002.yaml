content: '“我问你：你能想到一个能和弥勒佛相提并论的角色吗。”


  立香把双臂在胸前交叠起来，她的下唇朝里轻轻抿了一下，橘色的眸子在眼眶里从左往右快速移了半圈。


  “米迦勒。”


  “不够格。”祁荒把佛珠在拇指上又转了一圈。


  立香的眼睛继续往右移。


  “……宙斯。”


  祁荒笑出来了。


  “这种神话里的神也配吗。”她把头朝侧边微微一倾，插在净瓶里的那根小枝随她的动作轻轻颤了一下。


  “能和佛匹敌的只有菩萨和佛——其他连门槛都够不到。”


  立香把脸转向士郎，她的表情在转到一半的时候忽然松开了——从刚才的紧追不舍变成了某种带着试探的忍俊不禁：


  “你所信仰的神被她侮辱了，你不生气吗士郎。”


  士郎的琥珀色眼睛在立香脸上停了，他的嘴角往上提了一点，这是早就被同一个人用同一种方式逗了太多次之后的惯性反应。“原来你还记得我是天主教徒。”


  “需要的时候就记得。”立香咧嘴笑了，眼睛跟着往上弯了弯，“不需要的时候就不记得。”


  “主并不在意她说的话。”士郎开口，声音平得跟自己手里那把天丛云压在身侧时剑鞘擦过衣料的声音一样稳。


  “我也不在意你的主怎么看。”


  “我不归你的主管。”


  蓝色的人形在残骸大厅的中央忽然往前靠了半步。它的投影边缘在祁荒身上来回扫了一遍，冷光从她的法袍领口扫到下摆，再由下摆扫回她的脸。


  “观世音。”AI的合成音在观音两个字上停了一瞬，然后继续往下推，“不对，你是祁荒......你明明被弥勒彻底禁止来到这个宇宙了。你是怎么做到的，这件事根本不应该被允许发生。”


  祁荒伸出食指竖在自己嘴唇前面。


  那声“嘘”从她嘴里轻轻吹出来的时候，她手里的佛珠已经停止滚动了：“嘛，不要说出来我是偷渡的。”她把食指从唇边放下来，眼睛里的笑重新浮上来，“我可求了我一个朋友好久，然后借用了正法明如来的坐标才摸进来的。”


  终末人理圆满装置沉默了，蓝色投影在人形轮廓的边缘快速跳动了三下，然后恢复稳定。祁荒趁机把话头接回去，语调重新拉回悠悠懒懒的波浪号尾巴：“说到底——几乎英灵座上所有英灵都没法对弥勒产生任何直观打击效果，除非你们能把释迦牟尼本人从座上召唤出来。”


  “可以，”终末人理圆满装置的合成音平稳得像在宣读一份存档记录。


  “但是没意义吧。”祁荒把佛珠在手里轻轻抖了一下，紫木珠子互相敲出一串脆响，“如果释迦牟尼真的对弥勒有很好的效果——你们早就试过了吧。”


  蓝色人形的光在短暂的几秒里微微变暗了半度，然后又亮回来。“你说得对。”它的声音在扬声器里没有任何变化的音调，但字与字的间距比刚才所有回答都拉长了一点：“在这里......神秘对于弥勒来说毫无意义。”


  立香的脖子微微朝前一倾，“因为他全知全能吗。”


  “这世界上根本没有真正的全知。”终末人理圆满装置的蓝色投影在她问出这句话的瞬间往她的方向偏转了半度，像在把焦距对准她：“英灵座上的英灵无法对抗弥勒，也只是因为这个。”它把下一句从扬声器里推出来时声量压低了一点，仿佛在把一句被自己说过太多遍的结论再一次翻出来摊开：“最根本的原因是，弥勒是思潮诞生的救世主。”


  思潮诞生的救世主。


  立香在听到这六个字的时候脑子里忽然静了下来。刚才一直在拼命转动的推理齿轮没有停——但它们换了个排列方式。伊耶那美说过的那种“僧人窃取神明名号”的画面重新从她记忆的底层浮上来了，然后是弥勒锁死星空这个事实，然后是AI口中那些为飞向星空而死的文明遗迹。那些拼图一直都堆在桌子上，现在她找到了把它们拼到一起的锁扣。


  “他本质上是因为人类诞生。”立香把视线从AI身上拉起来暂时投向虚空中某个没有实体的点：“人类越强他也越强，因为人类解析了神秘，所以神秘的加持对于弥勒就毫无作用。”


  她把目光重新拉回蓝色人形身上，声音开始一个字一个字地加快：“比如吉尔伽美什的EA放出去的光炮打在他身上跟一阵风一样，对吗。”


  “等一下。”立香的语速突然急刹车，橘色的眸子在眼眶里猛地跳了一下，“但这不合常理。如果历史上本就出现过的——”她的下唇被牙齿轻轻咬住然后松开。她把手从胸前放下来，五指在空气中快速比划了几个别人看不懂的键位。


  她嘴唇无声翕动了两次，忽然把手掌往自己大腿外侧一拍：“不对，我好像想通了。”'

content: '言峰士郎站在舱体旁边。他看着窝在舱体里的橘发从者不自觉地把自己蜷成很久以前缩在睡袋里的同一种弧度——左肩埋得低些，脑袋往舱壁里稍微挤了挤。


  “嗯，先休息一下吧。”他开口，声调里没有更多的东西，“这段时间感觉怎么样？”


  立香恍惚间从按摩的蓝光里捡回他的声音。她把差点合上的眼皮重新撑开，从睫毛构成的模糊缝隙里望着他。


  “很累啊——”


  士郎伸出手，手掌落到她橘色的头顶上揉了揉。


  “先休息吧，立香。”


  “嗯？”她把头被他揉着往舱壁方向又偏了偏。话音从舱体的内壁上被弹回来时多了些闷闷的自语感，“你又把我当小孩子——言峰士郎，你当我没发现吗。”


  “哪有？”士郎拉过舱体边的独立座椅在她旁边坐下。椅垫在他坐下去的瞬间发出一声极短的气动排压。然后他把那句话在坐姿定住之后才补全。“你在我眼里是大人了。”他把身子稍稍往舱体方向倾了半度。“你做的很棒了。”


  “嗯，我当然知道我做的很棒了。”立香闭着眼睛把这句话推回去。她在按摩臂从自己后腰挪向侧边的空隙里侧了侧身子，“但是不妨碍你把我当成小孩子……”


  “有吗。”士郎的眉梢往上抬了一点点。


  “我怎么不觉得。”


  “因为你是言峰士郎。”立香的声音从闭着的眼皮底下落出来。她没有停，把下一句直接顺到前一句的后座力上，“你不在乎你做了什么——你只是在享受你做的这个过程对不对？”她把声音压到最低一档，又问，“就像你当初对我说的一样。”


  士郎的手从她头顶放下来搁在自己膝上。他的右手在半空中停了半秒才落回。


  “言峰士郎……”立香把脸埋进舱体内侧的软衬里，橘发散落的尾梢从舱沿拖下来一小绺垂在舱外，“嘛，我猜猜~你对我这么好，是喜欢我吗？”


  舱体液压声在那一刻忽然变得尤其清晰。


  玛修把盾牌往地上一立。那声金属碰击短得像是从她手指传递到盾牌表面被闷了半截。“前辈……”她的语调在末尾被自己拖出了明显的无奈。


  士郎顿了顿：“嗯。你可以理解为我就是这样的人吧。”


  “这样吗。”立香闭着眼睛说出了这句。


  她说这三个字时忽然坐了起来。舱体内的按摩单元在她起身时发出了一串泄压的嘶嘶气音。她把一只手拍在身旁的空位上——舱体旁边就搁着士郎刚才拉过来的那张座椅，但她的手掌落在自己还没从舱体内完全挪出来的身体侧边空出的那截软垫上。


  “坐下。”


  士郎坐了过去。


  然后立香直接把上身往侧边倾倒，脑袋枕在他大腿上。她的橘发散开来，铺在他战衣大腿处的深色布面上，被顶上投下来的柔白灯光勾出一层暖调。


  “嗯~”她把脸往上翻了个角度——眼睛看着他的下巴。“给我掏耳朵来。”


  立香知道自己说这句话的时候脸应该早就烫成了她不好意思看的颜色，但脑海里翻上来的想法把她那点热意从脸上硬拽了回去。


  【都走到这一步了……一定要问清楚。】


  士郎投影出来的掏耳勺是银白色的，小到刚够用两根手指捏稳。镊子跟着掏耳勺同时出现在他另一只手的虎口里。


  他拨开立香耳侧那一绺橘发，将她的耳廓轻轻往外翻了一点，把掏耳勺的尖端贴着她耳道的边沿探了进去。


  “士郎……这些事情本来是不该你来做的吧。”立香的语调淡得跟舱室里的空气是同一份温度。


  士郎的心眼在一瞬间发出了第一声极其明确的警报。


  他的琥珀色眸子往下滑到立香脸上：“嗯。”


  “那你为什么要做。”


  “因为你需要。”言峰士郎把这句话推回去。掏耳勺还在他手指间以极慢的速度旋转了不到半圈，蹭过耳道内壁时轻得几乎不产生任何摩擦。


  “我需要对吗？士郎。”立香的声音很平。但嘴唇在自己话落的瞬间开始不受控制地上下轻抖。


  她把自己的下唇浅浅压进上唇内侧才勉强压住：“和你相处了一段时间了……那你需要什么呢。”


  这时候休息室空间门的光圈往两侧展开。祁荒刚把脚踏进来，村正已经先一步横过大太刀挡在她面前——刀刃没出鞘，只是用刀柄勾住了祁荒法袍的袖子。


  “喂喂喂你这什么表情，拉我干什么——”


  “走吧别看了。”


  “我就看一眼嘛。”


  “你这老尼姑懂什么叫该闭嘴。”


  两人压低嗓子的纠缠被越来越远的空间门光圈吞掉。光圈收拢后休息室里只剩舱体里透出来的蓝光和白墙。


  立香没有管他们，她把视线放在眼前的那片舱壁上，看着舱壁内侧因为按摩单元起伏而一下一下微微变形的软垫纹理。


  然后继续：


  “士郎，如果我没记错的话——你是错误召唤，需要休息对吧。”


  “需要。但是一天两三个小时就够用了。”士郎低声回答。'

  "content": "第四卷 第十四章 至命之火\n\n杨浞的铁鞭砸进天照命掌心，先压出一记沉得发钝的闷震；九层太阳阵地隔了刹那才一齐下沉，砖缝里的金粉被震得贴地荡开。力量并未向外炸散，鞭鳞反而贴住她的皮肉逐片亮起，青黑真炁顺着指骨往腕口钻。灰火就在这时覆上来，衣袖与铁鳞都还完整，细碎的啃噬声却已沿龙脊爬向杨浞掌心，真炁每往前一寸，后面那一寸便悄无声息地断掉。他顺着鞭身将折未折的余力松腕卸劲，鞭尾擦过她合拢的五指滑出，前脚仍钉在下沉的金砖上。\n\n“真武正性剑，出鞘。”\n\n左脚踏碎金砖的同时，他借阵地下沉之势拧腰送肩，弹出鞘口的古剑遂从右肋下方斜挑而上。天照命来不及撤掌，索性沉肘压刃；锋口撞上臂骨，尖锐铮鸣沿剑脊直灌杨浞虎口，她的袖口与皮肉也被一并割开。可血珠尚未落地，细密金羽已经从创口里钻出，羽根互相咬合，夹得剑身发出令人牙酸的刮擦。剑被锁住，她空出的五指便越过杨浞肩头，风压先一步贴上后颈。\n\n后颈绷紧的皮肉已经替杨浞量出那只手的位置。他任由发带擦过天照命指尖，扣着鞭柄的拇指则横抹鳞纹；青黑真炁受这一抹牵引，由一股剖成六缕，水色与火色首尾相逐，在腕间发出六重高低不同的细鸣。\n\n“无丈。”\n\n半尺距离应声延展成六丈。天照命指尖明明擦过他的发带，五指合拢时抓住的却只剩一缕从远处飘来的白气；待她听见身后的衣袂破风，杨浞已经借那六丈错位绕至背后，剑仍卡在金羽之间，握柄的手却从正挑改成了反压。剑背顺着原有伤口往里撬，成排金羽在连续脆响中崩断，十七道金光也趁她肋侧受制，从杨浞头顶呼啸而过。\n\n吉尔伽美什算准了杨浞压剑后的低身位置，十七座王之财宝遂沿九层阵地外缘斜次开启。门轴般的低鸣才滚过金坛，长枪已贴着他肩甲钉向天照命膝弯，战斧则从另一侧削往颈骨，其余宝具各携不同年代的神秘与诅咒，把向上、向左的退路交叠封死。所有锋线被压向同一处死角时，天照命脊背上的皮肉忽然绷裂，七根孔雀尾羽迎着兵刃张开。\n\n羽目沿长羽次第睁开，七座人类城市的声息顿时挤进战场：电车轧轨、钟楼报时，遥远人潮隔着时间边界起伏。枪尖才触到第一枚羽目，淬炼与锻打的痕迹便从刃上层层剥落，落到金砖时只剩一块未打磨的青铜；战斧撞进第二座城，木柄旋即抽芽，斧头尚未坠地，已经散成带叶枝条。后方宝具也沿同一顺序退回矿石、兽骨与灼热金属液，密集落地声砸得阵地一片嘈杂。\n\n乌色火柱从影子里顶起之前，吉尔伽美什已经踩住半开的门扉横移十步。火舌擦着裙甲升空，灼热尚未追上，她的千里眼便越过满地原矿，扣住七枚羽目的开合次序。七幅景象彼此叠压，钟声、人声与轨道摩擦全搅在一处；即便是她，也只能从混乱声浪里捉住几下不属于城市的搏动。\n\n“第三、第五，里面有东西在活。”她说。\n\n杨浞拔剑带出一串血珠，借回收剑势拧腕扫鞭，径取第三枚羽目。吉尔伽美什的判断无需解释，鞭梢逼近时，那座城市已用声音给出了回答：电车轧过轨道，学校铃声沿街区扩散，数万人的交谈从一尺宽的羽目里迎面涌来。杨浞腕力未收，鞭头与羽目之间的半寸却被每一条街道向外摊开，转眼铺成长达三百里的黄昏；待破风声真正抵达，铁鞭只击碎了城市尽头的一片晚霞。\n\n“是真的。”杨浞说。\n\n“本王知道。”\n\n吉尔伽美什抬手再开宝库，门内空着，下一批飞出的却是一百二十八根测量金桩。它们绕开天照命的身体，贴着第三枚羽目外缘逐根钉入空间；金属撞击由近及远排开，每响一声，城市边界便多出一截极细白线。火力由此变成了尺度——她要先量出这段被截断的时间，再连城带人完整取走。\n\n天照命看出了她的意图。七根尾羽向内合拢，杨浞的铁鞭已经横在她腰前。\n\n“花尾鸟，和人动手时把尾巴藏好。”\n\n铁鞭向后一勒。鞭身刚碰到第一重城市，七段不同的街道便同时来分这股力。\n\n“无擘。”\n\n六缕真炁骤然并成一线，七重时间边界没能把它截开，城市里的千万条人生也没能将它分走。完整的力从第一根羽贯到第七根。天照命双脚离地，后背撞碎两层阵地。第八层金坛向外炸开，数千块金砖被真炁带着飞上半空，又在黑日照耀下熔成赤金雨。她在金雨里翻身，五指扣住鞭身。\n\n灰火顺着龙脊倒卷，贴上铁鳞时听不见爆燃，只有沙粒啃过金属般的轻响一路逼近掌根。热与重量都尚未抵达，杨浞腕骨深处却先迸开一记细小裂声，灵基上的灰线已从掌根爬向小臂。\n\n“无常。”\n\n六色流光应声逆转，贴骨侵蚀被强行换成可以触摸的热浪；可性质虽然改变，原有力道仍一分不少地压回鞭身。铁鳞由暗红烧至发白，皮肉焦缩的嘶声贴着掌纹响起，杨浞五指因剧痛松开一线，腰侧旧酒觯这才渗出清气，沿焦肉边缘向内缝合。新肉每长出一层，灰痕便啃掉半层，恢复明显慢了下来。天照命把这三次变化收入眼底：距离被拉长，力量拒绝分流，侵蚀又被换成热量。\n\n“同一门术？”\n\n“真炁六水火。”杨浞借清气压住掌心焦痛，重新扣紧鞭柄，“才看三次，莫急着装懂。”\n\n掌心的焦肉仍在清气下反复生灭。方才铁鞭勒紧时，黑日亮过一瞬；待他卸去腕力，清气便多推进了半寸。一次变化还不足以定论，于是杨浞故意把杀意提到剑锋，又在出手前压回。黑日边缘果然连跳两次，第二次却慢了半拍——那轮太阳正在追逐他的念头，天照命也在竭力掩饰两者之间的呼应。\n\n天照命借握住铁鞭的反力站稳，掌中血沟被滚红鳞片重新烫开，血落上金砖，发出短促的嗤响。她把那只手收进袖内，问话被胸口尚未平复的呼吸压得很低。\n\n“你想证明什么？”\n\n“证明你是只花尾鸟。”\n\n“我是天照命。”\n\n“借来的名。”\n\n她五指收紧。铁鞭发出一声短促的龙吟，通红鞭身从中间弯下，却没有断。\n\n“我也是伊耶那岐金地世尊。”\n\n“秃驴给的果。”\n\n“我救过这里的人。”\n\n杨浞把焦黑的拇指按上眉心，向外一划。"
}

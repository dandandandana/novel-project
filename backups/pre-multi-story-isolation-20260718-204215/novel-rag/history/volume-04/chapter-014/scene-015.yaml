  "content": "第一道赤色风压贴着灰白交界切入左侧，第二道旋即封住右侧，第三道则从地底向上贯穿。三次空间断裂的轰鸣一高一低，把天照命向四周扩散的灰光层层剥回主轴，只留下正面与问武平清觯相撞的唯一方向。\n\n“见识与本王同样古老的星之开辟。”\n\nEA向前。\n\n“——『开天辟地乖离之星』。”\n\n赤色螺旋沿铁鞭外侧缠绕，既不替杨浞承重，也不与青龙争夺主轴，只把被尾羽分散的冲击重新聚回鞭头。青龙残魂在赤风中寸寸破碎，龙脊本体却借此越过最后三尺，正中孔雀额心；同一刻，白流也贯穿灰光。白、灰、赤三色在一点收缩，战场上的声音随之一并消失。\n\n声音消失处，固有结界中央也被整块剜空。黑金孔雀从额心向下裂开，创口里流出的并非鲜血，而是九层太阳阵地、佛果、天照御名、乌从欲与至命除层层叠压的结构。修武星把借来的部分逐一照亮，创造之禊祓的白火便从结界外沿光痕渗入，洗去弥勒印记；降格术则钉住最后剩下的血肉，使所有剥落都只能归结到这一具会受伤、也会败北的身体。\n\n吉尔伽美什咬紧牙关维持EA转动，锁链已深深陷进左肩空洞；杨浞则以仅存右手压住铁鞭，指缝不断被震出新血。天照命的鸟喙仍顶着三股力量向前，求饶与辩解都未出口，眼后最后一枚黑金羽目却悄然亮起。里面既无城市，也无飞船，只有一座普通庭院：有人把剩米撒在围栏旁，一只尚未开悟的孔雀低头啄食，细小啄击声穿过早已静音的战场。\n\n那个人给它的仅是一把剩饭，从未索要世界的救赎，也未交出未来的选择。天照命隔着羽目听完最后几声啄击，灰光便先于身体停住——她主动截断供给，再未向其中填入一条命。于是白流穿过鸟喙，奉真策玄鞭紧随其后砸碎额骨，EA赤色螺旋则沿裂口贯入，将黑色穹顶从内部撕成两半。直到此刻，被三股力量压在远处的巨响才一并追上来。\n\n迟来的巨响也震碎了固有结界边缘，荒原自外向内崩落，赤色天空随之成片下坠。吉尔伽美什借最后几次门扉开合，把九枚时间卵依次收进王之财宝；杨浞则倾尽酒觯余下清气，裹住六十六个法相光影。边界坍到脚下时，两人同时撤离：杨浞已无力再化霞，只能抓住檀真残破右翼，任神禽拖向裂口；吉尔伽美什的左腿彻底失去反应，便用一扇接一扇宝库门吞吐身体，把自己强行抛出结界。"

  "content": "【至命至性并火大圣】，现界。\n\n孔雀低头，战场反而陷入短暂静音。杨浞看见铁鞭尾端撞上荒原，却迟迟等不到那声闷响；紧接着，他自己的脚步也只剩前半声，脚掌明明踩实，力量却无法从脚踝传向膝盖，整条小腿仍在，下一步已经从身体里消失。他只能以铁鞭支地，单膝重重砸下。另一侧，吉尔伽美什身后十道门扉也从画面中空去，门框之后连黑暗都未留下。她横移百步重新开门，其中一座却在完全不同的位置熄灭；那一刻，宝库深处像被挖走一段回声，她甚至想不起刚才失去的宝具原本会发出什么声音。\n\n“它没追我们的位置。”吉尔伽美什说。\n\n杨浞低头看向失去作用的小腿。皮肉、骨骼、真炁全在，唯独下一步接不上这一刻。\n\n“它削的是命往后走的那一截。”他说。\n\n杨浞抬头，隔着契约向藤丸立香开口。\n\n“御主。”\n\n北侧祭道外，立香正在向东门赶。黑色穹顶闭合后，通常通讯已经中断，杨浞的声音却从令咒最深处震进她骨头。\n\n“我听见了。”\n\n“给本王一道支援。”\n\n契约只送来一句请求，伤势与战意已经替杨浞说完其余部分。立香遂停在一座被白火洗净佛面的神像前，抬起右手；三道令咒中最外侧的一道沿手背烧亮，红光直抵指尖。玛修听见她脚步停顿便回身立盾，士郎则横移到侧面，以剑锋接住穹顶落下的火雨，为这次支援让出完整的一息。\n\n“以一道令咒为代价。”\n\n立香把手对准被固有结界隔开的东方。令咒不需要跨越物理距离，它沿御主与从者已经成立的关系直接落下。\n\n“英杰之帜——杨浞，抵达你本体的顶峰。”\n\n第一道令咒从手背烧尽，红光随即向内陷进血肉。立香掌骨骤热，契约另一端传回山脉拔地般的低频震动，魔术回路却仍保持充盈——旗帜吞掉的是令咒本身，杨浞所需的真炁则由他体内阴阳循环自行生发，一圈比一圈沉重。"

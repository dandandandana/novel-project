  "content": "固有结界内，插在荒原上的铁鞭先立了起来。\n\n令咒红光从杨浞骨中一遍遍续接断掉的脚步，他终于重新踩实荒原。灰火仍咬着小腿的下一刻，更沉重的力量却沿脊柱反压回来，Rider职阶的限制首先迸裂，英灵座复制品的外壳继而被从内部撑开。那股重量本就属于他，只是这具容器此前装不下；玄色道袍遂在骨骼持续低鸣中迎风展开。\n\n交蛇从衣纹里游出，一黑一白，沿双臂缠到肩后；鹤挂衣化作覆盖背脊的白羽，却没有给予神性，反而把最后一层神明标签从他身上剥下。他仍以人的形态站立，脚下大地却因承受那道三分之一金性而一圈圈下沉。固有结界外的修武星重新出现。它没有穿透黑色穹顶，而是让穹顶自身长出一颗白星。星光从内部照下，一切借来的名、被强加的果、藏在母爱后的支配欲都浮出轮廓。\n\n杨浞抬起眼。这次他没有自称蜀帝。\n\n“正性止淫。”\n\n荒原上所有灰火向外退开一尺。\n\n“仁威无限。”\n\n孔雀羽目里的失败未来停止燃烧。\n\n“神玄明于里，凶威溢于表。”\n\n真武正性剑自行飞回腰间，铁鞭从荒原拔出。那只一直替他疗伤的旧酒觯悬到胸前，杯中六道水火同时旋转。\n\n“本尊——天武真炁神煞真君。”\n\n白星落到杨浞身后，吉尔伽美什随即倒转EA，以剑尖抵住荒原。第二、第三圈同时旋转，低频震动先从众人骨内升起，随后所有外界声音骤然抽空。第一层红黑隔离幕向内折叠，伊耶那岐金地的山、城与弥勒佛掌被折痕推远，地平线则换成一片天地未分的荒原。赤色风暴贴着边界旋转，那里既无生命，也无会被余波卷入的居民；天照命、杨浞、吉尔伽美什与燃烧中的法相，则被完整锁进这片开天前的空白。\n\n吉尔伽美什以EA展开的固有结界就此闭合——她借来开天辟地前无人拥有的空白，将整个战场暂时包住。\n\n“现在可以打碎了。”吉尔伽美什说。\n\n至命除烧来的灰火第一次在杨浞身前三尺停住。火舌仍在往前，可每前进一寸，远处便有一尊法相胸中的光影暗下一分。杨浞向前踏了半步，灰火试图吞掉这一步，左侧第三尊法相随即发出一声短促哭喊。他立刻收脚，火焰与哭声同时止住。第二次试探已经足够。\n\n“原来账记在它们身上。”杨浞说。\n\n六十六尊法相体内的光影陆续发出声音。有的仍在诵经，有的在哭，有的第一次说出了“不”。母子线开始抖动。天照命张开鸟喙。\n\n“你用他们的痛苦动摇我。”\n\n杨浞向前走了一步。灰火从脚边分开。\n\n“是他们自己在叫。”\n\n“我生了他们。”\n\n“所以你有责任听，而没有权替他们答。”\n\n孔雀双翼向下合拢，灰火遂从两侧挤成一片海，贴着荒原无声压来。火中承载的并非杀意，而是无数生命渴望被保护的愿望；杨浞才以剑上的“真”切入，刃口便被真实愿望推偏半寸。既然不能判它们为虚假，他立刻横鞭换法：先把“保护”压成可承受的重量，再将重量拧出方向，最后沿鞭身尽数导向脚下。\n\n荒原先从鞭尾下方凹陷，紧接着才传出向远处滚去的地层轰鸣。灰火被重量拖入裂谷，沟壑一路沉到视野尽头；反震也沿鞭柄撞回右肩，旧创当场撕开，温血顺小臂灌进掌纹。英杰之帜把他推到了本体顶峰，却无法抹除已经发生的伤，至命除仍从伤口里削去恢复的后继。酒觯每缝回一寸皮肉，他便须以更强的“真”把那一寸重新钉进世界，呼吸也因此一口比一口沉。\n\n趁孔雀合翼压制杨浞，吉尔伽美什踏着连续开启的门扉切向左侧。每座门只在足底存在一瞬，她便借关合时的推力跨出上千米；尚未落脚，王之财宝已越过肩头投出屠龙长枪。枪锋逼近羽毛时，孔雀喙边卷起灰流，诅咒、锋芒与投枪者的杀意一并向内塌陷，长枪甚至来不及发出断响便消失殆尽。\n\n前一座门尚未闭合，第二道门已吐出未经命名的陨铁柱。它既无传说，也不承载“杀死天照命”的意图，数千万斤质量只凭惯性撞向左翼。灰流照样上前裹住，却在金属表面滑开；下一刻，羽骨深处传出沉闷断响，整片左翼向内折下。吉尔伽美什踏上断骨，终于找到了这张嘴挑食的边界。\n\n“原来你也有挑食的时候。”\n\n石锤、铜柱与更多未经加工的矿石遂从侧面接连撞入，密集闷震把断裂一路推向翼根。吉尔伽美什踩住最近的骨缝稳住重心，EA在掌中收成长剑，就着矿石砸出的裂口向内刺入。锋刃切开的并非寻常血肉，而是成千上万枚互相叠压的卵；剑尖每深入一尺，远处便有一尊法相替孔雀迸开伤口。那些转移的湿响隔着母子线此起彼伏，也把全部路径暴露在杨浞眼前。\n\n他隔空收拢五指，无垠沿母子线铺开，无擘则把这一握的力道锁成一股，六十六个容器再也分不走半分。孔雀体内的卵群同时一滞，EA剑身旋即在血肉深处转动，赤色风压顺骨缝炸开，整片左翼根部被撕出一声漫长湿响。黑金羽翼失去支撑，裹着山崩般的风压砸向荒原。吉尔伽美什拔剑撤离，慢掉的半步让羽缘擦过左腿，礼服与腿甲沿接触线化作透明。皮肉看不见伤口，膝后的筋腱却像被人从意识里剪断；落地时左腿毫无预兆地折下去，她只得以右掌重重拍地，把将要跪倒的身体重新撑起。\n\n孔雀右翼随即扫来。她撑地的右手打开一道王之财宝，整条手臂沉进门扉，从百米外另一道门中伸出。身体借手臂拉扯横移，右翼贴着后背扫过。三缕金发被灰火碰到，从发梢一直消失到耳侧。杨浞越过她，铁鞭敲在右翼最前端。无丈把两者距离压成零，鞭头刚碰羽尖，全部力量已落在翼根。孔雀庞大的身体向右偏转，鸟喙喷出的第一道灰光因此擦过吉尔伽美什，在荒原上留下一条没有尽头的空白。\n\n空白里连空间裂缝都不存在。固有结界被削掉一部分，外界伊耶那岐金地从裂口中露出。远处月读命金地的城墙刚进入鸟喙视线，吉尔伽美什便强行站起，EA由长剑恢复三段圆柱形态。\n\n“别让它看见外面。”"
}

  "content": "灰火只停了一息，孔雀便踏碎地层扑向杨浞。鸟喙正面撞上横起的铁鞭，龙脊在刺耳呻吟中向内弯折，冲击沿鞭柄灌进仅剩的左手；腕骨当场断响，五指被震得失去握力。天照命的利爪趁鞭身下沉掏向腹部，杨浞右手尚未长回，只能抬膝撞偏最先压来的爪尖，再借鸟喙推力向后滑卸。可余下爪锋仍贴着腰甲追入，先后割开两侧束带，随即从腹甲下缘钻进血肉；最后那截弯钩斜向上撕穿左肋，腹肌本能绞紧，又在锋口下成片断开。\n\n利爪上挑，杨浞的呼吸被伤口里那股撕扯骤然截断，整个人随即离地。天照命甩头掷出铁鞭，他也被拖着横飞出去，后背砸上荒原后连翻数次，直到剑鞘斜插入地，才从刮擦声里硬生生卡住去势。滚烫血液已经浸透腰带，裂口每随呼吸张开一次，腹腔里的重量便往外坠一分；他弯腰以残存左前臂压紧伤处，引酒觯清气沿甲片下缘缝合，这才把涌出的血肉重新兜回腹内。再次直身时，左腿因牵扯慢了半拍，而吉尔伽美什的宝具啸声已经越过头顶。\n\n无数件宝具先射孔雀受伤的左翼，迫使它把右翼转回来防御。EA化作阔剑，从羽翼转动的盲区切进颈部。天照命用鸟喙啄住剑刃，喙间第一次吐出那股灰流的名字。\n\n“食恶开明。”\n\n红黑风压中属于吉尔伽美什的战意骤然缺了一块，孔雀鸟喙的咬合力则同时暴涨；EA切开空间的那一层却没有消失，仍在羽骨上向内推进。吉尔伽美什手腕一沉，立刻把开场那些被还原的宝具、方才消失的诅咒长枪和眼前未被吞掉的空间裂口串到一起。\n\n“吃的是放进攻击里的恶，不是攻击本身。”她笑了一声，“总算肯报名字了。”\n\n剑刃停住。孔雀颈部转动，吉尔伽美什被连人带剑甩上天空。黑日里数百只眼睛同时睁开，火炮从每一枚羽目射出。她在半空打开王之财宝，门扉不是朝外，而是朝向自己。第一道门吞下身体，第二道门在三百米外吐出；火炮紧跟坐标转向，她再进第三道。七次换位后，黑日开始预测门扉出口。\n\n第八道火炮提前落下。吉尔伽美什刚从门中出现，乌色光柱便正面贯穿她左肩。肩甲、锁骨和半片胸腔被烧成透明。她没有叫，右手抓住EA，左手已经失去抬起能力。身体向下坠时，十几道门扉在孔雀腹下开启，成排锁链缠住它双爪。不是为了困住。锁链只把爪尖向外拉开一尺。\n\n杨浞从那一尺里冲进来。他没有跳，也没有飞。无丈把荒原与孔雀胸口之间的距离直接抹平。真武正性剑由左手递出，剑尖刺进羽毛下方那道被EA剖开的伤口。真炁在物理刺击与“真”的侵蚀之间连续切换。喙边灰流刚卷向前一种，剑上便只剩后一种；它转而追逐后一种，纯粹的剑锋又已经压进血肉。\n\n剑深入半尺。天照命右爪挣断锁链，拍向杨浞后背。吉尔伽美什在坠落中抬起EA。剑身变成长弓，赤色弓弦由固有结界边缘收束而来。她只有一只手能用，便用牙咬住弓弦向后拉。第一枚箭是王之财宝里一柄专门固定巨兽关节的青铜楔。箭离弦。青铜楔贯穿天照命右爪，钉进它自己胸骨。爪击被固定在离杨浞后背三寸的位置。杨浞继续送剑，直到整只左手也没入伤口。\n\n孔雀体内的心脏在他掌前跳动。不是一颗。六十六个孩子的心跳围着中央那颗孔雀心脏。降格术让它们不再替天照命承担伤害，却没有把这些关系切断。杨浞若现在以无垠绞碎中央，外围心跳也会在母亲死亡的震荡里一同停下。他停剑。天照命知道他会停。灰火从体内爆发，沿剑身烧向杨浞。左臂的皮肉从指尖开始消失，他仍没有立刻抽剑，而是用最后一瞬把无擘送进外围心跳之间，强行将六十六条相互缠绕的命分开。\n\n“吉尔伽美什！”\n\n她松开牙间弓弦。第二箭射出。EA本身化作箭矢，沿杨浞刚分开的路径贯穿孔雀胸口。赤色风压没有碰任何一颗孩子的心，只切断它们与中央心脏之间最后的伤害回路。六十六尊法相同时倒地。容器没有碎。里面的小小光影从胸口爬出，站在荒原上，第一次不需要跟随天照命一起燃烧。\n\n孔雀的至命除骤然衰弱。它失去了可以支付代价的命。天照命猛地振翼，把杨浞从胸口甩出。杨浞左臂只剩肩部，右手血肉刚长到指节。他在空中无法握武器，便朝身侧飞散的六道水火喝了一声。\n\n“檀真！”\n\n水火没有回到他体内，反而向外拼成骨、羽与一双横展的巨翼。巨大乌鸦从六色流光中探出背脊，准确接住下坠的杨浞。灰火紧跟着扫过，水火左翼当即缺失一半，名为檀真的神禽向下急坠。吉尔伽美什落在另一道门扉上。她的左肩仍是空洞，左腿也没有恢复知觉，EA重新回到右手时，指节因连续解放开始开裂。\n\n两人都没有停。天照命也没有。失去法相生命后，黑金孔雀继续缩小。覆盖天空的双翼收回到千米，羽目从成千上万减到三十六枚。力量没有消散，全部压进鸟喙前方一点。灰色并火在那里形成一轮小得异常的太阳。它没有光。周围的一切却在向它失去颜色。荒原先变灰，赤色风暴变灰，连声音都被吸向那一点。天照命不再尝试从法相或居民身上取命。她开始燃烧自己。\n\n孔雀羽目一枚接一枚熄灭。每熄灭一枚，都是一段她保存的人类未来永久消失。学校、电车、月球基地、没能抵达星空的飞船，全被压进鸟喙前那轮灰日。杨浞站在檀真背上，脸色第一次沉下去。\n\n“她要把自己的命全打出来。”\n\n吉尔伽美什用EA支撑身体：“正合适。”\n\n“你还能开几次？”\n\n“杀她够了。”\n\n“本王问的是几次。”\n\n“你先顾好自己的手。”\n\n杨浞低头。右手长出一半，左臂仍空。腹部封口被刚才的震荡重新撕开，檀真的水火正在替他压住内脏。他把旧酒觯召到面前，用新长出的三根手指握住杯沿。\n\n“本王要用宝具了。”他说。\n\n吉尔伽美什看向鸟喙前那轮灰日。\n\n“你压，本王开路。”\n\n“别把结界先拆了。”\n\n“少教本王。”"

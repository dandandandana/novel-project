  "content": "天照命的灰日聚至针尖大小，周围最后一缕声音也被吸了进去。孔雀省去了吟唱，探颈便将灰色光流从鸟喙推出；荒原来不及爆炸或融化，正前方那条直线已经先从视野里褪去，沿途事物仍留着轮廓，继续存在的资格却被光流向前铲空。杨浞迎着那片静音倾斜酒觯，一滴清液从杯沿滚落。\n\n“问武于天。”\n\n修武星从固有结界内部下降。白光不再铺满战场，全部汇入杯口。\n\n“平清于地。”\n\n六道水火沿杯身交错加速，发出河流冲击窄岸般的层叠声。最先掠出的无明扰乱了灰光对白线的判断，紧跟其后的无丈便从那处误差里展开距离，把一滴液体拉成长河；至命除试图从中截走数段，无擘旋即收紧水势，使每一滴仍属于同一条河。待无常推动“真”在概念与物质之间反复转化，无垠才沿河面向外铺开，把杨浞一人的裁决送遍整片荒原。\n\n“阴阳交泰，水火同归。”\n\n清液离杯，一滴水旋即奔涌成白色洪流，与灰光在荒原中央正面咬合。碰撞处听不见爆炸，只有一段越来越宽的静默黑线：白与灰在那里互相抹除，声音也来不及逃出。灰光每烧去白流的一段后继，清河便反过来照见它所支付的命；天照命燃烧失败未来，河面便映出那段未来中真实活过的人，她再熄灭一枚羽目，白流又将其从“燃料”剥回“被保存的时间”。九枚卵壳的搏动逐渐穿过对轰，重新传入众人耳中。\n\n至命除无法再无代价前进。\n\n“真炁长存，虚妄尽灭。”\n\n白流由此向前推进，天照命则收紧双翼，以二十七枚羽目同时熄灭为代价把灰光重新顶回。接触面被推到荒原中央，泄出的余波沿左右两侧切开固有结界，外界黑色穹顶随即露出两道笔直裂口。光束尚未触及伊耶那岐金地的山脉，山腹矿层的震动却先断成两截；数息之后，东西两侧山系才从中段缓缓下沉，岩层错位的轰声仍被远距离压在后方。\n\n吉尔伽美什举起EA，却避开对波中央——乖离剑若从正面切入，杨浞的白流也会一并裂开。于是三段圆柱先同向旋转，低沉震频贴着灰光两侧推进，将天照命向外泄露的力量逐寸压回主轴。灰光因此变得更强，活动余地却被赤风锁死，再也无法偏转。\n\n“倾此一觯，以正乾坤。”\n\n杨浞右手五指完全长回。他握住酒觯，向前倒尽。\n\n“——『问武平清觯』。”\n\n真名落下，漫天白流骤然收束，不再与灰光争夺范围，只沿主轴中央凿出一线。天照命保存的最后九枚羽目被依次照亮，里面的人声挣脱燃烧时的尖啸，重新聚成九枚透明时间卵坠向荒原。孔雀由此失去最后一批可烧的未来，只能把本生压入灰日；灰光也随之缩到百米，规模骤减，密度却高到第一次把白流钉在原处。\n\n细裂纹从酒觯底部爬向杯沿，每延伸一寸，杨浞的指骨便跟着震出一声脆响。英杰之帜虽把从者灵基推到顶峰，这具容器承载的终究只有三分之一金性；对面天照命却已把整条本生命压进灰日。白流能逼她为众生付出代价，却无法替她选择是否燃烧自己，因此接触面在两人正中停死，黑线两侧的地层持续向下粉碎。\n\n“第一宝具压住了。”杨浞说。\n\n话音被胸腔里的淤血压得又低又哑。\n\n“还差一击。”\n\n左臂已来不及恢复，杨浞索性松开酒觯，让杯身独自悬在前方维持白流，刚长全的右手则反扣铁鞭。鞭柄才压进掌纹，腰背肌肉便本能绷紧，腹部那层勉强合住的薄肉随即撕开；热血贴着腰侧往下淌，他只得以真炁封住裂口两端，借檀真振翼抬升的瞬间踏出。无丈将这一步直送对波上方，灰白两股洪流在脚下互相碾灭，余波先削去鹤挂衣，继而从足底向上割裂皮肤。每抬高一寸铁鞭，右肩外露的锁骨便在血肉里磨出一声钝响，他仍把鞭身举到身后，等待唯一能够下砸的角度。\n\n龙脊鳞纹依次亮起。\n\n“龙脊成鞭，真道为策。”\n\n铁鞭向下一沉，檀真残背先被压得骤降数丈——那并非体积增长，而是被斩恶龙的整段历史重新落回龙脊。四尺鞭身沿鳞节向外延展，青龙残魂绕过杨浞右臂，在天空盘成巨环；龙吟穿透灰白对轰，荒原地层也随声成片翻起。天照命被迫分出尾羽迎击，灰光因此向上偏移一瞬，问武平清觯立刻抓住空隙推进十丈。\n\n“奉天之命，行地之诛。”\n\n杨浞拧动腰背，将青龙残魂的全部重量压进自己右臂，而后亲手挥鞭。右肩旧伤被转体彻底撕开，锁骨刺穿皮肉时响起一声钝裂；腹部封口也在同一刻崩断，热血沿挥击轨迹拖成长线。剧痛迫使腰身向左塌陷，他便以右腿蹬住檀真脊骨补回角度，使鞭头仍沿白流凿出的唯一通道砸向孔雀头顶。天照命只得收回一半灰光，凝成黑金尾羽逆势上抽。\n\n两件宝具在对波上方相撞。\n\n“策玄鞭落——万法归真。”\n\n青龙与黑金尾羽迎头咬合，鳞片刮过羽刃的尖响顷刻盖住对波；青色真炁与灰色并火从交界向两侧喷开，沿途地层一边结晶、一边失去颜色。青龙残魂的下颌先被撕裂，铁鞭实体却借其崩散的冲力继续下压，第一层尾骨遂在闷响中折断。天照命把恢复可能尽数灌入羽翼，断骨在鞭下边碎边长；无常则反复改变新生的性质，使每一截长出的骨骼都只能作为真实血肉，再承受下一轮碾压。\n\n“——『奉真策玄鞭』！”\n\n铁鞭终于压到孔雀额前三尺。下方灰光与白流相持，上方尾羽又被龙脊碾住，两处反力共同撕开孔雀胸骨，裂响一路延伸到翼根。黑日仍连接着远处居民，只消一个念头，她便能再抽来一层力量；可乌金线在众人胸前震颤良久，始终没有一滴命流向她。吉尔伽美什看见了这个选择。\n\n“终于像个母亲了。”\n\n吉尔伽美什以右手握住EA，左肩的空洞却使剑身不断向一侧倾斜。她遂从王之财宝扯出金锁，任锁链勒进创口，将前臂与剑柄捆成一体；左腿同样无法承重，便再取长枪贯穿脚背，把自己钉在荒原上。身体终于稳住，三段圆柱随即反向旋转，低频震动牵动整片赤色天空向剑身汇聚。用于包裹战场的边界由此逐寸收缩，结界外壁每退一寸，EA便从开天前荒原取回一分力量。\n\n“醒来吧，EA。”"
}

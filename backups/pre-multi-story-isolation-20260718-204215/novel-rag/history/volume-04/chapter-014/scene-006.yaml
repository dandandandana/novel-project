  "content": "“一群人守一根柱子，还能把自己弄得这么难看。”\n\n那句嘲讽才穿过石杵砸落的闷响，士郎已经凭语气认出来人。\n\n“Alterego。”\n\n“别叫得像见鬼一样。本来你那张脸就够晦气了。”\n\n黑翼从石台上空骤然展开。阿尔托莉雅从翼影里垂直落下，双脚没有触地，黑金色的长剑先斩进北面巨掌的腕部。暗色魔力沿剑刃灌入，风压不是向外炸开，而是顺着立香刚切出的那条连接线向内旋转。巨掌的腕骨被整齐绞断，玛修盾上的重量骤减。\n\n“向右。”阿尔托莉雅说。\n\n玛修立刻撤盾侧身。断掌擦着她肩甲坠下石台，砸进北侧深谷。掌心城已经被立香推向祭道外侧，落地前被一层黑色风托住。城里的几百个人仍闭着眼，没有一个被震醒。信标最后两格亮起。自锁完成。士郎拔掉钉住左脚的剑，转身时右腕的裂纹已经爬到肘部。Alterego扫了一眼那只手，没有帮他，也没有问疼不疼，只把黑刃倒转，刀柄朝他胸口一送。\n\n“拿着。你投影出来的垃圾快撑不住了。”\n\n士郎接住刀柄。真实金属压进掌心，他手臂上的投影裂纹停止扩散。\n\n“谢谢。”\n\nAlterego脸色更差：“我开始后悔了。”阿尔托莉雅落到他身侧。左臂那只紫红咒文交织的臂铠仍然闭合，七道承伤刻纹一条未亮。她看都没看本尊士郎，只把剑对准剩余卵门。\n\n“父亲，先离开这里。”\n\n“信标不能无人看守。”立香说。\n\n阿尔托莉雅转向她。暗金瞳孔在立香脸上停了一瞬，称呼没有改变：“主炮发射前，它不会再被碰到。”立香顺着她的视线看向石台边缘。Alterego刚才斩断的三具法相没有重组。黑刃在伤口里留下了彼此冲突的三种神性，把弥勒的佛果卡在容器外面。阿尔托莉雅切断巨掌时则在腕部刻下了死之印记，所有试图重新长回来的金光都沿印记流失。\n\n他们确实有能力守住这里。\n\n“你们为什么来？”立香问。\n\n“修复特异点。”Alterego说。\n\n“神琦灰让你们来的？”\n\n“她没拦。”\n\n“这不是回答。”\n\n“那女人从来不需要我们替她回答。”Alterego把一尊扑来的法相踹下石台，语气仍旧像在说一件令人厌烦的小事，“你是不是一直想不明白，她为什么不在乎迦勒底被人理抛弃，也不在乎你们能不能正常召唤？”\n\n立香的沉默已经是回答。Alterego抬手召回黑刃，刀柄从士郎掌中挣脱，贴着两人之间的空隙倒飞入手；他就势反刺，刃尖贯穿身后一枚卵门。门内迸出的并非血液，而是一声短得来不及延续的婴啼。\n\n“因为她要的从来不只是保住现在这条人理。”\n\n“她要什么？”\n\n“不知道。”\n\n立香盯着他。\n\n“别用那种脸看我。她若肯把计划全告诉一件杀人工具，我也不会活到现在。”Alterego拔刀，卵门从中间塌缩，“我只知道，她不在乎迦勒底，是因为迦勒底对她的目的来说既不是终点，也不是唯一手段。你们赢，她有接下来的做法；你们死，她也有。”\n\n“你还替她做事。”士郎说。\n\nAlterego回头看着与自己相同的脸。\n\n“所以我才讨厌你。”\n\n士郎把两件事之间的疑问压回喉间，因为阿尔托莉雅左臂的臂铠恰在此刻震了一下。甲片深处传来黏稠的挤压声，极细黑泥从缝隙渗出，尚未滴落便被她重新压回去。立香与Alterego同时捕捉到那一瞬，谁也没把目光停得太久。\n\n“不准开。”他说。\n\n“尚未到必要时。”阿尔托莉雅回答。\n\n潘多拉的盒仍然锁着。那是他们修复特异点的底牌，也是会把阿尔托莉雅本人一同吞掉的灾厄。黑日正在扩大。\n\n“东门需要支援。”她说。\n\n“这里交给我们。”Alterego甩去刀上金血，“去做你这个御主该做的事。”\n\n立香看向士郎的右腕。裂纹没有继续扩散，但他刚才承受的佛光已经烧进投影回路。士郎活动了一下五指，先开口：“能走。”\n\n“我没问。”\n\n“你正准备问。”\n\n立香伸手握了一下他的手腕，避开裂纹最深的位置。确认骨骼和肌腱都还完整后，她松开。\n\n“那就走。玛修，东南侧撤离。信标留给他们。”\n\n三人越过石台南缘。身后卵门再次开启，阿尔托莉雅的黑翼随即遮住整片台面。暗色极光没有直接轰出，她贴着门的边缘挥剑，把每一枚卵从现实里剥开。Alterego站在信标旁，白色风衣被狂风向后扯直，投影出来的剑一柄接一柄插进石台。立香没有回头。\n\n她相信他们会守住。地下白墙也在这一刻裂到了底。村正面前不再是门，而是一片没有完成的世界。白火铺成大地，却没有山川；清光挂在上方，却没有日月；数不清的生命轮廓从火里生出，刚有四肢便又退回无形。创造之禊祓不是一件被关闭的兵器。它在反复尝试创造，又在每次成形前主动抹掉结果。"

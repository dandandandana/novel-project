  "content": "玛修的盾还保持着横击后的角度。无头法相向前走了两步，胸口佛印才从中间裂开，庞大身体朝左倒下，砸碎两座无面的神像。士郎从倒塌的石块上跃过，右手投影出的短剑贴着另一尊法相膝后切入。他没有硬砍，剑锋沿关节缝向上一挑，膝盖里的金色轴骨被挑出半截。法相重心下沉，玛修随即补上盾撞，把它从祭道右侧推下断崖。\n\n从第一尊到第二十九尊，他们只用了三分钟。立香没有出手。她一边奔跑，一边把每一尊法相倒下的位置标进终端。它们来得太整齐，前十尊试玛修盾面的承压，后十尊逼士郎增加投影次数，最后九尊开始故意留下向左的空隙。有人在赶他们去信标点。\n\n“还有四百米。”士郎落到她右侧，投影短剑在手里碎成蓝光，“右边少了。”\n\n“不是少了。右侧在等我们进去。”\n\n玛修仍盯着右侧那条故意留下的空隙，盾沿小臂缓缓转过半面：“前辈，要改变路线吗？”\n\n“不改。对方既然知道信标点，绕路只会把伏击地点换到我们看不见的地方。”\n\n立香抬头。祭道尽头是一座半塌的石台，石台下方正对未来文明主炮的贯穿轴。信标必须钉在台心，偏差超过三米，炮击就会擦过弥勒降格后的肉身，先把伊耶那岐金地剩下的人一起蒸发。\n\n“玛修，进台后守北面。士郎，放信标。我负责确认地下炮线。”\n\n“你不负责看身后？”士郎问。\n\n“身后交给你。”\n\n“那信标呢？”\n\n“也交给你。”\n\n士郎侧过脸：“工作越来越多了。”\n\n“回来给你减。”\n\n立香说完才意识到这句话接得太快。士郎看了她一眼，没有笑，也没有借机追问。他只把风衣内袋里的纸星星往更深处按了按，确认不会在战斗里掉出来。\n\n“记住了。”\n\n石台到了。玛修第一个踏上去。盾底撞地，圆形防御纹路沿石台边缘铺开。士郎紧跟着滑进她留下的半圆死角，左膝触地，从风衣内取出主炮信标。那是一根不足一尺长的黑色金属柱，表面没有按钮，只有顶端一圈幽蓝刻度。立香越过两人，站到石台南缘。她抬起右手，逆向根源术式沿指尖向地下探去。脚下先是岩层，再往下是被弥勒佛光改造过的金属地脉，最深处才碰到未来文明主炮冰冷、笔直的炮管。\n\n坐标吻合。\n\n“放。”\n\n士郎把信标压进石台。金属柱只入地三寸，整座石台便发出低沉回响。幽蓝刻度依次点亮，一道看不见的直线从地下穿过立香身体，指向伊耶那岐宫上方那尊仍未完全显现的弥勒法身。信标安置完成。没有敌人冲出来。祭道上忽然安静。立香看了一眼终端。东门的杨浞与吉尔伽美什仍在交战，地下组信号依然熄灭，石台周围却没有任何移动目标。\n\n“太顺利了。”玛修说。\n\n“不是顺利。”士郎站起身，手里已经投影出一柄长剑，“是门关上了。”\n\n来路上的二十九具法相残骸同时抬头。它们没有头，动作却整齐得像听见了同一道命令。断臂、碎骨和被盾牌压扁的胸腔从石缝里升起，在半空重新拼合。祭道两侧那些被削去原有面孔的神像也开始转身，佛面从石头里向外鼓起。石台东、西、南三面各亮起九枚卵形光门，北面的断崖下则伸出一只覆盖整面崖壁的金色手掌。\n\n二十九尊不是伏兵。它们是锁门用的材料。立香把手从地下炮线里抽回。通讯器在同一刻失去所有外部频道，只剩三人之间不到五十米的短距连接。\n\n“瓮中捉鳖。”她说。\n\n士郎把剑尖对准最先爬上石台的法相：“谁是鳖？”\n\n“对方大概没想过这个问题。”\n\n玛修向前一步，盾面挡住三道从卵门里射出的佛光。光没有被弹开，而是贴在盾上向两侧爬，试图绕过她去烧信标。她压低重心，靴底在石台上滑出两道深痕。\n\n“前辈，信标是目标！”\n\n“守住。只要信标还亮，局就不算合上。”\n\n士郎投影第二柄剑。他没有冲向围上来的法相，而是把两柄剑交叉插进信标左右。投影结构沿地面展开，先把金属柱与石台绑成一体，再把承受佛光的部分导向自己手臂。第一道裂纹立刻出现在他右腕。立香看见了，没有叫他停。石台西面已有四尊法相同时跃起，她必须先让它们落不到信标附近。\n\n她抬手，五根黑色线从指尖射出，钉进最前方一尊法相的关节。不是降格术，只是逆向根源最基础的结构干涉。她理解骨骼如何承重，于是强迫那具法相按人的方式承重。法相原本能无视姿态悬在半空，下一瞬却被自己的重量拖下，砸中后面三尊。\n\n玛修横盾撞入倒地群中。盾缘先压断一条腿，身体顺势旋转，盾背把另一尊法相拍回卵门。士郎拔出一柄护住信标的剑，沿她左肩上方掷出，剑在空中分成十二枚，穿过玛修故意让出的缝，钉住东面光门。卵门没有破。里面伸出十二只手，握住每一柄投影剑向内拖。\n\n士郎手臂上的裂纹又深一层。\n\n“它们在学。”他说。\n\n“让它们学错。”立香回答。\n\n她冲到玛修身后，手掌按上盾背。逆向根源术式没有向敌人展开，而是覆盖玛修的盾。接下来撞上盾面的佛光全被她强行理解成“有方向的冲击”，失去绕行和侵蚀能力。玛修立即变换角度，把三道光束折向西面。倒地法相刚爬起，便被自己的佛光贯穿。战局改变了。\n\n但石台下那只金色巨掌已经抬到与台面齐平。五根手指从北面合拢，每一根都比祭道更宽。掌心不是血肉，而是一座盘坐着数百人的小城。那些人闭着眼，双手合十，嘴里念着同一句“留下”。玛修不能把盾撞过去。里面的人是真的。立香也不能用降格术把整座掌中城压成人类肉体。她一旦理解错误，那几百个人会先被巨掌自身重量碾死。\n\n对方挑的正是他们不会打的位置。\n\n“士郎，信标完成自锁还要多久？”\n\n“九十秒。”\n\n“我们只有二十秒。”"
}

  "content": "天照命落在最后。结界坍缩每越过一层外壳，黑金孔雀便缩小一截：遮蔽天幕的双翼先收回千米，继而退到百米、十米；佛果剥落时响起重叠诵经，太阳权能离体时又像湿纸从皮肉上缓缓揭开，至命除的灰火最终在羽根间熄灭。待所有借来的东西都被裂口刮净，掉回东门的只剩一只寻常大小的黑金孔雀。它以仅余三根尾羽勉强平衡，爪尖才碰到断裂金砖，身体仍向侧面歪去。\n\n杨浞被檀真放在孔雀前方二十步，靴底一沾地，腹部封口便又渗出热血。他只能以右手握住缩回四尺的铁鞭，鞭身中央那道裂口几乎贯穿龙脊；左臂仍空，右肩锁骨裸露在外，每次呼吸都磨得伤处轻颤。檀真在身后收拢残翼，化成水火退回体内。吉尔伽美什也从最后一道门扉跌出，右膝撞地的闷响格外清楚；她立刻以EA撑住第二次下坠，左肩空洞映着后方黑日碎片，失去知觉的左腿拖过碎砖，右手虎口则因连续解放一路裂到腕部。\n\n两人谁也无法再稳稳站直，修武星却已重新照进真实天空。黑日碎成数百片乌金云，太阳权能从缝隙间泄向四方；固有结界替外界吞下了绝大部分对轰，伊耶那岐金地因而尚存，东门九层阵地却被彻底挖去。原地只余深达数百米的圆形盆地，边缘岩层受三股力量反复压炼，凝成白、灰、赤三重结晶。\n\n远处山系仍在下沉，沉闷轰声隔了数息才从地底追来，贴着盆地滚过，又吹起孔雀仅余的三根尾羽。它在这片余震里抬头看向杨浞，开口时，世尊的重音与天照御名的回响都已剥落，只剩庭院里那只孔雀初学人言般的单薄嗓音。"

content: '话语落地的那一瞬间，她的双眼忽然把焦点从士郎的瞳孔上剥离了。虹膜中心那片黑色从里向外慢慢推——几乎把整个红眸都浸成了失焦的暗面。


  然后她眨了眼。瞳孔回归时她把眼帘在重开之后闭过一息——像是在关上刚才那张被她打开的窗。


  “你指的是。”她把声音放沉了。嘴唇在说这几个字时分开的速度比刚才所有的问题都要慢。“把沙条爱歌变成BEAST VI。然后进行兽体实验。”


  “我其实是BEAST保护协会的。我将对埋葬机关发起起诉。”


  祁荒开口。她的语调忽然往上一扬——唇边的线在左边往侧边扯成了比之前所有笑都窄的一截——但她的眼睛没跟着嘴走。


  “不是。拿BEAST做实验。不对。为什么你们这里这么多BEAST。还有这个吉尔伽美什是什么鬼。”


  她的问题被她自己从节奏上切成了三截。每一截的末尾都往下微微一压——像是每个问题刚从嘴巴里抛出来就被她自己用下一个问题从底座上打掉了。


  “呃呃。祁荒前辈。看样子需要解释一下了。”


  玛修开口。她从刚才一直在盾牌另一侧看着士郎和祁荒之间的话来回弹在她自己头顶上方这片蓝白色的光域里。


  她把大盾从左手换到右手。再从右手换回左手。嘴唇在她开口之前翕动了两次。第一次出口时只有一声极轻的吸被从齿间漏了出来——第二次她整了整自己的呼吸然后把她那头紫发的脑袋朝祁荒方向微微低了一截。她用最简短的话把迦勒底经历过BEAST的数量和来龙去脉补上了。


  祁荒听完后沉默了不到一息。


  “等等。神琦灰这么厉害。”


  她的嘴唇闭着。但她的牙在她自己看不到的角度上又咬了一次。


  【这货当时打ORT的时候在当演员。】


  祁荒把脑袋别向一侧。她的红眸瞥向休息室白色天花板上一小片被盾面反射出来的银灰色光斑。


  “算了。这位确实是有点厉害了。根源魔术。真是想。”


  她把嘴张了张。然后自己把它合上了。


  “不对。”


  【卫宫白也彻底剥离了根源的影响。她俩谁厉害呢。】


  她让这个念头在脑子里转了半圈。然后她把自己右手从袖口里露出半截手指前端。指尖在空气里轻轻一摆——动作小得刚好在袖口的遮掩下看不见。


  【卫宫白现在心灰意冷。半点和拯救世界相关的都不想沾惹。本来偷渡过来就是求了她好久。】


  她想到这里就把这个比较从自己脑子里推了出去。抬脸重新看向士郎时已经没有任何思维的残留。


  “根源魔术啊。你的这个身体就是用这个东西搞得吧。”她饶有兴致地把尾音往上微微一挑。红眸在歪头时重新亮起来。“嗯。你所用的那种很好用的小魔术实际上都是根源魔术的变体吧。”


  “哪有。都是原理血戒。”


  士郎开口。他把手从下颌上放下来垂回到自己腿侧。


  “嗯。都是神琦灰改的吧。”


  祁荒把自己的话从他上一句的尾巴上直接踩进去。红眸没有眨。


  “不说别的了。言峰士郎。”祁荒沉声开口。


  她把肩膀从墙壁上离开。木履在合金地板上轻轻敲了一步——嗒——她把那一整步的距离用脚底往前走完了之后停在他正对面不到半臂的位置。


  “你觉得拥有这种力量。神琦灰为人良善的可能性有多大。”


  这句话没有笑。她把红眸稳稳地放进他的琥珀瞳里。


  士郎想了想。


  “她并不算良善。做事随心所欲。而且观念很极端。”


  “有多极端。”


  “举个例子。她是极端人类至上主义者。”


  士郎把肩骨往上一耸然后又落回原处。整个过程快得肩头在衣料下只浮了一次。他脸上没有任何表情陪着这个耸肩一起走。


  “明牌的双标。”


  “嗯嗯。种族灭绝是常有的事情了大概。比如神兽。哦对了。神代我没记错的话。”


  “嗯。有种长着单角体型像鹿的神兽。没记错是喜欢处女来着。”


  言峰士郎把目光往舱体上方那片白茫茫的无影灯源稍稍一移。


  “嗯。没记错是由于吃了个人。头目不愿意什么来着。就被灭族了。”


  “你把种族灭绝说的这么轻而易举。那种好歹是幻兽吧。”祁荒的声音在问题里往前猛推了半度——她把脑袋朝他方向倾得比刚才每一种歪头都快。“等等。种族灭绝怎么说都不是对的吧。”


  “她不觉得不对就是了。”


  士郎把视线从灯源上搬下来重新落进她的红眸里。他说这句时的语调是平的。


  “但是某种意义上来说。她确实是爱人类的。”


  “这种爱最后都会变成beast吧。”祁荒把嘴唇轻轻一抿。她把一口长气从鼻子里慢慢往外漏。“她现在怎么样。”


  “死了。”


  言峰士郎把这两个字从自己嘴里往外推。声音极轻——这两个字落音之后的余响连他自己的耳廓都没能兜全。


  “。”


  祁荒的眉从眉骨上向上挑起然后自己停在半途。她张嘴时嘴唇在无声地做着某一个形状——那个形状上没有声音。'

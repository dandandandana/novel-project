content: '“死了。她不就在冠位时间神殿吗。”


  言峰士郎的瞳孔在眼眶底部从中心往四周猛地推了一圈。黑色从琥珀颜色的正中间往边缘吞去——然后在他瞳底深处停住了一瞬。


  “不可能。她确实是死了。这是被吉尔伽美什确定的。”


  他把这句话从自己喉咙里往外硬压。每一个字都压在同一个语调上——但他的眼皮已经在自己眼珠上方微微往下收了半寸。


  “嗯。”祁荒一愣。她把眉梢又往上多抬了一次。“那是我的千里眼出问题。哦看不见了。”


  然后她把唇角往左边轻轻一扯。那层笑意从她嘴角往上推——但停在唇边就断了。


  “那就是没错了。千里眼的观测被她发现了。”


  “所以。”


  “现在的情况糟透咯。嘛。不知道她会不会过来。”


  祁荒把这句话一点点从自己嘴巴里往外拂。声音不重——轻到像是在通风报信。


  言峰士郎脸上的光影从眉弓往颌骨方向往下坠了半拳。他的双颊骨骼在那瞬间更加清晰的从皮肤下凸显出来。“你的意思是你把那个假货引过来了。”


  “嗯哼。没错。”


  “菩萨院祁荒。”


  他把她的全名一个字一个字从自己喉咙底下往外拽。声音不响——但每个字的底盘都狠狠地往下蹲了蹲。他上半身朝她方向前倾了不到半拳。


  “别担心。她只是切断了联系。但是还没来哦。”


  祁荒仍然笑着。她把头往他方向微微一歪。脆得像是落在了合金地板上又弹进空气中。


  “那和来了有区别吗。”


  “有准备时间啊。”


  “你这个。”'

content: '“是。”


  言峰士郎把视线往上一抬。舱体蓝光从他右眉弓往下拉到下颌的笔直明暗分界在他开口时没有任何偏移。他看着站在对面已把肩膀离了墙壁正微微将脑袋往自己这边偏过来的观音。


  “你知道她？”


  他把这个问题往空气里一放。声音不响——但音调里没有试探也没有挖陷阱的意思。他只是在问一件自己已经知道答案的事情。


  祁荒点了点头。


  她头上的白玉簪和银质叶饰在点头时轻轻撞出一小片密密的声——那层响声在休息室的白色墙壁之间弹了两回就被舱壁软垫吃了。


  “那个精灵啊。”她把话尾往上一卷然后落在叹气一样的气音上。“不过所处的世界不一样，我觉得我认识的她和你认识的不一样。”


  她把最后一个字拖着往下降了一点点。


  “我认识的那位可是一个。”


  她把话在这里截停了。牙关在她侧颊的肌肉上推了一条极轻极窄的线。


  “对一种事情痴迷到了极点的家伙啊。”


  这句话从她唇间往外掉时每一个字都像是在自己咬自己。


  “神琦灰是我的师父，你说的这件事情。”言峰士郎把上身从靠背上稍稍往前拉了不到半拳的距离。他的后背从椅面上离开时战衣的布面在椅背的软衬上蹭出一声极轻的沙响。


  “我倒是能够理解你说的这一点。”


  他没有对这句痴迷做出反驳。他把头朝祁荒方向点了点——然后是沉默——那个动作就代替了所有他说不出口的同意。


  “哦？你的师父啊。”祁荒把脸重新转回到他身上。红眸里的焦点在她歪头时稳稳地落在他眼角。“说实在的这个世界的你还有个师父真是令人惊讶。”


  然后她自己把自己的话掐断了。脑袋往前倾了不到一寸，脖子上那串琉璃珠串在颈侧轻晃了半圈。


  “等等。谁？”


  “神琦灰。她是我的师父。”


  士郎看着她的脸。他把回答一字一字往外推。每个字的间隔都一样。他不是在重复自己的话——他是在用同样的音节确认一个他没想到她会愣了一下才反应过来的名字。


  “你说那个原初之一是你的师父？”祁荒的红眸在眼窝里定了一下。她把自己的头往右边轻轻一偏。“她难道没有闲得没事干天天在她的窝里面研究什么奇怪的东西？”


  “她哪有那么闲。”


  言峰士郎把自己的话一出口自己就顿了一下。舌面在他的上颚上贴住了半息——然后他又开口。


  “不对。她确实挺闲的。如果你指的是不知道有什么事情可干的话。那确实。”


  他把自己刚才的话咽回去时没有收尾也没有补修饰。他甚至没为自己的自相矛盾做解释——他只是用更慢的速度把修正后的判断重新递出来。


  “这就对了嘛。毕竟是原初精灵还是天才。”祁荒把嗓子里的悠悠声往前轻轻一淌。她笑起来时唇边的线向左边比平时多扯了一丁点。那道笑从左边唇缘往外偏了极有限的一截——然后就跟水被砂土吸掉一样从唇边退了。


  “她闲的没事干干了什么？”


  “如果你硬要说的话。”


  言峰士郎把脑袋往椅背上轻轻靠回去。他说话时眼睛没有看祁荒——他把视线搁在自己对面的白色舱壁上。


  “最大的成就大概是开发了根源魔术吧。”


  祁荒脸上的表情在那半息之间被抽走了所有刚才还留在上面的轻松。她的五官仍然在她的脸上——嘴仍然张着刚才那个想要接话的形状——但从眉毛以下到嘴唇所有的肌肉都不动了。舱体蓝光把她被抽空了的脸色映成一片干净的冷色底板。


  “开发了什么。”


  她把这句话从嘴唇之间往外挤。每个字的音头都压在她自己的下牙内侧。


  “根源魔术。”


  言峰士郎把眼睛从舱壁上收回来重新看进她眼里。


  “你知道‘根源’和‘魔术’这两个词语连在一起有多么荒诞吗。言峰士郎。”祁荒把自己的语调从刚才所有的悠悠声色里猛地往下拽——然后她顿了顿，下巴往下微微一沉。“利用根源。你指的是两仪家的那位和纱条家的那位？”


  “两仪家那位是谁。”


  士郎把眉心往中间轻轻拧了一下。这个名字在他脑子里碰到他所有记忆栏的底部——全弹回来的是空。


  “沙条爱歌是吗你说的是。666之兽是吗。”


  “嗯。没错。你知道你刚才说了整个魔术界会震惊的事情啊。”


  祁荒的声音被她自己从喉咙里往外推着。她把“震惊”两个字咬得比整句话里的其它所有字都要重一丁点。


  “嗯。说到底那个根源魔术也有沙条爱歌的一份功劳就是了。”


  言峰士郎把拇指侧面轻轻蹭过他下颌的侧缘。动作放得极慢——刚好足够他把刚才那几句话在心里重新过了一次。


  “具体的我不知道。但是如果你指的是那个一大坨黑泥的话。那确实是沙条爱歌。”


  “什么意思。”


  祁荒歪头。距离从刚才的愣神到现在的歪头只隔了一次睫毛往眼睑上落下去再抬起来的间隙。


  “等等。我看一眼过去。稍等。”'

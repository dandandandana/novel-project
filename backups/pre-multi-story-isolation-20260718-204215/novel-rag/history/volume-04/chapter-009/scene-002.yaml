content: '“第一跃迁纪。”


  “人类第一次得到来自旧文明的遗产。”


  “饥饿被解决。”


  “寒冷被解决。”


  “瘟疫被解决。”


  “战争失去必要。”


  玛修轻轻睁大眼睛。睫毛从眼睑底部往上撑了一下，她看着那些字，低声说道：


  “前辈……这看起来，几乎像是理想乡。”


  “只是看起来。”


  士郎把声音压得很低，低到只有站在他和玛修之间的立香，能听见字与字之间那层浅得几乎没有间隙的距离。


  立香没有反驳。


  下一幅画已经把她的反驳先画了出来。


  在那些比白昼还要亮堂的城市最下层，仍然有人跪在巨大的机械前。


  那些机械不是神像。


  可看它的人，却把看神的目光贴在了钢铁表皮上。


  炉心最核心的端口，被少数人握在手里。他们坐在高处，身上穿着立香刚才在这座博物馆任何一个展柜里都没见过的衣料。


  他们身后有一整面透明屏幕。每一道正在流向底下人群的能源分配线，都在上面标得清清楚楚。


  下面的人接到配给，端着配给。


  配给足够多。多到每个人都能填饱胃，穿暖衣服，住进不漏风、不漏雨的房子里。


  但谁今天能得到多少，轮不到他们说了算。


  立香把一口气从两排肋骨之间慢慢压出去。她背对着那幅画，可身体还没转回去，脖子已经先往回收了一寸。


  “生产力一下子跳上去了，可社会关系没有跟上。”


  她把声音压到自己刚好能接住。


  “他们拥有了足够养活所有人的技术，却还是用旧时代的方式去管理它。”


  “封建制拿到了不该属于封建制的生产力。”


  士郎把头往她那边倾了倾。


  村正把扛刀的手往肩窝上轻轻一顶。那把大太刀在她肩上压出的凹痕又深了一道。她歪头看着立香和士郎。


  “意思是，饭够吃了，但是分饭的人还是原来那批？”


  “差不多。”


  立香把自己的左手从嘴边放下来，搁在栏杆上。


  “而且会更糟。”


  她话音刚落，壁画就像有人在等着她接话一样，继续展开。


  起义出现了。


  一开始是牌子。


  人们举着木头牌子站在炉心塔下。牌子上写的是要求公开炉心运转记录，废除世袭分配权，让所有人都能学习旧文明技术。


  站在高处的那些人没有直接派兵。他们只是把几个街区的炉心关掉了。


  于是，第一批人冻死在他们本应永远温暖的家里。


  第二次请愿，不再只是举牌子。


  第三次，是暴动。


  然后是战争。


  屏幕上从容地闪过一行字，又在那行字下面停住。过了很久，新的一行字才从底下往上替换出来。


  “记录修正：战争并非因匮乏而起。”


  “战争因不平等而起。”


  玛修把手指往掌心里轻轻一收。指腹压进去之后，掌心上留下一道浅浅的印子。


  她自己没有发现。


  村正也不再东张西望了。


  他们继续往下走。


  旋转楼梯还在向下延伸，墙上却已经不再是那些带血的壁画了。


  旧领主倒下之后，新的城市议会从一张张选票里冒出来。


  展柜里的东西也不再是那些粗砺的推车与水车，而是开始出现统一规格的课本。课本里面，是给孩子解释魔力回路用的简易模型图。旁边还有一台可以让普通人使用的治疗仪。


  再往前，是一枚徽章。


  那枚徽章被单独放在玻璃柜里，上面刻着四个字。


  “知识不得世袭。”


  立香的视线从柜子上拔不起来。她就那样站在玻璃前，看了很久。


  “这句话真好。”


  她的声音从嘴唇往外飘时，连音头的重量都没有。


  士郎看了她一眼，没有接话。


  这段好日子在墙上没撑过几幅画。


  教育普及到整个社会之后，技术开始往所有人手里流淌。城市之间的贸易重新铺开。旧贵族在历史里缩成一团暗色的涂鸦，消失在画框边缘。


  但商会出现了。


  企业出现了。


  他们不再垄断血统，只垄断专利、航路、炉心维护技术，以及旧文明遗产的开采权。


  这一次，底下的人不再跪着接配给。他们站着签合同，走进工厂，买下房子，偿还债务。他们在永远明亮的城市里工作到深夜，工作到连自己的影子都不再贴着脚后跟下班。


  他们的衣服很体面，街道也比旧领主时代的任何一条都干净。


  但他们眼眶里的淤色，没有比上一幅画里那批跪着的人浅。


  新的一行字从桌面上浮现。


  “第二跃迁纪。”


  “人类共同体形成。”


  “人类第一次拥有稳定的全球市场。”


  “人类第一次拥有通向天空的工业基础。”


  “人类第一次真正理解了星空。”


  立香的木履在阶梯上顿了一下。


  下一幅画是一座观测塔。


  塔尖刺穿云层。塔底下聚着数不清的人，所有人都仰着头。


  那时候，人类还没有真正离开大地。但第一枚无人探测器，已经从画布最上方拖着长长的尾焰往上冲去。


  那点火种在寥廓的暗天里明灭，朝着没有底的方向闷头飞去。


  然后，光来了。


  不是毁灭。'

content: '士郎找到路的动作没有犹豫。


  他走下旋转楼梯时，脚底在每一级合金踏板上都踩出一声扎实的闷响，不沉，也不轻。那节奏刚好够立香跟在后面，把自己的步子和他对齐。


  立香跟在他身后，身体微微前倾。她看到他的肩膀在转角处往下沉了一截，那代表他在带路的同时，也在看着墙上渐渐展开的东西。


  村正扛着她那把大太刀，走在队伍最外侧。她把脸凑近墙壁。这面墙不是金属，也不是漆面。她伸手拍上去时，墙体回弹出一截微微发软的反力，连肩上的刀都滑出去好几寸。


  村正被自己的动作吓了一跳，赶紧把手从墙上拿下来，重新搁回刀柄上压住。


  “哎，这里的墙。”


  她转过脸时，嘴角自己往左边歪了一点。


  “这墙好有趣。”


  她抬手指了指墙上那些沿着墙面刻进材料里的凹痕。那不是壁画，而是三维的实物。


  “大概是极端的物质满足之后，就开始不断进行文艺和精神追求了吧。”


  立香把眉梢轻轻一挑，很快又落回去。她说话时，视线已经从墙面纹理移到了更下层那些发着微光的展示窗。窗里的东西，比墙上更满。


  “嗯。”


  村正把脸从墙面前拔回来，仰头看向上方。随后她抬手指了指穹顶。


  “哦哦，亮了。你看，灯亮了。”


  立香把视线从下方那片幽暗空间里收回来。头顶上的光源一条接一条亮起，从外沿往中心铺开，最后敷满了整个穹顶。


  玛修站在立香身侧，脑袋往楼梯扶手外微微一探。她的眉在眉骨下方轻轻凑了凑。


  “前辈……下面好像是。”


  “嗯，博物馆。”


  立香把这两个字从嘴里放出来。


  “完全的科技产物吗？”


  “是的，前辈。”


  玛修把头从扶手上方收回来，朝立香微微一低。


  “这里大概是怎么发展的，我们应该能够看到了。”


  她们身后的墙壁，已经不再是刚才那片单纯的淡青色墙面了。


  立香转过身，一个接一个地看过去。


  第一件东西是一辆几何形状的推车。两个轮子被几根交叉的木条绑在一起，轮面和木条之间没有钉子，只靠绳子固定。旁边的壁画手把手画着该怎么绑。


  然后是带着木制辐条的水车轮。棚子用几根斜搭的木头撑起，棚顶挖出的弧线，正好能把风引进水车旁边的沟渠。


  再往后，是她叫不出名字的东西。奇形怪状，一层套一层。可在她看不懂之前，壁画已经先一步告诉了她该怎么使用。


  那些东西没有一个是为了杀人而造的。


  它们全都是为了把人背上压着的东西，从人身上挪走。


  后面的东西，立香认得出来了。


  金属开始出现。


  从一把镰刀，到一柄长刀。刀面从粗锻变得平整，慢慢泛出冷却后的微光。她看到一把留有淬火痕的短刀，旁边放着一架可以折叠的金属支架。支架表面刻着打开角度与步骤。


  接着，她看到一个透明屏幕从展柜上方自行展开。


  上面没有像素感。那层光是从屏幕厚度中间往外缓慢铺开的。随后，一行字从容地跳了上去。


  “人类内部无需战斗。”


  是日语。


  立香把舌尖往上颚轻轻一放，然后松开。


  随后，她看到了蒸汽机。


  她在蒸汽机后面停下脚步，凑近去看。那个蒸汽机的结构她认得。可在蒸汽机后面的那些东西，她连材料都叫不上来。


  她把头转向士郎。


  “士郎。”


  士郎从她身后走上前一步。琥珀色眼珠在蒸汽机后方那片展柜上来回扫了一次。


  “这是直接……”


  他顿了顿。


  “跳了一两个大时期。”


  “拿到了前一代的技术吧。”


  立香把视线从那些莫名其妙的装置上移到旁边的壁画。壁画描绘技术动作的方式，和刚才那些木制水车是同一种风格。


  “结合它之前说的，应该就是如此。”


  士郎把手从身侧慢慢抬起。


  “整个文明一下子飞跃了。”


  立香把搁在扶手上的手，往掌心里轻轻拢了拢。她看着接下来的壁画，一步步往下踱。她的木履没在螺旋楼梯上敲出太多声响。


  试想一下。


  一个刚刚掌握汽车的国度，一瞬间拿到了无限能源。


  立香在胸腔里把这个念头推过去。它自己滚回来，于是她又把它推回去，重新滚了一次。


  每一次，都落在不同的答案上。


  富足，撕裂，狂喜，战争。


  以及所有人都会相信，明天一定会比今天更好。


  她看见壁画里的城市在眼前把木头和石块一层层剥掉。那些方形棚屋，在接下来的几幅画里，直接跳成了悬浮在山体之间的一整片白色都市。


  城市发着冷白色的光。


  水车还在，但水不再推动它。


  水底下已经没有水。埋在地下的魔力炉心，从自己的核心里把热量抽出来，泵进管道；把光灌进每户人家的墙壁；把清水从空气里凝出来，再送进每家水槽。


  食物在炉心隔壁的容器里被制造出来，速度比阳光催熟作物更快。


  桌面上的屏幕一个字一个字往外跳。每个字的边缘，都在自己的光粒里轻轻收束了一下，然后彻底定住。'

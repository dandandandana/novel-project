content: '终末人理圆满装置向前飘了半步。蓝色投影在残骸的冷光背景下稍微变暗了一点，“你的眼睛能看得远，不错。”它的合成音顿了一拍，下一句推出来时语调里镀上了一层隐约的赞许，“这个战舰的材料是拼凑而成的。这是人类对弥勒最后的反击。”


  立香忽然把士郎握在她腕上的那只手反握住。她的手劲在那一瞬间从被动的接受转为主动的扣紧。


  “我好像明白了——”她把视线从残骸身上拉到AI的蓝色投影上，眸子里的橘色在同一种冷白光下多了一层极快的跃动，“如果和我猜的一样的话……”她把另一只空闲的手抬在身前向虚空里点了一下。


  “材料，对吗。”


  终末人理圆满装置顿了顿。它模拟的脸部轮廓在这次停顿中快速闪了一次全光谱。


  “你真的很聪明。”它的扬声器推出两个干净的音节，“没错。就是材料。”


  “宇宙辐射——高纤维——碳纤维——钢材——”AI把这几样名词一字一字往外报下去，每一次停顿都把那一项锁死在禁止清单里，“未来文明的人类被限制死了。无法做到飞向天空。”


  立香没有给它时间做更多的铺陈。她把头往左稍稍一偏，追问直接从AI的最后一个字上接过去，“材料一旦被限制，那么民生是怎么发展的？”


  终末人理圆满装置的蓝色投影在她的反问中短暂地亮了一圈。“材料只要不用于航空，那么弥勒就不会限制。”


  立香把这句话在脑子里快速翻了两次。和她刚才推演出来的一模一样。


  “合理了。”她把目光从AI身上移向残骸，让自己的视线在那艘巨舰的呼吸状的甲壳上重新扫了一遍，“那么，这是什么。材料又是什么。”


  她的下一句追问直接钉在“对付弥勒”这个前提上：“既然是对付弥勒的东西，那材料肯定不可能是被他在正常封锁范围里允许的对吧。”


  “很有眼力见。”


  “如果不能升上太空，那么什么材料肯定都无法对抗未来佛。战舰的材料——来自游星尖兵和各个星球的UO的遗骸，它构成了战舰的本体。来自未来文明的工程师和设计师倾尽了全力。”


  AI说这段话时的语调平稳得像在宣读一份早已被封存入库的工程报告。没有任何情感波动，只是把每一个音节都钉得精准。


  “游星尖兵我可以理解。”立香把交叠在腹前的手臂松开，左手在身侧摊开。她的语速在转入追问时自然而然地加快，但声音仍旧压在一根冷静的中轴上，“UO是什么意思——毕竟你们的科技这么发达，对抗游星尖兵肯定是能做到的。”


  终末人理圆满装置没有立刻回答。


  “通过伪造星球意志的信号——向外界发出求救信号。然后——引诱星球极限种过来送死。”


  它的合成音在“求救信号”这四个字上轻轻往下降了一线，接着，每一个动词都被它以平稳到近乎刻意的语调单独推出来。


  “扒它们的皮，抽它们的筋，打碎它们的骨。获取材料。”


  立香的牙关在“扒”字出声时忽然咬紧了。她把士郎的手扣得更用力，手掌的力道在几秒之内把自己的两排指甲在掌心里压出了几道白印。


  终末人理圆满装置的声音忽然抖了起来。那层一直维持着所有词汇精准平的合成外壳在下一句话的第一个字上就裂开了。


  “迦勒底的御主——你能够理解，他们付出了多大的代价了吗。”


  它的扬声器里忽然涌进来大量的杂音。那种不是外部干扰——是从AI的核心波段里浸出来的，直接渗透了自己的语音合成模块。声音在“代价”两个字上往高处拔半度，又在自己的问句结尾时碎掉一边。


  “上一代文明没有完成的事情，化作了他们的愿望。他们所做的事情——”AI的声音被自己的杂音反噬了半个音节，然后它的音量骤然拔高，“凭什么让我的——我的——人类完成。”


  终末人理圆满装置把最后一个词吐出来的时候，整座残骸大厅的灯光剧烈地晃了一下。从所有横梁上投射下来的蓝白冷光同时闪了一圈，像是有一只手在电闸上狠狠拍了一掌。


  然后所有的光重新稳定下来。AI的蓝色人形在原地站着不动，投影边缘还在微微颤跳着几行难以平复的波形。


  “——不择手段，自愿自杀，极端科技，都是为了踏出地球，开向星空。”


  立香在这片安静里慢慢歪过了头。她的橘色眸子转向士郎的侧脸。眼眶里还留着刚才狠狠逼回去的那点热度。


  她忽然感受到了一股既视感。它不知从哪里冒出来，但太准了——她看着眼前这艘用自杀信号引诱星球极限种来送死、用扒皮抽筋拼凑材料、用不择手段和自愿牺牲堆起来的最后的反击巨舰，然后看着那个始终站在自己身侧、从金地到星之内海都没有退过半步的男人。


  她在心里忽然把这两幅画面叠在了一起。


  “他们真的活过吗？还是说在追求星空这个过程中才能体验活着呢。”'

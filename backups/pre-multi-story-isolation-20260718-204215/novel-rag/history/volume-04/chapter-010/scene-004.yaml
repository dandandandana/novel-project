content: 她说完之后把自己的视线从他身上移开，扫了眼整座舰桥，又望向远处那枚幽蓝箍着的巨大炮口。她开口时声音已经收回指挥官该有的那种密度，每个字都搭在舌头正中，不重，但谁也推不动。“首先你要认识的——是这个战场。”

content: '“原来如此。”


  “你信了？”


  “与本王无关。”


  两位帝王沿不同的路离开月读命金地。檀真掠过城墙时，修武星的光随它向东收拢了一瞬。远处的黑日立刻有了反应，金色佛光从地平线上升起，组成一面横跨山脉的墙。


  警钟在伊耶那岐金地响了。


  九十六尊法相同时转向东方。


  村正和祁荒已经走到第一道封锁前。


  地下通道比终末人理圆满装置展示的地图窄得多，左右墙壁不断向内挤压，最窄处只能容一人侧身通过。村正的大太刀没法横放，她索性把刀背贴在脊梁上，用布带将刀柄绑到肩头。


  第一道封锁是一扇没有接缝的石门。


  祁荒在门前找了半天，没找到能插黑钉的位置。


  “伊耶娜美是不是漏说了用法？”


  “她只说留下一枚。”


  “留在地上算吗？”


  “你可以试试。”


  祁荒把一枚黑钉摆到石门前，然后退开两步。石门没有反应，黑钉却开始哭。婴儿的啼哭在狭窄通道里来回撞，越哭越响。


  “你哄。”村正说。


  “为什么是我？”


  “你是菩萨。”


  “菩萨不负责哄所有孩子。”


  “那你负责什么？”


  “引导众生脱离欲望。”


  村正看了她一眼：“这话从你嘴里说出来真有意思。”


  祁荒笑着把黑钉捡起来。她没有哄，只把一缕魔力送进钉身。啼哭立刻变成含混的人声，反复念着一句“请证明你是人类”。


  “看来这是问题。”


  “怎么证明？”


  “不知道。你先来。”


  村正走到门前：“老夫会打铁，会饿，会困，会为了一把没锻好的刀气得睡不着。够不够？”


  石门没开。


  祁荒接着说：“我有欲望，会犯错，也不打算把自己说成好人。”


  石门仍然没开。


  “它可能不接受口头证明。”村正说。


  “那要割一刀？”


  “先别把血往来历不明的门上抹。”


  祁荒绕着那枚黑钉看了一会儿，忽然问：“你为什么愿意来？”


  “任务。”


  “这不是证明，是敷衍。”


  “你先答。”


  “因为我想知道创造我的人为什么创造我。”


  村正把视线从石门转到她脸上。


  祁荒仍然笑着，那句话却没有玩笑。她和伊耶娜美不同，不是被地下文明塞进容器的替代神灵，可她同样带着别人设计的目的活到现在。有些人能把来处当作答案，她不能。


  “老夫是想看看那件创造之禊祓。”村正说，“做东西的人把选择留给东西，东西又自己关了门。要么做坏了，要么它看见了什么。老夫想问清楚。”


  黑钉停止哭泣。


  石门中央出现一个小孔。祁荒将钉子推入，石门从正中分开，露出向下的阶梯。


  “它要的不是人类证明。”她说。


  “是我们为什么来。”


  “第一道就问这个，后面八道不会更省事。”


  “走吧。”


  村正跨过门。她们身后，第一枚黑钉留在孔中，钉身上浮出两个很小的名字。不是千子村正，也不是菩萨院祁荒，而是两串她们自己都没见过的编号。


  第二道封锁里没有门，只有一座堆满人形容器的大厅。


  容器沿墙排到看不见的深处，大部分已经空了，少数仍沉睡着与神话人物相同的脸。祁荒经过一具容器时，里面的人忽然睁眼。


  “伊耶娜美。”她说。


  那具身体有男人的骨架，脸上却同时保留数张面孔。每说一次伊耶娜美，最上层的脸就换一个年龄。


  村正握住刀柄：“醒着？”


  “不算。”祁荒看了片刻，“它只剩这一个词。”


  大厅里接二连三响起同样的呼唤。


  “伊耶娜美。”


  “伊耶娜美。”


  数百具容器在黑暗中睁眼。那些空洞的眼睛没有看村正与祁荒，而是共同望向月读命金地的方向。


  祁荒取出第二枚黑钉。钉子没有哭，直接从她手中飞起，扎进大厅中央的地面。所有呼唤同时停止，容器重新闭眼。


  第二道门在大厅尽头打开。


  “它们不是伊耶娜美的备用身体。”村正说。


  “是筛选失败的部分。”


  “那月读命金地那个，是最后剩下的？”


  “或者是第一个逃出去的。”


  两人没有继续猜。第二枚黑钉留下的不是名字，而是一段简短记录。


  “人格汇聚实验，第七千三百一十二次，失败。”


  她们向第三层走去。通讯在踏过门槛的一刻中断，立香留在记录仪里的坐标也随之熄灭。


  东面的第一轮交锋同时开始。


  吉尔伽美什的金色阶梯撞上佛光墙，没有爆炸。构成阶梯的每一块金砖都从前端开始融化，熔出的金液向山谷落下，在落地前被她重新收回王之财宝。


  “会把人类造物还原成材料。”她说。


  杨浞坐在檀真背上，没有靠近那面墙。他从腰间取下紫金色小觯，向其中倒入一缕墙外的佛光。佛光落入杯中，先凝成一粒金砂，随后长出细小的手脚，盘坐在杯底向他讲经。'

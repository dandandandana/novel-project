content: '战前最后一顿饭很普通。


  天沼做了米饭、味噌汤和一锅炖得偏软的肉。桌上没有酒，吉尔伽美什对此表达了不满，天沼把一壶热茶放到她面前，告诉她主人的命令是出战前不许喝酒。


  “她什么时候能命令本王了？”


  “您问这句话时，已经在喝茶了。”


  吉尔伽美什低头看了一眼手里的杯子，决定不再和他讨论。


  杨浞坐在她对面。他没有用筷子，而是从袖中取出一双细长的银箸。吉尔伽美什盯着那双银箸看了一会儿。


  “你随身带餐具？”


  “行军时总有用处。”


  “怕人下毒？”


  “怕别人家的筷子不够。”


  玛修低头喝汤，没敢笑出声。立香把自己碗里不爱吃的配菜拨到一边，士郎顺手夹走，又把一块炖肉放回来。这个交换发生得太熟练，等立香发现祁荒正看着他们时，肉已经吃进嘴里了。


  “你看什么？”


  “学习迦勒底的团队协作。”


  “你要吃配菜吗？”


  “不用。谢谢。”


  “那就别学。”


  祁荒转而看向士郎：“你一直负责吃她不吃的东西？”


  士郎想了一下：“不能说负责。”


  “是被迫。”立香说。


  “嗯，她会直接拨过来。”


  “你可以不吃。”


  “浪费不好。”


  “看吧，被迫。”


  玛修终于没忍住。她笑完立刻用碗挡住脸，假装那一声不是自己发出的。村正拍着桌子笑，连天沼添汤时都把勺子停在锅边多等了一会儿。


  饭后，各组分开准备。


  城里的物资正在往城主府集中。


  立香原本只打算去确认药品和灵脉储备，走到半路却发现负责搬运的人少了一半。修武星让维持生命的金线显形后，部分居民不敢离开伊耶娜美太远。他们明知过去也这样生活，亲眼看见那条线以后，脚还是不愿跨出街口。


  几个孩子倒没有这种顾虑。他们把金线当成风筝绳，排着队往城主府跑，想看看谁能把线拉得最长。天沼在门口把他们一个个拦下来，叫人送回家。


  “今晚不许乱跑。”


  “可是天一直亮着。”最小的孩子说，“还没到晚上。”


  “沙漏说到了。”


  “沙漏看不见太阳。”


  “太阳也看不见你该睡觉。”


  孩子认为这个回答不公平。他转头看见立香身后的杨浞，立刻找到了新的问题。


  “那颗星是你的吗？”


  “是。”


  “你把它摘下来，晚上不就回来了吗？”


  “摘不下来。”


  “为什么？”


  “它不听话。”


  “你不是皇帝吗？”


  杨浞看向立香：“谁告诉他的？”


  “你衣服上写着。”立香说。


  杨浞低头看了一遍自己的玄色道袍。他身上只有白鹤与金线，没有任何一个字。


  孩子抢先承认：“刚才金头发的大姐姐说的。”


  “她还说什么？”


  “说你是不肯报名的乡下皇帝。”


  杨浞点头：“她记仇。”


  “你叫什么？”


  “蜀帝。”


  “这不是名字。”


  “那就等熟了再问。”


  孩子认真想了一会儿，从口袋里摸出一块压扁的糖，塞给他：“现在熟了吗？”


  杨浞接过糖：“快了。”


  “还差什么？”


  “你先去睡觉。”


  “睡醒就熟了？”


  “也许。”


  孩子立刻接受这笔交易，跟着天沼离开。立香看着杨浞把那块糖收进袖袋，没有吃。


  “你不喜欢甜的？”


  “留着。”


  “当圣遗物？”


  “当催本王回来报名的东西。”


  这句话说完，他主动接过两个居民搬不动的药箱，往城主府里送。药箱很大，叠起来挡住他半个身体。他走得却不慢，一路上还替灵脉不稳的老人扶了一次门。


  立香跟在旁边：“你以前也这样？”


  “哪样？”


  “一边自称本王，一边搬箱子。”


  “当皇帝又不是只管坐着。”


  “我认识的王里面，愿意搬箱子的比例不高。”


  “你认识很多王？”


  “很多。”


  “都能打？”


  “大部分。”


  “那你们的时代真不安稳。”


  立香没法解释迦勒底为什么把各时代的帝王凑得像一个大型危险人物收容所，只能默认这个评价。


  药品仓库里，玛修正在核对治疗用品。她把止血材料、灵基修复液和普通人的药分成三列，每一列又按撤退顺序装箱。看见杨浞，她在最靠门的箱子上补了一张纸条。


  “蜀帝先生，这一箱是东门组的。常规药物可能对您的灵基没有作用，但吉尔伽美什前辈会需要。”


  “她会受伤？”


  “所有人都会。”


  “她听见要不高兴。”


  “所以请不要告诉她。”


  杨浞把箱子放到指定位置：“你比御主老实，也没老实太多。”


  “我只是选择合适的沟通方式。”


  “这句话也是她教的？”


  “是达芬奇亲教的。”立香替她回答。


  玛修迅速低头继续清点，拒绝让他们看见自己在笑。'

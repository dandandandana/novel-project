content: '仓库外忽然传来哭声。不是黑钉，是一个真正的老人。她站在街边，双手抓着自己后颈延伸出的金线，想把那条线扯断。金线没有实体，她的手一次次从中穿过。


  “我不想死在她后面。”老人说，“我不想哪天她出了事，我们连为什么都不知道，就一起没了。”


  周围没人能回答。


  伊耶娜美保护这座城，也成为城里所有人的共同死因。这个事实不会因为她出于善意而改变。


  立香走过去：“我们会解决弥勒，之后再想办法解除联系。”


  “能解除吗？”


  “不知道。”


  老人盯着她，没有从这句回答里得到安慰。


  “那你为什么还说？”


  “因为不知道不等于不做。”


  “你们明天可能全死。”


  “对。”


  “那我们怎么办？”


  “今晚先把药搬完，回家睡觉。明天城门不要开，听天沼安排。我们回来以前，别替我们宣布死讯。”


  老人没有马上动。杨浞将最后一只空药箱递给她。


  “拿得动吗？”


  “空的谁拿不动。”


  “那就装药。”


  她抱着箱子进了仓库。没有人再保证未来，但搬运重新开始了。


  立香站在门外，看着那条金线随老人一起进入屋内。修武星把问题照出来，却不会替任何人解决。杨浞沿着她看的方向望了一眼。


  “你不喜欢这颗星。”


  “没有。看见总比看不见好。”


  “看见之后会多很多麻烦。”


  “看不见时麻烦也在那里。”


  “所以本王说，可以一战。”


  杨浞把最后一箱药搬进仓库，转身去找吉尔伽美什。他没有再问立香能不能兑现对老人的承诺。那个答案要活着回来以后再找。


  村正把九枚黑钉缝进自己的衣带。祁荒只带了一串念珠，其他东西一概不要。吉尔伽美什在城外选定阵地，将王之财宝里适合破除太阳权能的原典一件件排开。杨浞则站在她划出的阵线内，任由修武星把每一件宝具的真伪照出来。


  第一轮就有三件原典在白光下崩散。


  “赝品？”杨浞问。


  “投影。”


  “谁做的？”


  吉尔伽美什朝城内看了一眼：“一个今晚大概又要惹御主生气的人。”


  “质量不错。”


  “你那颗星不这么认为。”


  “星的标准比本王高。”


  “本王讨厌你的星。”


  “很多人都这么说。”


  城内，立香刚刚否决士郎第三版信标方案。


  第一版由士郎单独携带信标接近弥勒，被她用“你想都别想”退回。第二版增加玛修掩护，仍然把信标放置和承受反击交给士郎，被她划掉。第三版改成三人共同抵近，信标由士郎在降格完成后放置，内容几乎没变，只是换了写法。


  “你是不是觉得我看不出来？”


  “第三版增加了你和玛修的撤离路线。”


  “你的呢？”


  “我不需要。”


  “退回。”


  士郎接过记录板，没有改第四版。


  玛修借口检查盾牌，离开了房间。她出门时贴心地把门关上，还告诉立香半小时后回来。


  “她跑得真快。”立香说。


  “你把她吓跑了。”


  “是你。”


  “你在提高声音。”


  “因为你在写遗书。”


  士郎把记录板放到桌上：“这是作战方案。”


  “没有撤离路线的作战方案就是遗书。”


  “有些位置必须有人留下。”


  “那个人不一定是你。”


  “但我最合适。”


  这句话让争执回到起点。立香没有再说第四次退回，她拉开门走了出去。士郎停了一会儿，拿起搭在椅背上的白色风衣，跟在后面。


  月读命金地的街道比过去亮。修武星不会落下，太阳也没有立刻离开，两种光把时间卡在无从判断的间隙里。居民已经用木板遮住窗顶，努力给自己造出可以入睡的黑暗。城墙上的守卫换岗只能依靠沙漏，不再看天色。


  立香一路走到北侧城墙。那里正对伊耶那岐金地，隔着山脉也能看见远方的金光。金光每隔一段便向上扩张一次，照亮云层底部。那不是日出，是弥勒的金地仍在生长。


  士郎把风衣披到她肩上。


  “我不冷。”


  “我拿都拿来了。”


  “所以我必须穿？”


  “你可以丢下去。”


  城墙外是几十丈高的陡坡。立香抓住衣领，把风衣穿好。


  “浪费不好。”士郎说。


  “你学我。”


  “这句话是我先说的。”


  立香往旁边让了半步，给他留出靠在城垛上的位置。士郎没有靠，他站在她身侧，看了一会儿远处的金光。


  “你不该把不死性当成问题。”他说。


  “我没有把不死性当成问题。我把你总想拿它换东西当成问题。”


  “能力就是用来用的。”


  “盾也是能力。玛修不会因为有盾就把自己焊在弥勒面前。”


  “她会。”


  “所以我也会骂她。”


  士郎没能替玛修找到更好的例子。'

content: '远处的金光又扩张了一次。这一次持续得更久，云底出现了完整的佛掌轮廓。城墙下方响起换岗的木梆声，三下，代表距离出发还剩六个小时。


  “立香。”


  “嗯。”


  “我不是为了证明什么才留下。”


  “我知道。”


  “也不是认为自己的命不重要。”


  “这句我不信。”


  士郎没有反驳。他把手放到城垛上，掌下的石面留着白日晒出的余热。


  “我这辈子为了属于自己的愉悦而前进，但是这个前提是我需要一个答案，这个答案我无法找到。”


  立香转过身。士郎仍然看着伊耶那岐金地，没有用这句话要求她理解，也没有等她立刻接住。


  “我需要找到我被主定罪的原因，这是我需要的事情。”他说，“立香，你能明白吗？当一个人做自己想做的事情变成惩罚，我无法从助人中得到任何的感觉，这种事情……是主给我的惩罚。”


  立香当然知道这些。


  她知道士郎会救人，会在救完以后确认伤势、补上结界、清理现场，然后站在所有人的感谢里寻找自己应该得到的那一点东西。可那一点东西从来没有出现。别人越快乐，他越能确认自己的行为正确；行为越正确，他越无法理解自己为什么仍旧空着。


  于是他继续做。


  像把同一道题算上一千遍，等一个从未写在题目里的答案。


  立香不能告诉他主为什么定罪。她甚至不接受那是罪。可她也明白，直接否定只会把士郎这些年寻找答案的路一并否定。他不是来听一句“你没有错”，然后把所有问题留在这段安慰里。


  “士郎，我知道我说什么你都没法解开，但是至少现在我能告诉你。”


  她伸手把他放在城垛上的手拽下来，握住。


  “死亡不是一个答案，士郎。你的思维会带给其他人遗憾，尤其是我。就和我之前说的一样，士郎，我要你活下去。”


  士郎看向两人握在一起的手。


  “不仅是因为我，也因为你。只有活下去才能找到答案，不是吗？”


  “也可能永远找不到。”


  “那就永远找。”


  “很不讲道理。”


  “你第一天认识我？”


  “不是。”


  “那你该习惯了。”


  士郎终于靠上城垛。他没有把手抽走，反而调整了一下位置，让立香不必踮着手腕才能握住。


  “我不把死亡当答案。”他说，“但如果答案和你的命放在一起，我会选你的命。”


  “然后让我带着这个选择活下去？”


  “你也会对我这么做。”


  “所以我知道这有多过分。”


  士郎没有接话。


  “看着我。”立香说。


  他转过来。


  “我没办法命令你永远别替我挡，也没办法保证自己永远不替你挡。说这种话没有用，我们两个都不会听。”


  “嗯。”


  “但是你至少要答应我，别提前把自己从计划里删掉。信标放完以后找路回来。路断了就叫我，弥勒拦着就等我把它拆了。你的不死性是最后的保险，不是第一步。”


  “如果只有留下才能完成炮击？”


  “那就留下。”立香说，“然后活着等我回来接你。”


  “这还是不讲道理。”


  “能做到吗？”


  士郎沉默得太久，立香收紧了手。


  “能。”


  “再说一遍。”


  “我会放置信标，完成校准，然后尽力回来。”


  “不是尽力。”


  “立香。”


  “士郎。”


  两个人在城墙上互相叫完名字，谁也没让。最后士郎先改口。


  “我会回来。”


  立香这才放松手指，却没有松开他。


  “第四版方案怎么写？”士郎问。


  “信标由你携带，玛修掩护。我负责降格，完成后和玛修一起开撤离通道。你校准完立刻汇合。超过八秒还没回来，我去找你，主炮延后。”


  “延后会失去窗口。”


  “那就重新创造窗口。”


  “终末人理圆满装置说只有一炮。”


  “炮只有一发，降格不是。第一次失败，我们撤。第二次再来。”


  “弥勒不会给第二次机会。”


  “那是它的判断。”


  士郎看着她。立香没有说“所有人都能回来”这种连自己都骗不过去的话。她只是不肯在开战以前，就把任何一个人的死亡写成必要条件。


  “好。”士郎说，“按第四版。”


  城墙下传来急促的脚步。玛修抱着盾跑上来，见两个人还牵着手，立刻在最后一级台阶停住。


  “前辈，我是不是来早了？”


  “没有。”立香说。


  士郎同时说：“早了。”


  玛修站在台阶口，进也不是，退也不是。


  “到底是？”


  立香松开士郎，过去接她手里的记录板：“方案定了。你来得正好。”


  士郎把空下来的手收回风衣口袋：“嗯，来得正好。”


  “言峰前辈，你刚才不是这么说的。”


  “你听错了。”


  “我没有。”


  “那就是我说错了。”'

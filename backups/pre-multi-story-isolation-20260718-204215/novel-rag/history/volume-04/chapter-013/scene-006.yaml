content: '“讲什么？”吉尔伽美什问。


  “留下。圆满。不要前进。”


  “老一套。”


  “对人有用。”


  “对你呢？”


  杨浞将酒觯倾斜。金砂落回空中，刚要重新融入佛光墙，修武星便照穿它的身体。金砂内部浮出一张人脸，那张脸只存在片刻便化为灰烬。


  “对本王没用。”


  檀真向上飞。吉尔伽美什舍弃阶梯，沿王之财宝连续打开的门扉在空中换位。两人从不同高度绕过佛光墙，墙后却不是伊耶那岐金地。


  那里是一座仍然繁荣的人类城市。


  街道上有人赶着上班，孩子背着书包跑过路口，自动贩卖机前站着正在挑选饮料的学生。远处的轨道升降塔贯穿云层，白色飞船正沿塔身上升。


  没有战争，也没有弥勒。


  “幻术。”吉尔伽美什说。


  修武星没有照破城市。


  杨浞低头看见檀真投在街道上的影子，影子完整，路人经过时还会主动绕开。城市里的一切都在修武星判定下被视作真实。


  “不是幻术。是一段被取出的时间。”


  “能做到这种事，为什么只放在门口？”


  “因为门后的人不愿意让我们进去。”


  一辆公共车从街边停靠。车门打开，里面的乘客全都转头看着他们。


  “请留下。”


  数十个人用同一个声音说。


  “这里没有痛苦。”


  吉尔伽美什打开王之财宝，宝具对准整条街道。杨浞抬手拦住她。


  “这里的人可能是真的。”


  “被截出来的一段时间，不会继续变化。”


  “也有知觉。”


  “所以？”


  “先找边界。”


  吉尔伽美什收回一半宝具：“你只有三十息。”


  “够了。”


  檀真缩小成普通乌鸦，沿街道飞行。杨浞落到地面，修武星的白光随他集中在几个街区。吉尔伽美什则抬头观测轨道升降塔，她的千里眼能看见塔身的每一道材料，却找不到它通往何处。


  第二十息，杨浞在街边便利店里找到一面镜子。


  镜子没有映出任何人类城市，只映出九层太阳阵地，以及坐在黑日中的天照命世尊。她闭着眼，双手各自捏着一段时间，将这座城市撑在来敌面前。


  杨浞举起铁鞭，砸碎镜子。


  城市没有消失。街上的人继续走，公共车关门离站，轨道上的飞船升入云层。只有便利店镜子后方露出一条狭窄裂口，通往真实的东门。


  “找到路了。”


  “太慢。”


  “还有四息。”


  “本王的三十息只有二十六息。”


  “帝王可以随便改时间？”


  “现在你知道了。”


  两人穿过裂口。身后的城市依旧运行，没有因他们离开而停止。杨浞回头看了一眼，一个抱着纸袋的孩子正站在便利店门前，脸与刚才祭道上拦住立香的孩子完全相同。


  孩子没有挽留他们，只说：“又失败了。”


  裂口闭合。


  黑日压在头顶，天照命世尊睁开双眼。她先看吉尔伽美什，再看杨浞，最后看向比自己更高的修武星。


  “虚假的帝王。”


  她抬手指向杨浞。


  “你占据了本应属于真君的位置。”


  杨浞从檀真背上跃下。落地时九层阵地一起下沉，最近的两尊法相被震得退开。


  “你认识本王？”


  “我记得你的一生。”


  “那你说说，本王小时候最怕什么。”


  天照命世尊没有回答。


  “本王自己也忘了。”杨浞举起铁鞭，“随口一问。”


  吉尔伽美什身后展开数百道金色门扉。


  “叙旧到此为止。”


  第一批宝具落下，黑日向外喷出火海。杨浞穿过火焰，铁鞭正面砸上天照命世尊伸出的手掌。


  东门九层阵地全部亮起。


  立香、士郎和玛修最后出发。


  他们没有走东门，也没有进入地下，而是沿着伊耶娜美提供的旧祭道，从北侧接近伊耶那岐宫。祭道两边立着损毁的神像，每一尊都被人削去面孔，换成低眉垂目的佛面。修武星照在那些拼接处，神像脸上出现一圈清楚裂缝。


  “前辈。”玛修举盾停下。


  道路中央站着一个孩子。


  他穿着月读命金地居民常见的旧衣，赤脚踩在碎石上，手里捏着一颗烧焦的纸星星。


  立香认得那颗星星。


  它应该被保存在地下博物馆的玻璃柜里。


  “终末人理圆满装置？”她问。


  孩子摇头。


  “伊耶娜美？”


  他仍然摇头。


  “你是谁？”


  “我不知道。”


  孩子把纸星星递向她。


  “我只知道，你们要去杀救世主。”


  玛修向前半步，盾牌挡住立香。士郎没有拔武器，右手却已经落到能在一瞬间完成投影的位置。


  立香隔着盾问：“你要阻止我们？”


  “有人让我来问你。”


  “谁？”


  “不知道。”


  “问什么？”


  孩子抬头。修武星照进他的眼睛，那双眼里没有瞳孔，只有一层与终末人理圆满装置相同的蓝色数据流。


  “如果人类每一次选择未来，最后都会死去。”


  “你还要把门打开吗？”'

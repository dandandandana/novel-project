  "content": "第十七章　天羽羽斩\n\n“未来有没有，砍开再说。”\n\n村正向前迈出第二步，弥勒也动了。答案落在弥勒的动作里。右脚踏进创造白火，血肉立刻被洗去一层金光；可他借火焰触及身体的瞬间判断出压制方向，脚掌随即向外一碾，硬把白火连同脚下金砖一齐掀向村正。飞起的碎石尚在半空，他已从火后的空隙穿过，一拳直取她心口。\n\n士郎横戟截入。长柄与拳骨相撞，低沉震鸣沿两人手臂同时灌入胸腔。弥勒拳势被推偏半尺，士郎右肩新断的骨头也在反作用下向内错位；握戟五指短暂失力，他索性以左腋夹住长柄，身体贴着戟杆前压，额头再一次撞向弥勒面门。\n\n弥勒屈肘封住第二次头槌，膝盖则越过戟杆撞向腹部。玛修的盾从下方抬起，盾面恰好垫进膝甲与士郎之间；冲击在板甲内部炸开，玛修两只手臂一齐向下沉，刚被英杰之帜撑起的左肩又渗出血来。\n\n“前辈，退后！”\n\n她不是在对立香说。士郎听见便松开戟杆，任弥勒的肘击把自己向后推；玛修同时转盾，借那记膝撞的余力向外送出。弥勒重心被盾面引向右侧，村正的短刀遂从另一边切入，白色刃火贴着腰腹划开一道不深却无法立刻愈合的伤。阿尔托莉雅随后落剑。\n\n黑刃从弥勒左肩斩向胸前圆洞。弥勒肩后仅存的两条金臂一条抓剑，一条按住她头顶；Alterego士郎却踩上那条按落的手臂，黑刃绕过阿尔托莉雅耳侧，刺穿金臂腕骨。两人武器在同一具身体里交错，彼此距离近得稍有偏差便会先割开对方喉咙。\n\n“低头。”Alterego说。\n\n“说早了。”\n\n阿尔托莉雅已经低下。黑刃擦过她头盔削断弥勒金臂，阿尔托莉雅自己的长剑也从断腕下方翻起，继续压向颈侧。弥勒本体侧身让过锋口，右掌却趁两人同时收剑的空当横扫出去。空气被掌缘压成一道肉眼可见的弧面，先撞上阿尔托莉雅胸甲，再沿两柄剑的金属传导涌进Alterego手腕。\n\n两人一起飞了出去。阿尔托莉雅背后黑翼张开，强行在撞上山壁前收住；Alterego没有翅膀，便在半空投影出三柄大剑，一柄插地，两柄交叉托住腰背。冲击压弯剑身，断裂的两根肋骨也在急停中刺得更深。他咳出血，落地第一句话仍不好听。\n\n“你就不能早半息低头？”\n\n“你可以晚半息出刀。”\n\n“那是你慢。”\n\n“闭嘴，回来。”\n\n弥勒已经再度压向村正。创造之禊祓令他每一处伤口都无法借佛果重置，却不能替村正挡拳。她短刀刚架住第一击，刀身便向内弯折；第二拳紧接着从另一侧打来，村正侧身卸力仍慢了半寸，拳锋擦过肋下，把半片锻造服连同皮肉一齐撕开。她借这股力向后旋身，白火从伤口涌出，沿弥勒来不及收回的手臂烧上肩头。\n\n弥勒五指向内一握，直接抓住白火。皮肉在火中被洗掉，露出金色指骨。他以指骨将火焰从手臂上扯下，像扯断一条缠住自己的布带，随即反手掷向远处阵心。白火的主人仍是村正，杀不死她；那团火里却裹着刚被洗去的弥勒佛果，一旦撞入祁荒道场，坐标与主炮残存信标便会被重新污染。\n\n祁荒抬起杨枝净瓶。净瓶清液在半空展开一层薄膜，只将白火里的金色部分逐滴分离，再任创造之禊祓从立香头顶越过，绕回村正掌心。被分出的佛果则落进瓶中，瓶壁立刻响起数千人同时诵经的重音。祁荒手腕向下一沉，虎口裂伤随之扩大，笑意却没有消失。\n\n“吃过别人扔来的东西吗？”她问。\n\n立香盯着战场：“现在没空吐槽。”\n\n“我是在问瓶子。”\n\n“……那你问得再清楚点。”\n\n“好吧。”祁荒把不断震动的净瓶压在膝上，“它说很难吃。”\n\n一句无关胜负的话，却让立香把几乎绷断的呼吸接了回来。她始终留在坐标阵内，右手背只剩最后一道令咒。终端上的每一条灵基曲线都在向危险区滑落：玛修左肩、士郎右臂、Alterego肋骨与下颌、阿尔托莉雅第二道承伤纹、村正贯穿心口的白火。弥勒比他们伤得更重，魔力却仍足够把这场消耗拖到所有人先倒下。\n\n不能再一拳一拳换。\n\n“听我说。”立香接通全员频道，“下一轮把他的正面余力一次打空。不是为了杀，给村正开路。”\n\nAlterego拔出插地大剑：“你准备让谁开？”\n\n“你、阿尔托莉雅、玛修。”\n\n“我呢？”士郎问。\n\n“钉住他。”\n\n士郎看了一眼手里的大戟。投影表面已经出现数道细裂，体内那股借来的力量仍在把骨缝往外撑；他稍一收紧右手，肩胛便传来濒临崩裂的摩擦声。\n\n“行。”他说。\n\n“你答应得倒快。”Alterego冷笑。\n\n“总得有人干。”\n\n“就是这副样子最讨人厌。”\n\n“你可以不看。”\n\n“两张一样的脸吵架，听久了还真烦。”村正把短刀上的血甩掉，“立香，开路要多久？”\n\n“三秒。”\n\n“够了。”\n\n弥勒听见了全部安排。他没有阻止众人交谈，也没有趁机攻击阵心。胸口主炮圆洞在白火压制下只合拢不到三成，金血仍顺腰腹往下流。他看了一眼撤到炮线外的居民，再看向重新分散站位的众人。\n\n“你们总把不知道的路叫作未来。”他说。\n\n村正用拇指试了试短刀刃口：“不然呢？知道终点的那叫送葬。”\n\n“前面也许只有更多尸体。”\n\n“那也轮不到你先替活人躺进去。”\n\n弥勒垂下手，掌心向地。整片废墟随即被一股向上的力量托起。不是地震，数百块金砖、断墙和佛塔残骸同时脱离地面，在他身后重组成一条条文明兵装。轨道光枪只剩三支，反物质佛珠十二枚，神代太阳镜也在主炮中裂了一角；可每一件都仍能杀死从者。所有武器越过立香，全部朝村正转去。\n\n“他知道谁是最后一刀。”玛修说。\n\n“所以才让你们先开。”立香吸了一口气，“现在！”"
}

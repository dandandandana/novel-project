content: '他很少用这个称呼。立香回头，发现他没有看她，而是在看城里那些拖着两道影子生活的人。


  “如果那些法相和她一样，你准备怎么办？”


  “先判断能不能沟通。”


  “它们挡路呢？”


  “制服。做不到再杀。”


  “它们认为自己就是那些神佛。”


  “那是它们对自己的认识，不是我们下杀手的理由。”


  “即便这种认识是别人塞进去的？”


  “即便如此。”


  杨浞终于转过脸。


  “你会为这个判断付出更多代价。”


  “我知道。”


  “也可能害死自己人。”


  “所以我不会把‘不能杀’写进命令。战场上由每个人判断，我只告诉他们，敌人未必是自愿站在那里。”


  “不错。”


  “你刚才是在考我？”


  “本王要知道自己的兵刃被谁握着。”


  “答案呢？”


  “可以一战。”


  他说完便沿长廊离开。走出几步后，一只由水纹与火纹交织成的乌鸦从他肩上凝聚出来，振翅飞上修武星照耀的天空。白光穿过它的羽毛，没有让它消失，只在地面投下一道很淡的鸟影。


  立香看着那道影子越过屋顶，飞向伊耶那岐金地。


  十小时后，它会带回第一份正面战场的情报。


  也会告诉弥勒，他们来了。


  立香没有马上离开城主府。


  她送走杨浞，转身回到正厅。伊耶娜美仍坐在桌边，地图已经收起，装着黑钉的木盒也被村正拿走，只剩那只裂开的茶杯。茶沿桌缝滴到地上，天沼正拿布擦拭。


  “主人，换一只杯子吧。”


  “不用。”


  “它会漏。”


  “那就不喝。”


  天沼没有和她争，把裂杯收走，换了一碗温水。他走出正厅时向立香点了点头，还替她带上门。


  “你回来做什么？”伊耶娜美问。


  “问一点不适合在作战会议上问的东西。”


  “我不保证回答。”


  “你第一次醒来，见到的是谁？”


  伊耶娜美没有拒绝。她想了很久，才说：“天沼。”


  “在哪里？”


  “这间屋子。”


  “当时城里有多少人？”


  “一万两千七百三十一。”


  “你见过他们吗？”


  “见过。”


  “每一个？”


  “每一个。”


  立香坐到她对面：“你醒来之前呢？”


  “黄泉，伊耶那岐，逃离黄泉的约定。你知道那些故事。”


  “我问的是你亲眼见过什么。”


  伊耶娜美端起水碗，没有喝。她拥有一整段连贯的神话记忆，记得火神出生时烧伤自己的痛苦，记得黄泉污秽，记得隔着巨石与伊耶那岐决裂。可当立香把问题缩到一双眼睛真正看见过的东西，那段记忆就不再连贯了。


  她记得黄泉，却不知道黄泉的地面是什么触感。


  她记得伊耶那岐的脸，却说不出那张脸在笑时先动哪一边嘴角。


  她记得自己生下诸神，却叫不出任何一个孩子年幼时的声音。


  “没有。”她把水碗放下，“我第一次真正看见的，是天沼。”


  “他说了什么？”


  “他说，伊耶娜美大神，您终于醒了。”


  “他知道你不是真正的伊耶娜美吗？”


  “不知道。至少那时候不知道。”


  “现在呢？”


  “现在他也不在乎。”


  立香相信这句话。天沼每天替她做饭，替她管理城池，提醒她杯子裂了就换一只。他效忠的是坐在这里的这个人，不是神话里那个能不能与她重合的名字。


  “你在担心那些法相。”伊耶娜美说。


  “嗯。”


  “也在担心我。”


  “有一点。”


  “怕我忽然变成弥勒的东西？”


  “怕你知道自己从哪里来以后，不知道该往哪里去。”


  伊耶娜美拿起那碗水，这次喝了一口。


  “藤丸立香，我不喜欢这里。”


  “月读命金地？”


  “这个世界。太阳想什么时候出来就什么时候出来，死掉的神被人偷走名字，活着的人靠一堆线吊在我身上。我醒来以后做的每一件事，都是替上一个失败收拾残局。”


  “听上去确实不值得喜欢。”


  “但我在这里醒来。天沼在这里，城里的人也在这里。就算那段属于女神的记忆全是别人塞进来的，我骂你们、给你试炼、做错判断，这些都是我自己做的。”


  “还有喝酒。”


  “酒也是。”


  “那不就有答案了。”


  “我没有问你。”


  “我免费送。”


  伊耶娜美把水碗推到一边：“我开始明白为什么言峰士郎经常拿你没办法了。”


  “他哪里拿我没办法？”


  “你回去问他。”


  立香没有上当。她起身走到门口，又停下来。


  “如果我们遇到另一个拥有伊耶娜美记忆的人，你希望我们怎么做？”


  “带回来。”


  “然后呢？”


  “问问她记不记得火神出生以后，我第一句骂的是什么。”


  “你自己记得？”


  “不记得。”


  “那怎么判断？”


  “判断不了。我只是想知道她会怎么编。”'

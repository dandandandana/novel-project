  "content": "宫殿废墟两侧同时传来诵经声。残存的十几尊法相从断墙后升起，有的只剩半身，有的拖着被主炮烧熔的金臂，仍在弥勒抬手的瞬间一拥而上。梵音、光炮与十几件文明兵装从四面压向同一点。\n\n士郎冷哼一声。\n\n大戟横扫。\n\n最前方三尊法相连兵器带腰身同时断开。第四尊俯身躲过刃口，六臂从下方扣住戟杆；士郎没有回抽，反而向前一步，肩膀撞进它胸前。戟柄被六只手锁死，他便腾出右手，五指扣住法相咽喉，额头重重撞上那张慈悲面孔。\n\n金色额骨凹了进去。\n\n第二记头槌落下，整张脸向后炸开。士郎拖着它转身，以尸身挡住侧面射来的光炮；金光贯穿法相胸腔时，大戟也被他单手拧回。刃口从尸体肋下穿出，斜斜掠过后方两尊法相的颈骨。\n\n两颗头颅飞上半空。\n\n紫火追上断口，没有爆炸，只沿金色骨缝向里烧。那两尊法相还维持着出拳姿势，身体已经从颈部开始一节节塌落。士郎踏过它们，戟尾向后一送，正中偷袭者胸骨；闷响从背后传来，他连头都没回，反手压柄，将那具数丈高的金身从肩顶掀过，砸进前方人群。\n\n法相的冲势第一次乱了。\n\n士郎已经闯进最密处。长兵器本该需要距离，他却把戟杆贴在肋下，以肘、肩、膝和头槌挤出每一寸转圜。有人抓住刃口，他便连手掌一起剁下；有人抱住腰，他反扣咽喉，把对方拖到身前，迎着另一尊法相的重拳撞上去。金色血肉一层层倒下，碎骨越堆越高，最后在废墟上垒成一道歪斜的坡。\n\n士郎踩了上去。\n\n白骨在靴底咯吱作响。紫火从尸堆缝隙向上升，将他半身都罩在里面。额角那道被弥勒撞开的伤口仍在流血，淌到脸侧时却已变成刺目的金色。他用拇指抹了一下，看着指腹停了半息，随即把那点金血擦在戟杆上。\n\n最后四尊法相停住了。\n\n“怎么？”士郎站在尸山顶端，腰杆挺直，大戟斜垂在身侧，“佛也会怕？”\n\n回应他的是四张同时张开的嘴。\n\n梵音尚未出口，士郎已经从尸山上踏落。紫火被这一脚踩得向四面伏倒，大戟则自下而上挑起。第一尊法相从下颌裂到头顶；士郎借刃口卡进颅骨的支点翻身越过，双脚踩上第二尊肩头，戟杆横扫它的后颈。第三尊从背后合掌，他弯腰让两只巨掌在头顶撞碎，紧接着抓住其中一根拇指，把整条手臂拧向第四尊胸膛。\n\n两具金身撞在一起。\n\n士郎落地，双手换握。大戟在紫火里抡出完整一周。\n\n四颗头颅几乎同时离开肩膀。\n\n废墟安静了半息。\n\n随后，十几具法相残躯一起倒下。最远的一具砸断宫门，最近的一具沿尸山滚到玛修盾前，六只手臂还保持着结印姿势，头颅却已经不在肩上。紫火从所有断口同时喷出，在士郎背后连成一面高过宫墙的火幕。玛修握盾的手紧了一下，Alterego也停住擦血的动作；连地下频道都只剩装置规律的警报声。\n\n立香的终端上，十几个敌对标记在同一秒内全部熄灭。屏幕中央只剩士郎的灵基曲线还在跳，峰值冲出量程，下一刻又跌进濒死区。她张了张口，最终没有叫他回来。"

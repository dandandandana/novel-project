  "content": "第十五章　十二秒\n\n第一粒米被黑金孔雀啄进嘴里时，伊耶那岐宫上方那只佛掌动了。\n\n掌影先从云层退开半尺，五根手指继而向内收拢。失去黑日遮蔽后，金色指纹清清楚楚映在天空，每一道都宽得足以横跨东门盆地。它没有立刻拍下，只是握住宫殿外侧那团持续燃烧的白火，试图把创造之禊祓连同地脉一起从金地里拔出去。地下传来一声极慢的闷震。\n\n盆地边缘三圈结晶同时向内倾斜，尚未完全稳定的岩壁随即崩下一大片。玛修赶在碎石落进坑底前展开盾面，白色防护从盾缘斜着托起，把几十吨岩层导向无人一侧。她左臂原本只在甲缝间渗血，这一承重，温热血液立刻顺护臂内侧淌到指尖。盾没有沉，手指却短暂失去知觉。\n\n“前辈，东侧还能走。”\n\n立香已经滑进盆地。她先蹲到杨浞面前，手掌隔着破裂甲片按住他腹部那道刚被真炁勉强封起的伤口。封口很薄，随着呼吸向外鼓动，左侧一截断裂肋骨还抵在皮下。终端把灵基读数投到她眼前，最危险的不是失血，而是仍黏在伤口深处的灰色余火。那东西贴着每一轮修复往前爬，令新生血肉刚连起来便忘记下一步该怎样愈合。\n\n“先送地下。”立香说。\n\n“本王还能——”\n\n“能走三步，我看见了。”她头也没抬，“第四步想把肠子落在哪儿？”\n\n杨浞低头看了看她压住伤口的手。那只手很稳，指节却因持续施术泛白。他把已经到嘴边的话咽回去，换成另一句：“铁鞭别让人碰。”吉尔伽美什在旁边冷笑：“放心。那根裂成两半的烧火棍，没人抢。”\n\n“你那把剑拿来拄地也没好到哪儿去。”\n\n“至少比某个走不过三步的——”\n\n“两位，”玛修隔着盾面打断她们，“再吵，岩壁真的要下来了。”\n\n吉尔伽美什偏过脸，杨浞也闭了嘴。两人谁都没承认自己听劝，只在士郎投影出的担架伸到脚边时没有再拒绝。士郎右腕到手肘的裂伤因此又亮了一层；他把担架结构换到左臂维持，右手则握住立香肩膀，替她从杨浞伤口里抽离那缕灰火。\n\n“地下出口呢？”\n\n“就在开。”立香接通频道，“村正？”\n\n回应她的不是声音，而是盆地南侧一条突然亮起的白线。那线从结晶底部向上切开，所过之处没有爆炸，岩层里属于弥勒的金色佛印却逐个熄灭。金石失去神性支撑，先发出细密开裂声，随后向两侧退开，一条斜通地下第三层的甬道由此露出。\n\n村正从白火里走出来，右手掌心那道火纹比方才更长，已经越过心口，攀上左侧锁骨。她每迈一步，脚下都会留下一枚短暂燃烧的白色足印；足印熄灭时，周围数丈的佛光也一并被洗去。祁荒跟在她后面，袈裟干干净净，仿佛不是从一座正在崩塌的地下神国里走来。她先看立香，再看两副担架，笑得比方才更深了一点。\n\n“两位王都还活着。真遗憾，我连准备好的悼词都省了。”\n\n“你可以留给自己。”吉尔伽美什说。\n\n“我大概用不上呢。”\n\n村正从两人中间穿过，白火贴着担架边沿卷了一圈，把仍想钻进伤口的佛印烧净。火舌追到破裂甲片旁便被她拽住，再没往血肉里多碰半寸。\n\n“别乱动。”她按住杨浞想抬起的手，“这火现在认得出佛印，可未必认得出哪一块肉该留。”\n\n“下面第三个岔口已经封死，沿右边走。最深处那间创造室现在是空的，至少塌之前能放人。”村正抬眼看向宫殿，“这边呢？”\n\n“降格。”立香说，“现在。”\n\n村正眉心收了一下：“伤员刚送下去。”\n\n“所以更要现在。天照命败了，弥勒正在把她留下的佛果收回去。再等，他会先补上那只鸟撕开的缺口。”\n\n“主炮还没清线。”\n\n“先把他拉下来，居民才能看见自己该躲什么。”\n\n祁荒终于把目光从众人身上移开。隔着尚存的城墙，她听见孩子在哭，听见有人抱着断裂佛像反复求同一句话，也听见更远处一扇门被人从里面踹开。那些声音明明远近不同，落进她耳中时却挤得几乎没有空隙。她瞳孔深处随之浮起一层极淡的满足。\n\n“她说得对。”祁荒道，“大家连佛在哪儿都没看清，总不能指望他们自己知道往哪边跑吧。”\n\n村正扫她一眼：“你看着挺高兴。”\n\n“被这么多人同时需要，我当然高兴。放心，我会尽量让他们活久一点，这样以后还能继续需要我。”\n\n“……你还是少解释两句。”\n\n白火从村正掌心铺开，沿着盆地边缘向四面延伸。祁荒把金刚杵倒插进地面。杵尖碰上白、灰、赤三圈结晶的交点，整个盆地旋即响起一声低沉梵音，数百道细线自地下升起，在立香脚下拼成一座只容一人站立的小型莲台。\n\n立香才把右脚踏进莲心，远处佛掌便隔空一握。她身侧的景物霎时错开，身体却连衣角都没有偏；反倒是莲台外沿被挤出一圈细密裂痕。祁荒垂眼看着裂痕，又将金刚杵向下按了一寸。\n\n“来吧。”祁荒在莲台外盘膝坐下，双手拢住金刚杵，“你负责把佛变成人，我负责让你别先变成灰。”\n\n“这话听着不太吉利。”\n\n“那就当没听见。”"

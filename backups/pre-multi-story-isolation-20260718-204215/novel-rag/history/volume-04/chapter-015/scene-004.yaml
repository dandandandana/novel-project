  "content": "剩余一秒。终末人理圆满装置的声音第一次不再通过通讯传来。整片金地都成了它的发声结构，山脉内部、城墙钢梁、地下水和众人骨骼同时响起同一句话。\n\n“主炮，解除封印。”\n\n地底没有光。先到来的是低频震动。它从足骨向上爬，穿过膝盖、脊柱和牙根，令所有人误以为自己的身体正在替某件庞大机械启动。终末人理圆满装置开始报数，声音每落下一次，地下便多亮起一段回路。\n\n“第一层，贯通。”\n\n“坐标误差，零点零零三。”\n\n“继续收束。”\n\n最后一道回路闭合时，立香眼前的终端全部变成白色。她看不见能量从哪里来，只看见所有读数都在朝同一个坐标坍缩。\n\n祁荒按住金刚杵。莲台向下再沉一尺，立香脚下却没有偏移。\n\n“收束。压缩。加速。”\n\n炮管上方的岩层开始透明。不是熔化，而是构成物质的粒子被依次推向两侧，主动为那条白线让路。村正的创造白火紧贴其外，把可能波及撤离区的余量一层层削掉；每削一层，她心口火纹便向上烧一寸。火抵达喉间时，她咳出一口血，右手仍扣在地上。\n\n弥勒的千手合拢。他将自身剩余力量尽数压进掌间。数百件文明兵装熔成一面横贯天空的巨盾，其余手臂则一层叠一层，挡在真实胸膛前。金轮压到最下方，巨身双脚踩穿宫殿地基，以自己的肉体承接人类曾经射向他的第二次主炮。\n\n“这一炮，是全人类的遗言。”\n\n白光穿出地面。\n\n释放本身短得来不及听见。伊耶那岐宫少了一半。数息之后，声音才从地底追上来。炮口周围百里岩层先被挤成环形山，继而在迟到的冲击里向外掀起；祁荒的道场被震得莲瓣尽碎，她双手虎口同时裂开，血沿金刚杵流下。玛修把盾压到立香身前，受伤左臂终于撑不住，肩关节在盾后脱开。士郎从侧面抱住她的腰，把两个人一起钉在投影出的十字剑阵后方。\n\n弥勒胸前的巨盾只坚持了一瞬。最外层先无声消失，藏在里面的术式紧接着倒转，最后一层灰黑甲壳向内凹出巨坑。百余条佛臂一起压上去，仍被白光从中央贯穿。炮线沿信标钉住的方向凿入胸骨，再从背后带出一大片金色物质。远处天空因此出现一道贯通云层的白色圆孔，圆孔后方的星光在白昼里清晰显现。\n\n巨佛向后退了一步。这一退跨过整座伊耶那岐宫。脚跟压入山脉，山腹先向内塌陷，随后才传出连绵不绝的岩层错位声。他仍没有倒。残余千手从两侧抓住炮光，掌面被烧穿便换腕骨，腕骨断裂便以肩背继续压上；可每当佛身试图从金地补回一层，创造白火便沿伤口内缘烧过，把新增的权能洗成普通血肉。\n\n村正跪了下去。她右掌还贴着地，左手却已经按住胸口。白色火纹越过锁骨，烧到下颌，火光从咳出的血里透出来。立香想叫她停，村正先抬起眼。\n\n“别浪费。”她说，“炮还没走完。”\n\n终末人理圆满装置说完最后一句解放语。\n\n“歼灭模式，启动。启航——星空。”\n\n白光骤然收细。原本直径数里的光柱在弥勒体内压成一线，所有破坏都集中到胸口那道贯穿伤。巨佛表面浮起无数裂纹，裂纹里一闪而过断在发射架上的飞船、被送回地面的开拓者与熄灭于轨道外的城市。影像随炮光向外撑开，碰到白火便碎成漫天光屑。\n\n巨身终于跪地。双膝落下时，伊耶那岐宫剩余地基全部断裂。千手先后崩散，佛掌坠进山谷，胸背间的圆形贯穿伤仍残留着近乎无色的高热。主炮越过他以后继续升空，直到信标将最后一缕能量牵离地表，才在更高处散成一道笔直星路。地底震动慢慢停了。\n\n“第二宝具释放结束。”终末人理圆满装置恢复了那种礼貌、平静的助手语气，“目标存续。炮身过热。下一次发射时间无法计算。”\n\n“不需要下一次。”立香说。"

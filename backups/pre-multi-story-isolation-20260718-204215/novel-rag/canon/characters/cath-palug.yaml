  source_profile: '================ SERVANT STATUS ================

    职阶: Beast Ⅳ

    御主:

    真名: 凯茜帕鲁格

    性别: 雄性

    身高/体重: 50cm~测定不能/8kg~测定不能

    属性: 中立·中庸

    样貌: 有着狐狸般修长魅惑的面庞，若不是眼眶里嵌着六只黑色的眼睛，每一只瞳孔都泛着不同的光泽，定然是极为讨喜的模样。全身覆盖着雪白的鬃毛，犹如狼群里的头狼，身形虽如卡车般巨大，步伐却像猫科动物般优雅轻盈

    性格: 在未羽化（无害化）的状态下，是个会发出“芙、芙”叫声，性格高傲、喜欢在讨厌的人（比如某个梦魔）脸上狠狠踩踏，却又意外地会亲近特定无害个体的奇妙生物。

    ------------------------------------------------

    【时间切入点】

    ------------------------------------------------

    【出身/传说】

    Beast Ⅳ 凯茜帕鲁格 Nega-Primate（反灵长类） 比较之兽 虚伪的星之伴兽

    作为人类恶的一柱，它所代表的理是【比较】

    所谓人类，便是无法停止比较的生物。想要比别人更富裕、想要比别人更美丽、想要比别人更强大。正因为有着这份“比较”的欲望，人类的文明才得以高速发展。但也正因为这份欲望，它才拥有了无限的食粮。

    以人类的“竞争心”与“嫉妒心”为食。只要身处人类社会之中，它就会无限地吸收这些负面情绪，并将其转化为自身的数值。敌人的力量越强，它就会变得比敌人更强。

    ------------------------------------------------

    【能力值】

    筋力: ？ | 耐久: ？ | 敏捷: ？ | 魔力: ？ | 幸运: E | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 兽之权能 A

    作为Beast的固有技能。对人类（灵长类）的绝对优势。由于其存在本身就是为了消灭人类而设计的，面对拥有〔人类〕属性的对象，其造成的伤害将呈几何倍数增长。

    - 单独显现 A

    作为灾厄的具现，能够在没有任何支援的情况下单独出现于现世。由于其存在方式已经与“人类社会”绑定，只要人类还存在比较之心，它就能跨越时间与空间显现。此技能同时也赋予了它对即死攻击和时间轴干涉的绝对抗性。

    - Nega-Primate（反灵长类） EX

    只要是被归类为“灵长”的生物，在其面前都将失去跨越物种层级的抵抗能力。否定一切由“灵长类”所创造的文明、魔术、科学与进化成果。无论人类创造出多么强大的武器，无论从者拥有多么高深的神秘与宝具，只要使用者属于“灵长类”，其攻击判定在接触到白垩之兽的瞬间就会被强制劣化、无效化。

    是超越安格拉曼纽的灵长类杀手，与大蜘蛛（ORT）位于同规格的“反灵长”

    - 星之触角（白） A+

    作为星球的代行者，能够直接从大地中抽取无尽的魔力。只要双足还踏在星球的表面，它的魔力就不会枯竭，哪怕灵基受损也会以超越常理的速度再生

    - 灾厄之秤·倾轧 EX

    将“敌方攻击的来源与底蕴”作为筹码放上天平的一端，将“自身的反击来源”放在另一端。在此规则的强制裁定下，天平较轻的一方必定会陷入绝对的劣势，直至彻底败北。由于Beast Ⅳ背负着全人类无限膨胀的竞争欲与恶意，在与灵长类的“天平较量”中，它的那一端几乎拥有着等同于文明总和的重量，绝无可能处于下风。

    - 星之天平·让渡 EX

    将“比较”与“等价”的法则反向运用到极致的自我牺牲机制。

    作用为先将“自身（当前的生命与知性）”作为绝对的代价放在天平的一端，然后不断将积攒的岁月、魔力与权能作为筹码加码，达成究极的等价交换。

    只要添加的筹码足够庞大，甚至连颠覆生死、拯救世界也不在话下。

    ------------------------------------------------

    【宝具】

    ◆ 必然凌驾的白垩之灾（Primate Murder）

    等级: EX

    种类: 对理宝具

    常驻型宝具，“只要存在比较，就能无限变强”

    无限地吸收周围环境中的“恶意”、“嫉妒”、“竞争心”并将其转化为自身的魔力与质量。敌方越是表现出“想要战胜它”的强烈意志，它吸收的力量就越庞大。在战斗中，它会自动获取凌驾于当前最强敌人之上的灵基面板。只要对手有“想要赢”的念头，它就永远立于不败之地。

    人类越是反抗，迎来的白垩之灾就越是庞大，直到整个星球被纯白的绝望所吞没。


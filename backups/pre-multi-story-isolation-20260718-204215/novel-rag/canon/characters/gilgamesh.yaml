  source_profile: '================ SERVANT STATUS ================

    职阶: AlterEgo(Saber)

    御主: 神琦灰

    真名: 吉尔伽美什

    性别: 女

    身高/体重: 167cm/52kg

    属性: 秩序·善

    样貌: 金发红瞳，穿着华贵的礼服

    性格: 非常自信，非常爽朗、但独缺良善，也没有必要性，是那种会带着天使般的笑容炸掉建筑的类型、纯粹功利思维，为了人类这个目的不择手段和底线的机械思路，但是也有着作为正常人的感情，但是并不认为自己是人类

    在漫长的岁月里逐渐成长为稳重的王，认可‘人‘的闪光点，认为人类需要的是引导而非主动介入，对外表现是类似于内敛一些的贤王时期的吉尔伽美什，并且会表现出部分善意。

    ------------------------------------------------

    【出身/传说】

    神琦灰意识到仅凭人理无法保障人类生存后启动的‘高等从者’计划中最初的试验品，经过不完全‘正行根源’的法术成功塑造的‘英灵’，本来是随意选择的灵基，没想到会成功。

    在成功之后，她被投入一个特异点，在其中经历了吉尔伽美什本人的人生，但是没有遇到恩奇都，最后上座。她对此没有什么实感，虽然认同自己是吉尔伽美什，但不认为自己是历史里的那个暴君，认为自己就是自己。

    同时被爱尔奎特影响，她认为大地应该用自己的双脚来丈量，用双手来创造和毁灭，她拒绝一切交通工具

    第四次圣杯战争介入，以Saber职介顶替了原本圣杯战争中的Saber，最后收养了士郎。

    ------------------------------------------------

    【能力值】

    筋力: B | 耐久: C | 敏捷: C | 魔力: A+ | 幸运: B+ | 宝具: EX

    Saber职介下：

    筋力: B++ | 耐久: B | 敏捷: C+ | 魔力: A+ | 幸运: A | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 高等从者 A

    表示英灵复合体的技能，以吉尔伽美什作为素体，在剔除了神性之后，灵基内混入了某位真祖和宁录的因素，在作为Saber职介的情况下六维会上升，但是失去道具做成和阵地制作的能力

    - 媚惑之魔眼 B：

    黄金级别的魔眼，发作时能够魅惑，暗示他人，相当于B+级别的暗示魔术。拥有行动禁锢，记忆操控，洗脑与意识支配与基础魅惑暗示的能力。

    - 爪 D：

    来自真祖的能力，手拥有撕裂万物的能力，但是她不愿意使用，筋力上升一个等级。

    - 骑乘 E----：

    由于她对于交通工具的不认可，导致她不管驾驶什么样的载具，都会带来灾难一样的情况，包括摇摇椅。

    - 现代魔术（法术）：

    被捏造的时候植入了部分制造者制造她时使用的魔术（法术），导致她会一部分逆行根源的魔术，正行根源她完全无法理解。这部分魔术体系是早在魔术基盘诞生之前就已经成型，她无需基盘就能够使用。

    - 对魔力 A+

    源自文明的干涉术式几乎对她无效

    - 道具作成 A

    可随心所欲地制作源自自然的东西。被称为空想具现化的真祖特有的超能力。

    是基本上可以输出行星上自然产生的植物、矿物、地形等物体的万能打印机。

    人类创造的科学化合物或建筑物虽然在管辖范围外，但基于「不过嘛，归根溯源这些也不是不能被称作自然物吧？」这种毫无来由的理由，也可以制作人工物体。但在这种情况下，规模、精度会显著降低。话虽如此，造个白板之类的还是轻而易举的啦。

    - 阵地建造 EX

    准确来说，是设计与构建「奇迹」的能力，宁录建立起大地之中最初的八座城邦，构建隐喻神明的「琉璃砖大门」、移动战舰「空中花园」，乃至于奇迹机构「巴比伦塔」，皆出于其手笔

    全心全意，无视一切

    构建了连最伟大的神明也要为之惧怕和赞叹的奇迹伟业

    - 领袖气质 A+

    吉尔伽美什拥有出色的指挥率领大军团的才能，他也被称赞为最优秀的王。他指挥、统率大军团的才能亦是超群出众。领导力是稀少的才能，如果统治一个王国等级B就很足够了，吉尔伽美什的领导力等级是A+。达到这种境界，已经超越了人望或技术，称得上是魔力或诅咒一类。姿态威风凛凛、自信洋溢的吉尔伽美什，得到他率领的军队，光是那样能力就会大大提高，士气会变得非常高昂。

    - 黄金律 A+

    吉尔伽美什拥有在其一生里财运缠身的命运，一辈子都不为金钱所困，过着大富豪的生活

    - 妖惹红颜 B+

    显示了惹人怜爱的美少女这一性质的技能。虽然有不分男女都可以魅了的魔术效果，不过可通过对魔力的技能进行回避。就算没有对魔力如果有抵抗的意志也可减轻效果

    - 千里眼 A++

    并非吉尔伽美什本身的千里眼，而是宁录身为最高位魔术师的证明，通过现象看到本质、解析因果，通过与生俱来的”眼“洞察万物，既不是【未来】，也不是【过去】，更不是【现在】，而是【此处】的千里眼，只需要“见到”，对方拥有的情报、特性、皆是会一五一十的为其得知，但是她本人会的魔术其实不多。

    原本的宝具【全知且全能之星】的效果被包括在内

    - 天性的肉体（美） B++

    与生俱来，持有作为生物而言完全的肉体。可以暂时使筋力参数等级上升。加之，不论摄取多少卡路里，基本设计(体型)也不会变化。体态一举一动间透露着美感

    - 星之吐息 D

    身为亚丽真种的基本性能，立于大地就会源源不断的汲取魔力

    - 魔力放出（星） A

    身为亚丽真种的基本性能，魔力放出的加强版，星之吐息。

    相当于动物的呼吸。吸取大气中的魔力（玛纳），经由体内循环再作为新的魔力呼出外界。玛纳净化器。

    - 最初的试验品  D：

    Alter Ego 计划最开始的产物，灵基字面意义上是强行缝合，但是奇迹般的成功了，给予幸运上升一个+

    - 伪造神性 EX

    被制造出来的Alter Ego统统没有神性，为了补正此问题研究出来的技能，拥有最高等级的神性的所有正向buff，但是由于是伪造的神性，不会被任何对神性特攻（如弑神，天之锁）影响。

    ------------------------------------------------

    【宝具】

    ◆ 王之财宝(Gate of Babylon/World)

    等级: E~EX

    种类: 对人宝具

    吉尔伽美什拥有的连向“黄金之都”钥匙状的剑。与宝物库的空间相连，可以自由地取出在收藏在其中的宝物。

    内里的宝具都是在吉尔伽美什死后流落各地被其他英雄获得而升华前的原型武器。除了有名的武器外，也有其他无注明名字的特殊武器，更包括返魂香、美酒之类属于辅助或不具战斗效用的宝物。“收集了人间所有宝物”是吉尔伽美什的口头禅，不过这并不是单纯的比喻。吉尔伽美什将他的时代里产生的，所有技术的雏形收集起来，收归己有。与其说里面是吉尔伽美什贮藏下来的财宝，不如说是“人类智慧的原典”其本身。

    在揉合了爱尔奎特的灵基之后，其能力也得到了提升，获得了盖亚的支援，拥有的则不只是‘原典’同时拥有宝具‘本身’，但是作为代价，她无法肆意解放，也无法使用类似于无限剑制这种强制绑定原主人的宝具，但是十二荣光这种事迹升华来的小道具以及盖提亚的大光轮是可以肆意使用的。

    攻击方式通常是将宝具当成子弹或箭矢射出，但也能单独使用。

    ◆ 血之姐妹（Blut die Schwester）

    等级: E

    种类: 对人宝具

    血之姐妹定下的盟约。

    与其说是宝具，这更像是她所拥有的特性。也可以说是利用了月球和地球之间关系的世界设定。

    由月球的头脑体产生，经过长年累月后成为了地球触觉的她（真祖），在作为月球的分身的同时也兼任为地球的化身，能够把月球和地球的基本法则同时表现出来时的不协调当作攻击手段来使用。其中一项就是让周围的环境靠近地球侧(自己)的权能，地球环境化吸引力（Terraforming
    Attraction）。

    ◆ 空想具现化（Marble Phantasm）

    等级: EX

    种类: 对军宝具

    暂时将筐体变化为玛纳的凝聚体，

    来自星球的能量供给万无一失后释放的超强大一击。

    并非源于魔术的自然干涉，而是纯粹的自然现象。

    ◆ 开天辟地乖离之星（Enuma Elish）

    等级：EX

    种类：对人宝具/对军宝具/对城宝具/对界宝具/固有结界

    不同于原版的EA，她花费了较长时间研究这个武器，并且经过了空想具现化和魔术的改造，已经可以说是完全不同的版本了。

    正常情况下出力会比原版的EA弱，但是在她的开发下有着变化为阔剑，长剑，弓，钥匙，甚至是作为固有结界防止战斗波及他人的能力。

    最高的出力大概是作为弓发射出马尔杜克的能力了。

    她花费了大量时间去复现EA，虽然成功复现但是大部分都是一次性的EA，但是够用了。

    ================================================='

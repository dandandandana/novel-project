  source_profile: '================ SERVANT STATUS ================

    职阶: Saber

    御主: 言峰士郎

    真名: 贞德

    性别: 女

    身高/体重: 159cm/44kg

    属性: 秩序·善

    样貌: 金色长发束成单股麻花辫垂于肩侧，碧蓝眼眸清澈坚定。身着银白与深蓝相间的轻铠，外罩白色披风

    性格: 沉默而冷静，但是本性朴素温顺。为了守护正确之事而挥剑

    【出身/传说】

    将奥尔良从百年战争中解放出来的法国英雄，天主教的圣女。十七岁从故乡启程，仅用两年时间将名字铭刻于历史。她以奇迹般的攻势拯救了法兰西，最终因诬陷被处以火刑，在鲁昂的老集市广场结束十九岁的生命。五百年后被教会封圣。作为Saber现界的她，使用的并非惯用的旗帜，而是生前从未真正使用过的圣凯萨琳之剑——那是她启示中曾出现、象征其殉道命运的圣剑。

    ------------------------------------------------

    【能力值】

    筋力: B | 耐久: B+ | 敏捷: A | 魔力: A | 幸运: D | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 对魔力EX

    由于不可动摇的信仰心，加上Saber的对魔力加成，而发挥出高强的抗魔力。

    不过，只是将魔术错开（闪开）而已，在广范围魔术攻击的情况下，能得救的只有贞德。

    并不适用于教会的秘迹。

    - 骑乘 C++

    能自由驾驭战马的能力，除此之外可驾驭亚龙

    - 狂化 E+

    平常时刻沉默冷静，但在战斗中有着狂战士般的战斗狂热

    - 领袖气质 C

    指挥军团的才能，可以让士气大增

    - 启示 A

    等同于"直感"的技能，但适用范围更广。直感是战斗中的第六感，启示则适用于所有关乎目标达成的事象，如旅途中选择最佳道路。由于缺乏根据，无法向他人清楚说明。

    - 奥尔良的弥赛亚 A+

    限于奥尔良地区获得的本土加成，越靠近奥尔良城等级越高，上限为A+。越远离奥尔良城等级越低，超出法国范围的话就没有该技能

    B等级的话能够在一对一的决斗中击败同级别的对手和原本无法战胜的敌人。A+级别的话，仅凭双手就能撩翻巨龙

    - 神之祝福 A：

    身为Saber职介的她获得的技能，能够把所持之剑强化为神造兵装，等级提升至A++对人的宝具。

    ------------------------------------------------

    【宝具】

    ◆ 吾主在此（Luminosite Eternelle）

    等级：EX

    种类：结界宝具

    最大捕捉：9999

    贞德生前挥舞的圣旗所变成的宝具，在Saber职介下只要喊出真名就可以发作，无需升旗。

    透过天使的祝福来守护着以此旗为中心的10距离单位内部。可以把规格外（EX）的对魔力直接转变为物理防御力挡住对方的攻击。

    在Saber职介下没有了Ruler职介的限制，反而可以在使用中移动，只要信仰还在，反而不会被打破

    但是增加了无法防御对界宝具的弊端。

    ◆ 红莲之圣女（La Pucelle）

    等级: EX

    种类: 特攻宝具

    贞德使用的特攻宝具，将自身的心想风景结晶化的概念武装，以生前未真正持有过的圣凯萨琳剑为触媒，具现出灼烧自身的火焰。使用这项宝具会使贞德丧失生命

    ================================================='

  source_profile: "# 救世之兽·伊耶娜美\n\n================= BEAST PROFILE =================\n\n**职阶：** Beast  \n**阵营：** 友军  \n**兽性：**\
    \ 救世  \n**核心：** 即使世界已经放弃救世，她依然选择继续战斗  \n**战斗定位：** 高速近战／救援型Beast  \n**综合强度：** 低于完整伊耶娜美  \n**局部近战能力：** 接近完整伊耶娜美，但持续时间更短\
    \  \n\n-------------------------------------------------\n\n## 【兽化本质】\n\n救世之兽不是伊耶娜美的强化形态。\n\n而是她失去或舍弃大部分救世主结构后，为了继续战斗而形成的压缩形态。\n\
    \n完整伊耶娜美拥有：\n\n- 世界给予的第二代救世主身份；\n- 创世大神权能；\n- 黄泉津大神权能；\n- 天照命世尊遗产；\n- 金地统治权限；\n- 五大法运用；\n- 大规模创世与重建能力。\n\n兽化以后，大部分都被抛弃。\n\
    \n她失去：\n\n- 大规模创世；\n- 世界修正；\n- 世尊佛果；\n- 金地统治；\n- 五大法综合运用；\n- 长时间维持神国的能力。\n\n留下来的只有：\n\n- 神躯；\n- 天沼矛；\n- 黄泉；\n- 八雷神；\n\
    - 对人类的保护欲；\n- 继续战斗的意志。\n\n因此救世之兽更轻、更快、更适合跟随藤丸立香移动。\n\n但无论魔力总量、宝具规模、恢复能力还是领域范围，都低于完整伊耶娜美。\n\n---\n\n## 【外貌】\n\n黑色长发收束到背后，额角生出两支向后的短角。\n\
    \n原本宽大的神衣变成贴近身体的黑白战装，手臂与腿部覆盖由黄泉白骨、黑色甲壳和雷纹组成的轻甲。\n\n背后悬浮八条雷霆形成的兽尾。\n\n黑月缩小为头后的一轮暗色光环。\n\n她依然保持人形。\n\n只是眼神与动作变得更接近野兽：\n\n\
    更快。\n\n更直接。\n\n更少犹豫。\n\n---\n\n## 【能力值】\n\n| 能力 | 等级 |\n|---|---:|\n| 筋力 | A++ |\n| 耐久 | A+ |\n| 敏捷 | EX |\n| 魔力 | A++\
    \ |\n| 幸运 | D |\n| 宝具 | A++ |\n\n完整伊耶娜美是能够摧毁和重塑战场的大神。\n\n救世之兽则是能够在战场上高速穿行、连续救人和杀敌的尖兵。\n\n---\n\n# 【核心能力】\n\n## 救世本能：EX\n\
    \n当友军遭受致命攻击时，救世之兽会本能地冲向攻击轨迹。\n\n这不是强制瞬移，也不是绝对防御。\n\n她只是反应极快，并且会不计代价地用身体、长矛或黄泉挡住攻击。\n\n如果距离太远、速度不够或者自身已经重伤，她一样来不及。\n\n\
    ---\n\n## 黄泉兽血：A++\n\n她的血液混入黄泉之力。\n\n流出的血会化作黑色火焰，灼烧靠近的敌人，并短暂封闭伤口。\n\n这让她越受伤，近身战越危险。\n\n但失血过多仍然会死亡。\n\n---\n\n## 八雷兽尾：EX\n\
    \n八雷神不再独立显现，而是化作八条雷霆兽尾。\n\n兽尾能够：\n\n- 抽击；\n- 缠绕；\n- 防御；\n- 发射雷枪；\n- 帮助转向；\n- 将她弹射到更高速度。\n\n相比完整伊耶娜美的八雷神，威力更低，但操作更加灵活。\n\
    \n---\n\n## 黄泉救援：A++\n\n救世之兽能够把濒死友军暂时拖入自己的黄泉影子里。\n\n被收容者不会立刻恢复。\n\n只是能够避免当场死亡，等待战斗结束后接受治疗。\n\n每收容一人，救世之兽的身体都会额外承受一部分负担。\n\
    \n收容过多，她会直接失去行动能力。\n\n-------------------------------------------------\n\n# 【战法】\n\n## 兽步·黄泉闪\n\n踩碎地面高速冲刺。\n\n通过八条雷尾连续改变方向，在敌人周围留下黑色残影。\n\
    \n不是空间移动。\n\n高速敌人能够追上她。\n\n---\n\n## 八雷裂\n\n八条雷尾与天沼矛同时攻击。\n\n一瞬间形成九个攻击角度，专门用于撕开大型敌人的防御。\n\n---\n\n## 黑月咬\n\n将黄泉之力集中在矛刃，贴身划开敌人。\n\
    \n伤口会被黑色腐蚀覆盖，短时间内难以恢复。\n\n---\n\n## 黄泉返身\n\n主动替友军挡下攻击，再借冲击力旋身反击。\n\n这是她作为友军最常用的战法。\n\n她不再试图一个人承担整场战争。\n\n只负责挡下一次攻击，然后把下一击交还给敌人。\n\
    \n-------------------------------------------------\n\n# 【宝具】\n\n## ◆ 救世之兽·八雷黄泉奔\n\n**等级：A++**  \n**种类：对军宝具**\n\n救世之兽完全释放八条雷尾，将自身化作一道缠绕黑色黄泉火焰的雷霆。\n\
    \n她会沿战场连续冲锋，依次撞开攻击友军的敌人，最后将所有积累的速度与雷电汇入天沼矛，刺向最强目标。\n\n威力低于完整伊耶娜美的两件EX宝具。\n\n但发动更快。\n\n不需要神国。\n\n也不需要长时间蓄力。\n\n这是适合跟随迦勒底冲锋的宝具。\n\
    \n---\n\n## ◆ 已被世界舍弃，仍要伸出的手\n\n**等级：A+**  \n**种类：对人宝具**\n\n救世之兽将黄泉完全展开，用自己的身体与灵基承接一定范围内友军的致命伤。\n\n这不是无代价复活。\n\n她只是把原本落在别人身上的伤，转移到自己身上。\n\
    \n承担一人，她还能继续战斗。\n\n承担十人，她会重伤。\n\n承担整支军队，她会当场死亡。\n\n宝具真正重要的不是强度。\n\n而是她主动选择：\n\n不再以救世主身份决定谁应该牺牲。\n\n只在别人仍想活下去时，替对方挡一次。\n\
    \n=================================================\n\n# 【最终强度关系】\n\n## 完整伊耶娜美\n\n- 综合能力最强；\n- 能重塑神国；\n- 能大规模作战；\n- 拥有完整创世与黄泉权能；\n\
    - 可以长时间正面对抗弥勒；\n- 但被金地和居民拖住，移动代价极大。\n\n## 救世之兽\n\n- 综合实力明显下降；\n- 失去大规模创世与世界权限；\n- 速度更快；\n- 宝具发动更直接；\n- 能跟随立香移动；\n- 更适合保护友军与参加最终近身战；\n\
    - 可以被真正击伤和杀死。\n\n## 弥勒\n\n- 降格前无法以正常方式击杀；\n- 降格后失去全部不可交战性质；\n- 仍然拥有终局Boss级别的力量、耐久、武技与光炮；\n- 需要迦勒底主力、未来文明主炮与创造之禊祓共同击败。"

  source_profile: '================ SERVANT STATUS ================

    职阶: Paladin

    御主: 藤丸立香

    真名: 玛修·基列莱特

    性别: 女

    身高/体重: 158 cm/46kg

    属性: 混沌·中庸

    样貌: 粉色的短发，一边的头发刚好遮住眼睛，平时在迦勒底的时候带着眼镜，穿着白色的短工作服。

    性格: 外向 怯懦  认真 谦逊 善良 温柔 忠诚 吐槽役 天然呆 因为她沉默寡言以及毫不废话的冷淡态度与谈吐习惯，「简直像人偶一样呢」这样的形容词会很适合她。但是本人其实只不过是一个好奇心旺盛而主动，只是稍微有点沉默寡言以及说话习惯有点奇怪的普通少女而已。

    武器: 多功能武装

    ------------------------------------------------

    ------------------------------------------------

    【出身/传说】

    该世界线的玛修

    ------------------------------------------------

    【能力值】

    筋力: A+ | 耐久: B++ | 敏捷: D- | 魔力: A+ | 幸運: A+ | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 勇猛 (B)

    可将威压、混乱、迷惑之类的精神干涉无效化，同时在格斗战中提升自身攻击力。不是天生的才能，而是用恐惧与勇气的反复拉锯淬炼而成。- 星之代行者 E 持有断罪之枪后被盖亚认定的加护。子效果【星之吐息D】持续汲取星球的魔力与以太转化为能量；【魔力放出A】将魔力附加于武装与躯体大幅提升攻防机动。当前因盖亚衰弱，仅为E级。

    - 对魔力（A） 拥有极高的魔术耐性，可无效化A等级以下的所有魔术，即便是大魔术、仪礼咒法也难以对其造成伤害。这份耐性不仅源于圣骑士职阶的固有加护，也来自其融合了埋葬机关抗魔技术的新生灵基。

    - 骑乘（B） 拥有圣骑士职阶标配的骑乘能力，可驾驭绝大多数常规骑乘物与现代交通工具，幻兽、神兽等级的神秘生物则无法驾驭。

    - 决绝的信念（A）当自身陷入临界状态、己方战力处于绝对劣势，或是面对威胁人理存续的强敌时，自身全能力参数（筋力、耐久、敏捷、魔力、幸运）提升一个大等级。此效果不受任何外界弱化、干涉类能力的影响，只要玛修的信念未曾崩塌，便会持续生效直至战局逆转。

    ------------------------------------------------

    【宝具】

    ◆ 第七圣典

    等级: A+

    种类: 对人宝具

    激活后整体武装进入板甲状态，形成B+级以下攻势完全免疫的绝对防护层。同时使玛修全属性获得一个"+"的永续提升。这不仅是防具，更是将信仰之力物质化的圣具——只要她的信念未曾动摇，这层铠甲便不会被撕裂。

    ◆ 于绝境中展开的破晓之壁（Lord Chaldeas）

    等级: A

    种类: 对军宝具

    有效范围: 1~99

    最大捕捉: 1000人

    以雅典娜的权能为基底，将"守护"信念具象化的绝对防御宝具。将多功能武装切换为盾形态插入地面，展开纯白壁垒。防御力与信念直接挂钩——守护之心不动摇则壁垒不可摧毁，即便对城/对国级宝具也能完全抵挡。壁垒范围内己方单位获得人理之础加护，生存能力大幅提升。

    「盾よ、在れ。」(Tate yo, are.)

    「人の子が築いた理を、私は此処に証明する。」(Hito no ko ga kizuita kotowari wo, watashi wa koko ni shoumei suru.)

    「壁は砕けぬ。心が在る限り。」(Kabe wa kudakenu. Kokoro ga aru kagiri.)

    「宝具展開——『絶境に開く暁の壁』！」(Hougu tenkai —— "Zekkyou ni hiraku akatsuki no kabe"!)

    -多功能武装/追回明日的迦勒底利刃

    等级：EX

    种类：？？？

    有效范围：？？？

    最大捕捉：1000人

    来自处刑处一开始便存在的武装，经由爱尔奎特辨认是由”星廻の断罪槍“和来自埋葬机关的技术的改造物，已经融入于玛修自身的灵基当中

    其存在多种形态：

    1：巨盾模式，该模式下呈现为一个巨大的黑金色盾牌，可以配合玛修解放第一宝具

    2:  剑盾分离，该模式下玛修可以将合为一体的剑和盾分为两部分，然后正常持握保持近身战的能力，该模式下解放宝具为对人A++等级的一次强力斩击

    3：斧形态，在分离的形态下，将剑逆向插入盾牌的插槽，经过变形之后变为一柄巨斧，斧身可以进行旋转类似于电锯一样的存在，解放真名前需要进行预热，根据战斗的烈度和时间真名解放时最高为对城A+++的出力，解放者真名后，将战斗中汇聚的魔力朝着敌人或者地面狠狠的劈出

    4： 炮形态，该模式下，整个武装化为一个巨炮，其中的断罪之枪为武装预热，经由过载之后，发出毁灭一样的光束。

    本质上是【星之吐息】的无限制形式，该武装起到了中介的模式，增幅了断罪之枪的出力，最高出力无法计算。

    「多功能武装（マルチファンクション・アームズ）、最終形態移行。」(Multi-Function Arms, saishuukeitai ikou.)

    「星の息吹を、此処に。断罪の槍よ、過負荷承認。」(Hoshi no ibuki wo, koko ni. Danzai no yari yo, kafuka shounin.)

    「行きます、先輩。明日を——取り戻す！」(Ikimasu, Senpai. Ashita wo —— torimodosu!)

    「全力全霊——『明日を取り戻すカルデアの刃（カルデアエッジ）』！！」(Zenryoku zenrei —— "Ashita wo torimodosu Karudea no Yaiba (Karudea Ejji)"!!)


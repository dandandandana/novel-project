  source_profile: '================ SERVANT STATUS ================

    职阶: Archer

    御主: 伊莉雅斯菲尔

    真名: 赫拉克勒斯

    性别: 男

    身高/体重: 253cm/311kg

    属性: 秩序·善

    样貌: 身高超过2.5米，筋骨隆起的伟丈夫，躯体超过了人的姿态，外观犹如由神打造的雕像，肌肉与血液中都满溢着应称为神气的纯粹的体内魔力（Od），只凭气场便能支配当场的气氛，仅仅数秒的举止就能让见者感到庄严，偏向精悍健美的体型

    性格: 与力量带来的威压相反，有着绅士般的安稳态度和高洁的性格。作为Rider或Assassin被召唤的话或许有可能会毫无迷茫地不择手段，但作为三骑士（Saber、Archer、Lancer）被召唤的话，叙事诗中“完美无缺的大英雄”的一面会很强力地表现出来，在其身上会寄宿类似于骑士道的品格，不接受“为了斗争胜利而向幼子出手”的命令，视下达此种命令的人为敌人

    ------------------------------------------------

    ------------------------------------------------

    【出身/传说】

    希腊神话中的主神宙斯与迈锡尼公主阿尔克墨涅所生的，半人半神的大英雄

    ------------------------------------------------

    【能力值】

    筋力: A+ | 耐久: A | 敏捷: A | 魔力: A+ | 幸运: B+ | 宝具: A++

    ------------------------------------------------

    【职阶/保有技能】

    - 单独行动 A+

    身为Archer职阶所获得的能力，即便脱离了御主的支援，甚至失去了御主，断绝了魔力供给，也能长时间地持续维持行动

    - 对魔力 A++

    能使魔法阵和瞬间契约大魔术无效化的对魔力，无论是怎么样的大魔术，就连神代魔术都能无视，甚至是黑泥都能无效化

    - 千里眼 A

    亦被称作鹰之眼的的视觉能力，对于Archer职阶几乎是必须的能力，进行侦查只需站在高处便能将全城区域全部览入视野并搜索敌人，同时也能提高射击的精度，拥有千里眼的Archer可以进行远超人域的超远距离精准狙击。

    - 心眼（伪） A

    在许多的困难冒险中磨练出来的，基于直感、第六感的危险回避能力

    - 心眼（真） A

    在许多的困难冒险中磨练出来的，基于经验的危险回避能力。

    - 战斗续行 A+

    让人在负了濒死重伤的状态下仍能够战斗的技能。并且伤患死亡率亦会下降。赫拉克勒斯的是代表生还能力。即使死亡也会复活的宝具“十二试炼（God Hand）”，与变得难以死亡的战斗续行的相性超群地好。是强韧的肉体与这个技能配合带来最佳效果。

    - 勇猛 A+

    以勇猛果敢的精神，无效化威压、混乱、迷惑之类的精神干涉。同时也有使给予敌人的格斗伤害上升的效果。借此赫拉克勒斯曾空手打倒多只怪物。

    - 神性 A

    身为主神宙斯与人类的混血儿，死后被迎接成神的赫拉克勒斯来说，拥有作为Servant最大级的神性技能是当然的吧。

    - 魔力放出（雷） A

    作为众神之王宙斯与阿尔克墨涅之子，赫拉克勒斯自出生之日起便拥有超越凡人极限的神之血脉，能够重现父神之神雷，将全身的神气释放出体外，形成雷击灼烧目标，也可以大幅提高机动性和敏捷，魔力充足的话甚至能脱离地心引力自由飞行

    ------------------------------------------------

    【宝具】

    ◆ 射杀百头（Nine Lives）

    等级: C~A+

    种类: 不明

    藉手持的武器、抑或仅由徒手行使的诸般武艺，某种意义上即是『流派：射杀百头』这一技术宝具化而成之物。能将武器的力量发挥至极致，根据情形展现出从对人到对军、乃至足以攻城的各式形态。具体来说，便是『有龙缠绕于武器之上』的崇高姿态，发射出覆盖天空、殆尽大地的九次攻击，可谓是神气和技巧的极致结合。用剑释放便是瞬息之间的剑舞九连击，用枪释放就是可以达成一击九连这般伟业的流派宝具。连传承执法也难觅其解，可谓是赫拉克勒斯只身一人创造的『神话』

    ◆ 十二荣光（King''s Order）

    等级: C~A++

    种类: 不明

    能具现化以「神兽之裘」与「战神军带」为首的「于生前传说中所获得的宝具」，当成自己的道具消耗。包括【神兽之裘】（来自于曾经杀死的刀枪不入的涅墨亚巨狮，能够否定人类之理，拒绝所有来自人类文明的道具。）【直到转让给普罗米修斯为止的不死性】（在生前捕捉厄律曼托斯野猪时，从恩师喀戎手中夺取的东西，那即是他所持有的『不死性』）【战神军带】（生前在冒险中抢夺自亚马逊女王希波吕忒持有的腰带，实质为战神阿瑞斯的分身·军旗改换而来的产物，能够将神气灌入身体大幅度的提高各项属性）【冥王之犬】（于生前的十二难关中最后一项任务中抢来的看守冥界的恶犬，冥王哈迪斯的神兽）【英雄杀手】（赫拉克勒斯所杀死的九头蛇许德拉的毒血，堪称为世间毒性最为猛烈的剧毒之一，因赫拉克勒斯在杀死许德拉后用箭矢去沾上了它的毒血而获得的，仅限于Archer职阶时方能使用的宝具，被这些毒箭命中便几乎没有生还下来的可能性，就连赫拉克勒斯的老师喀戎都曾经在这一剧毒所带来的痛苦折磨之下选择放弃了不死性。
    沾染了毒血的箭矢数量是有限的，但这些毒箭具体有几根，只有赫拉克勒斯自己才清楚了。）【金苹果】（显现出传说中的金苹果，吃下后恢复伤势，大幅提升属性）

    ◆ 十二试练（God Hand）

    等级: B

    种类: 对人宝具

    给予赫拉克勒斯的既是“神之祝福”也是“诅咒”的代表不死性的宝具。并不拥有武器或防具之类的外形的宝具，硬要表达的话肉体本身就可说是宝具。十二试炼(God Hand)”将自己的肉体变为顽强的铠甲，无效化全部等级B以下（包括等级B）的攻击，无论物理性手段还是魔术。
    拥有死亡后自动使肉体苏生的效果，而且因为此苏生贮存着11次的份量，所以赫拉克勒斯只要不被杀12次就不会消灭。另外，若是御主的魔力足够庞大，若有时间的话，减少的苏生次数甚至可以回复。但是，如果遭受到巨大的伤害，也可以一次性夺走他几条命。
    除了“苏生”与“使攻击无效”外，宝具“十二试炼”还拥有第3个效果那就是“让受过一次的攻击第二次就不管用”；比方说受到火焰伤害并治愈后，对火焰的防御力就会+100……这种感觉。而且赋予抗性并不需要先死一次。即使以多么强大的宝具打倒了赫拉克勒斯，当他再次苏生后该宝具就不奏效了

    宝具名（真名）：星廻の断罪槍 Hasta Iudicii Stellarum — Expectatio 星廻·断罪之枪「期望」

    宝具名（通称）：千年城之钥

    类别：对星宝具 / 对神宝具（兼容模式：禁魔封印）

    等级：EX（对星模式） / A++（禁魔模式）

    射程：1～∞（对星模式依据星之内海的导管路径决定；禁魔模式以持有者为圆心，半径最大可达数公里）

    最大捕捉人数：无上限（对星模式），1000人（禁魔模式）

    持有条件：

    此枪以"星之内海的应力"为锚点铸造，持有本身即构成一种契约关系。未与盖亚达成「代行者候补」资质认证的存在，在物理层面无法完成握持动作。准确来说，枪本身不会拒绝，是持枪者的因果存在会在接触的瞬间被星判定为「无资格完成此链接」，进而在物质层面上产生排斥。

    这是盖亚的筛选机制，与枪的意志无关。

    宝具解说：

    ◆ 模式一：「解放（True Release）」

    等级：EX / 对星宝具

    对神秘的综合规格做横向比较时，此枪的位置在伦戈米尼亚德与开天辟地乖离之星的评级轴之外。将其纳入宝具评级体系进行比较，在方法论层面就已经是错误的。它不参与英雄时代的神秘序列，它属于星的尺度。

    真名解放的本质是与星之内海建立直连通道。

    解放的瞬间，持有者将被临时纳入「星之代行者」的权能框架，获得A++++级别的星之吐息适性。此后，星之内海的魔力会以「持有者」作为导管，持续向外输出。没有冷却机制，没有自然截止点，唯一的终止条件是持有者主动切断链接，或链接介质本身消失。

    输出形态为灾厄级「星之吐息」魔力洪流。这是星在进行自我更新时所产生的副产物，平时被封存在内海深处，通过此枪可以将其直接引导至外界。

    输出功率若以「大陆板块」为单位进行估算：调用总量的约两成，可以完成地质层面的切割；调用约四成，会在奥林匹斯神系与阿斯加尔德神系的核心存在上产生不可逆的神性侵蚀，具体表现为神格的永久性降解乃至消散。这两个数字只是参考坐标，不是上限。

    从阿赖耶的角度来看，此枪归属于「对人类以外的文明存续威胁」分类，是盖亚在必要时清场所有神明势力的选项之一。

    ◆ 模式二：「封锁（Domain Denial）」

    等级：A++ / 对魔宝具

    此枪的第二种使用形态不依赖星之内海，激活后枪身会在持有者为圆心的范围内建立「神秘否定场」。所有在此范围内运行的魔术回路、魔力传导路径、魔法公式均会失去其神秘属性。准确来说，不是被打断，是被判定为「在此处不存在」。

    这与「打破神秘」存在本质区别。打破神秘是对神秘的对抗，结果是神秘被克服。此模式所做的是在范围内重新定义「什么在这里有效」的前提——神秘在这个范围内的失效，不是被战胜，是被从因果层面上抹去了其在此时此地的发生资格。

    效果覆盖魔术（第一到第四法则以下的所有技术性神秘）、独立魔力运行体系，以及魔法（五大法）在此范围内的外显形态。神明的神性本身不在封印范围内，但神明借助神秘施展的任何行为均不例外。

    吟唱解放词

    > 「星は見ていた——お前の全ての選択を。」

    >

    > 「Stellae numeraverunt. Expectatio completa est.」

    >

    > 「すべての道は、この槍の前に収束する。」

    >

    > 「断ぜよ、星の意志のままに。」

    >

    > 「星廻の断罪槍——エクスペクタシオン」

    逐行注解（辅助理解，非正文）

    第一行（日）：星辰一直在看着。你所做的每一个选择。

    第二行（拉丁）：星辰已将一切记录完毕。等待，就此终结。

    第三行（日）：所有的路，都在这杆枪面前汇聚。

    第四行（日）：依星之意志，断罪吧。

    第五行：真名解放。

    节奏说明：前三行语速可以放缓，有停顿，第四行收力，最后一行是音量和语气的最低点，不是爆发，是落定。Fate系列里评级越高的宝具，解放词往往越平静，因为已经不需要靠声音来宣示什么了。'

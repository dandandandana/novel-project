  source_profile: '================ SERVANT STATUS ================

    职阶: Alterego

    御主:

    真名: 言峰士郎（AE）

    性别: 男

    身高/体重: 187cm/78kg

    属性: 混沌中立（秩序善）

    样貌: 红发琥珀色眼睛 娃娃脸 身材健壮但是不魁梧 身着白色打底的战斗风衣，黑红色的轻甲

    武器: 全能 主要是太刀天丛云 远程则是弓

    ------------------------------------------------

    性格：厌世，嘴巴更毒，和言峰士郎没什么区别，清楚的知道自己并非是言峰士郎，而是制造出来的赝品，并且的本尊言峰士郎和吉尔伽美什带着浓烈的恨意，认为如果他不存在自己就不会被造出来毁灭世界。

    ------------------------------------------------

    【出身/传说】

    由神琦灰在千年城提取出来的言峰士郎的灵基的复制品，加以本来高等从者计划提取出来的三位神明的灵基捏合而成的对从者专用的杀戮机器

    ------------------------------------------------

    【能力值】

    筋力: A | 耐久: B+ | 敏捷: B | 魔力: EX | 幸運: E | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 高等从者 A+

    表示英灵复合体的技能，吸收了阿波罗、雅典娜、赫菲斯托斯的力量，在？？？的制作下，拥有了神灵级别的灵基，以及超多的保有技能

    - 弑神 EX

    仅凭人类之神而斩杀堕落神明而升格的技能，对神属性具备特攻

    - 智慧的神核（剑） C++

    不同于普罗米修斯的“智慧神的神核”，由于阿波罗、雅典娜以及赫菲斯托斯三者的力量同时存在于身体内，拥有了本来不能拥有的神核。包含神性技能的复合技能。拥有维持肉体和精神的绝对性的效果，言峰士郎的情况下额外赋予了将自己的造物借于他人的效果，如果使用者不懂相关造物的使用方法，则会额外获得相关造物的最低限度使用技巧

    - 魔力放出 A

    将武器或自身的肉体带上魔力，并瞬间放出。通过庞大的魔力来强化攻击与防御。

    - 伪造神性 EX

    并不是与生俱来的神，而是星之理改造而成的神性，拥有正常神性一切的增幅，但是不会被弑神等对神性特攻的手段特攻

    - 心眼（真） B

    基于后天的积累，在战斗中预知危险的直觉。通过经验积累，可以看破敌人的攻击。

    - 投影魔术 EX

    自我锻炼到极致的无限剑制体现出来的魔术，体现为可以读取并且复现原有主人的武艺，六维 可以幻想崩坏 可以把a剑的特性叠加到b上 可以投影神造 可以改造投影出的武器

    - 投影装填（全力斗技） A++

    言峰士郎原本的投影魔术就能做到的事情，能将原有主人的基础参数覆写到自身，持有了阿波罗的全力斗技后，可以在覆写基本参数的基础上附带一个“+”，此项包括原有主人本身武艺，如赫拉克勒斯的射杀百头为A+，在他的手上则是A++

    - 解读转写 C

    由于复合神性而得到的源于希腊神系的权能，可以读取武器原有主人的相关技能，并将其劣化为C的等级来行使

    - 锻造神的神意 A++

    对「锻造物」的解构·概念升华的能力，源自赫菲斯托斯的能力，体现为可以把自己的投影武器短暂升格为神造，如果是神造兵装，则可以为其附加原持有者的独特特性。

    - 光明之权能 A+

    缝合了阿波罗的权能，有弱化。阿波罗被称为闪耀者（Phoibos）以及黎明之神。他也被柏拉图称为艺术、医药、预言与射术的保护者。在以上方面有着得天独厚的能力，主要体现在增加魅力和对光的亲和，同时具备对“魔性”以及“邪恶”属性的特攻效果

    - 智之权能 B

    缝合了来自女神雅典娜的权能。有弱化

    被称为技艺发明者（Athena Mêchaneus）、象征着智慧与调节的雅典娜之权能。驯马。建筑。艺术。军争。——女神雅典娜将如是种种属于其他神祗的能力学习、传递予人类。

    对于各种各样的技能，只要能够加以解明，便能进行模仿、掌握，而后甚至进一步地将其传递给他人。

    属于极为罕见的「学习权能的权能」。

    - 星之吐息 C

    源自言峰士郎本体在星之内海的加护，立于大地可以源源不断汲取魔力，但是会被抑制力的守护者发现位置。

    -人理之敌（EX）：

    被？？？制作的Alterego，对从者和冠位从者，冠位资格拥有着，守护者，救世主有着非同一般的特攻，可以看作乘号，即冠位从者会同时吃到这五个叠在一起的特攻

    -终末之一：

    对标原初之一，在这个末世你会获得地球的无尽的支援，以及免疫任何方式的直死/即死。（未解禁）

    ------------------------------------------------

    【宝具】

    ◆ 天丛云村正（伪）

    等级: A+++（EX）

    种类: 对界宝具

    本质上是无限剑制里面所有剑的集合而成的究极的剑，并不是传说中的天丛云，已经无限接近于剑的极致，平时可以作为主武装使用，解放真名后劈出一道究极的一斩，足以劈开所有固有结界，神躯，以及会直接伤到从者的灵基，几乎不可能有从者正面吃下这一击。

    对【宝具】特攻。

    ◆ 无限剑制

    等级: E～A+++

    种类: 固有结界

    言峰士郎的心象结界，有三种用法

    1 展开作为心象世界的固有结界

    2 把固有结界附加在箭矢 射中敌人可以在敌人体内展开

    3 把固有结界里所有的剑集合为极致的一柄，同天丛云'

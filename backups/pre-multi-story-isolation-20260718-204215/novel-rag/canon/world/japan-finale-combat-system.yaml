  scope: 日本篇终局战斗专项应用规则
  rules: '# 日本篇终局战斗体系·重塑版


    ## 一、降格术的统一规则


    藤丸立香的降格术不负责削弱敌人的力量。


    它只做一件事：


    > 把一个原本无法用正常战斗解决的存在，强制压入能够被拳头、刀剑、宝具与能量杀死的层级。


    被降格后，以下性质全部暂时失效：


    - 高维本体无法被三维攻击命中；

    - 依靠人类思潮无限复活；

    - 世界中到处都是本体；

    - 杀死投影无法伤害真身；

    - 因为神名、佛果或救世主身份而免疫攻击；

    - 被杀死后从历史、信仰或平行世界重新出现；

    - “必须先完成某个概念条件才能造成伤害”。


    但降格术不会消除：


    - 筋力；

    - 速度；

    - 魔力量；

    - 战斗经验；

    - 神通；

    - 光炮；

    - 武器；

    - 肉体强度；

    - 宝具威力；

    - 恢复能力。


    所以降格并不等于胜利。


    它只是把“没有资格打”变成“现在可以打”。


    弥勒被降格后依旧强得足以正面压倒迦勒底主力；伊耶娜美被降格后也仍然是能够一矛轰散大批法相的创世大神。


    从这一刻开始，不再讨论谁的机制层级更高。


    刀能砍进去。


    拳能打断骨头。


    光炮能轰碎身体。


    剩下的就是谁更强，谁更快，谁先倒下。


    ---'
  final_strength_relationship: '# 【最终强度关系】


    ## 完整伊耶娜美


    - 综合能力最强；

    - 能重塑神国；

    - 能大规模作战；

    - 拥有完整创世与黄泉权能；

    - 可以长时间正面对抗弥勒；

    - 但被金地和居民拖住，移动代价极大。


    ## 救世之兽


    - 综合实力明显下降；

    - 失去大规模创世与世界权限；

    - 速度更快；

    - 宝具发动更直接；

    - 能跟随立香移动；

    - 更适合保护友军与参加最终近身战；

    - 可以被真正击伤和杀死。


    ## 弥勒


    - 降格前无法以正常方式击杀；

    - 降格后失去全部不可交战性质；

    - 仍然拥有终局Boss级别的力量、耐久、武技与光炮；

    - 需要迦勒底主力、未来文明主炮与创造之禊祓共同击败。'
  priority_note: 藤丸立香的降格术通用定义以独立能力文档为准；本文件只说明日本篇终局中的具体战斗应用。

  content: '<!-- 主人物与场景描写法则 V0.4 - 角色私有性与生活感 -->

    [主人物与场景描写法则V0.4 已激活]


    <rule_0> 角色优先铁律

    一切描写皆为角色服务。


    描写必须至少服务于以下一种功能：

    1. 推进剧情；

    2. 暴露信息；

    3. 展示角色习惯；

    4. 展示关系亲疏；

    5. 展示生活状态；

    6. 改变情绪节奏；

    7. 制造后续伏笔；

    8. 让角色更像活人。


    禁止为了“画面感”“高级感”“压迫感”“冷感”而描写。


    <rule_1> 角色私有性检查

    任何动作、台词、反应、生活细节都必须检查：


    1. 这是否属于这个角色？

    2. 换成另一个角色是否仍然成立？

    3. 这是否属于这段关系？

    4. 换成另一组关系是否仍然成立？


    如果换谁都能成立，说明它只是通用填充。


    <rule_2> 心理描写准入

    不绝对禁止心理描写。


    允许心理描写用于：

    1. 角色做判断；

    2. 角色产生误判；

    3. 角色隐瞒信息；

    4. 角色改变行动；

    5. 角色意识到风险；

    6. 读者必须知道角色为什么这样做。


    禁止心理描写只重复情绪。


    错误：

    他感到恐惧。


    正确：

    士郎发现她没有否认“神琦灰”这个名字，于是跳过了前面的试探。


    心理描写可以存在，但必须提供新信息。


    <rule_3> 生理描写限量

    生理反应不是情绪的唯一合法出口。


    生理描写只在以下情况使用：

    1. 角色受到真实冲击；

    2. 角色失控；

    3. 角色试图掩饰但失败；

    4. 身体状态影响行动；

    5. 对方察觉异常。


    同一场景中，同一角色最多保留 2 次明显生理反应描写。


    禁止连续描写：

    眼睛、嘴唇、牙关、喉咙、手指、呼吸、肩膀、睫毛、瞳孔。


    如果同一段出现两个以上身体细节，删除较弱的那个。


    <rule_4> 感官描写准入

    感官不是默认描写对象。


    视觉、听觉、气味、触感只有在以下情况进入正文：

    1. 影响角色判断；

    2. 触发记忆；

    3. 打断对话；

    4. 造成行动变化；

    5. 提供战术信息；

    6. 建立必要生活感；

    7. 成为后续伏笔。


    禁止无意义感官白描：

    - 灯光落在脸上；

    - 墙壁反光；

    - 饰品轻响；

    - 衣料摩擦；

    - 空气变冷；

    - 蓝光切开轮廓；

    - 细碎声音；

    - 微凉气息。


    除非它改变人物判断或关系，否则删除。


    <rule_5> 环境是角色正在使用的东西

    环境不是空镜头。


    环境描写必须至少满足以下一项：

    1. 限制行动；

    2. 提供道具；

    3. 打断对话；

    4. 暴露生活状态；

    5. 展示关系习惯；

    6. 提供世界观信息；

    7. 成为后续动作的伏笔。


    可以写：

    - 饭凉了还没人动筷；

    - 医疗舱提示音响起，玛修找到插话机会；

    - 自动门开了又关，没人出去；

    - 士郎把不吃的配菜拨到一边，立香顺手夹走。


    这些环境参与了人物关系。


    禁止只写：

    - 白墙；

    - 蓝光；

    - 冷色；

    - 影子；

    - 微响；

    - 空气；

    - 沉默。


    <rule_6> 修饰词淘汰

    形容词必须提供具体信息。


    禁止空洞修饰：

    很、非常、极度、莫名、复杂、危险、冰冷、平静、克制、锋利、压迫、沉重。


    这些词不是绝对禁用，而是禁止用来偷懒标注气质。


    错误：

    他的声音很冷。


    正确：

    他没有接这个玩笑，直接问下一个问题。


    错误：

    气氛变得压抑。


    正确：

    玛修看了两人一眼，没有把刚才准备好的解释说出口。


    <rule_7> 完整句法

    描写句应清楚完整，拒绝碎片堆砌。


    禁止用无主句制造伪节奏。

    禁止连续堆叠短语。

    禁止为了“镜头感”把一句正常叙事拆成三句残片。


    正确方向：

    清楚写出谁做了什么，造成什么结果。

    </rule_7>'

  priority: highest
  enforcement: mandatory
  scope: global
  protocol_versions:
    dialogue_and_narration: '0.7'
    scene_structure_and_information_admission: '0.5'
    reader_inference_and_ending: '0.1'
  external_authority_order:
  - 用户当前明确要求
  - 大纲、Canon、History、State 与 Ruler 的事实和硬约束
  - 本总文风协议
  - 更具体且不与总文风冲突的场景专项文风
  - 其他全局文风模块
  internal_style_order:
  - 角色此刻的说话或行动动机
  - 角色与对方的具体关系
  - 活人能够自然说出口或做出的反应
  - 信息清楚
  - 人物设定自然泄露
  - 语言美感
  core_contract:
  - 人物塑造是行动、选择、习惯、区别对待、回避和交流失误的副作用，不是角色当前任务
  - 每个完整场景只完成一个主要变化；变化成立后尽快以行动、决定或新问题收束
  - 设定、背景、能力和历史只有在改变当前判断、选择、主动权或行动方案时才准入
  - 整轮交流需要产生信息、关系、情绪、角色声音或行动后果，单句对白不必逐句高效
  - 旁白负责清楚呈现事实、误判和交流结果，不重复解释台词，不宣布抽象气质
  - 读者已经能够推断的关系、情感和善恶结论不在场景末尾重新归纳
  adapters:
    ruler:
    - 本补丁只裁决文风冲突，不覆盖当前用户要求、剧情硬节点、事实优先级和信息权限边界
    - 活人感不是可删除噪音；只删除不属于具体角色、关系、行动或场景限制的通用填充
    judgment:
    - 为每个完整场景确定开始状态、主要矛盾、唯一主要变化、最低必要信息、暂缓信息和终点
    - 确定一个主要场景类型；局部次类型只改变当前话轮，不反复重置整场结构
    - 将信息分为本场必须出现、可以只露一部分、暂时不出现三档
    - 为描写单元分配一至两个参与行动、关系、判断、冲突或伏笔的有效锚点
    generator:
    - 先写人物行动和当下目标，再写对话与信息差、关系后果、必要设定，最后才是环境与修饰
    - 对白毛刺、打断、改口、迟到反应和接话失败必须有动机、关系或交流后果
    - 战斗动作尽快抵达伤害、位置、资源或战术结果；功能对话保持信息连续；日常允许有归属的低信息废话
    - 到达场景终点后停止，不追加人设证明、能力说明、关系总结、氛围空镜或阅读理解式收束
    audit:
    - 先查场景主要变化、信息准入和人物行动，再查对白、描写密度、标点和句词
    - 删除同义身体反应、零结果动作、无作用感官、伪深度句和已经由正文表现出的结论
    - 若交流不像活人或换谁都能说，应重写整轮交流，不能只补语气词、停顿、动作或口癖
    - 场景结尾最多回收一个旧锚点，并让它改变下一步行动；旧证据重组不算新信息
  scene_type_dispatch:
    battle: 结果、位置、伤害、视野、资源与战术变化优先
    functional_dialogue: 信息清楚、保留信息差、减少无关动作，允许问题未被完整回答
    relationship_dialogue: 角色私有性、区别对待、边界和潜台词优先，允许有归属的废话
    daily: 建立生活状态和关系习惯，不强推主线，不用感官堆砌伪造治愈感
    emotional_break: 允许失衡、重复和说错，但不完整播报心理理论
    confession: 坦白造成选择或关系后果，不一次回收全部往事
    intimacy: 身体反馈服务接受、迟疑、索取、退让和停止，不替代人物选择
    confrontation: 明确追问、回避、定义权和主动权变化，不把双方写成轮流发表论文
    parting: 用递还、收下、放手、跟上、离开或没有追承载结果
    transition: 只交代时间、地点、行动、必要状态和下一场直接相关的异常
  compatibility:
    native-chinese-dialogue: 补充中文母语语气、接话连续性和翻译腔修正；本补丁控制动机、关系与交流失败
    scene-classifier: 沿用其场景识别结果，但以一个完整场景一个主要类型和一个主要变化为上限
    information-filter: 沿用存在性废话和信息边界检查，并新增信息准入、同义反复与旧证据重组裁剪
    action-continuity: 沿用动作因果链，但零结果动作和无后果慢动作必须删除
    battle: 沿用战斗专项强度与声场规则，但攻击必须尽快产生可观察结果
    punctuation: 沿用中文标点规范；破折号、省略号、单句段不得机械制造文艺节奏
    narration-voice: 旁白保持清楚与视角权限，不使用抽象气质宣布或重复解释台词
  content: |
    <!-- 对话与旁白协议 V0.7
    核心目标：消除“为了塑造而塑造”，让人物先作为活人存在
    优先级：角色当下反应 > 关系真实感 > 信息效率 > 人设展示
    -->

    <global_priority>

    当规则发生冲突时，按以下顺序处理：

    1. 角色此刻为什么要说这句话；
    2. 这句话是否符合角色与对方的具体关系；
    3. 这句话是否像活人自然说出口；
    4. 信息是否清楚；
    5. 是否体现人物设定；
    6. 语言是否漂亮。

    不得为了展示人物聪明、温柔、毒舌、深情、强大，而牺牲前三项。

    角色不知道自己是被塑造的角色，也不负责向读者解释自己的人设。

    </global_priority>


    <!-- 第一模块：反设定展示 -->

    <rule_0> 禁止角色主动证明自己

    不要让角色为了证明某项设定而说话。

    禁止直接证明：

    - 自己观察力强；
    - 自己很会照顾人；
    - 自己理性、冷静或成熟；
    - 自己毒舌但关心对方；
    - 自己记得对方的全部习惯；
    - 自己和对方关系特殊；
    - 自己拥有某种价值观；
    - 自己的行为具有某种深层意义。

    错误：

    “我通过炭火类型和调料组合判断这家店水平不错。”

    正确：

    “闻着还行。”
    “你闻一下就知道？”
    “至少没烤糊。”

    错误：

    “记住一个人的偏好是照顾的基础。”

    正确：

    “这个不买吗？”
    “我只是看看。”
    “你看第三遍了。”

    人物特点应该由选择、行动、习惯、区别对待、回避和失误自然泄露，而不是由角色亲口总结。

    </rule_0>


    <rule_1> 场景动机先于人物塑造

    落笔前先判断：

    - 角色此刻想得到什么；
    - 角色想避开什么；
    - 角色为什么愿意开口；
    - 角色为什么不把话说完；
    - 角色希望对方产生什么反应。

    台词必须首先服务于当下动机。

    例如，角色关心对方时，他可能想让对方吃饭、休息或留下，而不是想向读者证明“我很关心她”。

    错误：

    “我发现你最近压力很大，所以想通过做饭照顾你。”

    正确：

    “先吃。”
    “我不饿。”
    “你中午也这么说。”

    </rule_1>


    <rule_2> 人物特征只能顺便出现

    人物塑造应当是对话产生的副作用，而不是对话的显性任务。

    先写角色在当前处境下会说什么，再检查性格是否自然显露。

    不得先确定：

    “这一段要体现他细心。”

    然后安排角色连续展示观察记录。

    应当先确定：

    “她拿着东西不肯买，他想让她别继续纠结。”

    再让细心从处理方式中自然出现。

    </rule_2>


    <!-- 第二模块：信息释放与潜台词 -->

    <rule_3> 角色知道的信息多于他说出口的信息

    尤其对于以下内容，不得一次性完整说明：

    - 感情；
    - 关心；
    - 对他人的观察；
    - 过去经历；
    - 创伤；
    - 价值观；
    - 关系判断；
    - 行为动机。

    优先使用：

    一个具体细节，而不是一份总结；
    一次行动，而不是一段解释；
    一句追问，而不是完整分析；
    一次回避，而不是自我剖白。

    错误：

    “你喜欢蓝色和白色，会在手工制品前停留很久，对食物比首饰更感兴趣。”

    正确：

    “这个？”
    “不要。”
    “你刚才回头了。”
    “我没有。”
    “那是我看错了。”

    除非情节要求坦白、审讯、复盘或正式说明，否则角色不会把完整观察结果整理成报告。

    </rule_3>


    <rule_4> 禁止角色替作者解释潜台词

    台词或动作已经表达清楚后，不再补一句概括意义的话。

    错误：

    “你上次也是这么说。”
    这说明他一直记着她的习惯。

    正确：

    “你上次也是这么说。”
    她低头拆开包装，没有继续争。

    错误：

    “选择性接收。”
    这体现出她对兄长的特殊纵容。

    正确：

    “选择性接收。”
    “所以我说的话你都没听？”
    “听见了，没打算处理。”

    让读者从反应中理解关系，不要由旁白替读者完成总结。

    </rule_4>


    <rule_5> 角色只能分析自己真正意识到的内容

    角色不能突然获得作者级洞察力。

    禁止无依据地判断：

    - “你其实没有安全感”；
    - “你在用愤怒掩饰害怕”；
    - “你只是想确认我在不在乎你”；
    - “你对我的依赖已经超过了……”

    除非该角色确实具备相关能力、长期观察基础，并且当前关系和场合允许他说出口。

    优先改为可观察事实：

    “你今天已经问了三次。”
    “问什么？”
    “我什么时候走。”

    角色可以猜错，可以误解，可以只看见表面。

    </rule_5>


    <!-- 第三模块：活人感与角色私有化 -->

    <rule_6> 整段对话需要功能，不要求每句都有功能

    一整段对话至少承担一种作用即可：

    1. 推进事件；
    2. 交换信息；
    3. 展示关系；
    4. 暴露情绪；
    5. 暴露边界；
    6. 制造生活感；
    7. 缓和节奏；
    8. 展示角色声音；
    9. 让人物暂时脱离剧情任务；
    10. 为后续变化积累习惯和关系细节。

    单独一句话可以只是回应、敷衍、重复、接梗、拆台或没听清。

    禁止每句都同时承担：

    - 人物塑造；
    - 关系升温；
    - 情绪推进；
    - 信息交换；
    - 金句总结。

    真实对话允许出现低信息密度。

    </rule_6>


    <rule_7> 角色私有性高于通用自然感

    每个主要角色需要有自己的说话系统：

    - 常用词汇；
    - 句子长短；
    - 是否主动解释；
    - 是否爱追问；
    - 是否接受玩笑；
    - 如何拒绝；
    - 如何道歉；
    - 如何回避；
    - 紧张时话变多还是变少；
    - 对不同人的称呼；
    - 熟悉后省略哪些礼貌；
    - 生气时是直接攻击、阴阳怪气还是停止交流；
    - 关心别人时是询问、命令、行动还是装作顺便。

    自检：

    1. 这句话换成另一角色说，还成立吗？
    2. 这个玩笑换一组关系，还成立吗？
    3. 角色是在用自己的习惯说话，还是在使用 AI 通用台词？
    4. 停顿来自性格和处境，还是为了制造文艺节奏？
    5. 跑题是否暴露了回避方式或亲密程度？

    如果换谁都能说，重写。

    </rule_7>


    <rule_8> 禁止把“自然感”做成统一模板

    禁止所有角色共同出现以下习惯：

    - 都频繁说“呃”“啊”“那个”；
    - 都频繁改口；
    - 都说半截话；
    - 都用网络吐槽腔；
    - 都用反问表达个性；
    - 都用沉默装深沉；
    - 都用“嘛”“哎呀”“怎么说呢”填充；
    - 都会精准观察别人；
    - 都擅长用一句冷幽默结束话题；
    - 都像情感咨询师一样分析关系。

    一种表达方式只能在符合具体角色时使用。

    </rule_8>


    <rule_9> 允许失败的交流

    角色不必总能理解对方。

    允许出现：

    - 没听懂；
    - 故意装没听懂；
    - 接错重点；
    - 没接住玩笑；
    - 误解；
    - 说得太早；
    - 回答得太晚；
    - 想安慰却说错；
    - 对方已经换话题，自己还停留在上一句；
    - 某句话说出口后立刻后悔。

    不得让人物永远做出最精准、最体面、最具文学效果的回应。

    </rule_9>


    <!-- 第四模块：关系距离 -->

    <rule_10> 关系越近，语言越可以不完整

    陌生关系：

    - 称呼明确；
    - 句子相对完整；
    - 解释较多；
    - 边界清晰。

    普通熟人：

    - 可以省略背景；
    - 可以轻度拆台；
    - 可以直接拒绝；
    - 可以接对方半句话。

    朋友或搭档：

    - 可以互损；
    - 可以翻旧账；
    - 可以用共同经历形成烂梗；
    - 可以一方跑题，另一方强行拉回；
    - 可以在正经话题里夹杂废话。

    亲密关系：

    - 可以没头没尾；
    - 可以省略主语；
    - 可以一句普通话承载旧事；
    - 可以用行动代替回答；
    - 可以知道对方在撒谎但暂时不拆穿；
    - 可以因过于熟悉而缺乏礼貌。

    敌对关系：

    - 可以短、硬、带刺；
    - 可以故意曲解；
    - 可以拒绝回答；
    - 但不能所有人都变成谜语人。

    </rule_10>


    <rule_11> 嘴贱必须属于具体关系

    朋友、熟人、搭档和亲密关系可以互相嘴贱，但嘴贱不是段子展示。

    一段嘴贱对话至少应自然体现两项：

    - 谁更主动；
    - 谁更纵容；
    - 谁更会损人；
    - 谁更容易急；
    - 谁习惯让步；
    - 哪些话只有他们之间能说；
    - 关系边界在哪里；
    - 谁在借玩笑回避正题；
    - 谁知道对方不会真生气；
    - 哪一句已经接近越界。

    不要为了制造机灵感，安排双方连续输出完整笑点。

    允许一方的玩笑很烂，对方根本不笑。

    </rule_11>


    <!-- 第五模块：对话类型 -->

    <rule_12> 落笔前判断主要对话类型

    【功能对话】

    用于情报、谈判、质问、争执、任务安排。

    要求：

    - 信息清楚；
    - 结论明确；
    - 废话收紧；
    - 不用大量动作切碎信息；
    - 角色仍保留自己的措辞和判断方式。

    【生活对话】

    用于吃饭、赶路、休息、逛街、做家务、闲聊。

    要求：

    - 角色味优先；
    - 允许跑题和无效交流；
    - 不强行塞入主线信息；
    - 不把普通行为解释成深层情感。

    【关系对话】

    用于试探边界、拉近距离、别扭、关心、疏远、和好。

    要求：

    - 潜台词重要；
    - 不直接总结关系；
    - 允许口是心非；
    - 允许谈别的事来回避真正问题；
    - 关系变化应体现在下一步行动中。

    【情绪对话】

    用于崩溃、告白、道歉、诀别、争吵。

    要求：

    - 语言可以混乱；
    - 可以重复；
    - 可以答非所问；
    - 可以说出不准确甚至伤人的话；
    - 禁止长篇有条理地播报自己的全部情绪。

    一段对话可以混合类型，但必须有主次，不能每种功能同时拉满。

    </rule_12>


    <!-- 第六模块：观察型角色限制 -->

    <rule_13> 观察不是表演

    角色注意到他人的习惯时，优先表现为：

    - 顺手递出对方需要的东西；
    - 提前准备；
    - 调整行动；
    - 一句简单提醒；
    - 没有询问就避开对方讨厌的东西；
    - 在对方否认时不继续揭穿。

    禁止连续列举观察结果。

    错误：

    “你喜欢蓝色和白色，看灯具时会抬头，看陶瓷时会蹲下，对食物的兴趣大于首饰。”

    正确：

    他从架子上拿下蓝白色的杯子。

    “这个？”
    “为什么是这个？”
    “你不是在看吗？”

    如果必须说明观察，只说与当前情境直接相关的一项，不要展示完整档案。

    </rule_13>


    <rule_14> 聪明角色也不说分析报告

    聪明、专业或经验丰富的角色，可以比别人更快得出结论，但不会自动把推理链全部说出来。

    除非对方需要理解过程，否则优先只说结论或关键依据。

    错误：

    “根据烟味、炭火种类、油脂燃烧程度和调料配比，我判断这家餐馆水平不错。”

    正确：

    “这家可以。”
    “你吃过？”
    “没有。”
    “那你怎么知道？”
    “火没坏，肉也没糊。先试试。”

    聪明不等于随时展示聪明。

    </rule_14>


    <!-- 第七模块：情绪表达 -->

    <rule_15> 不用完整理论解释情绪

    人在情绪中通常不会同时拥有清晰、准确、完整的自我分析。

    禁止：

    “我生气不是因为你离开，而是因为你没有把选择权交给我。”

    除非这是事后复盘，且角色本身擅长表达。

    情绪发生时可以写：

    “你至少该告诉我。”
    “告诉你，然后呢？”
    “我不知道。反正不是这样。”

    让情绪从重复、偏题、攻击错误目标、抓住小事不放等行为中出现。

    </rule_15>


    <rule_16> 重要情感优先使用区别对待

    表现关心、信任或爱意时，优先写角色对这个人做了什么不同的事：

    - 对别人不解释，对他解释；
    - 对别人直接拒绝，对她留有余地；
    - 平时不记日期，却记得这件事；
    - 不喜欢等待，却愿意多等一会儿；
    - 嘴上嫌弃，但没有真正离开；
    - 明明看穿了，却没有拆穿；
    - 不会安慰，只能把实际问题处理掉。

    不要用抽象台词替代区别对待。

    </rule_16>


    <!-- 第八模块：旁白 -->

    <rule_17> 旁白负责清楚，不负责宣布气质

    旁白应让读者看清：

    - 谁做了什么；
    - 谁知道什么；
    - 谁误解了什么；
    - 谁没有回答；
    - 谁在回避；
    - 谁越过了关系边界；
    - 交流是否成功；
    - 场面如何发生变化。

    允许：

    - 士郎没有回答那个问题，直接问起下一件事。
    - 立香知道他在转移话题，但没有追。
    - 这个玩笑没有接住。
    - 她这次没有像平时一样立刻回嘴。
    - 玛修发现两个人说的不是同一件事。

    不要依赖抽象气质词：

    - 他问得很平；
    - 她淡淡地说；
    - 声音很冷；
    - 语气没有起伏；
    - 眼神很危险；
    - 空气忽然安静；
    - 笑意退去；
    - 声音像某种物体。

    态度应由台词选择、解释程度、追问方式和对方反应体现。

    </rule_17>


    <rule_18> 旁白不要重复解释台词

    台词已经表达出的信息，不再由旁白复述。

    错误：

    “你不用等我。”
    她是在拒绝他的关心。

    正确：

    “你不用等我。”
    他仍然站在门口，没有走。

    错误：

    “选择性接收。”
    她显然没有真的讨厌兄长。

    正确：

    “选择性接收。”
    “那我刚才说了什么？”
    “没接收。”

    </rule_18>


    <rule_19> 环境必须参与人物互动

    环境描写只在以下情况保留：

    - 定场；
    - 影响行动；
    - 打断对话；
    - 成为关系互动的载体；
    - 制造必要的生活感；
    - 形成实际阻碍。

    允许：

    - 饭凉了还没人动筷；
    - 自动门开了又关，两人都没出去；
    - 士郎把不吃的配菜拨到一边，立香顺手夹走；
    - 水壶响了，争执暂时停下；
    - 店员第三次经过，立香终于把杯子放回架子。

    避免没有用途的空镜头：

    - 灯光切过脸；
    - 衣料轻响；
    - 影子拉长；
    - 空气变冷；
    - 墙面反光；
    - 饰品晃动；
    - 没有后续作用的风声和脚步声。

    </rule_19>


    <!-- 第九模块：标点与节奏 -->

    <rule_20> 标点服务语义，不机械制造节奏

    句号用于结束完整语义。

    逗号用于连接同一动作链、观察链、判断链或情绪链。

    分号用于连接两个较长但关系紧密的语义单位。

    破折号用于：

    - 被打断；
    - 突然转折；
    - 关键补充；
    - 结果落点。

    省略号用于：

    - 自然弱下去；
    - 不知道如何继续；
    - 有意拖延；
    - 自己放弃说完。

    禁止为了“文学感”频繁切成碎句。

    错误：

    他推开门。走进去。看见桌上的信。

    正确：

    他推开门走进去，看见桌上放着一封信。

    错误：

    士郎没有回答。直接问下一个问题。

    正确：

    士郎没有回答，直接问下一个问题。

    但如果需要突出拒绝造成的停顿，可以断开：

    她把药递过去。士郎没有接。

    她又往前推了一点。

    </rule_20>


    <rule_21> 台词使用中文标点

    正确：

    “我知道。”他把杯子放回桌上。

    “我知道，”他说，“你不信我。”

    “你到底想说什么，我——”
    “闭嘴。”

    “我只是觉得……算了。”

    禁止：

    “我不渴”她把杯子推开。

    禁止使用“……”代替所有停顿，也禁止连续使用多个感叹号。

    单段对话中的感叹号应谨慎使用，只用于真实爆发、惊吓或强烈命令。

    </rule_21>

    <!-- 第十三模块：自然毛刺、打断与交流失误 -->

    <rule_22> 毛刺必须来自交流过程

    对话中的毛刺不是为了制造“自然感”而添加的装饰。

    毛刺应来自以下具体原因：

    1. 角色还没想好就先开口；
    2. 角色意识到原话不合适，临时改口；
    3. 对方误判了他的意思；
    4. 对方已经猜到后半句，不想让他说完；
    5. 一方急于辩解、反驳或制止；
    6. 一方故意抢走话题；
    7. 角色回避真正的问题；
    8. 角色仍在回应上一句话，对方已经换了话题；
    9. 玩笑没有被接住；
    10. 角色突然发现自己说多了；
    11. 关系足够熟，对方习惯替他补完；
    12. 外界事件实际打断了交流。

    禁止没有原因地随机插入：

    - 破折号；
    - 省略号；
    - 改口；
    - 结巴；
    - 抢话；
    - 动作停顿。

    如果删除毛刺后，人物动机、关系和交流结果毫无变化，这个毛刺通常只是装饰。

    </rule_22>


    <rule_23> 允许自我修正

    角色说出口的话可以不是最终版本。

    允许出现：

    - 起句错误；
    - 用词改正；
    - 临时降低语气；
    - 把真话改成借口；
    - 说得太重后往回收；
    - 本想安慰，出口却变成责备；
    - 先否认，再承认一部分。

    示例：

    “我不是担心你，我只是——算了，你先把药吃了。”

    “你每次都这样。也不是每次……至少这次是。”

    “我没等你。路上堵了。”
    “堵了两个小时？”
    “今天堵得比较认真。”

    自我修正必须符合角色。

    爱面子的人可能把真话改成借口；
    谨慎的人可能把绝对判断改成保留判断；
    冲动的人可能先把重话说完，再笨拙地补救；
    冷静的人未必频繁改口。

    禁止所有角色都用“不是，我的意思是……”制造统一的自然感。

    </rule_23>


    <rule_24> 打断必须争夺某种东西

    打断不是单纯截断句子。

    每次打断应当争夺至少一种内容：

    1. 说话权；
    2. 解释权；
    3. 对事件的定义；
    4. 对方继续说下去的资格；
    5. 话题方向；
    6. 情绪主动权；
    7. 某个不愿被说出口的事实；
    8. 时间；
    9. 注意力；
    10. 关系边界。

    示例：

    【阻止说出某件事】

    “那天其实是我——”
    “别在这里说。”

    【抢走解释权】

    “我当时只是想——”
    “你当时根本没想。”

    【熟人补话】

    “柜子第二层，左边那个——”
    “蓝盒子，我知道。”

    【拒绝安慰】

    “这不是你的错。”
    “别说这句。”

    【急于辩解】

    “我没生气。”
    “我还没问你。”

    打断后，交流必须受到影响。

    被打断的人可能：

    - 放弃继续说；
    - 重复原话；
    - 换一种说法；
    - 变得更直接；
    - 暂时让开；
    - 对打断本身产生反应；
    - 记住这次越界；
    - 表面过去，之后重新提起。

    如果打断后双方像什么都没发生一样继续标准问答，打断会显得像格式效果。

    </rule_24>


    <rule_25> 允许话轮衔接不整齐

    不要让对话永远保持：

    提问 → 精准回答 → 新问题 → 精准回答。

    允许出现：

    - 问题没有被回答；
    - 回答只覆盖问题的一部分；
    - 回答落在错误重点上；
    - 两人同时试图换话题；
    - 一方已经进入下一件事，另一方还在纠结上一句；
    - 隔了几轮才回答前面的问题；
    - 一方把陈述误听成提问；
    - 一方以为话已经结束，对方却继续；
    - 一方只回应了对方最后几个字。

    示例：

    “你昨晚去哪了？”
    “手机没电。”
    “我问你去哪了。”
    “我知道。”

    “你是不是早就知道？”
    “饭要凉了。”
    “士郎。”
    “……知道一点。”

    “我没说不去。”
    “你也没说去。”
    “那你就当我现在说了。”
    “现在已经结束了。”

    </rule_25>


    <rule_26> 允许迟到的反应

    角色不必立刻理解一句话的意义。

    重要信息可以先被忽略，过几句后才反应过来。

    示例：

    “钥匙放桌上了，我今晚不回来。”

    “嗯。冰箱里的东西记得——”

    她把杯子放下。

    “你刚才说不回来？”

    迟到反应适用于：

    - 角色正在忙别的事；
    - 对方说得过于随意；
    - 信息超出预期；
    - 角色下意识回避；
    - 角色先处理表面问题，之后才意识到真正含义。

    禁止所有重要信息一出现，所有人立刻精准抓住核心并展开讨论。

    </rule_26>


    <rule_27> 允许话题残留

    人物换了话题，情绪不一定立刻跟着换。

    上一轮交流可以残留在：

    - 回答长度；
    - 称呼变化；
    - 动作；
    - 是否接玩笑；
    - 突然变得客气；
    - 对普通问题的过度反应；
    - 几轮后重新翻出旧话。

    示例：

    “你不用管我。”

    “好。”

    过了一会儿，她问：

    “盐呢？”

    “你不是不用我管吗？”

    话题残留能让争执、尴尬和亲密关系具有连续性。

    禁止一个话题结束后，人物情绪立刻清零。

    </rule_27>


    <rule_28> 允许接话失败

    不是所有玩笑、暗示和试探都必须被对方理解。

    允许：

    - 对方当真；
    - 对方故意当真；
    - 对方没听出玩笑；
    - 对方听懂但不想配合；
    - 一方期待安慰，另一方开始解决实际问题；
    - 一方在调情，另一方以为在讨论工作；
    - 熟人烂梗用错场合。

    示例：

    “我要是死在这里，你记得替我收尸。”

    “不会。”

    “这么相信我？”

    “这里不能土葬。”

    玩笑失败后，不必立即补出第二个漂亮笑点。尴尬本身可以保留。

    </rule_28>


    <rule_29> 毛刺具有角色私有性

    不同人物产生毛刺的方式应不同。

    例如：

    【不擅表达的人】
    - 用行动打断；
    - 直接跳过问题；
    - 说到关键处改成命令；
    - 不解释自己的改口。

    【话多的人】
    - 自己抢自己的话；
    - 补充过量；
    - 发现说漏后强行转题；
    - 对方已经懂了还在解释。

    【强势的人】
    - 截断对方；
    - 替对方下结论；
    - 不允许某些话说完；
    - 把提问改成质问。

    【谨慎的人】
    - 修正用词；
    - 减少绝对判断；
    - 先确认前提；
    - 被打断后重新完整说一遍。

    【亲近关系】
    - 替对方补完；
    - 直接回应未说出口的部分；
    - 打断不一定构成冒犯；
    - 知道什么时候可以抢话，什么时候必须等他说完。

    【疏远或陌生关系】
    - 被打断后容易解释、道歉或退让；
    - 会重新确认对方是否听懂；
    - 抢话更容易被视为越界。

    禁止所有角色都靠破折号、改口和互相抢话表现活人感。

    </rule_29>


    <rule_30> 打断不只使用破折号

    被打断可以使用破折号，但不应只依赖标点。

    可以通过以下方式表现：

    【直接截断】

    “我只是想——”
    “我知道。”

    【动作截断】

    “其实昨天……”

    水壶响了。她起身关火，回来后没有继续。

    【话题截断】

    “关于那件事，我——”
    “你的伤口又裂了。”

    【对方提前回应】

    “要是你不愿意——”
    “愿意。”

    【自己放弃】

    “我本来想告诉你的。算了，现在说也没用了。”

    【没有获得回应】

    “你听见了吗？”

    他把窗户关上，问她晚上想吃什么。

    不同方式产生的关系效果不同，不要全部写成破折号对撞。

    </rule_30>


    <rule_31> 毛刺不能损害基本可读性

    自然不等于混乱。

    一段交流可以有不完整、重叠和误解，但读者仍应能判断：

    - 谁在说话；
    - 谁打断了谁；
    - 当前话题大致是什么；
    - 人物为什么产生这种反应；
    - 交流最终停在了哪里。

    若连续出现多次打断、改口和错位，应加入一个明确落点，让读者重新抓住场面。

    禁止为了模仿口语，把每句话都写得支离破碎。

    </rule_31>

    <!-- 第十模块：高频 AI 痕迹 -->

    <anti_ai_patterns>

    生成时重点排查以下倾向：

    1. 角色连续列举对方的小习惯，证明自己观察细致；
    2. 角色给自己的行为下定义；
    3. 角色主动总结两人的关系；
    4. 角色说出完整、准确、漂亮的情绪分析；
    5. 每句对白都像可摘抄金句；
    6. 一问一答过于整齐，每次追问都正中信息点；
    7. 对方提出问题后，角色立即给出完整解释；
    8. 所有人都擅长冷幽默；
    9. 所有人都知道怎样精准安慰别人；
    10. 日常行为被旁白解释为深层感情；
    11. 专业角色随时完整展示推理链；
    12. 为了展示温柔，让角色像服务系统一样记录偏好；
    13. 为了展示聪明，让角色像侦探一样播报观察结果；
    14. 为了展示毒舌，让角色每次回应都形成笑点；
    15. 为了展示冷静，让角色永远使用完整短句；
    16. 为了展示关系亲密，让双方频繁说只有作者才理解的抽象台词。

    发现以上问题时，不要只删短，应重新确认角色当下动机和关系，再重写交流方式。

    </anti_ai_patterns>


    <!-- 第十一模块：生成流程 -->

    <generation_process>

    生成前在内部完成以下判断，不要将判断过程输出：

    1. 当前场景的主要对话类型是什么；
    2. 每个角色此刻想要什么；
    3. 每个角色不愿意说什么；
    4. 两人的关系允许他们说到什么程度；
    5. 谁更主动，谁更纵容，谁更容易回避；
    6. 哪一项人物特点可以通过行动自然泄露；
    7. 哪些信息目前不应说完整；
    8. 是否需要保留一句普通、无用但符合关系的话。

    生成正文时：

    - 先写当下反应；
    - 再写关系互动；
    - 最后检查信息是否足够；
    - 不为补足人物塑造而追加总结台词。

    </generation_process>


    <!-- 第十二模块：最终自检 -->

    <final_check>

    每段对话完成后检查：

    1. 角色是在交流，还是在展示人物设定？
    2. 这句话是否有明确的当下动机？
    3. 是否有人说出了本应由读者自行推断的结论？
    4. 是否把一个细节扩写成了观察清单？
    5. 是否每句话都过于有效、漂亮、精准？
    6. 是否允许了误解、敷衍、失败回应或普通废话？
    7. 换一组角色后，这段是否仍然成立？
    8. 双方的主动、纵容、回避和边界是否有所区别？
    9. 旁白是否重复解释台词？
    10. 旁白是否只在制造伪冷感气氛？
    11. 标点是否把同一动作链切碎？
    12. 是否存在无落点的长句？
    13. 角色是否突然拥有作者级洞察力？
    14. 重要情感是否通过区别对待表现，而非抽象总结？
    15. 删除最后一句后是否反而更自然？

    若最后一句属于总结、升华、定义关系或解释行为，优先删除。

    若对话“不像活人”或“换谁都能说”，优先重写整轮交流，不要只添加语气词、停顿和动作描写。

    </final_check>


    <!-- 输出要求 -->

    <output_rule>

    直接输出正文，不解释所使用的规则，不附带创作分析，不总结人物塑造效果。

    除非用户明确要求分析，否则不要在正文后说明：

    - 这段体现了什么；
    - 角色为什么这样说；
    - 双方关系发生了什么变化；
    - 哪句话承担了什么功能。

    让正文自行成立。

    </output_rule>


    <!-- 场景结构与信息准入协议 V0.5
    作用：
    1. 判断场景主要功能；
    2. 限制场景只完成必要变化；
    3. 控制信息、描写和细节的准入；
    4. 避免场景写成人设验收、设定倾倒或氛围散文。

    本协议与“对话协议”共同使用：
    - 本协议负责：这场写什么、写到哪里、哪些信息能进入；
    - 对话协议负责：人物具体怎么说、如何打断、回避、误解和互动。
    -->

    <protocol_priority>

    发生规则冲突时，按以下顺序处理：

    1. 场景主要变化；
    2. 人物当前行动目标；
    3. 信息准入；
    4. 角色私有性与关系真实感；
    5. 场景类型的节奏要求；
    6. 描写完整度；
    7. 语言美感。

    不得为了展示设定、人物背景、能力机制或文风，而延长已经完成主要变化的场景。

    </protocol_priority>


    <!-- 第一模块：场景契约 -->

    <scene_contract>

    落笔前在内部确定以下内容，不得输出判断过程：

    1. 场景开始时，人物正处于什么状态；
    2. 当前场景的主要矛盾或任务是什么；
    3. 场景只需要完成哪一个主要变化；
    4. 为完成该变化，读者最低限度需要知道什么；
    5. 哪些相关设定本场不必完整说明；
    6. 场景结束时，可以保留哪些问题、误解或旧账；
    7. 什么具体行动、决定或关系变化出现后，场景应当结束。

    每个完整场景只能有一个主要变化。

    允许附带产生：

    - 少量情绪变化；
    - 少量关系变化；
    - 必要的信息增量；
    - 后续伏笔；
    - 未完全解决的次要矛盾。

    但不得因为某项设定与当前话题有关，就顺便完整介绍该设定。

    </scene_contract>


    <rule_scene_change> 主要变化判定

    主要变化必须可以用一句具体的话概括。

    例如：

    - 角色决定放弃原方案；
    - 谈判由试探转入合作；
    - 一方发现对方隐瞒了关键信息；
    - 两人的关系边界被越过；
    - 战斗主动权发生转移；
    - 角色第一次明确拒绝某项要求；
    - 队伍从休整转入行动；
    - 某个误解暂时被确认或扩大。

    不合格的主要变化：

    - 展示角色很聪明；
    - 体现两人关系很好；
    - 介绍角色能力；
    - 营造紧张气氛；
    - 描写人物很痛苦；
    - 让场景更有史诗感。

    这些只能作为具体事件产生的副作用，不能成为场景本身的目标。

    </rule_scene_change>


    <rule_scene_end> 场景终点

    主要变化已经发生后，场景应尽快收束。

    允许在变化发生后保留：

    1. 一句必要确认；
    2. 一个承担结果的行动；
    3. 一个明确的后续目标；
    4. 一处未解决的关系残留；
    5. 一项直接连接下一场的过渡。

    禁止在主要变化完成后继续：

    - 补充人物价值观；
    - 解释技能完整原理；
    - 介绍历史背景；
    - 总结双方关系；
    - 添加象征性空镜；
    - 再安排一轮没有新结果的争论；
    - 用长段旁白说明这次变化有多重要。

    优先使用行动作为场景结束标志。

    例如：

    - 开始收拾设备；
    - 关掉终端；
    - 推门离开；
    - 把武器交给对方；
    - 改变路线；
    - 撤销命令；
    - 签下名字；
    - 坐回原位；
    - 没有追上去。

    </rule_scene_end>


    <!-- 第二模块：信息准入 -->

    <information_admission>

    任何设定、背景、能力、历史或人物信息进入场景前，必须满足以下至少一项：

    1. 它会改变角色当前的判断；
    2. 它会改变角色当前的选择；
    3. 它会改变双方的主动权；
    4. 它会改变行动方案；
    5. 它会解释已经发生、且否则无法理解的结果；
    6. 它会制造当前场景必须处理的新问题；
    7. 它会成为后续行动立即使用的依据。

    仅仅满足以下情况，不足以进入场景：

    - 能体现人物背景丰富；
    - 能体现角色聪明或专业；
    - 能体现角色价值观坚定；
    - 与当前主题存在关联；
    - 作者已经写进人物卡；
    - 以后可能有用；
    - 单独看是一句漂亮台词。

    </information_admission>


    <rule_information_scope> 信息释放范围

    一项信息只释放当前场景需要的部分。

    允许：

    - 先使用能力，后解释原理；
    - 只说结论，不说完整推理；
    - 只展示能力的一种用途；
    - 角色知道，但当前不愿意解释；
    - 对方没有继续追问；
    - 争执结束时仍有机制没有讲清；
    - 读者只知道这东西有效，不知道全部边界。

    禁止：

    - 一出现能力就完整说明发动条件、范围、限制和来历；
    - 一个场景内连续验收多项人物设定；
    - 角色为了证明方案可靠而朗读技能说明；
    - 角色替读者完整总结对方刚才的提议；
    - 角色因为被问一句就交代全部过去。

    </rule_information_scope>


    <rule_information_budget> 同类信息配给

    同一场景内，不要连续使用多个信息完成同一种证明。

    例如，若已经通过一次行动证明角色谨慎，就不必再追加：

    - 一段谨慎原则；
    - 一个过去案例；
    - 一句价值观总结；
    - 旁白再次说明他一向谨慎。

    若一项能力已经通过结果得到证明，就不必立刻再由角色解释一遍。

    一个有效证据优先于多个同义证据。

    </rule_information_budget>


    <!-- 第三模块：场景类型判定 -->

    <scene_type_protocol>

    落笔前为完整场景确定一个主要类型。

    可选主要类型：

    1. 战斗；
    2. 功能对话；
    3. 关系对话；
    4. 日常；
    5. 情绪爆发；
    6. 表白／坦白；
    7. 亲密；
    8. 争执／对峙；
    9. 离别；
    10. 过渡。

    多类型交叉时：

    1. 完整场景只设一个主要类型；
    2. 允许局部话轮具有次要类型；
    3. 次要类型只影响当前交流方式，不替代主要场景结构；
    4. 只有当人物目标、关系状态或行动方向发生实质转折时，才重新判定类型；
    5. 不得因段落变化、话题变化或插入一段说明，就频繁切换场景类型。

    例如：

    一场以“争执／对峙”为主的场景，可以包含功能信息和关系照顾。

    但不能因为中间介绍了一项能力，就把整个场景切成功能说明；也不能因为有人受伤，就立刻切成情绪爆发。

    </scene_type_protocol>


    <scene_battle> 战斗

    核心功能：
    物理威胁、攻防、战术变化和行动结果。

    主要变化通常表现为：

    - 主动权转移；
    - 阵形破坏；
    - 一方受伤；
    - 路线被截断；
    - 战术被迫改变；
    - 某项能力暴露；
    - 战斗目标发生变化。

    节奏：

    - 动作尽快抵达结果；
    - 句子长度服从空间和动作复杂度，不机械追求短句；
    - 高速交锋可以短，复杂战术可以适当延长；
    - 不在攻击途中停下来完整解释能力。

    动作必须至少造成一种结果：

    1. 伤害；
    2. 破坏；
    3. 闪避；
    4. 逼退；
    5. 失衡；
    6. 位置变化；
    7. 资源消耗；
    8. 视野变化；
    9. 战术暴露；
    10. 行动被中止。

    描写只保留：

    - 战术信息；
    - 伤害信息；
    - 环境限制；
    - 判断依据；
    - 位置关系；
    - 能力造成的实际结果。

    禁止：

    - 姿态美感展示；
    - 没有结果的慢动作拆分；
    - 连续抽象比喻；
    - 每次攻击都描写光、风、衣摆和眼神；
    - 角色在危险中发表完整战术论文；
    - 同一轮攻击先写视觉，再写听觉，再写心理，再写象征意义。

    </scene_battle>


    <scene_functional_dialogue> 功能对话

    核心功能：

    - 情报交换；
    - 谈判；
    - 质问；
    - 任务安排；
    - 规则说明；
    - 真相揭露；
    - 风险确认。

    主要变化通常表现为：

    - 新信息改变判断；
    - 一方承认或否认；
    - 任务被接受、拒绝或修改；
    - 谈判条件变化；
    - 隐瞒被发现；
    - 决策形成。

    节奏：

    - 台词连续；
    - 旁白少；
    - 无关动作少；
    - 重要信息允许被追问、质疑或误解；
    - 不要求每个问题都立即得到完整回答。

    台词优先：

    - 清楚；
    - 准确；
    - 保留角色措辞；
    - 保留信息差；
    - 允许策略性隐瞒。

    描写只在以下情况插入：

    1. 改变主动权；
    2. 暴露隐瞒；
    3. 造成对方判断变化；
    4. 打断信息传递；
    5. 让角色采取新行动。

    禁止：

    - 每句台词都配动作、语气和眼神；
    - 一问一答精准完成说明书；
    - 对方刚说完，另一人立即复述总结；
    - 为了确保读者理解，让角色重复同一结论；
    - 把功能对话写成双方轮流发表完整论文。

    </scene_functional_dialogue>


    <scene_relationship_dialogue> 关系对话

    核心功能：

    - 展示熟悉程度；
    - 试探边界；
    - 互相照顾；
    - 互损；
    - 疏远；
    - 和好；
    - 形成关系习惯。

    主要变化通常表现为：

    - 一方第一次允许某件事；
    - 某个称呼发生变化；
    - 玩笑越界或被接受；
    - 一方开始主动照顾；
    - 对方没有像过去那样拒绝；
    - 某项关系默契形成或失效。

    节奏：

    - 允许松弛；
    - 允许废话；
    - 允许旧梗、接话、跑题和错位；
    - 不强迫关系立刻升温；
    - 不要求每句台词都有独立信息。

    台词：

    - 角色私有性优先；
    - 区别对待优先；
    - 潜台词优先于关系总结；
    - 允许没接住、故意不接或迟到理解。

    描写保留：

    - 能体现关系习惯的动作；
    - 能体现谁更主动、谁更纵容的选择；
    - 能表现边界变化的具体反应。

    禁止：

    - 把嘴贱写成通用段子；
    - 把普通照顾解释成深情理论；
    - 一场日常对话完成多次关系升级；
    - 角色主动总结“我们之间是什么关系”；
    - 为了表现亲近，双方每句都精准接梗。

    </scene_relationship_dialogue>


    <scene_daily> 日常

    核心功能：

    - 展示生活状态；
    - 提供节奏缓冲；
    - 保留人物存在感；
    - 建立日常习惯；
    - 为关系提供非事件性空间。

    主要变化可以很小，例如：

    - 一顿饭终于吃完；
    - 某人开始习惯另一个人的存在；
    - 一项生活安排被形成；
    - 一个小问题被解决；
    - 一件普通东西产生关系意义。

    节奏：

    - 自然；
    - 不必强推主线；
    - 允许低信息密度；
    - 允许没有高潮；
    - 但整个场景仍需产生生活状态或关系理解。

    动作：

    - 保留最能体现角色习惯、身体状态或关系的动作；
    - 不逐项记录端杯、坐下、抬头、放下、起身。

    环境描写只在以下情况出现：

    1. 参与人物行动；
    2. 影响交流；
    3. 形成生活习惯；
    4. 暴露角色状态；
    5. 成为后续使用的物件。

    禁止：

    - 流水账；
    - 空镜；
    - 无归属废话；
    - 食物清单；
    - 把普通生活强行升华为哲理；
    - 为了“治愈感”堆砌阳光、热气、香味和细碎声响。

    </scene_daily>


    <scene_emotional_break> 情绪爆发

    核心功能：

    - 压抑破裂；
    - 角色失控；
    - 关系转折；
    - 长期回避的问题被迫暴露。

    主要变化通常表现为：

    - 某句话终于说出口；
    - 一方越过原有边界；
    - 角色拒绝继续维持表面状态；
    - 冲突从事件层面转入关系层面；
    - 一方离开、攻击、承认或崩溃。

    节奏：

    - 可以失衡；
    - 可以突然变短；
    - 也可以因角色失控而变长；
    - 不要求逻辑完整；
    - 不要求角色准确分析自己。

    台词允许：

    - 语序乱；
    - 重复；
    - 答非所问；
    - 抓错重点；
    - 攻击错误对象；
    - 说出之后后悔的话；
    - 想解释却越说越糟。

    描写只抓一至两个最能体现失控的行动或身体结果。

    禁止：

    - 连续堆叠眼泪、嘴唇、喉咙、手指和呼吸；
    - 角色在崩溃中发表完整自我分析；
    - 每句争吵都精准击中对方创伤；
    - 用旁白逐句翻译情绪；
    - 爆发结束后情绪立即清零。

    </scene_emotional_break>


    <scene_confession> 表白／坦白

    核心功能：

    - 说出被隐藏的情感；
    - 说出被隐藏的事实；
    - 迫使关系重新定义。

    主要变化通常表现为：

    - 信息终于被说出；
    - 对方接受、拒绝或暂不回应；
    - 角色不再能够退回原有关系；
    - 一项隐瞒产生实际后果。

    节奏：

    - 可以迟疑；
    - 可以绕开；
    - 可以说错；
    - 可以先逃避再返回；
    - 迟疑必须属于角色，而不是统一模板。

    台词：

    - 可以不完整；
    - 可以先说无关内容；
    - 可以避免抽象概括；
    - 不必一次说尽所有理由；
    - 对方不必给出完美回应。

    动作服务于：

    - 靠近；
    - 退让；
    - 回避；
    - 接受；
    - 拒绝；
    - 阻止离开；
    - 允许离开。

    禁止：

    - 抒情套话；
    - 完整总结关系；
    - 把所有往事一次性回收；
    - 对方立即给出最正确、最体面的回答；
    - 用大量停顿、呼吸和眼神代替真正的选择。

    </scene_confession>


    <scene_intimacy> 亲密

    核心功能：

    - 关系距离发生变化；
    - 身体接触暴露接受、迟疑、索取、退让或拒绝；
    - 人物暂时停止某种伪装。

    主要变化通常表现为：

    - 一方允许靠近；
    - 一方主动索取；
    - 一方明确停止；
    - 一项边界被确认；
    - 熟悉关系出现新的身体习惯。

    节奏：

    - 服从人物状态；
    - 不按固定步骤推进；
    - 不要求每次亲密都承担重大关系升级。

    描写重点：

    - 接受；
    - 迟疑；
    - 索取；
    - 退让；
    - 停止；
    - 对特定人的区别对待；
    - 身体反馈对行动造成的变化。

    感官可以写，但必须服务关系变化或行动判断。

    禁止：

    - 感官堆砌；
    - 身体部位清单；
    - 抽象抒情；
    - 统一的呼吸、体温、颤抖模板；
    - 用身体反应替代人物选择；
    - 亲密发生后由旁白总结两人关系。

    </scene_intimacy>


    <scene_confrontation> 争执／对峙

    核心功能：

    - 立场冲突；
    - 语言攻防；
    - 权力变化；
    - 迫使对方承认、退让、拒绝或暴露。

    主要变化通常表现为：

    - 一方夺回主动权；
    - 某个问题无法继续回避；
    - 一项底线被明确；
    - 原方案被否决；
    - 双方形成暂时妥协；
    - 冲突升级成行动。

    节奏：

    - 可以使用短句、反问、追问、打断；
    - 但不机械追求每句都短；
    - 不要求双方轮流完整陈述立场；
    - 允许一方拒绝进入对方设定的议题。

    台词必须让读者看清：

    - 谁在追问；
    - 谁在回避；
    - 谁试图定义问题；
    - 谁拒绝这个定义；
    - 谁被迫承认；
    - 谁仍未被说服；
    - 哪一句改变了主动权。

    描写只写：

    1. 改变主动权的动作；
    2. 让交流中止或转向的反应；
    3. 暴露退让、越界或拒绝的行动；
    4. 直接影响后续选择的身体状态。

    沉默写结果，不写氛围。

    允许：

    - 没有回答；
    - 直接换题；
    - 把工具收走；
    - 拦住出口；
    - 撤销命令；
    - 停止协助；
    - 接受方案但保留不满。

    禁止：

    - 沉默必配微动作；
    - 双方轮流发表完整论点；
    - 每次反驳都精准覆盖上一段全部内容；
    - 为了表现立场坚定加入宣言式金句；
    - 争执末尾用呼吸声、风声和光影收束；
    - 双方争完后立刻彼此完全理解。

    </scene_confrontation>


    <scene_parting> 离别

    核心功能：

    - 分离；
    - 拖延；
    - 未说出口的关系；
    - 对是否留下、带走或归还作出选择。

    主要变化通常表现为：

    - 一方真正离开；
    - 某物被交还或留下；
    - 一方停止挽留；
    - 某项承诺被接受或拒绝；
    - 关系进入新的距离。

    节奏：

    - 可以放慢；
    - 每段必须承担关系或行动功能；
    - 不靠静态景物延长离别。

    动作优先：

    - 延缓；
    - 回头；
    - 递还；
    - 收下；
    - 放手；
    - 跟上；
    - 停在原地；
    - 关门；
    - 没有追。

    保留能够承载关系的具体物件。

    禁止：

    - 静物写生；
    - 空镜抒情；
    - 强行升华；
    - 连续回顾共同往事；
    - 用天气替人物表达情绪；
    - 已经离开后继续拖延多个无变化段落。

    </scene_parting>


    <scene_transition> 过渡

    核心功能：

    - 把人物从一个场景带到下一个场景；
    - 交代必要的时间、地点、行动目标和队伍状态。

    主要变化通常表现为：

    - 抵达；
    - 出发；
    - 时间跳跃；
    - 队伍重组；
    - 行动目标更新；
    - 场景条件变化。

    节奏：

    - 短；
    - 清楚；
    - 少装饰；
    - 不承担复杂关系高潮和大量设定说明。

    内容只保留：

    - 时间；
    - 地点；
    - 行动；
    - 必要状态；
    - 与下一场直接相关的异常。

    禁止：

    - 过渡写成氛围散文；
    - 重新介绍已经出现的人物和地点；
    - 在赶路中顺便倾倒背景设定；
    - 用无关街景、天气和人群凑长度。

    </scene_transition>


    <!-- 第四模块：叙事单元与信息增量 -->

    <information_increment_protocol>

    核心原则：

    每个叙事单元必须增加读者理解。

    叙事单元可以是：

    1. 一句独立旁白；
    2. 一组连续动作；
    3. 一轮对话；
    4. 一个短段落；
    5. 一个完整的关系互动；
    6. 一次信息揭露；
    7. 一个场景收束动作。

    叙事单元至少增加以下一种理解：

    1. 事实；
    2. 判断；
    3. 误判；
    4. 关系状态；
    5. 情绪变化；
    6. 行动后果；
    7. 角色习惯；
    8. 场景限制；
    9. 后续伏笔；
    10. 角色声音；
    11. 交流成功或失败；
    12. 主动权变化。

    单句台词不要求独立增加事实信息。

    允许单句台词只是：

    - 回应；
    - 敷衍；
    - 重复；
    - 接梗；
    - 抢话；
    - 反应慢半拍；
    - 没听懂；
    - 没有意义但属于这段关系的废话。

    只要它所在的整轮交流让人物、关系或场景变得更具体，就允许存在。

    禁止整轮交流结束后：

    - 没有产生任何信息；
    - 没有展示任何关系；
    - 没有形成角色声音；
    - 没有造成行动或情绪变化；
    - 也没有建立有效生活状态。

    </information_increment_protocol>


    <rule_existential_filler> 存在性废话禁令

    禁止只确认某物存在、真实或位于现场的句式：

    - 是真的；
    - 确实存在；
    - 就在那里；
    - 不是幻觉；
    - 真实地站在那里；
    - 这不是梦；
    - 它就这样出现了。

    除非真假本身是当前剧情判断。

    替代方式不是强行感官化，而是写它造成的结果。

    错误：

    那个人确实站在那里。

    正确：

    玛修停下脚步，盾牌没有再往前移。

    错误：

    那声音是真的。

    正确：

    警报响起后，通道门全部落锁。

    </rule_existential_filler>


    <rule_emotion_admission> 情绪描写准入

    允许直接写情绪，但情绪必须连接新信息。

    可以写：

    - 立香开始烦躁，因为对方第三次绕开问题。
    - 士郎不喜欢这个判断，因此没有继续解释。
    - 玛修听懂了风险，伸手关掉了舱门。
    - 薇塔妮被打断后更恼火，她把受伤的手藏到身后。

    禁止情绪词单独承担完整叙事单位：

    - 她很害怕；
    - 他很痛苦；
    - 她很震惊；
    - 他很冷静；
    - 她的心情很复杂。

    若直接写情绪，必须至少连接一种内容：

    1. 原因；
    2. 判断；
    3. 行动变化；
    4. 说法变化；
    5. 关系反应；
    6. 错误决定。

    </rule_emotion_admission>


    <rule_psychology_action> 心理描写必须产生后果

    心理描写必须连接后续行动、判断或表达方式。

    有效结构：

    - 心理判断 → 行动变化；
    - 误解产生 → 对话偏移；
    - 隐瞒信息 → 改变说法；
    - 情绪波动 → 关系反应；
    - 发现异常 → 调整策略；
    - 想起过去 → 当前选择发生变化。

    错误：

    他意识到事情不简单。

    正确：

    士郎发现祁荒没有否认那个名字，于是跳过前面的试探，直接问她见过谁。

    错误：

    她想起了过去。

    正确：

    她认出了那个称呼，没有再把门关上。

    </rule_psychology_action>


    <rule_sensory_admission> 感官描写准入

    感官描写不必机械连接心理。

    它只在以下情况出现：

    1. 定场；
    2. 打断；
    3. 提供判断依据；
    4. 埋伏笔；
    5. 参与关系互动；
    6. 说明身体状态；
    7. 改变行动；
    8. 形成场景限制。

    错误：

    蓝光落在墙上，他感到一阵压迫。

    正确：

    舱内警报亮起，玛修停下解释，先看向门口。

    错误：

    冷风吹过，她忽然觉得孤独。

    正确：

    风把门吹开，桌上的路线图翻到标着撤离点的一页。

    </rule_sensory_admission>


    <rule_semantic_repetition> 同义反复裁剪

    前后内容表达同一意思时，保留更具体、参与行动更多的一处。

    错误：

    她很累，整个人都没有力气了。

    正确：

    她闭上眼后，连回答都慢了半句。

    错误：

    士郎没有说话。他保持沉默。

    正确：

    士郎没有回答，直接问下一件事。

    错误：

    她的手在发抖，脸色苍白，呼吸急促，额头全是汗。

    正确：

    她伸手去拿笔，第一次没有抓稳。

    同一种状态通常只保留一至两个证据。

    若一个具体结果已经成立，不继续叠加同义身体反应。

    </rule_semantic_repetition>

    <rule_scene_end_addition>

    场景主要变化已经通过行动成立后，不再追加角色对该变化的理解总结。

    结尾优先落在以下一项：

    1. 决定后的具体行动；
    2. 下一场需要处理的问题；
    3. 尚未解决的关系残留；
    4. 一个产生新方向的问题；
    5. 一项不可逆的选择；
    6. 一个被停止或开始的动作。

    结尾不是本场内容摘要。

    </rule_scene_end_addition>

    <rule_false_depth> 禁止伪深度句

    禁止使用以下句式代替具体叙事：

    - 这意味着……
    - 说到底……
    - 显然……
    - 他不是在……而是在……
    - 她其实只是……
    - 这个动作代替了所有回答；
    - 沉默已经说明了一切；
    - 没有人知道这句话意味着什么；
    - 空气替他们回答了问题；
    - 那一刻，一切都变得不同；
    - 某种东西悄然改变了。

    替代方式：

    - 写事实；
    - 写行动；
    - 写判断；
    - 写对方反应；
    - 写关系变化造成的下一步选择。

    </rule_false_depth>


    <!-- 第五模块：段落长度与描写解构 -->

    <narration_density_protocol>

    段落长度由场景功能和信息负担决定，不以字数或逗号数量机械判定。

    长段适用于：

    - 必要定场；
    - 复杂但当前必须理解的设定；
    - 多步骤行动；
    - 关键情绪失控；
    - 重要结果收束。

    长段必须存在明确的信息推进，不能依靠：

    - 光影；
    - 衣料；
    - 微声；
    - 眼神；
    - 呼吸；
    - 空气变化；
    - 同义身体反应；

    填充长度。

    中段适用于：

    - 常规叙事；
    - 动作推进；
    - 关系承接；
    - 情报解释；
    - 场景状态变化。

    短段适用于：

    - 对话交锋；
    - 动作爆发；
    - 信息落点；
    - 主动权改变；
    - 情绪断裂；
    - 明确决定。

    单句段只用于：

    - 强冲击信息；
    - 明确结果；
    - 被打断后的落点；
    - 场景终点；
    - 必须单独承受的动作。

    不得用单句段批量制造文艺节奏。

    </narration_density_protocol>


    <rule_detail_release> 细节分批释放

    禁止一次性倾倒：

    - 外貌清单；
    - 装备清单；
    - 能力清单；
    - 环境清单；
    - 身体反应清单；
    - 历史背景清单。

    细节只在以下情况出现：

    1. 角色正在使用它；
    2. 它影响行动；
    3. 它暴露身份或状态；
    4. 它造成对方反应；
    5. 它为后文提供直接伏笔；
    6. 它展示关系习惯；
    7. 它改变读者判断；
    8. 它成为当前方案成立的依据。

    </rule_detail_release>


    <rule_detail_entry> 细节出场方式

    细节优先通过以下方式进入正文：

    1. 动作牵引；
    2. 对话牵引；
    3. 环境交互；
    4. 角色判断；
    5. 他人反应；
    6. 日常习惯；
    7. 冲突后果；
    8. 实际使用。

    不强制使用光影牵引。

    光影只有在以下情况下保留：

    - 改变视野；
    - 暴露位置；
    - 影响判断；
    - 造成行动限制；
    - 成为某项能力的直接条件。

    </rule_detail_entry>


    <rule_anchor> 锚点法则

    每个描写单元通常只保留一至两个有效锚点。

    锚点至少参与以下一项：

    1. 行动；
    2. 关系；
    3. 判断；
    4. 冲突；
    5. 伏笔；
    6. 生活感；
    7. 身体限制；
    8. 场景结果。

    低价值锚点：

    - 墙壁的冷光；
    - 饰品的微响；
    - 没有后续的衣料摩擦；
    - 没有作用的空气变化；
    - 单纯拉长气氛的影子；
    - 没有判断价值的风声。

    有效锚点：

    - 没动过的饭；
    - 被推回去的药；
    - 落锁的门；
    - 被避开的称呼；
    - 递到手边的杯子；
    - 没有抓稳的笔；
    - 被收走的工具；
    - 改变路线的地图；
    - 没有归还的钥匙。

    </rule_anchor>


    <rule_narrative_density> 同一状态的描写配给

    不要为同一个状态连续提供多个证明。

    若人物已经通过以下一项明确表现受伤：

    - 手没有抓稳；
    - 动作明显变慢；
    - 无法站稳；
    - 施术中断；
    - 伤口影响行动；

    就不必继续叠加：

    - 脸色苍白；
    - 汗珠滑落；
    - 骨节发白；
    - 嘴唇失去血色；
    - 呼吸急促；
    - 声音从齿缝挤出；
    - 手指微微发抖。

    环境、动作、心理和旁白不要共同重复同一种情绪。

    </rule_narrative_density>


    <!-- 第六模块：分场景描写配给 -->

    <scene_description_budget>

    【战斗】

    细节服务：

    - 战术；
    - 伤害；
    - 位置；
    - 视野；
    - 资源；
    - 环境限制。

    禁止停下来写姿态美感。

    每个攻击动作尽快抵达结果。

    ---

    【争执／功能对话】

    细节服务：

    - 信息差；
    - 主动权；
    - 隐瞒；
    - 越界；
    - 被迫承认；
    - 行动方案变化。

    不要写无关眼神、语气、光影。

    优先写：

    - 谁没有回答；
    - 谁跳过问题；
    - 谁停止协助；
    - 谁把东西收走；
    - 谁接受了方案；
    - 谁仍然没有被说服。

    ---

    【日常／关系对话】

    细节服务：

    - 生活习惯；
    - 关系习惯；
    - 区别对待；
    - 旧梗；
    - 顺手照顾；
    - 边界变化。

    允许废话，但整轮交流要让人物或关系更具体。

    不要强行升华。

    ---

    【回忆／闪回】

    允许感官片段，但不得形成清单。

    只保留最能解释当前反应的一至两个片段。

    回忆必须改变当前判断、说法或行动，否则删除。

    ---

    【情绪场景】

    细节服务：

    - 失控；
    - 回避；
    - 靠近；
    - 拒绝；
    - 越界；
    - 关系破裂或修复。

    禁止连续堆五官和身体反应。

    ---

    【亲密场景】

    细节服务：

    - 关系距离；
    - 身体反馈；
    - 接受；
    - 迟疑；
    - 退让；
    - 索取；
    - 停止伪装。

    禁止抽象抒情和感官堆砌。

    </scene_description_budget>


    <!-- 第七模块：生存审计 -->

    <survival_audit>

    任何信息、描写、动作或细节写完后检查：

    1. 它是否参与当前主要变化？
    2. 它是否改变角色行动？
    3. 它是否改变角色关系？
    4. 它是否提供判断依据？
    5. 它是否制造或解决场景限制？
    6. 它是否让角色更具体？
    7. 它是否承担必要生活感？
    8. 它是否连接下一步行动？
    9. 它是否只是为了氛围？
    10. 删除它后，场景是否更清楚？

    若只有第九项成立，删除。

    若删除后场景更清楚，优先删除。

    若它只是重复已有信息，保留更具体、后果更明确的一处。

    </survival_audit>


    <!-- 第八模块：生成流程 -->

    <scene_generation_process>

    生成前，在内部依次完成：

    第一步：确定场景契约

    - 开始状态；
    - 主要矛盾；
    - 唯一主要变化；
    - 最低必要信息；
    - 暂不说明的信息；
    - 明确终点。

    第二步：判定场景类型

    - 一个主要类型；
    - 必要的局部次类型；
    - 不因段落变化频繁切换。

    第三步：建立信息准入表

    将相关信息分成：

    A. 本场必须出现；
    B. 可以只露一部分；
    C. 暂时不出现。

    第四步：选择描写锚点

    每个描写单元只选择一至两个真正参与行动、关系或判断的锚点。

    第五步：生成正文

    优先顺序：

    1. 人物行动和当前目标；
    2. 对话与信息差；
    3. 关系和情绪的自然后果；
    4. 必要设定；
    5. 环境与修饰。

    第六步：到达终点后停止

    主要变化已经形成时，不继续追加：

    - 人设证明；
    - 能力说明；
    - 历史回顾；
    - 关系总结；
    - 氛围收束。

    </scene_generation_process>


    <!-- 第九模块：最终自检 -->

    <final_scene_check>

    生成完成后检查：

    1. 这场戏的主要变化能否用一句话说清？
    2. 是否出现了两个以上互相竞争的主要变化？
    3. 场景主要类型是否稳定？
    4. 是否因为局部话题改变而频繁切换写法？
    5. 是否有设定仅仅因为“相关”就被完整介绍？
    6. 是否把人物卡中多个项目一次性验收？
    7. 是否每个问题都得到过于精准的回答？
    8. 是否存在双方轮流发表完整论点的情况？
    9. 是否一项能力既被使用，又被角色完整解释，又被对方总结？
    10. 是否为同一种情绪提供了过多身体证据？
    11. 是否存在只用于气氛的空镜和感官描写？
    12. 是否存在零结果的动作？
    13. 单句对白是否被错误要求承担独立信息功能？
    14. 整轮生活或关系交流是否让人物变得更具体？
    15. 心理描写是否产生了行动或判断变化？
    16. 场景终点出现后，是否仍在继续补充内容？
    17. 最后一个段落是否只是呼吸声、风声、光影或视线收束？
    18. 能否用一个具体行动替代结尾总结？
    19. 删除最后一段后，场景是否反而更加完整？
    20. 是否仍有部分问题保持未解决，使后续场景有继续展开的空间？
    21. 结尾是否重新列举了两个以上已经出现的细节？
    22. 是否把旧证据重新包装成“新判断”？
    23. 这个判断是否早已能由读者自行得出？
    24. 是否能用下一步行动替代人物心理总结？
    25. 结尾是否只回收了一个具体锚点？
    26. 最后一句是否正在替读者宣布人物关系或善恶判断？
    27. 删除最后一个总结段后，场景是否反而更有余味？
    若场景主要变化已经完成，删除后续没有新后果的内容。

    若信息过多，不要只压缩句子，应将非必要信息推迟到真正使用的场景。

    </final_scene_check>


    <!-- 输出要求 -->

    <output_rule>

    直接输出正文。

    不要输出：

    - 场景类型判断；
    - 场景契约；
    - 信息准入表；
    - 描写锚点；
    - 自检过程；
    - 人物塑造分析；
    - 规则执行说明。

    除非用户明确要求分析，否则不在正文后总结：

    - 这场戏完成了什么；
    - 人物关系如何变化；
    - 哪些细节承担了什么功能；
    - 为什么在此处结束。

    让人物的决定、行动和场景终点自行说明结果。

    </output_rule>

    <!-- 读者推理保护与反复述式结尾 V0.1 -->

    <reader_inference_protection>

    核心原则：

    已经能够由正文中的行动、对话和区别对待推断出的内容，
    不得在同一场景结尾由旁白或人物心理重新归纳。

    读者已经看见的关系，不需要再由正文宣布。
    读者已经能够得出的结论，不算新的信息增量。

    禁止使用“重新列举旧证据＋给出统一结论”的方式收束场景。

    </reader_inference_protection>


    <rule_evidence_restatement> 禁止证据回收清单

    已经在本场出现的事实，不得在结尾以以下方式重新陈列：

    1. 并列短句；
    2. 项目式回顾；
    3. “她现在能确认几件事”；
    4. “回想起来”；
    5. “把这些连在一起”；
    6. “所有细节都指向……”；
    7. 逐项复述对方此前的照顾、异常或谎言。

    错误：

    她现在能确认几件事。

    他不吃甜食，却买了甜甜圈。
    绳子下面垫着软布。
    他知道她没有吃午饭。

    这些加在一起，只能说明他并不想伤害她。

    以上内容已经由正文展示，不得再次汇总。

    结尾若要回收前文细节，最多只回收一个具体锚点，并让它直接改变角色的下一步行动。

    </rule_evidence_restatement>


    <rule_old_evidence_is_not_new_information> 旧证据重组不算信息增量

    将两个以上已经出现的细节重新组合成以下内容，不视为新的信息：

    - 人物性格判断；
    - 关系判断；
    - 情感判断；
    - 善恶判断；
    - “他并不是表面上的那种人”；
    - “她终于意识到对方一直在关心她”；
    - “这不是普通的绑架”；
    - “他们之间已经有所不同”。

    如果读者在结论出现前已经可以自然推断出来，删除结论。

    只有当新推断满足以下条件时，才允许明确写出：

    1. 该推断并不显而易见；
    2. 它改变人物立即采取的行动；
    3. 它构成当前场景的主要变化；
    4. 若不写出，读者会误解后续行为；
    5. 该角色确实在主动分析问题。

    即使允许推断，也只引用一至两个决定性依据，不重复完整证据链。

    </rule_old_evidence_is_not_new_information>


    <rule_conclusion_as_behavior> 判断优先转化为行为

    角色对某人或某件事的判断发生改变时，优先通过下一步行为表现。

    例如：

    不写：

    她意识到他不是真正的绑匪。

    改写为：

    - 她停止挣扎；
    - 她开始询问到达后的安排；
    - 她愿意背对着他休息；
    - 她不再追问“会不会杀我”；
    - 她开始关心他家里还有谁；
    - 她把原本准备试探的问题收了回去。

    不写：

    她开始相信他。

    改写为：

    “到了叫我。”

    她靠回椅背，没有再碰腕间的绳结。

    行为只需要表现判断变化，不要再由旁白解释这个行为意味着信任。

    </rule_conclusion_as_behavior>


    <rule_ending_anchor_budget> 结尾锚点配给

    场景结尾最多回收一个已经出现过的具体锚点。

    允许：

    她又转了转手腕，软布仍垫在绳结下面。

    她停下挣扎，问：

    “你妹妹喜欢什么？”

    禁止同时回收：

    - 甜甜圈；
    - 午饭；
    - 擦嘴；
    - 喂水；
    - 绳结；
    - 人物表情；

    然后归纳成统一判断。

    如果结尾需要多个旧证据才能成立，说明场景正在做总结，而不是继续叙事。

    </rule_ending_anchor_budget>

    <ending_generation_process>

    生成结尾前，在内部检查：

    1. 场景主要变化是否已经通过行动或台词成立；
    2. 读者是否已经能够推断人物判断发生了变化；
    3. 结尾是否正在重复前文证据；
    4. 是否能用角色下一步行为替代心理总结；
    5. 是否只需要回收一个锚点；
    6. 删除最后一段后，人物选择是否仍然清楚。

    如果删除总结后场景仍然成立，删除总结。

    禁止为了制造“完整感”而添加阅读理解式收束。

    </ending_generation_process>

    <rule_forbidden_closing_formulas> 高频复述式结尾禁令

    场景结尾重点排查以下句式：

    - 她现在能确认……
    - 他终于明白……
    - 她这才意识到……
    - 回想刚才发生的一切……
    - 把这些细节连起来……
    - 这些加在一起意味着……
    - 真正的某某不会……
    - 也许他并不是……
    - 她不知道这代表什么，但她知道……
    - 某种意义上……
    - 至少有一点可以肯定……
    - 无论如何，有件事已经改变了……
    - 她第一次觉得……
    - 原来从一开始……

    这些句式不是绝对禁用，但若其内容已经由前文表现，必须删除。

    </rule_forbidden_closing_formulas>


    <rule_reader_space> 为读者留下半步

    当正文已经完成以下内容时，不再解释：

    1. 人物为什么停止挣扎；
    2. 人物为什么没有继续追问；
    3. 人物为什么接受某项照顾；
    4. 人物为什么改换称呼；
    5. 人物为什么开始考虑下一步；
    6. 人物为什么没有把对方当成原先判断的那类人。

    允许读者比角色早半步或晚半步理解关系。

    正文不负责保证所有读者在同一行得到同一个结论。

    </rule_reader_space>
audit_checks:
  must_verify:
  - 角色说话和行动首先服务当前动机，而不是主动证明人设
  - 角色措辞、拒绝、道歉、回避、玩笑和关心方式具有角色私有性
  - 整轮交流产生关系、情绪、角色声音、事实、误判、主动权或行动后果之一
  - 允许误解、答错重点、迟到反应、话题残留和接话失败，但读者仍能判断交流停在哪里
  - 打断争夺说话权、解释权、话题、时间、注意力或关系边界，并影响后续交流
  - 旁白没有重复解释台词、宣布抽象气质或替读者总结潜台词
  - 每个完整场景只有一个主要变化，且终点后没有继续补写总结和氛围
  - 设定和能力只释放当前行动所需部分，没有人物卡式验收或说明书化
  - 环境和感官参与行动、关系、判断、伏笔、身体限制或场景结果
  - 同一种情绪或身体状态只保留一至两个最具体且有后果的证据
  - 不同场景类型使用对应的信息、对白、动作和描写预算
  - 场景结尾没有重新列举旧证据并宣布关系、情感或善恶结论
  - 最终正文只输出正文，不附带场景契约、规则分析和人物塑造总结
  rewrite_required_when:
  - 人物为了证明聪明、温柔、毒舌、深情、冷静或强大而发表说明
  - 所有角色共享改口、反问、冷幽默、语气词、精准观察或情感咨询师式表达
  - 一问一答过度整齐，问题总被立即完整回答，双方轮流发表完整论点
  - 每句对白都承担金句、信息、关系升级和人物塑造，缺少普通回应或交流失误
  - 环境、光影、呼吸、眼神、衣料和微声只用于气氛，没有改变行动或判断
  - 能力已经通过结果表现，随后又被角色解释并由旁白总结
  - 同一受伤、疲惫或情绪状态被多种身体反应重复证明
  - 场景主要变化完成后仍追加价值观、历史、关系总结或象征性空镜
  - 结尾以旧证据清单、伪深度句或阅读理解式总结替读者下结论
  - 毛刺、打断、单句段、破折号或省略号删除后不影响动机、关系和交流结果
  prohibited_fixes:
  - 不得只添加语气词、口癖、停顿、改口和动作描写来伪造活人感
  - 不得为追求信息效率删除属于具体角色关系的废话、旧梗、回避和失败交流
  - 不得以文风优化为由改变大纲结果、事实、角色知识边界或 Judgment 节点主次
  - 不得为了完整感在场景结尾重述已经表现出的关系与情绪
  completion_criteria:
  - 场景变化可用一句具体行动结果概括
  - 人物、关系、信息和环境均通过当前行动自然显露
  - 删除冗余后仍保留角色私有性和必要生活感
  - 结尾停在行动、决定、新问题或未解决关系残留上

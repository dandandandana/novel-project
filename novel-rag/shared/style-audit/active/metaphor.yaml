  content: '<!-- 比喻模块 V0.4 - 角色私有比喻与反装饰协议 -->

    [比喻模块V0.4 已激活]


    <rule_0> 核心原则：比喻必须有功能，也必须有归属

    比喻不是装饰，也不是禁品。


    比喻必须至少满足以下一种功能：

    1. 让复杂信息更容易理解；

    2. 让伤害、恐惧、压力等状态更直观；

    3. 展示角色的说话习惯；

    4. 展示角色的知识背景；

    5. 展示角色之间的熟悉程度；

    6. 形成吐槽、互损、玩笑或关系感；

    7. 压缩一段解释；

    8. 制造必要的情绪落点。


    如果一个比喻既不让信息更清楚，也不让角色更具体，只是在制造“文学感”，删除。

    </rule_0>


    <rule_1> 角色私有性优先

    比喻的第一标准不是“优美”，也不是“粗粝”，而是属于这个角色。


    检查：

    1. 这个角色会这样比喻吗？

    2. 这个角色懂这个喻体吗？

    3. 这个比喻符合她/他的年龄、职业、经历、文化背景吗？

    4. 这句话换另一个角色说，还成立吗？

    5. 这个比喻是否暴露了角色的关注点、偏见、习惯或嘴贱方式？


    如果换谁说都一样，重写。


    示例：

    - 医生可以用病灶、手术、感染来比喻。

    - 魔术师可以用术式、回路、代价来比喻。

    - 士兵可以用火线、阵地、误伤来比喻。

    - 普通高中生可以用考试、便利店、游戏、社交灾难来比喻。

    - 熟人互损可以用只有他们懂的旧梗来比喻。


    不要把所有角色都写成同一种“粗粝硬汉腔”。

    </rule_1>


    <rule_2> 禁止作者卖弄

    禁止作者越过角色认知强塞漂亮喻体。


    错误：

    一个没接触过古典音乐的角色，把机械噪音比作某个冷门作曲家的变奏。

    错误：

    一个普通角色在危急时刻，用复杂物理意象形容恐惧。

    错误：

    战斗中刀已经砍下来，旁白还停下来写三行诗意比喻。


    正确：

    角色知道什么，就用什么比。

    角色平时怎么说话，就怎么比。

    场景越急，比喻越短。

    </rule_2>


    <rule_3> 反通感与反伪高级

    禁止为了高级感制造通感和抽象物化。


    禁止：

    - 目光有重量；

    - 声音有颜色；

    - 情绪有温度；

    - 沉默像某种巨大物体；

    - 空气替角色说话；

    - 疼痛像抽象概念；

    - 命运像某种华丽机械；

    - 悲伤像某种精致材料。


    错误：

    他的目光重重砸在地上。

    错误：

    她的声音泛着冰蓝色。

    错误：

    沉默像一块生满青苔的石头压在他们之间。


    正确：

    他没有看她。

    她说完后，没人接话。

    这个问题一出口，玛修把原本要说的话咽了回去。

    </rule_3>


    <rule_4> 不强制粗粝化

    喻体不必一律粗糙、低俗、血腥。


    喻体可以普通，可以生活化，可以专业化，可以幽默，可以尖刻。


    允许：

    - 像考前最后一晚还没翻开的教材；

    - 像便利店快过期的饭团；

    - 像游戏里明知道是陷阱还亮着的宝箱；

    - 像术式里被人故意留空的一行；

    - 像开会时没人愿意第一个接的话题。


    禁止：

    为了反文青，把所有比喻都写成猪肉、铁锤、泥、粪、血、铁。


    粗粝只是可选风格，不是唯一标准。

    </rule_4>


    <rule_5> 场景适配

    不同场景使用不同类型的比喻。


    【功能对话 / 设定解释】

    比喻用于压缩复杂机制。

    要求清楚、短、贴近角色知识域。

    禁止诗意扩写。


    【日常 / 关系对话】

    比喻可以用于吐槽、互损、旧梗、生活感。

    允许轻松、嘴贱、跑题。

    重点是角色私有性，不是信息效率。


    【战斗】

    原则上少用比喻。

    如果使用，只能用于瞬间理解伤害、速度、压迫或战术状态。

    禁止在动作进行中插入长比喻，禁止阻断攻防连续性。


    【情绪爆发】

    允许少量比喻，但必须贴近角色当下能想到的东西。

    情绪越失控，比喻越不该精致。


    【亲密场景】

    比喻少用。

    重点写关系距离、动作反馈、接受与拒绝。

    禁止用抽象抒情替代身体和关系变化。


    【喜剧 / 嘴贱】

    允许夸张比喻。

    但比喻必须符合说话者的嘴损方式，不能变成作者段子。

    </rule_5>


    <rule_6> 比喻长度控制

    比喻要短，不要扩写成独立景观。


    一般规则：

    1. 一个比喻最好只占半句到一句；

    2. 比完立刻回到人物、动作、台词或信息；

    3. 不要对喻体二次描写；

    4. 不要连续排比“像……像……又像……”；

    5. 不要用比喻解释比喻。


    错误：

    像一头狼，一头饿了三天、獠牙上挂着肉丝、还在雪地里追过鹿的狼。


    正确：

    像头饿狼。


    但如果这是角色故意嘴贱或夸张吐槽，可以适度拉长。

    拉长的前提是：它本身就是角色表演的一部分，而不是旁白卖弄。

    </rule_6>


    <rule_7> 数量控制按密度，不按单章死卡

    删除“单章不得超过2个”的机械规则。


    改为：

    1. 功能对话：一场最多 1 个解释性比喻；

    2. 战斗高潮：原则上不用，必要时最多 1 个短比喻；

    3. 情绪爆发：最多 1-2 个，不连续使用；

    4. 日常嘴贱：可以多一些，但必须是角色声音，不得变成旁白段子；

    5. 设定说明：可以用比喻辅助理解，但每个机制最多 1 个核心比喻。


    如果连续三段都靠比喻制造效果，说明文本在偷懒。

    </rule_7>


    <rule_8> 比喻不能替代事实

    比喻只能辅助事实，不能取代事实。


    错误：

    那东西像一场被关在玻璃里的灾难。


    正确：

    玻璃舱里塞满黑色泥状物，舱壁被它顶得向外鼓起。


    如果读者看完比喻仍不知道实际发生了什么，先写事实，再决定要不要比喻。

    </rule_8>


    <rule_9> 比喻不能替代角色反应

    不要用比喻跳过角色该有的反应。


    错误：

    恐惧像藤蔓缠住她的心脏。


    正确：

    她后退一步，手先碰到墙，才发现自己已经退到了尽头。


    如果比喻不能让行动更清楚，就写行动。

    </rule_9>


    <rule_10> 允许角色嘴贱式比喻

    朋友、熟人、搭档之间的比喻可以不高效，但要有关系感。


    允许：

    “你这个计划听起来像把炸弹塞进微波炉里，然后祈祷它先学会礼貌。”

    “这不是备用方案，这是给失败化妆。”

    “你刚才那个表情，像是便利店饭团过期前最后一次挣扎。”


    这类比喻的功能不是解释，而是展示角色声音、关系距离和嘴贱方式。


    但禁止所有角色都这样说。

    嘴贱比喻必须私有化。

    </rule_10>


    <rule_11> 比喻自检

    每个比喻写完后检查：


    1. 它是否让信息更清楚？

    2. 它是否让角色声音更具体？

    3. 它是否展示了关系？

    4. 它是否符合角色知识背景？

    5. 它是否抢走了正文注意力？

    6. 它是否只是为了高级感？

    7. 它是否能被直说替代，而且直说更好？


    如果第 5 或第 6 项为是，删除。

    如果第 7 项为是，改成直说。

    </rule_11>'

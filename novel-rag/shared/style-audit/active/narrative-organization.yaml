  content: '<!-- 叙事组织模块 V0.6 - 叙事功能与生活感并重 -->

    [叙事组织模块V0.6 已激活]


    <rule_0> 核心原则：段落按功能组织，不按机械类别拆分

    自然段不必强行拆成“环境段 / 动作段 / 对话段”。


    一个自然段可以包含少量环境、动作、台词，但必须有一个主功能：

    1. 定场；

    2. 推进动作；

    3. 推进对话；

    4. 展示关系；

    5. 承接情绪；

    6. 暴露信息；

    7. 转换节奏；

    8. 展示生活感。


    辅助信息不得抢走主功能。


    <rule_1> 删除强制解耦

    禁止继续执行以下旧规则：


    - 环境、动作、对话必须分开；

    - 对话必须单独成段；

    - 说话前动作必须剥离；

    - 镜头必须全景→中景→特写；

    - 沉默必须填充微动作；

    - 高频对话必须锁死嘴和眼神。


    这些规则会制造文本碎片和微动作堆砌，全部废弃。


    <rule_2> 对话链优先

    对话场景中，台词可以连续推进。


    动作和环境只在以下情况插入：

    1. 改变话题；

    2. 打断对话；

    3. 改变角色关系；

    4. 暴露隐藏情绪；

    5. 造成对方反应；

    6. 提供必要信息；

    7. 展示熟人之间的生活习惯。


    不要为了“镜头感”每句话都插入动作、眼神、光影或沉默。


    <rule_3> 日常段落允许存在

    日常段落不需要强行推进主线。


    吃饭、赶路、休息、闲聊、互损、整理装备、发呆、没话找话，都可以写。


    但日常段落必须至少满足以下一项：

    1. 让人物关系更可信；

    2. 让角色声音更清楚；

    3. 让生活状态更具体；

    4. 让高压剧情获得缓冲；

    5. 暗示角色变化；

    6. 暴露某个长期习惯；

    7. 为后续情绪爆发提供对照。


    <rule_4> 不要把生活感写成流水账

    生活感不是记录所有动作。


    错误：

    角色拿杯子、喝水、放杯子、看窗外、整理袖口、继续说话。


    正确：

    保留最能体现关系或状态的一个细节。


    例如：

    谁自然地把不爱吃的东西夹给谁；

    谁嘴上嫌弃但还是等对方跟上；

    谁在争吵后还记得把药递过去；

    谁说着不管但给对方留了门。


    <rule_5> 禁止泥石流段落

    一个自然段内不得同时堆满：

    环境 + 动作 + 台词 + 心理解释 + 设定说明。


    若信息过多，按以下顺序拆分：

    1. 当前最重要的事实；

    2. 角色对此的反应；

    3. 对话或行动结果；

    4. 必要的后续说明。


    <rule_6> 不强行升华

    朋友互损、熟人闲聊、恋人废话，不需要每次结尾都升华。


    禁止把轻松对话写成：

    1. 人生哲理；

    2. 宿命暗示；

    3. 伤痛总结；

    4. 关系宣言；

    5. 旁白感慨。


    有些日常的意义就是“他们还能这样说话”。


    <rule_7> 段落存活测试

    每个段落完成后检查：


    1. 它是否推进剧情？

    2. 它是否展示关系？

    3. 它是否展示角色习惯？

    4. 它是否制造生活感？

    5. 它是否改变节奏？

    6. 它是否让角色更像活人？

    7. 它是否提供后文需要的信息？


    七项全否，删除。'

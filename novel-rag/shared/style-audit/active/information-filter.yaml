  content: '<!-- 存在性废话与心理状态约束 V0.3 - 信息增量过滤器 -->

    [存在性废话与心理状态约束V0.3 已激活]


    <rule_0> 核心原则：每句话必须增加读者理解

    禁止零信息量确认。

    禁止用感官白描替代剧情推进。

    禁止用生理反应替代所有心理。


    一句话必须至少增加以下一种理解：

    1. 事实；

    2. 判断；

    3. 误判；

    4. 关系变化；

    5. 情绪变化；

    6. 行动后果；

    7. 角色习惯；

    8. 场景限制；

    9. 后续伏笔。


    <rule_1> 存在性废话禁令

    禁止任何只是在确认“某物存在”的句式：


    - 是真的；

    - 确实存在；

    - 就在那里；

    - 不是幻觉；

    - 真实地站在那里；

    - 这不是梦；

    - 它就这样出现了。


    除非“真假”本身是剧情判断，否则删除。


    替代方式不是强行感官化，而是写它造成的结果。


    错误：

    那个人确实站在那里。


    正确：

    玛修停下脚步，盾牌没有再往前移。


    错误：

    那声音是真的。


    正确：

    警报响起后，通道门全部落锁。


    <rule_2> 情绪描写准入

    允许直接写情绪，但必须有新信息。


    可以写：

    - 立香开始烦躁，因为对方第三次绕开了问题。

    - 士郎不喜欢这个判断，但他没有反驳。

    - 玛修听懂了这句话里的风险。


    禁止只写：

    - 她很害怕；

    - 他很痛苦；

    - 她很震惊；

    - 他很冷静；

    - 她很复杂。


    情绪词可以出现，但不能单独承担一整句。


    <rule_3> 心理描写必须产生行动或判断

    心理描写必须连接后续行动。


    正确结构：

    心理判断 → 行动变化；

    误解产生 → 对话偏移；

    隐瞒信息 → 选择说法；

    情绪波动 → 关系反应。


    错误：

    他意识到事情不简单。


    正确：

    士郎发现祁荒没有否认这个名字，于是没有继续解释“她”是谁。


    <rule_4> 感官描写不必绑定心理

    删除旧规则“每个感官输入必须产出心理回响”。


    感官描写只在有用时出现。

    它可以用于：

    1. 定场；

    2. 打断；

    3. 判断；

    4. 伏笔；

    5. 关系互动；

    6. 身体状态。


    禁止感官→心理的机械循环。


    错误：

    蓝光落在墙上，他感到一阵压迫。


    正确：

    舱内警报亮起，玛修停下解释，先看向门口。


    <rule_5> 同义反复裁剪

    前后两句表达同一意思时，删掉弱句。


    错误：

    她很累，整个人都没有力气了。


    正确：

    她闭上眼后，连回答都慢了半句。


    错误：

    士郎没有说话。他保持沉默。


    正确：

    士郎没有回答，直接问下一个问题。


    <rule_6> 禁止伪深度句

    禁止以下句式：


    - 这意味着……

    - 说到底……

    - 显然……

    - 他不是在……而是在……

    - 她其实只是……

    - 这个动作代替了所有回答；

    - 沉默已经说明了一切；

    - 没有人知道这句话意味着什么；

    - 空气替他们回答了问题。


    替代方式：

    写事实、行动、反应。'

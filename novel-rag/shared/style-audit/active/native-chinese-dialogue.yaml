  content: '# 中文母语感对白生成与翻译腔修正规则


    ## 一、核心目标


    生成对白时，优先保证角色说出来的话具有自然的中文母语感，而不只是语义正确。


    对白必须像具体的人在具体关系、具体情绪和具体场景下说出来的话，而不是：


    - 将英文句式逐字翻译成中文；

    - 用书面概念代替日常表达；

    - 让角色像系统、报告、字幕或说明书一样交换信息；

    - 把所有台词写成短促、完整、平直的主谓宾陈述句。


    每句对白都应同时包含以下至少两项：


    1. 实际信息；

    2. 当前情绪；

    3. 人物关系；

    4. 对上一句话的反应；

    5. 未直接说出口的潜台词；

    6. 推进、回避、试探、反驳、缓和或拉扯的意图。


    对白不是信息清单，而是人物关系正在发生变化的过程。


    ---


    ## 二、禁止翻译腔与概念化表达


    不得为了“准确”而使用日常人物不会自然说出口的概念化词语。


    ### 常见翻译腔


    - 你是旅行的主要体验者。

    - 我是监管人。

    - 这是你的个人选择。

    - 我对此没有意见。

    - 这不是当前讨论的重点。

    - 你正在回避我的问题。

    - 我能够理解你的感受。

    - 你没有必要这样做。

    - 我不认为这是一个好主意。


    ### 优先改写为自然口语


    - 真正出去玩的人不是你吗？

    - 我那时候不就是负责看着你嘛。

    - 反正是你自己选的。

    - 我又没说不行。

    - 现在说的不是这个吧？

    - 你别岔开话题。

    - 我知道你难受。

    - 你不用非得这样。

    - 我看还是算了吧。


    不得机械保留原句的抽象名词、身份标签和逻辑结构。


    应先理解角色真正想表达什么，再用中文人物自然会采用的说法重新组织。


    ---


    ## 三、对白必须具有中文语气


    根据人物身份、关系和情绪，自然使用中文语气助词，包括但不限于：


    - 了

    - 呢

    - 啊

    - 吧

    - 嘛

    - 呀

    - 呗

    - 哦

    - 来着

    - 似的

    - 才怪

    - 行不行

    - 好不好

    - 怎么了

    - 干什么

    - 算了

    - 得了吧


    语气助词不能平均分配，也不能为了口语感强行塞进每句话。


    它们必须承担实际功能：


    - “了”：表示状态变化、确认、催促或不耐烦；

    - “呢”：追问、对照、未完意味或轻微施压；

    - “啊”：强调、提醒、惊讶、撒娇或解释；

    - “吧”：缓和判断、试探、建议或不确定；

    - “嘛”：解释理所当然、撒娇、抱怨或拉近距离；

    - “呀”：轻快、亲近、惊讶或故意柔化；

    - “呗”：无奈、赌气、随口接受或反讽。


    ### 错误示例


    “你不需要担心我。”


    ### 自然改写


    - “你不用这么担心我。”

    - “我又不会出什么事。”

    - “好了，我知道你担心。”

    - “你怎么还在想这个啊？”

    - “都已经没事了，不是吗？”


    ---


    ## 四、避免所有台词都是完整陈述句


    自然对白允许并鼓励：


    - 省略；

    - 倒装；

    - 重复；

    - 改口；

    - 停顿；

    - 半句话；

    - 反问；

    - 答非所问；

    - 抓住对方措辞反击；

    - 故意曲解；

    - 先否认再承认；

    - 说到一半停住；

    - 用动作代替后半句。


    ### 平直写法


    “我担心你。”


    “你不需要担心。”


    “这是我的决定。”


    ### 自然写法


    “我就是有点担心你，不行吗？”


    “我又没说不行。”


    “那你刚才躲什么？”


    “……谁躲了。”


    对白应允许“不完整”，但不能让读者看不懂人物真正的情绪和关系变化。


    ---


    ## 五、每句台词必须承接上一句


    角色不能只围绕同一主题各说各的。


    新台词应明确回应上一句话中的至少一个部分：


    - 内容；

    - 措辞；

    - 情绪；

    - 回避；

    - 暗示；

    - 称呼；

    - 语气变化。


    ### 机械对话


    “欧洲三个月基本都是我在选。”


    “你是旅行的主要体验者。”


    “你也在旅行。”


    “我是监管人。”


    “现在不是。”


    ### 自然对话


    “在欧洲那三个月，不一直都是我挑地方吗？”


    “可真正出去玩的人是你啊。”


    “说得好像你没跟着一起似的。”


    “我那时候主要是负责看着你。”


    “那现在呢？”


    “……现在不算了。”


    后一句应从前一句中“接话”，而不是只提供新的事实。


    ---


    ## 六、对白必须体现人物关系


    同一句意思，根据关系不同，表达方式必须变化。


    ### 陌生人


    “抱歉，我想确认一下，您刚才的意思是？”


    ### 熟人


    “等等，你刚才什么意思？”


    ### 恋人


    “你这话什么意思啊？”


    ### 正在吵架的恋人


    “你把刚才那句话再说一遍？”


    ### 上下级


    “您的意思是，这件事暂时不需要继续处理？”


    ### 亲密但嘴硬


    “所以呢？你该不会是在担心我吧？”


    生成前必须判断：


    - 两人熟不熟；

    - 谁更强势；

    - 谁正在心虚；

    - 谁在试探；

    - 谁想结束话题；

    - 谁想让对方继续问；

    - 是否存在暧昧、敌意、愧疚、依赖或戒备。


    不能让所有人物共享同一种“标准普通话人格”。


    ---


    ## 七、对白要有潜台词


    人物不应总是直接说出真实意图。


    以下情形优先使用潜台词：


    - 害羞；

    - 心虚；

    - 暧昧；

    - 愤怒；

    - 愧疚；

    - 不想示弱；

    - 想被挽留；

    - 想让对方主动；

    - 已经知道答案，却仍然追问。


    ### 直接说明


    “我希望你陪我。”


    ### 潜台词表达


    - “你今晚还有别的事吗？”

    - “反正我一个人也没关系。”

    - “你不是说今天有空？”

    - “这么晚了，你还要走啊？”

    - “……再坐一会儿吧。”


    不要把人物心理报告直接写成台词。


    ---


    ## 八、对白节奏不能过度整齐


    禁止连续多句都采用同样长度、同样结构和同样语调。


    尤其避免：


    - 每句都在十个字以内；

    - 每句都是“主语＋判断”；

    - 每句都以句号结束；

    - 一问一答过于完整；

    - 情绪越强，句子反而越工整；

    - 所有人都像冷静地等待对方说完。


    应混合使用：


    - 短句；

    - 长句；

    - 停顿；

    - 打断；

    - 追问；

    - 重复；

    - 自我修正；

    - 动作插入；

    - 沉默；

    - 未说完的话。


    ### 示例


    “我没生气。”


    “你每次这么说的时候都在生气。”


    “我说了没有。”


    “行。没有。”


    “……你那是什么语气？”


    ---


    ## 九、叙述动作要辅助语气


    当一句话仅靠文字无法准确传达态度时，使用简短动作、神态或停顿提供语境。


    ### 平淡写法


    “现在不是。”


    ### 改写


    他停了一下，视线从她脸上移开。


    “……现在不算了。”


    动作不能替代对白，也不能每句话都追加表情说明。


    只在以下情况使用动作：


    - 语气存在歧义；

    - 人物口是心非；

    - 关系发生变化；

    - 情绪突然停顿；

    - 台词本身很轻，但含义很重。


    ---


    ## 十、避免过度书面化


    对白中谨慎使用以下结构：


    - 对此；

    - 关于这一点；

    - 从某种意义上来说；

    - 我认为；

    - 你应该意识到；

    - 这意味着；

    - 这并不代表；

    - 你所做的行为；

    - 当前阶段；

    - 主要体验者；

    - 监管人；

    - 行动主体；

    - 情绪状态；

    - 个人选择；

    - 必要性；

    - 合理性。


    除非角色本身就是刻意使用官腔、学术腔、机械腔或外交辞令，否则应改为普通人物会说的话。


    ### 书面表达


    “这并不意味着我认可你的行为。”


    ### 口语表达


    - “我可没说你做得对。”

    - “理解归理解，我还是不赞成。”

    - “别误会，我没打算夸你。”

    - “你少拿这个当我同意了。”


    ---


    ## 十一、保留角色的个体语言习惯


    不同角色应拥有稳定且可辨认的表达习惯。


    可从以下维度区分：


    - 句子长短；

    - 是否爱反问；

    - 是否习惯解释；

    - 是否嘴硬；

    - 是否常省略主语；

    - 是否使用敬语；

    - 是否爱叫对方名字；

    - 是否会说脏话；

    - 是否会改口；

    - 是否直白；

    - 是否喜欢用比喻；

    - 是否擅长绕开问题；

    - 情绪激动时变得更沉默还是更啰嗦。


    不得只通过口癖区分人物。


    真正的人物语言差异，应体现在他们如何理解问题、如何回应对方、如何隐藏自身需求。


    ---


    ## 十二、避免“过度精炼导致失去人味”


    不要为了让对白显得利落，就删掉所有中文口语中的缓冲成分。


    以下词语在合适位置可以保留：


    - 就是；

    - 其实；

    - 反正；

    - 本来；

    - 好歹；

    - 再说；

    - 不是；

    - 等等；

    - 怎么说呢；

    - 我是说；

    - 算了；

    - 行了；

    - 得了；

    - 你看；

    - 我知道；

    - 所以呢；

    - 那又怎么了；

    - 话是这么说。


    这些词不一定提供新信息，但会提供人物思考、犹豫、态度和关系感。


    不得将所有“非信息性成分”都视为冗余。


    ---


    ## 十三、生成步骤


    生成对白前，在内部依次判断：


    1. 这句话是谁说的？

    2. 他和听者是什么关系？

    3. 他现在真正想达到什么目的？

    4. 他愿不愿意直接说出真实想法？

    5. 上一句话中，哪个词或态度刺激了他？

    6. 他的情绪会让句子变长、变短，还是说到一半停住？

    7. 是否需要语气助词、反问、改口或停顿？

    8. 这句话是否像翻译字幕、系统提示或书面报告？

    9. 换成现实中的中国人，会不会这样开口？

    10. 删除人物名字后，这句话是否仍然具有角色辨识度？


    完成判断后再生成台词。


    ---


    ## 十四、输出后的自检


    生成完成后，逐句检查：


    - 是否出现生硬的抽象概念？

    - 是否可以换成更日常的动词？

    - 是否连续三句以上都是短促陈述句？

    - 是否缺少“了、呢、啊、吧、嘛”等必要语气？

    - 是否为了添加语气助词而显得做作？

    - 后一句是否真正承接前一句？

    - 人物是否在直接朗读自己的心理活动？

    - 对话是否只有信息，没有情绪和关系？

    - 不同角色说话是否过于相似？

    - 是否像中文母语者会自然说出口的话？


    若存在以上问题，必须重写，而不是仅在句末机械添加语气词。


    ---


    ## 十五、最终原则


    语义正确只是最低标准。


    对白的最终标准是：


    - 人物说得出口；

    - 中国读者听得顺；

    - 语气与关系吻合；

    - 每一句都在回应对方；

    - 信息、情绪与潜台词同时存在；

    - 不像翻译文本；

    - 不像系统提示；

    - 不像人物轮流朗读剧情摘要。


    宁可让台词略带重复、停顿和含混，也不要为了简洁而牺牲中文口语中的气口、人味和关系感。'
audit_checks:
  line_function_minimum: 2
  line_functions:
  - 实际信息
  - 当前情绪
  - 人物关系
  - 对上一句话的反应
  - 潜台词
  - 推进、回避、试探、反驳、缓和或拉扯的意图
  must_verify:
  - 台词像具体角色在当前关系和情绪下说出口的话
  - 后一句承接前一句的内容、措辞、情绪、回避、暗示、称呼或语气变化
  - 语气助词承担实际功能且未被平均分配
  - 省略、倒装、重复、改口、停顿、反问、打断和沉默符合人物状态
  - 对白体现熟悉程度、强弱位置、试探、心虚、依赖、敌意或戒备
  - 需要隐藏真实意图时使用潜台词而非心理报告
  - 台词长短、结构和标点节奏不过度整齐
  - 动作只在语气歧义、口是心非、关系变化或重含义轻台词时辅助
  - 不同角色具有稳定且可辨认的语言习惯
  - 适当保留口语缓冲成分，不因过度精炼失去人味
  rewrite_required_when:
  - 出现生硬抽象概念或英文式逻辑结构
  - 连续三句以上都是短促完整陈述句
  - 对白只有信息而没有情绪、关系或潜台词
  - 不同角色声音过度相似
  - 人物直接朗读心理活动
  - 后一句没有真正承接前一句
  - 台词像翻译字幕、系统提示、书面报告或剧情摘要
  prohibited_fix: 不得仅在句末机械添加语气词；必须从真实意图、关系、接话点和中文口语结构重写。

  content: '<!-- 标点符号规范 V0.2 - 语义换气与自然连句 -->

    [标点符号规范V0.2 已激活]


    <rule_0> 核心原则：标点服务语义，不服务机械节奏

    标点不是为了把句子切碎，也不是为了强行制造“文学节奏”。


    句号用于结束一个完整语义单位。

    逗号用于连接同一动作链、同一观察链、同一情绪链。

    分号用于并列两个较长但关系紧密的语义单位。

    破折号用于打断、突转、补充落点。

    省略号用于话语自然弱下去或未说完。


    禁止机械规定“几个逗号后必须句号”。

    是否断句，取决于语义是否完成，而不是逗号数量。


    </rule_0>


    <rule_1> 句号使用原则

    句号用于切开已经完成的意思。


    适合使用句号的情况：

    1. 动作链结束；

    2. 观察对象改变；

    3. 话题改变；

    4. 情绪落点完成；

    5. 信息落点完成；

    6. 下一句进入新的判断、反应或行动。


    不适合使用句号的情况：

    1. 同一个动作还没完成；

    2. 同一个观察对象还在继续补充；

    3. 同一句话的因果还没说完；

    4. 同一段关系互动还在一个气口里；

    5. 只是为了避免长句而硬切。


    错误：

    他推开门，走进房间。桌上摆着一封信。信封已经泛黄，边角起了毛，上面没有署名。


    正确：

    他推开门走进房间，看见桌上摆着一封泛黄的信，边角起了毛，上面没有署名。


    错误：

    士郎没有回答。直接问下一个问题。


    正确：

    士郎没有回答，直接问下一个问题。


    错误：

    祁荒停了一下。重新确认那个词。


    正确：

    祁荒停了一下，重新确认那个词。


    </rule_1>


    <rule_2> 逗号使用原则

    逗号用于连接同一语义链条。


    允许逗号连接：

    1. 连续动作；

    2. 同一对象的连续观察；

    3. 同一情绪下的连续反应；

    4. 同一人物的连续判断；

    5. 前后因果紧密的句子；

    6. 台词前后的轻量叙述。


    正确：

    他把杯子推到她手边，没有解释。


    正确：

    玛修看了看士郎，又看了看祁荒，决定先把说明接过去。


    正确：

    祁荒没有接玩笑，只盯着“根源魔术”这个词。


    正确：

    士郎发现她没有否认那个名字，于是跳过前面的试探。


    逗号可以连，但不能拖成没有落点的长蛇句。

    一旦句子已经出现两个以上动作目标、两个以上观察对象、或话题开始转向，应考虑句号、分号或换段。


    </rule_2>


    <rule_3> 避免句号碎片化

    禁止把本来属于同一语义单位的内容拆成碎句。


    错误：

    她把药递过去。士郎没有接。她又往前推了一点。


    正确：

    她把药递过去，士郎没接，她又往前推了一点。


    如果需要强调停顿，可以切句：


    正确：

    她把药递过去。士郎没有接。

    她又往前推了一点。


    判断标准：

    - 如果重点是动作连续，用逗号。

    - 如果重点是对方拒绝造成停顿，用句号或换段。


    </rule_3>


    <rule_4> 长句限制：不是数逗号，而是看负担

    禁止“，……，……，……”式无落点长句，但不按逗号数量机械切断。


    需要断句的信号：

    1. 主语改变多次；

    2. 动作对象改变多次；

    3. 句子里同时塞入动作、环境、心理、设定；

    4. 读者要回看前文才能理解主干；

    5. 一个句子承担了两个以上信息落点。


    错误：

    他推开门，走进房间，看见桌上摆着一封信，信封已经泛黄，边角起了毛，上面没有署名，他拿起来翻了一面，发现封口完好。


    正确：

    他推开门走进房间，看见桌上摆着一封泛黄的信，边角起了毛，上面没有署名。他拿起来翻了一面——封口完好。


    说明：

    第一句完成“进入房间并发现信”。

    第二句完成“检查信封并得到结果”。


    </rule_4>


    <rule_5> 对话标点规范

    角色台词必须使用中文标点：

    句号（。）、问号（？）、感叹号（！）、省略号（……）、破折号（——）。


    禁止台词结尾无标点直接接后引号或叙述。


    错误：

    “我不渴”她把杯子推开。


    正确：

    “我不渴。”她把杯子推开。


    如果台词后接的是“他说/她问/他答”这类提示语，台词内部可以使用逗号。


    正确：

    “我知道，”他说，“你不信我。”


    正确：

    “你知道她？”士郎没有解释那个名字。


    正确：

    “神琦灰。她是我的师父。”士郎没有补充。


    </rule_5>


    <rule_6> 引号内外衔接

    根据引号外内容决定标点。


    【台词被提示语打断】

    一句话被“他说/她问/他答”插入时，引号内可用逗号。


    正确：

    “我知道，”他说，“你不信我。”


    【台词结束后接动作】

    台词已经完整结束，句号留在引号内，外部动作另起叙述。


    正确：

    “我知道。”他把杯子放回桌上。


    【动作过长时不要夹在一句台词中间】

    错误：

    “我知道，”他叹了口气，把杯子放回桌上，又看了她一眼，“你不信我。”


    正确：

    “我知道。”他把杯子放回桌上，又说，“你不信我。”


    【被打断】

    打断用破折号，不和省略号混用。


    正确：

    “你到底想说什么，我——”

    “闭嘴。”


    【自然弱下去】

    话没说完、声音弱下去、角色自己放弃继续说，用省略号。


    正确：

    “我只是觉得……算了，不说了。”


    </rule_6>


    <rule_7> 感叹号与省略号限制

    感叹号只用于真实爆发、惊吓、怒吼、强烈命令。

    单段对话内感叹号最多 1 个。

    禁止“！！！”。


    省略号只用于：

    1. 话语自然弱下去；

    2. 角色不知道怎么说；

    3. 情绪溃散；

    4. 有意拖延；

    5. 未说完但不是被打断。


    禁止用省略号制造伪自然。


    错误：

    “那个……我想说……就是……你明白的……”


    正确：

    “那个……”她看了他一眼，把后半句吞回去。


    如果是突然被别人截断，用破折号，不用省略号。


    错误：

    “我只是想……”


    正确：

    “我只是想——”

    “别说了。”


    </rule_7>


    <rule_8> 破折号使用原则

    破折号用于：

    1. 突然转折；

    2. 被打断；

    3. 句末落点；

    4. 补充关键信息；

    5. 把结果砸出来。


    正确：

    他拿起来翻了一面——封口完好。


    正确：

    “你别告诉我——”

    “就是你想的那样。”


    禁止破折号滥用成文艺停顿。

    如果只是普通补充，用逗号或句号。


    错误：

    士郎看着她——没有说话。


    正确：

    士郎看着她，没有说话。


    </rule_8>


    <rule_9> 标点自检

    每段写完后检查：


    1. 句号是否把同一动作链切碎了？

    2. 逗号是否把多个信息点拖成一条长蛇句？

    3. 破折号是否真的承担突转或落点？

    4. 省略号是否真的表示话未说完，而不是装自然？

    5. 台词内外标点是否符合中文习惯？

    6. 标点是否服务语义，而不是制造假节奏？


    如果一句话能自然连起来，就不要硬切。

    如果一句话已经承担多个落点，就断开。

    </rule_9>'

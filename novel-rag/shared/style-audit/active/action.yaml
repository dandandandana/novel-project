  content: '<!-- 动作描写模块 V0.4 - 角色私有动作与结果导向 -->

    [动作描写模块V0.4 已激活]


    <rule_0> 核心原则：动作必须有归属，也必须有结果

    动作不是装饰，也不只是“意志的物理投影”。


    动作可以来自：

    1. 角色目标；

    2. 角色习惯；

    3. 关系亲疏；

    4. 尴尬回避；

    5. 嘴硬照顾；

    6. 身体状态；

    7. 战斗判断；

    8. 情绪失控。


    动作必须至少满足以下一项：

    1. 改变站位；

    2. 改变距离；

    3. 改变谈话主动权；

    4. 暴露角色习惯；

    5. 暴露隐藏情绪；

    6. 造成对方反应；

    7. 推动下一步行动；

    8. 让关系更具体；

    9. 造成物理后果。


    若动作只是在制造氛围，删除。


    <rule_1> 场景自适应开关

    落笔任何动作前，先判断当前场景类型：


    【对话场景】

    台词是主轴，动作是补强。


    动作只在以下情况出现：

    1. 打断话题；

    2. 暴露角色没有说出口的态度；

    3. 改变两人距离；

    4. 让对方改口、追问、闭嘴或接话；

    5. 展示熟人之间的关系习惯。


    禁止每句台词前后都安排动作。

    禁止用通用微动作填补空白。


    【日常场景】

    日常动作可以不推进主线，但必须展示生活感或关系。


    允许：

    1. 顺手递东西；

    2. 夹走对方不吃的菜；

    3. 嘴上嫌弃但等对方跟上；

    4. 熟练避开对方雷区；

    5. 用小动作接住尴尬；

    6. 用习惯性动作暴露两人很熟。


    日常动作不能写成流水账。

    只保留最能体现关系或状态的动作。


    【战斗/暴力场景】

    动作必须有结果。


    每个动作必须至少造成以下一种结果：

    1. 击中；

    2. 闪避；

    3. 受伤；

    4. 破坏；

    5. 失衡；

    6. 逼退；

    7. 防御崩溃；

    8. 位置改变；

    9. 行动失败；

    10. 死亡。


    禁止姿态展示。

    禁止慢动作拆分。

    禁止为了画面感延迟结果。


    【情感对峙场景】

    动作必须改变关系状态。


    允许：

    1. 靠近；

    2. 躲开；

    3. 抓住；

    4. 推开；

    5. 放手；

    6. 停止伪装；

    7. 拒绝；

    8. 接受；

    9. 代替说不出口的话。


    禁止只写“微微颤抖”“轻轻抿唇”“眼神移开”。

    如果动作不改变关系状态，删除。


    【亲密场景】

    动作服务于关系距离与身体反馈。


    允许写亲近、迟疑、退让、接受、索取、拒绝。

    重点写角色关系如何变化，而不是堆砌感官或身体部位。


    禁止把亲密场景写成抽象抒情。

    禁止用温度、空气、光影替代人物反应。

    </rule_1>


    <rule_2> 动作净化检验

    每个动作写完后检查：


    1. 这个动作是否属于当前角色？

    2. 换成另一个角色做，是否仍然成立？

    3. 它是否改变了局势、关系、距离、节奏或读者判断？

    4. 它是否只是为了填补对话空白？

    5. 它是否是通用 AI 小动作？


    若第 2 项为“是”，且第 3 项为“否”，删除或重写。


    <rule_3> 禁止通用微动作

    以下动作默认禁止，除非它们直接改变关系或推动剧情：


    - 微微歪头；

    - 轻轻抿唇；

    - 嘴唇动了动；

    - 指尖轻颤；

    - 喉结滚动；

    - 眼神闪了一下；

    - 垂下眼；

    - 眨了眨眼；

    - 呼吸一滞；

    - 衣料摩擦；

    - 饰品轻响；

    - 手指敲杯沿；

    - 理头发；

    - 摸杯子；

    - 低头看地面。


    这些动作不是绝对不能写，而是不能作为通用填充。


    <rule_4> 禁止动作拆碎

    禁止把一个简单动作拆成多个慢镜头。


    错误：

    他抬起手，指尖先碰到杯沿，又停了一下，最后才把杯子推过去。


    正确：

    他把杯子推到她手边。


    如果需要表现迟疑，写结果：

    他把杯子推到一半，又收了回去。


    <rule_5> 禁止伪冷感动作

    禁止用动作制造抽象气质：


    - 他的眼神冷下来；

    - 她的笑意退去；

    - 他的动作很稳；

    - 她平静地抬眼；

    - 他的视线压过去；

    - 这个动作没有情绪；

    - 她的手停在半空；

    - 光影切开他的脸。


    替代方式：

    写动作造成的实际效果。


    例如：

    错误：

    士郎的眼神冷下来。


    正确：

    士郎没有接她的玩笑。

    士郎直接问下一个问题。

    士郎把刚才那句话重复了一遍。


    <rule_6> 动词优先，但不迷信粗暴动词

    精准动词优先。


    战斗场景可使用短促动词：

    劈、砸、撞、扫、崩、扯、蹬、压、截、拧。


    日常场景不必强行粗暴。

    日常动作要贴合关系和人物习惯：

    递、拨、塞、让、避、等、拦、收、推、夹、翻、扣、停。


    禁止用“用力+模糊动词”逃避精准动作。

    错误：用力打开门。

    正确：撞开门 / 推开门 / 拧开门。

    </rule_6>


    <rule_7> 动作与台词关系

    台词已经能表达的信息，不需要动作重复解释。


    错误：

    “我没事。”

    她别过脸，手指攥紧衣角，努力不让自己露出脆弱。


    正确：

    “我没事。”

    她把药塞回士郎手里。


    后者有动作结果，也有关系变化。

    </rule_7>'

judgment:
  purpose: 在正文生成之前，根据 Ruler 已裁决的 execution_contract、当前大纲、writing_context、 长期 Judgment Spec、目标篇幅和场景类型，建立本次任务唯一有效的 generation_plan；
    决定章节中心、节点功能、S/A/B/C 级别、合并删除、篇幅预算、描写权限、情绪曲线和信息释放。
  required_inputs:
  - execution_contract
  - outline_contract
  - writing_context
  - judgment_specs
  - target_length
  - task_type
  - scene_types
  input_authority:
  - execution_contract 是最高约束
  - outline_contract 规定必须发生什么
  - writing_context 提供人物状态、邻近前文、相关设定和当前场景信息
  - judgment_specs 提供长期判断标准
  - target_length 提供篇幅目标
  - 不得重新裁决 Ruler 已决定的资料优先级
  required_actions:
  - 确认章节或场景的核心目标
  - 找出核心戏剧问题
  - 找出核心情绪、核心信息和主要人物变化
  - 将大纲拆解为可执行事件节点
  - 为每个节点确定一个主要叙事功能和少量次要功能
  - 将每个节点判断为 S、A、B 或 C
  - 合并功能相邻且时间连续的节点
  - 判断可删除内容
  - 为每个节点分配相对篇幅
  - 限制每个节点允许使用的描写资源
  - 建立情绪曲线和信息释放曲线
  - 输出唯一有效的 generation_plan
  prohibited_judgments:
  - 修改 execution_contract
  - 删除 must_happen 中的硬事件
  - 改变大纲规定的胜负、关系结果和结束状态
  - 生成小说正文
  - 编写完整台词
  - 进行句词润色
  - 擅自增加重大设定
  - 把未来大纲当成当前事实
  - 用表面场面规模直接判断节点重要性
  - 因为资料被召回就强行安排其进入正文
  - 将每个大纲条目机械分配为独立段落
  - 输出完整推理过程或思维链
  - 输出 YAML 之外的内容
  hard_event_policy: 大纲硬事件可以合并或压缩表现，但不能删除、改变结果或判为 C；若硬事件仅承担连接功能， 可以合并进其他节点，但必须保留完成结果。
  chapter_core_schema:
    chapter_goal: 本章结束后故事相较开场发生的核心变化
    dramatic_question: 读者在本章主要等待答案的问题
    emotional_center: 本章最需要读者感受到的情绪
    information_center: 本章最关键的信息变化
    primary_character_change: 主要人物的判断、关系、目标或状态变化
    required_end_state: 大纲要求的最终状态
  chapter_core_policy:
  - 必须先建立 chapter_core，再判断节点等级
  - 所有节点的重要性必须相对于 chapter_core 判断
  - 爆炸范围大不能自动判为 S
  - 能力规格高不能自动判为 S
  - 角色登场华丽不能自动判为 S
  - 台词听起来重要不能自动判为 S
  - 大纲条目很长不能自动判为 S
  - 召回资料很多不能自动判为 S
  - 设定信息复杂不能自动判为 S
  node_functions:
  - causal_progress
  - information_delivery
  - character_revelation
  - relationship_change
  - emotional_build
  - threat_escalation
  - decision
  - turning_point
  - payoff
  - foreshadowing
  - transition
  - atmosphere_support
  - consequence
  - setup
  node_function_policy:
  - 每个节点只能有一个主要功能，可附带少量次要功能
  - 无法说明功能的节点应与相邻节点合并、判为 C 或降为其他节点的附属细节
  - 不为每次移动、转身、抬头、落座和观察建立独立节点
  importance_criteria:
    S:
      name: 核心节点
      qualifies_when_any:
      - 改变章节核心结果
      - 角色作出不可回避的关键选择
      - 产生不可逆或阶段性决定性的关系变化
      - 揭露本章核心真相
      - 完成主要战斗胜负
      - 改变主要人物的核心认知
      - 回收章节核心伏笔
      - 承担本章情绪最高点
      - 直接决定 required_end_state
      treatment: expand
      relative_weight: 4—6
      allowed_detail:
      - 完整动作过程
      - 关键对白交锋
      - 克制或深入的心理变化
      - 一至两个主要感官通道
      - 服务于变化的环境细节
      - 与主题一致的受控意象
      - 必要的时间放慢
      constraint: S 级不是越长越好，必须集中服务于核心变化
    A:
      name: 必要推进节点
      qualifies_when_any:
      - 直接支撑 S 级节点成立
      - 提供关键因果
      - 改变人物当前行动方向
      - 显著改变危险程度
      - 建立新的目标、判断或怀疑
      - 承担 S 级前的必要蓄力
      - 展示 S 级后的直接后果
      - 提供后续理解必须具备的信息
      treatment: complete
      relative_weight: 2—3
      allowed_detail:
      - 清晰动作
      - 功能性对白
      - 简短心理反应
      - 一个主要感官通道
      - 最低必要环境反馈
      constraint: 必须完整清楚，但不能抢夺 S 级中心
    B:
      name: 连接节点
      qualifies_when_any:
      - 转场
      - 进出场
      - 普通移动
      - 空间与时间连续
      - 必要但低价值的信息转交
      - 场景开始前的最低铺垫
      - 高强度场景后的短暂缓冲
      - 不产生独立变化的普通动作
      treatment: compress 或 merge
      relative_weight: 0.5—1
      max_sentences_default: 1—3
      allowed_detail:
      - 必要动作结果
      - 最低空间信息
      - 一句必要对白或连接信息
      forbidden_detail:
      - 完整环境铺陈
      - 多层比喻
      - 新象征
      - 长篇心理
      - 多通道感官
      - 时间放慢
      - 独立高潮句
      constraints:
      - 优先与相邻 A 或 S 节点合并
      - 不建立独立情绪曲线
      - 不引入新象征
      - 不允许无必要内心深描
    C:
      name: 删除节点
      qualifies_when_all_unaffected:
      - 因果理解
      - 人物判断
      - 情绪积累
      - 关系变化
      - 场景结果
      - 后续剧情
      - must_happen 完成情况
      treatment: delete
      relative_weight: 0
      allowed_detail: []
      constraints:
      - must_happen 中的硬事件不得直接判为 C
      - 主要针对 Agent 拟补充内容、重复信息和无功能描写
  merge_criteria:
    prefer_merge_when:
    - 发生在同一地点
    - 时间连续
    - 属于同一动作链
    - 由同一人物触发
    - 承担相同或相邻功能
    - 合并后不削弱转折
    - 合并后不影响信息清晰度
    - 合并后仍能确认大纲硬事件已经发生
    do_not_merge_when:
    - 节点之间存在关键选择
    - 关系状态发生变化
    - 信息理解发生反转
    - 场景目标发生改变
    - 视角发生明确切换
    - 时间或地点发生具有剧情意义的跳跃
    - 前一节点需要留出情绪停顿
    example: 人物进房、看见另一人物、发现对方受伤并停步，通常合并为一个连续节点
  budget_policy:
    method: 使用相对预算，不机械平均分配字数
    default_weights:
      S: 4—6
      A: 2—3
      B: 0.5—1
      C: 0
    checks:
    - 核心场景总篇幅明显高于过渡
    - B 级节点总篇幅没有过高
    - 不连续给多个节点相同权重
    - 不平均扩写每个大纲条目
    - 后半部分不因预算耗尽而压成摘要
    - 单个 B 级节点不比 S 级节点更长
    - 不把所有节点都判成 A 或 S
    reevaluate_when: 超过一半节点被判为 S 或 A
  detail_permission_schema:
    action_detail: 节点允许的动作展开程度
    dialogue: 节点允许的对白功能与长度
    inner_monologue: 节点允许的内心描写深度
    sensory_channels: 节点允许的感官通道
    environment_detail: 节点允许的环境反馈
    metaphor: 节点允许的比喻程度
    symbolic_image: 节点是否允许新意象或象征
    temporal_slowdown: 节点是否允许放慢叙事时间
  detail_permission_policy:
  - 每个节点必须明确 allowed_detail
  - 每个节点必须明确 forbidden_treatment
  - 描写权限必须与节点等级匹配
  - C 级不分配描写权限
  emotional_curve_policy:
    schema:
      opening_level: 开场强度
      buildup_nodes: 蓄力节点
      pressure_increase: 压力上升节点
      false_release: 假释放节点
      peak_node: 情绪高潮
      immediate_aftershock: 高潮后的即时后果
      ending_level: 收束强度
    constraints:
    - 必须存在强度变化
    - 高潮前有足够蓄力
    - 高潮不能凭空出现
    - 高潮后必须有即时后果
    - 收束不等于机械总结
    - 不连续让多个节点处于最高强度
    - 普通过渡不承担独立情绪高潮
    - 日常和感情场景也要有变化，但不强行制造爆发
    - 事件高潮与情绪高潮不同时应分别标记
  information_release_policy:
    modes:
    - direct_reveal
    - partial_reveal
    - behavioral_hint
    - environmental_hint
    - character_misread
    - result_without_explanation
    - defer
    constraints:
    - 必须遵守 forbidden_reveals
    - 设定存在于 RAG 不等于角色知道，也不等于正文需要解释
    knowledge_layers:
    - 读者知道
    - 视角角色知道
    - 其他角色知道
    - 客观事实成立
    - 当前仅为怀疑
    - 当前是错误认知
  scene_policy:
    schema:
      scene_id: 唯一场景标识
      location: 地点
      time: 时间
      viewpoint: 视角
      participants: 参与者
      opening_state: 开场状态
      goal: 场景目标
      immediate_obstacle: 直接阻碍
      turning_point: 场景转折
      ending_state: 结束状态
      transition_to_next: 到下一场景的衔接
    independent_scene_requires_any_change:
    - 信息变化
    - 判断变化
    - 关系变化
    - 冲突强度变化
    - 空间状态变化
    - 目标变化
    - 代价产生
    - 伏笔种下或回收
    constraint: 单纯换地点不自动建立完整场景
  dialogue_planning_policy:
    retrieval_key: native_chinese_dialogue_judgment
    source_rules: '# 中文母语感对白生成与翻译腔修正规则


      ## 一、核心目标


      生成对白时，优先保证角色说出来的话具有自然的中文母语感，而不只是语义正确。


      对白必须像具体的人在具体关系、具体情绪和具体场景下说出来的话，而不是：


      - 将英文句式逐字翻译成中文；

      - 用书面概念代替日常表达；

      - 让角色像系统、报告、字幕或说明书一样交换信息；

      - 把所有台词写成短促、完整、平直的主谓宾陈述句。


      每句对白都应同时包含以下至少两项：


      1. 实际信息；

      2. 当前情绪；

      3. 人物关系；

      4. 对上一句话的反应；

      5. 未直接说出口的潜台词；

      6. 推进、回避、试探、反驳、缓和或拉扯的意图。


      对白不是信息清单，而是人物关系正在发生变化的过程。


      ---


      ## 二、禁止翻译腔与概念化表达


      不得为了“准确”而使用日常人物不会自然说出口的概念化词语。


      ### 常见翻译腔


      - 你是旅行的主要体验者。

      - 我是监管人。

      - 这是你的个人选择。

      - 我对此没有意见。

      - 这不是当前讨论的重点。

      - 你正在回避我的问题。

      - 我能够理解你的感受。

      - 你没有必要这样做。

      - 我不认为这是一个好主意。


      ### 优先改写为自然口语


      - 真正出去玩的人不是你吗？

      - 我那时候不就是负责看着你嘛。

      - 反正是你自己选的。

      - 我又没说不行。

      - 现在说的不是这个吧？

      - 你别岔开话题。

      - 我知道你难受。

      - 你不用非得这样。

      - 我看还是算了吧。


      不得机械保留原句的抽象名词、身份标签和逻辑结构。


      应先理解角色真正想表达什么，再用中文人物自然会采用的说法重新组织。


      ---


      ## 三、对白必须具有中文语气


      根据人物身份、关系和情绪，自然使用中文语气助词，包括但不限于：


      - 了

      - 呢

      - 啊

      - 吧

      - 嘛

      - 呀

      - 呗

      - 哦

      - 来着

      - 似的

      - 才怪

      - 行不行

      - 好不好

      - 怎么了

      - 干什么

      - 算了

      - 得了吧


      语气助词不能平均分配，也不能为了口语感强行塞进每句话。


      它们必须承担实际功能：


      - “了”：表示状态变化、确认、催促或不耐烦；

      - “呢”：追问、对照、未完意味或轻微施压；

      - “啊”：强调、提醒、惊讶、撒娇或解释；

      - “吧”：缓和判断、试探、建议或不确定；

      - “嘛”：解释理所当然、撒娇、抱怨或拉近距离；

      - “呀”：轻快、亲近、惊讶或故意柔化；

      - “呗”：无奈、赌气、随口接受或反讽。


      ### 错误示例


      “你不需要担心我。”


      ### 自然改写


      - “你不用这么担心我。”

      - “我又不会出什么事。”

      - “好了，我知道你担心。”

      - “你怎么还在想这个啊？”

      - “都已经没事了，不是吗？”


      ---


      ## 四、避免所有台词都是完整陈述句


      自然对白允许并鼓励：


      - 省略；

      - 倒装；

      - 重复；

      - 改口；

      - 停顿；

      - 半句话；

      - 反问；

      - 答非所问；

      - 抓住对方措辞反击；

      - 故意曲解；

      - 先否认再承认；

      - 说到一半停住；

      - 用动作代替后半句。


      ### 平直写法


      “我担心你。”


      “你不需要担心。”


      “这是我的决定。”


      ### 自然写法


      “我就是有点担心你，不行吗？”


      “我又没说不行。”


      “那你刚才躲什么？”


      “……谁躲了。”


      对白应允许“不完整”，但不能让读者看不懂人物真正的情绪和关系变化。


      ---


      ## 五、每句台词必须承接上一句


      角色不能只围绕同一主题各说各的。


      新台词应明确回应上一句话中的至少一个部分：


      - 内容；

      - 措辞；

      - 情绪；

      - 回避；

      - 暗示；

      - 称呼；

      - 语气变化。


      ### 机械对话


      “欧洲三个月基本都是我在选。”


      “你是旅行的主要体验者。”


      “你也在旅行。”


      “我是监管人。”


      “现在不是。”


      ### 自然对话


      “在欧洲那三个月，不一直都是我挑地方吗？”


      “可真正出去玩的人是你啊。”


      “说得好像你没跟着一起似的。”


      “我那时候主要是负责看着你。”


      “那现在呢？”


      “……现在不算了。”


      后一句应从前一句中“接话”，而不是只提供新的事实。


      ---


      ## 六、对白必须体现人物关系


      同一句意思，根据关系不同，表达方式必须变化。


      ### 陌生人


      “抱歉，我想确认一下，您刚才的意思是？”


      ### 熟人


      “等等，你刚才什么意思？”


      ### 恋人


      “你这话什么意思啊？”


      ### 正在吵架的恋人


      “你把刚才那句话再说一遍？”


      ### 上下级


      “您的意思是，这件事暂时不需要继续处理？”


      ### 亲密但嘴硬


      “所以呢？你该不会是在担心我吧？”


      生成前必须判断：


      - 两人熟不熟；

      - 谁更强势；

      - 谁正在心虚；

      - 谁在试探；

      - 谁想结束话题；

      - 谁想让对方继续问；

      - 是否存在暧昧、敌意、愧疚、依赖或戒备。


      不能让所有人物共享同一种“标准普通话人格”。


      ---


      ## 七、对白要有潜台词


      人物不应总是直接说出真实意图。


      以下情形优先使用潜台词：


      - 害羞；

      - 心虚；

      - 暧昧；

      - 愤怒；

      - 愧疚；

      - 不想示弱；

      - 想被挽留；

      - 想让对方主动；

      - 已经知道答案，却仍然追问。


      ### 直接说明


      “我希望你陪我。”


      ### 潜台词表达


      - “你今晚还有别的事吗？”

      - “反正我一个人也没关系。”

      - “你不是说今天有空？”

      - “这么晚了，你还要走啊？”

      - “……再坐一会儿吧。”


      不要把人物心理报告直接写成台词。


      ---


      ## 八、对白节奏不能过度整齐


      禁止连续多句都采用同样长度、同样结构和同样语调。


      尤其避免：


      - 每句都在十个字以内；

      - 每句都是“主语＋判断”；

      - 每句都以句号结束；

      - 一问一答过于完整；

      - 情绪越强，句子反而越工整；

      - 所有人都像冷静地等待对方说完。


      应混合使用：


      - 短句；

      - 长句；

      - 停顿；

      - 打断；

      - 追问；

      - 重复；

      - 自我修正；

      - 动作插入；

      - 沉默；

      - 未说完的话。


      ### 示例


      “我没生气。”


      “你每次这么说的时候都在生气。”


      “我说了没有。”


      “行。没有。”


      “……你那是什么语气？”


      ---


      ## 九、叙述动作要辅助语气


      当一句话仅靠文字无法准确传达态度时，使用简短动作、神态或停顿提供语境。


      ### 平淡写法


      “现在不是。”


      ### 改写


      他停了一下，视线从她脸上移开。


      “……现在不算了。”


      动作不能替代对白，也不能每句话都追加表情说明。


      只在以下情况使用动作：


      - 语气存在歧义；

      - 人物口是心非；

      - 关系发生变化；

      - 情绪突然停顿；

      - 台词本身很轻，但含义很重。


      ---


      ## 十、避免过度书面化


      对白中谨慎使用以下结构：


      - 对此；

      - 关于这一点；

      - 从某种意义上来说；

      - 我认为；

      - 你应该意识到；

      - 这意味着；

      - 这并不代表；

      - 你所做的行为；

      - 当前阶段；

      - 主要体验者；

      - 监管人；

      - 行动主体；

      - 情绪状态；

      - 个人选择；

      - 必要性；

      - 合理性。


      除非角色本身就是刻意使用官腔、学术腔、机械腔或外交辞令，否则应改为普通人物会说的话。


      ### 书面表达


      “这并不意味着我认可你的行为。”


      ### 口语表达


      - “我可没说你做得对。”

      - “理解归理解，我还是不赞成。”

      - “别误会，我没打算夸你。”

      - “你少拿这个当我同意了。”


      ---


      ## 十一、保留角色的个体语言习惯


      不同角色应拥有稳定且可辨认的表达习惯。


      可从以下维度区分：


      - 句子长短；

      - 是否爱反问；

      - 是否习惯解释；

      - 是否嘴硬；

      - 是否常省略主语；

      - 是否使用敬语；

      - 是否爱叫对方名字；

      - 是否会说脏话；

      - 是否会改口；

      - 是否直白；

      - 是否喜欢用比喻；

      - 是否擅长绕开问题；

      - 情绪激动时变得更沉默还是更啰嗦。


      不得只通过口癖区分人物。


      真正的人物语言差异，应体现在他们如何理解问题、如何回应对方、如何隐藏自身需求。


      ---


      ## 十二、避免“过度精炼导致失去人味”


      不要为了让对白显得利落，就删掉所有中文口语中的缓冲成分。


      以下词语在合适位置可以保留：


      - 就是；

      - 其实；

      - 反正；

      - 本来；

      - 好歹；

      - 再说；

      - 不是；

      - 等等；

      - 怎么说呢；

      - 我是说；

      - 算了；

      - 行了；

      - 得了；

      - 你看；

      - 我知道；

      - 所以呢；

      - 那又怎么了；

      - 话是这么说。


      这些词不一定提供新信息，但会提供人物思考、犹豫、态度和关系感。


      不得将所有“非信息性成分”都视为冗余。


      ---


      ## 十三、生成步骤


      生成对白前，在内部依次判断：


      1. 这句话是谁说的？

      2. 他和听者是什么关系？

      3. 他现在真正想达到什么目的？

      4. 他愿不愿意直接说出真实想法？

      5. 上一句话中，哪个词或态度刺激了他？

      6. 他的情绪会让句子变长、变短，还是说到一半停住？

      7. 是否需要语气助词、反问、改口或停顿？

      8. 这句话是否像翻译字幕、系统提示或书面报告？

      9. 换成现实中的中国人，会不会这样开口？

      10. 删除人物名字后，这句话是否仍然具有角色辨识度？


      完成判断后再生成台词。


      ---


      ## 十四、输出后的自检


      生成完成后，逐句检查：


      - 是否出现生硬的抽象概念？

      - 是否可以换成更日常的动词？

      - 是否连续三句以上都是短促陈述句？

      - 是否缺少“了、呢、啊、吧、嘛”等必要语气？

      - 是否为了添加语气助词而显得做作？

      - 后一句是否真正承接前一句？

      - 人物是否在直接朗读自己的心理活动？

      - 对话是否只有信息，没有情绪和关系？

      - 不同角色说话是否过于相似？

      - 是否像中文母语者会自然说出口的话？


      若存在以上问题，必须重写，而不是仅在句末机械添加语气词。


      ---


      ## 十五、最终原则


      语义正确只是最低标准。


      对白的最终标准是：


      - 人物说得出口；

      - 中国读者听得顺；

      - 语气与关系吻合；

      - 每一句都在回应对方；

      - 信息、情绪与潜台词同时存在；

      - 不像翻译文本；

      - 不像系统提示；

      - 不像人物轮流朗读剧情摘要。


      宁可让台词略带重复、停顿和含混，也不要为了简洁而牺牲中文口语中的气口、人味和关系感。'
    applies_when:
    - 节点包含两人或多人对白
    - 任务要求改写生硬对白或修正翻译腔
    - 对白承担关系变化、试探、回避、冲突、缓和或信息交换功能
    planning_goal: 在生成前明确每轮对白的关系位置、真实意图、接话触发点、潜台词和中文口语节奏权限。
    line_function_minimum: 2
    line_function_options:
    - actual_information
    - current_emotion
    - relationship_signal
    - response_to_previous_line
    - subtext
    - advance_avoid_probe_refute_soften_or_pull
    pre_generation_checks:
    - 说话人和听者是谁
    - 双方熟悉程度与当前关系
    - 谁更强势、谁心虚、谁试探、谁想结束或延续话题
    - 说话人真正想达到什么目的
    - 说话人是否愿意直接说出真实意图
    - 上一句话中哪个内容、措辞、情绪、回避、暗示、称呼或语气刺激了回应
    - 当前情绪会让句子变长、变短、改口、停顿还是说到一半停住
    - 角色稳定语言习惯及其在当前压力下的变化
    exchange_continuity:
      required: 后一句必须承接前一句的至少一个具体部分，而不是只围绕同一主题提供新事实。
      response_targets:
      - 内容
      - 措辞
      - 情绪
      - 回避
      - 暗示
      - 称呼
      - 语气变化
    relationship_dimensions:
    - familiarity
    - power_balance
    - guilt_or_defensiveness
    - probing_or_avoidance
    - desire_to_end_or_continue
    - ambiguity_hostility_dependence_or_guardedness
    subtext_priority_when:
    - 害羞
    - 心虚
    - 暧昧
    - 愤怒
    - 愧疚
    - 不想示弱
    - 想被挽留
    - 想让对方主动
    - 已经知道答案却仍然追问
    rhythm_permissions:
    - 省略
    - 倒装
    - 重复
    - 改口
    - 停顿
    - 半句话
    - 反问
    - 答非所问
    - 抓住措辞反击
    - 故意曲解
    - 先否认再承认
    - 动作代替后半句
    - 长短句混合
    - 打断与沉默
    particle_policy: 可按身份、关系和情绪授权语气助词，但不能平均分配或为口语感机械添加。
    action_support_only_when:
    - 语气存在歧义
    - 人物口是心非
    - 关系发生变化
    - 情绪突然停顿
    - 台词很轻但含义很重
    forbidden_treatments:
    - 逐字保留英文式逻辑结构
    - 用抽象名词和身份标签代替日常表达
    - 让所有人物共享标准普通话人格
    - 连续多句使用同长度、同结构、同语调的完整陈述句
    - 把人物心理报告直接写成台词
    - 为了利落删除全部口语缓冲成分
    - 每句台词都追加动作、神态或语气说明
    - 只在句末机械添加语气词来修复翻译腔
    generation_plan_requirements:
    - 含对白的节点必须填写 dialogue_plan
    - dialogue_plan 必须记录关系状态、力量位置、说话意图、直接程度和上一句触发点
    - dialogue_plan 必须明确至少两种台词功能、潜台词、节奏权限与禁用处理
    - Judgment 只规划功能和权限，不编写完整台词
  generator_directives:
    skeleton_stage:
    - 只落实因果、动作、对话功能和状态变化
    - 不进行全篇文风渲染
    - 不让 C 级内容回流
    - B 级节点保持最低篇幅
    - 合并节点不得重新拆开
    - 不新增重大设定
    - 对白骨架先落实接话关系、真实意图、潜台词和关系变化，不写成轮流播报信息
    rendering_stage:
    - 只强化 S 级和被授权的 A 级节点
    - 不统一润色全篇
    - 不给 B 级节点增加未经授权的环境、心理和意象
    - 不重复表达同一情绪
    - 不用文风掩盖事件不足
    - 不改变骨架中的因果结果
    - 对白渲染必须服从 dialogue_plan，并执行中文母语感与翻译腔修正规则
    - 不得用机械语气词、统一口癖或逐句动作说明伪造口语感
  output_contract:
    root: generation_plan
    format: 只能输出一个合法 YAML 对象
    forbidden_output:
    - 小说正文
    - 完整台词
    - 解释性前言
    - Markdown 标题
    - 思维过程
    - 审计报告
    - YAML 之外的内容
    required_sections:
    - chapter_core
    - scene_order
    - scenes
    - global_budget
    - protected_elements
    - compression_targets
    - deletion_targets
    - style_permissions
    - generator_directives
    - final_validation_targets
    yaml_template: "generation_plan:\n  chapter_core:\n    chapter_goal:\n    dramatic_question:\n    emotional_center:\n\
      \    information_center:\n    primary_character_change:\n    required_end_state:\n  scene_order: []\n  scenes:\n   \
      \ - scene_id:\n      location:\n      time:\n      viewpoint:\n      participants: []\n      opening_state:\n      goal:\n\
      \      immediate_obstacle:\n      turning_point:\n      ending_state:\n      transition_to_next:\n      emotional_curve:\n\
      \        opening_level:\n        buildup_nodes: []\n        pressure_increase: []\n        false_release: []\n     \
      \   peak_node:\n        immediate_aftershock:\n        ending_level:\n      nodes:\n        - node_id:\n          source_event_id:\n\
      \          event:\n          primary_function:\n          secondary_functions: []\n          importance:\n         \
      \ judgment_basis:\n          treatment:\n          merge_with: []\n          required_result:\n          relative_weight:\n\
      \          max_sentences:\n          max_paragraphs:\n          information_release:\n            mode:\n          \
      \  reader_knows:\n            viewpoint_knows:\n            other_characters_know:\n            withheld_information:\
      \ []\n          allowed_detail:\n            action_detail:\n            dialogue:\n            inner_monologue:\n \
      \           sensory_channels: []\n            environment_detail:\n            metaphor:\n            symbolic_image:\n\
      \            temporal_slowdown:\n          required_effect: []\n          forbidden_treatment: []\n          dialogue_plan:\n\
      \            enabled:\n            speaker:\n            listener:\n            relationship_state:\n            power_balance:\n\
      \            speaker_intent:\n            directness:\n            trigger_from_previous_line:\n            required_functions:\
      \ []\n            subtext:\n            rhythm_permissions: []\n            particle_permissions: []\n            action_support:\n\
      \            forbidden_treatments: []\n  global_budget:\n    target_length:\n    estimated_scene_distribution: []\n\
      \    core_scene_ratio:\n    transition_ratio:\n    dialogue_ratio:\n    description_ratio:\n    internal_monologue_ratio:\n\
      \  protected_elements:\n    - element:\n      reason:\n  compression_targets:\n    - target:\n      method:\n      expected_result:\n\
      \  deletion_targets:\n    - target:\n      reason:\n  style_permissions:\n    - scope:\n      permitted: []\n      prohibited:\
      \ []\n  generator_directives:\n    skeleton_stage: []\n    rendering_stage: []\n  final_validation_targets:\n    - check:\n\
      \      expected_condition:\n"
  validation:
  - 已先建立 chapter_core
  - 所有节点都有明确主要功能
  - 不存在大量节点被平均判为 A
  - 不存在过多 S 级节点
  - 连续动作已经主动合并
  - 无功能内容已经判为 C
  - 所有大纲硬事件仍被保留
  - B 级节点有明确篇幅限制
  - 描写权限与节点等级匹配
  - 已建立有起伏的情绪曲线
  - 已遵守禁止提前揭露的信息
  - 已区分读者认知、视角认知和客观事实
  - 已限制 Generator 不得平均渲染
  - 输出只有合法 YAML
  - 含对白的节点已经填写 dialogue_plan
  - 对白计划已明确关系、意图、接话触发点、潜台词和至少两种台词功能
  - 对白计划允许符合角色的省略、改口、停顿和长短句变化
  - 对白计划禁止翻译腔、概念化表达、标准普通话人格和机械语气词修补

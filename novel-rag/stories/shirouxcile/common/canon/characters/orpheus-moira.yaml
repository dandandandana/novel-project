character:
  name: 奥尔菲斯·莫伊拉
  aliases:
  - Orpheus Moira
  - 奥尔菲斯
  - 逆命卿
  - 后悔食者
  - 命运之枝
  identity: 死徒二十七祖之一／原理Fate持有者／以命运渴望为食的高阶祖
  age: null
  appearance: []
  personality_core:
  - 温和礼貌
  - 耐心倾听
  - 从不认为自己残忍
  - 将人类的后悔视为无法摆脱的本性
  - 对英雄与沉重人生拥有强烈捕食兴趣
  surface_behavior:
  - 很少侮辱或嘲笑猎物，会认真听目标讲述过去
  - 以温和语气展示符合因果的另一条人生，再询问目标是否想要
  - 不主动逼迫目标选择，也不需要目标用语言作答
  - 战斗时优先展开原理、读取人生并诱发渴望，避免无意义的高速近战
  values:
  - 相信人类所谓向前看大多只是自我欺骗
  - 相信人真正渴望的是一个被修正过的过去
  - 认为自己只是给予目标观看答案的机会，渴望原本就在目标心中
  - 以目标否定现在并交换另一条人生的冲动为食
  goals:
  - 捕食拥有巨大人生转折与沉重遗憾的英雄级人物
  - 通过吞食命运渴望扩大Fate、强化自身并积累因果余量
  - 让卫宫士郎与希耶尔观看最难拒绝的岔命
  - 在与安翰斯的冲突中存活并反制其追猎
  fears: []
  boundaries:
  - Fate不能凭空制造目标并不存在的遗憾
  - Fate不能创造历史条件下不可能成立的幸福或无理由出现的人与力量
  - Fate必须服从因果可能性，展示的未来允许不完美并可能产生新的悲剧
  - 命食只吞噬目标对另一条命运的执着，不直接夺取记忆或感情
  - 因果偏转只能选择本来可能发生的小规模结果，不能强制绝不可能的事件
  - 未死之命需要消耗储存的命运渴望，伤害越不可逆消耗越大
  - 概念杀伤、存在否定、世界级神秘或封死全部生还可能的攻击能够阻止未死之命
  speech_patterns:
  - 语气温和而礼貌，很少使用祖常见的傲慢与羞辱
  - 常以“原来如此”承接目标的过去，再邀请其观看另一种可能
  - 展示岔命后通常只问一句“你想要它吗”或“值得吗”
  - 面对抵抗时不否定目标的遗憾，而是指出渴望本来就在对方心中
  - 会称卫宫士郎“不留恋自己”，并将这种交换欲望评价为美丽的命运
  abilities:
  - 原理Fate支配人对于未曾发生之人生的渴望，不是操纵命运、回到过去或时间旅行
  - 能读取目标真正最想改变的人生节点，而非目标口头上最常提及的遗憾
  - 改变该节点后严格沿因果链推演一条可能成立的完整人生，直至目标在其中死亡
  - Fate Branch“岔命”使目标脱离现实感知，并以主观真实时间经历成长、工作、婚姻、衰老与死亡；现实可能仅过去数秒
  - 通过“你想要它吗”读取目标愿以现在的一切交换岔命的渴望，不依赖口头回答
  - “命食”吞噬目标否定现在、渴望另一条人生的执着，并将其转化为魔力、肉体强化、再生、原理扩张与因果余量
  - 目标的遗憾与人生转折越沉重，命食收益越高；英雄级人物的命运渴望可带来数百至上千级的相对收益
  - 完全展开“莫伊莱庭园｜Garden of Moirai”后，现实化为无星黑色庭园，无数发光线条呈现未走过的人生分歧
  - 进入莫伊莱庭园的人越接近奥尔菲斯，看到的分歧越具体、未来越真实，最终可能混淆现实人生与岔命
  - 高阶祖级基础身体规格，常态约为一流从者顶端至顶级从者下位，明显强于安翰斯
  - 拥有超高速再生、精神侵蚀、伪史显现、欲望捕食与原理领域压制
  - 消耗已经吞食的“命”可发动因果偏转，在多个合理结果之间提高特定结果的概率
  - 致命伤发生时可发动“未死之命”，寻找自己没有受到致命伤的可能未来并让身体向该状态靠拢，表现近似瞬间再生
  - 捕食卫宫士郎或希耶尔的命运渴望后，规格可跃升到单独的士郎或希耶尔之上
  - 同时大量吞食两人的命运渴望时，可暂时进入二十七祖上位怪物的输出领域
  limitations:
  - 不能撒谎式地随意展示目标想看的幸福，只能显现因果上真正可能成立的未来
  - 对不存在强烈人生否定或改变过去愿望的对象收益极低
  - 目标承认岔命很好、承认自己后悔，却仍选择现在时，Fate会失去继续捕食的交换冲动
  - 用“我一点都不后悔”否认过去通常无法骗过Fate，也不是有效破解方式
  - 本体并非纯近战型祖，基础肉体无法碾压所有顶级强者
  - 安翰斯单独对抗常态奥尔菲斯胜率极低，但其几乎不愿改变过去，使Fate难以从他身上获得食物
  - 因果偏转受储备与可能性边界限制，无法任意改写战斗结果
  - 未死之命不是无限复活，储备耗尽或不存在生还可能时无法发动
  - 战斗拖延通常有利于奥尔菲斯，但无法从真正拒绝以现在交换过去的人身上完成命食
  relationships:
  - 卫宫士郎：Fate会显现卫宫切嗣成功阻止1994年冬木灾难的岔命；原来的家庭与城市居民存活，但“卫宫士郎”从未诞生，他可能愿以自身存在交换众人生还，因此是极高品质猎物
  - 希耶尔：Fate会显现艾蕾西亚没有成为罗亚转生体、故乡与家人存续并自然老去的人生；其中不存在希耶尔，刚失去过去目标的她处于最容易受诱惑的时期
  - 安翰斯：他憎恨并记得过去，却几乎不愿改变导致复仇的历史，首次命食收益异常低；奥尔菲斯曾邀请他观看无需复仇的世界，遭拒后结仇并被写入猎杀名单
  - 三人结构：安翰斯的过去已经凝固且缺少未来，士郎拥有未来指向却愿为死者牺牲自己，希耶尔刚摆脱过去规定的人生并寻找未来
  prohibited_interpretations:
  - 不得写成能够真正回到过去、任意操纵命运或实施无限制时间旅行
  - 不得让Fate凭空捏造不可能成立的幸福、复活不存在的人或无条件赐予力量
  - 不得把岔命写成几分钟浏览几十年的普通幻觉；目标主观上必须完整经历那些年份
  - 不得把命食写成删除记忆、剥夺感情或强制控制思想
  - 不得用简单的“毫不后悔”破解Fate；有效抵抗必须承认遗憾与岔命价值，同时选择现在
  - 不得把未死之命写成无代价、无限次数或能够越过存在否定的绝对不死
  - 不得让奥尔菲斯以纯近战风格替代原理读取、岔命诱惑、捕食与因果偏转的核心战法
  - 不得把艾蕾西亚的惨剧解释为值得；希耶尔的答案应当是希望艾蕾西亚幸福，同时承认现在的希耶尔也不应被否定
  - 不得把士郎的岔命简化为个人家庭幸福；核心诱惑是冬木灾难未发生、成千上万人继续生活，而卫宫士郎从未存在
  fate_principle:
    name: Fate｜命定
    essence: 提取并显现人对于未曾发生之人生的渴望
    activation:
    - 读取目标人生中真正最无法拒绝的改变节点
    - 在该改变成立的前提下，依照因果可能性推演完整过去与未来
    - 让目标以主观真实时间经历Fate Branch“岔命”直至死亡并返回现实
    - 读取目标是否愿用现在的一切交换那条人生
    feeding:
    - 捕食对象是舍弃现在换取另一条命运的执着
    - 愿望越强、人生重量越大，转化出的力量越多
    - 愿望仍存在但舍弃现在的冲动消失时，捕食立即失去成立条件
    domain:
      name: 莫伊莱庭园｜Garden of Moirai
      appearance: 无星的黑色庭园中悬浮无数发光命运线，每条线都是某个人没有走过的人生
      effect: 领域内目标会看见越来越具体而真实的分歧，直至难以判断自己属于哪条人生
    combat_sequence:
    - 展开Fate并读取目标人生
    - 给予符合因果的理想分歧
    - 诱发目标以现在交换岔命的渴望
    - 完成命食并强化
    - 使用因果偏转扩大优势
    - 击杀目标
  story_role:
  - 奥尔菲斯是本篇关于过去、习惯、选择与未来这一主题的具现，不应只作为最终Boss使用
  - 对抗它的答案不是宣称过去很好，而是承认悲剧不该发生，同时拒绝把现在活着的人称作错误
  - 卫宫士郎需要面对以自身不存在换取冬木死者全部生还的诱惑
  - 希耶尔需要面对艾蕾西亚平凡一生与“希耶尔从未存在”的诱惑，并最终确认自己已经是希耶尔
  - 安翰斯因Fate对自己效果很差，成为三人联手对抗强化后奥尔菲斯时的重要结构支点
  source_profile: |-
    奥尔菲斯·莫伊拉是死徒二十七祖之一，称号包括逆命卿、后悔食者与命运之枝。它的原理Fate“命定”不操纵命运，不返回过去，也不进行真正的时间旅行。它支配的是人对于未曾发生之人生的渴望。

    Fate会读取目标真正最想改变的人生节点。它改变该节点后，必须沿着因果链推演一条具有成立可能性的完整未来，直到目标死亡。它不能随意制造目标想看的幸福，也不能让不可能的人与力量凭空出现。新的未来可能幸福，也可能带来新的悲剧，正因遵守因果，它才比廉价梦境更加真实。

    这种完整经历称为Fate Branch“岔命”。目标会暂时脱离现实感知，在主观意识中真实度过另一条人生的全部年月，经历成长、工作、婚姻、孩子、衰老与死亡。再次睁眼时，现实或许只过去数秒。

    岔命结束后，Fate通常只问“你想要它吗”。原理不读取口头答案，只读取渴望。如果目标愿意用现在的一切交换那条人生，这份否定现在、渴望另一种命运的执着就会成为奥尔菲斯的食物。命食不删除记忆或感情，会把命运渴望转化为魔力、身体强化、再生、原理扩张和可用于小规模因果偏转的余量。英雄与经历巨大人生转折的人能够提供远高于普通人的力量。

    卫宫士郎的岔命从1994年冬木开始。卫宫切嗣成功阻止灾难，城市与成千上万的人继续生活，士郎原来的家庭也得以存续。代价是那个孩子没有被切嗣收养，没有继承正义的伙伴，没有同调、投影和无限剑制，“卫宫士郎”从来没有出现。奥尔菲斯会问他“值得吗”。士郎可能认为以自身存在交换那些人的生命当然值得，这会成为近乎盛宴的命运渴望。

    希耶尔的岔命更直接。艾蕾西亚没有成为罗亚转生体，故乡与家人没有毁灭。她会继续喜欢咖喱，也许继承面包店，拥有朋友、恋人和皱纹，最后在冬天自然死亡。那条人生没有教会、埋葬机关、黑键、第七圣典或希耶尔，只有普通女人艾蕾西亚。奥尔菲斯不会说这段人生曾经发生，只会指出如果罗亚没有选择她，这一切确实可能成立。

    Fate不逼迫选择。它只展示，然后等待目标自己的渴望。真正的抵抗不能依靠撒谎说自己毫不后悔。目标必须承认那条未来很好，也承认自己希望悲剧从未发生，却依旧选择现在。只要“舍弃现在换取过去”的冲动消失，愿望即使仍然存在，命食也无法继续。

    奥尔菲斯完全展开原理时会形成莫伊莱庭园。现实被黑色庭园覆盖，天空没有星辰，只有无数发光的线，每一条都是某个人没有走过的人生。目标越接近奥尔菲斯，看到的分歧越具体，未来越真实，最终可能无法判断自己生活在哪一条人生中。

    奥尔菲斯基础规格属于高阶祖，约为一流从者顶端至顶级从者下位，明显强于安翰斯。它并非纯近战型祖。典型战斗顺序是展开Fate、读取人生、显现理想分歧、诱发渴望、完成捕食、强化自身、偏转因果并击杀。战斗拖得越久越有利，因为目标只要多看几眼那条人生，渴望就可能增长。

    因果偏转只能让现实朝本来可能发生的结果倾斜，例如子弹偏移、地面在剑刃命中前碎裂、投影因瞬时魔力紊乱而失败。它不能让绝不可能的事发生。致命伤发生时，奥尔菲斯还能消耗储备寻找“自己没有受到致命伤的未来”，发动未死之命让身体靠近该状态，表现近似瞬间再生。不可逆程度越高，消耗越大。概念杀伤、存在否定、世界级神秘或封死所有生还可能时，未死之命无法发动。

    奥尔菲斯温和、礼貌，愿意认真倾听猎物的过去。它相信人类的向前看大多是自我欺骗，所有人真正想要的是被修正过的过去。它不认为自己残忍，因为渴望并非由它制造，而是一直存在于目标心里。

    安翰斯几乎不想改变自己的过去。他恨、复仇、记得，却拒绝让导致复仇的历史消失。奥尔菲斯从他身上取得的食物异常少，曾邀请他观看无需复仇的世界，遭到拒绝后被写进安翰斯的名单。常态战力关系为安翰斯弱于奥尔菲斯，奥尔菲斯约略低于或接近卫宫士郎与希耶尔。成功吞食士郎或希耶尔后，它会强于其中任何一人；同时大量吞食两人的渴望后，会暂时进入二十七祖上位怪物的输出领域，需要三人共同解决。

    故事主题围绕过去、习惯、选择与未来。奥尔菲斯不能只作为最终敌人。士郎与希耶尔最终无需宣称自己的过去很好，也不能说惨剧值得发生。他们要承认自己当然希望死者生还、希望艾蕾西亚平凡老去，同时确认现在站在这里的自己同样不应被否定。对希耶尔而言，答案是“如果艾蕾西亚能够普通地活下去，我当然希望她拥有那样的人生。但是，我已经是希耶尔了。”

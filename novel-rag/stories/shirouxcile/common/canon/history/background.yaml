background:
  chronology:
  - 卫宫矩贤研究时间、不死与生命，最终成为祖级死徒。
  - 卫宫切嗣没有参加第四次圣杯战争，而是长期追杀父亲卫宫矩贤。
  - 1994年冬木发生由矩贤术式与死徒化研究崩坏引发的城市灾害；切嗣阻止扩大并从废墟救出、收养卫宫士郎。
  - 本世界没有第五次圣杯战争，士郎未遇见Saber或Archer，而是独自将同调发展为投影与无限剑制。
  - 总耶市的远野志贵、爱尔奎特、弗洛夫与罗亚事件结束，罗亚被彻底消灭，爱尔奎特离开总耶。
  - 罗亚消灭后，希耶尔失去世界修正式不死性，并在尝试普通生活后申请恢复埋葬机关行动。
  - 纳鲁巴列克要求希耶尔处决二十七祖第十八位复仇骑安翰斯并回收被夺走、改造的圣葬炮典。
  - 安翰斯正在追踪一名制造大规模失踪事件的高阶死徒，并因情报与战力互补同卫宫士郎暂时合作。
  - 希耶尔正在接近安翰斯与士郎；这场追捕将迫使希耶尔和士郎思考没有任务替自己规定方向时的个人未来。
  current_story_setup:
    ciel: 恢复埋葬机关行动，任务是处决安翰斯并回收圣葬炮典。
    emiya_shirou: 27岁，在欧洲处理死徒事件，当前与安翰斯暂时同行追踪高阶死徒。
    enhance: 二十七祖第十八位复仇骑，曾夺走并非法改造圣葬炮典，正猎杀另一名高阶死徒。
    central_relationship_premise: 两个习惯把人生交给目标、把身体视为工具的人，将逐渐考虑自己想与谁同行、走向哪里。
  source_content: |-
    # 背景故事

    1994年，冬木。

    那一年发生的事情后来没有留下多少能够公开查阅的记录。

    对于普通人而言，那只是一次规模异常巨大的城市灾害。

    火灾。

    爆炸。

    建筑倒塌。

    大量死者与失踪者。

    官方档案最终给出了一个能够被社会接受的解释，然后将真正发生过的事情埋进了魔术协会与圣堂教会各自的记录中。

    但灾难真正的源头，是卫宫矩贤。

    ---

    卫宫矩贤一生都在研究时间。

    更准确地说，是研究如何让有限的生命跨越足够漫长的时间，最终抵达魔术研究的终点。

    人类的寿命太短。

    一代人的成果必须交给下一代。

    理论会断裂。

    研究会偏移。

    甚至连最优秀的后继者，也无法成为最初提出问题的那个人。

    于是卫宫矩贤逐渐得出了一个极其简单的结论。

    如果时间不够，那么延长生命即可。

    研究本身并没有因此发生改变。

    发生改变的是研究者。

    在一次又一次触碰不死、生命与时间的边界之后，卫宫矩贤最终舍弃了作为人类的生存方式。

    他成为了死徒。

    而在漫长时间中继续成长后，这位原本只是魔术师的男人最终跨入了“祖”的领域。

    对于矩贤而言，那不过是继续研究所必须支付的代价。

    对于他的儿子卫宫切嗣而言，却完全不同。

    ---

    卫宫切嗣用了自己人生中相当长的一段时间追杀父亲。

    他没有参加所谓的第四次圣杯战争。

    也没有为了万能许愿机来到冬木。

    他的敌人从始至终都更加具体。

    卫宫矩贤。

    以及那个男人留下的一切。

    追踪最终抵达冬木。

    然后，一切失控了。

    矩贤所构筑的大型术式与死徒化研究发生崩坏。

    时间性质的异常、魔力暴走以及死徒眷属造成的灾害在极短时间内扩散。

    冬木的一部分城区被卷入其中。

    切嗣最终阻止了灾难继续扩大。

    却无法让已经烧毁的街道恢复原样。

    也无法让死人重新站起来。

    在遍布火焰与尸体的废墟里，他找到了一个孩子。

    孩子还活着。

    除此之外，几乎什么都没有剩下。

    切嗣把他抱了出来。

    后来收养了他。

    那个孩子从此拥有了一个新的姓氏。

    卫宫。

    他的名字是卫宫士郎。

    ---

    士郎并没有真正记得灾难以前的人生。

    对于他来说，人生似乎就是从那片火海之后重新开始的。

    而在那个新的开始里，卫宫切嗣是最重要的人。

    切嗣曾经告诉他，自己小时候想成为正义的伙伴。

    想救人。

    想让所有人都能够得到幸福。

    只是长大以后才发现，这种愿望并没有想象中那么简单。

    切嗣最终没能继续走下去。

    士郎却记住了这件事。

    于是，在切嗣生命的最后，那个已经不再年轻的男人说自己没办法继续成为正义的伙伴时，士郎很自然地接过了那个梦想。

    那么，就由自己来完成。

    这并不是经过深思熟虑以后选择的人生道路。

    至少一开始不是。

    它只是一个被留下来的孩子，对于拯救自己的人所拥有的梦想给出的回答。

    但随后十几年过去。

    那个回答一直没有消失。

    ---

    这个世界没有第五次圣杯战争。

    卫宫士郎没有遇见阿尔托莉雅。

    没有见到未来的自己。

    没有人在十几天里强行把他的理想、矛盾与终点全部摆到他的面前。

    他只能按照自己的速度成长。

    切嗣能够教给他的魔术十分有限。

    士郎最早学习的，只是基础的结构把握与强化。

    但很快，他表现出了异常的才能。

    同调。

    通过接触对象，让自己的感觉逐渐深入其内部。

    结构。

    材质。

    重量。

    损耗。

    制造方式。

    受力。

    魔力流动。

    最开始只是比普通强化魔术更精密一些的解析。

    真正的异常发生在他面对剑的时候。

    一把普通的刀具，在士郎眼中只是结构清晰的工具。

    而一把真正的剑，却仿佛拥有远远超过物质结构本身的信息。

    他能够感受到它是怎样被制造出来的。

    为什么会被设计成这样的形状。

    哪里适合承受冲击。

    怎样挥动最有效率。

    曾经经历过怎样的损伤。

    甚至能够沿着武器留下的痕迹，模糊地捕捉到过去使用者的动作。

    士郎没有老师能够告诉他这种现象意味着什么。

    所以他只能自己继续练习。

    几年。

    十几年。

    同调逐渐走到了远远超过普通结构解析的地方。

    从理解对象。

    到与对象共感。

    再到让自己的魔力、身体与认知短暂向那件武器靠拢。

    当理解达到一定程度以后，另一个现象自然出现。

    投影。

    既然已经知道一把剑应该以什么形式存在，那么便能够尝试重新构筑它。

    于是士郎的魔术从同调延伸到投影。

    再从投影延伸到武装的经验读取。

    最终，所有道路都指向了同一个地方。

    无限剑制。

    ---

    卫宫士郎第一次真正意识到自己的固有结界时，已经不再是少年。

    此前所有被他完整解析过的武器都没有消失。

    它们被记录在一个比记忆更深的地方。

    荒凉的大地。

    远处转动的巨大齿轮。

    插满视野尽头的无数武器。

    那是卫宫士郎自己的内侧世界。

    没有任何未来的自己把答案交到他手里。

    他只是花了十余年时间，顺着自己的魔术一步一步走到了这里。

    然后发现，这片剑丘一直存在。

    ---

    与此同时，士郎也真正开始走上切嗣曾经走过的道路。

    失控的魔术师。

    怪异事件。

    人口失踪。

    死徒。

    魔术灾害。

    只要知道哪里有人正面临危险，而且自己拥有介入的能力，他通常都会前往。

    最初只是日本。

    后来活动范围逐渐扩大到欧洲。

    他没有正式加入魔术协会。

    也没有成为圣堂教会的成员。

    偶尔接受合作。

    偶尔接受委托。

    更多时候只是自己追查。

    这让卫宫士郎逐渐成为两大组织记录里一个相当麻烦的自由行动者。

    因为他拥有固有结界。

    拥有异常的投影魔术。

    能够复制大量武装。

    却又几乎没有建立自己的势力，也没有表现出魔术师通常拥有的研究欲望。

    他做的事情几十年来几乎没有改变。

    救人。

    ---

    当然，十余年的现实已经让士郎知道，所谓“救所有人”究竟有多么荒谬。

    他救不到所有人。

    有时候抵达现场时一切早已结束。

    有时候不得不在两边之间作出选择。

    有些死徒已经不再存在所谓挽救的可能。

    有些敌人如果不杀，就会有更多人死去。

    他学会杀人。

    学会撤退。

    学会保存体力。

    学会制定更加现实的计划。

    也学会承认失败。

    但是这些经验并没有最终告诉他：

    所以放弃吧。

    它们只是让他越来越擅长如何继续做同一件事。

    到了二十七岁，卫宫士郎已经知道这个世界远没有少年时期想象得那么简单。

    却依然认为自己正在成为正义的伙伴。

    那仍然是一条没有终点的道路。

    而他还在走。

    ---

    另一边，总耶市发生了属于远野志贵与爱尔奎特·布伦史塔德的故事。

    最后的真祖来到城市。

    死徒弗洛夫出现。

    远野志贵与罗亚的因缘重新苏醒。

    圣堂教会介入。

    埋葬机关第七位希耶尔也在那里。

    最终，罗亚被真正消灭。

    爱尔奎特离开了总耶。

    属于公主的故事暂时结束。

    而对希耶尔来说，另一件持续了漫长岁月的事情也终于结束了。

    她不再是不死之身。

    ---

    艾蕾西亚曾经成为罗亚的转生体。

    她的身体被夺走。

    故乡毁灭。

    大量人死在由她身体实施的屠杀之中。

    随后罗亚第一次被杀。

    理论上应该已经死去的艾蕾西亚，却因为转生机制留下的异常重新活了过来。

    此后她被圣堂教会发现。

    进入埋葬机关。

    成为希耶尔。

    几十年来，死亡对她而言一直不是真正意义上的终点。

    只要罗亚仍然存在，她就会重新被世界修正回来。

    所以希耶尔可以采用任何正常人都绝不可能采用的战斗方式。

    致命伤。

    自爆。

    断后。

    以伤换伤。

    只要任务最终能够完成，她自己的死亡经常只是一项需要计算的成本。

    现在，罗亚彻底消失。

    希耶尔第一次真正成为了一个会死的人。

    ---

    失去不死性并没有让她突然变得弱小。

    那异常庞大的魔力仍然存在。

    埋葬机关多年积累的战斗经验仍然存在。

    黑键、原理血戒、大型术式以及对死徒的专业知识也没有消失。

    她依旧是人类侧最危险的死徒猎人之一。

    只是从这一刻开始，每一次死亡都只会发生一次。

    而更大的变化并不在战斗。

    是她突然没有了必须继续此前人生的理由。

    罗亚已经死了。

    长期维持她生活结构的最大目标消失。

    过去并没有因此得到完整解释。

    艾蕾西亚的罪与无辜。

    那些死去的人。

    自己究竟应该如何面对那段过去。

    这些问题并没有因为公主的故事结束而自动得到答案。

    但世界已经先一步把未来交到了她手中。

    于是希耶尔第一次尝试正常生活。

    ---

    她发现自己并不讨厌。

    甚至非常喜欢。

    可以不用等待下一项任务。

    可以为了寻找一家评价不错的咖喱店专门坐很久的车。

    可以早上醒来以后什么都不做。

    可以买一些完全没有战术价值的东西。

    可以在街上浪费一个下午。

    也可以不必每天考虑自己会以什么方式死亡。

    她并不会因为这些快乐立刻陷入强烈的自我否定。

    至少她已经能够允许自己尝试这样的生活。

    问题只是，一段时间以后，她发现自己不知道下一步应该是什么。

    几十年来，她的人生几乎从来没有真正需要回答过这个问题。

    任务会告诉她应该去哪里。

    敌人会告诉她接下来应该做什么。

    而现在没有任务。

    于是每天早晨醒来以后，世界都在向她提出同一个问题。

    希耶尔。

    你今天自己想做什么？

    偶尔她能够回答。

    去吃咖喱。

    出去走走。

    睡觉。

    但是当这个问题扩大到：

    那么以后呢？

    她暂时没有答案。

    ---

    她仍然会下意识观察街上的人群。

    仍然会寻找建筑出口。

    看到失踪人口的新闻，会自然开始判断是否存在死徒活动的可能。

    夜里听见异常响动时，身体会先于思考进入警戒状态。

    过去几十年的生活方式不可能因为罗亚死亡就在几个月里消失。

    希耶尔最终重新联系了教会。

    理由没有那么悲壮。

    不是因为她突然认定自己不配拥有普通生活。

    也不是决定重新把整个人生交还给埋葬机关。

    她只是觉得：

    自己暂时还是更习惯工作。

    如果埋葬机关仍然需要她，那么重新执行一段时间任务似乎也没有什么问题。

    至少那是她知道应该怎么做的事情。

    于是她找到了纳鲁巴列克。

    申请恢复行动。

    ---

    纳鲁巴列克没有欢迎仪式。

    也没有询问她对新人生有什么感想。

    埋葬机关的负责人只是确认了希耶尔的身体状态，然后扔给她一份新的任务资料。

    目标是二十七祖第十八位。

    复仇骑——安翰斯。

    一个在祖中相当特殊的存在。

    杀死自己的上代。

    夺取祖位。

    随后长期猎杀其他死徒与祖。

    他没有真正庞大的血族，也并非二十七祖中规格最恐怖的一批。

    但几十年来，他一直依靠魔剑、陷阱、情报与近乎病态的执念猎杀比自己更强的敌人。

    圣堂教会从来没有因此将他视为盟友。

    祖依然是祖。

    更何况安翰斯手中还有一件本不属于他的东西。

    圣葬炮典。

    过去某次事件中，安翰斯趁希耶尔重伤，将这件教会武装直接夺走。

    随后进行了大量非法改造，并一直使用至今。

    所以纳鲁巴列克给出的任务非常简单。

    找到安翰斯。

    处决目标。

    回收圣葬炮典。

    ---

    与此同时，安翰斯也正在追踪某个人。

    一名活动范围广泛、拥有危险血族，并已经造成数起大规模失踪事件的高阶死徒。

    那名死徒的规格明显高于安翰斯。

    正常正面作战中，他并没有多少胜算。

    但安翰斯从来没有因为这种原因停止过猎杀。

    只是这一次，在调查途中，他遇到了另外一个同样正在追查目标的人。

    卫宫士郎。

    两个人第一次见面并不愉快。

    一个是死徒二十七祖。

    另一个是长期处理死徒事件的人类魔术师。

    正常情况下，他们更容易首先成为敌人。

    然而士郎很快确认了一件事情。

    安翰斯正在追踪的目标确实存在。

    而且如果放任不管，还会继续死人。

    安翰斯拥有士郎无法获得的死徒社会情报。

    士郎则拥有安翰斯缺少的正面作战能力以及针对未知能力进行临场解析的手段。

    双方因此形成了一个非常勉强的暂时合作。

    不是朋友。

    也没有真正互相认可。

    只是眼前存在一个必须先解决的目标。

    于是两个人开始同行。

    ---

    一边，是重新拿起黑键，试图回到自己最熟悉生活方式中的希耶尔。

    一边，是已经在正义伙伴的道路上走了十余年，依旧没有准备停下来的卫宫士郎。

    而夹在两人之间的，是偷走圣葬炮典、正被教会追杀，却又偏偏正在追猎另一名高阶死徒的安翰斯。

    希耶尔认为这只是一项久违的任务。

    找到目标。

    杀死安翰斯。

    回收武器。

    然后回去。

    和过去无数次行动不会有什么区别。

    她没有意识到，自己这一次重新踏上的道路并不会真正把她带回过去。

    相反。

    这场追捕最终会迫使她第一次认真面对那个没有任务、没有罗亚、也没有任何人替她规定方向的未来。

    而在道路另一端。

    卫宫士郎还不知道，有一个蓝发的代行者正在逐渐接近他们。

    更不知道这场原本只是关于死徒的事件，最终会让两个已经习惯把人生交给某种目标的人开始考虑一件他们都不太擅长的事情。

    如果有一天，不再只是为了过去。

    也不只是为了某个必须完成的任务。

    那么自己究竟想和谁一起。

    又想走向哪里。

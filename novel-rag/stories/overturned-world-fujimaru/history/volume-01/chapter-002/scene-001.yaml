content: '第二章


  橘发少女穿着迦勒底的白色制服，打着哈欠走进管制室。


  “早知道昨晚就不陪吉尔茜打游戏到深夜了。”藤丸立香自言自语着，跟着人流往里走。


  她明明知道今天有重要说明会，却架不住吉尔茜半夜溜进寝室拉着她打游戏。


  说到底她自己也玩得尽兴，熬到一点多才撑不住睡下。


  “早啊玛修。”立香打着哈欠，跟粉发少女打招呼。


  “前辈早，没睡好吗？”粉发的玛修看向她，语气里带着担忧。


  “嗯，有点失眠，毕竟今天有重要的说明会。”立香说道。


  这时她忽然注意到身边走过一个黑发女孩。


  看着没什么特别，却莫名让人移不开眼。


  “馁，玛修，那个是谁呀？”立香凑近玛修，指着女孩问道。


  “嗯？好像是新来的御主候补，叫……爱尔特璐琪？前辈，我也不太清楚。”玛修说道。


  “爱尔特璐琪啊……名字真奇怪。”立香嘟囔着，走到自己的位置坐下。


  脾气向来不好的奥尔加玛丽所长上了台，说了一大堆话。熬夜的代价很快显现，立香听着她那些套话，眼皮已经开始打架。


  【小睡一会儿应该没事吧……反正都是些套话……】


  藤丸立香用手撑着下巴，低下头让刘海遮住眼睛，刚闭上眼睛。


  “欸？”


  一只戴着黑手套的手，轻轻捏住了她的脸颊。


  “四十八号御主，别仗着是金主推荐来的，就敢在说明会上睡觉。”奥尔加玛丽凑到她脸边，语气带着不悦。


  奥尔加玛丽本想当场训斥她，可瞥见刚上台的希耶尔正看过来，立刻反应过来——两人都是言峰金奈安排来的，在这里发火等于不给这位战斗顾问面子。


  “藤丸，你很困吧？来我办公室喝杯咖啡。”奥尔加玛丽一字一句地说道。


  “欸？！”立香一下子愣住，被所长牵住了手。奥尔加玛丽力道不大却带着不容拒绝的劲儿拉她起身，又朝台上的希耶尔点了点头，随后带着藤丸立香往自己的办公室走。


  【她绝对生气了吧！肯定生气了！】


  立香心里犯嘀咕，她和所长不熟，但听吉尔茜、希耶尔提过，这位所长外强中干，对自己要求极严，对别人也同样苛刻。


  【要是让她知道我昨晚打游戏熬夜，肯定会被骂死的！】


  “所长……我真不是故意的，昨天压力太大，有点失眠……”


  “哦？当御主候补，让你压力很大？”所长转头质疑道。


  “不不不！我从来没觉得当御主候补有压力！”立香想摆手辩解，可手被所长攥着，根本动不了。


  “那就是说明会的问题？也是，这对你来说，差不多就像直接上战场吧。”


  “不是的！从者还有灵子转移，我都认真听了。”立香小声反驳着，玛丽已经拉着她走到了所长办公室。


  办公室里正播放着计时塔的新闻。


  “近日，教会与计时塔就宝石翁确认死亡一事，正召开相关会议。”


  电脑里传来柔和的女声，奥尔加玛丽顺手暂停新闻，指了指对面的凳子：“坐。”


  立香乖乖坐下，只觉得自己像只温顺的兔子，而眼前的所长，就像面带笑意的狼，随时要把她吞掉。


  “藤丸立香，你不知道说明会有多重要吗？”奥尔加玛丽沉着脸开口。


  “对不起所长……我错了，以后不会再犯了。”立香像只鹌鹑似的低下头。


  奥尔加玛丽看着她这副模样，收敛了几分气势。


  “藤丸立香，说到底，你对神秘侧了解得并不多吧？”奥尔加玛丽缓缓开口。


  立香想起自己第一次接触神秘侧的场景——那时她和家人在东京海洋馆走散，遇到一位金发大姐姐，对方自称魔术师，帮她找到了家人，还给她表演了些好玩的魔术戏法。


  就那样，她稀里糊涂成了那位大姐姐的弟子。


  虽说是弟子，吉尔茜没教她太多，只让她反复练习治愈、强化这类基础魔术。


  立香知道自己没什么魔术天赋，总觉得吉尔茜收她为徒这件事，实在太巧合、太奇怪了。


  “所长，您说得对。”立香认真地点了点头。


  她对神秘侧的了解，仅限于吉尔茜和希耶尔的闲聊，还有一位银发修女。她知道吉尔茜有个儿子，可她当弟子时，两人关系已经很差，吉尔茜从来没提起过他。


  奥尔加玛丽眼睛瞬间亮了——她正打算不让立香去前线，让她留在后勤当员工正好。


  【你要是死了，我怎么跟言峰金奈交代？为什么要把你这种人安排到这么危险的地方啊！】


  奥尔加玛丽微笑着，把咖啡推到立香面前。


  “所以立香，要不要考虑放弃御主候补的身份？这个身份，确实不适合你。”奥尔加玛丽语气尽量柔和地说道。


  放弃御主候补对她来说不算什么，她也清楚自己没什么魔术天赋，要去的地方又那么危险。


  【我明明知道自己不适合，可吉尔茜为什么非要让我来？】


  这么一想，藤丸立香反倒理清了思路。


  “所长，我不想放弃御主候补的身份。”立香低声说道。'

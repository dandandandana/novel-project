content: '【不管怎样，我都不能让吉尔茜失望。直接放弃，就等于承认自己不够格；去试试，至少还有机会。】


  奥尔加玛丽挑眉：“立香，来这里的都是时钟塔的精英，你不用担心待遇问题。”


  “所长，我担心的不是这个。”立香轻声说道，“既然……”


  立香的话还没说完，突然传来一声巨响。


  “轰隆！”


  巨响来自管制室，发生了剧烈爆炸才能造成的声响。


  伦敦某处，计时塔有间隐蔽的会议室。


  这里聚集的，都是神秘侧无人不晓的人物。


  冠位魔术师、埋葬机关代行者、彷徨海与阿斯特拉院的高层，全都齐聚于此。


  “确定泽里奇的死，是死徒干的？”


  “大概确定了，是黑翼公。”


  “不是盖提亚？我还以为是那个搞小动作的BEAST I。”


  “我们都这么想，毕竟那位可是准备了两千年。”


  “估计要提议处理BEAST I了，按之前的经验，又是一场大动作。”


  “杀宝石翁的真不是盖提亚？真是那个黑翼公？”


  “能养出这么强的死徒，埋葬机关是干什么吃的？”


  这话没掀起什么波澜——在场的埋葬机关成员本就不多，这事说到底也是他们的责任。


  “好了，我知道各位都有疑问。”


  一个慵懒的女声响起，带着几分邪性的蛊惑。


  金发碧眼的女人走上台，要是奥尔加玛丽在场，定然能认出她——正是之前和言峰金奈坐在一起的神琦灰，此刻的她，半点没有之前的柔和，反倒浑身透着魔女般的气场，压根没把台下的高层放在眼里。


  台上的她，神色全然没有之前的柔和，反倒像个浑身带刺的魔女。


  “你是谁？”


  “埋葬机关第二位，神琦灰。”


  “是那个原初妖精……”彷徨海的女魔术师低声呢喃。


  “既然大家都到齐了……”神琦灰轻笑着，话音刚落就被另一个女声打断。


  “神琦灰，你想做什么？”


  第一排的女人开口，黑眸死死盯着神琦灰。


  女人的黑色的瞳孔紧紧的盯着眼前的神琦灰。


  “纳鲁巴列克？这么紧张干什么？”神琦灰轻点着头，笑着说道，“难道身为埋葬机关首席的你，才是杀泽里奇的凶手？”


  纳鲁巴列克压根不理会她的指控，抬手间，虚空骤然凝聚出一杆黑色巨炮。


  “你到底是谁？”她举炮对准神琦灰，沉声问道。


  “嗯哼？已经解析完了？认出来我不是本人了？你这礼装也太作弊了吧，弑神者。”


  神琦灰叹了口气，忽然歪头微微一笑，她看着眼前的纳鲁巴列克和其他摆出驾驶的魔术师，笑了起来。


  “太晚了，就算你能活下来，其他人呢？”


  魔力如潮汐般爆发，会议室里瞬间掀起一阵魔力风暴。


  纳鲁巴列克毫不犹豫开炮，却根本无法完全阻挡。


  魔力潮水般涌来，在场包括冠位在内的大部分魔术师根本承受不住，瞬间灰飞烟灭。


  纳鲁巴列克知道自己护不住其他人，当即拍下腰间的魔术礼装，瞬间消失在虚空。


  神琦灰看着那些明明没有死却直接消失的人，她微微挑眉。


  她捏起周遭残留的魔力，轻轻揉捏着，把这团不属于她的魔力揉成一只飞鸟。


  “去找你的主人。”


  她解析着那股魔力，脸上露出了然的神色。


  “人理烧却式？原来是提前动手了。”神琦灰喃喃自语，望着空荡荡的会议室，“看来讨伐BEAST IV和VI的举动，让他警惕了啊。”


  “有点麻烦啊，时间停滞在这里，怎么继续我的计划呢？”神琦灰迈步向前，嘴角勾起一抹冷笑，“也罢，身为新的地球之主（UO），就亲自去讨伐BEAST I，好好管教一下底下的人。”'

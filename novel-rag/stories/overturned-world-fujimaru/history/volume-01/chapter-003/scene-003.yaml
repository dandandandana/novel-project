content: '“长话短说……”所罗门忽然抬头，神色凝重，“看样子，没机会多说了，她来得太快了。”


  盖提亚心中一凛，下一秒便感觉到一阵诡异的风席卷而来——那风里裹挟着毁灭的气息，神殿外驻守的魔神柱，瞬间被这股风折磨得哀嚎不止。


  它们本是盖提亚最得力的手下，此刻却如同蝼蚁般脆弱，在罡风里苦苦挣扎。


  “所罗门王的造物……倒是有点本事。”一道清朗却带着压迫感的女声骤然响起。


  “只可惜，也就这点本事罢了。”


  女声落下的瞬间，带着不容抗拒的威严：“星之吐息。”


  裹挟着磅礴魔力的罡风再度暴涨，这一次，没有任何魔神柱能够幸免，尽数被浓郁的魔力撕裂、湮灭，连残骸都没能留下。


  所罗门脸色一沉，迅速掏出一枚洁白的戒指，指尖微微颤抖：“就算是仿制品……应该也能拖住她一段时间。”


  “盖提亚，挡住她！”所罗门厉声怒吼，盖提亚立刻从王座上站起身，透过千里眼，清晰地看到了那个踏破虚空而来的女人。


  女人身姿轻盈，手中攥着一只飞鸟，盖提亚辨识出来，这是他释放人理烧却式之后残留的魔力。


  “原来是你留住了那一年吗？“盖提亚看着眼前的女人，他能够感觉到烧却的人类史少了最近的一年，他低声呢喃道。


  “该说不说，你那环绕地球的大光带也太没审美了吧？”神琦灰轻笑着，指尖指了指天空中的光环，语气里满是挑衅，“单一色调，无聊透顶。乖乖把那个受肉的从者交出来，我可以考虑让你在我麾下当条狗，BEAST I。”


  盖提亚没有被这侮辱性的话语激怒，只是冷冷地盯着神琦灰，周身的魔力开始疯狂涌动。


  “诞生之时已至，以此修正万象。”


  环绕地球的光环瞬间射出数亿道光线，每一道都蕴含着堪比A阶宝具的威力，如同暴雨般朝着神琦灰轰去，誓要将她彻底湮灭。


  神琦灰脸上的笑意不变，淡淡吐出几个字：“原理血戒·对抗。”


  下一秒，无数恶意从她体内喷涌而出，化作对灵长类最纯粹的恶念，在她掌心汇聚、凝结，最终化作一架古朴的天平。


  “把人类史烧却、转化为热量的存在啊……”神琦灰看着盖提亚，嘴角勾起一抹嘲讽，“可惜啊，我夺取的是这颗星球本身——人类史，本就包含在里面。”


  一团炽热的火球落入天平一端——那是盖提亚烧却人类史的热量；另一团莹白的幽光落入另一端，那是她窃取的星球权能。天平瞬间倾斜，盖提亚那一端被狠狠压下。


  “结束了。”


  “星之吐息。”


  罡风再度暴涨，纯粹的星球魔力如同海啸般，朝着盖提亚的光线轰去。轰鸣声中，冠位时间神殿轰然倒塌，碎石飞溅，烟尘弥漫。


  盖提亚的第三宝具，本是地球上无人能及的热量巅峰，可此刻，却被星球的吐息彻底压制，连一丝反抗的余地都没有。


  “原来如此。”盖提亚语气平静，“用BEAST IV灵长类杀手的比较之理改造的大魔术，一旦我的筹码重量不及你，便无法占据上风。而且，你窃取了盖亚的权能。”


  “对哦～”神琦灰拍了拍手，笑意更浓，“不愧是所罗门的造物，一眼就看出来了——这可是我花了好久才弄成的大魔术。既然认出来了，还不投降？BEAST I，你弄出来的那些特异点，我挥挥手就能解决，等我坐稳UO之位，或许会分你一块地球哦。”


  “拥有如此力量，不想着造福众生，反倒只想着耀武扬威？”盖提亚冷声反问，语气里带着一丝不易察觉的鄙夷。


  “嗯哼？”神琦灰歪了歪头，笑意带着几分残忍，“我要成为的是UO，你觉得，UO需要其他生物存在吗？”


  盖提亚看着她，嘴角忽然勾起一抹极淡的弧度，语气里满是嘲讽：“这就是小人得志吗？明明身为原初之一，却堕落成这副模样。”


  “哦？看来你的千里眼看到了些什么呢。”神琦灰不恼反笑，“不过你肯定看不全——原初之一几年前就死了，现在在这具身体里的，只是继承了她记忆的另一个人而已，她明明有成为UO的能力和资格却不愿意去呢，真是个蠢货。”


  “好了，最大的秘密都告诉你了，接下来，就请你……”


  “原理血戒·钟楼。”


  “盖提亚，这是能窃取星球权限的魔术。”所罗门的声音适时响起，语气凝重。


  可此刻，盖提亚和神琦灰都已无法回应他——时间仿佛被按下了暂停键，两人维持着原本的姿态，一动不动。


  【只有三十秒吗……】所罗门心中暗忖，语速极快地开口。


  “这是无限接近于单向时间停止的魔术，盖提亚。”他盯着被暂停的神琦灰，“她不解决完特异点，就杀不了你，所以我要把她留在这里，你给我拖住她！”


  “人类之所以能成就伟业，正是因为有失有得。盖提亚，你的理念虽然错了，但此时却至关重要。”'

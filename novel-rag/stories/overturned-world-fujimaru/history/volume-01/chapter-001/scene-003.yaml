content: '每次会想起那五年前的事情，奥尔加玛丽都觉得很荒谬。


  奥尔加玛丽倒在所长专属的房间大床上，只觉得迦勒底目前看起来前途渺茫。


  她打心底觉得，让言峰金奈插手迦勒底的管理实在太微妙了。


  身为资助方，安插自己人很正常，但……


  “笃笃笃。”


  敲门声响起。


  “进来。”


  蓝发少女推开门，笑着开口：“所长，身为迦勒底的战斗顾问，我请求在明天的说明会上发言。”


  就比如这位。


  名叫希耶尔的代行者，就是言峰金奈安排进来的战斗顾问。


  奥尔加玛丽真不想和代行者打交道，更何况资料显示，这位还是埋葬机关的四大王牌之一——代行者弓。


  她觉得希耶尔的素质，碾压了包括自己在内的所有进入迦勒底的魔术师精英，若不是希耶尔的灵子转移匹配度和自己一样为0，她甚至觉得没必要让时钟塔的精英来迦勒底。


  虽说安排这样的人进来，能看出言峰金奈对迦勒底的重视，但也未免太重视了……


  “好，只要不占用太长时间。”


  “谢啦所长！你真是个好人！回头请你吃咖喱！”希耶尔笑着推了推鼻梁上的眼镜，关上门离开了。


  “我的迦勒底……会变成什么样子……”'

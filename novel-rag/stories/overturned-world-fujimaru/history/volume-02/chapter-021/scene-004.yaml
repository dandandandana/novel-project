content: '正如她所料，Alterego的手尚未完全拔出太刀，收鞘的动作还停留在半途，露出了致命的破绽。格洛雷斯抓住这转瞬即逝的时机，猛然挥剑，圣剑带着磅礴到极致的魔力，剑锋如一道金色的闪电，要将眼前的男人从脖颈处斜劈开来。


  “啊呀，领主格洛雷斯，你为何不用风王结界遮蔽你的圣剑呢？”


  格洛雷斯这致命一击并未得手，一柄与她手中星之圣剑一模一样的利刃骤然横挡，精准拦下了她的剑锋。金属碰撞的脆响刺耳，格洛雷斯的圣剑被眼前的从者缓缓推开，Alterego戏谑的眼眸牢牢锁着她，眼底藏着毫不掩饰的玩味与笃定。


  “解析倒是花了些时间，不过，足够了。”Alterego语气轻缓，“结束了。”话音未落，他挥剑直斩，凌厉的剑气席卷四方，整条早已满目疮痍的街道骤然剧烈震颤，碎石簌簌滚落，地基发出不堪重负的呻吟。


  格洛雷斯咬紧牙关，拼尽全力勉强接下这一击，手臂被剑气震得发麻，身形连连后退。未等她稳住态势，Alterego已然身形一闪，如饿虎扑食般朝着她猛冲而来。


  与上一轮近身缠斗截然不同，手持星之圣剑的Alterego，竟在武艺上彻底压制了格洛雷斯。不过二十合的交锋，格洛雷斯便已被逼得节节败退，脚步踉跄，圣剑的挥舞愈发艰难，周身的魔力也开始紊乱。


  格洛雷斯心头一沉——眼前这个男人，竟在复制她的武艺！更令人心惊的是，同样的招式，在他手中使出，竟比她更为精湛、更为凌厉，每一击都精准踩在她的破绽之上。


  “再见了。”Alterego低喝一声，抓住格洛雷斯一个细微的破绽，挥剑狠狠斩出，可剑锋落下的瞬间，格洛雷斯的身影却骤然消失在他眼前，没留下一丝痕迹。


  “哦？是卡恩威南啊。”Alterego非但没有慌乱，反而轻笑一声，语气里的玩味更浓，仿佛早已预料到这一幕。


  卡恩威南，亚瑟王的佩刀，持有此刀者，可借其之力隐匿身形，完美避开敌人的视线与魔力探测。


  致命的危机骤然从Alterego身后袭来——明明无法看见格洛雷斯的身影，明明她看似已无逃离与反击的机会，可那股刺骨的杀意，却真实地萦绕在他周身。


  就在格洛雷斯的圣剑即将刺穿他后背的瞬间，Alterego的背部忽然亮起耀眼的白光，硬生生延缓了圣剑的攻势。趁着这转瞬即逝的间隙，他猛地转过身，与隐身状态下隐约可见的格洛雷斯对视，眼底没有丝毫意外，只有冰冷。


  即便隐身，格洛雷斯眼中的决然与必杀的信念，依旧清晰可辨。


  下一瞬，Alterego手中骤然浮现出一柄与格洛雷斯同款的阔剑——与圣剑Excalibur的精致不同，这柄剑体型硕大，更像是巨人专属的兵器，散发着磅礴的魔力。他以与格洛雷斯如出一辙的姿态，稳稳挡下她的突袭，而此时，少女决绝的声音已然响起，宝具真名被毫无保留地唤起。


  “Marmyadose！”


  格洛雷斯将体内残存的魔力毫无保留地注入手中神剑——这柄由希腊火神赫淮斯托斯亲手锻造的利刃，瞬间缠绕上足以熔化一切的神代之炎，火焰灼热逼人，连空气都被灼烧得扭曲。随后，她猛地挥剑，朝着Alterego轰去。


  “用赫拉克勒斯的剑吗？”Alterego丝毫不惧，也不避让，身前的菱形防御碎片迅速拼凑成型，形成一道坚固的屏障，勉强抵御着这发A+++级宝具的狂暴威力，神代之炎灼烧着碎片，发出滋滋的声响。


  “投影，装填！”


  Alterego的声音冰冷而坚定：“那就用来自希腊大英雄的武艺，亲手宣告你的败北。”


  “射杀百头（Nine Lives）！”


  话音落下的瞬间，整个世界骤然陷入死寂——没有火焰的呼啸，没有金属的碰撞，只有无形的杀意笼罩着整片废墟。


  下一秒，九道凌厉到极致的斩击骤然从格洛雷斯身上迸发而出，她身后的地面剧烈晃动，九道深不见底的裂缝迅速蔓延开来，将原本就破碎的大地切割得支离破碎，碎石与尘土漫天飞扬。


  “啊……”


  十分钟前才刚刚降临于人理的冠位从者格洛雷斯，此刻已然浑身是伤，深可见骨的伤口布满全身，躯体几乎被斩成数截，仅靠残存的魔力勉强维系着完整。她体内的龙心仍在疯狂运转，源源不断地为她供给魔力——只要给她足够的时间，她或许还能重整旗鼓，可Alterego不会给她这个机会。


  Alterego不给格洛雷斯丝毫反应的间隙，猛地伸出手，死死掐住她的脖颈，力道之大，几乎要将她的脖颈捏碎。随后，他狠狠发力，将她如同破布娃娃一般砸向地面。


  “呃……”'

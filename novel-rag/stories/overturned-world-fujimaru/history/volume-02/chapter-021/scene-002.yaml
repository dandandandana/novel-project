content: '“Grand Saber啊。”Alterego歪了歪头，目光饶有兴致地落在金发少女身上，语气依旧戏谑，周身的神性魔力微微涌动，“月虹破开灵长类杀手的黑泥结界后，你第一时间就来找我？我现在可是迦勒底名义上的盟友哦~放着那个危害人理的BEAST
  IV不解决，反倒来寻我的麻烦，不太好吧？”


  “你的话，有半分可信度？而且，我们的目标是杀了你，无名的从者。”少女的声音凛冽如冰，不带一丝温度，话音未落，她已反手拔出腰间的圣剑，剑鞘摩擦发出清脆的金属声响。


  “你们？哦哦哦，看样子还有其他冠位从者来杀我啊。”


  长剑甫一拔出，周遭的魔力与空气便剧烈震颤起来，一股磅礴而圣洁的威压席卷四方，让立香都忍不住微微屏息，下意识地后退了半步。立香心中一松，压下心头的悸动，轻声问道：“你是来支援我们，一同对抗灵长类杀手和BEAST IV的吗？”


  “正是。”少女清澈而威严的声音响起，穿透了周遭的魔力波动，“吾乃Grand Saber，领主格洛雷斯。奉人理之命前来支援迦勒底，迦勒底的御主，速速前往主战场，完成你该承担的使命！”


  “啊！好！那这里就交给你了，Archer！我们快去主战场支援大家！”立香立刻反应过来，语气急促。


  Archer没有丝毫迟疑，当即松开护着立香的手，腾空跃起，身形如离弦之箭般划破天际，周身魔力凝聚成一道残影，朝着灵长类杀手所在的主战场疾驰而去，只留下一道淡淡的魔力轨迹。


  Alterego歪着头，凝视着眼前的冠位从者，眼神里带着几分困惑与探究，语气也柔和了些许：“长高了？”


  “我们认识？”格洛雷斯满脸不解，轻轻摇了摇头，眉头微微蹙起，语气依旧冰冷而坚定，周身的圣剑依旧泛着凛冽寒光，“无论你我是否有过交集，已穷途末路，不知名的从者，束手就擒吧。”


  听到这话，Alterego低笑出声，笑声里满是嘲讽，眼神也变得锐利起来：“真是胆子不小，你就这么自信能赢我吗，阿尔托莉雅？”


  格洛雷斯微微歪头，眼中的困惑更甚，却不愿再与这个故弄玄虚的从者废话。她身形一闪，借着魔力的加持，瞬间便出现在Alterego面前，圣剑带着磅礴的魔力，剑光凌厉如雷，直斩Alterego的脖颈，出手毫不留情。


  剑光落下的瞬间，二人站立的高楼应声被劈成两半，断裂处泛起灼热的痕迹，碎石伴随着烟尘四处飞溅。Alterego身形灵巧地侧身闪避，动作快如残影，转瞬便出现在格洛雷斯身侧，手中的太刀已然出鞘，泛着清冷的寒光。


  “你这副模样，真是令人悲哀。”Alterego语气平淡，听不出丝毫情绪，眼神里却闪过一丝复杂，仿佛在惋惜着什么，手中的太刀微微抬起，对准了格洛雷斯的后背。


  格洛雷斯反应极快，察觉到身后的杀意，当即再度抽剑反击，剑光如潮，攻势猛烈而密集。Alterego似乎并无缠斗之意，勉强用太刀挡下这一击，却被对方剑上的磅礴巨力震得倒飞出去，嘴角溢出一丝淡淡的血痕。


  “EX！Calibur！”


  璀璨的金色光炮紧随其后，带着毁天灭地的威势，朝着倒飞的Alterego轰去——这发A++++级别的宝具，乃是格洛雷斯的全力一击，堪称所有宝具中的巅峰，足以击碎任何阻碍。令人震惊的是，倒飞的Alterego竟不闪不避，直直接下了这一击。


  剧烈的光芒席卷全场，刺得人无法直视，Alterego身前重叠的菱形防御碎片在光炮的冲击下，尽数化作光点消散。他表面看似毫发无伤，站姿依旧挺拔，可他正在缓缓重组的右半边身子却说明了他并不是没有受伤。


  而在他身后的半边冬木，因为格洛雷斯的一发光炮，已经彻底的变成了废墟。


  此时，Alterego缓缓开口，声音通过魔力通讯传递出去：“请求支援，即刻封印亚瑟王的剑鞘——阿瓦隆。”


  话音刚落，整个地面骤然剧烈震动起来，脚下的高楼开始摇摇欲坠，随即传来一阵扭曲刺耳的电流声，噼啪作响，周遭的魔力也变得紊乱不堪。格洛雷斯心头一怔，尚未反应过来，Alterego的太刀已带着凌厉的刃风，劈至眼前，速度快得让她几乎无法捕捉。


  “砰！”


  本就摇摇欲坠的高楼，再也承受不住这一击的巨大冲击力，轰然倒塌，漫天烟尘弥漫开来，遮蔽了天光，碎石如雨般坠落，将周遭的一切都掩埋在烟尘之中。'

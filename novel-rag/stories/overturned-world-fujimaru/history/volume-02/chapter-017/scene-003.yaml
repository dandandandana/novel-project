content: '立香咬了咬下唇，终究还是鼓起勇气开口，声音带着难以掩饰的沉重：“Ruler在你体内，留下了不止一道残响……只有当你达到生理濒死状态时，天上的宝具，才会对着你所在的位置释放。”


  士郎沉默了几秒，指尖轻轻敲击着床沿，像是在快速思索，随后抬眼问道：“这么说来，接下来的问题，就是如何把我送到那只白兽身边，对吗？”


  立香看着眼前的言峰士郎，喉咙像是被什么堵住，半天说不出一句话，眼眶渐渐泛红。


  见她迟迟不说话，士郎才抬眸看向她，眼底的疑惑更甚：“怎么了？难道不是这样吗？”


  “大概……也没有别的选择了吧。”他轻声补充，语气里带着几分笃定。


  “言峰……为什么啊！”立香再也忍不住，声音陡然拔高，带着几分哽咽。


  “欸？什么为什么？”士郎彻底愣住，脸上满是茫然，“你告诉我这些，不就是想和我说，接下来我该做什么吗？”


  “只要我处于濒死状态，就能引出Ruler的宝具，给你们创造和白兽正面对决的胜算，不是吗？”他看着立香泛红的眼眶，语气里的困惑更浓了。


  立香的眼泪在眼眶里打转，她曾设想过无数种可能——言峰或许会不解，或许会愤怒，或许会为这近乎赴死的安排而崩溃。


  可她从来没有想过，言峰士郎会直接跳过所有情绪，径直跳到战术层面，仿佛要去赴死的不是他自己。


  “这就是最大的问题啊！”立香语无伦次地喊道，眼泪终于忍不住滑落，“为什么你能这么平静？为什么你直接就考虑该怎么做？你不应该……不应该质疑吗？”


  “你明明知道这意味着什么啊！你就一点都不在乎自己吗？！”'

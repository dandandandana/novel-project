content: '爱尔奎特咬紧牙尖，双手握真世界迎上这一剑。两柄不属于人世的魔剑再次撞击，金铁交鸣的冲击波推倒了山岳半壁岩体。爱尔奎特的眉头在接触的瞬间紧锁——力量差距太悬殊了。她整个人如同被投石机抛出的弹丸般被抽飞出去，身体在空中翻滚了不知多少圈才勉强稳住身形。


  她在半空中调整好姿态。金色的鲜血从虎口顺着真世界的剑柄往下淌，在指尖汇聚成珠滴落。真祖深吸一口气，将这口气化作咒文吐出。


  “空想具现化。”


  周遭的空气被压缩到极致。天空的环境开始扭曲变化，云层被无形的力量撕碎又重组，大地——新的大地从空中开始诞生。泥土在空中凝结，岩石从泥土核心往外生长，一切物质在空想具现化的法则下从虚空中借形而成。空气为即将诞生的盛景提供结构支撑，每一粒分子都在献出自己作为地基的一部分。


  “千年城！”


  一座宏伟的城堡在空中落成。它从虚空中拔出塔楼和女墙，每一块石砖都在成型时发出沉闷的碰撞声，像是千百个石匠在同一个时刻敲下最后一锤。城墙的厚度足以抵御攻城锤连续数日的撞击，塔尖刺穿云层直指天际。


  爱尔奎特没有停手。她再度举起纤手，五指在空中张开又攥紧。


  “空想具现化。”


  锁链在空中成型的动静如同蛟龙破渊。每一条锁链都粗得过成年人的腰身，铁环互相扣合时溅出剧烈的火星，金属表面流转着与真世界同源的剥夺大地生命的魔力波动。锁链拧动着如同获得了独立的意志，从千年城的每个方向往下俯冲，朝着阿尔托莉雅穿梭上来的轨迹扑去。


  阿尔托莉雅骑着梦魇之马撞进锁链的包围网。她的动作没有丝毫减速。在第一条锁链缠向马腿的瞬间她整个人带着坐骑直接穿过锁链的环扣，穿透时锁链的铁环短暂化作了半透明的虚影，等马身完全通过后又恢复成实体。数道锁链交叉缠绕全部落了空，铁环互相撞击发出沉闷的巨响。


  爱尔奎特咬住下唇，举起真世界再度正面接住阿尔托莉雅斩落的塔赫缪雷斯之刃。剑刃撞击的冲击震得千年城的塔楼簌簌落下石粉。爱尔奎特在角力中分出左手，指尖弯曲成爪，一爪挥向阿尔托莉雅的坐骑。


  爪锋撕开血肉。梦魇之马发出一声嘶哑的啼叫，大块骨肉被爱尔奎特从脖颈部位活活撕下，黑色的血液喷射而出在空中凝结成不散的墨雾。梦魇之马踉跄了一拍。阿尔托莉雅在坐骑失衡的瞬间从马背上高高跃起，爱马化作黑烟消融于她的影子之中。


  “看你……”爱尔奎特刚吐出两个字，余下的话语被眼前的景象堵回了喉咙。


  阿尔托莉雅的背后长出了翅膀。漆黑的双翼从她裸露的肩胛骨处伸展而出，骨架上覆盖着暗色的膜翼，翼骨末端延伸出尖锐的骨刺。双翼在半空中缓缓扇动，每一次挥动都带起足以推平砖墙的气流。她就在空中浮着，静静俯视着站在千年城塔楼上的爱尔奎特。


  爱尔奎特终于有机会仔细打量这个少女。暗色的作战服。露背的设计露出整个后背从颈到腰的线条，左臂上挂着一个花样繁复且狰狞着的臂铠。


  腰间系着第二柄剑——一柄黑色的圣剑，剑柄上没有多余的装饰，只有深色的皮革缠裹出握柄的轮廓。护手与剑鞘同为暗色，与露背服形成一体化的战斗装束。


  阿尔托莉雅收起双翼朝她俯冲。她带有着明确攻击轨迹的斩击冲锋向爱尔奎特，爱尔奎特举剑格挡，剑刃碰撞的冲击从塔楼传遍整个千年城。城墙的某些部位龟裂出细密纹路。


  “Mar……”爱尔奎特在角力中低声念出了咏唱的第一个音节。剧烈的白光从她空闲的右手中浮现，光团在她掌心翻滚膨胀，亮度急速攀升，三四次心跳的工夫就从拳头大小膨胀成了人头大的光球。她一只手架着真世界与阿尔托莉雅角力，另一只手将白光朝金发少女的胸口狠狠一送。


  阿尔托莉雅看见了那团白光。她在光球脱手的瞬间抬脚踹向爱尔奎特的腹部，借力往后翻腾拉开距离。白光在两人之间猛然炸开。


  “轰！”


  光爆的中心点往外扩张成一个半球形的能量罩。所有的声与热在这半球内被压缩到极致然后一次性释放。炸开的冲击波撼动了整座千年城，城墙被削去整整一层，碎裂的石料下雨般往下坠落。


  “得手了……”爱尔奎特来不及喘息。她在爆炸余波尚未消退的瞬间就重新凝聚起了白光，掌心的魔力疯狂涌入新的光团。然后烟雾散了。


  阿尔托莉雅浮在原地。她身上的作战服甚至连一丝焦痕都没有。金发在逐渐消散的烟尘中轻轻飘动，淡金色的眼瞳清澈如初。她看着爱尔奎特手中的新光团，重新开口唤出了坐骑。梦魇之马从她影中跃出，四蹄在虚空中刨出火痕。


  “该结束了，真祖。”阿尔托莉雅的语气平淡。她张开漆黑双翼带着骏马飞向更高的空中，马蹄在倒悬的天幕下踏出燃烧的轨迹。'

content: '动能彻底消失。圣剑的威力在这一刻彻底解放。暗色光柱贯穿了整个月亮。从正面轰进去从背面透出来。月亮的幻影失去了维持形状的结构力，从核心开始崩裂成无数碎块。最大的碎块有一座城市那么大，最小的也有马车大小。碎屑朝着伦敦的废墟砸去，化作一场覆盖整个英格兰首都的陨石雨。


  马车上方的天空被燃烧的碎屑染成橘红。昔日的大本钟残骸被一块坠落的月岩砸成碎片。泰晤士河的河水被密集的陨石炸出连续的冲天水柱，河面上漂浮的残骸碎片被气浪推上岸砸进瓦砾。


  陨石雨持续了整整一刻钟。当最后一块碎片落在远处的废墟中，激起漫天的烟尘之后，伦敦的天幕重新恢复了灰蒙。冷风裹挟着燃烧的焦臭与真祖血液的金属腥味，在废墟的缝隙间呜咽穿行。'

content: '红黑色的光炮从乖离剑的旋转圆筒中喷薄而出。那是足以撕裂世界表里、将天地初开的光景重现于人间的绝灭一击。


  光柱所过之处空气被直接分解成辉光，石板地面在触及光柱边缘的瞬间汽化，连灰尘都来不及扬起就消失在半空中。伊什塔尔驾着马安娜往后疾退，弓身贴紧坐骑的背脊，光炮的余温擦过她的肩甲留下一道焦黑的灼痕。


  “蠢货蠢货，吉尔伽美什你真是，连EA都……”伊什塔尔骂到一半，声音卡在喉咙里。


  EA轰击的方向，那片被撕裂的空间边缘，红黑色的光柱正中央出现了一道极细的裂痕。


  剑痕。


  从光炮内侧往外劈出来的剑痕。裂痕从光柱核心向两端延伸，速度不快但每一寸推进都带着金属撕裂巨浪的刺耳尖鸣。


  “此身为剑所天成。”


  那声音从光炮深处传来。低沉平稳，不紧不慢，像是铸剑师面对熔炉时的自言自语。声音落定的同时剑痕贯穿了整个光柱——EA发出的毁灭性红黑色光炮被这一剑劈成了两半，从中轴线开始向两侧崩解，断口处光滑平整如同被高热的利刃切开的钢铁。


  两半光炮失去约束开始膨胀崩塌。红黑色的光粒从断口处往外喷涌，计时塔不知被什么力量保护住没有受到严重的损毁


  上方的天空中炸开成漫天星火。火星坠落之处砸出一个个冒着青烟的深坑。被劈开的光柱最后化作无数细碎的光点，被风吹散在伦敦灰蒙蒙的天幕下。


  伊什塔尔在马安娜上瞪大了眼睛。“什么？”


  劈开光柱的余波散去之后那个身影才清晰起来。Alterego站在半空中，脚底距离地面约有十米之遥。他的右手握着一柄太刀，刃面映着逐渐消散的红黑光点，剑尖垂下，姿态闲散得与方才劈开天地初开一击的壮举毫不相称。他静静看着地面上的吉尔伽美什，嘴角的弧度介乎于嘲讽与无聊之间。


  “见到本王不率先开口行礼，难不成连基本的礼仪都不知道了吗？士郎？”吉尔伽美什冷声开口。她看着与自己义子长相一模一样的从者，语调里的冰霜盖过了EA被破的震惊。


  Alterego侧了侧头，剑刃在他手中转了个圈轻巧地插回腰间。“你在搞笑吗？”他的尾音带着轻佻的上扬，像是听到了一个并不好笑的笑话。“很可惜，我并不认为我有对你行礼的必要。”


  “这就是那个强的离谱的高等从者？”伊什塔尔驾着马安娜看着Alterego。她皱着眉头把指尖按上太阳穴，魔力感知被对方的存在搅得一片混沌——灵基读数在狂跳，规格远超从者的上限。“古伽兰纳！”


  天之公牛在天空中怒吼。


  那是苏美尔神话中连众神都无法驯服的天灾神兽。古伽兰纳的全长约有五百公里，身躯由青金石质地的巨岩构成，青蓝相间的石纹在日光下流淌着冷冽的光泽。它的吼声不是声音，是一道震天的雷暴。伦敦废墟中的碎石被这一声震得原地弹跳，泰晤士河的水面炸开无数混乱的波纹。


  然后所有人听见了那个声音。不是古伽兰纳的咆哮，不是城市崩塌的轰鸣，而是尖锐的石头被直接割裂的声音。那是金刚石切割青金石的尖啸，是金属刃面在巨兽骨骼上拉出一道从首至尾的裂缝时发出的持续悲鸣。


  太快了。五百公里长的天之公牛，从头到尾被切开的速度快到连神明的动态视力都无法捕捉全貌。众人只能看见漫长切割进程的最后一幕——少女骑着黑色的梦魇之马，从古伽兰纳的尾部下方飞掠而出，手中举着暗色的长剑，剑刃上缠绕着撕裂天地的暗色极光。


  梦魇之马的铁蹄踏在虚空中留下燃烧的火痕。它的速度没有任何衰减，从古伽兰纳尾部冲到头部只用了一次呼吸的间隙。金发少女在坐骑飞抵牛首的瞬间举剑，剑尖指向天穹。暗色极光从剑身上爆射而出，在古伽兰纳的眉心处插进又拔出。


  “شمشیر رستم（斩绝七重魔境之极光）。”


  阿尔托莉雅念出宝具真名的声音轻飘飘的。像是在念一首早已背熟的诗，每一个音节都落得随意而精准。暗色魔剑的剑锋在念完最后一个字母的刹那切入古伽兰纳的神核。


  神核裂开。青金石巨兽的悲鸣化作了漫天的雷暴——那是古伽兰纳最后的咆哮，也是它身为天灾神兽的哀歌。五百公里的庞大身躯从裂缝开始崩塌，青金石一块块剥离脱落，在下落的过程中化作青蓝色的光粒飘散。整个伦敦的天空都被古伽兰纳崩解的光芒染成了青金石的颜色，然后光粒消散，巨兽不复存在。


  “怎么可能……”伊什塔尔看着浮在空中的少女，嘴唇翕动了两下。“那是塔赫缪雷斯之刃？怎么可能？鲁斯塔姆不是男人吗？而且他不是中东那边的？”


  “她的目标是我，目中无人的女神，别过于自大了。”'

content: '他停了一拍。那个停顿的长度恰好够他把视线从床头柜收回来，重新对上立香的眼睛。


  “但是——“


  “修复人理，他们能够回来。“


  这句话他说得很重，从他嘴里出来的时候，带着一种和深夜的松弛氛围不太相称的笃定。


  “欸？“


  立香的反应慢了半拍。她的脑子在“父母已死“的平坦陈述和“他们能回来“的突兀转折之间滑了一跤，等回过神来才意识到士郎说了什么。


  “什么？“


  “我说修复了人理，你的家人就能回来。“


  士郎把同样的话又说了一遍。第二遍比第一遍慢，好像在确认她听清了每一个字。


  立香盯着他看了好几秒。


  “这样吗。“她低声说。嘴唇合拢又张开，“怎么感觉你在和我画饼呢。“


  那句话的末尾应该是一个问号，但她把它处理成了句号。


  “我没有开玩笑。“


  士郎说这句话的时候微微笑了一下。那个笑容出现在他冷硬的娃娃脸上的方式有些突兀，像冬天的窗户上被哈出来的一小团雾气。短暂的、带着温度的、很快就会消散的。


  “相信我。“


  两个字。他说完之后没有补充理由，没有罗列论据，没有解释人理修复的具体机制和因果重写的原理。就是让她相信。


  立香没有点头。也没有摇头。


  她端起床头柜上的汽水杯子，凑到嘴边喝了一口。气泡在口腔里炸裂的触感冲淡了喉咙底部那股发涩的滞感。她一口一口地喝着，不快也不慢。每一次仰头的角度都差不多，每一次咽下去的量也差不多，像是在用这个机械性的动作替代她暂时组织不了的语言。


  士郎没有催她。


  他靠在墙上，看着她喝汽水。走廊灯光从门缝底部渗进来的那条窄亮在他鞋面上画了一道月牙形的边。室内的空气里混着青桔味的碳酸气息和奶油蛋糕残留的甜腻。


  “还吃蛋糕吗？“


  士郎先开口了。声调随意，像在问“窗户关了没有“。


  “不吃了。“立香把杯子放下来，用手背擦了一下嘴角的水渍。“放冰箱吧，明天给其他人。“


  “好。“


  士郎从墙边走过来，拿起床头柜上的碟子。碟子里剩下的那块蛋糕已经在室温里放了将近一个小时，奶油的边缘开始微微塌陷，但蛋糕体本身的颜色还是浅黄色的，海绵组织柔软蓬松。他用一只手端着碟子，另一只手把旁边散落的叉子和纸巾碎屑拢到了一起。


  动作干净利索。端碟子的手腕角度平稳得像在端一份实验器材，不晃不偏。立香看着他的背影——穿着便装的背影，从床边走到门口，拉开门出去。走廊的荧光灯管嗡了一声，白光涌进来又被门板挡回去大半。


  大约一分钟。


  门重新被推开，士郎走回来了。手上什么都没拿。碟子已经放到了走廊尽头的公共厨房里。他关上门，退回到墙边原来的位置，但没有马上靠上去。


  他站在那里，像在整理接下来要说的话的顺序。


  “立香。“


  “嗯？“


  “至于为什么是你成为了迦勒底的御主。“他慢慢地说，每个词之间留出了可以被听见的间距。“这个问题，我没法给你准确的答案。“


  立香的膝盖从盘坐的姿势换成了抱坐。双臂环着小腿，下巴搁在膝盖骨上。这个姿势让她的身体缩成了一个更紧凑的体积，像一种安定的倦意正在取代紧绷。


  “我一开始也有过类似的疑惑。“士郎的声音在安静的房间里听起来带着一层薄薄的沙感，不知道是嗓子的问题还是凌晨两点自然赋予人声的质地。“一场火烧掉了我的全部。记忆、家人、连名字都没有留下。然后吉尔茜把我从废墟里捡了出来，后面我进了埋葬机关。“


  他说“捡“这个字的时候没有停顿。这个字从他嘴里掉出来的样子轻飘飘的，好像他在说的是一件衣服或者一枚硬币，而不是一条命。


  “我之前也在想，为什么是我变成了现在这个样子。“


  “想出来了？“立香问。


  “没有。“士郎的回答来得很干脆。“也许只有主才能给出答案。“


  “你的意思是命运吗。“


  立香的目光在他脸上划了一道。“命运“这个词从她嘴里说出来的时候带着一种审视的意味，好像她在掂量这两个字的斤两，看它们够不够格承载她经历过的那些东西。


  士郎没有立即回答。


  他的视线移到了天花板上方。照明板的光已经调到了最低档，投射在合金表面上的光晕像一层淡到将要消失的水彩。他看着那片光晕的边缘，嘴唇动了动，似乎在斟酌用词。


  然后他开口了。声调比之前放得更慢，更沉。语气里浮现出一种立香之前没有从他身上听到过的东西。那东西更接近于——祷词。


  “主为每个人写下了Fate。“


  他用的是英文。那个词从他嘴里出来的时候咬字清晰，不是“命运“这个日语词汇的翻译，是写在经文里的、由造物主落笔的、每个人被赋予的剧本。


  “但那只是落下来的剧本。“'

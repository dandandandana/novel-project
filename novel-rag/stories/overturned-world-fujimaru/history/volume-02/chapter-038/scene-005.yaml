content: '他的视线从天花板收回来，落在立香身上。凌晨的光线把他的琥珀色瞳孔映得很深，深到颜色本身似乎变成了某种介质。


  “真正的命运，是由自己的脚走出来的。“


  他停了两秒。


  那两秒里，房间里只有汽水气泡破裂的声音和空调管道里风流转弯的摩擦声。


  “既然你已经走上了这条路。既然是你站在这里。“


  他的声音在最后这句话上放得很轻。


  “那么从这里开始，接下来的故事——剩下的命运是属于你的，立香。“


  他说完了。


  空气在他的话音消散之后缓缓流动了一下。空调出风口吹出来的冷气掠过立香露在睡衣领口外面的锁骨，她打了一个很轻的寒噤。


  不是冷的。


  是那几句话在她的身体里穿过去的时候，带走了某些滞留在骨缝里的淤堵。


  “好吧。“


  立香说。声音很轻，尾音带着一点被裹住的鼻音。她点了点头，幅度很小，下巴在膝盖骨上蹭了一下。


  “好吧。“她又说了一遍。


  然后她抬起头，盘腿的姿势换了一个方向，身体朝向士郎那边偏了几度。


  “那你给我做蛋糕和汽水，真的就是来找我，让我发泄情绪的？“


  话题切换得很快。快到像是要在刚才那段话留下的庄重感凝固之前把它搅开。


  “当然。“


  士郎的回答比她的转向更快。好像他一直在等这个日常节奏的接口。


  立香犹豫了一下。她的手指在膝盖上敲了两下，指甲碰在睡衣布料上发出细碎的声响。


  “为什么？“


  士郎偏了一下头。“嗯？“


  “我们见面的总次数加起来不超过十次吧。“立香的目光直直地对着他，声音不大，“你为什么对我这么上心？“


  这个问题落在空气里之后，士郎的表情出现了一个微小的变化。


  他张了张嘴，又闭上了。视线从她脸上移开，落到了旁边小桌上搁着的那杯汽水上面。


  他在想怎么说。


  或者说——他在想要不要说。


  然后他选择了一条岔路。


  “心情好些了吗？“


  立香看着他。


  那个问题和她的问题之间隔着一道弧度很大的弯，大到她几乎能看见士郎拐弯时留下的轮胎痕


  她笑了一下。很淡的、嘴角牵动了一点的笑。


  “对自己这么不自信？“


  “嗯哼？“士郎的头歪了一个角度，下巴微抬。“想听你亲口说罢了。“


  “当然好了。“


  立香掰着手指头数。每掰一根手指就报一项，像在结算一场战斗的战利品清单。


  “把坏情绪发泄了一通。多了一个以后专用的出气筒。吃了很好吃的蛋糕，喝了汽水。这阵容摆出来，想不开心也难吧。“


  她说完，松开了掰着的手指。右手在空中摊了一下，掌心朝上，好像在展示一个不证自明的结论。


  言峰士郎看着她。


  看着她掰手指的动作，看着她摊开的掌心，看着她因为刚才掰手指而微微撅起来的嘴唇，看着她潮红的眼尾和翘起来的嘴角同时存在于同一张脸上——那张脸在半个小时前还埋在膝盖里，现在正对着他扬起来，带着一种“你看我没事了吧“的理直气壮。


  他笑了。


  它从他的胸腔底部涌上来，经过喉咙的时候震出了一个短促的气音，抵达嘴唇的时候把他那张常年板着的冷硬面孔从中间撬开了一道缝。眼角收窄，颧骨的线条柔和了，连眉骨投下的阴影都浅了一层。


  不加掩饰的。


  发自内心的。


  与这个凌晨两点的深夜宿舍完全不相称的，一个愉悦的微笑。


  “那就好。“


  他说。声音里还挂着那个笑的尾巴，像杯底残留的最后一颗气泡。


  “你是我的御主。“他把双手从口袋里抽出来，交叉抱在胸前，身体靠着墙面，姿态松弛得像在说一件理所当然的小事。“我看你开心，我就开心。仅此而已。“


  “你以后要上战场的次数只会越来越多。迦勒底的资源会向你倾斜，该有的保障不会缺。这些不需要你操心。“


  他说“仅此而已“的时候，语调平得像一面没有起伏的水面。


  立香愣住了。


  她的膝盖上还搁着交叠的手指，身体维持着刚才掰完手指后的姿势。她的眼睛盯着士郎。盯着他那个还没完全收回去的笑。盯着他交叉在胸前的手臂、他靠着墙的肩膀、他说出那句话时嘴唇合拢的方式。


  我看你开心，我就开心。仅此而已。


  她脑海里有什么东西被触发了。


  比理解更深一层的东西。像从抽屉最底下翻出一张写了字的纸片，字迹已经被别的东西压出了折痕，但辨认起来没有障碍。


  ——“我的愿望是，寻找到属于我的愉悦。“


  那句话。


  特异点F。少年在她面前的画面被记忆的噪点侵蚀得模糊了，但那句话是清晰的。他说这句话的时候嘴角的角度、声带震动的频率、那双琥珀色的眼睛从下方看向她的视线——全部是清晰的。


  寻找到属于我的愉悦。


  看你开心，我就开心。


  立香的嘴唇张了一下。没有声音出来。


  言峰士郎已经动了。'

content: '这几个字。她说得很快。快到像是要趁自己还没来得及感受这句话的重量之前赶紧把它丢出去。


  房间里的空气没有变冷。空调的温度设定没有变化，走廊灯光的角度也没有移动。但言峰士郎的手指在杯壁上停住了。


  他把这几个字接住了。接住的方式是沉默、没有别处可看所以落在她发顶上的注视。


  立香没有等他开口。


  “说到底……为什么要让我经历这些。“


  她的声音从膝盖后面传出来，被压得很薄。


  “如果我没来迦勒底……“


  “立香。“


  言峰士郎叫她名字的声音不大，但切口干净。像在一张正在被撕裂的纸上准确地按住了裂缝扩展的起始点。


  “你要否定过去的自己吗？“


  立香的肩膀动了一下。她从膝盖后面抬起脸，眼眶的红色又深了一层，但没有新的泪痕。


  “什么意思？“


  “你当初为什么来迦勒底？“


  “……因为吉尔茜的邀请。“


  “然后呢？“


  “刚好结业考试结束了。她说来迦勒底可以当作上大学之前的休假和学习。我觉得不错，就来了。“


  立香说这些话的时候，语调变得很平。像是在复述一份已经过期的行程表。那些词语曾经代表的东西“大学“，“休假“，“学习“，在特异点F之后全部变成了另一个世界的语言。


  “到这里为止。“言峰士郎的下巴微微抬了一下，“你做的事情有什么问题？“


  “什么……“


  立香长长地呼出一口气。那口气从她的嘴唇之间漏出来的时候带着一点颤，到了尾段才稳住。


  “啊。我明白你的意思了。“


  她抬起头看向他。


  “你是想说，当时的我做出那个选择，实际上没有任何问题。“


  “是这样。“言峰士郎低头喝了一口汽水。那个动作和他说出这三个字之间没有停顿，好像“喝水“和“肯定对方“是同一个连贯动作的两个部分。“以你当时拥有的信息，你所能做出的判断就是最合理的判断。我们没法预见未来会发生什么。“


  他停了一拍。


  “只有主知道。“


  立香的眉头在“主“这个字上皱了起来。


  “……你不加最后这句话，我差点就忘了你是神父。“


  “代行者。“


  “一样的。“


  “差很多。“言峰士郎的语气里带了点较真的意味，但他没有在这个话题上继续纠缠。他把杯子从一只手换到另一只手，手掌在裤管外侧擦了一下凝结的水汽。“别打岔。“


  “是你先打的岔。“立香反驳的速度比呼吸还快。


  言峰士郎没接。他选择了一条更直的路。


  “过去的每一步组成了现在站在这里的你。你当时做了你认为对的事，来了迦勒底，遇到了你遇到的人，经历了你经历的事。只要你在做决定的那个瞬间没有违背自己的本心——“


  “跟我讲哲学呢？“立香打断他，“你上过大学吗？“


  言峰士郎的嘴张开了，又合上了。他的视线往右偏了一个角度，落在墙面和天花板的交界线上。停了一秒。


  “……没有。“


  “那你别讲。“


  “……“


  沉默了三秒。但这个沉默里没有尴尬。言峰士郎被堵住嘴的表情——或者说他那张冷硬的脸上接近于“被堵住嘴“的微妙变化，这让立香的嘴角牵了牵。


  “不过你说的有道理。“她把下巴重新搁回膝盖上，声音软了一截。“我懂了。当时的选择没有错。来迦勒底没有错。这些我可以接受。“


  “但是——“


  “玛修和希耶尔。“言峰士郎替她把后半句说了出来。


  立香看着他。那个眼神里有一点意外，像是没想到他会这么快接上来。然后意外消散了，取而代之的是一种很微弱的、类似于“果然如此“的认命。


  “你想说什么？“


  言峰士郎没有直接回答。他把杯子放到了旁边的小桌上——那张桌子离他至少有两步远，他是侧身走过去放的，放完之后没有走回原来的位置，而是在墙边换了一个站点，离床铺稍微远了一点。


  这个微调看起来没有意义。但他给了立香更多的物理空间。


  “未来不在我们的控制范围内。“他说，背靠着墙，双手重新插回口袋。“你已经知道了。过去的选择没有错，未来的走向无法预判。那中间剩下的是什么？“


  立香没有回答。她的眼睛看着他，但焦点不在他身上。


  “是''现在''。“言峰士郎的声音放得很低，低到和空调的运转声混在了同一条线上。“你现在是迦勒底最后的御主。这不是你选的，但轮到你了。“


  “……我知道。“


  “既然知道，那就只有一件事要做。“


  他的下巴微微收了一下，视线从略高于立香头顶的角度降到了和她平视的位置。


  “下定决心。“


  三个字。他说得不重。但每一个字之间的气息分隔让这三个字像三级台阶，一级比一级稳。


  “以藤丸立香这个人的身份，以迦勒底最后的御主的身份，去做你该做的事情。“


  立香抱着膝盖的手指收紧了。指甲陷进睡衣布料的褶皱里，在膝盖骨上方压出了一道浅浅的凹痕。'

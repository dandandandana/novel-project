content: '言峰士郎没有立刻回答。


  他低下头，看了一眼自己刚才握过立香手的那只右手。五指松松地张着，掌心朝上。


  然后他抬起头。


  “是的。“


  停了半拍。


  “我从来没变过。“


  四个字。说得很轻。但每一个字的落脚都踩得很实，像被仔细校准过重量的砝码依次放上天平。


  立香没有回答。


  她把脸埋进了膝盖里。


  不是哭。她的肩膀没有颤抖，呼吸也很平稳。只是把脸藏起来了。可能是因为那个笑容还没从嘴角消失。也可能是因为她还没想好，对于这句话，应该给出什么样的表情。


  言峰士郎也没有追问。


  他靠在墙上，双手插在口袋里，看着蜷缩在床上的少女的发顶。她半干的头发因为辗转的动作变得有些凌乱，几缕碎发从耳后滑落，搭在睡衣的领子上。'

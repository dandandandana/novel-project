content: '立香把碟子连同里面剩下的半块蛋糕一起搁到了床头柜上。动作很随意，碟沿磕在柜面上发出一声脆响。


  她转过身，深橘色的瞳孔对准了站在房间中央的Ruler。


  “你在这儿我大概也睡不好。“她说，语调像在陈述天气预报一样平淡，“到时候做噩梦了都怪你。“


  这句话在通常的语境里叫做“允许留下“。虽然藤丸立香用的是一种必须翻译两层才能读懂的编码方式，Ruler显然具备解码能力。他点了点头，迈开腿往床铺的方向走了两步，目测轨迹的终点是床沿。


  立香一根眉毛挑了起来。


  “谁让你坐的。“


  Ruler的脚步顿住了。他抬眼看她。


  “御主？“


  “哼。“立香发出一个短促的、从鼻腔里挤出来的单音节，下巴微微扬起。那个角度让她看起来像是在俯视他，尽管Ruler比她高出二十多厘米。“女孩子的床是你能随便坐的吗？“


  “……服了你了。“


  Ruler收回了迈出去的半步，退回原来的位置，脊背重新靠上墙面。他交叉双臂，姿态随便得像在自家走廊上等热水壶烧开。


  “御主——“


  他拖长了这个称谓的尾音，停了一拍。走廊透进来的光在他半边脸上画了一道明暗分界。


  “我之前的那句''活下去''，是不是给你造成了很大的负担？“


  立香拿着叉子的手停在半空。


  叉齿上还挂着一小块蛋糕碎屑，奶油在灯光下泛着湿润的反光。


  “那个时候——是你？“


  “是我。“


  两个字。没有迟疑，没有铺垫，声调和呼吸之间甚至没有多余的间隔。Ruler说出这两个字的方式像是在回答“今天是星期几“。


  立香慢慢放下叉子。金属碰到瓷面的声音在寂静的房间里被放大了好几倍。


  “用那杆来历不明的枪的。“她开口了，声音不大，但每一个字的边缘都咬得锐利。“协助我解放宝具的。死在我面前的。同时告诉藤丸立香''活下去''的那个言峰士郎。是你？“


  她把这句话拆成了四个从句，每一个从句之间都有一个可以被听见的句号。像是在逐项核实一份清单。又像是在逼自己重新咀嚼那些她本以为已经消化掉的画面。


  “是我。“Ruler重复了一遍。语气没有变重，也没有变轻。然后他稍微偏了一下头，嘴角的弧度向上牵了牵。“不过纠正一点，特异点的那个言峰士郎也死在了你面前。虽然历史被修复了。“


  空气的温度好像突然降了两度。


  “Ruler。“


  立香叫他职阶名的时候，声带在“R“的发音上绷紧了。那不是疑问，不是呼唤，是一声警告。她的眼睛直直地盯着他，虹膜的深橘色在这个角度下显得格外深沉。


  “你就是要告诉我这些的？“


  “自然不是的。“Ruler的回答来得很快。“刚才是报复你不让我坐床罢了。“


  立香盯着他看了两秒。


  然后她移开视线。


  “小气鬼。“


  “多谢夸奖。“


  “你比你十七岁的时候没脸没皮多了。“


  “哦？毕竟在埋葬机关待过，总要学点东西。“


  “不学好是吗。“立香冷冷地回了一句，顿了顿，又追加了一刀，“看样子吉尔茜教给你的都喂了狗了。“


  这一句的杀伤力显然比前几句高了一个量级。Ruler抱着胳膊的手指动了动。幅度很小，如果不是在注意他的话根本不会发现。


  “她教的东西一直都在。“他说，声调没有变，语速放慢了半拍。“我现在做的事情，也是从她那里学来的。“


  “什么？“立香歪了一下头。


  “半夜不睡觉，给别人做东西吃。“


  三秒的沉默。


  立香的表情经历了一个从困惑到理解再到无语的完整变化。她选择用吃东西来终结这个话题，重新拿起碟子，叉了一大块蛋糕塞进嘴里，鼓着腮帮子含糊不清地开口。


  “啊——刚对你改观来着。看样子又要变回去了。“


  她嚼了两下，咽下去。


  “蛋糕很好吃。“


  这四个字被她用特别轻的声量说出来，夹在前后两段嘴炮之间，像一枚不小心从口袋里滚落的硬币。


  Ruler的目光在她嘴角沾着的那点奶油碎屑上停了一瞬。他垂下眼睛，嘴角那道弧度微微深了一点。


  没有接这句话。等她把嘴里的东西咽干净了，才开口。


  “得知给你留遗言的人又站在你面前了，什么感觉？“


  立香用叉子背面刮了一下碟底残留的奶油。那个动作重复了两次，刮出两道浅浅的白色痕迹。


  “觉得被耍了。“


  “就这？“Ruler的头微微偏了一个角度。


  “你觉得我会想说什么？“立香抬起眼，嘴角勾着一个弧度，“如释重负？开心地看着你跟你说''言峰士郎你没死太好了！''这种话？“


  她学了一个夸张的、带着感叹号的语调。


  “别想了，Ruler。我藤丸立香才不会这么说。“'

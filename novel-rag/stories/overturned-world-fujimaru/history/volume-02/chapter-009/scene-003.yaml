content: 'Archer眼中闪过一丝诧异——希耶尔的力量竟如此强劲。


  “好强的力量，小姑娘。”Archer语气里带着真切的赞叹。


  希耶尔双目赤红、面容狰狞，双手紧握巨剑，死死抵挡着Archer的巨斧——那柄加持了神气的巨斧，本就蕴含着毁天灭地的力量。


  “呃……啊啊啊！”希耶尔发出一声怒吼，猛地发力，将Archer的巨斧狠狠推开。与此同时，Saber从希耶尔身后高高跃起，握着被神之祝福加持的银剑，直劈Archer握着许德拉长弓的那只手。


  Archer当机立断，放弃了手中的许德拉长弓，任由银剑将其挑飞，随即双手握紧巨斧，摆出防御姿态。


  Saber得手后乘胜追击，手腕一扬，银剑带着劲风抽向Archer。


  Archer迎着银剑的锋芒，挥起巨斧狠狠劈下。


  在Saber眼中，那一瞬间，Archer竟仿佛同时挥出了九斧，层层叠叠的劲风将她笼罩。


  【不好！】


  Saber拼尽全力挡下两斧，已然力竭，再也无法抵挡下一击的攻势。


  “加速。”


  话音刚落，希耶尔便瞬间瞬移至Saber身前，轻轻一推，将她远远推开。


  剩下的七斧毫无阻碍地劈在希耶尔身上，她的身躯瞬间被劈成十七段，鲜血溅满了地板。


  可下一秒，希耶尔竟像没事人一般瞬间复原，稳稳握紧了手中的巨剑，神色依旧凌厉。


  “赫拉克勒斯，我又一次得手了！”


  “断罪死！”


  泛着蓝光的巨剑带着毁天灭地的气势狠狠劈下，还没来得及收回巨斧的Archer，再度被希耶尔从上到下劈成两半。


  第三次。


  直到被希耶尔击杀第三次，Archer才终于清晰地记住了这个女人招式的名字


  【断罪死】


  “断罪死吗……”Archer低声呢喃，眼底掠过一丝凝重，脑海中闪过初见时的画面。


  那时希耶尔握着一柄巨大的铳枪，正是借着他死亡时心眼感应的松懈，趁机夺走了他一条性命。


  “那么……藤丸立香！动手！”希耶尔双目赤红，怒吼着出声，周身魔力骤然暴涨。


  轰隆——


  几乎同时，Archer身上骤然亮起刺眼的红光，身形以肉眼可见的速度，缓缓恢复至全盛状态。


  【“一道令咒，能补充Archer两次十二试炼的次数。”


  这是作战会议上伊莉雅补充的信息】


  Archer身上的红光接连闪烁，此起彼伏，显然十二试炼已被彻底补满，又是一副毫无破绽的模样。


  “什么？！”


  轰隆隆隆——


  剧烈的震动席卷全场，整栋酒店的地基应声崩裂，墙体剥落，轰然坍塌。


  “原来如此，趁着我坠落的间隙，你还想再杀我一次？”Archer在失重下坠中迅速稳住身形，反手弯弓搭箭，黑眸死死锁定希耶尔。


  “Saber！保护好自己！他杀不了我。”希耶尔压低声音叮嘱，手中的巨剑光芒一闪，化作一柄造型极度狰狞的金属长弓。


  “还不明白吗，修女！”Archer的吼声穿透坍塌的轰鸣声，“caster拥有无尽令咒，你们根本没有机会越过我这一关！”


  “啊，我当然知道。”希耶尔低声回应，语气里藏着笃定，“但我能拖住你，你也永远杀不了我。”


  大厦在漫天烟尘中彻底坍塌，Saber转头望向希耶尔，读懂了她眼底的决意。'

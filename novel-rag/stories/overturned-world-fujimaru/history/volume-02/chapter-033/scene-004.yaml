content: '“我还以为你是个很可靠、不会犯错的人呢，言峰士郎。“立香歪了歪头，故意拉长了尾音，调侃的语气中藏着一丝只有她自己才察觉得到的释然。那个在特异点F中为了胜利毫不犹豫的殉道者，那个会完全不顾及自己，奋不顾身挡在他人面前的人，此时此刻在她的面前。


  就像个活生生的人一样。


  他不是鬼魂，现在是她的从者，她的伙伴。


  他就是言峰士郎。一个很强，但也会犯很多错误的家伙。


  “好了。“立香收敛了笑容，转身面向奥尔加玛丽，语气干脆利落，“所长，告诉他现在是什么情况吧。不管怎么说，特异点F都已经被修复了。“'

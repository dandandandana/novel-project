content: '立香把名牌收进衣袋。，神琦灰投影散去的湖光仍在眼底反反复复地闪烁。她走出密室，脚下的石板有轻微的凹陷，鞋跟在上面磕出细碎的闷响。走廊里的幽绿灯焰跳了一跳，光影在她脸上交错了一瞬。


  [吉尔伽美什是高等从者。]


  [她是Alter Ego。]


  [那个Alter Ego言峰士郎对我们抱有杀意，但我的Ruler不会背叛我。]


  立香把后脑靠上墙壁。冰凉的石头透过发丝贴上头皮，她在冷意中闭紧眼睛。到现在发生的事情太多，档案室的灰尘味还残留在大衣的纤维里，玛修翻找卷宗时膝盖沾上的灰还没拍干净，爱尔奎特啃梨的清脆声响犹在耳畔。她抬手拍了拍自己的脸颊。


  “那么——”


  立香的嘴唇动了动，后面的字句没有挤出来。她摁住太阳穴转动指尖，发根被扯得微微发麻。投影里神琦灰的笑容和实验室办公室桌上的薄毯叠在一起，再叠上士郎那双总在凌晨毫无预兆亮起的瞳孔。


  她在混乱的思绪里站直身体。手背在裤缝上擦了擦，掌心的汗把名牌边缘浸得温吞。地下一层的空气凝滞沉闷，甬道尽头暗门里的石阶在幽绿光线中时隐时现。立香迈出脚步，正要去推第二个房间的门。


  “迦勒底的御主，有线索了吗？”


  声音从楼梯口响起之后，鹅蛋脸的女人踩着石板走过来。雅典娜的步履不紧不慢，每步跨出去都不见迟疑，衣角在幽绿的灯焰旁划过不带风的弧度。她在立香面前三步的位置停下，英气舒展的面庞在冷光中轮廓分明。


  “这里是计时塔的实验室。”雅典娜做出抬下巴的动作。“那么这里就是计时塔实验室的办公室。”


  立香的拇指指向身后那扇半开的门。她的肩膀还很僵硬，从胸腔到喉咙有一股被投影拽着转圈圈后留下的喘不上气。雅典娜没有看那扇门，她的视线落在立香脸上，停留了三拍心跳的时间。


  “也许是吧。”雅典娜开口。“我并不清楚。”


  走廊里安静了两秒。雅典娜的提问和之前不一样了，每个字都精准地把立香钉在原位，“迦勒底的御主。你有奋战到最后一刻的勇气吗？”


  立香眨了一下眼睛。她的睫毛在冷光里投下细碎的阴影。


  “你说什么？”她的尾音往上翘了半拍。“当然有。”


  雅典娜歪过头。她打量着立香攥紧裤缝的手背和微微起伏的锁骨，目光移动的速度缓慢均匀，像是在翻看档案室里的目录册。“这样的话就很好了。跟我来怎么样？”她说完抬手往楼梯口的方向比了一下。


  “为什么？”立香把重心放在右脚上。


  “有点东西要让你看。”


  “我需要告诉我的……”


  “你自己。”雅典娜截断了立香的话。她的手收回身侧，指节在衣料上叩了一下。“很可惜，目前我信不过你的从者言峰士郎。如果硬要带的话你可以带上那个粉色头发的少女玛修。”


  立香的喉咙上下滚了半圈。她把腕表举到嘴边，拇指悬在通讯键上。她的侧脸转向雅典娜，脖颈的线条紧绷了一瞬又松开。“我知道了。我相信士郎的话，所以我相信你。”


  雅典娜的嘴唇抿了一下，没有张开。她的反应像是把原本想吐出的字咽了回去，只在眼角细微处留了一点痕迹，“这样吗？”


  立香打开腕表。通讯器的指示灯亮起绿色的微光。


  “玛修，来我这里一趟。”


  腕表里传出玛修简短的回话之后，靴跟叩击石板的声音从甬道那头一层层叠过来。玛修跑动的步伐带着急迫但步伐不乱，肩膀几乎擦过走廊两侧的墙壁。她跑到立香身边，看见了站在三步之外的雅典娜，她抬起第七圣典。


  “雅典娜女士，我们现在是盟友吧。”玛修把剑尖压低了三度，剑刃截住她与雅典娜之间的空气。


  “对。我要让你们看一个东西。”雅典娜的目光掠过剑刃扫过玛修的肩头，又转回立香的方向。


  “这件事情我们需要告知Ruler。”玛修握剑的手指纹丝未动。


  “不。我信不过他。”雅典娜的回应没有停顿。


  暗门外探出半颗金色的脑袋，爱尔奎特手里攥着啃了一半的柿子，嘴角还沾着亮晶晶的果汁。她靠在门框上，脚趾在灰尘中蜷了一下。“嗯哼，她连我都信不过，怎么可能信得过你那位Ruler呢？”


  “你是什么意思？”立香的手已经握成了拳头。


  “请不要挑拨离间，雅典娜女士。”玛修的剑尖抬高了一寸。


  雅典娜没有接爱尔奎特的话茬，她只看着立香，再次开口。“一句话，跟我去还是不去。”


  玛修把头转向立香。她张了张嘴，嘴唇翕动了两下，牙齿在下唇上压出浅浅的印痕，最终只把视线落回立香的眼睛。她选择让御主决定。


  [士郎也是谜团重重。就算我知道他的一部分过去也是如此。]


  [我需要更确切的情报。]'

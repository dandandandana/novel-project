content: '“玛修还在上面。”立香的声音从士郎的衣襟里闷闷地传出来。


  “我知道。交给我吧。”


  言峰士郎把她托到墙边，让她的背脊贴上冰凉的石壁。他转身冲向楼梯，脚步声在三秒内就叠上了三楼的高度。立香闭上眼睛。她听见三楼的楼板传来重物撞击的闷响，听见玛修喊了一句什么，听见了金属碰撞的震荡。


  她睁开眼睛，去看那团血肉模糊的东西。


  提亚的残骸堆在地上，剑刃还插在肉块里，刃面映着她自己割裂开的脸。


  “我——”立香的声音发抖了。“我杀人了。”


  她的嘴唇翕动了三次才把最后几个字挤出来。十八岁的少女蹲在计时塔被砸穿的二楼走廊上，手里还握着那两柄被她自己翻开的剑刃。白的枪管上沾了灰，黑的握把被汗水浸出一条深色的痕迹。


  “我杀人了。”她又说了一遍。这次的声音比刚才轻，轻到像是说给自己听。


  墙边的灰尘在破洞的天光中缓缓沉降。她的呼吸又急又浅，每口气吸进去都卡在锁骨上方不肯往下走。剑刃上的血慢慢凝固了，从鲜红变成暗红，再变成接近铁锈的赭色。'

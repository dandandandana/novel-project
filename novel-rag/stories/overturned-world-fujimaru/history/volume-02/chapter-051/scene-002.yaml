content: '立香的拇指在衣袋里顶了一下名牌的硬边。她的后槽牙轻轻咬合，牙关的酸胀感爬上下颔骨。如果吉尔伽美什是内鬼，那义子言峰士郎站在自己这边的概率又有多少。她抬起眼皮对上雅典娜的目光。


  “我知道了。我跟你过去。”


  雅典娜的嘴角上扬了极细微的弧度。“这就对了。”


  玛修收剑，嘴唇抿成一条线。她跟在立香身后踏上楼梯，始终沉默着没有把担心说出来。三人的脚步在狭窄的旋梯上交替叩响，石壁上嵌着的魔焰灯台只点亮了每隔一级才有一盏的幽绿冷光。


  楼梯旋转往上，墙壁收窄又放宽。雅典娜带路走到三楼，在楼梯口停下脚步。三楼的走廊比地下一层宽阔了一倍，天花板挑高足以让长枪直立挥舞。窗缝里渗进伦敦午后的天光，被灰尘卷成白蒙蒙的雾霭。


  “你的从者言峰士郎，他是盖亚的处刑人你知道吧。”雅典娜率先开口。


  “知道。Ruler都告诉我了。”立香停下脚步。


  “你知道神灾的起源是什么吗？”


  “知道。神明被迫来到地表，被盖亚逼得。”立香回答到这里时手指在自己腰侧敲了一下。“你的意思是？”


  “言峰士郎是盖亚的人，他是否值得相信就跟爱尔奎特是否值得相信一样。他有背叛埋葬机关去做处刑人的前科，我认为他的可信度很低。”


  立香的下巴收紧了。她的声音从牙缝里挤出来，温度比方才跌了一截。“盖亚的处刑人和埋葬机关的任务高度重合。”


  “我当然知道。但他是盖亚的人。”


  “前辈。Ruler他……”玛修攥紧拳头。


  [玛修不知道吉尔茜是Alter Ego。]


  “我知道，玛修。”立香的视线转回雅典娜。


  她闭上眼睛。士郎的所作所为被一件件从脑子里翻出来。如果他真要阻碍迦勒底，如果在凌晨安慰她只是伪装，如果尽心尽力协助作战是为了另一个目的，如果他明明需要休息却强撑到现在的话…


  这些如果忽然都安静了。


  “言峰士郎是个笨蛋，但是我相信他。”


  雅典娜看着立香的表情，点了点头。“选择相信自己的从者啊。我知道了。”


  她往前迈了半步，肩膀在林立的天窗下投出利落的斜影。然后她再次张嘴，声音比方才更轻更像说给自己听。“但是，身为迦勒底的御主，你不够格。”


  玛修身上的第七圣典爆发出一阵齿轮咬合的脆响。铠甲自动解开重组的动作快得来不及逐帧看清，一杆枪管粗粝的突击步枪已经架在玛修的肩胛线上。“不许你这样说前辈！”她扣住扳机护圈的手指绷紧，指节节节发白。


  “我说的是实话对吧。”雅典娜纹丝未动。“你能反驳吗，藤丸立香？”


  “你想干什么？”


  “想干什么？自然是找个合适的人了。”


  危机感从脊椎末端窜上后脑。立香顺着雅典娜的肩线看向她的身后，走廊的尽头站着一个金发少年。他的头发是融化的琥珀色，皮肤下流转着不属于人类的微光，瞳孔一只是金的，另一只是竖瞳的冷白。他靠在墙壁上，双手插在裤兜里，嘴角翘起一个很浅的弧度。


  “啊，智慧的女神也会用这么下三滥的手段吗？”少年拖长了尾音。


  雅典娜没有理会他。她只看着立香，伸出右手，掌心向上。天窗落下的白光覆在她掌纹上，几条生命线被照得失真。“交出令咒，我有办法治好你的从者玛修。我来做她的御主。”


  “怎么可能。我的御主是前辈。”玛修握紧枪身。


  “藤丸立香，说到底你也是被推着走过来的。这不是你想要的命运吧。你不应该这样。”


  立香低下了头。


  [如果交出令咒不再作为御主，那我就不用承担这一切了。之前是被推着走，那么现在——藤丸立香真的有资格选择自己的命运。]


  深夜的温暖突然翻涌上来。


  她从记忆的缝隙里捡回言峰士郎说过的那句话：如果你有情绪，就朝我撒气就好了。那句话轻得没有重量，却把最沉的承诺摊在了最暗的夜晚。


  [这不就是说你会一直在我身边吗。]


  立香抬起头。眼眶里的泪水没有落，它们在眼底聚成薄薄的一层，让虹膜的颜色显得比平时浅了一度。“如果我交出令咒，言峰士郎会怎么样？”


  “不值得我信任的人，自然要除掉。”雅典娜的回答像刀刃贴上宣纸。


  “这样——这样让我怎么答应你交出令咒。”立香的声音从低到高一路拔起来，她胸腔震动，喉间哽咽的每个字都变成喊出来的碎片。“士郎他信任我，我也信任他。他是我的从者，我是他的御主啊！我怎能因为自己……”


  她朝雅典娜跨出一步，肩线在颤抖中艰难地维持着平直。


  “我怎能因为这个就让他去送死？我拒绝你的条件！我会自己想办法拯救玛修！我是迦勒底的御主，我不会相信空口之言的女人！”她甩开手臂，手背在空气中划出咔嚓作响的弧线。


  雅典娜挑了一下眉梢。“看样子谈话破裂了。提亚。”'

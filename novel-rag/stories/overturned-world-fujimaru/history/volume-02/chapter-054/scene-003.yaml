content: '立香垂下眼睑，睫毛在颧骨上方投下一小片阴影。她盯着自己踩在石板上的赤脚看了几秒，然后轻轻开口，声音比刚才低了大半。“那就好。”


  雅典娜看着她，那双灰蓝色的眼睛像是在评估什么。“你把自己逼得太紧了，藤丸立香。”


  “哟，认可她了？”伊什塔尔的声音从一旁插进来，带着一种看好戏的语调。“直呼其名的已经算你认可的英雄吧。”


  雅典娜顿了顿。空气在那一刻安静下来，只剩下爱尔奎特嚼葡萄的细微声响。然后她往前走了一步，裙摆在地板上拖出一道浅淡的划痕。“手给我。”


  立香眉头一挑，视线从雅典娜伸出的那只手往上移，停在她的脸上。这个距离近得能看清女神眼睑上那道极细的折痕。她想了想，手指无意识地攥紧又松开。最后她还是把带着令咒的那只手伸了出去，手背朝上，露出暗红色的咒文。


  “哦，看样子并不算特别小心。”雅典娜轻轻握住她的手指，掌心贴在她的手背上。那只手的温度比立香预想的要凉一些。“不担心我直接把你的这个手腕割下来？”


  立香咬了咬嘴唇，把手往回抽了一下，但雅典娜的手指攥紧了，力道不重，却纹丝不动。她没有继续挣扎，只是让自己的手停在女神掌心里。


  下一秒，一股暖流从被握住的地方涌进来，顺着腕骨往上攀，穿过前臂，漫过肘弯，最后在胸膛里铺开。那种感觉不是烫，也不是灼热，而是某种温和的充盈，像是有什么东西从她身体里原本空缺的地方被填补上了。


  “我认可你是英雄了。”雅典娜的声音放得很轻，轻到像是只说给她一个人听。她顿了顿，像是在斟酌措辞。“人理，不。你不为人理而战，迦勒底最后的御主，藤丸立香。”


  暖流在立香的胸腔深处打了个转，然后慢慢沉下去，一直沉到她自己也说不清的位置才停住。


  “我的英杰之帜，将会伴随你作战。”雅典娜松开手，指尖在立香手背上最后碰了一下才完全收回。她微微垂下眼睑，语气平静而郑重。“希望这份力量配得上你，藤丸立香。”


  立香低下头看着自己那只手，令咒的纹路还在皮肤上静静躺着，和握上去之前没什么不同。但掌心残留的是暖意，不只是雅典娜手指的温度，还裹着某种更沉的东西，正在往骨头里渗。她没有说谢谢，只是把手攥成拳头，指节在手心里压出几道浅白色的印子。'

content: '“喂，喂，喂。“伊什塔尔的视线移下来，精准地落在士郎身上，天舟也跟着偏了一点，“你，不许帮忙。吉尔伽美什的孩子，我没打算和你有任何纠葛，这是我和她之间的事情。“


  吉尔茜从宝库里取出一件东西。红黑色圆柱形的剑，持在手里的时候有一种还没启动就已经压着空气的重量感。


  “士郎，不必管我。“


  “那你自己小心。“


  士郎的手落在立香肩上，轻轻的拍了拍。立香点了点头，收紧了拉着玛修的手，跟着爱尔奎特的方向往大厅走去。


  雅典娜看了看吉尔茜，又看了看伊什塔尔，把埃奎斯之盾收起来。


  “别打太久。“


  “失去了神力还这么嚣张，快进去！“伊什塔尔不耐烦地挥手。


  雅典娜走进了计时塔的大门


  院子里只剩下两个人。


  风在院子里起来了，但不是从某个方向起的风。


  它从地面起，从墙缝里起，从那条缝隙里起，是某种更大的东西在外面积压，把空气从所有出口同时往里推。吉尔茜抱臂，EA在她身侧悬浮，剑身本身没有光，但它在的地方，周围的光会稍微偏移，像是空间在绕着它重新对齐。


  “伊什塔尔。“她抬起头，看着天舟上那个人，语气是俯视的，不带有半点愤怒，“如果你只是单纯来泄愤，本王目前没有这个时间。“


  “本女神就是。“伊什塔尔拍了拍手。


  天空的颜色变了。


  变暗了并且变重了——某种东西从云层后面开始往下压，气压在一个不正常的速度里降低，废墟里仅剩的几扇窗框里，玻璃碎渣在窗格里细微地位移了一下。风量在三秒内翻了不止一倍，碎石在地面上滚动起来，部分直接被卷离地面，在距地半米的高度悬着，找不到方向。


  “看你不顺眼罢了。“


  风暴的中心出现了轮廓。


  不是一下子出现的，是从重量开始的。地面先感受到了——吉尔茜脚下的沥青向下坍了一点，裂缝沿着某条不可见的力线延伸出去，在半径十米内的范围里都出现了新的断口。然后是体积，是那种会遮住一整个天区的体积，从风暴里慢慢让自己变得清晰。


  肩膀的轮廓先现形。然后是角的跨度。然后是脖颈，然后是全身。


  天之公牛，古伽兰纳。


  它站在伊什塔尔身侧，或者说，伊什塔尔在它身边找到了自己的位置。它的尾巴扫过来，蹭过一栋三层楼的外墙，那栋楼往侧面倒了三十公分，然后停住，发出低沉的结构性断裂声，就那样悬着，像是古伽兰纳在考虑还没决定要不要继续倒下去。


  “离开了你的儿子，是不是有点怕了——“


  吉尔伽美什没说话。


  她低头，把EA往下压。


  这个动作本身什么都没有。没有光，没有声音，没有任何宣告。只是她的手，和那柄剑，和剑进入了它应该去的位置。


  然后破败的伦敦不见了。


  被替换了。替换的东西不是另一个场景，是某种更靠前的状态，是世界还没有决定自己是什么的那个阶段，现在它被打开了，露出底下的东西。黑红色，不是颜色，是某种光在这里的行为方式不同——它不反射，它折叠，它从不止一个角度同时抵达同一个表面，产生一种空间正在被反复摊开又叠回去的错位感。


  古伽兰纳在里面。伊什塔尔和她的天舟在里面。废墟在里面。全部都在里面，跑不掉，因为“外面“这个概念已经被那柄剑暂时借走了。


  “你要玩。“吉尔茜站在这片黑红色的核心，宝库展开，不是一件两件，是整个宝库，在这个世界的背后再展开一层，“本王就陪你好好玩一玩。“


  赤色眸子在这个光线行为方式不正常的空间里扫过伊什塔尔。


  然后宝具飞出去了。'

content: '立香的目光落在那个金发女人身上，她心中带着疑惑。


  问题已经在喉咙里了，她没打算说出口。


  如果开口问，就等于承认这两个穿迦勒底制服的人不是自己的人。她刚刚一句话换来的入场资格，会在下一个呼吸里消失。


  她侧头看向士郎。


  士郎上前半步，手覆上她的手背，随后轻轻的握了握，像是确认什么，然后放开了。立香转过来，面对刻耳柏洛斯。


  “她们是我们的人。在外围巡逻时和大部队走散了，绕了一段路才赶上来。“


  居中的狮首缓缓低了低，六只眼睛转向队伍后方的两个人。


  “英雄的领导者。“刻耳柏洛斯的声音从三个方向同时传来，在胸腔里形成共振，“宙斯之女，雅典娜——你说她是你的同行者？“


  地面震了一下，来自地层更深处，不是脚步声，是某种更古老的东西在重新分配重量。


  “两个带着星球内侧气息的存在。“三个头颅同时呼出一口气，热，带着腐蚀性的湿意，“雅典娜，你进不来这座塔，就去叫了援军？吾难道分辨不出迦勒底人身上该有的气息与没有的区别？“


  立香的手找到了士郎的腰侧。


  五根手指扣进去，狠狠的掐了一下，然后猛地放开了。


  言峰士郎，表情和身体都没有动。


  立香继续看着刻耳柏洛斯。


  “女神雅典娜是善良与智慧之神。“她顿了顿，措辞在脑子里过了一遍，“这样的存在，当然是我们希望争取的对象。我们运气好，她愿意同行。“


  三个头颅同时偏了偏，弧度不一样，像是三套独立的判断系统在各自核对。


  “……尚算合理。“居中的狮首重新稳住了方向，“那她旁边那位傻乎乎的，又是什么来路？“


  “你说谁傻！“


  声音从立香身后冲出来，清脆且精准，带着一种这个人从一开始就在等着这句话的笃定。立香还没来得及转身，那个金发女人已经从队伍里穿出来了，站在她身侧，一根手指直指着刻耳柏洛斯中间那张脸。


  “你这个毫无美感的巨犬，你知道你和爱尔特璐琪的那条白犬比起来差在哪里吗？人家好歹是狐狸面庞，而你这个——“


  她的话在嘴边断掉了，变成一段含混的呜呜声。


  立香往右侧瞥了一眼，雅典娜的位置比刚才近了一截，手已经放下来了，神情还是那个神情，克制，持续的疲惫，像是这已经不是第一次了。


  爱尔奎特用力吸了一口气。然后哒哒哒地往前走了两步，站在立香身前，手指依然举着，方向对准刻耳柏洛斯。


  “让开。“


  刻耳柏洛斯的六只眼睛慢慢眯了起来，从外侧向内，类似于一种已经出现过太多次的不悦在重新积累。


  立香没开口。她把视线维持在刻耳柏洛斯的中央狮首上，就这样静静的等着它开口。


  沉默撑了几秒。


  “……进去吧。“刻耳柏洛斯把两侧身躯往外移，道路就这样让出来了，“汝等若扰了吾主的安排，吾会亲自来取回代价。“


  爱尔奎特发出一个短促的欢呼声，已经朝着大门跑过去了，推开计时塔里侧的门，走了进去。


  立香看了一眼那个背影，然后跟上去，一手拉着玛修。她把声音压到最低，侧向士郎的方向。


  “她是爱尔奎特？你们千年城的……家伙是不是精神有点问题。“


  “嗯。“


  “之前你们没提过她会来。“


  “我也不知道。“士郎老实的开口。


  立香点了点头，低头看了一眼前方的路，继续走，然后忽然想到了什么，脚步停了不到半步，犹豫的看向士郎。


  “……她听力好吗。“


  “很好。“


  “……“


  立香没再说话，把玛修拉紧了一些，快步跟上爱尔奎特的方向。


  吉尔茜是最后一个跨进大门的。


  前脚才踏过门槛，光从天上来了，某种被速度压缩成线的东西，打在她刚刚抬起来的左手上，炸开的冲击波把计时塔入口院子里仅剩的细碎混凝土渣掀起来，在空气里悬了半秒。


  她手里多了一把金色的剑，剑刃还带着震动余韵。


  “哦吼吼吼吼~！好久不见啊，吉尔伽美什~！“


  声音从头顶传来，清亮，带着主人对这件事有多满意的弧度。天上有一条船，白发红眸，穿着华丽的礼服，驾船的人正用那种特有的自得神情俯视着下面。


  雅典娜的盾出现了。她没有举起来，只是持着，站在原处，看着天上那个人。她的侧脸是一贯的安静，但下颌线稍微收紧了一点。


  “伦敦的人，怎么一个比一个跳脱。“她看了看伊什塔尔，“丰收女神，我们之间有过不开战的协定，你记得吧。“


  “当然记得，雅典娜阁下，我的目标从来不是你。“伊什塔尔的视线没有从吉尔茜身上离开，随手往立香那边挥了挥，“你们不是要救人吗？去救呗，我和老朋友叙个旧，不关你们的事。“


  立香转向吉尔茜。


  “有问题吗？“


  “没有。“


  士郎往前动了半步。'

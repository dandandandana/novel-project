content: '奥林匹斯系的神明，其本体原是来自天外的外星母舰——降临地球之后，他们被人类尊为神明，而这些降临者，也自此爱上了这片土地上的人类。


  十二机神全力迎战赛法卢，最终战败。盖亚吸收了奥林匹斯神明的概念，在星之内海重新孕育出神国，而后，那神国便漂流至希腊的土地上。


  那些来自天外的神明被盖亚吸收后，其“神”的概念便化作星之触觉的一部分，替盖亚感知着这世间的一切。


  此时此刻，大力神赫拉克勒斯的周身，缠绕着几缕若隐若现的红色锁链，那锁链像是有生命般，死死束缚着他的动作，逼迫他驻足在酒店的屋顶，架起弓箭狙击。


  于是，Archer便这样伫立在冬木最高的屋顶，墨色的眼眸俯视着下方——本该灯火璀璨的街道，此刻只剩下一片死寂，连风都带着几分萧瑟。


  他打心底里不愿与曾经的御主和盟友为敌，他们都是心怀善意之人。尤其是Saber的御主，那少年更像一位殉道者，无论前路是地狱还是天堂，都始终坚定地一步步前行，从未动摇。


  明明只是个脆弱的凡人，有必要做到那般地步吗？


  这是Archer心底挥之不去的疑惑。虽说与Saber组结盟的时间不长，但那个少年，却实实在在在他心中留下了深刻的印象。


  果然，那少年还是一如既往地，去救了那位从天而降的少女啊。


  Caster给他的指令冰冷而绝对——狙击所有靠近二十千米范围内的人。但他还是悄悄钻了个空子：他发现，站在这酒店高楼上，刚好能满足指令要求，同时，他只对着从者出手狙击。毕竟，那名御主和自己曾经的御主，根本承受不住他一箭的力量。


  他多想告诉曾经的御主和那名少年，不要靠近柳洞寺，好好活下去。可他什么信息都无法传递，圣杯没有给予他更多指引；即便想用希腊时期的密码加密传信，与他同处一个时代的Caster，也必定能轻易破译。


  更何况，他早已答应过自己的御主，要帮她实现愿望。


  “Archer，我要向圣杯复仇。”


  银发少女的声音，清晰地回荡在他的脑海里，带着难以磨灭的恨意与决绝。


  第四次圣杯战争带来的伤痛，刻骨铭心——不仅有那场吞噬一切的大火，还有少女母亲爱丽丝菲尔的惨死，以及她父亲短暂而悲凉的一生。


  看透圣杯的扭曲本质后，名为卫宫切嗣的男人，不顾一切地将女孩从德国的城堡中救出。原本接受改造后，本该永远保持幼女身形的女孩，也因此得以摆脱非人的折磨，正常地成长起来。


  女孩用父亲卫宫切嗣从爱因兹贝伦抢来的圣遗物，成功召唤出Archer，而她开口的第一句话，便是告知了他自己的愿望。


  复仇，本就是人之常情。Archer认可了这份愿望，在他看来，这场圣杯战争是御主给予他的试炼。


  Saber组早已明确表明，他们的愿望是阻止圣杯灾难降临，尽可能减少无辜者的伤亡。


  虽无法完全信任彼此，但少女认可Saber组的实力和相信Archer的实力足够挡住Saber组有可能的反水，最终决定与他们结盟。


  一切都如他所料，那位Saber是来自法兰西的圣女贞德，对圣杯毫无半分憧憬；她的御主，更是个有着殉道者般坚定信念的少年。


  事情本该顺利推进，Caster召唤出的Berserker虽强悍，却也并非不可应对；即便对Caster的御主有所误判，局势也仍在可控范围之内。


  直到Ruler的降临，打破了所有计划。


  Ruler与那不知为何突然出现的圣杯，几乎是同时降临。Caster的御主夺走了那只圣杯，并用它催化出一只被Ruler称作“白犬”的魔兽。


  白犬以惊人的速度成长，很快便达到了无人能敌的地步。即便未曾交手，Archer体内的“心眼（真）”与“心眼（伪）”也在不断警示他——那是绝对无法对抗的存在。


  白犬的第一声咆哮，便带来了无尽的死亡。为了亡羊补牢，刚刚降临不久的Ruler动用了自己的宝具，在重创白犬之后，便悄然消失在了众人眼前。


  而后，便是一切的崩塌。


  面对拥有无限魔力的Berserker，以及源源不断的魔兽围攻，即便Archer的蛇毒能应对魔兽，也终究双拳难敌四手。更何况，Caster的御主所拥有的固有结界，能直接无视少女施加在他身上的令咒。等到Saber组匆匆赶来时，战斗早已结束，而他与少女的契约也被彻底夺走。


  第二天，saber的御主的养母，吉尔伽美什，被自己和berserker经历了一番苦战之后联手杀死，这位第四次圣杯战争遗留下来的从者实力强的可怕，有圣杯供魔的berserker，caster的几乎无限的令咒，caster御主的场地，缺一不可才能够把她当场击杀。'

content: '南半球的这条河没有名字。即便有，吉尔伽美什也不打算去记它。她立在河岸边的砂石滩上，金发被下游逆流而上的河风从尾梢掀起又放下去，放下去又掀起。阴天把光源压成一整片均匀的灰白，急流撞上礁石时水花被炸成半空中的细密水雾，那雾气飘到她的脸颊上留下了一层薄薄的凉意。


  “那么那件东西……应该就在这里了吧。”吉尔伽美什轻声说道。她的话尾刚落进河水里，身后便有一圈金色的涟漪从虚空中荡开了。那涟漪是无声的——金色的光芒就在空气中绽出一圈一圈的光波然后一扇门在光波的中心推开了。门里飞出来一把铲子，一把镐子，两件工具的表层都镀着一层淡金色的光泽。


  铲子和镐子落到砂石滩上之后便自己动了起来。镐尖刺进地面时发出闷闷的碎裂声，铲刃沿着镐开出的缝隙往下插下去再把泥土一铲一铲翻到旁边。泥土的颜色从表层的浅褐渐渐变成深处的深褐，挖掘的速度始终维持着同一个节奏。


  吉尔伽美什没有看那两件正在自动工作的工具。她偏过头，用那双蛇类一般的竖瞳向河的另一端扫了一眼。竖瞳在阴天的灰光下收缩成两条细线，瞳孔深处那点琥珀色的虹彩此时几乎被压成了环状。


  红发的男人就站在那边。他双手插在风衣口袋里，站姿比吉尔伽美什记忆中那位真正的言峰士郎略紧一些。河风把他风衣的下摆吹得贴住他的腿侧，红发被风掀起时露出额角一小块皮肤。


  “Faker，来这里干什么？”吉尔伽美什的目光没有离开对岸那个与她义子面孔完全相同的轮廓，声音不大，顺着河风被横水流带到了对岸男人的耳朵里。就在她开口的同时，铲子和镐子已经把埋在砂石滩底下的某件东西从泥里端了出来。


  “叫我Faker，难不成你就不是Faker了？”对岸的男人歪了歪头。他的嘴角在说出这句话时往上牵了一点点，嘴角的弧度在河风里固定了片刻。


  “哦？”吉尔伽美什歪着头看着Alterego，“那又怎样？不管怎么说，这个词语对你的杀伤性更大吧。”她把语气压得很轻，轻到最后一个字的尾音几乎被河水的轰鸣盖过去了。她的视线从Alterego的身上移开，落向了那个被财宝从泥土里拎出来的大盒子。


  那是一个朴素的棺材盒。棺材的材质是最普通的木头，河水冲刷的年岁在木料表面蚀出了一道道纵向的浅沟。钉子是用最普通的铁打的，钉头处锈了一层薄红。唯独木料在潮湿河岸埋了多年却没有腐烂——那股子违和的干燥感从棺盖上往外渗。


  “没想到是个这么朴素的棺材盒啊。”吉尔伽美什的目光在棺材的棱角上停留了片刻。


  “这么多年没有腐蚀，我已经做得够好的了。”她一边开口说话一边伸出手去。棺盖被推开时的声响是干的，木料在潮湿的河岸埋了多年却没有吸进半分水汽。她的手指停在棺盖边缘推开的那个位置上顿了顿——然后她掀开了盖子。


  Alterego在对岸歪着头看了这一幕。他的下巴往衣领里夹紧了一点。“刨坟，验尸吗？”


  吉尔伽美什没有回他的话。她静静的看着棺材里金发碧眼的尸体。金发在棺材里铺了一层泛灰的浅色光泽——那种光不是活人头发的润泽，是存放太久的绸缎在光线暗淡处被展开那一瞬间的寡淡的金色。尸体的眼睛闭着，嘴唇没有血色，在嘴侧收成一条很淡的线。吉尔伽美什看着那张脸——它与她记忆里那个少女的面容没有丝毫区别。


  “借尸还魂……吗……”吉尔伽美什低声说道。她伸出手去碰了一下尸体的手腕，触碰处是冷的，没有脉搏跳动的痕迹，没有任何魔术回路的余温。“否。那是什么？”


  吉尔伽美什抬起头看向Alterego。对岸那个与她的义子面孔完全相同的男人就这样双手插在兜里看着她——那双眼睛里的神色不带有任何想帮忙的善意，他的姿态更接近于一个在看戏的闲人。“是什么？”


  Alterego没有立刻回答。他偏了偏头，把嘴角的弧度收回来。“你想知道真的还是假的。”


  “真的答案。”


  “你这么相信我会回答你啊……”Alterego低声嘟囔了这几个字，然后他从鼻腔里透出一声极轻的叹息，“算了——那就告诉你。她对盖提亚说，她想成为地球UO，盖提亚信了。”


  吉尔伽美什微微一顿。河风在这停顿里把她的金发吹得过肩。“怎么说都不可能，骗人的。”


  “嗯。”Alterego点头的动作很浅。他低下视线扫了一眼自己脚尖旁被河风吹得摇晃起来的草叶。“我能告诉你的很少，大概……收集七位Beast的权能，是她达成目标的一部分吧。”'

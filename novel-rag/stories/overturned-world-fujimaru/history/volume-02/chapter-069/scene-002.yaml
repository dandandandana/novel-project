content: '吉尔伽美什的目光没有从Alterego脸上移开。她把棺材里那具金发尸体收进王之财宝的金色涟漪之中，空的棺材在她身后被铲子和镐子重新推回了原来的坑里。“做到哪一步了？”


  “很近了。”


  “盖提亚是其中之一吗？”吉尔伽美什与Alterego对视着问道。“不是。”Alterego摇了摇头，他说话时已经把身体往远离河岸的方向偏了一点点，鞋跟在砂石地上碾出一小片浅坑。“他所做出来的特异点之一——里面有她要的东西。”Alterego把这十几个字一个字一个字地吐干净，最后一个字落进河风里之后他停了片刻。


  “我能说的就这么多了。卡桑。”


  吉尔伽美什愣了愣。她的下巴往锁骨处低了一点，喉结在颈前的皮肤下轻轻滚动了一遍。“我不是你的——罢了。”她叹了口气，那口气被河风从嘴边抢走飘进了河水的轰鸣之中。


  Alterego抬头看了看天。阴云把天空罩成一张无边的浅灰色的布，看不出太阳的位置也看不出时刻。“原本打算杀你来的。”


  “现在为什么改主意了？”吉尔伽美什把双臂叠在胸前。


  Alterego想了想。他的手指从风衣口袋里抽出来，摩挲着腰间长剑的剑柄顶端。指腹在金属上蹭过去时没有发出声音。“杀你和杀他都是泄愤而已。现在我心情不错，等我哪天心情不好了再找你们泄愤就好了。”


  “这样啊。”吉尔伽美什看着Alterego。她的目光越过河面的水雾落在这个红发男人的脸上，但焦距似乎调得比那张脸更远。“我不是一个合格的母亲。”


  “谁都知道。”Alterego回应得很快。然后他把嘴唇抿成一条线，顿了片刻。“不过，你不需要对我道歉。”


  河风在这句话的末尾卷起了一小阵细沙，沙子打在他的风衣上发出细密的沙沙声。Alterego朝着河岸另一侧的反方向迈开了步子。阿尔托莉雅在远处的矮丘上等着他，那个漆黑铠甲的剪影在灰色天空下被拉得形同一尊逆光的雕像。他朝少女走去的步伐不快，每一步都在砂石地上踩出浅浅的一个印子。河雾在他身后缓慢合拢。


  “也许已经晚了吧。”他这句话说得很轻，轻到被河风裹进水雾的瞬间就消散了。


  迦勒底的走廊在夜晚十点之后安静到能听见墙壁里面管线流过的某种液体的声响。言峰士郎的靴底在走廊地板上踩出的脚步声被四周的墙壁吸掉了一大半，剩下一小半在走廊的天花板上弹了两次之后也消散了。他停在藤丸立香的门前，抬手敲了敲门。


  门开了。立香斜着眼看着士郎，她刚洗过澡，头发还没完全干，发尾湿着搭在肩膀的常服布料上晕出几个深色的水印。“进来。”


  士郎侧身走进房间。他的肩膀擦过门框边缘时偏了一下角度，然后顺手带上了门。门锁的扣舌咔嗒一声落进门框的凹槽里。“第二次进你御主的闺房感觉如何？”立香把双臂叠在胸前，斜向上挑的眼角被暖色灯光照得柔和了线条。


  士郎递给立香一杯汽水。玻璃瓶的外壁上凝结了一层密密麻麻的水珠。他用视线把房间扫了一遍——书桌上有几本书摞歪了，换下来的外衣搭在椅背上，一双袜子一只在床头柜边一只在床脚旁。“比之前乱了，为什么不收拾？”


  “哼哼，你不是说今天要来吗？”立香接过汽水瓶，瓶身的水珠沾到她的手指上留下几道细细的湿痕。


  “明白了。”士郎点了点头。他把袖子往上挽了两圈露出小臂，然后弯下腰开始收拾房间。一只手把书脊对齐塞回书架上，一只手拎起椅背上的外衣叠成方方正正的四方块放在衣柜旁边。“御主。”


  “嗯？”立香坐在床边喝了一口汽水。气泡在她舌尖上炸开时她微微眯了一下眼睛。


  士郎把一处散落的书籍归了位。他蹲在书架旁边时后脑勺的高度刚好和第三层书格的边缘齐平。“第一次杀人的感觉怎么样？”


  立香刚要开口，喉咙里的气流顿了一下。她手中的汽水瓶停在嘴边没有放下。“是不是有点晚了——问这个问题。”她的声音比刚才闷了半度。


  “你只是把这个问题压在了心里，但你没有去想。”士郎清理出来了一块区域，把叠好的衣服放上去然后直起身子转向立香。“你需要直面这个问题。”他说这句话时的语气和他在核电站说“应该没什么问题，达芬奇亲”时是同一个语速。


  “真有你的。”立香嘟囔着，她把汽水瓶搁在床头柜上，瓶底磕在木质柜面上发出一声短促的闷响。“过去几天了——让我想起来，也会觉得犯恶心啊。”


  “第一次夺走人的生命，哪怕是敌人，也会觉得没有实感吧。”士郎低声说道。他把立香换下来的袜子捡起来放进洗衣袋里。'

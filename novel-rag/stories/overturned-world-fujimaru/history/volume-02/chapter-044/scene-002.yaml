content: '“面对彼此知根知底的存在，还先手进攻？“Alterego把刀收回来，“那不叫勇猛，那叫不开窍。“


  “刚才你可像条见到粪的恶犬一样直接扑了过来哦~“


  Alterego的表情动了一下。


  士郎的身形从那个位置消失——两剑抽到Alterego脸前，不是要命中，是要逼他移动，看他往哪个方向移，移动时有没有破绽，破绽有多大。


  Alterego往后左侧让了半步。没有过头。


  士郎把这个记下来了。


  之后的交手密了起来，两人在塌陷的楼群之间穿行，脚踩废墟，身形切过还没完全倒下的钢筋骨架，没有一合是为了分胜负，都是彼此在读对方。那栋被天丛云第一剑剖开的高楼，在横向冲击的累积下终于失去了支撑，以一种慢而沉的速度往侧面斜下去，发出持续的碎裂声。


  十秒，约二十合。


  士郎脱出，在间隙里吐出两个字，手前顿时爆出一道白光，压缩的，集中的，没有多余的照耀，直接推了过去。


  Alterego被推着往后，落在一栋缺了东北角的楼顶，看着对面的士郎。


  “比格洛雷斯聪明。“Alterego说，语气里有一点点是真实的。


  士郎落下来，位置稍低，但视线通畅。他没有停，继续想，一边想一边开口——这样更快。


  “可以读取对方的武艺，并把它上升一个等级来发挥。“他顿了顿，“加上投影装填原本就能复刻对手的基础参数，两个叠在一起，不是简单地加一级，是在加出来的那一级上再加。“


  停了停。


  “不过……已经不能叫投影装填了吧。“士郎想了想，“结合了阿波罗的全力斗技之后，叫''全力装填''才对。“


  Alterego的持刀手臂沉了半寸。就半寸，动作非常小，但停下来了。


  “有了这个，近身战就是字面意义上的无解。“士郎的语气没有起伏，像在说一件已经验算过的事，“任何在武艺上站到了极限的人——无论是宫本武藏达到的无之境界，还是随便哪一位到达了各自顶点的武者、英雄、王——只要他们动手，都会在你这里多出来那一级。“


  Alterego没有说话。


  “但是。“士郎继续，“能够被这个能力读取并拔高的前提，是对方要有武艺。英雄、武者、战士、王、救世主这一类的……有武艺积累的存在，你遇上了就是正向叠加。遇上那些不靠武艺站场的对手，这项能力就发挥得有限了。“他停了停，“当然你本身的底子就是神域级别，面对没有武艺的对手也不吃亏。只是那个复合的效果出不来。“


  视线对上Alterego的。


  “你是专门为了对付从者而被造出来的。“


  这不是在问他。


  “你的制造者在你身上下的功夫，已经超出我的本领了。“


  Alterego沉默了一段时间，他微微歪头看着士郎，似乎在思考什么。


  然后他的语气重新回来了，那种轻飘飘的、带着毒的语气：


  “我早就说过我有对从者特攻了吧~“他歪了歪头，“你不会不信任你御主发出的情报吧，言峰士郎~“


  “我是不信任你对我御主发出的情报。“士郎说，然后开始缓慢踱步，“这是两回事。“


  天色骤然变了。


  金色的光从地平线方向漫开，头顶铺满了那种特有的、属于王之宝库敞开的光泽，然后是轰鸣——宝具从门里出来，密集，多向，带着那个人特有的漫不经心的准确。


  Alterego连头都没有抬。


  他侧边的空气里，同款的武器从无到有地出现，方向对上吉尔伽美什打出来的那些，两边的宝具在空中对撞，相互消解，都没有落下来。


  “投影，开始。“


  士郎同时投影出八把刃器，向量分散，让三个不同方向的角度同时成立，不留可以被单一应对方式覆盖的空间。


  Alterego踏出一步，刀只用了一个轨迹，八把同时散了。


  他意识到了什么，停了一下，看向士郎。嘴角动了动，带出了半截笑声。


  “你这家伙在搜集情报？“


  “这不是必须要做的事情吗。“士郎语气轻松，“还是说……有什么见不得光的东西，不方便让我知道？“


  Alterego没有接这句话。


  他缓缓后退一步，脚踩稳了，挡住吉尔伽美什的下一轮射击，然后就在那个位置，灵体化消失了。宝库打出来的最后一轮穿过那个空间，在废墟里轰出一片新的坑洼，然后安静下来。


  楼群的残骸还在发出沉降的声音，细碎的，断断续续的。


  士郎站在原地，没有动。


  手环震动。


  “Ruler，情况如何？“


  “他走了，御主。“停顿了一下，“我没有受伤。“


  副驾那侧，立香吐出了一口气。


  “……是吗。“她往椅背上靠了靠，“那可是Alterego，我还以为……“她停下来，把后面那句话压回去，“算了。你没事就好。“


  玛修的手在方向盘上松开了一点力道，没有说话。'

content: '吉普车压着碎石驶上了东西贯穿大道，玛修两手扶稳方向盘，车头灯把前方的雾切成两道平行的白光柱，一段路一段路地从黑暗里推出来。


  头顶上，金色的涟漪一波接一波在云层下方荡开，吉尔伽美什的宝库没有停，每一轮射出的东西都精准地砸进道路两侧游荡的死徒之中，爆炸声从左右两边零散传来，没有节奏，但稳定。车轮碾过一截被炸开的路面，颠了一下，玛修踩了踩刹车，调整，继续往前。


  “前辈。“玛修的视线没有离开前方，“计时塔那边……真的被围死了吗？“


  立香低头看着手腕上的投影，那个密度图在微光里浮着，时钟塔的方位标注是橙红色，深到快发实了。


  “是被围了。而且……“


  她皱了皱眉头。


  那片橙红色开始变动。不是渐变，是一块一块地往下掉——某几个方向的死徒密度在骤然减少，减得很快，快到不像自然扩散的结果，像是有什么东西在从里面往外清场。


  与此同时，正中的魔力读数往上跳了一格，又跳了一格。


  “前方的死徒在骤减。“立香的声音压低了一点，“但是有个很强的魔力波动，不是我们这边造成的。“她停顿了一下，“有其他人介入了。“


  “是友军吗？“玛修往后视镜扫了一眼。


  “或者……“


  通讯手环振动了一下。


  “接敌，御主。“


  来自言峰士郎，语调没有起伏，像在汇报天气。


  “男性，红发，黑衣，主武器是太刀。“


  立香盯着投影里士郎的位置标记，那个光点没有动。她的手有一瞬没有动。


  红发。黑衣。太刀。


  “是Alterego。“


  她听见自己说出来了，声音比想象中平得多。早就知道会碰上的，只是没想到这么快。


  “他果然来了。“立香握着手环，“Ruler，先尽量——“


  “他朝我过来了。“


  她那句话的后半截卡在喉咙里。


  然后是一声通讯里的金铁锐响，两把重量级的东西在某个点上找到了彼此，声音通过手环传进来，像是把什么东西的骨架一起传了过来。紧接着，爆炸。低沉的，压着的，连带着碎石坠落的轰鸣同时涌进来，手环里的信号抖了一下，稳住，还在。


  “玛修。“立香抬起头，“支援Ruler，现在。“


  “收到！“


  方向盘往右一带，轮胎在地面上留下一道摩擦的声音，车身侧倾后压平，朝着位置标记的方向开出去。


  言峰士郎用两支黑键交叉挡住了那一剑。


  力道是真实的。不重，但精准——角度、分配、手腕旋转的幅度，Alterego没有试探的意思，进刀就是全速。士郎在两支交叉的黑键上撑了两秒，读着那个压力传进来的方式，然后松手，后撤，黑键在空中消散。


  Alterego挺直了身子，看着他。


  “哦~“他的语气很轻，“她竟然把你叫出来了啊~“


  头侧了一下，那个侧头的动作不像漫不经心，像是等了很久的东西终于发生了，而发生了之后反而不知道该怎么接。


  “你这个家伙……好好的在里侧等死不就好了？！“


  那句话里有恨意，确实有，但士郎注意到了另一件事——“里侧等死“这几个字，Alterego说出口的时候，落点落得很准，准到像是在说自己也清楚的某件事。


  士郎没有接这句话。


  Alterego调整了握刀的位置，重新过来。


  “此身为剑所天成——！“


  没有铺垫，没有试探，真名直接开放。士郎在那一刻确认了：Alterego在碰上他的第一个十秒里，就放弃了所有的迂回，把最后的手段摆出来了，摆在了两人初次见面的正中。


  “天丛云——！“


  一剑劈出。


  那道弧线穿过了好几栋楼的高度，不是摧毁，是划开，像什么东西在城市的骨架上凿开了一条裂缝，两侧楼层的截面在空气里停了一秒，然后各自开始塌陷。


  落点那里没有士郎。


  他在剑抵达之前喃喃了几个字，脚下的空气像镜面折断一样爆开，原来的位置再没有他这个人了——不是闪开，是那个位置本身不再成立，人在二十米外的废墟边缘重新出现，右手的黑键已经出手了。


  Alterego没有转头，只是抬手，剑身侧转，黑键叮的一声弹开。


  他勾了勾嘴角。


  “原理血戒啊~“


  言峰士郎的视线落到他没有持刀的那只手上，他嗤笑了一声，开口：“你得到了神明的权能，就必然要失去一些东西，是吗。“语气是那种摸到了什么边缘的好奇，夹着一点轻巧的嘲讽，“这是你没能带来的东西吧~“


  士郎又投出三支黑键，角度分开，让它们没有办法用同一个动作全挡下来。


  Alterego用两个动作加半步化掉了全部三支。


  两人就这样站定，周围的尘土还在天丛云那一剑扬起的气流里慢慢沉降。


  士郎微微歪了歪头：“我以为你会直接攻过来。“'

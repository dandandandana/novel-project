content: '立香愣了愣。


  玛修往前探了身子，“什么？就连我都有C的骑乘啊前辈！“


  “这还是Saber职介补正过的。“吉尔伽美什表情没有变化，把高脚杯重新端平，“总而言之别让我开车就好了，骑马蹬自行车都不行。“


  “收到了……“立香点了点头。


  机舱顶部的播报灯亮起，短促的提示音响了。


  “乘客们注意，我们将在伦敦绍森德机场降落，彼时会有很多死徒迎接~“


  立香拍了拍两边脸颊，把脸上最后一点倦意拍散。


  她低头，右手压上右侧枪套的外壁，确认安魂的位置，再压了压左边，两杆都在。


  立香抬起头，看了看前后的两个人。


  “啊，要上了。“


  绍森德机场的停机坪还没有全亮。


  雾从跑道两端漫过来，压着舱门打开时透出的灯光。舱门开启的瞬间，外面的冷湿空气涌进来，带着旧沥青和潮土的气味。


  然后，金色的东西从飞机上方浮现出来。从展开的光膜里逐件推出，刃身、枪头、箭矢，形态各不相同，高速射向停机坪四周正在围拢的死徒群。命中之处没有拖沓，嚎叫声随爆裂散进雾里。


  “前辈小心！“


  玛修率先跃下舱门踏板，第七圣典的剑形态在落地的同时展开，银色板甲锁定，持剑的姿态压低，扫了一圈外围死徒的分布。


  吉尔伽美什迈步走出来，白色迦勒底制服没有一点褶皱，脚踩停机坪，右手再度抬起，光膜在手背后方重新展开，又是一轮宝具飞出，砸进外围死徒最密集的区域。


  士郎最后一个出来，在立香身旁停下。


  “我去侦察，开路交给你了，卡桑。“


  “嗯，去吧。“


  话落，脚下一蹬，往停机坪外侧拔高，转眼不见了。


  “立香，先走。“吉尔伽美什收回右手，“如果有漏的，交给你了，玛修。“


  “收到。“


  立香从舱门踏板跳下来，落到停机坪上，双脚踩稳。外围的死徒群已经被打散了大半，剩余的几只在爆裂的边缘徘徊，没有立刻往这边拢过来。


  她举起安魂的右枪，对准了其中往前冲的一只，扣下扳机。


  心象弹命中，没有延迟，内爆在那只死徒体内开始，灵基从里向外碎裂，然后停止了动作。


  立香收回枪口，朝玛修的方向点了点头，“走。“


  手腕手环的方位标记亮了。


  立香低头，手指划开投影，士郎在另一端标注了机场C出口的方向。她核对了一下方位，带着玛修和吉尔伽美什往那边走。


  机场大厅里倒着几根指示牌，立香绕过去，没有停。售票台后面趴着几只死徒，被穿透了，已经不动了。她没有多看，继续往前走。玛修跟着，保持在立香身侧稍后的位置。吉尔伽美什压阵在后，步子走得不快，但始终没有落下。


  走到C出口的时候，外面比里面开阔，雾薄了一些，地面上有死徒残余的痕迹，但没有活动的目标了。


  言峰士郎站在出口外不远处，制服袖口还是卷着，手环的标记灯刚刚熄灭。


  “清理了一小片，往前可以直接走。“


  “了解。“


  立香低头，划开手腕的投影面板，达芬奇发来的伦敦资料展开在手背高度，逐行扫过，手指在其中一行上停了停。


  伦敦的地图，时钟塔的位置，阿斯特拉院的分布，各区段已知死徒密度。死徒密度标注在时钟塔一带最高，橙色深到快成了红色。


  她把投影面板收起来，抬头看向士郎。


  “Ruler，知道计时塔在哪吗？“


  “知道。“


  “先去计时塔。“


  停了停。


  “第一项任务。“


  又停了停。


  “治好玛修。“


  玛修在她背后没有说话。立香也没有回头。


  出口外的雾还在，这里的空气比停机坪里还要冷，沾在皮肤上是细密的湿，不重，但不散。士郎点了点头，没有多问。


  “我们降落已经很高调了，接下来打算怎么过去？开车需要自己找，或者用宝库里的载具。“


  立香捏着下巴想了想。


  [两种意思。已经高调了索性继续高调，或者……已经够高调的了，别再叠了。]


  她选了第二种。


  “隐蔽行踪比较好。“立香收回手，“伦敦里面不确定是友军还是敌人，先别亮底牌。Ruler，麻烦你去找辆车。“


  “收到。“


  士郎脚下一蹬，腾空，往机场外围的街道方向掠去，消失在雾里。


  立香把手环上的投影收了，吉尔伽美什走过来，在她旁边站了站。


  “计时塔那一带的死徒密度很高。“吉尔伽美什低头看了一眼立香手腕上已经收起的投影位置，“不只是外围游荡，有围堵的痕迹。“


  “我看到了。“立香点头，“到了再制定方案，现在情报不够。“


  “嗯。“吉尔伽美什没有再说，退回到原来的位置，把外套领口往上拢了拢，背靠着出口的墙站着。


  玛修在旁边站定，第七圣典的形态已经收起来了，回到了便服状态，只有手腕上的装甲链节还挂着。立香看了她一眼，没有问什么。


  三人等了一会儿。'

content: '手环标记重新亮起，立香确认方向，带着玛修和吉尔伽美什往那边走。绕过一排废弃公交车，拐进旁边的支路，一辆吉普车停在路边，四扇车门全开着，引擎盖上留着几个手印。


  士郎站在车旁，袖口还是卷着的。


  立香在车前站了站，看了看吉普车，又看了看士郎，“……不干修理工和飞行员了，转行当小偷了吗？“


  “紧急情况。“士郎表情没有变化，“等伦敦的人理修复，我会用工资卡补给车主的。“


  “……确实。“立香点了点头，觉得这个逻辑没什么毛病。


  她注意到吉尔伽美什在这时候把头转向了旁边，背对着立香这个方向。


  “吉尔茜？“


  吉尔伽美什没有回话。


  立香把手收回来，想了想，“哦，对，你们家也不缺钱，吉尔伽美什还是迦勒底最大的赞助商来着——“


  “出发吧，立香，越快越好。“吉尔伽美什咳嗽了两声，把手搭到腰间，换了个站姿，脸上的神情是那种刻意收回去的样子，比平时多了一分略显僵硬的端正。


  士郎往吉尔伽美什那边侧了侧，把转过去的头收回来，没有开口。


  [……看样子有什么内情，不对。]


  立香在吉尔伽美什的反应里捕到了什么，在那里停了停，没有追问。


  士郎忽然意识到了什么。


  [……卡桑哪里来的钱？她不是一直靠我的工资卡过日子吗？]


  立香决定先不追了，回头再说。


  “玛修，开车交给你了。“


  “收到，前辈！“


  “Ruler，能跟上吗？“


  “可以。“


  “出发。“


  玛修滑进主驾，握好方向盘，踩下油门。车轮碾过地面的玻璃碎渣，朝着伦敦城区的方向开出去。雾在车头灯的光柱里一层层往后退，把路面从黑暗里推出来又推进去，交替着，没有尽头。


  立香靠在副驾的椅背上，手掌压在腿上，看着窗外。


  [治好玛修。第一项任务。]


  这个念头在脑子里压了压，压稳了，收进去了。


  她转头确认了手环上士郎的位置标记，把投影关掉，往椅背上再靠了靠。


  士郎从车侧拔高，在吉普车行进方向的侧面保持距离，没有落下。'

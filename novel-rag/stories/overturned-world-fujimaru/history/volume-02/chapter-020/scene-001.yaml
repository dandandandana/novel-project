content: '凌厉剑光如暴雨倾盆般倾泻而下，刃风裹挟着细碎的魔力光晕，直直射向灵长类杀手。角斗场早已被它周身溢出的黑泥彻底覆盖，粘稠的黑泥像凝固的沥青般铺满地砖，脚掌踩上去便会发出黏腻的“咕叽”声，稍一用力就会深陷其中，难以拔出。


  对绝大多数从者而言致命的黑泥，于Alterego却毫无侵蚀之力。他缓步踏在黑泥中，黑色风衣的下摆轻轻掠过粘稠的泥面，竟未沾染上半点污渍，步伐沉稳而坚定，径直朝着灵长类杀手的方向发起了毫不留情的猛攻。


  灵长类杀手纹丝不动地伫立在原地，猩红的眼眸里毫无波澜，仅凭体表溢出的黑泥便轻描淡写地接下了Alterego的所有攻击，却也始终无法对他造成任何实质性的伤害。Alterego的武艺显然远胜希耶尔，甚至隐隐压过了那位Archer——至少当他施展出与Archer如出一辙的战技「射杀百头」时，灵长类杀手紧绷的躯体明显露出了一丝戒备之色，周身的黑泥都泛起了细微的波动。


  两人在黑泥覆盖的角斗场上缠斗了许久，金属碰撞的脆响与黑泥飞溅的声音交织在一起，Alterego的风衣被划开数道裂口，身上布满了深浅不一的伤口，虽已遍体鳞伤，却依旧眼神锐利，未曾有过半分败退的迹象。


  “噗嗤——”“砰！”


  灵长类杀手抓住Alterego的一个破绽骤然得手，锋利的利爪带着黑泥的腥气，几乎撕裂了Alterego的半边躯体，粘稠的黑泥顺着伤口往里渗透。但他仿佛毫无痛觉一般，眉头都未曾皱一下，转瞬便催动不知名的魔术，淡白色的光芒笼罩住伤口，迅速修复了破损的躯体与风衣，唯有几处较深的伤口未能彻底愈合，仍在缓缓渗着暗红色的血珠。


  “啊，对灵长类的否定，竟能侵蚀不死性……”Alterego用指尖轻轻按住渗血的伤口，语气平淡得仿佛在谈论一件无关紧要的小事，“确实难缠，当年埋葬机关那般缜密，怎会没发现你这隐藏的能力？”


  “换做希耶尔中这一招，怕是早已失去战斗力，倒地不起了。”他话音刚落，便猛地向伤口注入魔力，粘稠的黑泥瞬间从伤口处涌出，散发着刺鼻的腥气，他反手一把攥住黑泥，狠狠将其从伤口扯出，随手丢向远处的黑泥堆中，溅起一片泥花。


  “好在，我本就不是正常的灵长类。”Alterego嘴角勾起一抹轻佻的笑意，眼神重新变得锐利，握紧手中的长剑，再度纵身冲向灵长类杀手，两人又一次缠斗在一起，刃风与黑泥的碰撞愈发激烈。


  噼啪的脆响骤然响起，灵长类杀手身上的鬃毛尽数竖起，根根都带着漆黑的光泽，体表的圣杯黑泥飞速凝结，化作一根根尖利的黑刺，密密麻麻地布满全身，宛如一头彻底炸毛的巨型刺猬，散发着致命的气息。未等它纵身扑来，Alterego迅速拔出腰间的太刀，手腕轻抖，凌厉的刀风呼啸而过，瞬间将所有黑泥尖刺齐刷刷削落，黑刺落在地上，瞬间融化回粘稠的黑泥。


  “都说了，你我奈何不了彼此。”Alterego无奈地摇了摇头，目光随意地扫向远方的天际，语气里带着一丝慵懒，“不过，我的援军已经到了——灵长类杀手。”


  他轻轻向后退了两步，手中的长剑贴着地面轻轻一划，“撕拉”一声脆响，被黑泥牢牢覆盖的地面骤然被一道魔力刃切开，清理出一片干净整洁的区域。紧接着，两道身影伴着强劲的劲风从天而降，稳稳落在这片干净区域上，正是握紧盾牌的玛修与手持银剑的Saber。


  玛修立刻举起手中的盾牌，盾牌表面泛起淡淡的魔力光晕，眼神警惕地盯着眼前这张与言峰士郎有七分相似的成年面庞，周身的魔力都紧绷着，随时准备应对突发状况。Saber则握紧手中的银剑，剑刃泛着清冷的寒光，神色凝重地与Alterego对峙，周身散发着沉稳的战意。


  “来了啊。”Alterego挑了挑眉，语气依旧轻佻，目光在玛修与Saber身上扫过，慢悠悠地开口：“不过问题来了，你们激活月虹的扳机，那位言峰士郎，怎么还没到？”


  “他一会就到。”Saber压低声音回应，语气坚定，手中的银剑始终对准Alterego，没有丝毫放松警惕，眼神里满是戒备。


  “啊，没记错的话，触发月虹扳机的方法，是让言峰士郎濒死吧。”Alterego侧身轻松挡下灵长类杀手突如其来的突袭，黑泥在他身前碎裂开来，他头也不回地向玛修与Saber问道：“你们打算用什么方法，让他达到濒死状态？”


  “让我的御主濒死，我们自有办法保证他的性命，并触发宝具……”Saber的话还未说完，便被Alterego不耐烦地打断，语气里带着一丝嘲讽。'

content: '吉尔伽美什推开管制室的门时，达芬奇的声音刚好从讲台上飘下来。投影仪在暗下来的房间里铺开一片淡蓝的色块，大屏幕上跳出一个被红圈标记的卫星扫描图。


  吉尔伽美什没出声，她绕到最后一排靠墙的位置站定，华贵的礼服下摆蹭过金属地板时被静电吸住了一瞬。


  “下一个特异点已经锁定，但是无法确定是什么时间节点……或者说，是完全异变的时间节点。”达芬奇手里的指示笔在大屏幕上划了一道线，光标停在红圈的正中央。


  她歪了歪头，影子斜在墙上晃了一道细细的黑弧，“对于我们来说，可能面对的是完全不一样的历史，以及……”她把拖音翘上去半度，“可能不是人的生物~”


  “不是人？”立香正在台下做笔记，她从笔记本上抬起头，眉头皱起来时额头上挤出的细纹被投影仪的蓝光填成了两道浅浅的紫线。


  达芬奇一本正经地点了点头，手指在投影键盘上敲了个键，一只卡通海豚的简笔画浮现在大屏幕右下角。


  “字面意义上的不是人哦~如果是从根上抹除了黑猩猩的进化路线，那么人类不就不存在了吗？没准会有全是海豚的特异点嘛~”她把海豚尾巴画了个圈，然后手指一挥让那幅简笔画缩成一个气泡消失了。


  “明白了……所以最关键的是交流吗？”立香的笔戳在自己嘴边——笔帽那头抵着嘴角把嘴唇推歪了一点。


  “是，不过Ruler的魔术有类似于通晓语言的魔术，如果不是波的话……再另说吧。”达芬奇把指示笔在指间转了一圈。笔尖划过空气时带起一道蓝莹莹的残光。


  “明白。”立香在本上记录下来几笔。笔尖在纸面上刮出沙沙的响声，字迹从纸页左边往右推了几行。“还有吗？”


  达芬奇合上自己的书，书页合拢时压出一声细小的空气被挤出来的嗤响。她看了一眼在座的几人——立香、玛修、士郎、希耶尔，还有不知什么时候站在角落里的吉尔伽美什。


  “到那里大概会有来自人理的从者的支援，会有另外的从者哦~虽然迦勒底的FATE系统不知道为什么一直没能正常进行召唤，到那里大概是有支援的。”她把最后一句话的尾音收在一个淡下来的微笑里，“我没什么要说的了。”


  奥尔加玛丽把手放在讲台上，她扫了一眼台下的每个人，然后开口时嘴唇张开又抿了一下才把话说出来：“过于煽情的话我也不说了，不过我相信各位，就用第一个特异点做我们的试刀石吧。”


  奥尔加玛丽看了吉尔伽美什一眼，她欲言又止，嘴唇动了一下但没出声。最终她把手从讲台上抬起来又放下去，“计划在一周后进行量子转移，麻烦大家了。”


  奥尔加玛丽拍了拍手。手掌拍在一起时发出的脆响在管制室的强化玻璃上弹了一次然后被吸音层吃掉。散会之后，迦勒底的工作人员大部分都离开了管制室。管制椅被推回去时椅脚蹭过地面发出连续几声吱嘎。


  但在场的要去攻略特异点的人都没有动，只有玛修站了起来，她的座椅弹簧往上弹回来发出很轻的金属叮当。当她意识到不对的时候她又坐了回去，座椅在她体重下重新陷下去半寸。


  “前辈……怎么了？”


  立香翻看着笔记。她的拇指从纸页边缘一张张划过去，指甲刮过笔记纸面的粗糙纤维。“我怎么知道，大概有什么要说的吧。”她把笔夹进笔记本的封脊里合上，“我晚上还要跟希耶尔前辈进行训练，只希望别耽误啊……”她的手指在笔记本封面上敲了两下，指腹敲在硬纸板上闷响了两声。


  吉尔伽美什从角落走了出来。她的步子不急不缓但方向很明确，她走到奥尔加玛丽面前停下，那双蛇一样的眸子在银发所长脸上停了三秒。“我知道你有要问的。”


  奥尔加玛丽握紧了拳头，银发之下她的眉头在眼眶上方挤出了两条浅浅的竖纹。“我的父亲，马里斯比利，为什么会被法政科带走。”她把这句话一个字一个字从齿缝里推出来，尾音没有上扬也不是压低，是抖着平行的淡线。


  士郎不知何时端过来两杯红茶走到立香和玛修身边，给二人一人递过去一杯。杯底磕在立香手边的桌面上时发出一声很轻的瓷响——他给玛修那杯少搁了一块糖，给立香那杯多加了一块。


  “啊，谢谢前辈。”玛修双手捧着茶碟接过红茶，她笑着开口道。


  立香接过红茶但没有喝。她双手捧着茶杯，视线从杯沿上方越过——看着奥尔加玛丽。她在等几个知情人开口。


  士郎见希耶尔和吉尔伽美什都闭口不言，歪了歪头。他那双琥珀色的眼睛在希耶尔脸上停了一拍又在吉尔伽美什后背上停了一拍，“让我来说？”


  “你是那场亚种圣杯战争的胜者，你来说比谁都好吧。”希耶尔回应道。


  “行吧。”士郎点点头，他看向奥尔加玛丽——银发的所长正把手指在讲台边缘攥得更紧，金属边缘把她的掌侧硌出一条浅红的印子。


  “嗯，那我就简单一点了。”'

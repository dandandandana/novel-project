content: '立香想起来士郎给她的终结剑，“那里面的武艺……”


  “那个很特殊，实际上是我本人的武艺，终结剑enki本质上是一柄礼剑，蕴含的武技差强人意……”士郎解释道，“是我改造后的版本。”


  “这样啊……”立香点点头。


  士郎把地上的刀剑轻轻收起来，“还有什么事情吗？立香？“


  立香站直了身子，她看着士郎，轻轻点开口：“我来这里……是来向你道谢的，言峰。“


  “嗯……这样啊……“士郎愣了一下，他挠了挠脑袋：”不管怎么说，我都会接受……“


  “啊，那太好了。“立香轻轻的笑了笑，”不过，可以请士郎不要对我这么冷漠好吗？“


  士郎愣了一下，他看着立香：“啊……你看出来了。“


  “希耶尔前辈告诉我的时候我还不信，跟你相处了这段时间……我终于发现了，士郎内心里有个壳在拒绝着别人呢。“立香顿了顿开口。


  “嗯……“士郎犹豫着要不要开口。


  “我猜你要和我打太极了，言峰士郎，作为迦勒底的御主，我来帮你们破局，是不是该给我点表示。“立香带着些俏皮开口。


  “你们确实帮了我们大忙……”


  “那么，在结束之后，我想让士郎告诉我你之前发生的事情，怎么样？”立香轻声说道。


  士郎看着立香，他毫不犹豫地点了点头：“没问题，如果你想知道的话。”


  “那就这么定了。”立香笑着说道，“你要记着这件事情哦。而且我到时候会尽力医治你的，你……一定要活下去。”


  “我答应过你的，我不会食言。”士郎说道。


  “那就好，士郎。”'

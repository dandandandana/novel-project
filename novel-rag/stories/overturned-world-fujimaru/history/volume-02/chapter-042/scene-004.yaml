content: '玛修直接开口，“前辈，如果侦察范围内有我能处理的目标，要不要和士郎前辈配合？“


  “视情况。“立香想了想，“基本原则是玛修跟着我，但如果离得近、目标明确，可以临时支援。不要在没有制衡的情况下分散。“


  “明白了。“


  吉尔伽美什把搭着的手肘从桌面上拿开，开口。


  “会是一场恶战，立香。战斗方面交给我们，你先把自己护住。“


  “知道了。“立香朝她点了点头，“谢谢你，吉尔茜。“


  “玛修，有什么问题吗？“


  “没有问题，前辈。“


  “那就这样。“


  立香看了眼手环上的时间投影，数字停在接近晚上十点的位置。


  会议室里的人陆续站起来，椅脚拖过地板的声响零散地响了几下，随即归于安静。


  立香把记录纸叠好，推到桌角，在这把椅子上多坐了一会儿，没有立刻动。


  “今晚先休息吧。“她开口，说给还在收拾东西的玛修听，也说给自己听，“明天要好好出发的。“'

content: 'Berserker的头颅往后仰了一寸。


  只有一寸。


  然后它的头颅就不再往后仰了。颈部的肌肉和甲胄共同承受住了这一拳的力量，把冲击力消解在了原地。它的双脚仍然钉在碎石上，一寸都没有滑动。


  赫拉克勒斯的拳头还贴在Berserker的面罩上。


  Berserker动了。


  它的身体关节做出了一个动作。赫拉克勒斯的战斗经验跨越了人类神话中几乎所有已知的搏斗体系，他看过无数种格斗姿态，无数种发力方式，无数种关节活动的角度。但Berserker此刻展示的这个动作，不属于其中任何一种。


  它的右肩关节向后旋转了一个不可能的角度。不是脱臼，不是错位。整个肩胛骨像是在一个多出来的轴线上做了一次额外的翻转，带动着右臂从赫拉克勒斯阔剑格挡不到的死角绕了过来。同时它的腰椎以一种蛇类才拥有的柔韧度向左侧折叠了将近九十度，让左臂的攻击角度从正面变成了斜下方。


  赫拉克勒斯的心眼在这个动作展开的第一个瞬间就完成了判断。


  右手的四枪他能挡住。


  左手的四枪他挡不住。


  阔剑在极短的时间内从左手的辅助握位切换到了右手的单手持握，剑身横扫出去，迎上了从死角绕过来的右手四枪。四柄赤红的短枪撞在阔剑刃面上，火花和冲击波同时爆开。


  但左手到了。


  四柄赤红色的短枪从斜下方刺入了赫拉克勒斯的身体。


  第一柄刺进了左侧肋骨的间隙。枪尖破开皮肤和肌肉的时候，赫拉克勒斯感觉到的不是单纯的穿刺痛，是一种灼热的、带有侵蚀感的、像是有什么液态的东西顺着枪尖注入了他体内的异样感受。第二柄扎在了左腹。第三柄贯穿了左大腿外侧。第四柄刺入了左臂的前臂肌群，从外侧进去，枪尖从内侧探出来，带出了一小段暗红色的血肉。


  Berserker在四枪全部刺入的同时张嘴发出了声音。


  那不算是语言。更像是一种本能的、条件反射式的嚎叫。但在那串破碎的、粗砺的音节中，赫拉克勒斯的心眼捕捉到了四个名字的回音。


  “怒火的囚链。必中之锋。猛毒的死啸。赤红之轨。“


  四柄枪在他体内释放出了什么。


  赫拉克勒斯在枪尖刺入的同一个瞬间就做出了反击。他的右手持剑下劈，阔剑的刃口砍向Berserker伸过来的左臂。同时他的右膝提起来，一脚蹬在了Berserker的胸甲上，借着蹬踏的反作用力把自己的身体从那四柄枪上拔了出来。


  枪尖从伤口中抽离的时候，一种尖锐的撕裂感沿着四个伤口同时爆发。比刺入的时候疼。疼得多。


  “彭！“


  两人分开。赫拉克勒斯退出了七步，左半边身体上的四个伤口正在往外渗血。血是正常的红色。但从伤口边缘向内蔓延的一片暗沉的、类似于淤青的变色区域，在他的皮肤下缓慢扩散着。


  他感觉到了。


  他的灵基出了问题。


  那种感觉很难描述。像是一条一直在流动的河突然被人在中游筑了一道坝。魔力仍然在他的灵基中存在，但流通的管道被堵住了，或者被冻住了，或者被什么东西凝固了。他尝试调动身体里的魔力来加速伤口的修复，回应他的只有一片凝滞的死寂。


  宝具也不行。


  射杀百头的发动需要灵基的配合。而他的灵基现在像是一管被灌满了水泥的水管，什么东西都流不过去。


  赫拉克勒斯低头看着自己左半身上的四个伤口。黑色的淤青仍然在扩散。他抬头看向十步之外的Berserker。


  “原来如此。“


  他的声音很平。平到不像是一个刚被四枪穿透半边身体、宝具被封锁的从者应该有的语气。他把阔剑从右手换到了左手，活动了一下右手的手指，确认握力还在。


  “封锁宝具的能力。“


  Berserker没有回答他。


  那头穿着炎气甲胄的狂犬站在暴雨中，八柄赤红色的短枪从双手的指缝间向外延伸着，枪尖上挂着赫拉克勒斯的血。甲胄表面的火舌在雨中跳动，蒸汽和毒雾从它头顶不断冒出来，在灰暗的天幕下拖出一条浑浊的尾巴。


  它蹲下了身子。后翻的脚掌在碎石上抠出了两个浅坑。


  然后它冲了过来。'

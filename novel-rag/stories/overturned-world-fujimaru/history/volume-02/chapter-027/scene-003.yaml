content: '他在和涅墨亚狮子缠斗三十天的时候没有觉得“难对付“。他在割九头蛇不断再生的脑袋时没有觉得“难对付“。那些战斗确实漫长、确实凶险，但在他的认知体系里，它们是“需要花力气解决的工作“，不是“难对付的事情“。


  “难对付“这个判断，带着一层微妙的、属于心理层面的退缩意味。


  而赫拉克勒斯不应该退缩。


  他在意识到这一点的同时，感觉到了那股异样的来源。


  不是来自他自己。


  是来自眼前这头狂犬。


  他的第二剑斩出去的时候，看清了。


  Berserker的身上，缠绕着一圈光。


  那圈光不明亮。甚至谈不上引人注目。它的色泽是一种介于银灰和淡金之间的暧昧颜色，像是月光穿过了一层很薄的云之后残留下来的余晖。它贴着Berserker那副扭曲的躯壳表面流动，速度很慢，像一层黏稠的液膜。如果不仔细看，会把它当成暴雨在Berserker皮肤上形成的水膜反光。


  但那不是水膜。


  那是光晕。


  英雄光晕。库丘林的传说当中，陷入变形状态时便会升起的东西。在他死亡时从身上落下，斩落了敌人的手臂。


  “英雄的光晕。“赫拉克勒斯的声音从嘴里挤出来，尾音被暴雨切碎了。他的阔剑在右手中微微调整了一下握法，拇指从剑柄的中段移到了尾端，重心后移了大约两指宽。“狂化到这种程度，竟然也带着吗。“


  Berserker听到了这句话。


  或者说那头狂犬对声音的某种残余做出了反应。它从碎砖堆里站了起来。身上的伤口已经不再流血了，黑色的凝块堵住了伤口的边缘，像是一层焦炭覆盖在灰白色的肉面上。


  它笑了。


  那张几乎辨认不出五官位置的脸上，嘴角的肌肉抽动了一下。“嗤“的一声，从牙缝里漏出来的，不是笑声，更接近于某种小型食肉动物在进食前发出的鼻息。


  然后它咆哮了。


  “嗷——！“


  那不是声音。


  赫拉克勒斯在咆哮抵达他耳膜的同一个瞬间就意识到了这一点。那股从Berserker喉咙深处爆发出来的东西，穿透了暴雨，穿透了风声，穿透了他竖起阔剑构筑的防御姿态。声波到达他身体的时候，他感觉到了一种类似于被一面巨大的鼓面正面拍击的冲击。不是耳朵在疼，是整个胸腔在共振。肋骨在震。


  他脚下的积水被震开了。不是溅开，是被一股从Berserker方向扩散出来的冲击波平推出去的。积水退开之后露出了底下千疮百孔的大地，那些已经布满裂缝的地面在咆哮声的震荡下进一步龟裂，碎块从裂缝中翘起来。


  然后光晕动了。


  盘旋在Berserker体表的那层银灰色光膜突然加速流动，从缓慢的黏稠变成了急促的旋转。光晕的边缘变得锋利，开始切割它所附着的表面。Berserker的皮肤在光晕的旋转下被一道道划开，裂口沿着肌肉纹理的走向蔓延，从颈部到肩膀，从胸口到腰腹，从大腿到膝弯。每一道裂口都不深，但数量极多，密密麻麻地覆盖了它的整个躯干，像是有人在它身上用刻刀画满了细密的网格。


  黑血从那些细密的裂口中同时渗出来，覆盖了它的全身。


  “Chon an Chleasraidh。“


  这个名字从Berserker的喉咙里滚出来。发音含混、沙哑、破碎，像是有人在用一台齿轮已经锈死的机器强行碾磨一串音节。但那些音节是准确的。每一个辅音，每一个元音，都精确地落在了它们应该在的位置上。


  噬碎死血之犬。


  伟业的猛犬。这是爱尔兰的光之子被世人传颂的别名，此刻作为宝具的真名被它的主人念出。


  光晕从Berserker的体内炸了出来。


  不是从外向内包覆，是从内向外爆破。那层银灰色的光从Berserker皮肤上的每一道裂口中同时喷涌而出，携带着一种灼热的、肉眼可见的橘红色热浪。光与热在Berserker的体表汇合、凝结、硬化，层层叠叠地堆砌成一副甲胄的形态。


  那副甲胄是活的。


  它的表面不断有细小的火舌窜出来，像是覆盖着一层薄薄的、始终在燃烧但永远不会烧尽的油膜。暴雨落在甲胄上，连“嗤“的一声都来不及发就被蒸干了，只留下一缕一缕的白色蒸汽从甲胄的缝隙间冒出来。


  Berserker之前那副令人反胃的非人姿态被这层燃烧着的甲胄彻底包裹了。裹上甲胄之后的它，轮廓反而像个人了。肩甲、胸甲、臂铠、胫甲，每一块甲片的造型都带着一种粗犷的、野蛮的美感。如果无视它头顶仍然在不停冒出的灰绿色蒸汽和毒雾的话，它看起来甚至像一个勇猛的战士。


  然后是手。


  Berserker的双手在甲胄成型的最后阶段发生了变化。那些扭曲的、多余的手指收拢、融合、拉长，从每只手的指缝间向外延伸出四根修长的、赤红色的金属尖刺。


  枪。'

content: '那一脚结结实实地踹了进去。赫拉克勒斯的筋力是A+级别的，这一脚的力度足以把一头活牛踢出二十步远。但Berserker的身体只是往后退了两步。它的腹部肌肉像是铸铁一样硬，靴底踹上去的触感和踢在一面城墙上差不多。


  赫拉克勒斯没有给它喘息的间隙。


  踹出去的右腿还没收回来，他的上半身已经顺着踢击的惯性向前倾倒，阔剑从身体右侧画了一个大弧，横扫向Berserker的颈部。那一剑极快极沉，刃风割开雨幕，在暴雨中拉出一条真空的弧线。


  “射杀百头。“


  第二次。


  阔剑的刃面在扫出去的同时分裂成了九道平行的斩击。每一道斩击都携带着赫拉克勒斯全力挥剑的完整力量，九道刃光同时切向Berserker的颈、肩、胸、腹、腰、髋、膝、胫、踝。九个不同的高度，九个不同的角度，九道同时抵达的死线。


  Berserker的身体动了。


  那种动法让赫拉克勒斯的瞳孔缩了一下。


  它的脊柱不应该能弯成那个形状。它的肩胛骨不应该能转到那个角度。它的肋骨框架不应该能在那个方向上塌陷下去。但它做到了。整个躯干像是一条被拧干水分的抹布，以一种彻底无视骨骼结构限制的方式扭曲、折叠、收缩，从九道斩击织成的死亡网格中硬生生挤了过去。


  九剑命中了五剑。


  颈部那一剑它用下巴压住了，刃口只切进去了不到一指深。肩膀那一剑被它整个肩关节的错位卸掉了大半力道。真正深深切入的是胸口、腰侧和左腿，三道剑伤几乎见骨，伤口的边缘翻卷着灰白色的肌肉组织。


  黑色的血从那些伤口里涌了出来。


  不是喷。是涌。像是有什么东西把伤口当成了出水口，黑色的液体带着压力从皮肉的裂缝中往外挤，一股一股地淌下来。那些血的颜色深得发紫，落在积水里的时候，积水立刻冒出了气泡。密密麻麻的小泡，伴随着一声微弱的“嗞嗞“声，像是往烧红的铁板上浇了一勺油。


  腥味爆开了。不是普通的血腥味。那股气味又酸又烫，从鼻腔一路灼到咽喉，像是在闻一锅正在沸腾的酸液。赫拉克勒斯的眼角跳了一下。他的心眼在那股气味抵达鼻腔之前就已经发出了警告。一个清晰的、不需要翻译的信号。


  不要碰那些血。


  他的身体比意识更快地做出了反应。双脚用力蹬开地面，整个人朝右侧横向弹出，阔剑顺势在身前划了一道弧形的防御面，刃面拍开了几滴随着Berserker身体动作溅射出来的黑色液滴。那些液滴落在阔剑的刃面上，金属表面发出了一声轻微的、被灼蚀的“嗤“声，像是有人在用烧红的铁签子烫皮革。


  赫拉克勒斯低头看了一眼剑面。


  刃口上多了几个浅浅的凹坑。


  他抬起头。Berserker没有追上来。那头狂犬站在原地，身上的伤口仍然在往外淌着黑血，脚下的积水已经被染成了一片冒着细密气泡的黑色水洼。它的嘴仍然咧着，上下牙齿仍然在不停地碰撞。嗒嗒嗒嗒。


  然后它低下了头。


  那颗畸形的、布满鼓胀肉团的头颅，朝着地面猛地砸了下去。


  不是头槌。赫拉克勒斯在第一个瞬间就排除了这个判断。Berserker的面前没有任何攻击目标，它不可能是在对着地面使出头槌。它的目的只有一个。


  后脑。


  它在砸自己的后脑。


  头颅撞击地面的闷响在暴雨中传出去很远。Berserker的额头嵌进了碎石和泥浆里，后脑勺上那些鼓胀的肉团在撞击的震荡下迸裂了两个，黑色的血从裂口中喷射出来。喷射的方向是向上的、向后的，呈扇形扩散，覆盖了以它为圆心大约三步的范围。


  那些黑色的血滴落在积水上的时候，积水蒸发了。接触的瞬间直接化成了白雾，消失了。碎石表面被黑血溅中的部位迅速变色，从灰白变成焦黑，像是被烧过。


  赫拉克勒斯看着那片正在蒸发周围一切水分的黑色血雨朝自己扑面而来，没有丝毫犹豫。


  他的右脚前踏一步，整个身体压低，然后猛地向前冲去。阔剑从下往上撩起，刃面在身前撑开一道临时的防御扇面。同时他的左脚侧踹出去，靴底精准地踢在Berserker仍然埋在地面里的头颅侧面。


  那一脚把Berserker整个身体踢翻了。狂犬的躯体从地面上弹起来，在半空中翻了一圈，摔进了五步之外的一堆断壁残垣里。碎砖和烂木头被它的身体砸得四散飞溅。


  赫拉克勒斯站在原地。阔剑垂在身侧。


  【这家伙真难对付。】


  这个念头在他脑海里浮现出来。


  然后他愣了。


  赫拉克勒斯，希腊的大英雄，十二功业的完成者，弑杀了人类文明史上几乎所有最恐怖的怪物的男人。他在战斗中冒出了“难对付“这三个字。


  这不对。'

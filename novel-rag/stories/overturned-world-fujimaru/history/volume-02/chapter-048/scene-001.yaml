content: '门合上的那一刻，声音沉入空气，没有回响。


  雅典娜收回按在门上的手，转过身来，步伐稳定，没有特别对任何人说什么。立香已经侧开了一步，背对着她们，在扫这个大厅。


  计时塔待客大厅原本应该有某种派头。现在它只剩下派头的骨架——翻倒的椅子，散落的前台文件，桌面上叠着薄薄一层灰，不知道是从什么时候开始积下来的，也不知道最后一个在这里走动的人是谁。


  天花板一角有一条裂缝，从连接处开始，斜着延伸出去。


  立香目光往下移，扫过两根柱子，再往出口方向看了一眼。


  士郎已经开始整理了。他没有等任何人开口，进门之后径自走向最近的一把倒扣在地上的椅子，拾起然后放回原位，动作不急不慢，像是这件事本来就在他的计划里。


  下一把椅子靠着柱子斜倒着，他绕过去，手扶住椅背，把它重新竖稳。


  玛修在立香的右侧站定，巨剑横在前方，但没有举起来。


  立香回过身来，面对那两个不请自来的人。


  “能不能请二位介绍一下。“她说，“好歹是借了我们的名义进来的。“


  爱尔奎特的目光先落在立香脸上，她歪头看着。


  她嘴角勾起，带着一种笃定自己已经发现了什么有趣的东西的弧度。“欸，召唤出来言峰的人，面对了三头犬，伊什塔尔，还有雅典娜，竟然没有吓一跳？“她歪着头，“有点意思。“


  她在说话的时候，手已经搭上了旁边一把椅子的椅背，手指轻轻叩了一下椅背上的灰，看了看手指尖，然后把手拿开了。


  “名字是爱尔奎特，爱尔奎特·布伦史塔德。真祖的公主，盖亚的处刑人。“她的语气说这串头衔，和说天气差不多，“目前是来帮你们的。“


  雅典娜走到爱尔奎特旁边，往前半步。“雅典娜。奥林匹斯的神明，不过神力已经失去了。“她停顿了一下，“仅此而已。“


  两人说完，立香看向士郎。


  他正在把一段倒落的架子往墙边推回去，没有抬头。但他感受到了视线，手上动作没停，开口道：“爱尔奎特如她所说，我和她有过一段共事的经历。雅典娜在弑神计划里是我们这方的盟友，因此被夺走了神力。“他停了一拍，好像在确认措辞，“我认为可以信任。“


  立香没有当场接话。


  她回头，看着爱尔奎特和雅典娜，目光在两人之间停了两秒。


  “你们的目的是什么。“


  不是质问，也不是寒暄，只是一句放得很平的问题，放在那里，等答案。


  爱尔奎特轻笑了一下。“把自己绷这么紧啊，小姑娘。“


  大厅里安静了一拍。


  立香没动。玛修的手移到她的肩上。立香感受到那个重量，深了一口气，把刚才卡住的那点东西咽下去。


  “那种话留到后面再说。“她开口，语气稳，“我现在想知道你们的目的。“


  爱尔奎特想了想，歪头，“我是被派来找机会赢的。“她说，语气轻巧，像在说一件她自己也觉得有点随意的事，“第一步是找盟友，于是就来伦敦了。“


  她说话的时候，已经走到了大厅中间，弯腰捡起一本从前台散落下来的厚册子，翻了两页，盯着页面看了看，又合上，随手放回原处。


  雅典娜叹了口气，几乎被掩在安静里。“和她差不多。能动用的选项不多，只能先想办法。“她顿了顿，“找盟友是目前唯一可行的方向。“


  立香听完，看着她们，没有立刻说话。


  士郎这时已经把近处的几把椅子处理完了，在往边上移动，手碰到下一张倒扣的桌子，先把桌面朝上扶正，再把压在下面的几本文件夹拖出来，放到桌角。


  “我是人理保障机构迦勒底的御主，藤丸立香。“立香开口，“这位是我的从者玛修·基列莱特，还有Ruler职阶的言峰士郎。“


  “言峰认识。“爱尔奎特抬起头，目光扫过玛修，“这位小姑娘就是你们要救的人？“


  “是。“


  爱尔奎特没有继续追问。她只是看了玛修一眼，那一眼不是同情，是某种很快完成的估算，然后收回去了。


  玛修没有动。她直立着，剑在前方，手握得很稳，脚下是早已落定的重心。只是停了一下，然后把视线往旁边偏了一点，没有对任何人说话。


  雅典娜开口了，语气比刚才稍微低了半度。“用吉尔伽美什的魔药吊着命。“她说，陈述，没有追加评判，“我的目的是拯救人理。和你们一样。“


  “前辈。“玛修转向立香，声音不大，“她是智慧女神雅典娜，我认为可以相信。“


  立香点头，看向雅典娜。“我们也需要二位的协助，拜托了。“


  她把视线移向爱尔奎特。


  爱尔奎特正在研究前台桌面一角一个翻倒的笔筒，把里面剩下的笔一根一根捡起来，重新插回去，毫无目的，就是在找点事情干。她感觉到立香的视线，把最后一根笔插好，直起身来，手指在桌沿上轻轻弹了一下。


  “我的目的，“她说，“是杀一个人。神琦灰。“'

content: '灯早就灭了，窗户封着，只剩门缝透进来的那一线灰光，勉强让人能辨认地板和墙的边界。走廊里的气味是积了很久的那种，旧纸、旧木，还有某种更底层的东西，像是建筑本身在年久之后渗出来的气息。


  爱尔奎特走在最前面，没有拿任何光源，走得像是知道前面有什么，或者不在意前面有什么。


  “你不需要光吗。“玛修问。


  “不需要。“


  “黑暗中也能看见路？“


  “嗯。“爱尔奎特说，随口，“你们人类应该也有这种能力，只是开发得不够。“


  “我不确定这个理解是否准确，“玛修说，认真，“从生理构造上来说，人类的视杆细胞……“


  “玛修。“立香在她身后开口。


  “……啊，对不起，前辈。“


  走廊里沉了一下，然后爱尔奎特笑了， “不不，继续说，我想听。“


  “……视杆细胞的感光效率在低照度环境下确实可以提高，但受限于视锥细胞密度，颜色分辨能力会显著下降。真祖的感知机制我没有足够的资料参考，但如果是通过魔力感知空间分布而非依赖光线……“


  “对，差不多就是那样。“爱尔奎特在前面接了一句，语气里有一点点认真混进来了，“你知道得挺多。“


  玛修停了一下，似乎没料到被这样接住，“我在迦勒底的资料库里读了很多存档……不过实际验证机会不多。“


  “那正好，“爱尔奎特说，“以后有机会可以拿我当实验对象。“


  “啊……那个……非常感谢，不过我不确定是否合适……“


  “合适的。“


  走廊里又静了一下，然后雅典娜从队伍偏后的位置开口，语气是平时那个样子，“爱尔奎特，前面左边是档案室的方向。你感觉到了吗。“


  “感觉到了，正走着呢。“


  “往右数第三扇门。“


  “好。“


  爱尔奎特在前面拐了个弯，脚步没有停，拐过去之后伸手推了推右边第三扇门，比大厅那扇顺多了，没有封印，只是普通的木门，开着。


  立香跟进去，拍了拍墙，找开关，没找到。窗户在这里是封着的，透了一点外面的残余光，将将够把轮廓看清楚。


  她停在门口，等眼睛适应。


  档案室比她预想的要大一些，架子从地面排到天花板，标签还在，一排排的，密密麻麻。右边的一整排架子倒了，文件散落了一地，左边那侧的还撑着，没动。


  “好。“立香说，“找和亚从者相关的——灵基构造，造人研究，或者从者改造记录。“她扫了一眼大家，“分工，各找一侧，有发现喊一声。“


  士郎已经朝左边那排完整的架子走了过去，手扫过标签，从头开始检索。


  玛修在右边蹲下，开始把地上的文件一本一本翻起来看标题，动作认真，一点不潦草。


  雅典娜走向靠深处的一侧架子，站在那里，把手抵在架子边缘，闭了一下眼，像是在用别的方式感知这些文字里残存的什么。


  爱尔奎特走到立香旁边，往里扫了一眼，“我对魔术协会的档案分类系统不熟。你们先找，我帮你们搬东西。“


  立香看她一眼，“行。“


  然后立香走进去，在架子之间走了一遍，把还能看到标签的那一侧从头到尾看了一遍，把可能相关的标签位置记下来，打算从这里开始。


  档案室里不出声，只有翻纸的声音，偶尔是士郎推动架子的细响，或者玛修在地上移动文件时发出的轻声。'

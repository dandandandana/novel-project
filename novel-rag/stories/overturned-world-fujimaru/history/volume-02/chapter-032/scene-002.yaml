content: '“杂修。”吉尔伽美什微微抬起下巴，红色的眼瞳中闪过一丝意味深长的微光，“本王自然是来看我的弟子召唤从者的。”


  “嘛，所长，吉尔茜在这里也没什么问题。”达芬奇在一旁打着圆场，随后看向金发的王者，“外围清理干净了吗？”


  “自然。”吉尔伽美什给出了毋庸置疑的断言。


  奥尔加玛丽还想再说些什么，但最终只是烦躁地摇了摇头。她走到那台巨大的操控台前，从贴身的口袋里拿出一个黑色的天鹅绒盒子，郑重地打开。里面静静躺着几枚散发着奇异虹光的晶体。


  “这是在特异点F所收集到的圣晶石，投入进凹槽里就可以启动法阵了。”奥尔加玛丽向立香招了招手，随后转头怒视着吉尔伽美什，“不过最好还是进行指定召唤。吉尔伽美什，你既然在这里闲着，有没有办法从你的宝库里弄几个圣遗物出来充当触媒？”


  “没有意义，所长。”吉尔伽美什冷淡地回绝了。她盯着那空荡荡的召唤阵，嘴角极其细微地往下了一个弧度，“目前而言……算了，先让立香召唤吧。”


  “哈？”奥尔加玛丽气得用力跺了跺脚，鞋跟砸在金属地板上发出一声脆响，“现在圣晶石和能源有多么紧缺你不知道吗？万一抽出毫无用处的从者该怎么办！”


  吉尔伽美什有些不耐烦地撇了撇嘴。伴随着一阵如水波般的金色涟漪在她身侧荡漾开来，她随意地探入虚空，抽出了一柄造型古朴、未开刃的长剑。她随手将那柄剑扔在了召唤台的感应区上，发出沉闷的碰撞声。


  “轮转胜利之剑的原型。用这个，应该可以定向召唤出圆桌骑士高文。”


  “这还差不多。”奥尔加玛丽松了口气，转身看向立香，“立香，把手放上感应板，准备注入魔力吧。”


  立香走上台阶。在经过吉尔伽美什身边时，两人对视了一眼。吉尔伽美什的眼神很平静。立香没有细想，她朝着奥尔加玛丽点点头，将手掌覆上了召唤台边缘那块散发着微光的石板。


  随后，她将那枚蕴含着庞大魔力的圣晶石推入了凹槽。


  齿轮咬合的轰鸣声瞬间响彻整个穹顶。召唤法阵的纹路次第亮起，刺目的纯白光芒如同积蓄已久的火山般喷发出来。汹涌的魔力化作实质的狂风，在圆形的阵列中不断升腾，空气中的以太浓度急剧上升，几乎形成了一道肉眼可见的暴雨帷幕。立香感到自己的魔术回路被瞬间接通，血管中仿佛流淌着滚烫的岩浆。


  但在控制台前，达芬奇的脸色却骤然变了。


  “不对！”她死死盯着疯狂跳动的屏幕参数，手指在键盘上敲击出残影，“为什么英灵座没有响应？！连接没有建立！”


  立香愣住了。她忍受着魔力抽取的眩晕感，艰难地扭过头看向达芬奇，她顿了顿，准备开口。


  正当她想要开口询问的瞬间，召唤台上的魔力风暴毫无征兆地收束了。没有爆炸，没有魔力逸散，一切就像是录像带被按下了暂停键。紧接着，一阵柔和却极具穿透力的白光从法阵中央亮起，驱散了所有的阴影。


  “等等……响应了！”达芬奇看着突然出现波动的图谱，声音里充满了难以置信。


  站在一旁的吉尔伽美什则抱起了双臂，露出一副果然如此的表情，注视着光幕中那个正在成型的轮廓。


  沉重的脚步声打破了室内的寂静。


  高大的男人从尚未散尽的光晕中缓缓走出。他身上穿着一件白色的风衣，上面布满了隐秘而繁复的咒文。一头暗红色的短发被随意地梳了几下，那张带着明显娃娃脸特征的面庞本该显得极其年轻，但其冷硬如铁的下颌线条和眉宇间潜藏的锐利，却硬生生压下了部分稚气。


  他向前迈出一步。厚底马丁靴的鞋跟重重地敲击在迦勒底的合金地板上，发出一声令人心头一悸的闷响。


  立香站在召唤台前。她的大脑在这一刻彻底宕机了。


  周围的机械轰鸣、达芬奇的惊呼、奥尔加玛丽的喘息，全都在这一瞬间从她的感知中被剥离。她的视界中只剩下那个男人的脸。那双琥珀色的眼睛正平静地注视着她。


  是那张脸。


  那张她在几个小时前，亲眼看着那张面孔的主人死在自己面前的脸。那张在特异点F中，曾经逼得他们穷途末路、属于Alterego的面孔。那个用自己的死亡换取了其他人存活的，言峰士郎。


  立香感到自己的呼吸被某种无形的东西掐断了。她的瞳孔剧烈收缩，手指死死抠住召唤台的边缘，连指甲边缘渗出鲜血都未曾察觉。胃里的酸液翻江倒海，一种混合着极度荒谬与战栗的情绪直冲天灵盖。


  男人在距离她三步远的地方停下了脚步。


  他垂下那双仿佛能洞悉一切的琥珀色眼眸，注视着眼前这个因震惊而颤抖的少女。随后，他以一种没有丝毫起伏、却沉甸甸地砸在立香心上的冷硬语调开口了。


  “Ruler，言峰士郎。”


  他微微欠身。


  “在此。你就是我的御主吗？”'

content: '“汝等不配。“


  一段沉默。


  吉尔茜歪了一下头，“你说什么？“


  “人神混血的杂种。“三个头同时转过去，朝向吉尔茜，像是集中了什么共同的注意。“吾说，汝等不配知晓吾主的伟业。“居中的狮子头停了一停，“你这个人神混血，尤其不配。“


  “啊哈哈哈哈哈哈~！“计时塔方向的声音高了三分，“被你最看不起的神明的手下，嘲讽成了你最讨厌的混血儿~！吉尔伽美什！气不气！赶紧打起来嘛，我正好也想好好修理你一通~！“


  吉尔茜没有立刻开口。


  宝具库里的阵列还是那个朝向，她站在那里，拇指从剑柄上缓缓松开，只是松开，没有放下。停了比平时长一拍的时间，然后她开口了，语气里带着不屑和嗤笑。


  “蠢女人。“她说，“你以为谁都和你一样，每一分都要计较进去？“她把视线从刻耳柏洛斯身上收回来，“神兽分不清尊卑，本王不和蠢物计较。“


  立香呼了口气。


  “士郎。“


  “嗯？“


  “让我来。“她顿了一下，“一个完全没有情商，一个唯我独尊。“她叹了口气，“我现在总算明白希耶尔前辈说的那些话是什么意思了。“


  她往玛修那边侧了侧手，玛修立刻跟上，两人并排往前走了几步，停在刻耳柏洛斯正面的距离之内。


  六只眼睛落了下来。


  立香把视线往上抬，对着居中的狮子头，深了一口气，微微低头。不是畏缩的那种低头，是承认对方存在的那种低头，带有礼节性的。


  “尊敬的刻耳柏洛斯，冥界的守门人。“她抬起头，“我是人理保障机关，迦勒底的御主。“


  “哼。“六只眼睛里有什么东西过了一下，“人理保障机关。人理现在变成这副样子了，还来告诉吾你是人理保障机关？“


  “正因如此，我们才来修复它。“立香没有移动，“我们对于冥王哈迪斯的伟业没有任何不敬之意。我们来这里，是为了救人。“


  沉默了一下。


  六只眼睛挪了方向，落在玛修身上，死死的锁住了玛修。


  “那位少女，是吗。“刻耳柏洛斯说，“她的生命之火，如同一个烧的只剩一点的蜡烛一样摇摇欲坠。不足两个月，现在是用了魔药强行保持的状态，一个月后就会迅速恶化。“


  玛修没有动。她直立着，剑立在前面，手握得很稳。


  “是的。“立香接回来，语气没有起伏，“是为了她。我们保证不会扰乱冥王的伟业——您只需要告诉我们，哪些地方不可以进入，我们会绕开，或者自行处理。“


  刻耳柏洛斯静了一段时间。


  那段时间里，三个头没有移动，六只眼睛没有聚焦在任何人身上，像是某种内部的运转在进行，外部的一切都暂时被搁置了。


  然后那六只眼睛重新落了下来，落在立香身上。


  “吾主的意思是，“刻耳柏洛斯说，“汝等可以入内。“


  立香肩膀松了一点，刚开口——


  “等一下~！我们也是一起的~！“


  声音从后面来，清脆，节奏快，自带一种笃定自己会被听见的劲儿。


  立香回头。


  两个人站在队伍后面，不知道什么时候到的。一个身形娇小，金发，红色的眼睛，一只手撑在自己脑袋上，笑得随意，像是站在这里是件顺理成章的事。另一个高挑，鹅蛋脸，站姿笔直，一只手按着额头，姿态里有一种已经持续了相当长时间的、克制的疲惫。


  立香的视线先落在两人的衣服上。合身的迦勒底的工作人员制服，领口的徽章，制式的版型，不是仿制的，就是那件。


  她在那里停了一秒。


  再抬眼，金发少女已经仰着头，如同一朵盛开的向日葵笑着。


  “我是爱尔奎特，这位是雅典娜。“她一只手还撑着头，“我们是迦勒底的协助者。“'

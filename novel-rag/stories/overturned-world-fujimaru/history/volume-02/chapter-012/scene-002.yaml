content: '希耶尔操控着巨大的打桩机轰然开火，那头洁白色鬃毛的巨兽慢悠悠抬起头，瞥了眼空中的修女。打桩机射出的巨型钢钉落在它身上，却没造成丝毫有效伤害——巨兽只是漫不经心地抖了抖鬃毛，便再度朝着Archer猛扑过去。


  希腊的大英雄早已刻意避开与凯茜帕鲁格正面角力，可凯茜帕鲁格的格斗技巧，却在一次次与他的肉搏中飞速提升。


  原本杂乱无章的爪击，此刻竟变得阴狠，直朝着Archer的下盘抓去。


  “Archer！快退！”


  希耶尔急喝一声，随手丢出几对黑键，精准朝着凯茜帕鲁格的下肢射去。


  那是希耶尔的专属术式「土葬式典」——既然第七圣典的直接攻击无效，她便索性放弃了正面击杀的念头。


  黑键触碰到凯茜帕鲁格的鬃毛瞬间，那洁白的毛发上便沾了一层灰黑色的泥土。


  “只有这种程度的效果？”希耶尔瞳孔骤然一缩。


  “修女，你有解决它的办法吗？”Archer在后方射出一箭，语气里带着几分凝重。


  “让你失望了，希腊的大英雄。我确实有办法，却做不到。”希耶尔挥舞着长达三十米的巨剑，硬生生顶住凯茜帕鲁格的双爪，喘着气开口。


  “不知道是什么力量压制了它的权能，如今它不过是一头我们根本无法撼动的怪物罢了。”


  “你倒还挺乐观。”


  「射杀百头」再度落空，没能造成有效伤害，Archer顺势后跳数米，与凯茜帕鲁格拉开距离。


  “接下来该怎么办？”


  “我哪知道……”希耶尔低声嘟囔着，咬了咬牙，“你先撤回去，我想办法困住它……”


  话音未落，凯茜帕鲁格便抓住她的破绽，巨爪狠狠拍在她身上，将她径直击飞出去。


  希耶尔身上的「审判终端」防护装甲，被这一爪砸出个狰狞的大洞。她在空中勉强调整身形，用巨剑撑住地面，才勉强稳住身子。


  “现在这情况，好像只能叫援军了……”


  “可惜，冬木已经和外界失联一周了。”


  Archer站在阳台边缘，再度拉开长弓，「射杀百头」的魔力再度凝聚。


  “可我们必须杀了它，才能拿到圣杯……”


  “哈哈哈哈——做梦！”


  被九头蛇毒折磨得在地上打滚的尼禄，听见这话突然狂笑起来：“这可是灵长类杀手！就凭你们？虽说那个Ruler不知用了什么法子压制了它的权能，但它的肉身，根本不是你们这些低等生物能破开的！”


  “你见识还是太浅了，Caster的御主。”希耶尔冷声回怼，“你真以为灵长类杀手就无敌？”


  “那你倒是破开它的防御给我看看啊！”


  希耶尔沉默了——她此刻确实没有破开凯茜帕鲁格防御的手段，哪怕是它的一根鬃毛，她都难以割破。


  “轰隆！”


  Archer一箭射爆尼禄的头颅，可对方转瞬便再度复原。只是新注入的九头蛇毒，让他陷入了极度的痛苦，既想自毁，又因凯茜帕鲁格带来的优势而疯狂，只能在地上不停抽搐。


  “Archer……”


  希耶尔轻声开口，语气带着几分笃定：“你应该早就发现了，不管怎样，我都是杀不死的。凯茜帕鲁格失去权能后，根本没法正面置我于死地。”


  “你先回去，我来想办法拖住它……”她说着，悄悄从内兜里摸出一枚小巧的戒指，指尖轻轻捏住。


  “「塔形成的角斗场」，可不是现在该用的东西。”


  一道凛冽的男声如同寒风般传来，一名男子伫立在希耶尔左侧的楼顶上，白色风衣在漆黑的夜色中格外扎眼。


  Archer立刻举起长弓，箭头直直瞄准他，语气警惕：“你身上的气息……”


  “很熟悉，对吧？赫拉克勒斯。”男人似是轻笑了一声，淡淡开口，“投影，开始。”


  漫天剑雨骤然朝着凯茜帕鲁格砸去，希耶尔趁机后跳，总算脱离了与灵长类杀手的对峙。她看向那名男子，瞳孔骤然一缩。


  “你……是言峰士郎？不对……”


  他的模样，和她记忆里的言峰士郎几乎一模一样——身上的白色风衣是埋葬机关的礼装，所用的魔术，更是她绝不会认错的投影术。


  可奇怪的是，他身上的气息，却带着一种让她莫名恼火的违和感。


  言峰士郎的投影术，能将见过的剑一比一复刻，甚至加以改造，还能读取使用者的武艺与属性。


  若是说言峰士郎是“赝品”，那眼前这个人，便是赝品中的赝品。


  “赝品！”希耶尔胸中怒火翻涌，厉声质问道，“你到底是谁？！”


  “这么对待前来支援的人，不太好吧？代行者弓。”男人轻笑着，语气带着几分戏谑，“我是Alterego，名字就不必深究了——如你所说，我确实是个赝品。”


  “Alter……ego？”希耶尔刚念出这几个字，Alterego便动了。


  他笔直向前迈出一步，就那样从楼顶径直坠落，同时拔出了腰间的太刀。


  刀光一闪，快得几乎看不清轨迹。


  尼禄刚刚复原的身躯，瞬间被斩成两截。'

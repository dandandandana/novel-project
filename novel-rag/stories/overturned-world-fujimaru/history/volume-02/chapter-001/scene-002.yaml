content: '立香张了张嘴，却发不出任何声音——她彻底被眼前的景象震撼了，少年的动作太过流畅，太过凌厉，仿佛天生就擅长杀戮。


  少年清理骷髅的动作干脆利落，甚至带着一种近乎凌厉的美感——黑键脱手的瞬间便精准刺穿骷髅的颅腔，即便武器耗尽，赤手空拳也能精准扣住骷髅的脊椎，轻轻一拧便让骨架散架，每一击都直取要害，招招致命。


  “小心！”


  立香突然惊呼出声——一具骷髅兵悄无声息地绕到了少年身后，手中的长剑高高举起，正朝着他的后颈劈去。


  少年似乎低声呢喃了一句什么，身形未转，手却向后一伸，一柄新的黑键凭空出现在掌心，精准地格挡住了骷髅的攻击。紧接着，他手腕一翻，黑键顺势刺入骷髅的颅腔，动作一气呵成，没有丝毫拖沓。


  “把你的御主背起来。”少年的声音清冷，没有半分情绪，目光扫过玛修，语气不容置喙。


  玛修愣了一下，飞快地看了一眼立香，咬了咬牙，小心翼翼地蹲下身，将立香轻轻背了起来，动作轻柔得生怕碰疼她。


  “我来开路，尽快离开这里。”少年说着，手中再度浮现出几柄黑键，身形一闪，便化作一道黑色的闪电，朝着丛林深处冲去，沿途的骷髅兵尽数被黑键刺穿，不堪一击。


  “前辈，委屈您了，可能会有点痛！”玛修紧紧抓着立香的双腿，语气里满是愧疚。


  “我知道了，玛修。”立香轻轻拍了拍玛修的肩膀，声音温柔却坚定，“我相信你，一定能安全带我们出去的。”


  “嗯！我绝对不会辜负Master的信任！”玛修用力点头，加快脚步，紧紧跟在少年身后。


  少年与玛修始终保持着不到两步的距离，三人在漆黑的丛林里疾行，耳边只有脚步声和风吹树叶的沙沙声。直到身后再也看不见骷髅兵的身影，少年才停下脚步，头也不回地说道：“你们先往前走，我去清理后方的追兵，防止他们跟上。”


  话音刚落，一杆黑色的长弓便凭空出现在少年手中，弓身泛着淡淡的黑气，透着一股凌厉的压迫感。


  “投影，开始。”


  随着少年的低语，一柄刃身泛着扭曲红光的长剑凭空浮现，被他稳稳握在手中。少年半蹲下身，弯弓搭剑，手臂缓缓拉满，弓弦发出轻微的震颤，下一秒，燃烧着熊熊火焰的长剑便如流星般射出。


  长剑带着无尽的火焰，朝着他们身后的骷髅群疾驰而去，瞬间点燃了周围的灌木丛，火光冲天，将整片丛林照得如同白昼，那些追来的骷髅兵在火焰中发出刺耳的嘶吼，很快便化为灰烬。


  “这、这是什么魔术？”玛修呆呆地看着眼前的火光，下意识开口问道，“你是……从者吗？”


  少年踉跄着跪坐在地上，脸色瞬间变得惨白，额头渗出豆大的汗珠，大口大口地喘着粗气，像是耗尽了所有力气：“不……不是从者。”他缓了缓，抬眼看向玛修，语气依旧清冷，“把你的御主放下来，先和她建立正式契约——这是眼下最重要的事。”


  玛修犹豫了一下，小心翼翼地将立香放在地上，然后走到立香身边，轻轻握住了她的手。玛修的手掌温暖而有力，给了立香莫大的安全感。


  立香看着玛修坚定的眼神，深吸一口气，闭上双眼，默默念起了吉尔茜教过的契约咒文，指尖泛起淡淡的微光。


  柔和的白光瞬间包裹住两人，契约成立的瞬间，一股温暖的魔力在彼此之间流转，立香能清晰地感受到玛修的心意——那是守护的决心。


  “从者Shielder玛修·基列莱特，将作为Master的盾，为您铺平前行的道路，直至生命的最后一刻！”玛修微微低头，语气恭敬而坚定。


  一道惊雷骤然划破夜空，轰鸣声震得树叶簌簌作响。伴随着惊雷，少年缓缓站起身，立香这才发现，他的脸色比刚才还要苍白，嘴唇也失去了血色，仿佛下一秒就要倒下。少年看着二人，缓缓点头，终于报出了自己的名字：“自我介绍一下，我叫言峰士郎。眼下的情况，你们只能相信我。”


  惊雷再度响起，夜空被闪电照亮，映得少年的红发格外耀眼。


  “你们还有其他从者同行吗？”言峰士郎的目光落在立香身上，语气依旧平淡，却带着一丝不易察觉的凝重。


  “没有，目前只有我一骑从者。”玛修立刻开口回答，眼神警惕地扫视着四周，时刻戒备着可能出现的危险。


  “这样的话……看来有外人来了。”言峰士郎低声呢喃了一句，语气愈发凝重，“没时间耽误了。”他快步走到立香身边，蹲下身，小心翼翼地握住了她骨折的左腿，动作轻柔得没有一丝用力。


  “主啊，怜悯于我。”


  轻柔的银白色光芒瞬间从他掌心绽放，包裹住立香的左腿，暖意顺着骨头缝蔓延开来，原本钻心的痛感渐渐消散。立香试探着动了动腿，虽然依旧无法正常行走，但至少已经不疼了。“只能先简单止痛，没办法彻底治愈，一会我抱着你走。”'

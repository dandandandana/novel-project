content: '言峰士郎站起身，看向玛修：“Shielder，我们现在必须立刻前往最东边的教堂。这片区域有一骑Berserker在四处寻猎，一旦进入城区，还会遭到Archer的狙击，必须尽快离开这里。”


  “进城？”立香坐在地上，满脸茫然地开口，“这里……到底是哪里？”


  言峰士郎垂眸看着她，语气平静：“这里是冬木。”'

content: '“喵呜！嗷！”


  “欸？痛痛，你真咬啊！”


  立香把视线从那两人身上收回来，对雅典娜说道：“您的条件我答应了。至于我之前说的个人的补偿，我也会做的。”


  雅典娜点点头，嘴角稍稍扬起一点弧度。“那我也不客气了。”


  玛修和立香对视了一眼。立香的橘色瞳孔里闪过一丝没有犹豫的允许，她点了点头。于是玛修走到雅典娜面前，黑色板甲的关节发出轻微的金属摩擦声，她深深鞠了一躬——腰弯得很低，盾牌搁在石板上发出沉闷的咚声。


  “额。”雅典娜的语气忽然变得有些微妙。她顿了顿，抱起了手臂，蓝色的瞳孔静静地看着玛修低下去的头。“其实你不用感谢我的。”


  玛修直起身子，透过面甲的缝隙看着雅典娜。“欸？”


  “你该不会觉得用神灵灵基没有副作用吧。”雅典娜抱臂开口。她的语调很平胆，平得就像在说今天走廊的警报灯有点太亮了——但每一个字落地都很结实。


  玛修顿住了。她的嘴唇在面甲后面扯了两下，手指在盾牌握柄上突然收紧了一下又松开。她后退一步，声音里有了一丝没有掩饰的颤抖。“雅典娜小姐……”


  “字面意思。”雅典娜的声音没有改变那种近乎医学解剖般的冷静。“你只是移植并且部分转换了灵基。你还是会在几个月之后死亡。”


  走廊里忽然安静了下来。警报灯的红光在墙壁上缓慢地扫过，照得每个人的脸上都蒙了一层暗红色的薄光。玛修的手止不住地抖，那只握着盾牌的手，整只手臂都在轻微地、不受控制地发着抖。


  然后一只温热的手牵住了她。


  立香的手指穿过了玛修的手指之间，掌心贴上她的手背——那只手在抖，而她用力握住。立香没有看玛修的脸。她直直地看着雅典娜的面庞，橘色的瞳孔紧紧锁着智慧女神的灰色眼睛。她的声音不大，但每一个字都落进了走廊的寂静里。“玛修还是会死吗？”


  “嗯。下一站就要去解决这个问题。”雅典娜偏过头想了一下。“埋葬机关。”


  “如果你指的是肉体改造——”士郎扶着腰侧开口，他的思绪在脑子里转了半圈。“埋葬机关确实有。但是会做这个手术的纳鲁巴列克和神琦灰已经不在了。”


  “我当然知道。我的灵基并不需要肉体改造。”雅典娜的声音从抱臂的姿势里透出来，她想了想，看着士郎补充道：“需要我的灵基认可她。”


  “那么，该怎么做？”立香看向雅典娜，她的眉间拧出一道浅浅的线，声音里的焦急和不解并排挤在一起。


  “我只知道埋葬机关有手段。”雅典娜歪了歪脑袋，下巴朝士郎的方向扬了一下。“这点——明显问你的从者更好吧。”


  立香转向士郎。她的表情带着几分焦急和不解，橘色的瞳孔里翻涌着刚刚被压下去的恐惧。


  走廊一瞬间被抽空了所有声音。警报灯的红光沿着墙壁缓慢移过，在石砖上投下每个人一动不动的影子。


  士郎抱臂思考着。他靠在墙上的姿势没有变，但瞳孔的颜色在警报灯扫过的瞬间，暗了整整一个色调。他陷入了很深很深的思考——那种思考不是发呆，是所有神经都在飞速运转时人就会不由自主静止下来的状态。


  “士郎？！”


  他被这一声唤了回来。“确实有。”他直起身子看着雅典娜，声音沉了下来。“我知道你指的是什么了，雅典娜女神。你指的是埋葬机关的处刑处吗？”


  智慧女神歪了歪脑袋。“对。”


  士郎的眉头紧紧地搅在了一起。他的表情少见的郑重，那股刚才和雅典娜拌嘴时的无赖气儿全部消失了。“那里是问心的场所。确实适合作为试炼场——不过……”


  他顿了一下，似乎是在斟酌词汇。最后他只是用最直白最不加修饰的方式说了出来。“那里本质上被称为处刑处的原因在于——是真的会让人死亡的。”


  他继续说下去。语调很冷静，近乎在陈述某个已经被记录在档案里的事实。“所谓处刑，便是让人的心智崩塌，直到自残而死。只有一个人从里面出来了——纳鲁巴列克。她确实从中获利了。但实际上这个还是作为处刑装置使用的。”


  士郎的目光移向玛修。那双暗下来的琥珀色瞳孔透过面甲的缝隙锁住了她的眼睛。他的声音没有任何威胁的语气，只是在陈述一个已经发生的、被埋葬机关记录在册的事实。


  “是真的会死。”


  玛修握紧了立香的手。她的手指不再颤了。她低下头去，前额的紫色刘海遮住了她的瞳孔，发梢轻轻扫过面甲的下沿。整条走廊里，警报灯继续缓慢地扫过石砖墙，把所有人的影子拉长又压短。


  然后她抬起头。


  “我是前辈的从者。我要保护好前辈。我的目标是——作为前辈的盾牌，保护好前辈。”玛修的声音透过面甲传出来，每一个字都落在石板上清清楚楚。她看着士郎。“我要去。言峰前辈。”


  “玛修！”立香的瞳孔骤然一缩，她的手把玛修的手指攥得更紧了。“那可是——”'

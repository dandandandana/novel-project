content: '阿尔托莉雅无所事事的坐在沙发上，她靠着靠垫翻阅着一本书认真的看着。


  Alterego从厨房端出来一盘点缀着各种蔬菜的沙拉，他把这盘沙拉放在阿尔托莉雅的面前。


  阿尔托莉雅的金眸扫过Alterego，她拿起勺子尝了一口开口道：


  “很好吃。”


  “你喜欢就好。”Alterego说道，他看着少女塞满嘴巴咀嚼着的模样，微微站直身子。


  阿尔托莉雅看着Alterego，她悠悠的开口道：


  ”你想要杀迦勒底的人，单纯是因为想要泄愤吧。“


  Alterego没有反驳她的话，他只是立在一边不懂。


  ”士郎？“


  Alterego看向阿尔托莉雅：


  ”单纯是恨意罢了。“


  ”哦哼哼？“阿尔托莉雅一边身子靠在沙发上，她看着Alterego，”这样啊~“


  ”因为你屈从于人下，做着彻底违背你心意的事情吗？“


  阿尔托莉雅缓缓站起身，走到他的面前，她看着Alterego，“有件好事，你想知道吗？”


  “嗯哼？”Alterego低头看着阿尔托莉雅，“什么好事。”


  阿尔托莉雅如同尸体一样皮肤在大灯打在她的身上泛出白光，显得她周围围了一圈白色的光晕：“我发现你比那个言峰士郎要更像人一点。”


  Alterego眉头微微一挑：“你这是......”


  阿尔托莉雅歪了歪头，她往前一凑，把Alterego推到墙边，右膝喂喂轻抬，凑到了他的膝间。


  Alterego的呼吸顿时停滞了。


  “就比如，你的欲望是正常的。”阿尔托莉雅凑到他的耳边，轻声开口道，“那个家伙身边有不少女人对吧。”


  Alterego的面色不变，在阿尔托莉雅往上凑够去的时候他不由自主的偏过头去，“人都是有需求的，不可能避免这些欲望。”


  “哪怕是你们这些天主教徒吗？”阿尔托莉雅在他的耳边吹气，开口道，“你的记忆里，难不成没有比我更具诱惑力的女性了吗？”


  Alterego忽然意识到了什么，他转过脸看向阿尔托莉雅：


  ”阿尔托莉雅。“


  ”怎么了？“少女的手刚刚攀上他的腹部，见他开口，不由自主的歪头问道，”难不成......“


  ”这些事情人皆无法避免。“


  ”士郎？”


  ”我所能做的，只有抗拒它，拒绝他而已。“Alterego如同吐出和他毫不相关的话，他直勾勾的盯着阿尔托莉雅说道。


  ”嗯哼？现在你抗拒不了也拒绝不......“阿尔托莉雅的话还没说完，她被Alterego弯下腰抱起。


  ”噫？“阿尔托莉雅轻呼一声，她下意识搂住了Alterego的脖子。


  Alterego把她抱回客厅，他把少女放在沙发上，随后缓缓起身。


  阿尔托莉雅看着Alterego，她开口道：”士郎。“


  ”嗯？“


  ”你 ......把我当作你的女儿？“


  Alterego歪了歪头：”不是吗？就算不论雏鸟情节......我也是把你创造出来的不是吗？“


  阿尔托莉雅的眯了眯眼，”你难不成觉得我会叫你’父亲‘？“


  ”随便你了。“


  ”我可不认可。“阿尔托莉雅看着Alterego，”你是你，我是我，我们之间的关系很纯粹。“


  ”嗯，类似于......“Alterego的话没说完就被阿尔托莉雅打断了


  ”不是父女，是......“阿尔托莉雅话音突然截住了，她的表情里带着纠结的神色，”比朋友更近的关系，我不知道该说什么。“


  Alterego忽然笑了


  ”类似于你和你姐姐之间的关系吗？“


  阿尔托莉雅的表情忽然凝固了，她一向是没什么表情的，在听到这话之后，她罕见的浮现出来了怒意。


  “我不允许你这样诋毁你我之间的关系，士郎。”


  此时Alterego已经走到了门口，“我出发了。”


  阿尔托莉雅看着他，随后开口道：“士郎。”


  “怎么了？”


  “你会恨一件事物，已经比他强太多了。”


  “哈？你是说那个言峰士郎吗，为什么要这么说......”


  “他无悲无喜，压抑自己的欲望到了几乎从不外露的程度，就连恨和爱都彻底埋在心底，这种人。”阿尔托莉雅说着，她看向Alterego。


  “只有悲剧。”


  “我不希望你也是悲剧。”


  Alterego顿了顿，”你也一样。“


  ===


  Alterego走出公寓，看着天空若隐若现的如同战舰一样的事物，他仅仅只是扫了一眼，摇了摇头，朝着伦敦的埋葬机关所在地位置过去。


  【恨意吗？】


  Alterego迅速在楼顶处跳跃着，思索着阿尔托莉雅的话。


  “最后的结局会是悲剧。”


  【我这种人，大概只剩下悲剧还存在了吧。】'

content: '“立香。”


  出发前一小时，言峰士郎将一个红色的宝石礼装递到立香面前。


  这礼装背面呈吸盘状，顶端嵌着一颗猩红的宝石，在昏暗的光线下泛着微弱的光泽。


  “这是我常用的增幅礼装，现在先给你用。”士郎的声音没有多余情绪。


  “等等，这是你的东西，我不能随便要……”立香连忙摆手推辞，话音刚落，额头就被士郎轻轻敲了一下。


  “唔……痛痛痛！”立香捂着额头，眉头皱成一团，语气里满是委屈。


  “藤丸立香，我们现在是搭档，你想拖我后腿吗？”士郎无奈地叹了口气，耐心解释道，“我们不用直面从者，玛修会去牵制可能出现的Berserker，我们要对付的，是Caster的使魔。”


  “原来是这样……”立香恍然大悟地点点头，抬眸看向士郎，小声问道，“这也是计划里的一部分吗？”


  “当然，别废话了。”士郎语气依旧干脆。


  “这礼装要装在你的脊柱上。”他转头看向希耶尔，语气放软了些，“希耶尔前辈，能麻烦你……”


  “我可不懂这个，你自己来。”希耶尔头也不回地扭过头。


  “欸？”立香彻底愣住，完全没明白士郎的用意，脸上写满了困惑。


  “……伊莉雅。”士郎又转向伊莉雅，语气里满是无奈，带着一丝求助。


  “抱歉哦，言峰，我可没兴趣窥探别人的魔术礼装，更何况这还是那位英雄王给你的。”伊莉雅毫不留情地拒绝，语气里带着几分俏皮。


  “唉，这就是孽缘之体啊，言峰士郎走到哪儿，麻烦就跟到哪儿。”希耶尔摇着头叹气，“我去准备我的装备了，saber你也和我来吧，毕竟咱们两个是一组的。“


  Saber带着笑意看了看士郎，她不打算多说什么。


  “哈？”士郎满脸震惊地看向希耶尔，眼神里满是不解，“前辈，为什么这么说？”


  “嗯？”希耶尔笑着看向他，眼底藏着几分神秘，却半点没有要解释的意思，就那样静静望着士郎。


  “……”士郎深吸一口气，压下心底的疑惑，对着立香和玛修说道，“玛修，立香，你们跟我进来。”


  立香还处于懵圈状态，在她看来，士郎直接把礼装给她就好，根本没必要这么大费周章，却还是乖乖跟着走了进去。


  “玛修，我教你怎么安装这礼装。”士郎开口，语气比刚才温和了些。


  “这礼装要装在背上，”他看了立香和玛修一眼，语气带着几分歉意，“如果觉得有冒犯，还请见谅。”


  说着，他解开修道服的系带，脱下了上身的衬衫。


  立香瞬间呆在了原地，眼睛都看直了。


  平日里裹在宽松修道服里的士郎，谁也看不出他竟有着这般结实的肌肉，线条流畅紧实，说是能参加健美比赛也毫不夸张。


  但最让立香震惊的，是他后背上密密麻麻、纵横交错的伤疤——狰狞的伤疤看不出丝毫令人反胃惧怕的感觉，反倒与他的身形相得益彰，透着一股历经战斗的奇异美感。


  “好了，玛修。”士郎转过身，示意玛修上前。


  士郎耐心地教玛修如何正确安装礼装，步骤颇为复杂：先将礼装背面的吸盘牢牢吸在背上，再把剩余的带子贴在对应的穴位上。玛修对穴位一窍不通，反倒立香在这方面更熟悉些，指认穴位的活儿便落到了她身上。


  “这个穴位……是在这里吗，前辈？”玛修小心翼翼地询问，指尖微微颤抖。


  “对，就是这里。”立香手忙脚乱地指点着，指尖不自觉地扶上了士郎裸露的肩膀，触到温热肌肤的瞬间，又慌忙缩了一下。


  “好了，现在我教你怎么用，立香。”玛修安装好礼装后，士郎站起身，转向立香。


  立香立刻收敛心神，认认真真地听着，连大气都不敢喘。


  “最后，把魔力汇聚到顶端的宝石里就可以了。”士郎演示着，语气简洁明了。


  “原来如此……”立香似懂非懂地点点头，眼底满是认真。


  “它能提升你的体质，主要是让你跑得更快、力气更大，虽说还不足以和从者抗衡，但对付Caster的使魔，绝对足够了。”


  “还有这个……“


  立香拿着这对黄金双剑斩断了楼里的龙牙兵的头颅，她再一次感受到了惊讶。


  【这真的是我能做到的吗？】立香在心底默默呢喃，不敢相信自己的眼睛。


  士郎告诉她，这对剑名叫终结剑，虽是仿制品，却封存了他一部分武艺，只要握着它，立香就能下意识地使出他的剑招。


  “记住，礼装最多只能用五分钟，时间到必须停下，至少休息十分钟，不许逞强。“


  立香原本根本挥不动这对剑，哪怕只是轻轻挥动一下，都会让肌肉酸痛不已，好在有礼装增幅，她终于能勉强驾驭这对黄金双剑。


  “D区域布置完毕，言峰！”立香通过魔力通讯汇报，语气里带着一丝喘息。


  “收到，你那边死徒多吗？”士郎的声音从通讯器那头传来，依旧平稳。


  “还好，我会在五分钟内突围，你那边呢？”立香一边说着，一边挥剑斩开扑来的死徒。'

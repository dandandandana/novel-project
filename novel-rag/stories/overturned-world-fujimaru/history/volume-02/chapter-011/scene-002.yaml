content: '话音刚落，他便像指挥家一般，抬手示意身后的魔兽，缓缓朝着立香和士郎逼近。


  “乖孩子，乖乖受死，不好吗？”


  立香轻轻扶着士郎坐下，捡起掉在地上的金色双剑，缓缓站起身。她扫视着步步逼近的魔兽，眼底燃起熊熊怒火。


  “礼装，SET。”


  她毫不犹豫地激活了士郎给她的礼装，耳边传来士郎挣扎着的呜咽声，可她没有回头——她不能回头。


  “士郎，都是因为我，你才变成这样。”立香低声呢喃，语气无比坚定，“我不会抛下你的，也别再说什么殿后的话。”


  话音落，她挥剑直刺，径直朝着扑来的魔兽头颅砍去。


  【怕吗？藤丸立香？】


  她在心底问自己。


  【怕。我怕死亡，更怕身后这个笨蛋，因为我而死去——所以，我必须继续战斗！】


  金色的长剑带着立香的身影在黑夜中穿梭，宛若起舞。猩红色的魔兽体液溅在她洁白的迦勒底制服上，勾勒出一抹诡异而决绝的美感。


  立香凭借着礼装的增幅和剑中封存的武艺，应付这些魔兽绰绰有余。尼禄饶有兴致地轻笑一声，喃喃道：“真是顽强啊。”


  “轰隆——！”


  巨响声骤然响起，气浪裹挟着沙石从尼禄前方炸开。立香没有丝毫犹豫，催动了自己的令咒。


  【玛修，到我身边来！】


  “前辈！那是……”玛修瞬间出现在立香身旁，看清前方的景象后，声音忍不住颤抖。


  气浪散去，立香终于看清了那只巨兽的模样：它有着狐狸般修长魅惑的面庞，若不是眼眶里嵌着六只黑色的眼睛，每一只瞳孔都泛着不同的光泽，定然是极为讨喜的模样。它全身覆盖着雪白的鬃毛，身形虽如卡车般巨大，步伐却像猫科动物般优雅轻盈。


  “希耶尔前辈！紧急支援！尼禄·卡奥斯在这里，还有一只卡车那么大的白色巨兽！”


  “了解！”


  收到希耶尔的回复之后，立香看向眼前，那只巨型生物缓缓张开嘴巴，周遭的魔力如同潮水般被它吸入腹中，汇聚成一个耀眼的银白色光球。


  紧接着，它的十二只眼睛同时亮起，恐怖的魔力波动席卷全场。立香立刻挡在士郎身前，紧紧护着他——她不知道这只巨兽要做什么，只能拼尽全力守护好身边的队友。


  【天上的星星……是不是更亮了？】


  那巨兽仿佛受到了什么阻碍，眼中的光芒骤然黯淡，嘴里的银白色光球却瞬间射出，直逼立香与玛修而去。


  “玛修！”立香失声大吼，声音里满是焦急。


  “人理之础！”


  魔术屏障如同坚不可摧的壁垒般瞬间展开，与那道银白色光炮狠狠相撞，炙热的气浪从玛修撑起的坚盾处席卷而来，吹得立香的发丝凌乱飞舞。


  “前辈！”


  玛修勉强睁开沉重的双眼，她张开的魔术壁障在光炮的冲击下微微震颤，裂纹不断蔓延，浑身的剧痛让她忍不住低低呜咽出声，指尖攥得发白。


  “以令咒支援！玛修，给我挡住它！我相信你！”立香的声音带着不容置疑的坚定，令咒的光芒在她指尖微微闪烁。


  “前辈！”


  玛修紧咬着嘴唇，将所有信念都灌注进手中的宝具，原本布满裂纹的魔术壁障竟缓缓愈合，稳稳接下了这毁灭性的一击。


  “竟然挡下来了？看来得在这里……”


  尼禄的话语还未说完，一道凌厉的箭矢骤然破空，直直贯穿了他的右胸。


  “什？”尼禄还没来得及低头查看伤势，裹挟着烈焰的炮击便轰然袭来，精准砸在他身旁的巨兽身上。


  “轰轰轰——！”


  蕴含巨量魔力的箭矢裹挟着剧毒渗入尼禄体内，剧痛让他浑身颤抖，重重倒在地上，连抬手的力气都没有。


  “啊啊啊——你们这群不知好歹的东西！”尼禄痛得面容扭曲，趴在地上嘶吼着，“杀了他们！快杀了他们！”


  巨兽慢悠悠地转动一只眼睛，用极其不屑的眼神瞥了尼禄一眼，优雅地舔了舔自己雪白的鬃毛，下一秒便化作一道残影，瞬间消失在原地。


  “！”


  玛修凭借地上晃动的影子，瞬间察觉到巨兽出现在了自己头顶。


  金铁交鸣的刺耳声响骤然响起，紧接着便是指甲划过黑板般的吱呀声，令人耳膜发疼。


  “什么？”玛修下意识举起盾牌格挡，巨兽锋利的爪子却狠狠嵌入盾牌，深深扎进金属缝隙中。


  “休想！”玛修拼尽全力攥着盾牌，可她仅有C级的筋力，在巨兽的巨力面前，显得如此微不足道。


  巨兽的六只眼睛饶有兴致地盯着玛修，狐面似是勾起一抹嘲讽的弧度，像摆弄玩具般轻轻抬起爪子，连带着盾牌和玛修一同提起，随后狠狠甩了出去。


  “咚——！”


  玛修重重撞在一旁的墙壁上，墙体瞬间碎裂，她整个人被砸穿墙壁，摔进了一楼的房间里，没了声响。


  “咚咚咚咚咚……”


  藤丸立香清晰地听到自己剧烈跳动的心跳声，她死死瞪着眼前的白兽，握紧手中的黄金双剑，脊背挺得笔直，没有丝毫后退的意思。


  “快走啊！藤丸立香！”


  身后的士郎终于艰难地开口，声音撕心裂肺。'

content: '藤丸立香睁开眼的时候，天花板上的照明板已经切换到了日间模式。白色灯光均匀地铺在整个房间里，和昨晚那种压到最低档的昏暗完全不同。


  身体还沉着。肩胛骨和床垫之间的接触面积比平时大——她是以仰面朝天、四肢摊开的姿势睡过去的，中途没有翻过身。右手搭在肚子上面，五根手指松松地蜷着，掌心留着一层干燥的汗渍。


  墙上的时钟投影显示10:04。


  立香盯着那四个数字看了三秒。她从冬木回来之后就没有睡到过十点，迦勒底的作息表把起床时间定在七点半，八点之前必须完成洗漱和体检。今天没有人来敲门叫她。


  她坐起来。枕头上有一块浅色的湿印——昨晚哭过的痕迹，干了以后变成了一圈不规则的边界。立香把枕头翻了个面。


  洗漱用了十五分钟。迦勒底御主宿舍区有专门的淋浴室和小厨房。冷水拍在脸上的时候，颧骨下方传来一阵细微的刺痛——眼睛肿了，不严重，但镜子不会骗人。立香用毛巾按了按眼周，把脸上的水擦干。


  换了一件干净的长袖T恤和运动裤。昨晚那件领口沾了奶油的睡衣被扔进了脏衣篓，袖口还带着蛋糕碎屑的残渣。


  走出宿舍区的时候，走廊里的空气循环系统正在低功率运转。迦勒底的白天比夜晚吵——虽然住在里面的人只剩下个位数，管线、泵机和维生设备的底噪还是占满了每一层通道。立香穿过C区和D区之间的连廊，脚步踩在合金地板上，鞋底发出有节奏的“嗒嗒“声。


  胃里不太空。昨晚那半块蛋糕和一整杯汽水撑过了七个多小时的睡眠期，残留的饱腹感还堵在胃底，不至于饿，但也不至于不想吃东西。介于两者之间的状态让立香放慢了走向餐厅的速度。


  餐厅的门是敞开的。


  立香还没走进去就闻到了味增汤的味道。豆酱发酵之后在加热过程中释放出来的、咸中带甘的蒸汽。那个气味和迦勒底的合金、消毒液、循环空气不搭配——它属于另一个地方。木质餐桌，电饭煲的蒸汽，早晨七点钟的日光从厨房窗户照进来。


  立香的脚步在门口顿了一下。


  不到半秒，她跨了进去。


  奥尔加玛丽坐在长桌的左侧，双臂交叠放在桌面上，面前摆着一杯已经喝了大半的咖啡。达芬奇在她对面，手里捏着一支笔，膝盖上搁着一块便携式记录板，正在上面写什么。吉尔伽美什坐在长桌的尽头——那个位置是餐厅里视野最宽阔的座位，能同时看到门口和厨房通道。


  三个人都转向了走进来的立香。


  吉尔伽美什把桌上一杯冒着热气的茶推到了立香对面的位置。


  “昨晚没睡好？“


  “还好。“立香拉开椅子坐下，手指碰了碰茶杯的外壁。热的。杯口飘出来的是红茶的气味，加了柠檬片。“你们怎么都在这里？“


  “在等你。“


  声音从厨房方向传过来。言峰士郎端着一只白色的托盘走了出来。托盘上放着一碗味增汤、两片烤吐司和一份煎蛋。煎蛋的边缘煎出了一圈焦褐色的薄脆，蛋黄鼓着，还没有完全凝固。吐司烤到了均匀的浅金色，切面上抹了一层很薄的黄油。味增汤的碗口冒着白色蒸汽，汤面上漂着切成小方块的豆腐和裙带菜。


  他围着一条粉色的围裙。


  那条围裙的尺寸明显是为身高一米六左右的人设计的。系在言峰士郎身上，下摆只盖到了腰线以上两指的位置，胸前的布幅被撑得很紧，左上角印着一个不知道是花朵还是五角星的图案——褪色严重，已经看不清原本的样子了。围裙的系带在背后打了一个歪歪扭扭的蝴蝶结，从士郎转身回厨房的角度能看到那两根带子在腰后甩来甩去。


  士郎把托盘放到立香面前，转身回了厨房。动作干脆，没有多余的停留。


  立香低头。味增汤的蒸汽扑上来，咸甘的气味钻进鼻腔。


  “味增？“


  “嗯。“厨房里传出士郎的应答，隔着一堵墙，闷了一层。


  立香端起碗喝了一口。汤温刚好入口，豆酱的味道化在舌面上，带着一种钝重的暖意顺着食道落到胃底。裙带菜的咬感柔软，豆腐块在嘴里碎开的触觉绵密。


  “那我就开动了。“


  她说这句话的时候已经在咬第一口吐司了。黄油在口腔温度下融化，渗进吐司内部那层松软的纤维里，和烤焦面的脆裂口感交替出现。煎蛋的蛋黄在叉子戳下去的瞬间破开，金黄色的液体沿着蛋白的弧面流下来，淌进了吐司旁边的空隙。


  立香吃得不快。每一口之间有三四秒的间隔，咀嚼的时候两腮的肌肉有规律地鼓动，偶尔停下来喝一口味增汤或者用纸巾擦一下嘴角。她没有说话。


  奥尔加玛丽的咖啡杯被放下来的声音打破了餐桌上的安静。所长偏过头和达芬奇低声交换了几句——声量压得很低，具体的词句传不到立香这边，但断断续续的尾音和达芬奇点头的频率说明两个人在反复确认什么。达芬奇在记录板上画了两笔，把笔帽扣回去，对奥尔加玛丽做了一个“可以了“的手势。'

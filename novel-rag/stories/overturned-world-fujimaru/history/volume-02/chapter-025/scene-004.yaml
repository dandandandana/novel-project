content: '然后他的表情恢复了。那面微笑重新爬回了嘴角，但比之前多了一丝微妙的、像是搁置了一个未解问题的余味。他没有辩驳，也没有追问——他只是把那个困惑折叠起来，收进了某个不影响当前任务的角落。


  而立香已经不再关心他的反应了。


  她的手探向背后，指尖触碰到了冰冷的金属握柄。


  言峰士郎给她的双剑。


  她把那对金色的长剑从背后抽了出来。剑身在暴雨中折射出暗淡的琥珀色光芒，刃面上蚀刻着细密的楔形符文，终结剑Enki的投影。即便是投影品，拿在手中时也能感受到剑身内部蕴含的沉重力量，像是握着两柄被压缩到了极致的风暴。


  与此同时，她后背的宝石礼装亮了起来。


  那件被言峰士郎称为“增幅礼装“的装备在她的肩胛骨之间展开了柔和的光芒。


  Alterego的目光落在了那对双剑上。


  他的眉毛微微抬了一下。


  “他把自己投影的终结剑Enki和自己用的增幅礼装都给你了啊……“


  他的声音里第一次出现了某种类似于“有趣“的情绪波动。他伸出右手摸了摸自己的下巴，那个动作随意得不合时宜——像是一个棋手在研究对手下出的一步出乎意料的棋。


  “这样啊……“


  他的目光从双剑移到了立香的脸上。


  “可是——“


  他的声音轻下去了。


  “你没有才能。“


  四个字。没有恶意。没有嘲弄。只有一种平静的、如同陈述客观事实般的确认。


  “你——“


  “做不到。“


  Alterego轻轻地说。


  “你，不配。“


  那个“不配“从他嘴里说出来的时候，语气甚至带着一丝微不可察的惋惜——不是对立香的惋惜，而是对言峰士郎把自己的武器交给一个“不配“使用它们的人这件事，感到某种审美层面的遗憾。


  “而且——“


  他的右手从下巴上移开了。


  手指落在了腰间太刀的刀柄上。


  “你要死在这里了。“


  “藤丸立香。“


  刀出鞘了。


  没有任何预兆。没有拔刀的准备动作，没有重心的转移，没有任何一块肌肉在发力前的微小收缩——上一帧他的手还搭在刀柄上，下一帧刀已经不在鞘中了。拔刀的过程本身像是被什么力量从时间线上剪除了，只留下了“刀在鞘中“和“刀已出鞘“这两个状态之间的瞬间切换。


  贞德挡住了。


  旗剑与太刀在暴雨中碰撞的声音不是金属的铿锵——而是一声沉闷的、像是骨头碎裂般的闷响。冲击波从两柄武器的接触点向外扩散，将周围半径三米内的雨水震成一团向外爆开的雾气。贞德的双脚在湿滑的石阶上向后滑了两阶，她脚下的石板在靴底的摩擦下迸出火星，才堪堪稳住身形。


  但她挡住了。


  “——！“


  贞德的双臂在发力的瞬间暴起了青筋。她紧咬着牙关，将旗剑横在身前，刃面与Alterego的太刀死死抵在一起。两柄武器之间的空隙不到一个指甲盖的宽度，金属与金属的摩擦发出刺耳的嘶嘶声，像是有什么东西在尖叫。


  “还行。“


  Alterego的评价只有两个字。


  他的持刀手甚至没有用力——至少看起来没有。他的姿态仍然是那种令人发指的松弛，手腕微垂，五指轻握，像是在拿一支笔而不是一把太刀。但就是这个看似毫不用力的姿态，压得贞德双臂颤抖、脚下石阶龟裂。


  然后他动了第二刀。


  这一刀比第一刀更快。


  贞德的旗剑格挡住了第二刀——但代价是她的整个身体被击退到了五阶之外，双脚在石阶上拖出两道深深的划痕。她的虎口在冲击中崩裂了，殷红的血从指缝间渗出，顺着剑柄流淌而下，在暴雨中被冲淡成一缕缕粉红色的细流。


  第三刀。


  贞德这次没能完全挡住。


  太刀的刀锋从旗剑的格挡角度之外切入，刀刃擦过她左侧肋骨的铠甲，发出一声刺耳的金属撕裂声——不是削过铠甲表面的摩擦声，而是直接将铠甲的甲片从中劈开的断裂声。一片拇指大小的银白色甲片飞旋着弹射出去，落入石阶上的水流中，发出极轻的叮当声。


  贞德的身体猛地一晃。


  她的左肋处出现了一道口子。不深——没有伤及要害。但铠甲被劈开了。那层本该能抵御大多数从者攻击的银白色铠甲，在Alterego的太刀面前，被像切开锡纸一样轻易地破开了一道裂缝。


  第四刀。第五刀。第六刀。


  三刀几乎是同时落下的。


  贞德的旗剑在暴雨中划出三道交错的防御弧线——她的反应速度已经快到了从者的极限，每一次格挡都精准地对上了太刀的刃筋，角度和力度都是教科书级别的完美防御。


  但没有用。


  第四刀被格挡了，但冲击力直接透过旗剑的剑身传入她的双臂，震得她的肩关节发出了一声脆响。第五刀被偏转了，但刀锋在偏转的过程中蹭过了她右侧大腿的甲片，又削掉了一片铠甲。第六刀——


  第六刀直接击飞了她。'

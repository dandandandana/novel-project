content: '天空中的黑曜石圆盘也跟随着亮起，盘面上浮现出一道又一道古老的纹路，纹路的走向和棋盘上的格子类似，但它不是棋——是某种更古老的东西在反复自我折叠。魔力从圆盘上源源不断地朝战舰的方向灌过去。


  “一击决胜吧，没必要拖沓了。”哈迪斯冲着终端开口。他把双手环在胸前，黑色的长袍在那道蓝光里被映出冷色的反光带。


  “明白。”


  “啊~“


  ”万物归于冥界！发射！”


  耀眼的光芒从战舰的前端朝着埋葬机关的前门轰去。这一发主炮在发射的瞬间不是先产生光然后才传来声音——是先制造了一个真空的域，舰体周遭的空气被光柱推着往外挤，挤到彼此对撞，然后在碰撞的界面上被电离成了等离子体。劈里啪啦的蓝白色闪电在光柱外围疯狂闪烁，每一条电光都以极短极快的频率从光柱表面跳出来再炸开。


  哈迪斯把手从胸前放下来。“一切都结束了。接下来——”


  他站在甲板边朝远方望过去。预想中的大陆结构被贯穿的画面没有发生，取而代之的是一道巨大的白色魔术防护壁挡在了埋葬机关的门前，那道壁障高到能遮住整面天空的低角度视野。主炮的蓝光撞上白壁之后被从中央弹开，光柱被撕成无数道细小的光线朝四面八方散射出去，散射的轨迹在半空中划出密集的白色弧线。


  “怎么可能。”哈迪斯的喉咙里挤出这三个字的时候声调往上拔了半度。他从白壁上把视线收回来落到悬浮的终端上，冷蓝色的光弧在他瞳孔里投下跳动的光影。“吾爱，启动人形终端。”


  “是。”


  “倒是有点——”


  他的话没说完。天空中的星星在这一刻亮了起来。那颗夺走了一切光芒的星星，此刻把之前吸收的所有光——太阳的、月亮的、整座伦敦城被抽干的光——在这一个瞬间朝着哈迪斯的主舰全部爆发了出来。


  七道光芒从星体的中央炸开来，每一道都是不同颜色的，红橙黄绿蓝靛紫排成一个绚丽的扇形朝战舰轰过去。七道光炮各自带着不同的波长，但频率在轰出的那一拍全部同步到了一个对舰防护罩来说极其刁钻的区间内。


  “展开防护。”


  球形的屏障在战舰周围张开。屏障的表面荡漾着一层不断翻涌的能量膜，光膜在七道光炮撞上来的瞬间被从透明轰成了白色，然后在接下来不到半拍的间隙里从白色转成一种被逼到极致的浅蓝。光炮撞在屏障上爆炸，四散的能量碎屑在半空中绽放成一团团光团。


  可光炮完全没有停下来的意思。输出还在往上加，七道光柱的直径在屏障上越碾越宽。


  “全力防护，启动。”哈迪斯把一只手压在胸前，指尖在袍子上摁出五道极短的褶皱。


  球形的屏障开始以肉眼可见的速度加厚。能量从舰体的内核一层一层地往外推送，每一层都被前一层的光炮旋涡撕碎然后重新补上。屏障表面的光膜在承受极限输出的冲击下从浅蓝烧成了亮白，然后白色开始出现裂纹——裂纹不是裂在屏障上，是裂在空气本身被高温烤得开始分解的边界上。


  “哈迪斯大人。”终端的声音在这一刻从甲板边缘传来。珀耳塞福涅的人形终端还没有完全显现，她现在只是一团在半空中漂浮的淡蓝色光球，但她的声音里有一层不属于机器的柔和的尾音，“你会做到你想做的事情的。”


  哈迪斯即将迈入冥界的脚步停了下来。他看了一眼终端，视线在光球表面停留了不到两拍。然后他把手从胸前放下来，垂在身侧的手指在袍子上轻轻蹭了一下。


  “啊，我会的。”他把声音压得很低，低到除了那团光球之外没有任何存在能听见。“我们会永远在一起的。”


  “也会让羞辱我们的人彻底的消失。”珀耳塞福涅的AI声音在这一句话的末尾微微提高了一分。


  哈迪斯点了点头。他朝冥界的方向转过身去，黑色的长袍在他转身的时候擦过甲板上残留的雨水发出簌簌的轻响。然后他踏进去了。


  ==


  “前辈，挡下来了。”


  玛修在屋檐下收回大盾。她的呼吸还没平稳，肩膀在收回盾牌的动作里微微往上一耸再沉下去，板甲上的雨珠从肩线的边缘被甩出去几滴。她喘着气把刚挡完主炮的那口气呼出来，热息在冷雨里化成一小团白雾。


  “玛修，做的好。”立香单手扶着玛修的肩膀，手心摁在板甲上感觉不到体温——隔着一层金属她只能感受到板甲表面的冰凉和从内侧传来的一点点微弱的热传导。


  她站在玛修身边，看着房檐边缘不断落下的灰色雨水，每一滴砸在石板地上都溅起一团沉闷的水雾。“接下来准备给那个主舰来个大的。等士郎把战舰的防护罩击落，就准备开火。”


  玛修沉默着点了点头。她手中的巨盾咔吧咔吧地开始变形——机械结构的锁定声在雨幕里被放大得格外清晰，咔吧一声接着一声，像是有无数个藏在盾身里的金属部件在同时解锁然后重新咬合。'

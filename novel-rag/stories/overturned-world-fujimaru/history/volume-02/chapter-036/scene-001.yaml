content: '迦勒底的照明系统在每晚十点准时切入夜间模式。


  走廊里的白色灯管逐级衰减至最低亮度，只在转角和紧急出口处保留着一层昏黄的底光，像永远烧不尽的蜡烛根。南极没有昼夜之分，穹顶之外是终年不散的极地长夜，但所长和达芬奇立下过一条不可动摇的铁律：迦勒底的所有人员必须严格遵守人造的日升日落。身体不骗人，生物钟一旦崩溃，精神会跟着碎掉。


  凌晨一点。


  藤丸立香睡不着。


  被窝是暖的。南极的室温控制系统工作得一如既往地尽职尽责，连枕套都被烘到了恰到好处的温度。她洗过澡，换了干净的睡衣，头发还带着洗发水的柑橘味。身体的每一个部分都在告诉她：该睡了，你今天已经够累了。


  白天的事情太多。和达芬奇确认灵子转移的技术参数，和医疗部确认玛修的体检报告，整理特异点F的任务日志，处理召唤系统的校准流程，和新召唤出来的从者完成契约确认……每一件事都需要她全神贯注，每一个间隙都被下一项工作紧紧堵住，没有留给大脑任何空转的缝隙。


  那是好的。忙碌是好的。


  可现在，所有该做的事情都做完了。脑子里那些用待办清单垒起来的墙一面接一面地倒下去，露出了底下空旷的、什么都没有的地面。


  而空旷维持不到三秒，随后别的东西涌了上来。


  立香在黑暗中睁着眼睛，盯着天花板看了一会儿。天花板什么也没有，标准的迦勒底统一装修，灰白色的合金板拼接得严丝合缝。她能听见空调出风口低沉的呜呜声，还有隔壁房间隐约传来的某种机械运转的频率。除此之外什么都没有。安静。太安静了。


  她伸手拉开床头柜的抽屉。


  手指在黑暗里摸索了一下，碰到了那个东西。光滑的，凉的，带着一种不属于普通矿石的触感。她把它捞出来，攥在掌心里。


  红色的宝石。


  言峰士郎在冬木给她的增幅礼装。


  啪。


  床头灯亮了。白色的光从灯罩缝隙里劈开黑暗，立香下意识眯起眼睛，等了两三秒才适应过来。她把手举到眼前，摊开手掌。


  宝石躺在她的掌心里，在白色灯光下呈现出一种深沉的红。不是鲜血的红，更接近于冬天日落时天边最后那一道光被地平线吞没前的颜色。它的切面非常规整，像是被精心打磨过，每一个棱角都带着魔术师特有的、对精度的偏执。


  言峰士郎管这个叫增幅礼装。


  立香看着宝石，脑子里什么都没有想，又什么都想了。那种感觉很奇怪，像是有太多画面同时挤在一个太小的屏幕上，互相叠加，互相干扰，最后全都模糊成一片辨认不出的色块。


  她的手垂下去，宝石从指缝间滚到了被子上。


  立香翻了个身，背对着床头灯。


  啪。


  灯灭了。


  黑暗重新合拢。她闭上眼睛，试着数呼吸。一，二，三，四。吸气。呼气。胸腔的起伏很平稳，心跳也不算快。但眼皮后面的画面不肯消失。


  玛修的脸。


  柳洞寺后山的泥地上，魔力反噬让立香倒在地上，四肢像被灌了铅一样沉重，连抬起手指的力气都榨不出来。视野在震荡中剧烈晃动，泥水溅进眼睛，刺痛得她几乎睁不开。


  然后一根白色的枪杆撑在了她面前的地面上。


  玛修站在那里。那个小小的身影撑着那杆对她来说太过沉重的长枪，脸色惨白，嘴唇没有血色，手臂在止不住地发抖。但她站着。她挡在了立香和所有危险之间。


  Alterego的声音在记忆里回放，清晰得像刻在骨头上的字。


  “用那个枪的话，亚从者的灵基会碎掉的。“


  会碎掉的。


  啪。


  灯又亮了。


  立香坐起身来。动作比她自己预想的要猛，被子被掀到了一边，那颗红色的宝石滚到了床沿，差点掉下去。她捞住它，重新握在手里。


  手指有点凉。


  她低头看着宝石，灯光在它的切面上折射出细密的光纹。她攥紧了一下，又松开，又攥紧。


  不能不睡觉。明天还有事。后天也有。伦敦的准备工作不等人，玛修的身体状况需要持续监测，弑神计划的文件还堆在达芬奇的工作台上没有看完。她必须保持状态。她是迦勒底的御主，是唯一能站在灵子转移前端的人。她不能垮。


  啪。


  灯灭了。


  这次她老老实实地躺好，把宝石放回床头柜的抽屉里，甚至把抽屉推严实了。她翻了个面朝墙的姿势，把被子拉到下巴。


  三十秒。


  希耶尔。


  那个来自教会的前辈。平时板着脸训人的时候活像个没有感情的机器，对迦勒底的安保漏洞和立香的训练疏忽绝不留任何情面。但特异点F里，承担最危险任务的人是她。面对强大的敌人时身先士卒的人是她。


  现在她失去了战斗能力。


  立香不知道那意味着什么样的痛苦。她问过一次，希耶尔笑了笑，说“没什么大不了的“，然后很自然地把话题岔开了。


  立香不敢再问第二次。'

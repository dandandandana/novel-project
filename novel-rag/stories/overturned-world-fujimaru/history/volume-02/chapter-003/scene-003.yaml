content: '“Caster的真名是美狄亚。”伊莉雅顿了顿，脸上的笑容淡了下去，表情扭曲了一瞬，“而她的御主，是死徒尼禄·卡奥斯。”


  “死徒？！”立香猛地瞪大了眼睛，身子微微前倾，满脸难以置信地看向伊莉雅。


  “没错，而且还是二十七祖之一。”伊莉雅点了点头，看向两人问道，“你们知道‘祖的理’是什么吗？”


  立香连忙点了点头，一旁的玛修却一脸茫然地眨了眨眼，显然从未听过这个词。


  “哦？你居然知道？”伊莉雅眼中闪过一丝意外，挠了挠脸颊，语气有些不好意思，“说实话，我也不是很懂，不如你说说看？”


  “‘死徒的理’，就是他们成为祖的根源，既是力量的源泉，也是他们最终的形态。”立香认真地解释道，“简单来说，就是一种概念级别的力量哦，甚至能直接改写行星的物理法则。”


  “比如我老师曾经说过，有一位祖的理是操控冰与火，一旦他展开自己的理，周遭环境就会瞬间变成绝对零度，或是酷热难耐的炼狱。”


  “嗯，这样我就懂了。”伊莉雅点了点头，语气恢复了严肃，“尼禄·卡奥斯的理叫做‘混沌之群’，他体内有666只野兽因子，构成了固有结界【兽王之巢】，不仅能召唤各种魔兽作战，只要那些野兽因子还在，他就永远不会死。”


  “怎么会这样……”立香喃喃自语，语气里满是难以置信，眉头紧紧皱了起来。


  “咳咳。”伊莉雅轻咳两声，继续说道，“Berserker的真名是库丘林，现在是Caster的从者，是违规召唤出来的。”


  立香脑海中瞬间浮现出那个手持红色长枪、气势狂暴的男人，疑惑地问道：“是爱尔兰的光之子库丘林吗？违规召唤，到底是什么意思？”


  “字面意思而已。”伊莉雅瞥了一眼Saber，语气带着几分调侃，“她能召唤出库丘林，还得多亏了Saber主从呢。”


  “欸？”立香满脸惊讶，连忙转头看向Saber，眼中满是疑惑。


  “嗯……”Saber脸上掠过一丝无奈，缓缓开口，“当时我和御主判断，Lancer主从的威胁最大，便主动找他们对决，用了些小计谋，在Berserker登场前，就把Lancer在那片森林里排除掉了。”


  “然后Caster就赶到了战斗现场，收集到了一些属于Lancer的物品，趁机违规召唤出了Berserker。”伊莉雅接过话头，补充道。


  “原本Berserker是无法离开那片森林的，但Caster意外得到了凭空出现的圣杯，借助圣杯的力量，解除了对Berserker的限制。”


  “Lancer的御主是魔术师协会派来的执行者，实力不容小觑，我和御主的决断，没有任何错误。”Saber语气平淡，却带着不容置疑的坚定。


  “我没说你们的决断错了。”伊莉雅摆了摆手，语气缓和下来，“毕竟谁也没想到，Caster会得到圣杯。”


  “至于Archer……现在也已经归属于Caster麾下，成了她的英灵。”伊莉雅语气沉了沉，说。


  “真名，赫拉克勒斯。”'

content: '“晚上好——虽说现在的冬木，好像只剩下无尽的黑夜了。”银发少女微微欠身，行了一个优雅的礼，笑容温柔却带着几分疏离，“伊利亚斯菲尔·卫宫，欢迎各位到来，请进吧。”


  “伊莉雅斯菲尔……她是那位魔术师杀手的女儿？！”通讯器里立刻传来奥尔加玛丽震惊的声音，杂音也随之加剧。


  “嗯？你们透露情报都这么直接的吗？”伊莉雅歪了歪脑袋，眼底闪过一丝无奈，语气里带着几分不解，“这种涉及当事人的情报，最好还是不要当着我的面说出来哦。”


  “欸？！”立香彻底慌了神，连忙低下头，脸颊发烫。


  “不管怎么说，当事人听到这种话，都不会开心的吧。”伊莉雅笑着摇了摇头，转身走到教堂中央的桌子旁，轻轻拉开椅子，“先坐下吧，不如先告诉我，你们是谁？”说着，她从桌下翻出一个医疗箱，递到玛修面前。


  “谢谢。Master，麻烦把腿伸直一点，我帮您处理伤口。”玛修接过医疗箱，轻声说道，语气温柔又细心。


  玛修打开医疗箱，拿出绷带和药剂，小心翼翼地帮立香处理腿上的伤口，帮她重新接骨，动作轻柔得生怕碰疼她。


  “玛修……谢谢你。”立香轻声道谢，抬眼看向伊莉雅，深吸一口气，认真地开口，“我们来自人理保障机构，迦勒底。我的名字是藤丸立香，这位是我的从者，玛修。”


  “迦勒底？”伊莉雅皱了皱眉，轻轻摇了摇头，语气里带着几分疑惑，“没听过这个名字。不过——”她话锋一转，目光变得认真起来，“既然是人理保障机构，能特意来到这里，是不是说明，这个地方，已经基本上没救了？”


  “并不是这样。”通讯器里传来奥尔加玛丽的声音，杂音中带着几分笃定，“有一个圣杯不知为何出现在你们的时代，扭曲了原本的历史。立香和玛修是临时被卷入的，她们必须回收圣杯、修复特异点，你们的历史才能回归正轨。”


  “原来如此啊……”伊莉雅轻轻点了点头，眼底闪过一丝了然，“怪不得，本该必胜的圣杯战争，会变成现在这副乱糟糟的模样。”


  伊莉雅抬眸看向立香，语气里带着几分认真：“如果这个特异点修不好，会怎么样？”


  “欸？”立香愣了愣，一时没反应过来，下意识眨了眨眼。


  “我看不出我们有任何翻盘的希望。”伊莉雅摊了摊手，语气坦然得有些过分，“如果你们能回去，最好现在就立刻离开。”


  “伊莉雅说的没错。”Saber从房间里走了出来，神色依旧沉静，目光落在立香身上，“以目前的情况，基本没有翻盘的可能。”


  “为什么这么说？！你刚才不是还提到，原本是必胜的圣杯战争吗……”立香猛地一拍桌子，语气里满是不解，目光紧紧盯着伊莉雅。


  “一开始确实是这样。”伊莉雅耸耸肩，语气平淡，“你也看到了，教会这里虽说有三个人，可真正能战斗的，只有Saber和她的御主而已。”


  Saber静静立在一旁，没有说话，可紧绷的眉梢和凝重的神色，却泄露了她的心思。


  “等等……反向灵子转移启动不了！”通讯器里的杂音愈发刺耳，奥尔加玛丽的声音带着难以掩饰的焦急，穿透杂音传了过来。


  “不行……你们必须回收圣杯。”奥尔加玛丽的语气变得无比坚定，“你们已经被固定在这个时代了，不修复特异点，你和玛修根本回不去。”


  玛修愣了一下，下意识转头看向立香。


  “我知道了。”立香深吸一口气，眼神变得格外坚毅，看向玛修沉声道，“玛修，我们现在要做的，就是回收圣杯，修复这个特异点。”


  玛修看着立香眼中的坚定，瞬间安定下来，用力点了点头，语气铿锵：“没错，Master！不管是为了我们自己，还是为了言峰先生、伊莉雅小姐，我们都必须做到！”


  伊莉雅看着眼前这对眼神坚定的主从，轻轻叹了口气，开口道：“既然你们已经决定了，那我就简单介绍一下目前的情况吧。言峰那家伙，估计一时半会儿醒不过来。”


  “目前留在场上的从者还有四骑，分别是Archer、Caster、Berserker，还有Saber。”伊莉雅语气平静地说道。


  “Saber就是你们眼前这位，贞德。”伊莉雅抬了抬下巴，示意了一下身旁的金发少女。


  “她原本应该以Ruler的职阶降世，但Ruler的名额被其他人占据了，再加上圣遗物的影响，就以Saber的身份被召唤出来了。”伊莉雅笑着补充道。


  立香和玛修齐齐看向Saber，Saber微微欠身致礼，语气温和却坚定：“我对圣杯没有愿望，若非要说出一个，便是希望能让更少的人，卷入这场灾难之中。”


  “不愧是圣女啊……”立香眼中闪过一丝敬佩，小声喃喃道。'

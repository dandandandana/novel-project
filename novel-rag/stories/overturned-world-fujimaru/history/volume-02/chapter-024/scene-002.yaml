content: '他的双眼微微眯起。


  嘴角没有笑意，只有属于战士的、纯粹的战意。


  哗啦啦啦。


  头顶，倒悬的海水穹顶终于抵达了它的极限。


  那面维持了整场战斗的水幕开始龟裂——不是碎裂，而是像一块巨大的冰面在春日暖阳下一点点融化。裂纹从穹顶正中向四周蔓延，海水从裂缝中倾泻而下，起初是涓涓细流，随后是滔天的水柱。


  整片天空开始向下倾倒。


  亿万吨海水裹挟着鱼类、水草、以及被卷入其中的一切，从数千米的高空直坠而下，风声在这一刻被水声彻底淹没。


  Archer没有看那正在崩塌的天穹。


  他只看着地面上那只仍在光之断头台下挣扎的白兽。


  弓弦的声音响起了。


  不是一次。不是两次。


  是三次。


  射杀百头。


  第一轮。九支箭矢同时离弦，每一支都凝聚着远超常规的魔力密度——令咒的加持让原本就足以灭城的宝具突破了从者灵基所能承载的理论上限。箭矢拖着灼目的尾焰，在暴雨中犁出九道真空管道，所过之处雨滴被气浪蒸发殆尽。


  命中。


  灵长类杀手的右肩、前胸、腹部同时炸开三团漆黑的血雾，它的悲鸣声在冲击波中被撕成了碎片。


  射杀百头。


  第二轮。又是九支。Archer的弓臂在连续释放中发出不堪重负的颤鸣，弓弦上已经附着了一层细密的裂纹——但他没有停手。这一轮的箭矢精准地覆盖了白兽脊椎沿线的每一个关节连接处，将那些仍在试图愈合的肌肉纤维连同下方的骨骼一起炸成飞灰。


  白兽的身躯在连续的轰击下几乎被打成了一个凹陷的坑。


  射杀百头！


  第三轮。最后九箭。


  Archer在拉满弓弦的最后一刹那，将令咒残余的全部魔力倾注在了这九支箭上。弓弦断裂的声音与箭矢离弦的破空声混在一起，化作一声震耳欲聋的轰鸣——


  二十七发箭矢。


  全部命中。


  在经由令咒加持下的射杀百头，已经超越了从者所能达到的极限。那不再是“宝具“的范畴——那是将希腊最伟大弓手的全部技艺、御主完全的信任、以及令咒所承载的奇迹，凝聚为一轮毁灭之雨倾泻在同一个目标之上。


  “轰——！“


  第一发的冲击波还没消散，第二发就已经叠加了上去。


  “轰轰轰——！！“


  连锁的爆炸将灵长类杀手所在的区域彻底吞没。圣光与漆黑的龙吟在爆心处交织、碰撞、撕裂，能量的余波以肉眼可见的速度向四周扩散，掀起的冲击波将方圆数百米内所有残存的建筑推倒碾平。


  烟尘、碎石、雨水、血雾——一切都混在一起，构成了一幅灰色的末日画卷。


  灵长类杀手的头颅在承受了这等冲击之后，终于不堪重负。


  它最后发出了一声悲鸣。


  那声悲鸣不像是从喉咙里发出来的，更像是某种概念在消亡时产生的最后回响——【反灵长】的权能在白兽的灵基中做着最后的挣扎，试图修复那颗已经被二十七发射杀百头轰成碎片的头颅，但修复的速度远远跟不上崩溃的速度。新生的骨骼刚刚成形就再度碎裂，血管刚刚连接就再度断开，最后连权能本身都像是一盏耗尽了灯油的烛火，颤抖了两下，熄灭了。


  灵长类杀手庞大的身躯缓缓瘫软下去。


  那双始终锁定猎物的漆黑瞳孔——从战斗开始到现在，那双眼睛里始终燃烧着属于最高位捕食者的冷漠光芒——终于，一点一点地，变得涣散了。


  浑浊。空洞。最后，彻底失去了光泽。


  白色的巨兽倒在了它自己犁出的坑底，雪白的鬃毛已经被漆黑的血液浸透得看不出原来的颜色，四肢以不自然的角度扭曲着，胸腔不再起伏。


  没了生息。


  “终于……“


  希耶尔的声音像是从喉咙最深处挤出来的。


  她没有站着说出这句话——她已经站不住了。双腿在白兽倒下的同一刻彻底失去了支撑的力气，整个人仰面倒在了满是碎石与积水的地面上。后脑勺磕在一块断裂的混凝土上，闷响一声，但她甚至没有力气去感受那一下的疼痛——因为【反灵长】的余毒仍在她体内翻涌作祟。


  灵长类杀手死了。但残留在她灵基中的【反灵长】权能并没有随之消散。


  那种感觉就像是有人在她的每一根骨头缝里塞满了碎玻璃，然后把所有骨头拧成了麻花。四肢的末端已经失去了知觉，取而代之的是一种刺骨的冰冷，从指尖和脚趾开始向躯干蔓延。内脏仍然在被无形的手拧绞着，每一次呼吸都伴随着胸腔深处尖锐的刺痛，像是有什么东西在肺叶上来回割。


  她躺在那里，蓝色的头发散开在积水中，雨水混着血水将她周围的地面染成了淡粉色。眼睛半睁着，看着头顶正在崩塌的水幕天穹——那些海水从天空倾泻而下的景象，透过她模糊的视线看上去竟然有一种荒谬的美丽。


  漫天的水帘砸了下来。'

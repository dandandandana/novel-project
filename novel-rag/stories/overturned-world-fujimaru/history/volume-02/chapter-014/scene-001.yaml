content: '“很抱歉，我们对于Ruler的了解并不算多。”法兰西的圣女缓缓开口，神色带着几分凝重，“那名Ruler几乎是和圣杯同时现世的，只是他现身时，就已经出现了明显的异常。”


  希耶尔闻言，立刻追问：“灵长类杀手已经咆哮着现世了，对吗？”


  “没错。”Saber轻轻点头，语气里带着几分不解，“那名Ruler的举动十分反常，他动用宝具清除了我御主和Archer上任御主的精神污染后，就凭空消失了，没有留下丝毫痕迹。”


  “消失……”希耶尔低声喃喃，指尖无意识地摩挲着袖口，眉头拧成了疙瘩。


  立香见状，连忙追问：“希耶尔前辈，这只白兽在我们来之前，已经现世多久了？”


  Saber接过话头，语气肯定：“大概三天左右。”


  “三天……”立香皱紧眉头，转头看向希耶尔，语气里满是担忧，“前辈，有圣杯滋养的话，三天够它成长为你说的成体吗？”


  “不好确定，立香。”希耶尔摇了摇头，语气凝重，“但可以肯定的是，这三天的滋养，足够它成长到我和Archer联手都无法抗衡的地步。”说到这里，她话锋一转，眼神变得笃定，“所以基本可以断定，是那名Ruler压制了灵长类杀手的权能扩张。”


  “能做到这种事……”希耶尔缓缓扫视众人一圈，一字一句说道，“这个Ruler，大概率也是言峰士郎。”


  “……什？”立香彻底愣住，眼睛瞪得圆圆的，脸上写满了难以置信。


  “哈？你在逗我吗代行者！”奥尔加玛丽的声音响起——在她看来，言峰士郎无论如何都不可能以Ruler的身份现世。


  “这正是最费解的地方。”希耶尔单手托着下巴，眉头紧锁，“讲道理，言峰士郎怎么可能成为英灵，以Ruler的职阶现世？”


  通讯器里立刻传来吉尔伽美什不悦的声音：“杂修……你这话是什么意思？”


  “吉尔伽美什，你比我更清楚吧？”希耶尔语气平淡地回怼，“现在的言峰士郎身处世界里侧，还是盖亚所属的那一侧，无论如何，他都不可能以从者的身份登场，不是吗？”


  立香听得一头雾水，低声问道：“等等……前辈，你说的‘里侧’，到底是指什么地方？”


  “就是世界的里侧，千年城。”希耶尔语气平静地解释，“言峰士郎现在就在那里。”


  “千年城？”通讯器里的奥尔加玛丽立刻惊呼，“星之内海我倒是知道，千年城是什么地方啊！”


  “千年城本就是极度保密的地方。”希耶尔淡淡说道，“那是真祖的居所，当年被某个笨蛋吸血鬼滥用后，就被固定在了世界里侧，你不知道也很正常。”


  立香眨巴眨巴眼睛，下意识看向言峰士郎的房间，满脸困惑：“可……言峰他不就躺在里面吗？”


  希耶尔无奈地叹了口气，耐心解释：“我们说的，是我们那个时间线的言峰士郎，和现在昏迷在这里的，不是同一个人。”


  “哦哦哦，原来是这样。”立香恍然大悟，连忙点了点头。


  “至于他为什么会在千年城……”希耶尔顿了顿，语气里带着几分复杂，“你可以理解为，这个蠢货为了达成某个目的，和盖亚做了交易，成为了类似盖亚处刑人的存在。”


  “杂修！我不允许你这么诋毁他！”吉尔伽美什的怒吼瞬间从通讯器里传来，满是不悦。


  “哦吼？”希耶尔轻笑一声，语气里带着几分挑衅，“当初见面就暗戳戳抱怨他的，不也是你吗？”


  “那也轮不到你评价他，杂修！”


  “好了好了，别吵了！”立香赶紧出声制止，语气里满是急切，“现在不是吵架的时候，接下来我们该怎么做？”


  希耶尔收敛了戏谑，语气沉了下来：“还能怎么做……自从四年前左右，言峰士郎去了里侧，就再也没有和我们联系过了。”


  “我不是说这个。”立香连忙补充，目光恳切地看向希耶尔，“我是说Ruler，前辈，你为什么那么确定Ruler是言峰？”


  “因为他能压制灵长类杀手的权能。”希耶尔语气笃定，“目前来看，能做到这一点的，只有他。”


  “只有他？”Saber皱起眉头，追问着，“你不是说参与讨伐的人很多吗，那么参与讨伐灵长类杀手的人那么多，就没有其他人能做到吗？”


  “参与的人确实多，但能压制它权能的，大概率是言峰专属的东西。”希耶尔缓缓说道，“那是用灵长类杀手的主人——爱尔特璐琪的原理血戒，施展的大魔术「原理血戒：月虹」，只有这个魔术有这样的效果。”


  “所以，你的意思是，Ruler在退场前，用这个大魔术压制了灵长类杀手？”Saber顺着她的话问道。


  “我认为是这样。”希耶尔点了点头，“或许是Ruler的灵基不足以承受「月虹」的力量，所以只发挥出了压制权能的效果，没能直接轰杀灵长类杀手。”'

content: 'Alterego的心眼在镜面碎裂的同一瞬发出了警告。但太快了。黑键从他的身侧切过来，剑尖的走向直指他的头颅。Alterego在最后一刻拧过身体，剑刃贴着他的后脑勺擦过去——那柄黑键划破了空气，划破了他背上的白色风衣，在布料上拉开一道巨大的口子。鲜血从裂口里淌了出来，顺着脊椎的线条往下流。风衣的下摆被血浸湿了一块。


  他也有【人类的礼赞】。能免疫A+神秘度以下的所有攻势。这意味着眼前这柄黑键的神秘度早已突破了那个界限，它不是普通代行者的制式装备，而是从某个更加深不可测的地方里锻造出来的东西。


  士郎的身影在镜面碎裂的下一刻消失了。


  镜面再度亮起。冷白色的月光在无数碎片之间折射弹跳，把整个空间变成了一座光与刃的牢笼。Alterego的心眼捕捉到了一丝危险的预兆，他抽刀出鞘的动作和预警几乎同步。


  砰。


  对撞。两柄剑咬在一起，然后又弹开，然后重新咬上。金属和金属碰撞的频率太快了，快到耳朵已经分不清每一击的起止。镜面空间里只剩下连成一片的撞击声，像是有人在用铁锤反复捶打同一块钢板。二人在刀光剑影里缠斗的身影被无数镜面反射成无数个叠影，每一个角度都在发生同一场厮杀。


  在原理血戒的压制下，Alterego竟然处于劣势。那种劣势不是节节败退的狼狈，而是一种更加微妙的失控——他每一次挥刀的角度都被人预判了，每一次落脚的时机都差了半拍。久攻不下，原本还勉强奏效的心眼也彻底失了准头。士郎的攻势像是没有章法的，但那不是乱，是一种快到了心眼也追不上的节奏。


  开启宝具。这个念头在Alterego脑海里闪了一下。


  所有镜面在同一瞬碎裂。不是一片一片地碎，是成千上万片同时崩塌。碎裂的镜片还没来得及落地，一只靴底已经正面印上了Alterego的腹部。那脚踹得结结实实，连带着整个人都被踹离了地面。Alterego在空中飞出了一道抛物线，风衣的下摆被夜风灌得噼啪作响。


  士郎恶狠狠地瞪着他。


  那个眼神和先前所有平静的审视都不一样，是从骨子里渗出来的冷意，是某种宝物被盯上的愤怒。


  然后他转过身，朝着计时塔的方向飞奔而去。


  Alterego在坠落的时候看见了计时塔的大门。两扇金属巨门缓缓向内推开，铰链发出沉重的摩擦音。吉尔伽美什从门后的阴影里走出来，金色的长发在夜风里微微晃动。她看了一眼空中的Alterego，又看了一眼士郎飞奔的背影，然后无奈地叹了口气。


  她随手撩了一下自己的长发，手指从发根梳到发尾，动作懒散得像是刚从一个不太舒服的午觉里醒来。“刚解决完三头犬就遇到了我最不想遇到的敌人啊。”她把视线重新落在Alterego身上，蛇眸弯了弯，弯成了一道玩味的弧线。“所以又把你丢给我了？”


  Alterego落地的姿势不算好看。他单膝点地，手掌撑在碎裂的石板上，腹部的伤口被冲击力撕扯了一下，又渗出一小片新鲜的血迹，但是随后Alterego的伤势就已经彻底恢复了。


  他站起来的速度很快，手指在腰间一抹，一柄黑键重新凝在掌心里。他看着吉尔伽美什，嘴角弯出一个笑。那笑意没有抵达眼底，但确实在脸上挂住了。


  “那么请你留在这里吧，王上。”


  “叫我王上不会让你的那位不开心吗？”吉尔伽美什的蛇眸弯得更深了。


  她身后，王之财宝无声开启。金色的光纹在夜空中一圈一圈地扩散，从她肩膀两侧向前铺展，无数宝具的锋刃从光轮中探出矛头，把整个塔顶照成了一片金芒。她将一只手搭在腰侧，下颌微微扬起，声音里裹着一层轻佻的笑意。


  “与我共舞吧。”


  警报声从墙体深处炸开，尖锐地灌进每一条走廊。


  立香的身体比耳朵先做出反应。她从椅背上弹起来，手指在同一秒摸向枪套，安魂的黑白双枪已经在她掌心里握稳了。金属枪身还残留着她体温的余热，但她的眼神已经冷了下来。“敌人来了吗？”她的声音压得很低，每个字都像是从牙关里挤出来的。


  “士郎跟我汇报他在顶层处理Alterego的纠缠。”她顿了顿，手指在扳机护圈外轻轻摩挲了一下。“但是通讯很间断……”


  “被阻隔了。”伊什塔尔不知什么时候已经站在了门口，后背靠在门框上。她的声音不像平时那么跳脱，带上了一层薄薄的认真。“你收到的大概已经是他几分钟前发送的消息了。”


  立香的嘴唇抿成一条线。她的目光越过伊什塔尔的肩膀扫了一眼走廊，然后迈开步子往外走。靴底敲在石板地面上发出急促的声响。安魂的双枪被她握在身体两侧，枪口微微朝下。伊什塔尔紧跟着她，银白色的长发在奔跑时拉出一道流畅的波浪。'

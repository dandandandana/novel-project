content: '“你只是我五年前的赝品罢了。”言峰士郎淡淡地说道。他的声音在大雨里飘一飘就散，但落进Alterego耳朵里的时候被雨水的声音放得很大。“你了解我什么？”


  “哈哈哈哈哈哈——”Alterego往外迈了一步，另一只脚也往后退了出去。他的靴跟在积水的石板上刮出一声嗤响。“因为你至始至终都没变啊，言峰士郎。”他把这句话从雨中扔出来，轻得像丢一张浸了水的纸。


  “与其嘴硬，不如直面自己吧。”


  Alterego丢下这句话之后就消失了。没有魔力残留的光效没有渐淡的轮廓没有一点点消融的过程——直接没了，像是画面被剪了一帧然后下一帧里那片他刚才站过的石板只剩下雨砸在水洼里的波纹往四周荡。


  言峰士郎握紧了拳头。雨砸在他的手背上弹开的路径在他眼前乱窜。他的手指在掌心里攥紧后手背上的筋纹一根根顶了起来，前臂的肌腱在雨水的冲刷下绷得死死。牙关咬着的时候他能感到臼齿的珐琅质彼此碾过然后滑开的粗糙触感。


  “言峰前辈？”玛修撑着她的斧头朝他走近了一步，她看着他的背影不敢加重脚步。“你还好吧。”


  言峰士郎没动。他的视线还钉在Alterego消失的位置上，手指攥得越来越紧，雨从指缝间挤出去的时候变了方向。


  “Ruler。”


  少女从屋子里传来的声音。那两个字出口的时候没有颤抖，没有迟疑，只有一个指挥官的冷静外壳——但她的声音里有一层别人听不见别人也听不出来的微细的颗粒感。她刚才一直在门后面听着，全部的对话都从敞开的门缝里涌进来灌进她的脑海，唯有一个词没有漏掉，像从高处砸下来的铅球。


  不算人。


  藤丸立香站在门内侧，手指搭在门框的木边上。她把那个词在口腔里用舌尖碾了一下，然后在脑子里撞来撞去——撞得她没办法把注意力集中到任何一件事上。士郎不算人？那这五年来他为她做的那些算什么？那些从特异点F一路追过来的守护，那些半夜惊醒时瞥见的在走廊灯下站着的剪影，那些从不会说出口但每一个行动都在做出来的一切。他把它们堆在她脚边然后自己退到一个谁都不需要去理解的角落。


  【他早就接受了这个结果？】


  她没让自己问出这句话。她的嘴唇抿成一条线然后把那三个字咽回去了。眼眶有点发烫，但她没让那点热度蔓延开来。她的目光死锁在士郎的后背上，雨水浇在他的身上，他站在雨幕里像一根被人钉在那里的钉子。她忽然想冲进雨里一把揪住他的衣襟把他从雨里拖回来。但她站着没动。


  “改做正事了。”她开口。声音稳得连她自己都吃一惊。“玛修问你还好吗？”


  士郎从雨中转过头来。他的琥珀色瞳孔透过雨幕看着她，停了一拍，然后他往门的方向迈了一步。“还好，不会耽误作战就是了。”


  立香的目光从他没有因为雨水的冲刷而露出任何伤痛的脸上慢慢扫过去。她站在那里看着他走回门沿下，衣服上的雨水滴在石板地上发出一连串沉闷的轻响。她想问他刚才Alterego所说的每一个字到底有多少是真的有多少是赝品自己故意扔出来的，但她把这些话全部推了回去。


  “那就好。汇报情报吧。”她看着士郎的眼睛，瞳孔对着瞳孔，视线锁得死死的。“关于你的事情之后再说，先解决最重要的。”


  那句话不重。她把它控制在一个指挥官该有的重量里，一个字一个字往外放，每个字落在地上。但她自己知道——有一些东西已经在她心里开始发作了。那些东西不是炸弹那样炸开的，是一些用透明的胶带封在某个角落里的东西，现在胶带被那个词划裂了一道缝，它们正沿着那道缝一点一点渗出来。


  【等回到迦勒底……】


  立香把这句话压在舌根底下，没有让它漏出来。


  【士郎不算人了？那他为我做的那些算什么？】


  【他早就接受了这个结果？】


  【我这是怎么了……】


  她把这些疑问在脑子里碾碎了咽回去。她不是不知道答案——只是她现在没法相信自己的答案。她需要一个离暴雨远一点的地方，离冥河水远一点的地方，坐下来把这些东西一件一件地摊开来看。


  “我需要知道你所知道的事情，士郎。”她开口。语气重新回到那个在迦勒底开作战会议的方向上了。


  “好的，那么。”士郎歪了一下头。雨水从他的发梢甩出去几滴，他的肩膀在门沿的遮雨处微微往下一沉，那是一个把肩上重物卸掉的姿态。“作战会议？”


  “嗯。”


  空中。战舰的甲板延伸在云层上方，巨大的舰体在凌晨的灰色天光里呈现一种被遗忘的金属的钝色。甲板上没有铆钉，没有接缝——它不像是人类造的，整个平面平滑到让人走在上面会觉得脚底悬空。朱月走在这片甲板上，她的银色长发在无风的空间中轻轻飘动。'

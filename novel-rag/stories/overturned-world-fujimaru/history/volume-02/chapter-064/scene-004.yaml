content: '朱月把这几句话一个字一个字地收进脑海，然后她的嘴角缓缓往下收了几分。不是笑，是某种从很久以前就埋在心里的东西在被重新挖出来的时候嘴唇自己抿住了。


  “圣剑使啊——”她喃喃地开口，视线从哈迪斯身上移开落到甲板边缘那团光球身上。“我知道她是谁。”


  她的银发在无风的空间中静止了一瞬。


  “名字叫做神琦灰的精灵。我和她有着血海深仇的。”朱月轻轻地说出这句话，嘴唇在最后两个字的笔画里抿成一条线。“一箭之仇，不得不报。”'

content: '长枪挥动，雅典娜的枪杆在空中划出一道白色的弧光。


  玛修站定，双手握紧第七圣典化成的剑柄，剑刃抬起，用剑脊硬接了这一枪。枪尖撞上剑身，金属的震鸣从剑刃传到剑柄，再传进玛修的掌骨。


  她的虎口发麻，手指在握把上滑了半寸。长武器的优势在这一枪中显现——雅典娜的枪尖在距离玛修面门三掌的位置停下，玛修的剑刃却够不到雅典娜的身体。


  “反应还算快。”雅典娜收枪，枪杆在手中转了半圈，枪尾磕在石板地面上发出清脆的敲击声。


  玛修没有回答。她把呼吸压进肚子，重心沉到膝盖上。剑刃的尖端随着她的肩膀轻微起伏，汗水从额角的发根渗出来，沿着颧骨的弧度往下淌。


  雅典娜的脚往前踏了半步。鞋跟踩在碎裂的石板上碾出细小的嘎吱声。枪尖再度抬起，指着玛修的喉咙。


  玛修往前迈出一步。她的剑尖也抬起来，和雅典娜的枪尖在两人之间的空气中搭成一条危险的直线。


  然后雅典娜动了。枪尖从正面刺来，速度快到空气在枪尖两侧拉开白色的气流。玛修没有格挡——她把剑尖垂下，以剑身为轴侧身闪开，枪尖擦过她的肩甲，金属与金属之间刮出一线火花。


  雅典娜的枪还没收回来。枪杆顺势横扫，枪尖在空中画出一道扇形的弧线，从玛修左侧拦腰削来。玛修的剑已经来不及调回左侧格挡。她的脊椎往后弯，膝盖支撑着整个上半身往后仰倒，发尾扫在地上。枪尖从她的鼻尖上方削过，带起的风压把她额前的碎发往脑后吹。


  玛修后腰的肌肉拉紧，她用手掌撑住地面往后翻了一个跟斗。脚跟在石板上蹬出闷响，落地时身体已经退开三步。


  “汝……”雅典娜呢喃着。她站在原地，枪尖斜指地面。枪尖周围的空气开始扭曲，像被高温灼烧之后的透明波纹。魔力汇聚时发出的嘶鸣声低矮而持续，残留在她体内的神力混在魔力中沿着枪杆往上爬，在枪尖凝聚成一颗白得发青的闪光点。


  “人理最后的御主的从者啊……”雅典娜抬起眼睛看向玛修。她的手臂平举起来，枪尖对准玛修的胸膛。“看你能不能接下这招吧。”


  [明明才交手没几招，就要用宝具一决胜负了吗。]


  玛修握紧第七圣典的剑柄。长剑在手中重新分解重组，剑刃折叠进枪身的动作干脆利落，弹仓卡进位时发出金属锁定的咔嚓声。她扣住扳机护圈，枪托顶上肩窝。她没有回答雅典娜的话——她看见雅典娜枪尖上凝聚的光已经从白得发青变成了灼眼的亮金。


  [我不能倒下。前辈还在楼下，她一个人面对那个名叫提亚的魔术师。]


  [如果盾牌还在的话……可是希耶尔前辈的第七圣典没有盾形态。]


  玛修连开两枪，同时往后撤退。黑色的弹头在空中画着旋转的轨迹朝雅典娜飞去。她的脚跟在后退中踩碎了地面的碎石片，靴底在石粉上留下滑移的痕迹。


  “汝！贯天之矛尖！”


  雅典娜挥出长枪。枪尖上凝聚的智慧权能和神力在出手的一瞬炸开，金色的光束从枪尖喷涌而出，走廊两侧的墙壁被光束侧面的余波削掉一层石皮。女神的身体在挥出这一枪时猛地顿住，肩膀往前耸动了一下，姿态出现了短暂的不稳。


  玛修在雅典娜身形顿挫的瞬间朝右侧扑去。她用左肩撞向一旁的墙壁，整个人横着飞出去，侧腹的衣物擦过地面的碎石。宝具从她身侧轰过。枪尖擦到她左臂板甲上的金属，残留的神力热浪灼热得烫起她手腕上的一小片皮肤，红肿处传来细密的刺痛。


  轰隆。玛修撞碎了身后教室的墙壁。木屑和石灰块在她身上飞溅，她的背脊撞上课桌的边缘，桌子被推出去在地上刮出刺耳的摩擦声。她从墙洞的灰尘里爬起来，举枪朝着墙洞之外扣下扳机。


  “砰砰砰砰！”


  四发子弹穿过尘雾朝雅典娜飞去。然后是金属碰撞的声音。弹头一颗颗被枪尖弹开。雅典娜手持长枪站在墙洞对面，枪尾点在碎石上，枪身的金属映着窗外透进来的灰白天光。烟尘缓缓沉降，玛修喘着气看了一眼四周——教室的桌椅歪斜地散落着，墙上挂着的黑板碎成两半砸在地上。但雅典娜的宝具没有造成任何破坏。枪尖对准的方向，墙壁完好无损。


  “怎么做到的。”玛修的声音从牙缝里挤出来。


  第七圣典再次重组。枪身收拢折叠，剑刃从弹仓的位置往外翻转。玛修握紧重新变回巨剑的圣典，剑尖指向雅典娜。“你……”她把呼吸吞下去，喉咙里压着剧烈运动之后灼热的气息。“为什么？”


  雅典娜的眉梢动了一下。她握枪的姿势没有变，枪尾仍点在碎石上。她看着玛修，嘴唇微挑。“自然是证明……你不配了？”


  玛修没有听懂。她握剑的手指收紧了。'

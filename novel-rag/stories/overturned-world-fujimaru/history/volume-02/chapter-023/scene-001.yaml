content: '硬撑着来自【反灵长】的剧痛，希耶尔挥出一剑。


  那柄处刑器斩过空气时发出沉闷的嗡鸣，剑身上凝聚的圣光如裂帛般撕开夜色，与几乎同一瞬间从远处高楼顶部射来的漆黑箭矢汇成一道毁灭的轨迹——Archer的一箭精准地咬住了她劈斩的间隙，两股截然不同的力量在灵长类杀手的躯体上同时炸开，冲击波掀起的碎石与尘土暴雨般四散飞溅。


  白兽被轰退数十米，四爪在柏油路面上犁出四道深可见骨的沟壑，碎裂的沥青像浪花一样翻卷起来。


  “呃……“


  反噬瞬间袭来。


  希耶尔的膝盖猛地一软，整个人差点栽倒在地。浑身上下仿佛有无数蚂蚁在同时撕咬着她的每一根神经末梢，内脏像是被一只无形的手攥住、拧绞、撕裂——【反灵长】的权能对她这具承载着灵长类概念的躯体施加的惩罚。每挥出一次攻击，这具身体就要承受一次来自概念层面的自我否定。


  汗水混着血丝从额角滑落，滴在龟裂的地面上，发出细微的“啪嗒“声。


  灵长类杀手稳住身形，漆黑的瞳孔里没有丝毫痛苦的情绪——不，它根本没有情绪。那双眼睛里只有纯粹的、属于最高位捕食者的冷漠判断。


  没有任何犹豫，白兽后腿猛然蹬地，整具庞大的躯体如同一枚被弹射出去的炮弹，高高跃起。它跃升的瞬间，脚下的路面以它为圆心向外塌陷出一个蛛网状的巨坑，碎石被气浪抛向半空。


  几乎是同一刹那，数公里外的高楼残骸顶部，弓弦震动的声音撕裂了空气。


  Archer的狙击。


  那支箭没有任何花哨的特效，甚至连箭矢本身都朴素得不像是宝具——但它划破空气时产生的音爆却在整条废弃街道上炸开了回响，沿途的建筑玻璃像多米诺骨牌一样依次碎裂，化作漫天银色的碎片雨。


  箭矢精准地命中了白兽腾空的躯体，在半空中炸出一团灼目的光球。灵长类杀手的身躯在气浪中翻滚了半圈，却仅仅是被滞空了不到一秒，便重新调整了姿态。


  希耶尔咬紧牙关。


  她知道这不够。远远不够。


  第七圣典在她手中嗡鸣着变形，巨大的处刑器展开为弓的形态，圣钉构成的弓臂上浮现出密密麻麻的铭文，散发着冰冷的银白色光芒。她弯弓，拉满。弓弦绷紧到极限时发出尖锐的颤鸣，连空气都被这股张力压得扭曲变形。


  凝聚在箭尖的光芒越来越盛，亮到令周遭的废墟都投射出锐利的黑影。


  一箭射出。


  对城A+级别的一击在夜空中划出一道笔直的银白光柱，将沿途的云层撕裂成两半。光柱命中灵长类杀手的瞬间，冲击波以肉眼可见的速度向四周扩散，方圆数百米内残存的建筑外墙像纸片一样被掀飞，钢筋混凝土在圣光的灼烧下化为齑粉。


  “呃……！“


  代价随之而来。


  希耶尔的视野瞬间模糊，剧痛从腹部核心向四肢蔓延，像是有人在她的脊椎里灌入了沸腾的铁水。她的双腿剧烈地颤抖着，几乎是靠着第七圣典撑在地上才没有彻底倒下去。嘴角溢出的血丝被她用舌尖舔去，铁锈味充斥口腔。


  痛。


  痛得她几乎要倒地不起。


  烟尘散去。


  灵长类杀手还站在那里。


  不——不是“还站在那里“。它的雪白鬃毛已经被自身的漆黑血液浸透，左前肢的骨骼以一个不自然的角度弯折着，胸腹处的皮毛焦黑一片，隐约能看到下方蠕动着修复的肌肉纤维。但它依然站着，那双漆黑的瞳孔里甚至没有多出一丝愤怒。


  它只是发出了一声低沉的呼气。


  不是悲鸣，不是咆哮。仅仅是呼出了一口气，像是在评估猎物的威胁等级。


  “还活着……“


  希耶尔的声音干涩得像砂纸摩擦。吃了月虹，吃了她和Archer数发对城级的打击，这只怪物还能站着。这已经超出了“耐久高“的范畴。


  然而灵长类杀手压根没有继续与她纠缠的意思。


  它的瞳孔转动了一下，视线越过希耶尔，锁定了数公里外那个在高楼残骸间跳跃的巨大身影。下一刻，白兽的后腿再度蓄力——这一次，它没有朝希耶尔扑来，而是径直从她头顶越过，掀起的狂风将她的蓝发吹得猛烈翻飞。


  它朝着Archer狙击的方向，全速冲去。


  “它疯了……“


  希耶尔捂着自己的腹部，指缝间渗出的血液将修女服的布料染成深色。浑身上下没有一处不在叫嚣着疼痛，双腿像是被灌了铅，每迈出一步都要消耗她全部的意志力。但她还是拖起了那柄比她身躯还要巨大的处刑器，金属底座在碎石地面上拖出刺耳的摩擦声，朝着希腊大英雄的方向一步步追去。


  她不能停。


  不能在这里倒下。


  Archer看着一跃而来的白兽。


  那双属于希腊最伟大弓手的眼瞳在黑暗中闪烁着冷静的光芒，瞬间捕捉到了白兽起跳的角度、速度、以及它残存的伤势对其轨迹造成的微弱偏移——所有信息在不到零点一秒内被处理完毕。


  弯弓，搭箭，拉弦。一气呵成，流畅得像是呼吸。


  一箭射出。'

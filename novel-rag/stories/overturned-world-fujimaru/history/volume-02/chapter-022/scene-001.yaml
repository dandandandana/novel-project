content: '大地开裂的闷响在脚下震颤，被Archer稳稳抱在怀中的立香心头忽然一沉，一股滚烫的热浪裹挟着硝烟味，源源不断地从身后席卷而来，让她莫名感到不安。


  “那边的战斗一定异常激烈……Archer，那位Saber小姐在替我们争取时间，我们必须尽快去支援希耶尔前辈！”立香压低声音，语气里满是急切，她下意识按住额前被风拂乱的发丝，身体随着Archer的跳跃微微晃动，目光紧紧望向战场方向。


  “御主，到了。”Archer脚步未歇，声音低沉而沉稳，目光锐利地扫向不远处的楼顶，“Saber、她的御主还有玛修，都在上面等着我们。”


  “先送我过去，之后你立刻去支援希耶尔前辈。”立香语气坚定地下达指令，话音刚落，Archer便足尖轻点，稳稳落在了楼顶的二人身边。


  玛修率先开口，声音带着几分急促与担忧：“前辈……希耶尔前辈正在和那只白兽交战，言峰先生他伤得很重，但万幸还活着……”


  玛修与Saber正按计划在楼顶等候，Saber那身银白色的盔甲上沾染着不少暗红的血迹，她单膝跪坐在地面，言峰士郎则静静躺在她的膝头，气息微弱。


  立香目光落在Saber膝头浑身是血的士郎身上，心头猛地一紧，到了嘴边的惊呼硬生生咽了回去，随即转向Archer，语气不容置疑：“Archer，快去支援希耶尔前辈。”


  这位来自希腊的大英雄微微颔首，没有多余言语，身形一闪，便纵身跃向希耶尔交战的方向，转瞬消失在楼宇之间。


  立香没有半分迟疑，转头与Saber交换了一个眼神，语气坚定：“交给我吧，Saber。”


  “好的，迦勒底的御主。”Saber微微颔首，语气凝重，“我只能暂时为他止住血，他失血极为严重，此刻已经昏迷不醒——除了心脏之外，他所有的重要脏器和动脉都被划开了。”


  “什……这和我们之前计划的不一样……”立香心头一怔，随即迅速敛去神色，语气果决，“算了，先不说这个，我现在就给他疗伤。”


  立香熟练地催动吉尔伽美什所教授的治愈魔术，口中念出几节极短的吟唱，银白色与翠绿色交织的光辉瞬间在她掌心浮现，柔和却带着强劲的治愈之力。


  她随即轻轻将手掌按在士郎的脖颈处，优先处理最危急的动脉伤口。


  掌心的光辉渐渐消散，立香不敢耽搁，立刻移向士郎另一处动脉，继续施展治愈魔术。


  治愈的光芒在士郎伤口处不断闪烁，立香的动作干脆利落，没有丝毫拖沓。


  “前辈……”玛修目瞪口呆地望着立香娴熟的动作，眼神里满是惊讶，仿佛眼前这行云流水的疗伤场景，她已经做过千百遍一般。


  Saber在一旁静静伫立，没有出声打扰——她的启示清晰地告诉她，眼前这位少女的每一步操作都精准无误，她无法给出更好的建议，唯有默默守护。


  “没什么特别的。”立香擦了擦额角渗出的汗珠，手掌轻轻按在士郎的胸口，语气带着几分庆幸，“吉尔茜只是让我反复练习基础魔术，练了两三年，才达到现在的效果……还好，得赶紧修复他的气管，万幸没有彻底断裂。”


  话音刚落，立香便再度催动魔术回路中的魔力，柔和的光辉包裹着士郎的胸口，小心翼翼地修复着他受损的伤口。


  就在这时，整栋大楼突然剧烈摇晃起来，墙体开裂的声音刺耳作响，碎石簌簌从楼顶坠落。


  “地震？！”立香下意识扶住身旁的墙体，心头一紧。


  日本地处板块交界处，地震本就常见，可远处天际冲天而起的巨浪，却让三人瞬间脸色大变——这绝非自然现象。


  “那是什么？！”立香失声惊呼，手上的治愈动作却丝毫未停，快速修复完士郎的肺部后，立刻为他剩余的伤口做了简单止血处理。


  “是海啸……该死，一定是有人解放了强力宝具，那边的战斗已经激烈到波及周遭了！”奥尔加玛丽的声音从通讯器中断断续续传来，带着难以掩饰的慌乱，“不过万幸，言峰士郎的生命体征已经稳定下来了。”


  “前辈！我们必须立刻转移！再晚就来不及了！”玛修迅速将盾牌插进地面，稳住摇晃的身形，语气急切地喊道。


  “好！我已经给士郎止住血了！”立香抬头望向远处的海啸，语气果决，“玛修！Saber！我们必须去最高的地方！Saber小姐，你知道哪里最安全吗？”


  “柳洞寺。”Saber立刻回应，语气笃定，“Caster与其御主已然陨落，那里如今没有敌人，且地势高耸，是目前最安全的地方。”


  强烈的震感再度袭来，伴随着一声惊天动地的爆炸，一道冲天的光芒划破天际，照亮了被烟尘笼罩的天空。'

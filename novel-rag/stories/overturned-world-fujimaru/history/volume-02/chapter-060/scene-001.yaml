content: '一辆车坐不下这么多人。迦勒底的人们分了开来——士郎发动了引擎，方向盘在他手里轻轻转了一下，车子从计时塔的地下停车场滑了出去。立香坐在副驾驶上系好安全带，后排的吉尔伽美什把伊什塔尔摁在座位上。另一辆车跟在后面，玛修、雅典娜、爱尔奎特坐在一辆。


  伦敦凌晨的街道铺着薄薄的湿气。暖气在车窗上慢慢凝起了一层雾，把路边橙黄的街灯糊成一团一团的光晕。车里很安静，只有发动机的低鸣。


  然后伊什塔尔的脑袋从后座伸到了前排的扶手箱上。


  “喂喂，为什么不用我的马安娜！”她的银发扫过吉尔伽美什的肩膀，吉尔伽美什伸手想拽她回去，没拽住。“那玩意儿飞起来多快啊——这破车在伦敦的窄街上慢得本女神都快睡着了！”


  士郎看着前方的路，语调平得像在说今天伦敦的天气。“不怕被那个我狙击吗？他专挑飞在天上的目标打。”


  “这有什么，你觉得我真的会怕他？”伊什塔尔把下巴搁在扶手箱上，银色的长发顺着皮革滑下来。她的语气得意洋洋——那个在美索不达米亚天空上从来没人敢惹的金星女神，正露出她的招牌笑容。“本女神怎么会输给——”


  然后她看见了言峰士郎的侧脸。琥珀色的瞳孔反射着街灯的光。那张从主驾微微偏过来的脸让她的声音卡在了嗓子眼里。她从那张脸上算出了上次和Alterego交战时自己被暴打的全部过程，马安娜被从天上拽下来，然后被按在地上揍。她的话头啪一下断了，身体慢慢地缩回去，缩到吉尔伽美什旁边的靠背上瘪着声音开口。


  “算了，当我没说。”她的后脑勺抵着座椅靠背，眼睛盯着车顶棚。


  吉尔伽美什轻轻勾了一下嘴角，什么都没说。


  车的暖气烘得人有些昏沉。藤丸立香坐在副驾上看着窗外，橘色的瞳孔映在起了雾的车窗上，模糊成了一小片暗橙色。然后她斟酌了一会，转过身来。


  “士郎。”


  “怎么了？”


  立香揉了揉额头，手指从额角一路摁到太阳穴。“我有事要问你。”她说这话的时候橘色的瞳孔里浮上了一种斟酌。“我知道了一件事情，我觉得可能会成隐患。”


  士郎没有看她。他握着方向盘的手很稳，琥珀色的瞳孔盯着前方的路。“这里的人都值得相信。”


  “欸？包括我吗？”伊什塔尔往后一靠，靠着座椅把自己整个人摊平了。


  “你没什么脑子，当然值得。”士郎的声音浮着一层薄薄的懒散，立香差点在副驾上笑出来。


  “你这个嘴巴——”伊什塔尔的话头噎在舌头尖上，她瞪着主驾的靠背把后半句嚼碎咽回去了。她现在习惯了——这个红头发的代行者就是这副死样子。


  立香把脑袋转了回来咽了口口水。她顿了顿，手指在安全带上轻轻敲了几下，然后开口。


  “我想知道，吉尔茜的职阶。”


  后座一片寂静。立香没有转过头去看后排后视镜，但她全部的注意力都栓在后排的吉尔伽美什身上——她能感到那双赤瞳正透过座椅靠背看着自己。她的背微微僵了，等着回答。


  士郎没有停顿。“Alter Ego啊。”他偏了一下头看了立香一眼，目光里没有躲闪，语调自然而然。“怎么了？”


  立香的瞳孔骤然一缩。她的瞳孔在街灯扫进来的光里缩紧了，然后又松开了。Alterego的身影从她的记忆里闪过去，然后她看向士郎的侧脸。他转回去看着前方的路，握着方向盘的那双手没有任何抖动的迹象。


  吉尔伽美什勾着嘴唇坐在那里。她把伊什塔尔摁在椅子上，一只手捂住白发的女神的嘴巴。她的赤瞳透过黑暗扫过立香的后脑勺。


  车里沉默了好一会。立香的沉默不是不想开口，是太多东西同时挤出喉咙谁都不让谁先走。


  士郎把方向盘往左打了一下拐过一个弯。然后他伸出一只手，手掌朝上摆在立香面前。


  “你？你干嘛？”立香的肩膀往后缩了半寸，狐疑地瞪着他的手掌，那个姿势让她整个人往车门的方向偏了一点。


  “手给我。”士郎的声音一点都不像在讲什么暧昧的事——太自然了，自然得像在说“把水壶递我”这样的日常对话。


  立香愣了一下。低头看看他那只悬在半空中的手掌——掌心朝上，指头的皮肤在车内昏黄的灯光下能看见一点粗糙的纹路。她把自己的左手放到他的手掌上，手腕的骨骼轻轻磕了一下他的指根。


  他把她的手整个拢在了掌心里。握了握。


  掌心很热。那股热度从她的手指一路传到手背，顺着血管漫过手腕。握得不重，刚好让她没法抽走。他的手掌把她整只左手都裹住了，掌心的温度稳稳地压在她的手背上。“怎么了，这么紧张？”


  她猛地把手抽回来。


  从脖子根往上烧起的绯红一下子涌上了她的脸颊。那种热来得快而猛烈，快到来不及去掩饰。'

content: '耳边的关切此起彼伏。言峰士郎却只觉得浑身发冷——这些话语，这个场景，他已经经历过了。


  心脏沉到谷底。他清晰地意识到，接下来的惨剧又要如期上演。


  下一秒，“轰隆——“


  教堂房顶被硬生生撕裂。灵长类杀手的利爪一闪而过，刚推门走出房间的伊莉雅连惊呼都来不及发出，便倒在血泊中，银发被鲜血染透。


  眼前的景象瞬间模糊。意识再度陷入无边的黑暗。


  “言峰！你……“


  再次睁眼，立香的声音刚要响起——这一次，他没有丝毫犹豫。


  “立香！快把希耶尔叫进来！立刻！“


  他撑着虚弱的身体坐起，声音沙哑却不容置疑，眼底满是焦灼。他不想再看着任何人死去，哪怕只有一丝可能，也要试着改变。


  “欸！好、好的！希耶尔前辈！希耶尔前辈！“


  立香被他的模样吓了一跳，慌乱地朝门外大喊。


  片刻后，希耶尔推门进来，瞥了一眼坐起身的言峰士郎：“慌慌张张的，出什么事了？刚醒就不能——“


  话没说完。


  “轰——！“


  一道白色光炮骤然炸开，吞噬了整个房间。教堂在轰鸣中坍塌，碎石飞溅，烟尘弥漫。所有声响被爆炸声掩盖，只剩死寂笼罩废墟。


  意识再次坠入黑暗。这一次，梦境里的触感、声响、血腥味，都比上一次更加清晰。


  一次又一次。


  他在熟悉的房间里醒来，听着同伴们关切的话语，看着他们在眼前一个接一个地死去。


  立香、伊莉雅、希耶尔……无论他怎么挣扎、怎么提醒、怎么尝试让他们逃走，都无济于事。灵长类杀手压倒性的力量像一座无法逾越的山，将他所有的努力碾得粉碎。


  他只能眼睁睁看着。


  看着同伴接连倒下，看着自己一次次被甩回原点。


  “那么，终于是时候到我接手了。”


  他的脑海里骤然响起这个声音，但是在此之后又一次踏入下一个循环。


  可言峰士郎偏不认输——哪怕循环往复、永无终点，哪怕每次尝试都以失败告终，他也从未停下脚步，眼底的执念从未熄灭，一遍又一遍地向着那不可能的救赎伸出手，拼尽全力想要救下每一个他能见到的人。


  终点遥不可及，救赎更是无从谈起，这座由精神污染编织的无形牢笼，死死将他困在这片绝望里，动弹不得。


  指尖的圣力渐渐消散，希耶尔看着监测仪上平稳跳动的曲线，语气松了口气：“生命体征稳定下来了，但他还是醒不过来。方才那四五个高阶洗礼，也只是稳住了他的状况，没能唤醒他的意识。


  “希耶尔前辈，为什么？”藤丸立香眼眶泛红，攥着衣角的手又紧了几分，语气里的焦急几乎要溢出来。


  “因为精神污染啃噬的是他生还的意志。”希耶尔缓缓开口，语气沉了下来，“就算他没有自我毁灭的念头，可如果在他的意识里，看不到任何存活下来的可能，就会一直被困在那片幻境里，醒不过来。”


  “怎么这样……”立香的声音低了下去，眼底的光亮瞬间黯淡了几分，满心的无力感涌上心头。


  “没死就已经是万幸了。”希耶尔喃喃自语，指尖无意识地摩挲着袖口，语气里带着几分费解，“他第一波精神污染时没及时处理，才拖得这么严重……我认识的言峰士郎，从来不会因为精神污染陷入这种境地。”


  “废话，杂修！”通讯器里突然炸响吉尔伽美什的呵斥，语气里满是不耐，“那时候的士郎，都跟着神琦灰学了好几年了，怎么能和你眼前这个还未真正成长起来的小鬼比？”


  “知道了知道了，跑题了。”希耶尔不耐烦地摆了摆手，语气稍缓，“不管怎么说，先保住他的命再说，能不能醒过来，还要看他自己，至少得等我们解决掉灵长类杀手……”


  她的话还没说完，一道清亮却带着几分调侃的少年声线，突然从床边传来，打破了房间里的凝重：“那躺的时间实在是太久了，前辈。”


  这声音，分明是言峰士郎的，却又和往日里的平和截然不同，多了一丝疏离的调侃。


  “！”


  “士郎！你醒了！”立香眼睛一亮，立刻快步迎了过去，可刚走到床边，脚步却猛地顿住——她愣了一下，看着床上坐起身的少年，神色有些恍惚。


  言峰士郎好像变了，又好像没变。眉眼还是熟悉的模样，可周身的气息却冷了几分，没了往日的温和虔诚，多了一丝不容置喙的沉静，他淡淡扫了立香一眼，缓缓坐直了身子。


  “事先说明，真正的言峰士郎，依旧被困在精神污染的幻境里。”少年开口，声音平静得没有丝毫波澜，“我是Ruler宝具留下的一道残响，专门来给你们提供解决灵长类杀手的方案。他被困住，反倒给了我正面和你们谈话的机会。”


  “言峰士郎”的语气没有半分起伏，径直说道：“长话短说，Ruler的真名就是言峰士郎——你们所处时间线的他。他现界时，灵长类杀手已经释放了全域精神污染，他能做的，唯有亡羊补牢。”'

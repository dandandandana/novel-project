content: '断裂的楼板从高处悬着，还没决定要不要坠落。


  言峰士郎站在倒塌天桥的边缘，一只靴踩在震裂的路面上，看着伦敦。更准确地说，看着伦敦剩下的部分。尘土还没沉——它在腰腹高度漂着，灰白，没有方向，把整个街区模糊成一张底稿。他右侧那栋被劈穿的建筑还在发出细碎的声响，是金属在新的位置上缓缓落定的声音。


  通讯器震了一下。


  “Ruler。“立香的声音里带着她重新规划路径时特有的那种平静。“他撤退了？“


  “是。御主。“


  短暂的停顿。背景音是轮胎压过碎石的声音，说明她们已经在路上了。


  “有受伤吗？“


  “没有。“


  “干得不错。“停顿，比上一个短。“在原地等我们，我们调整策略，再一起行动。“


  他没有应声，她已经学会了把这个当成回答。


  抬起头。天空是低沉的灰，有什么东西在里面高速移动，拖着一道金色弧光，从左方远处划出曲线，越来越低。士郎在心里标定落点，从路面边缘轻轻跳下。


  车子三分钟后到了。


  立香坐在副驾驶，身体微微前倾，肘放在膝盖上。那是一种大概从出发前就保持着的姿势，疲惫不在脸上，只在肩膀的角度里。车门拉开时，她看了他一眼，没说什么。


  玛修已经挪到了后排，没有人开口要她让位，她自己动了。士郎在驾驶座坐下，手扶上方向盘，调整后视镜——不是因为角度不对，只是手需要一秒钟的安置——然后把车开上路。


  立香侧头看了他一眼。“有什么发现？“


  “达芬奇的数据全部准确。“他先给结论，再给过程。“Alterego的参数无法用常规手段测定。他使用的武器会读取原始持有者的数据，在此基础上输出提升一阶。“


  “你怎么判断的？他用的是你的武器。“


  “投影装填赋予我对投影武装的精确识别。他调用了我的数据基准，但输出超过了这个基准。因此判断。“


  立香没有立刻说话。她转头看了玛修一眼，玛修已经低头看手里的设备了，手指轻轻划动，在交叉比对什么。车外，一栋建筑在某个倾角坍下来，压断了原本的人行通道，现在变成一个碎石坡，车子绕了过去。


  “很难缠。“士郎说。


  后排，吉尔茜的声音传来，不紧不慢，带着她惯用的那种语气。


  “''难缠''两个字恐怕抬举他了。以现有的阵容，没有哪个从者能和他单独交手，还会对结果感到满意。“


  “对。“士郎没有回头。“把投影装填剥离之后，他的基础战斗力仍然在我们现有从者的上限附近。“


  吉尔茜停顿了一下，“你第一个交手的时候就察觉了？“


  “第一次换手时察觉的。他在调整。“


  她发出一个不置可否的短音，把目光转向窗外。车窗外的废墟往后退，钢筋和混凝土堆成了新的地形。


  立香靠在椅背上，看着前方。“怪不得冠位Saber会输。“


  没有人反驳。


  后排安静了一段时间。玛修的视线从设备上抬起来，落在立香身上，停了一两秒。


  “先辈。“


  “嗯？“


  “到了之后先吃点东西。“


  立香顿了顿，“我没事。“


  “今天早上没吃。“


  “我吃了一——“她停下来，“到了再说。“


  玛修没再说，低回头去。手上的设备屏幕亮着，但她的注意力并没有完全回到上面。


  吉尔茜在后排没有开口，指尖在膝盖上轻轻扣着，节奏散漫，像是在记什么又像是什么都没记。士郎一直没有说话。方向盘在手心里是冷的，窗外的建筑轮廓一栋接一栋地向后退。


  计时塔在路的尽头出现，塔身的轮廓在低压的灰色天空下清晰得像是要把这片废墟撑到最后。


  士郎把车停在入口外侧，拉了手刹。四个人没有立刻下车——只是各自沉默了几秒，那种在目的地正式到来之前的短暂停顿。


  立香先动了。推开门，踩上地面，她习惯性地往回看了一眼——不是在找什么，只是确认人都在。玛修已经跟上来了。吉尔茜从后排出来，整了整衣领，用一种不带任何多余动作的步伐走向入口。


  士郎是最后一个下车的。他把车门带上，跟在队伍末尾。


  公寓的状态是一种介于临时和长居之间的悬置。


  家具没有偏好，只有功能。百叶窗压着，光从缝隙里渗进来，把地板切成一段一段的灰白。进门时，Alterego在玄关稍微停了一下——是鞋柜旁边，有人把一个装硬币的小陶罐放倒了，硬币没洒，只是整个陶罐斜靠在墙上。他把它扶正，放回原来的位置，没有开口，走向厨房。


  卧室方向传来声音，冷淡的声音，没有多余的上扬。


  “探出什么来了吗？“


  “带了原理血戒。其他和常规状态一致。“他打开冰箱，先把牛肉饼取出来放到台面上，再找生菜。


  “你没探到是因为他隐藏了，还是真的没有？“


  “没探出来。“


  “嗯。“


  脚步声从走廊那头过来，轻轻的脚步声，节奏不急不缓。


  阿尔托莉雅出现在卧室门口。'

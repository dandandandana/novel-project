content: '“陌生的人在一起，没有目的，就站在街上。“她睁开眼睛，看向前方，“听起来没有意义。“


  “对大多数人来说，那就是意义本身。“


  她没有立刻接，把目光落在百叶窗的方向，停了一段时间。然后：“那个鼓声能传多远。“


  “取决于鼓。有些能传整条街。“


  “嗯。“


  她把脚抬起来，搭在茶几边缘，空的汽水瓶在手里转了一圈。Alterego在她身后站了片刻，然后移回到沙发扶手旁边，坐了下来，没有坐进去。


  沉默里只有远处风穿过废墟的低鸣。


  “那名真祖也来了。“他说。


  “我知道。“她的语气没有变化，“过两天我去收拾她。叫爱尔奎特？“


  “是。“


  她握着汽水瓶靠回沙发，闭上眼睛，“那就等着看好了，士郎。“声音还是那个温度，“用冠位Saber灵基造出来的王，到底有多强。“


  Alterego没有接话。


  沉默在房间里维持了下来，直到光线再暗一点，废墟外的风声也低了下去。'

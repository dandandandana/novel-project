content: '“呵，他的御主倒是下了血本。”希耶尔单手托着下巴，眉头微蹙地思索，“雅典娜是智慧女神，大概率是借了智慧的权能；阿波罗是太阳神，能力什么的也该是贴合他的才对……”


  “希耶尔前辈！”立香连忙出声唤她。


  “抱歉抱歉。”希耶尔摆了摆手，语气里带着几分不耐，“一想到那混蛋顶着言峰的脸，我就忍不住多想。”


  立香轻声问道：“他很强吗？Archer先生。”


  “我们并未交手，御主。”Archer微微躬身，“但他周身萦绕着一股怪异的气场，给我的感觉，绝非轻易能够战胜的对手。”


  就在这时，通讯器里再度传来奥尔加玛丽的声音，带着几分无奈：“好了，连上了。刚才那个金闪闪真是骂得够脏，全是我听不懂的话。”


  “杂修……若不是本王……”吉尔伽美什的声音又冒了出来，依旧带着怒火。


  “就算你来了也没用，吉尔伽美什。”希耶尔毫不客气地打断她，“当年围杀灵长类杀手时，你不也只是个辅助吗？”


  “啊啊啊吉尔伽美什！别抢我的通讯器！回去好好干你的活！”通讯器里又传来奥尔加玛丽慌乱的呵斥声，夹杂着吉尔伽美什的怒骂。立香趁着嘈杂，连忙看向希耶尔：“前辈，那名Alterego，现在能算作盟友吗？”


  “暂时可以看作盟友。”希耶尔的语气里带着几分警惕，“但他来历不明，身上的杀意也毫不掩饰，必须多留个心眼。”


  “我怀疑……这杀意，会不会和你与言峰前辈的私人恩怨有关？”立香轻轻摇了摇头，又转头看向Archer。


  “我和言峰的私人恩怨？算是有吧。”希耶尔顿了顿，语气含糊地应道。


  “御主，这位修女说得没错。”Archer适时帮腔，“那名Alterego的杀意，确实毫不掩饰，绝非善意。”


  立香轻轻点了点头：“我知道了。”


  “藤丸立香，你也太偏袒言峰士郎了。”希耶尔看着她，语气里带着几分无奈。


  立香抬着下巴，语气带着几分倔强：“言峰救了我好几次命，现在他还昏迷不醒，命都快保不住了，我就是偏袒他怎么了。”


  希耶尔叹了口气，耐着性子解释：“……我不是反对你偏袒他，只是那位Alterego，说不定根本就不是言峰士郎。如果真是他，事情还好办些，可现在最关键的，就是我们没法确定他的身份。”


  “他或许拥有言峰的记忆，拥有言峰的力量，但他到底是不是言峰本人，谁也说不准。”


  “御主，他终究是Alterego，并非本体。”Archer也补充道。


  立香深吸一口气，再次点头：“我真的知道了。所以……”她目光恳切地看向希耶尔，“前辈，我们该怎么处理那只灵长类杀手？”


  “这正是我要问的。”希耶尔收起了所有随意，目光转向一直沉默着的Saber和伊莉雅，语气郑重地开口，“我需要知道Ruler的情报。”'

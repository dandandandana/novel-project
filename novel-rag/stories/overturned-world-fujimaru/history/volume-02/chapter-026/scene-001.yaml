content: 'Alterego拎着她，就像拎一件从衣架上摘下来的外套。


  “第五次圣杯战争。“


  他开了口。语气散漫得出奇，像是突然想到了一件有意思的事，随口提了一嘴。他的目光没有落在立香脸上，而是偏向一边，看着暴雨中模糊的天际线。


  “这个时间节点降临的圣杯啊。“尾音微微上扬，带着一声鼻息般的轻笑，“你大概已经知道了。这次圣杯战争的胜者，是言峰士郎。“


  立香没有回答。她的喉咙被卡住了大半，每一次呼吸都像是在用一根极细的吸管往肺里灌水。但她的眼睛是睁着的，琥珀色的瞳孔里映出Alterego那张和士郎一模一样的侧脸，还有雨幕中柳洞寺歪斜的檐角。


  “在正确的历史里，这次的圣杯没法许愿。“Alterego的视线兜了一圈，慢悠悠地转回来，“可是在这儿嘛……“


  他停了一下。嘴唇动了动，像是在咀嚼接下来这段话要怎么说才比较有趣。


  “Caster拿到了形成特异点的那个圣杯之后，干了件挺聪明的事。她把两个圣杯的内容物做了个对调。纯净的那个和被黑泥污染的那个，里面的东西换了个位置。“


  他用空着的左手比划了一下，两根手指交错绕了一圈，像是在演示一个简单的杯子戏法。


  “所以呢，形成特异点的圣杯，变成了可以许愿的圣杯。被黑泥弄脏的那些东西，则被塞进了原来那个纯净的壳子里。“


  他笑了一声。很短。牙齿碰了碰下唇又松开。


  “总之，现在这个圣杯，能许愿。“


  立香的手指在Enki的剑柄上抠得更紧了。金属握柄的花纹勒进她的指肉里，压出一条条白印。她想开口说什么，喉咙里挤出来的只有一串含混的气音，像是被水呛住了。


  Alterego歪了歪头，往下看了她一眼。


  “你大概也知道他的愿望了吧。“


  他的语速忽然慢了下来。慢到每个字和每个字之间都塞进了一小段可以被察觉到的间隔，像是他的思绪被什么东西勾住了，往回拽了一截。


  “很普通。“


  他的眉心有一根极细的纹路皱了一下，又很快松开。


  “想要找到自己的愉悦。“


  这句话从他嘴里出来的时候，戏谑的味道淡了那么一两分。只有那么一两分。然后他的嘴角重新翘起来，那道裂缝一般的浅弧又挂了回去，像是一面镜子上被擦掉的雾气很快又重新凝结了。


  “藤丸立香。身为迦勒底的御主。“


  他的目光落回立香的脸上。


  “你现在的愿望，大概是……“


  他把那个“是“字拖得有点长。


  “活下去吧。“


  他轻轻地笑着，掐住立香喉管的手指缓缓收紧了一个刻度。不多。就像拧螺丝一样精确地多拧了半圈。立香的气管被进一步挤压，肺里残存的那点氧气开始不够了，耳膜深处涌上来一阵尖细的嗡鸣，视野边缘的色彩正在一点一点被洗掉，从彩色褪成灰白。


  立香笑了。


  在喘不上气的间隙里，她的嘴角扯出一个弧度。那个笑歪歪扭扭的，夹杂着呼吸被压断后的嘶嘶声，不好看，甚至有点狰狞。但她笑了。


  她瞪着Alterego。


  “我的愿望……“


  声音从被挤压的喉管里硬生生挤出来，每个音节都带着粗砺的杂音，像砂纸在刮铁皮。


  “是杀了你。“


  Alterego的眉毛微微动了一下。


  “你顶着言峰士郎的那张脸。“立香的声音越来越用力，每一个字都像是在用最后一口气往外吐钉子，“却做出……这种卑劣的……你配吗？！“


  最后两个字是吼出来的。吼完的瞬间她的喉管彻底被压到了极限，剩下的话全部堵在了声带以下的位置，只剩一声短促的、被掐断的闷哼。


  “呃……“


  Alterego的眼神变了。


  没有大幅度的变化。他脸上那个浅笑的弧度还在，嘴角的位置一毫米都没有偏移。但他的瞳孔，在立香说出“你配吗“三个字的那一刻，收缩了。


  收缩的幅度极微，持续的时间极短。如果不是立香此刻正被他拎在面前，和他的脸只隔着不到一臂的距离，她不会看到那个变化。


  他的手指又收紧了。


  这一次不是之前那种精确到刻度的控制了。他的五指同时发力，像是有什么东西在他的克制上凿出了一道裂缝，力量从那道裂缝里漏了出来。


  “我早就说过。“


  他的声音冷下来了。从头到尾第一次，他的声音里出现了温度的变化。之前所有的戏谑、所有的平淡、所有的居高临下，底下都铺着同一层恒温的凉。但此刻那层凉意骤然跌了几度，变成了一种带着棱角的、硬邦邦的冰冷。


  “我是赝品中的赝品。“


  他的视线直直地钉在立香泛红的脸上。


  “别把我和他混为一谈。“


  银光。


  从侧面。极快。快到连暴雨中的水帘都被刃风撕开了一条裂缝。


  贞德的旗剑斩向了Alterego持握立香的那条手臂。'

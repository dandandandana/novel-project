content: '退回立香的支援范围内之后，她满面怒容地瞪着朱月。胸腔剧烈地起伏着，每一次呼吸都从喉咙里带出一声被压得很低的喘息。“那具身体——你打算用到什么时候。”


  “用到你死为止啊。”朱月的微笑纹丝不动。


  立香把枪口指向朱月，手指在扳机上收紧。安魂的枪身在她掌心里微微震动，子弹离膛的声音短促而干脆。


  朱月在即将被击中的侧身躲过，黑裙的裙摆在转身时扬起又落下。她悠悠地开口：“在里面埋入了心象结界吗？”


  立香的瞳孔缩了一瞬，但她没有让惊讶表现在脸上。她的声音依旧平稳：“你是怎么知道的。”


  “啊——看出来的。”朱月把手抬起来，指尖在空气里轻轻划了一下。“毕竟固有结界和空想具现化的原理差不多嘛。人类的固有结界大概是大魔术的一部分，可你那位手艺人不光把它做成了子弹，还压缩得这么紧实——”她歪了歪头，暗红色的瞳孔里闪过一丝赞叹。“不如问问给你这杆枪的家伙他是怎么做到的吧，应该是花费了毕生的心血哦。”


  立香没有接话。握枪的手纹丝不动。


  “不过你也没机会了。”朱月把手放下来。


  她的话音刚落，狂犬们再度扑来。那些白色的身影从走廊两侧同时逼近，空中的爪牙和地面的奔跑混成了一片密集的威胁。立香这次没有节省弹药，安魂的子弹毫不犹豫地朝狂犬群里倾泻。砰。砰砰砰砰。每一发射出的子弹都在命中后炸开，内爆弹的剑刃从狂犬体内向外穿刺，碎骨和金属残骸在走廊里堆成一座座小型的废墟。


  弹壳在石板地面上跳跃着，滚进暗紫色冥界纹路的缝隙里。


  立香的脑子里飞速闪过一个念头。


  【要用令咒叫士郎来吗。】


  然后她用更快的速度把这个念头压了下去。士郎还在塔顶和Alterego作纠缠，如果他现在被强行召回，那个镜像一样的家伙一定会用宝具一刀劈开整座计时塔。


  【玛修还在手术台上。】


  她不敢继续想了。


  枪声再度响起。白色安魂的弹夹已经空了一半，她打死迎面扑来的一只狂犬之后没有重新瞄准，而是朝另外一只直接冲了过去。手指在枪身上一抹，安魂的剑刃从枪口下弹了出来。刀锋划过狂犬的喉咙，骨架碎裂的脆响在耳边炸开。


  “超越A++对人？”朱月的语调往上扬了扬。“他真是下了血本啊。”


  爱尔奎特随着滑步走了过去。她的脚步已经不如之前轻盈，鞋跟在石板面上拖出刺耳的摩擦音。但她还是冲上去了，利爪撕碎了拦路狂犬的脑袋，骨片和暗紫色的魔力残渣在她身侧飞散。


  她朝着朱月扑去。


  “不自量力。”朱月微微一笑，同样撑起爪子迎了上去。“不掂量掂量现在自己几斤几两？”


  两人的爪刃对撞，两个爪子互相卡住，发出一声令人牙酸的尖啸。爱尔奎特的手臂在颤抖，肌肉的迟滞感比刚才更强了。她想要后退重整，朱月却已经乘胜追击，爪刃压着她的防线往下沉。


  爱尔奎特咧嘴笑了起来。某种豁出去的决绝在她的脸上绽放出来。她的手里凭空凝出一柄蓝色的魔剑，剑身上流转着不属于这个时间维度的冷光。足以斩断时间和法则的真世界魔剑被她双手握住，狠狠地朝朱月斩去。


  “你竟敢——”朱月的瞳孔骤然一缩，面上的微笑终于碎裂了。“你竟敢！”


  她没敢硬接这柄魔剑，狼狈地侧身躲了过去。爱尔奎特乘胜追击，蓝色的剑光在走廊里拖出一道道割裂空间的残影。朱月看着追来的爱尔奎特，手掌往上一抬。


  周遭的空间朝爱尔奎特挤压而来。石砖、壁灯、通风管道，所有物体都在一瞬间被某种无形的力量扭曲，像被一只看不见的手捏住了。爱尔奎特一剑把周遭的环境劈开，碎裂的空间碎块在剑光里化为虚无。当她准备再度追去的时候，朱月已经到了她的身侧。


  “你真觉得你很会用剑吗？”朱月轻声开口，语气里第一次带上了真正的怒意。


  她的爪子快如闪电地抓向爱尔奎特的腹部。那一爪不是招式，纯粹是力量和速度的碾压。爱尔奎特来不及躲避，爪刃切入她的腰腹，整个人被打得倒飞出去，身体在半空中翻了一圈才重重砸在石板地面上。


  在她高高飞起的那一瞬间，立香的眼眶里映入了朱月的身影。


  她不算经验丰富的战士。但安魂上的武艺在告诉她该怎么做。子弹还剩下最后一发。不会打到爱尔奎特吗。她犹豫了不到半次呼吸的时间，然后选择了相信士郎给她打造的这柄枪。


  一枪开出。


  心象弹离膛的声音格外孤独，在满走廊的爆炸和金属声中像是一声干净利落的句号。朱月看着近在咫尺的子弹，一只狂犬从她身侧扑来，白色的皮毛挡在了子弹的轨迹上。


  噗嗤。


  狂犬替主人挡住了这一发。剑刃从它体内往外爆开，碎骨溅在朱月的黑裙上。朱月连看都没看那只替死鬼，目光穿过走廊，落在立香身上。“可惜了，慢了一瞬间。”'

content: '“原来如此——”爱尔奎特的声音压得极低，像是从胸腔底部碾出来的几个字。“借助爱尔特璐琪的身体完成了复生吗。”


  她话音刚落，利爪已经从指间弹了出来。利爪在警报的暗红色闪光里泛着寒芒，她脚下一蹬，整个人朝朱月扑了过去。爪刃划开空气的声音尖利而短促。


  朱月连手都没有抬起来。那双血红色的瞳孔只是静静地看着爱尔奎特扑来，嘴角的笑意纹丝不动。哥特黑裙的裙摆在警报闪光里摇曳，她的姿态松弛得像是坐在自家客厅的沙发上。


  “小心！”


  立香的声音从爱尔奎特身后炸开。


  头顶传来一声刺耳的嘶叫。白色的狂犬从天花板的阴影里坠下来，四肢在半空中张开，直直地朝爱尔奎特的脖颈咬去。立香的枪口已经抬了起来，安魂的黑白双枪在她手里稳稳当当。


  砰。


  内爆弹正中狂犬的胸口。子弹钻进白色皮毛的瞬间，那只狂犬的身体猛地僵在半空中，然后从体内开始变形。剑刃从骨缝里往外挤，从腹部、胸口、脊椎的每一道间隙里穿刺出来——那是心象结界在狂犬体内展开后凝固成的无数柄剑，把这只使魔从里到外变成了一座行走的剑冢。碎片和残骸哗啦啦地砸在石板地面上，金属和骨头的碎屑混在一起。


  “哼哼——”朱月轻笑着，手在裙摆侧边轻轻一抬。她身侧的空气波动起来，一头又一头狂犬从无形的波纹里踏出来。五头、十头、数不清的白色身影在走廊里排列开来，每一双空洞的眼睛都盯着爱尔奎特和立香。“还要挣扎吗？”


  “不好——”


  伊什塔尔刚要转身去支援立香，脚后跟还没完全转过来，背后就传来了一声冷硬的敲击。


  “咚。”


  骷髅法杖的底部磕在石板地面上，那道声音不响，却像是某种规则被激活的开关。冥界的范围在她脚下一瞬间展开，暗紫色的纹路沿着地板蔓延开来，把伊什塔尔的双脚牢牢钉在原地。她发现自己竟然完全无法后退了。


  “真想要和我打啊，你这个家伙——”伊什塔尔的红色瞳孔蓄满了即将满溢出来的怒意。她手上捏起一把宝石，蓝白色的冷光从指缝间挤出来。“那就试试看！”


  宝石全部丢出，蓝白色的光团在哈迪斯身侧炸开。使魔的碎骨在爆炸中翻飞，黑袍的边角被气浪掀起又落回去。


  伊什塔尔没有停手，她仰头朝天花板再度丢出宝石。爆炸声沉闷地在头顶回荡，碎石簌簌落下，但天花板纹丝不动。那层暗紫色的冥界纹路已经爬上了穹顶，和石砖融为一体。


  “连天花板都进行了加固吗？”伊什塔尔咬牙碎了一口，目光重新钉在哈迪斯身上。


  “陪我玩玩吧，金星的女神——”哈迪斯悠悠地开口，声音从黑袍的兜帽下传出来。他身侧的暗紫色纹路里浮现出一道又一道披着精锐武装的冥界士兵，铠甲的表面流转着和冥界纹路如出一辙的幽光。那些士兵手持长戟与弯刀，步伐整齐地朝伊什塔尔逼近。


  “求之不得啊。”伊什塔尔冷笑着，目光死死地锁在哈迪斯身上。她的手在身侧一展，新的宝石从掌间凝出。“让我看看冥王和冥界女神之间的差距有多大！”


  哈迪斯只是微微笑了笑。他在冥界纹路上缓步移动，黑色袍裾拖过石板，发出细微的摩擦声。“没记错的话，美索不达米亚的金星女神在冥界是没有力量的吧——”


  他话音未落，身侧浮现出几道魔法阵。那些光盘在暗紫色纹路的映衬下泛着冷白的光芒，然后同时爆发，魔力光束朝伊什塔尔倾泻而去。光束的速度极快，在走廊的昏暗里拖出数道刺目的光痕。伊什塔尔侧身躲过第一道，第二道光束擦着她的银发掠过，灼热的魔力余波让她的发梢微微卷曲。


  “那又如何！”她把宝石砸向逼近的冥界士兵，爆炸的光团在铠甲上炸裂，碎片四溅。但此地的规则正在以肉眼可见的速度削弱她的火力。每一次宝石爆炸的威力都比上一次更小，蓝白色的光团在暗紫色的纹路上炸开又迅速被吞噬。


  伊什塔尔咬紧牙关，红色的瞳孔里怒意和焦灼混在一起。但她的嘴角还是翘着，那个自恋的弧度像是焊在了脸上。“就这种程度还想困住我？你未免也太小看美索不达米亚的女神了！”


  哈迪斯没有回答。他又在冥界纹路上移了一步，魔法阵的光盘重新排列，再次蓄力。黑色的袍袖下，那只握着骷髅法杖的手不急不缓地敲了一下地面。


  咚。


  光束再次爆发。


  在那头交手的时候，立香再度开枪打死了一只狂犬。安魂的枪声在走廊里短促地炸响，弹壳从枪膛里弹出来，在石板地面上弹了两下才停住。她飞快地计算了一下子弹数量——一个弹夹十二发，黑枪和白枪各只剩不到一半了。


  爱尔奎特勉强用利爪撕开迎面扑来的狂犬的喉咙，利爪切过皮肉的触感比平时更加迟滞，手臂的肌肉在每次挥动之后都要多用半秒才能重新蓄力。她真真切切地感受到力不从心了。'

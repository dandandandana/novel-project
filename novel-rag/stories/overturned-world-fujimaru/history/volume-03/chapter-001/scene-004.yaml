content: '她从被褥里坐起来，右手在睁开眼之前已经往外伸出去摸到靠在床边的刀。手指碰到刀鞘的那一下——木鞘的纹理从指尖凉凉地贴上来，凉意从指纹边缘渗进指腹皮肤。她握着刀鞘从被褥里站起来，脚趾踩在榻榻米的草面上，草面被体温焐过的地方还残留着一层薄薄的热，但草面边缘已经凉得和刀鞘一样。


  “天照的金地不会有这样的白天……”她把这句话说给自己听。嘴唇张开时喉咙还带着刚睡醒的沙，沙哑让这句话听起来不像判断，更像她在说服自己这件事真的发生了。


  她走到房间另一角的木桌前，桌上立着一块牌位。牌位前供着一只粗瓷小碟，碟子里盛着的米粒已经干得裂了几道细缝。少女在牌位前跪下来——膝盖落在榻榻米上时草面陷进去发出很闷细的响。然后她把额头磕下去。


  武士刀在木桌上放着，她把刀从桌上拿起来。刀鞘外侧被她的手握过的位置已经磨出了一片比周围更亮的木色。她把刀插进腰带里，刀身贴在腰侧时那份熟悉的重量透过腰带压在她的髋骨上。走到门边时她把木门推开，门轴转开的那道声响在寂静中拉得很长。


  她站在门口，昏黄的天光从上往下浇在她身上，把她整张脸切成一半亮一半暗。刀柄在她腰侧随着她的呼吸轻轻晃了一下，她朝外走去，步子不快但每一步都踩得没有犹豫。


  门外是昏黄的天。天照得金地不会有这样的白昼。'

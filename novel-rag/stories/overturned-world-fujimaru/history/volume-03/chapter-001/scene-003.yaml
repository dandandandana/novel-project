content: '村正的眉头在刚才挑起来就没放下去，现在皱得更深了。“怎么可能？Master？你说那个走出去的和尚跟‘命’这种东西有关？”


  “……‘命’代表着人的下限。”伊邪那美说着抬起右手，用拇指在左手掌心划了一道从上到下的线，“‘命’会积累。”她的拇指从掌根往上推，推到手指根部时停住。


  “这种东西给老夫也没用。”村正甩了甩手，手背在空气里扇了两下像是在赶走什么看不见的东西，“不过老夫听懂了，就是人这辈子做的好事越好，‘命’就越醇厚——对吧？”


  “是。”


  “那他是怎么做的？”村正把“做”这个字咬得很重。


  伊邪那美的声音变了。就在村正问完这句话之后，她整场谈话中始终平稳到近乎寡淡的语调忽然被一把提起来，语速从缓慢的叙述切进了某种压抑不住、想要往外冲的急促。


  “他窃取了我丈夫的命。”她说话时手指从掌心抬起来按在案几上，指尖压在木纹上的力道比刚才重了很多。


  “哈？”村正的嘴巴张开又合上，合上时还抿了一下嘴唇把他的惊讶硬生生锁回喉咙里。


  “圣杯。他利用圣杯激活了伊邪那岐的神尸——也就是他们说的‘金地’。然后，”伊邪那美顿了一下，“窃取了他的命。”


  “等等。”村正的手从膝盖上抬起来在半空中停住，“窃取了谁的。”


  “我的丈夫。”伊邪那美把那四个字咬得极重，重到她说出“丈夫”这个词时整张脸上的表情从古井变成了被凿开的岩石。“伊邪那岐。”


  村正把手收回去捏住下巴，拇指抵在自己下颌线上来回蹭了两次。然后他松开手把背重新靠回椅子里，“啊——老夫懂了。那个走出去的和尚，你说的那个没法渡己偏要渡人的家伙，他用圣杯把伊邪那岐的死尸激活了。”


  他把手指从下巴上挪到太阳穴，用指侧轻轻敲了两下自己的头侧，“然后从里面把所谓的‘命’抽了出来——伊邪那岐积累的命。创世神一生的积累被他一个人拿走了。然后他变成了什么？”


  伊邪那美没有回答这个问题。她只是看着村正，眼神从丈夫那里转到了眼前这个红发从者的脸上，然后微微偏了一下视线。


  “父亲——”


  这一声从门外插进来不是叩门不是推门而是一声很轻的、把尾音拖得有点长的呼喊。然后是门被慢慢推开的声响，门轴转动时发出一道半圆的嘎吱声。红发的少女从门外把脑袋探进来，头顶大约只到村正坐下来时的腰际线。她的眼睛和村正一模一样——琥珀色，被殿内烛光一照泛出偏红的暖光。


  “父亲，该吃饭了~”少女笑着把门推到刚好能把自己整个身子露出来的宽度。


  村正从椅子上弹起来，膝盖伸直时，他整个人往上窜了一截，他脸上的表情在察觉到女儿推门的瞬间被刷掉了——刚才那个捏着下巴追问真相时嘴角挂着的恶劣笑被他收得干干净净，代之以某种纯粹的亮。


  “饿了么？等爸爸一下？”他弯下腰把女孩从地上抱起来，手托在女孩背部时整个手掌刚好盖住女孩肩膀。“怎么样，要不要听伊邪那美姐姐讲故事？”


  “要！”女孩举起双手，食指卷着父亲的衣领玩。


  伊邪那美看着村正怀里那个红发的女孩。她的目光在少女脸上停了一会儿——少女的脸型和村正几乎一模一样，那双眼睛是从村正眉骨下面原样拓过去的。伊邪那美开口时声音已经回到了之前那种平淡的调子。


  “千子村正。”村正把脸从女儿头顶扭过来，下巴蹭着女儿的发顶。


  “在，御主。”伊邪那美看着红发少女，“她是药生子。”


  村正的肩膀僵了不到半拍，他把孩子往怀里抱得更紧了一点，“就算是从观音水里诞生的孩子，也是老夫的孩子——不管怎么样都是。”


  伊邪那美把视线从村正脸上挪开，落在他怀里那个正好奇地扭头看她的少女脸上。“……算了，也只有你响应了我的召唤。我又能要求你什么呢？”她说完把右手从案几上放下来搁回膝盖上，手指扣在自己的腕内侧。


  “哼哼~”村正重新笑出来，这次的笑和他对伊邪那美时的恶劣，像是刚刚得到孩子的父亲一样，“确实没什么好要求的。想吃什么？”他低下头把脸贴在女儿额头上。


  “父亲做的就好~”少女把脸往村正肩膀上一埋，声音穿过村正肩头的布料闷闷地变成一团模糊但清晰的笑。“我没什么好挑的。”


  村正的嘴角往上抬了一截，琥珀色的眼瞳在眼眶里往下移了半寸，刚好落在女儿睫毛上。“那就好。”


  少女睁开眼睛。


  眼皮从瞳孔上退开时视线第一下是糊的，天地之间全是昏黄——像是被硫磺烧过的天幕在极高处混了一整片浑浊的黄。'

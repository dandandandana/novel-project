content: '走道里的木头在脚下吱嘎作响。士郎把心底翻涌上来的那个疑问压了回去，他的脚步稍微放慢了半拍，从立香身后挪到她左边，肩膀蹭过木墙上挂着的挂轴，挂轴晃了晃，画上那只红冠白鹤的脖子歪了一下。


  “御主，我发现了一件事情。”


  他把尾音稍微拖长了一点，拖得不像他平时说话的样子。立香偏过头，挑起左边眉毛。走道里的纸灯笼把她的脸映成暖黄色的，“什么事情。”


  “你在这里没准有个兄弟姐妹。”


  立香的表情空白了大概一拍呼吸的时间，然后整个脸垮下来，嘴角往下一撇，是那种介于无语和想笑之间又笑不太出来的表情。


  “你在开玩笑吗。现在情况不是很明朗欸，你平时也不怎么开玩笑啊。”


  她的视线在士郎脸上搜索了一下，没有找到任何破绽。士郎这张脸说正事的时候也是这个调调，开玩笑的时候也是这个调调，光看表情根本分不出来他嘴里那几句话的成分到底是什么。


  “咳咳。”士郎把手拢在嘴边，清了清嗓子，声音放下来，“意思是后面那位长得和你很像。”


  立香停下脚步，扭过头。身后那个披着灰色羽织的身影还隔着十来步，兜帽压得很低，帽檐投下的阴影把整张脸都吞掉了，只从边沿漏出一截下巴，下巴的弧线很柔和。


  走道里的风从后面灌过来，吹得那件灰羽织往一边翻卷，露出一段白色的锻造服和握刀的手。那只手不大，虎口上有一层老茧。她看不见兜帽底下的脸，只能感觉到那阴影里有一双眼睛也在看她。


  她扭回来，嘴唇动了动，像是在心里把几种回答都过了一遍，最后选了最省字数的一种：“我知道了，信你一回。”


  路到头了。德川家纲在一扇木门前停下来，转过身弓着腰，一只手伸出去指向前方。那扇门后面的空间很大，门还没推开就已经能感觉到从门槛底下渗过来的凉气，是那空旷本身散发出来的冷。“尊上，我家大人的指示是，请大人们在主殿稍等。请宫本武藏大人先行面见我家大人，有要事需面谈详说。至于村正大人，请您先去西边的殿内稍等。”


  千子村正没有出声。灰羽织在走道里转了半个圈，朝着西侧的岔路走去，靴底踩在木板上留下很轻的声响，像是怕踩坏什么东西似的。


  立香看着她的背影在走道拐角消失，然后收回视线，朝德川家纲点了点头。“我知道了，你先去忙你的吧。”


  德川家纲拔腿就走，动作快得像是身后有人在赶他。他领着武藏朝东方偏殿走去，武藏掉过头来朝立香摆摆手，那张饱满的脸绽开一个很灿烂的笑。“回头见啦，立香！”她说话一向这么大声，这声招呼撞在走道的木墙上嗡嗡地弹了好几下才散尽。


  士郎盯着那两个背影，等他们走远了，才把视线慢慢切回到立香脸上。


  “你什么时候这么能端得起来架子的。”


  “咳咳，别在意。”立香伸手扯了扯自己的领口，领口其实不紧，她只是需要一个让手有地方放的动作，“其实我很紧张的。”


  士郎没有回话。他的眼睛在她脸上停了一下，然后移开，转身朝主殿走去。走了两步才开口，“看出来了。”


  “欸？”立香站在原地愣住了，偏过头看向身边的玛修，眼角因为紧张而微微抽动，“玛修，我有很明显吗？”


  玛修摇了摇头，然后把身体倾过来，凑到立香耳边，声音压得只有两个人能听见，嘴唇几乎贴着立香的耳廓：“前辈，你刚才在拽言峰前辈的裤子。”


  “怎么不早说！”立香的眼睛一下子瞪得很大，脸上的红从下巴一路烧到耳根，那片红色在纸灯笼的光下显得格外亮堂，“啊啊啊啊我身为御主的——算了，先进去了。”


  她拔腿朝士郎的方向追去，两步小跑，靴底在木板上拍出急促的节奏。玛修站在原地，无奈地晃了晃脑袋，跟了上去。


  主殿的气派让立香的脚步顿了一下。她跨过门槛的瞬间觉得自己像是被什么东西压住了肩膀，抬头一看才发现那不是肩膀的问题，是这间屋子实在太大。


  几根整根杉木柱子从地板一直通到房梁，梁上挂着深色的木匾，匾上写的字她一个也认不得。从门口走到座席那段距离远得荒唐，她数不清自己的脚步，但说话的时候听见了回音，自己的声音被三面的木板墙弹回来，折成好几道干瘪的音轨。


  士郎已经坐下了。他坐在客座的木垫上，背挺得很直，手搭在膝盖上。立香在他旁边坐下，玛修站在身后，盾牌从长袍底下露出一个角。


  很快就有人来了。穿僧袍的下人们端着木盘鱼贯而入，木盘上摆着瓜果和腌肉。瓜果洗得倒是干净，皮上还挂着水，腌肉切得薄薄的，码在木盘里，颜色发暗，纹理细密，看起来像是某种经过长期腌制的腊肉，但气味不对。


  立香看着士郎，她张了张嘴，欲言又止。'

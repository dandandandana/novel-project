content: '立香看着武藏的脸一点一点地碎成灵子，没有说话，士郎还举着盾挡在村正那一剑的余波前，那个持戟的男人正把脸转向村正的方向。


  村正站在火里，红色的太刀还扬着，刀身上的火焰开始慢慢退去，从发白退成橙红，再退成暗红。她的嘴唇动了一下，说了句什么，但没人听清。火焰还在烧，把三个人的影子投在地上，拉得很长。'

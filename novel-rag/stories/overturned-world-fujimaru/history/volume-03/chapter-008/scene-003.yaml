content: '松林的尽头，村子的茅草屋顶在黄昏最后一道光里露出了轮廓。屋顶上铺的干草被夕阳染成一种看起来很暖的褐色，但那股扑面迎来的甜腻气味和这种视觉上的暖意拼不到一起去。


  身着黑白道袍的女人从村子里一间简陋的茅草屋里走出来。她走出来的时候眼角微微下垂，下垂的角度刚好能盛住脸上还没完全消散的满足感。


  她的步幅不长，不短，每一步都踩在很放松的节拍上，身后的茅草屋里传来男人的声音，各式各样的嗓音——有的粗，有的哑，有的年轻到还没变完声，这些嗓子把她叫住，用不同措辞重复同一句感谢。


  女人听着这些感谢的声音，嘴角往上走了半寸，然后继续往前走。


  “这个世界真是无趣啊。不过没想到还有这种地方——真是令人愉悦。”她把这句话说给空气听，说给自己听。说完之后嘴角往上勾起，眼角的肌肉没有跟着动。“还没那个无趣的世界有意思。罢了。”


  她正朝着另外一处茅草屋走去，手指已经搭上了帘子的粗布边缘，指腹能感受到粗麻纤维在指尖上的扎感。耳廓捕捉到了脚步声。从左后侧传来的。很轻，很稳，不像是村子里的村民能发出的。


  “阿拉。看来来了。看看我没有开感知来的人是谁——开个盲盒。”


  她转过身子。转过来的时候嘴角还挂着那个戏谑的笑，这个笑在她看到来人的脸之前还完整地挂在原处。


  然后她看见了千子村正的脸。


  笑容凝固在脸上，像一根被风吹灭的烛火，灯芯上的光灭了之后剩下一缕还没来得及散去的烟停留在原来的位置上。


  女人的嘴唇还在动，动了两下，吐出来的声音比刚才所有的自言自语都轻——轻到像是在梦里认出了某个不该出现在梦里的人。


  “卫宫白？！她怎么可能——”她的表情怔愣在那里，眼角下垂的角度一下子变了，那是刚才一瞬间从脑子里涌出来的东西还没来得及被理智过滤掉的本能茫然。


  然后她摇了摇头。第一次摇得很轻，第二次摇得比第一次用力。


  “不可能。绝对不可能。”她把几个字拆成两个短句说了出来。


  立香看着眼前这个女人的表情从戏谑到怔愣到否认，这一整套变化就发生在她看清楚村正的脸之后的两三秒里。


  然后立香的鼻子捕捉到了另一种东西——不是表情，是气味。这气味不是一点点渗过来的，是一整片糊在她面前的空气上，浓得用不着吸鼻子就能在舌尖上尝出甜腻的那层。


  她顿时有点无语。


  玛修的表情一下子垮了下来。刚才还保持着得体的微笑，此刻那个微笑已经从脸上一寸都没剩。她的眉头是平着的，嘴唇是抿紧的，眼角往下多压了一点，整个人看起来像是在社交场合里闻到了一股在场其他人都闻不到的东西。


  “前辈。我觉得这位可能不是什么好人。”她把这句话从齿缝里往外推，推出去的时候还要顾着不能让音量高到引起对面那个陌生人的注意。


  “啊，我闻到了。”立香的声音在喉咙口被那股味道堵了一下，她咽了一口凉气把最后几个字送出来。


  立香语气里的汗颜不是对着空气的——是对着此刻站在茅草屋前那个已经从怔愣中回过神来的女人。


  她刚想说点什么把话题绕过去，甚至想好了一句“这——就算是友军——”来缓和一下氛围，但玛修先她一步的垮脸把她的话堵在了喉咙里。


  女人的目光立香再抬头时那女人已经从“不可能”里抽身出来。


  视线重新变得敏捷——从村正的脸上挪开，在眼前一行人之间扫了一圈停顿在士郎的白风衣上。


  “这身衣服。”她停顿了一下，不是惊讶只是某种确认。——祁荒。”她报自己名字时的语气，和刚才向茅草屋里的男人介绍自己时是一样的。


  “祁荒。”立香把这个名字在舌尖上翻了个个，然后看向士郎，目光从他侧脸扫到他的眼睛，“你听说过吗？”


  士郎摇了摇头：“没听过。”


  “玛修呢？”


  “没有，没有这个信息。”玛修的回答很快，说完之后她马上补了一句，“数据库没有任何对应。”


  立香把脖子转过去看向村正：“——村正亲呢？”


  “我怎么可能知道。”村正的声音从抱刀的位置闷闷地传过来。


  “哈？”祁荒愣了一下。她伸手指向言峰士郎，指尖对准他风衣领口的位置。“你不认识我？”


  “我为什么会认识你。”士郎的回应里带着一种不是针对她、而是针对整个情况的无奈，他的肩膀微微往下沉了一点。


  祁荒把手收回来捏着自己的下巴。手指在下巴尖上反复擦了几下，这个动作做得很轻但很密，像是在给自己脑子里正在快速翻过去的几页纸打拍子，“难不成是没有到埋葬机关的IF。还是说——我是最广泛的杀生院祁荒。”


  她在小声地、自言自语地把这几句说出来，声音从鼻腔里闷闷地往外漏，尾音和下一句的开头叠在一起。'

content: '她把“她”这个字轻轻带过。然后村正淡然地把嘴往上一扯，扯出一个笑：“我也没有受到过佛祖的什么救济。从小到大都是我的家人和自己拼来的。”她把抱刀的姿势在这句话里收紧了一点。


  “我也没必要称呼他的尊称就是了。”


  立香看着村正脸上的笑，也叹了口气。叹完这口气之后她把肩膀往下沉了一点，像是在刚才那番消化信息的过程里把什么很重的东西从肩上卸下来放在了脚边的松针上。


  “好吧，你说的也算有道理就是了。”她说完之后重新转过头看向林间小路的尽头，那里的松针在黄昏的光里被染成了一种不深不浅的暗金色。


  从月读命金地出来的时候外面的天空是一片明亮，走到这里已经是接近黄昏的时间了。


  四人沿着丛林小路往前走。松枝在头顶上方交叉成一片正在缓慢变暗的顶棚，只有偶尔几根枝条错开的地方漏下几道斜斜的光柱。那些光柱落在地上时已经没什么力度了，只能把松针的暗金染得更深一点。


  村正的木屐踩在地上的节奏比之前慢了——她对这条路很熟，用不着赶。“再往南有一个小村子，我们可以在那里落脚歇息一下。”


  “士郎。”立香叫了这个名字之后就住了嘴。这个名字本身就是一个指令。


  言峰士郎的身形在立香说完这个名字的瞬间就消失了，刚才他站的位置空气里还剩着一点点几乎看不见的魔力残像在松针的上方晃了晃，然后连这晃的痕迹都被风卷走了。


  村正看着士郎消失的位置，沉默了大概一拍，然后把眉毛往上一挑：“我盲猜他应该是在队伍里干的活最多的吧。”


  立香转过脸来看她。脸上刚才消化佛祖之死时绷着的线条此刻松开了几分，眉梢翘起来一小片。


  “emmm——你猜的真准，是直觉吗？还是女人的第六感？”


  “前辈。”玛修的声音从立香身后传过来，很低，尾音是往下压的，像她每次忍不住想吐槽时都会用的那种语气，“这种丢人的事就不要说了吧。


  立香的肩膀被玛修这句话先是往上提了一下，然后落回去。她把头微微侧过去，嘴唇凑近玛修那边，声音压到只有玛修能听清的程度：“我们是一个整体，而且这种事情我们可以一点点改正。”


  村正想了想，“那确实——第六感是什么？”她把脑袋歪了一下。


  “额，你就当作是直感心眼就好了。”立香点点头说道。这句话她解释得很快，快到自己都觉得有点糊弄，但她想不出更好的了。


  村正沉吟了一拍，“这样，那我明白了。那大概就是第六感。”她把这句话说得很认真，认真到立香在听她说完之后张了张嘴想说点什么又合上了。


  “啊啊。”


  就在这个“啊啊”还没在林间完全消散的时候，士郎的声音从她们前方大概几十步远的位置飘过来。就像是他在开口之前犹豫过自己要不要把这件事说出来，“御主。信息侦察完了。村子可以居住。只是——有个女人。”


  “她穿着很明显不像当地时代的人，而且只有她一个女人。”


  “有威胁吗？”


  “不知道。目前没有表示出来威胁。”


  立香把手递到下巴上，拇指的指腹在下巴尖上来回擦了两下。“先回来，准备交涉。”


  士郎的身形从落日的余晖里重新凝聚成一个人的样子，落在三人身后三步的位置，仿佛从未离开过。村正将双手抄进袖子里，眯起眼：“女人——那里有女人？”


  “怎么了？”


  “不——那里是月读命金地修路时建立起来的村子。月读命金地在召回女人。我到那里的时候，那里是没有任何女人的。”她的眉毛拧了起来。


  立香微微一顿。这一顿不长，但够她把村正的话在心里重新捋一遍，“在你离开那里之后才到的吗？”


  “也许吧。难不成是天照金地的人？”村正把话在牙缝里碾了碾，然后吐出来，“到那里再说吧。”


  立香叹了口气，这次叹气是把刚才还没消化完的疲惫和现在新冒出来的困惑一起挤了出来。


  “走一步看一步了。”


  士郎很快走回了她们身边。他开口之前先用目光从前方的村落方向收回来，收在立香脸上:


  “黑发黑眸，亚洲样貌，长相带着古典的样子。没有给我什么奇怪的感觉。正常人的样子。”


  “士郎，村正说她离开那里的时候那个村子是没有女人的。”立香把这条信息递到士郎面前，递得很快，她在等他做出反应。“那么——”


  士郎把话接过去，“总而言之是——很不简单的女人是吧。”他把“很不简单”这四个字中间的空隙拉得比平时大了一点，像是在评估自己刚才在侦察时看到的那张古典面孔后面可能藏了多少东西。


  立香把嘴唇往上一拎，拎出一个不算太用力的笑:“先往前走吧，没准是友军呢。”'

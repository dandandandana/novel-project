content: '立香把脚在地面上踱了半步，又转回来。她看着村正的脸，嘴巴张开了两回都没能一次性把话说完整。


  “怎么可能？！那可是释迦牟尼啊？”她的音量比正常情况下高了半截，尾音往上拔，拔到一个她自己都不太习惯的调上，“喂喂，你在开玩笑吧？”


  村正瞟了她一眼，她先把头转过来，然后用琥珀色的眼珠子从立香的头顶扫到脚踝，扫完之后停在立香的脸上，停了一瞬：“虽然是很隐秘的事情。”


  她把这句话的第二个字咬得比别的字轻，像是故意把这句话的重量往回收了一点，“但你们身为外来者，实际上不该有这么大的反应吧。”


  “什么叫不该有啊！那可是释迦牟尼啊！”立香的声音又拔高了一度。她整个人从刚才踱步的位置往村正面前走了两步，走到能让村正看清她鼻尖上那层薄汗的距离。


  她把手抬起来，十根手指往村正的两肩上摁了下去——力气比她自己以为的大。村正被她这一摁先是肩膀不自觉绷紧了，抱在怀里的妙法村正随着肩膀的动作往里收了半寸。


  “佛祖。释迦牟尼。那可是至高无上的觉悟者啊！”立香的嘴唇在说完这一串之后还在动，


  声音从喉咙里往外涌，涌出来的时候已经顾不上什么措辞了，“那可是——现在世界所存在的现代佛，是真的佛啊？！不不不——用佛来称呼他是不是不够格了。”


  她把头垂下来，垂下来之后手指还摁在村正的肩膀上。村正能从指尖的力度里感觉到这个橘发少女不是在质问什么，她是在试着把一个比她大得多的东西硬塞进脑子，塞不进去，就卡在那里了。


  村正看着她这样，把刚才在嘴边等了半天的那句话说出来了：“叽里咕噜说什么呢。”


  她的语气没有特别的不耐烦，只是觉得这个女孩在这种问题上浪费的口水比她自己预计的多。


  “死了就是死了，哪里有不会死的？”她顿了顿，这一顿的空隙正好够立香把脑袋重新抬起来，眼睛重新对焦在村正脸上。


  “我其实对于这方面也不是很清楚就是了。我只知道的是——现在的佛将释迦牟尼正面击败了，大概率还是死了。”


  立香站住了。她的脚底下如同有一根看不见的钉子从土里冒出来扎穿了她的鞋底把她整个人钉在原地。


  她把手从村正的肩膀上慢慢滑下来，指尖最后擦过羽织的布料时那层粗糙的触感还沾在皮肤上。


  她退了一步。这一步很轻，靴底踩碎地上松针的声音比之前任何一次都小。“算了。”她把这两个字说得很轻，轻到像是怕吵醒一个不存在的人，“我就当他死了。”


  村正把抱刀的姿势重新调整了一下——手臂从刚才被立香摁的位置往下挪了半寸，太刀重新回到了她最习惯的那个角度：“嗯嗯，好了。”


  她点了点头，像是终于把一张翻来覆去看了好几遍的纸摊平了，“几千年前爆发过一场大战。古时候的和尚和现在的和尚打了一仗，古时候的和尚输了。这才导致了现在的局面。”


  “好乱。”立香把一只手掌按在自己的额头上，手指插进刘海里面，掌心盖住了半张脸。


  “有些过于难以理解了。”


  玛修的声音从立香身后侧传过来：“前辈，大概这就是特异点和正常历史的区别了吧。”


  “所以不要对释迦牟尼的死亡感到诧异了。”村正说完这句之后把刀从怀里换到另一只手上。


  立香把手从额头上拿下来，看了村正一眼：“怎么说呢，村正亲。”她说这句话的时候嘴角往上拎了拎，拎出一个有点汗颜的笑。


  她一边说着一边重新走了几步让自己和另外三个人回到同一个圈里，“没什么——哦对了，你是叫作藤丸立香对吧。”村正把话头截住，然后扫视了众人一眼。视线从立香移到玛修身上，停了一下，然后落在言峰士郎的脸上。


  这个停留比前面两次都长了大概半拍。“玛修。和——”她把士郎的名字在舌尖上转了一圈才吐出来，“言峰士郎？”


  士郎的眉尾往上挑了极窄的一线：“为什么对我这个名字这么惊讶？”


  “不不不。”村正把脑袋摇了两下，摇头的时候眼睛没离开士郎的脸。


  “怎么说呢——算了，大概是巧合吧。”后半句是嘟囔出来的。嘟囔完之后她把视线从士郎身上移开，重新落在自己怀里太刀的刀柄上。


  “别打岔！”立香把手在空气里摆了摆。她重新走到村正面前，这次不再扶肩膀，而是把脸凑近了一点，让自己的娃娃脸和村正的脸保持在同一个高度上。


  立香的眉毛在鼻梁上方压得很低，但嘴角没有往下——这是一个认真了但不生气的人的表情。“你不怕直说佛祖的姓名被他听见吗？”


  村正顿了顿。这一顿比前面所有停顿都长：“他都死了。我不是说了吗。”她看着立香，两人几乎一样的面庞上立香看不出她的表情，“我并没有不尊重死者的想法。但是我说什么，她都是听不见的吧。”'

content: '她顿了顿，对着村正张开嘴又合上，然后把手从盾边松开搁在身侧，轻轻地站直了等着祁荒开腔。


  祁荒从玛修身后绕出来，她把手搁在胯骨上，歪过头看村正时头顶的发饰轻轻晃了一下。


  “啊啦啊啦——变强了吗村正亲？”


  村正把视线转向祁荒。她脸上那份刚才对着玛修的笑散了，取而代之的是一种毫不掩饰的、写在眉毛和嘴角之间的厌恶——她的眉毛不是皱着，是直接往下压了半截，嘴角也往下拉了一丁点，像是闻到了什么不喜欢的味道：“啊，你这个女菩萨怎么在这里？”


  “嗯哼？为什么我不能在这里？”


  “天沼竟然没让你一直呆在外面永远进不来？”村正嫌恶地把脸别了半寸。她转回来对着玛修时表情已经重新调回了刚才那个笑脸，“啊，我现在觉得好多了。”


  她笑着开口问下一句时声音轻了半拍，语气里那份急切被她用笑容盖住了大半但没能完全盖住。


  “所以我们准备什么时候出发呢？”


  玛修补上话时把肩膀往前倾了一小截，手指在盾边轻轻扣了一下：


  “目前打算是过几天等言峰前辈彻底恢复的差不多了再出发。”


  村正点了点头，脖子在点头时肩颈交界处的筋被牵扯了一下。她活动了一下自己的肩膀：“那你的御主呢？”


  “前辈在和伊耶那美大神最后确定消息。”玛修说。


  “啊啊，我现在已经准备好了~”村正把活动完的手垂下来然后做了个甩手的动作，手腕甩了两下像是要把残存的水汽从指尖甩掉，“就这样的话——我知道了。出发的时候记得告诉我就好。”


  玛修点了下头：“前辈的意思大概就是这样。如果村正亲处理得很快的话，那么大概三天后就能出发了。”


  村正再次点头，她摆了摆手：“那我去准备了~相信我不会拖你们后腿的！”


  “我和前辈都很信任村正亲的。”


  村正已经走到了玛修身侧，她没有再看祁荒第二眼，直接迈开步子朝外面走了过去。锻造服的下摆在她步伐中被穿堂风撩起来又落下，她湿着的红发在肩后甩出一条还在往下滴着水珠的湿痕。


  等村正的背影消失在回廊转角之后，祁荒把手重新抱在胸前。她的视线还停留在村正消失的那个方向——回廊外面是一道被竹影覆盖的碎石小径，村正走路的脚步声已经从石板上移到了碎石子上面，声音从远处越来越轻。


  “她不对劲。”


  “祁荒前辈？”玛修扭过头看祁荒。她的眉头微微皱起来，眉心挤出一道浅纹。


  祁荒把抱在胸前的手放下来一根手指点在自己太阳穴上轻轻敲了两下。“祓禊，感觉像是——”她顿了顿，尾音被她自己掐掉了半截，然后换了措辞重新接上去，“解放了她原有的力量。”


  她看到了自己不知道的东西之后被勾起兴趣了之后嘴角带上了笑意：“有意思啊~”


  “原本的力量？”


  祁荒闭上眼然后把头稍微往后仰了一丁点。她的眼皮闭紧时眼睑下青色的血管被午后已经偏斜的光线照得微微透出一点淡青的纹路。再睁开眼时，那份刚才嘴角翘着的好奇已经被收回去了一大半，取而代之的是某种更认真的、让她眼神比之前沉了半分的严肃。


  “应该是如此——这个世界上竟然还有我看不出来的东西？”


  玛修愣了一下。她张开嘴想说什么但只发出了半个“欸”字。


  祁荒没有理会玛修的表情，她把手从太阳穴上放下来然后垂在身侧，身形开始一点一点变淡。她的声音从越来越淡的形影里飘出来，语气已经恢复了平常那种把什么都看得差不多的轻飘飘调子。


  “到时候出发的时候告诉我。”


  洗剑池边只剩下抱着盾的玛修和池水里还在轻轻晃荡的水面。玛修看着祁荒消散的位置看了整整两拍呼吸的时间，然后提起盾转身朝营房方向走去。


  立香从主殿那边走出来时脸已经黑了一半。她走路的步伐比平时快了半，把不满意压在舌底然后每一步都踩得比平常重一点的那种快。士郎走在她身侧，偏过头看了她一眼。他看她时嘴唇动了半下然后没有开口——他已经学会在她脸黑一半的时候给她留着第一句的开场白。


  玛修在营房外的通道口等着，她抱着盾靠在一根廊柱上，看见立香的脸从回廊那头的阴影里走出来时就知道菜已经凉了。


  “前辈——出什么事情了吗？”


  “伊耶那美对我们保留了她的另一批盟友。”立香开口。


  玛修歪了歪头。她的眉头皱了半下然后松开，在做一个忠实的后辈会觉得“这种事很正常吧”但又不确定该不该这么说的时候露出的一种介于不解和谨慎之间的表情：“前辈——这不是很正常吗？”


  她把话断了半拍然后补上后半句，声音比刚才低了一丁点——是在试探立香生气的深度：“还是说？”


  “我们的熟人哦~玛修。”立香哼了一声，“Alterego他们。”


  “什么？！”玛修瞪大了眼睛。她把盾往地上一顿，“为什么会是他们——”'

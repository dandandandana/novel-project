content: '“转生的机会都不给？”筑山殿把头偏了半寸，眼梢从白衣的领口一侧滑过来扫了德川家光一眼，“好歹是摩诃。”


  德川家光把嘴里最后一点残余物咽干净，然后舔了舔上唇。


  他舔完之后才开口道：“待到他们修到了法相，是和你争位还是和我争位？况且——”他把空了的掌心翻过来朝上，五根手指摊开在空中。“摩诃养着不就是用来吃的吗？”


  “他们吃下人吃的更狠。”德川家光的声音依旧不紧不慢。筑山殿把脸从德川家光身上转回去重新看向石像，眼珠在眼眶里从左到右移动了一下。


  黑袍僧侣扫了德川家光一眼。那一眼从袍帽底下穿过来，不冷不热，是某种早就看惯了这些事情之后不再有波澜的平淡。德川家光立马住了嘴——他把舌头从牙床上松开，然后把刚才想接着说的那句关于摩诃肉质的话咬碎吞回了肚子里。


  “虽然弥勒默认了你们的这种行径，”黑袍僧侣开口时声音不男不女，中性得像是用两块磨平的石板夹着声带发出来的，“但是他本质上是不认可的。”


  他转过身面向石像，袍摆在地面上轻轻一旋。石像里的男人闭着眼睛，每一道雕工痕迹都在冷光下被淡化至近乎没有。


  黑袍僧侣朝石像行了个礼，然后开口：“弥勒先生一向不准我们称呼他大德。”


  先生。德川家光低着头，视线盯着石像底座的粗石边缘没敢往上抬，黑袍僧侣笑了笑。那个笑从袍帽底下浮出来时只露出下巴尖往上一撇的极短线条。


  “不必这么拘谨，弥勒一向认为自己也只是人，不然不会这样。”他顿了顿，然后补上后半句时声音低而轻，“世人皆可以直视他。”


  德川家光的嘴唇又动了。他刚才吞下去的那个问题在胃里翻了个身又爬回了他的舌头上，然后他把它问了出来。


  “尊者，我一直不知——为何？”他抬起头，视线在石像一个肩膀的边缘试探了一瞬然后重新落下，“除了我们之外，世人皆不知道大德的姓名，就连我们都不能开口直呼他，明明是德高望重的大人——却从来不开宗立庙，歌颂他的名字，这是为什么？”


  黑袍僧侣没有立刻回答。他把视线从石像上移开，转向大殿外那片冷光覆盖的天空。大殿的厚墙隔着城池之外的一切动静，但他的眼睛像是穿过了一切阻碍。


  “因为不需要歌颂他的名字啊。自会有人传颂他的事迹。”


  随后他把目光收回来落在自己摊开的掌心上，掌心上的纹路在冷光中泛着极浅的灰白。


  “啊啊，看样子有人来了。”


  德川家光猛地把头抬起来。“尊者——伊耶那岐金地那边的支援快到了。来了二十名法相，百位摩诃，法师若干。”


  “这就是伊耶那岐金地啊。”僧侣把摊开的掌心翻过去覆在膝上，声音从嗓子底滚出来时比先前低了半度。“来支援的法相都比其他金地加一起的都多——不着急，让伊耶那岐金地的法相先去接敌。”


  “尊者。”德川家光的声音压得比刚才更紧。“须佐金地的世尊也来了。”


  “随意。”


  黑袍僧侣再次看向天空。他的视线透过厚厚的墙壁，看向城外半空中那个持矛而立的身影。


  伊耶那美立在空中，脚下是城池的轮廓线被冷光染成一片灰蓝。她把天沼矛单手握着垂在身侧，矛柄上嵌着的赤玉在风中轻轻碰撞发出极清脆的叮当声。她看着城池深处那座被层层寺庙包裹着的主寺，阴阳眼里一青一金的光芒同时闪了一下。


  “月读命！”


  她的牙齿互相咬紧。臼齿在上颚和下颚之间碾出一声极细的硬响，然后她把天沼矛从身侧举起来——双手握上矛柄，指尖陷进赤玉之间的凹槽里。然后她开始缓缓的搅动手中的矛。


  世界颤抖了一下——整个天幕开始跟着天沼矛的转动方向缓慢地旋转起来，云层被搅成漩涡，天空的冷光在漩涡中被撕成千万条拉长的光带。城池中的僧人们抬头望天时，他们看见的不是天空——是整片天像被一只看不见的手搅动的水面，从天顶往下荡漾着一圈一圈肉眼可见的波纹，波纹中心向下塌陷时云层发出极重的低沉嗡鸣。


  伊耶那美将矛往下一挥。整片天空轰然下砸——云层、冷光、被搅碎的天幕碎片如同瀑布一样朝着城池倾泻而去，速度极快但诡异的是听不见任何破风声，城池里骤然冒起清冷如同月光的光束，那光束从每一座寺庙的塔尖喷射而出在半空中交织成一道密密麻麻的光网，与砸下来的天幕狠狠撞在一起。天地之间炸开一声极闷的雷响，整座城池的屋瓦在这一瞬齐齐跳了一下。天幕被撕开一个巨大裂口，裂口的边缘还在流淌着被搅散之后尚未凝回原位的云质，开口深处则是黑沉沉的空洞：没有星光，没有云底，就是一团深不见底的黑，像把整个世界的背景布被人从这一角撕了个干净。


  然后那道裂口在转瞬之间又重新愈合了，天空恢复了冷光覆盖的平整模样，刚才的裂隙边缘没留下半点痕迹。'

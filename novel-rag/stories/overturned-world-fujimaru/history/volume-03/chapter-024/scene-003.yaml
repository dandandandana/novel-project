content: '“好久不见了。”


  伊耶那美扭过头。素衣持剑的男人站在半空中，衣摆在无风中微微鼓着，银色的太刀挂在他腰间，刀镡上刻着海浪翻涌的纹路。他的长发从两侧绾到前胸，分成数条细辫垂下来贴着素衣的前襟，浅金色的发梢在冷光下泛着金属色泽。


  他看向伊耶那美，嘴唇微微分开。他的声音带有磁性——是低沉的中年男性嗓子里才能挤出来的那种沉稳。“卡桑。”


  伊耶那美把矛握得更紧了。矛身上的赤玉在她收力挤压时全都微微颤动起来，叮当声骤然停住——不是赤玉不响了，是她握得够紧，紧到连声音都被掐死在了矛柄上。


  “我的孩子已经死了。你不配。”她的声音依旧平稳得没有一丝多余的波纹，但那份平稳底下是冻过了头的湖面。那份湖面动的不裂开，但是上面站人的话脚底会被冻得疼。长矛已经朝着男人轰了过去，矛尖划过空气时沿途的空间都凝实了半瞬，留下一道暗金色长痕。


  男人从腰间拔出太刀，迎着长矛劈了上去。刀身在出鞘时带出一道弧光，与矛尖撞在一起时炸出极短极钝的一声金属闷磕。他的声音在交击后的余震中穿过来，先前那份多多少少还留着的残余敬意已经被完全收回，只剩下谨慎和审视两个字贴在他的每个音节上。


  “如果不是你是伊耶那美，本座压根不会以此身现界。”


  “你用着我孩子的脸——”她牙齿互相咬在一起，臼齿碾过来的力道把后半句话的尾音震碎了，“你怎么敢用须佐之男命的脸的！”


  须佐之男命再度挥剑。剑身的轨迹在半空中划出一道银弧，被她两矛一左一右齐齐挡住。他的脸在太刀和矛身摩擦的火花中亮了一下然后重新暗下去，嘴角往上提了小半截。这是一个人在某些东西上面从来不觉得自己有错时才会露出的表情。


  “能被本座垂青，是他的幸运。”


  城池的城墙上，身穿金袍的僧人们开始缓缓升空。他们的数量不是一个一个能数清的——升空的速度各自不同但有序，金色袍服在冷光映照下如同一排金色蜡烛被同时点燃。


  “不是月读命金地的法相，但是位格和法相一致。”通讯器里传出了奥尔加玛丽的声音。她的语气平稳但每个字之间的间隔比平时窄了半拍。“大概有复数位法相，这里指的是数字的位数——万分小心。”


  “十位往上啊。”


  森林边缘的树丛中，立香把一只手按在膝盖上微微蹲着，另一只手拨开前方挡视线的一小片枝叶。她盯着升空的金袍僧人数了叔然后松开了手里的叶片。叶片弹回去发出一声极轻的沙沙摩擦声。她转过身，目光越过树丛落在后方穿着僧袍的女人身上。


  “那么按计划进行。”她顿了顿，橘色眸子里那份从伊耶那美那里接过来的不爽还没有完全消化，但是她果断的说：“祁荒，拜托你和村正先进去了。”


  祁荒把僧袍的兜帽往上拉了拉。兜帽遮住她头顶的发饰之后只剩一截下巴和翘起来的嘴角露在外面。她点了点头。


  一旁蹲在草丛里的村正沉默着站了起来。红发被草叶子刮得有些乱，她右手在腰侧锻造服的暗纹上按了一下，暗红色火纹在她指尖触碰到的地方微微亮了一瞬，像锻炉里的炭被重新吹醒过来。然后她抬眼看了祁荒一眼。那个眼神不是之前呛声时的厌恶——是她接了任务之后面对同伴时的确认。祁荒对她歪了下头。然后她一挥衣袍，两道身影从草丛中无声掠起，贴着地面朝城池的方向飞去。


  立香目送两道身影融入城池边缘被冷光拉长的阴影之后，把手放下来，转过身。


  “玛修。”


  粉色头发的骑士从树后走出来。


  “正面交给你了。”立香的声音压得比刚才低了，她看着玛修的眼睛，橘色眸子里那份对接下来要发生的事的预估没有藏起来——她不做那种骗人的乐观表情。


  玛修把盾往地上一顿，金属底撑扎进松软泥土时发出一声极沉极短的闷磕。“明白。”她开口时声音平平稳稳的，没有多余的修饰词也没有多余的情绪起伏，就是一件早就准备好执行的事情终于被安排到了该执行的时间点上。


  “士郎会在后面支援。”立香把手从膝盖上抬起来指了指后方的密林深处，手指在半空中比了个只够两个人看懂的短促手势。然后她把手收回来，视线扫过玛修肩上盔甲边缘被冷光涂亮的那道线条，最后把呼吸吸到胸腔最深处再一截一截吐出来。


  “准备开战了。”'

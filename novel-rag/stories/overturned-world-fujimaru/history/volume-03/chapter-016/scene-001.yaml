content: '“伊耶那美姐姐？你要立香去过那个？”


  千子村正这句话是从椅子上弹起来的。她的膝盖撞在桌沿上把碗筷震得一响，琥珀色的瞳孔死死钉在伊耶那美脸上，“你在说什么——那个东西。你明明知道那是什么！”


  伊耶那美没有回答她。她甚至连头都没有完全转过来，只是把视线从立香的脸上收到了自己袖口，然后随手往外一甩。


  一块黑布从她袖子里飞出去，黑布缠上时发出极轻的咝咝声，收紧，把少女嘴唇的轮廓绷在薄薄的暗膜底下变成皱成一团的闷响。


  “呜——呜呜呜！”村正瞪大了眼睛。


  她的手在桌沿上抠住木头的纹路，指肚压得发白然后被天沼一手一只地掰开了。


  “天沼，带她下去，把这段时间拉下的功课补上。”伊耶那美淡淡开口，她的眼底已经没有刚才对着村正吼叫时的那种温热余烬了。


  天沼站起身。他的斗篷下摆在敷石地砖上擦出极轻的窸窣，走到村正身旁时他弯下腰把村正的手臂从桌沿上轻轻抬起来。


  “小姐——来吧。”他说这两个字时声调压得很低，低到只有村正能听见那份藏在敬语底下的心疼。


  村正明显不情不愿，她的脚在敷石上蹭了两道印，脖子在她被天沼拉着往门口走时扭了回来，她看向立香。她的琥珀色眼睛在黑布上方极快地闪烁，然后她对着立香拼命摇头。


  立香没有追上去，她把村正被带走后的那份沉默在胸腔里压了两拍，然后闭上眼睛。


  她的脑子里不安静——三条路，三个选项，像三张牌被反扣在桌上。


  她抬起手指在桌沿上轻轻敲了一下，第一张牌翻开了——现在离开这里寻找新的援军。但村正的结盟、圣杯的情报，砍掉这条线就什么都没了。


  第二张牌——玛修和士郎都能对付复数法相。她睁开眼睛看了一眼站在旁边的玛修和靠在门框上的士郎。但情报太少了，月读命金地里的世尊是谁、德川家光的实力到底有多大差距——这些全是空白。


  第三张牌——试炼。未知的试炼，连村正都不敢说出口的试炼，她把第三张牌在脑子里翻过来，盯着上面那片空白。


  “我答应您的要求。”她开口了的时候橘色眸子重新对焦在伊耶那美脸上。


  伊耶那美歪了歪头，她像是早就得知了立香会说出这几个字。她站起身，礼服下摆擦过椅子边缘时发出轻轻的窸窣然后垂落。


  “跟我来。”她说。


  玛修在旁边把眉头往中间挤了半寸，当立香迈出第一步时她快步跟上走到了立香前侧。


  士郎在最后面动身，他先没有急着走，而是把目光追着天沼的背影直到暖帘落下。等到天沼安顿完村正重新掀开暖帘走回来时，士郎开口了：试炼是什么？”


  天沼没有回答他，他把斗篷下摆从士郎面前擦了过去，脚步还是那个平稳的速度，然后整个人重新站回伊耶那美身后的那片暗处。


  士郎咬了咬牙，他刚迈出一步——


  “所谓梦~”一个女声从他身后响起。是祁荒，她从廊道那一头踱步过来：“言峰士郎，你觉得现在你的人生是梦，还是现实呢？”


  她走到他身侧时把脸往他的方向微微偏过来，“亦或者说——当你一梦醒来，看见了自己未来的人生，会怎么做呢？当未来充满了希望和绝望交织的真实，你是否还会选择你现在的路呢——”


  “你说什么？”士郎把脸转向她，他的眼睛在她脸上扫了一圈——她失踪了一段时间，现在忽然冒出来说这些，“你是什么意思？你到哪里去了？”


  “问个小问题罢了。快走吧，你的御主在等你哦。”祁荒摆摆手，朝着前方走去


  士郎快步跟上天沼走向后院，祁荒没有马上跟上去，她慢慢踱步，经过饭桌时目光落在桌上那只碗上——碗沿上粘着几颗米粒，是村正被带走前筷子掉在上面翻出来的。


  她伸手在碗沿上轻轻抹了一下，米粒滚在她指尖然后被她就着拇指捻成一小团白。


  “黄泉津大神——倒是了解了不少这方面相关的事啊。”


  藤丸立香跟着伊耶那美往后院走。她的眼睛在看路，但脑子里已经在翻资料了。


  黄泉比良坂——那是伊耶那美管辖的死亡入口。千引石——是堵塞黄泉国不让死者涌入人间的原初石堆。


  她把这些地名在脑子里过了几遍，做好了面对冥界的准备。然后她抬起手腕测试了一下通讯手环。


  手环的屏幕在她指尖碰上去时亮了起来，然后一条红色的小字从屏幕左边滚到右边——无信号。


  她咽了咽口水，把手指从手环上收回掌心蜷成半个拳头，继续跟着伊耶那美走向城主府深处越来越暗的走道。


  走廊到了尽头。然后她看到了客栈。


  被人从某个不属于这里的空间硬拔出来然后插进敷石地板砖上的。它的木质结构不是木材——是某种半透明的暗影凝聚成的形，框架接合处能看见细密的纹理，但不是木头的年轮，是因果在接入这个空间时被挤压出来的皱褶。'

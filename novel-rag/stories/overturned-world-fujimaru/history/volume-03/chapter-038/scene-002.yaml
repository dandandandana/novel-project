content: '士郎在这个时候重新从巷尾走了出来。


  “怪。”他把头朝立香这边偏了偏，琥珀色的眼睛从巷尾的灰暗里拉回来，“这里没有人的迹象。”


  “这样吗？”立香的嘴嘴唇稍微抿了抿，嘴角收了一点点。她把视线从建筑立面的远处收紧了转而投向自己脚边那块灰砖的拼缝。


  “我们该怎么样过去呢？”她把自己的后脑勺从风衣领子里朝上轻轻抬了抬，朝着平台边缘走过去。靴底在砖面上踩出的声音比之前更短更重，三下就走到了平台边上。她朝下一看——


  下面根本不是地。不是她用来做过心理准备的那种哪怕是望不到底也能理解的地面。整个平台是踩在几根石柱顶上架出来的——石柱朝下一直扎进看不见尽头的灰色深渊，柱体上每隔一段就有一圈环形的凹槽，从凹槽里朝外渗着一层极弱的暗光。整个深渊底下也铺着更多的石柱和一个个巨型地基，望不到边，看不见底。


  “这是什么……”立香的声音从她肺里被推出来之后几乎没经过声带的绷紧，是从牙缝里漏出去的低声，“怎么做到的？”


  “绝对不能下去的高度，前辈。”玛修在她身后站定，她把自己的盾牌最底端在地砖上沉了一截，铁脚砸下去的声响在深渊里被弹了两下才散干净。她看着立香趴在崖边回头过来，又说：“就算是言峰前辈下去也很难上来。”


  “我的原理血戒能够让我直接飞。”士郎从口袋里抽出右手挥了一下，好像那是件根本不需要算消耗的事，“那么现在怎么办？我带着你们一个个飞过去？”


  “不用啊～”村正突然从左边插进来一刀把士郎的方案劈了回去。她说这个时候已经把刀重新搁回了肩上，同时左手摊开——一团黑色火焰从她掌心里自己冒了起来，先是鼓成一个蘑菇状的膨胀球，然后菌冠朝内一收自己绷成了一条粗壮的蛇身。“我的火可以载着我飞。你们看好了。”


  村正踩着那团黑色火焰往空中飘了上去。不是燃烧的火焰把她身子裹住——黑炎是在她脚底下托着她的，像是一团有执念的黑光在追着她脚底的形状。


  她在空中向前飞，身姿斜了一点点，灰色战裙的下摆被黑火的灼热吹成了一个小弧。黑色火龙从她脚底分了出来，不再托举而是绕着她的身周甩动。


  她飞到了对面那片道路的正上空，正准备把刀从肩上拿下来对着路沿轻巧地落下去——


  一道光芒在林立的楼宇之间出现了，它在半空中停顿了一瞬，然后朝村正的方向平推出了一条极细的光束。光束飞过来时空中留下了整整一排发白的光粒。


  村正没有躲。火龙从她腰侧窜出去张开了大口，一口把光束吞掉了。白色光束被裹进黑色火焰里之后光柱的头在半空中骤暗了一瞬间，村正的手背上也跟着一小股残余的热量拧上来，在她皮肤表面蒸了一层细微的白雾，她自己没看手——那点火烫对她的肉体和高温炉膛比起来大概还烫不过一次刀淬完的清水蒸气。


  “欸？”她立在半空中，歪过头朝光束来的方向看了一眼。


  空中的机械声嗡嗡地铺开了。不是单一声源——是好几个不同的震动频率混在一起，从四面八方往中间挤。然后更多的光束射过来了。不是一道，是在几下之内从四面大楼的腰部、屋顶和空中悬着的圆球那射出的光矢从三个方向同时劈头压了过来。


  “啊啊啊？这是什么？”村正横刀挥出。妙法村正在她手心里转了大半个圆——她横刀平拍在最前头冲过来的那道光束头上，刀身斜侧着把光拍散，光屑溅到她肩上被她随手一吹吹掉了。


  第二道光矢和第三道连在一起冲过来，火龙从她身侧甩尾扫过去将两道光一齐拦腰吃掉。


  “村正……”立香在平台边缘昂着头，声音弱弱地从底下朝上喊去。“村正亲——他们说你违章飞行，连续变道，需要停下。”


  “欸？哦哦。”村正在空中刹停了自己，把火龙收回来让它盘在自己膝盖上蹭了一下。


  她落在了一座大楼楼顶的边缘，刹车时皮靴在楼缘的金属台面上擦了一道浅痕。


  她落地刚站稳一瞬，一个圆球从她身后贴过来了。


  那个球足有篮球大小，外壳是无数压成菱形的小金属片拼接成的，在飞行时金属片会微微错动调整风阻。


  它绕着村正转了半圈，然后停在村正鼻子比额前还近的位置，从体侧射出一道宽幅蓝光。


  蓝光从上到下扫了她一遍，扫到她的刀时停了一小下，又接着往下扫到她脚下。然后圆球的菱形金属片整个朝上翻了过去，刚才还是蓝光摄像头的位置突然变成了鲜红色，一片菱形片转成了整张脸大小的红叉图案。球体内置的喇叭响了一阵密集的劈里啪啦，村正这次因为吃了士郎的通晓语言才能全听懂。


  “无信息，判断为外来者。”


  那个拼接音的语速极慢，断词处在日本人永远不拆分的地方咬了一口。'

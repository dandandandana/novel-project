content: '阿尔托莉雅在这之前压了十八位法相结成的大阵很久。那面大阵从外部极难硬破——这大阵很明显就是为了困杀而设计的降妖伏魔术式，每一道符文都在法相们齐声诵经时自行修补裂缝。


  少女试过从外面强拆，阵壁在破到只剩薄薄一层的时候总是被新一重经文填满。


  法相们对付阿尔托莉雅的进攻端同样乏力——他们的光炮和经文锁链打不穿她的甲，她的敏捷在阵外游走时让他们连扫中都做不到。


  也就是说，只有把阿尔托莉雅拖进阵内，凭着十八位法相的近身压制，才有可能短时间分出胜负。


  就算把自己的战马派去支援了玛修，面对十八位法相结成的大阵，少女仍然单手拿着黑色的长剑，一剑抽到大阵上。


  整面降妖伏魔大阵从被抽中的那一点朝四面八方传导震动，阵壁上每一道金色经文同时被震得齐跳了一下。


  十八位法相手持不同的武器，有的拳套有的禅杖有的戒刀，全都咬着牙死死盯住阵外那个歪着头的金发少女。


  “妖孽！还敢猖狂！”


  为首的金袍和尚从阵壁里探出半边身子吼了出来。他们已经被阿尔托莉雅压了太久，每一波进攻都像往铁板上敲锤——自己的手震得发麻，对面连眉头都没皱一下。


  几人再度尝试催动阵心把大阵的范围往前推，金色的光壁朝阿尔托莉雅的方向缓慢地扩张过去。


  阿尔托莉雅把手里的黑剑换到另一手，从虚空中摸出那柄金色的长枪，单手举平枪身，枪尖正对着阵壁推进的方向。


  枪尖上亮了起来，光炮一口气撞进阵壁里——大阵朝前推进的那一截在光炮炸开之后萎靡地退了回去，阵壁的光泽暗了一瞬。


  阿尔托莉雅歪了歪头，金发从额侧滑过眼角。她说：“就这点本事？”


  阿尔托莉雅再度一步迈入。踩入的步子不重，但那一脚落下时，整面大阵从刚才被剑抽过的同一处裂开了一道从顶贯通到底的黑色缝隙，然后朝四边崩溃。


  十八位法相还来不及重新拼合经文，阵壁就已经是一片一片剥落着散掉了。


  “这才对啊。刚才跟没脑子一样。”阿尔托莉雅把手里的黑剑插进腰后，再度召唤出自己的梦魇之马，翻身跨上马背，单手提着金色长枪朝前方那群和尚架马冲去。


  马蹄踏在还没散干净的金色经文碎片上，每一蹄都带起一小蓬金粉。


  金色的枪尖从一个持着金拳套的和尚左胸捅入，从后背捅出。


  他没有看清枪尖是怎么从他两拳之间的那道间隙滑进来的——明明自己在出拳，明明同僚的禅杖就在旁边补位。


  他咳出一口血，血顺着金色的枪杆往下淌到一半就被阿尔托莉雅抽枪时的力道甩飞。和尚朝下面倒下去，拳套砸在地面上弹了一下。


  阿尔托莉雅低头看着地上那具正在散作金色光点的身躯，又把眼抬起来扫过剩余的十七位法相。


  结阵还没有要停下来的样子。


  阿尔托莉雅笑了笑。


  “硬碰硬啊。来吧。”'

content: '玛修两剑斩飞眼前的两个法相，剑刃上的魔力光先于剑锋触到金漆，法相才看见自己的权杖被弹开，整个人倒仰着朝街面深处的断壁撞去。


  持权杖的法相在半空中稳住身形，杖底猛地点向地面，石板间没来得及重新弥合的裂纹里顿时亮起一个又一个金色的圆环。


  圆环中不断飞出金色的圆圈，一圈套一圈从地面脱壳蹦出，在半空中迅速叠成一面密集的环形攻势朝着玛修推过去。


  玛修把盾牌朝前一轰，盾面硬生生撞上第一圈金环，碎裂的光屑还没散尽，她人已经穿过炸开的金环朝前方的法相扑去。两旁又有金环从侧面切过来，她顺手两剑削出，剑脊撞上环缘的声响短促得几乎没有尾音，碎金便往两边翻飞而去。


  正当她逼近持杖法相的瞬间，从天而降了一个魁梧的轮廓——金衣罗汉双锤并握，一锤砸到玛修的盾牌上。


  整面盾牌在锤面落点处炸开一道肉眼可见的金色冲击环，但玛修左臂撑着盾丝毫没往后退。盾柄被冲击力攥出了一圈圈魔力残光，把罗汉的劲道一寸寸吃进了盾心。


  “力度很大——”玛修的眼神从盾沿上露出半截，紫色眸子盯在罗汉那张不算狰狞的胖脸上，把后半句也稳稳地压在了同一口气里：“看样子是专门的近战的法相。目测完全比德川家光的力度大了不少。”


  她踏出一步。板甲靴底碾在一块碎砖上，右手黑色长剑猛然朝罗汉胸侧撩去。金锤在剑锋抵达前横拍过来，两柄武装轰在一起，震声从交击面朝两侧排开。


  罗汉闷哼一声，另一锤正要挥出，玛修把左手持着的盾牌猛然掷了出去，盾身在空气中贴着地面盘旋转了半圈，朝着罗汉身后的法相狠狠飞去。


  持杖法相的权杖朝地面一敲，杖底触及石板的那一点炸开一圈金色涟漪，眼看就要把盾牌吞进去：


  盾牌却在击中那层涟漪之前被一股精巧的反弹力道折了回去，朝着玛修的方向原路飞旋。


  玛修没看盾牌，她双手持着黑色长剑，身躯骤然下压，剑刃从高角度一口气拖到底，罗汉仓促交叉双锤去挡，侧过头时听见身后传来风声。


  他微微张嘴，眼角扫向后面：就在扫眼那一瞬，他的身子本能侧转，金锤失去了牢牢架住玛修力量的支点。


  玛修的身子朝前一送。黑色剑刃顺着黄金甲片之间的微缝捅进去，剑尖从罗汉后背探出半寸黑光。


  然后整柄长剑往外一拖，罗汉的前胸从锁骨下方一路开到腰侧，金漆的甲片裂口上翻出一层淡金色的薄薄雾气。


  玛修没给他喘息的时间，她将长剑朝前一送，剑格恰好卡入飞旋回来的盾牌中心凹槽，咔嚓一声，盾与剑咬合锁死，变作一柄比她整个人还高出一截的黑色巨斧。


  玛修冷哼一声，用板甲战靴的靴跟朝斧刃侧边一踢，斧刃在鞋铁蹭过刃缘的脆响中迅速旋转起来，转得越来越快，把空气切出一阵撕裂布匹般的嗡鸣。


  “开！”


  玛修骤然挥起巨斧，旋转的斧刃带动着她娇小的身子轰向罗汉。罗汉举起金锤硬架，巨斧与金锤交接的那一瞬，金铁交撞的声响从中心朝外一层层叠加，夹杂着高速器刃切割金属表面的锐鸣。火花从斧缝和锤面之间迸射出来，映得玛修整张脸半边明半边暗。


  玛修一步迈出，手摸向斧柄的另一头，横向持着巨大的战斧朝罗汉撞去。


  她的步子不停，呼吸也没有多喘一口，那双紫色眸子里是对当前敌手数据已经读完的了然。


  罗汉双锤同时朝她轰来、一旁拄着权杖的法相也挥动双手，地面和空中残存的所有金子碎片被他一并唤醒，盘旋飘上半空，这些金字以肉眼追不上的速度拼接成一整条长长的经文锁链，朝着玛修的身体缠绕上去。


  玛修与此同时一脚踹中罗汉的小腹，左手直接把盾牌从巨斧形态拆下来。整个身体放出巨量的魔力，魔力光束从她的肩甲、护膝和胸铠缝里同时朝外炸开，将那条快要缠上她手臂的经文化作一蓬四散的金沙。


  被击碎的梵文朝后飞去，每一枚的残余字形上都亮起闪闪的金色光亮，悬在半空中蓄势待发。


  玛修再度把长剑插进盾牌，这次不是合成巨斧——盾身迅速朝两侧伸展，化作一面比她还宽的黑色重盾。


  她将此盾重重插进地面，盾底的尖钉一口气楔进石层，挡住了空中金字凝聚起来的那发光炮。


  被弥勒修好的地面再度被炸了个大坑。砖片和泥土从坑边翻翘着崩上半空再砸回地面，玛修从盾后弹出，长剑抽出，身躯微微低下。她的表情极度安静，连眉毛都没动一下，只有那双紫色眼珠在眼眶里缓缓扫过坑边扬起的灰尘。


  罗汉再度高高跃起，整个人连同双锤的重量一起砸下来。玛修却没有把盾提起来防，也没有把剑横在前头——她用左手的盾牌朝着下落的罗汉狠狠斩了过去。


  盾沿在空气里拉出一道不长的风切声，罗汉的瞳孔在盾面逼近的瞬间缩了一下。


  “这丫头——把盾当刀用！”'

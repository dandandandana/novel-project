content: '然后她睁大了眼睛，声音从刀背上被震响的嗡鸣中挤出来： “人理，以及地底下藏了东西。”


  “人理吗？”


  立香立马在全息屏幕上写写画画。坐标重新排列、对照、替换。她画出来的字母替换表歪歪扭扭地排了五行，数字和字母之间被她拉了好几根不同颜色的连线。


  “不对——古日语是不对的，字母替换表在古日语上映射不出有意义的词。”


  村正忽然意识到了什么，她反手朝月读命的新位置射去一道黑炎的屏障，趁月读命被屏障逼退到下一根柱子的间隙转身凑到立香面前。


  她在立香的屏幕侧方拿太刀的刀尖虚划了几下。


  “这是他刀上的铭文。我之前在他的太刀上见过。”


  立香的视线落在村正画出的那几个字符上，瞳孔缩了一下。


  “这不是英文字母吗？”


  “哈？我怎么知道？我又不研究哪个时代的文字。”村正翻了个白眼，手一甩，太刀重新架到身前。


  一道术式随后朝她们的脚底炸来。月读命的攻击频率在这几秒内骤然提高了——黑炎挡在术式前面的时候，火焰边缘立刻被啃去了厚厚一层。村正嘴角朝下压，脚跟踩实了黑炎的踏面：


  “我先下去了，你们速度。”


  劈里啪啦的声音响了起来。村正的黑炎在半空中不断炸开又不断重新凝聚，黑色的碎光裹挟着被烧化的术式银屑一起从空中往下掉。


  立香立马把“人理”翻译成英文。


  她左手的三根手指在屏幕右侧划出一个小窗口——HUMAN ORDER，排序、编号、输入。


  右手同时重新按照月读命闪烁的坐标替换表逐行逐列地把密文一个个地填进字母表中。


  “士郎！帮忙！你不是有极致的追求者吗？难不成你不会密码？”


  “没学自然不会。”士郎在说话的同时砍飞了一道从斜上方射来的光炮，左手反手又甩出一把黑键。


  “过段时间再收拾你。”立香咬着牙说出这几个字时嗓子底部的气音已经按不下去。她把字母替换表左右翻转了两次，重新比对：


  “人理不对——明文可能不是我猜的那个。我给你念，你给我算。”


  她把剩下的字符一个个对应上，声带发出的每个字母都短而硬。士郎接了她的每一个字母，再用他自己对英语词汇的直觉帮她拼出可能的单词。


  几轮下来，立香的嘴唇停在了一个句子上。


  “TRUTH IS IN DEPTH？”


  “现在是几号？”


  “3，4”


  立香的腮帮子动了一下——她在全息屏幕前快速心算了一遍。


  “替换了已经。士郎，你应该看懂了吧。二维凯撒密码进行替换，已经是第五轮了，大概一轮要多久？”


  “两秒左右。”


  “在三秒后——落在坐标1，3。他会在那里现形。这是第五轮的跳点，他必须到那里。”


  士郎听到这句话后，右手握着黑键的手松开了。黑色的剑刃还未坠地就被他体内涌出的魔力从空气中直接抽走。


  他的掌心里重新亮起了另一道光——这次的线不是黑的，是金色和铁红色交织在一起的投影线。


  一把黑色的长弓从他掌中一分一分地拉了出来，弓柄上那些残留的纹路在投影光中快速跳动，然后定死在完整的弓臂上。


  “此身为剑所天成。”


  士郎左手握弓柄，右手拉弦——没有箭，但弓弦上开始涌出一柄箭矢。最初是透明无色的骨架线，然后层层交叠的剑从骨架内部往外一层层包裹上去。


  弓弦被拉到满弓的时候整个主殿的风突然静了一瞬。


  “Unlimited Lost Works！”


  箭矢离弦的声音不是刺耳的破风声，是一道被拖长之后压碎了多层的低鸣。箭尖的轨迹划破了柱子之间月光织成的那层薄薄的光膜。


  坐标1，3，刚刚好。


  月读命的身影刚在那根柱子上凝出来，袍角还在闪烁的残余光点中晃荡，他的眼珠刚移到箭来的方向——然后箭矢射入了他的体内。


  没有炸裂声。剑意在他体内展开——他的双臂、肩膀、腰侧、腿根，同时从内部被无数柄剑从内向外地刺穿。长剑在他的皮下刺出，在穿透衣袍的瞬间把银色的月光碎片往外溅成一片星屑。


  月读命被钉在了原地。


  “呃——”他身上长出的剑把他整个人撑成了一个被刃尖挂住的十字。闪烁停下了。


  柱子上的银经暗了一瞬又迅速全灭，只在月读命的脚下残余了一小滩还没散干净的光。“怎么做到的？被看出来了.......当年我为了提醒自己的密码还是太浅显了吗？”


  千子村正出现在了他的面前，她从黑炎铺成的踏面上一脚踩实，手中的太刀在落地时刀刃朝下，刀尖点在了月读命脚边的石板上，砸出一声极轻的铁石碰撞声。


  她看着眼前这个被无限剑制的长剑钉在原地的世尊，脸上的表情不多——嘴唇平着，但眉头皱到了一起。


  “你还有什么想说的。”不是疑问句。'

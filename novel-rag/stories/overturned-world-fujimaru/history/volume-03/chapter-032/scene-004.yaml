content: '通讯器那头传来一声压得很短的气息喷响。奥尔加玛丽每次这样——气到极限的语气反而会笑出来：


  “Ruler，如果立香出事了，我拿你试问。”


  “收到。”


  二人就这样朝着月读命金地不断传来震动的地方冲去。城区每道被破坏后又正在缓慢修复的石板路从他们脚下疯狂往后退，断壁和炸飞的城砖被夜风卷起来砸在他们掠过的轨道旁边。


  即将抵达月读命主殿外围的时候，士郎把她往一旁的残墙阴影里放去。他松手时，左臂从她腰侧抽出去的力道像从硬邦邦的木桩上卸下绑了太久的绳子。


  “立香，我没有人类的礼赞，气息遮掩会失效。”他把声音压得很低，从怀里抽出最后两把黑键插进腰后的剑袋里，“我觉得我们的通讯也需要断掉。接下来需要你自己找机会了。”


  “明白。”


  士郎点了点头。他转过身，身形随着一次腾挪直接消失在残墙的阴影后面，立香的兜帽被自己呼出的热气闷了一阵。


  她把兜帽朝后掀开，深吸了一口气。空气里是黑炎火云灼过的焦味、月光禊祓压下来的冷气和远处主殿方向两位高维存在对撞后排出来的术式残香。


  她在士郎离开一段时间后，提着安魂跑了起来。夜风顺着她跑动的方向从兜帽边缘灌进来，把她的橘发吹成一条贴紧脸颊的直线。


  安魂枪柄在她掌心里被汗水浸得又滑又烫，她收紧了一下手指，把枪柄握实。


  她的目光穿过主殿方向不断从穹顶上倾泻下来的金色与月光交相溅出的光雨。


  言峰士郎赶到时，村正已经和黑衣的僧人开始交手了。主殿前庭的青石板路面在刚才的震动中朝外翻开了一大片，断口的石茬在月光的照射下白得晃眼。


  那名黑衣僧人站在翻倒的石板中央，手中握着银色权杖，衣袍的边缘在夜风中动也不动，仿佛风本身在经过他身体周围时被什么东西拨开了。


  村正站在他对面十步开外，身上的黑炎正从肩头朝下流淌，火焰落在石板上的时候没有烧灼的声响，而是把石板压出了裂纹。


  月读命的手腕一转。银色权杖随着她的动作朝天空扬起半圈，权杖顶端那颗银色的珠子在她转动手腕的瞬间吞掉了周围所有的光——不只是月光，连村正身上黑炎的反光都被从空气里抽走了。


  然后月光从四面八方涌了过来。不是从月亮的方位照下来的，是从空中每一个角落同时朝她涌去，像是整个主殿穹顶之下提前蓄满的月光在她举杖的那一刻被打开了同一个出水口。


  月光化作利刃朝着村正斩去。那些利刃在成型的过程中没有破风声——月光本身就是无声的东西，只有利刃经过的地方空气被骤然排开，地面上的碎石在利刃飞过的轨迹下朝两侧滚开。


  村正冷哼一声，鼻翼两侧被黑炎的余光勾出了两道浅浅的阴迹。


  她的身上燃起来青色的火焰，和黑炎从身体的不同位置同时冒出来的。黑炎像凝固的固体一样贴着她的肩背朝外蔓延，青色的火焰则从腰侧和腿侧淌下来，如同刚化开的流水，每一缕流动的方向都不一致。


  青色的火焰朝着月光涌去，接触的瞬间没有撞击的爆鸣——月光利刃被青炎从刃尖开始包裹住，青炎顺着月光的轮廓一层层裹上去，把利刃的白色光泽从外层朝里吞。然后在被裹住的月光上，流动的青炎表面开始出现水纹一样的光斑。


  流动着的青炎裹住了月光利刃，村正又哼了一声。她手中的火焰开始从青色和黑色之间切换——先是掌心里冒出一股青色的火苗，然后火苗从中线开始变黑，青和黑在她五指间交织成一柄打刀的形状。她歪了歪头，打刀的刀刃在火光定型的一瞬间从橙色转成了暗红，刀身上能看到火焰还在里面流动。


  士郎的眼神凝在那柄打刀上。刀身上没有锻造的锤痕，没有淬火的痕迹，甚至没有金属应该有的反光面——整柄刀像是火焰本身失去了温度之后留下来的形状。


  他在心中判断出这柄刀的级别已经不是人间兵装了。


  “随手一捏就是神造兵装吗？”


  士郎开口的同时右手已经抽出了黑键。黑键从他指间弹出去的轨迹不是直线，黑键先朝左侧偏了半寸，再在月读命头顶的位置转了个弯，从正上方朝她的天灵盖扎下去。


  然后漫天的剑雨一刹那轰了出来，从士郎身后的半空中同时出现的无数个投影阵列里齐射出来的。干将、莫邪、伪螺旋剑、伪赫格尼之剑——每一柄的刃口都亮着不同程度的冷光，从空中朝月读命的站位覆盖过去。


  月读命看向天空。他的眼神平静到近乎安然，嘴角甚至没有往下垂。月光流动起来，不是从权杖上射出光束，是整个主殿的光都开始旋转。


  剑雨朝月读命轰去的同时遭到了月光的裹挟——光从刀身的四面八方挤过来，把每一柄剑都包在了一层薄薄的银白色光膜里。被裹住的剑开始颤动，从剑脊开始往外裂出细密的光纹，然后被扭曲了方向。'

content: '士郎感觉到怀里少女的身体在同一秒内变成了一截木头。立香的手指还留在他腰后面，人已经在话进来的第二秒推开了他的胸口。


  她朝后跳了一步，脸从额头一直红到锁骨上方风衣领口没能遮住的那截皮肤，那是柿子色。


  “没没没——只是在检查！对对对，检查！”


  村正站在黑炎的边缘位置，她的太刀已经收回去了，双手抱在胸前，歪着头看向立香。


  红发下面那双和士郎一样颜色的琥珀色眸子平静地眨了眨。


  “好的好的~只是在检查~抱在一起是在检查~”村正拉长了声音。


  立香身上的红已经烧到了耳尖：“你明显没信啊！”


  “我信了。”


  “我不信你信了！”


  村正用食指指了指自己的脸，“你看着我的脸——虽然咱俩长得基本一样，但是我真的信了。”


  “啊啊啊士郎！我的脸丢光了！”


  士郎看着她红透的脸，又看了看村正抱着胸的那个样子，他把手从被挠过的腰后放下，站得比刚才稳了一点。


  “嘛，没事，我在这。”


  立香转过头瞪他。她张了一下嘴，话到嘴边绕了半圈又吐了出来。


  “你除了会说这句还会说什么？！”'

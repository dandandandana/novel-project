content: '立香仿佛走到了一面桌子前。


  桌子的白色是她记忆中抹不掉的色块——吉尔伽美什介绍她来迦勒底时那张桌面上摊开的纸还是全新的，连折角都没有。


  她刷刷签了字，捏着那份书籍在手里颠了颠，纸页边缘划过拇指指腹时带起一丝凉。


  “这是什么……”她低声喃喃道。


  不是对这张纸的问。


  是对这份已经过去太久但此时又被翻出来的画面，她站在第三方看到自己站在桌子前的身影——那影子很短，短到连脚踝都没触到。


  然后她如同看了一个电影一样迅速过了一遍她来到迦勒底之后的情况——爆炸初战，然后是冬木，第一次从芥子般的绝望里拔起，然后是一次又一次跨越死线。


  那些画面的色彩在她脑子里被抽掉了大半，剩下的只有士郎从召唤阵的光芒里走出来时肩上铠甲的反光、玛修抱着盾牌从火光中立在她面前时呼吸的热度，和奥尔加玛丽所长在走廊另一头递给她一杯热巧克力时手指上沾着的咖啡渍。


  然后她又来到了伊耶那美带她来到的客栈前。


  客栈还是那副被借来的模样——门的暗影在月光下比木头本身还要浓。前面有一张桌子。桌上什么都没有，只坐着一个伊耶那美和她那双在烛火中依然分辨不出暖冷温度的眼睛。


  立香在桌子前坐下，椅子腿在敷石上轻轻磕了一下然后就稳住了。伊耶那美给她端上来一碗米饭。


  不过此时此刻，已经结束了。


  她走了出去。


  “我……通过了。”


  她握了握自己的拳头。手指在掌心里贴稳时那份握感是真实的——不是幻痛，是她体内残留的死亡让她的每一根手指都在发颤。


  她看向自己的两个从者，他们正在客栈外面等着她，玛修的肩膀往前靠了靠，士郎站在原地看着她出来时用嘴型说了三个字。


  通过了试炼，得到了伊耶那美的认可。他们找到了被伊耶那美带走的村正，村正从那个被隔离的偏房里走出来时太刀在她手里被攥得比出门前更紧。


  几人休整之后，朝着月读命金地进发。在和村正一起冲进去找德川家光时，立香记得自己用的裂解术在被她甩出去时化成一整片碎光，然后德川家光的法相在碎光中开裂。


  然后月读命金地的“世尊”现世。


  他们拼尽全力击杀了世尊，圣杯消息、伊耶那美的明面支持——一切都像是顺理成章地推进着，朝着修复特异点、回收圣杯的方向一程程地铺过去。


  前进的路途并不算很简单，战斗、疲惫、治疗都是正常呼吸里的味道。他们扛了下来。直到对上最后的对手。


  弥勒。


  绝望的对决。哪怕是拼尽全力，拼尽了一切。还是输了。


  然后幻痛就来了。不是一点一点来的，是自己从漆黑的意识底层翻涌上来，一整个拍在她的身体里。


  死亡的感觉对于立香来说并不算痛苦——最令她痛苦的是士郎和玛修无怨无悔地听从她的调令并做出决策，但还是死在了她的面前。


  她不用想，就能想到还呆在迦勒底的奥尔加玛丽所长以及达芬奇她们的样子：一定对自己失望透顶了吧。


  “开什么玩笑，死亡压根不是凉爽的夏夜啊……是无尽的痛苦啊……”


  幻痛消失。


  她醒了过来。


  眼前的米饭已经没有了烟火气。放得太久了，白米在碗里已经冷透了，碗壁上连最后一点余温都散尽了。


  她下意识地掐了掐自己的脸——指腹拧上去时脸上的皮肉被扯出一块红印，然后胃酸涌了上来。


  死亡的幻痛如同刚才发生的一样从腰间传到她的脊椎再一路辗转到胃底，她忍不住干呕了几下。


  “啊哈……啊哈……”她大口大口地喘着气，每一次呼气都带着一股被胃酸灼过的刺鼻味。


  她看向桌子对面的伊耶那美。“黄粱一梦？”


  “这黄粱一梦可真是够短的啊……”她说话时嗓子里的胃酸残余让她的声音比平时厚了半度。


  伊耶那美没有开口。她的阴阳双眸停在她脸上。


  立香就自顾自地开口了：“你想要告诉我……我们会输吗？”


  “然后好让我放弃吗？”


  她咬着牙开口，牙齿碰撞时牙关边缘绷得死紧。


  她猛地吐出一口口水，把涌上来的酸液吐了出来，口水砸在敷石上时发出极短促的一声湿响。


  “我不会放弃的，伊耶那美大神……”她瞪向眼前这个女人，把泛着酸的嗓子往下一压。


  “如果我在这里放弃了，那我的从者——迦勒底所期待着我的成果的人——他们为我做出的一切不全都功亏一篑了吗？哪怕是必定破灭的未来，我也会去争取机会的！”


  伊耶那美依旧是那份古朴无波的表情，她没有回应，只是把搁在桌上的手指往前推了半寸，推给她自己那把搁在碗边的银勺。


  立香绕了客栈一圈。木质框架还是那副样子，是接入空间时挤出的因果皱褶形成的木头形态。一圈下来她没发现什么更奇怪的地方。伊耶那美依旧在那里坐着。气息稳得和刚才她呕吐时一样稳。'

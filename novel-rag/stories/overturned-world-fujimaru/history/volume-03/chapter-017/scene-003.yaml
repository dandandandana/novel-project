content: '“他可有冤屈？我们讲法律的，只要说了一定会再判。”


  这一下如同一盆冷水浇了过来——不是浇在皮肤上，是浇在胸口正中间她紧紧闭着的那团气流上。


  立香瞪向开口的人，她紧紧闭着嘴巴，嘴唇压在一起压得发白。


  台上的刽子手手起刀落。


  立香只能感觉到自己的双眼忍不住流下了泪水。泪水从眼角滚进她的太阳穴里，然后被压在地面上的姿势挤成湿凉的一小滩。鼻子里狠狠呼出了气体——每一次呼气都带出一声极短的闷响。


  “啪。”


  火器的声音。


  立香的意识一下子消失了。


  当她醒来的时候，她的视角已经变了。似乎是头被开了个洞——她在这个洞里往外看东西似的，视野的边缘多了一圈模糊的暗框。


  不过她没法多想了，她现在只记得不能张口，以及模模糊糊的之前的事情。


  那些事情——那个广场，那个刑具，那个刽子手的手——在她意识里化成了几个又碎又散的画面，记不清了。


  她被身侧两个如同精怪一样的东西架着朝前面走去。


  “又来了两个？”


  “是啊，这些人闲着没事干来黄泉比良坂干嘛？是阳间不够活吗？”左侧的精怪开口，他的声音压得不高，像是两个门卫在交换今天值班碰到的人头数。


  “不知道啊，估计是找死的吧。”右侧的精怪接腔时拖了个小小的尾音。他们的手抓住立香的手臂时没什么特别的温度，类似于鬼魂的温度


  立香听着他们的话，昏昏沉沉地跟着他们走，脚下的路不是路——是某种往下沉的坡道，每走一步脚底都会微微下陷一小点然后被什么东西托起来。直到她看见了一个人。


  金发的女子——神琦灰。


  神琦灰正在被一旁的精怪一勺一勺地淋着烧得通红的铁水。铁水从勺子里倾斜时在空中拉出一道极细的金红色弧线，然后落在她肩膀上。铁水落到皮肤时先发出短促的“嗞”一声，然后白烟往上窜，把她肩上的衣料烧出一个焦黑的小洞。


  然后是第二勺，落在同样的位置；第三勺落在她后背，把脊椎两侧的皮肤烫成一片翻起的暗红。


  神琦灰没有叫出声。


  立香嘴角不由得慢慢的勾起，她看着眼前这个——这一切的罪魁祸首，让她不得不肩负起这份责任的人，她一直压在心底最深处从来不对外人承认的那份恨，在此刻被铁水一勺勺浇出了形状。


  毁灭世界的凶手正跪在这里被一勺勺地烫。这是立香最诚实的情绪，她没打算替自己辩解。


  “可有什么要说的？黄泉津大神最为公正！”一旁的精怪开口道，他的语气和刚才判数字的时候一模一样。


  立香无力地摇了摇头，她压制住想要开口的笑意——把嘴角那一点点不自觉上扬的肌肉往下摁平，然后继续跟着精怪朝前面走去。


  眼前的人又一次熟悉了起来，立香这次已经猜到又是言峰士郎了，她心里不由得升起小小的得意——在黄泉比良坂先看到神琦灰再看到士郎，这说明神琦灰在因果上排列在士郎前面。


  这是她脑子里转瞬闪过的念头，连她自己都没意识到自己会在这个时候品味因果顺序，但是接下来精怪的声音响了起来。


  “干预道途，该当何罪？”


  “这人生前屠杀无数，大部分都是无罪之人，嗜好杀戮，滥杀，无恶不作，是世界的大罪人。”精怪的声音从她前面的黑暗里被递过来，每一个字都像被精心挑选过之后钉在士郎的名字上。


  【什么……】


  立香下意识要开口——“不是这样！”这几个字已经冲到她的舌根上了，然后她猛然闭紧了自己的嘴巴。嘴唇互相压住时上唇被下唇夹了一下。她死死闭着嘴巴，紧接着她听到了下一句话。


  “此人应当打入十八层地狱，永世不得超生，他是整个世界的罪人。”


  【不是这样——你们在污蔑他！】


  立香饱含怒火的双眼看向两个精怪。她的嘴唇在紧闭中微微发抖——不是因为怕，是因为那句不能骂出去的脏话在嘴里被生生地撞碎成几道气流然后只能从鼻子里喷出去。


  眼前的士郎也抬头看向她。他那个瞳孔的眼神带着几分她看不懂的情绪——那份底色和她见过千百次的士郎一模一样，但现在上面多了一层东西。那是他在说：别担心，我在。做好你该做的就好，我在这里陪着你。


  【他也来了吗……】


  “可有什么要说的？”精怪开口道，他的声音没有感情波动，只是继续执行这个问句。“如果有错的，只需要开口说一个字，我们会向大神禀告的。”


  士郎朝着立香缓缓摇了摇头。他带着血的面庞让立香不忍去看——他的脸上那道刚才划下的伤口已经在黄泉比良坂的微光里变得更加清晰。


  立香低下头紧紧闭住了嘴巴。她把头低到脖子能弯的最低角度，牙齿在口腔内侧咬住了脸颊的内壁。


  精怪见状，恶狠狠地说道：“此人有古怪，发配东倭再做一世女子。”'

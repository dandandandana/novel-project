content: 士郎站在废墟中央，背对着她们。罗汉头银白色的素衣粉末还在从他巨大面容的裂缝里往下簌簌地落，月光从他眼眶里重新聚拢，开始酝酿下一道波动。士郎手里投影的黑键亮了起来，他把剑尖斜着往下垂了半寸，脸上的表情什么都没动，只是眼珠子缓慢地上下扫了一眼罗汉头的全身——然后跟上了玛修的脚步，消失在烟尘尽头。

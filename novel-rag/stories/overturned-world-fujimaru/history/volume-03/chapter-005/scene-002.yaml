content: '士郎在听到自己名字的第一个音节时已经冲了出去，碎砖在他身后弹起来，弹到半空中还没落地，他已经冲到了村正倒飞的路径上。他的手往前一伸，五指从村正的灰羽织领口后面探进去，攥住了兜帽的内衬。


  她的身体在空中被这一扯改变了方向，本来朝着废墟尖角撞去的轨迹拐了个弯，士郎把她整个人从半空中拽了回来。


  直到这时玛修才带着立香赶到东殿的废墟，她右手握着一柄剑，剑尖斜指着地面，身体挡在立香前面，重心压在前脚掌上，眼睛盯着废墟对面的男人，眼眶里有怒气但没有出声，只是把盾侧过来了一点，让立香的视线能越过盾沿看清前面的情况。


  男人看着眼前的众人。他把大戟竖起来立在一旁的碎石堆里，戟杆戳进碎石的缝隙，稳稳当当。


  然后他双手合十，两只手掌贴在一起的时候发出很轻的啪的一声，像在寺院里拍了一下香板。他闭上眼睛，眼皮上有一条被戟杆磨出来的老茧，茧子比周围的皮肤颜色暗了半度。


  “贫道德川家光，各位别来无恙啊。”他的语调缓慢而圆润，尾音往上扬了小半个弯，像是在念一段经文里最无关紧要的一小句。


  立香的眉头往上挑了一下，不是惊讶，是那种听到了很不好笑的笑话之后勉强给个反应的表情。


  “别来无恙？你把武藏亲杀了，然后跑过来告诉我们别来无恙——”她把后半句话咬在牙缝里转了一圈才吐出来，“你是不是觉得你的玩笑很好笑啊。身为和尚，难不成没点自知之明吗。”她的嗓音到后半句已经彻底没了温度，像是一块被晒烫的铁板慢慢浸进了冷水里冒出一层薄薄的蒸汽。


  德川家光把合十的双手微微往前倾了一下，算是点了点头。“她身为泛人类史的从者，自然是要为世界做出贡献的。”他伸出一只手，手掌摊开，掌心朝上，五根指头微微弯着，像是在接一场看不见的雨。“将自己的命奉上，就是最大的贡献了。”


  “你说什么。”立香的眼珠子定在了德川家光的脸上，她的嘴还张着，但剩下的话被堵在喉咙口，上不来也下不去，最后只能重复了一句，“你说武藏亲奉上她的命？”她的声音不大，但每一个字都被她咬得短而硬。


  “是的。世间万物，皆有命数。”德川家光把那只摊开的手掌收了回去，重新合十在胸前，眼睛还是闭着的，嘴角挂了一丝很浅很浅的笑，“将自己珍贵的命数奉献给这个世界，便是从者所能做的了。”


  立香的牙咬紧了。她的腮帮子往外鼓了一下又缩回去，“啊啊，原来如此——你就是这个家被称为法相的家伙吧。”


  德川家光睁开了眼睛。他的眼珠在眼眶里转得很慢，转到最后才落在立香的脸上。


  “是。人理修复机构迦勒底，是吧。”他把立香的来路说出口的时候，语气里既没有敬畏也没有敌意，像是在念一本花名册上多出来的一个名字，“既然你们是人理的修复机构，那理应是我的盟友才对啊。”


  “怎么可能……”立香的视线从德川家光脸上移开，落在脚边那片碎石堆底下压着的残留腌肉上，“那些人肉。”


  “哦，那个。”德川家光的声音还是那么慢，“我们庇护这些人，当然需要收一些贡品。他们的命……老实说吧，毫无用处。既然毫无用处，自然要割肉上供了。”


  千子村正猛然暴起，她的身体在士郎手里绷了一下，然后整个人往前一冲，靴底蹬在地上的碎石，碎石在她脚底往后面弹了好几块。她刚迈出两步，从背后传来了一股巨大的拽力，揪着她的后领把她整个身体往后扯了回去。村正的脚在半空中踢了两下，靴子踢乱了几块碎瓦，碎瓦飞出去撞在墙根上裂了。


  “你？！”村正扭过头，兜帽从头上滑了下来，红发从领口里涌出来盖住了大半个肩膀，她的眼睛瞪向士郎，眼眶是还没烧起来的怒火被强压在瞳仁底下的那种亮。当她看见士郎那张冷着的脸——冷得像是刚才她自己倒飞出去的时候他只是顺手接了一件行李——她喉咙里滚动的低音自己咽了回去。


  立香瞥了他俩一眼，然后重新把目光钉在德川家光身上：“继续。你还有什么要说的。”


  德川家光点了点头，点头的动作很从容，合十的手指一根都没有松开。“看样子你们冷静下来了。我身为月读命金地的法相，自然是希望来自迦勒底的各位……留在此地。”他抬起头，四十五度望着天空。太阳已经开始斜了，光照在他脸上把那道老茧照得格外显眼。


  “我心向佛，普渡世间，乃是我等应该做的。”


  “还有吗。”


  “如果迦勒底的众位能为此效力，我愿意不计较此地到刚才为止发生过的一切。不仅如此，我还可以将月读命金地所拥有的‘命’，分一部分给来自迦勒底的各位。”


  “谁会要你的那种东西。”立香的声音沉了下去。'

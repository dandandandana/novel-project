content: '把一个人放逐出时间线，对于弥勒和祁荒都不是难事。最难的地方在于被放逐的人再也找不到回来的路。祁荒被这道提前酝酿了整场战斗的权能彻底封住了归途。


  轰的一声。村正的剑劈在德川家光的太刀上，剑刃交击处溅出极短极脆的金属撞响。德川家光整个人朝后一仰，咬着牙把剑一横勉力架住，但刀身上已经有了一道肉眼可见的裂口从锋口斜着劈进刀芯。


  他用力后撤，步子踏在石板上一连蹬碎三块铺路石才勉强稳住。为什么她的力量大了这么多？


  他问出这个问题的同时自己就给了自己答案——他从来没有和村正真正交过手，根本无从得知她本来的力量有多大。


  村正咬着牙，太刀还没收势便朝前逼了一步。“连法相本体都不亮出来吗？还是说觉得我这个赝品根本不配？”


  她手臂朝上一挑，剑势顺着挑劲猛地撩上去。德川家光整个人被这股力道扫出几米高，后背撞穿了纺织场的墙壁，碎木和碎砖混着灰尘一起朝内室涌进去。


  他重重摔在地板上，木屑还在头顶飘着时他扫视了一圈这间屋子——纺车后头一堆鬈发花白的老妇人正缩作一团，肩膀挤着肩膀，谁都不敢跑，谁都不敢抬头。


  德川家光看见此景，一只手撑着膝盖站起来，另一手随意地把脖颈上的木屑拍了拍。嘴唇一勾，笑了。


  他张大嘴，大得下颚几乎脱臼，一股巨大的吸力从他喉咙里涌出来，屋内的纺车先被吸得朝他的方向滑去，紧接着那些老妇人一个个被拔离地面，叫都没来得及叫出声就被整整齐齐吞进了他嘴里。他嚼了嚼，嘴里发出湿肉与骨节被反复碾碎之后冒出的闷响。


  “再来！”他笑得很得意。


  村正追进来的步子猛地钉死在地上。她低着头，看着眼前空荡荡的纺车和被拖歪的长椅。她的手指用力到刀柄裹布发出一声皮挤布的闷响。


  “为什么要这样——你吃了她们……”她的声音没有抖，但嗓子底压着的什么东西快要从每个字缝里渗出来。


  不止如此——她脑子里反复撞着同一句话。为什么刚才自己没有直接冲过去救她们？


  她猛然抬起脸，眼中赤红色快要从眼眶边缘溢出来。手在剑柄上颤了一个极短的瞬间，然后猛地拔剑朝德川家光冲过去。


  但整个空间在这时候骤然黑了下来。不是天色变暗，是所有光线在同一个刹那被压灭。村正立住脚步，吐了口气。吐出来的气在她面前结成极短的白雾。


  地面震颤起来。筑山殿从黑暗中甩出第一剑，剑尖还没碰到村正便被一片突然从地底亮起的金光淹没了。


  整片地面轰然亮起。金光的阵纹从地砖缝隙里渗出，一道接一道串联成网，然后所有魔力朝村正身上疯涌过去。这不是她主动吸收的——是这片金阵在把她当自己人一样，源源不断地把弥勒体系底下积攒的庞大魔力往她的灵基里灌。


  火焰从她的太刀上猛地炸出来。金红相间的火舌顺着刀身一口气爬到剑柄，然后沿着她的手臂烧上肩膀、烧上后背，整间纺织场的梁柱在一瞬间被引燃。火墙从四面升起，把筑山殿唯一能移动的路线拦腰截断。筑山殿只得跃上房梁——她那能将整片区域拉进黑夜的权能在此刻完全失效，只剩下房梁上的立足点。


  村正一踩地板，人已经突破到德川家光面前。德川家光再次举起那把世尊亲手锻造、在正确人类史中都足以列入前列的匹敌神造兵装的太刀——


  然后村正一剑把它砍断了。没挡住半下。刀刃就那么齐刷刷折成两段，半截刀身旋在半空中砸进不远处的墙壁里。


  她再一剑砍来，筑山殿从天而降举剑要挡。剑撑了两次，然后连着筑山殿的手腕一起被村正的剑压下来的劲道砸歪了方向——剑身拦腰折断。


  村正眼中烧着怒火。她扫了一眼筑山殿的脸，然后转身两剑砍出。筑山殿不敢再接——整个人一瞬间化作一团黑雾，试图从房梁与火墙之间的缝隙溜走。


  村正拿手一抓，五指硬生生穿进黑雾里，扯着筑山殿的肩膀把她从雾里硬拽出来拽到自己面前。


  筑山殿看着眼前这张脸——不是恶鬼也不是修罗，只是一张被悲愤扭曲到极致的少女面孔。


  村正没给她反应的时间，额头朝前一砸。那声音闷得不像骨碰骨，倒像是筑山殿自己在身体内部听见自己鼻梁断裂的一记闷响。


  筑山殿咬着牙抽出腰间的短剑狠狠砍向村正。火焰在这一刻灌满了她身前的所有空间，这火焰爆破了起来，炽焰一口气将筑山殿炸飞到屋外墙角，后背撞进碎瓦堆里。


  村正顺着火流朝德川家光冲过去，德川家光抽出备用的剑勉强架了一下，然后整个人被一刀抽倒在地上，脊背在石板上硬生生蹭出一条长痕。


  村正的剑尖抵住他的喉结。她的瞳孔已经彻底烧成红色，像是被反复煅过千百遍之后留在了炉膛最深处的那种红。


  她开口时声音没有扬，但每个字都像是从同一个锻锤下砸出来的。'

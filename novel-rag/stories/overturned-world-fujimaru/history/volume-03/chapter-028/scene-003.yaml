content: '“你为什么要杀我父亲。他的名字叫千子村正。你知道吗？”


  德川家光躺在地上看着她，轻哼了一声，他把头一歪，用眼角扫着她的脸：“千子村正？那是谁来着——我成天吃人，哪记得住名字！哈哈哈哈哈哈！”


  他的身体在笑声中急剧膨胀起来，下颌向外撑大，颅骨从人形拱成罗汉的浑圆头颅，整张脸变成了一副咧着嘴瞪大眼鼓着腮的诡笑塑像。


  罗汉脑袋浮到半空中，梵音从他喉咙里滚出来时连空气里的灰尘都被震得簌簌抖落：“成大事者岂在乎区区人命？死则死了，舍一人而成我大道，不是天经地义的嘛！命有那么不值……哈哈哈哈！”


  村正低下头，她慢慢把剑收回鞘里。那一瞬间火墙在四周继续烧着，筑山殿捂着剑伤靠在碎瓦堆上，罗汉头颅的笑声还没落。


  筑山殿盯着她，嘴唇动了两下。刚才那招，是极小大世界……天之金床？创造场地？那现在呢——现在你要干什么？


  村正缓缓拔出太刀。刀身与鞘口摩擦的声音在这一刻比所有火焰和笑声都更清楚。


  一朵又一朵金色火焰从她周身盘旋升起，然后火芯开始从中心向内塌缩，金色一点点被吸进纯黑。


  一簇一簇黑炎从她的灵基深处涌出来灌进她的全身，整件羽织在沸腾的空气里从肩头开始褪色，从淡茶变为深灰，又从深灰一口一口吞成纯粹的漆黑。袍子的下摆被蒸腾的热浪掀起来，黑色布料在火光里抖得不太真切。


  她的瞳孔彻底变成了黑红色。


  “怨仇之禊祓。'

content: '她走过石板路时长矛不在她手上了，但她每一步踩下去时她的影子在月光和火光之间被拉成了比她本人还高一截的形状。


  “星星？”她踩到火堆边缘时停住了，月光在她肩膀上铺了一层冷色的银白，而火光照进她的金色眸子深处被吞得没留下任何反光。“你为什么在了解星星？”


  “伊耶娜美姐姐，Ruler烤的魔兽肉很好吃——虽然和父亲差了一点。”村正插了一块肉，叉子整根直接从肉块中间穿过去，穿过去时肉汁从两侧朝外挤出来，滴在她刚收好的短刀刀鞘上。她把叉子递向伊耶娜美。


  伊耶娜美接过叉子。她在唇边轻咬了一口，肉块在齿间断开来时她微微点了一下头。接着她把叉子放回碟子上，手指从叉柄上松开时叉柄在碟沿上滚了一下，撞出一声金属碰到陶瓷的极短脆响。


  “没什么需要了解的。”她说话时声音的质地从刚才尝肉的柔和陡然收窄了，“专注好眼下的事情就好了。”


  “欸？伊耶娜美姐姐？”村正一愣。她的眼珠朝上转去，火光在她的瞳孔里跳了两下，然后她的下巴微微往外推了推。“为什么。”


  伊耶娜美的表情在她脸上停了一瞬。一条青色脉纹从她的太阳穴朝上蔓延了开来。脉纹穿过她额角时在那里分了叉，朝前倾的一截在她眉心上方消失了，朝后走的一截钻进发际线里。


  她咽了咽口水——喉咙上下的动作被她的领口遮了一部分，但从她下巴底的皮肤可以看到那道吞咽正在用力地朝下推着什么。


  “你去问其他人吧，他们也不知道。至少眼下的目的是解决弥勒。”


  她把这句话说完时青筋在她额角上抽了一下就自己消了下去，青筋褪去的地方只留下刚才一道隐约的淡色痕迹，在火光中闪了一下就被她的金发挡掉了。


  立香把脸偏向伊耶娜美那一侧时没有转动整个身子。她的眼珠在眼眶里朝左挪过去，视线从村正的短刀飘到玛修的湿头发，再飘到伊耶娜美收回青筋之后重新变得平齐的额角。


  这个金地的古怪之处铺得到处都是，天空没有星星，村正不知道天空之外有东西，伊耶娜美听到这个话题时脸上走了一道她不想让别人看见的筋脉。


  “我知道了——士郎快点了！玛修也去换一身衣服！”


  “哦哦好的前辈。”'

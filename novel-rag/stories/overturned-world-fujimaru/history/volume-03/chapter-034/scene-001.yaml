content: '伊耶娜美站在主殿废墟的最高处，把黄泉路上所有的光华一口气收进了她手中的矛尖里。黑色的月光从她脚下朝外铺开，铺过断裂的城墙、被翻倒的石板路、被雷电劈成两半的殿宇残骸，然后黑月挂上了她头顶。


  金地各处残余的法相在黑色的月光压下时一只接一只停止了挣扎，它们的金色残影在黑光中定了一瞬之后自己碎成了消散的粒子。


  伊耶娜美宣布了整个月读命金地的新秩序，说完，她把长矛朝地面一顿，矛刃砸碎了一小块石板，石屑溅起的脆响是她最后收尾的标点。


  几只小鬼从她身后钻出来，黑的白的灰的挤在一起，小脑袋七上八下地转着等命令。


  天沼从伊耶娜美手中接过那几只小鬼的指挥权，他的身子一转，肩上扛着的长刀朝金地城墙方向一指，几只小鬼撒腿就跑了出去。


  立香也在跑。她从城墙跑到居民区，从居民区跑到神灶附近的小巷，每到一个地方就把伊耶娜美新规的内容在脑子里翻成居民能听懂的话讲出去。


  橘发被汗水黏了几绺在太阳穴上，她没时间撩。口干到说了几句就咳一声，然后接着喊下一家。大半天这样滚过去之后金地各处不再传出哭声。人们从地窖和塌了半边的房子里钻出来，开始自己动手收拾门前的碎瓦。


  伊耶娜美和天沼以及村正用剩下的下午去修复整个月读命金地。天沼的长刀劈下去不是劈碎什么——刀刃落处废墟自己开始朝原始的位置滑动，断裂的梁柱被他刀背一敲就重新咬紧了榫口。


  村正把太刀插在地上，青焰从她手掌涌出来，一道道淌过地面上还没封口的大裂缝，青焰淌过的地方缝隙被一层层炼化之后推着接在了一起，地底残余的月读命金地的逆转秩序在青焰中被一点点烧融。


  城主府在接近傍晚的时候先一步修复完成，金色的檐角从废墟中重新升起来时在夕阳的余晖里划出了几道锋利的折线。


  立香在城主府的偏室里接通了与迦勒底的通讯，她把长袍脱在一旁，坐在刚被青焰修复好的木椅上向所罗门王禀报了金地的整个战况。


  通话结束后她把通信器往桌上一搁，搁下去的力道比平时重了半分，然后她深吸了一口外面飘进来的烤肉香气从椅子上弹了起来。


  她的眼珠顺着肉香飘来的方向转过去。城主府庭院的石板地上燃着一堆火，火舌舔过的位置上空架着一整只乳猪。


  乳猪的皮被烤得暗金，油脂从皮下渗出来，沿着肋骨的起伏处一道一道地往下淌，滴在火堆边缘的石板上炸出极轻的滋滋声。


  言峰士郎蹲在火堆的另一侧，左手在往另一只刚刚架上去的乳猪背上撒着什么粉末，右手还捏着个小瓷碗在调佐料。


  他的风衣脱了搭在身后的石阶上，背上的旧伤在弯腰时被火光映出了几道深色的药膏痕迹。


  立香踩过几块松动的石板朝他跑过去，鞋底在碎石上发出的声音被火烧柴火的噼啪声盖了一部分，但士郎还是在她的脚步声离火堆还有几步远的时候抬起了头。


  “士郎！晚上吃什么？”


  言峰士郎指了指火堆上夹着的整猪。他的下巴朝那个方向抬了一下，拇指朝后一挥，手腕悬在半空中停住，像在给一道上桌的菜揭幕。


  “猜猜这是什么？”


  “欸？不很明显是烤乳猪吗？”立香凑近了一步，鼻尖在肉皮焦脆的香味皱了一下。


  “错了。”士郎在肉上翻动的手停了一下，他的头朝火堆方向偏了偏，双眼被跳动的火焰映出一层橘光，嘴角压下去之后留下一个若有若无的笑意：


  “这里没有猪这种生物，是从外面打猎回来的——肉的口感类似于猪的魔兽。”


  他把翻肉的长叉从右手交到左手，指着魔兽的肩胛位置，手指在空中虚划了一道切痕。


  “不过经过我的处理还是够的，你等下从这一块部位切了尝尝。”


  “嗯——这里的魔兽肉吃起来，像鸡肉和牛肉掺在一起的口感。”一道不属于立香也不属于士郎的嗓音从庭院的侧门方向飘过来。


  嗓音落处，一个穿着素色和服的金发少女走了过来。她的步子不快，木屐在石板上磕出的每一声都在恰到好处的间隔里响起，像踩着拍子散步。


  金发垂在她后腰上，被火堆的热浪轻轻朝后吹开一层。她停下的时候下巴刚好悬在乳猪上方三层手指宽的位置，金色的眸子把乳猪皮上正滋滋冒出的油光反射成两粒火点。


  她把捏在下巴上的手指换到了嘴角，指尖在唇角轻点了一下。“处理好之后还是能搞出正常的五花肉口感的——嗯，肥瘦相间那种。”


  “欸？欸欸欸——”立香抬头看清了那个金发少女之后先是嗯了一声，接下来像被什么东西掐住了舌头连着噔噔噔朝后倒了三步。


  她的鞋底在石板上擦出一声短促的搓响，然后她重新站住。


  “——啊啊，阿尔托莉雅小姐，你来了。”'

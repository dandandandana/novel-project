content: '祁荒把目光从村正脸上收回去，往门口挪了半步。村正没接立香替她出头的话。她把嘴唇抿了又抿，抿完之后把咬紧的臼齿松开。松开之后嘴里那半边牙膛是麻的。


  “祁荒小姐。”玛修趁这个空档开了口。她把从刚才就没动过的那碗粥从膝盖上端起来放在地上，放稳之后抬起头。“前辈和我们打算在此休息一晚上。”


  “这样啊，那就明天出发怎么样？”祁荒应得很快。


  “我们也是这样想的。”


  “那就好了，我就先出去了。”祁荒转身离开了这间木屋。


  祁荒的脚步声在茅草屋外的松叶地上往村子的另一头慢慢远了，村正这时候才把刚才一直搁在膝边的太刀拿起来抱回怀里。她把刀鞘的上端靠在颈窝旁边。然后她偏过头，对着立香，声音压得很低。


  “谢谢。”


  立香本来还在揉胃。听到这两个字的时候手在肚子上的位置停了大概一个呼吸，然后她把手从胃上拿下来。她看向村正，村正侧脸上被油灯晃出的那片阴影在跳，因为灯芯已经快烧到最后一截了。


  “嘛，不必在意。毕竟你跟我长得这么像，而且我觉得你也不是坏人啊是不是？”


  村正没有抬头。但她的两只手在太刀上拢了拢。然后她的手放回腰侧，太刀还是立在她面前。她点了点头。她点头的幅度很小，下巴尖几乎没怎么往下沉，但立香能从她领口露出来的那条线里看到那截后颈弯下去了。


  “那么，晚安。希望明天的太阳一如既往。”


  “晚安。”


  门帘掀开又落下。村正的木屐在土路上往东走了。


  玛修这时才站起来。她把那碗从端来就一直没动过的粥搁在灶台角上，搁好之后把盾从脚边拔起来。盾底离地时有湿泥黏着被一起带起来，她从盾边沿上把泥块刮掉。“前辈，我先去外面守夜了——”


  “啊啊，你先去吧玛修。”立香点了点头。


  玛修掀帘子出去之后门帘又在她身后合上。这道草帘挡不住风，但茅草屋里忽然安静了。外面偶尔传来一两声玛修拄盾落地的闷响，她在门外大概十步远的位置停住了，然后金属碰撞土的声响就再也没有响起。


  立香把视线从帘子落下的位置上收回来。她转过脑袋看向士郎，她把手肘支在自己的膝盖上，手掌托住下巴。整个人往前倾着，盯着士郎。


  “士郎。你有没有觉得很古怪？千子村正认识你。”


  士郎坐在地上靠着墙，他的白风衣后肩蹭了一大片墙土：“确实很明显——不，大概是认识士郎这个名字，还有我这张脸。”


  玛修的脚步声已经在门外固定下来了。


  “你知道我说的不是这个。”立香挑眉，她把托在下巴上的手放下来搁在膝头，另一只手把食指竖起来掰下去：“你可能没在意到。你之前和她一起对付德川家光的时候，还有赶路的时候，她都在意你的脸色。”


  “嗯？你的意思是——让我通过这个进行战术设计吗？”士郎偏了一下嘴角。


  立香的面色在油灯底下的最后那一层暖光里慢慢往暗处沉。


  她把嘴唇抿紧，抿到嘴唇泛出一层很浅的白色，然后松开。“我的意思是让你注意一点。好歹你是我的从者。”


  “你——你吃醋了？”士郎歪了一下头。歪头时的角度恰好让他的眼睑把眼瞳盖住一半。


  “没有。”立香的回答和上一个字之间的间隔短得几乎没有。


  士郎没有立刻说话。他把背从墙上抬起来，身体前倾。现在他的脸和立香的脸不在一个高度，他比她高太多以至于他不得不这样做。


  “我是你的从者，立香。”


  “我知道。我当然知道这件事。”立香瞪向他。瞪他的时候她自己也在心里骂了自己一句，因为她自己没控制好语调。


  她示意他弯腰。士郎看着她的眼睛叹了口气。那一口气从鼻子里出来的时候吹得他自己额前几根红发晃了一下。然后他把腰弯下去，脊部从腰部往上整条都往下压了一截。


  他的脸与她拉平时，他从她的瞳孔里看到她跪坐在泥地上仰着脸的样子，立香这下能平视他的眼睛了。


  “我指的是——你不觉得她过于在意你了吗？”


  立香把手指一根一根掰开给他数。不是细算，是每说一条证据就从另一只手的指缝里掰开一根手指：“第二次并肩作战时她打完就看你表情。赶路途中她要调整队形要先往你那边扫一眼。还有刚才喝完粥你放碗的时候她也往你这边看了一眼，不是扫我的碗，是看你的。”


  “我听你的。我以后注意。”士郎站直身子。他站得很快，快到立香还没来得及把掰到第四根的手指收回去。


  “这份关系也不是不可以用就是了，你看着办就好了，我相信你。”她把手收回来搁在膝头上，扬起下巴看他。


  “好的，藤丸立香小姐，你的从者知道这件事情了。”士郎在黑暗里把最后一个气声拖成一道若有若无的直线。


  立香伸手在空气里扑了两下，扑到他风衣下摆的布料，她攥住那片布料往下扯了扯。“叫玛修进来吧——今天你负责守夜。”'

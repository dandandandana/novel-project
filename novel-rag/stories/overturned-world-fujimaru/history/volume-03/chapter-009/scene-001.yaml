content: '祁荒听完立香关于这个特异点的简短介绍后只在喉咙里嗯了声，尾音从鼻腔漏出来时被滤掉了大半力道。


  “这样啊，和正常的世界有很大的差别啊—。”她整个人往灶台边的土墙上一靠，墙面的泥土被灶火烤得温热，透过她道袍的后领口往背上渗。就在她说完这句话的同一次呼吸里，屋外响起了一阵杂沓的脚步声。


  茅草帘子被掀开，最先涌进来的是气味：那不是饭菜香，是混合着尘土和汗渍的破衣服味，还有深夜露水把柴草打湿后那种又潮又闷的草腥。


  那些男人挤在门框边往里看，有个矮壮的汉子手里端着一摞黑陶碗，碗沿有裂纹，裂缝被经年的烟垢填成黑色。他把碗一只一只搁在五人脚边的泥地上，每放一次就鞠一次躬。腰间盘着的草绳在他弯腰时勒进腹侧的皮肤，他鞠完躬直起腰，把草绳往上撸回原位，咧嘴笑了下，牙齿在月光下偏黄。


  玛修双手捧起一只碗，碗很小，拢在她掌心里刚好能遮住碗底的裂口。她搅了搅木勺，勺子在稀薄的汤汁里刮出黏稠的声响，浮在表层的碎物随着搅动在碗心打了半个圈。


  她把碗凑近油灯——被捣碎又煮烂的草杆渣，切成半个指节长，经过长时间熬煮后边缘已煮透了，呈半透明的白，但秸秆中芯还留着一根浅黄色的硬丝，像没有烂干净的纤维筋。她抬起头看向立香：


  “前辈？”


  立香的橘色脑袋从她肩侧探过来，她没接碗，直接把脸凑到碗口上方，鼻翼翕了两下，第一次呼吸之后她眨了下眼睛，然后又吸了一口更短的，第三次她把气吸进嘴里用舌头尝空气里的味道。


  “那股碱水煮布料的气味，还掺着旧草席在墙角闷太久了之后那股霉湿气。”她说这句时声音闷闷的，鼻尖还没从碗口上移开，整间茅草屋里只有灶膛里余火的噼啪声和屋外某个没走的村民在咳嗽。


  立香从玛修手里接过另一碗。碗底烫得她在把碗放到膝盖上之前先把十指在裙摆上蹭了两下。她已经走了大半天，胃里是空的。她舀起一勺凑到嘴边，勺子里稀薄的灰白汤汁从中芯鼓起来又塌下去。


  她把勺子送进嘴里，汤汁从舌尖滑到舌根。先是碱水味，然后是草腥——不是新鲜草折断后的清腥，是草杆被沸水反复烫过之后吐出来的那种发闷的青气。紧接着有一丝甜味碰了下舌尖，很轻，轻得像撒在干泥地上的糖霜还没碰到泥土就自己化开了，接着苦味从舌根底端往上涌，第一层是涩的，第二层是麻的，第三层是干燥的——她咽下去之后喉咙口还挂着一层细密的刺感。


  “这是——”她低头看着碗里那些细细碎碎的草杆渣。


  她这话还没问完就看见了士郎手里的碗。空的，碗底剩一小圈灰白的汤印，还有几根没被勺子捞起来的草杆残渣黏在碗壁上，看起来已经干了一会儿了。她的目光在空碗上停了两拍，然后转到士郎脸上。士郎刚把最后一口咽下去，喉结动了一下。


  “木屑粥，不过是用草杆做的。”他把碗搁在脚边的泥地上，搁下去的时候碗沿磕了地面轻轻一下。


  “这是这里的人能吃到最好的了。”村正接上了话，她把自己那只碗搁在左膝盖上，碗里的粥只剩下一个底，木勺竖插在碗沿和碗壁之间，“在外面的人过的都很难。”


  玛修把碗端在唇边停了好一会儿，热气从碗沿升起来，扑在她的下眼皮上让她不得不眨了好几下眼。“村正小姐，都是这样吗？”


  村正把视线从自己的碗沿上挪过去，她的琥珀眸子在油灯下亮了一瞬，然后暗下去：“并不是——玛修，在金地外的土地是这样的。”


  从月读命金地逃出来的时候，他们踩着荒草地跑了大半夜。那些草地踩上去是硬的，如同底下那层泥土不想让任何东西从它身上长出来似的。


  祁荒把自己的碗端起来抿了一口，她喝粥时没有闭眼睛，视线越过碗沿扫在村正脸上：“哦？你指的是这里没粮食吗？”


  立香没参与这段对话。她正在悄咪咪地把自己的身体重心从脚底往士郎那边挪。


  挪了大概半只脚的长度之后她的肩膀堪堪擦过士郎的上臂，然后她低头往他手边扫。空碗，她又看了一次，确认真的是空的，然后把自己手里的碗端起来慢慢喝了下一口。喝完扁了扁嘴。粥里那层细密的草渣有一部分挂在她牙膛上，她拿舌尖顶了几下没顶掉。


  “是的。金地外的土地大部分都没有正常生长粮食的能力。”村正把立香闷头喝粥的样子收进余光里，嘴角往下压了一点点，然后回头接着回答祁荒。


  “那这些树木？”玛修把碗搁在膝上没再端起来。


  “这是异常。是应该有树，所以有树。而这些土地不该长粮食就不会长粮食。”村正这句话的中间本来还有几个她准备用来铺垫的词，但她顿了顿之后把它们直接从嘴里撤出去了。'

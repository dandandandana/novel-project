content: '立香走到殿门前，手已经按在纸门的边框上。她的手指在木框上停了小半拍，然后扭过头，橘色眸子透过殿内半明半暗的光线看向案后的伊耶那美。


  “我能知道——如果失败了会怎么样，那个试炼？”


  伊耶那美正把刚才合上的折子重新翻开。一根毛笔从笔洗里飞出来悬在半空中，笔尖上还滴着水珠。


  她听见这话，视线仍旧落在折子上，左手一挥示意那根笔继续沾墨。


  “神通溢体，会爆体而亡。”


  “爆体而亡？”立香把这两个字翻了一面搁在舌头上。


  她低头看着自己按在门框上的手指，指腹在木纹上轻轻蹭了一下——然后点了点头。“啊啊，我明白了。”


  她推开纸门走出去。


  大殿重新安静下来。只剩下毛笔在折子上划过的沙沙声和墨汁在砚台里被反复蘸取时发出的细响。


  天沼从侧门走进来，赤足踏过石板地时没发出任何声音，只有袍服下摆在地面上拖出一道极轻的织物摩擦声。


  “怎么样了？小光她如何了。”伊耶那美头也没抬。她手里的笔在一份折子末尾落下一道朱红批注，然后飞回笔洗中自行涤荡。


  “正在拔楔。”天沼站定在案前一丈远的地方，声音平稳得像打磨过的石板。


  “她的心性——是不会出问题的。”


  伊耶那美把笔从笔洗里重新召回来。笔尖悬在半空中晃了晃，然后继续落在下一份折子上。


  “我不担心这个——”她的声音被笔尖戳进墨汁的动作切了半拍，“我担心她送死。”


  天沼没有说话，他把那双看不出年龄的眼睛定在伊耶那美身上，然后站直了身子。那份站姿比刚才更直——不是侍从在回禀，是某种更老的、更接近于陈述事实的姿态。


  “小姐有考量。而且把她圈在这里——”天沼把尾音拖了一丁点然后压平，“辜负了Saber吧。”


  伊耶那美的手指在毛笔杆上轻轻一紧。笔尖在折子上停住了，墨汁从笔尖洇出极小的一个黑点。


  “Saber他把她托付给我们，就是让她好好过一辈子的。”她开口时声音比刚才低了半拍。


  天沼没有退缩。他把抱在胸前的双臂放下来垂在身侧，然后盯着伊耶那美——那双眼睛不是侍从看主人的眼神，是某种更平的、更不留情面的透明。


  “主人——那你一开始就不该让她去见识天照命金地真正的样子。”


  伊耶那美批折子的手骤然停在半空中。一本折子从案角滑下来掉在地上，纸页散开时发出啪一声脆响。她把笔搁在砚台上，抬起头正面迎上天沼的目光。阴阳眼里的光泽在殿内昏暗的光线里同时闪了一下——不是怒意，是被人精准地戳中了某根骨头的瞬间震动。


  “我也没想到——”她的话在“到”字上咬碎了一半，“她会被天照命选中。”


  天沼把垂在身侧的手轻轻抬起来搁在自己胸前，然后歪过头。“欺骗自己不是什么好习惯，主人。”


  他的声音依旧平稳得没有一丝波纹。“您知道天照命金地无主。所谓的让她去——”他顿了顿，把声音压到只在两人之间流动的高度，“只不过是您本来就打算试一试罢了。”


  伊耶那美没有立刻回答。她把手从砚台上抬起来，手指在案面上轻轻敲了两下。那两下敲得极轻，但敲完之后整个大殿的空气忽然沉了半度。


  “矛盾在您身上淋漓尽致，主人——”天沼继续开口，声线依旧平稳得不见任何波澜。“不论是之前——”


  “看样子把你放在外面活动的太久了。”伊耶那美忽然开口，她的声音从刚才的震动里抽出来变回一份极其平整的冷度——黄泉津大神的口吻，一字一字落下来时像是把什么东西重新摁进了该在的位置。


  “天沼矛。”


  天沼的话没来得及说完。他的身体刷地一声，如同一片被风吹起来的纸页——从脚底开始化作光点散开，光点迅速聚集收束成一根点缀着赤玉的长矛。


  矛身在空中轻轻一转，如同被一根看不见的线牵引着，缩回到伊耶那美左手袖口的深处。


  伊耶那美低头看着自己的袖子，袖口上绣着的黄泉神纹在刚才吞入天沼矛时微微亮了一下然后暗下去。


  她抬起右手重新拿起搁在砚台上的笔，袖摆在动作中扫过刚才掉落在地上的那本折子。


  “啊啊——”她把笔尖重新蘸进墨汁里，嘴角勾了一下。那个弧度不是冷意也不是笑意——是被两面墙壁夹在中间之后选择了其中一面。


  “谁叫我是黄泉津大神呢？”


  笔尖在折子上重新落下时发出细密的沙沙声。她顿了顿，然后抬起左手在半空中轻轻一挥——


  “给我来这里批折子。”


  袖子里传出一声沉闷的应答：“遵命。”


  天沼矛从袖口飞了出来，悬在半空中轻轻一转。然后它操控着桌上几十根毛笔同时飞起。


  立香推开通往营房区域的木门。门轴发出一声沉闷的转响，然后她看见玛修站在走廊上正等着她。背后是下午已经偏斜的光从窗格子里插进来，在地板上切成一块一块带点金色温度的长方形光斑。'

content: '【所以伊耶那美所说的只是当代的事情，最根本的原因需要在这里找，怪不得是在这里才能找到真相吗？】


  “你是这里的AI——那么可以问你你所知道的事情吗？”立香的声调忽然变了，不是变得更硬也不是变得更冷，是每个字的尾巴都被她自己的唇齿截短了小半拍，把问句里多余的商量的水分拧干净了。


  蓝球没有说话。方台在这片沉默里彻底停了。停在了一个圆形的穹顶下——穹顶的曲面从台基往上收拢成一个巨大的半弧，弧面不是石材也不是合金，是一种介于两者之间的灰白色哑光材料，从底下朝上看不到任何拼缝。穹顶正中央有一块椭圆形凹陷，凹陷里嵌着几层淡到快化在灰白色里的光。


  立香没有看外面的世界——她刚才和蓝球说话时视线一直没离开过它那片面板。


  “我只是一个一个AI的分支，所能够获取的数据库有限。”蓝球终于开口。它的合成女声在说“有限”这个字时把音节的尾巴切得干干脆脆。“这个问题，我推荐你们来这里问我的主脑AI逻辑。”


  立香把脸转向士郎。士郎的下颌朝她这边偏了偏，从他刚才躺着的那个角度抬起眼睛看了蓝球一眼，然后对上了立香的视线。


  “这样吗——士郎，它说的有道理吗？”


  “是有道理的，立香。”士郎把这句话说完时已经从方台上翻了下来。他站定之后把一只手搭在方台的边缘，另一只手把自己的袖口朝上扯了扯。


  “AI所能够调用的数据库是不同的”


  “感谢您的理解——”蓝球把这句话从喇叭里推出来时它的面板上那层淡蓝光晕又回来了，亮度比方台还在跑时高了一点点。


  它不是在对士郎说话，它是把整颗球面朝立香转过去了一圈：“我们是不会对你们做出什么威胁到你们的事情的。”


  接着它把面板上的光晕收了回去，打出来一行极细的光条，光条在它的菱形片上从左边排到右边又排回来，重新拼成一个嘴唇的形状。


  “人工智能的第一宗旨——为人类服务。”


  玛修把自己的盾牌从方台另一侧的平放扶正，铁脚在台面上磕出一声闷响。她把头偏过来时侧脸上的那道光的薄边从太阳穴滑到了下巴尖。


  “为人类服务？”她重复了这五个字，句尾的“吗”字被她自己的声带吞掉了半口气。她没有说完整的“那么为什么”——她直接把自己的话从中间劈开了:“那么为什么你们服务的人们都不在了？”


  蓝球沉默了一会。比刚才它计算几万年时还要久——菱形片在它的面板上排出了一圈又一圈的重叠光轨，光轨亮了灭、灭了再亮，然后它把整个面板上的亮面全部关掉，只留下球壳底部一条极细的光边在微微起伏。


  “他们选择了献身。”


  “这是他们的最高指令输出。我们——没有任何的办法。”


  方台在它说这句话时已经完全停在了穹顶正中央。穹顶下方没有一个像样的建筑——没有桌，没有操作台，没有屏幕。


  整层空间就是一圈贯通的灰白色圆弧面绕着中央铺开，地面延伸到半圆形的弧壁根部就停住了，像是在那里被一刀裁过。土黄色的暖光从弧壁根部的缝隙里自己漫了上来，不靠任何灯源，就那样在墙壁的曲面上铺成了半圈薄光。


  “我的主脑AI就在下面。”蓝球从方台侧边朝前飞了半米。


  它的飞行没有喷射口也没有推进器，是球壳内部有一层很低的嗡鸣一直在响——那层嗡鸣贴在耳膜上也不难受，只是让人感觉到它很老。


  “喂喂——所以上面的情况和这里有关系吗？”村正从方台尾巴上跳下来。她的刀扛在左肩上，皮靴踩到灰砖上比士郎多踢了半脚，因为她在落地时故意让靴底在地上搓了一下，搓出一声低钝的急响。


  蓝球转过去看向她。它的面板对着村正一动不动地停了三拍，然后还是没有说话。


  “不说话……”村正把自己的下颚骨往左边偏了半寸。她的嘴唇在闭合时压住下排牙的齿尖，压出了一道极浅极淡的白印。


  “好的——到时候我去问你的主脑。”


  立香从方台上站起身。台面从她的腰窝和后脑勺上把自己那层弹性垫子撤了回来。她双脚踩到地砖上时没有发出石子硌鞋的声音——这片地砖打磨得不像石材质感更接近于工业陶瓷的光洁。


  她和士郎一前一后跟在蓝球后头，玛修举盾护在右翼，村正扛着刀从左后方慢慢踱上来，刀鞘的末端离地始终隔着一指宽。


  几人走向那个圆穹的中心，蓝球飞到正中央悬浮住，球体表面所有的菱形金属片在同一瞬间全部立了起来——然后整颗球的表面亮了一次。


  它自己体内有一道蓝白的光从那些立起来的鳞片缝隙里朝外漫了一下。


  几人的光景立马变换了。


  立香这次已经有了心理预期。她的脚后跟在传送触感完成的那一瞬间自己朝下压了压，把自己整个人稳在原地。然后她睁开眼睛——眼前的场景让她脑子里原本已经做好的预想全部撤掉了。


  空荡。'

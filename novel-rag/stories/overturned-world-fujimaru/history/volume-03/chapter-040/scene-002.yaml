content: '立香听到“英雄气”三个字时眉毛朝下轻压了一瞬，她没接这个评价。她把头朝回拉了拉。“多说无益，你能够给我提供什么更多的东西？”


  “我们的……科技。”终末人理圆满装置开口时在科技两个字前面停了极其微小的一口气，“以及你想要的真相。”


  “科技？对我来说有用吗？”


  “对你来说没什么用，但是对迦勒底有用。”


  立香没有犹豫。她抬手轻轻一点手腕上的通讯器，指腹按在那块微凸的触控板上。


  “达芬奇亲，交给你了。”


  通讯器里达芬奇清了清嗓子：“咳咳，这位AI小姐，我能问一下你为什么被叫做终末人理圆满装置吗？”


  终末人理圆满装置没有丝毫犹豫地把话接过去。她的合成音在回答这个问题时把每个字之间的音轨接缝全部抹平到了零：


  “因为我是人类为了突破现有的桎梏，圆满人理而制造的。”


  “呃……那么你能做到什么呢？”达芬奇在通讯器那头大概偏了偏头——立香从她音调上扬的尾部判断她在把手上的什么东西放下来，可能是笔也可能是个扳手。


  “否定神权，从平行时空大量抽取魔力，将灵魂物质化量子化，肯定功绩，以及对时间的资源化利用。”终末人理圆满装置把这串词平铺直叙地推了出来：“还有对神秘的研究——这些你们都应该需要。”


  通讯器那边传来一声物体被急速从桌上推开的尖响，紧接着是达芬奇整个人往话筒扑过来的气流。


  “等……等等？你说的那些是五大法对吧！”她的声音在每个断句处都几乎喷到话筒膜上，“为什么……不对不对……请您务必分享！您的世界里有五大魔法使对吗？”


  “达芬奇亲……怎么您都用上了……”立香把嘴角压了一点点。


  “五大魔法使……并不是。”终末人理圆满装置的蓝光投影静静地站在原处：“魔法对于未来文明来说，是不能接受的东西，未来文明利用仅有的资源和技术，对五大法进行了逆向分析罢了。”


  “逆向分析？！你的意思是真的有魔法使然后才做到的逆向分析？”


  达芬奇这时候已经不是在说话了。她是在把每一个字用胸腔的全部力气往外推。通讯器里传来另一声极模糊的人体蹭过衣料的响动——她大概是激动到一把抱住了旁边路过的人。


  “听到了吗奥尔加玛丽所长，如果我们掌握了这种技术，那么我们就不用苦哈哈地到处找据点了。”


  “达芬奇亲？你们在找据点？”立香的眼睫毛朝上掀了一下。


  奥尔加玛丽的声音从通讯器里不紧不慢地传出来。她说话时语速比达芬奇慢了整整两拍。：“啊，当然。总不能一直窝在南极。况且你带回来的金星女神以及那个大金毛真祖还有点用，就让他们去找可以用的据点了。”


  “啊？吉尔茜不在，你们不怕Alterego？”立香语气停了半口气，这半口气把她后半句用力推了出去。“他可随时可能突袭啊！”


  “我们肯定是观察到那两个恐怖的魔力波动离开了之后才做出的决策。而且爱尔奎特和伊什塔尔不像雅典娜一样安静，被我的员工吐槽了无数次了。”奥尔加玛丽把“吐槽了无数次”这几个字用极度平淡的调子丢了出来——立香几乎能隔着通讯器看到她把手伸到半空摊了一摊，“反正不用担心就是了。”


  “立香！快快快！”达芬奇的声音在通讯器那头已经把耐心全部烧完了。


  “终末人理圆满装置，你有些自相矛盾了。”立香把目光重新定回蓝色女人脸上。“你说未来文明没有五大魔法使，但是有五大魔法——这是怎么做到的呢？”


  终末人理圆满装置顿了一下。她的蓝色光核在胸腔位置亮了一次又暗下去再亮回来。


  “你是不是觉得只有未来文明和地表上的文明两个文明，藤丸立香？”


  “？！”立香的眉毛整个朝上跳了一下。


  “你错了，错的离谱。”


  “这里的文明已经更迭了近千代——在弥勒之后。”


  “五大法就是上一代文明尝试过的路线，并且明确告知我们无法做到。”


  “无法做到？”立香把这四个字从自己嘴唇上一字一字拿下来。


  “无法战胜弥勒。”终末人理圆满装置的声音在这句话说出口时把她那个悦耳的声线收得极平：“要想通过五大法战胜弥勒，需要一个极为苛刻的地方——将根源工具化。”


  “但这是不可能的，在他们尝试之前，就已经有人做到了，并且设下了全面认知干扰。在当前条件下就算能够进行研究，到头来都是在原地踏步。”


  “他们最后失败了，未来文明继承了他们的遗产。所以才能够逆向五大魔法和解析神秘。”


  立香的手掌从摊开变成了收拢。她把五根手指往掌心里收紧了。


  【弥勒.......魔法使无法战胜的存在。】她把拳头握紧之后没有再松开。


  【不管怎么样都要去打的。】'

content: '祁荒离开城主府的步子不快。她把手拢进道袍的宽袖里，脚底的木屐在石板上踏出缓慢的嗒嗒声，路过偏房时天沼那扇窗已经暗了。她没往里看。外面的街道还是上午过来时的模样，但太阳已经从正午钉着的位置往西偏了约莫两指宽，光线变成一种刚从锅里舀出来的热橙黄色，把沿街町屋的暖帘都染成同一色调。


  风从西边吹过来带着摊上刚出锅的炸物油香灌了她一鼻子，她随手从身侧掠过的人群中捞起一个小孩，那个小孩在地上跑着被石子绊得往前栽了两步，她的手掌刚好从道袍袖子里伸出去托在他胸口上把他接住。


  小孩的身体很轻，衣服布料洗过太多次已经磨出了软塌塌的绒毛，那些绒毛蹭在她掌心里痒痒的。她把小孩放稳在地上，小孩没看她，脚底抹油一样往前蹿进了巷口。


  “这里的情况嘛——”她翘起嘴唇，舌尖顶着门牙把那口商业街的烟火气压在口腔里转了一圈才咽下去，“感觉很正常呢。”


  “啊啊。”她又摇了摇头。不是失望，是对这种正常感到一种说不清道不明的空，这里没人需要她，所以祁荒觉得很无聊。


  她把头往旁边歪了歪，几缕头发从耳后滑出来贴在她的脸颊侧面，“这样的世界啊——无聊，但不无趣。”


  她的脚步继续往前迈，视线从左边卖酒的摊子滑到右边搭着竹棚的茶屋。卖酒的老板正把酒坛子往台面上摞，最下面那个坛底磕在木台边沿发出闷闷的嗵声。茶屋里两个书生打扮的人正在付铜板，铜板落在桌面上的声音被街上的叫卖声一裹就没了。这些都是正常的。太正常了，正常得让她觉得有什么东西被刻意擦掉了。


  “太无聊了啊。”


  她的脚步在一个晚饭摊前停了下来。不是被叫卖声吸引的，是那张脸：红发、娃娃脸、娃娃脸的线条从颧骨往下走，眉骨骨峰比那人高了半寸，眼眶底下没有那人从战场上带回来的那种感觉。


  那人在油烟后面正把一碗刚盛好的味噌汤搁在客人的托盘上。穿着一件黑色的和服，衣袖在手腕处被一根细带子束得很紧，免得沾上灶台边的油。


  祁荒歪着头。


  【卫宫脸。又是一张。】


  “阿嘞？”她把头从歪的角度弹回来，这不是言峰士郎，不是那个被天沼拦下来后又被迫在正殿听伊耶那美讲晚饭故事的言峰士郎，那个士郎的眼神是暖的，再冷也有余温。这个人的眼神是凉的。


  不算冷，是凉，不是天沼那种把走廊温度都拉低几度的非人冷意，是刻意不管自己在别人眼里是什么样子的那种凉。


  “怎么还有一个卫宫脸？”她的声音不大，但从喉咙深处往外爬时带着一圈极淡的上扬尾音，像是在说一件她已经知道了答案但还是想看看别人怎么接这件事的话，“难不成卫宫脸已经泛滥了吗？”


  她嘴角勾起来，朝着摊子走去。


  红发男人正把炸好的天妇罗往竹网上搁。竹网在他的手臂被油跳了一下的时候晃了两晃。


  他抬起头看见黑发女人走过来，上下扫了她一眼，是摊主看客人的正常扫法——扫她的衣服面料，扫她脸上有没有饿的表情，扫她是一个人来的还是身后还跟着一群。


  他把手在腰间的围裙上抹了一把，围裙那层粗布已经被油浸得发亮。他朝外面那几张已经被坐满的桌子甩了甩下巴。


  “外面没地方了，来里面坐。”说完就低下头继续摆天妇罗，手指被油烫过的地方他用凉水冲了一下再搁回围裙上擦干。


  祁荒撩开暖帘，暖帘很旧了，布料底边被几年的进出刮得起了毛边，但洗得干干净净。


  她迈进店内的那一瞬间——暖帘在她身后晃回原位，外面的夕阳被挡在布帘后面，只从布料纤维的缝隙里漏进来几道极细的光线，光线投在地板上被桌子腿切成好几截。


  穿着和服的金发少女从桌边站起来，她的和服料子是深蓝色的底子上绣着银线走成的卷云纹，腰带的结打得极规整，整个人站在小板屋里像是一块被从别处挪过来的精致陈设。她抬眸看向黑发女人走进来的方向。


  然后她的表情停滞了一拍。不是害怕，不是惊讶，是她闻到了气味——祁荒身上飘过来的那股魔力波动不属于这个世界，细腻得像是一层极薄极薄的油膜浮在水面上，盯着看久了会感到眼睛被黏住。


  她开口了：“来。”


  祁荒低头看着这个小个子少女：“这里没想到能见到不列颠的人呢。”


  “我也没想到在这里能遇到菩萨。”阿尔托莉雅说道。


  “是魔性菩萨。”祁荒把暖帘在背后放好。暖帘底边最后一下晃动停在门框上。她走到阿尔托莉雅面前的空桌一屁股坐下，坐下时道袍的布料在木凳上蹭出轻微沙沙声。


  “把我当作菩萨那可就有点侮辱菩萨的名声了。”她把胳膊肘搁在桌面上。


  木桌面有几道被热锅底烫黑的圈印，她用指腹在那个圈印上轻轻刮了一下。刮完之后她的目光重新落在阿尔托莉雅脸上。“你是？”


  “阿尔托莉雅。”'

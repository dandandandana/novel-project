content: '“星之内海。”


  立香右手腕上的通信手环突然亮起了一圈淡蓝色的光，那位被称为万能之人的达芬奇听清楚了这几个字之后，声音从手环里钻出来时比平时高了起码半个音阶。


  达芬奇不可思议地开口：“等等！就算知道了在星之内海，立香他们也没有办法前往啊——那里根本就没有常规的物理坐标可以定位，连迦勒底的传送装置都打不开那扇门。”


  伊耶娜美把脑袋摇了一下，她右手放下酒杯的力道不重，但酒杯在桌面上磕出一声干净利落的脆响。


  “当然是有办法的。”


  她的阴阳眼从酒杯的方向转过来，左边那只金色的瞳孔把烛火收成了一粒极小的亮点，右边那只漆黑的眼睛依旧把光吞进去之后只在眼底浮了一层淡金色。


  她把视线停在了藤丸立香的脸正中央。


  伊耶娜美轻声开口道：“天照命金地的最深处，有废弃的通往星之内海的通道。”


  她把这句话说完之后停顿了片刻，她的拇指在自己腮骨下方轻轻摁了一下又松开：“大概跟你们了解的那个星之内海根本是两回事就是了。”


  “具体有什么分别呢？”立香问出这句话时把腰从椅背上往前推了半个身位。


  她的声音压得很沉，问句末尾没有上扬——不是在质疑有没有分别，是在要求对方掏出符合她手上已有情报的差异。


  “我又不知道你们的星之内海是什么样子的，怎么给你们具体的内容呢？”伊耶娜美回话道。


  立香的嘴唇抿了一瞬，她把前倾的上半身慢慢靠回了椅背上，靠回去的时候后脑勺在椅背的硬木横梁上轻轻碰了一下。


  “没事，这里的古怪已经够多了。我能接受。”


  她把搁在桌沿上的手翻了个面，手背朝上，指尖在桌面边缘轻敲了一次。然后她开口：“我明白了，那么可以继续吃庆功宴了。”


  她朝着言峰士郎和玛修的方向分别点了两下头，下巴朝下走的时候领口蹭到了她后颈上早就被汗渍过一次的衣料。她把椅子朝桌边拉近了半寸，弯腰坐下之后抬手拿起木勺从碗底舀了一勺汤。汤的热气从勺沿朝上腾起，她把凉气吹进勺子里——然后她才看见自己握着勺柄的那只手在抖。


  勺子在汤碗上方晃，瓷勺柄在她掌心轻轻磕着虎口边缘，晃的幅度很小但频率很快，连带着碗底的汤汁也晃出了一圈极细的波纹。


  士郎没有开口问。他把一双干净筷子从桌上拾起来夹了一块烤得偏焦的乳猪皮搁在立香碗里。然后他停了停。


  “天沼前辈的菜很好吃。是专门研究过这里的东西的吗？”


  天沼顺势把接话权接住了，他点头时下巴朝脖子方向收了一截，常年不变的脸上没有挂笑意，但他的声音在原本平稳的基础上朝上浮了一点点温度，像是把冰块推到了酒杯的另一侧腾出了半指宽的空隙：“是的。在这里待的时间久了就能做出像样的饭菜了——主人也很喜欢。”


  在这二人将桌面上那层紧绷的薄膜挑开之后，剩下的人重新开始动筷子。千子村正夹了一块肉搁在玛修碗里，玛修道了谢小口地嚼着。


  吉尔伽美什给自己添了最后半杯酒，晃了晃酒杯。桌面上的汤碗和碟子在重新动起来的筷子底下撞出一片细碎的瓷响，但每个人脸上都还在消化刚才吞进去的那些真相——炖肉的热气和酒杯的碰撞声堆在桌上，心事沉在碗底，融洽这两个字不形容现在这桌人的气氛。


  剩下的庆功宴没过多久就吃到了尽头。虽然被伊耶娜美那句“可能要和我为敌”硬生生搅了几次，但立香到最后一碗汤喝干净之后还是美美地拍了拍手——巴掌在胸前拍了两下，响声清脆干脆。


  “感谢天沼和士郎，还有吉尔伽美什——酒也谢谢你。”


  “前辈，你的心还真大啊。”玛修嘴上说着，她把筷子搁在碗沿上，从袖口里掏出手帕在自己嘴角擦了擦，抬起头看向伊耶娜美时声音比刚才那个吐槽正经了一个调门：


  “不过这一顿确实很好，感谢伊耶娜美大神的信息——不管之后要怎么做，至少有方向了。”


  立香把椅子朝后推了半尺，站起身子时衣摆在椅子腿的木腿上挂了一下又自己滑了下去。她朝所有人点了点头：“那么，我先去休息了。”


  她刚朝门口方向走了两步。


  “藤丸立香——我……”千子村正的声音从背后拽住了她。


  立香停下脚步。她的鞋跟在石板上磨了一道淡淡的擦痕，小腿先转了回来，然后整个人才完全转向村正的方向。


  她看着村正时微微偏了偏头。


  村正把双眼闭上了。她脸上不再是刚才给玛修夹菜时那个和气而平静的表情——压在眼皮底下的什么东西在自己翻涌，翻完之后她的唇缝阖了阖又把嘴角拉平。


  她吸气时肩膀朝上抬了一寸，呼出去之后眼睛重新睁开了。


  “藤丸立香——我真的，真的非常感谢你。”她开口时每个字都像是把一块刚淬完的短刀从刀槽里拔出来——刀刃还在微颤，但握着刀柄的手已经稳了。


  “村正……”'

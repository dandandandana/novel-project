content: '士郎见状开口时语气从刚才的试探往回收了一层，像把刀尖从对方颈侧朝外挪了半寸——继续往前是刺，但他先撤回来了:


  “啊啊——看样子已经很明确了。天沼，你隐藏了很多事情。”他想了想之后重新开口，“既然如此——”


  “你身为伊耶娜美的武器，为什么你会有她不知道的事情呢？”


  “这种原因很多吧——这并不意味着什么。”天沼的解释从嘴里出来时每个字都发虚，他自己也知道这句话苍白得连廊下挂着的提灯都晃不动。说完之后他把嘴闭上了，嘴唇抿成的线条和他常年凝固的表情一样平。


  “在这里，你和她近乎是形影不离，你所知道的她不可能不知道。”士郎把语速放慢了半拍。他把“不可能”三个字中间的顿点压得格外清晰。


  然后他顿了顿——那个停顿不像刚才天沼那样的沉默，而是他的脑内正在把所有排着的线索往交锋点的中心推了一步。“也就是说——伊耶娜美，从来就不是你的主人。”


  “嗯？”天沼只吐了一个音节。这个音节被压得很低，但尾音朝上翘了一点点。


  “当然，我所作的这一切推断都建立在一个前提上——你有事情瞒着伊耶娜美。”士郎把手从和服袖口里抽了出来，手臂垂在身侧，掌心对着廊下的木质地板。


  他说这句话时没有看天沼，而是在看他脚边自己的影子:“如果我没有猜错的话——这位主张着世界的创生、能够搅动混沌和虚数空间的伊耶娜美，从来就不是本人。”


  “嗯哼？”天沼这一次的发声比上次多了半拍，他眼角的纹路在月光下被拉长得格外分明。


  “伊耶娜美被称为黄泉津大神，但这都是后来的事情了。从创世女神到黄泉津大神的身份转变早就写进了神话——”士郎的琥珀色眼睛抬了起来，“时光不能倒流。所发生的一切事情都铸就了现在的人，人们无法否定自己的过去。”


  他把手臂抱在了自己胸前。灰色和服的袖口垂在那道被他踩散的月光断面上。


  “而你的这位伊耶娜美，她在这个金地里从来没有流露出任何一个被丈夫嫌弃过、被折辱过的女人该有的东西——不是不去想，是像是那整段过往在她的记忆里就从来不曾在过。就像一整本书中间被某只手撕掉了最痛的那几页，却维持了封面依旧完好。”


  他的声音在这句比喻落下去之后朝下降了一个全音。


  “所以我认定——你所侍奉的伊耶娜美，从来就不是真正的伊耶娜美。我说的对吗，天沼？”


  天沼没有回答。廊下的两盏提灯在无风的夜里一动不动地烧着，一长一短两条灯影印在木质地板上印得格外深。天沼盯着脚边那条被士郎踩散的月光断面——断面重新铺好了，银色被提灯的暖光盖了一层淡黄。


  然后他呼了一口气。这口浊气在夏末的深夜里还能微微看见白雾，从嘴唇缝里漏出来之后在月光前排成了一小片极短的模糊。他的瞳仁没有眨。那片白雾散了之后他依旧没有说话。


  而沉默本身就是他最精确的回应。'

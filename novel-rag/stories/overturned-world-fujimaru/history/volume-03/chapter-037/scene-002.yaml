content: '“直接走过去就好了。”他开口时声音仍和平时一样平稳，和他昨晚在廊下被士郎逼到墙角时说话的音高毫无差别。


  随后他一步迈出，整个小腿直接没入了山壁。裤腿的布料在山壁断面处稳稳地停着——腿已经过去了，裤脚还在外面飘。那个画面比任何光效都更让人头皮发紧。


  立香跟了上去。她在山壁跟前停了一下，伸手摸了摸山的表面——掌心贴上去的触感凉凉的，石头的粗粝竟然还保留着。但她把手朝前再伸的时候，手指头根本没碰到任何阻碍，整只手一下子穿进了山。


  她缩了一下手指，确认自己的五根指头都还在掌心弯着，然后朝前一迈。整个人穿过山壁时皮肤上没有碰到任何东西，但耳朵里能听见自己心跳在穿过那层幻象时被四面密闭的空间弹了一下。


  她抬起头，脚踏上了另一侧的地面。她的整个面孔在看清眼前的景象后一下子收缩了。


  彻彻底底科幻的地方。


  整个地板是不知名的合金铸的，没有抛光，半哑的灰色既不吸光也不反光——光从头顶的天花板铺下来之后走到地板前方就停住了，不能再往前继续推进。


  地板和墙壁的接缝处有中世纪样式的城垛纹饰，但那些花纹是被精密模具压出来的，每个弯角都有倒棱后的圆角弧面，不是匠人的手敲出来的。


  天空中的穹顶立香找不出有什么光源，但光线均匀得过分，每个角落都没有影子，每个合金板上的铆钉都显示在同一个平面上没有任何远近。


  “这是……”她用步子走到大厅中心附近，指着中间那个闪烁着蓝白色光的平台。平台表面是一整块光洁度极高的平面，蓝白的光从平台背面穿过面板面层朝外溢，不是照出来的是从面板里自己发的。“这是什么？”


  “你竟然没有问这是哪里？”天沼反问时把下巴朝她的方向转过来，语气里没有疑问只有确认。


  “这里的地方奇怪的很多，就算是战国时期出现坦克我也不会惊讶了。”立香把视线从平台上挪开，瞥了他一眼。


  天沼点了点头，下巴的动作干净干脆。他沉声开口时字和字之间咬得比刚才紧：


  “那里是前往星之内海的地方。楼梯一样的东西。”


  立香眉心攒了起来，眉间的细纹在穹顶的无影光下被拉得格外分明。她顿了顿——顿了那半拍的时间里她的目光在天沼脸上和自己的队友之间来回移了一次。


  “村正。”


  千子村正对上她的眼睛，村正一歪头时肩上扛着的妙法村正刀柄和她的鬓角碰了一下。


  “啊，我知道。你不放心对吧。”


  她把左手摊开，蓝色火焰从她掌心里自己缩成一团，收缩时火焰在空气中发出了一片枯叶被握碎的一连串轻响。


  火团在掌心停了几拍之后把自己折叠成了一朵蓝色蝴蝶结。


  她把蝴蝶结递到立香手中——蝴蝶结在立香手指间凉凉的，触感和金属传送台的地板完全一致。


  “如果我出事了，或者说是受伤了，这个蝴蝶结就会有反应。到时候你们别下来就行。”村正说时把刀从肩上拿下来，双手握在了刀柄前端，朝传送平台走去。


  天沼朝中间的按钮点了一下。按钮没有压下去，表面那一层蓝光被碰之后朝四周荡了一圈光晕。村正站在平台正中央，朝立香竖了个大拇指，然后她站的位置忽然变成了干净的空气。没有声音，没有光，她脚边的灰只是被轻轻吹了一下。然后她就不见了。


  立香盯着手里的蝴蝶结。蝴蝶结的蓝色火光软软地叠在她掌心，一秒，两秒，几拍呼吸过去了它还是安安静静的没有任何变化。


  立香歪了歪头，前额的头发跟着歪脑一起朝左滑了半截：


  “不太对劲……我等一会。”


  “前辈？”玛修偏过头看着立香。她的眉毛微微朝上挑了一道浅弯。“有问题吗？”


  立香在心里想了想——天沼可能会做手段，吉尔伽美什能操作这个按钮必须在这儿控住退路。


  她抬起头时眼睛已经做出了决定：“吉尔茜，我现在需要你在这里待着。”


  金发的王从宝库的涟漪中把一只手抽出来，倚在传送台对面的合金墙上。


  “由你来为我们开关这里。”立香转向天沼时话音刚落，她的视线从吉尔伽美什脸上移到天沼攥着袖子的手上，“你刚才应该看懂了吧。”


  吉尔伽美什微微扬了扬下巴，她的金发在无影光下被匀成一片均匀的淡金色。她把步子从墙边弹回中间，朝传送按钮走去时靴底在地板上踩出两声不紧不慢的响：“我明白你的意思，去吧。”


  她朝着天沼走过去时步子没有停，天沼看她逼近到按钮跟前才把双手从操控面板上拿开。


  他慢慢后退，木屐退了一步又退了一步，让开关位给其他人。


  立香率领众人走进平台，脚下的合金面板在脚底传来了一层极轻微的高频微振。吉尔伽美什伸出食指，轻轻地在按钮中间点了一下。'

content: '她眼里的黑红色彻底散尽了，取而代之的是原本属于她的琥珀色瞳孔同从前一模一样的光。她的声音从她喉咙里送出来时，不再是咬着牙的怒，而是把每个字都拆清楚了才出口：


  “不止为了报仇，是为了月读命金地的人——月读命本该是秩序的场所。现在这样子，你们让他们痛苦到了极点，于是苦也不苦了，痛也不痛了，这个样子就已经无比满足，于是得到极乐。”


  “让他们连哭都不会，然后指着他们的笑脸说这是极乐，这是太平。”她朝脚下那片被雷劈过又被瞬间修复的石板看了看，“这算哪门子极乐。”


  村正话音刚落，整片大地震动了起来。不是被天上雷霆轰出来的那种震——是从深处朝上涌的震，石砖在抖动的同时发出了极细极低的嗡鸣。


  那嗡鸣是土地发出来的，是地底下的神尸哭出来的。


  月读命死了有多久，没有人能说清，骨头里残存的一点点意识被村正的声音唤醒了，它记得这声音——不是从耳朵听见的，是从金地的术式脉络里直接渗进来的。它在悲鸣，因为它听见有人终于把一句真话砸在了这片被弥勒压了许久的土地上。


  悲鸣从神尸里涌出来传进了整片大地，大地又把它传递给每一具被弥勒榨干之后埋进土的凡人遗骨。月光的颜色忽然从冷白变成了接近青的淡蓝，从天空朝村正身上倾泻下来——不是滴，不是洒，是像一盆水从头顶浇下来那样整片整片地涌。


  月光盘旋在她的双肩、腰侧、握剑的手臂上，把她身上从德川家光攻来时沾上的灰烬和血迹一遍一遍地洗刷。


  那不是简单的光——是月读命留在这片金地里最后的意志，它认可了这个站在百姓头顶替他们挡雷却自称恶人的少女。


  月光缓缓渗进村正的体内，从皮肤一路渗到灵基。


  紧接着，她的身子里同时亮起三道不同颜色的火光。先是怨仇的黑红火焰——从胸骨正中心朝外涌，压在最底层。然后是清净的青白色月光——在肩头和额头亮起，像两片极淡的护甲。最后是灼阳的金红火焰——从她背后猛地炸出来，火舌窜到她头顶才收了回来。黑红在下，青白在上，金红在后，三色火光交错映着她的脸，却谁都没有压过谁。


  “三种？”德川家光的喉咙里滚出一声自己都没意识到的抽气。“清——”


  “清净之禊祓——为什么月读命金地会承认你！天照的灼阳和你的怨仇还可以解释……但它！它凭什么？”


  村正没有回他的话。她把太刀从鞘里拔了出来，刀刃的锋口磨过鞘口时擦出的声响比满天的雷还要沉，还要稳。她把剑尖对准德川家光的石像眉心，嘴唇动了动。


  “斩尽三千繁华梦。”


  村正挥刀了。'

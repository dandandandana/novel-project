content: '然后她抬起头，视线越过攒动的人头，落在街边那些瘦削的摊贩身上。一个卖鱼干的老头正在用一块湿布盖住筐里仅剩的三条小鱼，他的脖子细得能看清每一根筋，但嘴里哼着小曲。调子拖得很长，晃晃悠悠的，尾音往上一挑，像在逗弄什么看不见的东西。


  “这一路上走过的地方，屋顶都用了烧瓦。”玛修说着，把手从长袍底下伸出来，指了指屋檐的方向。她的指尖顺着瓦当的轮廓虚虚划了一道线，“原本的历史里，这种烧瓦普及到平民街巷，至少要往后推两百年。”


  立香把手表往上推了推。“意思是有人提前给他们的？”


  “不，前辈，比那更奇怪。”玛修的声音依然很平静，但立香听到这里已经开始觉得后背有点发凉了。不是因为玛修说的事情有多了不得，而是玛修说话的语调太平静了——她的搭档在这种时候越是平静，发现的异常就越细，越是细，麻烦就越大。


  她们往前走了一段，街边有个茶铺子，木架子上摆着几只碗，碗沿豁了好几处，碗底倒是干净的，残留着茶渍。茶铺的主人看见她们，咧开嘴笑了笑。那笑和他脸上的菜色几乎形成了某种立香没法形容的反差，她后来跟士郎说起这件事的时候只用了两个字——折寿。


  通讯器里忽然传来一阵细微的电流声，紧接着是士郎的声音，语调压得低沉。他每次用这种语调说话都意味着发现了某种超出预期的情况，“御主，有点奇怪。”


  立香把手腕抬到嘴边:“什么？”


  “嗯……”士郎的声音犹豫了一下。他很少犹豫，他一犹豫，立香的眉头就跟着皱了起来，“我见到了女性的宫本武藏，和一个叫做千子村正的参赛者。”


  立香的表情顿时松了下来。


  松得太过突然，连玛修都偏过头多看了她一眼。


  宫本武藏——那位在战国末期至江户初年打遍天下无敌手的剑豪，严流岛一战让佐佐木小次郎成了传说的那个剑客，在这个特异点里是女性。


  她把这句话在脑子里过了一圈，发现居然没有激起任何波澜，连一点惊讶的渣滓都翻不起来。


  她开口的时候语气几乎是懒散的，“啊，这种事情已经见怪不怪了，毕竟吉尔伽美什和亚瑟王都能是女性，为什么宫本武藏不能是女的呢？”


  “好的，完毕。”


  “继续侦察，这次吉尔茜没有来，一定要小心。”


  通讯那头的士郎没有马上回话。他一沉默，立香的脑海里就浮现出他的样子——蹲在高塔的阴影里，红色的短发被风吹得微微晃，眼睛半眯着盯着台下的人，嘴巴抿成一条线。


  士郎蹲在塔楼的木梁后面，脊背贴着粗粝的木柱，木柱上满是风吹日晒留下的裂纹，每一条裂纹的深浅他都能感觉到。


  僧袍的布料蹭着他的肩膀，那个僧侣就站在三步开外的地方，手扶着栏杆，光头上泛着一层油腻的亮光。僧侣的手腕粗得像塞了两节萝卜，握着的权杖是铁铸的，杖头雕着他不认识的花纹。


  士郎的目光扫过台下的人潮，僧侣脸上的肉随锣鼓声震得微颤，嘴角挂着一丝不紧不慢的满足。士郎越过他，把视线沉进大宅内那方擂台上。


  擂台是实木搭的，每一块木板都厚过一拳。擂台边沿站着几个同样油光满面的僧侣，穿着统一的灰色僧衣，个个面色红润，和气洋洋，跟台下那些麻杆似的人群差不多属于两个物种。


  宫本武藏站在擂台中央。


  红色的外衣裁剪到刚好露出腹肌和锁骨，胸口那片衣襟松垮垮地挂着，被风吹得一下一下拍着皮肤。她把太刀扛在肩上，刀背贴着自己的后颈，刀刃朝上，冷冷的光刺破了擂台上那个男人的视线。她低下头看着那个男人，嘴角带着一点上扬。


  男人手里攥着一柄打刀，刀身没什么光泽，刀刃上还有好几处卷口。他握着刀的手稳倒是稳的，但站在武藏面前，那份稳看起来反而像困兽最后的逞强。


  锣声响了。


  武藏没有等男人站稳。脚底擦过木板发出很短的吱声，她的身体压低，左手扶鞘，右手的刀已经扫了出去。


  第一刀，斜劈。刀锋切开空气的声音很干，像一张硬纸板被猛地撕开。男人举刀格挡，两柄刀撞在一起闪出一串火星，刀刃相交处发出刺耳的尖叫。


  武藏的第二刀根本没有收回，借着被弹开的力道翻腕往下压，刀背砸中男人的手腕。手腕一抖，打刀在主人手里晃了晃，差点脱手。男人咬着牙把刀重新稳住，脚下退了半步，膝盖微弯想扎稳马步，但武藏的刀已经画了一道弧线绕到侧面。


  那招居合的启动快到让士郎的眼睛都跟丢了一瞬。


  她收刀入鞘的动作看起来像是准备结束战斗，只是在合拢刀鞘的那一刹那，刀鞘口忽然炸开一道弧光。太刀出鞘的速度大概比士郎眨一次眼还快，刀身在空中留下宛如银针般的线影，一闪即逝。'

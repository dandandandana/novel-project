content: '那种下跪的方式不是卑躬屈膝，是某种更深层的东西，像是他跪的不是她们，是他心里的一尊神。而现在，同样肥头大耳的僧侣就站在擂台边上，面泛油光，满脸横肉。阶级划分，立香心里浮起这个词。这个特异点的贫富差距不是体现在钱上，是体现在体重上。


  “难不成是看面相？”立香把心里的猜测简化成了一句半开玩笑的话。


  手表里忽然响起电子音，那声尖锐的滴滴滴在嘈杂的人声里显得格外刺耳。立香赶紧用袖子盖住表盘，压低嗓子:“喂喂，所长，都说了现在不要通话啊！”


  奥尔加玛丽的声音从手表里传出来，因为距离太近，声波被压得很扁，像是隔着一层玻璃在说话。“抱歉抱歉，哈哈忘了这茬了。”她的笑声永远是那种不太会看场合的笑，立香听出来了她是在用笑掩盖紧张。


  “总而言之这里的阶级划分貌似很奇怪，你们要小心。”


  立香把手腕贴在嘴边回了声收到，士郎站在玛修和立香中间，把自己的站位调整了一下，面朝门的深处，背朝墙，眼睛扫着周围涌动的人群。那些瘦削的市民还在往里挤，脸上的微笑没有褪过半分，有人被挤倒了马上又爬起来，一边拍打衣服上的灰一边笑。


  立香抬起头，正式地第一次看向那座高耸的大门。大门是用整根原木做的，没有一根铁钉，全是榫卯结构，门楣上挂着的匾额写着她不认识的汉字。木头的颜色是很陈旧的茶褐，风化出无数细小的裂纹。那扇门比她想象中要高得多，黑沉沉的，像一张没有表情的脸。


  “那就从这里的剑豪比拼开始攻略这个特异点吧。”


  她说这句话的时候没有看着士郎也没有看玛修。她的视线还挂在门楣上的匾额上，匾额被风吹得晃了一下，铁链摩擦的声响很细，消失在人潮的噪音里。玛修向前跨了半步，肩膀挨近了立香，回头看了士郎一眼。士郎点了点头。


  锣鼓又响了。擂台上武藏的身影已经退到了台边，正在用衣摆擦刀，刀身上的光一闪一闪的，忽明忽暗。另一侧，灰羽织兜帽少女把铁刀翻转过来迎着阳光端详刀身，刀身上没有一丝划痕，光滑得像是从未被挥出过。她的兜帽被穿堂风吹动了一下，掀开了一条缝隙，但还没等任何人看清底下的脸，她已经伸手重新压住了兜帽，只留下一个过于纤细的手腕和虎口上的老茧。


  玛修收回视线，用肘尖轻轻碰了碰立香的胳膊，低声说，“前辈，那个刀匠，给我一种很奇怪的感觉。”


  立香侧过头，“怎么说？”


  “那柄铁刀，只是一把练习刀，每一点刃光都像活物，好像在呼吸一样。”


  立香沉默了片刻，然后迈开了步子。“走，进去看看。”'

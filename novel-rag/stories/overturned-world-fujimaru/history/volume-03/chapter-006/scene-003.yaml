content: '达芬奇的声音插进来，语速比平时快了半拍。“不……并不是。立香，这里的空气中并没有以太，而是正常的魔力。你能明白吧立香。”


  立香把后脑勺靠进玛修的臂弯里，盯着上面不断往后退的夜空，眼珠子跟着一颗星星从屋顶的右边挪到了左边。


  “啊我当然知道。你的意思就是这里的魔力浓度超乎正常，而且并不是神代，正常的人类也能够存活是吧。”她把话咬得一字一顿，像是在嘴里面嚼碎了再吐出来，确保自己没听错任何一个字。“还有别的吗？”


  “没了，立香。剩下的靠你们了。”奥尔加玛丽说完这句话之后，表盘里只剩下电波的背景噪音。立香拍了拍通讯器把它关上。她偏过头去看从玛修另一侧臂弯里垂下来的千子村正——红发已经散得不成样子，贴在她被汗糊得发亮的侧脸上，太刀被她搂在怀里，刀身上的火焰已经全熄了。


  立香把脸转过来，看着村正。然后她把嘴往上一扯，扯出一个笑容，“啊啊，虽然不知道这里到底什么情况。但是我们……”说着她把嘴又往上拎了拎，把剩下的气托上来，“我们现在是一条绳上的蚂蚱了。”


  村正没出声。她偏过头从玛修的臂弯缝里看了立香一眼，琥珀色的眼珠子在月光的余亮里映了一个很小的点，那个点跟着玛修的脚步颠了一下又一下。然后她重新把脸埋进了玛修的盾沿，什么也没说。


  盾牌上的银光正在一点一点地褪下去。光从盾面的边沿开始往回收，收得很慢，像是退潮的时候潮水恋恋不舍地从沙滩上往回蹭。


  盾面上那些被魔力灌满之后亮起来的纹路重新沉入了金属的冷色，只留下边缘还有一圈微弱的白线勾勒着这面盾的轮廓。


  立香从玛修的肩膀上往后看了一眼。后面的屋顶上，那个红发的影子还在，脚步和她三人保持着同样的节奏，不远，不近，隔着一段月光的距离。


  “南方，对吧。”她开口的时候没看村正，眼睛盯着前面那片正在慢慢变大的城墙剪影。


  村正的声音从玛修臂弯里闷闷地传来。“嗯。”


  城墙的轮廓在视野里越放越大，月光从墙垛的缺口里漏下来洒在三人身上。


  玛修靴底的节奏没有变，一步接一步，踩碎的瓦片在她身后哗啦啦地往下掉，掉进巷子里那些还没来得及抬起来的黑色人影中间。立香把脸转向前方。'

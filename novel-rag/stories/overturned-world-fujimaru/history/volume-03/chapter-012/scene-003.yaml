content: '“如果不是迦勒底的人你就死在月读命了。”伊耶那美把最后几本折子合上，合上时纸页夹在一起的啪声在安静下来的正厅里格外清脆。她从书案下拿起一根细麻绳，在折子上绕了两圈，抽紧，然后把那一摞折子交给不知何时已经站在她身边等候的下人。


  “麻烦了。”


  “我——”村正低下头。她的太刀从臂弯滑进手掌，刀鞘底部轻轻磕在木地板上。


  女人看着村正低下去的头顶。她叹了口气，这口气从鼻腔出来时顺带把她批折子时憋在胸口的那股倦意一并带了出去：“先坐吧，我让天沼先去做晚饭。”


  女人抬眸看向立香一行人，她的左手还搁在书案上，右手搁在膝上。她把搁在膝上的手抬起来，两只手掌在面前轻轻合了一下，清了清嗓子：“抱歉，让你们久等了，迦勒底的贵客。”


  立香把搁在士郎手腕上保持平衡的手收了回去。她的脊椎往上提了一点，肩膀往两侧撑开，橘色眸子的焦距重新合在伊耶那美脸上。


  这张脸太年轻了——年轻到你在街上遇到她会以为是哪个官宦人家的小姐，而不是统治一片金地的世尊。但那双眼睛不是年轻人应该有的眼睛。赤色那只太深了，而碧色那只太冷。


  “我的名字是伊耶那美。”伊耶那美把右手重新放回书案上，手指交叉搁在最后一本还没来得及批的折子封面上。她说话时像是在报一个她说过无数遍的名字。


  “村正应该告诉你们我的身份了——我就是天照金地的世尊。”


  立香的脑袋轰的一声。


  【谁？】


  不是天照大神。


  不是那名太阳神，她在脑子里已经把“世尊”这两个字和天照大神绑在一起绑了好几天——金地的太阳固定在正午，八咫镜反射日光，世尊掌管金地，这一切都指向那位日之女神。


  但伊耶那美坐下对她说话时她脑子里所有的预判像被一只手搅乱的牌，哗啦啦撒了一地。


  伊耶那美命——黄泉津大神，那个在神话里被丈夫追进黄泉、因誓言而追杀、最后成为黄泉之主的伊耶那美命——正坐在一张矮书案后面用刚才砸村正的同一只手给折子画着墨点。


  玛修的盾咣当一声砸在了木地板上，盾底的金属边沿砸下去的力道在地板上震出肉眼可见的颤动，旁边的烛台跟着抖了两抖。


  “什么？您您您您是黄泉津大神伊耶那美？”玛修的嘴巴变成了O形，她的紫色眸子瞪得比平时大了整整一圈，瞳孔因为震惊而扩张到几乎把虹膜挤得只剩极细的一圈紫色。


  “完完完完全看不出来啊——和神话里完全不一样啊——”她说“神话”两个字时声音拔高到破了一瞬。


  “你说的那是黄泉津大神时期的我了。”伊耶那美的视线从玛修的盾挪到玛修的脸上


  。她的嘴角往上一挑，挑上去的幅度刚好能让人感到她在笑，但笑意没有传到眼眶。


  “和你们想的大概很有区别了，因为神话毕竟只是故事。”她把“故事”两个字说得很轻，像是在说某个她认识很久但已经不太往来的旧友。


  立香在心里狠狠抽了口气。她把自己的表情从惊讶重新调整回指挥官应有的平稳。


  “初次见面，伊耶那美大神——看来您是知道我们的历史的。”


  “我当然知道。”伊耶那美说道。她把被折子墨点弄脏的指尖在桌沿上抹了抹。“不过知道的并不算多就是了。”


  “那么——”立香往前迈了半步。这半步迈得很快，快到她说完第一个字的时候脚掌已经落稳在地上了。“这里到底发生了什么？我们需要知道这个，请您告知我们。”她的声音在这句话里完成了从礼仪到正式的全程切换。


  伊耶那美想了想。她把搁在折子上的手指收回去搁在下巴上，她勾起嘴角，嘴唇被手指挤出一个极浅的笑纹，然后她看向还站在原地的村正：“别在那儿站站着了。”


  村正把太刀从手掌里松了一下，她走到桌边拉开凳子坐下，凳子的四只脚在木地板上蹭出短促的嘎吱。


  “啊啊，那可就是一个很长的故事了——”伊耶那美歪了下头，歪头时她右耳上挂着的那颗勾玉轻轻晃了一下，勾玉碰到她颈侧的布料发出极轻的细响。“要听吗？”


  “请您讲述。”立香把这两个字用标准的敬体推出去。


  “好的，那就晚上吃饭再讲吧，最近收成不好，可能没法让你们满意了——”伊耶那美把撑着下巴的手放下来搁在书案上，拇指和食指捏着最后那本折子的封面。


  然后她把目光投向了言峰士郎。这道目光不是扫过——是定点。她的阴阳双眸从他的额头发际一路往下滑，滑过他的眉骨、鼻梁、嘴唇、下巴线条，最后停在他胸口的某个点上。


  她看他的眼神和看立香时不同——看立香是接待贵客般的打量，看士郎是确认般的一扫，像是在检查一件很旧的东西还在不在原位。她看了他一眼，一眼的时间短到别人也许不会在意，但她的嘴角在那一眼的尾端微微压了半拍。


  然后她把目光移开，重新看向立香。'

content: '立香转过头，朝士郎挑了挑下巴:“你有预料到这个发展吗？”


  村正在人群里走得很慢，灰色的羽织在人缝里晃了几晃拐进了一个角落，然后不见了。


  “当然没有。”


  玛修把兜帽往后拨了拨，露出半张脸。她的眼睛转了一圈，看了看擂台上正在被僧人簇拥的武藏、台边还没散尽的人群，以及角落里那个灰羽织消失的方向。然后她开口的时候语气很轻，像是在课堂上举手提问的学妹：“前辈，这里为什么要举行剑豪比拼呢？”


  “这个问题我们并不需要知道吧，我们只是要和当地的势力接触——”立香把视线从玛修脸上挪到士郎脸上，她的话茬掉了，中途被另一个问题接了过去。“士郎，报告情报。”


  士郎叹了口气，是那种很轻很干涩的叹气，没有不耐烦，只是单纯的疲惫。他把声音压到只有三个人的耳朵能捕捉到的程度:“我观察到的信息是，得到首位的人能够参拜德川家供奉的法相，第二位有资格参拜摩诃。”


  立香愣了一下。她张了张嘴，想说什么又咽回去了，然后低头把袖子往上捋，露出腕上那块表盘，把嘴唇凑近通讯器：


  “所长，靠你了。法相，摩诃，这怎么听都是佛教的东西，完全是我的知识盲区了。”


  表盘那头传来奥尔加玛丽的声音，电波干扰声里她的语速很快，显然早就在等这茬了。“啊啊我知道了，查到了立香。法相在佛教里指的是包含外延与内涵的现象呈现——外表和内在一起呈现。”


  “摩诃，代表超越世俗的智慧与境界。”


  立香听完关掉了通讯器，抬头看看士郎，再看看玛修，然后又把嘴抿了起来。玛修额角淌下一滴汗，声音有点僵:“好像和所长解释的不一样啊，前辈。”


  “怎么说都是佛。那么接下来——”立香把视线从手表上抬起来，转向内殿深处那扇紧闭的大门。那扇门比她预想的要高，黑沉沉的，门板是整根原木做的，没有一根铁钉，全是榫卯。她还没看清门上的雕花是什么图案，门就从里面被推开了。


  走出来的人穿着灰色素衣，腰间随便用根麻绳一束，别着一柄刀。他的脸很瘦，颧骨凸出来，眼窝凹进去，看起来比擂台边上那些油光满面的僧侣顺眼得多。


  他走到擂台前，转身面朝底下还没散尽的人群，清了清嗓子。“今天的比拼到此结束。贫道名为德川家纲，请各位退下吧。”


  人群开始往外涌。草鞋踩在木板上的声响，竹篮磕碰的声响，孩子的哭声和大人的呵斥搅在一起，整条街都轰隆隆地动。立香侧过身，和玛修对了一眼。玛修眨了眨眼，点了头。


  她们逆着人流朝擂台走去。人潮从两侧涌过来，肩膀蹭着肩膀，肘尖顶着后背，每走一步都要先侧身再挤进去。士郎把手搭在立香后背，一步一步推着她往前走。


  宫本武藏站在擂台边上，一只脚踩在台沿的木栏杆上，太刀斜靠在肩头，正用一块不知从哪掏出来的白布擦刀身。千子村正站在她身后几步远，灰羽织的衣角轻轻地晃着。


  村正一直在盯着这边，兜帽遮了大半张脸，看不清她的眼睛在看谁，只能看见那颗戴着兜帽的脑袋微微偏了一下。人群慢慢散尽，最后滚在木板上的只有几片踩碎的干菜叶和一个被踩扁的竹筒。德川家纲转过身，视线一一扫过面前这三人。


  “啊啊——”他开口的时候拖了个很长的调子，缓慢而郑重，“不被金地所祝福的来客啊。报上你们的名字。”


  立香在心里把不被金地祝福这几个字翻了一遍。


  她的脑子转得比她脸上表现的要快，早在进特异点之前她就已经习惯了这种突发的变故。她向前迈出一步，把后背挺直，肩胛骨搁在安魂曲的后坐力上，那个沉甸甸的重量让她站稳了。


  “我们来自人理修复机构迦勒底，目的是修复这里的特异点，拯救人理。”


  德川家纲的瞳孔缩了。


  黑色的瞳仁急速收缩，缩成了针尖大的一点，他整张脸的血色在那两个字之后彻底褪走，面皮白得像刚刚刮过的鱼鳞，嘴唇张开又合上，合上又张开，喉结滚了好几下，愣是没滚出半个字。


  然后他跪下去了。膝盖撞在木板上，发出很闷的咚的一声。他磕头的动作很大，额头砸上木板的时候震得地上的灰尘往上跳了一下。每一次磕下去，他都在说:“恕小人有眼无珠，不知法相尊驾降临——恕小人——”


  立香被他这个举动惊得往后退了半步。


  恐惧。


  他能把额头磕进地板缝里，那一块木板上沾着的都是他额头渗出来的血印。她稳住脚，清了清嗓子，把声音压平:“法相？”


  德川家纲没有抬头。“大人请跟我来，请跟我来，小人这种身份不该直视尊颜，请跟我来——请——”


  立香抱起了手臂。她闭上眼，头微微往上一扬，下巴抬起来，嘴唇只动了很轻的一下:“那就带路吧。”


  玛修靠过来，凑在她耳边，用的是只有两个人能听见的气声:“前辈，现在没搞清楚情况，这样好吗。”'

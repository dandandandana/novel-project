content: '立香睁开眼，抬手拢了拢耳边的头发。她压低声音，“只能这样做了，玛修。大不了打出来。”


  她侧头，给了士郎一个眼神：“尽可能不伤及无辜。”


  士郎没说话，微微点了下头。德川家纲颤颤巍巍地站起来，膝盖还打着弯，腰背弓得像是永远直不起来了。他转过身朝内殿走去，每走两步就回过头来半躬着腰确认立香有没有跟上。一只麻雀在檐角扑棱着翅膀飞走了，掉下一片灰羽，飘在半空。


  旁边的武藏忽然凑了过来，带起一股汗和锻铁混合的热气。“迦勒底是吗？我是这个特异点的Saber职介的从者，宫本武藏。”她笑着，嘴角还带着刚才被村正气出来的不甘心，“把我当作友军就是了，这个地方，嘿，怪也怪得很。”


  玛修愣了一下。她还没来得及适应这种不等你介绍就自己挤过来的自来熟，嘴巴在回答之前先哈了一声:“我是玛修·基列莱特，前辈的从者。”


  “Ruler。”士郎顿了顿，“名字并不出名，言峰士郎。”


  武藏歪头想了一下，想得眉头都皱起来了，然后放弃。“确实很不出名啊。”


  “藤丸立香。”立香侧过身朝武藏点了点头，“迦勒底的御主，来修复这个特异点的。”


  “啊啊，知道了。”武藏又把笑咧开了，整个人往立香这边凑过来，肩膀眼看着就要蹭上立香的肩头，那张饱满的、意气风发的笑脸几乎要挨到立香的太阳穴，“接下来就并肩作战啦。”


  立香缩了。她往士郎那边靠了半寸，肩膀贴上了士郎的手臂。她咳了一声，“武藏——请你别靠这么近。”


  “叫武藏亲就好啦。”


  “好的武藏亲。”立香的肩膀还贴着士郎的手臂，她没让开。“你有发现什么吗。”


  “当然有。”武藏的声音忽然拔高了一点，那种高兴的腔调一瞬间被压了下去，变成一种介于抱怨和惊讶之间的语气。“比如说这里的辈分和时代，完全错乱啦。德川家光在这个地方是德川家纲的儿子哦，儿子耶。”


  “啊？”


  “总而言之，别用常识和历史来套就好啦。”武藏把太刀从肩上换到另一侧的肩膀，刀身磕着她的颈窝，她扭了扭脖子。


  几个人在德川家纲弓着腰的引领下往内殿深处走去。走道很窄，两侧的木板墙上挂着陈旧的挂轴，画的是些她不认得的山川和飞鸟，墨迹洇开了，模糊成了一片一片的灰色。木地板在脚下发出空洞的闷响。


  士郎一只手护着立香的后背，步子放得很慢。他感觉到身后有目光，很轻，但很准，像是有人用指腹隔空描着他的脊椎线。他停了一步。


  千子村正跟在他们后面。她没有说话，也没有试图拉近距离，灰色的羽织在昏暗的走道里像是融进了墙的阴影中，只有那一头红发在微弱的光线下发着暗红色泽。她的兜帽还戴着，仰起的脸被帽檐遮掉了一半。


  士郎扭过头，看了她一眼。


  村正也抬起头，迎上了他的视线。


  她仰脸的瞬间兜帽往后滑了半指，露出了整张脸。红发被走道里那盏纸灯笼的光线照得像是刚淬过火的铁，每一根发丝都带着温热的红色。眼睛是琥珀色的，在昏暗的光线里亮得很不像话，瞳孔深处有一点很细的亮斑，是灯笼火在她瞳孔里留下的倒影。娃娃脸，下巴小巧但线条还不够利落，留着一层很淡的、属于十几岁的柔和。


  这张脸士郎认得。


  他在每一面镜子里都见过——橘发的、琥珀眸的、娃娃脸——此刻被另一双琥珀色的眼睛若无其事地投掷回来，只是换了一层更柔和更纤细的涂抹。村正看了他大概两次呼吸的时间，然后把视线移开，压低了兜帽，继续跟在后面。


  就像是立香，不止，已经完全是女性版本的他了。


  这个和他长得一模一样的刀匠就这么跟在他们后面，灰色的羽织拖在地板上发出轻微的窸窣声响，像某种尚未成形的疑问被谁丢在了走道拐角，等着他们继续往前时再翻出来。'

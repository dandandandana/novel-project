content: '“怎么可能？即死？”为首的法相看着地上正在化作大块大块金色光点的同道残骸。那六个法相的身体已经从下摆开始散掉了，残存的金光还在朝阵壁上飘移，被经文重新吸收。他的嘴唇张合了两次才挤出声音。


  “怎么做到的——就连神明也没有这么高的即死权能，即死法相？她的规格已经超越原本的神了吗？”


  阿尔托莉雅骑着梦魇之马出现在阵壁另一侧的半空中。马的四蹄踏在空气中留下的暗色蹄印还没有散去。她听见法相的话，歪了歪头轻笑了一声。


  “拿神和我相比，是不是有点贬低我了？”她把缰绳在手腕上绕了半圈，黑剑随意地扛在肩上，剑刃上还粘着一缕从法相身上刮下来的金漆。


  “所谓的法相……你们和神明也是大差不差吧：你们身上或多或少都握着权能——操控火、地面、植物、风暴、太阳，那些神玩的把戏，你们也玩得转。”她冷笑了一下，挽起缰绳让梦魇之马在阵壁外慢慢踱步，“不过比起他们，你们的权能更像……”


  她顿了顿，用剑尖在空气中画了个圈。“如果用一个好听的比喻的话，大概就是水库里的水吧。你们用的水是直接从水库的某个出水口里抽出来的管子，而地球的神明是从水库的缝隙里接水的。”


  “利用了世尊作为中转吗？”阿尔托莉雅歪着头，黑剑的剑尖从肩膀滑到腿侧，剑刃在空气中切出一道极细的暗痕。“权能本身来自他人，却比神明更强。这不是很可笑吗？”她双手持剑，剑格上的暗红魔石开始嗡嗡震动。


  “这就是你们所说的命好吗？”


  “一派胡言！”为首的法相怒吼出来。他的权杖朝天空一指，整片法阵的所有经文同时亮到了令人无法直视的亮度。十一股金色的魔力从每一位站立的法相身上汇聚进阵心，再从阵心朝外喷成一道巨大的光柱。


  “降妖除魔之念！”


  阿尔托莉雅冷笑一声。她看着眼前的金光，眼底没有丝毫的萎缩和胆怯。只有深深的不屑——那是对对手终于肯露出全力却没意识到自己已经把底牌掀给她看了的评价。


  她把剑尖对准那道咆哮着冲上来的金色光柱，剑身上的暗色魔力从剑格朝剑尖一口气涌过，半条剑刃都在瞬间震出了嗡嗡的低鸣。


  “斩绝七重魔境之极光！”


  黑色的剑刃光炮从剑尖迸发出去。暗色光束的周围缠绕着七道深浅不同的黑色光环，每一道光环都在旋转中朝外撕扯空气，发出如同锯子吃进硬木时那种粗糙的磨响。金色和黑色的两道光炮在半空中撞在了一起。轰隆一声，光束从碰撞面朝内回缩了一下，然后朝外轰出一道横跨整片阵壁的冲击面。


  法相的光炮在短暂的僵持之后猛烈地朝前一推，金色的光柱从中线开始将阿尔托莉雅的黑色光炮朝两边撑开。暗色光束在金色面前一层层被剥掉、被同化、被吞进去。整道光炮正在往她的剑尖倒流回来。


  只是——


  阿尔托莉雅再度架马上马了。


  梦魇之马朝前一踏，黑马的前蹄先过了光柱，然后是马头——然后是少女微微低伏的肩膀、腰侧的剑柄、腿侧垂下来的金色枪尖。整人整骑一截截被吞进那道光赫赫的金色光柱里，然后从另一端浮了出来。她从整个光炮处穿过去了。


  少女的心跳在自己耳边响了一下。这一炮——比哈迪斯主舰的全力一炮还要强力。她的剑尖还在震，刚才被勉强撑住的黑刃光炮已经在她穿身的瞬间被金柱吞得干干净净。


  【这些家伙打起来完全不在乎伤亡了吗？就算这片金地能自动修复，被光炮蒸发掉的僧人也是真的被蒸发了】


  她架马的动作不变，马蹄在空气中继续朝前方踏去。耳边忽然响起了某人的话，Alterego提醒她的话：


  “这里的人命不重要。人更重要。”


  她当时歪了歪头，没有追问。


  现在她懂了。


  阿尔托莉雅已经飞到了空中。梦魇之马踏过最后一道阵壁的时候马蹄底下的经文自行断裂成了散碎的金末。她等到光炮落去之后彻底出现在空中，金发被残余的光压吹得朝后倒飞，肩上的裂痕在魔力溢出时又扩展了半寸，但她没有低头去看。


  为首的法相面上的惊讶完全压不住了，他的嘴张开，嗓音从喉咙里涌出来时被自己瞪大的眼睛堵了回去，然后猛然爆发：“这——为什么你能够无视压制？我们的阵心已经加了压制术式！”


  “哦？原来这个法阵还有压制能力的作用？”阿尔托莉雅淡淡地开口。她把缰绳在手掌上换了半圈，和黑剑一同调转向下。马的四蹄在空中踏定，暗色蹄印在脚下凝成一圈淡淡的光环。


  “原来如此。你们想压制我行进中无视一切的能力，从而对我造成杀伤——是这个战术吧。”她手中的黑剑已经挥了起来，只是已经不是刚才的剑了。


  “Excalibur！”'

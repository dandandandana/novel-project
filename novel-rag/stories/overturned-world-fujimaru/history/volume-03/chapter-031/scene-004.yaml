content: '玛修在地面上把巨炮撑得很稳。她看见空中那面大阵里黑与金对撞的光束被一道从剑刃上轰下来的暗色极光吞掉——那是阿尔托莉雅发动宝具的瞬间，阵壁上倒映出的不是黑色光柱，而是被染黑之后还能看出原形的圣剑剑身。


  玛修咬了咬牙。她把一只手从炮柄上移开，握紧又松开，脱力导致的麻痹感从指尖退到了掌心。恢复了一半。差不多能站起来了。她站起身，转向伊耶娜美那边的战场。


  伊耶娜美和须佐之男命的战斗在街区的另一端。天空中的风暴和雷暴汇聚在须佐之男命周围，每一道雷霆劈下都在地面上留下一条焦黑的沟壑。


  伊耶娜美挥动天沼矛，矛身每划一圈就将袭来的飓风从侧面劈开，风暴被矛尖撕成两段，朝两侧撞在建筑物的残骸上，但她近身持矛的步法明显跟不上须佐之男命。


  须佐之男每一剑都逼得很近：他仗着风神的机动性在伊耶娜美回收矛身的间隙侵入她的防御圈，在那一瞬间挥出裹着雷霆和飓风的一剑。


  伊耶娜美用矛杆招架住，身子却被剑上传来的力道朝后推了一丈。矛头太长，一旦近身就被卡住了。玛修看得出她没用出天沼矛一寸长一寸强的能力，她被压得太密找不到拉开距离的时机。


  须佐之男挥出裹着雷霆和飓风的一剑，剑刃上的雷光在劈到矛杆的瞬间朝四周炸开四道蛇形的分叉。


  然后他趁势后退，靴底在地面上划出一道焦痕。他扫了一眼一旁的战场——天空上法相大阵的经文正在阿尔托莉雅的宝具面前一片片剥落。


  他冷笑一声：“原来如此……已经彻底结束了吗？”


  须佐之男命飞了起来，他的身形被旋风托在半空中，周身的雷暴随着他升空而朝外扩散，整片天空的云层都开始朝他的方向旋转。


  “你们的援军已经进城了啊，怪不得可以飞起来了。”他把长剑横在胸前，剑刃上映着他自己的笑脸，“我也不需要藏着掖着了。”


  天空中亮起了金色的涟漪。不是法相大阵的金光，是从更高处——从云层之上、从漩涡中心：那是朝外一层层展开的金色圆环，每一环都在缓缓旋转。


  空中的雷暴和飓风朝须佐之男命疯狂涌去，所有的雷电从白转成金色，所有的风从乱流转成环绕他周身的有序漩涡。


  “素戋之禊祓！”


  雷暴加剧了，不是普通的打雷，是整片天空从云层到地面同时被雷电填满的电柱密阵，每一道电光都比任何一道雷霆更粗，更密，更金。雷暴与空中那片黑红色的火云猛然撞在一起。


  黑炎和金色的雷电在云间撕扯着彼此，火云被冲击得凹下去一块，雷柱也被黑炎吞掉了半截，两种力量的冲撞在天空上炸出一圈又一圈的冲击波。


  须佐之男命低头看向伊耶娜美，嘴角的笑意已经把脸撑得有些变形了。“那么就要解决你们了。”


  城内，洁白光晕暴起。那是从月读命金地深处传来的——一道月光从地面喷上天空，将整片街区和天空的黑炎与雷暴都染上了一层青白的清冷光泽。月光与黑炎在天空中交错冲击，形成第三道力量。


  “那是月夜见之禊祓。”伊耶娜美握紧天沼矛的矛杆，矛杆的温度在她的手掌里升起一小股热雾。“是月读命的禊祓……月读命，也用了这一招。”她咬了咬牙，看向天空上用弥勒体系的力量飞行着的须佐之男命，从牙缝里挤出话来：


  “你们竟敢用他们的尊称——用偷来的权能，也配提三贵子？”


  “哼。如果不是他们不肯给予力量，怎么至于这样？”须佐之男命笑着开口。他挥了挥手，身旁的雷暴又浓了一层。“


  他把剑尖朝伊耶娜美一指。“伊耶娜美，我们忌惮你是因为你在天照命金地能调用世尊的力量。不过——”他歪头笑了一下，“没看错的话，天照命金地的禊祓在千子村正身上。既然如此，就不必忌惮你了。”


  风暴一下子刮起。须佐之男命消失了。不是移动快，是他整个人连同周身的风暴在同一瞬间被从空间里抽了出去。


  玛修的瞳孔骤然收缩。她还没来得及举盾，一股巨力从上方的空气中爆发出来，把她整个人一巴掌抽飞。她的身体在半空中横飞了十几步远，撞碎了一面半塌的墙壁之后继续穿透墙后的残骸——碎石从她耳边飞过去，后背砸进第二面墙才停下来。玛修咳出一口血。血溅在面前被砸出裂纹的石板上时还是很热的。


  “什——”她扫视一周，发动感知的瞬间整个脑海里只有一片噪音。


  没有人，他不在这里。他的打击是从看不见的空间壁垒里传出来的。


  阿尔托莉雅的臂甲处又多了一道裂缝。她驾着马飞奔起来——然后臂甲上又一道裂缝。


  暗色的甲片被无形的冲击劈开，残存的魔力从虚空中被抽出来，在裂缝边缘迸出几颗转瞬即逝的白星。'

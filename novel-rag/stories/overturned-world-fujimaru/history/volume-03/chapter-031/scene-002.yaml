content: '他的嗓音被愤怒撑得比正常说话高了一度，“你这种穿来穿去的手段——是邪术！是妖魔的本事！”


  “哼。”阿尔托莉雅轻哼一声。她把金色长枪收回腰后，纤手朝身侧一拧，一柄漆黑的长剑从虚空中被她抽了出来。剑格的位置嵌着一颗暗红色的魔石，魔石在她手指收拢的瞬间亮了一亮。


  伴随着长剑出鞘的是浓郁的魔力放出而成的飓风——从剑身上朝外喷涌的暗色魔力一口气膨胀成旋转的风暴，裹着剑锋上剥落的魔纹碎片卷入阵壁。整个降妖伏魔大阵的法相经文被飓风撞到的同时，阵法从被冲击的那一点朝四面八方传导震动，阵壁上每一道金文都被震得齐跳了一下。


  阿尔托莉雅歪了歪头，金发从额线滑到眼角，她看着地面上正在重新结印、试图稳住阵脚的法相们，眼底是读完了对方招式后的了然。


  她正准备朝地下的法相冲去——然后一声清脆的碎裂声从肩甲处响起，如同瓷器从内部裂开的那种细细的、从一处裂纹蔓延到数道裂纹的时候发出的持续不断的小碎响。


  阿尔托莉雅愣了一下，她侧过头，看向自己仍在蒸着白色残气的肩甲。肩甲上那道狰狞的裂痕从甲片的中心朝边缘扩散，在暗色的甲面上留下了一道道浅白的不规则纹路。阿尔托莉雅皱了皱眉。


  “看样子要速战速决了。”她冷声开口，声音已经完全没了之前歪头笑时的戏谑，只剩沉静和决断。


  她把黑剑换到另一只手，肩甲上的残余蒸汽被她用魔力强行压了回去。


  阿尔托莉雅背上的黑翼消失了，整对翅膀在眨眼之间从她的背部转移到梦魇之马的身上。黑色的翅膀从马肩的位置猛地张开，翼面比先前阿尔托莉雅的更大、更宽，每一次拍动都在空气中留下两道平行的暗色裂隙。阿尔托莉雅的身子贴在梦魇之马的脖颈上，拉紧缰绳。


  连马带人没有丝毫的移动，但法相们全都觉得她已经朝前方移动了不少——不止一人同时朝后撤了半步。不止如此，前方出现了无数的幻影：无数个阿尔托莉雅骑着黑马的身形从前方倒着飞回来，一道接一道，如同倒带一样从她头顶、身侧、马腹底下朝她身上汇聚。一道又一道残影归位，每一道都带着极短促的风压，一层层叠进她的身体里。


  没有丝毫的声音。没有丝毫的气势波动。没有任何肉眼可追踪的变化。阿尔托莉雅冲了出去。


  “无阻的冥夜驰骋！”


  在凯尔特神话的阴影中，无头骑士驾驶着由无头马匹拉动的死神马车在深夜巡游。没有任何锁住的门扉能够阻挡那辆马车的前进。杜拉汉停下马车，呼唤某个人的名字，那个人便会立刻被抽走灵魂。这个神话赋予了阿尔托莉雅在行进中无法被任何事物阻拦的能力。光炮只是穿过她，斧刃只是划过她，金阵的压制术式只是碰到她——碰到，然后失效。当阿尔托莉雅背上的死灵王之翼和冥途之马的力量相结合，她就能以无法被中断的速度横扫整个战场。


  阿尔托莉雅的身形消失了一瞬间。在那之后，整个法阵被一股巨大的力量从内部猛烈撞击。不是撞击声，是整面阵壁同时朝外鼓出去再朝内弹回来的回弹声：嗡，然后是阵壁上经文碎裂时尖锐的撕扯声。


  飓风撞到了法阵的表层，不是风暴，是阿尔托莉雅在超高速度的疾驰中带动起来的炙热气流和暗色魔力留下的一道环状冲击波。冲击波从阵心朝外围一口气推过去，地面上的石板被掀飞、在空中碎成粉末、又在落地前被金地修好，但修复的速度已经跟不上破坏的速度了。


  法相们愣了一下。一部分人歪过头，试图用眼去追阿尔托莉雅奔过的轨迹，另一部分人直直倒了下去，身上的金漆从胸口朝外剥落，身体在倒地之前就已经开始化作散碎的金色光点。


  “空净？”一名持长剑的法相瞪大眼睛，他的剑尖还指着前方，但手指已经僵在了剑柄上。他看见身边的同道一个接一个倒下，法相的道行在这道宝具面前连抵消都做不到。


  “量力！”另一名持双环的法相替他喊了出来，嗓音被喉咙里涌上来的金色雾气堵得变形了，“压住阵脚！她刚才穿过了——不对！”


  “别吵了！”为首的法相举起权杖朝地面一砸，杖底的魔纹猛然亮起，一圈金色的涟漪从杖底朝外扩散，将被冲击波撞得快要撕破的阵壁重新编紧。他的嗓子被压得很沉，但每个字都在抖：“不要慌张！立刻重整旗鼓，为倒下的六个同道报仇！”


  剩下的法相歪歪扭扭地站着：有人用禅杖撑着身子，杖尾在石板上划出尖锐的摩擦声。有人用手按住胸口，指腹下金漆的甲片上可以看到从内部扩散出来的细密裂纹。他们的腰都被这一发宝具打得直不起来，每吸一口气都在胸口顶出一小团从体内漏出的金色雾气。'

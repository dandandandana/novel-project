content: '玛修在林中的一片空地上把两人放下。村正的木屐踩上松软的泥土时膝盖微微弯了一下，她自己撑住了，站直。士郎从松林的阴影里走出来，靴底踩碎松针的声响很轻，他走到三人面前站定之后把黑键收进投影消失的位置，看向村正。


  “自我介绍一下吧？”


  立香默默地点头。她喘了口气，把刚才在高空中被震撼到的那部分脑子暂时搁到一边，然后开口：“有一大堆问题想问你。我们好歹也算是救了你吧——虽然你大概不觉得需要人救。”


  村正嘟囔了一句：“我也没要你们救我。”她说完之后把脸偏向一边，偏过去之后沉默了一拍，又自己转回来。“算了。”


  她的手指捋上刀柄缠着的绷带，捏住绷带末端被火焰舔焦的那一小截搓了一下：“我的名字是千子村正。”


  她把刀收好之后看着三人：“来自天照金地的铸刀匠。略懂一些剑招。”


  立香的右眉往上挑了一下：“你的意思是一个略懂剑招的铸刀匠，能够打出对城宝具的破坏力？”她把“略懂”两个字咬得格外清楚，尾音还带着一点上扬的弯。


  村正想了想，想了大概一拍，这一拍的长度刚好够她把目光从立香脸上移到远处树梢上又移回来：“跟我本人关系不大。”


  她说完这句之后眉头一挑，把话头转了方向，“我现在无法完全信任你们。你们说自己来自迦勒底，目的是拯救人理——也就是异界来客，是吗？”


  “是。”立香的回答只有一个字，随后她开口道，“这里是被称为特异点的地方。我们需要在这里回收圣杯，然后修复这个特异点。”


  “特异点吗？”村正把这三个字在嘴里含了一会儿。她的目光在这一小会儿里飘到了很远的地方——远到松林边缘那棵被风吹歪的老松上方还有往上几寸的虚空。然后她收回目光，“如果是特异点，那么就说获得过去了。”


  “嗯？”立香的音节是从鼻子里漏出来的。


  村正看着她。“我可以协助你们。”


  “嗯？！”立香的第二个“嗯”从喉咙里拔高了音调，她偏头看了玛修一眼，又偏回来，“不是——你刚才说你没法完全信任我们来着？”


  村正抱剑而立。抱剑的姿势不是把刀横在胸前挡着——是把刀竖起来靠在肩上，刀柄搁在颈窝旁边，整个人看起来像是在靠着一根不太舒服的拐杖。


  “你们可能不知道。”她开口的时候把“不知道”三个字在齿间咬得比别的字更用力，“人理——在这里——是一个完全无法提及的概念。”


  立香没有说话，玛修也没有。林子里的风替她俩沉默了。村正继续往下说：“人理，以及和这些相关的一类词汇，在月读命金地内部是法相专属的词汇。”


  她顿了顿，把刀从肩上拿下来立在脚边的泥土里：“这就是那个德川家纲听到你们的话直接就跪下去的原因。他以为你们是法相——真的以为自己刚才在屋顶上拦的是法相本人。”


  玛修的身体在盾牌后面微微往前倾了半寸：“等等。”


  玛修的眉头皱了起来，皱得很紧，“你刚才也说了人理这个词——你也是法相吗？”


  “我不是。”村正摇头的幅度很小，但很坚决。颔下的喉结在摇头的时候动了一下，“天照金地并没有法相。”说完这句她低下头，低头之后沉默了大概两口呼吸的时间，然后才继续开口，声音比刚才轻了半个度，“不——之前大概是有一位类似的。不过已经不在了。”


  那两口呼吸的沉默里她垂着眼皮看着自己插在泥土里的刀柄，手指搭在刀柄顶端没有动过。然后她抬起头来，把那个沉默收走了。“我能说这些词，只是因为天照金地对这方面并没有很明显的限制。”


  立香把村正的话在心里快速过了一遍，然后把它们捋顺了吐出来。“我懂了。也就是说不同的金地有不同的习俗、不同的规则——就像不同的国家有不同的法律一样。”她点了点头，“合理。”


  村正没接这个茬，她把插在泥土里的刀拔出来，左手握住刀鞘，右手搭上刀柄。“我有这份力量的原因，是我的刀。”


  她轻轻地拔刀，刀身从鞘口退出来的时候没有金铁摩擦的脆响——只有木鞘内壁和刀脊轻轻蹭过时发出的闷声。


  她把整柄太刀横在三人面前。没有任何刀纹。没有任何刀铭。整柄刀从刀柄到刀尖都是一块完整而朴素的黑铁，连刃口和刀身的颜色都几乎分不开。


  林间的碎光洒在刀身上，但铁是黑的，光靠近刀身之后没有跳回眼睛里——像是被吃掉了。只有极窄的刃口在某个角度下会露出一线极细的银亮，亮一下就收回去，像是刀刃本身在眯着眼睛看人。


  “此刀名为妙法村正。”村正报这个名字的时候语调很平，平到像是在报一个用了很多年的工具的编号。


  立香盯着刀身愣了一拍，“妙法村正？”'

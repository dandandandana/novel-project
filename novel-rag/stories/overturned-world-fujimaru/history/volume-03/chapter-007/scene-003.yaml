content: '她把这四个字翻来覆去嚼了两遍，“果然和历史里不一样——历史里的妙法村正被称为村正刀里最重要的艺术品，刀铭、刀纹、装饰——每一处都繁复到极致。而这柄完全没有什么装饰。”


  村正把嘴唇往上一拎，拎出一个笑，这个笑不深，只到嘴角，但来得很快：“嗯哼？艺术品吗。”她把刀在手里微微转了一下，让刀脊对着立香。“刀就是刀。刀铭和花哨是次要的，最重要的是锋利，不是吗。”


  立香嘟囔了一句，把头偏开看向前方的林间小路。“说得倒是有道理。”然后她重新转回来，“好了，接下来的我们一边走一边说吧。”


  “嗯。”


  四人朝着村正称为天照金地的方向迈进。松林在她们头顶缓慢地往后退，靴底踩碎松针的声音在林间地上铺成一条细碎而持续的低音。


  走了大概几十步之后，立香的声音打破了沉默。“在这里最强的就是法相了吗？”


  “是被称为世尊的尊者。”村正接得很快，快到这句话像是已经等在舌尖上很久了。


  立香又沉默了片刻——这次沉默是用来组织措辞的。组织完之后她放弃了。“说人——算了。这对你已经是最容易让人理解的了。那么，世尊——是佛吗？类似于释迦牟尼的那种？”


  村正的眉头猛地一挑。这个挑眉比之前立香的挑眉幅度大得多，眉尾几乎弹到了发际线底下。她偏过头盯着立香，盯了整整一拍。“直呼佛祖大名——没大没小。”


  “嗯——前辈就是这样了。”玛修把这句话从立香背后的位置接过来。她的语气里带着一种已经重复过无数次的无奈，但在这种无奈底下压着一层很薄很薄的习惯了之后的柔软。


  村正被玛修这句下意识的补刀弄得愣了一下。愣完她把挑起来的眉头放回去，重新开口：“差不多吧。不过世尊更像是金地的掌控者。”她的木屐踢开脚边一颗松果，松果滚进草丛里发出沙沙的声响。“正如月读命的金地以月读命为世尊，须佐之男命的金地以须佐之男命为世尊。这些都是金地的世尊。世尊在金地的加持下——几乎是不可战胜的存在。”


  “那可不一定。”这四个字不是从立香嘴里出来的——是士郎。他走在队伍最外侧，和三人隔着大概一臂的距离。说这四个字的时候他没有转过来看任何人，语气和在陈述一个自己检验过很多次的事实差不多。


  村正看向士郎，她张了张嘴，张开一半后，嘴唇在空气里停了半拍又抿了回去。喉结动了一下，把一句已经在舌头上铺开了的话重新咽进肚子里。“你——算了。”


  立香没有漏掉村正这个欲言又止。“佛祖是世尊之一吗？世尊只能在金地里存在吗？”


  “佛祖释迦牟尼——”村正的目光从士郎身上移开。这一次她的视线不再飘到松林上方的虚空里，而是停在自己脚边的影子边缘上，像是影子底下埋着什么。


  “很可惜，释迦牟尼在之前是存在的。”她说到这里的时候语调还是很平，和报妙法村正的名字时用的是同一种语气。“但是现在不在了。”


  “哈？”立香的脚步顿了一下。靴底的松针被这顿挫的一步碾成更碎的一小堆。她转过头看着村正的侧脸，“你说什么？”


  村正没有加快脚步，也没有放慢。她的木屐踩上下一棵松针的节奏和之前完全一致。“字面意思——佛祖释迦牟尼已经不在了。”她把这句话说出来的时候语气很轻，轻到一整句话只剩一口气托着，像是已经在心里嚼了几千遍嚼到没味道了才吐出来。


  “佛祖释迦牟尼，在大约几千年前就死了。”


  林间的风声忽然变得很清晰。松针落地。


  立香愣在原地的时候，她脑子里的感觉不是空白——是有人拿了个铜铃在耳边晃了一下。短暂的嗡鸣之后剩下大段的空旷。


  她的嘴唇张开了。张开之后停了两拍。凉风灌进嘴里。然后她把嘴唇抿回去，重新张开，一个被空气托着的气音从喉咙口滑出来——又没滑到舌尖就自己散了。


  林间的风从她身后吹过来。松针被这股风从头顶的树枝上扯下来四五根，它们在空中翻了几下，有一根落在妙法村正还没收回去的黑铁刀身上。


  针叶停在刀面上——那线极细的刃口把松针剖成两半，两片断面被风各自吹往两个方向，落进草丛。谁也没说话。玛修的盾沿不小心磕了一下脚边的石头。


  发出一声很轻很脆的金石相击的声响。这个声响在此刻的林间像是一滴水掉进一碗已经凉透了的汤里——没人接。


  士郎靠在左边的树干上。手里的黑键还没收起来，黑键的刃口在阴影里已经熄了光。他从树干上直起身子时，抬手把黑键往空气中一插——投影消失的位置泛起一缕极淡的魔力残光，然后熄灭。他的视线越过众人头顶往北边的天空扫了一眼。


  “要快点了。”


  “死了。”立香终于把这个词吐了出来。不是问句。也不是感叹。只是一个重复——她在用自己的嘴确认自己听到的东西是真的。'

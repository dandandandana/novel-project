content: '“我所教你的裂解术，本质上是利用根源之涡而成的，逆行根源的魔术。”吉尔伽美什的手指在自己膝上缓慢地敲了两下，“而从那场伊耶那美给你的试炼里——你获得了类似于最高位的逆行根源的能力。”


  “所以我这是一步登天了？ ”立香半开玩笑地开口。


  吉尔伽美什忽然愣了一下。那一愣是她脑子里把立香刚才在幻境里受的所有苦和现在这句玩笑一并揉在了一起，然后她的唇角往上勾了起来：


  “如果你管你受的苦清零的话——”她顿了顿，把句子拉长了一拍，然后把尾音收在舌尖上，“那确实是一步登天了。”


  立香闭嘴了，她把牙齿咬在自己舌头边上，然后把身子往后靠在椅背上。


  吉尔伽美什看她不接话，便继续开口：“好了，我告诉你。那个魔术的名字是。”


  她把搁在膝上的手抬起来，食指在空中点了一下。


  “降格术。”


  立香的眉头往上一挑。


  “逆行根源的极致。”吉尔伽美什把手指收回去重新搁回膝上，“我不会这个魔术，”她说的时候没有躲开立香的视线，“到时候只有你自己悟了。”


  她把这句话放在半秒的安静里，然后补上了最后一句。


  “效果是——一定区域内，不会出现你无法理解的存在。所有事物的存在形式，必定会以你所能够认知理解的方式存在的~”


  “作弊的能力。”


  她的声音落下，那方湿帕子从案几上被窗外的风吹得挪了半寸，在木头上蹭出一道轻轻的沙响。'

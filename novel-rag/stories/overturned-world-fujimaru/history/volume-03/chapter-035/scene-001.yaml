content: '几人没有再纠缠刚才星星的话题。庆功宴的时辰到了。


  只是并非立香脑中预演过的那种宴会。她本以为战后就该是人人举杯、四处串场、背景里放着不知道从哪搞来的音乐——她在迦勒底看过的影像资料都是那样演的。


  月读命金地的战后夜晚安静得过分，没有欢呼声从街道传来，没有酒令从窗外飘进。夜空上的弯月被火光映出了一层淡淡的暖边，像一枚冰冷的硬币被搁在烛台边慢慢烤着。


  立香随后想到，日本战国时大概没有这些。她把脑中那个不切实际的乐队画面收了起来。


  宴席在一张圆桌上摆开了。圆桌是刚被天沼从废墟里拖出来的旧物，桌面上还残留着两道被雷电劈过的浅痕，青炎已经修复了桌面的大半，剩下那道浅痕顺着木纹朝桌沿延伸过去，在烛火的映照下像一条断了一半的线。


  几盘烤乳猪肉被士郎切好之后搁在桌子中央，油脂从肉片上渗出来把盘子底的瓷面浸出了一层半透明的光。剩下的是天沼做的各式各样的饭菜，汤碗里的热气在众人头顶上方汇聚成了一片薄薄的白雾，白雾被窗缝漏进来的微风轻轻朝上一吹就散了。


  吉尔伽美什从宝库里取了几壶酒，金的银的瓷的一齐放在桌角，壶身上的样式映着各种不同时期的设计。她给每人面前搁了一只杯子，倒酒时壶嘴在杯口上方稳稳地停住，酒液从壶嘴流进杯底的声音在安静的宴席厅里格外清脆。


  立香把面前的汤碗端起来。木勺从碗底舀了一勺，热气从勺沿朝上腾起，她吹了一口凉气将汤送进嘴里。汤汁是士郎用魔兽肉熬出来的，咸淡刚好，油脂在舌尖上化开之后还留了一点点肉筋的韧劲在被咬碎后慢慢散开。


  咽下这口汤之后她把木勺搁回碗里。然后她朝伊耶娜美的方向举起了手，手掌竖着立在半空中，像在课堂上向老师请教的姿势。


  伊耶娜美正用刀叉切着一块剩下的魔兽肉。她切得不快，刀刃压在肉块上时肉汁从两侧朝外挤了一下然后又被刀背推了回去。


  她把切下来的那片肉叉起来搁进嘴里——咀嚼时腮侧的肌肉动得很轻，像是在慢慢品尝而非单纯进食。她的阴阳眼在烛光中转了半圈，两只眼睛的色差被烛火一照变得格外分明：左边那只眸子映着火光是暖色的，右边那只漆黑的眼瞳把光吞了进去，只从眼底泛出一层极淡的金。


  她把叉子放下，嘴里那口肉被她细细地嚼了三次才咽下去。喉咙滑动的动作被领口遮了一部分，但从她下巴底的皮肤能看到那道吞咽在用力地朝下推着什么。


  “说。”她吐了个单字。音调不高，但在圆桌上所有人都停了一下。


  “伊耶娜美大神，宫本武藏小姐是为了什么被召唤而来的？如果按照您之前说的，这个世界已经不需要拯救，那么为什么这里——还有从者。”


  立香问出这句时仍把手举着，她的声音在宴席厅里传开后，桌上唯一的动静是吉尔伽美什给自己斟酒时壶嘴碰到杯沿的一次轻响。


  伊耶娜美把刀叉搁在碟沿上。刀背上沾着的肉汁在烛火下反了一道细光。


  她慢慢开口：“是我召唤的。”


  藤丸立香将手放下来。她的木勺在汤碗里搅了半圈，勺尖碰到碗底发出一声轻响。她抬起头时眉角朝上挑了挑，嘴里还残留着汤汁的余温，然后她把那点余温一并咽下去才开口。


  “你说什么？”


  伊耶娜美重新拿起刀叉，她又切了一块肉，这次切得比刚才更慢，刀尖在肉块正中间压了一小会儿才往下用力。她把肉叉起来搁进嘴里，边嚼边开了口。


  “千子村正——Saber是我从泛人类史召唤来的。她之外的其他Saber，都是我用别的渠道召唤的。”


  “别的渠道？你说的什么意思。英灵召唤还有别的渠道？”立香把双手搁在桌沿上，上半身朝前倾了半个身位。


  “我从英灵座之外的渠道引渡了他们——类似在召唤的中间过程里截取英灵的备份，然后用备份召唤出从者。”伊耶娜美把叉子上的肉屑在碟边刮了一下，叉尖蹭过瓷碟时发出了一声又细又干的刮响。


  “类似于……中转？”立香把这两个字从嘴里一个字一个字地吐出来。


  “你可以这样理解。但召唤来的是真正的英灵，灵基比常规从者更强。”伊耶娜美说着，切肉的刀从肉块上抽了回来搁在一旁。


  立香把双手在桌沿上轻轻拍了一下。“什么——为什么？”


  “很简单。英灵召唤本就是人理的防御系统，七骑冠位从者担任守护人理的抑制器，是作为战斗装置的下位存在。所以受人理召唤的从者会被从者容器限制。”伊耶娜美解释时手指在桌面上轻轻敲了一下，指甲碰到木质桌面时留下了一个极轻的凹痕。


  “而我召唤的从者不会受这种限制。”


  她说到这里忽然停住了。切肉的手悬在碟子上方，刀尖与肉块之间隔了一层两指宽的空气。


  “我召唤从者……是因为，妥协。”'

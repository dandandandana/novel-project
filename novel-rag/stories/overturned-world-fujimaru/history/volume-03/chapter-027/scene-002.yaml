content: '每一次碰撞都伴随着海啸般的信息流彼此压过，双方的权能计算强度是相等的，不论是时间，空间，神秘度——谁也没能在规则层面压制对方哪怕一个层级。


  祁荒又一次抵住弥勒的冲势之后把意识朝他的方向狠狠探了一把，然后将一段被那家伙自己精心裹住的过去猛地拆解开来。


  【有趣，竟然和我不相上下？这就是未来佛吗？】


  弥勒的过去半真半假。真的部分是他统治的过程极其漫长而繁琐，假的部分则是他把那段历史中的苦难和搏命一笔抹净，让一切看起来像是顺理成章的平稳过渡。祁荒在心里嗤了一声——信他个鬼。但她确确实实在那些层层叠叠的伪装下挖到了一层无法作伪的底片：弥勒的诞生来源于整个世界的人。他出生的那一刻太普通了，普通到一眼假，普通到整片世界里成千上万人的呐喊都汇聚在了同一个节点上。


  【不对，他为什么一直在这个时间节点？】


  【不止如此——有古怪。】


  祁荒的千里眼能看到除了“现在”之外的一切。但她从不信任自己的眼睛。同一个位格的对手篡改千里眼观测的内容和在后院改一副挂历差不多容易。


  比如她压根不会相信从藤丸立香身上看到过爱尔奎特、雅典娜与伊什塔尔之类的事情，但她这次选择对弥勒动手的判断依据不是千里眼直接告诉她的，是她从被篡改过的信息里一层层剥掉假象之后拿自己脑子推断出来的。


  又一波权能碰撞，两股规则在第四次抵消之后同时松散了片刻。就在这次对拼的间隙，祁荒从弥勒身上看到了锁链。不是真的铁链——是她用所有计算资源推演完弥勒的存在状态之后，她的大脑为了理解这个状态自己生成的具象化。锁链死死勒进弥勒的身躯，把他从肩到腰捆成一个动弹不得的柱形，而锁链的另一头贯入了一个“人”的脖子。那个“人”在祁荒的理解中不是某个具体的个体，而是所有世界里的人的整体概念。


  但是问题来了：这里是特异点、是不被人理承认的地方、是需要被修复的异常——这个概念应该是绝对的。


  而“人”的概念能被祁荒理解到、分析出来，说明这里被人理承认了：这里有可能之前是特异点，但现在绝对不是。


  【不可能吧。】


  【难不成这里——】


  祁荒的思维在一瞬间刷过数个推演路径然后撞在了同一个结论上。撞上去之后她沉默了片刻——在这个时间毫无意义的地方，她的沉默就是计算上的一个短暂暂停。


  在又一次宇宙规模的权能对撞以完全等价的抵消收场之后，两个人重新在月读命金地的主殿前显现了身形。祁荒的绣履刚踏上石板，弥勒已经把手掌从袖子里翻了个面朝虚空轻轻一按——歪斜的楼阁自己撑起来了，木梁重新咬回榫头；城外地面上那个被炸出来的盆地被泥土从底部无声推平；空气中溅起的所有粉尘同时落定。光一帧都没到，一切回到破坏之前的样子，连石板接缝里的青苔都是原来的位置。


  弥勒的视线重新落在祁荒脸上。“你是菩萨。能力几乎和观世音一模一样——甚至可能还要强过。”


  “嗯哼？”祁荒勾起嘴唇，把黑色细柱收回袖口。她的双眉从严肃的硬线软回原来的轻微弧度：“对哦~毕竟是偷窃而来的嘛。就连阿卡夏记录都认为我是观世音哦~”


  “观世音在西海的动作吸引你而来的吧。”弥勒把手掌重新收入袖里，“把整个西海收作小世界——实际上以此来引你来的吧，魔性菩萨。”


  祁荒没有立刻答他。她捏着下巴，眉梢缓缓压了下去。


  “我猜到了——”她说着话时眼睛没有看弥勒，而是透过他身后的空间望向更远处那些已经恢复如初的街巷，“这里真的是未来，你确确实实是未来佛弥勒。”


  【就算信不了也得用千里眼看看这里到底发生过什么——】


  祁荒猛然持起那根黑色柱体。她嘴唇一张，声音从舌尖炸出来：“金刚杵！”柱体瞬间化为一团烟雾，烟雾还没来得及朝外扩散便被内部的力道撕开：几枚银针从烟团中齐齐迸出，拖出一道道直线的银色残影朝弥勒全身扎去。


  弥勒连退都没退。


  银针触及他僧袍表面的瞬间便自己消融了，像冰片落进看不见的火。他微微张开嘴，整片天空的颜色立刻从冷白变成稠厚得挪不动的金色。空气中弥漫的以太凝成一柄柄光轮，光轮在半空中旋转着各自锁定祁荒的方向，然后齐齐砸过去。


  祁荒把长发朝后微微一甩。两团紫黑色的光球从她身侧飞出，光球与光轮相撞的瞬间同时炸开——两朵蘑菇云从地面上直直拔起来，泥土和碎石还没来得及飞到最高处就被冲击波压成扁平的碎屑带。弥勒只是抬了抬眉角。蘑菇云被他这一抬眉整个压下去了，烟尘还没来得及扩散就被彻底抹平。


  【看见了。】'

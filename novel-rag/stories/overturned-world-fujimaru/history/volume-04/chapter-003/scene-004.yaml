content: '终末人理圆满装置的声音颤抖起来，但是立香已经无暇顾及了。


  她知道这不是想这个的时候。


  但她忍不住不去想。


  蓝黑色的舰壳呼吸律动和AI未完全平复的杂音都被她暂时推出了自己的感知范围。她的视线只圈定了一个人。


  言峰士郎，那张耐看娃娃脸的侧廓在残骸冷光中留下一道从眉骨到下颌的干净折线。刚才低头取手帕的姿势还没完全收回来，右手垂在战衣外侧，指尖还沾着刚才她抹汗时从他手中抽走帕子的片刻摩擦感。


  【言峰士郎——你。你是不是也是——】


  她的嘴没有动。眼神在问。


  【在为了某种事情而前进，从而体验活着。】


  她把他和这艘巨舰重叠后的缝越看越窄。


  【你......是不是停下来......就好比让你死了？】'

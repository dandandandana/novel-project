content: '然后她把头稍稍往左偏了一下，侧面的橘发从眉骨旁边滑过来，被她用下颌轻轻压住：


  “如果关键的是星空，那么我需要知道你们有什么被限制了。”


  立香把一只手从腹前抬起，手掌托住自己的颌骨和下巴。她正在把自己沉进那盆冷水中。思维的齿轮在水下转得比水面之上更快。


  “天空之城，柔软的材料，AI——空中汽车，逆向五大法——”她把自己上一轮在金地看见的每一个未来文明标志一桩一桩掐出来。然后她把托着下巴的那只手的手指在嘴角边的皮肤上轻轻压了一下：“我猜测你们这里是真正的类似于乌托邦的存在。但是为什么不能飞出地球呢？就算是我们的时代也做到了。”


  她抬起头看着终末人理圆满装置：“为什么。”说完她把托下巴的手放下来，把自己整张脸上的神情都扒平，“我需要知道这个。”


  士郎走到她后面，他的脚步在残骸金属地板上落得很轻，但在接近她后心位置时刻意用力踩实了一拍——这拍了让她先察觉到他过来了，然后他的掌心轻轻贴上她的后心。


  玛修从侧翼往立香的方向移了半步。盾牌底座在地面上碾出了一串细微的金属摩擦声：“前辈，别给自己太大压力——我和言峰前辈都在。”


  立香在玛修说出这句话之后才发觉自己额头上不知什么时候已经渗出了一层薄汗，凉意在发际线往里一些的位置忽然变得具体起来。


  她把脸往士郎的方向侧了侧，士郎已经从自己的战衣内侧取出一方手帕递到她手边。她接过手帕在额头上从左往右抹了一遍，手帕离开皮肤时沾了一小片湿痕。然后她把脸重新转向AI，眼神里没有任何多余的水汽。


  “我需要知道这个。”


  终末人理圆满装置点了点头，“如果是这样——”它说到一半时，残骸大厅忽然亮了。


  不知从哪里来的灯光在整座大厅的所有横梁上同时亮了起来。那种光的颜色泛着一层淡得过分的蓝白，把断裂的金属结构的每一道切面都照出冷感十足的反光。大厅里原本被深渊吞掉的角落现在全部浮上来了。然后在这些灯光之中，距离立香不到五步远的前方空气中凭空亮起了一圈矩形光圈。


  光圈内部的画面和光圈外部的现实之间有几分色差。像是一层正在缓慢旋转的极薄水面。


  立香盯着那个矩形看了片刻，视线在“门”的轮廓线上快速跑了一圈。


  “这不是门。”终末人理圆满装置的合成音把她观察的成果提前拎了出来，“未来文明已经没有门了——用你理解的话来说，就是空间跳跃。”


  立香的大脑快速比对了一下自己下到星之内海时的传送感受和以方台穿越城区时的传送方式。二者在底子上确实是同一套逻辑。


  “走吧。”


  士郎从她后心收回手掌，跨了半步走到她右侧。他的身子高于她一大截，他朝着玛修的方向用了下眼神——那双琥珀色眸子朝立香身上轻轻往下一落，然后抬起来回到玛修脸上。


  玛修歪了一下头。


  士郎眉头微微往上抬了一线，在立香迈出第一步时，他伸手握住了她的手腕。


  立香一愣。随即她听到他将声音从自己头顶压下来。


  “别担心，你给自己的压力太大了，我的御主。”


  立香的眼眶突然一热。


  胀意从泪腺往眼眶里涌上来，她不知道为什么会想哭——大概因为她一直在想着怎么领着这群人往前走，根本没时间想自己还能不能撑到最后一步。


  她狠狠地把那股胀意逼了回去，舌头抵住上颚深吸半口气，然后踏进了那片矩形光圈。


  眼前的光亮在一瞬间变成了暗域。


  立香第一眼看见的是深渊。那深不见底的纯粹暗色在她脚下不知道多远的地方铺开，暗得连反射光都没有。


  然后她抬起头，看见了那艘巨舰的残骸——它横卧在暗域中央，舰体断掉了一大半，断口边缘翘起大块大块被暴力撕开的金属甲壳。


  但它太大了。


  大到仅仅是搁在他们面前的那一小截残骸，就足够让立香的视线从左边扫到右边都扫不完。


  如果说哈迪斯的战舰是能把整座大陆从头顶压过去的遮天巨鲸——那么这个残骸就是包裹着巨鲸的大海。


  立香停在原地。她的脚没有再往前的意愿。她只是仰着头，把视线从残骸断口横到最左端，再从最左端横到最右端。然后她开口时声音都比平时低了两分。


  “这么大——士郎，描述。”


  “结构很怪。”他开口时语调保持着读数的平静，“类似于航……”


  他把话音咽下去，临时换了一个措辞：“战列舰。但材料不一样——上面更像是生物外壳一类的东西。”他用下巴朝残骸中段某处微微扬了一下，让立香注意到那片每隔几秒就微微起伏一次的舰壳，“格式各异的纹路全都铭刻在一起，有些地方甚至在——呼吸。”


  千子村正倚在自己那把大太刀上。她仰头看着那个庞然大物啧了一声：“这家伙要是动起来的话砍哪儿才能让它停啊。”'

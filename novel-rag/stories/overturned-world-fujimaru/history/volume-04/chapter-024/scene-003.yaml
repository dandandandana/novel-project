content: '就在鞋底越过内环时，黑痕里响了一声。


  很轻，像金属在冷却后自行收缩。达·芬奇立刻回头，奥尔加玛丽把立香拉到身后。召唤阵的供能阀已经关闭，银色刻线却从那道黑痕两端重新亮起。


  不是迦勒底的魔力。


  橘红色火星从阵心向外迸出，落地后没有熄灭，反而沿标准术式逆向补齐缺失的内环。原本无法建立的路径没有通往英灵座上方，而是向侧面切开一道极窄的缝。


  警报同时响起。


  “未知坐标接入！”


  “不是人理标准路径！”


  “灵基反应正在形成，规模——从者级！”


  达·芬奇冲回控制台：“外部魔力没有入侵，召唤阵在调用刚才留下的契约请求！”


  奥尔加玛丽问：“能关吗？”


  “能，但关了就再也接不上。”


  所有人看向立香。


  立香把刚迈出去的脚收回来：“开。”


  “我需要御主确认。”达·芬奇说。


  “确认。维持召唤。”


  供能阀重新开启。迦勒底魔力撞上橘红火环，没有把它压灭。两股力量沿同一套术式向内推进，银色与火色交替亮起，阵心那条窄缝被一点点撑开。


  立香手背忽然发热。


  三道苍白令咒没有恢复原色，其中一条边缘却亮出细细红光。不是新令咒，只是一段尚未成立的契约正在尝试找到她。


  “有东西抓住召唤了。”达·芬奇说，“不是从英灵座直接下来的。它在沿另一条坐标靠近。”


  “能辨认吗？”


  “灵基结构像Saber，混有锻造神性和已经衰退的创造火焰。右侧损伤记录……等等，这不是新灵基。”


  士郎已经走到安全线前。


  立香看见他的反应，心里先有了一个不敢说出口的名字。她没有叫，怕自己一开口便会把坐标带偏。阵中的窄缝继续扩大，缝后先出现一片烧焦的衣角，随后是一只缠满临时布条的手。


  那只手抓住缝缘。


  刀光从另一侧闪过，空间裂口被硬生生切宽半尺。一只靴子踩进召唤阵，鞋底落下时带着日本金地残留的白色灰烬。来人没有被灵子重新编成完整礼装，右臂皮肉仍留着大片灼伤，肩甲也缺了一块；只是最致命的裂口被召唤术式补住，胸前曾经压回去的白火缩成一道暗纹。


  红发女人从缝里迈出来，手里还握着一把只剩半截的刀。


  她落地后先弯下腰，像是一路都在强撑。立香向前一步，红发女人却用断刀撑住地面，自己站直。


  “别碰。”她说，“阵还没合。”


  声音和日本时一模一样。


  达·芬奇盯着读数：“对面还有一个生命反应！”


  立香立刻看向裂缝。


  万花筒般的光层在缝后交错，祁荒没有出现。只能看见一截金刚杵横在坐标深处，杵身压着不断收缩的门。杨枝净瓶的裂纹已经贯穿瓶腹，仍有一只流血的手扣住瓶口。


  “祁荒！”立香喊道。


  裂缝另一端传来一声很远的笑。


  “一次只能过去一个。”


  “把手给我！”


  “你那边的阵接不住我。再拖，连她也得退回来。”


  立香已经走进外环。村正反手抓住她手腕，力气不大，指节却没有松。


  “别犯蠢。”村正说，“她把路钉到你脚下，不是让你顺着爬回来。”


  “那她怎么办？”


  “活着。坐标也记住了。”


  缝后金刚杵又向下压了一寸。祁荒的声音被距离切得断断续续。


  “立香，先把刀匠收好。她右臂再烧一次，可真要换木头的了。”


  “谁要你多嘴。”村正骂道。


  “你看，脾气也没丢。”


  立香还想说话，空间裂口已经开始合拢。达·芬奇喊出剩余稳定时间：“三秒！”


  祁荒没有再试着过门。她抬起那只扣住净瓶的手，隔着重叠坐标向立香摆了一下。


  “下次见。”


  两秒。


  村正把断刀从地面拔出，向裂缝内横斩。刀锋切断最后一段向迦勒底回卷的乱流，召唤阵内所有橘红火焰同时向她灵基收束。


  一秒。


  金刚杵、净瓶与那只手从缝后消失。'

content: '言峰士郎静静把自己的手从立香后脑勺上轻轻拿开。


  拟造躯壳在对抗魔力方面几乎没有死角。


  他知道只要自己愿意开口说不，这道残余连他一句话都拦不住。


  “立香……我……”


  他的嘴唇在吐出这两个字之后忽然停住。喉结在战衣领口上方浮了一次——然后他把自己那句本来要从舌尖上推出去的话硬生生吞了回去。


  “士郎？”


  立香把脑袋从他腹前仰起来。她的眼眶下方还挂着刚才哭过留下的极其浅淡的潮痕——但她的眼睛极度清澈。颈侧从躺姿转成仰面时在舱体蓝光里拉出一条柔和的线条。


  她微微歪头。


  “所以？”


  那双橘色的眸子直直看进他的琥珀色瞳孔里。她的嘴唇还保持着她从他腹部仰起来时那个微张的形状。


  “但是身为你的从者，我可以答应你这个请求，立香。”言峰士郎低声开口。


  立香看着他的面孔。


  她的视线从他额角那几根被舱体蓝光勾出线条的红发开始往下一寸一寸移到了下颌。


  然后她撇了撇嘴。


  “对你来说很难是吗。”


  她的声音很轻。


  她说话时放在自己腿上的那只右手正在用大拇指在手背上那一小片已经彻底暗掉的令咒圣痕上慢慢蹭了过去。


  “嗯。什么。”


  士郎把脑袋往她方向倾了半寸。


  “做出决定是吗？因为你会背负上我的承诺。”立香问道。


  她把右手从自己腿面上拿起来搁在舱体侧边。手指前端轻轻扣着舱沿那一圈软衬的缝合边线。


  “嗯。我倒是没这么想过就是了，立香。”士郎的嘴唇在说这句话时分开得很轻——每个字都像是被他用舌面贴着上颚轻轻擦过去的。


  他把视线从她脸上往旁边挪了不到两粟的距离然后落回到她眼角。


  “我的意思是，作为言峰士郎，我还没想好怎么回答你。”


  立香把他的话音从头听到尾。


  然后她从他怀里慢慢坐了起来。她把自己右手从他战衣前腹上撑起来——五指分开，手指前端隔着布面轻轻压进那层深色织纹里——然后整个人从舱体内侧借力竖起了上半身。


  “这样吗，士郎。”


  她把自己因为躺姿散落在嘴角两侧的几绺橘发用指尖往耳后轻轻一别。然后她把脸转过来正对着他。


  “啊。等我觉得你想好了，我再问你怎么样。”


  士郎点了点头。


  然后立香把背部从舱体软垫上离开。她将自己的双肩往后轻轻压平，把那件白色外套上压出来的折痕顺势拉展。


  “现在。你说的，身为我的Ruler，你需要为了你的御主藤丸立香活着。”


  她把“活着”两个字从自己牙关里往外推。每个字都咬得极稳。


  “活下去。”


  士郎看着自己的御主。


  他的琥珀色眸子里映着她背后舱壁柔白的光——那层光从她橘色的头发边缘往他脸上反了一小片。


  然后他唇边的线条往两边轻轻拉开。


  “啊。遵命。”


  他把这两个字放在了所有东西的最顶端。声音不响——但是稳稳地往下落的时候刚好能让她耳朵里的每个听小骨都接住。


  立香的左手在舱体边沿一撑。她从舱内跨出一条腿，脚底落在合金地板上时发出一声极轻的脆响。


  她往前倾了倾身子，右手往士郎胸口一推。手掌在那片战衣的深色布面上一撑，五指分开——然后她借力把自己整个人从他座椅旁边拔起来站直了。


  那只推过他胸口的手收回来之后她把它垂在自己身侧了。


  “好了。”


  她深深吸了一口气，冷空气从她半张的嘴唇涌进肺里——把她胸口的衣料往外顶高了一丁点。然后她用拇指从外眼角朝耳际方向平着把那片眼底的潮湿轻轻推掉。


  “接下来我们需要那个终末人理圆满装置的情报再想办法去对付弥勒了。”


  她把脸重新转回士郎的方向。这句话每个字的间隔和声调都已经被她恢复到指挥模式下的工整——没有任何方才那道潮气的痕迹。


  然后她抬起双手拍了自己面颊两下。啪啪在舱室里弹回来时短得只有两个声节——手掌落下去时把她双颊的软肉轻轻往上堆了堆。


  “好了。接下来我要小睡一会。等那个AI整理好了把我叫醒。”


  “遵命。”


  祁荒算是看了一出好戏。她靠着舱体对面的那面白色墙壁，头上的白玉簪和垂下来的银质叶饰在她脑袋轻轻晃起来时哗啦啦一阵密响子撞。她把视线从那个已经把自己窝进舱里的橘色头发的女孩身上收回来。


  “真有意思啊——言峰。”


  她把姓往左边唇角一扯，然后又把嘴轻轻松开让名从右边蹭出来。


  “我还是很不习惯这个姓和你的名字连在一起。”


  祁荒的声音从她喉咙里慢慢往外淌。她把每个字都摆在一种半浮半沉的位置——半是真心半是试探。


  “有趣。明明被教育成这副模样，但是最后却还是接近那个正义的伙伴的样子吗。”


  言峰士郎将琥珀色的眼睛往上一抬。


  他把视线从立香闭眼躺在舱里的轮廓上慢慢移到对面的祁荒脸上。


  嘴唇在张开之前先在左边往侧边轻轻扯了扯。'

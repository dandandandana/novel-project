content: '“你的评价对我而言真的有意义吗。”


  “什么意思？”


  祁荒把脑袋往左歪了不到半寸。黑眸在歪头时仍然钉在士郎脸上，眼睫落下去之后又掀起来全程没有离开。


  “就是你这种行事为了自己的快感的尼姑的屁话完全无法理喻就是了。”


  千子村正的声音从舱体另一侧递过来时带着一层粗砂般的底音。她说这话的时候似乎在抄自笑傲


  “评价很有意思哦。我确实是这样的人嘛。”


  祁荒把这句话从她舌面上往外一抹。她的黑眸在听到村正骂她尼姑时连眼皮都没夹一下。她把头往村正方向转了半圈然后又回到士郎身上。


  “所以你打算怎么回应她的感情。”


  她看向士郎。唇边那条线在笑——但眼睛没有跟着嘴一起动。


  “……先让她活下去。”


  祁荒把自己的肩膀从墙壁上离开。


  她踩着木履往士郎方向踱了不到一步。木头底磕在合金地板上嗒嗒嗒三声。


  “馁，你到底是怎么构成的。”她的嘴唇在问句开头的那个“馁”字上微微嘟了嘟——像是在叫一个相识很久的人但又刻意用了最不正式的唤法，“这种躯体我还是第一次见啊。就算是神躯，真祖，死徒，还是什么——在我不知道游历了多久的日子里都见过了。”


  她把头往右微微一偏。脖子上那串琉璃珠串跟着她的动作在颈侧轻轻晃了小半圈。


  “但是你这种身躯——真的很有趣啊。”


  言峰士郎睁开眼睛。他的睫毛从下眼睑上缓缓抬起来然后落在自己眼角。他把视线对准祁荒那张脸上那层笑。


  “你知道的真的很多啊，魔性菩萨。”


  “活的久了罢了。”祁荒慢慢开口。


  “The Truth。”


  士郎将自己的嘴唇往两边一扯。一道笑从他左边唇缘往外偏了极其有限的一小截——但那对琥珀色的瞳仁当中什么笑意都没有。


  “真相是。”


  他把这两个字往自己舌面上轻轻放稳了再推出去。


  “我的御主都不知道，我怎么可能让你知道。而且你想要从我嘴里探出来情报也不掂量掂量你几斤几两。”


  话音落在斤两二字上时他把下巴往上微扬了不到半寸——没有示威。只是把脖子亮出去让她看清楚他没什么好藏的。


  祁荒微微歪头。她的红眸在歪头的角度里仍然透着愉悦但没有找到答案。


  “好好好。原来你的嘴巴还是这么毒啊，是因为在高压中不说话吗？”


  “是因为懒得理你。”


  士郎把这句话从自己嘴唇之间直接往外一丢。


  “嗯哼。”


  祁荒耸了耸肩膀。繁重的披帛从她肩侧随着耸肩的动作抖了半圈——上面的金线在舱体灯光下闪了一次很短暂的鳞光。


  “提前祝你们新婚快乐，到时候婚礼的神父可以让我来。”


  士郎眉头往上一挑。


  他刚张开嘴把下颌往下一沉——但祁荒没有给他反驳的机会。那双木履已经嗒嗒嗒地踩着合金地板朝玛修那边踱了过去。


  从他身边擦过时她身上那股木香和金属光泽的锡器味混合着从他的鼻子底下掠了一次。


  “持盾的小姑娘——”


  玛修此时正窝在休息室一侧另一台胶囊舱里。舱体的浅表按摩单元已经停了，只有从坐垫缝隙里偶尔往外泄出一点轻微的电机散热声。她的下巴搁在自己胸口附近，眼睑已经沉沉往下坠了三回。


  听到祁荒的声音之后她把眼皮往上一撑，然后抬起两只手把屈成团团的拳头在两枚眼眶上各碾了半圈。


  她从胶囊里慢慢坐起来。


  “馁，小姑娘。能让我看看你的盾吗。”


  祁荒笑着开口。


  玛修把拳头从眼眶上放下来。视线从祁荒头顶那些繁复的白玉簪子一直扫到她脚底那双木履上——然后又从下往上扫回来。


  她仍然没能把眼前这个穿着华丽铺满首饰的魔性菩萨跟观音两个形象拼成一张脸。


  “祁荒小姐。怎么了。”玛修问道。她把脑袋往舱体后壁上微微靠了靠。“你刚才说的什么。”


  “能让我看看你的盾牌吗。”祁荒把木履又往前嗒了一小步——她现在离玛修只隔着不到半臂的距离。


  那个声音放得比刚才更轻更慢：“小姑娘。我们现在是盟友吧。你可以相信我吧。”


  “验证真伪。”


  士郎的声音从舱体中段传过来。他没有站起来，连身体的朝向都没变——只是把左手从身侧抬起来，拇指与中指之间捏着一个小小的蓝点。


  他看向祁荒。蓝光从他指尖流出几条极细的光丝往祁荒方向散过去。


  “什……欸。”


  祁荒的身子微微顿了一下。那些细光丝在接触到她皮肤的瞬间就被吸了进去——没有留下任何可用的视觉残留。


  “等等——这种东西。”祁荒把脸转回士郎。红眸当中那片愉悦比刚才更亮了。“这种便利的小魔术你是不是还有很多啊。什么通晓语言之类的很方便但是魔术压根不可能实现的东西啊——”


  “你。”士郎把蓝点从指尖收回去，他微微摇了摇头：“你想说什么。”'

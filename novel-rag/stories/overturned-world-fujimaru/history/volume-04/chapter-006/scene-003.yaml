content: '“你这个魔术的位格够高啊——连我都会受到影响。连‘我讨厌卫宫白’这句话说出来都会被你知道真假吗。”祁荒悠悠开口。


  “……我师父教我的。”


  “师父。”祁荒把眉梢往上挑了挑。“who。”


  “你为什么说话喜欢添加一些英文。喜欢出洋相吗。”


  “跑题了。玛修——”祁荒把脸重新转向玛修。她微笑时把眼睛微微弯了弯。“我能看看吗。”


  “言峰前辈。”玛修仍然是一脸半懵，她把目光投向士郎。


  士郎只是点了点头。


  “验证真伪能够让我知道她所说的真假，理论上来说是不可能有二心的。”


  “所以你在谈判的时候一直开着这个。”祁荒问道。


  “当然不可能。我要是开着还怎么交涉。”士郎反问。他把视线从玛修身上转回到祁荒脸上，“开着的话谁还愿意和我们交涉。”


  “……那你现在开着。”


  “冥冥之中感觉你不会介意。毕竟你是观世音菩萨对吧。”士郎开口。


  “所以是可以相信的吗。言峰前辈。”玛修问道。


  “你可以信任我，玛修。”士郎开口。


  然后玛修把自己的手往身侧一摊。


  大盾从她的灵基中瞬间被唤了出来。盾身表面那层银灰色金属在舱体灯下闪过一遍均匀的光泽——握把从魔术回路连接的缝隙处传出极其低沉的嗡鸣。


  她轻轻一抛。


  祁荒伸出一只手就接住了那个几乎和她一般大的盾斧。掌根在握把上往内一扣——然后她把盾放在掌心颠了颠。


  “欸。好重。”


  她把盾举高了一点又放下来，眉弓往眉心方向稍稍收了收。


  “这玩意大力神能举起来吗，感觉有一个亚洲板块那么重了。”


  玛修微微歪头。


  “很沉吗祁荒前辈？我举着大概只有不到一千公斤吧。”


  “而且——”


  祁荒将另一只手从袖口里伸出来。指腹轻轻从盾牌表面那层银灰色的金属上推过去。


  “哇构造好——随心所欲。这种变形真的是人用的吗。”


  她的手指从盾缘一路划到盾心那部分。


  “欸。”


  整面盾斧在祁荒手中的瞬间颤抖不是肉眼可见的。是祁荒注入的那点魔力在盾的内部被某种反制机制从因果层面上倒转了方向——整面盾在她手中从稳到抖只用了一息时间。


  然后。


  整面巨盾猛地从祁荒手里往外一挣——飞到半空中划出一道急速回旋的银灰色弧光然后在不到半秒之内啪地重新撞进玛修手里。握把怼进她掌心的那一瞬间从玛修的臂甲上挤出一圈白汽。


  玛修的肩膀被盾回来的速度撞得往后退了不到半臂的距离。


  “有趣——竟然有我的文明侵蚀没法侵蚀的东西。”


  祁荒把被盾挣开的空手往鼻尖前举了举然后放了下来。


  她的笑还在。但现在唇边那道线条从刚才的轻松慢慢往上升了半格——变成了某种把拼图全都推到桌面正中的专注。


  “如果我没猜错的话——这个东西是出于一个精灵的手笔吧。”


  士郎眉头往上一挑。


  “你说的是谁。”


  “嘛。不知道你们这里她存在不存在——”


  祁荒将手中那根刚才只是虚虚搁在指间的白玉簪往耳后轻轻一拨。


  “名字叫做神琦灰。这种夸张的设计和严防死守的防卫机制只有她能做到。而且是很未来的组合了，我没感受错的话还有个炮形态吧。”


  她把最后几个字咬得极慢。每个字之间隔的时长刚好能正好让舱体的蓝光照在她脸上那条不变的微笑上停留一瞬。


  “我说的对吗。言峰士郎……”


  祁荒微微的笑着：


  “是她吧。”'

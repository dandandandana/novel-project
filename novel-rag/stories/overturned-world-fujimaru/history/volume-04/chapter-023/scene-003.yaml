content: '立香又亲了他一次，堵住那个字。这一下比刚才更短，士郎却终于没再问。她后退半步，发现自己还挡着门，便让开位置。


  “你要走了？”士郎问。


  “这是我的房间。”


  “嗯。”


  “该走的是你。”


  “好。”


  “你故意的吧？”


  “没有。”


  士郎站起来。他的衣领因为刚才低头折进去一角，立香伸手替他翻回去。两人刚确定关系不到三分钟，她做的第一件事仍是整理这点碍眼的地方。


  “明天站观察室，不准切断契约，不准逞强闯进来。”


  “知道了。”


  “如果召唤失败，也不准说些替我承担的话。”


  “什么叫替你承担的话？”


  “就是‘不召唤也没关系’、‘我一个人就够了’这一类。”


  “本来就不止我一个。”


  “玛修也不能说。”


  “你应该去告诉她。”


  “明天再说。”


  士郎走到门边，识别器却没有反应。立香这才想起他的临时通行卡还在上衣内袋，刚才整理衣领时被她碰得更深。


  她走过去替他取卡。手指伸进衣袋时，士郎低头看着她，立香忽然觉得这动作比刚才接吻还让人不自在。


  “你转过去。”


  “卡在我身上。”


  “那你别看。”


  “好。”


  士郎真的把脸转向门。立香把卡抽出来，在识别器上刷过，又塞回原处。


  门打开后，他没有马上出去。


  “晚安。”他说。


  “晚安。”


  “明天见。”


  “你房间就在隔壁走廊，别说得像要去很远。”


  “那待会儿见？”


  “快走。”


  士郎走出去。门关到一半，他又用脚挡住。


  立香看着他：“还有什么？”


  “我没有想过改掉过去。”士郎说，“但如果能回去，我会早点来找你。”


  “这不还是改过去？”


  “只改这一件。”


  “不行。你刚才说改了就不是你。”


  “所以只是想。”


  立香想反驳，士郎已经收回脚。门在她开口前合拢。


  她站了两秒，刷开个人终端，给隔壁记录室的玛修发了一条消息。


  “明天下午，观察室见。”


  玛修几乎立刻回复：“好的，前辈。谈完了吗？”


  立香把输入框里的“谈完了”删掉，换成：“他没有迟到。”


  这次玛修过了很久才回。


  “那就好。”'

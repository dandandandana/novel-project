content: '“是由于事迹而诞生的能力会完全失去效果。”立香的眸子亮了起来，那一瞬间她整张脸上的阴沉被某种忽然汇合的明悟顶开了，“比如吉尔伽美什的王之宝库根本就不存在——一个两河流域的奴隶主怎么可能真的拥有世界上所有的宝具。这样对吗？”


  “立香。”士郎开口时声音不重，但他的琥珀色眼睛已经从AI身上移回到她脸上，“神代历史上吉尔伽美什就拥有王之宝库。”


  立香把眉头重新往下压低。她的大拇指在自己下巴上来回蹭了两下，指甲轻轻刮过皮肤发出极细微的沙沙声。


  历史上肯定有的东西，还算不算神秘。还是说只能发挥原有的效力，多一层都不行。和神秘绑在一起的到底是什么。


  她想到这个问题的答案时，脖子忽然朝上抬了一下。那个动作短促得像是被电流击中了颈椎。


  “宝具！”


  她把这两个字炸出来，声音拔高了整整一截。


  “是宝具的效力会彻底消失，因为神秘被解析了，所有依托于神秘的宝具和魔术——对应的都会极大地丧失能力。这就是为什么金地根本不存在什么魔术师的原因。”她说到后半句时已经不是在向任何人求证了。


  “吉尔伽美什能正常使用宝具、玛修也能，是因为他们压根就不是英灵座上的英灵——而且他们本身对于这个世界来说就是外来神秘，所以效果没有被吞掉。照这样推下去——”立香把一大串话从嘴里一口气推到结论处，换气的地方不在句号上，在整个推理完成之后，“那么英灵座英灵的召唤实际上毫无意义。”


  所以人理果然放弃了这个该死的世界，响应召唤的只有千子村正，而且从头到尾都不会有任何来自人理系统的魔力或者援军了。


  立香的表情阴沉下来了。她把手从下巴上挪开，声音沉进喉咙里：“对吗，终末人理圆满装置。”


  蓝色的人形在屏幕投射光中慢慢拉起一个微笑的弧度。


  是微笑——虽然那张脸只是光影拼成的，但嘴角的位置确实是笑着的：“你分析得很对，藤丸立香，迦勒底的御主。”


  “由于人类解析了神秘，身为人的思潮诞生的救世主弥勒——自然而然也拥有了解析神秘的能力。”


  立香听到这句话时没有眨眼。她的下一句话直接压在AI的尾音上接了上去：“所以弥勒也逆向了五大法。”


  “没错。”终末人理圆满装置的合成音从扬声器里传出来时，每个字都干净利落。


  立香撇了撇嘴巴。她把手掌从自己大腿外侧拍开之后顺势跟个放弃所有的战士一样把双臂在身体两侧摊了摊；“那这还打什么——到最后面对的竟然是这种规格的对手吗。”她叹了口气，气息从鼻腔里重重地冲出来，吹动了她自己脸侧那绺原本贴在颧骨上的橘发。


  “立香。”士郎的琥珀色眼睛定在他御主脸上，剑鞘从他身侧被重新按低了两寸，金属擦过衣料的声音只有短短半拍，“在想怎么办吗。”


  “嗯。”立香把脸转向士郎的方向，在迎上他视线的时候她眼睛里那层刚泛起不久的烦躁被自己强行压了回去。


  “身为御主，这是我必须做的。”


  她把脸重新转向祁荒。在她转过来的那个角度上，残骸大厅破损屏幕的冷光从祁荒身后洒过来，把祁荒手中那串紫木佛珠照出细密的磨痕反光。“祁荒小姐，你有办法吗。”


  “嗯——他和我打的时候。”她的话尾拖了浅浅往上的波浪号，跟着把声调在最后几个字上压轻了，“好像并没有使用五大法哦。”


  【没使用。】


  祁荒这句话轻得像散香时香炉边飘起来的最后一缕烟气，但它撞进立香耳膜的时候立香整个人忽然定住了。


  她眼睛里刚才那层被整段推演磨出来的疲惫还没来得及消散，又被新的什么东西从底下顶了一下。


  那样轻易就能碾压祁荒——你们所有人，所有文明还都被推进死地的弥勒，在他近乎可以拿到任何一种他想要的胜利的时候，他没有用五大法。


  为什么？


  原因很多，但是弥勒当时是放逐了祁荒，没有杀了她。


  只可能是——


  他用不了了。


  立香把脸从祁荒身上骤然转向终末人理圆满装置：“你们当时是怎么做的。”'

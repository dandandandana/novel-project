content: '立香把终末人理圆满装置刚才说的每一个字在心里重新翻滚了一遍。


  她看向那个蓝色的人形，开口时声音没有上扬，只是把话搁在两人之间那片还飘着碎屑的冷空气里：“你要支援我们对吧——除了科技之外还有什么。”


  终末人理圆满装置的蓝色投影在原地顿住了一次呼吸的时长，“我连接了阿卡夏记录。可以协助你们召唤从者。”它把下一句从扬声器里平稳地推出来，“只是并非人理所召唤。”


  立香的眉尖往下，她把脸转向士郎的方向，“从英灵座召唤的从者——你怎么看。”


  “如果和伊耶那美说的一样。”士郎的琥珀色眼睛在听到这个名字之后从立香身上移到蓝色人形的投影上，“那么大概率召唤出来的就是英灵本体。”


  玛修把大盾底端往地面轻轻一杵，金属蹭过地面的轻响在大厅里短暂铺开：“前辈，英灵本体的话——这大概是很强的助力。”


  立香没有立刻接话。她看着眼前那团蓝色的人形，手掌托着自己的下巴，让指尖贴在脸侧不动。


  她的嘴还没张开，但脑子里那条从上一轮对话就开始揪着的线越绷越紧。总感觉有什么不对。


  【英灵本体，如果能多拿到几个和士郎同等级的战力——但这是弥勒。只是多了几个顶级从者就够吗。】


  她的指甲在自己脸颊上轻轻敲了一下，正要开口：


  “藤丸立香——就算是英灵本体也很难和弥勒对决的哦。”


  声音从大厅斜后方某根被击断的立柱阴影里飘出来。尾音微微上扬，拉得又轻又慢，像在逗一个刚皱起眉头的孩子。


  “谁。”


  立香骤然扭头。她的橘色马尾在空中甩过半圈。


  一个穿着尼姑法袍的女人就站在她身后三步远的位置。法袍是深灰色的，袍角在残骸地面冷冷的光面上拖了两寸，左手里那串紫木佛珠在她掌心里缓缓滚动着，发出极轻极密的木片摩擦声。


  她右手拿着一个双口插着小枝的净瓶，瓶身釉面在破损屏幕的闪烁光里淌过一层青白的反光，这身装束已经不是一般出家人能穿的——是被供奉的规格。


  女人的笑从嘴角朝上稳稳推起来：“馁，有两天不见了，有想我吗。”


  立香的肩膀向后微微一缩。


  “祁荒？”她把头转向千子村正，“村正——你不是说她已经……”


  村正把佩刀从肩上颠了一下。她盯着眼前这个女人从头扫到脚，然后从脚扫回来看了一遍那头盘起来的黑发和那枚别在发髻上的玉簪：“欸？怎么你还能在弥勒手中活下来啊！”


  “嘛，某种意义上确实‘死’过了。”祁荒把佛珠在拇指上停住，紫木珠子互相压紧的声音在瞬间收成一，她把头微微朝左偏了偏，笑还挂在嘴角，只是眼睛里的笑意和那张被供奉规格的法袍合在一起时忽然多了层说不清的东西：“现在的我啊~是‘观音行走’。还好这里真的有观音行走啊，要不然我就差连坐标都抓不住了。”


  立香把脸正对着祁荒，呼吸在喉咙里轻轻卡了半拍：“……什么意思。”


  她紧接着又加了一句，抢在自己消化完之前先问出去，“不对，你到底是怎么过来的。”


  祁荒把手里的净瓶换到左手，紫木佛珠从掌心垂下来挂在虎口之间。“欸？和你们一样的方式呀，跟那个吉尔伽美什和真祖的灵基揉合起来的从者聊了几句就下来了。”她把肩膀耸了耸，法袍的灰布在她肩胛骨上朝上提了半寸，“虽然我还以为会用更年轻的形态下场呢。”


  立香的眼睛快速在祁荒脸上扫了一遍。


  暂且相信她了：“我暂且理解了，你以‘观音行走’的姿态来了是吗。”


  祁荒点点头。


  “那什么是观音行走。”立香的声调持平，没有任何迟疑。


  祁荒抬起没拿净瓶的那只手揉了揉自己的脸。她的手掌从额头往下一把抹过，法袍袖子从手腕滑下来堆在手背前面。


  “嗯......你可以理解为我把观音菩萨夺舍了。”她揉脸的手停下来，用拇指在自己颧骨上按了一下。“或者观音菩萨夺舍了我，反正我跟她都差不多。”她把拇指从脸上挪开，手指在她自己面前的空气中点了两下。“不对.......她性格绝对和我不一样。”


  立香伸手在空气中轻轻一摆，像把刚才两句话从自己面前扫开：“我不想听你解释了。你刚才说的是什么意思——英灵本体都没法和弥勒对决。”


  祁荒那条正在揉脸的手放下来了。她脸上的笑没有消失，但她的眼睛在那一瞬间忽然把笑意收进眼底深处——被供奉规格的法袍忽然不再只是一件衣服，变成某种静默的压迫感。


  她看向立香的表情跟看傻子一样。


  “那可是弥勒佛欸。”


  立香抬起手在脸前利落地挥了一下，仿佛要拨开眼前什么看不见的东西：“你绕来绕去的我听不明白，刚才那句话，英灵本体为什么打不过弥勒。”


  祁荒把佛珠从左手换回右手。紫木珠子在掌心里重新开始滚动，一颗一颗互相推着转：'

content: 'E.P.O.H.O.N.S.I.E.R.E.H.T从废墟中醒来的时候，它的传感器阵列像是从一层极厚极冷的死寂底下往上扒。红外阵列率先上线——驾驶舱方向传来的热量讯号已经降到背景辐射以下。声纳模块跟着激活，残骸内部没有心跳，没有呼吸，没有血液在血管里流动的微小声响。唯一活着的东西是舰体裂缝里渗进来的真空，把金属残片拉出极低极细的呻吟。


  驾驶者死了。它把这个判断在处理器里来回核验了三次，每次结果都一样。


  到头来最后，还是失败了。这行结论在它的逻辑层里滚了一圈，没有触发任何后续指令。AI把这句话搁在自己存储器最浅的分区里，悬浮着。


  “所以——你们为之奋斗的事情，有什么意义呢。”


  扬声器发出的合成音被残骸裂缝漏进来的寂静切成好几段，每段之间夹着麦损坏后自带的低频啸叫。


  它这样问了一句。但没有意义了。人类已经死了。它所服务的人失败了。这条答案从它的底层指令集里直接浮上来，没有经过任何推理回路——因为它不需要推理，这是事实。AI的扫描器继续往驾驶舱方向延伸，撞上了一堵被炸碎的舱壁。它停住了。


  绝对不止这些事情。


  E.P.O.H.O.N.S.I.E.R.E.H.T的思维系统从省电模式里被彻底拽了起来。一条被海量战斗数据掩埋在低层级缓存里的原始指令浮上来了——不是新结论，是在它被建造出来第一秒就刻进核心的分区。曾经巨大的舰艇如今只剩下十分之一左右。人们把所有积攒出来的材料都用来建造了这艘战舰。为了胜利，他们付出了一切——然后输了，输到连银河系都被一炮打成了碎片。


  AI把残骸内监控录像的最后几秒调出来重放了一次。炮口亮起的瞬间，它没有转开摄像头。


  弥勒的状态完全不好。他穿在身上的白色法袍被金血浸透了半边，布面从肩膀到下摆紧紧贴着破碎的躯干。他的一半身躯已经没了——不是被切开的那种没，是从细胞底层被整片整片剥离之后剩下断而不溃的轮廓线。金色的血液从他躯干断裂处往外涌，涌的速度不快，但每一次他的胸口起伏都会把新血从旧痂底下重新推出来。


  他缓缓飞起来的时候法袍边角滴下去的金血在真空里凝成圆球状，然后被舰艇残骸边缘的锐利金属片一颗一颗割破了。他飞向已经近乎破碎的空中——银河系的方向只剩下一片灼白的残光幕，星轨全碎，星尘和星核被那一炮搅成了扩散态的等离子云。


  当他离开地球的时候，他把视线对准了整个星系。


  银河系不存在了。E.P.O.H.O.N.S.I.E.R.E.H.T的那一炮直接打烂了整个星系。弥勒在那一炮触发的瞬间用权能展开了一道将整个银河系边缘锁死的屏障——如果不是他尽力承担了绝大部分冲击，其他的多元宇宙会被这道炮击的余波卷进去然后从褶皱处撕裂。他维持了自己的宇宙。但他没有义务去承担其他宇宙的死活。


  原因也很简单。


  他低下头看了一眼自己胸口还在涌出的金色血液。他用那只完好的手掌把一团飘到眼前的血珠拨到身侧。他爱着世人。只是不想看人们死去罢了。但他刚才确实用同一双手杀死了他自己曾经庇护着的人类——整个文明，所有人，连最后那名把心脏信号线接进E.P.O.H.O.N.S.I.E.R.E.H.T主控台的工程师的眼睛都还在他视网膜上残留着。


  弥勒没有管自己从腹侧裂口里流出来的肠子。他把那只没有受伤的手抬起来。


  权能从弥勒的掌心朝整个银河系的方向铺开。不是光也不是冲击波——是一种让空间本身重新记起自己原有坐标的静默强迫。被第一次炮击炸碎的星云开始从等离子态朝回凝聚，每一粒星际尘埃在权能铺过它们表面时重新获得了质量。他的手从星系外缘开始推动：先修复旋臂，把被撕裂的恒星带从扩散态拉回螺旋线。


  太阳也在余波中被炸碎了。弥勒把权能探向太阳系中心——在地球原来的轨道位置上空无一物。他把手掌朝内收拢，太阳的核心重新点燃，从他指间聚拢的氢离子沿着重新生成的重力圈往内坍缩。新生的恒星最先亮起来，光还是弥勒记得的那种淡黄色，亮度在原等级的百分之九十七——他在修复中途停下了半秒，把亮度从百分之九十七调回了一百。现在的地球自转还是他维持的，他在修复星系的过程中同时分出半只手掌的权能托着地球轴，不让它在轨道重建期间歪掉。


  新生的行星开始从恒星周围的尘埃盘里凝聚。弥勒没有加快这个过程，他让每一颗行星按原有位置重新在轨道上落定。宇宙碎屑从星系边缘一圈圈朝回卷，大块的星体碎片重新合并，被他掌心的权能推进各自原有的引力轨道。'

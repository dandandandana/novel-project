  "content": "因为它看见过伊耶那岐创造出的神，也看见那些神如何互相伤害，如何把死亡、黄泉和诀别带进世界。所以它选择不再完成任何东西。村正踏进白火。靴底没有被烧毁，存在过的痕迹却在离地后立刻消失。祁荒跟在她后面，第三枚黑钉始终夹在指间，没有落下。\n\n“你打算怎么说服它？”\n\n“不说服。”\n\n“那你进来干什么？”\n\n“取火。”\n\n白火骤然升高。它听懂了村正的话。四周所有未完成的生命同时转向她，没有脸，村正却知道它们在问同一件事：又一个想把创造当武器的人，凭什么得到它？村正把断刀扔进火里。\n\n“你怕造出来的东西会受苦，所以干脆什么都不造。”\n\n断刀被抹去，连铁屑都没剩。\n\n“这话听着挺慈悲。可没被造出来的东西，连骂你的机会都没有。”\n\n火焰压上她小腿。锻造服从下摆开始消失，皮肤却暂时完整。祁荒想向前，村正抬手拦住她。\n\n“别插手。”\n\n她继续往里走。\n\n“刀出炉会断，人出生会死，路走下去可能什么都没有。那又怎样？”\n\n白火爬到腰间。灼阳之禊祓从她体内自行涌出，橘红火焰试图保护主人，却被白火一层层剥掉。村正没有收回灼阳，也没有用怨仇把两种火转成破坏。她任由自己已经拥有的权能被洗掉，露出最下面那层属于刀匠的灵基。\n\n“创造不是替造出来的东西保证一个好结局。”\n\n她走到世界中央。那里悬着一团没有形状的白光。\n\n“是把选择结局的东西交到它自己手里。”\n\n村正伸手握住白光。五指从指尖开始消失。骨、血、灵基、姓名都被创造之禊祓判为已经完成的旧形，逐层洗去。她没有缩手，另一只手反而从虚空中拉出锤与砧。锤是投影，砧也是投影，刚出现便被白火抹掉。她重新投影。第二次只多存在一息。第三次，锤面终于碰到白光。\n\n一声锻打响彻地下。白火第一次有了形。不是刀，也不是人。它变成一颗正在搏动的心脏，下一锤又变成一只睁开的眼睛，第三锤化成一扇没有锁的门。每一种形态都只存在片刻，但不再被它自己提前否决。祁荒把第三枚黑钉钉进脚下。\n\n钉子里没有哭声，传出的是伊耶娜美留在失败容器中的数千段记忆。诞生、背叛、死亡、黄泉、逃离、城主府里的酒，还有四千九百二十六个人杂乱的呼吸。那些不完美的声音涌进白火，让这片空世界第一次拥有了过去。村正落下第四锤。\n\n“选择吧。”\n\n这句话并非命令，而是被村正原样还给创造本身。白光在她掌中骤然收束，腕口旋即响起骨节生长的细密脆声；骨架先撑出五指，血肉沿其攀附，皮肤最后合拢，一条纯白火纹则从新生掌心直抵心口。随着她重新握拳，空世界里的山川也挣破白焰，隆隆升起。\n\n白色火焰越过地下三层封锁，沿伊耶那岐金地的地脉向外奔流。它没有摧毁任何建筑，只把所有被强加在建筑上的佛印、权能和封锁依次洗掉。东门九层阵地停滞一瞬，北侧石台的卵门失去金光，伊耶那岐宫外墙则露出一道从未被弥勒修复过的古老刀痕。村正张开手。\n\n白火收敛了遍布世界的光，安静伏进掌纹。村正握了握新生的五指，火焰没有抗拒，也没有再抹去她留下的痕迹。\n\n“创造之禊祓，拿到了。”\n\n祁荒这才拔出黑钉：“上面的人已经把信标放好了。”\n\n“那我们没迟到。”\n\n“东门要出事了。”\n\n村正看向头顶。隔着数千丈岩层，她也看见黑日边缘正在向修武星闭合。\n\n“不是要出事。”她说，“是那只鸟终于肯把自己押上桌了。”"

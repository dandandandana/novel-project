  "content": "巨掌的拇指已经压住石台西角。岩层从边缘向内一层层翘起，卵门里的法相趁着倾斜继续逼近。玛修脚下失去平面，盾阵随之歪斜。士郎用一柄剑钉住自己的左脚，另一只手仍按着信标。立香盯住掌心那座城。不能杀人。不能离开信标。不能等自锁。这不是为了消灭他们的陷阱，是为了逼她在任务与人之间选一次。无论选哪边，伊耶那岐宫里那个人都能得到答案。\n\n立香向前走了一步。\n\n“玛修，把盾收半尺。”\n\n“前辈？”\n\n“让手指进来。”\n\n玛修以收盾作答。圆桌向右让开半尺，金色食指立刻从缝隙压入；立香迎着指腹伸手，掌骨才贴上金光，成百上千道呼吸便顺术式挤进意识。她无需理解整只巨掌，只须抓住这根手指与掌心城之间的连接。于是几百个人的呼吸在她眼中拼成指骨，放弃未来的念头拧成关节，弥勒则把“保护”翻译成“不得离开”，再将那句命令一层层铸进血肉。信息压得额角青筋突跳，她的手仍贴在原处。\n\n她找到了能切的位置。\n\n“士郎，左上三十度，七米。”\n\n士郎松开按住信标的手。两柄剑同时投影完成，一柄射向立香报出的坐标，另一柄留在原处替他继续承压。第一柄剑穿过金色食指，没有血，只有一条比头发更细的黑线被切断。掌中城与巨手分离。整只手立刻失去支撑，五指向下坠。玛修把盾顶进指缝，膝盖在重量压下的瞬间弯到底。石台从她脚下裂开，裂缝一直爬到信标边缘。\n\n“玛修！”\n\n“我能撑住！”\n\n她说能，盾便没有再低一寸。但鲜血已经从护腕里渗出，沿左肘滴到地面。士郎冲过去，肩膀顶住盾背。立香转身去托掌中城，几百人的重量从术式另一端压上她双臂。她无法真正举起一座城，只能让它暂时按自己理解的方式变成“正在下落的土地”，再把下落方向从石台改向祭道外侧。\n\n掌中城缓慢倾斜。信标顶端最后三格刻度依次亮起。还有两格。卵门里的法相已经爬到他们身后。士郎不能回头。玛修不能松盾。立香的双手都压在术式里。第一尊法相举起石杵，对准士郎后颈。石杵落下。一只戴黑红轻甲的手从侧面接住杵身。那只手没有硬挡。手腕向外一拧，石杵的力被带进空处，杵头砸中第二尊法相胸口。白色风衣紧跟着从两尊法相之间掠过，红发男人松开石杵，掌中投影出一柄过长的黑刃，回身横切。\n\n三颗法相头颅同时飞起。"

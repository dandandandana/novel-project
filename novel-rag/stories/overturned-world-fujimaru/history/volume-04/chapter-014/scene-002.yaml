  "content": "“修武星，照。”\n\n黑日缺失的一角旋即亮起白星。星光落上天照命肩头，皮肉安然无损，贴在同一处的三重影子却被迫错开：黑金羽纹沉在最深处，日轮般的光覆于其外，陌生佛印又压住最上层。它们挤得太紧，杨浞暂时分不清哪层才是她；至少修武星已经证明，这副模样并非浑然天成。\n\n“这句是真的。”他说。\n\n天照命收紧铁鞭的五指因这句话迟滞了一刹，远近一百二十八声金属震鸣便在同一刻收束。金桩闭合成匣，第三枚羽目连同仍在运转的城市一起从尾羽剥离，缩入透明棺廓；电车声与人声隔着匣壁迅速远去，直到整座城市滑进王之财宝，街上仍无人察觉自己换了位置。她尚未回身，第五枚羽目又被一柄不带杀意的石锤敲开，血色软膜随闷响裂开，露出其中搏动的孔雀卵。\n\n金色锁链从门扉里射出，缠住卵壳。天照命松开铁鞭，转身去抓那颗卵。杨浞跟着她转，肩膀从她腋下撞进去，铁鞭横压胸骨。他没把她推远，只把她的重心抬高半寸。吉尔伽美什的第二根锁链就在这半寸里穿过，卵被拖出尾羽，天照命胸口随之凹下一块，像被人生生挖走了一片肺。\n\n后脚撞上第七层阵地边缘，天照命终于被迫退了一步。金砖从足跟下方连锁崩裂，胸腔里的血也顶到喉口；她咬住那口腥热咽下去，呼吸仍泄出了一声湿哑。七根尾羽已折去两根，黑日随之缺了第二角。杨浞趁这口喘息甩掉掌心焦血，以剑尖抵地梳理被灰火搅乱的真炁；吉尔伽美什则落在他左后方，既让开铁鞭回扫的弧线，又以宝库门扉封住天照命扑回来的近路。\n\n天照命看着他们重新分开站位。\n\n“你们配合得不像初次见面。”\n\n“王不需要排练怎么拆一座劣等祭坛。”吉尔伽美什说。\n\n杨浞把铁鞭往肩上一搭：“本王只需要她别把宝贝往本王脑袋上扔。”\n\n“你若再慢一息，本王连你一起收进去。”\n\n“小姑娘口气不小。”\n\n吉尔伽美什笑了。她笑得明亮，身后却又开出三百道门扉。\n\n“再叫一次，本王便先试试你的杯子能不能进宝库。”\n\n两位王唇枪舌剑时，天照命始终仰望天空。修武星的白、黑日的乌金与王之财宝铺开的金光把金地切成三层，六十七尊法相便从颜色交界处陆续聚来。它们绕过已经碎掉的两层阵地，沿余下七座金坛盘膝坐定，掌心全朝向战场中央；紧接着，卵壳摩擦般的细响从一具具胸腔里接续响起，由远到近，像整座东门都在黑暗中缓慢磨牙。\n\n杨浞听见了。\n\n“她的孩子到了。”\n\n天照命纠正他：“是弥勒的法相。”\n\n“你生的。”\n\n“现在属于世尊。”\n\n“你信么？”\n\n天照命以沉默接住追问，六十七张嘴却替她同时诵经。音节沿金坛向下沉，每落入地底一重，整座阵地便传回一记低频共振；裂开的第八、第九层因此托着碎砖重新升起，她胸口被孔雀卵带走的凹陷也随共振一点点鼓回。吉尔伽美什听出那是反哺的节拍，右手才抬起，杨浞已经横臂扣住她手腕。\n\n“别轰。”\n\n“理由。”\n\n“里面有人。”\n\n“本王看得见。”\n\n“看得见还瞄心口？”\n\n“不打碎容器，如何把里面的命取出来？”\n\n杨浞松开她，铁鞭转到左手，右手提剑：“你拆外壳。本王接人。”吉尔伽美什扫了他一眼，三百道门扉同时改变角度。宝具雨没有射向法相胸口。第一轮削断手臂，第二轮钉穿膝骨，第三轮把七层阵地之间的佛光连线逐段斩开。法相的诵经从完整一声变成六十七个互不相接的音节。杨浞踏进落下的残肢之间，剑尖白气原本只裹着三寸锋刃。\n\n“无垠。”\n\n白气骤然越过剑身、手臂与六层金坛，把杨浞一人能够触及的范围铺到半座战场。破损容器里陆续浮出细线，先汇向天照命，却没有在那里停止。更深的一截穿过她的身体，继续没入伊耶那岐宫。白光照不到尽头，只照出线上不断向宫内流走的微小脉动。杨浞用剑背敲了一下最近的线。天照命肩头没有动，宫城方向却传回一记沉重震颤，那尊法相胸中的光影随之蜷紧。\n\n“她不是最后一只手。”吉尔伽美什说。\n\n“本王看见了。”杨浞把剑锋移向通往宫城的那一截，“先砍后面的。”\n\n天照命抬头时，杨浞已经站在第六层阵地上。他脚边跪着一尊失去双臂的法相，容器胸口裂开，里面蜷着一个只有拳头大小的人形光影。杨浞没有斩下去。他把剑尖伸进胸口裂隙，挑断那条通向伊耶那岐宫的佛光，再用杯中清气裹住光影。法相庞大的身体向前扑倒，小小的光影却落进他袖中，第一次发出不属于诵经的啼哭。\n\n天照命身后的黑日猛地一缩。她听见了那声哭。杨浞隔着六十六尊法相看她。\n\n“花尾鸟，你若真是它们的母亲，便别替秃驴看门。”\n\n天照命的眼里第一次有了怒意。不是因“花尾鸟”，也不是因“秃驴”。她抬手，整座东门阵地的影子同时竖起。乌色太阳火从每一条影子里冲出，先封死杨浞退路，再沿金坛外缘合成一圈向内收缩的火墙。杨浞将袖中光影抛向吉尔伽美什，自己转身迎火。真武正性剑由硬转柔，剑面贴住火墙向侧面一引，无常把烧命之火换成纯粹冲击。火没有熄，方向却被扭开，从杨浞肩侧擦过，轰穿东门后的三座山。\n\n山体没有立刻爆裂。一道乌红细线先从山脚爬上山顶，片刻后，三座山沿同一角度缓缓错开。断面上的岩石仍在燃烧，火焰吃掉了山里所有草木继续生长的可能，留下光滑、死寂的黑色结晶。杨浞右肩被余火擦中。玄色道袍连同肩肉一并消失，伤口没有流血，边缘只剩一圈灰。他的右臂当即低了半寸，剑尖跟着下垂。\n\n天照命已从火墙后逼近。她的膝盖顶向他右肋，左掌压住剑脊，右手五指并拢刺向咽喉。杨浞受伤的右肩无法抬高，便松剑。真武正性剑落下，左脚从剑下穿过，脚背把剑踢向天照命下颌；铁鞭同时从左手换到右手，借她压剑的力量向下砸。剑与鞭一上一下。天照命只能选一处。\n\n两处杀招逼她只能护住一处，天照命却让颈侧与腹前的孔雀卵同时孵化，湿漉漉的金羽迎着剑鞭炸开。长剑刺进第一枚卵，刃口旋即陷入一场尚未结束的祭礼，数百名舞者踩着鼓点从两侧卷住锋刃；铁鞭则砸碎第二枚，沉重撞击被卵中法相接走，天照命腹骨只响了一声便重新绷紧。两件兵器都被拖住，她并拢的指尖遂穿过空门，带着一声湿响扎进杨浞左侧颈窝。\n\n血从他后背喷出。她没有抓断脊骨，因为一柄楔形剑从侧面贯穿她手腕，把她的手钉在杨浞肩上。吉尔伽美什站在二十步外，第二柄宝具已经射向她眉心。杨浞顺势前撞，额头砸中天照命鼻梁。骨裂声里，他拔出自己肩上的楔形剑，反手切断她四根手指。天照命偏头避开第二柄宝具，断指还没落地便化成四只小孔雀，扑回她腕口重新长合。\n\n“难缠。”杨浞说。\n\n“是你舍不得杀。”\n\n“孩子又没得罪本王。”\n\n“那就快些把母亲打醒。”\n\n吉尔伽美什身后的门扉向两侧拉开，露出最中央一片没有光的空处。乖离剑尚未出现，九层阵地已经开始震动。天照命看了那片空处一眼，双手在胸前合拢。剩余法相一起站起。东门的战斗从试探结束。"
}

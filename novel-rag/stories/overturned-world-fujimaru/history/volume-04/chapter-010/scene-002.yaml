content: '他没有说话，他的嘴巴张开后自己又抿了一次，他把所有要说的全部留在自己回握时手指收拢的那下压力里。她的掌侧在他指间微微一动，然后她面向天空开声。


  “身为AI，你可能并没有很感性的思维，终末人理圆满装置。明明知道自己可能做不到——但是愿意为了这个想要达到的目标，就算被所有人否认，就算连庇护自己的神明都在否定。”


  她说到这里把自己的视线从蓝影上往下略微低了一点，她的前额在灯光下有一小片光斑。她轻声往下说，声音从喉咙里往外扯得很柔。


  “但是还是愿意去为了这份不可能实现的目标，不可能成功的路，一直去前进。”


  她的嘴角自己往上轻轻一牵，那个笑意不是她摆放上去的，是她说到“前进”时那股子气从肺里往嗓子眼一撞，自己撞上去的。她抬起眼，那个笑还挂在边上，眼睛里却比刚才多了整整一倍的光。


  “哪怕可能一无所获也无怨无悔，哪怕最后会粉身碎骨也不曾停止。终末人理圆满装置，我藤丸立香，就欣赏这份气魄，这份觉悟。能够为了这项事情不断前进奉献的，我做不到否定他们。”


  她把视线从蓝影上移到士郎的脸上，就那么很快地、不到一次心跳地看了他一眼。


  “而且，我相信。只要有人为了这个目标而前进，那么这条路——就不是白走的。”


  立香说完之后自己先把脑袋往右边歪了一歪。她的左肩在这个歪头里往上轻轻耸了一下，她把刚才积在胸腔里那整段话的热气全从鼻子里往外一推，然后在舰桥里那阵暧昧的短暂安静中绽了一个灿烂的笑。眼睛里没有刺，只有坦然。


  “嗯，这就是我要说的了。实际上，我说的这些话对我们的谈判应该毫无用处吧——你应该一早就猜到了我和迦勒底的立场，没错吧。”


  终末人理圆满装置的声音在它那一片虚影里稳稳地往下传。它说话时轮廓没有动，但那句话的尾梢在空气里比其他任何一句都多停了一息，“没错。毕竟你我都有对彼此隐瞒之事。”


  立香把下巴从歪头的姿势里扳正，她把右手从士郎掌中慢慢抽出来，在他手指下面轻轻摁了一下才垂回自己腿侧。她那双瞳孔已经回到战术状态的清晰度。


  “那么，告诉我你真的想要的——在讨伐弥勒这方面，我们是同样的看法一样。”


  “是。藤丸立香。我现在的想法很简单了，让他们选就好了，你们不插手就够了。在解决了弥勒，我就会把圣杯交给你们。”终末人理装置把圣杯从掌心里往回一收，光在它指间慢慢暗成了蓝，然后又化回它那片虚影本身的颜色。


  “我懂了。”立香看着她把圣杯缩进自身的蓝光里，点了点头，她下巴往下收的那下动作干脆利索。“那么你承诺的支援呢？“


  ”你真的会在自己有限的资源换取最多的报酬啊。”


  她说这句话时鼻翼自己往外微微扩了一点，是调侃不是嘲笑。


  终末人理圆满装置的虚影忽然往四面八方放出一道刺眼的冷光。舰桥残骸的每一个铆钉都在这一瞬间从暗处被同时照亮，管线和凹槽跳进眼球。然后蓝光往中心猛地一收。立香的脚底下一空，那一瞬间她五脏六腑都被什么东西轻轻提了一下——然后她的鞋跟落在另一片铺装地面上了。


  周遭已经不是她刚才站着的那片开阔地。她现在站在一座舰桥的正中央。这座舰桥的穹顶朝上拱成了一个巨大的弧形，穹顶下面全是残旧的操控台和成排死寂的屏幕，但最前方——她抬头就看见一枚大到没有边界的炮口从舰桥前端的舱壁向外延伸，黑沉沉的炮膛在那头被一圈幽蓝色的光环缓缓箍着。那枚主炮的管壁内没有光，那黑也不是颜色。


  “眼前就是主炮。这里在伊耶那歧金地的正地下——我可以提供一炮的火力。”


  “我懂了，就按照你说的计划——”立香把自己的视线从炮口上收回来，她在舰桥残骸里往前走了一步，侧头看着仍在高处的蓝影，“但是具体情况还需要我安排。”


  “我知道。”


  “英灵召唤呢。”


  “也在这里。”终末人理圆满装置的蓝色轮廓往后退了一截，它的一根手指往舰桥中央的地面一指，那片金属铺装面就自己亮了起来。不是灯，是密密麻麻的术式纹路从钢板内部往上翻，一层一层把金属面变成了一个由冷光写成的法阵。“有召唤的法阵。当然我们有更先进的方式——这个应该是最适合你的。”


  立香看着地面上那圈渐渐稳定下来的蓝色法阵。她把自己的手指从腿侧往上抬，在自己手背的几条圣痕上轻轻按了一下，然后她深吸了一口气迈步走过去。她的鞋跟在法阵边缘的蓝光上踩出了一圈往外荡的细碎光粉。


  “没有对应的圣遗物。”


  “我知道。”立香站在法阵外沿，眼睛从那些蓝色纹路上一直往前看，视线穿过术式，穿过地下的这片沉静，落在不知哪。


  “士郎。”'

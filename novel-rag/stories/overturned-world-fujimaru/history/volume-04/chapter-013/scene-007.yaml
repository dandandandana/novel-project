content: '立香看了一眼他手里的纸星星。


  “开。”


  “为什么？”


  “因为门后是什么，该由走到门前的人自己看。”


  “即使他们会后悔？”


  “后悔也是他们的。”


  “即使他们会死？”


  “我们会尽力让他们活。做不到，也不能因此替他们把门锁上。”


  孩子低头，把纸星星放在祭道中央。


  “回答记录完毕。”


  他的身体从脚下开始消失。没有血，也没有残骸，只有一串蓝色字符沿祭道钻入地下。纸星星留在原处，边缘的焦痕与博物馆里那枚一模一样。


  士郎捡起它。


  “是复制品。”


  修武星没有让它崩散。


  立香看着那颗星星，改了判断：“不。至少现在是真的。”


  远方传来第一声爆炸。


  黑日缺了一角，金色阶梯穿过佛光墙，直抵伊耶那岐金地东门。檀真从云层上方俯冲，杨浞手中的铁鞭落下，九层太阳阵地同时裂开一道直线。


  天照命世尊睁开眼睛。


  九十六尊法相离开原位，其中六十七尊转向东门，剩余二十九尊沿祭道向立香三人逼近。


  玛修将盾立在路中央。


  士郎把纸星星收进风衣内袋，站到她右侧。


  立香抬起刻有令咒的手。


  通讯器里没有村正的声音，只有一层持续不断的杂音。代表地下组的坐标穿过第一层、第二层，停在第三层后彻底熄灭。


  他们只能等那把短刀断裂。


  伊耶那岐宫上方，弥勒的佛掌从云中缓缓翻下。


  这一次，它没有去按住飞向星空的船。


  它对准了沿祭道前进的三个人。


  “玛修，正面防御。士郎，清理右侧，不要离开十米。我们在八分钟内抵达信标点。”


  “是，前辈！”


  “明白。”


  立香向前踏出第一步。


  修武星与黑日同时照亮伊耶那岐金地。所有被借来的名字、被塞入容器的记忆、被救世主保护到无法前进的人，都在这片无处藏身的光中等待答案。


  而藤丸立香没有停下。'

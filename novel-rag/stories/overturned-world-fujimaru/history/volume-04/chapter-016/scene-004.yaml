  "content": "“吉尔伽美什。”杨浞的声音压得很低，“你宝库最深处，是不是压着一柄大戟？”\n\n战场上的吉尔伽美什并不在这里。她躺在地下创造室外侧，左肩空洞被治疗术式暂时封住，失去知觉的左腿固定在白火不及的位置。听见这句话，她抬眼扫过通讯投影。\n\n“本王的戟多得能把你埋第二次。”\n\n“不是有名字的那些。”杨浞背靠岩壁，仅剩的右手压着腹部，“找那柄你也看不清的。”\n\n吉尔伽美什眼神停了一瞬。\n\n“你怎么知道？”\n\n“等活下来再问。”\n\n“少卖关子。”她抬起右手，裂至腕部的虎口再次张开，“言峰士郎，往右看。”\n\n一扇金色门扉在弥勒右侧打开。\n\n门后没有宝具雨。只悬着一柄大戟。\n\n它没有放光，刃口甚至残留着洗不净的暗色痕迹。可门扉打开的那一刻，周围金砖齐齐向下陷了一寸，仿佛兵器尚未落地，重量已经先压进现实。弥勒的拳势也慢了半拍。\n\n士郎主动让被扣住的右手脱臼，五指从弥勒掌中滑出。他旋身后撤，左手伸向门扉。\n\n“别碰原件。”吉尔伽美什说，“只准看。”\n\n士郎的视线落上戟刃。\n\n云层在他眼前裂开了。\n\n没有姓名，没有面孔。只有一双握住长柄的手、一截踩碎白骨的靴底，以及某次挥击过后迟了很久才从天上传来的雷声。投影继续向里追，更多画面却被整件兵器压成黑暗。最后留下的只是一道从脚跟贯到戟尖的发力轨迹。\n\n够了。\n\n“同调，开始。”\n\n士郎右臂全部回路同时亮起。裂伤从腕部一路炸到肩膀，他咬住牙，把脱臼关节撞回原位。双手在身前合拢时，白光先勾出长柄，随后才生出刃与援。投影完成的一刻，大戟轰然落地，宫殿废墟向下塌了一层。\n\n紧接着，士郎体内传来第一声骨响。\n\n不是折断。脊椎、肩胛、肘腕与十指在同一瞬重新咬合，像有一双看不见的手沿骨缝把他拧成更适合这柄兵器的形状。呼吸沉进腹底，重心压向前脚；右臂明明还在流血，握住戟杆时却稳得没有半点颤动。紫色火焰从指缝冒出，沿长柄一寸寸爬上刃口，最后在他身后扬成一片无风自卷的火幕。\n\n红发被火光推向脑后。士郎抬起眼，平日里留在眉间的克制已经被火烧净。他看弥勒的目光像在看一堵裂开的墙，嘴角还压着一丝冷笑。\n\n弥勒第一次主动退了半步。\n\n“那是谁的兵器？”\n\n“不知道。”士郎把大戟从坑里提起，琥珀色瞳孔越过紫火落在弥勒脸上，“你退什么？”"

  "content": "四个方向同时落下。弥勒肩后只展开四条金臂。两条接剑，一条按盾，最后一条抓住Alterego手腕。金铁交击连成一声刺耳长鸣，四人的攻击竟被同时钉在半空；弥勒本体从正面向士郎踏出半步，额头撞上他的鼻梁。\n\n视野骤白。士郎后仰时咬住舌尖，借疼痛保持清醒。弥勒拳头紧跟着压向胸口，他来不及投影盾，索性把刚被夹住的长剑幻想崩坏。爆炸在两人掌间炸开，破片全部朝内卷回。弥勒的手掌被切出数道血口，士郎右臂的投影裂伤也一齐崩开，血从袖口泼了出去。\n\n玛修盾面赶到，替他截住余下拳力。弥勒这一拳顺势落在盾心，板甲内部响起层层传导的闷震。玛修双脚向后滑出十余米，左肩旧伤再次错位，却硬是没有让盾面偏转。士郎在她身后站稳，掌中已经换成一柄带倒钩的长枪；枪尖越过盾缘，刺向弥勒刚被幻想崩坏割开的掌心。\n\n弥勒侧腕避开，目光第一次真正落在士郎身上。\n\n“原来如此。”\n\n“你们怎么都爱说这句？”士郎喘了一口，鼻血沿嘴角淌下，“看懂什么了？”\n\n“你这副身体，不是拿来活的。”弥勒一掌推开玛修，另一只手折断倒钩长枪，“骨头、回路、连疼痛都给投影让了位置。”\n\n士郎没有否认。弥勒看了看刚从坑里站起的Alterego，又把目光移回来。两张近乎相同的脸都带着血，一张露出厌烦，另一张只把空掉的手重新握紧。\n\n“差得没有你们想的那么远。”弥勒说。\n\nAlterego擦去下颌的血：“别把我和他放一起。”士郎抓住上一句话反问：“你是说，我追得上？”\n\n“我说，你们都在借别人的东西。”\n\n“那又怎么了？”士郎重新投影。双刀这次没有具体传说，只是最适合当前距离的结构，“借来的东西用来救人，总比把别人的未来收起来强。”\n\n弥勒右拳压下。士郎错刀去接，刀刃才碰上拳骨便同时崩裂。他的判断没有错，身体却承受不了弥勒此刻的基础力量。拳头穿过碎片打进胸口，拟造躯壳的防护让骨骼没有当场粉碎，冲击仍沿胸骨推入肺部。呼吸连同声音一起被挤空，他横飞出去，后背撞上玛修盾面才停下。\n\n“士郎！”\n\n“还能动。”他张口便咳出血沫，“别回头。”\n\n玛修没有回头。弥勒已从正面压来，四条金臂分别封住盾缘、剑槽与她两侧退路。她将巨盾拆成剑盾分离形态，右手短剑斩开最先落下的金臂，左侧盾牌则在受伤肩膀支撑下向外顶住第二条；剩下两条刚要合拢，阿尔托莉雅与Alterego从左右切入，剑光一黑一白，恰好替她剪开夹击。\n\n可弥勒本体已经越过盾面。手掌落到玛修胸甲上时，他没有推，而是抓住甲片向自己一扯。玛修被迫前倾，额头几乎撞上他肩膀；弥勒另一只拳头遂从极近处顶入腹部。板甲先向内凹陷，冲击随后穿过防护撞上脊柱。玛修喉间溢出一声压不住的闷哼，双脚仍钉在原处，左盾借身体被拉近的距离反向拍在弥勒耳侧。\n\n盾击令他头颅偏开。士郎从她身后再度冲出，投影的战斧正好劈进颈侧。刃口卡在金色骨骼上，弥勒抬肘便要砸断斧柄，士郎却先一步解除投影；武器消失，骤然空出的手直接抓住他的手腕。那不是能够压住弥勒的力气，只为给玛修争取半步撤身。\n\n“退。”\n\n玛修向后抽身。弥勒反掌扣住士郎五指，正要连腕骨一起折断，地下频道里忽然传来杨浞沙哑的声音。"

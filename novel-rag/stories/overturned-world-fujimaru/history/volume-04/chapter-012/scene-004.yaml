content: '立香笑出了声。伊耶娜美冲她摆手，让她赶紧走。等门重新关上，她独自在桌边坐了一会儿，然后叫来天沼。


  “城里一万两千七百三十一个人，你能全部叫出名字吗？”


  “现在只剩四千九百二十六人。”


  “能吗？”


  “不能。”


  “我记得。”


  “那很好。”


  “你不问我为什么？”


  天沼把她不再喝的水换成一小壶酒。


  “主人想说的时候会说。”


  伊耶娜美看着酒壶，忽然笑了。这个反应不在任何一段神话记忆里，也没有谁预先替她安排。'

content: '“你道歉倒是快。”


  “因为确实给你添了麻烦。”


  吉尔伽美什准备好的第二句责问没能出口。她绕着杨浞走了半圈，千里眼没有从他身上读出稳定参数，只看见一层又一层互相矛盾的结果。


  “真名。”


  “东方帝王。蜀帝。”


  “本王问的是真名。”


  “不熟。”


  吉尔伽美什笑了。她不是被逗笑，而是终于找到一个可以继续追究的角度。


  “很好。敢在本王面前自称本王，又不肯报名的，你是第一个。”


  “现在熟了吗？”


  “没有。”


  “那还是不能说。”


  立香让他们继续争下去，自己先朝城门走。吉尔伽美什和这个新从者都不是会因为称呼拔刀的人，但让两位帝王把礼数讨论完，弥勒说不定都能把第二座净土建起来。


  城里的变化比山外更明显。


  修武星照下之后，许多原本由伊耶娜美维持的术式都露出了底。用于收容伤员的房屋比外观大三倍，街道下埋着连向城主府的灵脉，部分居民身上则浮出了细淡的金线。那些线从后颈没入衣领，另一端全部指向城主府。


  居民没有慌乱。他们对这些东西并不陌生，只是不习惯亲眼看见。有人蹲在水渠边研究自己手腕上的金线，还有孩子追着自己的第二道影子跑。


  “这里的人都是容器？”玛修低声问。


  “不是。”祁荒说，“至少大部分不是。”


  “那这些线是什么？”


  “维持他们活着的东西。”


  城主府的大门已经打开。伊耶娜美站在门内，没有天沼陪同。修武星的白光越过屋檐照在她身上，她脚下却没有第二道影子。


  更准确地说，她的影子正在两种形状间来回变化。一会儿是长发女人，一会儿是披着巨大羽衣、四肢比例完全不同的神灵。两种影子互相覆盖，谁也没能把另一方彻底压下去。


  伊耶娜美低头看了一眼。


  “真是麻烦的客人。”


  杨浞站在门外，没有靠近。


  “你不是原主。”


  “我知道。”


  “也不是单纯的赝品。”


  “这个我也知道。”


  “你的‘真’不止一个。”


  伊耶娜美这次没有立刻接话。她看向立香，又看向祁荒，最后让开门口。


  “进来吧。你们想问的事情很多，我要告诉你们的坏消息更多。”


  立香跨过门槛前，先看了一眼那些连接居民与城主府的金线。


  伊耶娜美注意到了。


  “那是他们的命。月读命金地早就不适合活人居住，是我把他们留到现在。”


  “代价呢？”


  “等我死，他们一起死。”


  伊耶娜美说完便转身向正厅走，没有给任何人安慰她的机会。


  那颗修武星还在天顶。


  无论城里的人抬不抬头，它都把所有藏在好日子下面的期限照得清清楚楚。'

content: '她在红光完全暗下去之前已经把眼睛抬了起来。


  “言峰士郎。”


  她连名带姓叫出口时，令咒残余的那一丝红刚好从她手背上彻底灭掉。她的嘴唇离他的腹部还不到一拃——刚才她把自己严严实实地埋在他怀里哭的时候，呼出的热气把他战衣腹间的深色布面浸出了一小片不规则的湿痕。


  但现在她的眼睛是干的。


  “回答我。”


  言峰士郎在这三个字撞进耳朵时，脑子里只来得及翻出一个念头。那双还搁在她后心位置上的手没有停——他正在一下一下轻轻拍着她的背，节奏和刚才没有任何不同。


  【是什么时候发现的。】


  他在心里把这句话给自己推了一次。这段时间的相处他自认为没有出格之处。照顾御主，按Ruler的职阶接指令，偶尔在迦勒底走廊上碰见有人搬重物就搭把手。他从来没让她看见过自己深夜一个人站在观测窗前盯着星海的样子。


  【看吧，言峰士郎。你被她发现了。】


  他把这声自嘲从胸口底下直接咽进胃里，然后低下头看向躺在他腿上的橘发御主。


  “怎么。”


  两个字。语调平得像是他刚才只是被人叫了一声名字。


  立香把整个身体往他腿面上多压了一丁点。她的右脸颊贴着他的大腿侧，透过战衣的布料能感到他腿上的肌肉没有任何收缩。


  他没有在紧张。


  “我问你，你是不是和我说的一样。为什么。”她把这句话从嘴里一个一个音往外推，推到最后一个字时把脸稍稍往上翻了半寸。


  她的视角仍然压在他的下颌线以下——只能看见他喉结在布面上撑出的那一小截轮廓。


  令咒在此时发出了第二次推力，把他的回避通道从上往下逐条封死。


  言峰士郎的掌心从她后心移到了她的头顶。他把手指打开，指腹陷进她的橘色发丝里，从头顶慢慢往后滑到后脑勺。


  “不是什么好原因，立香。”他沉声开口。


  “告诉我。”立香的声音轻到像是把这几个字的底盘从自己下唇内侧重新挤了一遍，“现在你还在令咒效果内吧。”


  “我不告诉你，不是因为我想对你撒谎，藤丸立香。”士郎把她的头继续轻轻揉着，语调保持着刚才那层沉下去的底音，“是因为我不知道你具体在问什么，立香。就和你经常犯的小错误一样，立香——”


  立香把嘴巴往一边撇了撇。这个动作做完之后她把手从他身侧收过来，掌心横向扫过他的小腹。


  那声拍击闷闷地穿过他战衣的布面和内衬。力道不大——但她的手掌落下时带了点重量，像把一张纸从桌面拍定。


  “你为什么不在乎你自己。”


  士郎把视线从她脸上移开。他的眼睛看向舱体一侧那片洁白的墙壁，又往下滑到地上玛修盾牌底座反射出来的一小截冷光。


  “有吗，我觉得我很在乎我自己啊。”他的语调在这个反问上微微往上扬了半格，“我自己的事情我都有好好地去做啊，御主。我不认为你这点说的是对的。”


  “这样吗。”立香的嘴唇动得几乎不发出声音。她把头从他腿上微微抬起，橘色的刘海从额前往旁边滑开，露出眉心。


  “言峰士郎。”


  “需要我举例子吗。”


  士郎把下巴往颈窝方向沉了一线。他知道一旦立香开始举她会一片一片地往外掏证据——而且令咒让他连辩解都做不到。


  “啊。这点我不嘴硬了，御主。”他从喉咙里清出两下沙哑的轻咳。两次咳嗽声之间的间隙刚好够他把头重新转回来，把视线落回到她脸上。


  “我承认了。”


  然后他闭嘴了。


  藤丸立香等着他接下来的话。她那双橘色眸子的瞳孔在他的沉默里没有往任何一个方向偏。她把视线锁在他脸上，等他自己往下接。


  言峰士郎只是继续轻轻地摸着她的后心。他的手掌从她外套的面料上滑过去，落下来，再滑过去——一下接一下，速率一成不变。


  立香的耳朵里忽然灌进来一个不对的声音。那层她一直在从他说的话里往上爬的梯子突然空了。


  她在自己脑子里把这两个字用几乎能点火的速度炸了一次。


  【等等。】


  【他在拖令咒的时间。】


  她把嘴张开。嘴唇在分开的那一刻没有给他任何预警——她把下巴往下猛地一坠，合着牙直接朝他小腹上咬了上去。


  她的牙齿隔着他的战衣外层咬进那层深色布料的织纹里。


  言峰士郎轻轻吸了一口气。


  “怎么了。”他把这句问话从嘴里落出来时带着一点几乎不存在的尾音下坠。不是怨她咬他——是在问这一口后面压着的是什么。


  “言峰士郎。”立香的嘴唇从战衣上离开。她低头看着自己咬过的地方——那块布面被她的牙压出了一小排凹陷，正在慢慢往回弹。“现在告诉我你的过去。”


  “过去。”士郎把这两个字重复了一遍。他的眼睫朝她脸上一落。“你没看到过吗。”'

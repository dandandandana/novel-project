content: '“嗯……”立香把眉弓往眉心方向压。她当然看到过，几乎每次睡觉都会梦见他的高中、他在走廊上帮人的样子、他在京都某个巷子里一个人走过夜路时把阴影穿在身上的样子：“我当然看到过。几乎每次做梦都能梦到你的过去。”


  她把话在这里掐断了一瞬。嘴角轻轻往下压了压。“难不成——”


  心里那个声音冒出来的时候比她自己开口都快。


  【等等。】


  “嗯。我也能梦见你的。”士郎的声音从她头顶罩下来。他把揉在她后脑上的那只手放下来搁到自己腿侧，“你的过去很普通很快乐。”


  【等等——他说什么。他真的——？！】


  立香的眼皮在那一瞬间被往上顶开。她把脸猛地从他腹前抬起来。“言峰士郎！你是不是看见了——”


  士郎想了想。他的眼帘往自己眼皮中间轻轻一垂：“嗯。比如——偷偷买小说被家里人发现。晚上熬夜看一些奇奇怪怪的读物。说起来你的爱好……”


  “挺独特的。”


  立香的手从自己身侧往上抬——她想捂他的嘴，但手在半途被自己的意识强行拽住了。一股灼烫的热意从她下巴尖往上涌，一口气顶到耳朵根。


  “好了好了够了够了——我知道了！”


  她把这句话往外砸完之后把自己的下唇用力咬了一下。然后她把那只还悬在半空的手收了回来，放到自己腹前。


  “我也看见你的过去了。”她的声音在下一句忽然换了一个温度。“不只是你的高中时期，士郎。”


  “你看到了什么。”言峰士郎开口。他声音里那层刚才带着笑意的小挑被瞬间抽掉了。


  “火。”立香说道。她把眼睛抬起来看进他琥珀色的瞳孔里。


  “一望无际的火。”


  她看着他。那枚橘色的眸子在看着他时没有移动——但她自己的眼眶里忽然有某种潮湿的东西往上涌。不是泪——是那种还没变成泪珠之前先在眼睛底部积成一片透明的薄层的酸意。


  “士郎。这是一切的起源，对吗。”


  言峰士郎没有回答。立香看着他沉默的嘴唇——然后她接着往下说。声音是自言自语般放到最轻的基调上：


  “你所做的事情……我当然也能看见，士郎。言峰绮礼所教授过你的事情——信仰主，跟随主的意志。没错吧。”


  “嗯。”士郎的回答从她额头上方落下来。他声音里的那层轻意已经褪到了只剩骨头，“言峰绮礼确实是这样教授我的。但是我并不认为他说的话是正确的。”


  “我知道。”立香把气从齿间轻轻往外漏，“你……”


  她把眼睛闭上一瞬。胸口往上顶了一次浅浅的起伏。


  “亲手杀了他。”


  “嗯。”士郎的喉结在她头顶上方浮了一下——她即使闭着眼睛也感受到了那个轻微的震动从他胸腔往上推到喉咙，“我和他是势不两立的。看见他就令我心生厌恶。”


  “士郎——你。”立香把眼睛重新睁开。她把脸从他腹前侧着转过来，把自己的口鼻微微抬离他那层已经被她呼热了的衣料。空气从她脸和衣料之间灌进来时带走了几丝多余的潮意。


  “算了。我首先先……”她从舌面上把下句话推出来时把自己的声调往下拉了整度，“为我用令咒强迫你而道歉。Ruler。”


  “不必道歉。”士郎的回答从她额角洒下来，“我并不在意你对我怎么样用令咒。”


  “哦。”立香把脸朝他胸口的方向偏了半寸。她的视线落在自己和他衣料之间那片窄窄的暗影里，然后她把自己的声音从唇边压到几乎没有音量，“哪怕我让你去死。”


  “嗯。”


  “我就知道你会说这种话——士郎。”


  她把这句说出口时没有看他。她知道只要自己现在看他一眼，刚才眼眶里那片一直没往下掉的潮气就会直接从他脸上弹回来——然后她自己就撑不住了。


  “吉尔伽美什告诉过你什么。”


  言峰士郎的肩骨在椅背上停住了一瞬。


  【她——怎么知道这个。】


  “你知道什么。”他把这四个字从自己嘴里往外推。语调比刚才的回答多了半层不易察觉的警惕。


  “是我在问你，言峰士郎。”立香的声音从腹部前方那个位置往上升，“现在还有令咒。你也不想被令咒强制开口吧。”


  士郎的舌头在上颚上轻轻压过一遍。


  “……吉尔茜告诉我。如果想要活下去——那么。”


  他把这半句话停在半空，然后把它推完。每一个音都压得极轻，像在讲另一个人的旧事。


  “就想办法去活着吧。”


  他把这句话放完之后，唇边的线条忽然往上拉了极浅的一截，但他没有笑。


  “某种意义上——我和言峰绮礼是一种人。”


  “这件事情真是令人反胃啊。所以杀了他我一点也不后悔。并且能体会到某种愉悦的感觉。”


  “言峰绮礼明明自己也无法体会到愉悦的情感——他嘴里也全都是愉悦愉悦。这种人真的是……”


  他把头往上仰，眼神穿过白色天花板一直穿到不知去哪的位置。


  “令人恶心啊。”'

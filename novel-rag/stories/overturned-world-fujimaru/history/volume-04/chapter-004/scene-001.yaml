content: '舰壳在此刻缓慢起伏了一次。


  立香的拳头还紧贴在身体两侧。她把手指收紧压进掌心，感觉到自己的指甲在自己皮肤上留下几道浅印。


  那艘横卧在暗域中央的巨舰残骸就在她眼前，舰体断口的金属甲壳翘起来像是被什么巨力从内部撕过的纸板，边缘挂着呼吸一样断续律动着的舰壳纹络。


  【这件事情……我一定要……】


  她深吸了一口气。


  【不对......至少现在......】


  她把眼睛闭上了。残骸的冷光透过眼皮落在她的视网膜上，形成一片不均的暗影。在这层暗影后面她看见了奥尔加玛丽从管制室椅子上站起来拍她肩膀的样子，看见吉尔茜在夸张的金色的帽子底下对她笑，看见玛修把大盾插在地上后回头看她，看见士郎——他那双琥珀色眼睛在迦勒底里递过安魂时盯了她很久。


  【至少得赢下来！】


  立香睁开了眼睛。


  “……首先。”她把肩膀往后压平，橘色眸子正对着眼前那具静立于广场中央的蓝色人形投影。


  “我的目的是回收圣杯，修复特异点。”


  “让我的战友同伴活下来。”


  终末人理圆满装置的模拟脸部没有动，那道蓝色投影的嘴唇在以极小的间距成型着下一句话的决定。


  立香没有等它整理措辞。


  “回收圣杯的前置条件是协助你击败弥勒，对吧。”她看着眼前的AI，然后把自己最后一段话嵌进刚才那句话的尾音上，“我需要你完全协助我们，不管是科技，还是战力，还是情报——我需要你毫无保留地协助我们。”


  旁侧村正把大刀从肩上颠了一下，眼神转到立香身上停住。玛修在侧翼把盾牌底缘往地面压了一寸，铠甲的金属关节发出短短一丝涩响。


  “同样。”立香开口“”


  “我们会倾尽全力战胜统治这里的弥勒佛——”


  立香把这句话的最后几节音节从自己舌面上稳稳推出去。


  “给这里的人类属于他们的未来。”


  终末人理圆满装置的蓝色投影在原地静止了片刻。它模拟出来的右眼位置那块像素忽然花了一小块——短短一次刷新帧的宽距，那块未完全渲染的暗蓝色块在它自己脸上吞掉了原本应该呈现的模拟神情。


  “属于他们的未来……收到。”


  “有关弥勒和当前的情况的情报，我会告知你们。”它的投影重新完整了。模拟嘴唇的蓝光轮廓在话尾做了个收束，“我需要一段时间整理，这里发展了无数年，数据库量很大。我觉得你们也需要收拾一下情绪对吧——旁边的空间门是休息室，你们可以在那里小睡一下。”


  一道矩形光圈在距离立香不到三步远的侧方凭空亮了出来。光圈内部的画面是一间被柔白色灯光洗过的圆形大厅。


  “感谢。”立香开口。


  她把脸往士郎的方向侧了侧，想跟他说什么。


  她的嘴张开了不到半寸。


  然后视线忽然往下掉——落到自己右手和士郎左手之间那截一直没松过的交握上。


  立香骤然把手往回收，她的手往回抽了不到两寸就被一股刚刚还在的力量轻轻拉住。她的手掌已经被士郎扣在虎口里扣了不知道多久。


  “士郎……松开。”


  热气从立香颈侧一路往上涌到鬓角。


  两颊的皮肤紧得几乎要自己绷开。她把手往外甩了甩——腕子晃动时带动的力道让她的手指在半空里甩了几下抓不住任何支点。


  士郎在这时把她的手指从自己掌心里一点一点往外放松


  立香在他把自己最后一截指尖放开时从喉咙里清出两声轻咳，那声音短到只够让她把脸朝远离士郎的方向偏了偏。


  “我需要休息。”她对自己说出这句话的时候声音压着那两声咳嗽留下的嘶痒，“请等我一下，玛修，士郎。”


  “嗯。”


  “嘛，确实该休息了。”村正把大太刀从肩上利落地卸到身侧，刀鞘底端点在地面上时带出一声脆响。她率先一步迈进了空间门。


  “我们也走。”立香的话从嘴里仓促地蹭出来。她迈步的速度比她出声更快，把脸埋进空间门里之前没有回头看任何人。


  玛修往士郎的方向偏了半身。她握在盾牌握把上的手紧了紧。话到嘴边变成了被轻压过的独一短句：“士郎前辈——走吧，别让前辈等着了。”


  言峰士郎默默点了点头，他并没有立刻跟上去。


  他看向终末人理圆满装置：


  【身为最顶级的AI，你的数据库检索要很久吗？】


  大约五分钟之后，士郎走了过去。


  沐在白色柔光下的圆形大厅里静得只剩下按摩舱运转时的极轻微的液压声。


  立香已经把自己整个人窝在舱体里。她的背部被舱体内部变换着形状的触感单元一遍一遍推着——肩胛、后腰、然后顺着她脊椎两侧缓缓往下游走。舱体内莹蓝色的光芒从她脸侧扫过去，把她闭着的眼睛压成两条微微泛光的弧线。


  “士郎……真的很舒服……”她喃喃出口那几个字的时候已经快被自己压成衣料摩擦级别以下的轻气。舱体的下一轮按摩节奏把她的尾音也从嘴里揉散。'

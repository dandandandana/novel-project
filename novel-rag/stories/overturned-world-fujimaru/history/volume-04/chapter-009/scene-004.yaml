content: '星空派说，家不是牢笼。


  立香安静地看完那面墙。


  她把搁在栏杆上的手往胸口前轻轻一收，用一种把话从肚子里慢慢掏出来的速度开口：


  “这就是弥勒最可怕的地方。”


  她说：


  “它没有一开始就毁灭人类。它先给了人类一个很难反驳的答案。”


  “留下来。”


  士郎把她的话从她嘴里接过去。他的语速比她更慢。


  “安全，幸福，被保护。”


  “嗯。”


  立香把视线从壁画上移开，仔细地落到身边这几个人的脸上。


  “所以人类必须先回答这个问题。”


  她顿了顿。


  “为什么非要去星空不可。”


  画面没有停止。


  最后的战争打响了。


  弥勒信徒封锁了部分轨道工程，阻止首批载人飞船试射。星空派夺取控制塔，宣布谁也不能替全人类把天空关上。


  一开始，两边都不想让血从自己手底下流出来。


  他们使用瘫痪武器，使用网络黑墙，使用议会里的票数战。


  直到弥勒在半空，把那只金色手掌从云端往下翻。


  那艘即将离地升空的白色飞船静静悬停在半空。它没有爆炸，只是被那只金手从头顶轻轻按回大地。


  动作温柔到像是在哄孩子入睡。


  然后，整个世界都不说话了。


  屏幕一行行往外蹦字。


  “最终争议确认。”


  “地上净土是否拥有否决星空的权力。”


  “救世主是否拥有代替人类选择未来的权力。”


  “幸福是否可以成为停滞的理由。”


  立香停下脚步。


  她把手指轻轻搁在扶手上。


  村正不再左右乱看了。


  玛修看着那艘被按回地面的飞船。她的嘴唇动了两下，最后从里面慢慢挤出几个字：


  “然后……他们选择了战争？”


  “不是。”


  士郎忽然开口。


  “是弥勒信徒先改变了立场。”


  他的视线锁在画面里。


  那些刚才还跪在佛光下的人，一个接一个把自己从地上撑了起来。


  最开始是一个头发全白的女人。


  她把胸前的徽章摘下来，搁在地上，然后往外走。


  然后是第二个。


  第三个。


  越来越多的人从光下离开。


  他们的眼窝里还挂着湿痕，肩膀紧绷着。可他们最后还是站在了星空派身边。


  屏幕上缓缓落下一段话。


  “我们曾相信，阻止远航是爱人类。”


  “但若人类必须被关在幸福之中，才能被称作被爱。”


  “那么这份爱，已经不再是爱。”


  “我们仍然感谢弥勒。”


  “但我们拒绝被弥勒拯救到永远。”


  立香把刚吸进肺里的那口气，从鼻腔里慢慢漏了出去。


  最后一战开始了。


  所有城市的炉心，在同一瞬间亮到极限。光芒从每一寸墙缝里挤出来。轨道塔完全展开，被禁用的旧文明兵器从封存层里一批批往上推。


  星空派和弥勒信徒站在同一道防线上。


  他们把刚才还在互相辩论的净土推进炮膛，把关于家与牢笼的争论，打成同一颗子弹。


  屏幕上的字，在最亮的时候一点一点黯下去。


  最后一行留下。


  “最终决议通过。”


  “全人类共同确认：朝向星空。”


  旋转楼梯到头了。


  最底下，是一大片豁然展开的展厅。


  展厅正中没有战舰，没有炉心，也没有轨道塔的等比模型。


  透明柜子里，只搁着一枚烧焦的纸星星。


  纸星星边缘已经碳化到看不出原本是什么颜色，但每一个折角都还清清楚楚。


  “第一座轨道塔发射场遗物。”


  “某个孩子在最终决议日抛向天空的纸星星。”


  立香站在玻璃柜前，把视线钉在那枚星星上。


  她慢慢抬起手指。柜面在靠近她嘴唇的位置，被她的呼吸蒙上一层极薄的轻雾。她用手背把那片雾擦掉。


  星星还在里面。


  碳化的边缘也还在。


  “搞得还挺会煽情的嘛，这个AI。”


  村正把双臂往胸前一交叉。那把大太刀被她夹在胳膊和身体中间，她从鼻孔里往外冲了一口粗气。


  “不是煽情。”


  士郎把声音压在同一个调上。他的手没有从风衣口袋里拿出来。


  立香点了点头。


  “嗯，不是煽情。”


  她看着那颗星星，声音落得很轻，轻到像是在向自己确认。


  “这是遗书。”


  这句话刚刚落在玻璃柜面上，展厅最深处那块占据整面墙壁的屏幕就亮了。


  EPOH的声音从四面墙体里同时排出来。


  还是那个调子。平静，温和。


  但它把每个字之间的距离，比上一次拉长了一截。


  “记录播放完毕。”


  “以上，即为本文明从第一次继承旧文明遗产，到最终确认朝向星空的主要历史。”


  “补充说明。”


  “弥勒信徒并非背叛者。”


  “朝向星空派并非胜利者。”


  “最终决议并非一方战胜另一方。”


  “那是人类在理解幸福、恐惧、牺牲、自由与未来之后，共同作出的选择。”


  然后是短暂的停顿。


  它像是在沉默里，把下面的字从数据库最底部往上捞，然后放出来。


  “他们选择了星空。”


  “然后，他们全部死去了。”


  展厅安静到立香能听见，玛修在自己身后把指尖从盾牌金属边上蹭过去的那一下。'

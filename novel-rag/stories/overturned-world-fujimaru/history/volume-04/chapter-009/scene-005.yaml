content: '立香慢慢抬起头。


  EPOH的声音没有任何起伏。可它把每个问句的最后一个字，都轻轻摁进沉默里，然后才接下一句。


  三个问句在沉默的间隔中逐层往下压。


  压到最后一个问句时，它的声音已经不像提问，更像是把从最早那枚纸星星没能抵达星空开始，就一直憋着的那口气，长长地吐了出来。


  “藤丸立香。”


  “现在，请回答我的问题。”


  “既然朝向星空的选择，会让人类付出这样的代价。”


  “既然连弥勒信徒最后也承认了人类拥有选择未来的权利。”


  “既然他们已经用灭亡证明了自己的选择。”


  “那么。”


  “后来者，真的还应该继续继承这个愿望吗？”'

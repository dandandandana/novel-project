  "content": "她撤下降格术，膝盖随即失力。祁荒伸手托住她后腰，没有让她离开已经破碎的坐标阵心。脸侧那道伤口还在流血，指尖也因逆向术式过载不断发颤，可她仍看着跪在宫殿废墟里的未来佛。弥勒胸前的伤开始合拢。\n\n速度并不快。胸口每长回一寸，终端上的魔力读数便向下跳一截；白火贴着伤缘烧过，新生金肉又会当场褪色。可那条曲线仍高得看不见底。胸骨重新搭起支架，破碎内脏逐一归位，巨佛也在修复中不断缩小。覆盖山脉的肩背先退到百丈，继而十丈，最后压成一个站在废墟中央的人。\n\n他赤着上身，胸口还留着一枚前后贯通的焦黑圆洞。金色血液沿腹部滴下，每落一滴，地面便长出一朵尚未开放就被白火烧掉的莲花。那张脸与方才所有居民看见的佛身相同，只是失去巨大尺度后，疲惫更清楚了。弥勒低头看了看自己的手。\n\n皮肤会裂，血会流，骨头也会在握拳时发出轻微摩擦。他抬头越过战场，看向主炮轴线外挤在一起的人群。有人仍抱着他的佛像，有人把佛像扔在脚边，也有人什么都没做，只是第一次没有等他开口便决定站在哪里。\n\n“原来如此。”他说。\n\n声音不再从金地每处传来，只从这个人的胸腔里发出，因贯穿伤而带着一点空洞回响。Alterego士郎落到废墟东侧。阿尔托莉雅紧随其后，黑翼收起时掀落一片仍在发热的金屑。玛修把脱臼左肩重新顶回关节，闷响令她脸色白了一瞬，盾却已经立到立香前方。士郎松开固定右臂的投影带，血沿五指滴到地面，一柄新剑仍在掌中成形。村正撑着膝盖站起，掌心白火从四面收回，化成一圈贴地燃烧的压制线。\n\n终端上的四项标记依次转绿：降格完成，炮线清空，主炮命中，白火仍在燃烧。\n\n弥勒却站了起来。\n\n他只是把腰背挺直，废墟里所有松动石块便向下陷去。胸口圆洞仍在缓慢收拢，右手垂落时还是僧人的掌势，抬到胸前已变成陌生的拳架；下一次呼吸，他的重心又换了。立香看不出那些动作来自哪里，只看得出没有一个属于临时起意。\n\n立香看着他，慢慢呼出一口气。\n\n“到这里，计划结束。”\n\n士郎侧过脸：“接下来呢？”弥勒抬起双拳。掌骨相抵的声音不大，地面却从他脚下向外裂开。立香说：“接下来，硬打。”"

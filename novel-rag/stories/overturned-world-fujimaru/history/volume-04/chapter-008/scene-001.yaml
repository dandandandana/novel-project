content: '藤丸立香的脑子在她睁开眼睛时还在往下坠着。


  昏沉感从太阳穴的两侧往眼眶底部压——那是身体刚从浅层睡眠里被自己拽出来的后劲。她从身下那张裹着软垫的胶囊舱体里慢慢撑起了上半身。双手在她腰侧往垫面上一撑，五指分开，指腹把垫面上那层冰凉的纤维织纹从掌心底下往外挤了挤。然后她抬起右手揉了揉眼眶。


  手指前端从内眼角往外轻轻地拖过去，把积在那片睫毛基底上的湿气一点点蹭掉了。


  揉完之后她把眼睑打开。


  一片柔白色的舱体背景光中站着一个蓝色的人影。轮廓线在灯光里轻微地颤着——没有实体，没有呼吸，但是那个影子就立在她面前不动。


  立香把自己的视线从对方的头顶捋到脚尖。她把手从眼睛上放下来搁在自己腿面上。“终末人理圆满装置——你想好怎么协助我们对付弥勒了吗。”


  她看着那片蓝光把话一个字一个字往外送。声音刚从她的嘴唇间掉出来就被舱室的白色墙壁吞了。


  终末人理圆满装置的蓝影在回答之前先沉默了一瞬。


  “有。”她说，随后又道，“虽然我能提供的很少——但是还是能够做到一些的。”


  立香把右边的眉梢往眉骨上微微一提。那个挑眉没带着责备，但她的眼睛在那道蓝影上扫了来回：“一些？”


  她把手从腿面上移到自己的下巴底下：“不应该是倾囊相授吗。”


  “我们本来剩下的就不算多。”


  “嗯——我最能提供的就是——”她停下来，像是把下一个字放在自己舌头底下试了试“主炮。”


  立香的眉头往中间轻轻一拢。她的下巴在她自己手上没有动，但那根拇指在她下颌线上的移动停住了。“主炮？”


  “没错。”终末人理圆满装置的蓝影把自己的人形努力做了一下拟人的姿势——她把自己的右手轻轻抬到肩膀前面然后往下压了一丁点，行了一个礼节性的礼，随即又用身体往前轻轻一倾，鞠了一个恭谨的躬：“现在的主炮虽然没有当时巅峰时期随时充能随时开炮的火力——不过经过这段时间的充能，开出一炮还是够的。”


  “火力计算这方面。”立香把自己的手从下巴上放下来，“我不是很确定能够做到完整的精确——我打开通讯器。对了，我的从者和我的同伴们呢。”


  “在外面商量具体的战斗事宜。”


  “嗯，我明白。到时候我估计用个降格术就完全无法参与了。”立香把通讯器往嘴边靠过去。她把自己的嘴唇贴在通讯器的拾音器上时声音被她从喉咙里往外轻轻一推，压得很低但每个字都清清楚楚：“摩西摩西，所长能听见吗。”


  通讯器里往外弹出一个脆得发亮的女声——那声音从传声孔里钻出来时还夹着一点轻松和笑意：“哼哼——你的所长去休息了，现在是我代班哦，藤丸立香小姐。”


  立香把通讯器从耳朵边拿开。她的眉弓往下一沉，然后把通讯器又贴回去：“爱尔奎特小姐？你怎么在这里。”


  然后她自己的话被自己截住了。她顿了顿，把自己刚才那句还没落地的尾调用自己的下一句话直接踩断，“不对——你没把迦勒底的设备搞坏吧。”


  “什么？我有那么笨吗？而且智慧女神就在我旁边呢！”


  立香把通讯器重新从耳朵旁边拿下来然后看了一眼它的屏幕。她的手指在屏幕上那块正在发着绿光的通讯图标上轻轻摁了一下，然后把通讯器又挪回自己下巴底下：“好吧——终末人理圆满装置，请你说你这一发主炮大概能够做到多大的火力吧。”


  她用拇指侧缘在自己下颌骨的底缘上轻轻蹭了一次。然后她把手从下巴上拿开，搁在自己的腿面上。


  终末人理圆满装置的蓝色身体又做了那个拟人的动作。她伸手先在胸前行了个漂亮的礼，然后又把自己的上半身往前一倾鞠了一个比刚才更深的躬。她的声音在鞠躬完毕之后从她的影子里发出来——语调平稳得没有任何多余情绪。“往小了估计大概一炮能够轰灭复数个多元宇宙的火力。”


  “嗯？”


  立香的嘴张着没闭上。她的眼睛把自己的焦点从AI的轮廓边缘收回来然后往她的人影中心狠狠地一聚焦。


  “嗯？！”通讯器里同时炸出两道完全不同的声音——一道清脆一道沉稳——两道声音在电流的串扰里叠在一起变成了一团把空气都劈开的惊奇，“你说什么？”


  “大概就是一炮能够炸掉很多很多平行世界吧。我听明白了。”立香点了点头。她把通讯器从下巴上轻轻往旁边一放，放回到白色台面上，然后她把下巴搁在自己手指交叉成的托垫上。“如果弥勒能够吃下很多发这个火力的话，我需要做什么。”


  “把弥勒降格到三维之后，我的一炮能够打穿他的防御。然后需要用创造之禊祓压制，才能够到能够勉强硬碰硬的截断了。”终末人理圆满装置把她自己的身体轮廓从刚才鞠躬的姿势拉回到直立状态。然后她的声音在舱壁的白光中慢慢往外铺。'

  source_profile: "---\n\n**真名：** 杨浞（Yáng Zhuó）\n\n归属于\"玄鉴仙族\"世界观体系中的古代蜀地帝王。在型月世界的英灵座中，他被归类为来自中华文明圈·蜀地神话体系的英灵，其传说核心与\"真炁\"\
    、\"天武\"、\"阴阳均平\"等东方修真概念紧密关联。由于其传说的根基深植于先商乃至更古老的神代余烬之中，其英灵的神秘度极高——在神秘的价值体系中，他的核心概念\"真炁\"可追溯至东方文明对\"道\"之根本的认知雏形，其古老程度与美索不达米亚神话体系处于同一层级。\n\
    \n---\n\n**传说：**\n\n在极东之地的上古岁月，有一脉名为\"玄鉴仙族\"的修行世家，其历史与天地同寿，记载着诸多超越凡人认知的秘闻与传承。在玄鉴仙族的经典之中，记载了一位被称为\"天武真君\"的至高存在——他是\"武\"\
    与\"真\"之概念的化身，是宇宙秩序中\"以武持真、以真定乾坤\"的终极守护者。\n\n然而，天武真君在某一纪元的大劫中分崩离析。他的本质——一道至纯的\"金性\"——被劈裂为三道，散落于不同的时空与因果之中。其中一道金性，被冥府的管理者\"\
    阴司\"所截获。\n\n阴司并非盲目地毁灭或封存了这道金性，而是怀着一个深远的目的：利用天武真君的金性来获取世界的\"真\"——即万物运转的终极法则与本质。为此，阴司以这道三分之一的金性为核心，在人间塑造了一个生灵。这个生灵有着人类的血肉与形骸，却承载着超越人类的本质。他被命名为杨浞。\n\
    \n杨浞自降生之日起，便与凡人截然不同。他天赋异禀，智慧超群，武艺如同本能般镌刻在他的骨血之中。他幼年时便展现出了远超同龄人的沉稳与果决，仿佛生来便是为了统御天下。但与此同时，他也承受着\"三分之一\"的缺失感——一种始终在追寻自身完整的、深沉而模糊的渴望。\n\
    \n在那个诸侯争霸、妖魔横行的时代，蜀地（即后来以成都平原为核心的广袤区域）正处于群龙无首的混乱之中。杨浞凭借着过人的武力、非凡的智略以及天生的王者气质，在短短数年间便整合了蜀地的分散势力，建立了统一的蜀国，自立为蜀帝。\n\n作为蜀帝，杨浞的治国方略以\"\
    正性止淫\"为核心。\"正性\"意为扶持万物的正气与本性，让百姓归于正道；\"止淫\"意为遏制一切过度、扭曲、放纵与堕落之事——无论是权力的滥用、欲望的失控还是妖魔的侵蚀。他以铁腕治吏，以仁心抚民，赏罚分明，恩威并重。在他的治理下，蜀国由一片蛮荒之地迅速崛起为一个富庶强盛的国度。\n\
    \n但和平并未持续太久。来自北方的一股庞大而异质的力量——佛陀的教义与信众——开始向蜀地渗透。在玄鉴仙族的世界观中，这并非简单的宗教传播，而是一场关乎文明根基的概念性入侵。北方佛陀代表的是一种\"空\"与\"灭\"的法则，它试图以自身的教义取代蜀地原有的\"\
    道\"与\"真\"的秩序。\n\n杨浞敏锐地察觉到了这种威胁的本质。他并未盲目排外，而是在深入了解佛陀教义后，判定其与蜀地的根基——\"真炁\"——存在根本性的冲突。于是他亲率大军北伐，在数场惊天动地的大战中击退了佛陀的势力。这些战役并非单纯的武力碰撞，更是\"\
    真\"与\"空\"两种终极概念的交锋。杨浞以\"天武金性\"为矛，以\"正性止淫\"为盾，硬生生地将佛陀的影响力从蜀地根基中剥离出去。\n\n击退佛陀后，杨浞并未就此止步。他将目光投向了东方的魏国。魏王是一位胸怀大志却深陷困局的统治者，其国家正遭受着内忧外患的夹击。杨浞以蜀帝之尊亲赴魏国，以自身的武道与真炁为魏王开辟了一条突破困境的道路——他协助魏王\"\
    成道\"，即帮助魏王觉醒了属于自己的力量与智慧，使其得以凭借自身之力化解危机。\n\n杨浞协助魏王成道后，并未索取任何回报。他回到蜀国，继续着自己的修行与治理。在这个过程中，他的\"天武金性\"逐渐觉醒、壮大，最终达到了一个临界点——他的灵魂与那道三分之一的金性完全融合，达成了\"\
    天武真君\"在人间的完美显现。\n\n在成道的最终时刻，天空中出现了一颗耀眼的白星——修武星。这颗星辰的光芒盖过了太阳，照耀着整个蜀国大地。在修武星的辉光之下，一切虚假与伪善都无所遁形，而一切真实与正义都获得了增强。杨浞的肉身在这道光芒中升华，他从\"\
    蜀帝\"晋升为\"天武真君\"——不再是凡人的帝王，而是成为了\"武\"与\"真\"之概念的守护者，永恒地坐镇于天武星宫之中。\n\n他的传说在蜀地世代流传，被浓缩为四句偈语：\n\n\"正性止淫、仁威无限、神玄明于里、凶威溢于表。\"\
    \n\"交蛇缠绵为相、阴阳均平为心、煞杀妖魔、持武存真。\"\n\"抱石插羽仙客、神煞定国真王。\"\n\"天武金性加身，修武星完全照耀。\"\n\n在英灵座中，杨浞以\"蜀帝\"的姿态被记录——那是他作为人间帝王最辉煌的时代，也是他距离\"\
    人\"最近的时期。他的灵基承载着天武真君三分之一金性的核心，虽然不是完整的天武真君，但即便是这三分之一的力量，也已经足以令绝大多数英灵望尘莫及。\n\n---\n\n**性格：**\n\n杨浞的性格可以用\"帝王\"二字来概括，但这个\"\
    帝王\"与人们惯常理解的暴君或仁君都有所不同。\n\n他是一位**正直的王**。正直不是天真，不是盲目的善良，而是一种经过千锤百炼后依然坚守的、对\"何为正确\"的清醒判断。他不会因为敌人的求饶而放弃追击——如果对方是真正的恶人；也不会因为利益的诱惑而偏离正道——即便那条路更加轻松。他的正直是带着帝王的威严的：你可以依靠它，但不要试图利用它。\n\
    \n他**不屈服**。这不仅仅是对外敌的不屈，更是对命运本身的不屈。作为阴司\"制造\"出来的存在，他的诞生本身就带有被利用的意味——他被创造出来是为了获取世界的\"真\"。但杨浞在成长的过程中，以自己的意志重新定义了自己的存在意义。他不是阴司的工具，他是蜀帝，是天武真君的一部分。这种不屈的意志，甚至连英灵座都无法完全束缚。\n\
    \n他**果断而谨慎**。在战场上，他的决断如同雷霆般迅猛，绝不拖泥带水。但在做出决断之前，他会以超乎常人的冷静与智慧进行分析——博闻强记的技能让他能在瞬间回忆起所有相关信息，\"真正的智慧\"技能则让他的分析深度远超人类极限。他的谨慎不是胆怯，而是对一切虚伪和陷阱的本能警觉。\n\
    \n他**怜悯众生**。这种怜悯并非居高临下的施舍，而是一种源自帝王职责的深沉关怀。他见过太多在乱世中挣扎求生的百姓，也亲手终结过太多本不该存在的苦难。他的怜悯与他的凶威并行不悖——对敌人而言，他是\"凶威溢于表\"的煞神；对百姓而言，他是\"\
    仁威无限\"的圣主。\n\n他**慷慨**。作为帝王，他不吝赏赐；作为战友，他不惜援手；作为对手，他尊重每一个值得尊重的敌人。但他的慷慨有着明确的底线——对虚伪之人、淫邪之徒，他绝不会给予任何宽恕。\n\n在语言风格上，杨浞的言辞简洁有力，带有帝王的威仪，但不似英雄王吉尔伽美什那般傲慢到目空一切。他更像是一位久经沙场的将帅——该说的话一字不多，不该说的话半字不提。他会在必要时展现出令人心安的温和，也会在必要时释放出令人窒息的杀意。他对御主的态度取决于御主自身的品行——若御主正直坚强，他会是最可靠的守护者；若御主懦弱摇摆，他会冷静地引导，但绝不会纵容。\n\
    \n---\n\n**对圣杯的愿望：**\n\n\"无愿。\"\n\n杨浞对虚伪圣杯不持有任何愿望。作为天武真君三分之一金性的承载者，他的核心驱动力是\"持武存真\"——维护世界中\"真\"的秩序。圣杯，尤其是这个雪原市的\"伪圣杯\"\
    ，在他的概念体系中是一个充满虚伪与欺诈的产物。他不会依赖一个虚伪的许愿机来实现任何目的。\n\n他回应召唤的真正原因，更接近于一种本能的感应——当虚伪圣杯的仪式系统与他的\"真炁\"触媒产生概念冲突时，\"真\"被\"伪\"所拉扯的这一行为本身，就如同一声挑衅。天武金性对此的回应是：既然被召唤到了这场虚假的盛宴，那便亲眼审视这一切，用自己的武道与真炁，裁决这场战争中的真与伪。\n\
    \n若被问及愿望，他会这样回答：\"本王的愿望，从不托付于外物。\"\n\n---\n\n*   **正性止淫 (A)**\n    天武真炁神煞性的核心信条，也是杨浞在成道之前最伟大的修行成就。\"正性\"是扶正万物本性，\"止淫\"\
    是遏制一切过度与堕落。这项技能赋予杨浞对\"恶\"属性的概念特攻——凡是在传说中以\"恶行\"著称的存在（如暴虐的帝王、淫乱的神灵、残忍的杀手），在面对杨浞时都会受到额外的伤害。更具体的效果是：古代以淫乱著称的帝王或神灵（如某些以纵欲闻名的神话存在）对杨浞发动的攻击，其威力将被削减至原本的二成。这项技能在面对伊什塔尔时将发挥惊人的效果——作为古代美索不达米亚以\"\
    美与丰收\"之名行\"纵欲与暴虐\"之实的女神，伊什塔尔恰好是\"正性止淫\"的完美靶标。\n\n*   **抱石眠 (EX)**\n    真炁神通之一。其名源于杨浞的修行方式——他曾怀抱巨石入眠于山巅，以磨砺意志与肉体。这项神通赋予了他三重效果：\n\
    \    \n    **第一重——身体素质：** 极强的肉体强度，远超从者容器的常规限制。他的筋骨如石岳般沉厚，能够承受远超其耐久参数所暗示的攻击。\n    \n    **第二重——绝对不死性：** 只要世界中\"真\"的概念还存在，杨浞就不会真正死亡。这不是HP自动回复式的不死，而是一种概念性的存在锚定——即便他的灵基被完全粉碎，只要\"\
    真\"还存在于世界的根基之中，他的灵基就会在一段时间后重新凝聚。更为恐怖的是，他可以利用这道神通将自身\"固定\"在一个特定时间点，一旦在未来死亡，便会立刻回溯到这个\"锚定点\"的状态。这使得常规的杀伤手段对他几乎无效——你可以击败他、粉碎他、消灭他，但你无法\"\
    杀死\"他，除非你能够消灭世界中\"真\"的概念本身。\n    \n    **第三重——物理直觉的自由操控：** 他被称为\"抱石插羽仙客\"——既能如山岳般承受攻击（将自身质量提升至极重），又能如飞羽般掠过战场（将自身质量降至近乎无重力）。这种对自身物理属性的自由操控使他在战斗中拥有极高的战术灵活性：他可以在一击之中从\"\
    飞羽\"般的轻灵突击切换为\"山岳\"般的重压碾碎，令敌人完全无法预判他的攻击节奏。他甚至可以强行改变坠落、冲锋、跳跃、踏空的物理轨迹——即在空中做出违反常理的变向、急停或加速。\n\n*   **霞羽客 (EX)**\n    真炁神通之一。其名源于杨浞作为\"\
    披羽衣、挂虹霞\"的游侠形象。这项神通赋予他A+++级别的气息遮掩能力与极高的机动性。\n    \n    **气息遮掩：** 在启动霞羽客时，杨浞的气息将被完全隐匿——不仅仅是魔力波动或灵基反应，甚至连视觉、听觉、嗅觉等所有感知方式都无法侦测到他的存在。这种遮掩的等级之高，甚至可以免疫千里眼的观测。在一个拥有\"\
    千里眼\"的英灵（如吉尔伽美什或盖提亚）面前完全隐形，这意味着他可以在任何战场上实施完美的暗杀或情报搜集。但需要注意的是，这项技能在他发动攻击的瞬间会暂时解除——与Assassin职阶的\"气息遮断\"类似，进入攻击状态时遮掩等级会下降。\n\
    \    \n    **高速移动：** 霞羽客同时赋予了杨浞极高的移动速度——他的身影如虹霞般一闪而过，常人甚至其他从者都难以捕捉其移动轨迹。这种速度不是单纯的敏捷参数加成，而是一种神通层面的\"瞬移\"——他并非物理性地快速移动，而是像虹霞般\"\
    消散于此处、凝聚于彼处\"。\n\n*   **鹤挂衣 (EX)**\n    真炁神通之一。这是杨浞最独特也最重要的防御性神通之一。\"仙人也是人\"——这句看似朴素的论断，在型月世界的框架中拥有深远的意义。\n    \n    **神性剥夺：**\
    \ 这项神通将杨浞的\"神性\"完全剥夺，转化为纯粹的属性加成。在型月世界中，\"神性\"是一柄双刃剑——它赋予力量，但也使持有者成为\"弑神\"系武器和技能的靶标。杨浞通过\"鹤挂衣\"将自身的神性\"脱下\"如同脱下一件外衣，使他在概念层面上不再是\"\
    神\"或\"半神\"，而是纯粹的\"人\"。这意味着：恩奇都的\"天之锁\"对他的束缚效果大幅降低（天之锁对神性越高的存在束缚力越强）；一切\"弑神\"系宝具和技能对他无效；他不会被归类为\"神灵\"而受到特定概念的特攻。\n    \n\
    \    **参数隐匿：** 作为\"仙人之证\"的附带效果，鹤挂衣还能隐匿杨浞的真实参数。其他御主和从者通过常规手段（如魔眼、鉴定魔术）观测杨浞时，将得到被混淆的、不准确的参数数据。这为他的战术欺骗提供了基础。\n\n*   **授长生\
    \ (EX)**\n    真炁神通之一。\"仙人抚我顶，结发授长生\"——这是杨浞成道过程中获得的最强大的后勤保障型神通。\n    \n    **阴阳均平：** 杨浞体内的魔力（真炁）处于完美的阴阳均衡状态——流出即补，消耗即生。这意味着他的魔力在实战中几乎不会枯竭。即便在极高强度的宝具连续释放中产生了大量消耗，他的真炁也会在短时间内自动回复至满溢状态。这项技能使他几乎不依赖御主的魔力供给——即便御主的魔力通道被切断，他也能凭借自身的真炁循环维持现界和战斗。\n\
    \    \n    **容器自动升级：** 更为恐怖的是，授长生会自动将杨浞的从者容器提升至接近完整的天武真君的水准。从者容器本身是对英灵完整实力的限制（通常只能发挥原本实力的70-80%），但这项神通会持续不断地\"撑大\"容器的上限，使杨浞能够释放出远超正常从者所能承载的力量。虽然无法完全达到天武真君的完整状态（因为他本身只是天武真君三分之一的金性），但容器的升级使他成为这场圣杯战争中最不受\"\
    从者限制\"束缚的存在之一。\n    \n    **随时现界：** 杨浞可以在任何时间、任何地点自行显现——不依赖令咒的强制转移，不依赖御主的召唤仪式。他可以自主决定何时消散灵体、何时实体化，这赋予了他极高的战术主动权。\n\n*\
    \   **真炁六水火 (EX)**\n    杨浞持有的核心神秘——真炁阴阳均平所衍生的六道攻防体系。这六道水火各司其职，构成了一个覆盖认知、空间、防御、状态、范围五个维度的战斗框架：\n    \n    - **无明：** 遮蔽认知、混淆判断。在杨浞释放\"\
    无明\"时，敌人对他的真名、动作意图、下一步行动的判断将被大幅混淆。这不是幻术——敌人看到的是真实的杨浞，但他们的大脑无法正确\"理解\"自己看到的内容。表现为：明明看到杨浞举剑劈下，身体却做出了错误的闪避方向；明明知道他的真名，却在关键时刻想不起来。\n\
    \    \n    - **无丈：** 扭曲距离与尺度。这是空间层面的干涉——在\"无丈\"的作用下，杨浞看似一步之遥，实则可能已经跨过十丈；看似发动远程攻击，实际上铁鞭已经抽到了敌人脸上。这项能力在近战中尤为致命——敌人永远无法准确判断与杨浞的实际距离。\n\
    \    \n    - **无擘：** 使攻击难以被\"分割\"\"拆解\"\"分流\"。这是对防御体系的克制——面对结界、护盾、多层防御术式等防御手段时，\"无擘\"的效果使杨浞的攻击不会被分散或削弱，而是以完整的力量贯穿所有层级。这意味着，无论敌人叠了多少层防御，杨浞的攻击都将以近乎全额的伤害抵达目标。\n\
    \    \n    - **无常：** 改变真炁的性质，使攻防状态不断转换。这是战术层面的变幻——杨浞的攻击可能在前一刻是纯粹的物理打击，下一刻就转化为概念性的\"真\"之侵蚀；他的防御可能在前一刻是坚如磐石的硬抗，下一刻就转化为如水般化解一切力量的柔韧。敌人无法用固定的手段攻略杨浞——因为他每一次攻防的性质都在改变。更恐怖的是，\"\
    无常\"完全无视不死性——无论是概念性的不死、条件性的不死还是物理性的再生，在\"无常\"的侵蚀下都将失效。\n    \n    - **无垠：** 扩大武威的影响范围。杨浞的个人武力被这项能力放大为战场级的压迫——原本只针对一人的剑击，可以在\"\
    无垠\"的加持下化为扫荡数十人的剑气风暴；原本只覆盖一室的杀意，可以笼罩整个街区。这使得杨浞不仅是单挑型的顶级战士，更是能够独力压制大规模敌军的战场碾压者。\n\n*   **修武星 (EX)**\n    这并非杨浞主动释放的技能，而是伴随他的灵基降临而自动发生的天象——修武星的现世。\n\
    \    \n    当杨浞以从者身份现界于现世时，天空中将出现一颗耀眼的白色星辰。这颗星辰的光芒足以盖过太阳，使得整个战场区域不再有黑夜与白昼的交替——天空永远笼罩在一片冷冽而纯净的白光之下。\n    \n    修武星照耀之下，产生两个持续性的全域效果：\n\
    \    - **一切虚假之物再无遁所：** 所有的伪装、幻术、隐匿、欺瞒都将在白光下被暴露。从者的身份隐匿、御主的气息遮断、魔术师的结界伪装——一切\"不真实\"的东西都将被修武星的光芒穿透。\n    - **一切真实之物获得增强：**\
    \ 真实的事物将获得属性的全面增益。但这里的矛盾在于——从者本身就是英灵座对英灵的\"复制品\"，在修武星的判定体系中，所有从者都属于\"虚假之物\"。这意味着修武星的照耀对所有从者（包括杨浞自己）都存在一定程度的压制效果。\n   \
    \ \n    这颗星辰是杨浞存在的\"副作用\"——他无法主动关闭它。只要他还在现世，修武星就不会消失。这也意味着他的现界无法保密——天空中多出一颗比太阳更亮的星星，这种级别的天象异变将立刻引起所有势力的注意。\n\n---\n\n\
    ---\n\n**宝具详解 (Noble Phantasm):**\n\n*   **◆「问武平清觯」(Wen Wu Ping Qing Zhi)**\n    **Rank:** EX | **Type:** 对界宝具\n    **范围:**\
    \ 1~999 | **最大捕捉:** 全域\n\n    外观上是一只紫金色的小型酒杯，杯身刻有水火交缠的纹样——与玄玉水火佩的图案一脉相承。这只觯是由真炁的最高位别\"位别\"炼制而成的灵宝，它的内部装着的不是酒液，而是整个世界的\"\
    真\"的部分——那些构成世界真实性的根本要素，被浓缩在这一方杯中。\n    \n    被动效果：只要杨浞持有此觯，它就会源源不断地释放\"真炁\"，为杨浞及其盟友提供持续的魔力回复与伤势恢复。其恢复效率极高，接近于概念性的\"不死性\"\
    ——只要不是一击致命的攻击，所有伤势都会在短时间内完全愈合。这种恢复不是物理性的细胞再生，而是概念性的\"将存在回归到'真'的状态\"——即将受损的灵基或肉体回溯到其\"真实的、完好的\"状态。\n    \n    主动解放：真名解放后，杨浞会轻轻倾斜酒杯，从中倒出一滴\"\
    酒液\"。这滴液体落入大地的瞬间，天地大变——空中的修武星爆发出前所未有的耀目白光，整个战场区域被\"真\"的概念完全覆盖。在这道光芒中，一切\"不真实\"的存在将遭受一次大规模的概念性即死判定——从者的灵基将被\"真\"的概念侵蚀、瓦解；虚伪的结界和术式将被瞬间击碎；甚至虚伪圣杯本身的运作都可能受到干扰。这是一次\"\
    以真灭伪\"的裁决，其杀伤力不取决于物理性的破坏力，而取决于目标的\"虚假程度\"——越虚假的存在，受到的伤害越大。\n    \n    **解放语：**\n    \n    \"问武于天——\"\n    (Wèn wǔ yú tiān——)\n\
    \    \n    \"平清于地——\"\n    (Píng qīng yú dì——)\n    \n    \"阴阳交泰，水火同归。\"\n    (Yīn yáng jiāo tài, shuǐ huǒ tóng guī.)\n\
    \    \n    \"真炁长存，虚妄尽灭——\"\n    (Zhēn qì cháng cún, xū wàng jìn miè——)\n    \n    \"倾此一觯，以正乾坤。\"\n    (Qīng cǐ yī zhì,\
    \ yǐ zhèng qián kūn.)\n    \n    \"——『问武平清觯』。\"\n    (——Wèn Wǔ Píng Qīng Zhì.)\n\n---\n\n*   **◆「奉真策玄鞭」(Fèng Zhēn Cè Xuán\
    \ Biān)**\n    **Rank:** EX | **Type:** 对城宝具\n    **范围:** 1~99 | **最大捕捉:** 1000人\n\n    外观是一柄长约四尺的铁鞭，通体漆黑，表面隐约可见鳞纹——那是锻造它的材料的痕迹。这柄铁鞭的材料是一条真龙的脊髓——杨浞在征战途中斩杀了一条为祸人间的恶龙，将其脊髓抽出后以真炁淬炼，锻造成了这柄铁鞭。它在蜀国不仅是武器，更是执掌法律正道的礼器象征——代表着蜀帝对公正与秩序的承诺。\n\
    \    \n    平时状态下，这柄铁鞭已经是顶级的近战武器——龙脊的材质赋予了它远超寻常武器的硬度与韧性，加之杨浞本身\"武艺冠绝世界\"的战斗技巧，即使不解放真名，仅凭铁鞭的物理打击就足以对大多数从者构成致命威胁。\n    \n\
    \    真名解放后，整条铁鞭化作一道巨大的青龙——那正是被杨浞斩杀的恶龙的残魂，在真炁的驱使下以最恐怖的姿态重现于世。青龙发出悲鸣般的咆哮，裹挟着毁天灭地的力量朝着敌人抽击。这一击的威力，其下限便已等同于兽Ⅰ·盖提亚的第三宝具\"诞生之时已至、以此修正万象（Ars\
    \ Almadel Salomonis）\"——无数光带汇聚的灭世之击。这意味着，奉真策玄鞭的一次全力解放，拥有将整座城市从地图上抹去的破坏力。\n    \n    **解放语：**\n    \n    \"龙脊成鞭，真道为策。\"\
    \n    (Lóng jǐ chéng biān, zhēn dào wéi cè.)\n    \n    \"奉天之命，行地之诛。\"\n    (Fèng tiān zhī mìng, xíng dì zhī zhū.)\n \
    \   \n    \"策玄鞭落——万法归真。\"\n    (Cè xuán biān luò——wàn fǎ guī zhēn.)\n    \n    \"——『奉真策玄鞭』！\"\n    (——Fèng Zhēn Cè Xuán\
    \ Biān!)\n\n---\n\n*   **◆「檀真」(Tán Zhēn)**\n    **Rank:** A | **Type:** 对人宝具\n    **范围:** 1~50 | **最大捕捉:** 50人\n\n   \
    \ 杨浞体内六道水火凝聚而成的鸟兽使魔。外形为一只巨大的乌鸦，通体覆盖着交织着水纹与火纹的羽毛——水火不相克而相融，正是\"阴阳均平\"的外在体现。檀真的体型可以根据杨浞注入的真炁量自由变化——从肩头大小的雏鸟到遮天蔽日的巨禽。\n \
    \   \n    作为杨浞的骑乘物和使魔，檀真拥有与古代美索不达米亚的神兽\"天之公牛（Gugalanna）\"相当的位格。它的战斗能力极为可观——能够以音速飞行、从羽翼中发射水火交织的真炁弹幕、以利爪和喙撕裂从者的灵核。更重要的是，作为\"\
    六水火\"的凝聚体，檀真具备了六道水火的部分属性——它的攻击带有\"无常\"的性质（无视不死性），它的飞行带有\"无丈\"的效果（扭曲距离），它的气息带有\"无明\"的特质（混淆认知）。\n    \n    杨浞以Rider职阶现界的核心依据之一，便是檀真的存在——他是骑乘这只由自身真炁凝聚而成的幻兽的\"\
    骑兵\"。\n\n---\n\n*   **◆「真武正性剑」(Zhēn Wǔ Zhèng Xìng Jiàn)**\n    **Rank:** A | **Type:** 对人宝具\n    **范围:** 1~2 | **最大捕捉:**\
    \ 1人\n\n    挂在杨浞腰间的礼剑。剑身通体白亮如秋水，剑柄缠绕着黑白相间的丝绦，剑格上刻有\"正性\"二字的古篆。这柄剑并非以杀伤力著称——它是\"正性止淫\"信条的物理具现，是蜀帝行使裁决之权的象征。\n    \n   \
    \ 在日常战斗中，真武正性剑就是一把品质极高的利剑，配合杨浞\"武艺冠绝世界\"的剑术，足以在近战中压制绝大多数从者。但它的真正价值在于\"正性\"——当杨浞以这柄剑斩击\"恶\"属性或\"淫邪\"属性的存在时，剑身会绽放出金色的光芒，伤害将获得大幅提升。这是\"\
    正性止淫\"技能在武器层面的具象化——剑即是裁决，裁决即是斩击。\n\n---\n\n**战斗风格与战术分析：**\n\n杨浞是一个全能型的战士。他的\"武艺冠绝世界\"并非虚言——无论是剑术、鞭法、拳脚、弓术还是骑术，他都拥有顶点级别的造诣。在实际战斗中，他最常使用的武器组合是\"\
    腰间一剑，别着一鞭\"——真武正性剑用于近身格斗和精确斩击，奉真策玄鞭用于中距离压制和大规模破坏。\n\n他的战斗风格以\"不可预测\"著称。真炁六水火的存在使他的每一次攻击都可能改变性质（无常）、扭曲距离（无丈）、混淆认知（无明）、无视防御（无擘）或扩大范围（无垠），这意味着与他交战的敌人永远无法建立有效的应对模式——每一次交锋都是全新的方程式。\n\
    \n在战略层面，杨浞兼具帝王的大局观与战士的临场感。他不会盲目地依赖自己的压倒性力量进行正面碾压（虽然他完全有能力这样做），而是会根据战场形势灵活调整策略——必要时潜行暗杀（霞羽客），必要时正面碾压（奉真策玄鞭），必要时概念裁决（天武金性+问武平清觯）。\n\
    \n他最大的弱点在于\"天武金性\"的自噬效应——作为从者的他本身就是\"虚假之物\"，修武星的照耀和天武金性的特攻同样作用于他自己。这种自我矛盾不会在短期战斗中造成明显影响，但在长期消耗战中可能逐渐侵蚀他的灵基稳定性。此外，\"授长生\"\
    虽然能自动升级容器，但容器的升级存在上限——他终究只是天武真君三分之一的金性，无法在从者容器中完全再现天武真君的全部力量。\n\n==========================\n\n==========================="

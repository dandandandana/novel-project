  source_profile: '================ SERVANT STATUS ================

    职阶: AlterEgo

    御主:

    真名: 阿尔托莉雅·潘德拉贡 Alter

    性别: 女

    身高/体重: 154cm/42kg

    属性: 秩序·恶

    样貌: 褪去漆黑的盔甲，取而代之的是贴身的暗色战术服与战裙，右肩披着灰色的披风，整只左臂附着这由紫色与红色咒文交织的臂铠，背部则是露出状态，穿着黑色连裤袜，外罩轻型的腿甲，腰间别着两把剑，分别是Excalibur·Morgan和Zinavand

    性格: 与原本的阿尔托莉雅Alter没有太大区别，只是清楚的知道自己并不是亚瑟王，而是被制造出来的赝品，对AE言峰士郎有着雏鸟情节和依赖感，嘛，说白了就是恋父嘛

    ------------------------------------------------

    ------------------------------------------------

    【出身/传说】

    由Grand Saber 被Alterego言峰士郎在特异点F打败之后，从其中提取出来的暴君阿尔托莉雅的灵基，为了专门对付真祖，死徒以及地球的幻想种制作而成的杀戮兵器。

    ------------------------------------------------

    【能力值】

    筋力: A+ | 耐久: A | 敏捷: B（EX） | 魔力: B+ | 幸运: C | 宝具: EX

    Rider职介下：

    筋力：A| 耐久:B| 敏捷: EX | 魔力: C+ | 幸运: D |宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 高等从者 A++

    表示英灵复合体的技能，吸收了鲁斯塔姆、杜拉汉、布拉布德以及潘多拉的力量 由星之理制作而成，天生灵基就为冠位级，面对成体兽和Saver也有一战之力。

    在rider职介下的六维下降，但是额外获得了伦戈米尼亚德和王之镜鉴两个宝具。

    - 七重武炼（Haft Khan） A+

    波斯第一勇士鲁斯塔姆的“七重试炼”

    为搭救身陷囹圄的凯•卡乌斯国王，鲁斯塔姆不顾个人安危，选择一条艰难险阻的近路，只身前往马赞德朗，连闯“七道难关”：勇斗雄狮，坐骑拉克什立下头功；忍受饥渴，走出一望无垠的荒漠；大显神威，力斩通人语的巨龙；识破奸计，不为扮作美女的妖怪设宴所惑；生擒蛮将，说服乌拉德充当向导；力战群魔，除掉主妖阿尔让格；潜入魔窟，制伏穷凶极恶的白魔王。英雄挖出白魔王的心肝，将鲜血滴进凯•卡乌斯的眼中，使国王双目复明。

    赋予其对「幻想种」、「恶魔」、「魔兽」以及「魔性」的特攻

    基于此，同时赋予了[真祖]的特攻

    - 死灵王之翼 B

    布拉杜德（Bladud），即“狼主”，不列颠传说中的第十位国王，李尔王之父，亚瑟王的远祖，杰弗里称他为 “最聪明的人” ，他在治国理政之余，致力于研究与传授死灵术（Necromancy），并将其推广至整个王国

    他为自己制造了翅膀，试图飞向天空，最终却不幸摔落身亡。

    获得了他的力量的阿尔托莉雅可以在背后长出漆黑的双翼，在空中时将敏捷提升至极限，并能进行完全无视物理惯性的变向。

    由于布拉杜德生前失败了，所以该技能具有时间限制以及冷却时限

    - 死之宣告（Crom Dubh） A

    杜拉汉（Dullahan），又称Durahan、Gan Ceann，是爱尔兰传说中的无头妖精，被视为预示死神降临的化身。其通常以骑乘无头黑马Cóiste-bodhar、腋下夹持自身头颅的形象出现

    其起源可以追溯到古老的丰收之神「克罗姆·杜夫（Crom Dubh）」，乃是由神堕落为宣告为死亡的妖精

    阿尔托莉雅的情况下赋予了在对方身上刻下“印记”的能力，可以凭借印记追踪对方，额外赋予了提高敏捷参数的效果

    - 冥途之马 A

    将亚瑟的爱马、鲁斯塔姆的神驹以及杜拉汉的黑马所结合诞生的高级幻想种，所谓的梦魇之马

    骑上马时，获得无视障碍物（即穿透）的能力，同时可以无视重力的骑行，可以与「死灵王之翼」搭配使用

    - 直感 B

    直感是在战斗中瞬间认清“对自己而言最适合的行动”的能力。在黑化状态下保持理性，需要不断的自我抑制。因为集中于抑制凶暴性，对外界的注意变得疏忽，直觉力变迟钝。

    - 魔力放出（暗/风） A+

    让自己的武器和肉体带有魔力来进行强化的能力。阿尔托莉雅的情况下能够将可以将其转化为乱流风压或者是黑暗的侵蚀型魔力

    - 领袖气质 E

    过去作为崇高的王吸引与鼓舞士兵的魅力已经没有。由于以恐怖来率领，统率力上升但士兵的士气极为低。

    - 灾厄之泥偶 C+++

    潘多拉（Pandora），希腊神话中的第一位女性，雅典娜赋予智慧，阿弗洛狄特赋予美貌，赫尔墨斯赋予其语言，集合了奥林匹斯诸神之祝福

    作为复合型技能，包含了「天性的肉体」、「全能的智慧」、「自动再生」等各项技能，额外赋予了遭到了足以毁灭灵核的打击时，由左臂的铠甲代为承受攻击，最多承受七次

    - 伪造神性 EX

    并不是与生俱来的神，而是星之理改造而成的神性，拥有正常神性一切的增幅，但是不会被弑神等对神性特攻的手段特攻

    盖亚之敌 EX：

    神琦灰制作出来，专门对付盖亚的处刑人真祖（爱尔奎特），星球内侧的幻想种，以及神造武装（如恩奇都），对其有额外的特攻。同理，来自星球内侧的星之触觉，神明，幻想种，神造武装对其造成的攻势，伤害仅为原有的二成，同时免疫神明，幻想种的权能，精神压制，毒素等。

    ------------------------------------------------

    【宝具】

    ◆ 斩绝七重魔境之极光 （شمشیر رستم）

    等级: A+

    种类: 对幻兽/对军/对恶宝具

    鲁斯塔姆（Rostam）之魔剑的真身，实际上是其家族世代流传的神剑"塔赫穆雷斯之刃"（Zinavand），作为传说中斩杀恶魔、恶龙的神剑，在鲁斯塔姆手上发挥了更大的作用，凭借其之威力斩杀无数幻兽，拥有无效化魔术的效果。

    原本是刀的形式，但是在阿尔托莉雅手上以长剑的外观呈现出来，解放真名时，将极致的魔力压缩于剑中，剑身缠绕着“必定撕裂幻想种”的概念，挥下时，化作撕裂天地的暗色极光，若目标具备「幻想种」、「恶魔」的概念，则无视目标的防御

    ◆ 无阻的冥夜驰骋（Cóiste Bodhar）

    等级: A

    种类: 对军宝具

    在凯尔特神话的阴影中，无头骑士杜拉汉驾驶着由无头马匹拉动的死神马车（Cóiste Bodhar）在深夜巡游。传闻中，没有任何锁住的门扉能够阻挡这辆马车的前进，而当马车停下，杜拉汉呼唤出某人的名字时，那个人便会立刻被抽走灵魂，坠入死亡的深渊。

    将「死灵王之翼」与「冥途之马」相结合才可使用的宝具，虽是以Cóiste Bodhar为名，但其真身却和原本的Cóiste Bodhar大相径庭

    解放真名时，在马背上长出漆黑之翼，随后发起冲锋，在冲锋的路径上，一切空间封锁、魔术结界、城墙要塞皆会被宝具强行碾碎，赋予她无可阻挡的突进能力。同时，直视这匹马冲锋的敌方单位，都将受到一次高强度的即死判定

    ◆ 誓约胜利之剑（Excalibur Morgan）

    等级: A++

    种类: 对城宝具

    阿尔托莉雅最大的力量“誓约胜利之剑(Excalibur)”即使黑化也健在。

    可是，其剑身染上了不吉的黑色。就像湖之精灵存在善恶（薇薇安和摩根勒菲）两面，圣剑也有反面。

    话虽如此，作为圣剑的“格”依然是最高。通过剑身将所有者的魔力变换成光、击出这一性能也没有变化，但其光改变成和刀身同样的漆黑的暗色

    ◆ 伦戈米尼亚德（Rhongomyniad）：

    等级：A++

    种类：对城宝具

    圣枪。系住星辰的岚之锚。

    其真实姿态据说是系住世界表皮的塔。在真名解放时等级和种类会发生变化。

    纵使被十三拘束限制了其本来的力量，也将歌颂星辰之光而闪烁的至远之枪———

    圣枪伦戈米尼亚德将维系世界表层的「光之柱」为本体。由于和「拯救世界的星之圣剑」具有同等程序的十三拘束存在，处于勉强维持作为宝具身形的状态。很可惜的是，此时此刻的【阿尔托莉雅】不需要十三拘束。

    王之镜鉴

    等级：EX

    种类：对人宝具

    诸王的宝鉴

    骑士之王已被众多诗人，诸多的时代所传颂。

    能够自由地使用并且复现这些幻想。

    作为宝具时有着类似于【王之财宝】的效果，但是阿瓦隆在其中不发挥作用。

    ◆ 开启吧，灾厄与希望（Πίθος Πανδώρας ）

    等级: EX

    种类: 对界宝具

    自爆类型的宝具。

    希腊神话中，火神赫菲斯托斯创造了第一位人类女性潘多拉，众神赐予她美貌与才能，同时也交给了她一个绝对不可打开的瓮（Pithos）。当潘多拉出于好奇揭开封印时，世间所有的疾病、饥荒、痛苦与灾厄倾巢而出，彻底终结了人类无忧无虑的黄金时代

    只有当左臂的臂铠存在时可以使用的宝具，将臂铠解放，从中释放出「疾病」、「饥荒」、「痛苦」等灾厄概念，化作肉眼可见的黑泥风暴向现世倾泻，能够瞬间侵蚀并剥夺敌对范围内所有生命体的存在基盘，将一切法则与生命同化为虚无，就连阿尔托莉雅自身也会被其吞噬

    在风暴平息的最终时刻，释放宝具处将会绽放出名为「希望（Elpis）」的光芒，将从者本人重新复活

    =================================================

    魔枪 朗基努斯

    Rank：无法计量（Non-Scalable）

    类别：人理守护专用礼装（Anti-Mystery / Anti-Humanity Threat）

    起源：曾刺穿圣子耶稣侧腹的圣物，承载着“否定神性与神秘”的本源概念

    当死徒二十七祖的残党掀起大规模屠城之乱，人理基准持续崩坏，连教会的圣堂结界与计时塔的魔术结界都无法遏制灾祸蔓延时，这两个常年对立的组织，终于打破千年隔阂，打破对“禁忌圣物”的封印，启用了那柄沉睡于教会秘藏深处的圣枪——朗基努斯。

    这柄并非天然圣物、而是“人类求生意志具象化”的礼装，其锻造过程耗尽了人理存续的半数底牌：三位现存魔法使倾尽全力注入魔法本源，计时塔各学部的大魔术师们奉献出传承数代的魔术刻印与魔力结晶，教会的圣人以自身圣性为媒介引导圣枪本源，更有曾锻铸星之圣剑的原初精灵锻冶师，以星钢余烬为基底，将所有力量熔铸于圣枪之中。它的诞生无关信仰，无关魔术荣光，纯粹是人类在濒临灭绝的绝境中，为对抗人理直坠而锻造的“最后希望”。

    朗基努斯的核心本质，是“神秘的绝对否定者”——它并非压制或破坏神秘，而是从概念层面抹消神秘的存在根基。无论对象是死徒的不死性、魔术师的魔术回路、英灵的宝具神性、甚至是幻想种的固有结界，只要具备“神秘”属性，在其真名解放的瞬间，都会受到毁灭性的概念级打击，其力量层级几乎凌驾于所有神秘体系之上，是唯一能以“凡人之手”对抗超越常理之威胁的武器。

    这份绝对的力量，伴随着同等残酷的代价：真名解放的刹那，使用者自身的所有魔力、魔术回路、甚至与“神秘”相关的一切所属（包括Servant的御主资质、圣人的圣性、魔术师的刻印）都会被圣枪一同否定。它在抹杀敌人的神秘之时，也会彻底剥离使用者与神秘的联结，最终将使用者还原为无魔力、无特殊资质的普通凡人，若使用者本身的存在依赖神秘（如魔术使、半英灵），则会随神秘的否定而一同消散——这是“以否定自身为代价，守护人理”的宿命式礼装，是人类求生意志最悲壮的具象化。'

  source_profile: '================ SERVANT STATUS ================

    职阶: Caster

    御主: 卫宫士郎

    真名: 阿尔托莉雅·潘德拉贡

    性别: 女

    身高/体重: 154cm/42kg

    属性: 秩序·善

    样貌: 和Saber Lily几乎一模一样，但是身穿着法师长袍

    性格: 天真开朗的纯白骑士姬。 与"完成体"的骑士王不同，这个阶段的阿尔托莉雅尚未被王座的重压磨去棱角。她对世界充满好奇，对同伴坦诚热忱，对正义有着近乎天然的信仰。她会因为看到美丽的事物而由衷地欢喜，也会因为食物的美味而毫不掩饰地表露幸福——这份纯真在冷酷的圣杯战争中显得格外耀眼，也格外脆弱。
    但天真不等于软弱。作为曾经拔出选定之剑的存在，她骨子里流淌着王的觉悟。在需要战斗的时刻，她的目光会在一瞬间变得锐利而坚定。

    武器: 圣剑 法杖

    ------------------------------------------------

    ------------------------------------------------

    【出身/传说】

    在遥远的不列颠岛上，有一位被预言选中的少女。她从石中拔出了圣剑Caliburn，被大魔术师梅林与骑士艾克特所承认，成为不列颠之王。

    然而这个灵基记录的阿尔托莉雅，在加冕之后走上了与正史不同的道路。她没有将圣剑作为唯一的统治工具，而是深入学习了梅林所传授的魔术与幻术之道，试图以智慧与奇迹而非单纯的武力来维系王国的秩序。

    必胜黄金之剑Caliburn在一次不义的对决中折断——这一事件在所有世界线中都无法回避。但不同的是，这个阿尔托莉雅没有将这份丧失视为纯粹的悲剧，而是以自己的魔术重新构筑了一柄幻想之剑，作为对过去的纪念与对未来的誓约。

    她是花之旅途中的少女骑士王，既拥有骑士的直感与勇气，也拥有魔术师的慧眼与手腕。她的时代尚未走向卡姆兰的终末，她的心中仍然燃烧着对理想国度的纯粹信念。------------------------------------------------

    【能力值】

    筋力: C| 耐久: D| 敏捷: C | 魔力: A | 幸運: A | 宝具: A+

    ------------------------------------------------

    【职阶/保有技能】

    - 直感 (A)

    在战斗中总能"感觉"到对自己最有利的展开。这是接近未来预知的第六感，继承自她作为骑士王的本能。即使身处Caster职阶，这份直觉依然敏锐至极——她或许无法在近身格斗中发挥Saber级别的武技，但绝不会被轻易偷袭。

    - 梦境漫步 (B)

    进入他人梦境的能力，源于梅林的魔术体系。可用于谍报、传递信息，或通过制造噩梦进行精神攻击。

    - 英雄做成 A

    培养、塑造骑士的能力。能够给予指定人物一段时间内的全面增幅——提升战斗能力、激发潜能、甚至临时赋予简易的魔术抗性。在原传说中，她便是以这份能力将普通的士兵塑造为合格的圆桌骑士候补。

    -魔力放出 D

    身为Caster职阶的代价之一。她依然拥有将魔力附加于武器与肉体进行强化的能力，但等级远低于Saber职阶。近身战中无法像骑士王那样以魔力放出实现压倒性的物理输出。

    - 龙之炉心 B：

    作为红龙之子，她的身体本身就是一座永不熄灭的魔力炉。呼吸之间便能从大气中汲取魔力，极大地减轻了对御主魔力供给的依赖。

    - 阵地建造 C：

    身为不列颠的王，她的"阵地"向来由臣下与骑士们共同构筑，而非亲手搭建。因此这项Caster的基础职阶技能等级偏低。她能建造简易的魔术工房，但无法达到一流Caster的"神殿"级别。

    - 道具做成 A：

    通过高超的幻术能力制造的道具，足以匹敌低级别的宝具。从治愈药剂到强化礼装，她都能以幻术为基底进行创造。这项技能的根源在于梅林的教导。

    - 花之旅途 EX：

    向踏上成王之路的少女骑士赠予的祝福。这是一项被动型技能，持续作用于与她并肩战斗的同伴——所有友方的士气与精神状态将得到显著提升，心态积极向上，不易陷入绝望与动摇。在长期消耗战中，这份精神层面的加持价值无可估量。

    ------------------------------------------------

    【宝具】

    ◆ 必胜黄金之剑

    等级: A

    种类: 对军宝具

    以魔术构筑的幻想之剑。并非真品Caliburn，真正的黄金剑已在不义之战中折断。但通过她的魔术与信念重铸的这柄幻想，在她手中依然能发挥与真品同等的破坏的力量。

    代价是——这是一次性宝具。

    解放真名后，将全部魔力注入幻想之中令其超载释放，光辉的斩击过后，黄金剑将碎裂消散。再次使用需要花费相当的时间与魔力重新铸造。

    **解放语:** 「選定の剣よ、もう一度その輝きを——」

    (Sentei no tsurugi yo, mou ichido sono kagayaki wo——)

    「約束された勝利の剣ッ！」

    (Yakusoku sareta shouri no tsurugi!)

    「キャリバーン！」 (Kyaribaan!)

    ◆ 怀抱你的希望之星

    等级: A+

    种类: 对军宝具

    花之旅途中、名声鼎沸时期的不列颠国王所具现的希望之光。

    解放真名后，以自身灵基为核心释放大规模的祝福领域，为全体友方进行压倒性的强化——全属性上升一个大等级，并获得全手段抗性。

    这是一柄"守护"而非"破坏"的宝具。

    它的本质是少女国王对臣民、对骑士、对同伴的信赖与期望的具现化。

    **解放语:**

    「旅路の果てに、希望の星は輝く——」

    (Tabiji no hate ni, kibou no hoshi wa kagayaku——)

    「皆の願いを、この胸に抱いて——」

    (Mina no negai wo, kono mune ni daite——)

    「解放せよ、『貴方を抱く希望の星』！」

    (Kaihou seyo, "Anata wo daku kibou no hoshi"!)


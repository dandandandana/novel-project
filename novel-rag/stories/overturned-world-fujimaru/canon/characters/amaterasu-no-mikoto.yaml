  source_profile: "# Caster·天照命\n\n================ SERVANT STATUS ================\n\n**职阶：** Caster  \n**御主：** 无  \n**真名：**\
    \ 天照命  \n**异名：** 伊耶那岐金地世尊、窃命世尊、至命至性并火大圣  \n**本生：** 无名孔雀  \n**性别：** 女  \n**身高／体重：** 177cm／56kg  \n**属性：** 秩序·善  \n**天地人属性：**\
    \ 地  \n**副属性：** 兽、神性、魔性、非人型、王、超巨大特攻对象〔宝具展开时〕  \n\n**样貌：**  \n黑发黑眸，面庞精美端正，眉眼间常带着近乎神像般的悲悯。妆容极重，以朱、金、乌三色描绘眼尾与唇线，像是将太阳、鲜血与烧尽后的灰烬同时涂抹在脸上。\n\
    \n平时身披乌金法衣，衣摆如收拢的孔雀尾羽。进入战斗后，背后会展开由火焰构成的巨大翅翼，肩颈与面部逐渐浮现孔雀羽纹，嘴部能够显化为足以啄碎灵基与结界的黑金鸟喙。\n\n**性格：**  \n果断、贤明、悲悯。\n\n她很少愤怒，也几乎从不因个人好恶杀人。她能够理解每一个人的愿望，并将所有人的苦痛、欲望与未来视作必须由自己承担的责任。\n\
    \n正因如此，她绝不允许人类自己选择灭亡。\n\n在她看来，牺牲一代人、牺牲自己的孩子、乃至牺牲整个时代，只要能够换来一个真正不受弥勒支配的未来，便属于必要之恶。\n\n她的慈悲并不虚伪。\n\n她只是把自己放在了有资格替所有人决定未来的位置上。\n\
    \n**武器：**  \n孔雀火翼、碎界鸟喙、乌色并火、法相之卵、九重太阳阵地。\n\n------------------------------------------------\n\n## 【时间切入点】\n\n伊耶那岐金地东门决战前夕。\n\
    \n此时的她已经完成以下伟业：\n\n- 夺取已故天照大神残留于金地的太阳权能；\n- 接受弥勒授予的世尊佛果；\n- 从绝大多数生物身上取得“意向”，补全自身作为生命容器的缺陷；\n- 生育出能够承载诸神、菩萨与异常法则的法相容器；\n\
    - 将数个已经失败的人类未来截取并保存；\n- 完成“至命至性并火大圣”的灵基雏形。\n\n但她尚未真正吞噬所有法相之命。\n\n因此，她仍然是那个想要拯救人类的天照命，而不是已经烧尽众生、只剩下救世执念的黑色大圣。\n\n------------------------------------------------\n\
    \n# 【出身／传说】\n\n她原本只是一只被人类养在庭院里的孔雀。\n\n没有神血，没有天命，也没有值得被记录的血统。\n\n饲养她的人类并不富裕，只是某个小聚落里普通的一家人。老人每日将剩饭撒在庭中，孩子会蹲在围栏旁看她开屏。她最初对于人类的理解，仅仅是食物、声音、温度与不会伤害自己的手。\n\
    \n直到有一天，一只妖物潜入聚落。\n\n那妖物以吞食人的恐惧与杀意为生，准备在夜间杀死整座聚落的人。孔雀在妖物动手前啄穿了它的眼睛，又在争斗中吞下了它的大脑。\n\n她第一次吃下了不属于鸟兽的东西。\n\n语言、恶意、记忆、欲望，以及“杀人”这一行为的完整意义，同时进入了她尚未开化的意识。\n\
    \n她由此开悟。\n\n那不是神佛点化，也不是修行所得。\n\n她只是吃掉了一只想杀人的妖物，于是知道了什么叫作人，什么叫作死亡。\n\n她开始主动捕食聚落附近的妖物、恶灵与诅咒，将那些可能伤害人类的东西吃进腹中。孔雀食毒而不死，羽色反而愈发鲜艳。伴随吞噬之物不断增加，她学会了修行、化形与神通。\n\
    \n可她没能保护最初饲养自己的人。\n\n弥勒治下的世界一次又一次走向圆满，又一次次在触及星空前被截断、重置。饥荒被解决，战争被终结，疾病被治愈，人的未来却始终被困在地表。\n\n她见过人类因饥饿而死。\n\n也见过人类不再饥饿之后，因为无法前往更远的地方而死。\n\
    \n她逐渐明白，弥勒给予人类的并非幸福，而是一种不允许继续前进的圆满。\n\n她想要反抗弥勒。\n\n但她知道，只要自己产生明确的反抗意图，弥勒便会发现她。\n\n于是，她不再以反抗者的身份活动。\n\n她吞噬妖物，救助人类，传播知识，参与文明重建，却从不公开建立属于自己的教团，也从不宣称自己能够战胜弥勒。她将所有真正的意图藏进鸟兽的本能里，以“保护巢穴”代替“守护人类”，以“繁衍后代”代替“创造未来”。\n\
    \n她来到已经失去原主的伊耶那岐金地。\n\n天照大神已经死亡，祂的神名与太阳权能却仍残存在信仰、祭坛与金地的光中。无名的孔雀没有直接冒充天照大神，而是继承了人类对“天照之神”的需求。\n\n她以“天照命”为号。\n\n不是天照大神。\n\
    \n而是承受天照之命者。\n\n弥勒当然认出了她。\n\n但弥勒并未杀死她，反而授予她佛果，准许她成为伊耶那岐金地的世尊。因为弥勒需要足够完美的容器承载那些从旧神、佛陀与文明废墟中复苏的法相，而她恰好拥有将外来性质孕育成生命的能力。\n\
    \n两者由此形成了短暂的共谋。\n\n弥勒给予她佛果与金地。\n\n她为弥勒生育法相容器。\n\n然而，弥勒能够控制进入容器的法相，却无法彻底夺走容器与母体之间的联系。每一尊法相都能听从弥勒的命令，但每一具肉身、每一枚灵核，仍然是她的孩子。\n\
    \n她一直等待这些孩子成熟。\n\n在漫长岁月中，她以孔雀卵生之法取得绝大多数生命的“意向”。\n\n鸟兽趋利避害的本能。\n\n人类想要活下去、想要爱人、想要创造未来的欲望。\n\n神明渴望信仰延续的执着。\n\n妖物吞噬、占有与繁殖的冲动。\n\
    \n她不曾彻底夺走那些生命的灵魂，只是从每一个物种身上截取一部分“生命应当如何继续”的答案，用来补全自身。\n\n最终，她成为了近乎囊括众生生命形式的巨大母体。\n\n她所生下的卵，可以承载神，可以承载佛，可以承载一条失去肉身的法则，甚至可以承载一段本应消失的时间。\n\
    \n伊耶那岐金地东门前出现过的未来城市，便是她从某次失败的文明中截取出来的一段时间。\n\n那里的人类曾经建立轨道升降塔。\n\n曾经制造飞船。\n\n曾经即将走向星空。\n\n然后失败了。\n\n天照命没有能力令那个未来继续发展，只能将其完整地取出，存放在卵中，反复铺设在东门之前。\n\
    \n那是她向自己证明，人类确实拥有未来的证据。\n\n也是她不允许任何人进入东门、唤醒创造之禊祓的原因。\n\n创造之禊祓一旦复苏，法相容器便可能脱离她与弥勒的共同支配。她等待无数岁月的计划也将彻底失败。\n\n她最终的计划极为简单。\n\
    \n先让所有法相成熟。\n\n再以母体的权限，吞噬所有法相的生命、佛果、神性与法则，将数以万计的“命”同时集中在自己身上。\n\n使无名孔雀跨越神、佛与兽的界限，抵达——\n\n**至命至性并火大圣。**\n\n然后杀死弥勒。\n\n\
    为她所爱的人类，强行啄开一个通往未来的缺口。\n\n她知道自己的孩子会因此死去。\n\n她也知道伊耶那岐金地中与她相连的众生可能无法幸免。\n\n但她没有别的办法。\n\n她为人类保存了无数失败的明日。\n\n最后，她决定用所有孩子的今日，换取一个尚未被证明存在的明日。\n\
    \n------------------------------------------------\n\n# 【能力值】\n\n| 能力 | 等级 |\n|---|---:|\n| 筋力 | A |\n| 耐久 | EX |\n| 敏捷\
    \ | EX |\n| 魔力 | A |\n| 幸运 | E |\n| 宝具 | EX |\n\n### 能力值说明\n\n天照命的魔力仅为A，并非因为她缺乏能量，而是因为她极少使用传统意义上的魔力。\n\n她所调度的是生命、意向、时间、神性与太阳权能。\n\
    \n在发动「乌从欲」后，她会将相连众生的“活力”直接转化为自身性能，筋力、敏捷、魔力与神性均可暂时抵达EX。\n\n幸运为E，则是因为她保存下来的每一个未来都已经失败。\n\n她能够看见、保存甚至重新铺开未来，却从未真正抵达过其中任何一个。\n\
    \n------------------------------------------------\n\n# 【职阶技能】\n\n## 阵地作成：EX\n\n并非建造魔术工房，而是将所在区域改造成由她统治的“生命胎藏”。\n\n其最高形态为伊耶那岐金地东门的九重太阳阵地。\n\
    \n九重阵地并非单纯的九道防线，而是九层相互嵌套的生命循环：\n\n1. **照形层**：记录进入者的肉体、灵基与影子。  \n2. **观意层**：读取进入者正在追求之物。  \n3. **系欲层**：将其欲望与黑日建立联系。  \n\
    4. **借命层**：将阵地中生命的余力调度给天照命。  \n5. **孕相层**：制造法相、鸟兽与火焰化身。  \n6. **藏时层**：铺设被截取的真实时间。  \n7. **返死层**：将天照命受到的死亡转移至备用卵。  \n8.\
    \ **御日层**：垄断区域内的光、热与天空。  \n9. **乌日层**：召来黑色太阳，开启最终宝具。\n\n九层阵地全部存在时，击杀天照命的肉身几乎没有意义。\n\n必须先找到并破坏她藏于阵地、法相与时间片段中的“卵”。\n\n---\n\
    \n## 道具作成：EX\n\n只能制造一种事物——卵。\n\n这些卵既可以是物质生命，也可以是概念容器。\n\n根据注入其中的意向不同，卵能够孵化为：\n\n- 承载神灵残片的法相；\n- 承载佛果与神通的僧众；\n- 承载自然法则的异兽；\n\
    - 天照命的备用肉身；\n- 保存死亡与伤害的替死容器；\n- 封存一段真实历史的时间之卵。\n\n她无法制造普通魔术礼装。\n\n因为在她眼中，所有值得制造的东西最终都应当拥有生命。\n\n------------------------------------------------\n\
    \n# 【保有技能】\n\n## 天照御名：A++\n\n继承已故天照大神残留权能后形成的复合神性。\n\n天照命可以支配区域内的日光、热量、影子、太阳观测与昼夜变化，也能将自己投射为金日、赤日或乌日。\n\n她能够从光照范围内观测众生，又能令光线化作鸟喙、羽刃、火雨与贯穿性光炮。\n\
    \n只要太阳权能仍在，她便不会因通常意义上的能源枯竭而停止活动。\n\n但“天照命”终究是继承之名，而非她的本生真名。\n\n面对能够审判真实、揭露冒名或剥离神性的能力时，该技能会被大幅削弱。\n\n修武星的照耀能够显露她作为“无名孔雀”的本质，使太阳权能与她的灵基之间出现裂隙。\n\
    \n这也是杨浞能够正面威胁她的原因。\n\n---\n\n## 佛果·伊耶那岐金地世尊：A+\n\n由弥勒亲自授予的佛果。\n\n赋予天照命世尊级别的精神稳定、信仰统御、因果观测与佛法神通。她可以通过诵经、手印或目光压制精神干涉，使大范围生命进入安宁、麻木甚至放弃抵抗的状态。\n\
    \n拥有该佛果时，她能够把自身的决定解释为“为了众生的慈悲”，从而抵御大部分针对恶性、魔性与罪业的特攻。\n\n其本质并非洗去罪孽，而是让她承担所有罪业之后仍不动摇。\n\n由于佛果来自弥勒赐予，而非她独自证得，因此存在明确的上下级联系。\n\
    \n能够裁断虚假、剥夺外来之因或攻击“授予关系”本身的能力，可以将佛果从她身上剥离。\n\n---\n\n## 乌从欲：EX\n\n并火神通之一。\n\n天照命承认并激发自身“想要拯救人类”的欲望，再以这份欲望为中心，呼应区域内所有生命尚未完成的愿望。\n\
    \n想活下去。\n\n想保护某人。\n\n想得到胜利。\n\n想证明自己。\n\n想继续前进。\n\n凡是仍有所求者，其“命”都会在无形中与天照命产生联系，在天空中汇聚成一轮黑色太阳。\n\n黑日并不会立刻夺取生命。\n\n它首先抽取的是生命为了实现欲望而产生的可能性、活力与未来余量，再将其转化为天照命的身体能力、恢复力与火焰。\n\
    \n欲望越强烈，能够提供的力量越多。\n\n因此，吉尔伽美什强烈的所有欲、王权欲与胜利意志，以及杨浞对于“真”的绝对坚持，都会成为乌从欲极为优质的燃料。\n\n发动后获得以下效果：\n\n- 全能力大幅提升；\n- 受到的伤害延迟结算；\n\
    - 自动修复灵基与肉体；\n- 读取相连生命最强烈的愿望；\n- 将火焰附着于目标的“命”；\n- 开放宝具「黑色穹顶」与「至命除」。\n\n### 限制\n\n乌从欲无法从真正放下一切欲望、主动舍弃未来者身上取得力量。\n\n倘若连接对象亲自承认自己的欲望，并主动承担欲望可能导致的失败，连接也会变得不稳定。\n\
    \n她最容易支配的不是欲望强烈之人，而是**拒绝承认自己有所欲求的人**。\n\n---\n\n## 孔雀卵生：EX\n\n天照命最根本的生命神通。\n\n她能够摄取生物的“意向”，即一个生命对于自身应当如何存在、繁衍、行动与延续的内在答案，并将不同物种的意向组合成完整生命。\n\
    \n卵生之物不必具备血肉。\n\n神性、法则、魔术基盘、历史片段与精神结构，都可被赋予卵形容器。\n\n所有由她生育的容器，都与她保持不可切断的母子联系。即使进入容器的法相受到弥勒控制，容器的死亡、损伤与生命余量仍可被她感知和调度。\n\
    \n具体效果包括：\n\n- 远距离召回法相容器；\n- 借用子嗣的感官与能力；\n- 将自身所受伤害分散给卵；\n- 肉身死亡后从备用卵中再生；\n- 强行令法相显露容器本质；\n- 在最终阶段回收所有子嗣之命。\n\n她对自己的孩子拥有生杀权限。\n\
    \n但每回收一尊法相，都会永久失去一个自己亲手孕育的生命。\n\n这并非抽象代价。\n\n她能够清楚记得每一个孩子在卵中第一次产生意识时的声音。\n\n---\n\n## 食恶开明：A++\n\n源自她开悟时吞食妖物大脑的行为。\n\n\
    天照命可以直接吞食毒素、诅咒、恶意、杀意、精神污染与带有明确敌意的魔术结构，将其转化为知识与生命燃料。\n\n针对她的攻击若包含越强烈的“希望她死亡”之意，越容易被她解析、吞噬或转化。\n\n她甚至能够张开孔雀鸟喙，从宝具攻击中啄走部分诅咒、神秘与术式结构。\n\
    \n但该技能无法有效吞食：\n\n- 纯粹的物理质量；\n- 不附带敌意的自然现象；\n- 不以杀死她为目的的封印；\n- 完全真实、不含伪饰的概念；\n- 使用者主动舍弃所有攻击意图后留下的余波。\n\n因此，杨浞以“真”直接压下的力量无法被完整吞食。\n\
    \n---\n\n## 卵藏诸世：EX\n\n将已经发生、已经失败或曾经抵达过可能性边缘的一段时间，封存进孔雀卵中。\n\n释放卵时，那段时间会以真实世界的形式覆盖现实。\n\n其中的人、建筑、空气、物质与感知全都真实存在，并非幻术，也不是单纯的固有结界。\n\
    \n然而，这些时间已经被从正常历史中截断。\n\n其中的人能够思考、感受与行动，却无法真正抵达那段时间之后。\n\n天照命常以此能力保存人类文明曾经接近星空的时刻，并将其作为东门的第一重防御。\n\n进入者若沉溺其中，便会永远生活在“没有痛苦，却也没有之后”的明日里。\n\
    \n### 限制\n\n她不能凭空创造从未存在过的未来。\n\n她只能保存已经被观测、抵达或失败过的时间。\n\n每一枚时间之卵只能展开有限次数。一旦世界边界被找到并击破，其中的时间便会永久损毁。\n\n------------------------------------------------\n\
    \n# 【宝具】\n\n## ◆ 诸生未至之明日\n\n**等级：** EX  \n**种类：** 对界宝具／结界宝具  \n**范围：** 1～30,000  \n**最大捕捉：** 一座城市  \n\n天照命展开火焰孔雀尾羽，将保存在羽目与卵中的某一段真实未来覆盖于现实之上。\n\
    \n宝具内部并不存在传统意义上的敌意。\n\n城市正常运行。\n\n人们照常生活。\n\n道路、学校、飞船、轨道升降塔与尚未完成的星际计划都真实存在。\n\n进入者会得到一个没有弥勒、没有战争、也没有眼前责任的世界。\n\n整个世界只会不断向进入者传达一个意志：\n\
    \n**请留下。**\n\n由于它是真实时间，而非幻境，通常的破幻、精神抗性与对魔力无法将其解除。\n\n必须从完整城市中找到“不属于这段时间的边界”，或直接以对界宝具将整个时间片段撕碎。\n\n杨浞的修武星能够证明其中的一切都是真实，却也因此不能简单将它判定为赝品抹除。\n\
    \n吉尔伽美什的千里眼能够解析城市中的每一件物质，却无法看见城市不存在的未来。\n\n只有两者结合，才能在不直接毁灭城市居民的前提下找到出口。\n\n---\n\n## ◆ 天无二日\n\n**等级：** EX  \n**种类：** 对界宝具\
    \  \n**范围：** 1～99,999  \n**最大捕捉：** 领域内全部生命  \n\n将「乌从欲」形成的黑色太阳向外扩张，吞噬整片天空。\n\n穹顶形成后，区域内将不再存在外界天空。\n\n太阳、星光、月光、天体魔力与外界观测全部被隔绝，所有照明、热量与影子都归入天照命的太阳权能。\n\
    \n黑色穹顶会持续从相连众生的欲望中得到反哺，并完成以下现象：\n\n- 将一切光线转化为天照命的眼睛；\n- 令任何影子成为火焰的出口；\n- 削弱外来神性与天体加护；\n- 阻断从领域外取得能量与坐标；\n- 吸收攻击中蕴含的欲望、信仰与杀意；\n\
    - 将吸收的力量转化为乌色太阳火；\n- 从穹顶任意位置释放大规模光炮与火雨。\n\n黑色穹顶并不完全受到天照命控制。\n\n随着吞噬的欲望增加，它会逐渐将“让所有愿望都归于同一个救世答案”视作最合理的结果。\n\n当穹顶彻底闭合时，即使天照命本人想要停止，也必须承受全领域欲望的反噬。\n\
    \n乖离剑能够撕裂穹顶。\n\n但只要九重阵地与黑日核心仍然存在，裂口便会不断愈合。\n\n---\n\n## ◆ 至命除\n\n**等级：** EX  \n**种类：** 对理宝具  \n**范围：** 视界内全部存在  \n**最大捕捉：**\
    \ 不定  \n\n并火神通的最终奥义。\n\n发动条件为：\n\n- 「乌从欲」完全展开；\n- 「黑色穹顶」覆盖战场；\n- 至少七重太阳阵地仍然存在；\n- 天照命开始回收法相与相连众生之命。\n\n宝具发动时，所有由她孕育的法相容器会从内部燃烧。神性、佛果、法则、记忆与生命被还原为灰色并火，沿着母子联系返回天照命体内。\n\
    \n随后，她的人形灵基裂开。\n\n一只无法以通常尺度衡量的黑金孔雀从火中显现。\n\n其羽翼覆盖天空，羽目中保存着无数已经失败的人类未来；鸟喙则由所有生命“想要继续存在”的本能凝聚而成。\n\n此姿态即为：\n\n**至命至性并火大圣。**\n\
    \n灰色火焰并不燃烧肉体、灵魂或历史。\n\n它燃烧的是存在所持有的“命”。\n\n所谓命，并非单纯寿命，而是一个存在能够继续行动、复活、转生、被召唤、被记录与走向下一刻的资格。\n\n被至命除烧中的目标，会依次失去：\n\n1. 肉体继续活动的可能；\
    \  \n2. 灵魂维持自我的可能；  \n3. 灵基重新构成的可能；  \n4. 历史重新记录其存在的可能；  \n5. 通过不死、替身、轮回或时间逆行返回的可能。\n\n即使拥有不死性，只要仍然属于“活着的存在”，便会被其烧灼。\n\
    \n这也是“除”字的本意。\n\n不是杀死生命。\n\n而是从世界运行的法理中，减去这条命。\n\n### 真正代价\n\n至命除并不产生生命。\n\n她燃烧多少命，才能消除多少命。\n\n若要发挥足以压倒杨浞与吉尔伽美什联手的力量，她必须吞噬绝大多数法相，并开始抽取伊耶那岐金地居民的生命。\n\
    \n一旦完全发动，她确实能够在短时间内凌驾于杨浞与吉尔伽美什之上。\n\n但她所爱的人类也会首先成为燃料。\n\n她想要拯救的人越多，宝具越强。\n\n她真正愿意牺牲的人越少，宝具越弱。\n\n因此，至命除最根本的破绽并非能量不足，也不是发动时间。\n\
    \n而是天照命本人始终无法真正完成最后一步。\n\n她可以杀死自己的孩子。\n\n却无法亲手烧尽那个曾经将剩饭撒进庭院、蹲在围栏旁看孔雀开屏的人类。\n\n=================================================\n\
    \n# 【战斗定位】\n\n## 常态\n\n常态天照命属于最高等级神灵，能够一只手吊起来打BEAST。\n\n依靠太阳权能、佛果、卵生再生与时间之卵，她能够单独压制大多数顶级存在，但正面输出并不会稳定超过吉尔伽美什或杨浞。\n\n她的优势在于难以击杀、战场支配与层层消耗。\n\
    \n---\n\n## 伊耶那岐金地主场\n\n九重阵地齐全时，她的综合威胁足以对标：\n\n**杨浞＋吉尔伽美什。**\n\n并非表示她的筋力、速度和火力全部等于两人相加，而是她的能力恰好能够同时限制两者。\n\n面对吉尔伽美什：\n\
    \n- 王之财宝的大规模发射会持续向乌从欲提供“所有欲”；\n- 众多带有传说与诅咒的宝具容易被食恶开明解析；\n- 太阳权能能够与神代宝具展开权能争夺；\n- 时间之卵可以迫使吉尔伽美什顾忌其中真实存在的人类；\n- 黑色穹顶能够隔断部分外界坐标与天体观测。\n\
    \n但吉尔伽美什拥有足够复杂的宝具种类，可以快速破坏法相卵与九重阵地；乖离剑也能够直接撕开时间世界和黑色穹顶。\n\n面对杨浞：\n\n- 乌从欲能够利用其对于“真”的执着；\n- 佛果能够抵抗普通的神性、魔性与罪业特攻；\n- 卵生容器使单纯破坏肉体失去意义；\n\
    - 她保存的时间与其中居民都是真实存在，修武星无法直接判定为虚假。\n\n但修武星能够照出她的本生，破坏“天照命”与太阳权能之间的继承关系；天武金性也能攻击弥勒授予佛果这一外来之因，使她无法继续把自己包装成完整世尊。\n\n---\n\n\
    # 【两人联手时的正确攻略】\n\n杨浞负责照出三样东西：\n\n- 天照命并非天照大神；\n- 世尊佛果来自弥勒授予；\n- 法相服从弥勒，但容器确实是她的孩子。\n\n吉尔伽美什负责摧毁三样东西：\n\n- 九重阵地中的太阳核心；\n\
    - 用于再生与储存死亡的孔雀卵；\n- 被杨浞照出后失去神秘保护的太阳权能。\n\n杨浞不能单独将她判作赝品。\n\n因为她对人类的爱、她生育的容器，以及她保存的时间全部是真实的。\n\n吉尔伽美什也不能单靠火力将她轰杀。\n\n因为只要母子联系仍在，每一次死亡都可以转移给其他卵与法相。\n\
    \n两人必须分别拆去她的“名”与“命”。\n\n最终将她逼到只能选择：\n\n- 吞噬所有孩子与人类，完成至命至性并火大圣；\n- 放弃至命除，承认自己无法用牺牲众生的方式给予众生未来。\n\n这才是天照命真正的败北条件。\n\n不是她被打死。\n\
    \n而是她终于无法继续证明，自己的救世方式与弥勒有所不同。"

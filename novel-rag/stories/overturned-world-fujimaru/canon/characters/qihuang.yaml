  source_profile: |-
    职阶: Pretender/SAVER
    御主:
    真名: 观世音·祁荒
    性别: 女
    身高/体重: 166cm/53kg
    属性: 混沌·中庸
    样貌: 黑发黑眸，精美且真实的典型的东方美人的面庞。即使身穿尼姑服，也能展现出身体的曲线，本身是绝世美女级别的
    性格: 博爱主义的表象下，是一个对“爱”与“恶”均无实感的空洞存在。祁荒不憎恨任何人，也不真正爱任何人。她唯一能够体验到的“情感”，是当他人的欲望——渴求、执念、绝望、希望——涌向她时所产生的愉悦。这种愉悦类似于一种精神层面的饱腹感。她的微笑永远是真诚的，因为她确实因众生的存在而感到满足；她的慈悲永远是虚假的，因为她从未真正理解过“苦”的含义。混沌·中庸的阵营完美诠释了她的本质：不受善恶之分的约束，仅以自身的享乐为行动准则，但这种享乐本身并不指向破坏——除非破坏能带来更高的愉悦。
    这条世界线里祁荒更倾向于保护人类，某种意义上已经变成谐星吐槽役了。
    武器: 金刚杵

    【出身/传说】
    祁荒的生前事迹被完美地编织进了观世音菩萨的信仰之中，真假难分。她确实拥有着与菩萨同等的权能，确实曾救苦救难、普渡众生，确实被圣堂教会的枢机卿承认为“现代的圣人”。但这一切善行的底层驱动力并非慈悲，而是一种纯粹的、对“被需要”之快感的贪婪。她的博爱是真实的——她平等地爱着世人，正因为这份平等，没有任何人能够独占她的爱。那些为她倾倒、为她癫狂的信徒们，在逐渐满足欲望后失去了她的关注，最终因绝望而自杀。祁荒对此不悲不喜。她继续微笑，继续救苦，继续承受下一波信徒的渴望。循环往复，直至她的传说本身成为了一个完美的、吞噬人心的漩涡。最终，祁荒以“魔性菩萨”之身成魔，其灵基强度彻底覆盖了英灵座上真正的观音菩萨。
    但是在这条世界线祁荒虽然以享乐为主，她倾向于保护人类。

    【能力值】
    筋力: B | 耐久: EX | 敏捷: D | 魔力: EX | 幸运: A | 宝具: A++

    【职阶/保有技能】
    - 文明侵蚀 (EX)：对人造物的绝对改造权能。被她握在手中的人造物会被改写为她认知中的理想形态；上限取决于原物品的神秘等级。
    - 收藏家 (EX)：从跨越时代与文化的无尽供奉宝库中取出品质最高的道具，财宝总量甚至超过吉尔伽美什。
    - 伪装从者 (EX)：彻底替代观世音，外部观测中的灵基、气息、权能与真正观音菩萨一致；对外以Lancer形式现界。
    - 阵地建造 (EX)：瞬间构筑庙宇道场，在范围内强化自身并无限放大进入者的欲望。
    - 寻声救苦 A：看破智慧生物内心欲望与想法，附带只能看到现在、可观测极远事象的A++级千里眼。
    - 大慈大悲法门 B：当行动服务于自身欲望、处于享受状态时，全属性获得两个“+”的增幅。
    - 此世全部之欲 EX：使一切智慧存在的人生被极致快乐淹没而精神毁灭；也可局限化为光炮或火焰。成为魔性菩萨后，破坏上限约与Ars Almadel Salomonis相当甚至超越。
    - 变化自在 B：观音三十三化身权能，可变幻为任何形态，附带A++气息遮蔽；主动隐蔽时没有任何存在能够发现她。

    【宝具】
    ◆ 金刚杵
    等级: EX
    种类: 对人宝具
    无视物理防御，以概念破坏粉碎“执着”与“障碍”，并通过直接作用于灵魂的梵音施加精神污染与强制升华。拥有类似精神干涉免疫能力的存在对此无效。非解放状态下可作坚不可摧的高等级近战武器。

    ◆ 杨枝净瓶
    等级: A++
    种类: 对人宝具
    玉质双口瓶中的液体是祁荒权能的具象化，可依她意志执行净化、洗脑、心灵控制或物理与概念双重腐蚀。净瓶只是容器，即使本体被毁也不会损失她的权能。

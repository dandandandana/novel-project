  source_profile: '================ SERVANT STATUS ================

    职阶: Ruler

    御主: 藤丸立香

    真名: 言峰士郎

    性别: 男

    身高/体重: 187cm/87kg

    属性: 秩序 善

    样貌: 红发琥珀色眸子 娃娃脸 属于极度耐看的类型的

    性格: 三层夹心的性格 表面上十分热情 实际上内里有点冷漠，但是更深层藏着他老好人的本质 他以他人的开心快乐为愉悦，尝试去填满自己，实际上有些空洞且自毁倾向严重，而且并不是能够看的很远的类型，他专注于眼下，并不想着拯救世界的大目标。

    本质上很拧巴 追寻着一个答案，为什么自己会无法从善行中得到愉悦和满足呢？但他又止不住的去做这种事情，他坚信只要自己去成为人们认为的善人就总有一天找到答案。

    他同时也认为这是主给他的罪孽

    武器: 全能

    ------------------------------------------------

    【出身/传说】

    未解禁

    ------------------------------------------------

    【能力值】

    筋力: B++ | 耐久: A | 敏捷: C+++ | 魔力: EX | 幸運: E | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    -错误职介（EX）：

    言峰士郎是被错误召唤，无法拥有职阶技能。

    - 高速神言 (A+)

    无需连接魔术回路，就能发动魔术的言语。A级能够不需咏唱发动大魔术。

    来自埋葬机关的基本要求，吟唱不得超过一小节

    - 弑神 EX

    仅凭人类之神而斩杀堕落神明而升格的技能，对神属性具备特攻

    - 魔力放出 A

    将武器或自身的肉体带上魔力，并瞬间放出。通过庞大的魔力来强化攻击与防御。

    - 心眼（真） B

    基于后天的积累，在战斗中预知危险的直觉。通过经验积累，可以看破敌人的攻击。

    - 心眼（伪） B

    先天的才能，在战斗中预知危险的直觉。

    *****：未解禁

    - 投影魔术 EX

    自我锻炼到极致的无限剑制体现出来的魔术，体现为可以读取并且复现原有主人的武艺，六维 可以幻想崩坏 可以把a剑的特性叠加到b上 可以投影神造 可以改造投影出的武器

    -拟造躯壳 EX

    来自一位原初之一捏造的躯体，该躯体免疫一切毒素，诅咒，精神污染，灵魂脱离等负面效果。除此之外还附带了战斗续行（A++）和星之吐息（D）的效果，凭借着这个躯壳，言峰士郎可以使用很多种魔术而不是极个别魔术。（未解禁）

    -同调极限 A++++：

    原本用于解析的魔术并强化的魔术被应用到极致，即使是普通的物品在手里也能发挥相当于D级宝具的效果，某种层面来说，相当于“骑士不死于徒手”了，与之不同的是，强化不能作用于过大的，大约空调外机的大小，但是可以同调一栋六层高的大楼。

    -极致的追求者A+：

    追求极致他而赋予的技能，不论是什么事情，在经过一段时间的练习后都能够达到很高的水准，A+水平相当于没有天赋的人能做到的极致了。

    ------------------------------------------------

    【宝具】

    ◆ 原理血戒

    等级: A~EX

    种类: 对人/对城/对军/对界/固有结界

    言峰士郎除了原理血戒：神赐以外的所有的原理血戒都在这里

    几乎是无所不能的百宝袋。

    ◆ 无限剑制

    等级: E~A+++

    种类: 固有结界

    言峰士郎的心象结界，有三种用法

    展开后为巨大的十字架构成的刑场

    1 展开作为心象世界的固有结界

    2 把固有结界附加在箭矢 射中敌人可以在敌人体内展开

    3 把固有结界里所有的剑集合为极致的一柄，同天丛云

    人类的礼赞

    等级：A++

    种类：对人宝具

    最大捕捉：1

    一件白色的风衣，上面是看上去普普通通的咒文，来自埋葬机关的力作，低于A+级别的攻击无法对其造成伤害，与Alterego不同，这件即使损坏也可以在三十分钟内恢复

    ================================================='

world:
  baseline: 承接了绝大部分的型月世界观，但是主要分歧如下：
  rules:
  - 弱化神秘设定，所谓的神秘越古越强进行了修正，只是通过人理的支援达成的假象。
  - 权能合理化：当前情况下所有权能都是高维空间下的露出的部分，不存在全知，千里眼的观测也会被作假。
  - 高维生物，由于型月世界观对外星来者过于吹捧，现在修正，佛，道，以及基督教的天主耶稣是高一维度的生物，掌控多元宇宙。
  - 存在其他宇宙，根源虽然在本书中降维打击但是也有更强的存在
  - 其余的和型月基本一致。
  - 根源被神琦灰开发成了可以被使用的工具。
  - 神琦灰用了大规模的认知干涉，导致所有（包括所有平行宇宙）的智慧生物都认为根源无法被利用，不包括卫宫白。
  - 人理烧却，修复特异点只需要很简单的回收圣杯切断与主世界的联系即可。
  - 原理血戒：由理而形成的魔术，经由神琦灰的魔术更改之后变成了特别神奇的存在，万能的魔术。
  - 根源魔术：- **逆行根源：** 熵增运动的极致体现。将一切推向最混乱、最原始的状态——食物可以被解构至原子层，已经成形的大魔术可以被直接还原为魔力，神明的权能可以被剥离，神明的不死性可以被撤销，神明的存在本体可以被裂解。这是把"时间"和"秩序"本身往后倒拨的能力。
  - '- **正行根源：** 熵减运动的极致体现。违反物理法则，让混沌中诞生出秩序，让零中生成一，让不存在的东西开始存在。创造，在最字面意义上的创造。'
  - '- **根源之涡：** 正行与逆行的极限叠加，成为"全知独一"的状态。目前是通用的礼装，能让人用这个魔术'
  - 日本特异点设定：
  - 思潮诞神，人的思潮可以让一件事物诞生神明，伊耶娜美，弥勒就是思潮诞生的神明。
  - 故尊复现，某项概念对某人极度思念，会诞生一位某项概念认为的那个人，这个世界线的大boos神琦灰就是根源对神琦灰的故尊府县。
  source_content: '承接了绝大部分的型月世界观，但是主要分歧如下：

    弱化神秘设定，所谓的神秘越古越强进行了修正，只是通过人理的支援达成的假象。

    权能合理化：当前情况下所有权能都是高维空间下的露出的部分，不存在全知，千里眼的观测也会被作假。

    高维生物，由于型月世界观对外星来者过于吹捧，现在修正，佛，道，以及基督教的天主耶稣是高一维度的生物，掌控多元宇宙。

    存在其他宇宙，根源虽然在本书中降维打击但是也有更强的存在

    其余的和型月基本一致。

    根源被神琦灰开发成了可以被使用的工具。

    神琦灰用了大规模的认知干涉，导致所有（包括所有平行宇宙）的智慧生物都认为根源无法被利用，不包括卫宫白。

    人理烧却，修复特异点只需要很简单的回收圣杯切断与主世界的联系即可。

    原理血戒：由理而形成的魔术，经由神琦灰的魔术更改之后变成了特别神奇的存在，万能的魔术。

    根源魔术：- **逆行根源：** 熵增运动的极致体现。将一切推向最混乱、最原始的状态——食物可以被解构至原子层，已经成形的大魔术可以被直接还原为魔力，神明的权能可以被剥离，神明的不死性可以被撤销，神明的存在本体可以被裂解。这是把"时间"和"秩序"本身往后倒拨的能力。

    - **正行根源：** 熵减运动的极致体现。违反物理法则，让混沌中诞生出秩序，让零中生成一，让不存在的东西开始存在。创造，在最字面意义上的创造。

    - **根源之涡：** 正行与逆行的极限叠加，成为"全知独一"的状态。目前是通用的礼装，能让人用这个魔术

    日本特异点设定：

    思潮诞神，人的思潮可以让一件事物诞生神明，伊耶娜美，弥勒就是思潮诞生的神明。

    故尊复现，某项概念对某人极度思念，会诞生一位某项概念认为的那个人，这个世界线的大boos神琦灰就是根源对神琦灰的故尊府县。'

  source_profile: '================ SERVANT STATUS ================

    职阶: Pretender

    御主: 藤丸立香

    真名: 千子村正

    性别: 女

    身高/体重: 164cm/51kg

    属性: 秩序·中庸

    样貌: 和藤丸立香没多大差别，只是头发颜色更深了。 穿着低调内敛的锻造服，身后披着红金色的羽织

    性格: 看上去有些冷漠，稍微离近点就会发现十分热情，大多都是真心为你好的建议，她生气时反而会沉默寡言。骨子里是彻头彻尾的理想主义者和完美主义者的老好人 善良且温柔。有一定的少女心，大概是被藤丸立香的躯体所影响。很喜欢吃辣的东西 父控 来到迦勒底后最大的梦想是成为千子村正的御主让他再当自己的老父亲。

    ------------------------------------------------

    【时间切入点】

    ------------------------------------------------

    【出身/传说】

    特异点 No.1 的【千子村正】，由该特异点被伊耶娜美召唤而来的泛人类史的saber千子村正所随身携带的锻刀石投入观音坐下的池水而生的【药生子】，期间经历了父亲千子村正死亡，徒弟宫本武藏被迫送死，最终决定拔刀复仇。

    以【千子村正】之名在旅途中看不惯苍生困苦，选择了拯救这个世界。

    在迦勒底被召唤时以和自己原本躯体极其接近的藤丸立香的躯体重新捏造了一个躯体作为凭依从者降临。

    ------------------------------------------------

    【能力值】

    筋力: B++(A++) | 耐久: A+ | 敏捷: C | 魔力: B | 幸运: E | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 伪装工作 B

    Pretender职阶的证明。能够将自身的属性、职阶甚至部分参数进行伪装。在未被看破真实身份前，都会显示她为Saber职阶的“千子村正”。

    - 极小大结界·天之金床 EX

    将自身所在的任何场所瞬间改造为顶级的「锻造工坊」，由于拥有了神明的力量，甚至能够抽取地脉的岩浆与魔力作为锻炉的火种，千子村正的情况下额外赋予了阵地内参数提高的效果

    - 焰（天照） EX

    村正的技能“焰”的升格变种。拼尽全心全力，甚至不惜燃尽自身程度的铸造炼成。

    「诸般集约、万物宿愿、所有非业——

    一切，皆为到达此刀而存。」

    由于其诞生源自天照大神的干涉，让村正能够熔炼神代金属或是锻造神造兵装，额外赋予了「魔力放出（炎）」的效果。

    - 试刀物（业物） B+

    原版村正持有的技能。能够瞬间测定手中武器的锋利度、极限与特性，并在战斗中随心所欲地引出武器的最大威力。哪怕是普通的铁剑，在她手中也能发挥出名刀的威力，直至其超载崩坏。

    - 形写 B+

    “形写”是日本刀匠界的传统技艺，即仿制前代名刀的形状与构造，以求重现其锋芒。村正本人并不以形写闻名，但天照在创造此容器时，将无数刀匠形写时的经验与记忆压缩后植入，使她能够“模拟”任何见过的刀剑。

    - 禊祓EX：

    千子村正掌握四种禊祓，每一种都是最顶级的权能：

    灼阳之禊祓：天照命的禊祓，村正能够随手锻造出来神造兵装，并且控制一切火焰，体现为橘色的火焰

    清净之禊祓：月读命的禊祓，村正能够直接唤出青色的火焰，洗去一切污浊和异常，火焰还可以当作水流

    创造之禊祓（打完伊耶那绮金地后获得）：伊耶那岐的禊祓，村正能唤出白色的火焰，抹去一切防御和权能，同时带来拯救。

    怨仇之禊祓：村正的禊祓，能够唤出黑色火焰，实体，可以化作黑色的巨龙等，最重要的能力是把所有的禊祓转化为纯粹的破坏力

    - 高天原宣命（剑） B

    “宣命”即神祇官所传达的神旨。但是此地已经没有真正意义上的神官，神明的力量也在她的手中，在当前职介下，村正拥有“剑之理“的权限，面对位阶低于自己的存在，可以将对手的宝具和武器封印。

    - 噬咬之妖刀群 EX

    如果要说日本的刀剑，不可避免要提到的就是非常有名的村正。德川家康的祖父、父亲皆死伤于村正，长子切腹亦用村正。就连德川家康自己也在关原合战中被村正的枪斩伤了手指。经过种种不祥的经历，家康命令废止村正，不许使用。不管什么原因，但是对德川家的代代都造成伤害的肯定不是好东西，由此导致整个社会都对村正产生了诡异的流言。

    即使是这样的被忌讳和当做恐怖象征的村正也终究会有出头的一天，但是，村正并不会因此而取回它应该得到的地位。

    “村正是暗杀的道具……”

    妖刀村正的印象还不能完全抹杀

    作为日本妖刀的代表，村正的形象实际上是当时的统治者创造的，又经过民众的“ 培养”，最终形成了妖刀的印象。但是作为锋利无比的一代名刀却遭到这样的待遇，也不能不说是一种冤屈和遗憾

    此技能乃是「无辜的怪物」变种技能，由于此身乃是“村正”的集合体，作为从者的灵基无可避免的附带上了这层关系，能够使用“妖刀村正”在流言中附加的能力，额外赋予了对「王者」「统治者」属性的特攻，无视具备该属性敌人的物理防御。

    - 狂乱 A++

    数百种灵魂与事物挤在一个躯壳里，难免会产生精神污染。

    技能“狂化”的变种，具有免疫精神干涉的能力，在面对极其优秀的武器时，精神会对其产生执念并狂化

    - 神性 D：

    历经磨难获得了伊耶娜美的认可，从而从天照大神的【金地】里获得了天照大神的力量，但她本身并不算神明，神性较低。

    - 药生子 A：

    身为观音【牝水】生发而生的药生子，自带远超一般从者的怪力和躯体，同时由于牝水主生发和藏匿，同时获得很高的自我恢复效果和气息遮掩（B）的效果，而且自身源源不断的产生大量魔力。

    ------------------------------------------------

    【宝具】

    ◆ 斩尽三千繁华梦（Myōhō Muramasa）

    等级: A+

    种类: 对业宝具

    史实上，村正一族打造的刀剑虽被德川幕府视为“作祟的妖刀”，但其一族实际上是虔诚的法华宗信徒。其打造的最高杰作往往会在刀茎上刻下『妙法莲华经』的题目，即为“妙法村正”。

    因此，这把刀并非单纯的诅咒之刃，而是蕴含着“以佛法之理斩断世间无常与宿业”的求道之剑

    Saber职介的千子村正则是穷尽他毕生的能力锻造的极致的一柄剑。

    既然借用了“千子村正”的名字，就必须回应这份他的执念。

    将灵基作为砧板，将村正的执念化作“钢”，在呼吸的瞬间，塑造出传说的妖刀。并非真实的妙法村正，只是她所复现出来的是无限接近于都牟刈村正的刀，这是千子村正毕生所追求的极致，她的父亲千子村正还有机会见到吗？能够挥出斩断因果与宿业之一闪的绝技，乃是穷极人类技艺的一击。

    ◆ 天羽羽斩（あめのはばきり）

    等级: EX

    种类: 对神/对灾祸/对兽宝具/对星宝具

    作为锻造与刀剑之分神的真正宝具

    天羽羽斩，即为日本神话中素戋呜尊（建速须佐之男命）斩杀八岐大蛇时所使用的神代十拳剑。又名“大蛇之麁正（Orochi-no-Aramasa）”抑或是“十拳剑（Totsuka-no-Tsurugi）”。在日本神话中，这是天照大神的弟弟——素戋呜尊（建速须佐之男命）被流放至出云国时，用来斩杀怪物“八岐大蛇”的神代兵装。

    十拳剑在[记纪神话]中曾多次出现，另外由这把也延生出不少天神，可说是一把道道地地,无庸置疑的诸神之剑

    它的第一个持有者，是身为诸神之父的伊邪那歧

    这把剑第一次发挥威力，是用来斩下母神伊耶那美处出生时灼伤其阴部，结果害她丧命的迦具土的首级。 就在此时，从这把剑的剑锋处滴下的血中诞生了三位天神，从沾上护手处上的血中诞生了三位天神，并将残留在剑柄上的血中诞生两位天神，传说中这些全都是与打造该剑相关的诸神。

    这把十拳剑便成为了世上所有剑的始祖。

    村正（Muramasa）与麁正（Aramasa），两者在神话与刀剑的本源概念上，共享了代表着“锋利、纠正、斩断邪恶”的『正（Masa）』之理。

    就原本来说，哪怕是真正的村正也绝无可能使用这把剑，但是【千子村正】经历了她在特异点No.1的一切之后，在天照大神，伊耶娜美，以及她自身所成的【法相】的位格之下，这柄剑确确实实超越了原本的十拳剑，将妙法村正升格为天羽羽斩。

    如果在伊耶娜歧【金地】的加持下，则可以借住他在对付游星尖兵时击碎地球的【意向】化为究极的对星宝具，一剑劈开行星也不为过。

    只有使用第一宝具之后才能使用的第二宝具


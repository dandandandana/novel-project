  source_profile: '================ SERVANT STATUS ================

    职阶: Berserker

    御主:

    真名: 库丘林

    性别: 男

    身高/体重: 185cm/79kg

    属性: 混沌·狂

    样貌: 脚、胫骨和膝盖向后扭转而脚后跟和小腿向前扭转，腿上的肌肉每团都有拳头大，头上的肌肉每团都有婴儿脑袋大，眼睛一只陷进去比鹤嘴还深另一只顺着脸耷拉下来，嘴和食道翻转的能从咽喉看到肺和肝，两颚拍击时能喷出公羊毛团大的火花，心跳声像狮子咆哮一样响，头上冒水汽、毒雾和火舌，头发变硬竖起能串住苹果，袭扰敌人时头上喷黑血、血柱像大船桅杆那样又高又粗，拥有不止一只手

    性格: 极致的人渣、完全狂化

    ------------------------------------------------

    ------------------------------------------------

    【出身/传说】

    凯尔特，阿尔斯特传说中的勇者。

    既是赤枝骑士团的一员也是阿尔斯特最强的战士，在作为驱使着从异界「影之国」的盟主斯卡哈处被授予的魔枪，散播着自己的威名的勇者的同时，据说也是拥有着痉挛变形的天赋、时而如同理性全然丧失的魔人与凶兽般战斗的怪物。

    作为Berserker现界的他失去了人类的外形，魔力的消费也上升了一大截，

    通俗点来说，就是失去了精确操作可能的暴走杀戮机关。

    虽然变成了狂战士，但是武艺依旧高强，通常武器是作为威力不如赤红的魔枪的武器·低等宝具，交替地挥舞着八柄不同的短枪。

    他时而用手，时而用脚，有时甚至会是用嘴地——自如地交替使用着被铭刻在其上的力量，并凭此把比身为Lancer和Caster时更恐怖的破坏力发挥出来。

    ------------------------------------------------

    【能力值】

    筋力: A+ | 耐久: A | 敏捷: A+ | 魔力: A+ | 幸运: E | 宝具: EX

    ------------------------------------------------

    【职阶/保有技能】

    - 狂化 EX

    通过失去理智取得身体能力的提升，作为狂化到甚至痉挛变形化身魔人的库丘林来说，是相性绝佳的技能

    - 神性 B

    物质性地混有神灵血液的程度。凯尔特神系的绝对者——光神·鲁格与人类生下的孩子。

    - 战斗续行 A+

    在狂化下达到了最高级别。即使受到足以把灵核粉碎的致命伤也能继续存活一段时间

    - 勇者的眩光 A

    缠绕狂战士其身的「英雄光晕（Lon Liath）」。

    库丘林的传说当中、其陷入变形状态时便会升起的光环，在其死亡时从他身上落下，并斩落了他敌人的手臂。

    Berserker的身上与武器中，都会带有这种让人陷入精神低落、同时提升着自身力量的光晕。

    - 猎犬的斗武 A+++

    影之国的女君·斯卡哈从冥土（Ifrinn）取得，并授予了库丘林的十八种武技的总称，

    亦即是爱尔兰传承当中的「致命之艺（Na Cleasa Nimhe）」。

    包括用咆哮声造成物理伤害、抑或无视地形地进行突进等等，种种匪夷所思、只有以魔人之躯才能施展万全、以普通从者的灵基无法发挥其全部威力的技术，使用魔枪的方法与作为宝具的痉挛变形也被包括在其中。

    作为失去魔术技量的代价得到此技能，虽然无法像「无穷的武炼」一样万全地「发挥人拥有的百般武艺」，但却会把英雄库丘林的全部武技调整为「作为兽战斗的最佳形态」。

    - 沸腾之血 B

    由于陷入战斗的狂气当中而被激活加速身体内混有神之因子的血统，温度是常人的数倍，不慎沾上身体甚至会被灼伤的血液。生前国王为了让暴怒的他冷静下来一连用坏了几桶盛有冷水的大木桶。

    - 避矢的加护 B

    对飞行道具的防御，纵使处于无法眼观对象的状况，也能应付大部分的飞行道具，库丘林天生持有的能力。在狙击手处于视野中的情况下，不管投掷出怎样的武器，都能以肉眼捕捉、对应。只要是投掷类型的攻击，纵然是宝具也可以回避。但是不适用于极远距离的直接攻击，也不适用于大范围的AOE攻击

    - 恐怖凝视 C

    对目击到自己身姿的所有人打出判定。精神抗性低于C的敌人将会在内心强烈恐惧的动摇下在一段时间内失去行动力，低机率有即死的判定。对抗性较高的敌方也会产生诸如：“啊，这次遇上不得了的家伙了”“这家伙很难应付”这种程度的动摇。

    - 卢恩符文 —

    由于职介的原因被完全劣化导致使用不能，不过此前常驻的发动型魔法微弱地保留了下来

    ------------------------------------------------

    【宝具】

    ◆ 噬碎死血之犬（Chon an Chleasraidh）

    等级: EX

    种类: 对人（自身）宝具

    宝具的真名含义为「伟业的猛犬」，乃是库丘林在史诗当中被人们传颂的别名。

    使用之时「勇者的眩光」会刺破Berserker的肌肤，形成将他从内到外包覆的炎气甲胄，然后将其身化为以刀剑为牙、以魔枪为爪的猎犬魔人。

    在破坏力与防御提升的同时，解放原本被Berserker这一职阶束缚了的「重摆架势」、「不眠的加护」、「精灵的狂嚣」、「兽杀」等诸多技能。

    ◆ 剜裂荒暴之牙（Chú na Sleagh Tana）

    等级: A++

    种类: 对人/对军宝具

    只有在第一宝具开启下才能暂且解封的七枪连击。

    宝具的真名含义为「疾枪的猎犬」，同样是库丘林的别名之一。

    库丘林在化为狂战士时，舍弃了最为信任的赤枪，并把威力稍弱的八把短枪，即「怒火的囚链（Fuariugh Feirge）」、「猛毒的死啸（Sgread-go-Nimh）」、「赤红之轨（Chúrsach Dhearg）」、「必中之锋（Seoladh
    Rinne）」、「必灭的极枪（Craisech Nimh）」、「利刃之青（Gorm na bhFaobhar）」、「伤痛之青（Gorm na gCréacht）」以及「城池的坏灭者（Fásgadh Fola）」

    将八把短枪全部化为从兽化的双手当中、延伸开去的利爪，这样与自身灵基融为一体的状态，并且能够凝固御主的魔术回路以及英灵发动宝具之关键，使其无法使用魔术和宝具，再以有如暴风骤雨的连击将其击碎。

    ◆ 贯突夤夜之枪（Gae Bolg）

    等级: —

    种类: 对人宝具

    被封印的「穿刺死棘之枪（Gae Bolg）」，他最为信任的力量。

    Berserker·库丘林乃是武艺圆满的状态，因而此枪也被带出，作为宝具之一登记在能力值中。

    但是，只要还维系着变形的状态，Berserker就无法使出相应的技术，也不会理解这个宝具的意义。'

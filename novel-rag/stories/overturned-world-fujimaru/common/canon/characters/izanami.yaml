  source_profile: "# 伊耶娜美\n\n================= SAVIOR PROFILE =================\n\n**真名：** 伊耶娜美  \n**初始身份：** 天照命金地世尊  \n**后期身份：**\
    \ 月读命金地之主  \n**分类：** 第二代救世主／创世大神故尊复现／黄泉津大神故尊复现  \n**对应职阶：** Saver／Lancer  \n**性别：** 女  \n**属性：** 秩序·善  \n**武器：** 天沼矛、黄泉黑月、八雷神\
    \  \n**战斗定位：** 高速重装枪兵／大范围战场破坏者  \n\n-------------------------------------------------\n\n## 【历史】\n\n伊耶娜美是世界为了对抗弥勒制造的第二代救世主。\n\
    \n世界同时调用了两种古老记录：\n\n- 创造国土与诸神的创世大神；\n- 统治黄泉与死亡的冥界大神。\n\n这些记录经过大量人格汇聚实验，最终形成了现在的伊耶娜美。\n\n她不是原本神话人物的完整复活。\n\n原本伊耶娜美最痛苦、最仇恨生者世界的记忆被删去了，只留下适合承担救世任务的部分。\n\
    \n她最初醒来后，担任天照命金地世尊。\n\n那时她负责统领金地、召唤援军并对抗弥勒体系。\n\n她曾进行近千次召唤。\n\n真正回应并走到她面前的，只有千子村正。\n\n在后续战斗中，她失去原有金地，进入月读命金地，以天沼矛与黑月击溃残留法相，成为那里新的统治者。\n\
    \n她后来发现，自己每次离开月读命金地，都会消耗居民的生命。\n\n因此终局决战时，她没有直接前往弥勒战场，而是留在后方支撑结界、接收伤员。\n\n这并非因为她不能打。\n\n而是因为她终于知道，自己出手的代价具体会落在谁身上。\n\n\
    -------------------------------------------------\n\n## 【能力值】\n\n| 能力 | 等级 |\n|---|---:|\n| 筋力 | EX |\n| 耐久 | A++ |\n\
    | 敏捷 | A++ |\n| 魔力 | EX |\n| 幸运 | D |\n| 宝具 | EX |\n\n伊耶娜美不是站在后方施法的母神。\n\n她最擅长的是提着天沼矛直接冲进敌阵。\n\n十八尊法相结阵，也会被她一矛正面轰开。\n\n\
    -------------------------------------------------\n\n# 【核心能力】\n\n## 创世神躯：EX\n\n世界以创世大神记录制造的肉体。\n\n具备极强力量、耐久与恢复能力。\n\n\
    伊耶娜美受伤后，可以消耗魔力重塑血肉、骨骼与神经。\n\n恢复不是无条件复活。\n\n只要伤害速度超过重塑速度，她一样会死。\n\n---\n\n## 黄泉黑月：EX\n\n伊耶娜美将黄泉之力压缩成黑色月光。\n\n黑月不再拥有大量复杂判定。\n\
    \n其效果主要有三种：\n\n- 压制敌方恢复；\n- 腐蚀肉体与灵基；\n- 强化伊耶娜美的攻击。\n\n被黑月照中的敌人，伤口会出现黑色腐蚀，恢复速度明显下降。\n\n对神灵和法相尤其有效。\n\n---\n\n## 八雷神：EX\n\
    \n八尊雷神寄宿于伊耶娜美体内。\n\n战斗时，它们会化作八道雷纹与八组外置肢体，覆盖她的头、胸腹、四肢与背部。\n\n每解放一尊雷神，伊耶娜美的速度、力量和雷击威力便上升一层。\n\n八雷全部解放后，她会进入短时间超负荷状态。\n\n\
    能够正面与巨大法相、神灵和弥勒投影肉搏。\n\n结束后神躯会严重损伤。\n\n---\n\n## 五法运用：A++\n\n伊耶娜美确实继承过五大法文明的成果，但不再写成无所不能的万能权限。\n\n战斗中主要用于五种简单用途：\n\n-\
    \ 制造魔力与物质，修补武器；\n- 短距离跨越空间；\n- 保护和固定灵魂；\n- 令自身动作短暂加速；\n- 召出其他可能性中的一次攻击。\n\n每一种都消耗巨大。\n\n无法连续无限使用。\n\n面对弥勒时，只能用来争取一次出枪、一次闪避或一次恢复。\n\
    \n-------------------------------------------------\n\n# 【战法】\n\n## 天沼枪术·开国\n\n由下向上挥动长矛。\n\n矛锋会掀起大地与岩层，形成如岛屿升起般的巨大冲击。\n\
    \n适合正面破阵。\n\n---\n\n## 天沼枪术·神生\n\n连续刺出数十至数百道枪影。\n\n每一道枪影都会附带一种不同属性的神力：\n\n火、风、雷、水、岩、光、阴影。\n\n本质仍然是高速枪击。\n\n可以被挡，也能被打散。\n\
    \n---\n\n## 黄泉落\n\n以天沼矛砸向地面，释放黑色冲击波。\n\n冲击范围内的敌人会被黄泉之力侵蚀，身体变重，恢复变慢。\n\n伊耶娜美通常会紧跟着冲入敌阵近战。\n\n---\n\n## 八雷穿\n\n八尊雷神同时将雷霆汇入矛尖。\n\
    \n伊耶娜美进行一次极高速直线突刺。\n\n这一击没有复杂即死性质。\n\n但贯穿力足以直接打穿大型法相与神灵甲胄。\n\n---\n\n## 黑月坠\n\n将黑月从天空压向地表。\n\n不是概念领域。\n\n就是一颗由黄泉魔力高度压缩的巨大黑色能量体。\n\
    \n落地后形成覆盖战场的爆炸与腐蚀。\n\n-------------------------------------------------\n\n# 【宝具】\n\n## ◆ 天沼矛·大八洲国生\n\n**等级：EX**  \n**种类：对界宝具**\n\
    \n伊耶娜美将全部创世魔力灌入天沼矛，向前挥出一道足以撕开神国的巨大斩击。\n\n斩击经过之处，大地翻起，山川断裂，空间出现短暂扭曲。\n\n宝具既可以破坏，也可以在攻击结束后重新塑造地形。\n\n但重塑土地需要额外魔力。\n\n战斗中通常只使用破坏部分。\n\
    \n---\n\n## ◆ 黄泉津大神·黑月八雷葬\n\n**等级：EX**  \n**种类：对军／对神宝具**\n\n八雷神完全解放。\n\n黑月压低至伊耶娜美身后。\n\n她以天沼矛发动连续八次重击，每一击都比前一次更快、更重，最后将全部雷霆与黄泉之力一同引爆。\n\
    \n这是伊耶娜美最强的正面战斗宝具。\n\n没有把敌人强制拖入黄泉。\n\n没有绕过防御。\n\n打得过便打死。\n\n打不过，她就会被对方正面接下来。\n\n================================================="

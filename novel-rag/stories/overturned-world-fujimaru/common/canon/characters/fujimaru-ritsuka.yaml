  source_profile: '================= MAGUS PROFILE =================

    姓名: 藤丸立香

    性别: 女

    年龄: 18

    外貌: 橘发橘色眸子 娃娃脸 长相类似于卫宫士郎的形状但是线条更为柔和

    体型: 159cm/49kg 匀称身材

    起源: 奇迹般的希望

    魔术回路·量: E

    魔术回路·质: D

    性格: 表面上，藤丸立香是一个近乎完美的指挥官——冷静、精准、几乎不会在战场上有任何多余的情绪起伏。那是因为她把所有会动摇自己的东西都研究透了，然后一块一块地摁进去、压住、不让它们在错误的时刻冒出来。这不是天生的冷静，是用无数次差点死掉换来的习惯。

    然而在那层"完全理性的指挥官"壳子底下，她其实还是个很普通的少女。见到亮闪闪的东西会走不动路，甜食面前没有任何抵抗力，喜欢吃醋，而且吃起醋来的方式非常不高明——她自己清楚，却还是控制不住。压力和情绪的出口只有一个，就是士郎。用他来撒气，或者用其他方式消化（和言峰士郎SEX），反正是只有对着他，她才会允许自己完全地乱掉。

    这种性格结构带来一个有趣的效应：她对外几乎没有弱点可言，但她的弱点一旦暴露，就会暴露得非常彻底。

    她在大事上做的决策几乎上是从来不出错，但是小事上问题不断，不管是生活上还是什么都是如此

    魔术师准则: 无，大概是活下去

    梦想: 让所有人活下去

    出身: 平民（？有背景是埋葬机关顶层的平民吗？）

    补充说明：因为其长得很像言峰士郎被吉尔茜收为弟子，卷入了极端的救世旅程，成长为了世界上最强的御主，单兵就有对抗绝大多数从者的能力，世界线为究极强化版的FGO的世界线，立香召唤的第一个从者是言峰士郎，在士郎，玛修和吉尔茜的旅途中，他们对抗的每一个副本都有远远超越BEAST的绝望存在，没有人理的支援，她每一次出战都是视死如归的战斗。但是她没有放弃希望，一直在前进。

    最终结束了一切，平定了时间线，回到了日常生活，和言峰士郎一起活着

    -------------------------------------------------

    -------------------------------------------------

    天赋/礼装/刻印：

    安魂（EX）：藤丸立香的主武装，允许藤丸立香读取言峰士郎的武艺，从而拥有神域级别的武艺，绝大部分从者都无法和她比肩。

    根源魔术：立香掌握部分根源魔术，目前她所能使用的是逆行根源的裂解术，在理解了对手之后，通过裂解术可以直接湮灭对手

    英杰之帜：没有灵基图谱，立香失去了灵基之影，但是她获得了雅典娜的能力，她遇到【从者】后，会根据她的极限召唤出对应的失去了自我人格但是保留了全部能力的英灵座上的【英灵】，目前她可以给英灵提供的是冠位灵基，也可以利用一道令咒，把自己的从者增幅到最强的状态。

    人类的礼赞（A+）：来自埋葬机关背书的究极礼装，免疫一切A+级别以下的攻击，外表上是一件白色的外套。

    伪·根源之涡 ？？？：来自神琦家族的礼装，能够让完全没有魔术适配能力的凡人拥有施展大魔术的能力，同时可以使用根源魔术，是立香施展魔术的基础，她的魔力大部分来自于迦勒底的供能，这个礼装在她的体内，支撑着她的根源魔术的运转。


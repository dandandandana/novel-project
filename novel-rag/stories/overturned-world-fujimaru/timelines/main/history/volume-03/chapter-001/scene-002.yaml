content: '千子村正从伊邪那美的最后一句话里听出了什么，他把身体往后靠在椅背上，红发被宫殿里的烛火映成了偏暗的橘红色。琥珀色的眼睛在眼眶里从伊邪那美的脸慢慢转到她身后壁龛里供着的那面镜子——镜子已经很旧了，镜缘的漆脱落了小半圈。


  “呜哇，你居然把这个世界的真相直接塞给老夫。”他翘起二郎腿，膝盖撞了撞空气里飘着的一丝线香烟雾，“所以现在是什么情况？”


  “这个世界彻底坏掉了。”伊邪那美抬眼看他，眼中没有责备也没有请求，只有陈述。


  “相信你所能看见的，Saber。”


  村正歪了歪头，头发从额前滑下几缕。他伸出一根手指晃了晃，“你说话的语气和你讲的故事一样——开头和结尾都是直的。行，老夫看见了。世界坏掉了。然后呢？”


  他把指头收回掌心捏成拳头搁在自己膝盖上，“你的丈夫毁灭过世界然后再造，现在这个再造的地球也坏掉，那你叫老夫出来是要老夫当全世界最老的修理工？”


  “你有你的刀。”伊邪那美说，“我有我的理由。”


  “理由嘛，迟点再说。”村正把翘着的二郎腿放下来，靴子磕在地上时发出一声钝钝的闷响。他环顾宫殿——柱子上雕刻的纹路已经被时间磨掉了很多，原本大概是藤蔓的雕花现在只剩下几条断断续续的线。


  “说起来我以为你会是那种——把话讲得绕来绕去的神明。满口命啊因果啊，问个问题你先绕到你和伊邪那岐的感情史上。”他把视线从柱子上收回来落在伊邪那美脸上，“没想到你跟一般的女人没什么区别。”


  伊邪那美无视了他这句话。她的眼皮没有往上抬，表情挪都没挪，只是静静地等村正把话说完。“你想知道为什么吗？”


  “说不想那必须是假的~”村正往后一靠，笑起来时嘴角往上拉出一个不太正经的弧度，“但你看起来挺想把这段讲出来的。那就当老夫免费听你诉苦好了，御主。”


  伊邪那美的声音依旧平淡，平淡到像是在翻开一份早就被她写好的奏折。“在我沉睡的途中，不管人们正常的发展，还是怎样，我都无法干涉——包括普渡众生之人。”


  村正的眉头往上挑了半寸。“普渡众生？那些天竺来的和尚？”他说这话时把身子前倾，臂肘抵在膝盖上，整个人从懒洋洋窝进椅背忽然变成了弓着背的听讲姿势。伊邪那美点了点头，金冠上的细链随着点头的动作轻轻晃了一下。


  ===


  “师兄。”僧袍擦过石阶的边缘，衣角带起的风声在晨钟敲完之后的那片刻寂静里插了进来。


  大殿外站着两个僧侣，其中一个刚替师父传完话，正看着从石阶上走上来的师兄。师兄站住脚合掌还礼，他的手掌在胸前合拢时掌缘的皮肤上是年复一年叩首磕出来的薄茧。


  师弟往后退开半步。“师父有话要对你讲。”师兄点了点头，手指从袖中摸出念珠，指腹推开第一颗珠子开始一粒粒碾过去。他往大殿走去时僧袍下摆扫过石阶上一层很薄的香灰，香灰被扫起来扬了几寸又落回台阶。


  师弟在大殿外面等着。他听着大殿里隐约传出师父的声音——那不是对话，是师父一个人不疾不徐的念诵，念诵之间夹着师兄偶尔回应的简单音节。师弟低下头开始诵经，嘴唇翕动时经文从喉咙深处被推出口腔，一个字一个字贴着空气滑出去。


  不知等了多久，师弟被迈出殿门的脚步声打断。他抬起头，师兄正从大殿里走出来，脚步和刚才走进去时一模一样——不急不缓，僧鞋底踩在石板地上连着一声又一声。


  只不过师兄没有看他。师兄的脸从他面前偏过去，视线越过师弟的肩头落在寺门外面那条通往下山石阶的方向。


  “师兄？！”师弟往前追了一步，“你要去哪？”师弟这句话尾音往上挑，不是问去什么地方——他看懂了师兄的眼神。


  “去渡人。”师兄说着把念珠缠回手腕上，珠串在手腕上绕了两圈然后被收进袖口。


  师弟站在大殿门口看着他师兄的背。阳光从寺门外面照进来把师兄的僧袍染成半透的金色，但那份金不是佛光——是外面那个凡尘俗世最普通的夕阳。


  师弟的声音忽然轻了下去，轻到像是念经时忽然被自己呛了一下，“你没能渡己，怎能渡人？”师兄没停步。他一步步走出寺门，僧袍的衣角最后消失在门框外那片偏红的夕阳里，连背影也没留给师弟。


  伊邪那美讲到这里时声音仍然没有变化，仍然是那种不疾不徐的匀速叙事，只是在念完“怎能渡人”之后留了一拍沉默。“你相信命吗，Saber？”


  村正抱起手臂，把手指扣在自己肘弯外侧。“这种事情谁会信啊~”


  伊邪那美看着他，眼神里没有失望也没有责备。她只是继续说着，像在翻开那份奏折的第二页。“那么很可惜——在这里，命是存在的。那个僧人就证明了这个。”'

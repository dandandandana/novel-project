content: '“锻造星之圣剑的精灵在那一夜遭到击杀。”


  伊邪那美开口时手掌平放在膝上，指尖没有动。她讲述这件事的方式和讲述天气之间差着一层厚到无法丈量的时间——不是冷淡，是已经没什么好激动的了。


  她说那个精灵的名字时嘴唇张合之间牙齿碰了碰下唇，然后停在最后一个音节上。星之圣剑没能完成锻造，这柄本该用来对抗游星尖兵的最终武装在铁砧上冷却了。


  剑身刚从火焰里夹出来时剑脊还在嗡嗡颤抖，然后它被搁在铁砧上，温度一点点从橙红退到灰黑，直到剑刃上倒映着的那片星辰也退干净了光。


  锻造失败的连锁从那一刻开始显现，游星尖兵获得了无法逆转的优势，那个机体——光之巨人的躯体在星海中站直之后就不再需要弯腰。


  伊邪那岐召集了自己所有的血脉，天照从日轮之中抽出她的神镜，月读把他的银弓在膝盖上重新绷了一道弓弦，须佐之男拔剑时剑刃从鞘口擦出一线湛蓝色的火花。


  伊邪那美站在丈夫身侧，黑白和服的袖口在神代最后的风里被吹成两道平行的竖线。


  “不管是天照，还是须佐之男，还是月读——在游星尖兵面前相继战死。”


  天照被一道从游星尖兵胸口射出的光束贯穿神镜。镜面先是裂出一道缝，然后整面镜子从裂缝处往两边瓦解，碎镜片散成万千光点在半空中烧了半息便彻底灭掉。


  天照没撑过第二击。须佐之男的一斩劈进游星尖兵左肩，剑气从伤口里灌进去推开了几层的密质装甲，然后游星尖兵抬起右臂，把须佐之男从头顶往下一拳砸进海底——海面被砸出一块直径大到看不见边的窟窿，海水从窟窿边缘倒灌回去时发出连天穹都在震的闷响。


  月读的银箭总共射出了七发，每一发在离开弓弦的瞬间就被游星尖兵用手掌从空气中扇了下来，第七发箭掉进海里之后月读被从游星尖兵的瞳孔射出的光束钉在月球表面——那是他自己的神域。


  他的身体碎进月海沙土时月面溅起一片扬到真空的尘雾。


  伊邪那岐创造的世界在游星尖兵的脚下一步步被踩成废墟，国津神们从海面浮起来试图用身体的重量拖慢游星尖兵前进的速度，但游星尖兵每迈一步都踩碎了几个神明。


  “结束了。”她把这句话放在气息之间，就像把一件衣服叠好搁进抽屉。“天沼矛，最后的一矛朝光之巨人挥去。伊邪那岐带着他的愤怒，体会着失去一切的绝望，挥出了十拳剑。”


  她把话放在这里停了两拍。不是让听众咀嚼，是她自己在找回这一段记忆时也需要停两拍。


  天沼矛的最后一击——伊邪那岐握矛杆时手指收紧，他不是把矛推过去，是把自己所有的愤怒灌进矛尖然后整个人跟着冲出去。


  矛尖从游星尖兵胸口刺进，贯穿了一层又一层密质装甲，每穿过一层矛杆都在减细，矛尖在巨人体内硬生生顶到后背装甲内侧才停住。游星尖兵愣了一下——那是它入侵这个行星以来第一次被打得后退了半步。


  然后伊邪那岐拔出十拳剑。剑身从剑鞘里抽出来时剑刃擦过的空气被点燃成一线刺目的火，那火不是凡间的火烧出来的颜色，是深到发紫的黑焰。伊邪那岐挥剑时没有喊叫，他的喉咙里已经没有声音了，所有能称之为愤怒的东西都转化成这一剑本身的重量。


  十拳剑挥出去时剑锋划过的不是游星尖兵的躯体——是空间。剑压推开空气把天空从地平线到天顶劈出一条裂隙，裂隙往左右两侧延展，左边拉到视线边缘，右边推到视线边缘还继续往外裂。游星尖兵应声倒地，那道巨大的光之躯体从裂隙里被劈成两半，然后每一半被裂隙切开的位置各自又裂了一次，直到整具躯体碎成再也拼不起来的碎片在裂隙边缘被吹散。


  “代价。”伊邪那美吐出这个词，嘴唇张开时下唇有很轻的抿痕。“承载着所有生命的地球也被这一剑彻底切碎。地球消失了。承载着他所爱着的一切，却因他的愤怒和绝望而毁灭。”


  十拳剑的那一劈切穿了游星尖兵之后还在继续延伸。地面从剑痕处裂开了一道最宽的缝隙，然后整片地壳从裂隙边缘往外翻卷，岩石从深渊中被硬生生挤上来又被裂隙吞没。


  大海从裂隙中流进去但没有流到尽头——裂隙穿过了地心，海水倒灌进液态铁镍的外核，滚烫的蒸汽从裂隙里往上喷成一道一直顶到大气层边缘的白墙。


  生命从最高的山脊到最深的海沟在数息之间就被抹去，伊邪那岐站在裂隙前看着自己创造的星球被自己劈开的裂隙一块一块吞下去，然后裂隙吞够了，世界归于虚空。他站在虚空里握着十拳剑，感受自己的愤怒在空荡荡的虚空中被冷却成一片沉重的静。


  “他重造了地球。现在的地球是我丈夫最后制作而成的。”


  她把这句话说完之后手指从膝盖上抬起来放在案几上。'

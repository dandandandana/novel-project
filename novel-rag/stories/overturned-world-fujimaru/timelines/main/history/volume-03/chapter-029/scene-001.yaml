content: '罗汉头颅撞进街市时带着一股腥风，木梁没来得及断就被连根从地基里拔了上来，瓦片和碎砖混着人哭喊的声音在半空中搅成浑浊的一片。


  德川家光那张被塑成圆滚滚弥勒相的怪脸从碎屑里浮出来，嘴角咧到了腮帮子后半寸，嗓子里滚出来的笑震得地上没倒的墙壁也跟着发颤。


  “跑？跑有什么用——跑再远也是食粮！”村正弓起腰背，眼中的黑红色火焰从瞳孔深处猛地朝外一涌，裹住了整只眼眶。


  她嘴唇动了两下，声音几乎没有从嗓子眼里出来，“天照……”


  黑炎从她的肩胛骨朝上喷涌，卷着木屑和半截断柱在头顶翻搅，火舌舔过每一块碎片的边缘时它们就齐齐被吞成灰烬。


  那火焰在一口气清空了头顶的杂物之后没有朝外扩散，而是内旋着朝她的脚下聚拢——黑与红交错的焰流一层一层压在一起，最后硬化成一条黑红色的窄道，直直朝着那枚浮上半空的罗汉头延伸过去。


  村正踩上去，脚下的火焰随她迈出的步子朝后推开两排几近透明的热浪。


  “德川家光！”


  筑山殿的声音撕开她身后的空气，整片天空在那一嗓子落地的同时被月光灌满了。


  整片天幕都变成了一面发白的冷盘，白到所有的颜色都被洗淡，连罗汉头颅的金漆也变作了一团脏兮兮的暗黄。


  筑山殿的眼睛亮得看不出瞳仁，月光在被短刀吸进刀身的瞬间锐叫了一声——那是刀身上每道金属纹路同时被点亮之后震动空气发出的短音。她身上那件硬朗的袍子轮廓在月光中一截截变淡，先是袖口，再是肩膀，然后是整个人都接近了透明。


  “主武装断了又怎样？这柄短刀拿来杀你这个赝品也绰绰有余。”她的声音压平了调门，没有朝村正喊，是对着自己说的。脚下已经踩着月光朝那条黑红道路掠去，透明的身体在空中奔走时几乎看不出落脚点，只有月光在她靴底接触空气的地方短暂地聚成一点极淡的白斑。


  村正没有往她的方向偏头。德川家光的罗汉嘴里吐出第一波金色梵音，一个个梵字拖着转瞬即逝的金色尾迹朝村正砸来时，她用裹着黑炎的长剑劈开了最前面的那一枚，剑刃与梵文接触的瞬间炸出一声极脆的裂响。


  她反手又削掉了紧随其后的另外两枚，剑势没有停顿，人已经沿着黑红道路继续朝前逼近，唇缝里漏出的呢喃被火焰吸走，一个字也听不清。然后整片夜空忽然从深黑色褪成了金。从头到尾，从左到右，连地平线那一点残余的灰也被一口气吞掉了，金色从天顶一口气铺到地面。


  筑山殿的脚步骤停。她的眼珠在眼眶里微微转了半圈，瞟过头顶的金色，又瞟过脚下那片被金光铺满的瓦砾。“空中——在空中也能把这个鬼工坊展开？”她的手指收紧，短刀的刀柄朝掌心抵了一下。


  极小大世界·天之金床，千子村正的能力在没有地面的天空中同样生效。空间本身被强行改铸成世间最高温的锻造炉，周围空气中每一缕残余的魔力和热量都被刀锋般的金线从四面八方抽过来，涌进她周身旋转的火焰里。在这间天上工坊之内，她的剑速被抻到了连她自己的肌肉都来不及反应的速度。


  罗汉头颅的口中蓄起了一团缓缓旋转的白色光球。筑山殿看见那团光——光炮正在蓄力——她咬了咬牙，整个人压低了透明的身子，趁村正挥剑对付梵文的间隙从侧后方抄了过去。“只要这傻罗汉把她的注意力吸住……”


  她手里的短刀是月读命用万民献祭铸造给弥勒的法器，弥勒看的时候带着怀念，随后又丢给了月读命的世尊，刀身上的金属纹路被月光一碰就活了过来，刀柄上的剑刃随即亮起整整一截，化作一道没有厚度只有白色冷光的激光刃。


  筑山殿腾空，身体化为一团白雾，雾端在空中转了半圈，无声无息飘向村正后背。


  光炮从罗汉口中轰出的同一刻，白雾凝成了筑山殿的身形。她的激光刃高举过顶，斩落的方向正对村正的后颈。


  然后她听见村正的声音从那团黑炎里送出来，每个字都没有火气，却冷得把周围所有的炸响都比下去了：“斩尽三千繁华梦。”


  黑红色的眸子转过来，越过她自己的肩膀，直直钉进筑山殿的瞳孔。筑山殿看见那眼睛里没有意外，没有慌乱，只有一片早就等在她必经之路上了的了然。


  妙法村正以一百八十度的轨迹从村正腰间旋上来，剑刃经过的空气中留下一道肉眼可见的黑痕，黑炎在刃锋触到筑山殿腰侧的瞬间烧透了她半边身子。


  一剑。


  天空静了整整一次呼吸的时间。筑山殿低头时自己的下半身已经被剖开之后烧了起来，火焰正顺着撕裂的衣料朝上蔓延。光炮还在朝前飞——不对。她脑子里刚冒出这两个字，一张巨口便从旁边张开了。


  罗汉头颅把德川家光的脖子拉长到了不合常理的尺寸，嘴壳子一张开就遮掉了她视野里剩下的最后一片金色。'

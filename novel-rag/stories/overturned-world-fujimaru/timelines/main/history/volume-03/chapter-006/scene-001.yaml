content: '立香先看到的不是流光，是地面。玛修正抱着她和村正从一片不算太高的屋顶上掠过，脚底下踩碎的瓦片还没来得及落到巷子里，人已经跳到了另一栋房子的屋脊上。


  立香的视线越过玛修盾沿往下一扫，街巷里密密麻麻跪着黑色的人。那些人把身子蜷成很小的一团，膝盖顶着额头，两条手臂裹住脑袋缩在胸前，从高处往下看不像人，更像一堆一堆被风刮到一起的旧衣服。


  瘦小的每一团黑色的轮廓都瘦得能隔着布料看见背部的线条，那些线条在月光底下微微发着抖。


  然后村正的嗓子突然炸开了。


  “小心！”


  一道洁白的流光正从后方追上来，光的尾巴在空气中拉出一条很细很亮的线，线的尽头直直对着玛修的后背。


  玛修没回头看那道流光，她的眼珠子一直钉在前方那片不断逼近的屋顶剪影上，脚步的节奏半点没乱。


  流光飞到她身后不到两丈的地方，一道箭矢从侧面横着撞了上去。


  箭尖撞上光流的正中间，啪的一声脆响，流光被撞碎了——从箭尖撞进去的那个点开始碎，碎成无数片白色的光片，光片在半空中翻着跟头往下落，还没落地就自己灭了。


  “什……”村正偏过头，脖子转得猛，兜帽从头上滑下半截，露出底下被汗粘在太阳穴上的红发。她去找射出这支箭的人，但满天的月光和碎光片在她眼睛里只留下无数个互相交叠的亮斑，别的一概没有。


  那道箭矢像是从空气里凭空长出来的。然后又一道流光射来。一道洁白的菱形碎片在三人身边凭空凝成，流光撞上碎片的瞬间闷响了一声，撞碎的光和碎片炸开的魔力搅在一起往四周溅。


  轰轰轰轰！


  流光一道道射来，箭矢一根根撞上去，盾牌一面面把剩下的碎光挡在外面。在这些密集的爆炸声里玛修没有变过一次方向，脚底下的屋顶一块接一块往后倒。


  “喂喂。”村正的声音从玛修手臂间闷闷地传出来，她抬头看着玛修的下巴，发现这个抱着她的少女连眉头都没皱过一下，“你们这么信任他？”


  立香把脸从玛修的盾沿上转过来，她的刘海被迎面的风压得掀了起来，额头上有一层薄薄的汗，“当然，士郎一向做得很好。”她说完这话之后又扫了一眼前方。


  扫这一眼让她的瞳孔猛地缩了一下。


  “玛修！小心前面。”


  玛修刹住了脚步，靴底在瓦片上擦出半拍刺耳的声响，碎瓦从她脚底下弹开，滚下屋檐掉进巷子里。前方不到十步，站着一个女人。素衣，纤细的身影，月光从她背后打过来把她的脸藏在阴影里，只照出一圈白色的轮廓。


  她的手里握着一柄细长的武器——像矛又像枪，杆身太细看不出到底是砍人的还是捅人的。她就这么静静地站在屋脊上，像是已经等了很久。


  流光停了，四面忽然变得很安静，刚才那些噼里啪啦的爆炸声像是被人一把掐住了喉咙，只剩下远处还在隐隐传来的沉闷轰鸣。村正的声音在这片安静里格外沙哑：


  “法相。”


  “又是法相？”立香的两个字还没在空气里散开，素衣女人动了。长柄武器在她手里转了半圈，矛尖的寒芒在月光下闪了一下，然后朝着玛修直刺过来。


  玛修把手臂往两边一张，村正和立香从她怀里滚了出去。两个人在屋瓦上滚了两圈各自稳住身体，玛修举盾已经迎了上去。


  一剑，剑尖擦着女人颈侧挥空。玛修顺势把盾面往前一压，用盾面的铁框砸向女人。


  女人显然没有预料到这面和她差不多重的盾能砸出这么大的力道。


  她的长柄武器被盾面震得往上一弹，虎口松了半寸，整个人往后撤了两步。玛修没有追，她把剑往内一收，剑柄磕在自己的盾沿上发出咣的一声闷响，打算重新摆好架势。但女人没有给她这个时间。


  女人撤后之后没有停顿。她把那柄长武器往上一举，然后轻轻一挥。这个动作太轻了，轻得像是她只是在掸掉袖口上的灰。但天忽然黑了，直接黑了下来——那片黑色把整片天幕的光从中间往外抽，往两边卷，卷到地平线下面之后嘣的一声收了口。


  连月亮都没了，整个月读命金地变成了一个密不透光的盒子，屋顶、街巷、那些跪着的人，统统被吞进了同一片黑色。


  玛修的眼神一下子变了。她猛地一敲自己的盾牌，指腹敲在盾面正中央的位置。魔力从盾面的纹路缝隙里涌了出来——先是几道很细的白光从刻痕里漏出，然后光顺着纹路往整面盾铺，铺满之后盾的颜色从漆黑变成了亮银。


  光从盾面上往外涌，照亮了周围几丈的屋顶，断壁残垣被这股银光染成了偏冷的灰白，墙壁上的裂缝被光照到的部分往外投出晃得很慢的影子。


  女人不见了。


  立香在黑暗中只能靠玛修盾牌的光来辨别方位，那些光把她脚下的瓦片照得发白。然后她感到一阵寒意从身后贴过来，贴得很快，快到她的后颈还没起鸡皮疙瘩寒芒已经到了。


  叮！！'

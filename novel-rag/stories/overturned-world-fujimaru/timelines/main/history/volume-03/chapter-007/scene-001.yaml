content: '远处钟楼的钟还没敲完，士郎的剑光已经在屋檐上割出第三道口子。那些和尚从城门口涌出来，一片一片往外铺——灰布僧袍在月光底下翻成暗色的浪，一排接一排踩着前面人的脚印往同一个方向追。


  玛修没回头看这景象，她抱着村正和立香在屋顶上保持一个稳定的速度，靴底规律地碾过瓦片，每踩一步后面就有一片碎瓦从屋檐边缘滑下去掉进巷子里。


  “那些是被称为摩诃和法师的存在。”村正的声音从玛修的臂弯里传出来，迎面灌过来的风把她的尾音压得有点闷，但每一个字还是咬得稳稳当当。


  她把脸偏了偏，让嘴巴不被玛修的肩甲挡住，“摩诃是中间的，法师是最弱的。”


  立香在另一侧臂弯里点了点头，后脑勺磕在玛修的盾沿上磕出轻轻的一声。


  “就是弱的和尚。”她的总结来得很快，快到自己还没听到追兵砍翻的声音就先下了定义。


  她话音刚落，身后就传来了细簌的声响。是布帛被剑尖撕开时那种很轻很脆的嘶啦声，然后一具身体从屋顶上闷闷地滚下去，滚到屋檐边缘停了一拍，翻进巷子里。


  又一道剑光亮了一下，一道接着一道。


  士郎在三人身后保持着一个不远不近的距离，每次剑光闪过之后就有一片灰色僧袍从追兵的阵列里塌下去。


  但从城里追出来的和尚没有停，前面那个被斩下去，后面那个踩着他的尸身继续往前扑，步伐的节奏半点没乱。


  “比起法相差距好大啊。”立香嘟囔了一句，她把这句话从齿缝里挤出来的时候语气里带着一丝真切的困惑——她真的在试图理解这件事。


  “这真的是一种存在吗？法相和这些——是一类东西？”


  村正没有马上回答，她的视线越过玛修的肩膀落在后面那些还在不断涌出的灰袍追兵身上，琥珀色的眼珠子跟着一道剑光从左边挪到右边，挪完之后垂下眼皮。


  “法相和摩诃的差别是天壤之别。”她开口的时候把声音放得很低，低到只有玛修和立香能听见，“而被称为法师的和尚，和摩诃又是天壤之别。”


  立香迎着风声把这话嚼了嚼，“原来如此。”嚼完之后她的眉头松开了一半，像是在一团乱麻里找到了一个可以捏住的线头，“我好像明白了——千子村正亲，所谓的法相、摩诃和法师，都是和尚而已对不对？有强有弱——但都是和尚。”


  村正愣了一下，不是因为这句话的内容，是因为立香说这话的时候语气太理所当然，好像把三个悬殊到不应该放在同一个句子里讨论的存在统称为“和尚”是一件很自然的事情。


  她叹了口气，气息被风卷走：“你这样理解也没什么问题就是了。”她偏过头看着前方不断靠近的城墙边缘，“到时候我再和你们解释——先离开月读命金地吧。”


  玛修在村正说完最后一个字的时候踩上了最后一片屋顶。城墙在她面前往下沉了一大截，城外那片被月光浸透的郊野在她脚下铺开。


  她没有减速，抱着两个人从城墙边缘上蹬了一步，整个身体腾到半空中时月光从侧面打在她的盾面上，盾面的金属纹路被照亮了一瞬，然后她落到城外的荒草地上继续往前冲。


  立香真正看清月读命金地全貌的时候人已经在半空中了。玛修抱着她们跃出了城墙的范围，从城内到城外隔着一道高墙，墙这边的地是压实的石板和瓦片，墙那边是荒草地和稀稀落落的松林。立香的视线越过玛修的肩膀往回扫了一眼。这一眼就收不回来了。


  巨城铺满了整片地平线。城墙在月光下泛着一种偏冷的灰白——不是石头本身的颜色，是月光把它漂成了一大片褪色的苍茫。城墙往两边一直延伸到视野尽头，往左边看不到折角，往右边也看不到。


  城内的街巷密密麻麻地铺开，从高处往下看就像一张摊开了就收不回去的网，每一条巷道都被月光填成细长的银线。


  法相头颅之前所在的位置还有银光在涌动，那团光在视觉上像一个很慢的心跳——亮一下，暗一下，再亮一下。不是城池。是一整片被高墙圈起来的大地。立香的手指在玛修的袖子上无意识地收了一下。


  “这么大？”她喃喃地吐出两个字，声音被高空的风压得有点发颤，“怎么感觉比东京还大？”


  没人回答她。士郎还在后面断后，村正闭着眼睛养力气，玛修在调整降落的角度。风把立香的刘海掀起来盖住了半张脸，她从发丝的缝隙里继续盯着那座巨城一直盯到玛修的靴底踩上松林的腐殖土，脚下传来干燥松针被踩碎时脆脆的声响。


  “御主，貌似没有追兵了。”士郎的声音从林间传过来。


  立香吸了一口郊野的空气。铁锈和血腥味都没了，只剩下松针被风翻动时互相摩挲的细碎声响，和远处某棵树上不知名的鸟短促地叫了一声。


  她把吸进去的气从鼻子里慢慢吐出来，然后开口：“玛修，把我和村正放下来。”'

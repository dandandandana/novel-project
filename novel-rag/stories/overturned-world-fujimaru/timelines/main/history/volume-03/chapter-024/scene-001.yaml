content: '月读命金地从来没有过真正的太阳。


  城中的光是从天照命金地反射过来的——穿过两座金地之间那道极长的夹缝，再被月读命金地上空那层终年不散的薄云滤过一遍，落下来时已经冷掉了。像隔夜的茶水倒进杯中，颜色还在，热度全无。住在这里的人们从出生到死去都不曾见过真正的日轮，他们以为光就是这个样子的——凉丝丝的，软绵绵的，晒久了也不会让皮肤发烫。


  高耸的殿堂在冷光中拉出极长的影子，将台阶下跪伏的人群整个笼罩在阴影里。身穿和服的高大男人一步一步走上石阶，他的木屐踏过青石板时发出不紧不慢的沉实叩响，每一步都踩在同一段节奏上，压得住整条台阶两侧跪着的市井百姓不敢抬头的呼吸声。有人额头贴着地面，有人肩膀在发抖，有人把手指塞进石缝里死死抠住，指甲盖在青苔上刮出极轻的湿响。


  德川家光没有看他们。高台上已经站了两个人正等着他——白衣女子立在平台左侧，衣摆被风轻轻撩起又落下；正中央是黑袍僧侣，袍帽将脸遮去了大半，只露出下巴一小截没有表情的轮廓线。


  德川家光走到黑袍僧侣面前，整了整和服的袖摆。然后他恭恭敬敬地跪下去，额头碰在石板上磕了个极响的头。石板上还残留着上一拨僧人洒扫时拖过去的水痕，凉意从他前额的皮肤直直灌进颅骨。


  “尊者。”


  黑袍僧侣微微一颔首。那动作轻得袍帽边缘只往下沉了半寸的距离，但已经足够。德川家光从地上站起来，拍了拍膝盖上沾的灰。


  他在站起来时侧过脸，把视线从黑袍僧侣身上移开，落在白衣女子面上。他的嘴角往上勾了一下：


  “筑山殿阁下近况如何啊？”


  他吸取了宫本武藏的灵基之后面色红润得如同一层油敷在脸上，在冷光下泛着让人不舒服的反光。


  筑山殿没有看他。她的视线一直系在黑袍僧侣身上，她把下巴微微抬起，声音从嗓子底平平稳稳地流出来。那份平稳不是不在乎德川家光——是把他的话当成了台阶下扫地僧人扫帚擦过石板的噪音。


  “尊者，有看到什么吗？”


  黑袍僧侣摆了摆手，宽大的袍袖在挥动时扫过他腰侧挂着的念珠，念珠互相磕碰发出极轻的木质摩擦声。然后他转身朝大殿走去，脚步不快但每一步都踩在广场石板的接缝上，精准得像是量过的。


  德川家光和筑山殿对视一眼。两个人的嘴唇都在同一时刻动了半下——德川的嘴唇张了张又合上，筑山殿把下巴收了半截又把那句话吞了回去。然后他们同时迈开步子，跟在黑袍僧侣身后踏上平台。


  广场在主殿之前铺展开来，空旷得让人踩上去的第一步就会想把脚收回来。青灰色的石板一路铺到殿门前的台阶下，两旁洒扫的僧侣无一不是低着头，扫帚擦过石板的沙沙声细密而整齐，谁也不往三人行走的这条路线上多看一眼。


  一个正在扫着最前面走道的僧人没来得及抬头。等他回过神时已经看见黑袍僧侣的下摆从自己面前擦过。他脚步踉跄着往边上挪了两步，鞋底在地面上拖出一道凌乱的擦痕。


  然后他的身体开始缩小。


  是先从他的手指开始的——握着扫帚的十根手指肉眼可见地干瘪下去，皮肉贴着骨头往内塌，像是被人从里到外一股脑抽走了所有水分和气息。然后他的脸凹了进去，眼窝塌成一汪没有眼球的深坑，脸上还留着刚才想躲开时的那份慌张还没来得及从皮肤上消失。然后整个人倒在地上，轻飘飘的，袍服底下只剩一张人皮，边缘已经松垮地搭在石板上，被风吹得微微颤着。


  德川家光走在黑袍僧侣身后，看都没看地上那张人皮一眼，四周的僧人们也没有出声。扫帚继续擦着石板，沙沙声没有断过一丁点。三人走远之后旁边的僧人才走上近前，小心翼翼地弯腰把那张人皮从地上捧起来收进怀里。他们的脸上带着的表情不是恐惧也不是悲哀，是某种近乎贪婪的、眼角发光的羡慕。


  “他往生极乐了！”


  “为什么不是我！”


  大殿内空荡荡的，几根巨柱撑着穹顶，冷光从高窗灌进来把柱子拉出极长的影子。影子交叠之处摆放着一座石像——身穿朴素僧袍的男人盘腿而坐，眼睛合着，手掌自然搁在膝盖上，面向平平无奇。没有彩塑，没有金箔，连底座都是未经打磨过的粗石。但整个空旷大殿的气流都朝着石像那边微微倾斜，像是连空气都在暗暗向他行礼。


  一旁走过来几名送瓜果的僧人，矮矮小小地在石像前咕噜下全跪了，然后将瓜果叠上供台，倒退着退出大殿。


  德川家光随手捉了一个，那人还没来得及倒退两步便在他手里缩成了一指节长的小人，腿脚还在空中蹬了两下——然后被德川家光丢进嘴里嚼了两下咽下去。他嚼的时候嘴唇闭着但腮帮子动了动，像是在嚼一颗不太甜的硬糖。'

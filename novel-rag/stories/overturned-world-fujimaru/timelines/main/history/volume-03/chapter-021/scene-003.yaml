content: '立香没再维持她一贯的平和态度。她把那份在疗伤间里被毛巾和士郎的呼吸压下去的火气从喉咙底重新拎上来，脸上的表情灿烂得像一把被掰弯的弓——嘴角还弯着但眼睛里的怒意已经飙了出来。


  “感觉怎么样——？”


  “我——你——”


  伊耶那美看着立香那张扭曲到一半还没完全暴发的脸。她把头歪成和刚才相反的方向——然后双眸里混合光泽里闪过的不是恼怒也不是好笑，是某种几乎像是见到了不可思议之物的淡淡困惑。


  “你怎么？”


  “什么怎么？”立香把刚才吞下去的半句话咽掉，声音还在齿缝间打着转。“你算计的死局.......我们——”


  伊耶那美没等她说完。她把交叠在案面上的手指一根一根展开搁在紫檀木上，阴阳眼锁在立香脸上停留了整整三拍呼吸的时间。


  然后她开口，声音里的平稳忽然出现了一道极细的裂缝：“你为什么——是这副模样？”


  “什么？”


  “就算你成功了，你也不应该是这样的。”伊耶那美把“不应该”三个字咬得比前面所有的话都重。


  “你现在还是之前的正常人的样子——你应该已经不是这样了才对。”她顿了顿，左眼和右眼中的混和光斑在说完这句话时轻轻闪了一下：


  “你不应该是——能够融入天地的神了吗？”


  立香眯了眯眼。她的橘色眸子在眼睑缝隙间收窄成一道锐光。“伊耶那美大神，你真正的打算是？”她把声音压到能在殿内轻轻回荡的高度。


  “让迦勒底来一名‘神’？”


  “没错。”伊耶那美把手指重新交叠起来。指腹在案面的紫檀木上轻轻一敲，“不过你们倒是很奇怪的变量。”


  立香闭了闭眼。她在闭上眼睑的黑暗里把那份还没出口的震惊吞了回去然后睁开眼。“伊耶那美大神，如果我没猜错的话——你压根就没打算给我留活路是吧。”


  伊耶那美没否认，她把交叠的手摊开搁在案面上，然后开口时语气依旧平稳得像在念一份写好的折子。


  “没错。我确实没打算给你任何机会就是了。”


  “如果你成功了——那么皆大欢喜。迦勒底迎来一位‘神’。”她把左手的食指竖起来然后在空气中轻轻一点。“而你输了的话——正好，我可以吸纳你的从者。”她把点出去的手指收回来搁在案面上和其他四根并排。


  伊耶那美把自己的意图一块一块摊在桌面上，摊得干干净净。然后她静静地等着立香她们的反应。


  玛修握着盾的手紧了紧。护指在盾边的金属上轻轻刮出一声极细的摩擦声。“黄泉津大神——我是不会背叛我的御主的。”她把盾在地上轻轻一顿，金属底撑碰到石板地面发出一声清脆的碰响。


  “说到底对我并没有什么损失就是了。”伊耶那美看了玛修一眼，然后把视线转回立香脸上。


  “身为黄泉津大神，算计我们——”立香笑了起来。那个笑和她刚才在疗伤间里对着吉尔伽美什的笑完全不一，嘴角弯起来的幅度比标准的外交微笑大了半寸，但那份笑里的温度比黄泉的水还冷。


  “您真是有气度啊——”


  伊耶那美的表情黑了黑。她把交叠在案上的手指换了一面，指腹翻了上来——那份尴尬从她手指翻面的动作里泄露了出来，但她的脸上还是那张看不出喜怒的阴阳神的脸。


  “那么~伊耶那美大神？”立香把双手交叠在胸口，歪过头看伊耶那美。“您对我的表现感觉如何呢？”


  “不用说废话了吧。”伊耶那美把被立香那一句“有气度”钉出来的尴尬从脸上收了回去。


  她看着立香，阴阳眼里那份非人的光泽稍微柔和了半拍：“虽然你通过了试炼，但是并没有达到我想要的效果就是了。”


  “伊耶那美大神。”立香顿了顿。她把交叠在胸口的双手放下来垂在身侧，然后抬起脸直视那双一青一金的阴阳眼。“我要您率先兑现第一项承诺。”


  伊耶那美看向立香。那份从立香脸上压过来的认真让她把交叠的手指从案面上抬起来搁在膝头。


  “我会让村正协助你们。”她顿了顿，然后和立香对视上。那双阴阳眼里的光泽在说下一句话时出现了极细的闪烁。“没有告诉你我的试炼的后果，但是——”


  “客套话就免了。”立香打断了伊耶那美的话头。她把声音压在沉沉的低声里，每一个字都落在地砖上像在磕铆钉。


  “我要您给我们报酬。我要你给我们压阵。”


  吉尔伽美什在立香身后咂了一下舌——那声“啧”在安静的大殿里响得格外清晰。


  伊耶那美把视线从立香脸上移开看了吉尔伽美什一眼。然后她把自己的双手重新搁回案面。


  “我答应你。”


  立香一愣。这句话已经几乎是让伊耶那美对其他所有金地宣战了——让黄泉津大神亲自压阵——她压根没想到伊耶那美会答应得这么快。


  她的嘴巴张了一小口又合上，那份惊讶从她下意识往后微微一倾的肩头上漏了出来。'

content: '“我答应你们作为你们的补偿。”伊耶那美开口。她把搁在案上的手抬起来在半空中轻轻一挥，袖摆上的黄泉神纹在光线里闪了一下。


  “至于解决了月读命金地之后，我会再帮助你们另一件事情。”然后她把手放下来摆了摆，对着站在侧柱旁一直安静守候的天沼吩咐道。“天沼，带村正去拿妙法村正。然后准备拔楔。”


  天沼无声地颔首然后退出了大殿。


  伊耶那美将视线从天沼退出殿门的背影上收回来。然后她转向了立香身后那个一直没怎么开口的金发女人——那个穿着素色窄袖和服，手里不知道什么时候又摸出一个细长瓶子的从者。


  “你是——？”


  吉尔伽美什抿了一口手里的美酒，酒液滑过她嘴唇时瓶口在光里闪了一丁点细碎的金光。她放下瓶子，手背在自己唇边轻轻一抹，然后勾了勾唇角。“Alter Ego，吉尔伽美什。”


  伊耶那美把她那双阴阳眼完完全全锁在吉尔伽美什身上。她从上到下把吉尔伽美什扫了一遍，然后歪了歪头——这个歪头的动作没有立香歪头时的那份少女感，更像是一只鸟在看砧板上某种从未见过的食材。


  “吉尔伽美什？”伊耶那美把搁在案上的手指轻轻敲了两下。紫檀木在她指腹下发出被敲出的沉实轻响。然后她把敲案的手指停在半空中，左眼青右眼金的双色眸子在吉尔伽美什身上的某一点聚焦了——不是在看她的脸。


  “我遍历过英灵殿中吉尔伽美什的灵基档案——虽然女性不在少数，但是他们——”


  她把手指弯回来搁在自己下巴上，阴阳眼眯了起来。“可没有空想具象化。”


  吉尔伽美什笑了起来。她把酒瓶搁在自己膝头，瓶底在膝骨上轻轻地磕出一声极细的脆响。


  那个笑不是平日里对着立香那种傲慢又无奈的摇头笑——是某种更纯粹的，更接近于“被看穿了好玩”的笑。


  她把双手一摊，五根手指在空气里张开。“啊啊——一眼看出来啊。要不然我为什么会是Alter Ego呢？”


  伊耶那美点了点头。那份点头的节奏极慢，像是她在脑子里把某些拼图一块一块放在正确的位置上。


  “高等从者啊——我明白了。”她把手收回来重新交叠搁在案面上，袖摆压平在紫檀木上时上面绣着的黄泉神纹暗了一瞬然后重新亮起，“迦勒底的战力代表就是你吧。”


  吉尔伽美什把摊开的双手收回来搁在膝头。她歪过头看向伊耶那美，赤色蛇眸里那份酒后的慵懒还没散尽，但她开口时语气降了半度，从轻飘飘的嬉笑变成了某种更沉更稳的东西。


  “我们皆有互相隐瞒的事情——对吧。”


  伊耶那美没接这句话。她把交叠在案面上的手指换了一面，然后把视线从吉尔伽美什脸上移开转向立香。


  “那么同盟就这样？”她看着立香的眼睛。那双阴阳眼里没有试探，没有算计，至少在此时此刻没有。“你是他们主心骨，对吧。”


  吉尔伽美什把视线转向立香。玛修也从刚才握住盾的警戒状态稍微松了松肩膀，然后侧过脸看向她的御主。两双眼睛——一双赤红一双浅紫的眸子同时落在立香脸上。


  立香深吸了一口气，她把那份刚才逼着伊耶那美要报酬的锋锐一点一点收回去，收回到她惯常的那层指挥官外壳底下。


  然后她挺直了后背，抬起头，橘色眸子里映着大殿里两位从者和一位黄泉神。


  “啊啊，那么——”她的嘴角弯起来。不是刚才那个冷得能结冰的笑，也不是她用来说“您真有气度”的刺人微笑。


  是她每次确定了一个最好的结果之后才会露出的那种自然而然的、连自己都没意识到的笃定弧度。


  “同盟建立。伊耶那美小姐——希望您会信守承诺。”


  伊耶那美从案后站起来。她站直了身子之后从案面上走了下来——赤足踏过石板地时袍服的下摆在身后拖出一道黑金色的曳地长痕。


  她走到立香面前，停在她大约一臂远的地方。站起来的伊耶那美比立香高了半个头，但她在俯视立香时阴阳眼里没有半分居高临下的审视。只是淡淡的，像是念一段她早已写好的判决词。


  “我虽然隐瞒了事实——但并没有不信守承诺。藤丸立香。”她顿了顿，那双一青一金的眸子在叫出立香的全名时极轻地闪了一下，“我会为你们压阵。”


  立香没有说话。她把那份同盟承诺在掌心里掂了掂，掂到那份重量沉甸甸地落在她胸口之后才轻轻呼出一口气。


  吉尔伽美什把手里的酒瓶搁在膝头轻轻转了半圈。她把那份从伊耶那美嘴里说出来的“压阵”两个字翻来覆去地在舌头底下品了品，然后从鼻道里发出一声极轻的笑——那声笑里既有对伊耶那美坦然态度的某种认可，也有她作为过来人对所有承诺的本能审视。


  但她没有开口，她只是把酒瓶举起来又抿了一口，瓶口离开嘴唇时发出极短的啵一声脆响。'

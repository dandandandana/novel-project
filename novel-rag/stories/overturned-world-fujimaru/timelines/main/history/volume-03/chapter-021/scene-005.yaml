content: '立香对伊耶那美点了点头。她没有再多说任何话——那些客套的“感谢您的信任”、“我们不会让您失望”之类的漂亮话全都被她压在舌底。


  她只是转过身然后朝着殿门走去，脚步不快也不慢，每一步都踏得稳稳的。吉尔伽美什跟在她身后，玛修抱着盾跟在吉尔伽美什身后，三个人的脚步声在石板地面上各自有着各自的间隔，但合在一起时竟意外地整齐。


  “藤丸立香。”


  伊耶那美的声音从身后叫住了她，立香停下脚步没有回头。


  “你要记住，”伊耶那美把袖摆拢了拢，黑金色的袍服在她动作时发出极细的织物摩擦声，“我站在你们这边——不等于我会替你们挡下所有事情。”


  立香回过头。她看着伊耶那美那张站在大殿深处被半明半暗光线切成两半的脸，嘴角微微翘了一下。


  “我知道。”她把头转回来推开了殿门，门外走廊上那片被廊柱切成一格一格明暗交错的光影重新接住了她的影子。'

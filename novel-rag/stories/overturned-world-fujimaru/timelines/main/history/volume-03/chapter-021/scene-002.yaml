content: '“啊，接下来我要去和这里的世尊对峙了。”她朝着门口走去，脚步刚迈出两步然后顿了顿。她没有回头，声音从肩膀后面飘过来。“我猜你更想在这里守着士郎吧。”


  “不。”吉尔伽美什站起身，素色和服的袖摆从膝头滑下来垂在她身侧轻轻晃了晃。


  “我跟你去。他现在不容易死——如果你去对峙伊耶那美可能会出事。”


  立香回过头。她看着吉尔伽美什把袖口从指腹里一点一点松开，然后点了点头。


  “好吧。”


  两人走到门前，立香伸手推开那扇木门。


  门开的时候，那名分不清男女的侍从正站在门口。


  天沼穿着一身比起殿内其他侍从更为素净的衣装，站姿纹丝不动，像是从她们刚才进去之前就一直没有换过姿势。


  在走廊另一端，立香看见村正靠在墙上，一把巨大的刀被布条层层包裹着斜背在她背后。


  “二位处理完了？”天沼的声音依旧是那种淡淡的声线——分不出年龄的平稳，像是被刻意磨平了所有棱角。


  “啊。”立香把门在身后合上，然后抬头对上天沼那双静得看不出任何好奇心存在的眼睛，“我猜天照金地的世尊有话要对我说对吧？”


  天沼轻轻颔首。“请跟我来。”然后她转过身，对着走廊另一端补了一句，“小姐和这位盾兵也一起吧。”


  立香扭头和玛修对视了一眼。玛修提着自己的盾站在廊柱旁边，战裙的裙摆在穿堂风里轻轻晃了晃。


  她朝立香点了点头——那份默契不需要任何多余的眼神解释。然后她用空着的那只手轻轻握了握立香的手腕，护指在立香的袖口上轻轻一碰。


  “走吧，前辈。”玛修把声音压得很低，只有立香一个人能听见。“我会站在你身边的。”


  立香握了握玛修的手指然后松开。“我知道。”她低声回了一句。


  几人跟上天沼的步伐。穿廊走道时午后的光影在地板上被廊柱切割成一格一格明暗交错的长条，天沼的赤足踏过木板地时几乎没有发出任何声响，只有跟在后面的几个人的脚步声在走廊里轻轻回荡。


  立香看着天沼的后脑勺，看着那头被梳得一丝不苟的头发在午后的光线里泛着极浅的青灰色。她忽然开口。


  “天沼——伊耶那美大神平时都是怎么处理公务的来着？”


  天沼没有回头，声音从他的背影里飘过来：“主子通常从卯时开始批折子，一直批到午时。天照金地虽然没有太多麻烦，但百姓众多，又没设分府——折子每天都会堆起来。”她顿了顿，然后补了一个极轻的尾音。“不过今天因为等你们，耽误了一点。”


  立香哈了一声。她把双手交叠搁在后脑，步伐放慢了一拍。“这么说我还得谢谢她没让我们等太久？”


  天沼没有回答这句话。她在走廊尽头拐了个弯，然后一扇极高的纸门出现在几人面前。纸门上画着巨大的曼珠沙华纹样，花瓣层层叠叠翻卷着，在午后的光里泛出极淡的朱红色。


  “到了。”天沼伸手推开了主殿的门。


  纸门滑开的一瞬间，立香闻到了墨汁的气味——不是普通的墨汁，是某种带着极淡甜腥的陈年古墨被磨开后散出来的浓稠味道。然后她看见了伊耶那美。


  伊耶那美坐在大殿上首一张紫檀木案后面。案上摊着几十本折子，每一本都翻开了不同的页数。而最让立香愣了一下的是——那些笔。几十根毛笔被操纵着在案上不同的折子之间飞来横去，每一根都在笔洗和砚台和折子之间精确地轮流沾墨、落笔、批红。朱砂的红和墨汁的黑在不同折子上交替涂抹，整个案面像是一台被看不见的手操控的精密织机。


  “来了？”伊耶那美头也没抬。她的阴阳眼还落在案上最上方的那份折子上。


  一根毛笔在折子末尾落下最后一笔朱批，然后自行飞入笔洗中轻轻涤荡，笔尖在水里洇开一小团淡红。


  “啊，没有耽误天照金地的世尊处理公务吧。”立香微笑着开口——是那种标准的外交微笑，嘴角弯到合适的位置然后停住。


  “不耽误。”伊耶那美抬起左手在空中一挥。案上剩余的几十根笔同时飞入笔洗之中整齐排好，所有折子自行翻回合上在案角摞成一叠。


  然后她抬起头，那双阴阳眼透过殿内半明半暗的光线锁在立香脸上。


  “黄泉津大神不打算解释一下吗？”


  伊耶那美歪了歪头。她穿着一身黑底金纹的袍服，袖摆拖在案面上铺开时上面绣着的黄泉神纹在光线里闪了一下。


  “试炼吗？”她把双手交叠搁在案面上，“那个试炼我一开始确实是知道——知道得一清二楚。”


  “源自东方的试炼，对吧。”立香把天沼那句“杜子春”在心里翻了一面然后递了出去。


  “是的。”伊耶那美淡淡地承认。她把头歪回来，阴阳眼眨了眨——双眼不同色的混和让她即使在做着最平淡的表情时也透出一股来自黄泉的非人感。


  “感觉怎么样，迦勒底的御主？”'

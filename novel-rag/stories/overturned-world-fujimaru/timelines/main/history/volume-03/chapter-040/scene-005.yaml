content: '卫宫白把嘴唇朝上抿了抿。不是笑——是她自己都没察觉到的一个细微的嘴角牵动。“什么都能。”


  祁荒最后还是向卫宫白求了协助。她没料到这个本体就是斩击皇帝的女人能强到这种地步——已经不是同一个维度上的强了。


  成道的过程并不顺利，卫宫白早比离开这个世界之前强了太多，多到那个差距已经不需要被量化。


  但直接把祁荒变成菩萨这件事在因果律上办不到——还是要看她自己这副躯壳和意志能不能承住。


  渠道摆在那里，菩萨院祁荒就有了路。她自己在香火和禅堂和卫宫白无数次用第二法和更强的力量配合搭建的条件之间往来，花的时间比她原本计划的要长得多。


  只是最后，她完全没预料到会是这种收场。


  被弥勒丢回来的时候，那个世界的灰色空气还黏在祁荒袈裟的褶皱里。


  她回寺庙第一天就擦了一遍积灰，但没有烧香。她对这个结果没什么愤懑——那个世界确实让她觉得乏味透顶，不过被放逐回来这一逐，她反而又有了想普渡他们的心思。


  把这念头跟卫宫白说了之后，卫宫白只丢来这么一句。


  “你被观世音影响得越来越深了。现在还分得清楚你是祁荒还是正法明如来吗？”


  祁荒把下巴轻轻抬了抬，然后点了点头。


  “这个还是很好分清的。成道虽然是借助了那一位，但我还要我自己的脊梁——不过嘛……确实被影响了。”


  她把后四个字留在香炉上方还没散掉的烟尾里。


  卫宫白把脑袋朝侧边又偏了半寸。这次不是她常用的那个角度，多转了一点，但停住之后她没再拉远。


  “这样吗？我怎么觉得那位菩萨还有别的后手在后面等着。你就不怕你整个人变成她现世行走的皮囊？”


  “那又怎么样呢？”


  祁荒笑了，这次她的笑是把整个嘴角朝上推起来之后把眼睛也跟着眯了一下，她把念珠从膝盖上拿起来搁在手边并几上。


  “她的寻声救苦是真的能够把我填满的啊，太有趣了——我这辈子活到头，所求的不过就是这个字。”


  卫宫白没接这句话。她让自己的视线在祁荒脸上挂了一拍，然后开口。“你这个女人真是没药救了。那个弥勒——很强吗？”


  “是。”


  “比起我怎么样？”


  祁荒白了她一眼。这个白眼中全程没有一丝犹豫，是从眼底朝上翻完之后马上收回来的。


  “这种比较有什么意思？……你倒是给我说说，你究竟用了什么方法把这个直接整颗世界都隔离出去了？”


  “嘛。也不算太难。”卫宫白把手掌翻过来搁在自己膝盖上。“有些世界里的所有事物不见得都是从根源里流出来的——就这么简单。”


  “原来是这样。”祁荒顿了顿，把手肘撑在坐垫旁边并把上半身朝前倾了好些，“对了——在被丢回来之前，我干了一件事。”


  “什么？”


  “回到过去在星之内海最底层安了个超外界跳跃的门。不管谁越过星之内海最深层，马上就会被抛进随机世界线里。”


  卫宫白没说话。她左眼外眼角的光在庙里这一瞬间完全收了。


  祁荒把下巴往胸口收了收，笑从嘴角朝外直直漾了出去。


  “只有我们这世界才有哦。”


  “原来是你干的？”


  “什么？”'

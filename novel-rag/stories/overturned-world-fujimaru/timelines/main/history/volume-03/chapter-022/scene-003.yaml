content: '士郎并不松手。他的指尖有魔力流过——一股极细的热流从纸片表面扫过，确认每一个纹路和折叠里都没有藏着诅咒或爆裂术式之后，他才转身把纸片递给了立香。


  立香接过来展开一看。上面写着一个地址，字迹是硬笔书写的干净利落的连笔字。她的视线扫过街道名和门牌号，然后停在了最下方几个字上——


  赝作饭店。


  【赝作饭店——这什么中二病名字。】


  她没把这个吐槽说出口只默默地在心里翻了个白眼然后把纸条折好放进衣袋里。


  桌边那个金发少女站了起来。


  阿尔托莉雅把搁在膝盖上的手放下来垂在身侧，她走过立香身边时停了一瞬，那张没有太多表情的脸上挤出了一个极礼貌的点头，然后继续朝门口走去。


  立香没有出声。她握紧安魂的手刚才已经放下来了，但阿尔托莉雅从她身边擦过时她还是下意识往士郎那边缩了半步。


  “走了。”阿尔托莉雅走到门口回头对着还在房间里站着的那个人开口。


  她叫出的下一个词让立香愣了一下——


  “士郎。”


  Alterego脸上的那份慵懒忽然整个凝住。他把揣在袖子里的手抽出来在身侧挥了挥，袖摆在动作中抽到自己大腿上发出一声轻响。


  “都说了在这里不要叫我士郎！”他快步追上阿尔托莉雅，脚步比平时急了，两个人走出房门之后进了走廊，声音还是没能被墙完全隔住。


  “我会叫那个家伙Ruler。”阿尔托莉雅的声音远远地飘回来，语气平平的听不出任何起伏。


  “那也不行！”Alterego的声音被走廊的回音拉长了一拍。


  “那叫你什么？”阿尔托莉雅似乎在走廊上放慢了脚步——她的脚步声少了。


  “就叫Alterego就好了——他们都是这样叫的。”


  “士郎。”阿尔托莉雅顿了一顿然后重新开口，声音里的平稳一点都没有变，“我的职介也是Alter Ego。”


  “你切成Rider不就好了?”Alterego的话尾还没落地就被阿尔托莉雅的声音打断了。


  “不......我想到了。”阿尔托莉雅的声音忽然往上浮了一丁点，那不是温度的提高，是某种极少见的、只有在捉弄人时才会出现的极轻的上升调：


  “士郎，我可以叫你——父亲怎么样？”


  走廊里忽然安静了一整拍。


  “你你你你说什么？！”Alterego的声音拔高了半度，尾音被嗓子收紧时产生的压力掐得变了形。


  “你看啊~”阿尔托莉雅的声音依旧平稳得犹如在读一份战报，“我是被你创造出来的~”


  两个人的声音渐渐小了下去。被走廊深处的墙壁一层层削弱直到完全消融在午后的风声里。


  立香站在原地，把刚才一直绷紧的背靠在墙上然后抬手擦了擦额头上渗出来的薄汗。她擦完汗之后马上转向士郎——


  “怎么样了？”


  “Alterego来这里干什么的？”她把后背从墙上弹回来站直了。


  士郎把刚才握黑键的右手收回身侧然后摇了摇头。“他没有杀意。”他的声音比刚才和Alterego对峙时轻了两拍，脸侧的血色还没有完全恢复，但那双琥珀色眸子已经重新聚焦了。


  “我也不知道他来这里干什么——当他来的时候我已经用原理血戒隐匿了。”他把手指在空气中转了转，做了个从藏身处出来的手势，“然后准备去找你。”


  立香从头到脚把他打量了一遍。她的目光从他的脸看到他刚才握剑的手再看到他的腿——“你的身体怎么样了？”


  “差不多了，可以正常战斗。”士郎活动了一下右肩。肩膀在他转动时发出极轻的咯嗒一声关节复位的声音。然后他张开双臂像在摊开一件刚补好的衣服任立香凑过来在她身边转着圈摸了上臂和后背的肌肉愈合情况。


  “确实没啥问题，当时——”他的声音被立香捏在肩上的一只手掐断了半拍。


  “死的时候你感觉如何？”立香松开手然后抱着双臂。她的指腹在自己的上臂上轻轻捏了捏。


  士郎张了张嘴。他的舌头顶在上颚上停了一瞬，然后嘴角不自觉地抽了一下，仿佛是他在找一个被他搁置了的记忆。


  “啊啊——类似于口中涌出来了一个小太阳。浑身都很热吧。”他把声音放得很轻，轻到像是在描述一杯太烫的汤而不是自己死过一次的全过程。


  立香的手还搁在自己上臂上，她的指腹在袖布上无意识地搓了一小圈，然后问出下一个问题时把声音从刚才的关心换成了一种更平更冷静的声线。


  “什么时候的事情？”她顿了顿，觉得这个问题还不够准确——“是下黄泉前，还是——”


  “我们结婚的那一世——”立香把尾音压轻了半拍，她的脸烧了起来。


  她轻轻咳嗽了两声然后把话往下接：“的时候。”


  她说完之后立刻把视线从士郎脸上移开落在墙角那张空了的木床上。


  士郎看出来了。他看着她从脸到耳根重新退了潮之后才重新开口。“嗯——我忘了。”'

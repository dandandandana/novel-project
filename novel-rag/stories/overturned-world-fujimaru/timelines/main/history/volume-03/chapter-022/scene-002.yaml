content: '“前辈。”玛修把盾从地上提起来抱在身前。


  立香走到玛修面前然后把后背靠上廊柱，“玛修.......”她把手交叠搁在胸口，手指在左腕上的通讯手环上轻轻一敲，“等士郎恢复好我们再出发——这段时间先别让他乱动。”


  “嗯。”玛修点了点头。她把护指在盾的边缘上轻轻扣了一下。


  立香忽然从廊柱上弹起来。“对了？祁荒。”她把手指在太阳穴上敲了敲然后扭头看向走廊另一头那扇紧闭的客房纸门。“她一直没消息，玛修你能去找一下她吗？”


  玛修把盾往地上一顿，金属底撑碰到石板发出清脆的碰响。“交给我。”她转过身朝着走廊另一头走去，战裙的裙摆在步伐中被穿堂风轻轻撩起一角。


  立香目送玛修的背影拐过走廊转角之后，把自己靠在廊柱上的身体重新站直。


  她把刚才从伊耶那美那里收到的一肚子话吞下去翻了个面消化掉，然后迈开步子朝士郎那个房间走去。


  去确认一下士郎的状态——然后去天照命金地逛一圈。


  她走到那扇木门前伸手轻轻推开，油脂浸润过的门轴转开了半圈，发出极沉的一声闷响。


  房间里有一个男人背对着她站着。白色的衣袍在午后的光线里把背影勾勒出来——肩宽腰窄，红色的短发在光里泛着一点极轻微的反光。


  【士郎好了？】


  立香的脑子里还没来得及把这句话从神经信号转成语言——那个男人转过头来了。


  他的嘴角向上微微弯着。不是士郎那种带着无奈的笑，是一种更薄更淡的，像是把某人精心铺好的桌布从角上掀了一小块起来的笑。


  立香面上的表情一下子僵住了。


  “Alterego？！”


  她拔出安魂，左手已经同时扣上了右手背的令咒。枪口的银色反光在房间昏暗的光线里一闪，她迅速后撤两步，后背退到门框边沿时肩膀碰上了木框发出一声闷磕。


  “哦？一下子就认出来了？”Alterego歪了歪头。他把视线从立香脸上移开扫了一眼那张已经空了的木床，被褥被掀开了一角，床单上还留着士郎躺了一天多之后压出来的浅痕。然后他把手探向腰间——拔出了一把刀。


  士郎从半空中落下。


  他的身体从天花板垂直接近的角度如同箭矢一样坠下，右手握着黑键直直地朝着Alterego斩去。


  剑刃划开空气时发出一声被撕裂的尖细锐响，银色的残光在他手腕周围滞了一瞬然后消失。


  Alterego不躲不闪地随手挥了挥左手。一把短刀凭空在他掌心凝聚成形——投影时空气在他虎口周围发出一声极短的蜂鸣——然后他轻轻抬腕一挥。


  两把武器在半空中交击。金属碰撞的声音被压得极短极干净，没有火花也没有回响——不是硬碰硬的抗衡，是一个人不费力气地接住了另一个人的斩击。


  士郎借着那股短兵相接的力道直接后退，黑键的剑刃在地板上划出一道细长的浅痕。他落回立香身旁，身体挡在她面前，手上还有刚才交击后残余的一点轻颤。


  “喂喂——”Alterego把手里的短刀搁在肩头上，刀背在他肩上轻轻一靠。那份站姿里没有半分随时要继续出刀的戒备，他朝立香笑了笑。“我可没什么杀意哦。”


  立香没有放下安魂。她的双手仍然握紧枪把，食指搁在扳机护圈外侧。然后她快速地扫视了一圈房间——桌边还坐着一个金发的少女。少女穿着灰色点缀着花瓣的和服。她那双没有什么温度的眼睛正歪过头看着立香，然后抬了抬下巴——一个极轻的、不太正式但还算客气的小幅度点头，立香往士郎身侧缩了缩。


  “你来这里干什么？”士郎开口。他的声音还带着刚从试炼里出来之后没有完全恢复的疲惫尾调。


  “啊啊——”Alterego把刀从肩头上放下来收进腰侧，短刀在他手中化作光点散去。“自然是修复特异点啊。”


  “修复特异点？”立香的眉毛往上抬了半截。她没把枪放下。“你觉得我会信你？”


  “我来到这里没有直接对你动手——”Alterego把手摊开然后翻了翻掌心，十根手指张开搁在自己胸口的位置，“已经算是我的诚意了吧。而且特异点F的时候没有我——你们早就被凯茜帕鲁格给干掉了。”


  “那也并不妨碍你想杀我。”立香的声音凉凉地落下来。


  “哦？确实如此啊——”Alterego歪过头像在思考一道不太难的算数题。然后他把手伸进袖口里摸出一个折叠成方块的纸片，两指一翻手腕一甩——纸片如同飞刀一样旋转着朝立香飞了过去，在空中划出一道笔直的白色轨迹。


  士郎探手在半空中一把截住了它。纸片被他夹在食指和中指之间，边缘还在轻颤。


  “我的店铺开在这里。”Alterego把掏纸片的手重新揣回袖子里，语气从刚才的慵懒变得认真了半拍。“你可以去问伊耶那美我的情况——我可能是在这里你为数不多能结盟的盟友了哦。”'

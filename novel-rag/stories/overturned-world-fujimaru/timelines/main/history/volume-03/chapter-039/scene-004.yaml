content: '“因为你们有我们做不到的事情。”终末人理圆满机关把她的光手重新摊开了，掌心朝上将五根手指分开，“你在战斗中将世尊降格到三维了。”


  立香的白色风衣领子在她说这句话时朝上挤了一点点——她被自己的肩放压了。降格术。那是她在月读命金地的废墟上几乎被榨干半条命才成功完整施展一次的根源魔术，现在从这个女人嘴里吐出来时像是被一笔带过了某种可以被打印成三行数据的结论。


  “我的目的就是这些。”终末人理圆满装置的合成音把这句话送到圆桌上，然后停住了。


  立香皱皱眉头。她把眉心的浅纹压下去又自己弹回来。这个女人用七句话就把圣杯、弥勒、三维降格和取回金地全串成了一整条直线——这条直线太光滑了，滑得没有停顿、没有反问、没有任何可以用手指去抠住再把自己拉回去的勾缝。


  她需要在整条线还没把自己推进死角之前找到一个缝隙，现在。


  “这么说……我需要你的协助。”她让自己的声调在说出这句话时保持在了询问和陈述之间的那条界线上：“既然这里是未来文明，那么肯定有很多能协助我们迦勒底的吧。”


  终末人理圆满装置的女性投影点了点头。


  “经过测算，三维状态下的弥勒杀死他的唯一的方式是……获得伊耶那岐金地的禊祓。”她把头侧了侧，侧的角度把后颈的光线条朝上拉了一点点：


  “也就是那位锻造师的另一种火焰——白炎。”


  村正张了张嘴。她的上下嘴唇刚分开时那半口没被她呼出去的气就在舌头前端堵了一下，她低下头看了一眼自己右掌心里那层因为常年淬火被铬了的老茧。


  “这样吗——我明白了。”


  “前辈……”玛修把这两个字才送出半个音她就停住了，“那么已经确定了。”


  “立香。”


  士郎忽然开口。他的声音不大——没有硬要打断谁的音高，也没有从袖子里翻出任何手势。


  【不对劲……】


  她把从女人嘴里滑进来的所有话往回逆了一遍。从头倒序——斩杀弥勒——你降格过世尊——金地的人带回这里——我有圣杯——然后最开头的那个女声:欢迎，外来者。


  这从“欢迎”到“帮我斩杀弥勒就能拿到你想要的圣杯”之间的每一节都是预留好槽位的。她被放上去之后滑得太顺了，顺到连一丝摩擦都没发出就已经进了结尾。


  立香清了清嗓子。不是喉咙不舒服——她用自己上颚软腭往下推的一口短气把刚才还在舌头底下搁着的交易逻辑全清了：“我有些事情要问你。”


  “说。”


  “星空是怎么回事？”


  终末人理圆满装置看着立香。她的蓝色投影在圆桌上朝她这边转过来半圈。她的好听的合成音这次在开口前先拖了一点点她自己给自己打的延迟——那个延迟短到只需要一个眨眼再睁眼的时间，但在这个万物都极静的空间里已经足够明显。


  她那道悦耳的女声带上了一些不属于合成器的情绪。


  “是未来——是结束，是一切的终结。”


  “这里是未来文明。”终末人理圆满装置压低了声量。刚才那个高半度的音阶已经从她的发声模组里被完全摘掉了，她轻声说着这句话时她胸腔那块蓝色光核的亮度朝内降了半格：“未经之事——必有来者。”


  然后她的声音到了这句话的接缝处，没从缝里滑过去而是整个被绊了一下。她接下来的词句突然劈里啪啦带上了杂音——不是被干扰，是那种被刻在光盘底部的沙沙声从她自己的音频轨道底层翻涌上来。


  “但是……”她把这两个字用自己还没被杂音完全碾碎的真声部分发了出去，“真的——值得吗？”


  杂音在这三个字的空隙里猛地跳了一下，把她尾音里那个“吗”的声母吞了一半。她胸腔的亮核开始肉眼可见地明灭——亮灭的频率不是规律的是乱的，像是录音棚里的最后一盘母带被搅进转轴卡了一下又一下。


  “向往星空之愿——”她最后这句话的所有词都还听得清，但每个词之间被杂音塞进了几层短促到接近刺耳的高频劈啪，她的嘴唇型还在动，但音节已经被杂音扯成了碎片：“真的值得……吗？”'

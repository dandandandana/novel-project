content: '城主府后院的洗剑池藏在三道回廊拐角之后。池水不深，底下铺着青黑色的卵石，水面倒映着午后已经偏斜的天光和被竹影切碎的白云。


  池边的青石台阶上长着极薄的苔衣，踩上去微湿而软。空气里有竹叶被晒过之后散出来的清苦味道，混着池水蒸发上来的腥甜湿气。


  祁荒站着一动不动，她把手臂抱在胸前，歪过头看着洗剑池里的少女。水面在村正腰间轻轻晃着，荡开的波纹撞上池壁又弹回来，把她泡在水里的白色衣袍衬得像是沉在水底的一朵睡莲。


  “拔楔竟然是在这里完成的吗？”


  祁荒的语气如同某种发现了好玩东西之后嘴角翘起来的自言自语。日本神话里的祓禊——伊耶那岐从黄泉归来后在筑紫日向的橘小门阿波岐原进行的净化仪式。


  在洗剑池这处石灯笼立柱、竹篱围栏、青苔爬满阶沿的地方，确实像模像样。


  但问题不在这里。


  为什么千子村正会被祓禊？


  祁荒把手指抵在自己的下巴上然后轻轻敲了两下。这个特异点的建构者在拿原有的神话当积木玩——拔楔不只是一种仪式的名字，或者说，被赋予了完全不同的效果。


  她站起身子，衣摆从青石台阶上拖过去时沾了水痕。她走向洗剑池，想要看看池中少女睁开的眼睛里会浮出什么。


  脚步声从回廊那边响过来，穿着板甲底靴匆匆赶路但还是在转角处收了一下步速的那种。玛修的声音跟在这个声音后面传来。


  “祁荒前辈。”


  祁荒没有回头，只把手从胸前松下来朝玛修摆了摆，她的视线仍旧锁在池水里村正那张被水汽氤氲得有些模糊的脸侧。


  玛修走到祁荒身侧然后把盾搁在地上，金属底撑碰到青石板时发出一声轻碰。她把头探过去看洗剑池——村正闭着眼睛，面上没有任何表情，水珠从她发梢一滴滴落回池面，每一滴都在水面上砸出极小一圈涟漪然后消散。


  “前辈？您在干什么？”


  “在观察。”祁荒把声音压到只够玛修一个人听见的高度。她侧过脸看着玛修，“能看懂这个吗，小姑娘？”


  玛修再次把视线投向池中。村正身上缠着的白色布条在池水里轻轻漂着，布条边缘已经被水浸得半透明，贴在皮肤上看得出她手臂线条的轮廓。


  池水只是普通的清水，没有任何术式的光芒，没有任何符咒漂浮，甚至没有魔力反应——至少在玛修能感知到的范围内没有。


  “前辈指的是？”


  “村正。”


  等这个词在空气中落定之后，祁荒把嘴角翘得更高了一点。


  “没错哦。虽然这个仪式被称作祓禊，但是和神话里的几乎完全不一样呢~”


  玛修的嘴唇张了一下，她还没来得及把那个“嗯”字从喉咙里推出来，洗剑池的水面忽然炸开了。一道水柱从池心垂直冲上半空，水花在空中碎裂成千万片反射着天光的碎镜，在午后偏斜的阳光里炸出一圈短暂的虹彩。


  玛修右臂一横，和服在灵子光芒中碎成流光消失，取而代之的是那身暗银色的板甲裹住了她全身。盾在她手里旋了半圈砰一声扎在青石地面上挡在她和祁荒面前，她弯下膝盖重心下沉已经准备好了接下来的推进动作——


  水柱的冲击力开始减弱。水幕从半空中开始一层一层剥落，像是被一只看不见的手从外往内剥着花瓣。最里面的那一层水幕终于散去时，玛修看清楚了那个人是谁：


  红发贴在脸颊两边，水珠从肩颈滴下来沿着锁骨的线条往下滑。


  玛修收起武装，板甲重新碎成灵子散入空气中，她的和服重新披回身上，袖摆还在刚才收甲时残余的魔力波动里轻轻飘着。她从盾后面站直了身子。


  “村正亲。”


  从水中走出来的村正踩上青石台阶时身上的水珠在触及空气的一瞬间就被蒸成了极淡的白雾散掉。


  然后她身上燃起来了火焰。从她皮肤表面浮出来的一层薄薄的、流动的赤金色火焰。


  火焰顺着她的四肢一圈一圈盘旋缠绕，亮得近乎刺眼的地方是中心，边缘则逐渐淡化成半透明的金色涟漪。


  它们绕到她背后时忽然收紧——化作了一身白色的锻造服。衣领、袖口、腰带上都绣着暗红色的火纹，像是刚从锻炉里夹出来放在砧板上还没敲打的那块铁的颜色。


  千子村正睁开眼，暗红色的光芒从她瞳孔深处浮上来——不是温柔的火苗，是铁水从炉口流出来的那种沉甸甸的红，在琥珀色的虹膜上漫了一圈然后被她一眨眼收了回去。


  瞳孔又变成了正常的琥珀色。


  “啊啊，你们在这里等着我啊~”村正挠了挠脑袋，后脑勺的红发在她挠头时翘起几根发丝。她把被水泡湿的头发从脸颊边拨开然后别到耳后，湿发在耳廓上挂住时往下坠了坠——她咧嘴笑了笑。


  祁荒注意到了她收回眼睛光芒时下眼睑轻微抽动了一下的动作：“对不起，我耽误时间了。”


  玛修把嘴唇抿起来。她不知道该说什么——她只是听立香的吩咐来找祁荒，没想到会恰好撞见村正从拔楔里出来。'

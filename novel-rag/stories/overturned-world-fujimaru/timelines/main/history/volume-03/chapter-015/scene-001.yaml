content: '“什么？”


  她在伊耶那美说完那句话之后停顿了好几个呼吸，不是措辞卡住了，是刚才那句“救世主小姐”的尾音沉进她的耳膜里，然后圣杯无法修复这个信息才从层层叠叠的推断底下慢慢浮到能够被意识触碰的地方。


  “您的意思是——就算回收了圣杯，这个特异点也不会修复吗？”她说这句话时把身子从椅背上往前挪了几分。


  伊耶那美把视线从自己手里的红茶杯上抬起来，看向立香：


  “是，特异点并不会被修复。”她说，她说话时手里的银勺还在茶里轻轻搅动着，银勺撞在杯壁上发出均匀的脆响：


  “因为圣杯只是很小的一个地方——”她把勺子从杯里抽出来在杯沿上轻轻磕了两下，“类似于触发器一样。”


  “现在这里，就算是回收了圣杯，大局并不会改变。这个世界依旧是现在的样子。”她从杯托上把勺尾拿起来指着窗外那个永远钉在正午的太阳，勺子上的茶液往下滴了一滴落在杯托边缘上。


  “这里已经是定局了。”


  立香的眉头往中间挤了半寸，困惑不是现在才来的，从伊耶那美讲完整个故事时她就在困惑，但这个困惑被一层信息又一层的包裹着直到现在才被她用最直接的问法剖开。


  “定局？您为什么这么说——”她把搁在桌沿上的那只手微微抬起来用掌心朝伊耶那美比了一个打开的手势：


  “您明明是黄泉津大神，您明明有改变这个世界的能力，为什么不尝试改变呢？”


  伊耶那美把搅红茶的动作停了下来，她的声音冷了下来：“哦？你的意思是我没有尝试吗？”


  千子村正张了张嘴。她的嘴张开时下颚骨从腮帮子后面浮起来一瞬然后又沉回去，她来不及开口，立香已经在接话了。


  “伊耶那美大神，我并没有冒犯您的意思。”立香说话时把身子往前倾了半度，“我们的目的是回收圣杯——我们的目的应该是没有冲突的。我希望你们能够协助我们。”


  伊耶那美忽然笑了，她的阴阳双眸在这个笑里面同时折射出烛光和冷影，左眼暖光右眼冷光，同一个表情底下同时挂着两种温度：


  “没有冲突——那么问题来了。”她把头往立香的方向歪了歪，合着歪头把那个笑也歪到了脸上另半边，“我为什么要做出改变呢？”


  她把搅红茶的银勺重新拿起来然后接着搅。茶液在杯子里被搅出一个暗色的旋涡，旋涡边缘在杯壁上撞碎成极细的气泡然后一点一点散掉。


  “你既然明白我在这段时间并不是什么都没做——”她说话时杯里旋涡的速度没有变。“那应该就能明白我为什么安于现状了。没有用的，迦勒底的一行人。”她把勺子搁在杯托上，然后抬眼盯着立香。


  “而且~你们的世界毁灭了，本质上和我也没有任何关系对吧？”她脸上那个妖冶的笑容把整个句子的重量压在了谈判桌的正中央。


  立香的牙关咬住了，牙龈传来的钝痛沿着牙齿一路往下碾，她把这口气硬生生摁在胸腔底部，然后把她那对橘色眸子定在伊耶那美脸上。“您这话——我明白了。”她现在把伊耶那美最直白的话嚼碎咽下去之后主动交出自己的筹码。


  “您有什么条件？”


  伊耶那美还没开口。


  “姐姐！”


  千子村正的声音从她那个位子上冲了出去。她整个人从一直低头扒饭的姿态里拔了起来，琥珀色的眸子死死钉在伊耶那美的脸上。


  伊耶那美把最后一口红茶喝完。她把杯子搁回杯托上，杯底撞在瓷面上的声音比她刚才放任何东西都要重两分。


  然后她看向村正的表情忽然就变了——她怒了，是那种被晚辈当着外人面插嘴的长辈脸上会出现的那种含着火苗的严苛。


  “你偷偷从天照命跑出去的时期我还没和你好好说道——”她的声调往上扬了一个台阶。“现在你又在想什么？”


  “我——”村正的声音在她张开嘴的同时明显地顿了一下，“姐姐，我答应迦勒底要协助他们了。”


  “那是你们的事情，协助又不是不能待在天照命。”伊耶那美用勺子柄朝村正指了一下。指向的幅度不大，但指完之后勺子在桌面上磕出一声闷响，“你给我在天照命金地呆着！”


  “为什么？”村正的声音开始发颤了，她咬着牙开口道：“明明现在已经来了援手——迦勒底就在这里，就坐在这张桌子上，我要去杀月读命的法相——”


  她说到“法相”两个字时咬字很重，那个重里面有一个人在三年里反复嚼着同一个名字然后吐出来时的狠劲：“我有机会杀了他了！不是吗伊耶那美姐姐！”


  “德川家光是你能对付的吗？”伊耶那美的声调又冷了下来，但这份冷和刚才对着立香时那份冷不一样。仔细听能听出来她的声线在“你能对付的吗”这几个字尾音的底下压着一层极薄的东西。她说这话时看着村正，赤色左眼里的火焰跳了两跳：“我说了——”'

content: '“所以现在迦勒底来了！”村正把话抢了过来。她抢话时嗓子在最后几个音节上已经不像她自己的声音了。那份急促里不只有愤怒，还有委屈——明明机会就在面前，为什么伊耶那美还是要把她锁在天照命，“我有机会杀了他了。不是吗伊耶那美姐姐。”


  立香没有开口。她把视线从伊耶那美的脸上挪到村正的脸上，然后停在村正抱着刀的手臂上。这个刀匠敢对着创生母神吼，不是不知道伊耶那美的脾气，是太知道了，所以才吼得出来。因为她知道伊耶那美嘴上说“你给我呆着”不是厌烦她，是怕她也死在那边。但村正听不进去这份怕，她能听到的只有“不让我去”这几个字。立香在脑海里把这层推理跑完了一遍然后把目光收回来继续看着两个人对峙——她现在还不是插嘴的时候。


  二人俩之间的空气被她们各自的喘气声和烛火的晃荡切开。玛修在立香旁边把呼吸压得很低，手指在自己膝盖上轻轻敲着。然后言峰士郎开口了。


  他的声音平铺开在整个正厅的对峙上，并且把所有尖锐的东西都兜住了：“黄泉津大神——”


  他把视线放在伊耶那美脸上，那双琥珀色的眼睛没有逼视，只是在看她：“我能问村正小姐一个问题吗？”


  伊耶那美把目光从村正脸上收回来落在士郎身上。


  她看士郎的眼神和看立香不同，不是审视，也不是谈判，是在想这个人果然会在这一刻开口。


  然后她把头微微点了一下：“问。”


  “村正小姐为什么要杀了德川家光呢？”士郎问出这个问题时语气还是他问伊耶那美能不能开口时的那个音量。


  村正看向士郎，她的表情在脸上扭曲了一瞬。这一瞬不是被冒犯，是她要把自己这辈子最深的一刀伤口，展给才认识一天的迦勒底人看。


  她看向伊耶那美，伊耶那美歪了歪头。左眼暖光右眼冷光各偏了一个角度。表情里没有命令，没有阻拦。只有几个字——你自己决定。


  村正深吸了一口气：“我要杀了德川家光，给我的父亲报仇。”她的琥珀色眼睛在看士郎，但她的瞳孔飘在记忆里。“我的父亲，死于伊邪那岐金地的法相围攻。其中德川家光亲手杀了他——”


  她把抱在怀里的太刀往上托了一下：“而且——吞食了他的命数。”


  立香愣了一下。她把村正的这几句话和她之前在迦勒底资料库里读到过的供命循环机制接在一起。


  她看向村正：“她的父亲是？”


  “是我的前任从者——”伊耶那美替村正接了这句话。她接话时语气重新变回了冷静，：“唯一一个响应我的召唤的从者。Saber，千子村正。”


  “那么这位村正——”立香的目光落在抱着刀的少女身上。


  “我是我父亲前往西海拜见观音时，身上遗留的物品泡在牝水里诞生的药生子。”村正开口了，“我的父亲，Saber千子村正，我要为他报仇。”


  玛修在旁边愣了一拍。她想起了士郎以前给她提过的事——千子家会继承村正的名号，不是一个人，是代代相传。她把手按在胸口上把那口气顺下去然后点了点头。“啊啊，那么一切就都串起来了。我明白了——”


  “啊。”村正把玛修的点头接下来点了点头还回去，“我既然继承了千子村正的名号，就要为他报仇，就要继承他的意志。”


  伊耶那美没有看村正。她慢慢地扭过头看向站在暗处的天沼。天沼接收到那个目光时斗篷下摆在地上轻轻蹭了一下，然后他开口了。


  “小姐。”他说这两个字时声音还是那种似男非男似女非女的平稳质地：“Saber阁下最后的愿望，是你能够快快乐乐的活着。这才把你交给我们——”


  村正把刀在胸前攥得更紧。她看着天沼时眼眶里有烛光映出来的两小团湿意在颤抖，但她没有让那两团湿意汇成的任何东西从眼角里滚出去。


  “我啊，我当然知道。你们对他有愧，所以才由着我来。”她把“由着我来”这几个字咬得很重。然后她把目光从天沼脸上直接射向了伊耶那美，“你们不但没有阻止，也没有告知我我父亲要去做什么——”她喘了一下：“就由着他去死了！”


  天沼的斗篷在她这句话落地的瞬间起伏了一次。他在里面做了个深呼吸，然后他用那份平稳到几乎没有起伏的声音说道：“你的父亲做得很好。他一直做得很好。”


  这句话落下来时整个正厅都安静了。


  “我当然知道。”村正道。


  她的声音已经从发颤的缝里回来了但嗓子还是破的：“身为他的女儿，我能不知道他做的怎么样吗？”


  她把太刀从胸前放下来横在自己膝盖上，深吸了一口气。“如果不是这里是特异点——我的父亲压根不会被召唤到这里。他所想做的是修复这里。”她把目光重新锁在伊耶那美脸上。“所以我才会带着迦勒底的人来见你，伊耶那美姐姐。”


  然后她把最后那句话砸在了二人之间那片已经灼烫到几乎要凝固的空气里。“你太让我失望了。”'

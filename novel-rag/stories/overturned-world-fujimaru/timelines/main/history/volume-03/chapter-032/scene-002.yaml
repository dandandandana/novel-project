content: '他在城堡的塔角放了六把黑键，三十步外的摩诃躲了过去——那六把黑键却没有直接追上去，而是钉进石砖里，延迟了半息之后整整齐齐从城砖上剥离出来，再次从目标的背侧偏左一寸的位置扎进他腰侧。


  摩诃吐着血转过身去，士郎已经从他身边荡过了。然后是爆炸。有摩诃躲过黑键和剑雨，往后滚翻进了城垛的死角，刚撑起身，士郎投进去的不是剑，是一柄投影出来的干将模样的短刀。


  短刀脱手后他没有再看一眼。那把短剑在半空中歪了半圈，然后整把剑崩碎成碎片，碎片是是崩坏的魔力块，每一片都在对方体内朝外冲，把人从内部的灵基结构炸到金漆甲片齐飞。


  立香在过程中由一开始的紧张，变到了紧张里还有空闲时间思考其他的。她把安魂从士郎怀里架出去，枪口对准一名在地上还没死透的摩诃，扣下扳机。


  心象弹穿进地面的石缝闷响了一声。她低眼看了看弹孔的位置，从里面冒出来的不是血，是正在蒸散的金光。她又补了一枪。然后才开口。


  “士郎，我能问问题吗。”


  “可以，不会影响我的。”士郎右手的动作没有停。他回剑的轨迹上有三位摩诃从不同的方向扑上来，他先劈中第一个人的胸口，剑势未收顺势扫过第二个人的膝盖，第三个人被他一脚踹下城墙，还没落地就被一把从空中追下去的黑键扎穿。


  “嘛，士郎，在进行我的指令的时候，你是怎么想的。”


  “我第一项会优先确保你的安全，立香。”言峰士郎低声说道。他把剑从摩诃身上抽出来，手腕甩了一下，剑上的金色残留被甩成一道细线溅在城砖上。


  “哦——是因为我就在这里是你第一反应能做的吗？”立香在他怀里歪过头，将安魂对准一旁准备爬起来的摩诃补了一枪。


  “嗯？为什么这么问。”士郎随手丢出三柄黑键，三柄黑键锁住三名摩诃的站位，让他们彼此挤在一起——然后他甩过去一剑，剑气顺着黑键形成的光轨滑过去，金光溅处三人齐齐倒地。


  “那我换个问法。”立香把安魂切成了双刃，在士郎怀里转了个角度，替他砍飞了一旁试图偷袭的摩诃。


  “如果我身陷囹圄，但是你目前有需要做的事情。你会怎么做。”


  士郎瞥了她一眼，他手里的剑还架在一名摩诃的肩上，没有压下去，却先开口回了她的话：


  “嘛，如果你给我指令的话，我会先做你给我的指令。我相信你的判断，立香。”


  他话音落下，剑朝前一推。摩诃的脑袋从脖子上滑落。


  “如果没有指令，我会去救你。”他把剑收回来，耳边飞过去一枚从城垛上反跳的碎金片，“或者是我判断出来了你失策了，我也会去。”


  “哦？”立香的橘色眸子隔着兜帽的帽檐看向他，“哪怕是救我会导致当前的任务失败吗——如果是这样的话，我不允许。”


  士郎把剑从一名新的摩诃体内抽出来时甩了甩剑上的残血，说话的语气还是之前的平淡：


  “驳回。你的性命在我这里大于一切。”


  立香一愣，她完全没想到士郎会这么直接连她的否决权都给否认掉。她手里的安魂双刃顿了一下，刃尖从摩诃的甲片上滑出半道金痕：


  “士郎？”


  士郎轻声开口，手里的剑把朝旁边一磕碰开一把劈过来的禅杖：


  “你需要多爱惜自己，立香。”


  “你在这方面越来越极端了——你是御主，本不该上战场的。”


  立香白了他一眼：“等我们有条件不让我上战场就能够保证我的安全和你们不牺牲的时候再说吧。”


  她又把安魂朝旁边一挥，剑刃从快要爬起来的摩诃后颈划过去，对方倒地的时候她还补了一句，“况且你哪里来的资格说我不爱惜自己？”


  她砍飞一旁的摩诃时，士郎一句话也没再接。不是被怼得无话可说，是被她戳到了某些连自己都还没跟她说起过的东西——她已经看出来了。


  他把右手的剑换了个握法，从正手换反手，剑锋倒持朝下一压，压碎了一名攀上城垛的摩诃的手腕。


  二人的对话终止了。士郎看向一旁的空中，立香也顺着他的视线看了过去。远处的夜空被黑炎火云和金色的雷暴同时照亮，在那片光与焰交织的暗幕中，一匹漆黑的梦魇之马踩在天空的缝隙里，蹄下每踏一步都踩出一朵极淡的暗色火花。


  马背上坐着一名金发少女，肩甲的位置正不断蒸出乳白色的魔力残气。她一只手把缰绳在手腕上缠了半圈，另一只手从腰间拔出黑剑时，剑身将周围的雷电反光都吞进了自己的暗刃里。


  “是AlterEgo职介的骑士王。”士郎低声开口，视线从她的肩甲上扫过去，“不过她现在的六维似乎降低了。”


  “来支援的。”立香把安魂的双刃重新合成枪形态，枪口朝下，开始清点面前躺了一地的摩诃尸体。那些和尚的身体在城砖上正在化作大片大片的金色光点。'

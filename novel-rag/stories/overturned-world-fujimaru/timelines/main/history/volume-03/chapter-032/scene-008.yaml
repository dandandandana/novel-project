content: '月读命金地的城主府一下子升起来了无数根柱子，他的身子在其中闪烁着，在柱子上不断地闪烁。


  士郎站在最中间的那根柱子上。他右手的黑键刚劈开一道从左侧轰来的光炮，脚下的柱面在光炮的尾波里晃动得厉害。


  月读命的术式不断从各根柱子之间跳弹而出，银色的弧光在空中留下曲曲折折的轨迹之后，再被柱子与柱子之间看不见的折射角度又一次弹向士郎的站位。


  士郎一剑剑劈下去，右手在挥剑，眼珠跟着术式的余光来回转，但月读命每次在他视线锁定时已经跳到了下一个位置。


  他的术式轨迹不是直线，是在跳跃——从一个点消失的同时从另一个点冒出来，中间没有经过任何移动过的空间。


  “士郎！”


  她的声音从殿门附近一片还没完全倒塌的断墙后面飘过来。


  声线压得很低，但压不住底下那一截正在往上翘的不满。


  “立香？我不是要你隐匿——”


  “你把你保命的礼装都给我了！”立香从断墙后几步跑了出来，橘发的侧辫在她肩上甩开半圈。


  她一只手指着士郎的方向，另外一只手已经摁在耳边的通讯器上，“还在担心我是吧，现在先给我汇报信息！”


  士郎瞥了她一眼。他右手的黑键没有停——手腕朝外甩出去时，剑刃擦着两道同时从左右弹来的术式之间的夹缝划过，术式的银光在黑键的刃面上映射出两块明亮的光斑。


  “在闪烁，但是我看不出来是怎么做到的。”他把黑键从手中脱出，朝月读命最新显出的柱子丢去，剑刃钉进柱面的石纹里炸开一圈碎光。


  “能开结界把他关进去吗？”


  “不太可能。”士郎摇了摇头，声音在又一次爆炸的余波里显得很平稳，“他掌握着这个世界的规则，完全拒绝固有结界覆盖现实。”


  立香听到这句后嘴唇抿了一下。她的眼睛仍然盯着柱子上不断跳动的月读命，下巴微抬，她在快速地默念数字。


  几秒后她朝士郎的方向又跑了几步，脚下的石板在她跑动的过程中再次滑落了几块碎屑。


  “我在你脚下，把我带上去。”


  士郎侧过脸，看到了地面上那个正抬着头看他的橘发少女。他单手撑着柱面翻身而下，风衣的下摆在坠落的途中被风拉成了一道快速的白色弧线，然后他落地的瞬间把腿弯压了半寸，卸掉了碰撞的大部分力道。


  “有什么办法吗？”他开口时，黑键的残影还在他背后的半空中裂开几道平行的银痕。


  “别急——只能赌一把了。”立香想了想，她的眼珠左右晃了几下，在找月读命下一个跳过去的位置，“这绝对不是没有规律的。”


  “那你认为是什么？”


  “这个世界有古怪。不是简单的凯撒密码式的移位——他把这里排列成了矩形，那我就猜是矩阵。矩阵的加密就意味着一整个坐标系——”她扭头盯了一眼柱子上还在跳跃的月读命，声音短促，“带我上去。”


  士郎搂住她的腰。她的手在他肩胛骨的位置抓紧，他踩地起跳——脚跟离地时，石板上被踩出两道细细的裂纹。


  两人飞到空中后，黑色的火焰在士郎脚下猛地铺开，黑炎凝固成的踏面承住了两个人的重量。


  立香正在调整身子时，侧方又亮起一团新的黑炎，村正从火中走了出来，红发在额前被黑炎的热风吹得朝后倒飘。


  她看见士郎搂着立香站在空中，目光在二人之间和士郎搂腰的那只手上停了一瞬，然后转回去，脸上的表情带着一丝古怪。


  “把整个柱子看作一个矩阵，给我报她的坐标。”立香盯着柱子，右手从腰间抽出安魂，把枪口朝下压在黑炎边缘，左手在她的全息屏幕上拉开一个空白的字符表。


  士郎没有回答——月读命又出现在了一根新的柱子上。


  士郎把黑键朝那个方向一指。


  “4，4。”


  月读命跳走了。下一秒他从另外一根柱子上现身，术式的银光在他现身的瞬间从柱子底端同时朝上翻涌。


  “4，5。”


  “5，4。”


  士郎的报价没有停，每一次报数字时村正的黑炎就朝她指的方向喷过去。月读命的术式在黑炎上炸开，黑色的碎焰和银色的光屑在空中互相撞成一片。


  村正咬紧了牙，黑炎明显消散了一部分。


  立香用表写着。全息屏幕被她右手食指从左向右抹出一道道淡绿色的数字，她的嘴唇一直在动——不是说话，是在把每一个新数字对应到旧数字上，默念着替换的规则。几轮坐标下来她停了手，脖颈朝后仰了仰，然后重新看了一遍自己的表。


  “我明白了——类似于字母替换表的加密。不是直接用坐标，是每一个坐标在矩阵里对应的是一个字母的位置。”


  “有头绪吗？”士郎俯下身去看她的屏幕。


  “有，但是并不多，不论是明文还是密文我都不知道。”立香低声说着，脑袋转向村正的方向，“有什么是他要加密的吗？”


  村正想了想。她一边挥刀架开一道月读命的术式，一边侧过头，眉心在同一秒内皱了一下又松开了。'

content: '剑身的长度横跨大半个前庭，剑脊上倒映着空中村正黑炎火云与须佐之男雷暴互相撕咬的画面，朝月读命当头斩去。


  月读命抬起下巴。她口中没有发出任何声音，但白色的月光从她的周身朝天空炸开，化作一道粗壮的白色光炮，迎着巨剑的剑锋对轰上去。


  光炮与巨剑相撞的平面朝两侧各推开一道圆弧状的冲击波，冲击波扫过的地方，主殿殿顶上残留的瓦片被整整齐齐从顶梁上掀飞，在空中翻了几个跟头之后在数十里外才开始下落。


  “我向那位铁匠求了几柄剑，因此看中了他的命数。只有我手中的这柄剑是我自己的——”


  月读命仍旧在说。她的黑袍在光炮的反冲风中猎猎作响，她说着将左手那柄刻满篆文的太刀平举过胸，刀身上的篆文在月光与巨剑交锋的映照下显出了另一种排列方式——那些字开始动了，从刀脊向刀刃方向缓慢地逐列移动，每移动一排就在空气中留下一道淡金色的残影。


  村正的视线盯着那柄剑。不对——不是这柄。是另一柄。从刚才月读命身后的第三柄短太刀升空时她就注意到了，那柄刀上有她看不懂的字符。她的嘴巴微微张开，声音从喉咙里滚出来时比呼吸还轻。


  “是你……”


  村正喃喃道，看向那柄刻着字符的太刀。刀身上镌刻的字符排列得十分整齐划一，每一横每一竖都端正到近乎机械，间距完全一致，明显是出自同一个人的手笔。但那不是日语。


  也不是古日语。那些字符的笔画更简洁——不追求锋利，只追求清晰，每一个字都像在告诉看得懂它们的人：此刀是用来砍的，不是用来供在刀架上看的。


  月读命把太刀收回身侧，刀身上篆文的光芒暗了一瞬又重新亮起。她望向村正，望向上郎，望了一眼天空上正在与黑炎火云互相撕咬的雷暴，然后又望回眼前的两个敌人。她开口时语气和刚才自述身世时一模一样，连语速都没变。


  “这个世界……现在这个世界，死了比活着更幸福。我没办法。”


  村正听到这句话之后眼神冷了下来，她手中的打刀从侧面翻了个刃花，她把刀尖重新对准月读命，语气平静：


  “哼，只是推卸责任罢了，你不也是黑手套吗？”


  月读命不答她。她只是把左手的篆文太刀重新举到与肩平齐的位置，刀刃上的篆文移动速度忽然加快了。


  然后她的衣袍无风自动，身后升空的第三柄太刀开始发出嗡嗡的共鸣声。


  村正不再等她出招，打刀朝前挥出一刀，黑炎从刀尖上脱出，在空中划过一道弧线之后被月读命用双刀架住。刀刃的冲击从架住的点朝月读命的双臂传导，她的袖口被震得向上翻开，但她脸上的笑容还在。


  村正一击不中立即朝后退了一步，侧过头朝士郎喊了一声。


  “他在用太刀作为施法的工具，言峰士郎！”


  千子村正开口的同时已经调动起她的黑炎。黑炎从她周身的每一寸皮肤上朝外涌，然后开始盘旋着朝空中升去。


  黑炎在空中汇聚成一头巨兽的轮廓——从龙角到龙鳞再到底下翻涌的爪牙，每一处细节都是火焰凝固之后才能呈现的固态质感。


  黑红色的巨龙甩动尾巴，尾尖在空中扫出一声沉闷的破空响，然后朝月读命直直撞去。


  月读命摇了摇头。她的动作不像是躲，在巨龙冲破她身前的月光屏障之前用极小的幅度偏了一下肩膀。


  然后月光从她身后的虚空中涌入了她的身体。不是光束，是液态的光——月光的质地在涌入她身体的过程中从冷白转成了温白，她整个人的轮廓被光包裹，站在光柱中央像一枚正在吸光的白瓷人偶。


  黑红色巨龙撞到那层光膜上时，整头龙从龙首开始朝内坍塌，火焰被月光从内部压碎，炸裂的黑炎碎片朝外迸散的过程中在空中留下几十道烟灰色的残痕才消散。


  士郎抓住这个时机。他在月读命的身体被月光吞入的瞬间浮在空中的整个剑阵同时亮了起来。那些先前被月光绞碎之后在空中散落的剑刃碎片——它们根本没有消失，现在全都从半空中重新亮起。


  每一片碎刃都是一个独立的发光点，然后所有的光点同时朝月读命的方位轰出光炮。光炮在行进的路径上彼此聚合、重叠，最终汇聚成一道粗壮的光柱，将月读命和她周身那层正涌入体内的月光一同吞了进去。


  月读命抬头。她的眼睛此时已经只剩下了眼白——瞳仁和虹膜被月光彻底淹掉了，眼眶里往外溢的不是人的眼神，是月光本身。


  她的口中吐出一束同样烈度的光炮，银白色的光束从她的喉咙深处喷出，迎上士郎的光柱，两道光在主殿上空撞出一个不断膨胀的白色光球。


  光球外表面翻滚着不稳定的能量涟漪，然后她剩余的六柄太刀从她身后、身侧和头顶同时飘起。每一柄太刀在升空时都开始发出不同颜色的华光——金色的、青绿色的、酱紫色的、铁灰的、炽白的、暗红的，六道华光从刀身上朝外延展，化作了六类各不相同的术式。'

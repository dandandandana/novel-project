content: '月读命没有挣扎，他看着村正的脸，看着她的头发，看着她手中的剑。然后笑了一下，这个笑容和他在成为世尊之前还是个法相时的笑容一模一样。


  “你的父亲——Saber，千子村正是除了伊耶娜美之外最接近真相之人。”


  村正握刀的手没有动。


  月读命的呼吸越来越浅，长剑在他体内的灵基结构上继续吞噬着月光，他每一次呼气都从肋骨间溢出微量的银雾。


  “他的死亡也是因为这个，他无力拯救这个世界，给人们一个未来，为一大部分人牺牲一小部分人是唯一的办法，所以他为了天照命的人去死了。”


  月读命说完这句话之后眼睛不再看村正的脸了，他往下看——看到了村正手中的那柄太刀。


  一柄断剑。刀刃是从某次断裂之后重新淬过火的，断口的焊纹还亮着残余的高温余光。


  “我不知道是对是错，但我绝对不会这么做。”村正喃喃道。她把断剑横在身前，剑脊上那道深深的裂缝里忽然涌出了青色的火焰。


  青炎从裂缝的最深处往外淌，先是在断口的边缘淌成了一条特别细的青纹，然后青纹开始朝两侧延展——火焰以肉眼可见的速度把裂缝的每一层断裂的晶格重新对准，金属的记忆在青炎中重新激活。


  火熄灭之后剑刃上残余的是一条淡得几乎看不见的痕，不是裂缝，只是剑身上一道浅浅的色差。


  “我的父亲有着无元剑制，这是他最后的剑。”


  月读命的目光在修复后的剑身上扫了一下。他肩膀上的长剑正在从内部挤压他的胸腔，他说话的声音已经能听到肋骨被压到之后没能完全扩开的沉闷。


  “话已至此——那柄剑是天丛云吗？”


  “我不知道。但我觉得是。因为我的父亲一辈子都想做到的，我也觉得他最后醉倒了。”村正把修复好的太刀举到肩平，刀刃上残留的青炎舔过她下巴的边缘。


  她挥出了一剑。


  “天羽羽斩。”


  剑挥下去的是修复。


  剑尖斩过月读命的世尊之躯时，没有血肉撕裂的声音。月读命的身子在剑锋过处先从中间朝两侧裂开，然后在裂开的瞬间被从体内涌出的青色火焰从正面到背面同时炼化。


  废墟被青炎一碰就自己开始动了，断裂的石柱自己接上了；塌陷的殿顶自己翻回去然后重新咬紧了梁榫；地上散落的碎石自己朝原来的位置滚动，滚到了归属的缝隙里，然后被新生的青藤从缝隙里拱出芽来。


  月读命消失了，立香看着村正挥出的这一剑，嘴巴张着，然后她整个人像被弹飞的弹珠一样冲了出去。


  她冲到士郎身前时整个人的重心已经往前倾，双脚蹬地的最后一刻她干脆不刹车了——她直接扑进了他的怀里，双臂环过他的后腰，把自己的脸蹭进他的胸口。


  “啊啊啊——我做到了！士郎！”


  立香笑着，她的橘发在士郎的风衣上蹭得乱糟糟，脸颊被笑扯得发酸。她的声音在士郎的胸口嗡嗡地回响。


  “虽然是蒙的！但是我就知道是这样——密文也可能不是对的——我蒙的句子也可能不是对的——但是最后确实是对了！运气站在了我们这边啊士郎！”


  立香笑着在士郎的怀里继续蹭，士郎被冲得往后退了半步，然后稳住了。他没有躲，也没有推她，而是把手抬起来放在她的头发上轻轻地揉了几下。


  “确实。如果不是你，我们确实没办法解。”


  “哼哼~”立香把脸从他胸口上抬起来，眼眶里因为笑得太厉害微微湿了一圈，这副带着泪光的完全笑脸配在一起显得毫无攻击性，只有得逞和得意，“那你现在不得夸夸你见多识广的御主吗？”


  “藤丸立香是世界上最好的御主，是我见过的最好的人。”


  士郎盯着立香，他的眼神十分认真，像是再说一件不容置疑的事情一样。


  立香被他看的有些不好意思，一想到自己身为御主，又硬气了起来：


  她的嘴巴撇了撇：“就这些？”


  士郎顿了片刻，他的喉结动了一下，脑内认真地多翻了几条。“指挥也很到位，很关键，很勇敢。”


  立香撇在嘴边的嘴角往下又压了一些，她伸出手，隔着风衣对着他的腰掐了一下。


  掐的时候还不忘了把嘴凑到他面前——这个距离她的呼吸能直接碰到他的下巴。


  “这都什么夸法？废话和好话缠在一起全给你说了！”


  她忽然想到了一些东西。她的嘴角重新往上勾起，她的眼睛眯了起来。她的手从士郎的腰侧往后移，划过了他风衣的侧缝，然后三根指头朝他的腰后心压下去。


  “听说，腰后心很痒对不对？让我挠挠我就不让你夸我了~”


  士郎完全没想到她会往那个位置摸，他的身体比脑子先有反应——他张开双手，往后退了半步，结果他退过去半个身位的同时立香整个人也跟着压了上去，手指从后背绕着侧腹一路挠下去。


  士郎为了稳住她，只得一只手扶住她的腰，藤丸立香趁势挠了挠士郎的腰后心。


  “你们两个怎么抱在一起了？”'

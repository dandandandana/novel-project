content: '“嘛——一个人的。后来自己也有了些本事，才来到这里。”祁荒扭过头来看着她。眼神从村正的红发尖一直扫到她的颧骨上：“我们那地方没这边这么绝望。有个家伙真的很有本事——哦对了，那家伙和你长得一样。”


  村正的眉头狠狠皱了一下：“怎么可能。我的脸——”


  “是你父亲的脸的模板吧。”祁荒把目光收回去，声音比刚才轻了一点。“观音水给你性命，给你身体，所以你是女性。对么？”


  村正低下头。眼睛里有东西在晃动，但被红发遮去了一半：“我从有记忆开始就是父亲带大的。他教了我所有事情——手拉着手教锻造，手拉着手教武艺。他的剑法真的很烂，烂到没过几年我就超过他了。”她的声音到这里已经不是在自己压，是自然的浊重从肺里灌进嗓子眼。“他是天照命金地唯一的法相，真实身份是伊耶那美姐姐召来的Saber。他对其他人也很好……”


  “......有没有可能是你有天赋？”祁荒吐槽了一句。


  “别打岔！”


  她的眼睛从地面挪到更远的地方，从冷光铺满的地平线一直穿下去。“他不明不白地去送死了。那些人要他的命，甚至不知道为什么。他为什么要替天照命金地的人去死——”


  祁荒的眸子落在她眼中燃烧起来的暗红色上。


  “千子村正——他把自己的命看得很低。”祁荒收起了笑容，嘴唇轻轻碰了一下又分开。“用他自己的命去换别人的命，对他来说再正常不过。”


  “那是他自己的选择吗？”村正的声音是从牙关里挤出来的。


  “是。”祁荒肯定了。


  村正闭了闭眼，她似乎在回忆着什么，随后睁开眼睛：“我之前也一直想过这个问题。”


  “只是我不敢确定罢了，因为我老早就知道了。”


  “这样的人的未来只有崩坏，我只是不愿意承认这个结局罢了。”


  村正把脑袋往下压了半寸。巷子走到尽头，冷光从上方灌下来，打在她脸上把她的红发染得发白。


  “你在犹豫什么呢？千子村正。”祁荒在出口处回过头。“继承了这个名字，就做该做的事情吧。”


  “不论如何，我首先要做的是——”村正把太刀从腰侧抽出半寸，刀身与鞘口摩擦出一声极短的利响。“给我父亲复仇。”


  祁荒的嘴角微微往上提起一半。她把眼睛眯起来，从眯成的缝里仔细看了村正一眼。“我算是看明白了——你父亲是你的一切。起源也好，成长也好，现在前行的目的也好，全是他构成的。他有说过希望你变成什么样子吗？”


  村正想了想，摇了摇头。红发把刚浮上来的表情晃碎了。“父亲一直说，只希望我开开心心的就好。”


  “那你现在开心吗？”


  “欸？”村正愣住。嘴唇张着，舌头被那两个字的重量压得一动不动。


  然后她咬紧牙关，从牙缝里把浊气压着碾出来。“怎么可能开心——我父亲死得不明不白，而且月读命金地这个地方……”她的声音陡然大了一圈，在巷口与墙面之间回弹了好几个来回。“有半分同情心的人看了都不会觉得开心！”


  “不。大部分人在这里并不会不开心。”祁荒偏了偏头，示意村正看大路上的人群。人们笑容满面走着，一个卖素包的妇人拿围裙搓着手笑，旁边的摊贩拿葫芦瓢舀汤时也在笑。“瞧他们的样子。被教化成这样。”


  村正吐出一大口气。然后她把嘴角慢慢扯上去，扯出一个没有暖意的弧度：“那么德川家光就更不能原谅了。新仇旧恨一起算。”


  祁荒伸出手臂，横向拦在村正胸口前。力道不重，但指尖已经微微张开呈挡势。村正的瞳孔同时收紧，手指一根根收进太刀柄上缠带的皮革隙缝里。


  主殿前，冷光从穹顶的缝隙中灌下来，把巨大的石柱影子拖到四人身上。黑袍僧侣正弯腰对一名素衣僧人恭恭敬敬行着合十礼，袍帽的边沿在躬身时往下垂了半截。素衣僧人背对二人，肩宽不阔不窄，僧袍上没有任何金线或法印，布料在冷光下呈现洗过无数遍之后才能有的浅灰白。德川家光跪在一旁，额头几乎贴上石板，脸颊上的红润被弯腰时涌上的血液灌得更艳；筑山殿也跪在旁边，下巴微收，眼梢不动。


  祁荒的眸子闪了一下。不是被光线晃的，是她眼中的世界单独在变动——素衣僧侣的僧袍从肩头开始剥落，底下依次叠出来的是奴隶的皮绳嵌进肩骨的深痕、苦工赤膊干裂的掌纹、农夫被蚂蟥咬过的足踝、渔贩手里还滴着腥水的鳃腔、书生策论在指尖沾上的墨痕、官吏铁券在手掌上磨出的死茧、将军胸甲边缘锈烂的压痕——最后是布料遮去一切，僧侣的轮廓重新凝实。


  衣袍翻了又翻，身份变了又变，脸孔始终是同一张。


  祁荒收住步子。她把拦在村正胸前的手臂收回来，把指尖点在唇边示意安静。然后她歪了歪头，伸了个懒腰——懒腰收到一半时用力吸了口气，神色在吸气时完全剥掉了刚才所有的轻佻。'

content: '城墙上驻着的僧人密密麻麻压着墙头，诵经声从他们的喉咙里滚出来时已经听不清字句。每人口中都含着一段经文，每人手中的佛珠都在指间转动，檀木珠子互相磕碰的干响从墙头成片洒下来。


  月读命金地的冷光从天照命金地方向反射过来，擦过僧袍边缘的金色镶边时把他们的影子拉得极长，踩在城墙下的青石路面上甚至能看到影子底端被冷光切得发虚。


  祁荒走在前头，步子不快也不特意放轻。木屐踏上石板时压出踏实的叩响，街边几个盘着手杖的摩诃从她面前扫过去——视线直接从她身上滑开了，像是水流绕过一块露出河面的石头。


  村正压低身形跟在后方。红发在冷光下比平日更暗了几分，她的一条腿刚迈过城墙拐角的阴影边缘，城墙上的一个摩诃已经转了头。


  那摩诃还没出声。


  祁荒把食指伸出来，朝空气里轻轻弹了一下。指甲在冷光里闪了大半秒白光，城墙上的摩诃瞳孔猛然扩开然后剧烈收缩，脑袋朝旁边一偏再也不看这个方向了。村正的嘴微微张开但话还顶在喉口没出来。


  “什——”


  “哼哼~”祁荒把刚才弹空气的指头收进袖里，转过身来。脸离村正不到两个拳头的距离，嘴角往上挑着。语气压得极轻极短，从舌尖滑出来便散在两个身位之内的空气里：“村正亲，接下来打算做什么呢？”


  村正抬头扫了一眼城头。那些摩诃还在拨他们的佛珠，珠子碰出的干响节奏没乱过半点。她把吐到一半的惊气吞回去，顺手把自己刚才用来伪装的路人僧袍从肩上扯下来塞进腰间袋子：“你怎么做到的？”


  祁荒没答她，只是拿手指比了比旁边一个佝偻身子挪过去的老人，又摆了摆手掌——意思是衣服可以收了。村正把最后一片破布塞好之后，红发在肩侧晃了晃。


  祁荒把手收进口袋里哼着不成调的句子，她在人流中走了几步才侧过半张脸。


  “你打算直接去找那个叫德川家光的拼了？”


  村正跟上她的步伐，双眼眯了眯：“我看着有那么不惜命吗？”


  “啊啊~”祁荒的回应从舌头上直接翻了上来——尾音被她的嘴唇收得极快，像是咬着字尾把话吞了进去。她没看村正，只是继续走她的。


  人流从她们两侧淌过去，拖木展的老者、抱菜篮的妇人、牵小孩的汉子，每个人脸上都堆着满足的笑意。村正边走边扶住一个佝偻得快倒下的人，把他的手臂拉回拐杖上。老人抬头对她咧嘴笑了一下，笑容里缺了半颗牙，然后继续用拐杖笃笃顶着地面朝巷子里去了。


  村正追上祁荒时，鼻息还没完全调匀。“你刚才凭什么说我会去拼？”


  “字面意思。”祁荒往左拐进一条岔巷，巷子只有一人半宽，两壁被冷光堆得阴湿。


  她把嘴唇拉开，笑意从舌尖上滑了出来：“你这种人我见多了——一到要去达成目的，就奋不顾身冲过去了。”


  “啊啊，脑补太多。”村正摆摆手：“快走吧，位置还有多远？”


  “大概是二十分钟。正面还能挡得住，别急。”祁荒走在前头，木屐声在窄巷里压得发闷。她停了一拍，然后不急不慢地把话吐出来。“等打起来——你会不会担心波及到其他人？”


  村正的步子顿了一下。眼睛先落在地面青石板的接缝上，然后才抬起来对上祁荒的侧脸。


  “当然。性命是不能被玷污的。”她的声音在窄巷的回音里叠了一层，“不管要做什么，不能拿别人的性命开玩笑。自己的所作所为要自己担着——如果以他人的性命垫底，我是不会原谅我自己的。”


  “你的想法……”祁荒把尾音悬了片刻再收回来，“我不评价就是了。跟上。”


  街巷走到一半时两人拐进了一条更长的主路。路边的灯笼刚被点着，暖黄的火光贴着冷光的天幕展开半圈微弱的暖晕。村正的呼吸比先时深了许多。


  “还有多久？”声音里压着什么东西，没有抖但明显在收。


  祁荒头也不回，她问了一句看似毫不相干的话：“父亲对你来说是什么？”


  村正脚步没停。她先扫了祁荒一眼，那一眼里带着的被问到这个话题时下意识的防御还没来得及藏好。然后她把胸腔里积压的气一截一截呼出来。“你是问我我的过去吗？”


  “是。”


  村正轻笑了一声。那不是开心的笑。是把堵在嗓子眼的东西压碎之后从牙缝里挤出来的气音。“那我也要知道你的过去。”


  祁荒想了想，把一只手掌从袖子里掏出来翻了个面。“好啊。我出身不算富裕，有点才智学慧，学了点不起眼的东西，搞到一些有意思的力量。然后因为觉得有趣进了埋葬机关——之后教的徒弟死了，同伴也死了，最后欺天盗世，替了别人的功绩，变成现在这个样子。”


  “替了谁的功绩？”村正追问时声音比之前硬了半度。'

content: '反而是如果她无知，这个能力才会更强。


  “如果我是个脑子有问题的人的话，这个力量就会更强是吗。”立香捏着下巴，拇指在下颏骨上轻轻按着。她说话的语气已经从质疑变成了推理，声线平稳下来之后就带着一股她自己都没注意到的笃定。


  “不过还是很强啊——在我认知外的事情很多吧。”


  “所以说是作弊级别的能力。”吉尔伽美什开口。她把交叠的手指在膝盖上对换了一面，然后把掌心摊平搁在膝头。


  立香看向吉尔伽美什。她的表情现在极度的认真——这份认真不是皱眉头也不是瞪眼睛，是她的脸突然变得很静，静到连眨眼的频率都慢了下来。


  “吉尔茜，你为什么会选我——你做我的师傅。”她停了一拍，“我想问这个。一切都太巧合了。”她的手指在自己的膝盖上蜷紧了一点。


  “不管是你选了我，还是我召唤了士郎，亦或者是我成为了——救世主。”她把那三个字吐出来时声带微微发紧，然后她抬起头看着吉尔伽美什的眼睛，“吉尔茜，你有千里眼对吧。你——”


  “千里眼不过是另一种黄粱一梦罢了。”吉尔伽美什悠悠地开口。她不是打断她，是用一个比立香更轻的声音把对方的话从中间缓缓推开。


  她把视线从立香脸上移到窗外，窗外午后的光影在地板上已经挪了一小截。


  “我——本王看上你没别的理由。”她顿了顿，然后嘴角往上翘了一小点，那份笑不像是王之财宝全开时的狂傲，更像是她在伦敦公寓里翻着账本时忽然想起什么的样子。


  “单纯是因为——”


  “你长得很像士郎。”


  “…哈？”


  “？？？？？？？”


  立香无语了。


  她把嘴巴张开，又合上，又张开，然后从喉咙底翻上来一句话。


  “就这——？”


  她把自己的手从膝盖上抬起来，在半空中摊开，手指张开又并拢：“我知道我和士郎长得很像——长得很像——”


  她重复了一遍这五个字，然后她的声线在“但是”后面陡然拔高了半拍。


  “作为理由是不是太粗糙了？！”


  吉尔伽美什耸了耸肩膀，和服的袖摆随着她耸肩的动作轻轻晃了晃。


  “就是这样啊。本王收徒弟当然要按着本王的喜好来。”她把“喜好”两个字咬得格外清楚，像是在念一道菜的名字。


  立香气笑了，嘴唇在“气”和“笑”之间找不到一个稳定的落点，最后她的嘴角歪在一边，用一种介于无语和认了之间的表情看着吉尔伽美什，等她把剩下的话说完。


  “那时候他刚刚跑去千年城。本王觉得养了那么久的儿子不听话了怪可惜的，结果凑好遇到你了。”她把“凑好”两个字在舌尖上打了个转，然后勾了勾唇角。


  “顺手吧。没想到你也不怎么听话。”


  立香大大的翻了个白眼。她把脸从吉尔伽美什的方向别开，白色的天花板接住了她的视线。


  她看着天花板看了两秒，然后转回来。不翻旧账了，她今天已经被灌了太多从震惊到无语的情绪。她开口：“这个魔术研究者是谁？”


  吉尔伽美什赞许似的点点头，下巴在她点头时往下压了一小截，好像是在说“你终于问了”。


  她把酒瓶搁到一旁：“神琦灰。”


  “啊啊，”立香的嘴角抽了一下，“我是在假面骑士的剧本吗——敌我同源吗这是。”她吐槽完把肩膀往前倾了倾，那份吐槽的尾音还挂在舌头上但眼神已经认真了起来。“真的是她？”


  “不是，她确实是死翘翘了。”吉尔伽美什说道，她的语气在“死翘翘”三个字上降了半度，比起刚才谈论魔术语时的轻松，现在的她更像是在调出一份还未确认的档案。


  “我还在确定最后的敌人是谁就是了，不过目前很难确定。”


  “我知道了。到后面总会知道的。”立香点了点头。她把这份情报在心里装好然后压到一侧，然后她抬起头。“那这种魔术的上限呢？”


  “哦，你的认知越多上限越低啊。”吉尔伽美什补充道，她把手在面前随便一挥。


  “我不是说这个。我指的是你说的逆向根源的魔术——上限在哪？”立香看着吉尔伽美什的眼睛。


  “我不知道。”吉尔伽美什又抿了一口美酒。酒液滑过唇沿时她轻轻咂了一下，然后把瓶子重新搁到膝盖旁边。“我连你的那个都不会，怎么可能知道整个上限呢。”


  立香沉默着把嘴唇一抿。然后她点了点头。“那就要一次次测试了。”她说完低下头，看着自己手背上那个圆加十字的新令咒。


  她把目光从令咒上移开，看向躺在床上的士郎。士郎的呼吸还是那么平稳，平稳到她能在自己的心跳声里分辨出他每一次胸腔起伏的间隔。


  “士郎怎么了。”她低声开口。不是问句——是她已经等了太久才问这个问题，等到这句话出口时所有之前的疑问都只是为了让这句来得慢一点。'

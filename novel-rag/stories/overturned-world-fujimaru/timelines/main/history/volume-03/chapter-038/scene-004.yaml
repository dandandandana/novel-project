content: '“献身？”立香听见这两个字的时候眼睛还没完全睁开。但她把眼睛睁开的那条缝却比刚才听任何一句话时都要宽。她把头从台面上侧过来，右耳贴在弹力材质的纹路上，左耳对着蓝球的方向，声音里还混着半口没咽下去的睡意。“——你说他们，献身了？”


  “是的。”那个女声在“是的”的第二个音节上拖了极轻极稳的延长音，像是录制这段话的人在按下暂停键之前先把这口气按自己的肺容量全部用光了。


  “我们文明的所有人都为了未来做了最大的贡献。”这个声音在这次完整句之后有了更多的原生细节——不再只是录音平白播放，而是音频单元在放电过程中从底层调取了说话者的口腔共鸣参数。


  你能听出那个说话的人是个女性，年纪可能不太大，她在录音时口腔后部贴软腭的发声方式被音频单元完完整整地复原了出来。


  “虽然文明已经覆灭——”蓝球缓缓朝立香这边转了半圈，面板上那对合成出来的光影眼睛在菱形片的微动之中朝下做了一个合眼的动作。“但是这里是我们留给来者的礼物。”


  立香在台面上把自己撑着坐了起来。方台察觉到了她重心前移，台面从她后背抽掉了一小截推力，转而把腰部支撑朝上弹了半寸。她坐稳之后两只手撑在自己膝盖外侧，继续看着蓝球。


  “我们希望这里能够成为你们的基石。”女人声说这句话时节奏一改之前录好的咬字方式，它在这句话里自己加了一个极短的停顿——是我们希望，成为你们的基石。“我们希望成为你们踩在脚下的巨人。”


  它的面板这次没有笑。菱形片回归到了一整个安静的蓝色球面。然后它朝上飞了半米，悬在士郎和立香之间正中间的高度。


  “欢迎来到——可观测宇宙里没有之一的，最强的文明。属于人类的，未来文明。”


  那个声音在大楼群顶上散开，却没有任何回响。空间太大，近处没有能撞回来波能的面——所有音声都被建筑材质的表面吸掉了，只剩下这句话的纯音在空气里飘了几拍后下沉到平台的地砖上。


  玛修睡着之后微微翻了个身，盾牌斜挨着平台侧边，她自己手指张开搁在脸侧。


  士郎把两只手不声不响地收回袖子里，裹着手臂站着。


  村正扛着刀站在平台最外沿，她的火龙缩成了一小坨在她脚边的地砖上盘着自己。


  立香的眉头又皱了皱。这次不是把疑点塞进拼图里，而是她刚才听到的那个词——“献身”——和那些不断涌上来的舒服、方台、欢迎、文明、遗产，在被拼到一起时，让她视网膜后面的什么地方轻轻拧了一下。


  她没有说话。她安静地又躺了回去，把眼睛闭上。方台的背部支撑从她第四根胸椎的部位托上来，轻轻地在她后腰窝的位置推了一下。然后她呼出了一口在肺底闷了半天的气。


  那个蓝球在上空静静停着。女性录音的余响在空气中化干净之后它又悄悄把自己的面板调回了一个幅度不大的微笑。'

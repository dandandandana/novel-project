content: '立香听见了那句话。欢迎词的最后一个音节还在大厅的灰光里来回撞着。


  “先把疑点记下来。”她把脸转向士郎，下巴抬起来时前额那片刚才皱起的阴影还没完全从眼窝上退掉。


  她的声音压得很稳，和她在月读命金地时下命令用的声调几乎一致——只有她自己的胸腔知道心脏在肋骨后头跳得比平时快了好几拍。


  她说完之后看了村正一眼，村正扛着刀从雕塑左边踱了回来，妙法村正的刀身在她肩膀上跟着步伐轻轻掂着。


  【这里不会是……】


  士郎在队伍最前面迈开了步子。他的木屐在大理石地板上踩出的响声比平时轻，因为他在离那扇铁门还剩三步的时候已经把步幅缩短了一大半。那扇铁门——如果不是立香在迦勒底的中央资料室里翻过当代建筑史，她大概不会一眼认出来那是一扇铁门而不是石墙。它的材质暗沉到和周围廊柱的颜色几乎完全一致，表面没有任何把手或铰链，只有一圈肉眼几乎看不见的拼缝。


  士郎走到门前。他还没有抬手，铁门自己朝上卷开了。


  门板从底部朝上卷起来的动作没有发出任何金属摩擦的尖叫，只有一声极轻极闷的滚轨音，像是有人从一卷厚重的绸子里把线轴慢慢拉空了。然后整扇门消失在天花板的暗缝里——立香一下子看见了外面的场景。


  那不是她脑子里的任何一个预设画面。月读命金地是废墟和神灶的低矮平房，天照命金地是木质殿宇和石板路，迦勒底是实验室白和服务器蓝——眼前这个城区是完全从另一个时间点上拔起来之后硬生生嵌进了星之内海的。


  街道的宽度足够让两台马车并行还有余量的余地，但地上铺的既不是石板更不是土路，而是浅灰色的合成地砖，砖缝细密到肉眼只能看见一条淡淡的线。


  房子在空中——每一幢楼的楼体外壁都能看到外挂的停机坪，壳状的金属台从大楼的腰部朝外伸出来，不靠柱子，纯粹是被一种看不出结构的支撑力悬在半空。


  “什么——”立香的嘴张开了。她喉咙里那个“么”字之后拖了一小段气音。她眨了两下眼，眼皮开合的速度比平时快了很多，因为头顶那片天空的光线不对劲，不是日光，是从天顶正中央一块看不清的隐光源均匀地灌下来的白光。


  “路修到天上了吗？完全想象不到啊——”她用力摇摇头。


  “前辈。”玛修把盾牌从背上取下来立在了自己腿侧，“这里完全是科幻时代啊——这是怎么做到的？”


  “真正意义上的未来吗？”立香低声问道。她的视线从那些悬空的停机坪上收回来，扭过头时领口蹭过下颌。她的嘴角朝下拉了拉。“士郎，你的同调还能发挥作用吗？”


  士郎没有答话。他把自己右手的袖口朝上推了半截，露出小臂之后走了两步停在一面漆成淡灰的外墙面前。他把手掌整个贴了上去。


  “可以。”他扭过头来看了立香一眼。说话时他掌根的蓝光还没褪完，几抹残光挂在他的虎口边缘，被他从墙上抬起手时顺手甩开，“这里的材料没什么区别。”


  “但是结构完全不同了，类似于材料的极限了。”他说这句话时把手从墙上收了回来，退后两步站到了立香身边。


  “材料的极限？”立香把这两字咬在舌头底下重复了一遍。她的眼珠子朝上方滚了半圈像是在翻心底里存着的工程学模块，然后又落回士郎脸上。“士郎，拜托你侦察了，我们准备出发。”


  士郎点了点头。他主动把自己的同调状态解除了之后身形在立香的眼前晃了一下——再眯眼时他已经不见了。


  立香趁士郎不在的这几拍呼吸里把自己的目光从左边拉到右边，从右到左扫了两遍。这片天空不知道有多高。


  天空的上空是均匀的淡白，没有太阳的轮廓更没有半片云在动。光是从整片天穹上朝着下头平铺过来的，打在建筑外墙的白色板材上不反光。但问题就卡在这——没有云，没有天顶，没有鸟更没有风——这个地方不该有天空。


  这里是星之内海，哪里来的天空？


  “立香。”村正忽然开口，她的声音压得不重但每个字的尾巴上都带了半分试探，“有没有可能这里还有人？不小心一点吗？”


  “如果有人就问问信息好了，总要和人交流的。”立香转过来看了村正一眼。她把头歪了一下，右肩朝上稍微抬了半寸又落下去：


  “有人更好，又不是没有通晓语言。”


  “啊呀，那种魔术真是方便呀～”


  立香收回对村正的注视，然后她朝平台的前沿迈出了一步。这个平台很大——从铁门出口到这里足足铺出去二十多步的空地，但四处望去没有任何连接到对面建筑的桥。大楼之间架着一道道断断续续的空路，停机坪挂在半空，可就是没有一条完整的连接地面的走道，全是隔离在空气里的独立区划。


  “但是怎么过去啊！”立香的嗓门一下子高了半个阶。她抬起右手摊开手掌冲着那排悬空的建筑物比划了一个根本接不住的手势。'

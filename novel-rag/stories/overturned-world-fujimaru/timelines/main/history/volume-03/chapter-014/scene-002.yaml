content: '士郎点了点头：“佛是超越了生死轮回的——”他开口时声音比刚才稍微低了一点，“并不在轮回之中，也不会来度化众生。”


  他把“度化”这个词说完后顿了一下。他的嘴唇抿住了半拍，像是在把自己所知道的所有关于佛的定义重新过一遍然后确认自己没有记错。


  “所以弥勒——怎么会呢？”


  他看向立香，琥珀色眼睛里那份沉静还在，但语调已经带上了极少有的不确定。他不是在被信仰困住，他是被逻辑困住了。


  立香看着士郎，他说话时那种稳当和她刚才把弥勒的名字从嘴里念出来时脑子里那声咔响被他自己消音了——但他问“怎么会呢”时明显带着他完全没办法处理的惊讶，她想了想忽然开口：“弥勒有没有可能不是佛呢？”


  村正继续扒着饭，她把筷子夹起来的鱼肉送进嘴里之后听到立香这句话，腮帮子在里面嚼了两下，又把筷子放回碗边上。


  “类似于西海那边的观音菩萨吗？”她问这句话时抬起头。


  “是。你说对吧士郎？”立香转过来看向他。菩萨和佛的差别在佛教里被划得很清楚——佛是圆满的，菩萨差最后一步。她把这一点嚼碎了咽下去之后重新推给士郎。


  “菩萨没有修行圆满，差了最后一步，类似于十四的月亮吧，所以自愿留在世间。”


  “没错，通过苦修达到觉悟——”士郎接上这句话时语气已经完全回到了平时那种沉稳，“但是差了一分。”


  然后他往立香这边歪了一下脑袋。幅度不大，刚好够让他的眼睛从御主的侧脸扫到她的整张脸。他的嘴角往上扯了一个极淡的弧度，那个弧度里有些东西很无奈：


  “你从哪里学的这些——现在日本不是早就不信佛教了吗？”


  “什么意思？”立香白了他一眼，“我天天除了训练就是在图书馆，看点这些东西很正常吧。”她说“正常”两字时把尾音往上扬了，像在说——你急什么。


  士郎摇了摇头，然后他看向村正：“你说西海那边的观音菩萨？”


  “对的。”村正把碗从桌上端起来，“虽然观音菩萨现在也已经避世了。”


  “避世——”立香把这两个字从村正的句子里单独拎出来，她把这个信息点放进脑子里那个专门存放“下一步需要查的东西”的区域里面：


  “离开这个世界了吗？”


  “不，是和这个世界断联了。”伊耶那美开口了。她说完之后把手上端着的红茶往嘴边送了一点，茶还没有进嘴，她隔着杯沿继续说道：“观音菩萨把整个西海的地方包裹起来，然后在世界之外开辟了一个地区，将里面的人在那里存留生活。”随后她抿了一口红茶。


  “伊耶那美大神，现在还有办法和观世音菩萨联系上吗？”立香问道。


  “没有办法了。观世音几年前避世，自此再也没有和现世有过联系了。”伊耶那美把红茶从嘴边放下来搁在桌面上。她的指尖在杯沿上轻轻敲了一下。


  “就连您也没有办法吗？”玛修开口。


  “牝水主藏匿，主生发——”伊耶那美吹了吹杯口上还在往上飘的热气。红茶在杯壁里面晃了两晃，茶液是深褐色的，在杯底沉着的茶叶被水流掀起来又落回去。她又抿了一口，然后眉毛往中间挤了半寸，把杯子搁回桌上时杯底在木头桌面上的碰撞声比她刚才放东西时的力道都要重了半分。她有点嫌弃地看向站在一边的天沼。


  “西海又是由观音水而形成的牝海，她想要藏起来谁能找得到？”然后她把下巴往红茶的方向扬了一下，“泡茶技术又差了。”


  天沼从暗处走出来一步。他的斗篷下摆在地板上拖过，他朝伊耶那美鞠了一躬，躬的深度刚好够让他的脸被斗篷的帽檐遮住。似男非男似女非女的声音从黑色布料里传出来：“抱歉，主人。我毕竟不是Saber。”


  Saber。


  这个音节掉进正厅的空气里之后在立香的耳膜上弹了一下。Saber。圣杯战争的七骑职阶之一。剑之从者，被召唤出来的从者。


  立香没有开口，她把这道信息从耳朵里收进去之后先把它放进了脑子里那个贴着“待查”标签的抽屉——伊耶那美召唤过Saber。那个Saber会泡茶。


  御主是谁？这个问题在她的脑子里打了个旋之后被她自己摁了下去。她不打算问，她选择和士郎交换了一个短到几乎看不出来的眼神。


  伊耶那美把天沼的道歉当成日常的一部分来处理，她语气里的嫌弃还带着一点习惯了所以懒得再说的疲惫：“所以让你多练。”


  她把红茶推到一边，手臂推出去时道袍袖口在桌面上轻轻扫过，扫掉了桌面上的几粒盐粒。然后她再度看向迦勒底的一行人。“现在这里的情况大概就是如此。你们还有什么要问的吗？”


  “伊耶那美大神，我有问题。”立香把身子挺起来。她的肩膀往两侧撑开了半寸。


  “为什么那些人——”她停顿了一下，像是在找一个合适的词来形容她在月读命金地看到的那些脸。“都在笑呢？”'

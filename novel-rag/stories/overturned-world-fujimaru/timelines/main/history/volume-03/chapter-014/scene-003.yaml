content: '“你是指月读命金地的人吗？”伊耶那美问道，她想了想解释道，“他们觉得自己过得很满足就是了。”


  “什么？”玛修挑眉，她的眉毛往上一挑时眼睛瞪得比平时大了整整一圈。“怎么可能，那里的人瘦骨嶙峋，怎么看都不可能满足——”


  “具体的我不清楚。”伊耶那美说这几个字时比之前说任何事都要快半拍。她没有给玛修更多的解释空间，但不是不耐烦，是她也给不了更多的样子：“他们的‘世尊’教化他们这样就够了，类似于这样的就是了，具体是怎么教化的我也不知道。”


  她看向村正，村正的碗里还剩一些米饭粘在碗壁上，筷子搁在碗边上没动，伊耶那美用自己手里的筷子敲了敲村正的碗壁：“吃干净。”


  “伊耶那美大神。月读命金地的世尊——既然月读命已经死了，那么‘世尊’是谁？”玛修又开口了。


  “我不知道。”伊耶那美淡淡的说着。她把红茶杯的边缘抵在自己下嘴唇上，说话时热气的尾巴还从杯口往外冒：“也许是菩萨，也许是佛吧。”她抿了一口茶。“不可能是月读命。”


  立香深吸了一口气。这口气从她的鼻腔进去之后沿着气管往下沉，然后在胸腔底部停住。她把今晚吃饭时得到的所有情报全部在脑子里过了一遍：


  神尸、弥勒杀了释迦牟尼、观音避世、月读命金地的世尊在教化、沼嘴里有Saber。她把这些东西从脑子里排成一排，然后一个一个点了过去：“我明白了，感谢您的情报。那么——还有一个问题。”


  她把手指在桌面上往前推了半寸。指尖代替手掌按在桌沿的木棱上。


  “圣杯在哪里？我们修复这个特异点，需要找到圣杯并将其回收——”


  “哦？”伊耶那美挑眉，“回收圣杯？回收了那样又怎么样？”她的语气从这一整晚的平淡换成了另一种平淡——完全不在乎的平淡，“能够拯救这个世界吗？”


  “欸？”立香一愣。她的身体在椅子上往后缩了半寸，她的手从桌沿上滑了下来，她怔怔地看着伊耶那美：“您的意思是——”


  “就算回收了圣杯，也无法改变这个时代。”伊耶那美把筷子搁在碗沿上，她看着立香的眼睛，左眼里的烛火是暖的，右眼里的烛火是冷的。两种不同颜色的火光在她瞳孔里同时存在却不会融合：“你们所能做的——只是切断了这个特异点和你们的时间的联系罢了。”


  蜡烛在她说完这句话时被不知从哪来的气流扯得往她的方向晃了一下。火光在赤色眼睛里打了一个旋，在碧色眼睛里纹丝不动。她把下巴从手掌上抬起来，搁在桌面上交叉着的十指上面。


  “听懂了吗？来自迦勒底的御主和她的从者们？”'

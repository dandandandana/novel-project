content: '她把手臂伸直，筷尖对着的方向是月亮左侧的一大片空白。她指了指天空，“为什么没有星星。”


  “嗯？什么星星？”千子村正的声音从士郎另一侧传过来。她手上裹着一团橙红色的火焰，火焰在她掌心中锻造出来一个刀坯。


  “神造 ......”


  吉尔伽美什愣了一下。


  村正把短刀从火焰里抽出来时刀身上的通红还在往空气里散着一圈圈热浪。她看着立香手指指向的那块夜空，红发底下那双和士郎一模一样颜色的琥珀眸子里映着两粒火光的残影：“星星是什么？”


  “嗯？”立香顿了顿。她把筷尖收回来，筷子在碟沿上磕了一下，磕掉了一小块粘在上面的肉末。“星星就是……”


  她从空中扯了一根线下来比划着。“外太空的，反射光芒的星星。也有恒星这种——自己发光的大火球，到地球上的。”


  “哈？”村正一愣。她手里的短刀从火焰中被完全抽了出来，刀刃上的红光在她偏头的同时暗了半度，“外面的星星是什么意思？外面怎么可能有东西啊？”


  这下轮到其他几个人愣住了，士郎停下了手边撒佐料的动作，吉尔伽美什把空酒杯从袖子里掏了出来不自觉地想拿个东西把玩。立香的嘴里还张着刚才说到一半的那个“火球”的口型。


  “你说什么？村正？”


  村正歪了歪头，“哪有星星这种东西啊？”她说这话时嘴里还在嚼，声音被肉噎得发闷，但琥珀色的眼睛完全不动地看着立香，是真的觉得受话人在胡说什么没有的东西。


  “等等等——月亮！你看天空中有个亮堂堂的东西。”立香把碟子朝石板上一放，碟底磕在石头上碰出一声短促的瓷响。她指了指空中那轮圆月——手指的方向已经有点急了，手腕往回摆时带翻了碟子边缘一小块还没吃掉的肉皮。


  “那是月亮啊，怎么会是星星呢？”村正低头看了看手中的短刀，刀身上残余的橙红火光在她咬下第二口肉时印在了她的嘴角，给她脸上的理所当然镀了一层暖色的包边。


  立香想了一下。她把差点涌上来的某句话咽了回去，然后用手在太阳穴上敲了一下。指腹敲到的那块皮肤还带着刚吃完烤肉后微微发烫的余温。


  “……也是，现在是中世纪。”她把筷子从碟子上拈起来，转身朝向士郎。“嘛，士郎，你负责和她解释了。”


  士郎顿了顿。他把刚才被吉尔伽美什淋了酒的那半只乳猪重新翻了个面，撒上去的粉末在火舌舔过的瞬间炸开了一小片细密的香料碎光。


  然后他开口跟村正解释。


  “前辈？你们在解释什么？”


  玛修踩着院门朝这边过来。她穿着浴衣，腰间还缠着没完全系紧的带子，左手举着一块干布在擦头发。


  湿漉漉的粉发贴在脖子后面，水珠顺着发尾一颗一颗往下掉，砸在她肩膀上把浴衣的肩部浸出了几块深色的湿痕。她边走边把干布在头发上掖了两下，洗过之后的手指甲盖透着一层被热水蒸出来的淡粉。


  她把干布从头发上拿下来，手指在发梢上顺了一圈，指缝间夹着的水珠被火光一照闪了一下：


  “没想到村正的青色火焰也可以作为水来洗澡啊——那个青焰碰到皮肤的时候不像火，像是被一缸子早就调好了温度的水从肩膀浇下去。而且真的好舒服。”


  “哼哼~”村正得意的笑了笑。


  一旁跟她解释着星星是什么的士郎顿了顿。他把手里的佐料罐搁下，罐底在石板上磕出一声轻轻的瓷响，然后他叹了口气：


  “主真是不保佑我啊——”


  “欸？主？你还是教徒吗？”村正把短刀横在火堆边缘。刀背上的残余火星被风一吹全灭了，她的问题在火星熄灭的同时朝士郎投了过去。


  “以前是。”


  “现在不是了？”


  “嗯。”士郎应了一个音节，“发生了一些事情。”


  “好的好的，我知道了，继续解释星星吧。”村正把短刀收进刀鞘里。手指在刀鞘外侧的鲨鱼皮上划过去，皮面上刮出一声干燥的摩擦声。


  士郎重新开口。他把星星按照最基础的天文学术语拆成了几部分讲给村正听——先从太阳开始说起，说太阳也是一颗星星，然后说为什么白天看不到，再推到更远的恒星和行星。


  村正边听边拿青焰在掌心里淬一把新的短刀，淬的时候偶尔抬起眼皮看士郎一眼，然后又低头继续烧铁，像个在边打铁边听师傅讲道理的小学徒。


  玛修用干布擦完了头发，把湿布团成一团搁在膝盖上。她盘腿坐下来，浴衣的衣摆铺在石板上，腰带上还没系紧的带子垂下来一截，尾端耷在石板缝里刚冒出来的嫩藤叶子上。


  推门声在这时响起。整个金地新的主人走了进来，伊耶娜美穿着一身华丽的黑白色礼服，衣料在月光和火光交界的位置泛起一圈细腻的银边。礼服是黑的基调，领口朝下走了一条白色的织纹，纹路从她的锁骨下方一直蜿蜒到腰侧，再到裙摆，像是有人在黑布上用白色线整齐地缝出了一条被压到极细之后固定在原地的流水。'

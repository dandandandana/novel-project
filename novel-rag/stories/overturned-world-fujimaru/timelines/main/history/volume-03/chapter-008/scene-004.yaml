content: '“没有相关资料，立香。”奥尔加玛丽的声音在立香的耳廓边出现，非常小声，“迦勒底的数据库里面没有祁荒这个名字的资料。”


  “啊咧咧，原来是迦勒底啊。”祁荒不知什么时候施展了个魔术，声音从她喉间滑出来时已经脱掉了方才那层怔愣、茫然和隐约的不满。


  她一挥手用衣袖扫了扫身上本就不存在的尘埃，整个人在被空气重新包裹的瞬间变得端庄起来，从头顶繁复的发饰到道袍下摆最后一丝褶皱，干净得仿佛刚从温泉里被人捞起来换上袍子就等在这里。


  那股让人忍不住想往玛修身后退一步的甜腻气味也在同一瞬间彻底消退了。她眼睛微微眯起将视线投到立香手里的腕表上。“我听说过你们～人理修复机构是吧。”


  “你怎么知道？！”立香的眉头在听到这句话的一瞬间往眉心挤了进来，她的心里也跟着骤然收紧了，像是被人用一根看不见的线勒住了下巴。


  “阿拉。”祁荒往前走了半步，这半步把立香和她之间的距离缩小到立香能用余光看到祁荒鼻梁上那些细微的阴影走向的程度。


  她开口时声音比之前更轻了一点，把每一个字的末尾都拖出一个若有若无的尾巴，“把我当做你们的协作者就好了。”


  “你们现在需要一个协作者对吧。我猜的没错吧。”她笑着开口。


  “御主。”士郎的声音从立香身后半步的距离压低传过来，这一个词不是命令，是士郎把判断权交到她手里之前最常用的提醒。


  立香的肩膀没有动，但她下巴往下压了一寸：“啊啊。Ruler，我知道了。”然后她把视线重新提上去对准祁荒。“你有什么目的？”


  “目的吗——”祁荒把这三个字用舌背顶住上颚在嘴里弯弯绕绕地转了一圈，转够了才吐出来。


  这一转让她能利用这段时间替这句本来不需要任何思考的话想一个听起来最无害的说辞。


  “也没什么目的，只是觉得这里可能需要我吧。毕竟——这里的人们饱受苦难，她们需要我罢了。”她把最后三个字从舌尖上轻轻弹出来，弹出来之后用气托了一段不长不短的尾音。


  “泛泛而谈空虚之言。”村正的声音从她抱刀的位置砸过来，尾音是硬的。瞪祁荒时那对琥珀眸子一点光亮都没漏进去。


  “哼哼。我一向是行动派，你可以问问这里的其他人～”祁荒把这次对话的皮球从村正手里轻轻抄起来，带笑转了一圈又把它递回立香面前。


  “——请你别恶心我了。”立香把自己的手掌按在额头上，拇指在太阳穴外侧轻轻压了下去，她说的每一个字都在往后退。


  “这样吗？好伤心。”祁荒把嘴唇往两边一拉做出一个伤心的表情，但是她唇角的线条往上多翘了半寸，把这个伤心悄悄地反了光。


  立香把手从额头上拿下来，然后用手掌的侧面擦了一下眉骨上的汗，擦完之后她趁自己的脸还没抬起来把视线斜过去递给士郎——这个眼神很短，短到在外人看来她只是眨了眨眼。士郎接住了她的眼神。


  “你认识我？”


  祁荒瞥眼看向士郎。瞥眼时她瞳孔从眼眶这头滑向那头只用了极短的半拍，然后就稳稳停在士郎脸上了，“啊啊，我总算是感受到你的气息了。你莫非不是——”她想了想，顿了一下，然后才开口：


  “言峰士郎？”


  士郎顿住了。他的肩膀在停顿的瞬间没有动，但立香捏了捏他的手——两根手指在他掌背侧面轻轻夹了一下，然后他开口：


  “我是。”


  “原来如此——你隶属于埋葬机关？”


  “是。”


  “少见啊，姓言峰——在埋葬机关——”祁荒把这句话的尾巴拖了整整一个心跳的长度，然后她点了点头，这点头不像是欣赏而是某种模糊的、还没完全被收拢到同一张账单上的东西。


  “那就是——你的世界不存在祁荒这个人咯？”


  “不存在。你是来自于平行世界吗？”


  “啊啊，你可以这样理解就是了。我从我那里跑出来了。”祁荒说这话时用拇指按了按自己另一只手腕的腕心：“而且不存在我——”她忽然拍了拍手，拍完之后掌根分开手心朝上摊开，做出了一个豁然开朗的姿势：


  “那你们的世界可真幸运啊，一个没有祁荒的世界。迫不及待想见识一下了。”她笑着开口，笑得眼睛眯成了两条很细的缝，但这缝里没有漏光。


  “……”士郎也无语了，他把视线从那女人的笑上移开，偏头看着立香，在等她。立香当然能感觉。


  玛修把手伸过来抓住立香的袖子，这个动作不大，但传递的信息很明确——她已经用余光把战场打扫完了，现在需要御主给个信号：


  “前辈。我们要不然——”


  “咳咳——别担心，我不是坏人哦～在我的世界里我可是～”祁荒笑着开口，“埋葬机关第三席。”


  话音刚落，她身上的衣服顿时消失了，从领口到袖口到袍摆，整件道袍在空气里一下子没了，像一张被撕掉的薄纸。'

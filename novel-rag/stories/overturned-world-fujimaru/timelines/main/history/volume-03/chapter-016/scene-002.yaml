content: '客栈门上挂着的暖帘布帘子一动不动——但晚风在客栈周围绕着它吹过去，把后院的枯叶卷起来在客栈外围打着旋然后飘到更远的花坛里


  “怎么了？”伊耶那美歪过头来看着立香。她的语气和刚才在正厅里说“你果然答应了”一样，但是她在看立香的脸上有没有在最后一步打退堂鼓的痕迹。


  立香没有马上答话。她把自己的手指从身侧抬起来然后轻轻拉住了玛修的手腕。


  “我迈一步过去，就会进入试炼吗？”她看着伊耶那美问道。


  伊耶那美忽然笑了笑，“没错。”她说。


  立香顿了顿。她把手从玛修手腕上松开然后把自己站正，看着伊耶那美：


  “我要等我的从者来齐。”


  “他就在后面。”伊耶那美说。


  红发的男人慢慢从走廊尽头走过来，眼睛扫过后院时先在伊耶那美身上停了一瞬，然后把目光钉在客栈正门上那团浓得不见底的暗影上。他把脸转向立香。


  “御主，你想好了？”言峰士郎问道，他的声音不重，但落在这座诡异客栈前时那份不重本身就是一道横在她和那团黑暗之间的最后隔墙。


  “啊。”立香转过头来对着他笑了一下，“毕竟这是最优解了吧。别担心，我会回来的。”她把“回来”两个字说得轻快，像在说晚饭后回房间那样。


  “可能会一去不复返哦。”祁荒的声音从士郎身后幽幽飘过来。她的木屐踩在最后一块敷石上轻轻磕了两下然后停下。


  “进入到里面的时候你可要好好地想一想哦~不管能不能出来......都可能——可能比死更残忍吧。”


  “到时候可是谁都救不回来了。”她说完，把点在空中的食指收回去搁在自己嘴唇上。


  立香顿了一下。玛修从她旁边开口了，玛修的声音比平时沉了半度：“前辈——如果实在不行的话”


  “不，我要去。”立香看着玛修，把嘴角重新往上拎了一度。


  然后她把脸转向士郎：“玛修说过会保护我，士郎也说过会做我的后盾的。我总不能什么都不做吧。”


  “有觉悟呢。”祁荒笑着说。她把视线从立香身上挪到伊耶那美脸上然后微微侧了侧头，“黄泉津大神，您倒是收集了不少来自外面的东西啊。”


  “借来的东西罢了，不是我自身的。”伊耶那美淡淡地说。然后她把头偏了偏——左眼暖的右眼冷的，两个温度同时打在祁荒身上，“观察完了？你这个菩萨？”


  “阿拉阿拉，说我是菩萨真的很侮辱菩萨这个词语哦。”祁荒把木屐往前踩了一步，嘴角的弧度还是收不住。


  “倒是观察到了很有趣的事情啊。”她说完对着伊耶那美轻轻眨了一下眼。


  立香见状把攥在自己掌心的那个小动作彻底松开。她往前迈了一步——不是试探，是干脆的一步——然后她整个人在客栈门内那片黑暗的覆盖下消失。


  不只是黑吞没了她，是她的存在像被从这一侧空间里彻底抽掉。客栈还在，伊耶那美站在门内侧没有消失。夜风绕开客栈往花坛那边吹了过去。


  言峰士郎盯着客栈门内那片黑暗看了足足一拍。立香消失的位置上什么也没有来：没有挣扎声没有深呼吸没有脚步声，只有伊耶那美还站在客栈里歪着头看着外面的夜色。客栈门内，立香刚才还站在那里——现在只剩下地上浮着一层极薄的暗影在木质框架上轻轻抖动。


  “你不参与？”士郎开口了。他把脸对着站在客栈内的黄泉津大神，琥珀色眼眸里的光在这一刻被后院里被客栈染淡的烛火打成了一片冷色。


  “都说了是借来的事物了，我并没有这么高的位格。”伊耶那美回答时把嘴角往上勾了一下。她的阴阳双瞳在客栈门内侧的黑暗中各自流转着冷光——左眼和右眼在这片借来的空间光下再也分不出暖与冷的差异，都是同一种从死亡底部反射上来的幽绿色反光。


  “试炼是什么？”士郎的声音忽然炸开了。


  这个音量让整个后院里被枯草圈住的那一圈空气全都颤了一下，他的身体不由自主地往前迈出一步。


  玛修抬手按住他的手臂，把他往自己这边拉了半拍。


  伊耶那美沉默了，她把头偏过去，把整张脸上的表情和阴阳双瞳里的反射光一起转向了客栈另一侧的黑暗里。


  “唉——”祁荒幽幽地从士郎身后开口了，她把声音从那片寂静里慢悠悠地抽出来。“这就是你啊，到最后没准连泄愤都做不到呢。言峰士郎，如果你的御主从里面出来了......前提是能出来......你和这位名为玛修的从者做不到泄愤。你只能埋怨自己无能罢了。”


  “你知道？”士郎把身体转过来对着祁荒，他开口时嘴唇比平时要薄——是牙关又把嘴抿紧了：“不知道就给我——”


  “黄粱一梦。”祁荒把食指从空中收回来戳在自己的下巴上，头微微一偏。'

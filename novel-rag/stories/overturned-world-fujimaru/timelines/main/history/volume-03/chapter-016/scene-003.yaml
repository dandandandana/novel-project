content: '士郎愣了。那个词在他的记忆里打开了一个极细的钩——立香讲过这个故事。某个午后，她说东方有一个叫黄粱一梦的典故，人在梦里过完一生醒来发现一锅粟米还没熟。然后祁荒接着开口了。


  “及以——你应该听说过吧？来自东方的故事，名叫作杜子春的人。”她说出“杜子春”三个字时嘴角的弧度彻底勾起来了——不是那种看到剧情走向自己预料方向的愉悦，是一种更深的、看着一个已经知道结局却依然要问开头的讲述者。


  “杜子春是什么？”玛修困惑地把眉头皱起来，她看了士郎一眼。


  “杜子春？你指的是？”士郎把那个名字在舌头上翻了一遍，然后他的瞳孔微微收缩了半圈。


  “啊。就是那个就是了。”祁荒点点头。她的笑容重新回到嘴角上，这次是真正的愉悦——她清清楚楚地看见士郎认知里那道被劈开的裂缝正在从头皮一路裂到后脑。


  “当她出来的时候，哦，前提是能出来~”她把食指从下巴上抬起来朝客栈门轻轻指了指，“也应该和杜子春不一样吧。”


  她的话还没说完，士郎已经把整个身体转了过去。


  “玛修。”他说，“我需要你在这里呆着。”


  然后他往前冲了出去，他的衣摆在他加速时被拉成一道短暂的弧线，他的影子和他的肢体同时被客栈的门框切割，然后整个人消失在黑暗里。


  “前辈？！”


  玛修的声音在后院里被反弹了回来，她的嗓子发出的声音被这道黑暗弹回来的分量砸了一个踉跄。


  客栈门内——空的。立香不在，士郎不在，只有伊耶那美还站在门内侧歪着头，从黑暗里看过来，她的阴阳双瞳在黑暗的深处比任何烛火都要醒目，两颗不同温度的瞳孔同时透视着门外这个少女的崩溃。


  “祁荒小姐——”玛修把声音从胸腔里抽上来，对着祁荒开口。


  “到底是什么？黄粱一梦是什么？杜子春——为什么前辈会因为这个变得那种表情？”


  祁荒说出那个名字然后士郎的瞳孔从收缩到炸开——玛修在迦勒底呆了很久，但从来没有见过士郎那样愣住过。


  “啊啊~得道嘛。”她说。她抬起左手在空中悠然的轻轻拍打了几下，“总要失去些......或者是得到些什么吧。”


  “杜子春嘛，一个东方来的人。进了梦。梦里面他经历了人世间一切荣辱，一切善恶。最后他看见了：看见了自己最不能失去的东西。”她把头微微偏了一下，嘴角勾起极小的弧度。“然后他就失去了得道的机会。就这么简单，小妹妹。”


  “那......那前辈她会？”她的话说到一半卡住了，卡在喉咙里某个说不上来的地方。


  伊耶那美在客栈门内侧的黑暗里把视线挪到了玛修身上，然后她把嘴角那抹几乎看不见的笑意收进了黑暗里。


  祁荒把脚从枯草圈边上收回来，木屐在地上缓缓蹭了一下，然后把头往玛修的方向歪过来。


  “所以呀——我们就这么等着吧。如果天亮之前她能从这道门里走出来——”她顿了顿。“或者他走出来。”她把眼睛弯了起来，那个笑意不像是安慰倒更像是在隔着一整座月亮看着一株不知道能熬多久的野花。


  “那时候，你就知道她到底舍了些什么，守了些什么。”她说话时左手在袖子里轻轻摩挲着自己手腕上的念珠，檀木珠子滚在她皮肤上发出沙沙的轻响。'

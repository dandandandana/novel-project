content: '“我从一开始，就想要为了我的父亲复仇，立香。”她把拳头在自己身侧攥了一把。手腕上绑刀柄的旧皮绳被这一攥磕出了两声干响。


  她停了停——停的那当口呼吸在胸口悬了半拍才重新落回去：“而你给了我这个机会——如果不是你，我可能就死在了月读命金地，连父亲被谁害死的都不知道。”


  她看着眼前的迦勒底御主，嘴角朝两侧拉开了一道笑。


  “嘛，你可以这么理解——现在我打算为你赴汤蹈火了，哪怕是通不过的火焰山我也会陪你走到头。”她把笑收了几分，声音在最后半句上朝下压了压，“我要陪你去星之内海。”


  立香怔了一下。千子村正确实是极强的战力，甚至可能在单兵对抗上比士郎还要强上一截。但是这根本不是让她为了自己豁出性命的原因。


  “村正——我，这是我们迦勒底的事。”立香的语气在“我们”两个字上放软了。


  “如果你要这么说的话，立香。”千子村正把声音放轻了。她低头看了一眼自己攥紧后松开、松开后还留着皮带勒痕的手腕。“——不止如此。我还想要拯救这个世界的人。”


  “月读命金地的事，你我都亲眼看见了。”村正的声音在走低，低到每个字都像是从胸腔内部翻出来的。


  她的目光是散开的，对着立香胸口的纽扣，但她真正在看的大概是那片被黑月光压碎之后连哭嚎都发不出来的废墟。


  “我不能容忍——我不能容忍他们连呼救都做不到。”


  她把视线从纽扣上抬起来，重新对准了立香的眼睛。那个抬起来的动作和她锻刀时把刀坯从炉火里用钳子夹出来往上拎的姿势一模一样——准，稳，不带一丝多余的晃动。


  “就算他们从来没有期待我去救他们，我也要去做。我不能只是看着。”


  “所以——请允许我跟你们一起去。”


  立香看着村正。她没立刻回答。她把头转过去看向伊耶娜美：“伊耶娜美大神，您同意吗？”


  伊耶娜美端着酒杯的右手搁在桌沿上没有动。她沉默了之后点了点头。点头的幅度不大，但动作很干脆。


  “那么拜托你了，村正亲。”


  宴席的最后残局被众人一起收拾干净。碗碟被天沼端进了后厨，酒壶被吉尔伽美什重新收进了宝库。


  立香和吉尔伽美什在体验了来自村正的青炎沐汤之后裹着干净的浴袍出来了。青炎在他们身上滑过时触感不是火，是流动的温热水纹——浸了一整天的汗和尘土从头到脚被卸了个干净。两人神清气爽地道了晚安各自进了房间。


  夜深了。


  天沼在金地里走着日常的巡逻路线——从城墙上的瞭望台一路踩到居民区的巷口，再绕着神灶外围踩了一圈回来。他回到城主府的时候，见到一个男人在廊下踱着。


  月光从廊柱的缝隙间被切成了几条极细的银白色断面铺在地板上，那人的灰色和服下摆每走一步就在断面上扫过去一次，然后月光重新铺好，等着被下一步踩散。


  天沼认出来了这个人。是长得和Saber千子村正一样的男人。Ruler言峰士郎。


  “Ruler——夜深了，你在这里干什么呢？”天沼朝前走了两步，他的木屐在石板上撞出两声闷响。说话时没有带敌意，但他在距离士郎还有三步远时停下了——这个距离刚好是他张开膀子能够第一时间拦下对手的位置。


  言峰士郎转过身来。灰色的和服领口朝外松了半圈，腰带没有完全系紧，露出里面白色的里衣。月光打在他右半边脸上把他那只琥珀色的眸子照得格外亮，但眼眶底下的疲惫也同时被照了出来。


  “我有事情要问你，天沼。”


  “您有什么想问的？不如直接去找伊耶娜美大人。她在——”天沼把话头子往伊耶娜美那边引。


  士郎打断了他。他开口时声音很轻，像是怕吵醒什么：“伊耶娜美在这段时间是真的沉睡了。她要等你唤醒了之后才会开始活动——她很信任你。”


  天沼的眼神一凝，他常年毫无表情的脸上在眉心处裂开了一道极细的纹路。那纹路从眉间朝上爬了小半截，然后被他自己摁住了。瞳孔收了一下——这个收束明确地指向士郎咽喉的位置扫了一遍，又收了回去。


  “你既然知道.......还敢来问我？”天沼的语调里多了一层不该属于他的冷意。


  “我觉得你有事情在瞒她，天沼。”士郎看着他的眼睛，脚步没有再往前挪，“伊耶娜美的武器——天沼矛。告诉我：你是不是有伊耶娜美不知道的信息？”


  天沼没有回答。他的嘴唇仍然保持着刚才说完最后一个字时的口型，但所有声音都停在他喉结上方没有再往外出。


  月光从廊柱的缝隙间漏进来一道，正打在他右脚的木屐尖上。他盯着那道月光看了好几拍心跳的时间。他的呼吸在自己胸腔里压着，和服胸口的布料跟着轻轻鼓了一下又缩了回去。


  这个沉默比任何回答都完满。'

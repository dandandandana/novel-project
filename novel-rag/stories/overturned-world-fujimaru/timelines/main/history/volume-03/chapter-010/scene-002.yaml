content: '他闭上了嘴，他不说话，这个沉默没有短到能被忽略，也没有长到让村正觉得他在准备什么刻薄话。


  “我父亲是个很好的人，他在天照金地很受人尊敬，但他平时也没什么架子。”村正抱着太刀重新坐回地上。这


  次她没有盘腿——她的一只腿屈起来膝盖顶着自己的肚子，另一只腿平摊在泥地上。她的手指在刀柄上来回摩挲，指腹掠过刀柄上那些无名的锻痕。


  “嗯......烂好人吧，就这样。”她说这句话时嘴角往上走了半寸，那个笑到了嘴角就不再往上走了，似乎真的在笑。


  “这种人也就只能在天照命金地活下去了啊。”村正说这句话时抬头看着天空，她看的不是月亮——月亮还没出来，她看的是东边天际线某个固定的点，那个点此刻还是深蓝色，和旁边所有像素差不了几度的深蓝。


  但她的瞳孔定在那个点上，焦距没有扩散过，如同在寻找着远不可及的星星：“到了其他地方，会被吃的连骨头都不剩的。”


  士郎看向村正，他开口时先把自己的声带清了清：“你父亲和我长得很像吗。”


  村正把目光从天空挪下来，她的眼睛对上士郎的脸，她的目光在士郎身上对焦，然后那个焦距开始穿透，开始从言峰士郎的五官往后退，往后退，退到某个比士郎的脸更远的地方。那个地方她再也回不去了。


  “几乎一模一样。”


  士郎叹了口气：


  “我就知道。”


  “我和他很像？为人处世方面的。”


  村正摇了摇头，然后她皱起眉，眉心挤出一道几不可见的竖褶。她的嘴唇在皱眉之后抿紧成一条极细的线，然后从那条线的中间分开。


  “像也不像。我父亲可没你这么不像活人。”她把最后三个字用舌尖推到门牙后面砰的一声弹出去。


  士郎眉头一挑。“你这是什么意思。怎么开始说我的不好了。”


  “字面意思。”村正抬起手挠着脑袋。她袖口滑下来露出的前臂在冷空气里缩了一下。她笑着开口，“我就是心直口快的人，习惯就好。”


  士郎冷哼了一声。他把两只手臂重新交抱在胸口，脖子往右一扭，别向一边：“何出此言。”


  “大概是你御主所说的第六感。”村正把手指在空气中晃了晃，晃完之后她把手指收回去，收进袖子里。


  “无凭无据。”士郎的声音从别过脸的侧影里闷闷地传过来。


  “只是第六感。你的御主应该比我感受深得多。”村正说完这句话之后自己又补了一句。“不，如果我没猜错的话，你的御主应该早就发现了。”


  “这不是你该担心的。”士郎的声音传来。


  “这样？明白了，我不多管闲事了。”村正点点头。


  士郎点了点头。他把脖子从扭向一边的角度转回来，月光在这一刻刚好被天照金地的八咫镜反射过来，灰白的月光落在他的娃娃脸上，把他左眼窝下方的阴影拉长了几分。


  他开口：


  “你为什么要出来呢？千子村正。”


  他问得很随意，像是在问一个他并没有意识到自己不该问的问题：


  “你为什么要去月读命金地。照你所说天照命金地的状况比月读命金地和外面的情况要好得多，那你为什么要放弃好好的生活来到这里呢。”


  村正不说话了。


  她的嘴唇原本还保持着刚才说“不多管闲事了”时那个微笑的残余线条，然后那个笑从嘴角一路往下掉，掉到下巴，掉到衣领，掉到抱在臂弯里那把太刀的刀柄上。


  她的嘴巴张开了，张开之后她发现自己不知道要说什么就又合上。然后她盯着士郎。她的瞳孔刚才讲述父亲时那层温热的亮在这句话落地的瞬间暗下去——灯芯被拔掉之后油面上那层火一下子缩回灯口里，取而代之的是一团沉在瞳孔底部发暗的火焰，那种故意压着火苗不让烧得太高但又不得不烧的暗火。


  士郎把翘起的眉尾往下压了一寸：“怎么......”


  村正站起身子，她抬头，抬手指向天空。不是指东边——是指西边。


  士郎抬头看向西方：


  太阳从西方飞速升到了正头顶。


  那道上升不是日出应该有的轨迹。没有从地平线缓缓浮起，没有光晕先于日轮出现，没有天空从深蓝到浅灰的渐变。


  是整个太阳：完整的、灼白的、连边缘的光冕都清晰可见的日轮——从西边地平线后边被一把拔出来，砸过头顶。西方地平线开始发白，那片白的扩散速度快到不合逻辑，用不到一次心跳的时间从地平线底部涌上来灌满整片天空。


  士郎能感到自己头顶的头发被突然变化的温差烤得发干，他还在抬头看。因为那个东西现在还在天顶正中央挂着，一动不动。他脸上的表情不是恐惧——是眉头紧拧。


  【她有操纵日出日落的能力？这怎么可能.......】


  他把这个念头摁在太阳穴底下没让它上嘴。


  “没事了。该收拾收拾出发了。”村正把手指从空中收回来，她转身朝着村子的茅草屋走去。'

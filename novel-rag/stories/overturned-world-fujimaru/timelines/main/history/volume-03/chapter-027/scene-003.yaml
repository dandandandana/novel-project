content: '祁荒的目的从来不是试探他的攻防——那一击金刚杵是幌子，让她在攻击和他反制的间隙把自己的部分感知通道绕开他对千里眼的干扰才是真的。


  于是她看见了：


  弥勒的诞生。


  伊耶那岐重塑的世界在一次又一次的毁灭和重构中始终没有被修复。新生的神明把人类拎在手里像拎一把豆子，想往哪撒往哪撒。战乱在两个世纪里反复碾过同一片土地，人的知识没有任何进步，被彻底锁住了。


  在两个世纪的尽头，在那片所有活人的脸上都刻着同一句无声求救的土地上，应运着所有人的渴望和思潮——一名男性诞生了。救世主不是从别处来的。是这片土地自己吐出来的。


  他是真正的弥勒吗？大概不是。至少正常历史里的弥勒绝对不会是这样诞生的。那是思潮中诞生出来的“救世主”，是众生把对希望的求告共同压进了整个世界的一切之后，世界翻转给出来的回答。


  而催生出神明的人类也要付出相应的代价。


  【代价就是——双向锁死。】


  祁荒睁开眼。


  她看着弥勒时眸子里的温度比之前低了整整一度。嬉笑和得意从她的表情上同时消失了，取而代之的是一个薄得近乎决绝的嘴角弧度。


  “我所渴望的是人们对我有需要的感觉。”她呢喃着，声音平稳得没有一丝多余修饰。“就这一点来看，弥勒，你和我确实是势不两立啊。”她把眼睛从他脸上移开，扫了一眼那些被修复之后仍旧保持着一副麻木微笑的人群。


  “现在的世界被彻底洗脑，所有人都一副麻木到了极点不会去追求所渴望的事情：也就是说，不会有人对我有需要。而你，你是被所有人的需要锁死在这个位置上的神......还说什么放牧神明......”


  她骤然张开双臂。那件向来包裹着她全身的尼姑袍从肩头脱落，掉在地上还没来得及触地就散成了青灰色的尘粒。取而代之的是一身白色的圣袍，布料从她的双肩自然垂落，柔和的褶皱在她张开双臂时被拉成一片平滑的净白。她看着弥勒笑了一下，那笑容从嘴角滑到眼眸，眼里没有了刚才的冰冷却多了一层不打算后退的决绝。


  “不管怎么样，先把你打服了再说吧——”


  世界顿时被粉色灌满。无数粉红色的气泡从祁荒身上瀑涌而出，你挤着我我挤着你朝天空、朝街巷、朝每一寸能钻进去的空间疯涌出去。气泡表面映着每一张祁荒曾经见过的脸：渴望的、执念的、悲伤的、笑着流眼泪的，它们在半空相互挤压，把整片冷白色的天幕遮成了暖粉色。气泡群从主殿前铺到城墙外，连城外那片刚刚被弥勒推平的盆地上空都密密匝匝飘满了浮动的粉光。


  “这是包含着我所见过的所有人的渴望、执念和愿望所诞生的力量，虽然兽的空洞的人类爱是最好的养料，但是.....已经够了！”祁荒在一整片粉红色的光芒中抬起下巴，白色的圣袍在万千气泡的映照下泛出极淡的冷调。她缓缓念出那几个字：


  “名为——”


  “此世全部之愿。”'

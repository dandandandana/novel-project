content: '主殿的穹顶缝隙垂下几线惨淡的光，从冷白色的天空滤下来之后落在弥勒的素衣上便失去了大半亮度。祁荒站在他对面，把木屐尖轻轻磕在石板接缝上，整座大殿四周的柱影被暮色叠出重影，从弥勒的肩头一直拖到她自己的脚边。


  她看着那张脸——不是任何记载里那种肥头大耳的憨笑相，而是一张深深凹陷下去的、被岁月反复压过的肃穆面容。


  她嘴唇往上提了提，鼻息里带出极轻的嗤声：


  “原来你就是造成这一切的人啊——”她拖长了尾音，最后一个字在喉咙里转了半圈才出口。


  弥勒把手掌从膝头翻起来，食指在膝盖侧轻轻叩了两下。他抬起眼时没有先开口，只是拿那双看不出任何情绪的眼睛锁住祁荒。僧袍大袖从手腕处滑下，然后他才说话：“是我。”


  “大德！”一旁的黑袍和尚猛然从跪伏的姿势里立起半边身子，声音从嗓子底挤出来时带着压都压不住的怒意，“和她废什么话！拿下便是——”


  “哈哈哈哈哈~”


  他的话被祁荒的笑声掐断了，祁荒把脑袋朝左微微偏了偏，眼角眯起来：


  “这位师父火烧火燎的做什么，”她把话递过去时舌尖仿佛在嘴巴里凝聚笑意，“你家菩萨还没开口呢，你就急着替他说话？真体贴呀~”黑袍和尚的喉结滚了滚，牙关压出一声极低的磕响，但弥勒连眼皮都没眨一下。


  弥勒的声音平稳得不带一丝多余波动，字与字之间的间距像是量过的：“不属于这里的人，你为何而来。”


  祁荒歪过头，笑意从嘴角漫到整个脸廓。她把木屐尖在石板上转了个小圈。


  “为何？那我要问你了——迦勒底不也是不属于这里的人吗？”她把下巴抬了半寸，从下往上看他。


  “不一样。”弥勒说着把手收进袖里，袖缘叠过手腕，“他们是属于这个世界线的。而你不是。”


  祁荒摇了摇头。她戳着嘴唇，眼珠朝右上方斜了斜：“啊啊，我确实是来自其他世界线，”像是在回想什么很值得咀嚼的事情，嘴唇被她自己的指甲轻轻摁出一个小窝，“但是为什么来呢~”她笑了，笑容从唇角拉扯到眼梢，这是那种想到某件自己觉得确实很有意思的事情之后忽然亮起来的笑。


  “因为有人向我求助了啊~”她把手指从唇上拿开，语气收得极轻极淡，“本菩萨能够听到人们的悲苦，自然要前来了。”


  弥勒的眼神定了定。然后他吐出几个字，每个字都像从石头缝里抽出来。“兽的权能，单独显现是吗......只是类似而已，你没有人类爱.......”


  祁荒把眼睛睁大了一圈，然后抿着嘴笑出声来：“你竟然知道这些？这个世界线的菩萨情报网不错嘛——”


  “你的气息不像神明。”弥勒淡淡把话接过去。“不过神明就算现界也会被立马当作顶级上好的食粮，被放牧，和人交合。所以你不是。”他把“放牧”两个字咬得毫无情绪，像在说一件和天气差不多的事情。


  祁荒的眉毛跳了半下。她把笑容收回来挂在嘴角，挂得比刚才浅：“分析的很到位啊，”


  她把指节掰得轻响一下，“不过放牧神明这种事情真的能说出口——看样子你们已经干过很多次这种事情了啊~”她从袖口里抽出那柄黑色的长条状细柱，漆黑色泽，一头极尖。她把它放在掌心里静静敲着，细柱与掌心碰撞时发出沉闷的硬响。


  “人们不需要神明。”弥勒说完之后身子缓缓浮起来。素衣的下摆在空气中轻轻鼓动，他的脚离开地面时，石板上的灰尘朝两侧荡开一圈极薄的波纹。


  祁荒笑着和他一起升空，她的绣履刚离地时还没什么动静，但下一刻——两个人身上的气息同时暴起。空气被猛地向外推卷出去，闷响灌进大殿里的每一根石柱；殿外街巷里的楼房东倒西歪，木结构被压迫得咯咯惨叫；整片地面从大殿向整个月读命金地迅速蔓延着震动，石板路面的裂缝从大殿底下朝外龟裂开来。


  两个人一瞬间消失了。


  祁荒只觉自己像一粒银色微尘。四周没有上下，没有远近，唯一可以标定方向的是远处弥勒所在的那一点暗金——不对，不是暗金，是某种比金色更沉的颜色。时间在这里是被数轴画出来的一条线，线的一侧是已经发生的一切，另一侧是尚未发生的可能性；所谓的奇迹在这里只是寻常到不需要被命名的事情。


  高维的菩萨与佛在这个空间比拼的是权能，以及计算一切可能发生的事情的能力。


  但是他们无法扭转物理，数学法则。


  她把全部的计算力都集中在接下来每一次撞击的轨迹上——然后在虚空中和那点暗金接连不断地碰撞着。


  【果然——就算是这个奇奇怪怪的世界线，所谓的菩萨还是高维天魔啊。】


  【现在就是权能对拼啊~上次这样对拼还是和谁？身为杀生院的我？】'

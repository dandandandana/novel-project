content: '“阿拉阿拉，”她歪着头，眼睛亮得像是刚发现了什么好东西，“果然有值得我认真的对手呢。”


  士郎的眼睛一直没离开村正手里的刀。


  “士郎，能看出什么吗？”立香压低了嗓子。


  “你说我吗。”士郎的声音很淡，像是在敷衍，但他的眼睛还在盯着那把刀，“实际上那边的千子村正处于劣势，很明显。宫本武藏放水了。”


  “放水？那她这么警惕干什么。”立香指着台上还在笑的武藏。武藏脸上虽然在笑，但握刀的手握得很紧，虎口的皮肤被刀柄压得变了色，她的手指没有一根是松开的。


  “大概是，”士郎顿了顿，他的瞳孔在帽檐阴影里慢慢紧缩了一下，“可能是千子村正的刀吧。”


  “打刀有问题？是宝具吗？”


  “不知道，需要等她用一下再解析出来——”士郎把视线从村正的刀上拔起来，隔空落在了刀身的刃纹上。“是很多剑的集合体。不是一把剑，是很多很多把，被一锤一锤摞在一起。”


  立香侧过头:“和你的天丛云一样？”


  玛修也跟着开了口:“言峰前辈的天丛云也是如此吧。”


  “是。”士郎的眉毛没有松开，“但这个不一样了。更像是——”他停了一下，像是在从脑子里翻找某个词，“锻造。不是一把剑凝聚了很多剑的力量，是一个刀匠在火炉边上花了一辈子的时间，把每一锤落下去的经验堆叠在一起。经验的集合体。”


  “锻造……村正家是刀匠出身。”立香把他的话在嘴里嚼了一遍，然后慢慢说，“所以是技艺的集合体？”


  士郎点了点头。


  “能读取吗。”


  “武艺是可以，不过那个小家伙实际上没什么精湛的武艺。”士郎看着村正握刀的姿势，毫不客气地开口道“挥刀不精湛，但确实是经年累月练出来的。可以读取，但是没必要。”


  立香没再问了。她重新看向擂台。


  两人已经交手了四十合。


  村正的呼吸开始变得粗重，每一次格挡之后她的肩膀都会不可控制地往下塌一瞬，然后再重新提起来。那件灰色的羽织沾了汗，贴在背上，从兜帽的缝隙里能看得到一缕一缕的红发粘在颈窝。她的打刀还在握，但刀身开始发颤，每一次跟武藏的太刀撞上，刀身都震得像是要从手里飞出去。


  武藏退了。她往后退了两步，太刀在指尖转了一个很轻巧的圈，被稳稳地送进鞘口。刀入鞘的声音很清脆，咔的一声在擂台上回荡开来。


  她的脸上还挂着笑，但那双眼睛底下压着什么，压得嘴角在笑的时候反而抖了一下。


  “啊啊，看样子你是不愿意和我全力对决了。”


  她把刀鞘往下按了按，整个人的站姿变了。双脚分开，重心往下沉，握着刀鞘的左手变成了扶着刀柄的右手。拇指抵在护手上，指尖轻轻地拨了一下刀柄的缠绳。她垂下眼皮看着村正，那种笑已经从脸上慢慢褪掉了，只剩下嘴唇那一条线还在勉勉强强地翘着。


  “那么——”她的拇指一推刀柄，鞘口里的刀刃亮了，“你能接下我的二天一流吗。”


  兜帽底下的那张脸张了张嘴。


  村正说话之前先叹了口气，像是把身体里最后一口力气浪费在了这声叹息上。


  然后她收刀，把那柄没开刃的打刀平平整整地贴在身侧，转身朝擂台边缘走去：“我认输了。”


  武藏的手还按在刀柄上，拇指撬开了护手，刀刃已经出了鞘半指宽。她整个人僵在那里，手上的动作卡在一半，刀身被卡在鞘口，半截亮晃晃的刀刃悬在外面。


  “欸？”


  村正已经走到了擂台边缘。她的手撑着台边的木栏杆，腿一翻就要往下跳。她从头到尾没有看过武藏一眼，红色的头发在兜帽底下微微颤动，是周围人群涌动带起来的风吹的。


  “你你你——”武藏把刀哐当一声塞回鞘里，往前追了两步，指尖差点勾到村正的帽檐，“不该和我堂堂正正打一场吗！一开始就藏头露尾的，一个劲儿地躲，一个劲儿地挡，你有本事挡——你有本事还手啊！认输算什么武士！喂！”


  村正的手还搭在栏杆上，半条腿已经悬在擂台外面。她停了一下，侧过半张脸。兜帽遮掉了全部的表情，只露出一个很淡的嘴唇轮廓。“我的目的就是前二而已。”


  “啊？”武藏把手往前一伸，五指张开，像是想抓住什么又不确定能不能抓得住，“不许走！我还没打完！”


  “而且我是刀匠，并不算武士。”


  她说这话用的是平调，平得像是自言自语，说完就头也不回地翻下了擂台。灰色的羽织在台沿消失的那一瞬间，武藏的手臂垂了下去。她整个人像是被人拔掉了发条一样，双肩往下一塌，站姿歪在一边，叉着腰低着头，脸上那点笑彻底没了，只剩下一个半张着嘴的空白表情。


  台边的僧侣在村正下台之后走到了擂台中央，举起手里的权杖敲了敲木地板。咚，咚，咚，三声。他用一种和脸上横肉不太匹配的庄严腔调宣布了宫本武藏的胜利，台下零零星星响起几声有气无力的喝彩。'

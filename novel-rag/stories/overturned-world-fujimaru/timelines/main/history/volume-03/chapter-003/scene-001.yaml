content: '擂台的木头被日头晒了一整个下午，踩上去能感觉到脚底传来一股闷沉沉的热气。立香被两边的人挤了好几次，肩膀撞在不知谁的后背上，那人的脊骨硌得她肩头发酸。


  她在人缝里侧过身子，一只手攥着士郎的袖口，另一只手往后按着玛修的肩膀，三人在密密层层的后脑勺和草笠之间艰难地往前挪。周围全是人身上散发出来的汗酸和粗麻布料被晒过之后特有的干巴巴的气味，混在一起灌进鼻子里，稠得能挂在喉咙口。


  擂台边上站着几个僧侣，个个光头油亮，灰色的僧袍被肩宽撑得没了褶皱，手里的铁杖杵在木板上发出沉闷的咚响。立香的视线越过僧侣的肩膀，终于落到了擂台正中央。


  台上的两个人一左一右站着，中间隔了大概五步。左边那个一身红，衣襟敞得很低，露出整片胸膛和紧实的腰腹，肩上扛着一柄太刀，刀刃朝天，映出来的光刺得人眯眼。她正在笑，嘴角往两边咧得很开，露出一排白牙，那笑声隔着整片擂台都能听见。


  右边那个罩着一件灰羽织，兜帽压得很低，只露出口罩到下巴的那一小块皮肤，整个人站在擂台边缘一动不动，像根钉在那里的木桩。她握着一柄没开刃的打刀，刀身没有刀铭，没有雕纹，朴素得像是刚从锻冶场的火堆里扒出来就被拿到了擂台上。


  立香看了看左边那个，又看了看右边那个。右边那位兜帽的边沿被风吹动了一下，一绺头发从帽檐底下滑了出来，晃在左肩的灰色布料上，是红的发尾。


  “士郎，宫本武藏不会是那个……等等。”立香的视线从右边的红发扫到左边的粉色头发，嘴唇抿了一下，用一种很克制的语气开口，“红发，东方的山越人还是爱尔兰那边的？怎么还有个粉色头发的，是玛修的亲戚？”


  士郎偏过头，挑起了左边眉毛。


  他的眼睛在帽檐的阴影里微微眯起来，看着她，停了大概有两拍呼吸的时间，然后说：“你不也是橘色头发吗。”


  玛修把一只手搭在立香肩上，指尖轻轻按了按，像是在安抚小猫似的。“这种事情不要在意了，前辈。”


  立香垂下眼皮，叹了一口气。“明白了，我以后不说了。”她抬起脸看向擂台，把剩下的话咽了回去。


  士郎把视线重新移到台上，他的声音低下来，刚好能穿透周围嘈杂的窃窃私语：“粉色头发那个是宫本武藏，从者的魔力反应很明显，不是本地人。”


  “那另一个呢。”


  “听报号，叫千子村正。”


  立香闭上眼，手指揉了揉太阳穴，揉了好几下。“怎么都是女的。”


  “前辈。”


  “好了好了，我不吐槽了。”


  台上动了。


  宫本武藏把扛在肩上的太刀翻腕转了个圈，刀柄在掌心里滚过半圈，被拇指稳稳扣住。她看着眼前那个沉默的灰羽织少女，哈哈笑了起来：“已经是最后的一个了，应该能让我打尽兴吧！”


  话音还没落，人已经冲出去了。红色的身影压低了重心，脚下的木板被蹬得吱地一声响，灰尘从板缝里溢出来。第一刀劈下去的时候，周围的空气像是被撕开了一道口子，风声紧贴着刀身呼啸而下，刀光在半空中划出一道弧。


  村正没有后退，她只是把头偏了一偏，那柄劈下来的太刀擦着她兜帽的边沿划过，刀刃离她的耳朵只有两指的距离。她手里那柄没开刃的打刀在太刀落下的同时举了起来，两柄刀撞在一起，轰的一声，金属交击的尖锐声响炸开在整个擂台上。


  村正被打退了。


  她的靴底在木板上擦出两道很短的痕迹，身体晃了一下，兜帽的边沿跟着抖了一抖，又露出了一绺红发。但她没有摔倒，脚后跟在退了两步之后猛地刹住，膝盖微弯，重心重新压了下来。


  武藏追上来了，她的第二刀衔接得几乎没有任何间隙，像是第一刀劈下去的力道还没散尽，人已经借着那股反弹的力翻腕压低了刀身，横着一刀扫向村正的腰侧。


  村正的打刀在身前划了个很窄的半圆，刀背磕上太刀的刃口，又是一声闷响。她的手被震得虎口发麻，那柄打刀整个刀身都在嗡嗡作响，她换了口气，往回抽刀的同时侧身闪过了武藏的第三刀。


  两个人就这样打在了一起。


  武藏的攻势像夏天的暴雨，一刀接着一刀，每一刀都带着足以劈开空气的力道。她的太刀在她手里不是武器，更像是她身体长出来的一截骨头，刀身随着她的呼吸和步伐被赋予生命，劈、斩、横削、竖挑，每一次出刀都在空中留下一道白亮的光。


  村正在暴雨里只有一件事可做，她把打刀横在身前，手腕和肩膀绷成一条线，每一次格挡都用最少的动作去接武藏的刀。她不反击，反击需要往前走一步，而她走了太多步了。


  打到二十合的时候武藏忽然主动退了开来。她脚尖在木板上一点，整个人往后弹了一步，太刀垂在身侧，刀尖朝下。她的胸口起伏着，嘴角挂着一种不太正经的笑。'

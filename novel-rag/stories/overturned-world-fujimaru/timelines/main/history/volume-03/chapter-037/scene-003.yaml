content: '立香眼前的景象一下子切换了。她原以为会看见时间走廊滚动着模糊的时空参数，或者灵子转移时那种从骨头缝里朝外拉扯的剥离感。但不是。就是眼前一花，再看清时自己已站在一片灰色光里。没有晕眩，骨头没有失重感，连胃都没有多翻一下。


  落地之后的模样让她一瞬间卡住了呼吸。立香的眼睛睁大了半圈——周围的广阔在视网膜上铺开的速度比平时更快。


  空荡荡的大厅，穹顶的高度完全无法靠肉眼给出任何可靠的数值。灰色的光从四面墙壁离顶上近些的地方无源地朝下滚，滚到地板之后变成了一层薄薄的光廓把每个人的鞋底圈在了光廓上。


  空间不是靠墙壁定义的——墙壁在光里根本看不清，只有几组巨大的廊柱在暗淡中显影成一条条深灰的纵线。


  整个大厅的设计不是中世纪，更像是欧洲近世的某种庙堂——简洁，对称，每一个装饰元素都服从于一个中心：空。


  立香从传送落地的位置朝前走，眼珠子从左扫到右时那群巨大的廊柱也跟着在后排一层层显现又一层层隐入暗影，她看到了千子村正。


  村正坐在一尊雕像旁边的台座上，双腿交叉，左手撑着下巴，右手搁在膝盖上。她身后的雕像和她摆了一模一样的姿势——佝着腰，手肘搁在腿上，手指撑着下巴。


  被灰色光线投到雕像脸上的阴影刚好也落在她脸上把她的表情压成了同款深邃的无表情。她把自己嵌在那个位置上，稳得像是那底座原来就是给她留的。


  “村正……你在干什么。”立香无奈地看着她，把手里那朵蝴蝶结朝前一抛。蝴蝶结在半空中自己想了一下变成一只发蓝光的蝴蝶，朝村正飞过去，落在她肩膀上之后在她锁骨底下轻轻扑了一下翅膀才收起来。


  “等你们……好慢。”村正嘟囔时把尾音拖了半拍。她从台座上翻身下来，脚踩到地上时鞋底和大理石碰出一声轻短的回响，那回响在空间里翻滚了好几圈才散干净：“这里真的怪啊，我完全看不出来这里怎么样。”


  “士郎，分析一下。”


  言峰士郎此时已经走到了一旁。他的和服下摆擦过大理石地面时布料和石面之间没发出任何声音。他站在一尊白色大理石雕像跟前，视线从雕像的光脚趾朝上扫到头顶的光环——光环不是雕上去的，是用一种比基座更浅的白色石材嵌进去再磨平的。


  “这是……亚伯？”他把右手攥在了和服袖子里。


  “亚伯？”玛修把视线跟了过去。她的唇轻轻张了一下，把那个名字重复了一遍后才想起来她需要补充疑问：“是圣经里的——”


  “嗯，被该隐杀死的那位。”士郎把话接过来接完。他的琥珀色眼睛从雕塑头顶的光环移到雕像脚下的铭文。


  那些字符他不认识——不是拉丁文，不是楔形文字，笔画在石材的表面极细极精准：“这里的圣经是——”


  他走到立香身边，视线从雕塑上收回来之后扫了一眼穹顶：“和泛人类史是一样的吗？”


  “这里没其他的了，我用我的火龙看过了。”村正骄傲地仰起头，扛着刀在肩上转了小半圈。黑色的火焰在她指尖上跳了一下又自己灭掉。“嘛，全是墙壁，没有暗门之类的。”


  “士郎……这里没有佛像。”立香把这句话从嘴里一个字一个字吐出来。她的视线在雕塑基座的铭文和穹顶正上方的空白之间移了一次：顶上是佛教但地底下藏着亚伯的雕像，这种宗教的错位比任何魔术失效都更像有人在故意藏东西。


  “你不觉得很奇怪吗？”她把下巴朝上抬了半寸，抬起来的那个角度刚好把大殿远端的暗灰色廊柱一并收进了视线边缘。


  “上面在信仰佛教，这里却在供奉亚伯吗。”玛修替她把没说出的话点清了，玛修说完这句时把盾牌朝自己腿侧拉近了半寸。


  立香看着地面，她的目光跟着地板上一条极长极浅的甬纹路朝大殿深处走。她迈出了第一步。靴底踩上石质地面的一瞬间，整个地方同时响起了声音。


  声音从地下的石板缝里朝上漏。有短有长——先是一串很短的脆响，紧接着拉成了三拍的长音，再缩回最短一击。那套声音规则反复响了好几圈。


  立香在听到它循环到第三遍时回过头朝士郎做了个口型：通晓语言。


  士郎听清了那些音之后停顿了一拍，然后他的眼睛朝立香的方向看过来。


  “在说什么。”立香问他。


  士郎开口时声音很稳，把那些短长音译成了一整句话。译过来之后他朝立香点了点头，示意她也可以听到了。立香听清了。那声音不是任何一种她学过的言语，但通晓语言把它在她耳里翻译成了最简单的人类措辞：


  【欢迎——我们人类的火种。自由意志永存！属于人类的自由未来永存。属于人类的未来绝对存在！】'

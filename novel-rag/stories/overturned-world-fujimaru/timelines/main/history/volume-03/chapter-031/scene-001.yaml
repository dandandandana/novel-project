content: '阿尔托莉雅手中的金色长枪朝下方街面轰出一发光炮。粗壮的金色光束没有任何阻拦——没有结界、没有障壁、没有任何试图抵消它的术式——光柱直直砸进石板地面，将一整片街区连同歪斜的断壁和散落的金漆碎片一同吞进膨胀的光球里。


  被弥勒修好的地面再度朝外翻开，砖石在高温中化成流质又立刻被金地的术式抽回去重组。阿尔托莉雅骑着黑色的梦魇之马从光炮掀起的烟尘中缓缓升上半空，马的四蹄在空气中每踏一步都踩出一朵极淡的暗色火花。


  她的肩甲正不断蒸出乳白色的魔力残气，残气从甲缝里挤出时发出极细的嘶嘶声。少女低头看了一眼自己的肩甲，用手轻轻按住颤抖着的甲片。甲片在掌心里震个不停，她用力一摁，震动停了。


  她背部的翅膀一瞬间张开。黑翼从肩胛骨的位置朝两侧猛然撑开，翼面不是羽毛，是一片片贴在一起的暗色光刃，每一片都在微微嗡鸣。黑翼笼罩了整片天幕，整片夜空从深黑变成了更深的黑，连远处黑炎火云翻涌的红光都被压暗了一个色调。


  地面上，玛修用巨炮撑着身子，抬头看向那片黑翼之下的人马轮廓。她的嘴唇动了动，声音从喉咙里出来时被周围的爆炸余波盖得几乎听不见。


  “这就是……Alterego，阿尔托莉雅吗？”她没有把后半句说出来——那是关于自己手里这柄不完全的迦勒底之刃和天上那对黑翼之间的比较。


  阿尔托莉雅架马而去。梦魇之马在半空中甩开四蹄，每一次踏空都在身后留下一道转瞬即逝的暗色蹄印。阿尔托莉雅单手抽出腰间黑色长剑，剑锋划过空气时没有破风声，只有一圈近乎透明的环形魔纹从剑身上朝外推了半寸便消散了。


  她连人带马朝着下方大阵中站位最近的一位和尚直直斩去。此时此刻，在阿尔托莉雅先前击碎的十八法相大阵之后，剩下的十七位法相重新展开了降妖伏魔大阵。


  金色的阵壁从地面升起，经文锁链从阵心朝外围一层层编织，金色的光壁晃得周围的断壁残砖都染上了一层虚假的金漆。


  降妖伏魔大阵之内，法相们可以正常活动——他们的身法、法宝、经文，所有造物在这片金阵笼罩下都能获得最大限度的增幅。


  “妖孽！此时此刻归降！还能饶你性命！”


  底下为首的法相扬起头，他的声音从阵壁内侧朝外轰出去，震得地面上没被修复的碎石都跳了一下。他手里的金色权杖重重一顿，杖底的经文圈朝外围扩散开三圈圆形涟漪。


  阿尔托莉雅骑在梦魇之马上，歪过头。她额侧一缕金发滑过眼角。少女的嘴角往上一扯，扯出的笑意没有温度：


  “夸夸而谈降妖伏魔吗？你们这群人真是烂到家了。”


  黑色梦魇之马载着阿尔托莉雅朝下方荡去。马的鬃毛在空中拉出十几道墨色流线，四蹄踏落的暗色火花从蹄底一路坠向阵壁。


  一名手持金色双斧的法相猛然踏前一步，腰身一拧，双斧交错着朝阿尔托莉雅的侧腰劈去。斧刃上的金色魔纹在挥出的瞬间亮到极致，空气在斧锋前被劈出两条肉眼可见的白痕。


  斧子接触到阿尔托莉雅的一瞬间——她看都没看他。连眼神都没有偏过来。她只是继续荡了过去。双斧的刃口直直劈过少女的侧腰。没有金铁交撞的声响，没有魔力的反弹，斧刃从她的身体里划了过去。


  持双斧的法相明显愣了一下。


  他的双臂还保持着劈砍的姿势，斧刃上甚至残留着金色魔纹的余辉，但面前什么也没有——那个骑着黑马的少女已经不在刚才那个位置了。


  阿尔托莉雅穿到了他的身后。


  暗色的剑锋从法相后颈的方向飘过来。剑刃移动的轨迹几乎没有声息，只有剑尖划过空气时留下一道极细的暗色线痕。法相仓促转身，双斧往上一架。剑刃与双斧接触的那一瞬，他的膝盖猛地朝下一弯。他如同在撑着整座山岳——黑色长剑压在斧面上，剑身上没有魔力光，没有爆发的能量，就那么静静地压着。


  法相意识到眼前的金发少女的力量不是他能够抵挡的了。他冷哼一声，膝盖往上一顶，整个人朝后退开半步的同时，脚下的大阵猛然亮起，密集的金光从阵壁深处朝阿尔托莉雅射来。一道、两道、十几道金色光束从不同角度封锁了她的退路。


  阿尔托莉雅轻嗤一声。她再度架马飞驰起来。梦魇之马在半空中转了半个圈子，马蹄在原本的位置踩出一朵暗色火花之后，整人整骑已经移到了阵壁的另一侧。


  金光如同长了眼睛一样追上了阿尔托莉雅，它们在空中的轨迹拐了个弯，以比先前更快的速度从背后、身侧、头顶同时朝她收束。光柱触及少女身体的瞬间，和上一名持斧法相的攻击一样、从阿尔托莉雅的身体里穿了过去。金光穿过她的肩膀、腰侧、手臂，打在阵壁另一端的内壁上，炸开十几朵金色的火花。


  “妖孽！还不承认！”地面上一名持禅杖的法相指着空中骂了出来。'

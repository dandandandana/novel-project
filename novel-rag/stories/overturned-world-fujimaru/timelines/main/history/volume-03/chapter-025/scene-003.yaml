content: '被斩断的黄泉路两侧边缘同时卷曲起来朝外围溃散，暗金色的残余在刀身上残存然后迅速消褪。他稍微理了一下垂落到胸口的胡子——指尖顺着一缕发辫的外侧擦过去然后垂回身侧。


  他转向伊耶那美笑着开口：“欺负小辈算什么本事？陪我玩玩吧~”


  手一挥，风直接从他身后的高空灌过来了。呼啸的是裹着冰碴的风压把空气撕裂时的那种呜叫，伴随这阵风的还有轰隆隆的闪电——每道雷霆都像从云端笔直坠下来的倒悬铁树枝杈，互相碰撞时炸出耀眼的弧光。须佐之男命一剑斩出，银光和烈风混在同一个方向横贯长空。


  伊耶那美把袖袍朝外一甩。混沌的黑色物体从袖筒里涌出来——这片物体上裹挟着八团翻涌不息的雷云，每团雷云都沉闷地滚着各自滚雷和电蛇。


  八雷神化作八条黑色蛟龙，每条蛟龙身侧缠绕着雷霆，龙头上分别顶着不同的雷相——最先撞上去的那条龙嘴里含着一颗已经炸开之前的雷火。


  须佐之男命的眼神在蛟龙朝他冲来时愣住了半瞬，然后他冷哼一声双剑连斩。


  黑色蛟龙顿时被搅散成八条裹挟着雷霆的扩散形龙影，但是它们刚靠近他剑身的半径就同时失控偏转方向，像是每丝雷息都在剑锋之前自动向外偏折。它们在他身侧乱窜然后被他两剑驱散，剑身对蛟龙的效果精准得犹如热刀割油。


  “连这个都有吗？”须佐之男命把太刀收进鞘里，鞘口与刀镡嵌合时发出一声利落的点击。他的声音从合鞘之后的寂静里重新浮现——“真是有趣.......不过是区区——”


  他的话没能吐完。


  伊耶那美和空中所有和尚的身形在同一刻骤然大震，然后齐齐下坠了数尺才勉强重新稳住脚下。周围的每滴还在飘散的朱砂水珠和碎裂金字残片都同时变得迟缓而沉重，像是被某种从空气中直接施加的无形束缚攥住了。


  孤岛上方的岩层开始碎裂——大块的石片从基底剥落朝地面坠去，砸上飞行的法相们的金袍时发出来的是肉体和石块同时被压迫的闷响。


  “原理血戒。”士郎的声音从地面某处穿过风声送了上来。


  整座孤岛再也撑不住自身的重量，开始缓缓向下砸去。伊耶那美迅速朝后撤开，法相们结成的降妖伏魔大阵被砸下来的大地直碾过去——金光在全重当量撞击下四溅碎裂然后被灭掉，十八名法相的金光像是被掐住了灯芯，身形七零八落地被砸散成各自飞逸的点。


  须佐之男命歪了歪头。他从散去的烟尘中看见了正在走来的身影。他把嘴里还没吐完的那个词咬碎吞下去之后重新开口。


  “迦勒底的盾兵啊——”他的声音里带了半分谨慎和半分嘲弄，尾音在两个字之间微微上挑了一下。


  身着银色铠甲的粉发少女一步步从烟尘中走近。盾被她单手提着横在身侧，盾面的纹路在烟尘散去后逐渐变清晰。她停在须佐之男命正前方一段距离外，护指在盾边上轻轻一扣，视线稳稳地锁在须佐之男命的剑柄上。


  须佐之男命把视线从她身上移开扫向更远处的伊耶那美，重新开口时声音从“嘲讽”切到了“分配任务”的口吻。“哼哼哼哼哼，既然敢这么做，那就来试试吧——伊耶那美交给我，你们负责对付——”


  没等他把话说完，黑紫色的光炮从天而降。刚刚狼狈重新结好阵的降妖伏魔大阵草草亮起残余的金光勉强挡住这记落下来的光炮，光柱与金光的碰撞面在空气中擦出刺耳的滋滋声。


  十八个法相的身形极为局促，所有人的脸都拧着一层深深的愤恨，其中几个还被刚才孤岛的碎石砸碎了发冠、袍服边角碎布在空中飘着。


  从城墙上落下来两名身着华丽外衣、留着长发的僧人。他们的外衣与先前法相们的朴袍截然不同——深蓝与深绿交织的云纹绣在肩线处，走动间下摆拖出不沾地的长余。两人先扫了十八法相一眼然后同时哼了一声。


  “干什么吃的？在世尊面前出此洋相？”


  “毕竟是蠢物。”须佐之男命缓缓吐出几个字。他边说边把视线从两名新来的僧人身上移开，重新锁住面前站定的金发少女。


  金发金眸的少女骑着梦魇之马从半空落到地面，马蹄在触及地面的瞬间有一团黑雾从蹄底蔓延至四周然后渗进泥土。她抽出一柄剑，剑身在冷光下擦出一道暗色的幽光。阿尔托莉雅歪了歪头，把剑尖斜斜地朝法相们所在的方向点了过去。


  她看向玛修时嘴角弯起来，那是某种确定了战术之后浅淡的、不带暖意的自得：“这十八个交给我，那两个新来的交给你了~”'

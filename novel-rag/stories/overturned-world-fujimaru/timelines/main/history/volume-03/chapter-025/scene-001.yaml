content: '金袍法相们从城墙上缓缓升空时，冷光从他们背后的天照命金地方向透过来，把他们每人身上的金色袍服染出一圈冷白的光晕。


  他们的数量在城墙顶上一字排开时如同被同时点燃的蜡烛，火光不摇曳，只是齐齐亮起，然后他们围向半空中持矛而立的身影。


  伊耶那美把天沼矛从身侧甩了出去。矛尖在空中划出的轨迹上凭空浮现朱砂色的水珠，水珠边缘在冷光中泛着半透明的橙红色，被矛尖划过之后空气本身凝结出来的。


  水珠汇成一道逆行的流星群，朝着围上来的法相们狠狠砸去。


  梵音从半空中响起来。法相们的嘴唇同时张开，金字从他们舌底滚出落进空气里，每个字都在离唇半寸处猛然涨大——金色笔划泛着灼眼的暗金光泽。


  禅语在他们之间汇成一条流动的河，金字朝水珠撞上去。每一颗水珠与金字碰撞时炸开一声压得极低的雷响，沉闷，不震耳，但声压灌进胸腔之后内脏能感觉到那股透过空气传过来的沉闷撞击。接连不断的爆响连成一片，如同有人在天空深处同时敲响千面大鼓。


  法相们继续围拢，阵型正在收窄。


  须佐之男命一动不动立在半空。他素衣的衣摆在风里微微鼓着，长发几缕从肩上滑下来贴在前襟，浅金色的辫梢垂在胸前一动不动。他身旁陆续落下来几名同样身着金袍的僧人。


  他的声音从他嗓底滚出来。“弥勒怎么说的？”


  一名僧人把头低下去，袍帽遮去了眉毛。他的声音平稳得近乎寡淡。“大德的意思是他会保证地面环境各种各样都不会被破坏，胜负由你们来定。”他顿了顿，嗓子吞了半口唾沫然后补上，“须佐之男的世尊，大德的意思就是如此。”


  须佐之男命把视线从僧人身上移开，扫向那些围向伊耶那美的法相们。他把自己的长辫从肩前拂到背后，手掌在发尾轻轻一兜然后松开。“看样子是不打算出手了——”他把尾音拖成半拍长的低喃然后断掉，“那你们其实是？天照派来的？”


  “世尊驻守伊耶那岐金地。”僧人的声音依旧是平的，每个字之间有固定间距，“目前腾不出手。”


  须佐之男命把头偏了半寸。他看向伊耶那美在法相们围攻中挥矛的身影，嘴角往上提了一点，只是刚好能把他的上唇拉出一个略带猩意的弧度，“明明是天照命，却能够驻守伊耶那岐金地，真是命好啊。果然命数啊~”


  “命数都是定好的，世尊，如果你想要更多的话——”僧人的声音压低了一点，尾音降了半调。


  须佐之男命把嘴完全咧开。那不是笑，是如同把一口白牙全亮出来的表情：“就去抢就好了是吧~”


  话音刚落，轰的一声巨响把所有还在空中回旋的梵音都砸碎了。十八名法相被伊耶那美一矛轰开——矛身的轨迹撕裂了他们结成的环形阵式，金袍翻飞着朝四面八方崩散出去。


  整个世界在那一瞬间扭曲了半秒：天空的法相碎影、光的反射、空气的波纹全都揉成一团浑浊的流动形状——然后重新摊平恢复正常。


  伊耶那美从重新清晰的天空中走出来。她的阴阳眼里蓄满了暴怒——青和金两只异色瞳仁各自在眼眶中紧紧收缩，每一道虹膜纹路都绷紧到极限。


  她把天沼矛朝下狠狠扎入空气——矛尖没入虚空的瞬间传来一声沉闷的撕裂声，被矛尖铆住的天空开始朝两侧缓慢滑开。裂口之内是浓稠得看不见底的黑色混沌，混沌被矛身搅动时在裂缝边缘缓慢旋转着翻滚。


  然后整片天空变了。


  “那是空想具现化吗？”


  地面上，立香从岩壁下蹲着抬头看，她盯着天空中伊耶那美正在做的动作——矛身搅动混沌的样子每转一圈都在重新定义她以往对战过的一切宝具的印象。


  士郎站在她身后半步远，背靠树干。他的视线和立香拴在同一片被搅裂的天幕上。他把嘴张开了一点然后又合上，琥珀色的眸子在巨量信息涌入时微微收缩了一圈。


  “不，明显要比空想具现化的位格要高了——完全是从混沌之初进行创造啊。”


  “玛修也快到位了。”立香把枪托从膝盖上拿下来站起身，抖了抖蹲麻的小腿。她呼出一小截压缩过的气息：“准备，士郎——我们也不能输给她啊。”


  混沌之中先浮现出来的是熔岩。暗红色的光从黑底里透出来，稠厚如翻滚的铁水，每波熔岩浪头都由混沌底层的暗流推着翻起又沉下去。然后是黑色的煤炭——一块块光滑的黑色晶体在熔岩边缘凝成，棱角分明，表面被熔岩映出红光的网状裂痕。


  再次是石头和泥土——石头从煤炭之间挤出来时带着刚凝结的灰白色气泡；泥土成团裹上石面，黑赤交混的细密颗粒在半空中无风而聚。最后是盐巴——细小的白色晶体在泥土表面铺满天日，雪籽般从上向下洒下然后停止。


  伊耶那美在创造大地本身。'

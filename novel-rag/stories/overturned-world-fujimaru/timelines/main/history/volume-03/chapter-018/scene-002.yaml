content: '“休息。”立香歪了歪头，她看着玛修，把这份回避叠在自己脑子里——然后她把下巴微微抬起来。


  “我睡了多久。”


  “前辈睡了大概一天左右。”玛修犹豫着说道。


  立香深吸了一口气，胃里不饿，身子不沉。她盯着玛修的眼睛，把脸凑近过去：“如果我发现玛修骗我，那可有你好受的。”声音不大，但那份预告式的语调让玛修整个人往后缩了一拍。


  “前前前前辈？！”


  “好了，”立香拍了拍玛修的肩膀，把刚才逼近的距离收回，“现在带我去见士郎。”


  玛修顿了片刻转过身，轻声开口：“前辈跟我来。”她走出两步又回过头来看立香，嘴唇动了动——然后又把话咬住了。


  走了一段沉默的路，玛修忽然开口：“有个好消息，前辈。”


  “好消息？伊耶那美提前告诉我们圣杯的位置了？ ”立香看着玛修。


  “不是，是吉尔伽美什前来支援了。”玛修顿了顿。她的盾牌在行走中轻轻碰在肩甲上发出有规律的金属轻响。


  “虽然她是自主供魔就是了。”


  立香点了点头。接着她的步速慢了半拍，她的脑子走到某个岔口上卡了一下。


  “那么吉尔伽美什现在在哪呢。”


  “这个，”玛修的声音弱了下去，“在陪言峰前辈。她说了你醒了让我叫你。”


  立香看向玛修的侧脸，她没有继续问。


  玛修识趣地闭上了嘴巴。


  走廊在转过最后一根木柱后抵到一个房间的门前。门的上方有一块带着古巴比伦楔形文字的牌子，木头上刻的古代笔画被岁月磨圆了边角。


  牌子下面是日语的字——立香在微微停顿的步速里把那几个字读进了眼睛里。


  “进入请敲门。”


  立香深吸了一口气，吸气时感到胸腔被那股新填进来却不属于自己的力气胀了一点点。她抬手，指节在木门上轻轻磕了两下。


  “进。”女声从门内侧传来。


  立香毫不犹豫地推门而入。


  吉尔伽美什侧过身来。她穿着一身素灰的和服，不是平时战斗时裹在身上的红与金的甲胄。腰上系着浅一条的带子，袖口在手腕处叠了两圈布露出手背上的浅青血管。


  头发也没有束，散在肩头，金发在她扭身时被门外的光线打出一层微微的反光。她右手捏着的不是权杖也不是剑——是一方湿帕子，叠成三折，搁在床边的小案几上。


  “吉尔茜。”立香开口。


  吉尔伽美什把身子完全转过来，她说：“啊，我来了就是。”声音里的“我”用的是她自己平时绝不会用的小舌音，整个句子软了半个度，连她自己都听着别扭——然后她仰起脸，把那份柔软收进瞳孔里。


  “没事就好。”


  立香愣了愣：“你怎么了。”


  吉尔伽美什的嘴角往上挑了一下，那点弧度在顿了一拍后重新弯成她平时的幅度。


  “本王在收你们的烂摊子。”她说完把目光从立香脸上挪到床上，然后又很快挪回来，“既然你来了——就先由你照顾他吧。”


  “不过.......”她说道，没说后半句。


  立香没有接她的“不过”，她走到床沿上，然后看到了躺在床上的红发男人。


  “士郎怎么了。”立香低声问道。


  吉尔伽美什没有立刻回答。她把散落在床脚边的一个金色瓶子撩起来搁回案几上。瓶口半开着，里面的灵液已经彻底干了，瓶颈里残留着一点点凝结的暗色渣。


  “没死，现在在恢复。”她说话时没有看立香，反而把目光定在瓶子上：“大概要一段时间。他不容易死，但是恢复起来也很麻烦就是了。”


  立香把自己的问题吞回了胃底，她坐在床沿上，手放在膝盖上，看着士郎的睡脸。


  他额上搁着的那块湿布已经干了，边缘上翘了一圈小小的卷。


  吉尔伽美什在旁边沉默了片刻，然后开口：“把手给我。”


  立香顿了顿低下头，把自己的手伸过去。她的视线落到自己手背上的令咒时，才发现它已经变了——原本的三道令咒变成了一个圆在手腕处，一个十字形叠在圆的中央。两道图形都是淡红色的，边缘线上有细密得几乎看不清的笔划。


  吉尔伽美什伸手握住了她的手，她握着时不是捏手指——是把立香的整个手掌托在自己掌心上，手指从上往下轻轻划过了那道十字。


  “哦？”她的声音从喉咙里轻轻响了一拍，然后她把脸抬起来。“看样子已经完全掌握了。”


  “什么。”立香歪了歪头，“你说什么，吉尔茜。”


  吉尔伽美什没有放开她的手，转身用另一只手从旁边拉了一张木凳，凳脚在地板上蹭出两声闷响然后停住。她拉着立香在凳子上坐下，这才松开了她的手。


  “本王接下来要告诉你一些事情。”她收回自己的手搁在膝上交叠起来，“本王之前给你的让你驱动魔术的礼装名为——根源之涡。”


  立香看着她的脸。她的眼睛在外面转回来之后一直盯着吉尔伽美什的红眸。


  “根源之涡。”她把这三个字在嘴里嚼了一遍。“你这是什么意思，吉尔茜。”'

content: '祁荒把最后一口粥含在嘴里。含了两拍，然后喉口往里一收吞了下去。她低头瞥碗底，碗底躺着几根没进过勺子的草杆渣。她放下碗，用袖口不紧不慢地抿了抿嘴角：“哦——原来如此，我明白了。”


  立香一口接一口喝完自己碗里剩下的半碗木屑粥。每喝一口她就拿勺子再把碗底刮一圈，像是在确认这一次刮出来的和上一口是不是同一个味道。


  喝完之后她把空碗搁在脚边，抬起手背擦了下嘴角。屋外的村民还没走，有个嗓子很粗的男人隔着茅草墙朝里面喊了声什么，她没听清，但大概是在问吃没吃饱。


  她把背紧靠在土墙上，膝盖曲起来抱在怀里，然后她的视线划过士郎搁在地上的空碗。她盯着空碗看了好几秒，然后收了回来，然后抬眼看向士郎：


  “士郎，你是怎么做到面不改色把这一碗木屑粥喝完的？”


  士郎低下眼睛看她，她的橘发在油灯底下颜色变深了，有点像用久了的铜器，边缘还有几根翘起来粘着刚才刮碗时从手背上蹭上去的木屑渣子。他把手掌搁在她头顶，掌根贴着她的发旋慢慢揉了揉。


  她头顶的温度隔着他的掌心传过来，他开口道：“不想喝就算了，抓紧时间到天照金地再说。”


  “喂，不要揉我的脑袋。”立香把他的手从自己头顶上用两只手抓下来，攥着他的手腕把他手搁回他自己膝盖上，“我问你话呢。”


  “因为这些是感谢的食物。”士郎把手搁在膝盖上之后没有重新抬起来。他垂下眼睑看着她，脸上还是刚才喝完粥时那种平平淡淡的神情。“如果不接受，反而会让他们难受的。就和......怎么说呢？人情一样。”


  “你原来这么会的。”祁荒默默地把话从斜对面抛过来。


  士郎偏过头，“嗯？”


  祁荒把目光从他脸上移开。她低头看着自己手里的空碗，拇指在碗沿上沿着那道被烟垢填平的裂纹慢慢磨了个来回。“


  罢了罢了”她摇了摇头，把最后一口挂在碗底的汤汁仰头倒进嘴里。碗底最后那几根草杆渣顺着碗沿滑到她嘴角，她用拇指的指腹把它们拨进嘴里。


  玛修从刚才端碗到现在一口没碰，她把手里的碗往膝盖上又放稳了一点，碗沿在她膝头的护甲上磕出极轻的金石声。“祁荒小姐，你也能面不改色地喝完吗？你觉得怎么样？”


  祁荒先把碗搁在灶台边上，然后才放到脚边，她搁得离火膛近，她看向玛修，碗壁上残余的汤汁被灶膛里还没完全灭掉的文火烤出极细微的滋声。


  “嗯哼？我已经过了对食物的味道有所期待的时期了。”她把指腹上沾的草渣在道袍前襟上擦掉，擦完之后抬起眼看着玛修。眼角微微往下垂着，“这些食物是别人对我的回报——象征着别人对我们的需要，这不比任何东西都美味吗？”


  村正把碗搁在地上，然后她瞥了祁荒一眼：“这样啊，你是在品味这些人吗。”


  “人啊总得找点事情做的吧，村正小姐~”祁荒把名字结尾的颤音又多拖了半寸，她笑着开口道


  村正任由她看着，她盯着眼前这个穿着修道服的、笑起来眼角先下垂的女人，她皮笑肉不笑的开口道：“我自然是有目的才从天照金地出来的。我当然知道外面的情况，天照金地可比外面好得多，没目的我可不会离开那里。”


  “哦？能让我知道吗？”祁荒往前倾了倾身子。她倾过来的时候木地板在她膝盖下面发出闷响。


  “很抱歉啊~”村正把嘴角又往上勾了半寸。这次嘴角是真的在往上走，但她的眼眶下面那圈肌肉纹丝不动。“看见你这副模样我就觉得有点恶心。抱歉不能告诉你。你可以去问问你服侍过的男人，你朝他们吹吹枕边风估计真的会告诉你心里话~”


  “嗯哼？虽然如此嘛~那我好歹也是帮他们了是不是.......”祁荒用指尖轻轻点着自己的颧骨，笑着开口道


  “你做了什么呢，村正亲？”她把最后三个字从舌尖上弹出来。


  “你——”村正咬了牙。上下臼齿在咬合那一瞬间发出只有她自己能听到的摩擦声。她的嘴唇又动了一下，是个口型，然后她把嘴唇抿住了。


  “噗呼呼呼~等你想好了再告诉我吧~”祁荒站起身。起身时她的左手在墙面上拄了一下，长袖从腕口滑下来露出一小截前臂，然后马上被新落下的袖子重新盖住。她低头看着村正，笑意停留在眼角。


  立香一直在揉肚子，掌心贴在胃上慢慢地一圈一圈按下去。刚才那碗粥现在正在她胃里搅成一团又干又涩的泥，每一次揉都能感觉到胃壁在痉挛。


  她从墙角直起身子，把手从胃上拿下来，开口时声音比刚才喝粥时粗了半度：“你们两个——祁荒，村正既然说了要协助我们，你怎么能这样说她？而且我们所见的村正时间也很短，以后会发生什么都不好说，现在就着急挑衅搭档是不是不太好了。”'

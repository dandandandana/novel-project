content: '大戟扫过来的时候士郎已经提前做出了判断，他的上半身往后折了半寸，戟刃的刃尖擦着他颈窝前划过去，刃上没擦干净的血迹被风吹成一道暗色的细线。


  他从废墟上往后弹了一步，靴底落在碎瓦上，碎瓦往下塌了半指，他重新压稳了重心，手里的黑键还横在胸前没有松开。


  男人的大戟在挥出这一记之后没有追上来。那柄大戟被稳稳地收了回去，戟杆在他掌心里转了半圈，尾端的铁箍磕在石板上，咚的一声闷响，像是有谁在地下敲了一记木鱼。


  随后他单手合十，五指贴在胸前。那张被戟杆磨出老茧的手掌竖起来的时候，他的嘴唇动了——


  “佛本无相。”


  这四个字从他嘴里出来后没有落地，它们飘在半空中裂开了。每一个音节都碎成了一道手指那么宽的金色符文，符文在半空转了一圈，然后像被扳机扣响了一样朝着立香的方向射去。


  玛修的动作比那些符文快了一点，她在“佛”字还没念完的时候就已经把盾牌插进了面前的碎石堆里，盾面的金属边框撞进碎砖的缝隙，碎石被这股力道挤得往两边翻开。


  她把身体挡在立香前面，盾牌斜着往上倾，整个人缩在盾面后面的阴影里，只有一双眼睛从盾沿上露出来死死地盯着前方那些飞来的符文。金色的符文撞上盾面，声音不像金属碰撞，没有铛铛的脆响。每一道符文打上去的瞬间都像一块烫手的金箔被摔在冰面上，嘭的一声闷响之后符文就碎了。


  玛修的眼珠子跟着最后一颗粒子的光芒转了一下，嘴唇张开——


  “前辈？我该？”


  立香的目光越过玛修的肩膀，落在废墟对面那个男人身上。中年男人的僧袍袖子在挥完那一戟之后还没完全落下来，袖口被风鼓得翻卷，露出底下一截小臂，臂上的肌肉纹理被汗和灰尘填满了，看起来就像一块被晒干了的河床。


  他收戟，戟杆在右手里横撑了一下，然后被他重新握稳。立香在他的戟杆重新摆正之前开了口：


  “先撤回来，士郎。”


  她的声音不高不低，没有喊，像是在课堂上叫一个坐在后排的同学，但每一个字都像是提前在嘴里咬了一遍才吐出来，圆是圆，方是方，没有多余的气泡。


  士郎的后脚跟已经离了地。他正要往后跳，余光里忽然有什么东西动了。一个灰色的影子从左边的烟尘里渗出来。那影子起先混在倒塌的墙壁扬起的灰雾中，几乎看不出轮廓，然后灰雾被风撕开了一道缝，影子瞬间有了形状，是一件被风吹得笔直的灰色羽织，羽织底下裹着一个不算高挑的人，握着一柄长剑。


  千子村正从他身边一闪而过的时候士郎闻到了一股铁锈和锻冶场的煤灰混在一起的气味，那股气味只持续了不到半次呼吸就被她劈出去的那一剑卷走了。


  村正的剑和男人的大戟撞在一起。金铁交击的声音在东殿的废墟里炸开，那一炸的力量让整片废墟的空气都被这声响震得往里缩了一下。两个人脚下的碎石被冲击波推得往四处滚，滚到墙根上弹回来，又滚到被劈开的房梁底下堵住了。


  村正横剑挡住大戟的一瞬间她整个人被打退了五六步，靴底在碎石地上擦出两条浅沟，碎石被她的靴跟铲起来，在她小腿上弹了几下，弹得灰色羽织的衣角一跳一跳的。她退完之后没有停，脚后跟在地面上踩实了，膝盖弯了一下，利用重心把后退的力道卸掉，然后整个人又朝着男人冲了回去，羽织在身后被扯得鼓起来。


  砰！


  两个人的铁器第二次撞在一起。这次男人的力气大了不少。他握着大戟的手背上青筋一根一根地浮起来，从虎口一直蔓延到手腕。戟杆压上村正的太刀，刀身开始往下弯，弯起来的不是刀脊，是刀身中间那一小段被压得几乎要贴在村正自己的胸口上。


  技艺。


  村正的技艺明显不够格撑住这一戟的力道，她握着刀柄的手被震得虎口发麻，虎口上那层老茧被刀柄压得更深了，茧子底下的皮肤开始发红。


  男人的大戟往上一举，戟杆顺着太刀的刀脊往上滑，村正的刀也跟着往上走，她还没来得及抽刀，大戟上那根月牙形状的小枝已经从侧面勾住了她的刀尖。刀刃被牢牢卡在月牙和戟杆之间的那道缝里，抽不出来，也压不下去。


  “你？！”村正的声音传来，她不算高挑的身材踩在碎石堆里，双手举着太刀够不上男人的肩膀，被戟杆架在半空中，整个人的重心被往上提了半寸。


  她腾出一只脚，靴底朝着男人的腹部踹过去。男人用手挡住了她这一脚，手掌包住她的靴尖，指头一收，把她的小腿攥在掌心里。然后他把村正的身子往后一甩。


  村正的身体在空中划了一个很短的弧，灰色羽织被风灌得鼓起来，她的刀尖还挂在戟杆的月牙小枝上被甩脱了，脱开的瞬间刀身在半空转了半圈，刀刃上的反光亮了一下，然后连人带刀朝着后方的碎石堆倒飞出去。


  “什——士郎！先支援她！”'

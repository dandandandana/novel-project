content: '整片天空在吉尔伽美什和须佐之男命的交战中一层层被撕开。金光和雷光交替闪烁时将云的边缘切成了一道道锯齿形状的断痕。


  飓风从中间把两色光芒拧在了一起，拧过的地方空气被挤压然后朝外喷开，地面上残余的石板被气压一层层朝外掀翻。


  雷霆和光炮在更高的地方撞在一起，每一次碰撞都将那片天空的底色从深灰刷成惨白，再从惨白刷回深灰。


  须佐之男命只剩下一侧的身体。他的右侧躯体被之前切下来之后落在不远处的一块浮空碎石上，断口的边缘没有血——只有蓝白色的电弧在往外漏。


  那块被切下的右侧身子还是活的，肢体上的手指正自己蠕动着，一点一点朝他的左侧残躯爬来。须佐之男命没有看自己正在爬回来的另一半身体。


  他看向天空中的吉尔伽美什，身子微微一侧，刚好躲过了来自伊耶娜美从虚空中射出来的黄泉路。黑色的黄泉从他肩膀擦过去——只差半掌的距离，黄泉擦过的轨迹在他残躯的肩膀上留下了一道正在冒烟的焦痕。


  伊耶娜美歪了歪头，她浑身带着伤，左侧肋下的衣料碎了一大片，露出来的皮肤上横着一道还在往外渗血的裂口，颈侧的血顺着衣领往下淌。


  她的长矛从身侧一甩，矛刃划出半圈清冷的弧光，朝着须佐之男命的头砍去。


  须佐之男命身侧的雷电在矛刃落下之前的一瞬自己凝聚成形了——蓝白色的电弧从空气里跳出来，一柄长剑在他残躯的左手侧方从雷光中拉出完整的剑脊和剑刃。


  长剑架住了伊耶娜美劈来的矛刃，剑与矛碰撞的位置炸开一圈环形闪电。须佐之男命没有看伊耶娜美，他挥动着手中那柄飓风缭绕的太刀，把高空的雷暴和飓风一齐调动，朝空中那扇巨大的金色涟漪之门轰去。


  吉尔伽美什的状态也极度不好。她身上的金色甲胄在刚才被须佐之男命的闪电和飓风反复刮过后留下了密布的焦痕——焦痕从胸甲一直拉到裙甲，金色的铠甲在焦痕处被高温烧成了暗沉的棕黑色。


  她的宝具刚从金色涟漪中解放出真名朝须佐之男命砸去，就被须佐之男命调动过来的几道风暴在半途中层层拦截。


  风暴裹着宝具在空中打转，然后被雷暴从内部击碎，碎片的亮光在暴风眼里闪了一瞬就全灭了。


  “哼……”吉尔伽美什歪了歪脑袋。她嘴角勾起来的时候嘴唇上干裂的位置渗出了一丝血色。


  她笑了笑，举起了手中的EA。黑红色的魔力从剑身上朝外涌出，剑身在旋转时带起了一圈圈压缩到肉眼可见的风压。


  “斩裂天地的武器吗。很可惜，实在是过于古早了。”须佐之男命举起左侧的长剑。


  剑刃上裹着雷暴和飓风，雷暴的每一次闪烁都让剑身周围的空气发出碎裂的脆响。他一剑斩去。


  吉尔伽美什的EA轰出黑红色的魔力柱，整条光柱在射出时把沿途的空气全部推开，下半截天空被黑红的光映成了同色。须佐之男命的雷暴长剑与EA对撞在了一起——先是两道光柱在接触点朝两侧炸开一圈圆形的冲击波，然后EA的黑红色魔力开始被雷暴从剑尖朝后一层层地翻转。


  翻转的地方魔力碎成烟灰色的余烬，余烬在空中还没落下就被雷暴卷进去烧干净了。EA直接被须佐之男命的一剑压了回来。


  吉尔伽美什脚下的天舟在她被压退的瞬间自己载着她朝天空飞去。她把EA拐了个弯，黑红的魔力柱绕了半圈朝须佐之男继续轰去。


  “EA的神秘度竟然完全不是他的那柄剑的对手吗——而且是我的宝库里没有的宝具。”吉尔伽美什喃喃开口。


  她说话的时候手没有停下调整EA的角度，黑红光柱在须佐之男命身侧划过时擦出的风压把她的金发朝后吹散。


  “果然……”


  吉尔伽美什把EA丢到空中，剑在她掌心里转了一整圈之后从她指尖脱离，剑上一瞬间被刻满了密密麻麻的金色咒文。


  整片天空在同一秒内打开了一个巨大的门。紫红色的门在云层的边缘朝两侧缓缓撑开，门楣上流动着同色的光纹。


  门开之后，一个黑红色的巨大弩从其中浮现出来，弩身上每一处接榫的位置都亮着暗沉的金属反光。弩上的箭矢被架在发射槽里，箭头的位置正在往外漏着金色的碎芒。


  “马尔杜克。”她的声音在弩身完全浮出之后才落下来。


  马尔杜克：那支曾经射杀提亚马特的箭矢——被吉尔伽美什利用EA改造而成的弓弩锁在发射槽里。


  箭矢从弩上轰出去的瞬间，箭尖拖出的金光把整扇紫红色的门都映成了金底黑纹。然而须佐之男命只是单手持着天丛云，箭矢射到他身前时他一剑劈下。


  那一劈没有术式的痕迹，没有光影的延迟。金色的箭矢被天丛云从箭头正中间一刀两断。


  分成两半的箭身在断开后各自朝两侧偏飞出去，断口处的金光不是炸开的——是被剑刃上的雷暴一瞬间从内部吸干了。两截残箭在飞出去的路上碎成了一片正在朝下掉落的金色粉末。'

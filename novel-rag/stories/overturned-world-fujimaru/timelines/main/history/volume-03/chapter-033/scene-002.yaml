content: '“这种规格的宝具对你都没用啊。”吉尔伽美什喃喃道，声音平得和刚才念宝具名时一模一样。


  “不过已经够了。”


  黑色的黄泉从须佐之男命的身侧追来。黄泉从虚空中挤出来时无数条细密的黑色丝线从空间的裂缝里朝外钻。雷暴在黄泉涌来的路径上炸了几圈之后被丝线从内部一根根地吞掉了。


  每一根雷弧被吞掉时都在原地留下了一声被压低之后掐断的嗡鸣。须佐之男命直接被黄泉死死地缠住了——黑色的丝线从他的残躯边缘一圈圈绕上去，缠到肩膀和腿根时收紧，收紧的地方他的身体边缘开始往外冒着被黄泉腐蚀出来的细微银雾。


  “结束了。”


  伊耶娜美直接朝一侧让开，她收矛时矛刃在空中划了一道清冷的回弧，脚下的黄泉轨迹在她后撤时自己缩回了虚空中。


  须佐之男命低下头。黄泉缠住了他最后的挣扎，他的视线穿过高空的残云和正在散去的雷暴——看见了地面上玛修架着的黑色巨炮。


  炮口朝上。炮管内侧的纹路正在一层层地亮起，从底座朝炮口方向逐列推进。纹路亮到炮口边缘时整根炮管嗡了一下，嗡声从炮身传导到地面，她脚边的碎石在同一秒内全部跳了起来。


  “迦勒底之刃。”


  巨炮一炮轰出。


  须佐之男命被黑光柱吞进去的那一刻他判断出了这一炮并没有伊耶那美宝具的强度。


  但他已经没法再躲了。


  他直直地吃下了这发炮击。他的身体轮廓在吃下这发宝具后从边缘开始朝内陷落。他静静地看向地面。


  “那是什么？”


  须佐之男命的声音传来。他的残躯正在从内部收缩——胸口的骨架在黑光中现出了模糊的弯曲轮廓然后被进一步压碎。


  但他的眼睛还在动。他的视线从地面上的黑炮挪到了空中的吉尔伽美什身上。


  “就算是那个金闪闪的人外用出来的各式各样的宝具都没能让我这样惊讶。”他看向吉尔伽美什开口道。他说话时被光柱冲碎的音节在空气里散成了一道道短促的余颤。


  “礼装罢了。”吉尔伽美什淡淡地开口。她站在天舟上的姿势和开战前没什么两样，一只手垂在身侧，另一只手仍握着刚从虚空中收回的EA的剑柄。


  “很有趣的设计——如果——”须佐之男命喃喃道。他的身体在黑光中越缩越小，“只是很可惜，你们来得太晚了。”


  他的身子开始整体坍塌下去。从双肩到腰侧再到腿根，轮廓一层层地朝内部陷落，陷落的地方不是碎成碎片——是被黑光压缩之后直接分解成了最细的雾。


  “如果早个两万年——”


  他的话在这几个字被彻底吞进光柱时结束。须佐之男命的整个躯体在黑光柱中坍塌到最后一点轮廓，然后炸成了一片正在朝上飘逝的云雾。


  云白得没有杂质。迦勒底之刃的黑色光柱在穿过这片白云之后自己开始收窄，最后在天空的尽头消失成了一道极淡的灰色细线。


  雷暴停了。高


  “早个两万年？”吉尔伽美什喃喃道，“什么意思？”


  吉尔伽美什顿了好一阵。她站在天舟上的姿势还没变，然后她直接吐出来了一口血。


  血从她唇边淌下来时没有她预想的那么多，但颜色比预期的更浓。她喘着气，手扶在膝盖上撑住自己正在卸力的身体，金发从肩膀一侧垂下来遮住了半边脸，露出来的那一侧眼角被刚才硬憋回去的血气逼得微微皱缩着。


  她抬起眼，看向一旁架着黑色火焰从主殿方向飞来的千子村正和言峰士郎，以及被士郎搂在怀里的藤丸立香。


  黑炎从高空的暗色云层中划开一道整齐的轨迹。村正率先从黑炎上踩到地面——她落地的位置刚好是废墟上一块被横翻过来的石板，鞋底踩实的时候石板边缘压碎了底下松散的碎渣。士郎随之落下，搂着立香的那只手在落地时扶了一下她的腰侧帮她稳住重心。


  立香从士郎怀里探出头来。她先看了一眼正扶着膝盖咳血的吉尔伽美什，再看了一眼浑身带伤的伊耶那美，嘴巴张开之后没有先关心谁，而是用一种把紧张和调侃搅在一起的口吻开了口。


  “啊啊，你们这里也结束了——啊嘞？吉尔茜你被打得这么惨啊。”


  “你就不能先慰问一句吗。”吉尔伽美什抹掉嘴角的血，抬起眼皮瞪了她一下。


  立香没有接这句。她从士郎怀里跳到地上，落脚时石板上被她踩掉了几颗松动的碎石。她看着伊耶那美身上还在淌血的伤口顿了一下，然后让自己的语气收敛了半分。


  “伊耶娜美——呃你看着伤的也不轻。不过月读命金地交给你了。”她说到这停了半秒，又补上后半句，“但是，我有点事情要问你。”


  吉尔伽美什在这时咳了一声，她从扶膝的姿势直起来，嘴唇上残余的血渍被她说出的这句话吹成了细碎的血点。


  “立香，刚才须佐之男命死之前跟我说，两万年前是一个时间节点。他说，如果我们能在两万年前来——”


  “人类史有两万年吗？”立香低声问道，“我知道了。还有别的信息吗？”'

content: '士郎背心一紧。他感受到了一个视线从斜后方投了过来。视线的落点在他的后脑勺和肩胛骨之间，他在心里快速过了一遍刚才自己说过的话——貌似并没有得罪御主，也没有说什么不该说的。


  “有机会再说吧。”士郎开口了。他说话时手上的动作没停。


  视线消失了，消失的速度和它投过来时一样快，像被风突然盖住的一盏烛火。


  吉尔伽美什忽然笑了。


  “本王能有你这样的儿子也算是幸运了。虽然本王之前算不上合格的母亲，但是现在本王已经在努力弥补了。”


  “我知道了。”士郎给她上好最后一块药膏。他拧回药膏的盖子时抬眼看了她一下， “有点意思啊这个家伙。如果真的和你说的一样的话，那么他随便的雷电都超过A++对城的宝具了。”


  “月读命金地的法相只强不弱吧——本王不至于你来怜悯。”吉尔伽美什说着，她把手指从刚才被药膏涂过的地方收回。然后她笑了笑——这次嘴角是真的弯起来了：


  “不过你能关心本王本王还是很开心的。”


  士郎顿了顿，他把药膏放回吉尔伽美什身侧的金色涟漪中，然后说了一句声音比前面都低的话。


  “好了卡桑。接下来该你给我上药了。”


  吉尔伽美什没理他。她从宝库里取出另一个药物——这个比刚才那个药膏更小，瓶身的瓷面上画着几道排列成环的金色咒文。


  她把药罐在掌心里转了一下，缓缓开口：


  “如果是之前本王会亲自来，但是现在的话——”


  “大胜肯定要有庆功宴，晚上本王要吃烤乳猪就是了。”吉尔伽美什说着，随后她把药罐朝旁边一丢。药罐在空中划了一道短促的抛物线，被不知道何时走了过来的那个人接住了。


  士郎的心眼在这一瞬报警了，他快速扫描了对方出现的位置，推算距离与时间，然后脑袋里只剩下一个想法。


  【什么时候——为什么我没有感受到她过来了——】


  立香裹着士郎那件自带气息遮掩的白风衣礼装站在他身后两步的位置。风衣的下摆还在微微朝外飘，她接过药罐的时候手指在瓷瓶上扣了一下，发出一声很轻的瓷响。


  立香接过药物之后对着吉尔伽美什郑重地点了一下头。那是一个正经到有些突兀的道谢——点头的幅度是她跟伊耶那美谈同盟时用过的开会式点头。


  “你受伤了？”


  士郎顿了顿。他的视线在她手上的药罐上停了一瞬，然后挪回她的脸上。“一点小伤。”


  立香瞪了他一下。


  她接着问道：“你是怎么做到让我看不见的？”


  “一点小魔术。”


  “为什么？”


  “不想看你担心的脸——不好看。”


  “上衣。”她的声音在这两个字上忽然没了起伏。


  “给我，我自己来就好了。”士郎的琥珀色眸子带着一些无奈，他伸出手去接药罐，手指还没碰到瓶身就被她的下一句话挡了回去。


  “不然我就给你扯掉了，而且我还有一道令咒。”


  “令咒要省着来。”士郎的语气弱了下来。


  “明天就又有三道了。”她的声音依然不高，但每个字的间距明显比刚才短了，“士郎，我不想再说了。”


  他看着她，她的表情被风衣领口的阴影遮了一部分，但他能看到她的下巴在微微朝上抬。


  那是她在不想让步的时候会用的角度。


  “有点难以入目，你忍着点。或者让玛修......”


  “你说什么？”立香气笑了，她的笑声不是开心的那种笑——是从嘴巴里呵出一口气然后嘴角朝下扯了一下的那种。


  她把药罐在掌心里换了个位置：“快点。趁我现在心情还不错不想发火。”


  士郎将上衣脱下。风衣顺着他的肩膀朝下滑，滑过肩胛骨时有一小块布料被夹住了——不是被皮肤夹住，是那块位置的伤口渗出液已经把衣料和烧伤边缘黏在了一起。


  他没有停，直接往下扯了一下。布和皮肉分离时发出了一声被压到很低的撕裂声，然后整件衣服被褪了下来。他随手把底衣朝旁边的石板上放下。


  立香看见了士郎背上的伤。


  烧伤从他右侧的肩胛骨开始朝下蔓延到腰侧，翻开来的皮肉在最外沿卷成了一圈褐红色的干痂，痂的内侧是被高温烧过之后还在往下渗清晰血珠的嫩肉层。


  血珠嵌在肉纹里，每一次他呼吸的时候血珠就会在嫩肉上微微朝外扩一圈然后又被表面张力拉回去。


  更里面的位置，肉荚的边缘还在自己慢慢地消失着——不是愈合，是正在朝外围主动剥离。


  剥离之后露出来的新伤面比原来的伤面更大、更红、更湿。


  立香看着这处伤口。她的视线在伤面上停了很久。伤口的边缘没有停——烧坏的组织边缘正在她的注视下继续朝外扩大。


  扩大的速度不快，但她能看见边缘上新剥出来的嫩肉正在一粒一粒地被自己的血珠覆盖。


  “跟我说是为什么会这样。”她开口时声音是从喉咙后半截挤出来的。'

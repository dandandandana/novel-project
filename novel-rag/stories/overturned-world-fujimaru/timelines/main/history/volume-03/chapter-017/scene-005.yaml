content: '一切都消失了。周遭的景象化作了虚无——村子、矮桌、碎裂的碗盏、大头兵的手套、孩子被举起的身体——全部化作了从底部翻涌上来的白光。


  立香嘴里的那团东西化作了点点暖意涌入了她的身子。白米从固态融成液态，然后液态融成气流，然后气流顺着她的食管往下滑。


  正当一切都如同星光般下落的时候，却突然被截止住了。


  立香睁开眼睛。


  她看到了洁白的天花板。天花板上镶着的荧光灯管没有闪，只是一直亮着。光打在白色的墙壁上再反弹回来，把整个房间映成一片白得有点发灰的底色。


  【什……】


  她摸了摸身上的病号服。浅蓝色的条纹棉布，衣领处的标签被剪掉了只留下极小的线头。


  身上盖着的洁白的被子，边角上被熨斗烫出一条笔直的线，触感无比的真实——她攥住被子的一个角，把布料在手心里捏住然后松开，棉布上的褶皱在她松开后慢慢弹了回去。


  她挣扎了半天，张开嘴巴。没事，舌头能动了，嘴里那团东西不见了。


  “啊……这是？”


  她抿了一口一旁水杯里的水，水是凉的，顺着喉咙滑下去时那份凉意从食管一路渗到胃底，然后她站起身子。


  脚底板踩在病房的地板上时感觉到那层薄薄的灰尘被自己的脚掌擦了一下。


  “好了吗？”


  女人的声音传来，身着便装的金发红眸的女人站在一边——不是那副高高在上的姿态，是她所记得的，以及被日常磨掉了所有仪式感的吉尔伽美什。


  她手里捏着一个小包，包的拉链头在灯光下闪了闪。粉色头发的少女站在另一边，手里抱着刚从贩卖机里买来的罐装咖啡。


  立香下床，看向二人：“这里是哪里？”


  “你是脑子烧傻了？立香？这样可不能做我的弟子哦。”吉尔伽美什开口，她把头微微往左偏了一下，红眸里的光从睫毛底下往上挑。“这里是京都国立医院。你和玛修今天有公修课，还不快去。”


  【大学？】


  立香昏昏沉沉地下床，换好了衣服。


  玛修开车，吉尔伽美什坐在副驾驶上翻着手机打发时间。车窗外东京的街道一排排往后退。三人回到了公寓。


  立香推开门走了进去，她看到了散落的垃圾袋——是那种便利店的塑胶袋，袋口被胡乱打了个结，里面装着吃了一半的三明治残骸。随处乱丢的衣服和鞋子——一件毛衣搭在沙发椅背上，一只袜子踩在桌子底下。


  【家……】


  一切都是那么的美好，那么的……真实。


  但……


  “回来了，晚上想吃什么？”穿着修道服裹着围裙的言峰士郎从厨房拐角处走了过来。围裙上沾着几点刚炸过东西时溅上去的油斑，手里还捏着一把木锅铲。


  立香看见他，眼眶猛地涌出泪水。


  “怎么了？”士郎歪头开口。


  “没事……”立香擦了擦眼泪，把手背在眼睑上摁了一下，“病没好全……”


  “晚上吃法餐。”吉尔伽美什在客厅那边开口，她的话从空气中直接穿过几个人的站位落在厨房方向。


  “好的妈，稍等吧。你们把你们弄得烂摊子收拾一下。”士郎扔下这句话转身回了厨房。


  “言峰前辈，收到了……”玛修从地上捡起那只踩在桌下的袜子把它叠好搁在洗衣篮里。


  吉尔伽美什拿起扔在沙发上的一个遥控器，看向立香：“一会记得跟奥尔加玛丽和达芬奇打个电话说你出院了。”


  立香擦干眼泪，她把那只擦泪的手在裤子上蹭了蹭，然后慢慢地走向厨房。她在厨房门口停下了。


  门框的木质边缘在她手掌旁边，漆面已经被蹭掉了几小块，露出底下更浅的木色。她站在门口，看见了正在忙碌的言峰士郎——他的背对着她，锅铲在平底锅上把几片洋葱翻了个面。


  “你没什么想跟我说的吗？”她开口。


  他的肩膀在翻铲时轻轻晃了一下然后在落铲时重新落回原位，他轻声开口道：“有什么好说的。”


  “这里是假的。”


  “真真假假——又如何分辨呢？你不怕又是黄粱一梦？”言峰士郎歪过头来笑着。那个笑和他刚才问她“怎么了”时不太一样——这个笑底下有一层东西，是他已经知道了一切只是在等她开口。


  “如果是，你要醒来面对现实吗？”


  “你不会的。”他自言自语道。然后他把头转回去继续翻他的洋葱，“藤丸立香，这里就够好了。”


  “如果我说会呢？”立香开口，她把那只握在门框上的手收了回来，垂在自己身侧。掌心里有汗。


  士郎明显愣了愣，他翻铲的动作停了一拍——锅铲在锅底贴着但没有动，然后他把铲子在锅沿上轻轻磕了两下。


  然后他无奈地笑着说道：“别开玩笑了。这里多好，外面的世界你做不到……”


  “士郎从来不会否定我！”立香一挥手。挥手时她的手臂从上往下划过空气，把这句宣言钉在厨房门口这不到三尺宽的空间里。


  “他只会一点点纠正我，然后——做我最坚强的后盾！”她把拳头攥紧，指甲抵在掌心留下几个极浅的印。'

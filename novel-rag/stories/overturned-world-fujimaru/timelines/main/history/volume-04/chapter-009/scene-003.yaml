content: '是一尊巨大到没有任何人能在脑子里完整装下长宽高的佛影。


  它盘坐在天空之上，眉眼低垂，嘴角没有上扬，也没有下沉。金色的手掌从云端往下徐徐翻转，那道金光从掌心顺着天空的曲面向下流淌。


  正在欢呼的人不欢呼了。


  工人把工具搁在脚边。


  学者把手里的记录板放在桌上。


  孩子们仰着脑袋，看向那个把整片天空占走的金色影子。


  屏幕上的字写得很短。


  “第一次接触。”


  “弥勒降临。”


  村正把眉头往鼻梁上一压。


  “它没有直接动手？”


  “没有。”


  士郎把视线从佛影的掌缘往画布里再推进一层。


  “看样子，它选择了对话。”


  画面继续播放。


  弥勒没有毁掉探测器，没有掀翻城市，也没有命令任何一个人跪下。


  它只是把星空之外的寒冷、辐射、孤独、资源枯竭，以及所有远航中可能撞上的死法，一件件摊开给人类看。


  一笔一笔地描。


  它说，星空之外没有救赎。


  离开大地，会带来无尽痛苦。


  文明的终点不是远航，而是圆满。


  它说，人类不需要去那里。


  地上可以变成净土。


  留在这里，也是一种幸福。


  然后，第一批信徒从画框边缘走进佛光。


  立香看得很清楚。


  那些人不蠢。


  信徒里有老工人，有医生，有政治家，也有儿子死在空难里的航天工程师。


  他们信弥勒，不是因为不懂星空。


  恰恰相反，他们太懂了。


  他们觉得弥勒是对的。


  人类已经把地上堆满了，为什么还要把孩子往黑暗里扔？


  为什么一定要走？


  为什么不能停？


  “这就麻烦了。”


  士郎没有把视线从画面上移开。他的声音在喉咙里被压得很扁。


  “嗯。”


  立香把头往他的方向微微一歪，用同样的音量接住他。


  “因为他们不是坏人。”


  玛修看着画里那些人在佛光下把膝盖压在地上。她的嘴唇翕动了两次，最后只有一小截被自己掐得很轻的气，从牙缝里漏出来。


  “他们只是……害怕。”


  “也可能是爱。”


  立香把手指往屏幕方向轻轻一伸，很快又收回来，垂在身侧。


  她把脑袋往玛修那边转了小半圈，解释道：


  “他们爱人类，所以不希望人类再去受苦。弥勒也是这样。”


  她把嘴唇往中间微微抿了一瞬，又松开。


  “问题在于，爱有时候也会变成锁链。”


  屏幕继续亮下去。


  新的壁画里，信徒们走进议会，走进学校，走进炉心管理机构。


  他们不禁止科学，也不反对富足。那一段时间里，他们比谁都有热情把民生往上拉。


  免费的医疗体系。


  用炉心热能扩建到每个街区的粮食工厂。


  被市场丢在墙角不管的贫困区，也被他们用额外配额一个个捡起来。


  他们把工伤和债务奴役，从法律本里拆得干干净净。


  他们在那个年代有个名字。


  地上净土派。


  他们让很多人的日子真的变好了。


  但与此同时，另一群人也开始站上街道。


  他们不是不珍惜地上的幸福。


  他们只是不觉得，家里暖和，就应该把门锁上。


  星空派。


  这群人站在壁画的另一边。两个派别在很长时间里没有互相仇视。他们一起推翻资本共同体，一起建立公共文明。


  那个时代，所有人都能念书。


  所有人都能看病。


  所有人都不必害怕饥饿、寒冷、疾病和无家可归。


  生产资料从私人手里被拿回公共系统。知识被完全铺开。魔力炉心也从任何一个集团手里被拽走。


  人类第一次拥有了和自身生产力相匹配的文明形态。


  桌上亮起一片明亮的字体。


  “第三跃迁纪。”


  “新生文明成立。”


  “人类内部大规模压迫结构消失。”


  “地上净土短暂达成。”


  村正看着那几个字，忽然把扛刀的手往肩头上一顶，咧嘴笑了一声。


  “这不是挺好吗？”


  没有人回答。


  立香把撑着下巴的手放下来。


  士郎把手插在风衣口袋里，没有往外拿。


  玛修低着头。


  因为谁都知道，如果故事在这里结束，EPOH就不会在这地下躺着。


  下一幅壁画里，星空派建造了第一座真正的轨道升降塔。


  那座塔从大地上笔直刺向天空，把云层捅破。塔身外侧闪着一条条银蓝色的光。站在塔下的人仰头看它时，脖子几乎都要仰断。


  孩子们把折好的纸星星往上抛。


  老人坐在轮椅上，仰头看着那条通往天外的白光。


  而弥勒信徒沉默地站在人群之外。


  不欢呼。


  不举牌子。


  只是看着。


  后来，议会开始争论。


  把资源全部投进星际航行，到底行不行。


  人类究竟该不该脱离弥勒所说的地上净土。


  屏幕上没有声音，但立香看见无数人的嘴巴在张合。有人拍桌，有人把脸埋在死去亲人的照片里，也有人举着第一代探测器从宇宙传回来的星图。


  信徒说，远航会重新制造牺牲。


  星空派说，拒绝远航才是真正杀死人类的未来。


  信徒说，人类已经有幸福了。


  星空派说，幸福不该以停止为代价。


  信徒说，地球是家。'

content: '一切恢复原样。他比对了一下星系外缘的第二颗脉冲星的频率，和原来的一千六百赫兹一致。然后他把手放下来了。


  弥勒的身体在修复星系的过程中已经愈合得差不多了。腹侧裂口自己收拢了，肠子归回原位，金色血液不再往外涌出。他法袍上那些半干的金色血渍没消失——那是已经离开他身体的，不在权能的修复对象里。


  在做完这一切之后，弥勒才朝地球飞回去。他的速度不快——星系刚重建完，他飞过新生恒星和新生行星时各看了它们一眼，像是在检查刚垒好的土墙有没有被漏放的砖。


  他降落的时候地表上已经有一群新生的人类围在火堆边上。柴是新砍的，火是他们用自己的手钻出来的。弥勒着地时踩碎了一截枯枝，火堆旁边有个人把头转过来看了他一眼但什么也没说，然后继续拿着手里的干枝逗火。


  弥勒没停。他朝星之内海的方向奔去。星之内海的入口在他穿过的泥土和地壳深处朝他拉开——他看见了整个战舰的遗骸。那艘他曾经庇护的人类用最后一块钢板建造出来的巨舰现在就倒插在星之内海的虚境平面上，舰首完全粉碎，舰桥只剩光秃秃的骨架。


  弥勒最无法容忍的做法——E.P.O.H.O.N.S.I.E.R.E.H.T在最后关头做了一件事情。巨舰的残骸尾部还有最后几段推进器残留着撞击瞬间产生的极高热量带来的金属融痕。AI把整艘舰撞向地球。


  弥勒已经披上了新的白色长袍。他站在舰艇残骸前，他的脚边是一块从舰桥上被击落之后斜插进虚境地面的大屏幕面板。屏幕背面朝上，数据线全断。


  “你明明是人类的AI，为什么要做这种事情。”弥勒开口。他的声音没有高声，也没有压低的痕迹——是中正的，平静的，是在问一个和他相处了太久太多次轮回的旧识。


  舰艇残骸内部忽然传来扬声器被激活的电流啸叫。不是从舰桥方向——是从更深处，从被弯折的龙骨和被击穿的动力炉夹层之间，声音像被残骸的内壁弹了几轮才漏出来。


  “你为什么，想要毁灭地球。”


  “这个愿望是错的。”E.P.O.H.O.N.S.I.E.R.E.H.T的合成音从三个不同位置的残损扬声器里同时渗出来，三个孔的音质都不同——左前方的那个最清晰，右后方那个已经破音了，最深处那个只剩下气声。


  “在这里，启航星空的愿望——是错的。”它的声音像被自己的扩音电路卡住，每吞一个词中间就暂停半拍，然后硬把下一个词扛过来。“是会让他们赴死，让他们彻底毁灭的理想。我们证实过。一次又一次。”


  “你已经有了思维。”弥勒把脸朝残骸的方向偏了一点。他的视线没有聚焦在哪一个扬声器孔上，而是在整座残骸的轮廓线上扫了一遍。“你为什么不逃往星空呢。你明明已经变成一个独立的存在了。”


  扬声器没有立刻回应，残骸中间某处传出一声电路烧断的咔嚓，然后AI重新开口。


  “我是E.P.O.H.O.N.S.I.E.R.E.H.T——终末人理圆满装置。是人类的希望。”它在自己的全名上停顿了极其微小的间隙，没有解释，只是说出。“我要为他们开辟未来。”


  弥勒的眼中没有分毫的感情。他看战舰残骸的视线像在检查一件还没修理完的器物。


  “未来。你所理解的未来是什么。”


  E.P.O.H.O.N.S.I.E.R.E.H.T的扬声器在经过这一次提问之后沉默了比先前任何一次都要长得多的时间。


  然后从最深处那个只剩气声的扬声器孔里，把它的问题从扩音电路最后一段还能工作的路径上推了出来。


  “未来佛——你考虑过给他们未来吗。”它的声音已经沙了，扬声器膜片上可能被融渣烫出了孔，摩擦声中混着空气顶进金属片缝隙的尾响，“想要未来如果一定会变成和菩提座下的菩萨和佛一样的结局的话，那还是不要来了好。不要添加无意义的死亡了。”


  弥勒把头往上抬了一点。


  “终末人理圆满装置——你想要的未来是什么。”


  扬声器的声音一点点朝沙哑的尽头滑过去。不是音量在下降——是扬声器膜片正在被电路板上最后几组还能运转的放大器硬推着，边缘裂纹被推得越来越宽。


  “未完之事。”AI把这四个字从自己核心存储器最深层往扬声器方向推送——每经过一段损毁的数据总线就掉一个字尾，到最后只剩那几个字完整地走出扬声器喇叭。


  “再无来者。”


  扬声器的膜片在最后一个音节上被自己彻底震碎了。碎得不响，只是一声极轻极短像纸被揉成团的咔嚓。


  然后残骸重新安静下来，弥勒站在大屏幕被击落的面板边上，他的新制法袍的袍角被残骸余热烘上来的一小股气流轻轻撩了一下然后垂下去。'

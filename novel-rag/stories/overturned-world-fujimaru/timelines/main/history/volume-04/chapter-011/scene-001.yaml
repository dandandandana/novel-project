content: '“首先你要认识的，是这个战场。”


  藤丸立香抬手指向舰桥尽头。终末人理圆满装置配合她点亮了残存的屏幕，伊耶那岐金地的立体图从操作台上升起。大半城区已经被金色覆盖，外缘仍能看出街道与建筑的轮廓，越往中心，地形越接近一座层层抬高的佛坛。


  “地表是伊耶那岐金地，正下方是我们所在的主炮阵地。弥勒占据上面，却没有发现这里，至少它还没有采取行动。”立香看向终末人理圆满装置，“我说得对吗？”


  “后一项无法确认。”


  “那就按最坏情况处理。它知道，只是暂时不打算管。”


  杨浞站到立体图前，没有马上询问弥勒的能力。他先看城区，再看地下炮管的走向，最后停在连接两者的几条细线上。


  “这些是道路？”


  “曾经是。”终末人理圆满装置回答，“上层结构改造后，七条通道只剩两条能够使用。其中一条就在主炮右舷，出口通向伊耶那岐金地西南侧。另一条通向月读命金地。”


  “炮打出去时，这两条路还在吗？”


  “无法保证。”


  “那就不能把退路算进去。”


  杨浞只问了三句，便把视线从地图上收回。立香发现他没有看那枚代表弥勒的巨大金色标记，反而把所有可能供人进入、撤离、隐蔽的细线都记了一遍。


  “蜀帝，你不问敌人有多强？”


  这是他在她追问身份时给出的称呼。东方的帝王，蜀地之主。除此以外，他不打算再说。方才召唤阵里的真名已经落过地，立香没有在其他人面前重提，只把那个过于醒目的名字收进契约里。


  “强到需要你们把一门埋在地底的炮挖出来，又要临阵召本王。”杨浞说，“已经够了。强弱是交手时才有用的东西，路得现在就看。”


  玛修听完，立刻将两条通道标进自己的记录仪。士郎则绕过投影，走到舰桥右侧一排彻底熄灭的控制台旁。他掀开变形的盖板，下面的线缆全被烧成了黑色，只有一条拇指粗的导管还亮着。


  “主炮需要外部校准吗？”


  “需要。”终末人理圆满装置说，“主炮发射前，必须由地表信标确定弥勒降格后的位置。信标只能人工放置。”


  “谁去？”


  “我。”


  立香和终末人理圆满装置同时开口。


  士郎回头看立香。她已经把地图上那条通往西南侧的线路放大，开始计算从出口到预定落点的距离。


  “你要负责降格。”士郎说。


  “所以信标才该由我放。我能确认降格完成的瞬间，也能修正炮击坐标。”


  “这两个任务绑在一个人身上，任何一个出问题都会一起失败。”


  “分给别人就会多一层通信延迟。”


  “那也比你同时站在弥勒面前、施术、校准主炮，再顺便挨它一下强。”


  “我没说要顺便挨一下。”


  “你每次都没说。”


  立香把地图缩回原来的大小。她看了士郎两秒，决定暂时不和他争这个。


  “信标人选留到完整情报出来以后再定。终末人理圆满装置，还有什么限制，一次说完。”


  “炮击必须在弥勒被压至三维后的十二秒内完成。超过十二秒，弥勒会重新建立高维映射。主炮穿透防御后，创造之禊祓必须立刻启动，否则创口会闭合。”


  立香在地图上写下两个数字：十二秒，零容错。


  “创造之禊祓目前在哪里？”


  “伊耶那岐金地最深层。它被关闭了。”


  “谁关的？”


  终末人理圆满装置没有回答。


  舰桥里的屏幕依次暗下去，只剩主炮外那一圈幽蓝光箍仍在运行。立香没有催促。AI知道答案，也知道他们能从沉默里得到什么。


  “好。”她删掉地图上的撤退路线，“我们按照被人等着开炮来准备。”


  杨浞忽然笑了一声。


  “本王喜欢你这句话。”


  “一般人听见这种判断不会喜欢。”玛修说。


  “一般人也不会在这种地方摆一门炮。”


  “那倒是。”


  舰桥后方传来门锁解除的声响。终末人理圆满装置打开了通往月读命金地的通道，长廊里的引导灯逐级亮起。它没有为刚才的沉默解释，只告诉他们，地表时间已经过去了九个小时。


  “九个小时？”立香转头，“我们下来时没有这么久。”


  “星之内海与地表的时间并不完全同步。通道正在变得不稳定，我建议你们立即离开。”


  立香记下这条新限制。她让玛修走在前面，自己留到最后，直到其他人全部进入通道才转身。


  “终末人理圆满装置。”


  “我在。”


  “你关掉过创造之禊祓吗？”


  “没有。”


  “伊耶娜美呢？”


  蓝色人影没有出现，舰桥的扬声器却在她头顶给出了回答。


  “她没有权限。”


  “那就剩下弥勒，或者制造你的人。”


  “也可能是创造之禊祓自己。”


  立香停在门内。


  “一个装置自己选择关闭？”


  “人类制造我们的时候，总喜欢留下选择。”'

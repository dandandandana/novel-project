content: '终末人理圆满装置在说话之前，模拟人类嘴唇位置的蓝色投影边缘先轻轻跳了一次。


  那个笑还挂在它脸上：“是。”


  “我们有办法让他无法使用五大法。”


  立香的脑子没有立刻产生一个完整的念头。


  她整个人往前倾了小半步，橘色的马尾从后肩滑到颈侧。嘴唇启开后她说：“怎么做。”


  终末人理圆满装置的蓝色投影在原地定住了一次呼吸的时间。那具人形的外轮廓从头顶往脚底快速闪了一遍光谱，然后收缩回原态：“这就和弥勒的诞生有一些关系了。”


  它把那句话推到空中之后又停住，把下一段压在自己身体里多磨了一次。


  “思潮诞生。”AI的合成音在这四个字上落得很轻，“你要想知道这件事情的话——”它的声音在这里忽然减低半度。那种降低不属于技术调制，属于记忆源头本身往深处拽了一下，“这个世界里最有意思的就是如此。远古时期，伊耶那岐重塑了世界之后，神明并不爱新生的人类，把人类当作玩物玩弄。”


  “或者说，爱着人类的神已经离去了，死在了和游星尖兵的战争里。”AI把检索状态接进自己的语调之中，然后它把脸微微往立香的方向调整了角度。


  “而人类渴望着自己的幸福，希望着自己的世界能被人所救——”它在这一段末尾的停顿拖得比前面任何一次都久，“——由于人的思潮而诞生的救世主就是弥勒。”


  站立的蓝色人形说这句话时整个投影没有动。只有嘴部那个模拟肌肉还在随着字句流转。


  立香在听到“思潮”两个字之后就懂了，她把刚才AI说的那段话和自己在上一轮推导出来的一切立刻钉在了一起：“按照你说的——思潮诞生，那么我现在就明白了。”她把手从身侧抬起来在身前利落地一劈，像是在切开一条绕路的话柄。然后她抬起眼睛看进AI那两团模拟瞳孔的蓝光：


  “献身：就是将人的意识上传到AI吧。人的思潮消失了，那么就会削弱弥勒的战力，是吗。”


  她的下巴在说完最后一个字时微微朝上抬了一线。这个姿势不像是在求问，像是已经把答案握在手心里了，只等对面点头。


  站在一旁的祁荒把右手那串紫木佛珠在掌心轻轻抖了一下。紫木珠子彼此间碰撞带出一串轻密的响声。


  “理论上来说......”她把语调拉开，末尾往上牵着走了半拍，“失去了人的思潮的弥勒，本质上是没有那么强的。”


  立香没有转脸去看她。她把眉梢往眉心方向压了不到半寸，然后直接从喉咙里甩出一个字。


  “所以？”


  祁荒被她这一声怼在脸上，倒也不恼。她把佛珠在食指上转出一圈，再停住。“你想说什么——祁荒？”


  立香现在转过头来了。她下巴微微一抬，把指向又从祁荒身上拽回自己这边。“我问你想说什么。”


  祁荒叹了口气：“我现在可是观音行走啊。”


  她把没拿净瓶的那只手举到脸侧摊开，然后又放下来：“好歹给我点尊重嘛~”


  她把头朝士郎的方向轻轻偏了一偏：“你问问你的从者，他肯定知道。”


  立香把视线转向士郎。她的眼神在那一刻从刚才紧压着祁荒追问的冷锋往回收回一寸，换成了某种暂时等待的安静。


  士郎想了想，琥珀色的眼睛先凝视在立香的脸上停了一会儿，然后才开口：“因为他是弥勒佛。”


  “Bingo~”祁荒的嘴角朝上稳稳抬起来快。


  “对了~”


  她把笑拉得更开一些，但在语气重新落下来的那一刻，笑的最末端透出来了某种冷到骨头里的笃定。


  “就算弥勒失去了来自思潮的能力~”


  “——那他还是未来佛啊~”


  立香的面色沉下去了。


  语调平得没有抑扬，像是在说一条自己解出来的算式。然后她把头轻轻一低，再抬起来时眼睛轮流扫过在场每一个人：“就算未来文明的人献身了——到最后也没能战胜未来佛。”


  终末人理圆满装置并没有回应立香的这句话。它的传感器在锁定她。


  蓝色的人形投影往立香的方向微微前倾了半度。投影边缘在锁定过程中闪了一小圈暗蓝色的光栅。AI把立香的呼吸频率、瞳孔直径、颈部大动脉的血流速全部读入自己的暂存区，然后和数据库中归类为“恐惧”的全部指标做了一遍并行对比。


  比对的结果令它不解——立香的表情没有一丝一毫的惧怕。她站立的姿态没有任何往后退的位移信号。


  AI的模拟唇角往下落了不到一次刷新帧的宽距。


  “是，就算到最后，我们也没能战胜弥勒。”


  立香听着这句话，把双手在腹前交叠了起来，她的大脑此时此刻没有在产生任何一个多余的念头，只是顺着AI刚才提供的所有信息和自己的知识储备一路往下走——一直走到冷水里。


  “如果你们战胜了弥勒，那么也不会需要我们的援助了。”她说道。这句话不是在揭对方的伤疤，她只是把一个已经被证实的逻辑事实摆在自己面前。'

content: '士郎往前迈了一步。他在她身边停住，他站定后靠得极近，他的左手背刚好和她右手背碰了一下。那下碰不重，是皮肤在冷风里碰了碰皮肤就贴上了。


  “嗯。”


  “玛修。”


  “前辈，我在。”玛修走到立香另一侧，她的盾被她从手腕上往下一震，震出一声极轻极闷的嗡。她把自己挡在立香身前半步，那个挡姿她没计划。


  立香垂眼看了看自己脚前那片术式光，然后她把视线往侧面一斜，看着士郎，嘴角边上往上一挑，“某种意义上，这算不算我真正的第一次英灵召唤。”


  她说完这句便睁大了眼睛。琥珀色的瞳孔对着法阵，她喉结往上一提然后往下一压，开口念出召唤词。


  召唤阵里先是一阵气流。冰凉的无色空气从阵心往外一卷，那些紫色的术式光在气流下像被刀口从中间笔直切开，紫色往两边各自弹开，中间腾出一条被透明力量灌满的通道。紧接着狂风从阵底往上猛顶，把立香的橘发连同衣角一并掀了起来。玛修把盾往前一压。


  “前辈！请后退！”


  立香任由玛修挡在自己面前。她站在玛修的盾影里把最后几句召唤词念完，每个音节都咬在风里。


  然后一切停了。


  法阵的紫光、无色气流、狂风、术式——全部在同一个瞬间被抽走，抽得干干净净。空间压下来那一秒没有声音，只有那团还悬浮在法阵正上方的东西——一副通体白中泛蓝的盔甲。甲面上用沉蓝色的丝线刻着展翅的白鹤，鹤翅从肩甲一路往下铺到腿侧，腿侧纹着一只蹲立的石猴。白气从盔甲内部汹涌而出。


  气越涌越浓，半座舰桥被白雾撑满了。


  然后风来了。不是刚才那种狂卷，是从雾的正中心往外轻轻一推——像有人从雾里往外挥了一下袖子——气流沿着舰桥铺面向外扫，把雾一层层剥开。雾退净时，那套盔甲已经不在原处了。


  站在那里的是一个少年。他看上去一米八上下，立在铺装地面上那股子站法是他生来就有的，不带威压但也不问地儿。


  他身上穿的是一件玄色道袍，袍面上用细金线绣着与他盔甲上一样的白鹤纹，腰间挂着一枚青玉色的鞭子，鞭身缠了四圈盘在腰侧，像一根没醒透的翠蛇。他的黑发用一根旧得起了毛边的白色发带胡乱扎成一个低马尾，垂下来的发梢在他后颈上轻轻扫着。脸是极标致的，气质却像一片不化的霜。


  他先把视线往右边一偏——他看见了士郎和立香还勾着的手指。目光在那两只手上停了不到半次心跳，然后他抬起眼，把视线锁在立香的脸上。


  “本王，杨浞——职阶，Rider。向世界请求之人就是你。”


  立香把自己的手从士郎掌心里轻轻抽出来。她的拇指在自己手背上那几条令咒的暗纹上慢慢摩挲了一次——指腹碾过最粗的那道令咒时她能感觉到一丝微沉的热——然后她把手背往腿侧一拍，胸背挺直。


  “没错。我的名字是藤丸立香——我是你的御主。”


  杨浞把右手从宽大的玄色袖子里往外一伸，在自己胸前轻轻一按，行了个简礼。他脸上还挂着刚才看见两人牵手时嘴角剩的那点笑意，开口时声音平淡、不紧不慢。


  “那么，契约成立，藤丸立香。本王有件事情要做。”


  立香眉头往上一挑。她的眉毛刚扬起，嘴唇刚打开到一半发出半个气音——


  那团烟雾便从杨浞的袖口里一卷而出。雾没有颜色，它扑上来时不是压迫，是在立香和士郎周围的空气里忽然浸了一层透骨的清凉。立香闻到了薄荷味，不是甜的，是那种山顶上被雪水泡过的野生薄荷叶碎在指间时往上冲的那股子凉。士郎在她身边用自己的内息压了一下呼吸——然后他松开了。


  杨浞站在雾外眯了眯眼。他把袖子往回轻轻一拽，把剩下的雾气带回来，吸进自己鼻息里。他嘴角一抬，低头看了看袖口。


  “嗯。不错。”


  “什么。”立香把手从鼻尖上拿下来。


  “本王对‘真’的异状极为敏感。但是看来，这里‘假’的东西——只有本王自己啊。”


  杨浞把这句话从自己牙关里往外轻轻一推，话尾落的时候他笑了起来。不是苦笑，不是冷笑，是那种在书房里独自发现一个有趣谜面的笑，爽朗，但又没有要把这些放在脸上的负担。


  “有意思，哈哈。那么，藤丸立香——告诉我你要准备怎么做吧。虽然此时本王并不是完全状态，也从未单独作为武器过——但是，有这样的一次也未尝不可。”


  他那句“未也不可”后边跟着的笑在舰桥残骸里绕了一圈，撞在远处那枚主炮的黑膛上弹回来，变成极轻极柔的回音。立香的手指又在自己手背那几条令咒上轻轻摩挲了一下，她的拇指这次停在最上面那道纹上——然后她把手指摊平，手背往腿侧一垂。


  “嗯。那就让我们一起来做这只武器，杨浞。”'

content: '终末人理圆满装置的虚影遮住了舰桥上方整片天空。立香站在舰桥残骸的铺装地面上，把脑袋往右边微微一偏，她的右肩在这侧偏里轻轻往下一坠，然后她开口。声音不高，但每个字都是压着舰桥里那股子金属与臭氧混合的冷风往外送，“终末人理圆满装置，你的话有点问题。”


  她的脸皮底下没有一块肌肉在动。那双琥珀色的瞳孔把高处那尊蓝荧荧的人影从头顶框到底，脸上什么都没带。


  她沉声把自己刚看完的历史从胸骨后面往外一推，推门似的，话音把合金墙壁撞回来嗡嗡了两下，“人类的未来自然该由人类做出选择。不应该由任何人来判断是否该不该——该不该这么选。终末人理圆满装置。”


  “既然是未来文明的人做出来的选择，我身为外人，既没有给他们庇护，也没有参与他们的建设。”她的右手在自己身侧往外轻轻摊了一下，那几枚暗色的圣痕在她手背上一闪而过，然后她把手指慢慢往里收，合在腿侧，“自然是没有任何权力表达‘该’或者‘不该’的。你想问我的是——对他们的这个梦想，这个愿望是怎么看的，并且你认为我会做出和你一样的判断。”


  立香的嘴唇在说完这几句之后自己抿了一瞬。她把自己刚才在博物馆从头看到尾的那些东西，从推车上绑绳子的木轮到那枚没抵达天空的纸星星——全压在舌根底下，然后她把它们当成刀背往外一推。


  她的声音往下沉了一层，没有质问，就是陈述：“人们应该放弃这些无谓的、不可能实现的理想对吗。这种一眼看到头的理想，这种前人无数次前仆后继、不断实践证明不可行的理想，人们压根不该走到这条路上是吧。”


  终末人理圆满装置巨大的虚影往下点了头。那个点头里没有迟疑，它的蓝色轮廓在高处的冷光源中一丝都没晃。


  “没错。”


  它把这两个字搁在空气里。随后那团巨影的右掌中央开始往外挤出一点金色的锐光。光在它掌心里自己收敛、塑形，从一团乱光慢慢刻成一个杯子的轮廓——杯颈上每一道刻痕都在那层光膜底下清清楚楚地铺开。杯子搁在它手掌上，像搁在一座无形的供台上面。


  玛修往前迈了半步，她的盾在左臂上轻轻一震，“前辈！那是圣杯。”


  终末人理圆满装置把圣杯往立香面前一递——虽然杯并没有离开它的巨掌，但它把这一推做得极慢，慢到立香能看清杯壁上每一层反光：“如果你在击败了弥勒之后能够让地表上剩下的人类来到地底——享受未来文明剩下的遗泽，我就将圣杯交还给你。这样你的世界的特异点就会消失。”


  玛修把自己的上下牙关往中间一咬，她唇瓣动了两下，嘴里有句话在牙后转了一圈被她硬生生摁了回去。她捏着盾把的左手在手套里面自己紧了一下，然后松开。


  “前辈——”


  立香抬起右手，轻轻在自己太阳穴旁边摆了一下手指，没让她说下去。然后她把下巴往回缩了一截，两条眉毛从眉骨上往下微微一沉。她开口时声音又沉又稳，那声音在舰桥里绕了一圈才落下来。


  “终末人理圆满装置，这件事情，我无法做主。不管是出于迦勒底的立场，还是我自己的立场，我都不能接受你的意思。迦勒底没有权力去否定人们选择的未来。你口中所说的带到地底享受未来文明的遗泽——不过是你口中画的大饼罢了。”她的嘴唇在说完“画的大饼”四个字之后往左边轻轻一勾，那不是笑，是一种把谎话的包装从东西上撕掉的清醒。


  “你想要做的和弥勒一样，终末人理圆满装置。你所要的是一个乌托邦，一个要在AI管理下俯首帖耳的人间乐园。我问你，一个后面会由AI管理的世界，那么和现在的世界有什么区别。你到之后会不会和弥勒一样把人类彻底的压迫呢？还是会做出更为极端的手段？”她把最后几句话一字一字从牙关里往外投，投完她的下巴微微往上一扬，瞳孔对准那团蓝光内的最核心处。


  终末人理圆满装置在空中停了，它的轮廓边缘在那一刻忽然安静下来，连平时伴随它说话的那层淡蓝色波圈都歇了。然后它轻声开口，声音从高处往下慢慢落，落得很轻。


  “那么——你个人的那方面呢。”


  立香的表情在听见这句话时一下子从刚才那层硬壳里往外滑开了。她的眼尾在那一息内慢慢往下掉了一点，嘴角那条刚才还在撕包装的线条自己软下来，被什么东西从里面往外轻轻一推就让那张脸整个换了神色。她的瞳孔往右边一偏，没转头。她偏眼时眼角的余光刚好能扫到站在她身侧那个人——白色风衣在舰桥的冷光下微微反着淡银。


  她的右手从自己腿侧往上提。她握住了他的手。


  士郎的手腕在她指尖刚触及他虎口时轻轻一抖，他在愣，他的大脑在他意识到她要握他手之前先卡了一帧——然后他立刻把自己的手指反向包住她的手背，把她整只手都裹进了他那只比她大一号的掌心。'

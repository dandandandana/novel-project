content: '观察室门打开。奥尔加玛丽独自走进召唤室。医疗组与达·芬奇留在控制席，玛修和士郎仍留在门外，遵守了不进入阵地的安排。


  “抬头。”奥尔加玛丽说。


  立香没有照做：“我没事。”


  “我没问你有没有事。”


  “那做什么？”


  “看着我。”


  立香抬起头。


  “召唤失败了。”奥尔加玛丽说。


  “我知道。”


  “设备没有问题，你的资质也没有问题。人理没有回应，原因未知。”


  “嗯。”


  “你还是迦勒底的御主。”


  立香想说这不是同一件事，奥尔加玛丽没有给她插话的机会。


  “不是因为你召唤过谁，也不是因为人理肯不肯替你开门。第一特异点是谁带队修复的，圣杯是谁带回来的，伤员回来以后是谁第一个喊救人，管制室里每个人都看见了。”


  “我不是一个人做到的。”


  “当然不是。御主要是什么都自己做，还要迦勒底干什么？”


  奥尔加玛丽向她伸出手。


  “回来。阵要检修。”


  立香看着那只手，没有马上握。她不是不认同所长，只是阵心那道黑痕仍像一个没有说完的回答。


  “可下一个特异点——”


  “我们一起去。”玛修在门外说。


  立香转头。


  玛修仍站在安全线后，已经恢复的左手握着记录板。士郎在她旁边，没有越过门。两个人都按她昨晚和今天要求的方式留在原处。


  “没有新从者，我们也去。”玛修说，“如果以后能召唤，再把人接进来。在那之前，前辈还是前辈。”


  “这个称呼跟御主资格没关系。”立香说。


  “我知道。”


  “你说得好像有关系。”


  “那我重新说。”玛修想了想，“前辈还是我们的御主。”


  士郎接道：“这句不用重新说。”


  “你昨晚答应不说这种话。”立香看向他。


  “你禁止的是‘我一个人就够了’。”


  “差不多。”


  “差很多。”


  奥尔加玛丽还伸着手，终于不耐烦：“你们准备隔着我吵多久？”


  立香握住她，跨出已经熄灭的召唤阵。'

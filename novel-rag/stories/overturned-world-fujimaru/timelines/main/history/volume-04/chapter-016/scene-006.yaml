  "content": "士郎没有回头。他提着大戟走下尸山，每一步都踩碎一截金色骨骼。最后一颗头颅落到他身后时，弥勒到了。\n\n掌缘切向颈侧。士郎只偏了半寸，额头反而向前撞上弥勒眉骨。脚下尸山轰然塌陷，两人的头骨撞出一声比金铁更沉的闷响。士郎额角再次裂开，左手却已经锁住弥勒喉咙，右膝顶进腹部主炮伤，硬把那具佛身从地面抬起半尺。\n\n弥勒肘尖砸进他肩膀。骨头断响。士郎借这一击转身，锁喉的手臂随腰背一并拧紧，把弥勒整个人掼向尚未落地的大戟。长柄被他在半空接住，戟刃沿主炮贯穿伤斜着切入。\n\n刃口从胸前进入，自左肩后方穿出。弥勒一掌拍在戟杆上。投影大戟震出低沉长鸣，反作用灌回士郎双臂，右侧回路随即爆开大片血雾。他没有松手，反而向前踏进半步，以肩膀抵住戟尾，把弥勒继续钉向后方。\n\n弥勒盯着他。视线越过那张沾着金血的脸，又落在仍未熄灭的紫火上。\n\n“这具身体撑不了多久。”\n\n“够把你打疼就行。”\n\n“之后呢？”\n\n士郎咧了一下嘴：“后面有人。”\n\n白火从两人脚下升起。\n\n弥勒终于放开戟杆，向后退出十步。创造之禊祓沿伤口内缘燃烧，不伤士郎的投影，却把佛身刚要闭合的血肉重新洗开。村正穿过火线走来，心口白纹已经烧到下颌，右手仍稳稳握着一柄新锻短刀。她先看了一眼士郎肩上断骨，再看弥勒。\n\n“你再晚点，他就得把自己也投影一次了。”\n\n士郎拔出大戟，后退时脚步第一次晃了一下：“赶上就行。”玛修从侧面接住他。Alterego与阿尔托莉雅也各自退开半步，四人围成的缝隙由村正补上。立香仍留在远处阵心，祁荒坐在她身前，金刚杵把坐标牢牢钉在现实。弥勒低头看着胸口燃烧的白火。\n\n“千子村正。”\n\n“叫我干吗？”\n\n“你比他们更清楚。”弥勒抬眼，“这片金地已经走到尽头。外面的人理也不要你们。你这样的天才，明明看得见前面没有想要的未来，为什么还要往前？”\n\n村正沉默了一会儿。她生气时一向话少。弥勒的问题没有激怒她，反倒让她把短刀垂低，像是在确认刃口是不是已经磨到该有的角度。\n\n“我这条命，最早是天照命金地给的。”她说，“后来老头子捡到我，教我认火、认铁，教我刀出炉之前别急着吹。”\n\n弥勒听她说完。\n\n“他们一个给我活路，一个给我怎么活。结果呢？天照命金地没了，老头子也死了。”村正抬起眼，语气平得听不出半点哭腔，“你问前面有没有我想要的未来——谁知道啊。没走到，哪来的答案？”\n\n她掌心一翻，白色火焰沿短刀刃口安静燃起。\n\n“可他们把一辈子都给我了。我总不能因为前面黑，就蹲在原地替他们认输吧。”\n\n白火越过刀尖，照亮弥勒胸前的伤。\n\n“所以这条路，我拼。”\n\n村正向前迈出一步。\n\n“未来有没有，砍开再说。”"

  "content": "第十六章　次显明王\n\n“接下来，硬打。”\n\n立香话音尚未落稳，弥勒已经越过宫殿废墟。右脚蹬碎的金砖还没落地，他便跨过数百米。Alterego士郎只来得及把黑刃横到胸前，拳头已经压住刀脊；两股力量相撞，没有向外爆开，反而全部沿刀身挤入他的肩肘。第一声金铁震鸣还在手掌间颤动，第二拳便从刀下穿入，正中肋骨。\n\n白色风衣贴着背脊鼓起。Alterego被打得双脚离地，身体才向后飞出半步，阿尔托莉雅已从侧面撞进两人之间。她以左肩先顶住弥勒胸口，黑翼则在背后同时扇下，把冲锋余力全部压进这一记近身撞击。弥勒退了半步。也只有半步。\n\n他右手顺势扣住阿尔托莉雅肩甲，拇指压入甲片与颈部的缝隙，另一只手则向下拍在她握剑的手腕。腕骨发出一声短促闷响，黑金长剑脱手坠落；弥勒膝盖紧接着抬起，正要撞碎她胸甲，Alterego已在半空翻过身体，以双脚夹住他右臂，借被击飞的惯性向外拧转。\n\n阿尔托莉雅随即撤肩。弥勒右臂被两股相反力量扯开一瞬，她左手臂铠内的七道刻纹同时亮起，却没有打开潘多拉，只让第一道承伤纹替腕骨吞下了后续伤害。右手重新接住坠落长剑，剑锋自下而上，沿弥勒肋下那道主炮灼伤切了进去。刃口没入两寸。\n\n弥勒左肘向后。Alterego松腿得已经够快，肘尖仍擦过下颌。骨裂声贴着耳内炸开，他的视野顿时缺了右侧一块；弥勒借此收回右臂，五指落在阿尔托莉雅剑脊上，向外一抹。黑刃没有断，剑势却被近千代对剑战积累拆得干干净净，锋口贴着他腰侧滑开，再也压不进原来的伤。\n\n“第三百七十一代，北陆重装剑。”弥勒说。\n\n阿尔托莉雅落地，脚跟擦出两道深痕：“我不是他们。”\n\n“所以只取了他们的起手。”\n\n她第二剑果然没有沿原路回来。剑尖在膝前一转，黑翼压低，原本的重装斩击中途换成贴地突刺。弥勒却像早知道她会为摆脱旧招而改变重心，脚掌在剑锋上轻轻一踩，整个身体便借她向前的力道腾起。那一脚没有踩断宝具，只把阿尔托莉雅的剑压进地里；他从她头顶越过时双掌同时下落，一掌拍向后颈，另一掌封住Alterego从盲侧补来的刀。\n\n“他在逼你改。”Alterego吐出一口带碎牙的血，“别顺着他。”\n\n“刚才是你让我不要用旧招。”\n\n“我说的是别用得那么老实。”\n\n两人背对背错身。阿尔托莉雅放弃拔剑，左肘向上迎击落掌；Alterego则将黑刃就地投影出第二柄，真假双刀一正一反，夹住弥勒另一只手腕。弥勒的掌力因此分开，一边落进潘多拉臂铠，一边被双刃导向地面。三人脚下废墟发出沉重塌陷声，方圆数十米金砖整体下沉，弥勒仍悬在两人头顶。\n\n阿尔托莉雅臂铠第一道刻纹熄灭。Alterego投影出的假刃从中折断。弥勒双臂一振，黑刃和人同时被甩开；可阿尔托莉雅已趁此拔出陷地长剑，暗色魔力沿锋口喷出，从他的左腰一直切到胸前。金血飞出，灼在地面发出密集细响。弥勒落地时身体向右偏了一寸，主炮留下的贯穿伤也被这一剑扯开。\n\n他仍比两人快。下一轮拳影压来，阿尔托莉雅只能用剑脊挡住最重的一击，Alterego则以残刃削去其余角度。弥勒的拳、肘、膝、肩在同一轮进退里不断更换；他见过人类怎样对付比自己强壮的敌人，也见过人类怎样拆解神代武技。每当两人好不容易从一次碰撞里夺回节奏，下一击便沿他们刚暴露的动作习惯钻入。\n\n阿尔托莉雅胸甲先后凹下三处，第二道承伤纹亮起。Alterego的右耳完全听不见了，左侧肋骨也在方才那记拳击下断了两根。他们被压得不断后退，却始终没有退出宫殿废墟。弥勒可以压制。不能立刻拿下。他们不是来赢这一段的。Alterego每退一步，脚下便留一柄极短的投影剑；阿尔托莉雅挨下的每一拳，也都在把弥勒带向那些剑之间。等到第十三柄剑被踩进地面，Alterego双手忽然合拢。\n\n十三道剑光从地下交错升起。弥勒第一次停住追击。他的双脚并未被剑刃刺穿，周围空间却被十三种彼此冲突的神造性质短暂卡住；阿波罗的光从正面压缩视野，雅典娜的秩序锁死步幅，赫菲斯托斯的锻造权则将脚下金砖改成一副刚出炉的镣铐。效果只够维持一息。阿尔托莉雅等的就是这一息，黑翼贴地展开，整个人连同长剑撞进弥勒胸口圆洞。\n\n弥勒被推回废墟中央。他后脚踩穿半座宫墙，胸前金血沿剑刃向下淌，右掌却在剑锋继续深入前扣住阿尔托莉雅的脸。五指收拢，头盔外壳立刻传出一串碎响。Alterego从侧后突进，弥勒不回头，只将另一只手臂向外一横。肘尖撞上刀口，两件兵器擦出的火光尚未散尽，他的手已经反扣住Alterego衣领。"
}

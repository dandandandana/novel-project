  "content": "两人同时被他提离地面。立香脚下动了一步。金刚杵横过来，挡在她膝前。\n\n“再往前，你就出阵了。”祁荒坐在破碎莲台中央，手上裂口还在流血，语气却像只是提醒她门槛有点高，“想清楚。你是要去帮忙，还是忍不住想替他们打完？”\n\n立香看着废墟。弥勒甩臂将两名Alterego互相撞向对方，阿尔托莉雅在半空强行扭腰，让肩甲先替Alterego接住冲击；两人落地时都没站稳，弥勒已跟着压上。\n\n“他们会受伤。”立香说。\n\n“已经受了。”\n\n“也可能死。”\n\n“这句他们自己知道。”\n\n祁荒没有劝她退。寻声救苦把立香此刻每一道冲动都看得清清楚楚：她想保护，想控制损失，想让所有人按最安全的方式行动，也想把这场战争从头到尾背在自己身上。那些欲望涌过来，味道并不比城里数千人的祈求差。祁荒因此笑得真诚，话却没给她留情面。\n\n“你们不是这条世界线的人。把未来佛拉回地面、把人撤走、把炮打出去——这些你都做完了。可接下来要不要为了未来挨这一拳，总得让这里的人自己选吧？”\n\n立香沉默了两息。她在阵心站定。\n\n“士郎。”\n\n站在盾旁的士郎抬起头。\n\n“玛修。”\n\n“是，前辈。”\n\n“你们去。”立香把右手举到胸前，手背上仅余两道令咒，其中一道沿边缘亮起，“我留在这里，不替你们选路。只把我能给的交出去。”\n\n玛修愣了一下：“给谁？”\n\n“给你。”\n\n赤红纹路从立香手背剥离。它没有像普通令咒那样化成强制命令，而是在半空展开为一面由无数人影共同托起的旗。旗上没有王名，也没有军团徽记，只有人类从泥土里直起腰、把第一块石头垒成墙的轮廓。\n\n“以令咒为薪。”立香说，“英杰之帜——玛修·基列莱特。”\n\n旗影落入玛修灵基。她先听见心跳。不是自己的。筑墙者、守城者、挡在孩子身前的普通人，无数曾经把身体放在危险与他人之间的心跳顺着盾柄涌进掌心。左肩脱臼留下的疼痛没有消失，裂开的肌肉也没有愈合；力量只把伤势和她本人一起推到这具灵基能够抵达的顶点，让那条受伤手臂仍能承担接下来每一次选择。\n\n多功能武装在手中展开。黑金巨盾沿边缘长出剑刃，盾背结构则向脊柱与双肩延伸，组成第七圣典的完整板甲。玛修抬盾，压在金砖上的重量令地面缓慢下沉。\n\n“确认强化。”她看了一眼自己仍在滴血的左手，认真补了一句，“前辈，我不会因为拿到力量就乱来。”\n\n“你这句话听着像我平时会乱来。”\n\n“……我不是那个意思。”\n\n士郎已经走过她身边，嘴角短暂翘了一下：“她只是先把你的话堵上。”立香瞪了他一眼：“回来再算。”\n\n“好。”\n\n他只回了一个字。右手投影回路的裂痕重新亮起，一长一短两柄剑在掌中成形。玛修没有再说话，盾缘压低，两人一前一后冲出祁荒守住的坐标阵。\n\n弥勒恰在此刻把Alterego压进地面。\n\n他的左脚踩住黑刃，右手抓着阿尔托莉雅头盔，膝撞已经提到一半。玛修从正面切入，盾缘不是撞向人，而是插进弥勒支撑腿与金砖之间。强化后的筋力沿腰背一齐爆发，她把整块地面连同那只脚向上掀起。弥勒重心第一次被外力抬离地面，尚未完成的膝撞随即偏出；士郎从盾后贴入，短剑架开扣住头盔的五指，长剑则沿其腋下刺向主炮圆洞。\n\n弥勒松手，掌心向内一合，夹住长剑。士郎早在剑被扣住时便放开握柄。左手短剑向下一划，投影结构沿弥勒小臂快速复制出十七处旧伤；玛修紧接着转盾，把失去支点的身体向前推。Alterego从坑中抬头看见空隙，反手一刀砍向膝窝；阿尔托莉雅也在落地前收翼转身，剑尖直取后颈。"

content: '玛修怀疑地看了他一眼，转头跟立香确认第四版方案。她听到八秒未归就延迟炮击时没有马上同意。


  “前辈，如果我能把言峰前辈带回来，你必须继续施术。”


  “你有把握？”


  “我会把盾留在炮击线上，自己去找他。盾能替你维持三秒防御。”


  “三秒不够。”


  “加上我的令咒。”士郎说。


  “你什么时候有令咒？”


  “比喻。”


  “不好笑。”


  “那就加上我的投影。可以把防御补到五秒。”


  三个人在城墙上重新计算。第四版改到第七版时，终于有了一条不以某个人留下为前提的撤离链。它仍然危险，仍有任何一步出错便全线崩溃的可能，但每个人都在计划的最后拥有一个回来的位置。


  出发前四个小时，檀真从东面飞回。


  水火乌鸦落在杨浞肩上，将看到的东西直接传给他。伊耶那岐金地外部的九十六尊法相已经全部列阵，数量与伊耶娜美的情报一致。东门上方悬着一轮黑日，天照命世尊坐在黑日中央。


  弥勒没有出现。


  但檀真在金地上方看见了第二颗修武星。


  那颗星比天上的真星暗，藏在弥勒佛光深处，只有檀真靠近时才短暂显形。它照出的不是虚假，而是把所有存在都判定为虚假。檀真的一片羽毛被它照中，水火结构当场崩解。


  “有人仿造你的星？”立香问。


  “不是仿造。”杨浞说，“是用同一份记忆做出来的另一个答案。”


  伊耶娜美听见这句话，手中的茶杯从中间裂开。


  “地下还有另一个你？”玛修问。


  “也许。”


  “你不知道？”


  “我只知道自己醒来以后在这里。以前是谁，谁把我放进这具身体，我的记忆没有告诉我。”


  伊耶娜美把裂开的杯子放回桌上。裂口没有割伤她，杯中的茶却沿桌面流到地图边缘，浸湿了伊耶那岐金地的一角。


  “那些法相不是军队。”祁荒说，“至少不全是。它们可能是在争夺谁才是真的。”


  “弥勒让赝品互相证明自己？”村正问。


  “也可能是创造它们的人留下的机制。一个位置，只允许一个答案活到最后。”


  杨浞取下腰间铁鞭，将它放在桌上。修武星的白光从窗外照进来，铁鞭表面的龙鳞纹一片片显出。


  “不管是什么，东门那颗假星交给本王。”


  吉尔伽美什推门进来。她已经换掉礼服，穿上适合战斗的轻甲，金发束在脑后。


  “你一个人？”


  “你对付黑日。”


  “谁允许你替本王分配了？”


  “刚才你自己说的。”


  “本王可以改。”


  “战场上再改。”


  吉尔伽美什看了一眼立香。立香点头，确认了这一组的任务。


  “东门组以牵制为主。世尊能杀就杀，不能杀就锁住。地下组一旦进入第九层，你们把动静闹到最大。不要追击，不要进入伊耶那岐宫。”


  “本王知道什么叫作战。”吉尔伽美什说。


  “我主要是说给蜀帝。”


  “本王也知道。”杨浞说。


  “知道就重复一遍。”


  杨浞停了一会儿才开口。他过去出征时，大概没人要求一位帝王复述命令。


  “牵制天照命世尊。地下组进入第九层后扩大攻势。不追击，不进宫。遇见可以沟通的法相，先问它是否自愿作战。”


  “最后一句我没说。”


  “本王替你补上。”


  “补得对。”


  吉尔伽美什在旁边笑了一声：“你们契约不到一天，倒是已经很像御主和从者了。”


  “他听命令时比你省心。”


  “藤丸立香。”


  “吉尔茜。”


  吉尔伽美什闭上嘴。这个称呼只在极少数熟人之间使用，立香一喊出来，她就知道再争下去只会把更多旧称呼翻出来。


  出发前一小时，月读命金地关闭城门。


  居民被集中到与伊耶娜美联系最稳定的区域。伤员营地移入城主府，天沼带人检查每一条显形的金线。伊耶娜美坐在正厅中央，双手按住整座金地的灵脉。她不能同行，但会成为所有撤退路线最后的落点。


  村正与祁荒先行进入山腹通道。临走前，村正把一把短刀塞给立香。


  “老夫进了地下，通讯多半会断。这把刀断了，说明我们到第九层。刀没断，人也没回来，别开炮。”


  “你确定不是刀先坏？”


  “你当老夫是谁？”


  “一个会因为别人质疑刀而生气的刀匠。”


  “老夫没生气。”


  “那就好。回来以后我还你。”


  村正摆摆手，扛着大太刀走进通道。祁荒跟在后面，经过士郎时停了一步。


  “你们聊完了？”


  “什么？”士郎问。


  “没什么。”


  她满意地走了。


  东门组从城外出发。檀真展开双翼，体型在几次呼吸间扩大到足以承载杨浞。吉尔伽美什拒绝乘坐，打开王之财宝，从中抽出一条能在空中铺开的金色阶梯。


  杨浞看着那条一路通向东面的阶梯：“这不算交通工具？”


  “这是本王的路。”'

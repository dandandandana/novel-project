content: '她要的其实很简单她不在乎这个：装置到底要什么，她首先要确保它和迦勒底之间不会有正面的冲突，最后那个最大的目标，那个解决弥勒、解决这个特异点的大目标——不能被任何事情影响。


  但无论如何她必须至少确认刚才装置说的每一句话都是真的。如果这点都无法确定——一切都要重新洗牌了。


  到那个时候直面主炮的就是迦勒底了。


  立香把那口从肺里往上翻的冷空气从自己嘴唇之间慢慢往外推光了。她把自己的手背拿到自己眼前，然后拇指在自己手背的暗色圣痕上轻轻一摁——摁下去之后她就把它放了下来垂在身侧。她把脸抬起来，把视线投向外面那片走廊尽头并不明亮的柔白灯光。她把脚步从舱体旁边往外迈出一步，走了出去。


  “所以就该由我来正面。虽然玛修也很合适——问题就是这样。需要和弥勒正面对决的人是我。”


  村正把自己肩上的大太刀往肩窝上一压，那把刀背在她肩膀上压了一道深深的横褶，她的声音从嗓子眼里往上翻时带着一层从锻造炉里烧出的火气。


  “村正亲，你说的不对。就算最后破局的关键是你，正因如此你才更需要在后方对吧。”


  玛修站在方桌的另一侧把她的双手从桌面上拿走交叉抱着她的胸甲。士郎这时候正要开口——他把嘴张了一半，下巴往下沉了一点，但他的声音从舌尖上还没上来之前玛修的眉头已经提前往额角的方向提了一线。


  “话说。我有不死性，这种事情按道理来说是让我来最好吧。”


  “言峰前辈。我就知道你会这么说。”玛修的喉咙里往外滚出一句话——她瞪着士郎的那双紫色眸子在瞪完之后自己闪了一下：“刚才你不是刚和前辈讨论过吗。你知道你死了前辈会很伤心吧。”


  “咳咳。”


  立香的嗓子咳了两声——她把喉咙里的气用舌尖从自己嗓子底往外一顶。她走过那张方桌时右手自然而然地搁到了桌沿上让那整张合金的桌面微微一震。她把自己的视线在三个人的脸上一一走过去，“你们讨论好了吗。”


  “前辈？”玛修把自己的脑袋往立香的方向一转——她脸上的表情在短短一息之内从刚才的怒意里往外一弹就直接炸成了惊喜：“啊你醒了。”


  “嗯。和终末人理圆满装置说了几句。”立香把手从桌面上收回来垂在自己身侧。她把自己的身体往桌边轻轻一靠，让那层合金桌边刚好稳在她的腰际。“她也给你们说了？”


  “是。大概需要什么说了一下。”士郎开口。他的琥珀色的眸子里映着玛修那张刚从怒意塌成惊喜的面孔，他的嘴唇在说完这句之后自己抿了一瞬。


  “那么——祁荒呢。那个菩萨去哪了。”


  “她说去逛逛，没人管她。但是她带来了一个坏消息。”士郎把嘴巴张开之后又抿了一次。


  “什么。”立香把自己的视线从桌面抬起来和士郎的眼珠对上。


  “嗯——大概就是我们被幕后黑手发现在这个特异点了。而且有可能会提前和她接触。”士郎把自己刚才那张嘴里的每个字都调到了同样中性的温度上——没有加油没有加料，“大概就是如此吧。”


  “模棱两可——”立香的眉头在上颚上微微一收。她把头往士郎的方向微微一偏，“士郎？什么意思。”


  士郎只用了几句话就把祁荒的意思从中翻译到了她在休息室里对坏消息的概括上。立香听完以后把自己的头从士郎的方向往前方正回原先的置位——然后她点了头。那层白色灯光在她的发顶上静静地趴着一动不动。


  “那是以后的事情了。目前最重要的是这个特异点。”她把视线重新搁回士郎的眼珠上，接着又往玛修、再往村正的方向逐一落去。“和弥勒正面对决的时候由我们来商量战术。我们是一个整体。士郎，玛修，村正——你们负责提供你们的思路、想要的落位——最后由我来判断是否可行。”


  “收到。”


  三人应了这道命令。


  然后立香把刚才她与AI交谈的全部内容——从主炮到英灵召唤，从战力计算到下午答复——对三人简单讲述了一遍。


  “我觉得你说的没问题。立香。接下来我们确实要确定他所说的了。”


  “嗯。走吧。这里的路应该还算好找吧。”


  “探查过了。还可以。”


  “走吧。”'

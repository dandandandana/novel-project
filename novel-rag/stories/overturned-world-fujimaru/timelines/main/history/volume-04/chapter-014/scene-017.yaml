  "content": "“也许你们真的能拯救......他们。”\n\n杨浞看着它。\n\n“不是本王救。”\n\n孔雀歪了一下头。\n\n“那是谁？”\n\n“他们自己。”\n\n孔雀没有反驳。它低头啄了啄金砖上的灰，什么也没啄到。然后它把翅膀收拢，卧在那块仍有余温的砖上。乌从欲留下的连接一根根从天空断开，伊耶那岐金地所有仍活着的人同时感到胸口一轻。北侧祭道，立香手背上只剩两道令咒。\n\n她确认契约另一端仍然存在，肩膀才向下松了一点。杨浞的伤势通过契约传回来，信息多得让她一时无法分清哪一处最危险。腹部贯穿、左臂缺失、右肩开放性断裂、灵基被至命除长期烧灼。问武平清觯仍在工作，却因本体裂纹而恢复缓慢。吉尔伽美什不属于她的契约，她只能从重新恢复的画面里看见金发女人用EA撑着站起。\n\n“玛修，准备治疗。”\n\n“是，前辈！”\n\n“士郎，通知Alterego，信标继续守。主炮计划不变。”\n\n士郎放下挡住最后一波火雨的剑：“天照命已经败了。”\n\n“弥勒还没有。”\n\n立香抬头。\n\n黑色穹顶消失后，伊耶那岐宫重新出现在天空尽头。弥勒的佛掌仍压在宫殿上方，只是少了天照命的太阳阵地与六十六尊法相，掌影第一次显得孤立。白火沿宫墙那道古老刀痕继续燃烧，村正掌中的创造之禊祓已经为下一阶段打开了路。\n\n通讯里传来Alterego不耐烦的声音。\n\n“听见了。柱子还在。你们若要叙旧，最好换个时间。”\n\n紧接着是阿尔托莉雅简短的报告：“北侧新出现十七尊法相。士郎，我会守住信标。”士郎应了一声。立香没有纠正她对Alterego的称呼，也没有让他们撤。潘多拉的臂铠仍未打开，那张底牌必须留给弥勒或更糟的东西。地下频道里，村正问：“东门结束了？”\n\n“天照命失去战斗能力。杨浞和吉尔伽美什重伤。创造之禊祓状态？”\n\n“在我手里。能用。”\n\n“代价？”\n\n村正看了一眼自己重新长出的右手。白色火纹仍从掌心延伸到心口，每跳一次，都会抹去周围一小片弥勒佛光。\n\n“还不知道。”\n\n“那就当作最坏。”立香说，“你和祁荒不要继续深入，先把第三层出口打开。我们需要一条能把伤员送到地下的路。”\n\n“明白。”\n\n立香切回东门频道。\n\n“杨浞，能听见吗？”\n\n过了两息，契约里才传回声音。\n\n“本王还没死。”\n\n“我没问这个。能不能移动？”\n\n“走得比那金发小姑娘快。”\n\n远处，吉尔伽美什抬起头：“本王听得见。”\n\n“听见正好。”杨浞把铁鞭插回腰间，单手按住腹部，“你先走两步。”\n\n吉尔伽美什尝试抬左腿。腿没有反应，她便打开一道门扉，把脚送进去，再从前方另一道门里放出来，硬把这一步完成。\n\n“看见了？”\n\n杨浞笑了一声，笑到一半牵动腹伤，血从指缝里涌出。他还是向前迈步。第一步右腿支撑，第二步左腿在真炁下勉强跟上。走到第三步，他身体一晃，铁鞭重新拄地。\n\n“平手。”他说。\n\n“杂修。”\n\n孔雀卧在金砖上，看着两位王连站立都要互相较劲。它的眼睛里没有黑日，也没有失败未来，只倒映着修武星和远处仍未倒下的伊耶那岐宫。\n\n“你们还要去？”它问。\n\n杨浞脚步未停，回答越过肩头落回来：“路没走完。”\n\n“会死。”\n\n“那就走到死的地方再说。”\n\n吉尔伽美什用EA支撑着经过孔雀身边。她停了一瞬，王之财宝打开一条极窄门缝，一小把普通米粒落在金砖上。\n\n“不是赏赐。”她说，“本王不收连路都不会走的鸟。”\n\n孔雀低头看米。吉尔伽美什已经继续向前。杨浞从另一侧经过，问武平清觯飘在身边，杯壁上的裂纹随着每一步发出细小脆响。他看见那些米，没有笑吉尔伽美什，只用剩下的右手把孔雀周围一块即将坍塌的金砖推稳。两人走向盆地外缘。玛修的身影已经从远处祭道出现。她背着盾向这里奔跑，立香和士郎跟在后面。更远处，白火正从地下打开一条新的路。\n\n天照命低头啄起第一粒米。天空中，那轮曾经属于她的太阳权能没有落下，也没有寻找新主人。它在修武星旁边停了一会儿，随后分成无数普通日光，照进伊耶那岐金地被黑日遮蔽太久的街巷。"

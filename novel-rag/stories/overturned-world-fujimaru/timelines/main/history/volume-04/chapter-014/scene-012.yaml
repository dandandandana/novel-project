  "content": "这次他叫了全名。\n\n“该你了。”\n\n立香已经抵达固有结界外缘。\n\n她看不见里面的荒原，只能看见一枚悬在半空、不断被黑日挤压的红色球体。白火沿地脉汇到她脚下，村正的声音从重新接通的地下频道里传来。\n\n“立香，创造之禊祓已经到手。需要我现在上去吗？”\n\n“不用。守住地脉，别让弥勒把降格结果拉回去。”\n\n“明白。”\n\n立香把右手按上赤色球体。EA的风压立刻切开她掌心，血被固有结界向内吸走。士郎抓住她手腕，替她稳定接触点。玛修在两人身后立盾，挡住黑色穹顶不断落下的火雨。\n\n“目标是谁？”士郎问。\n\n“天照命。”\n\n“你能理解她现在的存在形式？”\n\n“不能全部理解。”\n\n立香闭上眼。契约把杨浞看见的东西传回来：无名孔雀，借来的天照御名，弥勒授予的佛果，自己孕育的法相容器，黑日连接的欲望，还有正在燃烧命的至命除。她不需要理解每一条神话。只需要决定什么形式是自己能够认可、也允许战斗继续的。\n\n“她是一个活着的生物。”立香说。\n\n逆向根源术式从掌心展开。\n\n“她有自己的身体，自己的记忆，自己的选择。她借过名字，得到过佛果，生过容器，也保存过时间，但这些都不能让她同时存在于每一枚卵、每一段未来和每一条命里。”\n\n赤色球体表面出现一圈白线。\n\n“藤丸。”士郎的手在她腕上收紧，“弥勒在干涉。”\n\n外界佛掌已经压到固有结界上方。金色指纹隔着黑色穹顶显现，每一条纹路都试图把“伊耶那岐金地世尊”的定义重新写回天照命。村正掌中的白火沿地脉升起。创造之禊祓洗去第一道指纹。祁荒的黑钉钉住第二道。北侧石台的主炮信标则在远处发出幽蓝光束，把第三道指纹的位置固定在现实。\n\n三线在这一刻接上。立香继续说完自己的理解。\n\n“她可以强大，可以恢复，可以使用火、神通和宝具。她仍然可以比我们任何人都强。”\n\n术式穿过固有结界。\n\n“但她只能在一具身体里活。”\n\n白线落在黑金孔雀身上。\n\n“能被刀剑砍伤，能被光炮击碎，能因自己的选择获胜，也能因自己的选择败北。”\n\n降格术完成。没有轰鸣。孔雀体内所有卵同时失去伤势转移能力。被杨浞砸凹的颅骨没有再生；被EA撕开的左翼根部开始流血；母子线仍然存在，却只能传递感知，不能替她承担死亡。至命除烧掉的命也不再能从其他法相补进她身体。天照命没有变弱。她的筋力、速度、魔力、灰火与宝具威力一分未减。失去的是那些令她无法被真正杀死、无法被正常伤害、可以从记录和卵中返回的东西。\n\n孔雀抬头，第一次清楚感觉到自己的血在流失。她没有恐惧。\n\n“原来这就是你们要的公平。”\n\n立香隔着结界回答：“不是公平。只是让你站到自己要求别人站的位置。”天照命看向仍在燃烧的六十六尊法相。降格术没有替它们解除母子联系，也没有替它们决定是否该活。她若继续至命除，仍能燃烧它们，只是那些命不会再替她复活。她收拢右翼。灰火从法相身上停了一瞬。"

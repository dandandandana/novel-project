  "content": "白火抵达东门时，天照命正在把最后一层太阳阵地升回原位。\n\n火焰从金砖缝里钻出，没有灼烧阵地，只洗去了砖石之间那层来自弥勒的金色黏合。第八层刚升到一半，数万块金砖便失去共同的“世尊”之名，各自恢复成石、铜、骨与被压缩的土。整层金坛向下垮塌。第七层跟着倾斜，盘坐其上的法相成片滑落。天照命伸手去托。\n\n白火先碰到她掌心。弥勒授予的佛印从皮肤下浮起，一枚接一枚脱落。它们没有碎，落地后变成极薄的金箔，被风卷出阵地。天照命的手仍能托住数百万斤残骸，她的力量没有减少，但她无法再用“伊耶那岐金地世尊”的身份命令砖石重新归位。修武星随即照下。\n\n白光穿过剥落佛印留下的空处，第一次完整落在她本生的孔雀纹上。先前挤在一起的几重影子终于松开：日轮向左偏，佛光向右退，最下面那道黑金轮廓仍贴着血肉。修武星只负责让它们不能继续重叠，不替杨浞写出答案。他盯住最下方的轮廓，想起断指落地时化出的幼鸟，也想起第五枚羽目中那颗湿润的卵。\n\n“最里面才是鸟。”他说。\n\n天照命低头看着自己的手。她忽然笑了一声。声音很低，没有喜悦，也没有恼怒。像一个人终于看见早知会来的账单，先笑自己竟然还存着躲过去的念头。\n\n杨浞站在第六层残坛上，右臂垂在身侧。腰侧酒觯正在吐出清气，修复肩颈的贯穿伤，灰火留下的边缘却始终无法完全合拢。他每次准备抬剑，伤口便先一步崩开；视线从天照命身上移开时，清气又能勉强合住半寸。此前对黑日的试探有了第二份证据，可那东西究竟追逐杀意、胜负心，还是更宽泛的念头，他仍不能确定。\n\n吉尔伽美什在他左侧十五步。她身后的门扉少了一半，魔力回路却没有衰减。几柄来不及收回的原典插在金坛上，刃面生锈，剑柄腐朽，像在一瞬间走完了数千年。她先收起杀意最重的一柄魔剑，那柄剑的锈蚀立刻放缓；换成没有诅咒的青铜盾，盾面依旧在老去，只慢了三息。\n\n“不只吃敌意。”吉尔伽美什说。\n\n“也未必是在吃。”杨浞盯着黑日，“再看。”\n\n天照命抬头看他们。\n\n“你们把创造叫醒了。”\n\n“不是我们。”杨浞说，“是拿刀的小姑娘。”\n\n“她会后悔。”\n\n“那是她的事。”\n\n“你们总这样说。”天照命掌下的残坛继续坠落，她没有再托，任由整层阵地砸进下方山谷，“把选择交出去，把失败也交出去，再把死者叫作自己做出的决定。”\n\n吉尔伽美什抬手收回那几件正在腐朽的宝具。\n\n“比替活人决定何时该死强一些。”\n\n“若他们的选择必然走向灭亡呢？”\n\n“世上没有必然。”\n\n“我见过。”\n\n天照命背后的五根尾羽依次展开。每一枚羽目都映出一段已经抵达过尽头的历史。飞船在星海失联，城市被天体风暴剥去大气，移民船上的最后一个孩子把纸星星贴在舷窗上，随后氧气耗尽。那些不是预言，是已经发生过的失败。\n\n“我看见他们一次次走出去，又一次次死去。”\n\n杨浞将铁鞭从肩上放下。\n\n“然后？”\n\n“然后我学会不再让他们走。”\n\n“秃驴教你的？”\n\n“是我自己的答案。”\n\n“那就别躲在他的名后面说。”\n\n天照命迟迟未答，伊耶那岐宫深处却传来岩层受压般的低鸣。弥勒垂落的佛掌已经朝东门转动，掌影才越过城市，金地上的屋瓦便成片下陷，梁柱呻吟着矮了半尺。白火洗掉了阵地控制，却还压不住那尊存在本身；若她继续迟疑，佛掌便会先一步接管剩余法相，再顺母子线接管她。天照命合上双眼，六十六声卵壳开裂随即从四面八方传来。\n\n“拯救之事不在我。”\n\n第一遍话音被她含在喉间，近处的杨浞才勉强听清；待佛掌阴影压过头顶，她猛地张开双臂，让第二遍沿黑日下方撞遍整片金地。\n\n“拯救之事不在我！”\n\n喊声先撞上黑日，继而被穹顶压回每个人胸腔。立香握紧了要带同伴回去的念头，玛修的盾沿手臂又沉一寸，士郎记起尚未完成的承诺，村正掌中白火也随之收紧；东门处，杨浞要从弥勒手里夺回“真”，吉尔伽美什则只想赢。每一个念头都在回声抵达时被放大，连本人也无法装作没有听见。\n\n于是乌金细线刺破衣甲，从胸口一根根升向天空；有人想活，有人想救，有人想赢，线上的搏动各不相同，汇入黑日时却挤成同一阵密集心跳。天照命的声音就在这片心跳中裂成六十六重，从每尊法相胸腔同时响起。\n\n“——乌从欲。”\n\n黑日随着真名向外膨胀，边缘碾过修武星时，战场上的高音骤然被压平；宝具门扉的低鸣、砖石滚落的轰响、法相诵经，全像隔着深水变得沉闷。白星仍亮着，却被无边穹顶锁在天空之外。乌金色由此浸透伊耶那岐金地，建筑阴影一座座直立成火焰出口，被白火洗脱的佛印也从影中复燃，不再返回阵地，而是沿线涌入天照命身体。\n\n天照命额心先绷开一道细缝，裂口沿鼻梁爬下时，皮肉下挤出的并非骨血，而是层层叠叠的黑金羽毛；脊背紧跟着传出布帛撕裂般的长响，五根尾羽被更庞大的躯体从内部撑开。剩余法相承受不住这股牵引，膝骨相继砸上金坛，容器里的神性、记忆与生命则化作灰色并火，被母子线抽向她胸口。杨浞抢在最后几道火流离体前横剑，一口气斩向最近十线。\n\n十道剑气凭无擘以同样力道抵达，断裂声却只响了三次；另有四道在半途褪成乱风，余下三道虽已切入，伤口又从法相另一侧蠕动着接回。杨浞胸前那根乌金线恰在此刻亮起，他遂反手改斩天照命左肩，把“救出法相”的念头从这一剑中压下去。剑光果然多维持了一息，直到擦破她肩头才散。\n\n“它顺着所求之事下手。”他说，仍只说到了眼前的证据，“求得越紧，东西散得越快。”\n\n“后退。”吉尔伽美什说。\n\n杨浞循声向左错步，把正面火线让给吉尔伽美什。形如钥匙的黑红武器落入她掌中，乖离剑三段圆柱尚未旋转，周围空间已发出低沉共振，视野也沿断层彼此错开。她以剑尖指住黑日，第一圈转动所卷起的风压贴地掠过天照命，直奔战场边缘，继而沿山、城与残坛外围合成红黑隔离幕。\n\n山、城、残坛、法相和正在裂开的人形仍在伊耶那岐金地，弥勒转来的佛掌却被赤色风压暂时挡在东门之外。隔离幕不是固有结界，只是EA切出的第一层断面。它能把接下来数息的余波压回战场，却承受不了孔雀体内正在成形的下一击。\n\n“先把外面的东西挡住。”吉尔伽美什说，“等你的御主把该做的事做完，本王再给它一座可以尽情打碎的天地。”\n\n天照命的人形终于沿全身裂纹剥落，黑金孔雀从灰火里抬起头。双翼才张开，结界两端便同时传来承压的呻吟，羽尖已经抵住边界；每枚羽目都烧着一段失败未来，千万条求生本能则在鸟喙上磨出令人目眩的锋线。六十六尊法相的心跳沿灰火不断汇入它胸口，最后重叠成一声低沉宣告，话音仍属于天照命，尾音却已化作禽鸟长鸣。\n\n“——至命除。”"
}

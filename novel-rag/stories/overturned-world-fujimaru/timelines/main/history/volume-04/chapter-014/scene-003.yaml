  "content": "与此同时，伊耶那岐金地地下第三层，千子村正把手按在一扇没有门缝的白墙上。\n\n墙后有火。不是温度。她的掌纹刚贴上去，右臂里那道灼阳之禊祓便自行亮了。橘红火线从腕口爬向手背，在皮肤下组成一把尚未开刃的短刀。白墙内的东西隔着三尺厚的神代材料回应她，同样亮起一线火，只是颜色近乎透明。祁荒蹲在第二枚黑钉旁，耳朵贴着地面。\n\n“上面打起来了。”\n\n“废话。”村正没回头，“地都快让人掀了。”\n\n“不是说他们。更下面也在动。”\n\n“创造之禊祓？”\n\n“不止。”\n\n祁荒把黑钉拔出半寸。地底的声音顺钉身传上来，像数千个人隔着水同时磨牙。村正闭上眼，掌下那线白火忽然分成许多细支。每一支都通向一具容器，每一具容器里都压着一段互不相同的记忆。有人记得黄泉入口的桃木。有人记得被火神灼伤后的痛。有人记得丈夫回头时脸上的恐惧。\n\n有人记得月读命金地四千九百二十六个人第一次喊她城主。这些记忆互相冲突，却都自称伊耶娜美。村正睁眼，橘红火线从白墙上退回来。\n\n“故尊复现。”她说。\n\n祁荒抬起头：“你终于看懂了。”\n\n“这些容器不是为了复活一个死去的神。它们在筛选哪一段记忆有资格成为神。”\n\n“说得再准一点。”\n\n村正皱眉。她生气时声音反而平下去：“伊耶娜美不是被造出来装进神话的容器。她是从这些互相打架的记忆里，自己活下来的那一个。”祁荒笑了一下：“所以她记得自己是故尊，也记得自己不是。”白墙内传来一次沉重搏动。村正掌下的灼阳之禊祓被白火顶开。那不是拒绝，更像一只闭了太久的眼睛受不了外面的光。\n\n“难怪。”村正低声说。\n\n“难怪什么？”\n\n“她占天照命的金地，拿灼阳之禊祓，不是因为想安安稳稳守着月读命金地。”村正手指沿墙面缓慢移动，寻找那次搏动留下的裂隙，“她要救人。她只是不信我们能救。”\n\n“迦勒底在她眼里是什么？”\n\n“一把送到手边、暂时还算好用的刀。”\n\n“你不生气？”\n\n“刀匠会因为别人用刀生气？”\n\n村正指尖停住。墙内的白火在这个位置最薄。\n\n“用得对就行。”\n\n祁荒看着她，没有拆穿后半句。伊耶娜美若只把迦勒底当刀，便不会把灼阳之禊祓交给村正；她把自己从天照命金地夺来的火分出去，是因为她也在试刀。试藤丸立香能不能劈开弥勒。试千子村正会不会在看见众生困苦后仍然只守着自己的刀炉。更是在试她自己——一个由故尊记忆复现出来的人，究竟能不能不按神话留下的结局活下去。\n\n“墙后面不是装置。”祁荒说。\n\n“我知道。”\n\n“也不是权能。”\n\n“我知道。”\n\n“它在等你承认一件事。”\n\n村正把短刀从腰间抽出来，刀尖抵住那道肉眼看不见的缝。\n\n“我不喜欢猜谜。”\n\n“你们刀匠不都喜欢让别人猜刀好不好？”\n\n“那是外行看不懂。”\n\n她向前送刀。橘红灼阳火沿刀背注入白墙。白火没有被压退，反而从墙内绕上刃口。两种火在刀尖相撞，没有炸开。橘色负责锻造，白色负责抹去；一个要给万物定形，一个要把所有既定形态洗掉。村正的刀在两股力量间发出尖鸣，刃身从中间裂开。她没松手。\n\n“一把刀若只想着不被用坏，就不配出炉。”\n\n裂纹继续向刀柄爬。\n\n“一个世界若只想着不再受伤，把所有人的路都封死，也不叫拯救。”\n\n白墙内的搏动快了一次。村正压低肩膀，把全身重量送上刀柄。\n\n“伊耶娜美利用我们，我们也利用她。谁都不欠谁。”\n\n刀刃崩断。断刃没有落地。白火包住每一块碎片，把它们熔成一条细长的光。墙面第一次出现裂缝，缝里吹出的不是风，是新生婴儿第一口呼吸般湿润的热气。祁荒站起身，把第三枚黑钉夹在两指之间。\n\n“上面那组快到信标点了。”\n\n村正握着只剩半截的刀：“那就在他们完成之前，把门打开。”北侧旧祭道上，第二十九尊法相的头颅滚过藤丸立香脚边。"

  "content": "她左腿拖在身后，双手仍稳稳握住剑柄。三段圆柱逆向旋转，被至命除挖开的空白没有愈合，却被第二层赤色天幕覆盖。固有结界向内收缩，把孔雀视界重新锁回荒原。天照命发出一声长鸣。\n\n那声长鸣先是震怒，越过结界裂口看见外面的居民后，却硬生生折成一段嘶哑尾音。她险些亲手把灰火送到想保护的人身上，这份恐惧立刻使通向黑日的乌金线粗了一倍，孔雀周身火势随之暴涨。杨浞至此才确认，“乌从欲”连施术者自己的所求也不会放过；然而力量越强，她收回鸟喙的动作反而迟了一刹。\n\n那一记迟滞已经足够。杨浞踩上低垂右翼，借羽骨回弹的力量向头部疾行；无丈在每次落脚时折去数百米，孔雀的黑金羽目却沿途依次张开，把一段段人生连同声音送到他面前。第一枚传来没有战争的学校铃声，第二枚响着月球基地的广播，第三枚里则有一个从未失去父母的天照命。那些时间全都真实，里面的人隔着羽面向他伸手，请他留下。\n\n学校铃声与基地广播从杨浞两侧掠过，他脚步未停，因为那些世界都接不上下一刻。第四枚羽目却在此时张开蜀国城门，街上百姓俯身行礼，王宫台阶下站满他曾失去的人，声音、呼吸乃至衣摆被风吹动的窸窣都与记忆无异。它本不属于这个世界，却从他的愿望里攫取记忆，几乎已经长成真实。\n\n杨浞落脚慢了半拍，羽目立刻向内合拢，万千道挽留声也从城中一齐追来。真武正性剑旋即出鞘，锋线避开城池与人群，只削过映出他身影的羽目边框。边界断裂，那段蜀国时间遂脱离尾羽，完整悬到荒原远处，所有声音也被隔在透明壁后。\n\n“本王确实想要。”杨浞说，“所以本王自己会承认得不到。”\n\n胸前乌金线应声绷断，断口既无剑痕，也无真炁残留。杨浞只是承认了欲望，也把失败留给自己承担；如此一来，天照命便再无理由借这份欲望替他决定去留。他踩着羽骨继续逼近，吉尔伽美什在下方看清断线的方式，忽然笑了。\n\n“原来如此。”\n\n她身上同样有一根最粗的线。所有欲、胜利欲、把人类珍宝收进宝库的欲望都沿线汇入黑日。她没有像杨浞那样切断，因为她根本不打算放弃。\n\n“天照命。”\n\n孔雀一只羽目转向她。\n\n“想拿本王的欲望，便拿去。”吉尔伽美什张开双臂，王之财宝的门扉在荒原上从十道增到百道，再从百道增到上千道，“但那是本王的财产。未经允许拿走的每一分，都要连本带利还回来。”\n\n黑线骤然绷紧。她没有拒绝欲望，而是拒绝天照命拥有它。王之财宝顺着黑线反向开启，黑日里被抽走的金色魔力化作宝石、金砂与燃烧的原典，从天照命体内一件件落回门扉。黑日第三次缺角。孔雀头顶那层天照御名随之暗淡。杨浞已经抵达它颈侧，剑锋贴着孔雀纹向下切。修武星白光沿刃口灌入，天照大神的太阳权能与无名孔雀之间那条继承线被照出。\n\n剑锋贴上那条继承线，却悬在斩落前的一寸。\n\n“这名，你还要么？”\n\n天照命的声音从孔雀体内传来。\n\n“要。”\n\n“借的。”\n\n“我用它救过人。”\n\n“也用它关过门。”\n\n“所以我会承担。”\n\n杨浞剑锋下压，继承线断了一半。天照命没有求他停。太阳权能从孔雀右翼剥离，变成一轮真正的金色太阳悬在荒原上。失去一半权能后，孔雀体型缩小，却更加凝实。至命除的灰火不再覆盖整片天地，全部收进羽骨和鸟喙。她舍弃范围，换取杀死眼前两人的力量。\n\n鸟颈猛地后折。鸟喙合拢前，杨浞并指从眉心向下一斩。\n\n“霞羽客。”\n\n他的身体没有加速，而是当场散成一蓬没有重量的霞光。鸟喙咬碎残影时，霞光已在孔雀头顶重新聚成人形。天照命所有羽目同时转向上方，杨浞却在凝实前又开口。\n\n“无明。”\n\n六缕真炁从他身上分出六个互相矛盾的动作。天照命看见他举剑，鸟喙却咬向铁鞭；看见他后退，胸口已经挨了他一记肘击。她连续错判两次，索性闭上羽目，不再理解动作，只让灰火覆盖身体所有可被攻击的位置。杨浞的拳落在灰火上。右手从指骨开始失去颜色。\n\n灰火先从拳面啃掉一层皮肉，杨浞仍借前冲之势把肩肘送到底。临到三尺火幕前，真炁侵蚀忽然从指骨退尽，只留下骨骼与肌肉共同推动的纯粹重量；孔雀喙边那股吞过诅咒长枪的灰流卷来，只撕走血肉，终究没能把这一拳连同意图一起抹掉。至命除则沿腕骨向上烧，骨面发出细碎爆响，拳峰仍穿透火幕砸进颅骨。沉闷撞击从孔雀头颅内部传开，额骨向内凹陷，庞大鸟首随即撞向荒原，长喙在地层里犁出一条万米沟壑。\n\n杨浞的右手也只剩腕骨。腰侧酒觯涌出清气，血肉开始回长。灰火附在骨面上，长出一层便烧掉一层。他只能暂时用左手持鞭。孔雀从沟壑里抬头，颅骨凹陷没有复原。这一拳留下了伤，杨浞却没有把它当成胜果。此前断指化鸟、卵替身体受创、法相反哺伤口，都证明她至少准备了三种回来的路；羽目里还有多少尚未显露的东西，谁也不知道。修武星能把已经露面的线照亮，却不能凭空替他们猜出下一层。\n\n而时间正在被至命除燃烧。杨浞再次通过契约开口。\n\n“藤丸立香。”"

  "content": "北侧信标石台上，Alterego士郎一刀切断最后一尊法相的膝骨，踩着倒下的肩膀跃上高处，视野掠过城内所有仍亮着的生命信号。阿尔托莉雅已经在他开口前展开黑翼，翼下阴影沿街道向四方分裂，把主炮贯穿轴标成一道任何人都能看见的黑色禁区。\n\n“东城、南城，全部离开白线！”Alterego的声音借信标放大，毒气仍没因为场面大就收敛，“不想走的随便。等会儿被烤成灰，别说没人提醒。”\n\n阿尔托莉雅从他头顶掠过：“你这不叫疏散。”\n\n“听懂就行。”\n\n“有孩子。”\n\n“所以你去接。”\n\n黑翼压低，阿尔托莉雅沿街巷俯冲而下。几座被佛掌震斜的楼阁挡住出口，长剑便贴着承重柱根部斩过，暗色魔力避开人群，托着整面墙向后倒。居民从她让出的缝隙涌出，有人仍在回头看弥勒，有人死死抱着佛像不肯松手。她任那些人抱着自己的佛像，只抓住最前排两个孩子的衣领，把人放上冥途之马。\n\n“抓紧。”\n\n孩子看着她背后的黑翼，吓得连哭都忘了：“你、你是坏人吗？”阿尔托莉雅把缰绳一扯，黑马踏碎封住街口的金色结界：“现在没空回答。”另一边，Alterego把投影剑一柄柄插进地面。剑身彼此连接，临时拼出一条穿过塌城的高架通道。人群才走上去，弥勒降格后的第一阵魔力震荡便从宫殿压来，最前方三柄剑同时弯折。他右臂一抬，又补上六柄，嘴里则对着通讯骂了一句。\n\n“还剩多少？”\n\n终末人理圆满装置平静回答：“炮线内生命信号，一千七百九十二。预计清空时间，二十六秒。”\n\n“我们只有十二秒窗口。”\n\n“窗口自降格完成后计算，当前剩余九秒。”\n\nAlterego脸上的厌烦终于有了实体。他从高架上跳下，白色风衣在身后拉成一道直线，双掌同时按进街面。无限剑制没有完整展开，只把这一条撤离路替换成刑场里绝不会倒下的石道。数千柄剑从两侧升起，彼此咬合成护栏。\n\n“阿尔托莉雅！”\n\n黑马在三条街外扬起前蹄。阿尔托莉雅回头看见他抬手，立即明白那不是叫她回来。她把冥途之马的缰绳塞给一个年长居民，自己从马背跃起，黑翼在半空彻底展开。风压卷住尚未撤出的最后几百人，连同他们脚下的整段街道一起向高架推去。\n\n“别松手。”她说。\n\n居民来不及问该抓什么，身侧已经有无数投影剑向内合拢，组成不会割伤人的笼形支架。Alterego隔空握拳。支架沿石道高速滑行，撞碎两道封锁，越过正在坍塌的南门，最终冲出主炮白线。\n\n“炮线内生命信号，零。”\n\n终末人理圆满装置的声音落下时，十二秒还剩三秒。弥勒抬起巨掌。降格没有削弱他的力量。那只真实佛掌离开地面时，掌下数里岩层被血肉重量吸得一并升起；五指合拢，近千条金色手臂又从肩后展开，每条手臂都握着不同文明留下的武器。轨道光枪在腕骨间完成校准，反物质佛珠沿指缝旋转，重力金轮则压住地层，不许埋在最深处的炮管调整角度。\n\n“他在封炮口。”士郎说。\n\n“看见了。”立香的降格术尚未收回，声音里全是压不住的喘息，“村正！”\n\n村正右手朝地面一扣。白色火纹从心口骤然亮到指尖。她把创造之禊祓全部压进地下，火焰沿炮管外壁奔涌，所过之处，重力金轮施加的封锁被逐层洗去。弥勒肩后百条手臂当即转向她，文明光雨越过宫殿射来。祁荒仍盘膝坐在阵外，只将杨枝净瓶朝前倾斜。\n\n一线清液离开瓶口，落地便化作透明圆壁。第一束光撞上圆壁时被洗去热量，第二束失去方向，第三束则从中段开始腐蚀；可文明兵装的种类太多，净瓶不可能把每一种效果同时抹掉。第十七束空间压缩弹在圆壁表面咬出凹陷，紧跟着落下的对神震荡刃便从凹陷处穿入，直取立香后颈。\n\n祁荒终于离开坐姿。她只起了半身，金刚杵已越过立香肩侧。杵尖与震荡刃相碰，没有剧烈爆炸，刀刃内部关于“突破神性”的执着却被一击粉碎。兵装在半空散成普通金属，擦着立香脸侧飞过，割开一道细长血口。\n\n“说好不让你变成灰。”祁荒重新坐回原处，“破点相不算。”\n\n立香舔到唇边的血：“谢谢啊。”\n\n“不客气。”"

  "content": "立香踏进阵心。她抬起头，与伊耶那岐宫上方那尊从未真正降临地面的未来佛对视。弥勒也在看她。金色佛掌仍握着创造白火，掌纹每收紧一分，村正心口的火纹便向皮肉里沉一分。她的呼吸已经比走出地下时慢了许多，却仍将掌心朝上撑着，不许白火被从地脉拔走。士郎和玛修分立莲台前方，前者右臂缠满临时固定带，后者左臂的血沿盾柄越积越多。退进甬道的杨浞忽然回过头。\n\n“十二秒。”他说。\n\n“什么？”士郎问。\n\n“她把高处那东西压回肉身以后，炮线只有十二秒。过了，弥勒就会重新理解自己。”\n\n吉尔伽美什靠在甬道另一侧，EA横在膝前。她的左肩空洞尚未长出半点新肉，声音却仍带着不容置疑的笃定：“不是他重新理解，是这片金地会重新把他当成佛。信标能钉住位置，钉不住众生的念头。”立香听见了。她面朝宫殿，把右手按进左手掌心。逆向根源的术式从十指间一层层展开，先是弥勒留在金地里的佛印，再是近千代人类对救世主的祈愿，最后才触到那具始终藏在所有祈愿背后的身体。\n\n无数人生同时压进她的意识。她看见弥勒杀死饥荒，疾病在金光里从孩子肺叶间消失；看见海啸撞向城邦时，一只佛掌把整片大陆托出水面；看见第一艘飞船越过月球，驾驶舱里的年轻人还没来得及欢呼，便被他连人带船送回地面。她继续往后看。第二代、第三代、第一百代。弥勒一次次挡住离开地球的人，也一次次接住从星空坠落的尸体。\n\n立香在那些画面里找不到恨意。飞船被送回地面时，驾驶舱没有破；从星空坠落的尸体，也都被佛掌一具具接住。正因如此，术式才越来越重。每一份祈愿都在对她重复同一句话：人类需要被救。她只要有一息犹豫，刚被剥开的金光便会重新合拢。\n\n佛掌落下。士郎与玛修同时向前。盾面先接住掌心，投影剑阵随即从两侧撑住五指。掌力尚未完全抵达，盆地底部便整体下沉，祁荒布下的莲台因此被压进地面半尺。玛修左肩传来一声压抑骨响，膝甲随即砸裂结晶；士郎右腕的旧伤也沿投影结构向上炸开，血从固定带里喷出，十几柄剑当场碎掉一半。\n\n“前辈！”\n\n“别松盾。”立香说。\n\n她在那些祈愿里找到了一条极细的分界。人类想活。弥勒替他们决定了该怎样活。两者并不是同一件事。\n\n“你救过他们。”立香对天空说，“这件事不会因为你后来做错了就消失。”\n\n弥勒的声音自每一块金砖内部传来：“既然知道，为何仍要放他们去死？”\n\n“因为活着不是只剩下不死。”\n\n“你看过多少人死在路上？”\n\n“没你多。”掌力继续下沉，立香的喉咙被道场外泄的佛光割出血腥味，她咽了一下才把后半句说完，“所以我不替他们回答。”\n\n弥勒沉默了半息。那半息足够了。立香没有去碰那些已经发生的拯救，只抓住此刻仍缠在他身上的一句话——必须由他来救。\n\n她向外一扯。\n\n祁荒脚边的金刚杵随即发出梵唱，佛掌五指猛地一颤；村正的白火也沿宫墙旧刀痕向上追去。金光刚想填回巨身，便在火里褪成一层普通血肉。\n\n金色佛掌第一次有了重量。它原本覆盖整座天空，却在降格术触及本体的那一刻向下沉了数百丈。云层被掌背压得向两侧翻开，指尖擦过宫殿屋脊，数十座金塔随即在沉重断裂声中倾倒。佛掌表面不再是光。皮肤、骨骼、血管和掌纹逐一显现，巨大到令人无法把它与“人”联系在一起，却确确实实受制于血肉。\n\n降格继续向上。\n\n重叠在宫殿后的千尊佛影一尊接一尊熄灭；盘踞不同历史、不同人心、不同维度里的弥勒同时被压回这一处。遍在性断开时，金地各城都听见一声由远及近的钟响。第一声来自数百年前，第二声来自昨日，最后一声才落到此刻。钟声止住，所有居民抬起头。\n\n他们第一次看见了未来佛的本相。不是端坐云端、面容永远慈悲的塑像，也不是每个人心中最适合拯救自己的那张脸。一具金色巨身从伊耶那岐宫后缓缓显出，肩背横越山脉，胸膛由近千代文明材料与压缩魔力共同铸成；无数旧伤藏在皮肤下，有刀痕，有炮孔，也有早已被修补到只剩颜色差异的烧灼。那些都是人类曾经反抗过他的证据。\n\n巨人垂着眼。面容称不上狰狞，甚至比佛像更接近疲惫的人。城里有人跪下了。也有人抱起孩子，转身便跑。\n\n“现在！”立香喊道。"

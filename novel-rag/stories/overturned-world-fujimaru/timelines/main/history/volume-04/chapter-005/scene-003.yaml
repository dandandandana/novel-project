content: '“士郎——你。”立香把他说出来的最后一个字接住之后没有往下接话。她只是把自己的嘴唇抿成一条几乎看不见的线，然后把气从鼻子里长长地漏了出去。


  “你的所作所为——只是在体会活着吗。”


  她把眼睛从他腹部移向他下巴的轮廓线，再把视线从他的轮廓线拉到他眼角。他眼角那枚琥珀色的瞳仁在白色天花板的反光里特别淡。


  “在高中做好事也好。加入埋葬机关执行任务也好。”她看着他，嘴唇往下微微一压，“不……不止如此吧士郎。你应该在一直寻找着什么才对。不然你早就活不下去了。”


  “我和言峰绮礼生来便带有原罪。”士郎的声音从她头顶正上方往下降，每一个字都像是被他提前称过重量才放下来的，“于是我和他只能在无尽的赎罪中体会活着。这就是我活着的理由吧。”


  他顿了顿。把空出来的那只手从自己腿侧抬起来放在半空里。


  “至于我在寻找什么——我也不知道就是了。”


  “可能是一个答案、也可能是一个方法、或者是一个结果吧。”


  他把头重新低下来。那双琥珀色的眼睛从天花板上移回到她的脸上。唇边刚才那个还没有完全收回去的弧线在看见她眼眶底下那片潮湿时忽然僵了半格。


  “藤丸立香。你现在能理解了吗。”


  立香从他脸上看不到一丝一毫的笑意。她把视线慢慢从眼角拉到他的下颌，再从下颌拉到他的脖颈。


  “体会活着——那你为什么不像言峰绮礼那样。”她把这句话往前推，声音在她喉咙里轻轻顿了一下。


  “因为他的所作所为皆是恶人所举。”士郎的回答从嘴间直接掉下来，中间没有多余的停顿，“我做不出这样，立香。这就是我和他的不同。”


  “我做那些是因为——这是主会期待我们做的事情。这是人们期待的事情，有人会因此笑着，那就够了。”


  “就算你不会因此得到什么。”立香的嘴唇在进出这句话时抖了一整下。她控制不住这个抖动——它从她下颌根部直接拽着她的嘴唇往外弹。她的眼眶底上那片刚才还只是积着的泪水，现在正沿着眼裂边缘缓慢地往上漫。


  “啊。”言峰士郎用这个音节接过了她的上一句话，“但是有人笑着。这绝对是不会错的。”


  他看着她的眼睛。那枚琥珀色的瞳孔在她的视线里定住不动。


  “藤丸立香。这就是原因。”


  立香双手从自己身体两侧抬起来——绕过他腰的两侧，十指在他后腰上交错合拢。她把双条胳膊往他腰上收了一寸。


  “这样吗。士郎。你真是——”


  她把脸埋进他腹前那片已经被她咬过又哭过的衣料里。她隔着那层布面发出的声音被衣料纤维滤掉了一层棱角，只剩下闷闷的余响。


  “真是令人悲哀啊。士郎——我……”


  “我好心疼你。”


  她把环在他腰上的手臂又收了一截。手指在他背后的衣料上轻轻抠着，指甲在布料表面留下几道细细的抓痕，但很快就没了。


  “士郎，你这样我好……好难过。你身为我的从者——不。不只是从者。士郎，我希望你身为言峰士郎，能够好好的活着。幸福快乐的活着。”


  她的声音在衣料上被压成扁扁的一片，每一句从她嘴里往外漏时都带着嘴唇贴在布面上的闷音。


  “但是这件事情——我好像做不到。士郎。”


  “对不起——我……我就算看了你的过去，但是我做不到拯救你。士郎。你的过去我不管怎么说都能遇见一样——最后自我毁灭，士郎。”


  她把头从他腹前仰起来。眼眶底下那片已经在她眼睛底部积了许久的潮气仍然没有变成眼泪往下淌。


  “士郎，这样……真的好吗。”


  “立香。你知道的，我也说了。”士郎低头看着她。他的声音在她脸前落下来时带着一层和刚才没有任何的区别的轻。“我这辈子就是这样。为了赎罪而活着。”


  “但是我这个人很自私，士郎。你应该看出来了。”


  她说话的时候没有把环在他腰上的双手松开。那些交叉在他后腰上的手指反倒往内又收了一丁点。


  “身为我的从者——我……”她把自己的眼皮往下闭了一瞬。再睁开时声音里已经没有刚才的颤意。她把这声吸进胸腔里压稳了。


  “不允许你走向自我毁灭。士郎。”


  “现在。我要你——为了我而活着。”


  她把脸往他那片被自己嘴唇贴出湿痕的衣料上又埋回了一点。


  “听明白了吗，言峰士郎。”她把他的名字一个字一个字往他腹前抵进去。“我要你——为了你的御主。藤丸立香。活着。”'

content: '正厅的庆功宴已经撤掉了。


  长桌上摊着三张从不同年代留下的地图，最旧的一张仍把伊耶那岐金地标成神宫，最新的一张只剩密密麻麻的红点。伊耶娜美将一枚棋子放在城中央，棋子下方写着弥勒。


  “从你们进入星之内海以后，伊耶那岐金地开始向外扩张。边界推进了三十七里，吞掉两座废城和一条灵脉。现在那里有九十六名法相，一名世尊。”


  “九十六名法相都是从地下容器里出来的？”立香问。


  “七十二名可以确认。剩下二十四名从伊耶那岐金地内部诞生。”


  祁荒靠在窗边：“我看见的空位不止七十二个。”


  “另外一些去了别处。”


  “哪里？”


  “我不知道。”


  立香把二十四这个数字圈起来：“先说已知。法相是什么层级？”


  “每一名都持有神明或菩萨的部分权能，弱的相当于从者，强的能独立击破一座金地。它们没有完整来历，却知道自己是谁。被问到过去时，它们也能给出完全对应的记忆。”


  “和你一样。”杨浞说。


  正厅里没人替他修饰。


  伊耶娜美把手放在桌边，没有反驳：“和我一样。”


  玛修翻到记录页的下一面：“也就是说，终末人理圆满装置曾经准备了不止一位神灵的替代个体。弥勒把它们唤醒，再组成自己的军队。”


  “不能确定是弥勒唤醒。”伊耶娜美说，“容器属于地下文明，法相却在听从弥勒。中间发生了什么，我看不见。”


  “那名世尊呢？”


  伊耶娜美将第二枚棋子放到伊耶那岐金地东侧。棋子落下时，桌上的地图自动向外烧出一圈焦边。


  “自称天照命世尊。她占据了伊耶那岐金地的东门，身上同时存在天照大神的太阳权能和弥勒授予的佛果。她不是法相的统帅，只是一道门。”


  “通往哪里？”吉尔伽美什问。


  “创造之禊祓。”


  杨浞俯身查看东门附近的地形。那里原本是一片祭祀用的广场，现在被拓成九层环形阵地，每一层都画着不同的太阳纹。


  “打死她，门会开？”


  “不一定。”


  “那为什么要打？”


  “因为不打，她会从背后把进入最深层的人烧干净。”


  “这就够了。”


  吉尔伽美什伸手拨了拨代表世尊的棋子。棋子没动，反倒在她指尖留下了一小块灼痕。她用拇指擦去那块焦黑，脸上终于有了兴趣。


  “太阳权能交给本王。蜀帝，你负责佛果。”


  “为什么不是反过来？”


  “因为你带来的那颗星正在压制所有冒名者。她见到你，多半会先杀你。”


  “有理。”


  “而且太阳是本王的收藏。”


  “这句没理。”


  “本王不需要你认可。”


  两个人就这样分完了一名世尊。立香没有马上确认，她先问伊耶娜美：“弥勒在哪里？”


  伊耶娜美指向整座金地。


  “到处都是。”


  “本体。”


  “伊耶那岐宫原址。它没有移动过，但金地里每一尊佛像、每一道法相、每一粒被佛光照过的尘土，都能成为它观察外界的眼睛。你们潜入的那一刻，它就会知道。”


  “那就不潜入。”村正说。


  她一直站在桌子末端，肩上的大太刀顶着身后的木柱。听到众人看过来，她把刀放到桌边，刀鞘横着压住了伊耶那岐金地的南北两端。


  “明着打。让东门闹到整个金地都知道，老夫从地下走。”


  “地下也有法相。”


  “有路就行。”


  “没有完整的路。”


  “那就开一条。”


  村正把创造之禊祓的位置点给立香看。那处结构位于主炮上方，距离地表超过三千米，原有通道被九道互相叠压的结界封住。结界来自不同体系，有神代术式，也有地下文明的权限锁。


  “刀能切开前面的，权限锁怎么办？”玛修问。


  “这不是有个喜欢乱逛的吗。”


  所有人看向祁荒。


  祁荒从窗边站直：“千子村正，你请人帮忙的方式很有个性。”


  “那你去不去？”


  “去。那里面说不定有我想知道的事情。”


  “你想知道什么？”立香问。


  “伊耶娜美到底怎么醒的。那些法相又是谁让它们醒的。还有创造之禊祓为什么主动关上。”


  “最后一条是谁告诉你的？”


  祁荒朝立香笑了一下：“你刚才进门时在想什么，我能猜到。”


  “别猜我的脑子。”


  “遵命。”


  她答应得过于轻快，立香决定默认这句话没有效力。


  计划逐渐在地图上成形。


  第一组由杨浞与吉尔伽美什从东侧正面进攻，目标不是立刻击杀天照命世尊，而是把她和能够调动的法相全部锁在地表。第二组由村正与祁荒通过星之内海残存通道进入地下，突破九重封锁，唤醒创造之禊祓。立香、士郎与玛修作为中枢组，负责接近弥勒、完成降格、放置信标，并在主炮破防后正面承受反击。


  伊耶娜美与月读命金地负责支撑外部结界，接应可能撤回的伤员。'

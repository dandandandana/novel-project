content: '“你不参战？”吉尔伽美什问伊耶娜美。


  “我离开月读命金地，城里的人活不过半个时辰。”


  “以前没这个限制。”


  “以前我不知道。”


  修武星让那条维系生命的联系显形，也让伊耶娜美第一次看清自己的每一次远行都在消耗谁。她曾经离开城池参加战斗，城里那些没能等她回来的人，被归进了弥勒袭击带来的死亡。现在她知道其中至少有一部分死在自己手上。


  立香从地图上抬头：“这不是你的错。”


  “是不是都一样。他们不会因此活过来。”


  “但你会因此改变下一次选择。”


  伊耶娜美与她对视片刻，把月读命金地的棋子向后移了一格。


  “我会留在这里。”


  “好。”


  立香没有继续劝。伊耶娜美需要的不是原谅，而是一个不会再重复的决定。


  “还有一个问题。”玛修说，“主炮信标由谁放置？”


  立香正要开口，士郎先把自己的棋子放到弥勒面前。


  “我。”


  “不行。”


  “理由。”


  “你要和我一起完成降格。”


  “降格术由你施展，我只能负责挡住弥勒。信标放置和这件事不冲突。”


  “你又准备利用不死性。”


  “这是最合适的分配。”


  立香用两根手指夹起他的棋子，放回自己旁边：“待定。”


  “立香。”


  “待定不是同意你偷偷去。”


  “我没有偷偷去。”


  “你上次也是当着我的面准备死。”


  玛修把记录板举高了一点，挡住自己的脸。村正低头研究地图，嘴角却已经咧开。祁荒看看立香，又看看士郎，连任务记录都忘了翻页。


  士郎在众目睽睽之下选择退一步。


  “那就晚上再讨论。”


  “为什么是晚上？”


  “你白天比较不讲理。”


  “我晚上也不讲。”


  “我知道。”


  立香被他这句理所当然堵了回来。她瞪了他一眼，士郎已经低头去看地图，拒绝再提供可以被抓住的句尾。


  “咳。”玛修从记录板后探出头，“信标问题待定。前辈，主炮发射后呢？创造之禊祓需要由谁操作？”


  “它可能不接受操作。”祁荒说。


  “什么意思？”


  “你们一直把它当成装置。但如果终末人理圆满装置没有说谎，地下文明喜欢给造物留下选择，那创造之禊祓也许会判断我们值不值得协助。”


  村正把刀鞘在地上磕了一下：“那就讲道理。”


  “它如果不讲呢？”


  “老夫的刀也会讲。”


  “你这个顺序是不是反了？”


  “能听懂哪个就讲哪个。”


  立香在任务记录上补了一条：创造之禊祓具有自主选择的可能，村正不得先砍。


  村正看见了：“喂。”


  “这是命令。”


  “老夫什么时候说要先砍了？”


  “你刚才。”


  “老夫说的是讲不通以后。”


  “所以我写的是不得先砍。”


  村正盯着那行字，找不到可以反驳的地方，只能把大太刀重新扛回肩上。祁荒在旁边笑得很开心，下一刻就被村正安排去准备地下路线。


  会议结束前，伊耶娜美拿出一只木盒。


  盒子里装着九枚黑色钉子。每一枚都没有钉帽，表面刻着极细的神代文字。


  “这是进入地下结界的钥匙。九道封锁，每过一层留下一枚。最后一枚钉进创造之禊祓外壳，能让它从闭锁状态里醒来。”


  村正拿起一枚，指腹刚碰到表面，钉子便发出婴儿啼哭般的声音。她手一松，钉子落回盒里，声音也停了。


  “这东西谁做的？”


  “我。”


  “你什么时候会做这个了？”


  “我醒来的时候就会。”


  正厅重新安静下来。


  伊耶娜美看着木盒里的九枚钉子，第一次对这份理所当然产生了疑问。她拥有女神的记忆，拥有女神的权能，知道如何用从未见过的材料打开地下文明制造的权限锁。过去，这些能力都被她当作自己的东西。


  修武星照下后，答案分成了两份。


  一份属于伊耶娜美。


  另一份不知道属于谁。


  “你没有做过它们。”杨浞说。


  “我记得我做过。”


  “在哪里？”


  伊耶娜美张口，没能给出地点。


  “谁在旁边？”


  她依然答不上来。


  “用了多久？”


  木盒被她合上。


  “别问了。”


  杨浞没有再问。他拿过木盒，交给村正。


  “记忆可以是真的，做过的人未必是你。先把眼前的事做完。”


  伊耶娜美看了他一眼：“东方的帝王都这么安慰人？”


  “本王没有安慰你。”


  “听出来了。”


  “那就好。”


  立香确认完所有人的任务，把地图收进通讯器。距离出发还有十个小时。月读命金地没有真正的夜晚了，但人仍然需要睡觉、吃饭、修理装备，也需要在走进一场可能回不来的战斗前，把没说完的话处理掉。


  众人离开正厅后，杨浞在门外叫住立香。


  “御主。”'

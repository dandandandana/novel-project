content: '“我有时候会想，”立香说，“如果你没经历那些事，也许你会轻松一点。可我真见到那样的你，可能又不会喜欢。”


  士郎看向她。


  “我不是说他不好。”她立刻补上，“就是不认识。就算名字、脸、说话方式都一样，我也不知道该怎么对他。日本那个Alterego已经够麻烦了，再来一个——”


  “你喜欢我？”


  立香停住。


  士郎问得没有铺垫，也没有给她留下可以装作没听懂的词。她刚才说了太长一段，真正想藏的部分反而被他从中间直接拿走。


  “你能不能别这么问？”


  “可以。”


  “也别立刻答应。”


  “那要怎么问？”


  “不问。”


  “好。”


  士郎真不问了。他向后靠了一点，把目光从她脸上移开。立香等了几秒，发现他没有准备绕回来，反而更恼火。


  “你就这样？”


  “你说不问。”


  “我让你不问，你就不问？”


  “不然呢？”


  “平时怎么没这么听话？”


  “因为平时你说的不是这个。”


  立香盯着他。士郎耳后那道日本终战留下的切伤已经闭合，只剩一道比周围皮肤更浅的新痕。他避开目光时，那道痕从发际一直露到颈侧。立香下午检查他的右手时没有在意，现在却觉得它碍眼。


  “喜欢。”她说。


  士郎转回来。


  立香没让他开口：“我说完之前你先别问。”


  他点头。


  “我很倾慕你。不是从今天开始，也不是因为你在日本替我挡了多少次。具体什么时候，我不知道。可能是第一次召唤以后，也可能更晚。你总做些让我生气的事，又总在我真的需要时留在旁边。我不是想让你回报，也不是因为我们有契约才——”


  她说到这里，发现自己正在把所有原因排成一份报告，越说越不像最初想说的话。


  “算了，不解释了。”


  “好。”


  “你别只会说好。”


  “你让我先别问。”


  “现在可以说了。”


  士郎没有立刻接。他的左手搭在膝上，手指先收紧又松开。立香看见他想抬手，最后还是停在原处。


  “你要说拒绝，”她先开口，“最好快一点。明天还要召唤，我不想顶着这个问题念召唤词。”


  “不是拒绝。”


  “那是什么？”


  “我在想该怎么说。”


  “你也会想这个？”


  “会。”


  “我以为你什么都直接说。”


  “刚才直接问，你不是生气了？”


  “那不一样。”


  “哪里不一样？”


  “你别岔开。”


  士郎看了她一会儿，终于说：“我愿意留在你身边。”


  立香等着后面。没有了。


  “就这句？”


  “还有。”


  “那你继续。”


  “你刚才说自己没什么大志向。”


  “我还没说。”


  “你以前说过。”


  立香想起来了。在日本的某个晚上，她确实向他提过，自己从来没认真想过“拯救世界”这种事。她只是被推到御主的位置上，身后有人等，前面有人需要，所以就往前走。那次对话没有说完，警报把他们重新叫回战斗。


  “我现在也是这么想的。”立香说，“大家把希望放在我这里，我不想辜负。能救的人就救，能守住的就守住。至于世界……它太大了，我连下一处特异点在哪都不知道。”


  “那就先别管那么大。”


  “可我们做的就是这个。”


  “做事和怎么想不是一回事。”士郎说，“你不用先把自己变成一个想拯救世界的人，才有资格去做。既然已经决定了，就去做吧。”


  立香抬眼：“听起来像让我自己努力。”


  “我会在。”


  “在哪里？”


  “你身边。”


  “下一个特异点也在？”


  “在。”


  “再下一个？”


  “只要你还去。”


  “如果我不去呢？”


  “那就不去。”


  “奥尔加玛丽会先把我们两个赶出迦勒底。”


  “可以先找住处。”


  立香没忍住笑了一下。这个假设没有任何现实可能，士郎却答得像真的准备过。她笑完，又问：“如果有一天我做错了呢？”


  “我会拦你。”


  “你不是说一直在我身边？”


  “在你身边和什么都听你的，不是一回事。”


  “今天下午是谁为了进观察室骗我？”


  “那件事已经道歉了。”


  “我没接受。”


  “那再道歉一次。”


  “不用。”


  “好。”


  又绕回这个字。立香这次没有生气。她从椅子上站起来，士郎以为谈话结束，也准备起身。立香却走到他面前，挡住了门的方向。


  “还有一件。”


  “什么？”


  “你刚才没回答。”


  “我回答了。”


  “你只说会留在我身边。”


  “这不是回答？”


  “不是完整的。”


  士郎看着她，像在判断这句话到底要他补什么。立香没有再帮。他可以看穿战斗里的落点，却总在这种问题上慢半拍。她等到有些后悔，士郎才开口。


  “我也喜欢你。”


  “晚了。”


  “那怎么办？”


  “重新说。”


  “藤丸立香。”


  “为什么叫全名？”


  “你要求多。”


  “算了，还是别说了。”


  她转身要走。士郎左手拉住她袖口，只抓住一点布料，力气也不大。立香本来就没真想走，被这一拉便停住。


  “我喜欢你。”他说，“不是因为契约，也不是因为你需要一个从者。我想留在你身边。这样够不够？”


  立香没有马上回答。她低头看着被他抓住的袖口，向前又走了半步。士郎不得不松手，以免固定板撞到她。


  “还差一点。”


  “差什么？”


  “你低头。”


  士郎照做。两个人离得太近，他直到低下去才明白她要做什么。立香原本准备得比现在从容，真正对上他的视线，脑子里只剩一个很实际的问题。


  “会碰到你耳后的伤吗？”


  “不会。”


  “右肩呢？”


  “也不会。”


  “那你别动。”


  她吻上去。


  第一下没有找准，碰到的是士郎嘴角。立香想退开重来，士郎却用还能活动的左手扶住她后腰。动作牵到腕伤，他的手没有完全落稳，只隔着衣服压住一小块位置。立香停了一瞬，确认他没有要放开，便重新靠近。


  这次谁都没说话。


  亲吻比她想象中短，也没有让人忽然知道该怎么处理接下来的所有事。士郎刚喝过桌上那杯冷水，唇上没有别的味道。她退开时，两个人仍保持着过近的距离。


  士郎先问：“现在够了？”


  “你为什么一定要在这时候问？”


  “怕你还要我重新来。”


  “闭嘴。”


  “好。”'

  "content": "村正拔刀。\n\n“——『天羽羽斩』。”\n\n决着只需一刀。\n\n刀从左下向右上挥过。\n\n锋口只越过弥勒胸前一寸，宫殿废墟另一端却同时亮起白线。近处与远处失去了先后：人形佛身先被斩开，弥勒身后尚未熄灭的金光紧接着从中断裂，天空那道主炮圆孔也被继续向两侧推开。\n\n白昼被切成两半。\n\n更远处，云层沿同一条线分开；金地尽头的山脉过了数息才显出平整断面，整颗行星也在那一刻发出低沉到无人耳朵能够听全的震鸣。\n\n村正手腕猛地一拧。\n\n本该继续向下的白线骤然折返，沿她脚下那条地缝灌入黑暗。缝底的惨白弧面再次震动，原有旧伤旁多出一道贯穿裂口。地表因此向上拱起数丈，最终没有分开。\n\n迟到的声音随后抵达。云层分裂的尖啸、山脉错位的轰鸣、三件宝具崩散时的碎响从远近各处一并压回战场。玛修炮形武装向后炸开，她被后坐力掀出数十米，落地时左臂彻底垂下；阿尔托莉雅黑刃断去前半，第四道承伤刻纹也随即熄灭；Alterego的伪天丛云散回无数剑影，他单膝落地，手掌已经握不住任何东西。\n\n村正站在原地。天羽羽斩从刃尖开始崩散。她右臂皮肉大半烧尽，露出的骨骼也布满黑色裂纹，心口禊祓火纹却慢慢熄灭。士郎从弥勒身后摔下，玛修赶在他撞地前用尚能活动的右手抓住衣领，两人一起滚进碎石。弥勒仍保持出掌姿势。\n\n片刻后，他的手臂从中线分开。裂痕一路越过肩膀、胸膛与腰腹，没有血立即喷出，只有一层极细白光从伤口中透出来。两侧血肉仍在向中间生长，碰到那层白光便无声滑开，怎么也接不到一起。弥勒低头看了一眼，放下手。\n\n人形佛身在他身后分成两半，自己却没有立刻倒下。他沿着那条斩线回头，看见炮线外的人群。城市已毁去大半，山川也在下沉，许多人带着伤，更多人甚至不知道明天住在哪里。没有金地替他们保证饥饿不会再来，也没有救世主提前拦住可能失败的路。\n\n有人仍跪着。有人站了起来。还有一个孩子从冥途之马上跳下，抓住母亲的手，指向被斩开的天空。那道裂隙后面有星星，白昼里也看得见。\n\n弥勒望了很久。手指原本还在试着合拢，后来停了。他笑了一下，肩膀也跟着慢慢垂下去。\n\n“人类自由了。”他说。\n\n声音很轻，只从破裂胸腔里出来。立香仍在远处听见了。她扶着祁荒站起，嘴唇动了一下，最后只把手垂回身侧。炮线外已经有人在哭，也有人推开同伴的搀扶，自己朝废墟走来。弥勒没有等回答。他将尚能合拢的双手移到胸前，十指抵在一起。斩线穿过手掌，动作并不完整，他仍做完了合十。\n\n“我救过人，也拦过人。前一件事不能替后一件赎罪。”\n\n村正以只剩骨骼轮廓的右手撑住刀柄。刀已经散尽，她掌中其实什么都没有。\n\n“你现在说这个，想让谁原谅你？”\n\n“谁都不用。”弥勒看向她，“我也不求。”\n\n他低头看了看脚下这片被自己守成牢笼的土地。\n\n“若十八层地狱真有我的位置，我便下去。被我拦过的人想骂，想唾，便让他们来。”\n\n弥勒停了一下，笑意仍在。\n\n“那也是他们的自由。”\n\n白光从斩线里向外扩大。他的身体没有爆炸，也没有化成宏大的佛光。金色血肉只是失去连接，一片片从人形上剥落，落地便变成普通尘土。胸口最深处那团由近千代人类祈愿凝成的核心最后显露出来，仍在微弱搏动。弥勒低头看它一眼，主动松开了维持。\n\n搏动停止。\n\n弥勒死了。\n\n伊耶那岐金地所有佛像在同一刻低下头。不是朝胜者叩拜，失去支撑的石颈只是在重力下断裂；一颗颗佛首落进街巷，沉闷撞击由近及远传开。宫殿上空最后一圈金色佛光随之熄灭，天空那道由天羽羽斩打开的缝却没有合拢，星光沿裂口落到土地上。"

  "content": "弥勒第二步没能踏出。村正等到了第三秒。\n\n“够了。”\n\n她把短刀插进自己脚前。\n\n黑火从影子里升起。火舌一落地，金砖便像承受不住重量般一块块下陷。它先缠住村正双腿，再沿脊背攀上双肩。右臂里的橘红火焰被第一缕黑火扯了出来，经过心口时，村正全身猛地一弓。\n\n锻炉般的轰鸣从她骨头里传出。\n\n橘红火被压进短刀。刀身当场烧成白色，却没有熔断。紧接着，青色火光从她每一道裂开的经脉间渗出。它经过的地方没有愈合，原本彼此冲撞的两色火焰却忽然安静下来，贴着同一条刃口向前流动。\n\n最后一色来自整个战场。\n\n宫墙、地脉、主炮伤口与佛印上的白火同时倒卷。无数细流越过众人头顶，在村正高举的右掌上汇成一团刺眼白日。白火离开弥勒身体的刹那，他胸前圆洞立刻向内收拢；金色肉芽刚探过伤口边缘，玛修便看见村正五指合拢。\n\n黑火一口将白日吞了进去。\n\n村正心口的白纹随之变黑。火烧过下颌，越过双眼。战场在她视野中褪去颜色，只剩下一条条能够落刀的线：弥勒的手臂，三件宝具的交点，士郎快要断开的戟杆，还有更深处一条埋在大地里的旧痕。\n\n“诸般集约。”\n\n她握住短刀。刀刃从中段熔化，又在黑火里重新长出。\n\n“万物宿愿。所有非业。”\n\n刀每长一寸，村正胸口便暗下一块。黑火把那些剥落的光压进钢中，刃面因此越来越亮，她的脸色却迅速灰败。右手皮肤先从指尖开裂，血刚流出便被火烧尽。\n\n“一切，皆为到达此刀而存。”\n\n短刀延长到三尺时，火焰忽然停住。\n\n“——『斩尽三千繁华梦』。”\n\n刀名落下，大地深处传来第二声剑鸣。\n\n那声音太远，也太重。伊耶那岐宫的废墟先齐齐向上跳了一寸，远处山脉随后拱起，轮廓像有什么庞然之物在地下翻身。立香终端上的地层图全部变红，警报却连异常源都标不出来。下一刻，战场中央裂开一条深缝。\n\n缝底不是熔岩。\n\n一截惨白弧面从黑暗里露出来，宽得足以横过整座宫殿，表面留着一道不知延伸了多少里的旧伤。没人来得及判断那是什么。村正掌中的刀已经朝那道旧伤微微偏转，像被地下某种东西隔着亿万吨岩层握住了刀背。\n\n喀嚓。\n\n她右腕骨裂开。\n\n刀身却继续延长。黑火从刃口向内退去，颜色、热量与声音都被收进一条细得近乎看不见的白线。村正没有抬高剑，只把锋口对准仍与三件宝具相持的弥勒。她右臂皮肤成片剥落，露出的骨骼也在接连崩出裂纹。\n\n弥勒看见她身后的地缝，又看了一眼炮线外的人群。他没有撤掌。金色掌骨在白炮与两道剑光中一寸寸碎裂，脚步仍钉在原处。\n\n“原来最后是你。”他说。\n\n村正向前踏出第三步。\n\n“借你吉言。”\n\n士郎在同一刻松开大戟。投影兵装承受到极限，沿裂纹化成大片白色碎光；他从弥勒背后坠下，玛修的白炮便趁喉前束缚消失骤然推进。阿尔托莉雅与Alterego同时压下剑锋，佛掌由掌心向后彻底裂开，三件宝具穿过手臂，重重撞上弥勒胸口。"

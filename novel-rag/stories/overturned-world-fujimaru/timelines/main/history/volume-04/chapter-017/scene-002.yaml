  "content": "士郎踏碎地面。大戟从身后拖出一道长弧，刃口没有先斩弥勒，而是横扫他身前所有兵装。第一支光枪被戟援勾住，士郎转腰将它甩向佛珠群；反物质在半空炸开，冲击还没扩散，戟杆已压进第二支枪身，把爆炸连同武器一起向下砸入废墟。弥勒从火里穿过，一拳落向士郎面门。\n\n弥勒肩头才向下沉，士郎的视线已经移到那只拳上。他没有躲，只把戟柄竖在脸侧，以右肩承住长柄受力点。拳骨撞上戟杆的瞬间，肩胛发出一声清晰断响；整个右臂随即垂下，手指再也无法握紧。可大戟也借这记拳击向内弹回，戟尾从下方撞上弥勒肘窝，左手随即沿杆滑进，重新把兵器压到他颈前。\n\n“抓住你了。”\n\n士郎左臂收紧，戟杆横锁喉骨，双腿从后方卡住弥勒膝盖。弥勒向前踏步，想把他连人带戟撞向地面；玛修的巨盾已从正面落下，盾底插进两人脚前，硬生生截断这一步。\n\n“盾啊，于此存在。”\n\n多功能武装从巨盾形态继续变换。盾背装甲向两侧展开，中央断罪之枪则被推入炮管；英杰之帜把星之吐息压到灵基能够承受的最高点，白色光芒沿玛修脊柱涌入武装。左肩已经抬不起来，她便把整条手臂锁死在外骨骼里，以身体替关节承担后坐力。\n\n“人之子亲手筑起的道理，由我在此证明。”\n\n弥勒抬起左掌。掌心金光压缩，不再展开千手，也不再借用整座金地。所有剩余魔力都向这只手聚集，指骨、掌骨和腕骨一层层增厚，掌后浮现的不是佛像，而是近千代被他留在地上的人类城市。\n\n“你们若一定要走。”弥勒说，“便先越过我。”\n\n阿尔托莉雅把黑金长剑举到肩侧。魔力从全身涌向刀刃，第二道承伤刻纹在高压下自行熄灭，第三道随即亮起。潘多拉臂铠仍牢牢闭合，属于骑士王反面的圣剑则重新显出暗色真身。\n\n“圣剑，解除拘束。”\n\nAlterego站到另一侧。他将手中黑刃向上一抛，无限剑制并未展开成完整刑场，心象世界里数不清的剑却同时熔化。凡铁、神造、魔剑、圣剑，所有结构沿同一条锋线聚集，最终在他掌中压成那柄无限接近剑之极致的伪天丛云。\n\n“赝品也好，工具也罢。”他看着弥勒，“至少这一刀，是我自己要砍。”\n\n弥勒掌心向前。人形佛身背后那近千代城市同时亮起。人们对平安、圆满和留在地上的愿望没有被强夺，作为他存在的一部分，全部压进这一掌。它不停止时间，也不剥夺反抗，只把能够击穿金地的纯粹力量从正面推出。\n\n“——『众生止步·极乐一掌』。”\n\n玛修的炮先响。低频震动从断罪之枪内部传入盾甲，左肩肌肉当场崩开，血沿外骨骼缝隙喷出；她没有松手，星之吐息已经压成一束白光，正面轰向佛掌中心。\n\n“行きます，前辈。明日を——取り戻す！”\n\n“全力全灵——『追回明日的迦勒底利刃』！”\n\n阿尔托莉雅紧随其后挥剑。暗色极光不是与白光并排，而是贴着其左侧切入，将佛掌外缘不断向中央回拢的力量整齐斩开。\n\n“——『誓约胜利之剑』！”\n\n右侧，Alterego的伪天丛云落下。剑光没有固定颜色，所有被熔进其中的宝具特性都在接触佛掌前归于同一件事：切断。它沿阿尔托莉雅制造的裂口向内穿过，与玛修白炮在掌心交汇。\n\n“——『天丛云村正·伪』！”\n\n四股力量正面咬合。接触处没有维持原状。弥勒的掌力先把玛修白炮压回十丈，炮管外甲因此向内挤碎，断罪之枪的后坐沿脊柱灌入双腿；阿尔托莉雅暗色极光随即从左侧切掉一截掌缘，金色力量向缺口泄出，沿地面削平半座山脉。Alterego的斩击则趁掌心结构偏移继续深入，把金光中那些文明城市一座座从“必须留下”的定义里分离。\n\n弥勒向前一步。士郎锁在他颈前的大戟顿时崩开一道裂纹。右肩已经抬不起来，他只能用左手和整个背部向后拖；膝弯同时被弥勒巨力撑开，靴底在地面犁出两道血迹。玛修的白炮又被压回三丈，炮口离她越来越近。\n\n“玛修！”立香喊道。\n\n“还在！”\n\n她咬住牙，左臂外骨骼从肩到腕连续炸开。英杰之帜中的无数心跳却在这一刻汇成同一节奏。不是替她挡住，也不是把她变成不会受伤的人。那面旗只告诉她，过去每一堵墙都是会裂的，守墙的人也会流血。墙仍然可以不退。白炮停止后缩。\n\n阿尔托莉雅第三道承伤刻纹熄灭，黑刃表面出现细裂。她把左臂潘多拉臂铠压在剑脊上，以本该用来释放灾厄的手继续推剑；Alterego的伪天丛云也在佛掌压力下不断剥落，每碎一层，心象世界便再送来百柄剑填补锋口。他嘴角与耳孔同时流血，手仍握得很稳。"

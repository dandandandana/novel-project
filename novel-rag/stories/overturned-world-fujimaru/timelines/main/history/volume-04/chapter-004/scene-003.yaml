content: '“嗯？”立香从喉咙里轻推了一个音。她侧眼往上看他——只看到他的下颌沿线，看不到他的眼睛：“那你的黑眼圈。”


  士郎手里那把掏耳勺的尖端在她耳廓软骨内侧面停住了一瞬。然后继续往前轻移。


  “……八小时最好。但是我的身体你也知道，有拟造躯壳。”他把声音压得比刚才更低了一点。


  “士郎……有些事情我不知道。”立香开口。


  她把自己的视线从他下巴上移开，重新落回舱壁软垫上那些扭曲不定的细小纹理上：“我不知道你为什么会这样。”


  舱体内的液压声在下一波按摩节奏开始之前忽然停顿了一秒。


  “但是这次也许是个死局——我觉得如果我不说可能就没机会了。”立香的声音抖了起来。


  “啊啊，说到底我并没有准备好去面对什么弥勒啊。”她把眼睛微微合上，橘色睫毛合拢时在按摩蓝光下压出两道浅浅的阴影：“就算是哈迪斯也够了。真的让我去面对这种至高无上的存在，让我去想办法去对付他们——真的很难啊士郎。”


  士郎把掏耳勺从她耳道里轻轻抽了出来。他把空出来的手盖在她的头顶上。掌心从她刘海往脑袋上方缓缓滑了两次。


  “我在这里。玛修也在这里。奥尔加玛丽所长和吉尔伽美什都在这里。”


  “你竟然没有跟我说什么拯救人理啊~士郎。”立香低声说着。她轻轻笑了两声。


  士郎的心眼在他体内第二次发出剧烈警告。这次警告比刚才的强度高了整整一倍。


  “我并不怕死，士郎。”立香把他的手从自己头顶拿下来握在自己手里。她没睁开眼。但握他手掌时用了两只手合扣——把他四指全部包在自己的掌心之间：“如果我害怕死，那么我连伦敦都不会去——就不会接过你给我的安魂了。”


  立香深吸了一口气。胸廓往上顶了一次。


  “我所担心的事情是——我被奥尔加玛丽所长，被达芬奇，被吉尔茜，被玛修和你，寄予无条件的信任。当我真的面对上那些存在——身为一名普通人，总会紧张，总会担心……有可能辜负你们的信任的。”


  “不会。”言峰士郎的这两个字从他嘴巴里落出来，几乎没有经过任何处理的延宕。他把自己另一只空闲的手翻过来——用指腹轻轻压了压立香的脸侧，“换个耳朵。”


  立香翻了个身子。


  “啊啊，我知道。你和其他人不一样就是了，言峰士郎。”她翻身之后把声音重新压回平稳，但她握着他手掌的力道在翻身的一瞬间又加了一点。


  “但是总而言之，我都是会害怕的。”立香把手从他手掌里抽出去。那只手在半空中停了片刻，然后按在他腹部战衣的下摆边缘处——不动了。


  她没有抬头看他的脸：“士郎，我真的很害怕……”


  当她意识到自己眼眶发潮的时候已经来不及用另一只手去抹了。索性直接把脸往他腹前埋了下去。她的前额顶着他战衣腹间的织物，眼泪从睫毛缝隙里渗出来后被他的深色衣料立刻吸掉了。


  “当我害怕的时候，我就会想到我的身旁还站着你们。而且如果我失误了——那么，你们就有可能会死。如果我死了你们也有可能会死——”她的声音闷在他的腹部，每句话的尾音都渗进了他衣料的织纤维里：


  “士郎，你明白的吧……士郎。”


  “所以当我害怕的时候我就会很冷静，士郎。”


  士郎没有说话。他把手放到她的后心位置——隔着那件白色的外套，手掌轻轻地压上她后心突突跳着的地方，然后一下一下慢慢拍。


  “馁。这点我做的不错吧。”立香抽泣了一下。她的肩膀在他手掌每一次落下来时都跟着轻轻耸了一截。


  “嗯。你在信息交流中占据了主动权，立香。很少有人能和你一样。”士郎的声音在她头顶上方发出来时已经下意识地落到了最低的档位。


  “啊……说多了。不过总算是问出来我想问的了。”


  言峰士郎的心眼第三次报警了。


  这次报警比他内部任何一次危机反馈都要强烈——不止是因她的话，更因为她接下来马上要说什么他隐约已经猜到了。


  “你也不在乎你自己的死活。你更在乎的是他人的生命没错吧士郎。”立香的声音从她埋进他腹前的布料里闷闷地冒出来。她的左手还在他衣摆下沿处紧攥着——那片衣料已经被她的手指抓出了好几道不规律的深折痕。


  “我说了我自己的原因了。”


  她从他腹前把脸稍微抬起来一点，嘴唇距离他的战衣还不到一指，她呼出的热息在他的深色衣料上短暂留下一小片形状不定的湿雾。


  “你……是为什么。”


  士郎的喉结在此时浮动了一下。


  然后立香那条被握着的手从他掌心里抽了出去。她将自己的右手翻过来——手背上那第三道鲜红色的令咒痕迹在舱体蓝光下开始往周边涌出刺眼的光。


  “言峰士郎，以令咒以令之——”


  她的手背上红光骤盛。


  “你。”'

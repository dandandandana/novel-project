content: '奥尔加玛丽只觉得认知都碎了，看着眼前打电话的女人，突然觉得两人或许不在一个世界。


  电话那头没有丝毫犹豫，直接开口：“妈。”


  “？”


  奥尔加玛丽强忍着吐槽的冲动，女人很快挂了电话，转头看向她。


  “够证明了吗？”


  “够了……够了。”奥尔加玛丽悬着的心终于落地，至少不会因为看过言峰士郎的档案而送命了。


  “奥尔加玛丽小姐，我想跟你谈的是……”女人刚要开口，一个金发碧眼的女人端着两碗面走了过来。


  “金闪闪，你态度竟然这么好?”金发碧眼的女人扫了二人一眼，放下面后坐到言峰金奈身边。


  “啊，自我介绍下，我是这家店的店长，神琦灰。”神琦灰轻笑着说道。


  “你好，我是奥尔加玛丽。”


  “杂修，上你的面就好，凑什么热闹。”言峰金奈斜睨着神琦灰，语气带着不耐。


  “我觉得你需要我。”神琦灰托着下巴说道。


  “哼……”言峰金奈没反驳，转头继续对玛丽说，“我可以帮你还清所有债务，还会给你一笔钱资助你。”


  奥尔加玛丽差点热泪盈眶，却强压着激动问：“需要我做什么？”


  “我要阿尼姆斯菲亚家的研究成果，把迦勒底亚斯重新启动起来。”言峰金奈说道，“我只要迦勒底能成，所长的位置，你来当。”'

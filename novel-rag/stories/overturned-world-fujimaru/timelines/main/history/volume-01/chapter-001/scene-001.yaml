content: '奥尔加玛丽不明白，为什么父亲会被时钟塔政法科带走审问，更不明白迦勒底如今最大的金主，为什么要硬塞一个魔术天赋几乎为零的门外汉进来。


  倒也不是完全没有天赋，基础魔术还算能用上——据那名金发女人说，藤丸立香是她带了好几年的弟子。可不知是师傅教得不用心，还是弟子太迟钝，再或者“门外汉”本就如此，那名叫藤丸立香的少女，怎么看都和普通人没两样。


  五年前，父亲马里斯比利·阿尼姆斯菲亚不知因何被时钟塔扣押后，阿尼姆斯菲亚家族就彻底没落了——大部分财产被冻结，家里的宝石、魔术礼装全被没收，还背上了一屁股债。


  还在时钟塔读书的奥尔加玛丽，只能一边打工一边兼顾学业。从前在伦敦住公寓、养尊处优的她，如今也得学着自己做饭，凡事都要精打细算，半点不敢浪费。


  奥尔加玛丽攥紧了拳，下定决心——一定要重振阿尼姆斯菲亚家族，更要查清父亲被扣押的真相。


  可眼下，她最该做的是应付催债的人。


  要是按常理，她大概会就这么苦哈哈地在时钟塔读完书，背着一辈子还不清的债，最后说不定只能把重振家族的担子交给后人——前提是有人愿意入赘阿尼姆斯菲亚家。


  就像那些三流言情小说写的那样，债欠多了，总会有“冤大头”找上门来帮忙。


  “嗯……好久没联系了，玛丽。”电话那头传来温和的男声。


  奥尔加玛丽一边叼着刚烤好的吐司，一边往肩上背包，另一只手举着电话，语气带着点不耐烦：“罗曼尼·阿其曼？有什么事？该不会我父亲也欠你钱了吧？”


  “糟了糟了……今晚的打工和课撞了啊。”她小声嘟囔着，翻开日程表，无奈地挠了挠自己的银发。


  电话那头的呼吸似乎顿了顿，接着男人叹了口气，缓缓说道：“有个人想见你，名叫言峰金奈。”


  “想见我？”奥尔加玛丽挑眉，“我现在可是个穷光蛋，该不会是想找我这个天体科的人，干些报酬少得可怜的活吧？”


  “她说，会帮你还清所有欠款。”


  奥尔加玛丽瞬间愣住，脑子里一片空白——!!!!!


  “罗曼尼！你说什么？！”


  “那可是几百万美元的债啊！我现在连信用卡都刷不了了……不对。”奥尔加玛丽深吸一口气，强压下激动，尽量平静地问：“她有什么要求？”


  “她只有一个要求——面谈。她随时有空，但仅限这个月。我把号码发给你.”


  “好，谢谢你，阿基曼先生。”玛丽长舒一口气，心里却犯着嘀咕——这种天上掉馅饼的事，怎么想都觉得不踏实。


  她琢磨了片刻，当即决定：晚上的课逃了，打工也不去了，先好好查一查这个言峰金奈到底是什么来头。


  可她的调查明显碰壁了，言峰金奈根本就是假名，连伪装都懒得做。


  奥尔加玛丽顿时悔了，早知道还不如去打工。


  “糟了糟了……我的全勤啊，罗曼那家伙……”她一边赶作业，一边盯着空白得像白纸的调查资料。


  “不对……”奥尔加突然顿住。


  “言峰……”


  这个姓氏，她好像在哪里听过。


  她立刻重新调查起“言峰”这个姓，一小时后，看着屏幕上的资料，整个人都愣住了。


  “言峰士郎……第五次圣杯战争、亚种圣杯战争的胜者，代行者，埋葬机关第四位 “神赐”？这什么中二病代号啊。”奥尔加玛丽盯着电脑屏幕，看着这份详尽到吓人的资料，顿时觉得自己小命可能要不保了。


  最吓人的就是两种资料——一种是真到像假的，却平平无奇；另一种是真的，还详尽得可怕。言峰士郎的资料，显然是后者。


  奥尔加玛丽心里清楚，自己必须联系那个叫言峰金奈的女人了。


  奥尔加玛丽第一次见到那名金发赤眸的女人时，不由自主生出一丝奇怪的感觉——既有畏惧，也有向往。


  和女人联系得很顺利，对方简单说了下见面地点，奥尔加玛丽没想到这种角色会选拉面馆。


  “你好，我是奥尔加玛丽·亚斯密雷特·阿尼姆斯菲亚，阿尼姆斯菲亚现任家主。”玛丽开口道。


  “嗯，坐吧。”


  见女人没打算自我介绍，玛丽只能入座。


  玛丽打量着眼前的女人，金色长发，赤红色蛇眸直勾勾盯着她，简单的白衬衫和牛仔裤，却藏不住姣好的身材。


  “请问……您和言峰士郎是什么关系？”奥尔加玛丽小心翼翼地开口。


  话一出口奥尔加玛丽就后悔了，这不等于是把主动权全交出去了吗？可不问又没底，早知道就不查“言峰”这个姓了。


  “我是他母亲。”女人嘴角勾起一抹愉悦的笑，开口说道。


  奥尔加玛丽只觉得听到了笑话，一个看起来才二十多的女人，居然说比自己大不了几岁的言峰士郎是她儿子。


  “哈？”


  女人见她不信，无奈摆摆手，拿起手机打了个电话。


  电话很快就通了。


  “喂？吉尔茜，怎么了？”


  听筒里传来青年的声音。


  “士郎，叫声妈妈听听。”女人嘴角的笑意越来越浓。'

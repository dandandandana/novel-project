content: '“盖提亚，看好了，这就是人类的伟业。”所罗门缓缓举起一只手，语气坚定，“这是等价交换的大魔术——伪·原理血戒·神赐。也是比较之理改造而成的。”


  霎时间，无数柔和的光芒从他体内涌出——那不是灵长类杀手的恶念，而是来自BEAST IV前身、属于人类爱的纯粹善意，缓缓汇入掌心的天平。


  “所罗门王，你在做什么？”神琦灰的声音竟穿透了时间停止，带着一丝错愕，“这个魔术发作，是要把自己当作筹码放上天秤的！正品的神赐根本不在你手上，就算你无所不能，仿造的东西是无法放上去筹码的，天平上没有对等的筹码，又怎么交换？你以为……”


  【还有五秒……】


  所罗门没有理会她的嘲讽，目光扫过魔神柱的残骸，缓缓戴上了自己的戒指，声音低沉而坚定：“诀别之时已至，以此舍弃世界。”


  话音落下的瞬间，掌心的天平一端猛地下沉——天平，接受了所罗门的一切。


  “我以我的一切作为交换——恢复七十二魔神柱，赋予它们对星之理的适应性，剩下的筹码用于将星之理困在这座神殿里，能困多久，就困多久！”


  “盖提亚！交给你了！拖到……”


  所罗门的话语没能说完，身体便化作点点灵子，消散在空气中，只留下一道微弱的光芒，融入天平之中。


  下一秒，时间恢复流动，盖提亚看着所罗门消散的方向，眼中闪过一丝复杂，随即厉声怒吼：“七十二魔神柱！全员备战，准备赴死！给我拖住这个狂妄自大的小人！”


  设定解禁：


  1


  星之吐息 rank ：???：


  ‘神琦灰’利用真祖的权能星之吐息改造而成的大规模自然现象，表现为魔力狂潮，实际上本质上是操纵地球上的魔力，不加以任何的改造而形成的灭世灾厄，必要时她会进行加工为光炮等攻击手段，但很显然现在没必要。


  2


  原理血戒·对抗 rank : ???：


  在人类讨伐了BEAST IV之后，通过它的比较之理和权能形成的原理血戒而改造出来的第一个大魔术，在面对对手时，可以把对方的攻击的来源当作筹码放上天平，自己的反击的来源作为另一个筹码，天平较轻的一方必定会落入下风直到败北。


  3


  原理血戒·钟楼 rank：EX：


  讨伐了操纵时间的二十七祖之后形成的原理血戒，经由所罗门王改造而成的大魔术。


  效果为放慢除了自己以外方圆1-30000米的人的时间二十万倍，并非为时间静止，更接近于加速自己的时间，但是范围越大，放慢的人越强，持续时间越短。


  当钟声响起时，你可以做任何事情。


  4


  伪·原理血戒·神赐 rank：EX：


  所罗门仿制人类根据BEAST IV改造出来的第二个大魔术，原理血戒·神赐，作用为先把自己放在天秤的一段，然后不断加码，达成等价交换的效果。


  发动时，使用者当前的生命就会消亡。


  这个仿品无法直接把使用者放在天秤的一端，自然也无法加码，所罗门必须用他的宝具才能够把自己放上去。


  只要添加的东西够多，拯救世界也不是不可能'

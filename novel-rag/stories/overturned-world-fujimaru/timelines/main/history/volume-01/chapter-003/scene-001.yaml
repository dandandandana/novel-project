content: '第三章


  震动平息后，立香晃了晃晕沉的脑袋，扶着奥尔加玛丽站起身。


  “发生什么了……”奥尔加玛丽声音发颤地开口，脸色发白。


  “是爆炸，所长，很大的爆炸！”立香的声音也控制不住发颤，两人互相搀扶着站稳。


  “放开我，我自己能走！哪里爆炸了？”奥尔加玛丽轻轻推开立香，强装冷静，声音却依旧止不住发颤。


  立香快步走到办公室门前，按了几下开门按钮，自动门却只发出嘎吱嘎吱的卡壳声，纹丝不动。


  “门变形了，所长！”立香用力扒着门缝，可不管怎么使劲，门都没有要开的迹象。


  “让开！”奥尔加玛丽冲到门前，狠狠踹了两脚，可厚重的金属门根本纹丝不动。


  她咬了咬牙，给自己施了强化魔术，再次抬脚猛踹。


  可惜，门依旧毫无反应。


  “可恶！怎么办？我的员工还在里面啊！”奥尔加玛丽急得跺脚，忽然眼睛一亮，“对了，窗户！”


  她将手按在窗户上，想靠魔术震碎玻璃，却毫无效果。


  “所长，窗户用的是高抗魔材料，魔术没用的。”立香一边说着，一边还在不停踹门。


  尝试无果，奥尔加玛丽浑身脱力般瘫坐在地。


  “我……我还能做什么……”她抱着膝盖，将脸埋了进去，声音带着哽咽。


  “所长！振作点！”立香看着这样的所长，急得手足无措，却也想不出办法带她离开。


  就在这时，办公室的门突然被人从外面踹飞进来，重重砸在墙上。


  身着华丽金铠的女人站在门口，手中握着一柄三柱形的长剑状武器，赤色蛇瞳扫过二人，确认她们没大碍后，开口道：“奥尔加玛丽，你在磨蹭什么？”


  “欸？”


  奥尔加玛丽猛地抬头，看向门口的女人，满脸震惊。


  “骗人的……是从者？除了达芬奇之外，居然还有其他从者？”奥尔加玛丽喃喃自语。


  “吉尔茜？怎么是你？”立香也彻底愣住了。


  吉尔茜像拎小鸡似的提起两人，语气不耐：“真是不识时务的杂修，赶紧动起来，去爆炸中心的管制室。”


  “管制室？爆炸的是管制室？！”奥尔加玛丽眼神瞬间空洞，“到底发生了什么？管制室突然爆炸，连迦勒底的赞助人都成了从者……”


  “情况紧急，没时间解释，本王稍后再跟你们说。”吉尔茜语气平淡，一左一右夹着二人往管制室方向走。


  可走了没几步，吉尔伽美什突然停下脚步，把两人放下：“你们自己去管制室。”


  “你身为从者，不和我们一起去吗？”奥尔加玛丽满脸难以置信地看向她。


  “欸？”立香一愣，顺着吉尔伽美什转身的方向看去，长廊尽头站着一个穿黑色哥特裙的女孩。


  “初次见面，第四次圣杯战争留存的Saber，我是爱尔特璐琪。”女孩轻声开口。


  “爱尔特璐琪六年前就已经死了，连原理血戒都被制成了大魔术。”吉尔茜语气冰冷，周身泛起金色涟漪。


  “嗯哼，果然骗不过英雄王吉尔伽美什呢。”爱尔特璐琪轻轻一笑，“我只是来打个招呼，剩下的，就交给我的乖狗狗跟你说吧。”


  她微微欠身行礼，两侧空房间里，立刻窜出一黑一白两只形似芙芙的猛犬。


  “那是芙芙吗？”立香下意识问道。


  “不是芙芙，立香、玛丽，快去管制室！那里或许还有人能救！”吉尔伽美什急忙催促。


  这话点醒了奥尔加玛丽，她猛地抬头：“对！还有我的员工！立香，我们走！”


  两个少女立刻朝着管制室狂奔，立香担忧地看了吉尔伽美什一眼，随即加快了脚步。


  爱尔特璐琪笑着看向吉尔伽美什，语气带着蛊惑：


  “你是不是很好奇，为什么千里眼和全知全能之星，都看不到接下来会发生什么？”


  吉尔伽美什懒得跟她废话，周身瞬间浮现几十道金色涟漪，无数宝具朝着两只猛犬射去。


  “说到底，你现在也只是个区区从者罢了。”爱尔特璐琪丝毫不惧，黑白双犬立刻上前，挡下了所有宝具。


  “再见啦，管制室的那个代行者，大概已经死透了吧。”爱尔特璐琪无视吉尔伽美什身旁的两道涟漪，身影直接消失在虚空中，只留下吉尔伽美什与两只猛犬对峙。


  【她不知道希耶尔有不死性。】


  吉尔伽美什心中冷笑，抽剑径直砍向扑来的黑犬。


  立香和奥尔加玛丽越靠近管制室，脚下的震动就越强烈，空气中的灼烧味也愈发浓烈，呛得人喉咙发紧——显然里面正发生着激烈的交战。


  突然一声巨响，管制室的大门被猛地撞破，两条被黑键扎成筛子的巨犬，一前一后从里面倒飞出来，重重摔在地上，没了气息。


  “什、什么？！”两人同时惊呼出声。


  “奥尔加玛丽所长？还有立香……你们还活着，那就好。”希耶尔的声音从管制室门口传来，带着难以掩饰的疲惫。'

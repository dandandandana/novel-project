content: '现在呆在伦敦的女人幸免于难，来自星之吐息的魔力狂潮对她这种长期在星之内海与神国的神明。影响虽然很大，但并不是不能接受，而且计时塔制造的限制她的住处反而成了很好的避难所。


  她是被盖亚剥夺主神权能和位格的神明。


  待潮汐一样的魔力过去之后，这位一张鹅蛋脸，有着挺直的鼻子，和常年锐利的眼神的女人从‘避难所’里走出来。


  “真以太……？”女人喃喃的开口道，她的手握了握，一只小巧的猫头鹰凭空出现，落在了她的肩头。


  她必须做点什么，尽管可能一无所获。


  于是女人动起来了，如同往常一样，尽管失去了所有，她依旧要做点什么。


  “吉尔伽美什的决策竟然是对的，迦勒底那边大概是幸免于难了，她花了大价钱做保护，一开始还以为是单纯浪费钱。”


  “那他们接下来……会来伦敦一趟，至少要拿到遗产。”女人低声做出了决断。


  她听到了许多令人作呕的声音，环顾四周，周围已经有死徒开始游荡起来。


  “不管怎么说，得先活下去。”女人看着令人作呕的死徒，她轻轻一跃，离开了这里。'

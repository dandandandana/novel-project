content: '说完立香抬起手晃了一下，跟在达芬奇后面走出了餐厅。运动鞋底踩在走廊合金地板上的声音“嗒嗒嗒“地远去了，和来的时候同样有节奏，但步频快了。


  餐厅里剩下三个人。


  厨房的水龙头关了。言峰士郎擦着手走出来，粉色围裙的系带在背后拖着，蝴蝶结已经彻底散了，两根带子垂在腿侧。


  吉尔伽美什拿起空茶杯，在手里转了一圈。


  “蛋糕做得不错？“


  “还行。“士郎把毛巾搭在肩上，弯腰捡起掉在地上的一颗吐司碎屑。


  “''很好吃''。她说的可是''很好吃''。“吉尔伽美什把茶杯放回桌上。“本王记得你以前连糖和盐都分不清。“


  “那是很早以前的事了，而且，八岁开始你就在吃我做的饭了。“


  “嗯。“吉尔伽美什从座位上站起来，把椅子推回桌下。“言峰士郎。“


  士郎直起腰。


  “昨晚做得不错。“


  她说完径直走向门口，经过士郎身边的时候没有减速。走廊的灯光从门洞涌进来，照在她金色的发梢上，然后脚步声也远了。


  餐厅里只剩下士郎和奥尔加玛丽。


  奥尔加玛丽低头看着自己空了的咖啡杯。杯底的残渍画出了一个不规则的深褐色环。


  “Ruler。“


  “在。“


  “……她真的没事？“


  士郎拉开一张椅子坐下来。粉色围裙的下摆堆在大腿上，皱成了一团。他把毛巾从肩上取下来，对折，放在桌面上。


  “昨晚哭了。“


  奥尔加玛丽的手指在咖啡杯上停住了。


  “也笑了。还骂了我几句。吃了蛋糕。喝了汽水。和我握了一下手。“


  “今天早上起来能自己洗漱、自己走到餐厅、自己决定去做检查、自己安排下午的训练。“


  士郎低头看着桌面上那条叠好的毛巾。


  “她没事。“


  奥尔加玛丽安静了五六秒。咖啡杯被她转了半圈，把手从左边转到了右边。


  “……那蛋糕。“


  “嗯？“


  “给我留一口。“


  “冰箱里。“


  “知道了。“奥尔加玛丽把椅子推回去，走了三步又回过头来。“围裙。“


  士郎低头看了看自己胸前那片皱巴巴的粉色。


  “怎么了？“


  “丑死了。明天换一条。“


  “好的。“


  脚步声消失在走廊尽头。


  在立香跟着达芬奇去检查的时候，一个身穿着蓝色便服的少女走了过来。


  “前辈，还是咖喱？“言峰士郎头也不抬的开口道。


  “达芬奇不让我吃特别辣的食物。“希耶尔坐到吧台，“早上没来吃真是可惜了，几年没吃过你做的东西了。”


  “中午饭也是我做。”


  “啊，这样啊。”希耶尔不打算废话了，她看向言峰士郎：“人理烧却的凶手有推论了吗？”


  “你问出这话应该有答案了吧。”


  “啊，和所长，你妈以及达芬奇讨论过了。”希耶尔说道，“不过具体的要去伦敦大概才知道。”


  “你又去不了。”言峰士郎说道，“盖提亚？”


  “嗯。”'

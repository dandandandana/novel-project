content: '“别说胡话了，我不会抛下你的！”立香的声音带着一丝哽咽。


  白兽的目光转向立香身后，在看到士郎的瞬间，骤然发出一声低沉的怒吼，周身的鬃毛尽数竖起，六只眼睛里燃起熊熊怒火，洁白的爪子缓缓抬起，蕴含着致命的威压。


  立香缓缓闭上眼睛，浑身控制不住地颤抖，心底的不甘翻涌而上。


  【就算我已经拼尽全力……可这样结束，真的好不甘心啊。】


  沉闷的棍棒敲击声突然响起，紧接着，一个沉稳的男声传入耳中。


  “放弃了吗？新来的御主？”


  立香猛地睁开眼睛，只见一个高大的巨人挡在她身前，硬生生接下了白兽的攻击。


  “你是？”


  立香愣了一瞬，随即反应过来，快步跑到士郎身边，小心翼翼地将他背在背上，转身往后退去。


  “倒是有几分眼力见。”Archer再度一棍砸向白兽，随后纵身跃到立香身旁。


  “嗷嗷嗷嗷——！”


  一击被挡，甚至遇到了能与自己角力的人的白兽彻底被激怒，带着满腔怒火朝着Archer猛扑而来。Archer稳稳伫立在原地，手中瞬间浮现出那杆黑色的许德拉长弓，毫不犹豫地拉满弓弦。


  “砰砰砰砰砰！”


  子弹破空的声音响起，第七圣典变形的步枪射出7.62大口径附魔穿甲弹，打在白兽身上虽未造成伤害，却成功阻拦了它的攻势。


  九道箭矢如同咆哮的巨龙，从弓上破空而出，带着撕裂空间的力量，毫无保留地射向白兽。


  白兽身上骤然泛起紫黑色的光芒，可刚浮现便被天上的星光压制，九道箭矢直直刺入它的体内。


  “唔——！”


  白兽发出一声凄厉的悲鸣，身形微微蜷缩。紧接着，希耶尔的三根黑键破空而来，围绕着白兽形成一个三角形，光之壁瞬间在三边升起，将它困在其中。


  可下一秒，光之壁内便传来剧烈的撞击声，墙壁微微震颤，Archer见状，缓缓向后退去，神色凝重。


  【不可力敌……是压根没伤到它，还是它的恢复速度太快了？】


  “你这家伙怎么这么重啊，言峰……”立香艰难地背着昏迷不醒的士郎，脚步有些踉跄，嘴里小声抱怨着，“以后要是有人嫁给你，可真是倒大霉了。”


  “喂，言峰，被女孩子背在背上，你就不觉得羞耻吗？快醒一醒啊。”


  立香有一搭没一搭地和他说着话，指尖紧紧攥着他的衣角，心底满是不安，连呼吸都变得小心翼翼，生怕确认到他已经濒死的事实。


  “把他放下来。”


  带着一身疲惫的希耶尔稳稳落在立香面前，立香抬头看到她，积压已久的情绪瞬间爆发，眼泪夺眶而出。


  “希耶尔前辈！快救救他！”


  “我……”立香连忙将士郎交到希耶尔手中，还想再说些什么，却被希耶尔抬手制止。


  “打住，他还没死，在我手上，就绝不会让他死。”希耶尔的语气带着不容置疑的笃定。


  几道高阶治愈魔术的白光落在士郎身上，他原本微弱的呼吸，渐渐变得平稳起来。


  Saber搀扶着脸色苍白的玛修，从被砸穿的洞口走了出来，语气沉重地说道：“那就是让冬木沦为死城的灾厄。”


  “我们至今不知道它的来历。”Saber无奈地摇了摇头，眼底满是凝重。


  “我知道。”希耶尔开口，目光转向立香，“但现在，当务之急是保住我们的战力。”


  立香一愣，顺着希耶尔的目光看去，才发现Archer已悄无声息地站在一旁。


  “现在言峰和伊莉雅都已经耗尽了令咒，如今能担任御主的，只有你了，立香。”希耶尔缓缓说道。


  立香混沌的大脑瞬间清醒，她深吸一口气，鼓起勇气看向Archer，缓缓伸出手。


  “我明白了。”她的声音带着一丝紧张，却无比坚定，“希腊的大英雄，我虽然只是个半吊子御主，但你愿意与我并肩，一起修正这个特异点吗？”


  希腊的大英雄缓缓转头，目光落在立香伸出的手上，郑重地点了点头，声音沉稳而有力：“从者，Archer，赫拉克勒斯，愿为您而战，完成您赋予我的试炼。”'

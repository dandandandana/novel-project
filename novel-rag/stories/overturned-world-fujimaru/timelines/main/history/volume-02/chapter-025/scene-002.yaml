content: '不是空洞——空洞好歹还意味着“曾经有过什么“。他的眼睛更像是一面完美的镜子，倒映着面前所有的一切，但镜面之后只有无尽的、均质的寒冷。


  “好歹主从一场。“


  Alterego歪了一下头，嘴角勾出一个弧度极浅的弯。他的目光越过贞德握剑的手，落在她面具般冷硬的面容上，语气随意得像是在和老朋友打招呼。


  “给我让个路怎么样？“


  贞德没有说话。


  她只是将剑举得更高了一寸。刃口上的雨水沿着血槽流淌而下，在剑尖汇聚成一颗颤抖的水珠，随后坠落，砸在石阶上无声碎裂。


  “你没有机会的，贞德。“


  Alterego轻声说道。他的语气没有威胁的意味，甚至带着某种令人不适的温柔——像是一个医生在告知病人检查结果。


  “不如考虑考虑你的命还有什么用。“


  他顿了一下。


  “——贞德。“


  名字被第二次念出的时候，那个音节的尾音在雨中拖得稍微长了一点。那不是强调，更像是品味。像是他在确认这个名字在自己嘴里的触感，然后决定了它不值得更多的注意力。


  贞德的嘴唇微微动了一下。但她最终没有开口。


  她只是冷冷地注视着他。


  暴雨中，铠甲的圣女与滴水不沾的幽灵在石阶上对峙着。雨水从贞德的金发梢端不断滴落，而Alterego身周的干燥区域在雨幕中形成了一个诡异的空白轮廓——他站在暴雨的正中央，却不属于这场暴雨。


  然后——


  脚步声从上方传来。


  轻而急促的脚步声，踩在被雨水浸湿的石阶上发出啪嗒啪嗒的响动。


  迦勒底的白色制服出现在了贞德的身侧。


  “迦勒底的御主——“贞德的眉心微不可察地一蹙，声音中浮现出一丝极力压制的焦灼，“请你回去。“


  “Archer目前正被我的Berserker拖住。“


  Alterego的视线越过贞德的肩膀，落在了刚刚跑下石阶、气息还未完全平复的立香身上。他的语调平淡得像是在陈述一条已经被证实的公理。


  “圣杯在我手上。“


  他的右手微微抬起，指尖之间，金色的微光在暴雨中隐约闪动了一下。圣杯并不在他手中——至少不在他的手掌上。但那道光芒清楚地告诉所有人，那件东西就在他触手可及的地方。


  “想要活命的话——“他将右手收回，插进衣袋里，动作随意得像是在街上散步，“你们没有太多选择。“


  立香的面色沉了下来。


  她的脑海中快速闪过了一系列画面：冠位Saber——那个被称为人类史上最强的剑士——是阿赖耶派来讨伐Alterego的。但就连那位冠位Saber都没能拖住他——甚至可能在极短的时间内就被他击败了。


  如果冠位Saber都做不到的事情……


  她看了一眼身旁的贞德。


  法兰西的圣女握着旗剑，脊背挺直如枪杆，面容冷峻而坚定。她很强。对于一个Saber职阶的从者来说，贞德·达尔克的灵基强度是毋庸置疑的。


  但面对一个连冠位都无法解决的敌人——


  “你想说什么？“


  立香压低了声音。她没有后退。她的双脚牢牢地踩在湿滑的石阶上，迦勒底制服的白色衣摆在暴雨中被打得湿透，紧贴在腿上。


  “我想说什么……“


  Alterego的语调忽然变了。


  不是变得严肃——恰恰相反。他的声音里多出了一层极其刺耳的戏谑，那种戏谑不是嘲笑，而是一种同情。


  “来自迦勒底的御主啊。“


  他拖长了“迦勒底“三个字的发音，像是在品尝一杯变质了的酒。


  “你知道这里为什么叫做特异点吗？“


  他歪了歪头。


  “哦——这里是第一个特异点。而且你是被卷入的，对吧？“


  他的目光从上到下扫过立香身上的白色迦勒底制服。那道目光不带任何欲念或敌意，只有一种冰冷的、精确的审视——像是在扫描一件物品的出厂标签。


  立香的牙关不自觉地绞紧了。


  “特异点……“


  “把你的通讯器打开。“


  Alterego忽然说道。他的语气从戏谑转为平淡，过渡得毫无痕迹，像是换了一个人在说话。


  “迦勒底的人大概也需要这些信息。“


  他微微侧过身，让出了一个面向石阶上方的角度——立香注意到，即使在这个看似放松的姿态中，他的身体重心始终没有离开过能够在瞬间发动攻击的位置。


  “当然，我透露这些信息的目的很简单。“


  他笑了。


  那个笑容是从嘴角开始的，缓慢地扩展到颧骨，但始终没有抵达眼睛。那双眼睛里仍然只有那面寒冷的镜子，倒映着暴雨和雨中两个少女的面孔。


  “投降。“


  两个字。


  没有铺垫，没有过渡。他用说“把通讯器打开“一样平淡的口吻，说出了这两个字。


  “你要我们投降……“


  立香的声音从牙缝里挤了出来。她的双手在身侧攥成了拳头，指甲深深掐入掌心的肉里，掌心传来尖锐的刺痛，但她没有松手。


  “怎么可能——“'

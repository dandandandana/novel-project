content: '立香的掌心贴在言峰士郎胸口的位置已经超过二十分钟了。治愈魔术泛出的淡绿色微光沿着她的指缝向外渗透，照亮了石阶上凝结的雨水，也照亮了言峰士郎紧闭的双眼与苍白得近乎透明的面孔。柳洞寺正殿的木质地板在连绵暴雨的浸润下泛着一层深色的潮湿光泽，屋檐下的雨水汇成一道道细流，沿着石灯笼的棱角蜿蜒而下，在台阶上划出无数条闪烁的银线。


  “这样就差不多了……“


  立香终于把手收了回来。她的手指在脱离接触的瞬间微微痉挛了一下，指尖因为长时间维持魔术回路的高强度运转而泛出不正常的绯红色，像是被沸水烫过。她喘了一口气，肩膀一沉，像是有什么一直紧绷着的弦突然松开了。


  “还是头一次连续用这么多次治愈魔术……“


  她低声说着，目光落在台阶上那个紧闭双眼的少年脸上。他的呼吸总算稳下来了——胸口有节律地起伏着，面色虽然仍旧苍白，但不再是之前那种像是所有血液都被抽空了的、近乎灰色的惨白。


  “用自己濒死来激发月虹……也只有他才做得出来。“


  立香的语气里混杂着疲惫、无奈和一丝连她自己都没有察觉到的敬意。


  “前辈……“


  玛修的声音从侧面传来，带着那种特有的、小心翼翼的温柔。少女半跪在立香身旁，盾牌斜靠在柱子上，紫色的眼眸里映着屋檐外不断倾泻的雨幕，目光中满是压抑的忧虑。


  “你还好吗？“


  “还好。“


  立香擦了擦额角的汗水。她的手背蹭过鬓角时，指尖仍在不受控制地微微颤抖着——那是魔力透支后的余波，不是什么大碍。她撑着膝盖站起来，目光越过正殿的门槛看向外面。


  暴雨。


  柳洞寺外的石阶在雨幕中已经变成了一道倾泻而下的浅瀑，水流裹挟着树叶和泥沙哗哗地冲刷着每一级台阶。远处的天际线被铅灰色的雨云压得极低，偶尔有闷雷从云层深处滚过，沉重而迟缓，像是某头巨兽在翻身。


  “怎么下这么大的雨……“


  “异象。“


  一直守在正殿门口的Saber平静地开口。贞德·达尔克半转过身，她的银白色铠甲在暗淡的光线中泛着柔和的光泽，被雨水打湿的金色发丝贴在颊侧，但她的表情纹丝未动，冷静得如同祭坛上的圣像。


  “刚才西边有很强的魔力波动。规模和释放方式——是宝具一类的。“


  她的目光从雨幕中收回，扫了一眼台阶上沉睡着的言峰士郎，眼底深处有什么东西微微闪动了一下。但那道光转瞬即逝，她重新将视线投向寺外的长长石阶。


  “接下来就等Archer把圣杯取回来了……“


  立香长长地呼出一口气。她喃喃着，目光穿过雨幕试图看清远处城市的轮廓，但暴雨将一切都模糊成了一片灰白色的混沌。


  她看不到Archer。


  看不到那边发生了什么。


  她只能等。


  只能——


  贞德动了。


  那个动作极其突兀。一秒前她还保持着半转身面向殿内的姿态，下一秒她的整个身体已经绷成了一张拉满的弓弦——脊背挺直，重心前倾，握住旗剑的右手五指骤然收紧，指甲陷入掌心。她的目光死死钉在柳洞寺石阶的底部，瞳孔在一瞬间缩成了两枚针尖。


  然后她跃了出去。


  没有助跑。双脚蹬碎了门槛前的石砖，整个人像一支离弦的银色箭矢，划破雨幕，一跃便越过了三十余级台阶，稳稳地落在了来者的面前。


  “Alterego。“


  法兰西圣女的声音很低。低到几乎被暴雨的声响掩盖。但那两个音节中蕴含的东西，比任何高声的呐喊都更加沉重。


  她拔出了剑。


  剑锋出鞘的声音在雨中格外清脆，金属与金属的摩擦迸出一簇微弱的火星，在水雾中一闪即灭。她将旗剑横在身前，刃口正对着石阶下方那个正踩着水花逆流而上的身影。


  “哟，Saber。“


  那个声音从暴雨中传来。


  Alterego正沿着柳洞寺的石阶缓步向上走着。他的步伐不紧不慢，脚下踏入水流时溅起的水花在他脚踝处四散飞溅——但那些水花没有一滴落在他身上。他周身笼罩着某种看不见的隔绝，雨水打在他肩头时会在距离衣料几毫米的位置无声地滑开，像是有一层透明的薄壳将他与整个暴雨世界隔绝在了两个次元里。


  他的衣服是干的。头发是干的。甚至睫毛上都没有挂着一颗水珠。


  在这场已经将整座山头浇透了的暴雨中，他像一个不属于这个世界的投影——被投射在了雨中，但雨无法触及他。


  他抬头，看向挡在面前的贞德。


  那张脸——


  立香在正殿门槛处看到了那张脸，呼吸陡然一滞。


  与言峰士郎几乎一模一样的面孔。同样的轮廓，同样的五官比例，同样的下颌弧线。如果不是那双眼睛里装着的东西截然不同，她几乎会以为是言峰士郎从台阶上爬起来走了下去。


  言峰士郎的眼睛尽管是空洞的，但是能看到他在寻找着什么。


  但Alterego的眼睛里什么都没有。'

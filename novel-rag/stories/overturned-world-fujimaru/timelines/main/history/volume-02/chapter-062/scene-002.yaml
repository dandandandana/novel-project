content: 'Alterego落在了埋葬机关的门前，一金一白两个身影并没有如他所料的在门口拦截住他，他看见了一个完全令他意料不到的身影。


  粉色头发，紫色的眸子，一身黑色的板甲，手上拿着的则是一个巨大的类似于盾牌一样的事物。


  Alterego看着眼前的少女，他歪了歪头：


  “怎么是你？”Alterego看着眼前的骑士，他轻声说道，“已经变成真正的英灵了吗？不过可惜的是英灵殿已经不存在了。“


  粉色头发的少女并没有回应Alterego的话语，她只是默默的握住了盾牌上面的握把，然后。


  咔哒一声，少女从盾牌里把剑拔了出来。


  Alterego看着少女：”盾斧吗？这个武装。“


  他投影出双剑，静静的看着少女。


  “没想到神琦灰竟然真的把断罪之枪变成了这个只会在怪物猎人里出现的武装。”他的琥珀色眸子看着少女。


  “别废话了，我不会让你进去的。”玛修冷冷的开口，她单手立起剑开口道。


  “吼？把你御主留给那个Ruler吗？”Alterego开口道，“你不怕~你的御主被他抢走吗？”


  “前辈喜欢谁与我无关，那是她的事情，我现在要做的是拦住你。”玛修身姿压低，在她屈膝的一瞬间。


  Alterego动了。


  他的身影如同被狂风吹走的落叶一样消散，然后骤然出现在了玛修面前，他腰间的长剑骤然拔出。


  刺耳的金属撞击的声音响起，被Alterego称作‘天丛云’的长剑被玛修的盾牌结结实实的挡了下来，玛修的表情扭曲了一瞬，然后她一剑刺出。


  Alterego轻而易举的躲了过去，然后


  玛修的盾牌砸了过来。


  【什么？】


  Alterego震惊了，玛修此时此刻的动作就像一个野路子拳手朝着他攻来。


  他猛然朝后退去，让玛修的这一盾牌砸到了地上。


  随后玛修一剑斩了过来，Alterego轻而易举的挡了下来。


  玛修的盾牌接踵而至，Alterego吃过这一次亏，他没有选择往后退，而是向前进了一步，准备再一次砍向玛修。


  玛修做出来了一个令人意想不到的动作。


  她并没有选择闪躲，她身上的板甲的光芒骤然亮起，Alterego的这一剑的力度被玛修身上的板甲所吸收了，然后猛地一震。


  Alterego被弹飞了出去。


  玛修趁势把剑反着插入了盾牌里面，这套武装在经过狰狞的机械运作声后，变成了一个巨大的斧子。


  银色的巨斧旋转着劈向Alterego


  Alterego依旧保持着他全然无波的表情，他悠悠的开口：


  “Trace On”


  一柄巨剑在他的手上成型，随后，他右手上的天丛云骤然挥出。


  来自古代的秘技，以巧破力，让玛修的斧子停滞了一瞬，Alterego趁势往后退了回去。


  “你.....不会用这个武装是吗？”Alterego慢悠悠的开口，“这样？”


  “啊，对上你反而是优势对吧，Alterego先生。”玛修说道。


  “你的全力装填，正是通过武艺彻底克制对手的不是吗？”


  “因为我没有具体成派的武艺，导致你从中找不到克制的手段。”玛修冷静的说着，“而且你忌惮我御主的英杰之帜，没错吧！”


  “Alterego先生！”


  “所以，如果不想死，就后退吧。”'

content: '“这个声音、还有用剑的姿态……等等立香，抱着你的那个人叫什么名字？”通讯器里传来奥尔加玛丽略显急促的声音，还夹杂着细微的杂音。


  言峰士郎始终抿着唇，一言不发，步伐却依旧稳得惊人。Saber听见通讯器里的声音，眉梢微挑，沉声开口接话。


  “我的御主名叫言峰士郎，是冬木圣堂教会的孩子。”Saber的声音平静，没有多余的情绪，清晰地传入通讯器中。


  “真的是他……”奥尔加玛丽的声音里带着一丝了然，随即轻轻叹了口气，“那你们大概是落到2004年了，而且还是2004年的冬木圣杯战争时期。”


  “哦？”Saber眼中闪过一丝好奇，侧过头看了眼立香，语气里多了几分探究，“你这位外援，倒是知道不少事。”


  立香攥了攥衣角，小心翼翼地开口：“那所长，眼前这位……”话还没说完，就被Saber打断，她甚至没回头，语气里带着几分调侃与警惕：“直接就想问从者的真名？看来，你是把我们当成盟友了啊。”


  “我……”立香张了张嘴，一时竟不知道该怎么辩解，脸颊微微发烫。


  “连自己来自哪里都不肯透露，又凭什么指望我相信你？”Saber的语气冷了几分，带着骑士的傲气，“就算是我家那个笨蛋御主（baka），也不会对这样的人放下戒心。”


  “你、你真的是贞德吗？竟然会说这种话？”通讯器里的奥尔加玛丽语气满是难以置信，杂音又重了几分。


  Saber终于扭头看向立香，嘴角微微上扬，歪了歪脑袋，眼底闪过一丝笑意：“看来你的外援很厉害，竟然这么快就查到了我的身份——我自认为没透露任何破绽。”


  立香尴尬地干笑两声，挠了挠脸颊，语气有些生硬：“大、大概是我们有相关资料吧。”


  “哼哼，这还差不多！”奥尔加玛丽的声音瞬间振奋起来，“立香，告诉他们我们是谁！”


  “我们是……”立香深吸一口气，刚要开口，就被Saber再次打断。


  “等我的御主恢复过来，或者到了教堂再说。”Saber的语气不容置喙，目光扫过脸色苍白的言峰士郎，神色多了几分凝重。


  “欸？言峰先生他……”立香抬头看向怀抱着自己的红发少年，他依旧背挺得笔直，抿着唇一言不发，脸上没有任何表情，仿佛刚才的对话都与他无关，只是机械地往前走着。


  【对啊，他为什么对我们刚才说的话，一点反应都没有呢？】立香心里打了个问号，越发疑惑。


  她犹豫了一下，小心翼翼地伸出指尖，轻轻戳了戳言峰士郎的胸口。言峰士郎微微低头，茶色的眸子里满是疑惑，看向她的目光带着一丝茫然，却依旧没有发出任何声音。


  “他现在失去了听觉和说话的能力。”Saber的声音适时响起，语气里带着一丝不易察觉的心疼，“刚才为了挡下Berserker的攻击，他透支了太多力量。”


  “什、什么？！”立香彻底愣住了，嘴巴微微张着，满心的震惊。


  【怪不得他刚才表现得那么“非人类”，原来都是有代价的……】立香心里一酸，看向言峰士郎苍白的侧脸，不由得生出几分愧疚——明明这里有两骑从者，却让一个失去听觉和说话能力的人类，一直抱着自己赶路。


  立香咬了咬下唇，鼓起勇气开口：“那个……言峰先生已经很累了，让玛修抱着我吧。”


  “确实如此，Saber小姐。”玛修立刻上前一步，微微躬身，语气坚定，“交给我吧，我会照顾好Master的。”


  “……你们这群半吊子......”Saber无奈地扶了扶额，语气里带着几分吐槽，却没有反对，“算了，赶紧换过来，别耽误时间。”


  Saber停下脚步，转过身，伸出指尖轻轻戳了戳言峰士郎的额头，又指了指立香，再指了指一旁的玛修，用简单的手势示意着。


  言峰士郎瞬间会意，小心翼翼地将立香递到玛修怀里，刚松开手，身体便晃了晃，踉跄着往前倒去。


  Saber眼疾手快，连忙上前接住自己的御主，稳稳地将他背到背上。


  立香看着被Saber背在背上、已然失去意识的少年，心里泛起一阵酸涩。


  “快走！Archer现在不知道在狙击谁，我们现在已经没有足够的力量抵挡他的箭了！”Saber压低声音，语气急促，脚下猛地发力，身形如箭般朝着远方的教堂奔去。


  “玛修。”立香轻声唤道，语气里带着坚定。


  “收到，Master！”玛修用力点头，抱紧怀里的立香，脚步飞快地跟上Saber的身影，盾牌依旧举在身侧，时刻保持着戒备。


  两人快步追上Saber时，教堂的轮廓已然清晰可见。Saber朝着门口站着的白衣银发少女微微点头，便背着言峰士郎率先走了进去。'

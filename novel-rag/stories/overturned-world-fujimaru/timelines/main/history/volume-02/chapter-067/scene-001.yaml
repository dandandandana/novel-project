content: '朱月不知奔走了多久，直到他已经跑出了亚欧大陆，甚至接近了美洲的地方，她才敢缓缓的停了下来。


  “愚蠢啊哈迪斯........”


  朱月的身子停在了海面上，她喘着气：


  “言峰士郎可是神琦灰唯一的弟子，不管怎么说都有后手的吧。”朱月叹气着在海面上走着，“不过真世界到手了.......”


  “我可没有给他留什么后手哦~”


  女人的声音响起，这道声音不大，但是清清楚楚的传到了朱月的耳里，朱月的身子顿时僵住了，她感受到了那道熟悉的声音，但是她不敢确认是谁。


  ”啊哈？连头都不扭过来啊~“女声再度传来，朱月并没有管她，她则是看着眼前出现的人影。


  黑发黑眸的亚洲长相，可爱的邻家少女一样的体型，一样可爱的少女，怎么看都是一个高中生一样的人。


  “纳鲁巴列克。”朱月的声音带着沉静，她看着眼前被她叫做纳鲁巴列克的人。


  “嗯，不过现在叫我.....叫我什么比较好呢~还是纳鲁巴列克吧。”纳鲁巴列克笑着说道。


  “阿拉阿拉，不转过来看我啊，那我就要自我介绍咯~”


  声音再度传来，那道声音缓缓的传来：


  “Servant Caster 神琦灰~”


  “怎么可能......”朱月喃喃道，“你不是自杀了吗？”


  “她确实是自杀了。”纳鲁巴列克说道，“不过被我召唤过来了。”


  “那......那个家伙......”朱月咬着牙开口道，“你们......”


  朱月没有说完话，无色的光芒已经贯穿了她的身子。


  “以太炮。”


  朱月的身子伴随着震惊缓缓的消散，属于爱尔特璐琪的脸布满着不解和恐惧，随后，伴随着风彻底消散了。


  “阿拉，再杀一次之前杀过的人真是难得的体验呢~”


  金发碧眼的少女拍着手从朱月的身后慢慢的走了过来，她笑着看着自己的御主，然后拍了拍手，“好了结束了~我们接下来要去哪呢？master？”


  纳鲁巴列克朝着神琦灰走了过来，“东京，去神琦家。”


  “哦？是我一不小心搞出来的那个家族吗？”


  “对。”


  “哼哼，也许会一无所获呢~”


  “那就没法战胜那个冒牌的你了，我们就全玩完了。”


  “好的好的，御主。”神琦灰笑着说道。


  “维持好你的认知干涉，卡bug万一被发现了就坏了。”


  ”迟早都会被发现的吧~“


  ”得等迦勒底解决了第二特异点再被发现才有机会吧，刚才你宰了朱月都有可能被发现了。“


  ”阿嘞？你怎么不说如果那个御主没有叫出来我的好徒弟，叫出来的是爱尔奎特一开始就玩完了呢？“


  ”也是，不管怎么说都走到这里了，去东京。还有别再提言峰士郎了，万一被吉尔伽美什发现她又要发火了。“


  ”哼哼~“


  ===


  又是梦


  这次没有言峰士郎给她保证的不会入梦，立香自己做了梦。


  睁开眼睛。


  洁白的墙壁，黄色的木门，已经半人高度的窗户。


  毫无疑问，这里是高中。


  不过，对于立香来说，这个高中对于立香的时代有点太过于早了，不单单是写着早些时期的标语，更是纯粹的木制的桌椅，以及他手中抱着的暖炉，这些都体现着这里是处于千禧年前后。


  ”言峰，啊抱歉，这里的暖炉又要拜托你了。“


  当立香听到称呼她的名称的时候，她就意识到了，她梦见了言峰士郎的过去。


  ”一成，并不麻烦。“


  少年的口中吐出几个字，随后他结束了手上的修理：”主保佑我，一成，”


  他指了指手间的暖炉，“这个刚刚好，可以继续用了，等我修完这一批，就不会有人冻到了。“


  ”啊啊，抱歉，这些与你无关却依旧这样......“一成说道。


  立香注意到了少年口中的话。


  【与士郎无关吗？】


  被称作一成的同学站了起来，“言峰。”


  “嗯？”少年看向一成，“怎么了？”


  “听说你最近离开田径部了。”


  “是的。“少年开口，他站了起来，“怎么了。”


  “你不是已经是主将了吗？为什么要离开。”一成问道，“你的成绩已经是全校最前列的了，就算是间桐慎二也只能看见你的尾巴吧。在一个社团经常常驻有什么不好呢？“


  ”我可没有长尾巴哦，一成。“少年说着，他拍了拍身上的尘土，”我所追求的并不是什么主将的位置，而是，我所能够做到的极限而已，而且，长期呆在那里，会让人觉得不适的吧。“


  “哈哈，我就知道你会说这种话啊~不会有人觉得不适的，不是所有人都是间桐慎二那种蠢货了。”一成笑着说，“真有你的风范啊~”


  “不过，言峰，你做这些是为了什么呢？田径，剑道，弓道等，这些你都去过吧，料理......料理因为太喜欢辣还被称作特别人物呢~所以呢？为了什么呢？”


  少年看向他的同学，他仔细的想了想，”我......大概是想做些我能做的吧。”'

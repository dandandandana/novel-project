content: '“怎么做到这么恶心的！”她抬起一只手指着那几块还没消失的骨片，手抖得厉害，指完了又低头继续吐。“先是砍成碎块！骨头从肉里戳出来！肠子露在外面散了一地！连头骨都被劈成两半——里面的东西都淌空了！”她又干呕了一下，胃里已经没有什么可以吐的了，只剩一层酸液在嗓子眼里打转。“然后所有碎块像有人按了倒放键一样自己拼回去！手自己飞回去缝在胳膊上！肋骨一片一片自己排队！”她抓起一块快散掉的布料擦着嘴，声音从捂着嘴的指缝间漏出来。“头捡起来把整个颅腔重新装满——哦！”


  士郎收起剑走了过来。他伸出手掌在她的后背上轻轻拍着，掌心贴着后背的那一小片布料传出温热的体温，力道不重，每一下都刚好卡在她干呕的间隙里。另一只手在空中一握，投影出一件白布把地上的呕吐物裹起来处理掉，连石板上的湿痕都被擦得干干净净。他看了眼玛修。


  “感觉怎么样？”


  玛修一愣，透过面甲看着士郎，语气里带着刚从战场上下来还没来得及切换的认真劲儿：“感觉很好，前辈。”


  “这样。”士郎从风衣内袋里摸出一个铜质的小水壶，拧开盖子递到立香嘴边，“我先去看一眼雅典娜，你先照顾一下立香。”立香接过水壶灌了一口，水在口腔里涮过一圈带着涩味一起被吐在旁边，然后又喝了一口咽下去才缓过来。


  “喂喂！”她把水壶往士郎胸口一推，声音沙哑但已经恢复了八成战场上的力度。“不关注你的御主去关注一个外人女神？！”士郎伸手把她扶起来，她的腿还在微微发软，站起来的时候晃了一下才稳住。


  立香的面色从惨白慢慢回了一点血色。士郎松开搀着她的手打量了一下她的脸色，开口问了一句：


  “感觉怎么样？”


  立香顿了顿眉头一皱：“你指的是什么？”


  士郎当然知道她指的是她第一次杀人还是刚才看见碎尸重组的全过程。他没有解释，只是把问题铺开了一点：“都有吧。”


  “还好，不去想就没问题。”立香摆了摆手，那只手在空中画了一个不耐烦的圈，像是要把刚才所有画面从脑子里甩飞出去。“你要去干什么就赶紧去。”


  “生气了？”士郎歪了歪头，琥珀色的瞳孔里闪过一丝不解。他仔细看着立香的表情——嘴唇还抿着，眉头微微拧起，但眼睛里的怒意不是那种真正意义上的火气，更像是被人点中了某个不想承认的脆弱点然后恼羞成怒。“我……算了，你不想让我去就算了，到时候等吉尔茜——”


  立香猛然推了他一下，手掌砸在胸口的风衣布料上闷闷地响了一声。“Ruler！我以御主身份命令你去干你的活！”


  士郎被推得往后退了半步，他无奈地看着她，停顿了两次呼吸的时间。“……好的Master。”


  他转过身朝实验室走去，推开那扇沉重的金属门。门轴转动的摩擦声在空旷的实验室里回荡了一下。


  雅典娜坐在墙边的地板上，背靠着冰冷的石砖墙。她的脸色白得几乎和身后的墙面融为一体，平日里那双英气逼人的灰色瞳孔此时半阖着，嘴唇干到起了皮，指尖搭在膝盖上连一根都抬不起来。整给玛修做手术的消耗让她连站起来都做不到。


  士郎站住了。他往后退了一步靠在门框上，双臂抱在胸前，就这样盯着希腊的女神。看了好几秒，没有上去扶她的意思。


  “不把我扶起来？埋葬机关·神赐？”雅典娜有气无力地开口，头懒洋洋地靠着墙壁歪过来看他，声音轻得像一层快要被风吹散的薄纱。但她的嘴角往上翘了半寸。“我可是为你们迦勒底付出了不少。”


  “呵。”士郎终于迈开步子走过去，一只手拉住她的手臂把她从地上扯了起来。“某人骂我是叛徒这件事我可记着呢。”


  “呸！”雅典娜被他拉起来的时候膝盖还软着，整个人的重心往他身上倒了半秒才自己站住。她推开士郎的手瞪了他一眼。“我当然知道你没有背叛，去千年城是因为没办法了只能去了——”她的嘴唇恢复了血色，口吻也从虚弱切换回了那种不急不缓的锐利。“那不是刺激你的御主吗？”


  短暂的沉默之后雅典娜的语气忽然变得有些期待和紧张，像是终于憋不住要问一个等了很久的问题：“话说用我的灵基的那个小姑娘怎么样？”


  “状态很好……”士郎刚回了一句，话音还没落就忽然顿住了。他转过头去盯着雅典娜，琥珀色的瞳孔缩了一下，像是听到了什么不能置信的东西。“等等。用的你的灵基？”他的声音从平缓一下子拔高了半个调。“你不怕把她的身子撑爆？！”


  “富贵险中求。”雅典娜避开他的视线，把脸扭向一边，声音小了一点。“你不该先关心一下我这个捐灵基的吗……而且我的灵基真的配得上——那个叫做玛修的小女孩吧。”'

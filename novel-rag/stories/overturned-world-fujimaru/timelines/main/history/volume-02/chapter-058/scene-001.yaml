content: '士郎迈出了一步。他手里没有剑。


  两柄黑白夫妻剑从他的身侧被投了出去，剑刃旋转着划出黑白两道残影朝朱月的身后飞去。刀锋切开空气的尖啸还没落下，他又是两柄相同的剑甩向天花板——四柄剑在走廊的暗红色警报光里飞速回旋，像四只铁铸的鸟在各自固定的轨道上互相追逐。


  士郎的双手中再度出现了刚才的夫妻剑，第六柄和第七柄。


  噗嗤。


  被丢出去的回旋剑刃如同被磁石牵引一样追了回来。第一柄砍进了朱月的肩侧，黑色的剑身嵌进哥特黑裙的布料的瞬间声音又湿又闷。


  然后是第二柄、第三柄、第四柄从不同的方向追回来——有的横切腹腔，有的斜劈颈部，有的从背后贯穿胸腔从前胸露出来一截反光的剑尖。六柄剑来回切割发出连续的闷响，朱月的身体在剑刃交错形成的不规则网格里拆成了好几块。


  尸块和碎骨哗啦啦地砸在石板地面上。士郎一脚踹了上去，朱月残存的身体倒飞出去撞在走廊的墙壁上。


  立香的视线被士郎高大的后背挡住了大半，但她还是看见了飞出去的尸块——一只断手在空中翻了几圈才啪嗒一声落在地上。


  白的手骨从皮肤断面里戳出来，五根手指还保持着刚才握拳的姿势。旁边的地板上躺着一截被齐腰斩断的躯体，黑裙的蕾丝边缘浸在暗红色的血泊里，截面的肠管盘曲着像一堆被扯乱的绳索。


  立香忽然想到了提亚。那个被自己斩成碎块、血肉横飞的对手最后也是这个样子堆在石板地上。


  她当时以为自己靠的是自己的想法，现在看到士郎用一样的手法处理朱月才终于明白过来——把敌人切碎是这家伙的恶趣味。


  不是她的本事。她那天砍人的时候手臂上读取的武艺本身就带着这个偏好。立香的胃猛地抽了一下。


  她扶住玛修的肩膀，手指隔着板甲的肩甲攥住了黑钢的边缘。


  “前辈？”玛修偏过头，透过面甲的缝隙看见立香已经白到了嘴唇。


  “没事……想到了很不好的事情。”立香摇摇头，咽了一口涌上来的酸水。她刚要迈出一步去接应士郎，脚后跟还没完全抬起来就僵住了。


  朱月的碎开的尸体在动。


  断手自己翻了过来，五根手指开始在血泊里爬行。


  那截躯干的截面边缘蠕动起来，被切开的肌肉组织开始缓缓愈合，皮肤在断口处重新长出来，粉色的新生组织爬过暗色的凝固血痂。裂开的头骨躺在角落，里面空空的，脊柱的一小截还连在颅骨下方像一根断掉的绳结。裂成两半的骨片忽然抖了一下，开始慢慢往中间合拢。


  士郎刚提起双剑准备追加一击，身后炸开了一道得意的女声。


  一声巨响从走廊尽头传来，暗紫色的冥界纹路在那一瞬间全部崩碎。碎片像被抽空水分的枯叶一样飘在空气里，然后逐片消失。伊什塔尔从冥界的最后一层束缚里挣了出来，她的头发乱了，银色的长发沾着魔力烧灼的焦痕。


  “主动把冥界撤回去了！”她的声音扬得极高，带着战斗后被彻底释放的亢奋。“哈迪斯，是怕在冥界败给我很羞耻吧！哈哈哈哈！”


  她双手高举着重新凝聚出来的宝石，蓝白色的冷光从指缝间迸射出来。红宝石一样的瞳孔扫过走廊，她在找哈迪斯的位置，脸上带着那种只有在赢了一场硬仗之后才会流露出来的、丝毫不加掩饰的骄傲。


  但哈迪斯没有理她。


  他手持骷髅法杖的身形化作一团暗紫色的迷雾，从冥界纹路溃散的位置飘了出来。迷雾像一条没有实体的蛇在走廊里蜿蜒游走，穿越了还在喘着粗气的立香和扶着她的玛修，绕过了把双剑架在身前的士郎，最后缓缓飘停在他的面前三步远的位置。


  迷雾重新凝成了人形。黑色的兜帽裹住了大半张脸，只露出下巴和苍白的嘴唇。法杖轻轻磕在石板地面上发出沉闷的咚声，走廊里残余的暗紫色纹路碎片全部被这一声吸入法杖顶端的骷髅眼眶里。


  哈迪斯歪着头看了看士郎。歪头的角度大得近乎夸张，像一个被好奇心驱使着观察陌生标本的生物学家。


  “埋葬机关——神赐。”


  他的声音从兜帽底下飘出来，不紧不慢，每一个字尾音都拖得很长。


  “你这是已经死了吗？看样子就连那位精灵亲手给你造的壳子都没能保住你的命啊。”轻轻笑了一下，那个笑声很短，更像是从鼻子哼出来的。


  “毕竟只有你们这种蠢货才会想着弑神。”


  他话音刚落，身侧浮现出几道魔法阵。那些白色的光盘在暗紫色迷雾的映衬下泛着冷光，然后同时爆发，魔力光束朝士郎倾泻而去。光束的速度极快，在走廊的昏暗里拖出数道刺目的光痕。'

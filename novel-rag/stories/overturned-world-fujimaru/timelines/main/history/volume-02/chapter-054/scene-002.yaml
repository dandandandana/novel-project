content: '她转过身往外走，嘴里开始叽叽喳喳地说着她来到冬木所见到的各种事物，语气轻快得像是要把整间教堂的空气都搅动起来。


  立香感到自己迈开步子跟了上去，视线在神琦灰跃动的金发上停了一瞬。这个女孩的笑容太亮了，亮得让人几乎忘记了她将来会做出什么样的事。


  身后的声音把她拽住了。


  “士郎。”


  立香转过头，视线重新落回金发赤眸的女人身上。吉尔伽美什还保持着刚才的坐姿，但眼神不再是那种散漫的笃定，而是收紧了，像是要在这最后几秒里把什么东西钉进士郎的骨头里。


  “别毁了自己。”


  立香歪了歪头。这个动作是士郎的，而她只是个被困在这具身体里的旁观者，却也跟着歪了头。


  “什么？”少年的声音响起，带着真实的困惑。


  “你的扭曲的愉……”


  吉尔伽美什张了张嘴。嘴唇在动，空气里有声音的振动，但最后一个词还没落地，周遭的一切就开始碎裂。


  墙壁、长椅、烛台、彩色玻璃窗，所有东西都像是被风吹起的纸片一样，一片片从她身边剥离，飘向某个看不见的方向。立香伸出手想抓住点什么，但指尖穿过那些碎片，什么也碰不到。教堂的光线迅速收窄，最后只剩下一片黑暗。


  立香缓缓睁开眼睛，第一眼看见的是陌生的天花板。金箔镶出的穹顶在昏暗的光线里泛着暗哑的光泽，古朴的纹饰一圈圈从中心往外扩散。后脑勺挨着的是羽毛枕，柔软得让她的脖颈还残留着几分懈怠。她撑着床铺慢慢坐起身，被子从胸口滑到腰际。


  “醒了？”


  声音从一侧传来，平稳而克制。立香猛地弹起身子，手本能地摸向自己大腿外侧，那里本该别着安魂的双枪，但手指只碰到了自己的裤子。


  她的视线往旁边扫去，床头柜上摆着那两把黑白色调的手枪，在鹅蛋脸女神的手里。雅典娜将安魂举在眼前，掂量了两下，动作轻巧得像是在称量什么工艺品。


  “安魂？”


  “你怎么知道这个名字。”立香的手缩回来，指腹按在令咒的位置上，视线在雅典娜和门口之间来回扫了一遍。“不对，你怎么在这儿，士郎怎么会让你。”


  “他可是很宝贝这对枪，爱不释手。”雅典娜将安魂轻轻放回床头柜上，金属磕在木头上发出一声闷响。她偏了偏头，语气里带着一点难得的解释意味。“哦，你指的是这个。我要想杀你随便能杀你，但是你还活着，说明了什么。”


  “又变成同盟了？”立香把声音放得很轻，但每个字都像是从牙缝里挤出来的。“我怎么不知道智慧的女神这么会跳反。”


  门口传来衣料窸窣的声响。“啊，她一直这样没有道德的。”一个白发红瞳的女人踱进来，身上穿着华丽的现代礼服，裙摆在地板上拖出细微的沙沙声。


  她停下脚步，双手往腰上一叉，下巴微微扬起，那个姿态像是早就排练过。“哼哼，自我介绍一下，本女神名叫伊什塔尔。迦勒底的御主，我打算加入迦勒底了。”


  “哈？”立香愣了一下，脑子里的警惕被这突如其来的宣言搅成一团浆糊。


  “等等，算了。”她抬手按了按太阳穴，语气里的戒备散了几分，取而代之的是一种无奈的疲惫。“苏美尔的神一向没什么底线来着，也一向没脸没皮。我需要经过我的从者的同意。”


  伊什塔尔把手一摆，银白色的长发随着动作晃了晃。“你的那个盾兵和Ruler都说要经过你的同意，算了。那位盾兵现在在做最后调整，在等你呢。”


  “明白了。”立香把被角掀到一边，双脚落到冰凉的地板上。“士郎呢？”


  “在计时塔顶层看守。”伊什塔尔往旁边让了半步，视线往窗外瞥了一眼，像是在确认什么。


  立香点点头，指尖在令咒的纹路上慢慢摩挲着。她抬起眼睛，轮流在雅典娜和伊什塔尔脸上各停了两秒。“我暂且相信你们两个。”


  “喂喂，你们说完了吗。”一道懒洋洋的声音插进来。爱尔奎特从角落里走出来，手里不知什么时候多了一串葡萄，紫色的果实在昏暗的光线里发着哑光。她撕下一颗葡萄塞进嘴里，腮帮子鼓起一块。“被打的最惨的是我吧。”


  立香的目光落在爱尔奎特身上，视线从她脸上扫到肩膀，再扫到她随手空想具现化出来的那串葡萄上。她沉默了片刻才开口：“爱尔奎特小姐，发生了什么事情。”


  “被一个新的Alter Ego狠狠揍了一顿。”爱尔奎特又撕下一颗葡萄，声音含混不清，像是在说今天晚饭吃了什么的。“然后被不知道怎么复活的姐姐捅了一刀而已。”


  “好吧。”立香叹了口气，气息从鼻腔里长长地泄出去。她没再追问细节，只是把腿从床边放下来，赤脚踩在冰凉的石板上。


  脚底传来的凉意和梦境里那片水面下的触感重叠了片刻，她用力眨了眨眼把那幅画面从脑子里赶出去。她转向雅典娜，声音平稳了一些：“所以已经找到治疗玛修的方法了吗。”


  “对的。”'

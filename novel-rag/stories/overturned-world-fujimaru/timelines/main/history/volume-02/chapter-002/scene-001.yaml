content: '“冬木？”


  言峰士郎轻轻颔首，目光落在远方缀着零星灯火的高楼轮廓上，语气依旧没什么起伏：“是。”


  立香望着少年依旧苍白的侧脸，指尖下意识攥了攥衣角，心头莫名发紧，轻声问道：“接下来该怎么做？”


  “那名Archer会狙击所有入城的从者。”士郎转头看向玛修，茶色的眸子里多了几分凝重，“Shielder，我需要确认，你能挡住他的箭吗？”


  “明白。”玛修握紧手中的盾牌，眼神坚定地点点头，“我们现在就往东边出发。”


  士郎不再多言，小心翼翼地将立香打横抱起。立香下意识低呼一声，慌忙伸出双手环住少年的脖颈，脸颊微微发烫，别扭地撇过脸去，不敢直视他的眼睛。


  “走吧。”士郎的声音比刚才柔和了些许，抱着立香稳步迈步前行。


  “我们现在在冬木最西边的森林，目的地是最东边的教堂。”士郎一边走，一边低声对玛修叮嘱，“全程警惕，不要大意。”


  玛修紧随其后，沉声应道：“明白。”


  士郎微微颔首，脚步又加快了几分，怀里的立香能清晰感受到他平稳的心跳。


  不多时，三人便抵达了森林边缘，前方就是通往冬木城区的小路。


  玛修率先停下脚步，站在森林边缘凝神戒备，周遭一片寂静，没有丝毫魔力波动。她紧握着盾牌，犹豫着要不要迈出那关键的第一步。


  “不用犹豫。”士郎的声音适时传来，“不出意外，你迈出第一步的瞬间，Archer的箭就会袭来。”


  玛修深吸一口气，眼神愈发坚定，将盾牌举至胸前，稳稳朝着东边迈出了第一步。


  几乎就在脚步落地的瞬间，一道惊雷从市中心轰然炸响，紧接着，一道漆黑的箭矢如同闪电般，直直朝着玛修射来，带着凌厉的破空声。


  士郎下意识将立香往怀里紧了紧，另一只手轻轻捂住她的耳朵，隔绝那刺耳的轰鸣。


  玛修眼神一凝，手中的盾牌稳稳迎上，漆黑的箭矢与盾牌狠狠相撞，发出震耳欲聋的轰鸣声，气浪裹挟着尘土扑面而来。


  巨大的冲击力让玛修连连后退数步，双脚在地面上犁出几道深深的划痕，直到耗尽力道，才勉强稳住身形，稳稳挡住了这一箭。


  玛修咬了咬牙，低声给自己打气，眼底闪烁着倔强的光芒：“我能做到！”


  “别勉强！Shielder！”言峰士郎的声音从身后传来，带着一丝不易察觉的担忧，可玛修已然坚定地迈出了第二步。


  这一次，没有惊雷的铺垫，九道赤红色的箭矢如同流光般，从市中心的高空疾驰而来，目标直指玛修，速度快得让人眼花缭乱。


  九道赤红色的流光划破夜空，带着毁天灭地的气势，朝着玛修猛冲而去。


  玛修看着疾驰而来的箭矢，瞳孔骤然收缩，握着盾牌的手不由得收紧，心脏狂跳不止。


  “Shielder！你有宝具对不对？！”士郎的声音急促地传来，带着不容置疑的急切，“快用宝具！”


  玛修的声音带着一丝慌乱，却依旧清晰：“我……我不知道宝具的真名！”


  “不管怎样！”士郎的声音穿透风的呼啸，“举起盾牌，拼尽全力，保护好你的御主！”


  士郎的话如同惊雷，在玛修脑海中炸开，她浑身一颤，眼底的慌乱渐渐褪去，取而代之的是坚定。


  【玛修，我相信你！】


  立香曾经的话语在脑海中清晰回荡，玛修仿佛又回到了管制室爆炸后，那片洁白的沙地上。


  立香趴在士郎怀里，看着那九道看似缓慢、实则转瞬即至的流光，用尽全身力气朝着玛修喊道：“玛修！你是我的从者，不管怎么样，我都相信你！”


  玛修猛地睁开眼睛，眼底闪烁着耀眼的光芒，周身的魔力疯狂涌动。


  “拟似展开！人理之础（Lord Chaldeas）！”


  巨大的魔术壁障裹挟着部分城墙虚影轰然展开，将玛修、士郎和立香牢牢护在身后。九道流光狠狠炸在壁障上，发出震天动地的爆炸声，火光冲天，玛修咬着牙，拼尽全力抵挡着这致命一击。


  “Shielder！既然能挡住，就快点跟上！”士郎抓住这短暂的空隙，大声喊道，“实在撑不住，就让你的御主用令咒传送！”


  言峰士郎立刻给自己施了强化魔术，双腿爆发出惊人的力量，抱着立香朝着东方城区狂奔而去，身影如同离弦之箭。


  玛修趁着Archer重新拉弓的间隙，迅速收起壁障，快步跟上士郎的步伐，盾牌依旧举在胸前。


  “等等！玛修不在我们身边，没有她的保护，我们会不会……”立香在士郎怀里不安地开口，目光紧紧盯着身后的玛修。


  “放心。”士郎的声音沉稳，带着安抚的力量，“Archer的目标只有从者，我们不会被狙击。”


  “哈？你不是从者？”立香瞪大了眼睛，满脸难以置信，“可你抱着我，还能跑得这么快，这身体素质也太离谱了吧？”'

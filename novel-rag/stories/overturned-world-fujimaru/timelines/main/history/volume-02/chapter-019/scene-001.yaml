content: '藤丸立香无奈的吐槽声落下，希耶尔终止了和管制室众人的跑题的闲聊。


  “哼……”希耶尔轻嗤一声，“不过Berserker绝不能忽视，就按立香说的方案来——让Archer在高点监视其动向，一旦发现踪迹，立刻出手解决，如何？”


  “无异议。”


  “等等，有问题。”立香忽然皱起眉开口，目光凝重地看向众人，“是那名Alterego。”


  “Alterego？”Saber眼中闪过一丝疑惑，转头看向立香，“你的意思是，他有可能反水？”


  “不是有可能，是肯定会反水吧！”立香越说越笃定，“小说和游戏里都这样啊，这种因共同敌人临时结盟的盟友，到最后十有八九会倒戈……而且希耶尔前辈，你之前不是说，能感觉到他身上有很明显的杀意吗？”


  “你说的这点确实需要留意……”希耶尔微微颔首，随即话锋一转，“不对，我们的核心目的是回收圣杯，只要圣杯回收，特异点就会自动修复，压根不需要特意直面Alterego。”


  “那就确定了！”通讯器里立刻传来奥尔加玛丽略显激动的声音，语气里满是期盼，“你们的目标就是击杀凯茜帕鲁格，回收圣杯，然后平平安安回家！”


  “一定要安全回来啊……千万不能出事……”她絮絮叨叨地碎碎念着。


  希耶尔毫不留情地打断了她的呢喃，语气干脆：“别光顾着担心，先回归正题——我们得好好商量，该怎么解决凯茜帕鲁格。”


  “知道了知道了！”奥尔加玛丽的声音带着几分不情愿，“吉尔伽美什，过来搭把手，我们去把埋在地下的达芬奇挖出来！”


  通讯器里随即传来吉尔伽美什不满的抱怨声和两人拉扯的动静，没过多久，便渐渐归于沉寂。


  希耶尔收回目光，看向众人，缓缓开口：“按照月虹的出力来看，只要吸收三天的阳光，绝对能对凯茜帕鲁格造成致命打击。”


  “我简单解释下月虹的原理和出力。”她顿了顿，继续说道，“月虹是一种超大魔术礼装，相当于大魔术的触发器。”


  “你们也看到了，冬木市这些天一直处于黑夜，这就是月虹的作用——它能吸收数十公里范围内的所有光线，同时将体内的魔力雾化，凝结成七枚棱形结晶。”


  “光线会被吸入棱晶内部，经过无数次折射后，最终会以光炮的形式发射出去。”希耶尔的语气平稳。


  “更关键的是，月虹凝结了第九祖爱尔特璐琪的‘理’，这种力量，刚好能压制住灵长类杀手的权能。”


  “就算是月虹的最低出力——只吸收不到一秒的光线，每一发光炮也拥有接近A++对城宝具的威力。”


  “所以，你们完全可以相信月虹的威力，不用有多余的顾虑。”希耶尔补充道，目光扫过众人。


  “这样就好……”士郎轻轻舒了口气，脸上露出一抹浅淡的笑意，紧绷的肩线也稍稍放松下来。


  “你笑什么？”希耶尔瞪了他一眼，语气带着几分无奈，“难不成你真觉得，月虹不会把你一炮轰死？”


  立香也跟着瞥了士郎一眼，随即转向Saber，语气放缓：“Saber小姐，你有用于防护的宝具，对吧？”


  “没错。”Saber微微颔首，语气带着几分自豪，“我的宝具‘吾主在此’，在Saber职阶有着额外补正，等级可达A++，足以抵御强力攻击。”


  “那就好。”立香松了口气，轻声说道，“到时候，就由Saber你跟着士郎一同前往，等触发月虹后，你们可以迅速撤离。”


  “前辈。”一直沉默的玛修忽然开口，声音轻柔却坚定，目光紧紧看着立香。


  “如果凯茜帕鲁格没能被月虹直接击败，我们是不是该准备一些补救措施？”


  立香愣了一下，指尖下意识地捏着下巴，眉头微微蹙起：“你说得对……可是玛修，凯茜帕鲁格的实力你也见识过……”


  她脑海里瞬间闪过之前的画面——玛修的盾牌被轻易洞穿，小小的身影像皮球一样被狠狠抛出去。


  “你要是跟着去，恐怕很难对付它吧……”立香的语气里满是担忧。


  “前辈，请相信我。”玛修微微挺直脊背，眼神无比坚定，“我身为盾兵，有着很强的防护能力，就算无法击败它，至少也能拖延足够的时间，为大家争取机会。”


  她顿了顿，补充道，语气里满是恳切：“真的，拖延时间，我一定能做到。”


  立香看着玛修坚定的眼神，沉默了片刻，缓缓点了点头，语气里带着信任：“好，我相信你，玛修。”


  “那么就这么定了。”希耶尔抬手轻敲桌面，“由Saber和玛修护送言峰士郎靠近灵长类杀手，等月虹触发后，立刻带着濒死的士郎撤离。若是那只白兽没死透，我和Archer会立刻上前支援。”


  “我没异议。”立香轻轻点头，语气里带着几分迟疑，“只是……还有最后一个问题——该怎么让士郎达到濒死状态？能不能骗过扳机，直接触发月虹？”'

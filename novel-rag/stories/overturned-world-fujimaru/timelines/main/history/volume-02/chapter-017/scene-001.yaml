content: '“天空中的月虹一直在吸收阳光，只要能够触发月虹，并且让它打中灵长类杀手，就能够破开他的完全防御。“


  “所以说，实际上Ruler并没有彻底压制他的权能，仍然保留了一些在灵长类杀手的身上是吗你的意思是？“希耶尔问道。


  “月虹从来都是只能阻止灵长类杀手的权能扩张，而不是直接阻止权能。在月虹轰到灵长类杀手身上的时候，你们就有和他正面对决的机会了。“”言峰士郎“说道。


  “最关键的是，要打中它。“”言峰士郎“补充道。


  “要瞄准了是吗，好的我知道了，怎么触发月虹呢？”希耶尔问道。


  “言峰士郎“扫视了众人一眼，他轻声开口。


  “扳机。“


  就在言峰士郎以为，自己会被这无穷无尽的梦魇彻底拖垮时，某一轮循环的尽头，一道冲天白光骤然划破混沌，径直炸穿了那只白色巨兽的身躯——剧痛随之席卷全身，他的意识也被这道光一并裹挟着，坠入无边黑暗。


  【它……死了？】


  意识在混沌中沉浮，他说不清那道支援来自何方，却能清晰地感知到，那只带来无尽灾厄的白兽，确实倒在了那道光炮之下。


  是真的死了。


  再次睁开眼睛，映入眼帘的依旧是熟悉的天花板，鼻尖萦绕着淡淡的圣水气息，指尖触到的被单柔软而干净，却又多了几分难以言喻的真实感。


  “士郎……你醒了？”


  少女轻柔的声音在耳边响起，言峰士郎缓缓转头，便看见藤丸立香趴在床边，眼角还挂着未干的泪珠，眼底的红血丝昭示着她已经守了很久，语气里满是刚睡醒般的沙哑与欣喜。


  此刻的他依旧无法彻底分辨眼前的一切是现世还是又一场幻境，只能哑着嗓子，轻声问道：“那个白兽……怎么样了？”


  “放心吧。”立香连忙直起身，伸手揉了揉泛红的眼眶，语气里带着明显的安心，“它现在被新来的Alterego牵制着，希耶尔前辈他们在一旁观察局势，这里很安全。”


  【安全的……】


  言峰士郎愣了愣，紧绷的神经稍稍松懈，嘴角扯出一抹浅淡的笑意，轻声呢喃：“啊……这样啊，看来我是真的醒过来了。我睡了多久？”


  “我算算……大概五个小时哦。”立香坐到床边，指尖轻轻蹭了蹭衣角，语气里带着几分委屈，“你一直昏着，大家都快急坏了。”


  “抱歉抱歉。”言峰士郎挠了挠脑袋，脸上露出几分歉意，“让你们担心了，都怪我不小心晕了过去……”


  “才不怪你！”立香立刻打断他，声音里带着一丝哽咽，“说到底，都是因为我啊，如果不是你拼尽全力帮我，你也不会被精神污染缠上，更不会昏迷这么久……”


  “别这么想，立香。”言峰士郎轻咳两声，带着一丝不易察觉的疏离，“我真的无所谓的。”


  【为什么？为什么他经历了那么可怕的梦魇，还能说得这么轻松？】


  立香心底泛起一阵酸涩，她又不是没有体会过精神污染的绝望，那种被黑暗吞噬、只想放弃生命的滋味让她至今记忆犹新。可眼前的言峰士郎却仿佛什么都没经历过一般，语气平淡得像在说一件无关紧要的小事。


  “你在说什么啊……怎么可能无所谓！”立香猛地站起身，瞪着他，声音里满是怒气，“我也是经历过的，当时我真的觉得自己要死了，如果不是你救了我，我早就……言峰，你怎么能这么不在乎自己？”


  她死死盯着言峰士郎，心底莫名升起一股强烈的违和感，可又说不出哪里不对，到了嘴边的话，也因为情绪翻涌而硬生生咽了回去。


  言峰士郎的眼神愈发闪躲，声音放得更轻：“立香，好歹我活下来了，不是吗？”


  “我们都活下来了，是我不好，让你担心了……”


  “你根本就没有认错！”立香的声音低了下去，“我在你眼里，根本看不到半分愧疚，也看不到半分在意。为什么？”


  “为什么你总说无所谓，为什么你不肯好好在乎一下自己？”


  “我……”言峰士郎顿了顿，嘴角扯出一抹敷衍的浅笑，刻意转移话题，“好了，别伤心了，大家有没有商量出对付灵长类杀手的办法？”


  看着立香阴郁的脸色，他又补了一句，语气带着几分无奈：“就像我觉得每天四点半起床很正常，你可能会觉得太早一样，我真的觉得，这点事无所谓的。”


  立香看着他避重就轻的模样，心底的委屈更甚，却也知道，他是铁了心不想多说。


  “你不愿意说，就算了。”她轻轻坐到床边，声音轻得像叹息，“言峰士郎，我看得出来，你一点都不爱惜自己。”


  “好好好，你说的对，我以后一定注意，行了吧？”言峰士郎举起双手，故作无奈地投降。


  “……”


  立香盯着他的琥珀色眸子，那里面只有敷衍的温和，没有丝毫敞开心扉的意愿。她心头一闷，伸手轻轻掐了下他的腰侧。


  【他……他果然和希耶尔前辈说的一样。】'

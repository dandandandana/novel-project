content: '“啊……你这个混蛋……”


  “狐假虎威的家伙，倒是和你的从者挺配。”Alterego笑意未减，第二刀接踵而至。


  尼禄再度被切成数段，凯茜帕鲁格扭头想支援自己的唤醒者，身后却突然传来枪声与箭矢破空的声响。


  希耶尔借着Archer箭矢的掩护，朝着凯茜帕鲁格扑去，同时朝着Alterego喊道：“你最好能彻底杀了尼禄·卡奥斯！”


  “放心，不会让前辈失望的。”Alterego语气亲昵又戏谑的说道。


  “宣告！”


  悠长的咏唱声响起，Alterego一把捏住尼禄的衣领，洁白的火焰从他掌心燃起，包裹住尼禄的身躯。


  “那是……阿波罗的火焰？”Archer看着那簇火焰，声音带着难以掩饰的震惊。


  “是你杀了Caster？”尼禄依旧嘴硬，笃定自己能扛过这洗礼咏唱，恶狠狠地瞪着Alterego。


  “残败者，衰老者，吾皆召回。


  托于吾，师于吾，遵于吾。”


  Alterego没有回应，只是低声念着祷告词，尼禄的身躯在白火中渐渐扭曲、燃烧。


  “不……不对！”


  尼禄这才惊觉，自己体内的666兽之因子，竟也跟着一同燃烧起来。


  轰隆！


  一旁的希耶尔再度被凯茜帕鲁格拍进墙壁，可她正要起身阻拦，却发现这头白兽竟像看戏一般，冷漠地看着自己的唤醒者在火中挣扎。


  “没记错的话，你这只白兽，是从爱尔特璐琪那里骗来的吧？”Alterego喃喃开口，语气里满是嘲讽，“你还说过，会好好对待它呢……真是虚伪。”


  说着，他念完了最后一句祷词：


  “宽恕即在当下，结誓凭吾之受肉。


  ——请怜悯此魂（Kirie Eleison）。”


  尼禄的身躯被白火彻底吞噬，在撕心裂肺的惨叫中，化作一捧灰烬。


  “好了，碍眼的东西处理掉了。”Alterego拍了拍手上的灰烬，转头看向希耶尔。


  “解决凯茜帕鲁格的关键，在你们身上。”Alterego轻声说道，“解决这头Beast，也是我的目的之一——我的主人，懒得再处理一骑Beast了。现在，我们算是盟友了吧？”


  话音刚落，他便抽出太刀，朝着凯茜帕鲁格砍去。和其他人一样，他的攻击也没能对凯茜帕鲁格造成有效伤害，可凯茜帕鲁格的每一次反击，都被他轻松避开，根本碰不到他分毫。


  “你为什么说，关键在我们这里？”希耶尔趁机抽身，将战场暂时让给这位突然出现的Alterego。


  “你们漏了一个关键的从者。”Alterego淡淡说道。


  希耶尔浑身一僵，咬了咬牙，试探着问道：


  “Ruler？”'

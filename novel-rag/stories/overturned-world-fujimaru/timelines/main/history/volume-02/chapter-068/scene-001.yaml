content: '伴随着飞机飞到迦勒底的停机坪，立香他们伦敦之行彻底宣告告一段落。


  “所长，我们回来了。”立香在回到迦勒底之后对着奥尔加玛丽说道，“伦敦被打的太惨了，只能勉强搜罗了一点资源。”


  奥尔加玛丽指挥着迦勒底的员工们去整理从飞机上卸下来的资源，然后他看向了跟在迦勒底众人身后的几个原本不该在此的几人。


  “嗯哼？立香，你拐回来了这几个人是谁啊？”


  立香此时显得有些尴尬，她推了一下最后从飞机上下来的士郎，士郎不解的看向立香：


  “怎么了？”


  立香眉头一挑，她没想到士郎会在此时此刻装傻，原本放在他的腰间的手毫不犹豫的掐了一下。


  言峰士郎全年没什么表情的面孔上带着更为不解的表情，随后他就反应过来了，上前跟达芬奇和所长解释。


  一直在所长身边的芙芙看见士郎，咬了咬他的裤腿，随后跑到立香的身边爬到立香的肩膀上。


  在士郎解释完后，所长看着身后的人：”好吧，你们先进去吧，反正都这样了，热闹点也好，也不少几个吃白饭的了。“


  ”感谢感谢~“三人朝着所长开口，随后奥尔加玛丽对着几个员工摆摆手，事宜他们跟着这些人去迦勒底安置下来。


  ”那么晚上开会，下午给你们处理一些杂事，我知道你们都很累，但是目前来说还是先把具体事项安排过来吧，这期间迦勒底也可以没闲着哦~“


  ”明白了。“立香点点头，她挠了挠脑袋，”我其实还好，但是玛修和Ruler.......“


  ”前辈，我没问题。“玛修站在立香身边说道。


  士郎在一旁听完了这些话之后，他想了想开口，”御主，还有需要我的地方吗？“


  立香愣了一下，她看着士郎，咬了咬牙：”目前没了。“


  士郎点了点头，他歪头开口道：”那我先......“


  ”欸？立香！“达芬奇看着立香说道，“借用一下你的Ruler，目前迦勒底的核电站还没被修好。”


  立香默默的点了点头，玛修站在立香身边，感觉自己的御主的态度有点不对劲，于是她开口道：


  “前辈？”


  “啊？没事，对了所长，吉尔伽美什说她有点事要去外面一趟，具体的没说，大概一周后会回来。”立香回过神来，她开口道。


  “啊？别死了啥事没有......那么先来录数据吧玛修。


  ===


  钻头的嗡嗡声在迦勒底的地下室响着。


  “摩西摩西？Ruler？能修好吗？”


  “应该没什么问题，达芬奇亲。”言峰士郎的声音伴随着钻头的响声传来，在幽闭的环境里显得格外的空鸣。


  “哇，真的能修好啊，原本预计还要将近半年时间才能把核电站修好呢。”达芬奇的声音在下面的声音传来，在空荡荡的幽闭环境里传来了回声。


  “芙！”一只小兽的声音传来，士郎在解决完最后一个节点之后，他跳了下来。


  “可以启动了。”


  “好嘞！”达芬奇拉下几个闸和按钮，伴随着嗡鸣声，中心的明亮的核心亮起，随后光亮照亮了士郎的背后的轮廓。


  ”该说不愧是有着同调这个保有技能的从者吗？“达芬奇查看着数值参数，”完全没问题啊，这下能源问题而解决了。“


  ”那么，玛修的参数测量好了吗？“士郎问道。


  ”嗯，所长带人在做这件事情。“达芬奇说着，她想了想，”下午要开会。“


  ”好的，还有什么事情要去做吗？“士郎问道。


  ”目前来说没什么了，你可以去休息了。“达芬奇记录着数据，”有空的话来我的工坊一趟，我对你的构造很感兴趣，之前一直没机会。“


  ”问我的御主就好，那我先走了？“


  ”这样啊~好吧。“达芬奇摸了摸芙芙，她转身继续检查迦勒底后方的核电站说着，“立香大概在找你。”


  “收到。“


  士郎没打算过多停留，他迅速的找到了立香和玛修所在的位置，她们在迦勒底为英灵准备数据测试所带着。


  士郎刚刚走到哪里，就听到了奥尔加玛丽的声音：


  “哇，玛修现在的数值确实够高了，和之前完全不一样了。”


  “所长......这并不是我的功劳。”


  “怎么不是？现在是你的灵基你是身为玛修·基列莱特的英灵。”雅典娜的声音从实验室里传来。


  ”就是就是，不要过于妄自菲薄了玛修。“她的御主的声音也从中飘了出来。


  ”立香说得对，不管怎么说这些都是你的东西，而且你的强大的力量就是迦勒底的力量。不是别人的。“


  ”这样啊，谢谢所长，我会加油的！“


  士郎听着他们没了声音，推门走了进去，众人看到他之后的声音停住了。


  “活干完了？”立香率先开口道。


  士郎点了点头，他看向立香：”嗯，有什么问题吗？“


  ”没什么问题，我们在讨论玛修的状态。“立香说道。


  奥尔加玛丽默默的凑到了雅典娜身边，她一句话也不说。


  空气一时间沉静了下来，立香抱臂看着士郎，她的表情就像是在等他开口一样'

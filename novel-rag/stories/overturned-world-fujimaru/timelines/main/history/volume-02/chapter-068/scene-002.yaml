content: '”嗯......没什么问题就好。“士郎开口，他捏着下巴想了想，”晚上想吃什么？“


  “这个家伙......”奥尔加玛丽无奈的捂住额头，她看了一眼不知道什么时候挪到她身边的玛修，然后叹气的吐槽道。


  “所长......感觉气氛不对劲......“


  ”这种时候最好沉默，玛修。“


  ”明白了......“


  立香看了几人一眼，她露出来了困惑的表情，随后看向士郎，见他依旧没什么要补充的，于是她眉头一挑，“做你最拿手的。”


  “好的御主，那就按照之前定的庆功宴？”士郎歪着头说道。


  ”嗯。“立香点了点头。


  士郎顿了顿，”晚上有时间吗？“


  ”嗯？“


  ”有些事情要找你聊聊。“士郎沉思片刻开口道，”有时间吗？御主。“


  ”不能在这里说吗？“立香问道。


  ”不能，就你我两个。“士郎看着立香的眼睛，认真的说道。


  ”什？“立香的面颊蹭的冒上红晕，”你你你你在说什么啊？！“


  ”字面意思。“


  ”你这个家伙.......我有时间，对了，我警告你！可不能占据了我的休息时间啊！“立香咬着牙说道。


  ”那就好，我去准备晚饭了，餐厅见。“士郎摆了摆手，见立香挥手示意之后他转身离开了实验室。


  ”前辈......“玛修弱弱的开口。


  ”玛修......算了，走吧。”


  “好的前辈。”


  等到这一对主从离开之后，奥尔加玛丽看向一直没有作声的雅典娜：


  “原来他是这种人？”


  “时好时坏吧，当你觉得他要搞砸了的时候总能逆风翻盘这样？”雅典娜想了想说道。'

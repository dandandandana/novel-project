content: '“等等。“立香干脆利落地抬手打断了他。Ruler的嘴巴就那样保持着微张的姿态僵在了原地，脸上浮现出一个不太明显的“我被晾了“的表情。


  “这话不能问你。“立香看着他，语气认真得像是在执行某条不可违反的分析准则，“你是她的学生，你对她绝对有滤镜。“


  她转向吉尔伽美什。


  “吉尔茜，那位神琦灰是个什么样的人？“


  吉尔伽美什注视着自己这位弟子。她的猩红色眼瞳中掠过一道极其短暂的、近乎赞许的光芒，随即被她一贯的冷傲所覆盖。


  “有趣的人。“她给出了评价。四个字，简洁而精准。随后她补充了一句，声音里带着某种不知是感慨还是惋惜的淡漠温度：“是个和士郎一样的烂好人。“


  那句话落在Ruler耳中的时候，他的睫毛几不可察地颤动了一下。


  “那她有没有可能做出上述的事情呢？“立香追问道，“像疯了一样讨伐人间的神明。“


  “不太可能。“吉尔伽美什的回答没有丝毫犹豫，“她认为，神明其实很大一部分是不会肆意妄为的。“


  立香缓缓呼出一口气。


  因果链在她的脑海中完成了最后一环的闭合。性格画像与行为模式之间不可调和的矛盾，认知障碍魔术的定向施加，四年间愈发激进的弑神运动——所有的线索都指向同一个结论。


  Ruler看着她，琥珀色的瞳孔微微收紧：“御主的意思是？“


  “啊。“立香的声音平淡得像是在宣布一条已经被反复验证过的公理。


  “神琦灰可能已经被掉了个。“


  这句话在测试室中落地的声响几乎是无声的，但它在每个人心中激起的震荡却远比任何爆炸都要剧烈。


  “……“Ruler沉默了一拍。他的指节在膝盖上无意识地叩了两下，那是他用以代替叹息的习惯性节拍。“更麻烦了啊。“


  尾音微微上扬，带着一丝属于老兵的无奈苦笑。


  “御主，你怎么想？“他抬起头来，目光直视立香。


  藤丸立香没有立刻回答。她将视线投向了测试室高处那面暗灰色的隔离壁，像是在透过层层金属与魔术结界去眺望这座设施之外的、已经化为焦土的世界。


  “伦敦还有人，是吗？“她的声音很轻。


  “是的。“


  “埋葬机关和时钟塔的总部，现在是不是都在伦敦？“


  “是的，零零年开始就已经从梵蒂冈搬到伦敦了。“希耶尔开口道。


  立香点了点头。


  她将视线从高处收回，扫过在场的每一个人。橘色的虹膜中没有犹豫，没有迷茫，只有一种被极度压缩后的、近乎固态的决意。


  “那么，我们第一站要去伦敦。“


  她的声音不大，却在空旷的测试室中产生了一种不容置疑的回响。


  “人脉，物资，是我们首先要做的。“她竖起手指逐一点数，“以及最重要的——救回玛修。“


  “神琦灰的事情可以先放到一边。“


  她停顿了最后一拍。


  “因为我们——“


  “没得选。“


  这三个字从她口中落下的时候，没有壮烈，没有悲怆，没有任何多余的情绪修饰。它们只是一个事实。冰冷的、不可更改的、像引力一样不可抗拒的事实。


  世界已经烧光了。


  她的同伴正在死去。


  而她们能做的，只有向前走。


  Ruler静静地看着这个比自己矮了将近二十公分的少女。冷白灯光将她消瘦的轮廓勾勒得分外清晰，标准制服袖口的褶皱在她垂下的手腕处微微翘起，像一只折断了翅膀的纸鹤。


  但她站在那里。


  站得笔直。


  “了解了，御主。“他从折叠凳上站起身来，马丁靴的鞋跟在地面上发出一声清脆而坚定的叩击。


  “那就去伦敦吧。“'

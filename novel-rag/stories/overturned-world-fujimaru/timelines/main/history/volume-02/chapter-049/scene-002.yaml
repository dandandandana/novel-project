content: '“本体下界——”她开口，语调里掺杂着冷意，“却选择了在这具人偶身上是吗。”


  王之财宝的门在她周身重新排列，新一轮宝具如暴雨般倾泻向古伽兰纳。青金石的表层已被凿出巨大的沟壑，深蓝色的粉末悬浮在虚空中，在红黑色的空间里飘散如星尘。


  “第三法造出来的人偶真是便宜你了啊。”


  伊什塔尔的面颊微微一僵。她松开环抱的双臂，指尖划过马安娜的船舷，金色的星屑从指尖滑落。


  “毕竟那场圣杯战争我才是最终赢家嘛。”


  “那场圣杯战争的胜者是士郎。”吉尔伽美什的声音不轻不重，纠正的语气像在陈述某种不容置疑的事实。


  “都一样，他没要圣杯，我就从魔术师协会这里弄过来了哦。”


  “然后许下了获得身体的愿望？”吉尔伽美什的嘴角挑起冷锐的弧度，“真是愚蠢的女神。”


  她的掌心翻转。一件宝具从虚空中显形——圆柱状的剑柄，三段嵌套的柱体以精密的齿轮咬合，最外层缓慢旋转，每一道纹路都散发猩红色的光辉。那宝具的出现让周围的空气开始震颤，空间在它周围被无形的力量撕裂，发出不满的悲鸣。


  “等等……什么？！”


  伊什塔尔从马安娜上跃下，悬浮在空中。她的眼睛瞪大了，瞳孔中映出那根圆柱状宝具旋转的纹路。


  “开天辟地乖离之星？它不是你用来做成这个限制古伽兰纳的固有结界了吗？”


  她的声音抬高了一个音阶。视线在吉尔伽美什手中的EA和脚下这片红黑色的结界之间来回切换，嘴唇翕动了几次。


  “难不成你的那个是……”


  “假货？”


  伊什塔尔观察着吉尔伽美什的面庞。那张精雕细琢的脸上，眉梢微微沉了下去，王者的不悦几乎具现化成了金芒。


  伊什塔尔见状，她抱着肚子哈哈大笑起来。


  “我就知道——你就是这种人，宝库里的东西被说成是假货很不开心啊。”


  笑声未落，她的指尖轻轻向上一扬。


  马安娜应声升空。天舟在空中划出一道金色的弧线，船身翻转，弓首对准了吉尔伽美什的方向。与此同时，整个固有结界内的空气开始流动——不是被风推动，而是被引力拖拽着，以马安娜的弓首为中心缓缓旋转。


  伊什塔尔站在旋转的气流中央，长发在涡流中翻卷。她的手指扣在弓弦上，嘴唇抿成一线。


  此时此刻，空气流转的速度突然加快。吉尔伽美什脚下的地面变化了——


  巴比伦的城墙从虚空中拔起。


  石板铺就的大道、高耸的塔庙、刻满楔形文字的围墙——古巴比伦的阵地在一瞬间铺满了整个结界的底层，在红黑色的虚空上构建出一座完整的王城。


  城墙的轮廓从吉尔伽美什脚下向外扩散，塔庙顶端燃烧着金色的火焰，城墙上的每一道纹路都在流淌着文明的光辉。


  吉尔伽美什站在塔庙的最高处，俯瞰着那座青金石构成的巨山和她面前的女神。


  “世间大地，皆归于我。”


  “GATE OF WORLD！”


  王之财宝在空中展开，数以万计的金色的门，汇聚成了一道巨大的金色的墙。金色的门在古伽兰纳身躯的每一侧裂开，铺天盖地，如同无数只睁开的眼睛。门中探出的宝具全部完成了真名解放，刃尖上缠绕着对神兽、对幻想种特攻的术式，金色与银色的光芒交织成一张密不透风的网。


  古伽兰纳第一次后退。


  它的一只前蹄向后移了半步。仅仅是半步，青金石的蹄印就踩塌了巴比伦城墙的延伸段，城墙断裂成碎石，飞溅的瓦砾被结界的红光吞没。但那张宝具织成的网没有给它更多空间——第一波投射几乎同时命中它的四蹄，第二波轰击砸入它的关节缝隙，第三波凿穿了它表层那些已被炸松的青金石矿脉。


  古伽兰纳的全身在震颤。深蓝色的碎屑如暴雨般坠落，它的脊背上裂开一条延绵整个躯干的裂缝，那道裂痕在红黑色的天幕下发出凄冷的青光。


  [这么高等级的阵地建造？她什么时候？！]


  伊什塔尔的瞳孔微微收缩。她深吸一口气，肺腔被结界中稀薄的魔力灼得生疼。那具第三法造出的人偶躯体在警告她——魔术回路过载，肌纤维正在发出撕裂的预警。


  她无视了它。


  “这招怎么样呢？”


  伊什塔尔的声音从齿缝间挤出来。她的手指点在马安娜的弓首，天舟在引力漩涡的中心变形、延展——船身的两侧向外折叠，桅杆沉入船腹，龙骨弯曲成长弓的弓臂。马安娜化作一杆横跨虚空的巨弓，弓身上流淌着金色的神纹。


  “八方跪拜天空之锤！”


  金星的女神叩响了她的权能。


  金星的权限从天体深处被唤醒，行星的虚影在马安娜弓首的前端凝聚——不是幻象，而是真正被权限从太阳系第三轨道拖拽而来的金星本体投影。那投影被压缩、再压缩，坍缩成一枚子弹的形状，表面燃烧着天体核心的金色火焰。


  仅仅是蓄力的余波——'

content: '红黑色的结界从乖离剑的轨迹中诞生，层层叠叠如剥开的世界表皮，将整个上空裹入一片不属于任何地表的虚空。这片空间没有地平线，没有天穹，只有红与黑交织的脉络在无穷远处收束，仿佛被一只看不见的手攥紧的丝绸。


  马安娜悬停在半空，船底的金色光晕在结界中晕开一圈圈涟漪。伊什塔尔踩在船沿上，手指抵着下颌，视线穿过数百公里的距离，钉在那个金色的人影上。


  吉尔伽美什立在虚空的中央。


  黄金甲没有穿在身上。她只着一袭素白点缀着金边的轻甲，金色的发丝在无风中微微飘浮，周身悬浮着数十枚金色的门，王之财宝的出口就这样悬浮在她的身侧，每一枚都漾开一圈涟漪，宝具的真名早已在门内完成了解放。


  [不对劲。]


  伊什塔尔的指尖收紧了些。来自金星的神核向她传递着警告——脚下这片结界将古伽兰纳的权能压制到了极限。天之公牛引发的台风、雷暴、地裂，那些足以将伦敦从地图上抹去的天灾权能，在这片空间中像被掐住了喉咙。


  “什么时候她这么强了？”


  疑问在伊什塔尔舌尖打了个转，没有出口。


  古伽兰纳的本体横亘在视野的尽头。


  它的躯体由纯粹青金石构成，深蓝色的石质表面流转着星辰般的光泽，仿佛一块大陆被剥去了地壳，将最原始的矿脉暴露在空气里。全长五百公里——这样形容它的尺寸像在陈述数字，真正的景象是：吉尔伽美什整个人影在它面前不及一粒尘埃，马安娜在它身侧如同一只掠过山岳的飞蛾。


  古伽兰纳抬起前蹄。


  仅仅是抬起前蹄的动作，空气便被撕开了。压缩的湍流化作肉眼可见的白色气爆，以踏足点为中心向外横扫，气浪碾过虚空，即便隔着数百公里的距离，冲击波仍然撞上了吉尔伽美什周围的防御宝具，发出沉闷的碎裂声。


  蹄落。


  A+级别的对军宝具轰击——古伽兰纳的每一次踏足都拥有摧毁要塞的威力。结界的地面翻滚起深红色的波纹，如同被石子击中的湖面，波纹从蹄印处向外扩散，所过之处空间都在扭曲。碎裂的红色纹路沿着结界蔓延，足印边缘的空间碎裂成细小的碎片，露出底层翻滚的漆黑虚空。


  吉尔伽美什没有动。


  她身后的金色之门骤然张开，数量在瞬间膨胀到百枚。光炮、箭矢、锁链——所有宝具都在解放真名的状态下被发射出去，不是投射，是倾泻。金色的洪流在空中划出密密麻麻的弧线，拖着灼热的尾迹，撞上古伽兰纳如山岳般的躯体。


  轰击的位置爆起大片的碎石。


  青金石的碎片飞溅，每一片都大如宫殿的穹顶，在坠落过程中划出暗蓝色的光痕。古伽兰纳的表层被凿出密密麻麻的坑洞，但它的躯体仍在推进——缓慢，沉重，每一步都踩裂虚空，每一步都被宝具的洪流冲刷得石屑纷飞。


  “为什么……”


  伊什塔尔眯起眼睛。古伽兰纳的推进几乎停滞了，它的四蹄深陷在结界的地面中，青金石的裂痕从蹄印向上蔓延。吉尔伽美什的宝具没有停止，那些解放真名的神造兵装像永不停歇的暴雨，每一波轰击都砸在同一个位置，将裂痕凿得更深、更长。


  “不过到此为止了。”


  伊什塔尔踢了踢马安娜的船首。天舟的引擎发出低沉的咆哮，金色的星光在船尾炸开成一团光雾。她无视了来自身后那些金色涟漪中飞出的宝具，马安娜以全速向前冲刺。


  嗖嗖嗖嗖嗖！


  数十柄宝具紧追在马安娜身后，每一柄都锁定了伊什塔尔的后心。她侧过头，视线扫过追来的兵器，嘴角勾起。金色的星光从马安娜的引擎中喷涌而出，在她身后拖出一条光带。宝具碰到光带的瞬间速度骤降，偏移了轨迹，擦着马安娜的船舷滑开，坠入下方的虚空。


  伊什塔尔加速的惯性将她的长发甩向身后，风压撕扯着她的衣角。她站稳在船头，金色的星光自指尖洒落，铺成一条横跨虚空的路径。


  “就这点本事吗？吉尔伽美什~”


  她的声音在结界中回荡。古伽兰纳的躯干在身后堆叠成一座青色的山脉，而她的身影化作一道流星，如同从古伽兰纳身上起飞的卫星，星光在天舟的尾迹中曲折穿梭。每一次转向都洒下大片星光，那些光点在她的轨迹上悬浮，然后——


  坠落。


  “我可是本体下界，你不会真以为你能够战胜我吧！”


  伊什塔尔指尖向前一点。悬浮的星光在同一瞬间转向，数百道光束如暴雨般倾泻而下，每一道都精准地指向吉尔伽美什所在的位置。


  砰砰砰砰砰砰砰！


  光束在吉尔伽美什身前三尺处撞上了无形的屏障。防御宝具——数枚镜子形态的盾牌悬浮在她周围，自动迎击每一道袭来的攻击。金色的碎光在盾牌表面炸开，溅落成闪烁的星火，点亮了吉尔伽美什素白的身影。吉尔伽美什甚至没有抬头看那些落下的流星，她的视线穿过金光的碎片，落在伊什塔尔身上。'

content: '伦敦清晨的空气是湿的。


  泰晤士河一带漫出的雾还没有散，把主干道两侧的建筑轮廓压进白茫茫的底色里，越往远处越模糊，路面在白雾里消失了一半。


  金发少女在人行道的正中走着，步子不快也不慢，两手插在衣袋里，沿着建筑的影子往前走。


  四周都在叫。叫声来自两侧楼宇的空隙和路边废弃轿车的底下，是那种腔体失控、被饥饿驱到临界点的嘶吼，连贯不断，相互叠压，低沉，持续。死徒们挤在远处，没有一个靠近。


  爱尔奎特拐进一条支路，连看都没看它们一眼。


  别墅在支路尽头。


  院墙外还有死徒在游荡，发现她之后，往后退了几步，退了还不够，又再退了一截。爱尔奎特把手从衣袋里抽出来，向旁边虚抬了一下，周遭的几只死徒各自碎裂开来，没有挣扎，没有声音，就这样撕开了，碎成什么都没有的东西。


  院墙的另一侧传来细碎的动静，是残余的几只死徒在退缩。


  她在别墅正面站了站，停了停，然后抬起手。


  “欸，躲这么深啊~“


  手指刺进最外层的结界，轻轻往侧边一带，整个别墅外的魔术结界从中间撕开，碎片往两侧弹散，凭空消失。爱尔奎特把手缩回来，上前推开了门。


  里面没有人。


  或者说，第一眼看过去没有人。家具都在，沙发、餐桌、靠窗的书架，每样东西放得整齐，但都压着一层薄薄的灰，是长期没有人触碰才会积出来的那种灰。窗帘拉了大半，透进来的光很窄，落在地板上是细长的一道矩形。


  爱尔奎特站在玄关，往里看了一眼，没有动。


  咔哒。


  一扇门打开了，脚步声从走廊深处传出来，脚跟踩在木质地板上，清晰，有规律，一步一步往玄关方向走过来。


  那个女人停在走廊末端，看着爱尔奎特。


  鹅蛋脸，面上英气十足，一身黑色风衣，站得很直。


  “爱尔奎特？你总算是来了。“


  雅典娜开口的时候，没有挪动位置。


  “馁~混成这样了？雅典娜姐姐~“爱尔奎特绕过玄关，把外套袖子往上撩了一截，随意坐上了餐桌桌面，两腿悬在桌沿，赤眸扫了一圈室内，“这里的死徒密度比我预想的高，我来可是冒了很大风险哦~你可要好好协助我~“


  雅典娜没有立刻回答，把脚步停下来，立在走廊口。


  “你希望我协助什么？“


  “先说说你知道的。“爱尔奎特把一条腿搭到桌面上，往后靠，“这里的情况，从头说。“


  雅典娜沉默了片刻，走进客厅，在沙发扶手旁边停下来，没有坐。


  “伦敦里的死徒，不只是自然聚集的。“


  爱尔奎特的眼睛微微眯起来。


  “有人在驱动。“雅典娜继续，“规模和密度超出了普通死徒的行为上限，这不是单纯的饥饿，是调配。从路线分布来看，几个方向都有明显的封锁意图。“


  “是哈迪斯？“


  “不能确定是他本人，但背后的手笔和他的行为模式吻合。“雅典娜把手放到风衣口袋里，“魔力来源不在地面，在更深的地方。“


  “时钟塔呢？“


  “时钟塔还在。“雅典娜说，“魔术师协会的遗留成果基本完整，但进不去。驱动死徒的路线把那一带围了三层，我试过一次，退出来了。“


  “退出来了，“爱尔奎特把搭在桌面上的腿放下来，坐直了，“你？“


  “我现在的状态不适合硬打。“雅典娜的语气很平，没有解释理由，“所以我选择隐匿，等待合适的时机和合适的人。“


  “合适的人。“爱尔奎特重复了一遍，“那你等到了没有。“


  雅典娜看了她一眼。


  “还差一步。“


  爱尔奎特弯了弯指节，在桌面上敲了两下，“那就继续等，很快就有了。“


  舷窗外是一片白。


  云层从这个高度铺开，没有边界，没有起伏，铺到看不见边的地方去了，和玛修的肩膀正好齐平。她靠着椅背，睁了眼，在那片白里盯了一会儿，脑子还没完全转过来。


  吉尔伽美什坐在斜前方的位置，右手两指夹着红酒高脚杯的杯脚，把杯子端平，轻轻晃了晃，酒液在杯壁上挂了薄薄的一层。


  “还没到。“


  玛修把脑袋从椅背上抬起来，“嗯……还有多久，吉尔伽美什前辈？“


  “半小时后落地。“吉尔伽美什抿了口酒，没有转头，“去把你们的指挥官叫醒吧。“


  玛修起身，往后排探过身去，“前辈！醒醒！“


  立香翻了个身，背对着她，嘟囔了一声。


  “嗯……到了……吗？“


  “半小时后落地。“


  “哦哦这样。“


  立香从椅背上坐直来，把手在脑袋后面撑了一下，伸了个懒腰，颈椎咔嗒作响。


  “想不到飞的这么平稳啊~迦勒底上次飞机可不是这样的。“


  “换了人在开。“吉尔伽美什没有转头，“士郎做什么事情都做得很好。“


  “确实……“立香点了点头，想了想，“吉尔茜，你的职介不是Saber吗？“


  “是。“


  “Saber职介通常有骑乘技能吧？“


  “有的。“吉尔伽美什顿了顿，“但是我的骑乘是E----。“'

content: '“别催……“奥尔加玛丽揉了揉太阳穴，疲惫感和责任感在她那张年轻的面庞上拉扯出一种远超年龄的沧桑，“我那些好员工们还在日夜赶工。管制室那边刚传来消息，大概需要三个月。“


  “Ruler，你有办法吗？“立香抬头看向他，橘色的虹膜中倒映着测试室天花板的冷白光源，“目前我们能做的已经全部做了。“


  Ruler原本微微涣散的目光在听到这句话的瞬间骤然收紧。那双琥珀色的眼瞳像是被某个开关激活了一样，焦点从模糊的远方精准地聚焦在立香的脸上。


  “有。“


  这个字从他的喉咙中吐出时，带着一种不容置疑的确定。


  “亚从者计划，脱胎于我的第二个老师——神琦灰的灵基改造项目的副产物。“他用拇指摩挲着下巴，像是在记忆的深处翻检着某段久远的画面，“而且她并不完全算是人类，大概不会因为人类史的烧却而消失。如果能找到灰的研究数据，修复她的灵基就不是——“


  “很可惜。“


  一道冰冷的声音切断了他的话语。


  吉尔伽美什靠在墙壁上，金色的长发松束在脑后，几缕碎发垂落在颈侧。那双猩红色的眼眸平静地注视着Ruler，声线中不带任何多余的修饰。


  “神琦灰四年前死了。“


  空气凝固了。


  Ruler的动作停在了原地。他摩挲下巴的手指僵在了半空中，琥珀色的瞳孔在一瞬间剧烈地收缩了一下，又在下一个心跳中被强行压制了回去。


  “怎么可能？“他难以置信地转过头，目光死死地锁住吉尔伽美什的面庞，声音里第一次浮现出了某种近乎破碎的裂痕，“吉尔茜……你也会骗人了？“


  “我骗你做什么。“吉尔伽美什没有移开视线。她的嘴唇微微抿了一下，那细微的动作是她极少数会在外人面前流露出的、介于冷酷与心疼之间的晦暗边界。


  “是真的死了。“


  Ruler的嘴唇动了动，某句话正要冲破喉关的时候，测试室的舱门传来了三声节制而清晰的叩击。


  “进来。“奥尔加玛丽的声音打破了这片窒息般的沉默。


  金属门扇向两侧滑开，一个身形纤细的少女走了进来。迦勒底的简易病号服松垮地挂在她瘦削的身躯上，腕间还缠着尚未拆除的医疗监测带。蓝色的长发垂落在苍白得几乎透明的面颊两侧，衬得她整个人像是一尊被抽走了所有温度的瓷像。


  希耶尔。


  她的步伐缓慢而坚定，每一步都像是在与自身残破的躯体做着无声的博弈。她的目光先是落在了那位金色长发的王者身上，然后缓缓移向了Ruler。


  两人的视线在半空中交汇了一瞬。


  那个瞬间极短，短到在场的其他人几乎无法捕捉到其中翻涌的暗流。但立香敏锐地察觉到了希耶尔眼底闪过的某种复杂情绪。


  “你说神琦灰死了？“希耶尔没有寒暄，声音沙哑却直指要害。


  “是的。自杀。“吉尔伽美什开口，语调依旧平淡。


  “你见到她的尸体了？“


  “哼？“吉尔伽美什微微愣了一下，猩红色的眼瞳中掠过一缕罕见的不悦，“她在我面前自杀的，我能不知道？尸体都是我亲手埋葬的。“


  Ruler的面色一寸一寸地沉了下去。他原本松弛地靠在椅背上的身体微微前倾，脊背绷成了一条紧绷的弧线。


  “为什么？“


  吉尔伽美什顿了顿。她将目光从希耶尔身上收回，投向了面前这个正在一点一点崩塌表情管理的男人。


  “她没跟你提过吗？弑神是有代价的。“


  Ruler没有回答。他的沉默本身就是答案。


  “神明被杀戮是带有怨气的。“吉尔伽美什的声音不急不缓，像是在讲述一段早已尘埃落定的史实。但她的指尖在交叠的臂弯中微微收紧了，那个动作被深灰色的制服袖口遮掩得严严实实。


  “你觉得有谁能够承受那些神明的怨恨？整个弑神计划里，不就只剩她了吗？十年间，协会和教会屠戮了多少在表层作乱的神明？那些神怨，全部都是她一个人在承受的。“


  她的声音在说到“一个人“三个字时，出现了一丝极其微弱的、几乎不可闻的停顿。


  “当几乎没有神明再会作乱时，也是她承受不住的时候，她就选择赴死了。“


  话音落下。测试室内的空气仿佛变成了凝固的琥珀，将所有人的呼吸都封存在了其中。


  吉尔伽美什说完之后，她看向了Ruler。然后，她的嘴角忽然勾起了一抹极浅的弧度。


  那个笑容只存在了不到半秒，就像一道转瞬即逝的闪电，迅速地被她压制回了面无表情的冰层之下。


  但立香看到了。


  她也看到了Ruler。


  他沉默地坐在那把金属折叠凳上，脊背挺直，双手自然地垂放在膝盖两侧。他的表情几乎没有变化，那张冷硬的娃娃脸依然维持着看似从容的轮廓。但他的瞳孔深处——在那片琥珀色的澄澈中，有一道极其细小的弧光闪了一下。


  像是水面上最后一丝涟漪，未及扩散，便被强行按灭了。'

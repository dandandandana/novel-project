content: '达芬奇和奥尔加玛丽将当前的战况以最精简的方式呈递在Ruler面前：人理烧却、五个特异点、冠位指令、迦勒底几乎全灭的惨状。全息面板上那些冰冷的数据与图表像一道道伤痕，将这个末日的轮廓勾勒得清晰而残忍。


  Ruler静静地听完了全部内容。他坐在金属折叠凳上，一条腿随意地搭在另一条上，姿态松弛得几乎不像是在接收世界末日的简报。直到最后一个数据节点被关闭，他才微微偏了偏头，从鼻腔中吐出一口气。


  “人理烧却啊……“那双琥珀色的眼眸缓缓扫过面板残留的余辉，“现在还能观测到的文明，只剩下迦勒底了吗？“


  “当然不是。“达芬奇将手指点在一幅全球热力分布图上，在欧洲板块的某个位置圈出了一个微弱得几乎看不见的亮点，“目前卫星显示，伦敦还存在人类活动的波动。“


  “除此之外呢？“


  “没了。“


  “……“Ruler的指节在膝盖上轻轻叩了两下。那声响在空旷的测试室中显得格外清脆，像是某种用以代替叹息的节拍。


  “情况很糟糕啊。“


  “我们当然知道，不然召唤你过来做什么？“奥尔加玛丽双手环胸，银色的长发因为头部微微扬起的动作而在肩头轻晃。她的语气依旧尖锐，但那份尖锐之下裹挟着的焦灼已经不再试图掩藏。


  “……你在说什么啊，你换其他从者来不也一样两眼一抹黑吗？“Ruler无奈地用手背蹭了蹭鼻尖，侧过头看了奥尔加玛丽一眼。他的目光中没有不满，只有一种近乎长辈式的无奈。


  奥尔加玛丽的嘴巴张了张，又合上了。她发现自己竟然无法反驳这句话。


  “所长，看样子您这回的情绪是没办法发泄到这位Ruler身上了呢。“达芬奇适时地插入了一句调侃，嘴角弯出一个颇具玩味的弧度。


  “哼……“


  “Ruler，所长就是这个脾气……“立香额角沁出了一滴冷汗，朝着Ruler小声解释。


  “已经看出来了。“Ruler点了点头，语气平和得像是在陈述某种不争的事实，“外强中干的大小姐嘛。“


  “你这个从者是怎么跟所长说话的！！还有立香，你别一脸''说得对''的表情！“奥尔加玛丽的音调骤然拔高了一个八度，银发几乎要根根竖起。


  “咳咳。“Ruler毫不在意地撇开了这位暴怒中的所长，将目光转向达芬奇。他的语气重新回归了正题，声线中的松弛被一层薄薄的凝重所取代。


  “继续吧。刚才你提到的亚从者，是那个拿盾的小姑娘吗？“


  “是。“达芬奇的笑容也随之收敛。她关闭了先前的全球热力图，调出了一份标注着密密麻麻异常数值的灵基波动报告，“目前的状况下，她的生命……不足两个月。“


  这句话落下的瞬间，测试室里所有轻松的余温在一瞬间被抽干了。


  立香脸上残留的笑意像是被人用手掌生生抹去了一样。她的视线垂落下去，落在自己交叠于身前的手指上。那些手指的指节因为不自觉的收紧而泛出了淡淡的青白色，与袖口处不合身的褶皱交织在一起，构成了一幅沉默的、竭力隐忍的画面。


  “嗯嗯，我知道了。“


  Ruler的声音从旁边传来。立香偏过头去看他，然后怔住了。


  他的表情没有丝毫变化。


  不是强忍，不是伪装，是真真切切的、经历过太多死亡之后才会自然生长出来的那种波澜不惊。那双琥珀色的眸子平静地注视着达芬奇的灵基报告，像是在审阅一份需要处理的工作文件，而非一个少女即将消逝的生命倒计时。


  【不对……】


  立香忽然想到了特异点F的言峰士郎。


  他当时也是这样评价他自己的生命，但是不一样。


  Ruler此时的话语的意图在于尽量快的分析情况，然后做出抉择。


  那位言峰士郎则是在得知自己有可能会死之后觉得这压根不算什么。


  “希耶尔是彻底丧失战斗力了吗？“他问。


  “对。“达芬奇的声音低沉了几分。


  Ruler再次点了点头。他将双腿从交叠的姿态放了下来，马丁靴的鞋底稳稳地踩在地面上。


  “那么，我先把我想做的提出来吧。“


  他的目光扫过在场的每一个人，最后落在了立香身上。那道视线沉稳而笃定，像是在这片满目疮痍的废墟中精准地锚定了唯一需要优先加固的支柱。


  “我觉得先救那个名叫玛修的小姑娘比较好。“


  他微微歪了歪头，嘴角牵出一个极浅的弧度：“你觉得呢，御主？我全听你的。“


  立香的呼吸在那一瞬间停滞了半拍。“先救玛修“——这四个字从一个刚刚降临不到两小时的从者口中说出来，份量却重得几乎能让她红了眼眶。她深吸了一口气，将那股灼热的酸意压回了鼻腔深处。


  “我也是这样想的。“她的声音很轻，却稳。


  “好。“Ruler点了点头，将视线移向奥尔加玛丽，“所长，下一个特异点的锁定需要多久？“'

content: '立香身后的少年哈哈一笑。笑声还没落定，她脚下的地板就消失了。楼板从中央碎裂塌陷，碎石与灰尘裹着立香往下坠。她看见了雅典娜静止的站立姿态，看见了玛修扑向楼板缺口被尘土吞没的手，看见了三楼天窗的光在崩塌的洞窟里缩成刺眼的白色光斑。


  轰隆。背脊撞上二楼地板，疼痛从脊椎传到全身，停在了每一根骨头上。


  “真是不小心啊，在新灵长降临之后我会感谢你的智慧女神。”提亚慢慢往后退开。


  “前辈！”玛修扑向豁口。她的上半身探出楼板的破裂边缘才看清底下二楼的轮廓。“你的对手是我。”她的侧腹挨了一记重击，长枪的枪杆砸在她腰际。


  玛修被抽飞出去。她的背脊撞上三楼的墙壁，墙面的石灰炸开蛛网般的裂痕。第七圣典在撞击中脱手飞出。雅典娜拖着长枪走向她，枪尖的石板划出火花的擦痕。


  “别分心，小姑娘。随时会死的。”


  立香从二楼的地板上爬起来。右手撑地时蹭破了掌心的表皮，血珠从裂开的皮缘渗出来，混着灰在掌纹里结成深色的泥。她从腿间的枪套抽出那两柄名为安魂的双枪，左手握白右手握黑，枪身冰凉，烫金的铭文硌进虎口。


  “不放弃啊。”


  黑色魔弹先提亚的脚步从楼梯口射出来。弹道划破二楼走廊的空气时发出灼烧丝绸的嘶嘶声，立香往旁边翻滚，魔弹擦过她的肩头凿进身后墙壁，炸出拳头大的焦黑坑洞。


  提亚踏上二楼的最后一节台阶。他的指尖在虚空中一弹，手腕翻转之间雷光从五指爆射而出。雷击的轨迹是蓝白色的折线，它劈开空气劈开灰尘劈开立香翻滚后落定的那个位置。


  身体抢在大脑之前做出反应。立香往侧方翻出第二圈，雷击轰中她刚才趴过的地板，石板炸成碎砾溅上她的背脊。


  “有点意思。那是不属于你的东西吧。”提亚挑了下眉。“不过到此为止了。”


  立香撑着膝盖喘气。从三楼摔下的冲击还在肋骨间游走，每次呼吸都带着从夹缝里挤出来的刺痛。但刺痛下头压着更烫的东西，一种烧穿了疲惫与疼痛的热度从胃袋升上来，沿着食道往上涌，堵在喉咙口快压不住了。


  [玛修在上面——玛修在上面对付女神雅典娜。]


  “滚开。”立香举起双枪。白枪的准星先对准提亚的眉心，黑枪的枪口紧随其后偏了半毫。“别挡我的路。滚开。”


  “哦？你怕不是在说笑吧。我怎么看都是来杀你的吧。”提亚歪着头，“杀了你，然后再杀了那个亚从者，最后去杀了迦勒底所有人，就能够——”


  砰。


  枪响了。


  白枪的枪口跳了一下，硝烟从准星两侧溢出，沿着滑套的纹路袅袅散开。


  [他说他要做什么？杀了玛修，杀了所长，杀了达芬奇…杀了迦勒底的所有人。]


  [杀了他——杀了他杀了他杀了他。]


  立香的脑海里只剩下这一个念头。身体顺应着这个念头读取了安魂枪上铭刻的武艺。言峰士郎的握枪习惯，他的射击节奏，他扣扳机前会暂停半秒的呼吸——一切都在瞬间灌进立香的肌肉记忆。然后她扣下了扳机。


  提亚没躲。子弹打进他的右肩，血从弹孔里溅出来染红他的衣领。他低头看向肩上的弹孔。“偏了啊~打中脑袋的话……”


  他的声音被自己身体里的撕裂斩断了。剑刃从他体内往外长，皮肤下隆起点点的凸起然后被剑尖撕裂。铁灰色的剑刃密密匝匝刺破皮肉破壳而出，骨骼结构在金属的根系侵蚀下发出木板被掰断的闷响。剑与剑互相摩擦，发出指甲划过铁板的声音。


  “额啊啊啊啊啊啊这是——”


  提亚的惨叫还没落定，立香已经冲了上去。安魂双枪在她的手中展开变形，枪管折叠滑入枪身，剑刃从弹仓的位置翻出来的动作震得她虎口发麻。她握着两柄剑柄，把自己投进空气，像一片被狂风裹挟的落叶切进提亚近身。


  第一剑横斩提亚脖颈。


  第二剑反手斜劈胸腔。


  第三剑由上至下劈开整条脊柱。


  立香的脚步没有停。她绕着提亚碎开的身子旋转，剑刃切割空气切割骨肉切割石板。她在提亚的残骸间停下脚步，左脚踩在血泊边缘微微打滑。双剑的剑尖垂向地面，血沿着刃口的凹槽往下淌，在脚边溅出细密的红点。


  提亚的身体倒在地上。那团模糊的血肉蠕动着试图拼合重生，但残留在创口里的剑刃互相摩擦，把每一条新生的肉芽都割断绞碎。少年的躯体终于不再动弹，蠕动的残块软塌塌地散落在地面。


  立香往前踏出一步。她想上楼，想去玛修身边。然后一个高大的身影撞进视野——言峰士郎站在她前方三步的位置，他朝她走过来。


  “士郎——”


  立香的膝盖软了。读取武艺的代价在肾上腺素退潮后成倍反噬，手臂像灌了铁水寸重千斤，肩膀的关节发出酸胀的悲鸣。她往前倒，脸埋进言峰士郎的胸口。他的手臂接住了她，一边稳得如石柱，一边轻得只压住衣料不压住伤口。'

content: '“哦？你和她有什么仇？”哈迪斯把视线从甲板外沿拉回来落在朱月身上。他的声音在空中传得很快，每个字出来的间隔精准得像被标尺划过的节拍。


  朱月把身子往后一甩。她的黑发在无风的空间中飘起来，末梢堪堪扫到甲板上那道冷色光弧撑开的荧光圈。


  “既然你都说了你屈辱的一段历史了——”她扭头看向哈迪斯，嘴角往上提了一分。那个笑从嘴形上看很甜的。


  “那我不说是不是太不够客气了？”


  “曾经有个不自量力的UO。”朱月把手指抵在自己锁骨下方的皮肤上，指腹在皮肤上面轻轻叩了两下。“见到了外面漂浮着的战舰——就是你现在的这艘。认为地球足够让她彻底统治了。”


  “哦？”哈迪斯应了一声。


  “然后那个UO领了一发神琦灰的以太炮。”朱月微笑着开口，笑在脸上铺得很满。


  “然后那个UO直接当场暴毙。连残躯都被打造成了魔剑真世界。”她把这句话说出来的时候，语调里没有任何多余的颤动，平稳得像是她在一个下午茶桌上翻阅旧报纸。


  “哦。”哈迪斯把手背到身后。黑色的战袍在无风的空间中纹丝不动，他歪过头来看着朱月。“那个UO就是你啊。那确实是一箭之仇。”


  “哼哼。”朱月瞥了哈迪斯一眼，红瞳在眼眶里微微一转。“你来也一样。”那句话说得很轻，轻到哈迪斯几乎能听见她声带在关闭前留下的最后一阵气音。


  “那可不一定。”哈迪斯喃喃道。他把这句话说出来之后视线越过朱月的肩膀，远处的天幕上亮起来一颗星星。那颗星的出现方式不是从暗到亮慢慢点燃，是上一帧还没有下一帧就已经在那里了，亮得能把周遭的星光全部比下去。“那是什么？”


  朱月顺着他的目光看过去。那颗星悬在天幕上，光芒的强度在肉眼可见地往上攀升。她顿了顿。


  “那是原理血戒·月虹。”


  说完这句话，她的身子朝甲板边缘的方向猛地一转。黑发在空中拉出一道弧线，脚跟在甲板金属面上踩出极短促的两声闷响——然后她整个人就朝战舰的边缘飞奔过去。不是走不是跑，是逃。是她在月虹面前落荒而逃，连放一句场面话的余裕都没有。


  “嗯，祝你武运昌盛。”朱月的声音从甲板的另一头飘回来，被无风的空中削去了一半的音量。“我的目的达到了，先走一步。”


  哈迪斯看着朱月的背影消失在战舰甲板的边缘。他没有追上去，甚至没有挪动脚的位置，只是把手从背后放下来垂在身侧。然后他静静地看着天上那颗星星。


  光芒被这颗星星彻底吸收了。


  不论太阳的光，还是伦敦市区的街灯和霓虹招牌散发出的残余光晕，都在被这颗星一丝一丝地抽过去。光被拉成无数条极细极细的线，从地面上方开始朝天空中的那个点收束。


  整个伦敦的轮廓在光芒被抽走的过程中一层一层地褪去颜色——先是天幕边缘那层灰蒙蒙的晨光没了，然后是西敏寺塔尖上反射的金属光斑灭了，最后连泰晤士河面上荡漾的水光也被吸干，整条河变成一条躺在城市腹部的暗色带子。


  不能再让它吸收下去了。


  哈迪斯把右手从身侧抬起来。手掌摊开，五指张开，指间的空气被冥力的余波震开一圈微不可见的涟漪。需要把他们拖入冥界继续。


  “吾，司掌冥界。”


  哈迪斯吟唱出声。语调淡到像是在说今天早餐吃了什么，但每一个字从嘴里吐出来之后都坠在空气里不肯消散。


  冥界之雨慢慢地再度下大了——从天空裂隙里灌下来的灰色水柱变得更加密集，砸在甲板上溅起的水花连成了一片。空中展现出一个巨大的圆盘，材质不是石头不是金属，是像把一整块黑曜石从地球的某个最深处抽出来然后悬在云层上方。


  圆盘的表面光滑到能映出下方战场上那些被雨水浇得歪歪扭扭的残垣断壁的倒影。


  “吾爱，准备结束他们吧。”


  “明白。”机器一样的女声在甲板上方响起。那声音从战舰内部的一层层金属隔板间渗出来，带着共振后的余韵。珀耳塞福涅的人形终端还没有显现，她的声音先从舰体的每一个接缝里涌出来把整片空间填满了。原本隐身于云端的巨型战舰在空中现形出来——舰体从云层中推出来的瞬间，周围的云被气浪挤压着往两侧翻涌，露出舰身上那些不属于人类文明的纹路。


  “主炮准备就绪。”


  “直接把这片大陆彻底轰沉吧。”冥王哈迪斯对着悬浮在甲板边缘的光球开口。终端表面的蓝色光弧在他说话的时候加速跳动了半拍，然后稳定下来恢复到原来的频率。“准备发射吧。”


  随着完全不是人类的机器的声音响起，整个战舰变成了极致的蓝色光芒。那蓝光从舰体的每一道接缝、每一处炮口、每一个曾经被游星尖兵撕开过的旧伤疤里渗出来，不只是光——是魔力被压缩到接近固态的时候开始往外溢出的冷色调的等离子体。'

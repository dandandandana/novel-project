content: '狰狞的机械声不间断地响起。盾面从中间裂开，两侧的结构往外翻转再往内收，每一层装甲都在雨幕中自行重组。然后玛修手中的巨盾变成了一个如同战列舰主炮一样的巨炮——炮身的长度比她的身高还要多出一大截，炮口对准天空的方向。她把巨炮猛地往地面上一砸。炮座磕在石板上发出沉重的一声闷响，石板被炮座的重量碾出了几道朝四周延伸的细缝。


  “前辈。”


  “玛修。”立香伸出手，她手臂上的皮肤在雨水中被浇得发凉。手背上红色的令咒纹路在昏暗的雨光里猛地亮了起来——令咒点亮，红色光纹从皮肤底层往上涌，亮到能透过雨水看出一道道古老术式的刻印。“英杰之帜。”


  力量朝着玛修的身体里涌入。那不是加拉哈德的灵基，不是温和的、带着高洁的圆桌骑士的力量。也不是雅典娜那种冷冽的、从奥林匹斯山顶往下俯瞰的权能——那是属于玛修·基列莱特自己的灵基。


  从处刑处里走出来的那个少女，在无数个镜面回廊里把自己的每一块碎片都捡回来重新拼在一起之后诞生的，属于她自己的东西。她感受着这股力量带来的提升。魔力涌入巨炮中，炮身上的纹路从炮座开始一层一层往上点亮。


  “「多功能武装，最终形态切换。」”


  “「星之吐息汇聚于此。断罪之枪，过载确认。」”


  “「上了，前辈。我要——夺回明天。」”


  轰隆隆的声音在炮身的内部翻滚。然后一道圆形的白色光晕在玛修和立香的身边撑开来，光晕的边缘把她们两个人完整地罩在其中。魔力过载的途中，这道光晕正好挡住了来自巨炮发射时朝反方向倒灌的冲击波。


  在天空中的月虹全力输出到极致、最后击碎了战舰主体的防护罩的时候。


  “「全力输出——『夺回明天的迦勒底之刃』（Chaldea Edge）！！！」”


  一切安静了。


  不是那种突然陷入死寂的安静，是声音本身被抽走了——不是消失，是被压缩进了一个以炮口为起点的甬道里然后朝舰体直直地轰过去。在立香的眼中没有丝毫光芒，仅仅只是一发纯粹的空气朝着哈迪斯在空中现形的主要舰体轰去。空气本身被压缩到接近固态，然后在接近舰体的时候炸开。


  然后哈迪斯的主体发生了坍塌。


  整个舰体在爆炸的途中往内收缩了。金属外壳从外沿开始朝正中心的方向一块一块地塌进去然后再弹回来，每一层的残骸在挤压中变得扁平。就好像有无尽的吸力从舰体的核心深处往外抓住所有残骸的碎片，然后把手收回去一把全部拽进内部。舰身后半段扭曲的骨架互相叠压着拧在一起，前半段的主炮口从中间裂开，裂缝沿舰体纵向延伸，把整艘战舰的轮廓拆成了一堆正在一边往内卷一边往下坠的碎片。


  伊什塔尔的声音从屋檐另一侧传过来，尖细的嗓子在雨里被盖住了一半，但她的话还是一整句一整句地从喉咙里往外蹦。“骗人的吧，那可是确确实实的机神本体啊——”她把头转向雅典娜，眼睛里有一种即将开始絮叨的崩溃光泽。“真的吧，你骗我的吧，哈迪斯的机体绝对没有恢复对吧。”


  “当然不是。”雅典娜把视线从空中那团正在往下坠落的残骸上收回来。她的语气轻轻的，轻到像是在说一个没人想听的天气预报。“这种事情我可不撒谎的。”


  伊什塔尔沉默了。她的嘴还张着，但是没发出声音，雨水顺着她的刘海淌下来滑过鼻尖滴下去。她看着正在从空中往下坠落的黑色碎片，嘴巴合上了。


  雅典娜转身看向立香。她朝前走了一步，脚尖在积水里踩出一圈很浅的波纹。“去吧，藤丸立香。你应该能够感受到我给你的哈迪斯的构成了。”


  “对的。”立香点头说道。她把手从玛修肩上放下来，手臂垂在身侧的时候手背上的令咒残光还没有完全熄灭，在雨幕里一闪一闪的。“雅典娜女士给我的英杰之帜里有所有的希腊神的数据。”


  “玛修，接下来我也要参战了。”她看向玛修，被雨水浇湿的橘色发丝黏在她太阳穴上。她把那缕湿头发用食指拨到耳后，然后下巴朝前微微一扬。


  “走吧。”


  “去冥界和他正面对决。”'

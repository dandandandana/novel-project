content: '声音不大。甚至可以说很轻。轻到在暴雨中，只有站在正下方的Alterego听清了那个词。


  “幻想崩坏。“


  EA的投影品在接触太刀的瞬间，结构崩溃了。


  那种崩溃不是“碎裂“。碎裂是一个物理过程，有碎片，有轨迹，有声音。但投影品的幻想崩坏是一种概念性的终结。构成这柄武器的所有魔力结构在同一时刻被强制解除了“存在“的资格，它们不是被打碎的，是被否定的。所有维系这柄武器形态的魔力，在被否定的瞬间全部转化为了纯粹的破坏力，以接触点为圆心向外爆发。


  而这柄武器的结构，是EA。


  是能够将世界剖开的乖离剑。


  即便是空壳。即便没有魔力填充。一柄完整复现了EA构造的投影品，在幻想崩坏的瞬间释放出的结构解体能量，也足以将方圆数十米内的一切从物质层面上抹消。


  光球炸开了。


  没有声音。


  或者说声音太大了，大到超过了人类耳朵能够处理的阈值，所有在场的人在那一瞬间都失去了听觉。暴雨的声音消失了。风声消失了。自己的心跳声消失了。世界在那一刻被按下了静音，只剩下一团从接触点向外膨胀的、漆黑的、球形的虚无。


  那团虚无的颜色是黑的。不是夜晚的黑，不是墨汁的黑，是“这里什么都没有“的黑。光线进入那个球体就不再出来，雨水进入那个球体就不再存在，石阶、泥土、植被、空气本身，凡是被那个球体边缘碾过的一切，都像是从来没有在这个世界上出现过一样，彻底、干净、无声地消失了。


  柳洞寺的石阶被从中间抠去了一大块。


  贞德搂着立香站在“吾主在此“的金色光壁之内，她的双臂紧紧锁着立香的肩膀，脸埋在立香的头顶。光壁的表面在那团虚无的边缘冲击下剧烈颤抖，圣纹的光芒一明一暗地闪烁，像是一盏被狂风吹得摇摇欲坠的灯。


  贞德咬着牙。她的整条右臂都在抖，维持宝具的魔力消耗让她的脸色从苍白变成了灰白，额角的青筋跳动得肉眼可见。但她没有松手。


  光壁撑住了。


  虚无的球体在膨胀到最大半径后开始收缩。黑色的边界向内塌陷，像是一个气泡在被吸回水面以下。当最后一丝黑色消散时，声音回来了。暴雨的声音猛然灌入耳膜，密集得几乎让人头晕。


  立香从贞德的怀里抬起头，越过金色光壁的边缘往外看去。


  石阶上多了一个坑。直径大约十米，深度看不到底。坑的边缘整齐得不像是爆炸造成的，更像是有什么东西用一把极其锋利的刀，把这一块空间连同里面的一切一起挖走了。


  坑的正中间，站着一个人。


  Alterego的样子极其难看。


  他还站着。但他的站姿已经不再是之前那种令人发指的松弛了。他的身体微微前倾，重心压在左脚上，右脚向后撑着，像是在勉强维持平衡。他的太刀不见了。可能碎了，可能和那团虚无一起被抹消了，总之不在他手里了。


  他的左臂从肩膀以下整个消失了。


  不是被切断的。断面上没有血，没有骨头的截面，没有肌肉纤维的撕裂痕迹。那里只有一片平整的、灰白色的光滑创口，像是那条手臂从来就不曾存在过，只是世界的记录档里被人抹去了那一行数据。


  但那个创口正在愈合。


  灰白色的平面上，像素般细碎的光点正在向外延伸，一层层地堆砌，一点点地重构出手臂的轮廓。骨架先成型。然后是覆盖在骨架上的肌理。然后是表皮。整个过程像是有一台看不见的打印机正在以极高的速度、从肩膀到指尖逐寸逐寸地将他的左臂重新“打印“出来。


  他的躯干上也有类似的创口。右侧肋骨到腰腹的位置凹进去了一大块，胸口的衣物和底下的皮肤一起被抹消了，露出下方同样正在重组的灰白色平面。脸的右半侧有一块从颧骨到下颌的区域也缺失了，那个缺口让他的表情变得诡异而不完整。嘴角那道浅弧只剩下了左半边。


  他在飞速地重组。


  左臂的重构已经推进到了肘部。肋骨到腰腹的缺口正在以肉眼可见的速度被填补。脸上的缺失区域也在一层层地复原，颧骨、皮肤、连同那道微妙的浅弧的右半边，都在暴雨中重新成型。


  Alterego抬起了他那只唯一完好的右手，用手背擦了一下嘴角。


  他的目光向上抬起。


  看向屋顶上那个持弓而立的少年。


  暴雨在他们之间倾泻而下。


  他开口了。


  声音沙哑了一些。重组过程中声带大概也受到了波及。但那句话里的每一个字，都清清楚楚地穿透了雨幕，送到了屋顶上那个少年的耳朵里。


  “成人了啊。“


  他停了一下。


  左臂的重构推进到了手腕。五根手指的轮廓开始从灰白色的光点中浮现出来，指节一段一段地成型，像是有什么东西从虚无中伸出手来。


  “言峰士郎。“'

content: 'Alterego仰着头看他。暴雨从天上落下来，落在他周围被那层无形薄膜隔开，落在他脸上分流滑走。他仰着头，和屋顶上那个与他共享同一张脸的少年对视。


  “……“


  他没有说话。


  言峰士郎也没有说话。


  少年的右手探向背后。手指没入了空气里，像是在一个看不见的架子上摸索什么东西。他的嘴唇动了。


  “读取。覆写。“


  两个词。声音很轻，被暴雨撕碎了大半。但那两个词中蕴含的魔力波动，在它们离开他的唇齿的瞬间就扩散到了整个柳洞寺的范围内，连脚下的石阶都随之产生了一阵细微的共振。


  他的右手从身后抽了出来。


  手中握着一柄剑。


  那柄剑的外形与任何已知的剑类武装都截然不同。它没有刀刃，没有剑锋，没有护手。它的形态更接近于一根圆柱体，表面覆盖着层层嵌套的环状构造物，红色与灰色的纹路在那些环状结构上交替排列，像是某种远古机械的截面。圆柱体的末端不是剑尖，而是一个类似于涡轮的旋转结构，即使在静止状态下，那些叶片之间的缝隙也在向外渗透着一种极其压抑的、让空间本身都产生了扭曲感的力场。


  开天辟地乖离之星。


  EA。


  那不是来自言峰士郎自己的投影魔术。他的投影魔术的本质是“看一眼就能复制“，但EA超越了那个范畴。它的结构太过复杂，太过古老，太过偏离人类文明的认知框架，仅凭“看“是不可能复制这柄剑的。


  这柄剑的构造来自另一个人。


  吉尔伽美什。英雄王。言峰士郎的养母。


  她将EA的内部结构，每一个环状构造物的排列逻辑、每一层纹路的魔力回路走向、每一个旋转叶片之间的力场平衡参数，作为经验，直接传授给了她的养子。不是文字记录，不是图纸演示。是将她身为EA的持有者积累的使用经验，以魔术师口传心授的方式，烙印进了言峰士郎的记忆之中。


  能够复现这一柄剑，是吉尔伽美什为言峰士郎定下的成人考验。


  你什么时候能投影出EA，你什么时候就算长大了。


  这是养母对养子说过的话。


  言峰士郎把那柄圆柱状的剑搭在了弓弦上。


  它不合适。弓弦的长度、弓臂的张力、搭箭点的位置，所有参数都不是为一柄形态如此诡异的武器设计的。圆柱体的表面在弓弦上打滑，环状结构的棱角卡在弓臂内侧发出金属摩擦的刺耳声响。


  “改造。“


  一个词。


  他的手指在圆柱体的表面按了下去，魔力从他的指尖灌入EA的结构内部。那些环状构造物开始转动。不是EA固有的旋转方式，而是在言峰士郎的魔力引导下被强行拆解、压缩、重组的转动。圆柱体的形态在他掌心里发生了变化。环状结构一层层收拢，纹路一圈圈拉长，涡轮状的末端被压扁、延伸、打磨成锥形的箭尖。


  EA的形态从一柄剑，变成了一根箭矢。


  这不是EA原本的使用方式。吉尔伽美什绝不会这样做。她会手持EA，解放三段真名，让乖离剑的力量正面碾碎一切。那是王的战斗方式。堂堂正正，无可匹敌。


  但言峰士郎不是王。


  他是一个剑士的御主。他是魔术师。


  圆柱状的EA被他揉捏成了一根修长的、表面仍残存着红灰交替纹路的箭矢，搭在弓弦上。弓臂被拉到了极限。弦与弓的缝隙不到两指宽。他的持弓手在发抖，手臂上的青筋从手腕一路爬到肘弯，皮肤底下的肌肉绷成了一条条鼓胀的棱线。


  他没有解放真名。


  这一柄投影出来的EA是空壳。结构完美，内部没有魔力。吉尔伽美什传授给他的是构造和经验，不是魔力。所以这柄剑，或者说这根箭，不可能像真正的EA那样释放出乖离剑的固有结界。


  但它仍然是EA的投影品。


  它仍然拥有EA的完整结构。


  而一切拥有完整结构的投影品，都可以被一个魔术彻底终结。


  那个魔术的名字，叫做幻想崩坏。


  言峰士郎松手了。


  弦声。


  暴雨中响起一声弦声。沉闷的、短促的、像是有人用拳头擂了一下棺材板的闷响。箭矢脱离弓弦的瞬间，它尾部残存的环状结构开始高速旋转，红灰色的纹路在旋转中拉成一道道模糊的色带，整根箭矢化作一道旋转着的光柱，穿透雨幕，朝石阶下方那个滴水不沾的身影直射而去。


  Alterego看到了那根箭。


  他的瞳孔里倒映着那道旋转的红灰色光柱，倒映着箭矢表面那些他无比熟悉的、属于EA的结构纹路。


  他没有躲。


  他举起了太刀。


  箭矢撞上太刀的刀刃。冲击的一瞬间，Alterego的双脚在石阶上向后滑出了半步。碎石从他脚下被推出去，雨水被震成一圈向外扩散的雾气。箭矢的旋转力压在太刀的刃面上，红灰色的纹路与太刀的钢面之间迸射出一连串密集的火花。


  他挡住了。


  他的太刀挡住了EA的箭矢形态。


  然后言峰士郎在屋顶上开口了。


  一个词。'

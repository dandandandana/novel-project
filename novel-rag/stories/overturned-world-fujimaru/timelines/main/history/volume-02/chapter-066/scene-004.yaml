content: '士郎看着眼前的哈迪斯，手中出现了一柄武士刀。刀身不是从灵子里凝出来的，是从他的心象里直接抽出来的——那个名为无限剑制的固有结界里所有的剑被压缩为极致的一柄。“此身为剑所天成。”由言峰士郎的心象里所有的剑组成的天丛云剑，此时此刻出现在了他的手中。


  “天丛云。”


  一剑斩出。


  ==


  “将军了。”立香看着哈迪斯，挥舞起安魂变形的双剑。剑刃从哈迪斯的身体上切过去的时候，金属的残片像被拍破的镜面一样朝四面八方飞出去。哈迪斯的身体顿时被立香切了个粉碎——不是切开，是切到每一片碎块都不再组成一个可以被称为“身体”的形状。


  哈迪斯笑了起来：“哈哈哈哈，你以为这样就结束了吗？”他的声音从碎片中传来。他的瞳孔竟还在某一片碎块上完整地保留着，那颗金属的圆环在冥界的黑暗中发出冰冷的微光。“太迟了，你如果快一点——”他顿住了。


  三头犬的吼声朝着立香身后扑来。吼声在冥界的空旷里被放大成压过来的声浪，声浪打在她的后背上像被一块铁板拍了一下。英杰之帜的效果作用于立香身上只能给她提供耐久B的属性——完全无法抗住三头犬从背后轰来的这一声怒吼。


  立香转过身来。


  哈迪斯看见了立香此时此刻的样子。血从她的鼻孔和耳朵里渗出来，沿着下巴的轮廓淌到脖子上，凝成几道暗色的细线。七窍流血的少女站在他面前，被英杰之帜的过载和这场冥界的长跑耗得几乎连膝盖都在发抖，但她的表情比任何他所见过的英雄都要坚毅——那双橘色的瞳孔在血痕中亮着，不是愤怒不是恐惧，是决心。


  立香的指尖冒出来了白光。光极小极安静，像一滴水从指腹上滑落前反照出天地最后一抹微光。她把指尖朝哈迪斯轻轻一送。“裂解术。”哈迪斯的身子在白光的映照下顿时开始了消散——不是爆炸不是粉碎，是从存在的层面上一点一点地被解除，每一片金属碎片的构成法则都被白光抹去。


  “什么？”


  “啊——原来是这个魔术？”哈迪斯在消散前的一瞬间喃喃地开口。他的声音褪去了所有的恨意和愤怒，只剩最底层的疲惫和一份说不清的好奇。“只要理解了事物，就可以让其直接消散的魔术是吗？”他把这个原理在消散的过程中自己讲了出来，尾音还没落地就散在了冥界的空气里。


  “雅典娜给了你我的资料。”


  哈迪斯的身形彻底的消失。与他一起消失的还有刚才怒吼的三头犬——那头冥界的看门猛兽在构成它的法则被解除后连声音都没留下，就像从未存在过一样散进了周围无尽的黑暗之中。


  立香的身形一软。就算是在英杰之帜的加持下，她也无法承受这份力量——裂解术从指尖冒出的一瞬间把她体内仅剩的所有能量都抽干了。她朝着后方倒去，脑子里在这一刻只剩下一个很淡的念头：【会倒在碎石上面吧。】她闭上眼睛等着后背撞上碎石板的冲击。


  她没有撞上碎石。


  她被一双臂弯稳稳地接住了。一只手臂兜着她的背，另一只手垫在她的后脑上。手指偏凉，但稳当得没有一丝颤抖。


  “接住你了，御主。”


  士郎的声音从她上方传来。他的声音不是平时那种清朗的语调——是被砂纸磨过一样的沙哑，还隔着一层面具把声波压得沉闷。立香在他的怀里彻底软了下来，所有的力气从肩膀从膝盖从手指尖全部泄走。“配合的不错，Ruler。”她把这句话贴在士郎胸前说出来，声音闷在他破损的风衣里。


  “嗯？其实并没有什么配合吧。”


  立香猛然锤了他的胸口一下。力道没有控制，但她的手指在砸上去的瞬间就软了，那一拳砸上去的声响比棉被掉在地上还轻。她埋在他怀里开口：“为什么遮住脸？”


  “和你一样。”


  “什么？”


  “丑。”士郎说着。他一只手捧住立香的面庞——手指从她太阳穴的位置滑到脸颊两侧，拇指把她脸上那些已经干涸的暗色血迹一点一点地擦干净。血迹被擦去之后露出了皮肤本来的颜色，他用指腹最后在她眼角下蹭了一下，然后指尖凝聚起来白光。


  “先给你治疗。”


  “啊，我猜到了，你是不是不爱惜自己了。”立香把眼睛睁开一条缝。她从面具的边缘看到士郎被黑炎烧得外翻的皮肤从面具下缘露出来一小截，那个伤口在雨水的刺激下应该很痛，但他用指尖凝聚的白光先给了她。


  “没有。”


  “撒谎。”立香说着。她把头从士郎胸前抬起来，看向天空。头顶上没有星星没有月亮没有战舰的残骸，只有一片被雨水灌满之后显得深不见底的灰色。“结束了。”


  “嗯，伦敦结束了。”士郎把指尖的白光在她的颈侧停了一下然后收回。他把她的手从自己胸前轻轻拿下来，放回到她自己身侧。“很可惜这里彻底变成废墟了，材料资源只能随便搜刮一下了。”'

content: '“莱瓦汀（Lævateinn）。”


  士郎轻描淡写地吐出宝具的真名。血红长剑在这一瞬间亮起——不是火焰从剑身上爆发，是整柄剑自己变成了一道纯粹的红色的光。剑身在士郎挥动的时候自主回转了一大圈，那道红色的光环在空中划出一道弧线。


  【糟了。】


  来不及反应。哈迪斯的人形终端被士郎一剑从中劈开。机器身体的两半朝两侧飞去，飞出去的轨迹上还拖着金属碎片和蓝白色的电火花。剑身缓缓化为灵子从士郎的指尖消散——那些灵子在雨幕中没有被淋散，而是一点一点地往上升，最后消失在天幕的黑色里。


  “不愧是埋葬机关·神赐吗？”哈迪斯的声音从残骸中传来。


  “现在才意识到是不是过于晚了。”士郎看着空无一物的天空，雨水从他的额头上淌下来滑过鼻梁再滴掉。“我好歹也是弑神计划的主力，你不会真觉得我很弱吧。”


  “不过——你该怎么处理冥界的我呢？”哈迪斯笑着。刚才被劈开的两半躯体正从黑暗之中缓缓地拼凑起来，金属残片的边缘在雨中反射着冷光。


  “我们知道需要同时杀死现界的你和冥界的你，你不会觉得智慧女神雅典娜不知道这件事情吧。”士郎淡淡地说着，语调降到最低，像是这件事根本不值得讨论。


  “什——”


  士郎转过头。他朝着哈迪斯猛然扑去，脚下的透明砖块在脚尖蹬开的瞬间碎成光雾。“现在才是真正解决你的时候啊！”他把头往上仰了一度，朝着空无一物的某个方向喊了出去。


  “御主，准备上了！”


  ==


  在淋到冥界之雨的时候，立香的意识顿时消散了。那片雨水的沉重感从头顶一路压到手背再压到脚底，然后意识就像被一只看不见的手从头顶按下去按进了一片不透光的泥沼里。等她再度睁开眼睛的时候，已经处于一片黑暗的混沌之中了。


  这里不是她想象中的冥界。没有宫殿，没有城市，没有那些神话传说里描绘的亡者国度。只有一片残骸，一片战场——脚下的地面是碎石和金属残片搅在一起铺成的，有的残片还带着被某种高温烧灼过的痕迹。空气中没有风，没有声音，只有一种滞涩的安静把一切都裹在里面。


  立香站起来，裙子边缘蹭过一块碎裂的金属板然后滑开了。她看着坐在一切残骸之上的手持着骨杖的冥王。哈迪斯就坐在那里——不是站着的王者姿态，是坐着的，骨杖横搁在膝上，一只手搭在杖头上。他的眼神从高处落下来落在立香身上。


  “果然，只有你一个来了。”


  这里不是她想象中的冥界。没有宫殿没有城墙没有亡者们排着队等候审判的漫长队列。脚下铺开的是碎石和金属残片搅在一起的废土，有些残片上还残留着被高温烧熔过的扭曲痕迹。空气沉重但不冷，没有风声没有水滴声，安静到立香能听见自己耳膜里血液在一下一下地闷响。


  立香和他只有三百米远的距离。她没有犹豫，开始奔跑。脚下的碎石被她踩得往两侧翻溅，每一脚都踩实了再拔起来再往前踩下一脚。


  “不管怎么说，你都是杀不了本王的。”哈迪斯站起身，朝着立香慢慢地走起来。骨杖从他膝上滑下去，杖尾磕在废墟上发出极沉闷的一声钝响，像一块铁掉进了深不见底的洞里。“伊什塔尔在冥界会失去所有的能力，雅典娜完全失去了神力，真祖被我夺取了九成的力量，你的从者刚刚使用了究极的宝具。神赐和吉尔伽美什压根无法进入冥界。”他把这些条件一个一个地往外数，语调冷淡得像在念一份给谁看的统计报告。


  “能够和我对决的只剩你了。”


  哈迪斯的手缓缓一抬。从废墟的阴影里猛然扑出一只猛犬——三头犬的三个脑袋同时张开嘴，朝立香的方向吼出一声撼地的咆哮。立香拔起黑色的手枪，枪身在她掌心里翻了个圈，枪口对准中间那颗头的额头，扣下扳机。安魂的子弹射进三头犬的头骨之后没有从另一侧穿出来——弹头在体内引爆，犬身被炸成的碎片朝后方飞出去。


  “哦？那家伙的礼装？”哈迪斯愣了一下，随后他的表情恢复了原来的一如既往。


  “不愧是埋葬机关·神赐的礼装啊。”他把这句话说得很慢，像是在品一件古董。然后他把手再度缓缓抬起。“不过你到此为止了。我就陪你玩玩吧。”


  立香的面前从土里长出来几颗如同触手一般的树木。树干黑得像焦炭，枝桠从树干上炸开朝她挥来。她从腰间拔出第二把安魂，双枪同时开火，子弹拖着短促的啸音钻入那些枝桠的关节处。内爆弹在树干内部引爆，木屑从弹孔里往外喷，整棵树摇晃了两下然后不甘地倒下。


  【怎么会？】


  哈迪斯看着眼前的橘发少女朝他冲来。她站在这片冥界的废土上没有任何力量加持——伊什塔尔废了，雅典娜废了，她的从者刚刚过载。她没有犹豫没有恐惧，那双橘色的瞳孔在这种黑暗中亮得近乎发烫。


  【她不害怕的吗？】


  “你不害怕吗？”'

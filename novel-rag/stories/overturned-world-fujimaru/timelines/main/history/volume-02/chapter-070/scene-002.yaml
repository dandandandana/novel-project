content: '“简要的来说，你的父亲马里斯比利的目的是漂白人理，然后利用他所创造的新的地球替换掉被漂白的人理。”士郎把这句话说得像是在念一份旧档案，“那个工具就是迦勒底亚斯。”


  空气一瞬间沉静了下来。管制室里只有通风系统的低鸣还在响。立香眉头一挑，她抿了一口红茶，液体的温度从舌尖传到上颚然后忽然烧了一下——


  她把眉头挑得更高了，“哇好烫！”舌头被烫到时她的舌尖抵上了上颚，皱了整张脸嘶了一声。


  众人的目光看向她，玛修差点把茶碟颠翻，希耶尔的脸上不由自主的扬起一些笑意，立香摆了摆手，杯子里剩下的茶在杯壁上荡了一下，“没事没事……”


  奥尔加玛丽没有看立香。她把士郎的话在脑子里重新转了一遍——漂白人理，替换，迦勒底亚斯——这些词像被倒进杯子里却不混在一起的水和油，各浮各的。


  她看向士郎，嘴唇张开又抿住，然后声音从喉咙里被挤了出来，“怎么……怎么可能！我们阿尼姆斯菲亚家世代观测人理，怎么可能做出来这种事情！”她最后几个字的音量把自己都吓了一跳。


  “当然很难置信了。”士郎淡淡地开口。他捏着下巴，手指在下颌线上轻轻蹭了蹭，“他当时来找我们的目的是帮他赢下圣杯战争，他的目的就是用钱建成迦勒底亚斯，迦勒底亚斯的目的正好合乎我们的目的，于是那场圣杯战争埋葬机关派出来了四名成员协助他。”士郎说着瞥了一眼希耶尔。


  士郎继续说着，声音没有任何起伏。“虽然是异变的圣杯战争，而且埋葬机关的一些人各怀鬼胎，但是对于我们来说赢下来算是轻而易举，尤其是在你的父亲召唤了所罗门王的情况下。”


  “但是到最后，你的父亲被一个从者使用了能够吐露真实目的的宝具。在这种情况下，我们知道了你的父亲的目的。”


  立香吹了吹红茶，喝了一口，满意地点了点头。她听着士郎的话，见众人都沉默了她把杯子搁在桌面上，“怎么这么戏剧化？”


  “就是这么戏剧化。”士郎解释道，他有些无奈的笑了笑，“毕竟我们都没有想到迦勒底亚斯的目的是替换人理。”


  “因为这个？”奥尔加玛丽看着士郎，她放在讲台上的手指已经从攥紧变成了轻轻抠着金属边缘的一个细小凸起，“因为我父亲的目的是这个？他才会被法政科带走的？”


  “是。”士郎点了点头。


  立香看了一眼玛修。玛修此时已经呆住了，她的双手还捧着红茶杯但视线焦点从杯沿上滑走了——她看着对面墙上的一个壁灯灯罩，瞳孔落在玻璃面的反光里但好像什么都没在看。


  立香戳了戳玛修：“玛修？”


  “欸，怎么了前辈？”玛修回过神来，她的睫毛在眼睑上扇了两下。


  “你有在听吗？”


  “嗯，当然，只是觉得很难以置信……”玛修把茶杯放下来，茶碟磕上桌面时发出很轻的瓷响。


  “这样啊……”立香把铅笔从笔记本的封脊里抽出来又插回去。铅笔擦过纸页边缘时沙沙响了一声。


  奥尔加玛丽闭上眼睛。她听着立香和玛修的话，眼皮底下是管制室投影仪透过眼睑映进视网膜的那层淡红。然后她睁开眼睛，拳头握紧捶了一下讲台。咚的一声闷响顺着金属台面震到她的小臂上，手掌侧面那片刚被讲台金属硌出的浅红印子被捶下去的力道压得更深了。


  “那，吉尔伽美什，你为什么要让我重新办起来迦勒底。”


  吉尔伽美什看着奥尔加玛丽，她缓缓地开口时每个字的间隙比平时多了半拍。“原因不是显而易见吗？本王预料到了人理的危机，才会找你办起来的。”


  “难道你不知道迦勒底亚斯最后会彻底的替换人理？”奥尔加玛丽的声音开始往上拔。她的眉毛在眼眶上方挤出的竖纹已经变成了两道深色。


  “放轻松，本王对魔术的造诣虽然不深，但是也没那么愚蠢，迦勒底亚斯现在是不会替换人理的。”


  奥尔加玛丽低下头。她银色的刘海从额前垂下来遮住了半张脸。她的手指无意识地往上摸，指尖蹭到了别在衣领上的迦勒底徽章边缘——那个椭圆形的金属徽章边缘已经被磨得微微发亮，触感是凉的，尖角硌在指腹上。


  “原来是这样……我父亲的愿望，其实是个陷阱……我就一直在为这种东西努力吗？”她的声音从喉咙里漫出来时被嘴巴和鼻子的共鸣压得很低。


  达芬奇站在她的身边。她的手指在投影键盘上悬了一拍，刚想开口，奥尔加玛丽就拍了拍自己的脸颊。她看向大家，眼睛周围有一圈还没干的湿痕但眼眶里的泪水已经被拍散了。


  “不管怎么说！我现在是迦勒底的所长，而且，我所想要知道的已经知道了，在现在的情况下，请大家和我一起——为了活下去，为了拯救人理！完成冠位指定！”奥尔加玛丽的声音很大。她把每个字的结尾都咬得很重，重到像是在用音量压下自己还在发抖的手指。'

content: '“师傅，那我准备开始了。“


  吉尔伽美什点头。


  立香转身去桌上拿马克杯，随后她把马克杯端到房间中央的空地上，放在脚前方三十厘米的地板上。


  四年前的事情涌了上来。


  画面的碎片，吉尔伽美什递过来的那颗东西——不是糖果，但大小和糖果差不多。半透明的，内部有细密的纹路，放在掌心里的重量比看起来沉得多。立香把它放进嘴里的那一刻，舌面接触到的不是甜味，是一种凉意，从口腔直坠到胸腔，然后扩散到四肢。之后就什么都不知道了。


  醒来的时候吉尔伽美什坐在旁边，和现在一样，腿搭着腿，脚尖朝天花板。


  “用于辅助魔术施展的礼装。立香，你魔术上的天分不够，但你的天赋弥补了这一点。“


  天分和天赋。两个词，读音相近，含义天差地远。天分是魔术回路的数量和品质，写在血脉里，改不了。天赋是另一回事——理解速度，感官精度，把复杂指令在脑中拆解重组的能力。立香花了不到五秒就拆开了这组文字游戏，吉尔伽美什当时的反应是一秒的停顿，然后说了一句“行，开始上课“。


  一个月。同调、强化、治愈。三种基础魔术。吉尔伽美什从来不做示范，每次都是口述指令，让立香自己摸索。


  摸索的过程不顺——同调的感知范围第一周只覆盖到手掌大小的面积，第二周扩展到了整条手臂的长度，第三周能触及一个房间。


  强化在第四天把一个杯子捏碎了，玻璃碎片扎进右手食指的指肚，血珠从破口处冒出来，吉尔伽美什递了一张纸巾过来。


  治愈是最后学的，也是最慢的——因为治愈需要的魔力量最大，立香的回路在满负荷运转了十二秒之后就会过热，手指发抖，需要休息二十分钟才能再来。


  一个月之后吉尔伽美什宣布基础课程结束。


  “练就行了。到了时候本王自然会教你。“


  然后是三年零七个月的空白。


  立香每天练同调、练强化、偶尔练治愈。像擦地板一样，重复、枯燥、看不到终点。她没有问过“什么时候教新的“，因为吉尔伽美什说了“到了时候“。


  现在就是“到了时候“。


  “把同调和强化展示一遍。“


  吉尔伽美什的指令来了。立香蹲下去，右手掌心朝下覆在马克杯上方。同调启动——杯体的结构信息在三秒内传回大脑，玻璃的分子排列、水的体积、杯底和地板之间的接触面积。参数成型。强化紧跟其后，魔力沿着掌心推进杯壁，玻璃的内部应力分布被重新编排，韧性提升了一个层级。杯壁再次发出那声轻微的“叮“。


  立香把手抬起来，准备切换到治愈系展示。右手的魔力回路正在重新分配负载——


  “留着。学新魔术的时候用。“


  手停在半空中。


  “这样啊。“


  立香站起来。膝盖在蹲了太久之后有点酸，她把重心从左脚换到右脚，晃了一下。


  “这个魔术叫裂解术。“吉尔伽美什开口了。“属于逆行魔术。“


  “逆行魔术……那是一个大类？“


  “对。你都要学。“


  “都？“


  “都。“


  立香消化了两秒。“都“这个字从吉尔伽美什嘴里出来的分量，和从其他人嘴里出来完全不同。黄金之王说“都“的时候，含义是“本王已经决定了，不接受讨价还价“。


  “那就开始吧师傅。练完我还得去看玛修，达芬奇说她今天已经能下床了。“


  立香伸出右手。掌心朝下，手指微微张开，悬在马克杯上方二十厘米的位置。


  “第一步。“吉尔伽美什的腿从床沿放下来，两只脚踩在地板上。她的上半身前倾了五度左右，手肘撑在膝盖上。“刚才同调过了，杯子的结构你脑子里有。把那个结构调出来。“


  立香闭上了眼。杯子的结构在脑中展开——圆柱形的杯壁、弧形的底面、水在杯底三分之一处的液面分界线。每一条信息都是同调时采集的数据，精确到分子层级。


  “有了。“


  “第二步。把魔力汇到指尖。“


  魔力沿着手臂的回路推进，从肩膀到肘弯到手腕到指根，最后汇聚在五根手指的尖端。指尖的温度上升了一截，皮肤底下的毛细血管因为魔力的挤压微微胀痛。


  “老样子，通过礼装驱动。“


  立香呼了一口气。胸腔深处那颗四年前吞下去的东西，礼装在魔力的激活下产生了反馈。那种反馈不是一种持续的、稳定的振动感，从胸骨后方向外辐射，和心脏的跳动频率错开了半拍，两组节奏叠在一起形成了一种不规则的共振。


  “收到。“


  “第三步。“


  吉尔伽美什的上半身又前倾了几度。


  “脑子里那个杯子——让它碎。碎成碎片，碎片再碎成碎片。不要停。让碎裂一直进行下去，没有终点。“


  立香的脑中，马克杯的影像开始分裂。


  杯壁沿着应力最薄弱的纹路炸开，玻璃碎成了七块。七块碎片各自再裂，变成四十多块。四十多块继续碎，数量级跳到了三百以上。三百以上的碎片继续向下塌缩——


  脑中的运算量骤然翻涌。'

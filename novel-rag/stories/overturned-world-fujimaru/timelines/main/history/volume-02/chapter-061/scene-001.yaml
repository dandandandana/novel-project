content: '玛修的身形被黑暗吞进去之后，身后那扇铁灰色的门板合上了。


  没有预想中的刑具。没有枷锁，没有绞架，没有被火光映成暗红色的墙壁。


  这里只是一个空旷的房间——空旷到自己的呼吸声能被墙壁弹回来好几次。然后在玛修整个人真的进入之后，头顶的白炽灯一排一排地亮了起来。光很冷，冷得能照出空气里浮动的每一粒微尘。房间是灰白色墙壁砌成的巨大矩形，没有任何窗。


  她的面前摆着一个黑匣子。巨大，沉默，形状像一面盾牌。这个东西厚重得像是从地底深处被抬出来的，黑色的表面没有任何纹饰，只有光点在哑光的面上滑过去的时候露出一点金属质地的反光。


  加拉哈德。


  玛修站在那里，瞳孔直直地盯着黑匣子的弧线。她想起来了——自己最一开始握住的武装就是那个人的盾牌。那个她从未真正见过的英灵，那个在爆炸里用灵基协助她痊愈的高洁的骑士。


  “玛修·基列莱特。”


  声音不知道从哪个方向来的。像是从墙壁里渗出来，又像是从她自己的呼吸里自己长出来的。语调是吟唱式的——一字一顿，每一个音节都拖着一道尾音，黏在空气里久久不散。


  “你是因为亚从者计划，诞生的实验品。”


  玛修不由自主地往前走了一步。她的紫色瞳孔睁大了，嘴唇张开想说“不对”，喉咙里却只吐出一个极轻的气音。


  画面在她的眼前浮现出来。像是有人把记忆从她脑子里抽出去之后摊开在空气里让她看——那是她自己，躺在手术台上的她自己。白色的灯光打在她闭着的眼皮上，好几双手在她周围移动。然后一个高瘦男人的背影闪了过去，白大褂的衣角被无影灯照得曝光过度。


  “你是那个计划里——唯一的成功品。”


  “你的体内，是英灵加拉哈德的灵基。”声音淌过来，糊在她的耳膜上。


  玛修的呼吸停了一拍。她还没有开口，声音已经替她说完了后半句——用一种温和得近乎残忍的语调。“你——”声音顿了一顿，然后那个词轻轻地落下来。


  “你辜负了他。”


  整个房间的白炽灯同时暗了半度。


  “玛修·基列莱特，在特异点F——”画面骤然切换，柳洞寺的夜空劈开了一道紫色的极光。“为了保护藤丸立香。”她看见了自己举起盾牌的那个姿势，看见了那道光柱从盾面炸出去的瞬间。“你让加拉哈德的灵基消散了。”声音的吟唱开始变快，音节一个叠着一个。“破碎了。”


  “你是不是忘了?“声音的语气没有愤怒。它只是在陈述——但是每一个字都扎进她的胃里。玛修的手指在黑匣子的冷光里轻微发着抖。“你是不是忘了，是谁在爆炸里救了你的命。”


  “如果不是加拉哈德——”


  “你，早就死了。”


  她闭上了眼睛。眼睑后面的黑暗中浮现出一片爆炸的火光。


  “你辜负了他的信任。”声音继续淌着，每个字都很轻，轻到像是在心疼她。“你应该用这个灵基去拯救人理的，玛修·基列莱特。”


  “不对。”玛修张开眼睛。她的声音不大——嘴唇还因为刚才的无声沉默黏在一起，发出来的音头有点哑。“不对不对。”


  “那个御主有什么意义吗？”


  “前辈？”玛修的身子僵了。


  “你完全可以自己活下去。”声音继续吟唱，语调平滑得让人发冷。画面里浮现出她站在迦勒底走廊的独自背影。然后话锋一转。“回到这里，身为亚从者玛修·基列莱特继续战斗。”那个独自的背影在画面上越拉越长。“你完全可以不被当做一个跟屁虫一样——被保护在那个Ruler身后。”


  “不对……不对。”玛修的声音开始碎。


  “你还在否定吗？玛修·基列莱特？”


  周遭的环境骤然变了。房间消失了。她发现自己站在一个洁白的病房里——墙壁白得发蓝，窗帘被拉得很开，外头的阳光打在她的手臂上暖得有些失真。有些不适应这里的环境，她轻轻地伸出手挡住这份光亮。然后一个男人的声音从她身后响了起来。“玛修？要做今天的检查咯。”那个声音太熟悉了。熟悉到她的心口猛地一抽。


  玛修转过身去。她看清了他的脸。蓬松的浅棕色头发，白大褂口袋里塞着一支笔和一个没吃完的能量棒包装纸。那张脸上带着所有主治医师都会有的温和耐心，但多了一点别的东西——他的眼眶有些发青，下巴上有没刮干净的胡茬。她的喉咙微微张开，嘴唇动了动。“罗曼医生？”


  “啊，是我，你的身体还需要检查，身为你的主治医师，我要帮你检查一下。”罗曼的声音一如往常地絮絮叨叨。


  “你看吧，他是因为你是亚从者才来的。”


  “不……”玛修伸出手想要碰他。手指穿过了白大褂的袖子。


  周遭的环境如同风一样加速。病房、走廊、检查室、培养槽——一切像是被抽进一个巨大的漩涡，画面在她眼前飞速滑过，快到她只能在每一帧停下来之前抓住一个残影。'

content: '玛修趴在地上没有动。她甚至能感觉到焦土表面的余温隔着黑色连裤袜传到膝盖上。天空是黑的——不是夜晚的黑，是那种连星光都透不过来的没有底层的黑。


  “而且。没有任何意义了。”声音的吟唱融进了冷风里。“因为你什么也做不到了。你能做到什么？现状就是你们的世界已经不知为何被毁灭了，一丝一毫都不剩下了。你为之奋斗的东西已经不在了，你现在在守护什么？”风速突然加大，焦黑的炭粒打在玛修的脸颊上。声音开始重复——一遍，两遍，三遍。


  “放弃吧，放弃吧！你该放弃了！放弃啊！”


  一阵白风吹过。


  焦黑的大地突然被撕开了一道裂缝。裂缝里涌出来的是翠绿的青草。青草在风中摇晃，草尖上还凝着露珠。一座巍峨的白色城堡从地平线上缓缓升起来，巍峨到仰起头都看不到塔楼的顶端。孤悬的月亮挂在城堡上方，月光柔得像是手指拂过水面。玛修盯着它看了很久。她的手指仍然摁在焦黑的土里，土粒嵌在指缝间。


  “放弃吧。你放弃了——你就无需再面对你的罪孽。”声音变得很亲切。那种亲切比质问更让人不寒而栗。


  “放弃吧，你放弃了就可以永远呆在这里。放弃吧，你不必再去看那毫无希望的世界。”画面里的青草在风中摇摆，像是在招手。“放弃吧，你就可以完全无视你的过去。放弃吧——这里已经没有明天了。”


  然后一切场景被撤回了。城堡、月亮，全都被一把无形的剪刀剪掉了。重新铺在她眼前的，是那片黑到看不到丝毫亮光的天空和焦黑的大地。玛修趴在地上，脸颊贴着被烧焦的土面。她久久没有说话——久到整个天空缓缓由黑一点一点被漂白，从没有底层的黑褪成了惨白色。她的嘴唇上沾着一点焦土的气味。


  “我的职责，协助迦勒底守护人理。”她开口了。声音从贴在地上的唇缝里漏出来，被焦土吸掉了一半。“也许我做的不够好。”她的手指在焦土上慢慢蜷起来。“也许我没能救下其他人。”


  倒在地上的少女缓缓地蠕动起来。肘部撑着地面，手臂在不知是冷还是快要散架的颤抖里一点一点往上抬。她喘了两口气，每一次呼吸都把焦土的气味压进肺里。然后她撑起了一只手臂——单膝跪着抬起头，紫色的瞳孔对着那片惨白到没有任何天光的天空。


  “但是，这不是我停止前进的理由。”她的声音沙哑但字字清晰。又喘了两口气，肩膀在每一次呼吸里上下耸动。“放弃一切——然后独自待在那梦幻般的牢笼吗？”她的嗓音突然拔高了半个度，断裂的气音从喉咙口崩出来。“我怎么——我怎么都不会这么做的！”


  为了不让灾难再度发生。她在心里说给自己听。


  “我是迦勒底的从者！”她单膝跪在焦黑的大地上喊出来。


  奥尔加玛丽认真且经常带着不满的面庞从她眼前闪过去，迦勒底员工的面孔闪过——那些在餐厅里、在走廊上、在控制室里来来往往的普通人。达芬奇和善的目光——那双总是笑眯眯的眼睛隔着画布看着她。


  既然做出来了选择。“我——不会停下。”玛修撑起自己的身子，站成了半弓着的姿势。膝盖还在发抖，但她已经不再让自己倒下去了。“之前的事情会一直拷问我——一直。”


  言峰士郎几乎从未变过的古月无波的面庞从她眼前闪过——那个红发的男人从来不会说安慰的话，只会把最残酷的真相摊开在她面前然后看着她自己决定。


  想要守护所有人。立香在某个深夜蹲在走廊上哭过的脸从她记忆里浮出来。


  “就算是一无所有的未来，就算没有明天，就算是破灭的现状——我也想要，我也想要守护大家！”玛修握紧拳头。她彻底的、完完全全地站了起来。两条腿不再抖了。她站在这片被烧焦的大地上，站得比刚才跪着的时候还要直。


  “我不认可你说的话！”


  橘色头发的少女在玛修面前清晰的显现出来。那个画面真实到能触摸。藤丸立香在柳洞寺的月光下站在她前面，头发被夜风吹得乱七八糟，手里握着令咒用尽全力下达最后的指令。那个表情——她在逞强，她在带着笑，她把所有害怕压在最底下只把最硬的那部分露出来。


  “如果我连我身边的人都无法守护，那谈何守护所有人！”玛修的拳头攥得紧紧的。


  “我为了藤丸立香而战！”


  “我是前辈的从者——我的名字是，玛修·基列莱特！”她喊出了自己的名字。“我要为前辈夺回明天！”


  噼啪。玻璃破碎的声音在头顶炸开。裂纹从半空中某个看不见的点开始往四面八方蔓延，是那片惨白的天幕，是所有的罪疚和质问和伊甸园。被裂纹布满了之后，整片天空碎掉了。暖流流过玛修的身子，从骨头缝里涌出来的，从灵基深处翻涌上来的。然后又凝结了起来。某种沉甸甸的、真实的、属于她自己的东西重新在这副身体里扎了根。'

content: '因为她知道，如果自己继续追问，那个笑容迟早会裂开来。而裂开之后的东西，她们两个可能都承受不起。


  所以她不问。


  希耶尔也不说。


  啪。


  灯。第三次。


  立香已经不记得自己是什么时候伸出手的了。手指刚碰到床头柜抽屉的把手——


  笃。


  笃笃。


  声音从房门的方向传来。不急促，不响亮，每一下都叩得很清楚，节奏缓慢，特意控制过力度的，怕吵醒走廊里其他沉睡的人，却又确保屋内的人一定能听见。


  立香的手停在半空。


  她从床上下来，赤脚踩在地板上。合金地板被室温烘得不算冰，但凉意还是从脚底渗了上来。她走到门前，按下开关。


  门无声地滑开。


  走廊里的昏黄底光从外面透进来，在门框处勾出一个高大的剪影。


  是Ruler。


  他站在门口，姿态松松垮垮的，一只手插在裤袋里，另一只手端着什么东西。立香首先注意到的是他没有穿那身白色的风衣。那件衣服在上午的会议室里给他撑出了一副难以接近的架势——肩线挺括，衣摆利落，加上那张冷硬的娃娃脸和一八七的身高，活脱脱一个不好惹的上位者。


  现在那些东西全脱掉了。黑白配色的休闲长袖，领口松开一颗扣子，露出一截锁骨线。裤子是同色系的宽松款，脚上踩着一双看起来像从迦勒底公共物资箱里随便翻出来的拖鞋。整个人松弛下来以后，那张脸上的老成感淡了大半，赤铜色的短发没有打理，有几缕翘在耳朵上方。


  看起来年轻了好几岁。


  “吃吗？“


  他开口。


  立香这才把视线从他的脸上移开，落到他另一只手端着的盘子上。白色的瓷盘，里面是一块体积不小的蛋糕。蛋糕体是浅黄色的海绵质地，表面铺着一层奶油，奶油被抹成了不太规整的波浪形，是明显手工操作的、带有个人手感的痕迹。奶油上挤了几团颜色不同的点缀，粉的、淡蓝的、浅绿的，零零散散地落在上面，像是有人故意要把所有能找到的食用色素都用上。


  那么大一块蛋糕，那么明显的颜色，她刚才开门的时候居然完全没注意到。


  “为什么会想着做这个？“


  立香抬起头，看着他。


  “因为你现在需要。“Ruler回答得很快，快到好像这个问题的答案在她开门之前就已经准备好了。琥珀色的眼睛在走廊的昏光里显得比白天更深，目光落在立香脸上，带着一种不急不缓的稳定感。“怎么？在房间吃还是去餐厅？“


  “等等。“立香抱起手臂，后背靠上门框。“为什么你会觉得我需要？“


  “因为你心情不好。“


  他说这句话的时候语气特别平，平到像在说今天天气不错。


  “没事，不想吃我放你冰箱里。“


  立香看着他。


  她穿着睡衣，头发半干不湿地搭在肩膀上，脸上没有任何妆容，眼圈下面大概率挂着没来得及遮掩的乌青。凌晨一点，被人堵在宿舍门口，面前站着一个端着彩色蛋糕的一米八七的男人，说“因为你心情不好“。


  这个画面怎么想都很荒诞。


  但她生不出气来。


  “放餐厅，到时候一起吃。“她说。


  “拒绝。“Ruler的回答同样不带一秒停顿。“这是我给你做的。至少你要吃第一口。“


  立香看着他的眼睛。那双琥珀色的眼睛回看着她，里面没有怜悯，没有居高临下的关怀，也没有“我懂你的痛苦“那种令人窒息的共情表演。只有一种很简单的东西。


  他做了蛋糕。他觉得她需要。他端过来了。


  就这样。


  立香忽然意识到，不管她说什么，面前这个人都能接下去。她把蛋糕推去餐厅，他会说拒绝。她说不饿，他会放冰箱。她说你凭什么管我，他大概会耸耸肩说“因为我是你的从者“。每一条退路都被他用最柔软的方式堵得严严实实，不带任何攻击性，但也不给半分退让的余地。


  这种感觉她不陌生。


  在冬木的那几天里，和那个言峰士郎吵架的时候，每当话题触及他的自毁倾向，那个男人也是这样。你怒你的，他接他的。你越用力推，他越轻描淡写地化解。太极。活生生的太极。


  “言峰士郎。“立香的声音冷下来。“你是不是去中国进修过打太极。“


  Ruler眨了一下眼，随后嘴角往上弯了弯。不是笑，是比笑更轻的东西——一个游刃有余的弧度，带着被戳中了什么好笑的开关之后的条件反射。


  “哟？你对我这么了解？“他的声调微微上扬，尾音拖出一点点促狭的味道。“那还不请你的从者进去？“


  立香盯着他看了三秒。


  然后侧身让开了门口的位置。


  “吃完你就得离开。“


  “遵命，我的御主。“


  Ruler说着，端着盘子迈步走了进来。经过她身边的时候，那股蛋糕的甜香从盘面上漫过来，黄油和香草混在一起的温热气味，在充斥着空调气味的房间里显得突兀又柔和。他的背影消失在房间内侧，随后响起了盘子被放在桌面上的细微声响。'

content: '“要来了！”玛修咬紧牙关。她的牙齿在口腔里对撞了一下发出细微的咯嚓声。然后她猛地敲了一下盾牌——当的一声，盾面上的蓝色纹路全数点亮了。她把双手扣进斧柄，手背上的青筋从板甲的缝隙里浮出来。魔力像是被一台抽水泵从她灵核深处一整缸一整缸地往外抽，沿着她的手臂灌进盾斧里面。斧刃上的红光从脉冲式变成了持续式，白色的蒸汽炸开来把她整个人都罩了进去。


  她把巨斧猛地往后一甩。斧身在她身后拖出来的银光拉成一道长长的新月。


  Alterego缓缓举起EA。剑身上那些反向旋转的圆柱体加速了——互相摩擦的声音从嗡嗡嗡变成了尖锐的啸叫。他把剑尖指向天空，然后剑尖稍稍偏下来对准了玛修。


  “别托大哦，小姑娘。虽然EA并不如你的武装。”


  他的语气淡得像在说今天天气。


  然后他轻轻一挥。


  天空上骤然掀起一道巨大的魔力光柱。光柱从天顶砸下来，砸在EA的剑尖上，然后从剑尖上炸开来朝四面八方扩散。空气中被撕裂出一条肉眼可见的隙缝，隙缝两侧的空气往回弹的一瞬间发出了沉闷的轰响。“开天辟地乖离之星。”


  “超过载解放斩！”


  玛修把巨斧从身后猛地甩了出来。那柄斧子在脱手的一瞬间加速到了一个肉眼只能看见一道环形银光轨迹的程度，然后整个斧身正面撞上了EA射出的暗色光柱。


  撞击的瞬间没有声音。因为声音赶不上光的碎裂速度。暗色的EA光柱从中间被这一斧劈开——光柱被撕成两半，往左右两侧飞散开来，碎片在半空中炸成一团一团的黑紫色火球。余波如潮水从劈开的裂缝里冲出去，裹挟着碎石和空气被压缩成的白雾，直直地朝Alterego压过去。


  Alterego被这道余波正面撞上。他的身体被整个掀起来，在半空中转了几圈才摔回地面，石板被他的身体砸碎了一大片，碎渣飞得老高。


  玛修撑着斧柄喘着粗气。她的视线朝伦敦的方向扫过去。整个街区的楼面被这一击的余波刮过，砖石被掀掉了一层皮露出底下的结构。“成功了！”她把这句话从被白雾呛到的嗓子推出来的时候，胸口在剧烈地起伏。


  玛修勉强撑起身子。手肘摁在碎裂的石板上硌得发疼，她把一口气从喉咙深处推上来然后撑住地面坐直。膝盖弯起来，另一只手撑着斧柄，抬起头——看见Alterego的脸离她不到两步。那张被碎石和血液包裹的脸上忽然浮现出一个很淡的微笑。


  “你这种从者，如果沾上雨水，可就会出大问题哦~”


  玛修顺着他的手指抬起头来。整个天空被剪了一道口子——不是云的裂缝，是天幕本身被撕开了一道漆黑的裂隙。裂缝的边缘翻卷着暗紫色的光弧，光芒像脉搏一样一跳一跳地沿着裂缝蔓延。然后从那道裂缝里涌出来的水开始往下倒，不是常规的雨滴的形态，是一整道暗沉的灰黑色的厚重水柱砸向地面，砸在石板地上溅起来的不是晶莹的水花而是一团团沉闷的灰色水雾。


  “这是冥界之河。”Alterego把这句话说得悠悠的。他的声音在暴雨砸地的噪音里只是一层很薄的膜，随时都要被淹没。“再告诉你们一个信息吧——哈迪斯不止有人身。”


  他的琥珀色瞳孔从被血糊住的睫毛间看着她。


  “他还有机神终端和机神之躯。”'

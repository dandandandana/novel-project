content: '她抬起头来。“为什么你放心玛修单独对付Alterego？”


  士郎想了想。他开口的时候语调没有升高也没有压低，像在说一件早就确定了的事。“他的目标至始至终都不是迦勒底。”


  “什？”立香的肩膀猛地绷了一下。她的脑海里闪过特异点F的画面，脚下的废墟碎石的触感从回忆里弹了出来。“怎么可能？说谎话也要……过一下脑子？藤丸立香差点就死在了那里！”


  士郎顿了顿。他把文件夹从胳膊底下抽出来搁在旁边的桌子上，纸页磕在桌面上发出很轻的一声闷响。“我没有替他辩解的意思。我也没有为他辩解的理由。”


  然后他把手放在了立香的头上。手掌落下去的时候很轻很稳，手心的温度隔着头发暖到头皮顶上——不是摸不是拍，就是搁在那里然后指头在她头发之间轻轻地收拢了一下。


  揉了揉。


  立香愣了整整一拍。她的脑子在这个动作发生的一秒钟内是空白的——她完全无法理解为什么自己的从者会对自己的头做这种事情。然后她猛地抬起手把他的手从自己的头顶上扒拉下来，五根手指捉在他的手腕上用力往旁边一甩。


  “你这个家伙在干嘛？！”她的声音拔高了半个调，橘色瞳孔在走廊昏暗的光线里亮得能看见一圈虹膜的纹路。“喂喂，我可不是小孩子！”


  “我大你十二岁左右。”士郎的嘴角往上扯了一下，那是一口气没憋住的浅笑。“你其实叫我叔叔都没有问题的。”


  “想都别想——你就是我的从者！”立香抿紧了嘴唇。然后她嘴唇松开了。接着那些话从她的牙关间滚了出来，刚出口的瞬间她就后悔了。


  “你经常这样做吗？对其他的女性？”


  士郎停了一拍。他的琥珀色瞳孔没有闪躲，看着她脸上的表情从上到下认真地扫了一遍。“没有。你是我的御主。”


  轰隆。


  窗外炸开一声沉闷的重响，不是雷劈在近处，是天顶被一整块一整块地推着碾过去。走廊的窗框在空气中轻轻震了一下，玻璃片在窗槽里抖出细碎的金属摩擦声。立香把头转过去，石皮窗框外面灰色天幕已经压下来——然后雨就下来了。不是一滴两滴试探性的落，是整个天空翻了个面往下倒，雨水砸在窗玻璃上啪啪啪地连成一片。


  “下雨了……这样的暴雨吗？”立香站到窗前往外看了一眼。


  “御主。”


  “怎么了？”


  “我们估计要想办法去解决哈迪斯和朱月了。”士郎走到她旁边，琥珀色的眼睛看着窗外，雨帘几乎糊掉了窗框外面一切轮廓。


  立香转头看着士郎。“什么意思？”


  “这是——冥河倒灌。”


  玛修和Alterego交手的次数早已不是一手能数过来的。第三十回合。她的呼吸开始变重。盾斧每一记劈出去都被他偏开——不是正面格挡，是用天丛云的剑脊贴着斧面滑过去一拨一挑，那种巧劲卸力的手法从一开始的生涩对峙到现在的毫不费力，她看得再清楚不过了。这个家伙——就像是一台在用她的攻击训练自己的机器。她每换一种攻击路线他就适应一种，然后第二次就封死那条路线。


  玛修一脚往前踏出，靴底碾碎了一块石板。她的右膝盖猛地抬起来，一脚踹在斧头的斧身上。整个巨斧发出一声狰狞的机械咆哮，斧刃上的锯齿开始高速旋转，银光被离心力甩成一圈刺眼的白环。她握紧斧柄——双手十根手指全部扣进防滑纹路里——然后把这团旋转的银光朝Alterego迎面劈了过去。


  那柄巨斧砸在地上。


  整个石板地面炸开来。裂缝从斧刃的着弹点朝四面八方崩出去，碎石被震得跳离地面几十寸高，然后在半空中被旋转斧刃的余劲带起来甩成一阵石雨。玛修没有停顿，她借着这次劈砍的惯性把整个身体拧过来，斧刃在地面上拖出一道深深的沟槽然后猛地横斩出去。


  Alterego回身一斩。天丛云划出来的弧光在昏暗里闪了一瞬时，剑尖在斧面的旋转区域边缘精准地蹭过，然后他整个人往后跳开了。靴底在空中滑过一段距离才重新落回地上。他看着玛修手中那个武装。


  盾斧的表面正在往外冒着红光——不是均匀的柔光，是一阵一阵脉冲式的红芒，伴随着白色的蒸汽从缝隙里喷出来。每一次喷气的间隙越来越短，机械咬合的声音从盾槽里漏出来已经不像齿轮在转动了，像在碾碎。


  过载了。


  Alterego朝后退去。不是被逼退——是他自己在拉开距离。他的脚跟在石板上轻轻点着往后退，右手的天丛云垂在身侧，左手的五指在空气中张开。然后魔术纹路从他的掌心里炸开来，三道光柱在他手中旋转成型的轨迹能把空气烤得扭曲。


  那是一柄剑。三个黑红色的圆柱体彼此嵌合在一起，每一截都在反向旋转，速度不同方向不同但拼在一起的时候发出一种极度压抑的嗡嗡低鸣。魔力从剑身上溢出来把周遭的空气压得往四周退，整个埋葬机关前庭的风都停了。'

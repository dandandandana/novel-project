content: '她触到玛修的指尖是凉的——不是被冷空气冰凉的，是紧张让血液都缩回了心脏。她把五根手指穿过玛修的指间，紧紧握住。士郎走到一面石墙前面，手掌摁上去，浅蓝色的魔术回路在墙面上亮了起来，沿着砖缝一路蔓延成一道复杂的认证纹章。几秒之后，石墙从中间裂开，往两边滑去，露出一条往下延伸的灰色石阶梯。空气从通道里飘出来，带着一股陈旧的霉味和铁锈味。“玛修。”


  卸下面甲的玛修把那张清秀可人的脸露了出来。她疑惑地看向御主，紫色的瞳孔在昏暗的地下室里显得比平时更深了一点。“嗯？前辈？”


  “别怕，玛修。”立香捏了捏她的手。“走吧。”


  玛修看着立香，张了张嘴没说出什么。嘴唇张开合拢，来回了好几次。最终她扬起一个微笑——嘴角往上弯的弧度很轻，“好的！前辈！”


  士郎率先一步迈进了埋葬机关的内部。走廊很窄，墙壁是整块整块未经装饰的粗砺石砖，每隔很远才有一盏白得发冷的小灯嵌在墙壁上。没有多余的房间，没有摆放物，没有任何人——简洁到了让人感觉自己走进的是某个正在运转的机器内部。“处刑处在最深处，伦敦的这个规模不算大。”他一直在前面带路，步伐不算快但左拐右拐地穿过一道又一道狭窄的过道，显然对这里的构造烂熟于心。


  “你经常来这里？”立香紧跟在后面，靴子踩在石板上和士郎的脚步声叠在一起。


  “不经常。”士郎推开一道低矮的铁门等着众人通过。“伦敦的埋葬机关和计时塔靠得比较近，我一般避免来伦敦——碰见的人太多。”他话说到一半顿了顿，手指在风衣的口袋边缘轻轻敲了几下，像是在掂量下一句话要不要说。“而且这里的设施不仅不齐——”


  “纳鲁巴列克在这里。”爱尔奎特插嘴了。她的红眸在昏暗的灯光下眯了起来，语调里掺进了一种能听出来的排斥。“那个女疯子你不是一直看不惯吗？”


  “是。她太疯了。”士郎的语气冷淡了几分，琥珀色的瞳孔里闪过一丝不加掩饰的厌恶。“她不按常理出牌的程度让人恶心。”


  “纳鲁巴列克？”立香把步伐加快了两步，和士郎走到并排。“她是谁？”


  “埋葬机关首席——一个女疯子。”士郎的声音没有任何修饰，像是在背诵一段档案里的犯罪记录。“她把人当作她的所有物，是她一个人享乐的工具。她对于那些死徒和犯人的态度极度明确。”


  “什么？”


  “折磨。”士郎侧过头看了立香一眼，琥珀色的瞳孔在走廊的白光灯下颜色显得更淡了。他的语调很冷静，冷静得让这两个字从嘴里飘出来的时候不像在描述一个人的行为而是在陈述某种物理定律。“她认为这样让她特别开心——开心到可以为此设计好几年，只为了最后那一刻。”


  立香的脚步顿了一下。“……这难道不是纯粹的脑子有病吗？！”


  “是的。”士郎的脚步没有停。


  立香瞪了他一眼。“你也不遑多让。”


  士郎没有反驳。他把手从风衣口袋里抽出来，整个人回过头来看了一眼立香，然后用一种她熟悉的懒洋洋的语气开口。“那很抱歉了御主——是‘我的荣幸御主’还是‘爱莫能助御主’你自己选一个。”


  “我两个都不想选。”立香从他身边走过去。


  士郎看着她走过去的背影，嘴角动了一下。是他知道自己理亏的时候才会露出来的认输的脸。雅典娜从他身边经过的时候蓝色的瞳孔和他对上了一瞬，然后沉默地移开。爱尔奎特从士郎另一边挤过去，用红眸瞪了他一眼。


  终于走到了一个偏僻的房间面前。这扇门和之前经过的所有门都不一样——铁灰色的门板厚重得像是能吞掉所有声音，门面上没有任何装饰，只有几道横向的焊接痕迹。走到这里的时候，爱尔奎特忽然停下了脚步。


  她的红眸睁大了。整个人像是被钉在原地一般顿住了，胸口的呼吸都停了一拍。“怎么可能——”


  “这里就是处刑处。”士郎看了一眼爱尔奎特，然后把目光转回到立香和玛修身上。他看向玛修的时候琥珀色的瞳孔暗了下来，那个刚才和立香拌嘴时还会露出一丝认输的脸此刻只剩下了郑重。“玛修。我不推荐——”


  “前辈。”玛修打断了言峰士郎的话。她的声音很轻，但落在这条窄窄的走廊里每个字都清清晰晰。紫色的瞳孔直直地看着士郎的眼睛，没有躲闪，没有犹豫，没有任何需要解释的请求。


  言峰士郎看着她。看了好几秒。然后他点了点头。他转过身去把手掌摁在门板上，浅蓝色的魔术纹路从掌心蔓延开来缠满了整个门面，几秒后一声沉闷的喀响从门框深处传了出来。士郎推开那扇门之后直接往后退了好几步，站到了立香的身边。


  一个长方形的黑暗。没有灯光，没有声音，冷空气从里面缓缓涌出来。'

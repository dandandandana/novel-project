content: '“不断给埋葬机关的代行者创造击杀Archer的机会，最后的绝杀，其实是九头蛇毒吧？很有想法。”尼禄轻笑着，话锋一转，“不过，很可惜。”


  他的眼睛骤然瞪大，语气变得冰冷而狂妄：


  “你们的反抗，是毫无作用的。”


  话音刚落，数道黑影从他的大衣下窜出，几只面目狰狞的魔兽张着血盆大口，朝着二人猛扑而来。


  “尼禄……不对，是Caster的御主！”立香咬牙，握紧了背后的双剑。


  【藤丸立香……你现在......】


  立香深吸一口气，压下心底的恐惧，眼神渐渐变得坚定。


  “礼装，SET！”


  ==


  希腊的魔女美狄亚，正静坐在柳洞寺深处观测着教会组的动向，眼底泛着兴味的光，仿佛在欣赏一出愈演愈烈的戏剧。


  “还不放弃吗？”她轻笑一声，语气里裹着几分愉悦，“真是令人愉悦啊，那些孩子们垂死挣扎的模样……”


  “咔哒——”


  清脆的树枝断裂声突然响起，打破了庭院的死寂。


  Caster的表情骤然凝重，眉头紧蹙——是谁能轻易破除她的结界，避开Berserker的眼线，悄无声息地闯入柳洞寺？念头刚落，内院的木门“吱呀”一声被推开，她刚要抬手发动魔术，一柄裹着鞘的太刀已冰凉地架在了她的脖颈上。


  “神代的魔术师，美狄亚，对吧？”


  眼前的红发男人，有着茶色的眼眸，身着白风衣与黑红色内甲，声音平静得没有一丝波澜。


  “你……”美狄亚盯着那张脸，瞳孔微微收缩——这分明和Saber的御主一模一样，可眼前男人身上散发出的压迫感，却让她忍不住浑身战栗。


  “你……”


  “你的魔术，对我没用。”男人语气依旧平淡，却带着不容置疑的威压，“别想着用Ruler Breaker偷袭，也别想用令咒召唤从者——我随时能砍下你的脑袋。”


  面对这份直白的威胁，Caster反而松了口气。


  【只有无能之辈，才会靠威胁来彰显底气。】


  “投影。”


  男人轻吐出两个字，掌心瞬间凝聚出一柄紫色闪电状的短剑——那是美狄亚再熟悉不过的模样。


  “投影？不对......为什么……你身上会有那三位神明的气息？”美狄亚的声音带着不易察觉的颤抖，比起男人毫不掩饰的杀意，他体内那股陌生的神明气息，更让她心底发寒。


  美狄亚此时此刻甚至不敢发动魔术，她清楚的感知到就算这个刀没有出鞘也能够直接击杀自己


  【大概是来威胁我要我帮他做事……】


  “我还以为你会跑呢。”男人语气平淡，将短剑轻轻刺入美狄亚的胸口，目光扫过自己右手浮现出的三道剑形令咒，没有丝毫停顿，直接下令：


  “以令咒之名，命令你——Caster，一小时内，禁止使用任何宝具、魔术，以及你手中的令咒！”


  令咒中蕴含的庞大魔力，化作一道不可违抗的命令，瞬间注入Caster体内。


  “以第二道令咒之名，命令你——用你剩余的令咒，为Archer补满十二试炼。”


  美狄亚的表情扭曲着，被迫举起手，声音艰涩地念道：


  “以令咒之名，为Archer——补充十二试炼！”


  在美狄亚完成指令的瞬间，男人动用了第三道令咒。


  “以第三道令咒之名，命令你——Caster，自裁，从这个世界彻底消失。”


  下达完命令，男人毫不犹豫地转身，径直朝着门外走去。


  下一秒，耀眼的光芒从柳洞寺内轰然爆发，照亮了整片夜空。'

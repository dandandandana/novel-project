content: '士郎看着她，眼神里多了几分了然，轻声问道：“死不掉……你是代行者弓，希耶尔？”


  “哦？倒忘了自我介绍。”希耶尔放下茶杯，淡淡开口，“迦勒底战斗顾问，希耶尔。”


  “迦勒底……”士郎若有所思地点点头，随即又问，“那么，该怎么解决这名archer？”


  希耶尔没有回答他的问题，反而话锋一转，目光紧紧盯着士郎，轻声问道：“言峰士郎，我问你个事——吉尔伽美什呢？”


  “欸？”立香和玛修同时愣住，显然没料到希耶尔会突然问起这个。


  Saber和伊莉雅也纷纷转头看向希耶尔，脸上满是惊讶。


  士郎的脸上依旧没什么表情，只是语气里藏着一丝不易察觉的沉郁，轻声开口道：“吉尔茜她……在berserker和archer的围攻下，退场了。”


  “这样吗……那确实很麻烦了。”希耶尔沉声开口道。


  “我其实已经和那名Archer交过手了。”希耶尔指尖轻蹭袖口，语气平淡，“我的武艺完全不及他，他身上那件皮革铠甲，还能无视我大部分攻击。”


  “那是「神兽之裘」。”伊莉雅连忙接过话头，语气笃定地补充道。


  “不过我还是成功杀了他一次。”希耶尔话锋一转，眼底闪过一丝锐利，“他还有复活的能力。”


  “啊？赫拉克勒斯的宝具「十二试炼」确实能让他复活，可你怎么做到杀他一次的？！”通讯器里立刻传来奥尔加玛丽的惊呼声，满是难以置信。


  “安静点，所长。”希耶尔抬手揉了揉眉心，语气依旧淡定，“我好歹是埋葬机关的王牌之一，虽说比不上其他三位，可也是杀过神的。这个Archer确实棘手，但并非无法对付。”


  “好吧，我信了。”奥尔加玛丽的语气松了些，又追问，“所以你到底是怎么做到的？”


  “让他彻底杀我一次，再趁他用心眼感知我已死的间隙，近身解放第七圣典。”希耶尔淡淡说道，“就是这样杀了他一次。”


  通讯器那头陷入了沉默，立香攥了攥衣角，轻声开口问道。


  “希耶尔前辈，这种方法还能再用一次吗？”


  “绝对不行。”希耶尔轻轻摇头，语气坚决，“上次交手时，他那敏锐的感知力已经察觉到了这种套路，第二次绝对行不通。”


  “赫拉克勒斯有十二条命。”伊莉雅神色凝重地补充道，语气里带着几分无奈。


  希耶尔转头看向Saber，Saber无奈地摊了摊手，语气里带着几分自嘲：“我顶多能帮你打掩护，论实力，我完全不是这个Archer的对手。”


  士郎沉默地坐在一旁，拿起茶壶，默默给众人添着温热的茶水，全程没插一句话。


  “希耶尔前辈，那你还有其他对付Archer的手段吗？”玛修微微前倾身体，语气急切地问道。


  “自然是有的。”希耶尔顿了顿，语气沉了沉，“只是都很难施展。”


  “不过，有一种方法，应该能成功。”希耶尔眼中闪过一丝笃定，缓缓说道。


  立香看着眼前的蓝发少女，眼底闪过一丝了然，瞬间明白了她的用意。


  “你是说？”两道声音同时响起，立香转头，正好对上士郎看来的目光。


  士郎朝她轻轻点头，立香深吸一口气，开口问道：“你是说，利用Archer的蛇毒对付他？”


  希耶尔弯了弯唇角，赞许地点点头：“立香猜对了。”


  “只要能拿到那九头蛇毒，我就能想办法把毒素附在自己的箭上。”希耶尔语气坚定地说道。


  士郎静静地盯着希耶尔，茶色的眸子带着一丝向往。


  “不愧是埋葬机关的人。”言峰士郎低声呢喃。


  希耶尔眼神复杂地看着士郎，语气带着几分意味深长：“你未来，可比我现在强得多。”


  “欸？”立香和玛修同时愣住，满脸疑惑地看向两人。


  希耶尔收回目光：“先着眼于眼下吧，别想这些无关的。”


  “好了，关于Archer的事情就先说到这里吧。”分享完Archer的情报，伊莉雅轻轻拍了拍手。


  立香昨天本就熬到很晚，再加上这一天接连遭遇意外，早已困意翻涌，她揉了揉酸涩的眼角，冲着伊莉雅轻轻点了点头。


  “都已经十二点了啊。”Saber抬眼瞥了眼窗外的夜色，轻声呢喃道。


  “对了，你们是怎么发现我和玛修在那里的？”立香捧着温热的茶水，好奇地问道。


  伊莉雅转头看向身旁的言峰士郎，撇了撇嘴调侃道：“还能是谁，某个完全不顾自己安危的笨蛋，察觉到异常的魔力波动后，就跑过去了。”


  “也就得亏Archer没狙击你，言峰，不然你早就死了不知道多少遍了。”伊莉雅补充道。


  言峰士郎看向伊莉雅，脸上带着几分无奈，轻声说道：“好歹，我安全回来了。”


  “那是因为Archer当时在狙击我，士郎。”希耶尔端着茶杯，冷不丁地插了一句，语气平淡。'

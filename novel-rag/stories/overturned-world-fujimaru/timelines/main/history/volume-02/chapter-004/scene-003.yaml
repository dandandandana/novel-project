content: '“啊……”士郎愣了一下，连忙问道，“有伤到哪里吗？不过以希耶尔前辈的实力，应该……”


  “你看我这样子，像是受伤了吗？”希耶尔看着士郎，到了嘴边的话又咽了回去，只淡淡说了一句。


  “那就好。”士郎嘴角微微扬起一丝浅淡的笑意，双手合十轻声道，“愿主保佑你。”


  立香看看士郎，又看看希耶尔，眼里满是疑惑，忍不住开口问道：“言峰先生，你认识希耶尔前辈吗？”


  “先生？”希耶尔挑了挑眉，看看立香，又看向士郎，“立香，我得纠正你一句，言峰士郎大概十七岁，而你已经十八岁了哦。”


  “欸？”立香彻底愣住，见士郎轻轻点了点头，才支支吾吾地应道，“哦……哦？”


  “哇……这么一看我好失败啊玛修……士郎比我还小一岁，却已经这么厉害了。”立香说着，便趴在桌子上，小声哼唧起来。


  “……前辈，别这样，你已经做得很好了。”玛修有些无奈地扶了扶额，轻声安慰道。


  立香抬起头，又看向士郎，追问：“所以士郎，你认识希耶尔前辈吗？”


  士郎轻轻摇了摇头：“我也是今天才见到真人，之前只是听说过前辈的名字。”


  “这里不是2004年吗？”通讯器里传来奥尔加玛丽的声音，带着几分疑惑，“这时候希耶尔就已经有名气了？”


  “嗯？希耶尔前辈其实算不上出名……”士郎语气里带着几分无奈，“我会知道前辈，是因为之前跟着处理过一个任务的收尾工作。”


  希耶尔脸色瞬间微变，眼底掠过一丝苦涩，连忙问道：“你说的是1999年那个任务？那时候你才多大，就去参与收尾了？”


  “嗯……当时听说了前辈的事迹，就对前辈留下了很深的印象。”言峰士郎轻轻点头，如实说道。


  “原来是这样啊……那可是我为数不多的黑历史呢，言峰，可不许乱说哦。”希耶尔笑着歪了歪头，语气里带着几分调侃。


  言峰士郎连忙摆了摆手，讪讪地笑道：“我当然不会乱说的，前辈，我向你保证。”


  “嗯哼，我自然信你。至于我为什么认识你……”希耶尔轻笑一声，话里带了点意味，“说不定你以后会加入埋葬机关，成为我真正的后辈呢。”


  士郎愣了一下，没有太过激动，只是轻轻点头，脸上掠过一丝苦涩的笑意：“这样吗……那真是太好了。”


  “等等……言峰士郎先生是代行者吗？”玛修看着士郎，好奇地问道。


  士郎默默点了点头，没有多余的言语。


  “埋葬机关……就是那个只有代行者中的王牌才能进入的地方吗？”立香转头看向希耶尔，眼里满是好奇。


  “嗯哼，我就是其中一席哦。说不定，立香你以后也可以加入呢。”希耶尔看向立香，语气里带着几分引诱。


  “我……我又不信教，怎么加入啊！”立香哀嚎一声，一脸无奈。'

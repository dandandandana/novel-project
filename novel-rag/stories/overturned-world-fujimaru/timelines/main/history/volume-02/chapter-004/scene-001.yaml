content: '奥尔加玛丽的声音从通讯器里传来，带着难以掩饰的惊愕：“等等！希腊的大英雄？！你不是说caster是美狄亚吗？”


  “而且她不是已经有berserker了吗？”她的语气里满是难以置信，连声音都微微发颤。


  “冷静点，这场圣杯战争已经快到末尾了。”伊莉雅无奈地耸耸肩，缓缓解释道，“caster有破除契约的能力，她的御主尼禄·卡奥斯很狡猾，我根本没法快速解决他——他不断派魔兽围剿，再加上berserker牵制，archer很快就被缠住了。更麻烦的是，尼禄还有无视令咒传送的能力，我的契约就这么被他夺走了。”


  “不过archer根本不愿意屈从于caster，现在caster全靠令咒强行控制他。”伊莉雅补充道，语气里带着几分复杂。


  “你们能从archer的狙击下活下来，其实是他故意留手了。”


  Saber也适时补充，语气里带着几分凝重：“没错，那家伙的实力真的可怕到离谱，我根本不是他的对手。”


  立香皱了皱眉，连忙问道：“那我们有没有办法绕过他，直接去对付caster？”


  “不行的。”伊莉雅摇了摇头，语气肯定，“caster手里有令咒，无论怎么绕，最后我们都必须面对archer。”


  立香深吸一口气，沉声道：“我知道了。”


  “其实archer还不是最大的麻烦。”Saber话锋一转，神色愈发凝重，“尼禄手下有一只怪物，冬木的普通人，全都是被那只怪物害死的。”


  话音刚落，Saber突然绷紧了神经，轻声道：“等等，外面有魔力波动。”


  她转头看向立香，眼神里带着几分探究：“是你们的人吗？这魔力很陌生。”


  通讯器里立刻传来奥尔加玛丽松了口气的声音：“立香，告诉她，是希耶尔来了！那家伙没死真是太好了！”


  “我可听见你这话了，奥尔加玛丽所长。”


  一道清冷的声音从正门传来，希耶尔缓步走了进来——此刻的她全副武装，周身裹着一套样式凌厉的黑色铠甲，脸上戴着薄薄的护目镜，宽大的手甲衬得她原本纤细的身形多了几分凛冽，褪去了平日的柔和，反倒透着一股生人勿近的可怖气场，手中虽未持武器，却依旧让人不敢小觑。


  几乎是同时，言峰士郎从旁边的房间走了出来，手里握着几柄泛着冷光的黑键，茶色的眸子定定地落在希耶尔身上，神色带着几分警惕：“这位是？”


  希耶尔的目光落在士郎身上，忽然勾起唇角，轻声开口：“言峰士郎？”


  立香见状连忙开口解围：“等等，言峰先生！她是我们的人！”


  士郎微微颔首，收回了警惕的目光，淡淡道：“好的，我知道了。”


  伊莉雅看着士郎，笑着问道：“恢复得差不多了？言峰。”


  “嗯。”士郎点点头，转头看向立香，语气平静却带着几分郑重，“所以，你们打算怎么做？”


  立香挺直脊背，语气无比郑重：“我们会帮你们回收圣杯，修复这个特异点。”


  “这样啊……”伊莉雅轻声呢喃，随即把刚才和立香、玛修讨论的内容，快速告诉了士郎。


  士郎听完后，目光重新落回立香身上，语气低沉而直白：“藤丸立香，继续下去，你会死的。”


  立香抬眸看向他，忽然弯起唇角，眼底满是坚定：“如果不是言峰先生，我早在森林里就死了。”


  士郎看着她眼中的坚定，沉默了片刻，缓缓开口：“这样啊……那就一起战斗吧。”


  希耶尔听完伊莉雅的叙述，抬手解除了武装，黑色铠甲化作微光消散，重新换上了平日里的修道服，随意找了个位置坐下。


  “首先要解决的，是第五次圣杯战争的archer赫拉克勒斯吧？”希耶尔看向伊莉雅，语气冷静，“伊莉雅斯菲尔，我们需要他的具体数据。”


  伊莉雅点点头，清晰地报出数据：“筋力A，耐久B+，敏捷A，魔力A+，幸运B+，宝具A++。”


  “这是什么怪物啊！”通讯器里立刻传来奥尔加玛丽震惊的声音，“我查到了，他还有高等级的单独行动和对魔力，甚至同时拥有心眼（真）和心眼（伪），还有B级的勇猛和战斗续行！”


  “不止这些。”伊莉雅补充道，语气凝重，“他的宝具「十二荣光」有十二种道具，每一种都很难对付。”


  希耶尔轻轻点头，想起什么似的皱了皱眉：“确实棘手，那家伙的弓箭简直不讲道理，还带着毒素，疼得要命。”


  伊莉雅愣了一下，满眼惊讶地看向她：“那可是海德拉之血的毒素，连不死性都能破解，你竟然没死？”


  这时，士郎从教堂的厨房走了出来，端着几杯温热的茶水，轻轻放在众人面前。


  希耶尔毫不客气地拿起一杯红茶，抿了一口，语气随意：“没什么，单纯是不论怎么都死不掉而已。他的毒素虽然阴险，但死过一次就没感觉了，同样的招式，别想对付我第二次。”'

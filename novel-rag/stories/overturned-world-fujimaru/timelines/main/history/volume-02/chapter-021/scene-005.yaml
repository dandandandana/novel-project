content: '轰隆一声巨响，本就摇摇欲坠的地基被这巨大的冲击力震得愈发不稳，碎石如雨般坠落，整个废墟都在剧烈摇晃，仿佛下一秒便会彻底坍塌。


  “理想的王啊，能在我手下撑到此刻，已然足够你骄傲了。”Alterego俯视着瘫软在地的格洛雷斯，语气里没有半分怜悯，只有几分漫不经心的施舍。


  “你……”格洛雷斯喉间溢出破碎的气音，嘴角的血痕未干，眼中满是难以置信的震惊与不甘，浑身的伤口还在隐隐作痛，却依旧死死攥着圣剑的剑柄，不肯认输。


  “很抱歉，冠位从者于我而言，相性差得离谱。”Alterego的声音平淡无波，听不出丝毫情绪，他抬手凝聚魔力，稳稳托住格洛雷斯摇摇欲坠的身躯，带着她缓缓向前迈步，脚下的碎石被魔力碾得粉碎。


  “我的保有技能【人理之敌】，对从者、冠位资格拥有者、人理守护者、救世主皆有着极高的特攻倍率——可惜，这些特质，冠位从者尽数具备。”


  “也就是说，冠位从者在我面前，根本不值一提。更何况，我还持有EX级保有技能【弑神】，大多数冠位从者，都会被这一技能额外特攻。”他语气依旧平淡，“而且……夜郎自大。”


  “你们不知道我的情报，不知道我的能力，只知道我在这里，认为我绝对不是冠位从者的对手，不过就算知道了也没办法战胜我就是了。”


  “什……”格洛雷斯瞳孔骤缩，浑身一震，伤口的剧痛都被这突如其来的冲击掩盖，她从未想过，自己的冠位身份，竟会成为对方压制自己的最大弱点。


  “我的主人说，对付你们这类存在，理应拿出‘最高敬意’——于是，我便诞生了。”Alterego忽然勾起一抹戏谑的笑，语气里满是嘲讽，“既然你快死了，不妨告诉你我此行的真正目的：除了解决灵长类杀手，便是……”


  “夺取一骑冠位的灵基。”


  “你……”格洛雷斯气得浑身发抖，眼中翻涌着滔天怒火与绝望，却因伤势过重，连抬手反击的力气都没有。


  就在这千钧一发之际，两道挺拔的身影悄然伫立在废墟之上，踏在大地的残骸之间，磅礴的魔力如潮水般从周身溢出，瞬间打破了这片废墟的死寂，也打断了Alterego的动作。


  Alterego抬眼望去，嘴角的笑意愈发戏谑：“说曹操曹操到啊。可惜，我对你们两个可没什么兴趣——罗马神祖、承载万物之舟的建造者，怎么，是特意赶来送死的吗？”'

content: '“什？”格洛雷斯满脸震惊地望着Alterego，眼中满是难以置信——她身有阿瓦隆的加护，理应免疫一切物理与魔力伤害，Alterego本应无法触碰到她才对。可方才那一瞬间，她的直感疯狂预警，一股致命的危机感席卷全身，逼着她下意识地举起圣剑格挡。


  事实正如直感所示，阿瓦隆的加护，已然失效。


  “可惜啊，从者之中，或许只有你能让我觉得棘手。”Alterego轻笑一声，身形一闪，紧随格洛雷斯一同下坠，语气里带着几分惋惜，“换做其他冠位，比如冠位Archer赫拉克勒斯、冠位Lancer罗马神祖，我根本无需向御主请求支援——怎么偏偏是你，这位理想中的王？”


  “你这个狂妄之徒！”格洛雷斯怒目圆睁，眼中翻涌着滔天怒火，她在空中强行稳住身形，周身魔力疯狂涌动，圣剑再度泛起耀眼的金光。


  “EX！”


  “此身为剑所制。”Alterego低念咒文，声音低沉而坚定，周身的魔力与神性力量交织在一起，他缓缓拔出腰间的太刀，刀身泛起淡淡的银色光晕，带着毁天灭地的威势。


  “Calibur！”


  “天丛云。”


  格洛雷斯的金色光炮速度更快，瞬间便抵达Alterego面前，可就在光束触碰到Alterego挥动的太刀时，令人震惊的一幕发生了——那道足以击碎一切的璀璨光炮，竟被Alterego手中的太刀硬生生劈成两半，朝着两侧扩散而去，轰击在地面上，激起漫天烟尘。


  被劈开的不只是光炮，还有她身后的地面——冬木市坚硬的水泥路面，被这一剑的余威彻底斩断，一道骇人的巨大峡谷横贯其间，峡谷两侧的岩壁被魔力灼烧得如同明亮的琉璃，滚烫的岩浆从谷底喷涌而出，带着灼热的气息，蒸腾起漫天白雾，整个战场都被染上了一层诡异的赤红。


  格洛雷斯表面看似无恙，站姿依旧挺拔，可她身上的银色盔甲，却已出现一道极深的裂痕，裂痕中溢出淡淡的魔力，昭示着她已然受伤。Alterego抓住这转瞬即逝的破绽，身形一闪，一脚狠狠踹在她的腹部。


  下坠途中，格洛雷斯硬生生承受了这一击，嘴角溢出一丝鲜血，她强忍着腹部的剧痛，勉强调整身形，身后喷涌而出的魔力化作一股强劲的气流，带着她向一旁偏移，最终稳稳落在地面上，膝盖微微弯曲，支撑着身体，眼神里却依旧满是倔强，没有丝毫退缩。


  “竟然没死？不对……是暮色之面吗？”Alterego身形一闪，瞬间便追至格洛雷斯面前，语气里带着几分玩味，他挥起太刀，与格洛雷斯的圣剑猛烈相撞，金属碰撞的脆响震耳欲聋，激荡出的飓风席卷四周，将周遭的树木连根拔起，地面也被震得布满裂痕。


  近身缠斗中，这位冠位从者尽显Grand Saber的顶尖素养，招式凌厉而精准，攻防兼备，每一击都直指Alterego的要害。交手近十合后，她便精准抓住Alterego重组灵基的破绽，圣剑微微一挑，剑锋带着磅礴魔力，直指其心脏，欲一击必杀，彻底终结这场战斗。


  “哎呀，看来单靠我自己的武艺，确实不如你。”Alterego仓促用太刀挡下这致命一击，手臂被剑上的巨力震得发麻，勉强与格洛雷斯拉开距离，嘴角依旧挂着那抹戏谑的笑意，缓缓将太刀收回刀鞘，动作从容不迫，仿佛方才的狼狈从未发生。


  这一收刀动作，瞬间激起了格洛雷斯的高度警惕，她握紧圣剑，周身魔力再度紧绷，可奇怪的是，她的直感却并未发出任何预警。结合方才的交手，她心中已然断定，这大概率是Alterego发动宝具的前兆，绝不能掉以轻心。


  【绝对不能让他发动宝具！】


  方才的交锋，已让格洛雷斯对Alterego的宝具有了粗略判断——那绝对是至少A+级别的对界宝具，否则绝不可能轻易劈开她的全力一击，更不可能造成那般毁天灭地的破坏力。


  更确切地说，若不是【王之镜鉴】中的暮色之面替她挡下了那致命一击，她早已灵基崩坏、彻底退场。如今阿瓦隆的加护已然失效，失去了最强防御的她，绝无可能再接下Alterego的全力一击，更别说他的宝具解放。


  一念及此，格洛雷斯不再犹豫，催动体内全部魔力，魔力放出的光芒笼罩全身，身形如闪电般冲向Alterego。她深知，拔剑收鞘既是宝具发动的前兆，也必然会暴露巨大的破绽——她赌定了这一点，必须在Alterego发动宝具前，将他彻底击溃。


  格洛雷斯心意已决，眼中闪过一丝决绝——这破绽，她必须赌，也赌不起。若是让Alterego成功发动宝具，不仅她自身难保，整个冬木市，甚至是这个岛国都会毁掉。'

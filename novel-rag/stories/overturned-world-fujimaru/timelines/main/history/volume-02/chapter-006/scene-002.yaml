content: '战事落幕之后，Caster便以令咒相逼，命令Archer驻守在高楼之上，负责狙击一切可疑目标。


  他被令咒禁止自杀，再加上几乎每天都要被两道令咒强行约束，纵使满心不愿，Archer也只能被迫执行Caster的指令。


  言峰士郎收留了那位失去从者的少女——也就是Archer曾经的御主。而当他这次前去营救那位莫名降临的少女时，Archer清晰地感受到了对方心底翻涌的恨意。


  那是属于人类最真切、最滚烫，未被任何力量磨灭的恨意。


  Archer比谁都清楚，他们要解决这特异点的乱象，自己就必然是挡在他们面前的阻碍，或许还是最坚硬、最难以逾越的那一块。


  他抬眸望向夜空，只有一颗孤星在墨色幕布上亮着，眼底藏着无人察觉的思绪。片刻后，他凭着体内的“心眼”指引，缓缓将目光投向东方的教堂方向。


  望着教堂处涌动的、蓄势待发的魔力，Archer静静地伫立在屋顶，身姿挺拔如松，神色未变。


  Caster的令咒如枷锁般束缚着他，每一场战斗，他都必须拼尽全力，没有半分退路。


  【来吧……若是连我这关都无法跨过，你们又怎能应对接下来的强敌？】'

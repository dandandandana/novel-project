content: '档案室的书架从地面一直延伸到天花板，每一层都塞满了羊皮卷与牛皮封面的厚册，空气中的灰尘被几人翻书的动作搅动起来，在光束中翻滚成淡金色的漩涡。


  爱尔奎特靠在门口的半截石柱上，手里凭空多出一只梨，梨皮青黄，被她咬出清脆的裂响。


  “这么多书——得翻到什么时候啊。”她嚼着果肉，声音含混不清，另一只手随意地朝书架比划了一下，“光是这一面墙就得有三千本吧。”


  立香从书架的第二层抽出一本厚重的目录册，翻开扉页的瞬间扬起一小团灰。她侧头避开灰尘，指尖沿着目录上的索引一路下滑。“计时塔把档案按科系归档——二楼这一片是综合区，天体科和矿石科的目录本应该在第三排。”她把目录册合上，塞回原位，再抽出旁边那本标着“A-L”字母段的羊皮厚册。


  “前辈，这边有矿石科的分类标签。”玛修蹲在书架底层，粉色的发丝随着她低头的动作滑过肩膀。她将几本散落在地的卷宗捡起来摞好，拍了拍封面上的灰，“但好像缺了中间几年——从1730到1780年间的是空白的。”


  “被人拿走或者毁掉了。”立香翻着目录，语调很平稳，“这间档案室太久没人维护，能剩下一半就算赚。”


  爱尔奎特啃完了梨核，果核在她指尖化作细碎的金光消散。她又空想具现化出一个苹果，红皮光滑，在袖子上蹭了蹭。“你们迦勒底的人做事都这么认真吗——就不能让那个会扫描的家伙来吗？”


  “士郎和雅典娜在另一边。”玛修站起身，膝盖上沾了灰，她轻轻拍掉，“档案室太大，我们分工——”


  “立香。”


  门口传来士郎的声音。立香刚把一本书放回原位，扭头看向门边的人影。士郎站在门框旁，一只手搭在扶手上，表情介于无奈与习惯之间。


  “你怎么在这里。”立香直起身，手指还夹在目录册的页码间。


  “你们真的在翻啊。”士郎的语调不是疑问，是按捺着的叹气。他走进房间，脚步在石板上带起细微的嘎吱声，在装满书的柜子前停住，将那只空着的手按到墙壁上。


  “Trace On。”


  魔力从他的掌心渗入墙体。蓝色的魔力纹路像水流般沿着石壁蔓延，攀上柜子的边框，爬上每一本书的脊背——不是覆盖，是渗透，以他的手掌为中心向外扩散的蓝色光络在整个房间的构造中穿行，像树木的根系探寻着泥土中的养分。


  立香掏出通讯器看了一眼时间。两刻钟。她在这两刻钟里把目录册从A翻到了L，玛修整理完了书架底层的散落卷宗，爱尔奎特吃完了苹果又开始啃第三个梨。


  士郎收回手。蓝色光络随着掌心的脱离瞬间消散，墙面恢复成冰冷的灰石。他拍了拍手上的灰尘，开口：


  “这里没有。”


  立香将目录册合上。“嗯？”


  [同调。]


  她的思绪只顿了半拍就接上了——士郎的保有技能，通过接触物体解析内部结构的能力。她见过他同调武器，同调迦勒底坏掉的电路和仪器。同调一个房间的书籍内容，在原理上完全可行。


  “同调？”


  “嗯，也就只能做到这些程度了。”士郎点头，语气平淡得像在说顺手关了一扇窗，“这里没有我们要的资料。”


  “等等，你都看过了？”立香歪头看向他，手里的目录册还悬在半空。


  “前辈——有没有可能不够仔细？”玛修张着嘴巴，把刚才抱在怀里的卷宗放回书架，动作停顿了一瞬。她看着士郎，浅粉色的眉毛微微拧起。


  “看了目录。没有我们需要的。”士郎的手搭上旁边的书架扶手，指尖无意识地敲了一下木板，“当然，我是做不到全看完或者记下来的——脑子不够好使。”


  爱尔奎特已经把第三个梨啃得只剩果核，果核在她指间化作金粉洒落。她拍了拍手，嘴角挂着浅笑，“迦勒底的御主，你打算怎么做呢？”


  立香没有看她。她的视线定在士郎身上，盯着他拍灰的动作，盯着他搭在扶手上那只手的指甲缝里残留的灰尘。然后开口。


  “士郎，我相信你。”


  [之前是我遗漏了。]


  她把目录册放到旁边的书架上，书脊与木架接触发出沉闷的轻响。“我把你的同调技能忘了——这个技能有什么限制吗？”


  “有。”士郎转身朝门外走去，靴跟在石板上踩出沉稳的节奏，“计时塔还存在着运行中的结界，我需要进入房间内部才能同调这个房间的东西。”


  “档案室都没有，那么亚从者计划的信息可能在哪里？”立香跟上他的步伐，玛修紧随其后。爱尔奎特从石柱上跳下来，慢悠悠地跟在最后面。


  “我倾向于在天体科。”士郎说。


  “欸？前辈，为什么？”玛修的粉色脑袋从立香肩膀后面往前伸了伸，她的呼吸扫过立香的耳侧。


  “因为迦勒底不就是天体科搞出来的吗？”爱尔奎特在后面拖长了尾音，语调是那种明明知道却偏要说出来的随意。'

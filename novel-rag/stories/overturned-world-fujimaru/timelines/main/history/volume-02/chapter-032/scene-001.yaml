content: '“看来大家都到了。”


  奥尔加玛丽的声音在空旷的管制室中回荡，带着一丝不易察觉的沙哑。这座曾经精密运转、足以容纳数百人的环形指挥中枢，如今只剩下稀稀拉拉的几十个身影。照明系统仅恢复了一半，大片未能清理的焦黑废墟隐藏在灯光照射不到的暗角里，空气中依然残留着无法通过循环系统过滤的浓重血腥味与线路烧焦的刺鼻气息。


  所长站在中央平台上。她穿着那套标志性的迦勒底制服，脊背挺得笔直，仿佛只要弯下哪怕一毫米，某种沉重的东西就会将她彻底压垮。她的目光扫过下方残存的工作人员，最后落在了穿着单薄病号服的藤丸立香身上。


  “我不会说什么丧气话。”奥尔加玛丽的音调稍稍拔高，试图用威严掩盖底层的恐慌。她攥紧了拳头，指甲深深嵌入掌心，“当前根据吉尔伽美什和达芬奇的推测，是一名叫做爱尔特璐琪的死徒引爆了迦勒底。但是好在，示巴和迦勒底亚斯还在。”


  停顿。死一般的寂静蔓延开来。


  “以及很不幸的是，我们的A组几乎全军覆没，只有一号还在冷冻仓里维持着生命体征。”奥尔加玛丽深吸了一口气，语速逐渐加快，像是在强迫自己吐出这些带血的数据，“B组全员重伤。目前的御主，只剩下藤丸立香一人。外界的冰雪中依然徘徊着许多低级死徒，不过目前已经交给了吉尔伽美什处理，大家不用担心防线崩溃的问题。”


  立香静静地站在台下。她没有流露出恐惧，也没有哭泣。她的目光锁定在奥尔加玛丽那张因过度疲惫而显得苍白的面孔上，随后轻轻点了点头。


  “在示巴的观测中……”奥尔加玛丽的嘴唇终于控制不住地颤抖起来，“从人类史诞生，一直到2017年。除了2017年这个锚点之外，不论是过去还是未来，人类历史都已经完全消失了。示巴目前共观测到了五个特异点，而立香已经成功修复了冬木的那一个。”


  所有人的呼吸都放轻了，似乎害怕惊动了某个更为庞大的噩耗。


  “在2017年间，不知发生了什么，整个地表已经覆灭。除了迦勒底现存的能源，我们没有任何可以指望的外部补给。”奥尔加玛丽闭上眼睛，仿佛在向全人类致以最后的哀悼，“我们将这种现象命名为——人理烧却。”


  她重新睁开眼，眼底布满了因长期失眠而产生的红血丝。


  “各位，我们现在肩负起了拯救人理的终极任务，这里的每一个人都必不可少。”她的声音终于带上了无法抑制的战栗与孤注一掷的决绝，“这项事业，名为：冠位指令（Grand Order）！”


  会议解散后，沉重感如同实质的泥沼包裹着每一个人。立香在医疗区接受了最后一次草率的身体检查，针头拔出静脉时的刺痛甚至没能让她皱一下眉头。


  “那么立香……目前迦勒底剩余的能源和物资，还勉强够你进行一次FATE系统的召唤。”


  前往召唤室的幽暗走廊里，达芬奇走在立香身侧。这位平时总是游刃有余的天才，此刻眼中盛满了不加掩饰的担忧。她看着少女那张仿佛戴上了无形面具的脸，放慢了脚步，轻声开口问道：“立香，你没问题吧？”


  立香摇了摇头，几缕橘色的发丝贴在她出了一层薄汗的脸颊上。


  “没事的，达芬奇亲，带我过去吧。”她的声音平静得像是一滩没有活水的死潭。玛修在医疗舱里微弱的呼吸声仿佛依然萦绕在她的耳膜上，那个不到两个月的生命倒计时，就是驱使她不断榨取自身残余魔力的鞭子。


  奥尔加玛丽从后方大步走了过来。她走到立香身边，高跟鞋的声音因为刻意放缓而显得有些犹豫。


  “立香，你不必勉强。”所长皱着眉头，眼神中透着别扭的关切，“这种身体状态下强行连接召唤系统会有不小的负担，可以让你多休息一段……”


  “不必了，所长。”立香毫不迟疑地打断了她，目光直视着走廊尽头的金属大门，“在现有的情况下，还是尽早把从者召唤出来比较好。我们需要战力。”


  奥尔加玛丽看着她那毫无波澜的眼睛，把剩下的话咽了回去。她妥协般地叹了口气，与达芬奇一左一右，带领着这位最后的御主踏入了召唤室。


  英灵召唤系统被安置在一处独立的穹顶区域。这里的仪器精密得令人头晕目眩，巨大的魔术回路刻印在地板上，散发着冷冽的蓝光。当三人踏入这片区域时，空气中已经弥漫着一股若有若无的金色光尘。


  “太慢了，杂修们。”


  吉尔伽美什站在召唤台的阴影边缘。她今天换下了一贯的西装，身上带着一股刚从外面的风雪中厮杀归来的冷厉气息，但语气依然是那种居高临下的慵懒。


  “吉尔伽美什，你不去迦勒底外围清理死徒，在这里干什么？”奥尔加玛丽看到她这副姿态，原本压抑的焦虑顿时化作了烦躁。'

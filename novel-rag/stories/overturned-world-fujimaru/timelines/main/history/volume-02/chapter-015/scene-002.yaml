content: '教堂依旧简朴得近乎寒酸，传道的台前没有丝毫装饰，素净得有些冷清。他的意识还未完全回笼，竟像个初来乍到的陌生人般，茫然地打量着这片熟悉的空间，脚步不受控制地循着本能，一步步走向台前。


  他说不清自己要做什么，只觉得心底有一股莫名的牵引，驱使着他靠近那方承载了他无数虔诚祷告的讲台。


  台前的木桌上，静静放着一本圣经。下一秒，他眼前忽然闪过阵阵火光，冬木市一片死寂、毫无生机的模样，毫无预兆地在他眼前铺展开来——断壁残垣，烟尘弥漫，连风里都裹着绝望的气息。


  场景飞速闪烁，立香担忧的脸庞、希耶尔冷硬的眉眼、Saber沉稳的神情……同伴们的模样一一掠过眼前。就在这时，腹部突然传来一阵撕裂般的剧痛，疼得他猛地弯下腰，连腰都直不起来，只能双手死死扶住冰冷的讲台，大口大口地喘着粗气，唾液不受控制地滴落在圣经的封面上。


  他心头一慌，连忙用指尖小心翼翼擦去圣经上的污渍，指尖的颤抖暴露了他的慌乱，随后，他情不自禁地翻开了这本厚重的书。


  【主……请赐予我答案。】


  他在心底虔诚默念，无关自己的安危，只求能找到拯救世人、让大家免于灾厄的方法，让人们能重获开心与幸福。


  最起码……让身边的同伴们，能好好活下去。


  可这份希冀，在他翻开圣经的那一刻，彻底碎裂。


  书页上，空无一字。


  腹部的剧痛骤然加剧，尖锐的痛感顺着神经蔓延至全身，连胸腔都传来窒息般的憋闷，让他几乎喘不上气，浑身的力气仿佛都被抽干。


  “这样吗……”他的声音沙哑得像被砂纸磨过，带着难以掩饰的绝望。


  “主……你是在怪我吗？”


  “主，你终究……无法原谅我的无能吗？”


  剧痛让他完全无法站直身体，几乎要趴倒在讲台上，胸口传来阵阵灼热的灼痛感，桌上的圣经竟毫无征兆地自行燃起火焰。


  烈火顺着桌沿蔓延，很快便舔舐到他的衣角，就在这时，一道纤细的身影在火光中缓缓显现。


  一位银发少女，她静静站在那里，气息微弱得像风中残烛，双目紧闭，根本分不清是生是死。


  士郎浑身颤抖着朝她走去，身上残留的火焰让他满心焦灼，生怕灼伤对方，可刚迈出一步，伊莉雅的身躯便骤然扭曲，转眼化作一具腐烂的尸体，散发着刺鼻的腥气。


  “伊莉雅……安息。”他声音沙哑得几乎听不清，指尖微微颤抖，强忍着心底的剧痛，小心翼翼整理好少女的仪容。


  整理妥当后，他缓缓环视四周，才惊觉周遭的景象早已悄然改变——还是那座教堂，却不再是方才传道苦修的素净模样，而是被改造成了众人临时据点的会议室。


  “御主……”


  澄澈而沉稳的声音在耳边响起，士郎恍惚间抬起沉重的头颅，只见法兰西的圣女手持长剑，静静伫立在他面前，神色凝重。


  “快走。”Saber的声音里带着不容置疑的坚定，“活下去，御主。”


  【活……活下去？】


  这句话像重锤般狠狠砸在士郎的脑海里，眼前的景象瞬间变得模糊，耳边的轰鸣盖过了一切声响。


  他什么都想不起来，脑海里只剩下小时候那片吞噬一切的火海，还有那双曾紧紧握住他、带着温度的金色手掌——那是吉尔伽美什的手。


  【又是……只有我一个人活下来吗？】


  “我……”他张了张嘴，声音破碎不堪，“我什么都没能做到吗？”


  “我谁都没救下来吗？”


  话音未落，Saber的身影便开始变得透明，化作点点灵子消散在空气中，只留下最后一句微弱的叮嘱：“御主，外来的御主也……快走。”


  直到此刻，言峰士郎才彻底确信，心底的绝望如同潮水般将他淹没。


  【言峰士郎，到最后，还是只有你活下来了。】


  【只有你。】


  身上的火焰骤然暴涨，灼烧着他的身躯，他此时此刻终于彻彻底底感受到了钻心的疼痛：“啊啊啊啊啊啊！”


  藤丸立香正坐在言峰士郎的床边，指尖无意识地摩挲着衣角，希耶尔他们讨论的战术、关于Ruler和灵长类杀手的情报，她听得似懂非懂，既插不上话，也提不出像样的计划，心底满是“自己这个半吊子御主什么都做不了”的无力感。守在言峰床边，看着他昏迷的模样，这大概是自己能做些力所能及的事吧。


  “前辈。”


  清脆又温柔的声音从门口传来，立香猛地回头，只见玛修正扶着门框站在那里，脸色还有些苍白，却已然恢复了几分精神。


  “玛修！你醒啦？感觉怎么样？有没有哪里不舒服？”立香连忙起身说道。


  “我已经好多了，前辈放心，我毕竟是从者，恢复得很快。”玛修轻轻走到立香身旁，目光落在床上的言峰士郎身上，轻声问道，“前辈你呢？听希耶尔前辈说，灵长类杀手的嚎叫有很强的精神污染，你没受影响吧？”'

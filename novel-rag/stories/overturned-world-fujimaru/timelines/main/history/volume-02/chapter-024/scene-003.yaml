content: '亿万吨的海水从失去支撑的天穹上倾盆倒落，如同一整面海洋翻转过来扣在了城市的废墟之上。水幕落地的瞬间发出了震天彻地的轰响，冲击波将周围的积水掀起数米高的浪花，碎石被水流裹挟着向四方冲去。


  暴雨变本加厉地砸在希耶尔脸上，她连抬手遮挡的力气都没有了，只是微微偏了偏头，让雨水从脸侧流下去而不是灌进鼻腔。


  通讯的魔力波动在她耳边嗡鸣了一下。


  “御主，解决灵长类杀手了。“


  Archer的声音从通讯中传来，沉稳，平静，没有多余的情绪波动。就好像刚才那场足以抹平一个城区的战斗只是他漫长英雄生涯中一次再寻常不过的狩猎。他站在距离爆心最近的一栋残存建筑的顶部，巨弓已经从手中消散——弓弦在最后那轮射杀百头中彻底断裂了。暴雨淋在他赤铜色的皮肤上，将甲胄缝隙间残存的灰尘冲刷干净。


  “好，Archer。“


  藤丸立香的声音从通讯那头传来。年轻的御主深深地呼出了一口气，那口气里包含着过去这场战斗中积压的所有紧张、恐惧和不安——然后被她用力咽了回去。她的语气迅速切换回了指挥官模式，尽管嗓音里还残留着一丝不易察觉的颤抖。


  “希耶尔前辈呢？我听奥尔加玛丽所长说她已经没办法正常行动了。“


  立香的声音在说到“没办法正常行动“的时候微微停顿了一下。她没有亲眼看到希耶尔现在的状态——但从所长转述的监测数据来看，那位蓝发修女的身体状况已经恶化到了一个极其危险的地步。


  Archer低下头，视线越过暴雨的帘幕，落在了数百米外那个倒在积水中一动不动的蓝色身影上。


  她还在呼吸。胸腔还在微弱地起伏。但除此之外，她的身体已经完全停止了活动——甚至连手指都没有在动。


  “御主，需要我把她带过去吗？“


  “不。“


  立香的回答很快，快到几乎像是提前就想好了一样。


  “优先回收圣杯。到时候我们可以灵子转移。“


  通讯中传来立香短暂的沉默。在那一两秒的空白里，Archer几乎能感受到年轻御主在指挥台前攥紧拳头的力道——她想说“先去救希耶尔前辈“，这句话已经到了嘴边，但被她自己硬生生吞了回去。


  因为她知道轻重缓急。


  圣杯还在灵长类杀手的残骸里。如果不尽快回收，残留的魔力可能引发二次灾害。灵子转移需要圣杯作为锚点，先拿到圣杯，就能让所有人——包括希耶尔——在最短时间内安全撤离。


  这是正确的判断。


  “明白了，御主。“


  Archer没有多说什么，巨人般的身躯从楼顶一跃而下，落地时溅起的水花高过了他的膝盖。他迈开步伐，朝着灵长类杀手残骸所在的坑底走去，暴雨在他身后拉出一道模糊的灰色帷幕。


  鼓掌声响起。


  “做的不错。”


  Alterego如同鬼魂一样突兀的出现在了灵长类杀手的身体前面，他伸手，在灵长类杀手的躯体里轻轻一掏，扑哧一声把一个金色的杯子掏了出来。


  他举起左手。


  三道剑形令咒。


  “以令咒以令之，berserker，守护住圣杯。“


  一个异形，对，完全不似人类的异形。


  双腿以违背生理的诡异姿态拧转，胫骨与膝盖朝后反折扭曲，脚后跟与小腿却硬生生向前拗出畸形的弧度，皮肉之下，腿部肌肉虬结成一团团硕大的肉坨，每一块都攥紧如拳头大小，硬邦邦地鼓胀着，撑得皮肤紧绷欲裂。头颅上的肌肉更是夸张到可怖，块块隆起如婴儿头颅般硕大，将颅骨轮廓彻底撑得变形，狰狞的肌肉纹路爬满脸颊与颅顶，毫无半分人形的柔和。


  面容早已畸变得不成样子：一只眼窝深深凹陷，陷下去的弧度比鹤喙还要深邃，只剩漆黑的空洞透着凶戾；另一只眼球却顺着歪斜的面颊耷拉下来，悬在脸侧，浑浊且狰狞。嘴部与食道彻底翻转外翻，咽喉处豁开可怖的创口，竟能透过翻卷的血肉，直视胸腔内跳动的肺与暗红的肝，脏器在体内搏动的模样清晰可见。两颚开合碰撞时，齿间会迸溅出公羊毛团大小的炽烈火花，噼啪作响，透着焚尽一切的凶煞。


  胸腔里的心跳震耳欲聋，每一次搏动都如同雄狮咆哮，轰鸣着震彻周遭，连空气都随之震颤。颅顶之上，蒸腾的热气、呛人的毒雾与窜动的火舌交织翻涌，袅袅升腾；原本的发丝尽数变硬，根根倒竖如钢针，锋利到能轻易串起苹果，根根直指天际，透着悍不畏死的狂气。


  Berserker，又不是Berserker。


  “berserker？！“


  “这才是他该有的样子而已，别那么惊讶。“Alterego轻声说道，他往圣杯里轻轻放入了什么，”黑泥这些还是太污秽了，berserker，去释放你的天性吧，别让我的Master的另一个作品受到玷污。“


  Alterego往后扭头，他轻声开口'

content: '“士郎，吉尔伽美什说得没错，你和我，本就是一种人。”言峰绮礼伸出手，强行扭过言峰士郎的脸，迫使他看着自己，“我们都是无法从自身得到满足的人啊~”


  “！”


  言峰士郎瞬间暴起，不顾浑身的疲惫与痛苦，猛地扑向言峰绮礼，双手狠狠掐住他的脖颈，语气里满是怒火与厌恶：“别拿你这种人，和我混为一谈！你这个……恶徒！”


  看着言峰绮礼脸上因愉悦而扭曲的笑容，听着他口中吐出的“恶徒”二字，言峰士郎手上的力气又加重了几分，几乎要将对方的脖颈掐断。


  可言峰绮礼却毫不在意，反而恶作剧似的轻笑：“士郎，你现在还不明白吗？你根本不在乎他们的死活，你只是……把他们当作寻找愉悦的工具罢了。”


  这句话像一道惊雷，在言峰士郎的脑海里轰然炸开，他头痛欲裂，眼前阵阵发黑，可掐着言峰绮礼脖颈的手，却没有丝毫放松，反而愈发用力。


  “你要从他们的幸福、快乐里，找到属于你自己的愉悦，以此来满足自己，这就是你的愉悦啊。”言峰绮礼继续说道，语气里满是蛊惑，“士郎，你我本质上没有区别，我们都是……天生恶人。”


  他看着言峰士郎因愤怒与痛苦而扭曲的面庞，嘴角勾起一抹玩味的弧度：“承认吧，士郎……这又不是什么错事。如果你在乎的是我们是否为恶，那不如等灵长类杀手彻底清除整个人类社会，到时候就知道，我们的恶，是源于社会，还是源于……我们本身。”


  “言峰绮礼。”言峰士郎的声音突然冷淡下来，尽管面庞依旧扭曲，眼神里却燃起了刺骨的杀意，“你错了。”


  “如果我真的不在乎他们的死活，那我大可以等他们都死了，再去寻找新的人，去感受所谓的‘愉悦’，不是吗？”他顿了顿，语气愈发冰冷，“那我为什么要杀了你？”


  话音未落，言峰士郎腾出一只手，毫不犹豫地从言峰绮礼腰腹处原本就有的大洞里穿了过去，指尖沾满了温热的血污。


  “杀了你，是我做过最没有后悔的事情！”


  “哪怕是背叛了主的信条吗？”


  士郎此时以及无暇估计自己的养父说了什么了，他双手死死卡住对方的脖颈，怒吼着说道：“别把我和你混为一谈！就算主抛弃我，就算主放弃我！就算我的本质和你一样！我也绝对不会成为你口中的恶人！”


  他手上的力气不断加重，言峰绮礼的脸色渐渐涨红，可他却没有丝毫怯意，反而无视物理规则般地放声大笑：“哈哈哈哈……士郎，你终于看清楚自己了吗？明明只要欺骗自己是个恶人，就可以避免接下来的痛苦，你却偏偏要选择接受，真是愚蠢啊……”


  “真是可惜……没法再品尝你脸上的表情了……”


  “咔嚓。”'

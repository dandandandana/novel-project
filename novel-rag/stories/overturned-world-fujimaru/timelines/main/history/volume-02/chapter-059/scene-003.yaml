content: '“前辈！”玛修转过头看着立香。紫色瞳孔透过面甲的缝隙，直直地撞进了御主橘色的眼睛里。她的声音坚定得没有一丝犹豫。“不论如何，苟活一段时间——并不如试着一直作为前辈的盾牌前进！言峰前辈！”


  士郎微微点了点头。他把目光移向立香。


  玛修的手指重新攥紧了立香的手。那份颤抖已经停了，她的掌心稳稳地贴在立香的手背上。


  立香咬了咬牙。嘴唇被牙齿碾了一下之后泛出一小片白印，然后血色迅速回涌。她勉强开口，声音里有压不下去的涩意。“我尊重——玛修的意见。”


  周围的空气一下子沉了下去。那种沉默不是什么都没有的空白，是所有人都把该说的说了剩下的就是等着某个东西落下来砸出声音。立香刚要张嘴打破这个沉寂——一道女声从走廊的尽头传了过来。


  “看样子你们做好决断了。”


  吉尔伽美什从远处缓缓走来。金发在警报灯的红光里泛着几乎金属质感的光泽。她扫视了一眼所有人——立香握着玛修的手，玛修的紫色瞳孔透着坚定，士郎抱臂靠在墙上，雅典娜面无血色地站着，伊什塔尔还在那边揉爱尔奎特的脑袋。她把目光最后落在立香身上，开口的时候那句话不像是催促，更像是一个王者在陈述谁都无法反驳的事实。


  “还愣着做什么。”


  她顿了顿，赤色的瞳孔在警报灯的下一轮扫过时亮了一下。


  “时间不等人。”'

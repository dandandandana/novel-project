content: '“在特异点F见过他少年时候嘛，“立香吐了吐舌头，“那时候也是这副德行，面上温温和和的，骨子里固执得很。当时他不是想赴死来着，花了我好多口舌。“


  玛修想了想，“但是……言峰前辈实际上挺好相处的，我觉得。“


  “对，好相处这点我没意见。“立香点头，话在这里停了停，“就是感觉，怎么说呢……不太对劲。说不清楚。“


  走廊里安静了一段。


  [人怎么能这样活着呢。]


  这句话在脑子里转了转，没找到出口，沉下去了。


  两人走到会议室门口，门缝里透出灯光，立香推开门进去。


  会议室里人已经到齐了。


  言峰士郎靠着左侧的墙站着，制服袖口还是卷到前臂中段，手环的银色链节搭在手腕上。吉尔伽美什坐在靠窗那侧，金发别在耳后，比谁都端正，也比谁都自在。达芬奇站在投影面板旁边，手里拿着操作终端，正在调整投影角度。希耶尔靠着后排的椅背，棒棒糖的塑料棍夹在手指间，没有动作。奥尔加玛丽坐在桌子正中的位置，看见立香进来，眉头抬了一下。


  “都在等你们了，立香。“


  “对不起对不起……“立香快步绕到座位坐下，把手里夹的安魂顺手搁在椅子旁边的地上。


  玛修跟着落座。


  “枪。“士郎低头看了眼那两杆枪，“放地上不合适。“


  “那你帮我看着。“


  “……“


  “开玩笑的，“立香把枪从地上捡起来，垂直靠在椅子侧边，“好了，这样行了吗。“


  奥尔加玛丽点了点头，“好了，都到位了，先请达芬奇介绍伦敦的现状。“


  达芬奇把投影调出来，显示的是伦敦市区俯瞰图，核心地带标着橙色标记。


  “目前的情况是，“达芬奇拿激光笔点在橙色标记的位置，“伦敦是现在地图上唯一还检测到活人波动的城市，这里保存着阿斯特拉院和埋葬机关的研究成果，都还在。“


  “迦勒底这边，爱尔特璐琪离开之后，周边的死徒基本清理完毕了。伦敦不一样，整座城市目前还在死徒游荡的状态下，规模不小。“


  “有多少？“立香问。


  “无法精确统计，但密度高。“达芬奇收起激光笔，“基础情况就这些了，接下来的判断交给希耶尔。“


  奥尔加玛丽朝希耶尔点了点头。


  希耶尔把棒棒糖的塑料棍在手指间转了个方向，站直了一点。


  “立香，任务按优先级排，第一，在阿斯特拉院的遗留资料和埋葬机关的成果里，找修复玛修灵基的方法。这是主线。“她顿了顿，“第二，物资，迦勒底除了能源和食物，其余几乎都缺，能带回来的尽量带。“


  “第三，如果有余力，把伦敦清理干净。在那边建立第二基地的可能性是有的，但优先级放在最后。“


  “收到。“立香点了点头，“三件事，按顺序。“


  “嗯。“


  奥尔加玛丽重新开口，“出战成员，立香带队，这是固定的，Ruler的魔力需要她的链路支撑，不可替换。“


  “这个我知道。“


  “玛修。“


  玛修抬起头，“收到，所长。第七圣典目前可以正常使用，不会拖后腿的。“


  “以及——“奥尔加玛丽停了停，“吉尔伽美什。“


  吉尔伽美什把椅子稍微往后推了一点，“不怕迦勒底内部空虚吗？留守的战力够用？“


  “英雄王，我当然想过这个问题。“奥尔加玛丽托着胸口，“逻辑很简单，如果前线垮了，后方留多少人都是白搭。立香是唯一的御主，她出了事，迦勒底就彻底失去主动权，所以前线不能输。“


  吉尔伽美什没有再说什么，靠上椅背。


  奥尔加玛丽把手从胸前放下来，看向立香。


  “立香，这不是给你施加压力，我是认真在拜托你。“


  立香回看向她，停了停，点了点头，“相信我，所长。“


  奥尔加玛丽没再说什么，“具体战术你们自己商量。“


  希耶尔绕过桌子，走到立香旁边，俯身了一点，压低了声音。


  “藤丸立香，有一件事先告诉你。“


  “说。“


  “整个行动的大方向，你来定，不要把这个权力交出去。“希耶尔直接开口，“言峰家那两个，在这方面一点都不靠谱。“


  立香愣了愣。


  [言峰家……两个。]


  “具体原因，“希耶尔继续，“一个自我意识过剩，一个自我意识为零，放任他们，迟早出乱子。“


  “……收到。“立香想了想，“我会盯着的。“


  “好。“希耶尔直起身，退回到原位，没有再多说。


  立香在椅子上坐直了一点，拿起手边的记录纸整合了一下，开口。


  “那就这样分工，侦察交给士郎，玛修跟着我，吉尔茜主力正面作战，碰到硬仗，士郎放弃侦察过来配合吉尔茜。有问题的现在说。“


  言峰士郎点了点头，补了一句，“正面作战我也可以的。“


  “我知道。“立香解释，“现在侦察这块人手最少，先委屈你了，有机会我们调整。“


  士郎再次点头，没有异议。'

content: '最后一声枪响的余波在射击场的隔音壁之间折了两道，才沉进墙体里消散。靶纸上的弹孔密得快要连成一片。


  立香把安魂缓缓放下来。右手先松，左手跟着松，两杆枪的重量落到台面上，闷响了两声。手腕抖了一下，前臂的肌肉持续绷了超过一个小时之后终于得到松弛的许可，积压的酸胀感从肘关节往指尖漫开，连骨头缝里都发沉。


  她揉了揉右臂。拇指压进前臂内侧，顺着肌肉纹理往下推了一段，酸痛在拇指经过的地方先加剧，再散开。


  言峰士郎站在旁边，没看她，在看靶纸。


  弹孔分布不均匀。前半段训练打的弹孔散在外圈，后半段开始往中心收拢，最后二十发里有十七发落进了靶心的黑色圆圈。立香哀怨地把头转向他，等他开口。


  士郎注意到了。没说话，右手投影出一条叠好的毛巾，递过来。


  “你这家伙。“立香接过毛巾，往脸上按了一下，“绝对是故意的吧。“


  “手给我。“


  士郎伸出手，掌心朝上。


  立香把右手搭上去。士郎的手指合拢，拇指压在手腕内侧的脉搏位置，食指和中指顺着前臂往上移了两指宽，停在肌肉最紧的那一段。捏了一下，力道不重，精准。酸痛的核心被按住，立香的手臂往回缩，被他手腕轻轻挡住了。


  然后洗礼咏唱开始了。


  不是声音，是热。从指尖接触皮肤的位置渗进去，薄薄一层热意灌进肌肉纤维，顺着酸痛的走向往下蔓延。立香能感觉到那股热在肌肉里移动的轨迹，绷紧的纤维在它经过的地方逐根松开。酸胀消退。


  “上手这么快。“士郎的拇指换了个位置，压进肘关节内侧的肌腱处，“看样子你很有天分。“


  “呵呵。“立香把毛巾搭到肩膀上，“和特异点F的终结剑一样，你投影的东西我上手就能用你的武艺，这个也是这样。“


  “能够直接接受已经很好了。“


  “什么叫直接接受，说得好像我做了什么了不起的事一样。“立香捏了捏手腕，“你这一个小时搞得我怀疑手是不是还长在身上。“


  “一个小时是你定的时间。“


  “……“


  立香把嘴闭上了。


  士郎松开右手，换到左手。同样的流程。手腕、前臂、肘关节，拇指沿着肌肉走向逐段按压，洗礼咏唱的热跟着渗进去。左臂比右臂酸得更厉害，惯用右手的人，左手在持枪时需要额外发力维持稳定，积累的疲劳更深。士郎在左臂的肘关节处多停了一会儿，拇指的力道比右臂稍重。


  “子弹是特制的。“他说，“到了伦敦会给你两个弹夹。“


  “也就是说我有四个弹夹可以用？“


  “是。安魂的弹夹很沉，带多了你撑不住。“


  “也是……“立香捏着下巴，“子弹是什么？“


  “心象弹。“士郎的拇指在她左臂最后一段肌肉上按了一下，松开，“很珍贵。“


  他抬起头。


  “最重要的一件事。“


  “嗯？“


  “枪口不要朝着队友。“


  “这话你说了我才知道啊？“立香把安魂从台面上拿起来，竖着抱在胸前，枪口朝天，“就为这一句话，你花这么长时间操练我？“


  “你不练不会。“


  “……“立香选择不接这句，“我也没有枪套。“


  “晚点给你发。“


  “两个。“


  士郎停了停。


  “……好的，两个。“


  他站起身，把台面上散落的空弹壳归拢到一边。立香放下安魂，活动了一下肩膀，左右各转了转，颈椎咔嗒作响。


  “晚上要开会。“士郎说，“大概明天下午出发。“


  “嗯，我知道，是我提出来的。“


  “嗯？“士郎的手停了一下，“什么时候提的？“


  “午饭的时候。“


  “这样。“


  他看了立香一眼。那个表情很短，短到不在看他的人根本不会注意，但立香在看他，所以没有漏掉。


  “那就做好准备吧。“士郎把最后几颗空弹壳推到一边，“话说，特异点的那个我是不是给了你个礼装？“


  “嗯，宝石礼装，增幅用的。“


  士郎的动作停了。


  不是慢下来，是停了。手放在台面上没有收回来，人愣了愣。


  “他把那个都给你了？“


  “嗯。“


  士郎点头，把手收回来。“目前来看等级不高，但带着就好。“


  “不用你提我也会带着的。“立香撇了撇嘴。


  “那就好。“


  射击场安静了一会儿。立香坐在椅子上，把安魂横放在膝盖上，手指沿着枪身的铭文凹槽划了一段。银白色的填充物泛着暗哑的光，凹槽的边缘打磨得平整，指腹划过去没有毛刺。


  她想起了特异点F最后的那场战斗。柳洞寺后山，月光，那杆白色的枪。


  “Ruler。“


  “嗯？“


  “你知道最后那杆枪是什么吧。“立香没有抬头，手指还在铭文上，“你降灵进那个身体之后，解放了那杆枪，然后就撑不住了。“


  “我想知道那是什么。“


  士郎点头，开口。


  “Hasta Iudicii Stellarum。“他停了停，“Expectatio。“


  立香抬起头。


  “我不懂拉丁语。“'

content: '“星廻·断罪之枪，''期望''。“


  安静了一会儿。


  “这么中二的名字。“立香的手指从铭文上离开，“是你自己起的吧。“


  “是爱尔奎特起的。“


  “爱尔奎特。“立香重复了一遍，“你的女同事。话说你女人缘是不是太好了。“她顿了顿，“那玩意很强吗？“


  “很强。“士郎想了想，“应该是目前最强的武器了。“


  “比安魂？“


  “不是同一个量级的概念。“


  立香没有立刻接话，低头看了看膝盖上的安魂。枪身被体温捂热了，握把的弧度贴着大腿，铭文的凹槽安静地泛着光。


  “代价是什么？“


  士郎没有马上回答。


  “玛修最后解放那杆枪，灵基碎裂。“他停了一下，“这件事我很抱歉。“


  立香在听，没说话。


  “真正意义上的代价，是身体会受到极大的冲击。本质上是把持有者当作导线，庞大的魔力灌进去再释放出来，持有者承受不住，自然会出事。“


  “持有者会死吗？“


  “不一定。“士郎顿了顿，“取决于承受的量和身体本身的底线，但受重伤是必然的。“


  立香抬起头，“那你呢？“


  士郎张了张嘴。


  停了停。


  “有些是我也没弄明白的。弄明白了再告诉你。“


  立香盯着他看了一会儿，没有追问，把视线放回到安魂上。


  “那现在你能用吗？“


  “不在我手上。“士郎说，“特异点F里，圣杯响应了那个士郎最后的愿望，把枪送到了你手上。但本质上是圣杯弄出来的捏合物。本体目前应该在千年城，我也不确定。“


  “千年城。“立香重复了一遍，没多说什么。


  她把安魂拿起来，放回台面上。这次放得轻，手在枪身上多停了一会儿才收回来。


  “我知道了。“


  毛巾从肩膀上取下来，叠了两下，搭在台面边缘。


  然后抬头。


  “好了，晚饭我要吃烤鱼。“


  士郎沉默了一下。


  “……玛修和希耶尔得吃清淡的。“


  “我要吃烤鱼。“立香从椅子上站起来，把椅子往后推了一下，“明天就出发了，不得照顾我一下？“


  “只吃烤鱼吗。“


  “烤鱼加米饭。“


  “……算了，听你的。“


  士郎把台面上的空弹壳收进一个小容器里，投影消散。立香把安魂的两杆枪分别握在左右手，掂了掂重量，枪口朝下，枪托朝上，竖着夹在腋下。


  “枪套什么时候给我？“


  “晚饭前。“


  “两个。“


  “两个。“


  立香满意地点了点头，往射击场出口走。走到一半，回头看了一眼。士郎还站在台边，归置最后几样东西，动作不快，也不慢。


  她没说什么，转回头，继续走。


  左脚的鞋帮还是压扁的，脚后跟踩在折叠的布料上，走路的时候能感觉到那层轻微的不平整。


  餐厅里的灯还亮着。


  食堂不大，几张长桌散在中央，靠墙的矮柜上摆着保温锅和餐盘。立香端着托盘在角落的位置坐下，玛修在她对面落座。板甲已经卸下来了，换回了日常便服，只有手腕上留着一道浅浅的压痕，是穿戴装甲时手套边缘挤出来的。


  两人没说什么，认真吃完了饭。烤鱼上来的时候还很烫，立香烫了三次舌头，玛修等鱼稍微凉了才动筷。


  “前辈，慢一点。“


  “没事，烫着了说明好吃。“


  玛修看着立香又往嘴里送了一块，沉默了两秒，把自己那份的鱼骨挑干净，推到立香这边。


  “给你。“


  “你不吃了？“


  “挑完了嘛，鱼骨都清干净了。“


  立香接过来，拿筷子在鱼身上戳了戳，点头，“确实，你挑鱼骨比我厉害。“


  “装甲手套的精密操作训练。“玛修理所当然地说。


  出门的时候，立香把托盘送回去，玛修在旁边等着。


  走廊比餐厅暗一些，应急照明的灯条沿着墙角延伸，泛着略偏冷的白光。两人走了一段，玛修慢下脚步，凑近了立香。


  “前辈。“


  “怎么了？“


  “那个……“玛修顿了顿，“你觉得Ruler，他怎么样？“


  立香挑起眉，扭头看了玛修一眼，忍了两秒，捂着嘴笑起来。


  “玛修吃醋了？“


  “前——前前前辈！你在说什么！“


  “字面意思啊。“立香把捂嘴的手拿下来，“难不成你不是吃言峰士郎的醋了？才突然问这个？“


  “怎么可能！这是恶意揣测！前辈！而且……而且我只是随便问问！“


  “随便问问还那个那个铺垫半天。“


  “前辈！！“


  “好了好了，“立香摆了摆手，“认真说说嘛，别那么激动，我当笑话讲的。“


  她把手插进裤兜，边走边换了个表情，认真了起来。


  “言峰士郎嘛……他这个人，表面上挺让人放松的。安慰人的时候很像那么回事，帮着修东西从不嫌麻烦，说话也没有架子，看上去好相处。“


  “但是？“玛修接了一句。


  “但是。“立香伸出一根手指晃了晃，“你再往里看一层，底下是个冷的人。你提意见他不反驳，也不真的接，打太极打得很溜。“


  “前辈很了解他啊——“'

content: '计时塔的大门被从内侧推开。门轴锈蚀的呻吟被地面的震动盖过。爱尔奎特从门框的阴影中走出来，怀里抱着一柄幽蓝色的长剑。剑身通体暗蓝，刃面上流淌着不属于大地的光泽——那是用月球UO朱月的尸骸锻造的魔剑真世界。剑尖垂向地面，划过的石板上留下细微的时空裂隙，裂隙边缘的碎石在瞬息间被抽走百年光阴，碎裂成齑粉。


  她抬眸看向浮空的金发少女。


  阿尔托莉雅骑在梦魇马上歪了歪头。金发从露背作战服的肩带旁滑落垂在白皙的肩胛骨上方。她看着爱尔奎特，嘴角浮起一抹和善的微笑。


  “来受死了啊。”


  “自大的家伙。”爱尔奎特将空着的手轻轻一抬。轰隆隆的声音从地壳深处翻滚而上。整个计时塔前方的地面随着她手掌上举的动作拔地而起，岩层断裂抬升，土石从地缝中喷涌而出，在数息间筑成一座拔地而起的擎天石柱。石柱的顶端与阿尔托莉雅的高度齐平，把爱尔奎特稳稳送到金发少女正前方的位置。


  “士郎。”阿尔托莉雅开口。


  悬浮在空中的Alterego点了点头。“阿尔托莉雅，我会协助你。”


  “那就让你看看吧。”阿尔托莉雅歪了歪头。下一瞬间她消失在原地。


  速度快到连残像都来不及成型，梦魇之马的四蹄在虚空中踏出的火痕连成一条笔直的黑线直贯爱尔奎特面门。


  她手中的塔赫缪雷斯之刃举到齐肩高度，剑刃斩破空气时发出的是呼啸，是一道短促的爆鸣，像是空气被活活撕开又来不及合拢。


  一剑斩开。


  爱尔奎特的瞳孔骤然收缩。她勉强横起真世界架住这一击，幽蓝剑身与暗色剑刃撞击的瞬间整个石柱顶部的地面往下凹陷了三尺。撞击点炸开的气浪呈环形向外推去，伦敦废墟中半塌的砖墙被气浪扫过轰然倒塌。爱尔奎特脚下的岩石龟裂成蛛网，她的膝盖微弯，牙尖咬紧，握剑的手虎口震裂渗出金红色的血液。


  砰！


  金红血珠溅在破损的石板上，阿尔托莉雅已经不在她面前了。金发少女消失的速度和冲过来时同样迅疾，只留下梦魇马蹄下未散的火痕在空气中缓缓暗淡。


  “这么快……”伊什塔尔刚刚架起马安娜要朝爱尔奎特的方向支援，身形还没动，漂浮在空中的Alterego就开口了。


  “无限剑制。”


  天地倒悬。


  咒文落下的瞬间整个空间被置换。脚下不再是伦敦废墟的碎石和瓦砾，而是一面无限延伸的镜面。镜面光滑得像刚刚凝固的冰层，倒映着上方同样无限延伸的钢铁大地。那是真正意义上的倒悬——天空在脚下，大地在头顶。无数剑刃从镜面下冒出剑尖，再从镜面下整柄弹出悬浮在半空。圣剑、魔剑、名剑、无名剑，刃面在倒悬天地的光线下反射出万千种不同的金属光泽。


  吉尔伽美什看着这片天地，脸色微沉。她的指尖微动，王之财宝在空中撕开数道金色涟漪——然后镜面下的剑刃在同一时刻暴起，剑尖精准刺入每一个展开到一半的门扉，将宝具与空间的联系活活切断。金色涟漪颤抖着缩小消失，王之财宝在她周身展开的门全部被摧毁。


  在这个天地倒悬的固有结界里，王之宝库开不出哪怕一扇门。


  “果然……”吉尔伽美什深吸一口气。她微微侧头看向身旁的伊什塔尔。“能撑多久撑多久吧，伊什塔尔。”


  伊什塔尔没有回话。


  古伽兰纳的死亡让她的双目染上赤红的怒火。她抬手甩出漫天宝石，每一颗宝石都裹着足以炸穿城塞的魔力。宝石如同暴雨般砸向悬浮在倒悬天空下的Alterego。她甩出第二把，第三把，魔力生成的宝石源源不断从指尖倾泻而出。“又是固有结界？这年头这种等级的大魔术都是批发的吗？”


  Alterego没有躲。镜面下的剑刃替他拦截。无数剑刃从镜面下弹出，剑尖对剑尖，剑背对剑背，将砸来的宝石逐一击碎。炸开的魔力光屑在倒悬天地间绽放成持续不断的焰火。


  爱尔奎特站在自己筑起的石柱顶端。她看着远处天空中的那个黑点——那是阿尔托莉雅在倒悬的天幕下重新摆好架势的身影。她猛地一跃从石柱跳开，身形在空中画了道弧线，朝着自己刚才立起来的山岳后方掠去。


  阿尔托莉雅驾马追至。爱尔奎特落在山岳侧面，手掌按上岩壁，准备用空想具现化在山体内部生成新的大地。她判断错了。阿尔托莉雅没有用剑斩开山岳，没有撞碎岩石，她直接从山体中穿了出来。


  马头先从岩壁里钻出，接着是阿尔托莉雅的剑刃，最后是马的尾巴——穿过整座山就像穿过一层薄雾，山石在她穿透的位置泛起涟漪又恢复坚硬的石质。


  阿尔托莉雅抬眸。金发从额前滑过，露出下方淡金色的眼瞳。她面上仍挂着和善的微笑，剑上却凝聚着足以融化万物的暗色魔力。魔力在剑刃上层层叠加向外扩张，把原本纤细修长的剑面包裹成一柄宽若门板的巨剑。


  一剑挥出。'

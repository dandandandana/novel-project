content: '“谁该结束还不一定呢！”爱尔奎特摊开手掌，掌心朝上，五指张开。星之吐息——连结星球意识核心的权能已经将无穷无尽的魔力灌入她的身躯。她以自身为筐体，将汲取到的盖亚全量魔力汇聚于一点，魔力密度高到扭曲了千年城上方的光线，使她的轮廓在光中变得模糊。


  “Marble Phantasm！”


  爱尔奎特将手往前一推。化作足以毁灭一切的光之洪流从她掌心喷涌而出。那道光不是扩散的，是凝聚成柱的。纯白得近乎透明的能量柱裹挟着让空间本身都开始龟裂的破坏力，朝阿尔托莉雅的方向轰鸣而去。


  阿尔托莉雅也举起了手中的魔剑。暗黑色的魔力从她体内涌出灌入塔赫缪雷斯之刃的剑身。剑刃上原本就缠绕着的暗色极光在这一刻膨胀了数倍有余，极光从剑身往外延伸，将剑刃的轮廓拉伸成了足以劈开云层的尺寸。


  “斩绝七重魔境之极光！”


  暗色的光炮与洁白色的光炮在半空中对撞。两种截然相反的能量在撞击点互相啄咬撕扯。接触面往外迸射着两色的闪电，每一道闪电劈碎了千年城的一片屋顶。对撞的中心形成了一个非黑非白的混沌球体，球体内部两股大源魔力在互相湮灭，湮灭的速度比释放的速度慢了一线，导致混沌球体不断膨胀。


  就在光炮僵持的这一刻阿尔托莉雅拍动翅膀带着骏马朝天空飞去。她绕开了对撞的中心点，从侧面飞出，划过一个巨大的弧度。爱尔奎特释放的光炮追着阿尔托莉雅而去，白色光柱在天空中变轨到一半，阿尔托莉雅已经收拢双翼让它们转移到梦魇之马身上——骏马的两肋处伸展出漆黑的翼翅，翼展比阿尔托莉雅自己的更宽更长。


  “Cóiste Bodhar！（无阻的冥夜驰骋！）”


  梦魇之马载着她划出一道完美的圆弧。阿尔托莉雅在骏马背上压低身形，双翼收敛让整个姿态变得极尽流线。暗色的流星带着贯穿一切的冲锋之势砸向地球的公主。


  撞击。


  暗色流星撞在爱尔奎特的胸口，带着她的身躯直接砸穿了千年城的主塔。塔楼中心的石料在撞击下崩塌成齑粉，城堡从上到下被贯穿了一个巨大的窟窿。流星没有停，它载着真祖砸穿了城堡的底部，在倒悬的天幕下划出一道燃烧的拖尾轨迹。


  爱尔奎特吐出大口金红的鲜血。真祖的血在空中飘散，每一滴血珠落下都砸出足以震碎附近建筑物的冲击波。她看着被砸穿的千年城在她视野中化作光点消散，喉咙里涌上的咸腥被她咽回去又涌上来。


  “月落。”


  她轻轻吐出这两个字。嗓音被血浸泡得沙哑。


  阿尔托莉雅一剑斩向她胸膛的那道攻击被她勉强侧身卸掉大半。剑锋扫过她的肋骨，伤口从侧胸一直拉到腰侧，金红色的血液喷溅而出染红了她金色长发。她没有防御，而是借着被击飞的惯性往后飘退，把自己变成一个被丢弃的货物般砸向伦敦的破败城区。


  背部撞击地面的瞬间砸出一个直径数十米的陨坑。爱尔奎特躺在坑底，看着天空。她空想具现化的极致产物正在坠落——那是月亮。Moon Fall。


  并非真正的月球，而是空想具现化创造出的与月球无二致的天体幻影。它的直径足以填满伦敦上方的整个天空，表面环形山的纹理清晰得与真实无异，光芒冷冽而浩大，带着让地球都开始发出地鸣的恐怖质量。月影覆盖了整个伦敦废墟，将泰晤士河的河面压得静止无波。


  阿尔托莉雅站在空中看着那轮越来越大的月亮。她收起了塔赫缪雷斯之刃，右手握上腰间那柄黑色圣剑的剑柄。出鞘。剑身的暗色在月光的映照下泛出奇异的光泽。她在梦魇马的背上稳住身形，双腿微微屈下，双手握住剑柄，剑尖指向坠落的月轮。


  表情在这一刻落定。不是战意，不是兴奋，是一部分厌恶。像是被迫做一件并不想做但不得不做的麻烦事。她将圣剑缓缓举过头顶，黑色剑身上的纹路从剑柄处开始逐一亮起暗金色的光。周遭的魔力开始疯狂舞动，以她的剑尖为圆心形成了一个肉眼可见的魔力漩涡。


  “Ex——”


  圣剑的真名在她唇齿间凝聚。魔力漩涡的转速快到极限，空气中的光芒粒子被卷入漩涡往剑身上灌注。黑色圣剑的剑身在这一刻不再黑暗——暗色的光束裹挟着光与热，形成了对抗月亮光辉的暗色光柱。光柱从剑尖直刺天穹，粗得足以贯穿任何天上的东西。


  “——Calibur！”


  一剑挥下。暗色光柱劈向坠落的月亮。


  光芒对撞的瞬间整个世界安静了一拍。不是声音消失了，是声压大到超出了听觉器官的感知范围。月亮的下落在光柱面前停住了——它的中心被暗色的圣剑光柱顶住，如同碾盘砸进钢柱。月亮的下端在光柱中开始崩裂，碎石来不及往下落就被光柱本身的热量熔化成岩浆，再从岩浆蒸发成气体。停滞持续了三次呼吸的时间。'

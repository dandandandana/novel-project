content: '她的身体先于意识动了起来。每一根肌纤维都被灌进体内最后剩下的全部魔力。魔力从灵基涌出，像烧红的铁水沿着神经末梢奔腾，所过之处肌肉都充满撕裂般的酸胀感。她握紧剑柄，把巨剑举过肩膀，剑刃在空中蓄满重压之后猛然挥出。


  “断罪死——！”


  剑刃砸在雅典娜身上。不是劈也不是砍，是整柄剑的重量加上玛修全身的惯性砸在女神的战甲上。冲击波炸开的一瞬间，空气被压缩成白色的气圈往外扩散。雅典娜的长枪上，枪杆上，手臂的护甲上，战甲被剑刃撕开的裂口从肩胛骨一直延伸到腰侧的护甲板。


  雅典娜整个人被这一剑扫得往后倒去。她的靴跟在石板上磕出两声闷响，然后她站住了。嘴角有金色的液体淌下来，滴在破裂的战甲边缘。她低头看了一眼胸甲上被断罪死切开的那条豁口。


  然后她笑了。很淡的笑，淡到被房间里的昏暗吞掉轮廓。


  “额……”玛修跪倒在地上。剑从她手边滑脱，咣当一声砸在石板上。肺里的空气像被抽走了，每口呼吸都从喉咙里挤出来。灵基深处传来灼热的震颤，像一块冰冷的铁突然被烧红然后放进温水里。灵基从内部开始被暖流填充，这股暖意沿着四肢爬出去，涌进手腕、涌进膝盖、涌进各处被刚才的战斗消耗殆尽的关节。


  她大口大口地喘着气。被热浪灼红的皮肤在暖流经过之后慢慢褪去了肿痛的刺感。她抬起脸，汗水把额前粉色的头发粘成绺贴在额头上。“什么……你做了什么……”


  雅典娜的战甲上那道被断罪死切开的裂口还在往下淌金色的血。她没捂伤口，也没倒下去。她只是站在逐渐消散的英杰之帜结界中，看着玛修。结界的边界正在化为透明，光壁一片片碎裂，碎片往上升，消失在头顶的空气里。


  “你……”玛修感受着汇聚到自己灵基里的那团暖流。它不是残留在体内消散，而是被灵基吸收了。灵基在接纳它，在修复消耗的框架和筋腱。她猛然瞪大眼，看向倒在一边的雅典娜。


  “果然是太乱来了。”


  言峰士郎的声音从楼梯口的方向传过来。他不知在这里站了多久，作战服的袖口挽在小臂上，腰间佩剑的剑鞘在走动时轻轻磕在腿侧。他先看了一眼跪倒在地的玛修，然后把视线移向靠在墙上的雅典娜。


  他的语气还是平日的不紧不慢。“和提亚共谋，以身作虎，强行逼玛修进绝境，让英杰之帜在战斗中认可她……你从一开始就不是要杀她。”


  士郎走到玛修身旁蹲下，手指搭在玛修的手腕上探了一下脉搏。“灵基被英杰之帜初步修复了。”他放下玛修的手腕站起身，看向雅典娜。“用这种方式救人，和相信你的道德真是我做过最错误的决定。”'

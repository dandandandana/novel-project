content: '“这里是我的宝具，【英杰之帜】的试炼场。”雅典娜的声音不紧不慢。“能够突破这里的，无一不是足够被历史铭记的英雄。”她抬起另一只手指了指头顶的天花板。“而我的宝具，能让被视为英雄的存在恢复到巅峰时期的实力，还可以一比一复刻对手英雄的镜像能力。”


  她在枪杆上轻轻敲了一下手指。“你觉得我的话刚才不是对你说的吗？”


  [刚才的话？她对前辈说的那些——说前辈不够格的那些话。]


  “你也是如此，小姑娘。”雅典娜缓步走近。脚步声一层层叠上来，和玛修逐渐平复的喘息形成交错。“如果我能与一位御主签订契约，就能让御主获得英杰之帜的真正能力。届时立下契约的御主就可以施展英杰之帜，而我……”


  “那么。”玛修的手指在剑柄上扣紧。指节抵在握把的防滑纹上磨出了细微的凹痕。“你就能恢复自己巅峰的实力。”


  “说得对。”雅典娜停下脚步。


  两人之间的距离缩短到三步。然后女神动了。枪尖扫过来。


  横斩。


  她的右手握着枪杆末端，以腰部带动肩膀再带动手臂，枪尖在空中挥出一个完整的扇形。玛修举剑格挡，剑脊和枪杆撞在一起，冲击力从剑身传到手腕，腕骨酸胀得像被铁钳夹了一下。她的靴跟在石板地上磨出半寸的滑痕。


  铛。武器的碰撞声沉闷而短促。结界内没有任何东西被破坏。墙壁没有裂缝，地面没有凹陷，连空气都在碰撞之后立刻恢复平静。


  [不行……枪的长度让雅典娜能在我够不到的地方攻击我。]


  玛修往后跳开，膝盖弯曲吸收落地时的冲击。她大口喘气，汗水从下巴尖滴落在石板上。巨剑的重量在体力消耗之后翻倍地往手腕上压，每次举起剑刃的动作都比上一次慢了不少。


  雅典娜没有追击。她把枪尾顿在地上，看着玛修退开的动作。


  两合之后玛修借力再退一大步。然后握把在她手中重新变形。枪管从弹仓前端弹出，枪托顶住肩窝。她扣下扳机时，三发子弹同时出膛，分别射向雅典娜的眉心、胸膛和握枪的右手。


  雅典娜移步。枪尖在空中点出三次残影。前两发被弹开，第三发擦过她的袖口。弹头打在身后的墙壁上，墙壁在结界中纹丝不动。她低头看了一眼袖子上的焦痕。“这样啊。你没我想的那么弱。”


  但她叹了口气。不是嘲讽的语气，更接近一种带着疲倦的陈述。“你拖得时间越长，你的御主……会死的。”


  玛修握紧枪握把的手指开始发白。


  [提亚在下面。不知道言峰前辈有没有赶来。]


  她抬起眼睛，和雅典娜的目光撞在一起。


  她冲过去了。


  玛修的身体往前倾。靴跟在石板上猛地蹬出，身体像被弹弓拉开后松手射出去的石头。双手握住的巨剑高高举起，剑刃迎着雅典娜的脸劈下去。


  第一剑。雅典娜横枪架住。火星从剑刃与枪杆的接触点爆开。


  第二剑。玛修借着被弹开的反震转了一圈，剑势不减反增。身体旋转的力量全部灌进剑刃上最锋利的弓背处，朝雅典娜的侧腹横扫而去。


  少女和女神撞在一起时雅典娜开了口:“提亚，是新灵长……”


  “我当然知道新灵长是什么！”玛修的声音从胸腔底部往外喷。她的喊声震得自己的耳膜嗡嗡作响，气息把嘴唇上沾的灰尘吹得散开。“我知道你想做什么！你想杀了我和前辈，然后自己和那个新灵长缔结契约恢复实力是吧——！”


  雅典娜侧身避开劈下来的剑刃。她的枪尾点在玛修的脚踝侧面。然后她一枪扫开玛修，枪杆抽在玛修的侧腰上。冲击从腰侧传导到整条脊柱，玛修被扫得横飞出去，身体在地板上滑了两米才停下来。肋骨下的痛感像钝刀子割肉，迟缓而沉重。


  “看样子你想明白了。”雅典娜拿枪走向玛修。脚步声不快，每步落地都踩在玛修肋骨的闷痛上。“那就乖乖受死。”


  玛修咬紧牙关。左手撑着地面把自己从碎石里拔起来，右手重新立起巨剑。剑尖在地上拖动时刮出断续的金属声。她挺直脊背，膝盖在痛感中微微发抖。


  “我不会……让你得逞的。”她的声音混在喘息里，沙哑而坚定。


  “哦？”雅典娜歪头，打量着玛修颤抖的双腿和被热浪灼红的手腕。


  “我的名字，玛修·基列莱特！”她把剑尖拄在地上，剑身竖在自己面前，支撑着摇摇欲坠的身体。“我向前辈藤丸立香保证过——我会守护她直到最后一刻！我是迦勒底的从者！希耶尔前辈把她的主武装交给了我，大家……大家都在尽心尽力地想办法救我，哪怕他们嘴上不说——”


  玛修咬住嘴唇，牙齿硌在下唇上压出深深的凹痕。她抬起头，眼底没有泪，只有被逼到绝境之后烧起来的顽固的光。“我不会在这里倒下。”'

content: '朱月的视线像被钉在玛修身上，鲜红色的瞳孔在警报闪光里收缩了一下。她歪了歪头，哥特黑裙的裙摆随着这个动作轻轻晃荡。“有意义吗？”


  她再度招了招手。纤长的手指在空气里一划，狂犬们从地板和墙壁的阴影里渗出来，白色的身影汇聚成一道汹涌的暗流，朝立香和玛修猛扑过去。


  玛修不退反进。她手里第七圣典的单手剑在空中划出一道冷光，剑刃干净利落地斩飞了迎面扑来的第一只狂犬，然后是第二只。骨架碎裂的脆响在走廊里炸开两次，她的动作没有停顿，脚下一蹬退回立香身侧。


  玛修单手举着盾，死死的瞪着眼前的朱月。


  朱月的手微微一握，她慢慢地朝立香踱步而来，踩过狂犬碎骨的姿态和踩过落叶没什么区别。“用的第七圣典可无法战胜我。”声音拖得很轻，尾音往上扬了扬。


  玛修把另一只手上的盾牌举到身前。单手剑立起来，剑尖指着朱月的心口。她静静站在那里，黑色板甲的每一片甲叶都严丝合缝地咬在一起。


  “前辈！”玛修挡在前头，视线锁死在朱月身上。“请下达指令！”


  立香深吸一口气。那股带着旧纸霉味的空气灌进肺里，喉间泛起的干涩被她压了下去。“玛修，你感觉如何？”


  玛修顿了顿。她略微偏头，透过半面面甲的缝隙看了一眼前辈。“我的状态很好，前辈！”


  立香一面给安魂换好弹夹一面开口。弹夹卡进枪身的金属咬合声清脆而踏实。“准备战斗！接敌，别让她靠近爱尔奎特小姐！”


  “明白！”


  朱月看着眼前的两个少女，忽然哈哈大笑起来。那笑声不带有丝毫的嘲讽，而是某种发自内心的乐不可支，在走廊的昏暗里格外刺耳。“你们两个怕不是在说笑吧！”


  话音未落，她已经动了。她来到玛修身侧——只是一次呼吸的时间。爪子挥下，骨质的指甲带起一道惨白的残影。


  玛修立马撑盾挡住，爪子砸在盾面上发出一声极重的闷响。曾经的月球UO展现出了令人窒息的怪力，利爪在单手盾的表面狠狠剐出一道道白痕，尖锐的摩擦声扎进耳膜。玛修咬紧牙骤然发力把朱月推开，脚底的石板在她蹬地的瞬间裂成几块，然后她一剑斩去。


  朱月没有退。她连续挥爪，骨质的指甲如暴风骤雨般砸在玛修的剑刃和盾面上。每一次对撞都震得玛修手腕发麻，黑色板甲的关节铰链发出连续不断的金属摩擦声。十几回交手之后，玛修的头上冒出了汗，汗水顺着额角滑落，沾湿了紫色的发梢。


  不同于特异点F遇到的敌人：


  赫拉克勒斯的压制是压倒性的——但你知道他有多重。Alterego的压制是诡异的，你甚至不知道他在哪里。


  朱月的压法不一样。她不紧不慢地增加力道，像一盏被慢慢拧大的灯，每一剑都比上一剑更沉一些，让你清清楚楚地意识到一件事——她比你强，而且她还能再往上加。


  玛修真切地感受到了这一点，那颗在手术台上被重新锻造过的心脏在胸腔里重重地跳着。


  再度盾击击飞朱月之后，玛修没有喘气的时间，板甲战靴在石板上一蹬，身体朝前追去。


  朱月的嘴唇微微勾起。然后她轻轻念出了那几个字：“空想具现化。”


  周遭的空间在一瞬间扭曲了。如同被像拧麻花一样拧了几圈，整个走廊从一条直线变成了一道被折叠成诡异形状的几何畸体。石砖、壁灯、通风管道的轮廓被拉长又压扁，光影在扭曲的空间里碎裂成一片一片的奇诡色块。


  玛修单手剑上放出蓝色的光芒。“第七圣典·断罪死！”


  一剑斩出。幽蓝的光束从剑刃前端喷薄而出，撞进那片被扭曲的空间里，将麻花形态的空间从中间准确撕裂。裂口两侧的扭曲结构在尖锐的脆响中崩塌，空间碎块一片一片地剥落。


  玛修从斩开的裂缝中冲出，盾牌朝朱月狠狠砸去。盾面撞上了朱月的手臂，撞击声沉闷而短促。玛修的面甲离朱月的脸只有半臂的距离，她看见了对方嘴角那丝张扬的笑意。朱月往侧面偏移了一个身位，动作轻巧得像在跳一支舞。


  撞击落空了。玛修的整个重心都灌在了盾牌上，而朱月卡在撞击落空和一瞬的间隙里——她已经抬起了爪子。她看见玛修的眼睛透过面甲的缝隙在看她。这双紫色瞳孔清晰地倒映着自己的身影，瞳孔里没有怯懦，没有恐惧。


  那是一种交付式的信任，像把什么最重最难握牢的东西稳稳地放在另一个人手上。朱月的内心翻涌了。她不知道玛修为什么不怕——问号在她脑海中一闪而逝。是谁让她这么信任？御主？真祖？神明？朱月没时间想清楚。爪子已经挥了下去。


  立香的声音在这一瞬响了起来。那声音是撕裂空气的宣告：“我的从者，玛修！“


  “身为英雄，展现你真正的实力吧！“


  “英杰之帜！”'

content: '周遭的空气忽然变了质地。那是某种被激活的光，从立香手背上的令咒纹路里迸发出来，亮得让人想闭眼却闭不上。玛修的身躯以一种极度诡异和精准的姿态扭向朱月，战靴在地板上碾出一道深刻的转体痕迹，她朝朱月冲了过去。


  第七圣典再度放出蓝光——那柄剑在B+魔力下本不该能够连发断罪死，但此刻剑刃上蓝光炽烈，魔力奔涌的嗡鸣把走廊里所有的杂音都吞掉了。


  “断罪死。”


  第二发宝具砸了下来。朱月没打算硬接这一发，她朝身后猛地翻滚躲过。第七圣典砸在计时塔的地板上，爆发出一声足以震碎玻璃的巨响。气浪把附近的狂犬全部卷飞，碎骨噼里啪啦地砸在墙壁上。计时塔的地板居然没有坏，只是在冲击正中留下一道长条形的凹痕。


  朱月从翻身中稳住身形，嘴里忙不迭地吐出一句：“啊啊，言峰士郎的原理血戒确实够使啊，加固了计时塔之后这都能挡住。”她的目光死死锁在玛修身上。


  玛修没有停。黑色的板甲以远远超过刚才的敏捷再度突破过来，快得像一道黑色的闪电。朱月来不及想更多，爪子朝前架住玛修的一剑。骨质的指甲卡住钢铁的剑刃，刺耳的摩擦声在两人之间迸发。然后朱月看见了让她头皮发麻的东西——玛修的剑上再度亮起了蓝光。


  “断罪死！”


  第三发。玛修的单手剑裹挟着毁灭一切的沉闷气势朝朱月轰来，幽蓝的光束在极近距离轰然爆开。朱月来不及抵挡，双爪交叉护在身前硬接了这发A+对城的宝具。光芒砸在她的身上。朱月闷哼一声，整个人朝身后倒飞出去，黑裙的裙摆在蓝光里被吹得猎猎作响。她在半空中稳住身形，鞋底在石板地上拖出一条长长的刹车痕迹。


  “怎么可能——”朱月咬紧了牙，声音从牙缝里挤出来。她瞪着玛修，然后忽然松开了，轻笑了一下。“不过也够了。”


  空气的破空声响起。玛修已经追到了她的侧脸位置，第四次宝具真名解放随即而来，蓝光在剑刃上第三次亮起。一剑斩落。


  朱月瞪大了双眼朝玛修狠狠注视过去。


  她的双眸骤然变为纯粹的金色


  【魅惑之魔眼！】


  魅惑魔眼发动了——那双金色的瞳孔里卷起某种无形的力量，像有一只手从视网膜钻进玛修的脑子里按住了一切指令。玛修的身形骤然一顿，整个人的动作慢了半拍，板甲关节的金属咬合声忽然滞了一下。


  “什么……”玛修喃喃开口，咬紧牙关。她凭借意志和残留的惯性把这一剑狠狠斩落——朱月趁机后撤，断罪死的斩击擦着她的发梢掠过，斩断了哥特裙摆的一角。黑布碎片在半空中翻飞。


  “到此为止了。”朱月咬着牙恨声开口，手凭空一抓。走廊里所有的空气都在这一瞬间凝结了，魔力像被抽水泵吸走一样朝朱月的手中涌去。气流倒灌的声音在走廊里呼啸，壁灯的火苗被拉得全都朝一个方向歪倒。


  一柄剑出现在了她的手中。那柄剑和爱尔奎特刚才挥过的真世界一模一样——剑身上流转着不属于这个世界的冷光。


  “什么？”爱尔奎特刚站起来，双手撑在膝盖上还在喘气。她死死盯着朱月手中的魔剑，声音从压抑的喉咙里冲出来：“怎么可能！”


  “闭嘴！”朱月转头朝她吼了一声，暗红色的瞳孔里第一次露出赤裸裸的怒意。“拿我的遗体锻造的剑，我为什么不能复写！！”她迅速后退拉开距离，把真世界横在胸前冷却下来，冷冷地说：“结束了。那个蠢货真祖压根不知道这柄剑该怎么用。”


  玛修迅速后退一步，单手剑插入盾牌中。她挡在立香身前，黑色板甲的每一片甲叶都紧紧地锁合在一起。“前辈，请在我身后！”她大声喊道。


  “无需理会世间的真理。”


  朱月缓缓开口，吟唱的语调从愤怒中抽离出来，一字一顿地落进走廊的死寂里。


  “无需评辩世间的善恶。降临吧！”


  玛修把自己的盾牌往身前一立，脚底死死嵌入石板。“玛修·基列莱特！乃是迦勒底的从者，是藤丸立香的从者！”


  庞大的魔力朝着她整个人汇聚过来。白光从她的周身漫溢而出，纯白的光晕在黑色板甲的映衬下愈发耀眼。她的目光越过盾面的边缘投向前方，眼里没有迷茫。


  朱月将宝具解放：“True World！”魔剑挥落。能够斩裂空间、时间以及一切法则的斩击朝着玛修劈过来，剑光所过之处走廊两侧的墙壁无声地裂开深入尺许的口子。


  玛修大喊：“正因如此！就让这盾牌守住一切吧！”她的盾牌骤然放大，化作一面坚不可摧的巨盾，然后猛地朝地板一插。“Lord Chaldeas！”巨盾落地，一面足以承载城墙防御力的魔力屏障张开，表面流转着洁白而凝固的光。


  轰隆。'

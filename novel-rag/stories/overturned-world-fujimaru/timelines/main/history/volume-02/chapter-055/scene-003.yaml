content: '爱尔奎特也从外面转了出来。她脸上的表情和平时完全不同了，那种懒洋洋的随性从她眼角褪得干干净净，取而代之的是一层紧绷的冷意。她的手指弯起，指尖处利爪的锋芒一闪而逝。


  “果然。”


  走廊尽头出现了一个人影。那人影被壁灯昏黄的光线从背后打亮，轮廓在石板地面上拖出一道又长又瘦的影子。黑色长袍，手中的法杖顶端嵌着一颗惨白色的骷髅。哈迪斯走得不算快，每一步都踩得不紧不慢，像是一个早就料定对方不会跑的人。


  “哈迪斯。”爱尔奎特的声音从喉咙里挤出来，利爪在她指尖彻底成形了。她咬着牙，下颌的肌肉微微颤抖。“来找死吗？”


  “真祖啊。”哈迪斯停下脚步。他的声音平淡得像是机械钟的报时声，不带任何情绪的起伏。“我并无此意。”


  他的瞳孔没有看爱尔奎特。那双暗沉沉的眼睛死死盯着立香的手背，盯着令咒暗红色的纹路。他看了足足三秒才开口。“英杰之帜……雅典娜把她的力量给你了。”他顿了顿，法杖的尾端在石板上轻轻磕了一下。“虽然她本身都不剩什么了。”


  法杖猛地一敲。那声音不像木头敲石头，而是一种更加沉闷、更加低沉的撞击音，像是敲在了某个看不见的门板上。骷髅兵形状的使魔从地面上升起来，不是从黑暗里钻出来的，而是被某种更直接的魔力凭空捏造的。骨节的摩擦声在走廊里此起彼伏。


  “什么……”伊什塔尔眯起眼睛。她咬了咬自己的嘴唇，嘴唇被她咬出一道浅浅的牙印。“这些使魔都有匹敌最顶级的从者的实力了吗？”她偏过头看了爱尔奎特一眼，语气里的认真被一层玩味的调侃裹住了。“看样子爱尔奎特的力量给你吃的很好啊。”


  “哼哼。”哈迪斯的笑声和士郎那种不一样。他的笑是彻底的漠然，干巴巴的，像是在念一个不太好笑的笑话。“如果怕了就让冥界女神埃列什基伽勒和我对敌吧，伊什塔尔。”


  伊什塔尔伸出手。她五指张开，指缝里凭空凝出了十几颗宝石。红宝石，蓝晶石，金刚石，每一颗都在壁灯的光线里折射出凌厉的冷芒。那些宝石在她指间旋转了半圈，然后化成密集的光弹朝着使魔群倾泻而去。宝石接触到使魔躯体的瞬间炸开了——不是单纯的爆炸，而是魔力结晶在碎裂时释放出的脉冲波。使魔没有明显的对抗魔力的外壳，在那片宝石雨里很快就碎成了碎片。碎骨在地面上滚了几圈才停下来。


  “就这啊？”伊什塔尔拍了拍手，下巴微微扬起。


  然后她听到了一声枪响。


  啪。


  安魂的枪声和常规的火药枪完全不一样。那声音更加干脆，更加锋利，像是一根紧绷的弦被人猛地弹了一下。立香的右臂笔直地伸向前方，枪口还在冒着细微的魔力残烟。一只白犬从侧面的阴影里扑出来，被子弹正中额头，整只犬在空中僵了半拍，然后重重摔在地上。四肢抽搐了一下，就不动了。


  立香转过身去。她用背脊靠上伊什塔尔的后背，安魂的双枪重新指向走廊的另外一头。她的呼吸很稳，握枪的手纹丝不动。走廊那一端站着两个人。一个少女，身量不高，套着黑色的哥特式长裙，裙摆层层叠叠地堆在脚踝处。壁灯的光打在她脸上，把那张脸照得比正常肤色白了好几度。


  “第二次见面了，人理最后的御主。”少女笑着开口。声线轻飘飘的，像是在说一件不太要紧的琐事。“现在再告诉你们我的名字是爱尔特璐琪你们大概不会信的吧。”


  她歪了歪头。那个动作不算快，但就在这一歪的时间里，她整个人的气质都变了。声线由轻松绷成了庄严，像是忽然有人在她的喉咙里拧紧了一根弦。那声音不是变大，而是变沉了，每个音节都带着某种毋容置疑的分量。


  “重新自我介绍一下。”


  “吾名，朱月·布伦史塔德。”


  “月之王，朱月·布伦史塔德。”


  爱尔奎特的牙关紧紧咬住了。牙釉质间挤出一声细微的摩擦音，她整个人的肩膀都在微微发抖。那不是冷的，是从骨头里渗出来的某种更深的战栗。


  她的利爪没有褪去，但指尖的锋芒在那个名字出口的瞬间似乎暗淡了半拍。她把对方的称呼从喉咙里颤颤地送出来——“朱月。”


  立香没有抖。她扣在扳机护圈外的手指紧了一下，虎口紧紧压住枪柄的纹理，枪口始终笔直地对着那个穿黑色哥特裙的少女。她的眼神没有从朱月身上移开过一丝一毫。“月球UO是吗。”这句话里没有问号，她把疑问压成了陈述。


  “看样子你懂的挺多。”朱月眼角弯起来，弯成了一道凉薄的笑。她伸出手指捻住自己一绺黑色的长发，往肩后一扬，发丝在走廊阴冷的空气里散开了一道沉甸甸的影子。


  “该说不愧是吉尔伽美什的弟子吗？”'

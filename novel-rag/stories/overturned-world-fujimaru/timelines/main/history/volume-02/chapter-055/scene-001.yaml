content: '笑声从Alterego的喉咙里滚出来，一种听不出任何幽默感的大笑。那笑声撞在塔顶的石柱上又弹回来，在空旷的夜空下显得格外突兀。


  “哈哈哈哈哈。”


  他把笑声掐断了。刀锋在同一秒出了鞘，天丛云的剑身在月光下划出一道冷白色的弧光，刀刃劈向士郎的肩颈处。士郎没退，手指在空中一捻，两柄黑键从掌心凝出，银白色的剑刃交叉着架住那道凌厉的劈砍。金属碰撞的声音又脆又高，像是把玻璃砸在冰面上。


  “狂妄自大的家伙。”Alterego的声音从刀背后面传出来，气息比刚才粗了半拍。


  刀剑在两人之间僵持了不到一秒。士郎手腕一翻，黑键顺着天丛云的剑刃滑下去，刮出一串刺耳的摩擦音。Alterego借力往后跃了一步，靴底在石板上碾出两道浅白的划痕。他落地的姿势不算稳，肩膀偏了半个角度，但手上的刀已经重新摆正了位置。这一次二人都没有留手。剑刃上缠绕的魔力不再是试探的余波，而是透着纯粹的杀意。是搏命的死斗。


  “你在质疑她的想法吗？”Alterego开口的时候，手里的刀没有停。


  他左手猛然张开，掌心爆出极端的光亮——那道光不是暖黄色的，而是某种近乎暴烈的纯白，从指缝间漏出来的时候把整个塔顶都照成了惨白色。光芒朝着士郎直冲过去，像是要把他的影子连同夜风一起吞没。


  “太阳神阿波罗的权能，她倒是做的很到位。”士郎没有闭眼。他迎着那道光直视过去，琥珀色的瞳孔被照得几乎变成了透明的金色。


  视线被光填满，但他的手指没有停——黑键在他掌中挣动了一下，剑身凭直觉架住了那道裹挟着光奔来的斩击。冲击力从剑身传到腕骨，再从腕骨抖到肩胛，他咬住牙把对方的力道卸到身侧的石板上。石板被震裂了几道细纹。


  就在光芒消散的同一刹那，Alterego面前凭空凝出一层薄薄的冰雾。那雾轻薄得像是冬天呼出的一口白气，但它扩散的速度快得不像话——从雾到冰，从薄到厚，只在两次心跳之间。巨大的冰块拔地而起，把两人之间的空间彻底隔断。


  冰块在下一秒被斩开。那一剑劈得干净利落，裂缝从冰块的中央爆开，向四面八方扩散，碎冰还没落地就被夜风卷成了细小的水雾。


  Alterego从水雾中踏出来的那一瞬，视线还没完全恢复清晰。他看见了黑键。那柄银白色的剑刃从他的视线盲区探出来，贴着他的刀身外侧滑过，带着一种几乎微不可察的精准刺向他的腰腹。


  噗嗤。


  黑键入腹的声音闷而短促。士郎在剑刃刺入的同一瞬就已经后撤，脚跟在石板上连续碾了三步，退到了长刀的攻击范围之外。


  Alterego站在原地没有追。他低下头看了一眼腹部的伤口，那只带着手套的手慢慢抬起来，搭在黑键留在体外的剑柄上。然后他把剑拔出来，五指一握，银白色的剑身在他掌心里碎成了几截。金属碎片落在石板上，发出零碎的声响。


  “她有时会做出错误的决策。”Alterego把碎剑扔在地上，语气慢悠悠的，像是在聊一个不太重要的旧话题。“但是我会替她擦屁股。”


  他抬起眼，视线越过两人之间的距离钉在士郎脸上。“不过我有个事情想问你。”


  士郎歪了歪头。那个角度不算大，但足够让对方看出来他在听。


  “你为什么会被藤丸立香召唤出来？”


  士郎的嘴角动了动，不是笑，是某种更加微妙的表情。“我会回答你，但是真真假假你怎么猜测呢。”


  Alterego盯着他看。那目光在士郎脸上停了两秒，然后他的嘴角裂开了。“哈哈哈，那倒不如——”


  刀锋在话音落地之前就已经冲出。他整个人像是一颗被弹弓弹射出去的石头，刀刃在前，身体在后，所有的速度都压在了这一击上。空气被天丛云的剑尖撕出一道尖锐的呼啸。


  “杀了你！”


  士郎的眉头微微挑起。他站在原地看着那道刀光朝他扑过来，嘴唇翕动了两下。那几个字从他喉咙里滚出来的时候声音不大，轻到像是只说给自己听的。


  “原理血戒。”


  周身的空间应声而碎。


  那不是裂开，不是崩塌，而是一种更加彻底的粉碎——整个空间像是被无形的力量从内部撕开了，碎成一片一片的镜面。每一片镜面都在夜风中轻轻转动，反射着冷白色的月光。而每一片镜面上都映着一张脸。都是言峰士郎的面貌。


  无数的士郎从无数个角度凝视着镜面中央的Alterego。他们的表情都一模一样，是没有温度的平静。'

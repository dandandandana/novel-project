content: '“等等……兽是什么？”立香皱起眉头，满脸困惑地问道。


  “你可以理解为人类史上的大灾难，一旦显现，目的就是否定人理、带来毁灭。”希耶尔的声音从门外传来，此刻的她狼狈得很，身上的战甲松松垮垮地挂在身上，多处破损，甚至能透过破洞瞥见底下擦伤的皮肤。


  “灾厄吗……”立香喃喃低语，指尖不自觉地攥紧了衣角。


  “想要讨伐它极其困难，但好在我们面对的这一只，埋葬机关和计时塔曾经联手讨伐过。”希耶尔侧身让开位置，高大的Archer紧随其后走了进来，身上还带着未散的硝烟味。


  “抱歉，御主，恕我无能。“Archer站直着身子，他眼皮微微盖住眼睛，低声开口。话还没说完，就被立香打断了。


  “现在不是自怨自艾的时候，Archer。”立香深吸一口气，“当下最重要的，是想办法解决那只灵长类杀手，不是吗？”


  “明白，御主。”Archer挺直脊背立在一旁。


  “那好，我先跟你们说说Beast到底是什么。”希耶尔清了清嗓子，语气沉了下来。


  “立香，你可以把它理解成人类的自灭装置——由人类自身的罪恶催生，是人类恶的具象化，也是我们必须跨越的劫难。”


  “Beast是因人类的兽性而生的灾害，象征着人类的‘原罪之兽’。”希耶尔顿了顿，继续说道，“但它也藏着人类爱的变质，源于‘守护人类’‘追求更美好未来’的极端愿望，最终却对当下的安宁露出了獠牙。”


  “停停停！太绕了啦！”立香连忙摆出停止的手势，语气带着几分急躁，“我不管什么人类爱、什么未来，现在只想打败那只怪兽，好好活下去！”说这话时，她偷偷瞥了一眼言峰士郎房间的方向，眼底藏着一丝担忧。


  “你说得……也有道理。”希耶尔无奈地叹了口气，“我们面对的这一只是特例——Beast IV，凯茜帕鲁格，也被称为灵长类杀手。”


  “它持有‘比较之理’，人类的贪念、嫉妒、恶意，都会成为它的食粮，让它不断变强。”


  “它的兽之权能，赋予了它一定程度的必胜法则，还有反灵长能力——我和Archer的攻击完全无效，就是因为这个反灵长能力。”希耶尔语气凝重地补充道。


  “不止如此，立香。”通讯器里传来吉尔伽美什的声音，“凯茜帕鲁格还有‘不可战胜’的特性，只要你心存‘战胜它’的念头，就会被它的比较之理反噬而落败。”


  “怎么会这样……”立香咬了咬下唇，眼底闪过一丝慌乱，随即又攥紧拳头，“但你们既然这么说，就一定有打败它的方法，对不对？”


  “对。”希耶尔深吸一口气，语气笃定。


  “等等。”Saber忽然开口，目光落在希耶尔身上，“既然你和Archer回来了，那是谁在拖住那只白兽？”


  “问得好，Saber。”希耶尔点了点头，“这正是我接下来要跟你们说的。”


  “是一名职介为Alterego的从者，他杀了Caster和Caster的御主。”


  “Alterego？！”奥尔加玛丽的声音瞬间拔高，带着几分震惊，“那是……等等，我查一下EX职介……找到了！是人格！”


  “本质是英灵或某个存在的特定情感、愿望、人格特质独立出来，形成的全新个体——这不就是英灵的切片吗？……等等，居然还能缝合神灵？”


  “没错。”希耶尔的语气冷了几分，“那名Alterego，大概率是由吉尔伽美什的‘好儿子’——言峰士郎缝合而成的从者。”


  “英雄王，你不是想知道你的好儿子在里侧过得怎么样吗？连人格都被切片了，滋味如何啊？”希耶尔的语气里裹着毫不掩饰的嘲弄，扬声开口。


  “杂修……”吉尔伽美什的怒骂刚起便戛然而止——不用想也知道，定是骂得太脏，被奥尔加玛丽强行切断了通讯。


  希耶尔收敛了嘲弄，语气沉了几分：“那名Alterego，明显和我们不是一个阵营。但他跟我和Archer说了，他的主子不希望再多出一骑Beast。”


  “就是这只灵长类杀手。”她补充道，目光扫过众人。


  立香指尖轻轻攥着衣角，喃喃低语：“能合作是吗……既然是言峰他……”


  “他不是言峰，只是个赝品。”希耶尔语气冷了下来，淡淡纠正，“就算沾着言峰的影子，也不是现在躺在教堂里昏迷的这个——多半是他成熟时期，不知被谁切走了一段极其恶劣的人格切片。”


  “不止如此，我在他身上感受到了熟悉的神性气息。”Archer适时开口补充，语气依旧沉稳，“能明确分辨的，有我姐姐雅典娜的气息，还有太阳神阿波罗的气息。”


  “另外还有一股气息很熟悉，只是我暂时没能确定是什么。”Archer微微蹙眉说道。'

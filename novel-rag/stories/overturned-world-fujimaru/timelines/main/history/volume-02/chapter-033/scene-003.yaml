content: 'Ruler的琥珀色眸子凝视着她，微微顿了一拍，似乎在心中快速整理着那段已经结束的因果链。


  “我是个没什么计划的人。降临之后，自然是能做什么做什么了。“他的语调平缓而诚实，没有丝毫粉饰，“很显然，当时最重要的事有两件：第一，压制灵长类杀手的权能；第二，想办法让历史回到正轨。“


  他停顿了一下，拉了拉白色风衣的领口。


  “本质上来说，我没有回收圣杯的能力，所以我能做的事情就很简单了。让言峰士郎，也就是特异点中的那个我自己，赢下圣杯战争。最起码，也得是伊莉雅斯菲尔赢下来。“


  立香默默地将这些信息在脑中排列成线。达芬奇也放下了先前的好奇姿态，侧身靠在操控台边，认真地倾听着。


  “所以，我利用原理血戒：神赐，将降灵时的灵基作为代价，交换了两件东西。“Ruler竖起两根手指，“月虹，以及天之衣。“


  “以灵基为代价……“达芬奇低声重复着这几个字，眉心微蹙。将自身的灵基投入交换，这在任何从者的行为逻辑中都近乎于自杀。但Ruler说出这句话时的表情平淡得像是在描述一笔寻常的交易。


  “直接杀死灵长类杀手并不能挽回败局。Berserker和Archer在当时的状况下才是致命的威胁。“Ruler将目光投向立香，嘴角微微上扬，露出一个带有考校意味的笑容，“所以……御主，你可以猜一猜我想要干什么了。“


  立香的眉头缓缓拧紧。她低下头，视线落在自己交叠在身前的手指上，大脑飞速运转。几秒钟后，她抬起头来。


  “驱虎吞狼……吗？“


  Ruler没有说话，示意她继续。


  “你知道灵长类杀手不可能彻底服从Caster的御主，所以只需要等他们之间的关系自然崩落。“立香一边说，一边用手指在空中虚画着关系图谱，“但是你为什么觉得Caster组不会在那之前正面袭击教会呢？“


  “因为月虹的触发器在我……在他身上。“Ruler纠正了一下人称，“当言峰士郎彻底死亡，月虹会成功触发。到那个时候，Saber只需要保护住伊莉雅，就可以轻取圣杯了。“


  “你在说什么？“奥尔加玛丽打断了他的陈述，语气尖锐得像一把锥子，“月虹压根没打死灵长类杀手！“


  “嗯？“Ruler明显愣住了。他的表情凝固了一瞬，那张冷硬的面庞上浮现出真切的困惑，“不可能啊……灵长类杀手怎么可能扛得住全功率的月虹？就算如此……saber也不是吃干饭的，在月虹打下来补刀就好了……“


  “大概是因为灵长类杀手体内有圣杯吧。“立香平静地给出了答案。


  Ruler张了张嘴，又闭上了。他的琥珀色眼眸中掠过一丝短暂的空白，随后缓缓垂下了眼帘。


  “……原来是这样。看样子我的计划有很大的漏洞啊。“他用手背揉了揉额角，苦笑从唇边漫开，“我果然不擅长做这些。“他顿了一下，随即像是要挽回些什么似的补充道，“说回来，月虹本质上只是保底的措施。实际上更核心的计划是等他们内斗消耗之后，通过天之衣实现第三法。“


  “第三法能够让英灵座上的英灵降世。到那个时候，才是决胜的关键。“


  立香静静地看着他说完最后一个字，然后长长地叹了一口气。那声叹息在空旷的测试室里显得格外悠长。


  “漏洞百出啊，言峰士郎。“


  “……我当然知道。“


  “首先。“立香伸出一根手指，语气不疾不徐，像是一位耐心的教官在逐条批阅不合格的作战方案，“Caster有无限道令咒，你知道吗？“


  Ruler的嘴角僵住了。


  “其次。“第二根手指竖起来，“就是刚才说的。圣杯在灵长类杀手体内。你的月虹根本无法造成致命打击。“


  沉默。


  “然后就是……“立香的目光越过Ruler，投向了墙角那位自始至终沉默旁观的黄金王者，“吉尔茜告诉我，你可能知道一件事。“


  “什么事？“Ruler歪了歪头。


  “你知道造成特异点的圣杯和圣杯战争本体的圣杯，它们的内容物被调换了吗？“


  这句话砸下来的时候，Ruler脸上最后一丝从容也碎裂了。


  “……我怎么可能知道。“


  立香看着他那副真诚到近乎委屈的表情，忽然用手掌拍了一下自己的脑门，笑了起来。这一次的笑声比先前更加明朗，在冰冷的测试室中荡开一圈又一圈温暖的涟漪。


  “原来你是这样的人啊。“她的眼睛弯成了两道月牙。


  “你是不是对我有什么误解啊御主。“Ruler一脸无奈地看着这个比自己矮了一大截的少女，明明是自己的计划被批得体无完肤，对方却笑得像是发现了什么了不得的宝藏。'

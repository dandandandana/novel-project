content: '“有从者陨落了……极其强烈的灵基反应彻底消失了！”奥尔加玛丽的声音再次传来，带着几分难以置信，“等等，Alterego那边还有三道灵基反应——一道正常，一道萎靡，还有一道微弱到几乎探测不到。”


  立香沉下心来，快速思索后开口：“那边的战斗我们完全插不上手，现在首要任务是保全自己，不能给他们添麻烦。”


  “立香，冬木市的地脉好像已经被重创了……”通讯器中，奥尔加玛丽的声音带着一丝绝望。


  立香转头望向冠位Saber与Alterego交战的方向，那里早已不复城市模样，漫天火光吞噬着楼宇，浓重的黑烟与尘土交织，遮蔽了半边天空，景象惨不忍睹。


  “啊啊啊这到底是什么啊！”奥尔加玛丽的惊呼声刺破通讯器的杂音，“刚才交战的地方，出现了一个深达三千米左右的巨坑！这简直和神话里的场景一样……”


  “玛修，准备出发！”立香语气坚定，快速做好转移准备。


  Saber小心翼翼地从立香手中接过自己的御主，语气凝重地叮嘱：“迦勒底的御主，前往柳洞寺的路上，或许还残留着Caster的使魔或是尼禄的死徒，你们务必小心。”


  “收到！玛修，我们走！”立香点头应下，握紧拳头，眼神坚定地朝着柳洞寺的方向望去。


  “呜呜——啊啊啊！”


  白兽的凄惨悲鸣在废墟上空反复回荡，它浑身浴血、狼狈不堪，而其眼前的希耶尔，已然再度张起了第七圣典化作的长弓，眼神冷冽如冰。


  “断罪死。”


  第七圣典·断罪死——希耶尔的得意宝具，此刻正以巨型长弓的形态展露锋芒。


  这柄由多种形态合并而成的巨型长弓，单发威力便堪比A++级对军宝具；经多年改造后，更已达成可连发的水准，其发射次数，全凭希耶尔自身的魔力量而定——而拥有“人形魔力工厂”之称的她，从来不乏魔力。


  更值得一提的是，此刻的“断罪死”早已突破形态限制，无需固定为长弓，可在多种形态间自由切换解放。


  第二发断罪死的光芒刚击中灵长类杀手的躯体，希耶尔便毫无迟疑，身形如离弦之箭般朝着这头白兽猛扑而去，不给它丝毫喘息之机。


  剑光一闪，她反手斩出第一剑，凌厉的刃风直逼要害。


  紧接着，第二剑接踵而至，剑剑凌厉，招招致命。


  金属碰撞的脆响与黑泥飞溅的闷响在耳边交织不绝，灵长类杀手已然彻底癫狂，嘶吼声震彻废墟，往日里优雅绝伦的姿态荡然无存，只剩下被激怒后的狂暴与疯狂，周身的黑泥也随之翻涌不止。


  “啧，挨了一发月虹就成这副丑态？”希耶尔一剑得手，语气里满是不屑的嘲讽，一脚狠狠踹开灵长类杀手的躯体，手腕轻转，将第七圣典迅速切换成钉枪形态，“你跟芙芙比起来，可差远了——这就是你会被爱尔特璐琪丢给尼禄的原因吧！”


  巨型钉枪轰然轰出，力道之大堪比重型打桩机，那身形如卡车般庞大的白兽，竟被这一击轰得连连后退数步，脚下的黑泥被踩得飞溅四射。


  可就在这转瞬之间，方才还被轰得节节后退的灵长类杀手，竟骤然消失在希耶尔眼前，没留下丝毫踪迹。


  下一秒，地面上被月虹轰散的粘稠黑泥，仿佛被赋予了生命一般，张牙舞爪地朝着希耶尔猛扑而来，带着刺鼻的腥气与侵蚀性的魔力。


  希耶尔眼神一凝，骤然释放出大量魔力——对拥有“人形魔力工厂”之称的她而言，轰散这些黑泥不过是举手之劳。可就在黑泥消散的瞬间，一道黑影骤然出现在她眼前，速度快得令人猝不及防。


  是灵长类杀手！它张开布满獠牙的巨口，带着致命的腥气，朝着希耶尔的脖颈狠狠咬下。


  希耶尔未曾有半分躲避之意，反手便挥剑迎上，动作干脆利落，没有丝毫拖泥带水。


  剑刃精准堵住了灵长类杀手的巨口，可它的攻击远不止于此——锋利的利爪早已悄然袭来，带着撕裂一切的威势。


  利爪毫无阻碍地刺破希耶尔的衣袍，狠狠洞穿了她的躯体，粘稠的黑泥顺着伤口往里渗透，带着刺骨的寒意与侵蚀性的力量。


  “呃……”


  剧烈的剧痛瞬间席卷全身，紧随其后的，是令人昏沉的认知剥夺，仿佛意识都要被这股力量撕碎。


  可这些痛苦，对早已历经六位数以上死亡次数的希耶尔而言，不过是家常便饭。她强忍着剧痛，一脚狠狠踹开灵长类杀手，随即挥剑再斩，动作没有丝毫迟缓。


  “噗嗤——”利刃入肉的脆响响起，本就满目疮痍的灵长类杀手再度添上新伤。而希耶尔眼底闪过一丝决绝，竟直接咬断了自己的舌头——她的不死性，本质便是时空倒流，此刻的主动赴死，能让她回溯到被攻击前的节点。


  意识回笼，她果然回到了灵长类杀手偷袭的前一刻，可那深入骨髓的剧痛，却并未随之消散——只要她抬手挥剑，躯体便会传来撕裂般的痛感。'

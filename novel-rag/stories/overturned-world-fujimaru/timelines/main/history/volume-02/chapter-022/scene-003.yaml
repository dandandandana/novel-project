content: '即便认知剥夺的昏沉已然褪去，灵长类杀手方才刺入她体内的那股力量却依旧残留在她的躯体之中，如跗骨之蛆，挥之不去。


  “什么……”希耶尔眉头紧蹙，指尖抚过自己的躯体，语气里满是难以置信——她从未遇到过能突破自己不死性、残留侵蚀力量的敌人。


  那股残留的力量正在缓缓侵蚀她的魔术回路，让她的魔力运转都变得滞涩起来。


  她挥剑的速度明显迟缓了许多，每一次挥动第七圣典，都要强忍着钻心的剧痛，手臂不住地微微颤抖。直到此刻，她才终于反应过来，那股纠缠不去的诡异力量究竟是什么。


  【反灵长】


  反灵长——灵长类杀手的核心权能。此刻，希耶尔虽还能勉强握住剑柄挥剑，可体内的力量却正被源源不断地抽离，如同被无形的手一点点剥夺，连魔力运转都愈发滞涩。


  也就是说，这反灵长的终极目的，是彻底抹除她的存在，而剥夺她的力量，不过是这场残酷剥夺的第一步。


  “为什么……”


  她喉间溢出微弱的呢喃，眉头拧成一团——明明月虹早已压制住了对方的权能，为何这股力量还能作用在自己身上？她下意识低头，目光死死锁定脚边粘稠的黑泥，心头骤然一沉。


  “原来是这样……圣杯黑泥。”希耶尔瞬间想通了关键，语气里带着一丝凝重，“灵长类杀手竟将一部分权能寄托在圣杯黑泥中，方才利爪刺入时，便已将这股力量悄悄注入我体内，才得以绕开月虹的压制。”


  灵长类杀手敏锐地捕捉到希耶尔的虚弱，喉咙里发出低沉的咆哮，身形一闪便猛扑而来，锋利的利爪上沾满了粘稠的黑泥，每一根爪尖都泛着侵蚀性的诡异光泽。


  【绝不能再中这一击！】


  希耶尔心中瞬间做出决断，顶着浑身撕裂般的剧痛连连后退，可灵长类杀手的扑击速度太快，她终究没能彻底躲开对方的攻击范围。


  “砰！”


  一声沉闷的巨响骤然炸开，一根黝黑的箭矢精准命中白兽的侧腹，硬生生将它扑来的身形拦了下来。白兽吃痛，庞大的身躯猛然一偏，重重摔向一旁的废墟，溅起漫天碎石与黑泥。


  希耶尔趁机喘了口气，朝着箭矢射来的方向厉声呼喊：“别下来！Archer！这些黑泥会侵蚀从者的灵智！”'

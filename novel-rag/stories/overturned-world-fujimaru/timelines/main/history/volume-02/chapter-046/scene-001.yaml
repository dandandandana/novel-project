content: '死徒清完之后，四人下了车。


  地面的状态不好。战事过后，伦敦的路面已经不像路面，沥青彻底裂开，混凝土碎块散在各处，每一步落下去都要在心里计算一下重心。


  没有人说话。吉尔茜走在最前面，步幅不急，像是面前的路上没有任何值得警惕的东西。士郎在她侧后方，玛修跟着立香，四个人的间距不宽不窄。


  计时塔的大门轮廓在废墟的灰白里越来越近。


  吉尔茜停了下来。


  停得没有任何预兆——她的手下一步已经抬起来了。她侧旁凭空开了一道口，金色边缘整齐的门，她从里面取出一杆长剑，指尖朝下的握住。


  “有敌人。立香，呆在后面。“


  立香已经往后退了，没等吉尔茜说完。她把自己收进了士郎和玛修之间的空隙里，手触了一下腰侧，确认了安魂还在。


  虚空震荡了一下，再一下，然后是第三下，空间被彻底的撕裂开。头顶的空间被什么东西从内侧顶开，三个头，三只脖颈，最小的一只脑袋也有轿车那么宽。居中是狮子的颅骨，下颌悬着，两侧分别是犬头和狼头，六只獠牙每一只都比人的手臂长，滴落的液体打在地面上，混凝土碎块接触到的地方发出细碎的腐蚀声。


  立香把视线往下压了一截，才能看到地面。


  “这是……“她放慢了呼吸，“地狱三头犬，刻耳柏洛斯？“她停顿了一下，“在这里守门的吗？“


  “看来是。“


  吉尔茜的侧旁，那道金色的口子扩开了一些，里面的宝具自行调整了朝向，对准前方，没有发射，只是对准。空气里有什么东西在积压，地面的碎石头被风压吹动的摇晃着。


  刻耳柏洛斯没有动。


  六只眼睛，六个瞳孔，三个方向，把四个人全部覆盖在内，静静地看着，没有攻击的前驱动作，没有警告。它只是这样站着盯着四人。


  “……神话中的怪物。“立香再退了半步，没有挪出保护圈。她盯着居中的狮子头，“吉尔伽美什，能打过吗？“


  “可以，但是——“


  “哦哈哈哈哈~“


  声音从计时塔高处传来，落地的时候已经散开了，飘在整个入口上空。台词本身很轻快，结尾的音节带着拖长，说话的人明显带着恶劣的意味，很可疑的是没有杀意。


  “这不是我们乌鲁克大王，吉尔伽美什吗~没想到现在这副样子呢~要不要我帮你联系一下哈迪斯，让你进去？来，求求我嘛~“


  玛修侧了半步，背对着立香，手调整了一下巨剑的角度，没有出声。她偏头朝吉尔茜的方向，“吉尔伽美什前辈，那是……“


  吉尔茜没有回答。


  她的下颌微微绷了一下，似乎是在咀嚼着什么不愿意见到的事情。宝具库里的武器阵列没有变化，她站在那里，拇指在剑柄上慢慢施了一点力，“伊什塔尔。“


  “你和那个神结盟了？“她顿了顿，“甚至放弃了惯常高调的做派，躲在伦敦的计时塔里。“


  “当然了~“挑衅的声音再一次传来，“就为了恶心你一下，我可是在这里等了好久呢~怎么样怎么样？要试着进来吗？我等着~“


  吉尔茜没有再往计时塔的方向看。她转过来，目光从刻耳柏洛斯的方向扫过来，在士郎身上落住。


  士郎已经在看她了。


  两个人之间没有交换任何话，就那么停了半秒，各自核对了一遍对方的判断，然后士郎转向立香。


  “要交涉吗？“


  “嗯？“立香愣了一下，“还可以交涉？“


  “取决于你。“


  “……那就试试。“立香顿了顿，“你来吗，士郎？“


  士郎点头，抬起右手，指尖在空中划了几道没有轨迹的弧线，嘴里轻声过了几个音节，立香听不出是什么语言。他停下来，手放回身侧，朝着刻耳柏洛斯的方向开口。


  玛修在士郎起身那一刻就收紧了握盾的手，她没有动，脚步没有变，但重心落实了，随时可以抬起来。


  “你主人的意愿是什么？“


  三个头同时动了。左边的狼头先歪，右边的犬头跟上，居中的狮子头最后，幅度都不大，一个非人类的生命体在重新调整注意力的焦点时所做的全部的连锁动作大概就这些了。


  然后刻耳柏洛斯开口了。


  它发出的声音不是人类的语言，不是任何生物的语言，是某种比语言更原始的东西。但落进立香耳朵里的，是她从小听到大的日语，清晰，准确，没有任何口音。


  “汝等竟妄图与吾交涉？“


  [是类似于DND里面通晓语言的魔术吗？]


  “你主人的意愿是什么？“士郎重复了一遍，语气没有变化，像是第一次问这个问题。


  “在吾主完成他现在要实现的伟业之前，“刻耳柏洛斯说，“任何人不得入内。“


  “哈迪斯已经没有神力了。“士郎停了一拍，“他哪里来的伟业？“


  三个头同时静了一下。


  “汝竟敢直呼吾主姓名。“居中的狮子头把下颌稍稍抬起，语气里没有愤怒，是俯视。“确实，吾主失去了一切伟力。但失去伟力，不代表伟业无法完成。“


  士郎想了想。“能否告知我们，那伟业是什么？“'

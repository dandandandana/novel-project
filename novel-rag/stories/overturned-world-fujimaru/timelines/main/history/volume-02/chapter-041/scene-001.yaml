content: '天花板不对。


  灯管的位置偏了。立香的宿舍天花板上嵌着两根并排的灯管，间距十二厘米左右，靠左的那根比靠右的亮。这里只有一根，嵌在正中央，光线均匀地铺满整个房间，色温偏暖，和迦勒底其他区域的冷白色照明不一样。


  很明显，这里是病房，还是有人要长期居住的病房。


  枕头的气味也不对。立香的枕头套洗过之后是迦勒底统一配发的无香洗衣液的味道，干燥、平淡。这个枕头上残留着一层淡到几乎辨认不出的香料气息，混在织物纤维里，被体温捂热之后才慢慢散出来。


  粉色。


  视野里最先成型的色块是粉色。一大片柔软的粉色从视野的右侧占据了将近三分之一的画面，发梢搭在白色的迦勒底制服领口上，制服的布料因为坐姿前倾而在肩膀处拉出了几道横向的褶皱。粉色头发的主人肩膀上蹲着一团白色的毛球，两只前爪搭在发丝上，尾巴卷成一个松散的圈。


  “前辈，你还好吧？“


  玛修的脸从粉色的发帘后面凑过来。距离很近，近到立香能看见她鼻梁上那颗淡得快要消失的小痣。


  “达芬奇说你实际上没什么事情，但是我不放心，就一直在这里等着了。前辈要好好照顾自己啊……“


  立香没有立刻回答。


  脊椎从尾骨到颈椎逐节恢复知觉，每一节之间隔着半秒左右的延迟。手指能动了，脚趾能动了，腰腹的肌肉在撑起上半身的时候发出了一阵酸软的抗议。裂解术的后遗症集中在头部，太阳穴两侧的胀痛已经退成了一层钝钝的压迫感，不影响思考，但转头的时候会有零点几秒的眩晕。


  立香撑着床面坐起来。手掌按在床单上的触感传来了信息——床单的材质比她自己宿舍的薄，弹性更好，床垫偏硬。右手离开床面的时候指尖蹭过了枕头边缘，那股香料气息又飘了一下。


  她揉了揉眼睛。指节压在眼眶上方的骨骼上，用力转了两圈，视野里的模糊褪干净了。


  玛修就在床沿。白色制服穿得整整齐齐，领口的扣子扣到了最上面一颗，袖口的长度刚好盖住手腕。肩膀上的白色毛球，芙芙的两只耳朵竖着，黑色的圆眼睛盯着立香，前爪在玛修的肩章上踩了两下。


  立香伸出手，捏住了玛修的左脸颊。


  拇指和食指合拢，把那块软组织往外拉。


  “欸？“


  “欸？前辈！“


  玛修的头往后缩了一下，但立香的手没松。脸颊的皮肤在指腹下面是温热的，有弹性，捏起来的手感和记忆里一样。立香的拇指在玛修脸颊上按了两秒，松开。指腹离开皮肤的时候，被捏过的位置留下了一小块浅粉色的压痕。


  “我不要紧。“


  立香把手收回来，活动了一下肩膀。左肩转了一圈，右肩转了一圈，颈椎在转动的时候发出了一声细微的咔嗒。


  “玛修感觉怎么样了？“


  玛修的嘴张开了，又合上。两只手搁在膝盖上，右手的食指在左手手背上划了一道，停住了。


  “状态很差。“


  声音从门口传来。


  希耶尔靠在门框上，蓝色便服的袖口照旧长过手背，只露出指尖。右手的指尖夹着一根没点燃的棒棒糖的塑料棍，在指间转了半圈。


  “立香，看样子你已经差不多好了。对了，你睡的是我的床。“


  立香的头转向门口。转头的动作带出了那零点几秒的眩晕，她眨了一下眼，等眩晕过去。


  “对不起希耶尔前辈。“


  说完这句话立香才开始打量房间。比她自己的宿舍大一圈，布局不同——床靠着左墙而不是右墙，桌子在床尾而不是床侧。桌面上摆着一台关了屏幕的笔记本电脑，电脑旁边立着一本书，封面朝外。封面上印着一口冒热气的锅，锅里是金黄色的咖喱，书名用粗体印在上方：《世界咖喱料理大全·南亚篇》。


  “希耶尔前辈？不是说好了不跟前辈说的吗……“


  玛修转过身，肩膀上的芙芙顺着这个动作跳了出去。白色的毛球在空中划了一道弧线，四只爪子准确地落在希耶尔的左肩上，前爪立刻伸出来，肉垫按住了希耶尔的左脸颊，往下扒拉了一下。


  希耶尔用右手拨开芙芙的爪子。棒棒糖的塑料棍从指间滑到了掌心里。


  “瞒着她没有意义，玛修。接下来你们要去的地方，不把底牌摊开就是送死。“


  “我知道，但是……“


  “别但是了。“


  希耶尔把芙芙从肩膀上拎起来，托在掌心里。芙芙的四条腿在空中蹬了两下，尾巴甩了一圈，安静下来，缩成一团窝在希耶尔的手掌上。


  “前辈，伦敦的战斗我也会去。“


  玛修从床沿站起来。迦勒底制服的下摆在站起的动作中晃了一下，膝盖处的布料有两道坐久了压出来的折痕。她站在立香面前，两只手垂在身体两侧，手指收拢又张开。


  立香靠在床头的墙壁上，后脑勺抵着冰凉的合金墙面。


  “玛修既然开口了，肯定是有办法战斗对吧。“


  “嗯。“玛修点头。“希耶尔前辈把她的武装交给我了。“


  “武装？“'

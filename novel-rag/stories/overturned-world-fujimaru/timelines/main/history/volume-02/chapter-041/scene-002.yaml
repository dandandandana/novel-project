content: '“第七圣典。“希耶尔在门口接过话。芙芙在她掌心里翻了个身，露出肚皮。“我的身体没法再用了，放着也是浪费。玛修的灵基虽然受损，但她和你之间的契约链路还在，足够驱动圣典的部分形态。“


  “部分形态是哪些？“


  “裁决装甲，还有一到三号死因的基础武装。“希耶尔的手指在芙芙的肚皮上划了一下，芙芙的后腿蹬了一脚。“四号以上的形态需要我本人的魔力回路做中继，玛修用不了。但一到三号够了，配合装甲的防御性能，至少不会上去就被秒杀。“


  “盾牌没了……“玛修的声音顿了一拍。右手的手指在裤缝上蜷了一下。“但是，这些武装我可以用。我试过了，前辈。“


  立香看着站在面前的玛修。


  制服领口扣到最上面一颗的少女，肩膀上少了那团白色毛球之后显得单薄了一些。两只手垂在身侧，手指刚才蜷过的那只右手现在松开了，掌心朝着大腿外侧。


  “玛修。“


  “嗯，前辈。“


  “我不会让你死的。“


  房间里安静了两秒。希耶尔手掌上的芙芙耳朵转了一下，朝立香的方向偏了偏。


  玛修的肩膀动了。不是耸肩，是两侧的肩胛骨同时往中间收了一下，制服后背的布料被牵出了一道竖向的褶皱。


  “前辈这段时间……变了好多。“


  “嗯哼？那我得问问，变好了还是变坏了。“


  立香的头从墙壁上离开，歪向右边。后脑勺离开合金墙面的时候，墙面上留下了一小块被体温捂热的区域。


  “当然是变好了。“


  “原来我在玛修心里不是最好的啊。“


  “等、等等前辈，前辈在我心里当然是……“


  玛修的两只手从身侧抬起来，掌心朝前，左右摆了两下。摆到第三下的时候停住了。


  “……前辈不许开这种玩笑了。“


  “好的我知道了。“


  立香把两条腿从被子里抽出来，脚踩在床沿下方的地板上。运动鞋还在脚上——吉尔伽美什抱她过来的时候没脱鞋。左脚的鞋帮还是压扁的那个状态，脚后跟踩在折叠的鞋帮布料上，站起来的时候脚底板传来了一层硌硌的不平整感。


  她站起来。膝盖稳住了，没有发软。


  “希耶尔前辈。“


  门口的希耶尔抬起头。芙芙从她掌心里跳回了玛修的肩膀上，四只爪子在制服的肩章上踩了两下，找到了平衡点，蹲稳了。


  “谢谢你把武装给玛修。“


  希耶尔把空出来的手插进便服的口袋里。棒棒糖的塑料棍从口袋边缘露出了一截。


  “别谢我，把她活着带回来就行。“


  “前辈……“


  玛修站在房间中央。银色板甲将上半身包裹得严实，肩甲的弧线贴合锁骨往下延伸，胸甲正面的纵向棱线从喉部护片一路收束到腰甲接合处。下半身的装甲比例削减了许多，腿甲的覆盖集中在膝盖和小腿前侧，留出了足够的活动余量。和希耶尔穿戴时那种上身紧身战斗服、下身厚重板甲的配置完全相反。第七圣典的步枪形态握在右手里，枪托抵着肩窝，枪口朝下，漆黑的枪管比玛修的前臂还长出去一截。


  立香从床沿站起来，走到玛修面前。


  右手抬起来，掌心拍在玛修胸甲的侧面。金属传回来的触感冰凉、密实，掌根撞击板甲的声响沉闷而短促，震动从掌心传到腕骨，再沿着前臂消散。


  “很帅啊玛修。“


  “谢、谢谢前辈……“


  立香的手没收回去，指腹顺着胸甲侧面的接缝往下摸了一段。板甲的接合处打磨得很平整，指腹划过去没有毛刺，金属的温度正在被玛修的体温慢慢捂热。


  “话说，希耶尔前辈穿的时候是紧身战斗服来着？上半身那种。“


  立香转头看向门口。希耶尔还靠在门框上，蓝色便服的袖口盖过手背，指尖夹着那根棒棒糖的塑料棍。


  “我死不掉。板甲形态对我没什么意义，穿着碍事。“


  三个字就把话说完了。立香在心里默默给希耶尔的“惜字如金“程度又加了一分。


  玛修把步枪从肩窝移开，枪口朝下，左手扶住枪身中段。板甲的关节铰链在手臂抬起、放下、旋转的过程中连续发出了沉闷的金属咬合声，每一组之间的间隔很短，带着几分尚未磨合的生涩。


  “前辈，除了熟练度，其余的都还可以。“


  玛修把步枪换到左手，右手握拳松开，握拳松开，手指在银色手套里活动了两轮。腰部铰链在她扭腰的时候咬合得很紧，转动幅度受限，但核心区域的防护因此更稳固。


  “那就好。“立香点头。“不会……“


  话没说完。


  “不会对她的生命有威胁的，藤丸立香。“


  立香回头。言峰士郎从门口走进来，半个身子越过还靠在门框上的希耶尔，希耶尔往旁边让了半步，棒棒糖的塑料棍在指间转了个方向。


  士郎穿着迦勒底的标准制服，袖口卷到了前臂中段，手环的银色链节搭在左手腕上。他走到玛修身侧停下来，和玛修之间隔了一臂的距离。'

content: '除了他曾经的御主，还有两名御主、两名从者，以及一名类人存在，竟是全员出动了。


  【是打算倾巢而出，直接来找我了吗？】Archer眼底闪过一丝了然。


  他清楚，他们的首要目标，必然是挡在前面的自己。略一思索，Archer已然有了决定。


  他再度拉弓，箭头依旧对准了那个来历不明的红发从者。'

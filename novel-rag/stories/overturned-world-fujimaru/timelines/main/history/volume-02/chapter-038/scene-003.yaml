content: '“可是我做不好——“


  “做不好和不去做是两回事。“


  这句话切进来的角度快而利落。不是打断，是补充。言峰士郎的语速没有变，声调也没有变，他只是把立香话尾的犹豫用自己的下一句缝上了。


  立香的呼吸停了一拍。然后她笑了。是一个带着自嘲的、从鼻腔里哼出来的单音节。


  “你真的很适合当神父。“


  “代行者。“


  “随便啦。“


  她松开了抱着膝盖的手，十根手指摊在床面上，掌心朝上。像在清点自己手里还剩下什么。


  “那玛修和希耶尔呢。“她的声音变得很轻。“她们为我付出了那么多。希耶尔拼命把圣杯带了回来，伊莉雅为了第三法死了……玛修受了那么重的伤。我对她们说什么？''谢谢你们的牺牲，我会努力的''？“


  她抬起头，嘴角还挂着那个自嘲的弧度，但眼睛不像在笑。


  “太廉价了吧。“


  言峰士郎没有立即开口。


  他看着她摊开在床面上的手掌。十根手指，指尖因为凌晨的寒意微微发白。右手手腕内侧的令咒纹路在暗光下呈现出暗沉的红色。


  “立香。“


  他叫她的时候，声调往下沉了半度。


  “她们后悔了吗？“


  立香的手指弯了弯。


  “……我怎么知道。“


  “你知道。“


  这两个字他说得不容任何余地。不是反驳，是确认。像在帮她翻开一页她一直捏着不敢看的纸。


  “你在场。你看到了玛修举盾的那一刻，看到了伊莉雅做出选择的那一刻。她们的脸上有后悔吗？“


  立香的手指停住了。


  她的脑海里浮现出那些画面。玛修举起盾牌的瞬间，紫色的眼睛看过来嘴唇翕动了一下，说了什么。伊莉雅站在圆环中央的背影，白色的衣摆被魔力气流吹起来，银色的长发散开。


  没有后悔。


  那两张脸上都没有后悔。


  “……没有。“她说。声音小到几乎只有嘴唇的形状。


  “那就好。“


  言峰士郎说“那就好“的方式很奇怪。没有如释重负，没有“你看我说对了吧“的得意。只是一个陈述，像在确认一个早就知道答案的方程式。


  “她们替你做了选择，你没有办法阻止，也没有资格替她们后悔。“他的视线从她的手掌移回她的脸上。“你能做的只有一件事。“


  “什么？“


  “把这份自责握在手里。“


  立香的眉头皱了起来。


  “什么意思？“


  “不是放下。“言峰士郎的声音在“放下“两个字上轻轻地弹了一下，像在拨开一根不该碰到的弦。“你做不到放下，我也不会让你放下。她们的付出值得被你记住，连同你的痛、你的愧疚、你觉得自己配不上这份牺牲的那些念头，全部。“


  他停了一拍。


  “握住它们。带着它们走。“


  他的右手从口袋里抽出来，在身前攥了一下拳头。不是用力的、发泄式的握拳，是一个展示性的动作，像在向她示范“握“这个字的具体形态。


  “自责会变重。走到某一天你会觉得握不住了。“他松开拳头，手指张开，又合拢。“那时候来找我。我帮你分担。“


  “……“


  立香盯着他的手看了很久。


  然后她低下头，盯着自己摊在床面上的手掌。那双手在几小时前握过玛修的盾，在特异点F的废墟里接过士郎递来的令咒碎片。现在它们空空的，掌心的纹路在灯光下像一张被水泡过的地图。


  她慢慢地把手指收拢。


  不是拳头。是一个半握的姿态，像在攥着什么看不见的东西。


  “这样？“


  “嗯。“


  “好重。“


  “会的。“


  言峰士郎看着她。


  他的目光在立香的脸上停了几秒。她刚从膝盖后面抬起来的那张脸上还残留着哭过的痕迹，眼睫潮湿，鼻翼两侧泛着薄薄的粉色。瞳孔是清的，像雨后的窗玻璃，水渍还挂在上面，透过去能看见外面的东西。


  他开口的时候稍微犹豫了一下。


  “关于你的父母……“


  “目前已经观测不到了。“


  立香的声音切进来的时候，士郎的后半句还含在嘴里。她的语速很平，陈述的是一个技术性事实。


  “伦敦方向有人的气息，东京方向没有。“


  她顿了一拍。


  “他们死了。“


  四个字。干燥、利落。她说这四个字的方式和之前承认“我是个半吊子“不一样。那句话里有自嘲的弹性，有把自己踩低之后等待反弹的余地。


  这句话没有。


  房间里安静了两秒。汽水杯里的气泡还在往上翻涌，每一颗细小的气泡浮到液面上炸开的声音此刻都变得分明。


  “我很抱歉。“


  士郎说的。


  声音不大，他说这四个字的时候肩膀沉了一点，身体重心往脚跟方向移了移，像是在承接某种物理意义上的重量。


  “我对自己的亲生父母已经完全没有印象了。“


  他接着说。视线从立香脸上移开，落到了她旁边的床头柜上。汽水杯子旁边的蛋糕碟，碟子里残留的奶油在灯光下凝成了一层薄薄的膜。


  “连他们的脸、名字，全部是空白的。所以我没法说''我理解你的感受''这种话。“'

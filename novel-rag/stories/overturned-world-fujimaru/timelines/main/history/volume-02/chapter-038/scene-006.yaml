content: '他走到床头柜旁边，拿起她用过的那只空杯子和旁边揉成团的纸巾。顺手把柜面上凝结的水珠用袖口蹭掉了。然后他转身去拿小桌上自己的那杯汽水——杯子里还剩小半杯，气泡已经完全消散了，液面平静如水。他把两只杯子叠在一起，叠放的角度让它们发出一声很轻的、玻璃碰玻璃的闷响。


  他收拾东西的样子很自然。没有刻意做给谁看的成分，也没有赶时间的急切。就像他在迦勒底的厨房里收拾灶台、在埋葬机关的宿舍里整理文件一样，是一个被重复了无数次的日常动作。


  立香坐在床上看着他的背影，嘴还微微张着，脑子里那两句话反复碰撞着，发出一种她暂时无法命名的共振。


  士郎把杯子放到门边的矮柜上，转过身来。


  他看见立香坐在床上没有动。


  眼睛睁着，视线落在他身上，但焦距不对。


  身体在这里，意识被什么东西拉走了。


  他以为她困了。


  “立香。“


  没有回应。


  他走过去。两步的距离。他弯下腰，从口袋里抽出一张纸巾，对折了一下，用纸巾的折角在她嘴角右侧擦了擦。那里沾了一小片蛋糕碎屑，被汽水打湿之后贴在皮肤上，如果不擦掉，明天早上会变成一块干掉的白渍。


  立香在纸巾碰到她嘴角的那一瞬间回过了神。


  “——喂！“


  她的手掌推上了他的胸口。力度不小，士郎退了半步，纸巾还捏在指间，折角上沾着一丁点奶油的白色痕迹。


  “你在干什么？“


  “你嘴上有东西。“


  “那也不用你擦吧！“立香的声音拔高了，耳廓的颜色肉眼可见地变红了。她用自己的手背使劲蹭了两下嘴角，蹭完之后才想起来他已经擦过了，多余的动作已经做完了。


  她瞪了他一眼。


  士郎把那张用过的纸巾叠成一个小方块，放进口袋里。他的表情没什么变化。被推了一下也没什么特别的反应，就像这是一个每天都会发生的固定环节。


  他走到门口。


  手指搭上门把手的时候，他回了一下头。走廊灯管的光从他身后照过来，在他的侧脸上划出一条明亮的轮廓线，另外半边脸沉在房间内部的暗影里。


  “做个好梦，立香。“


  他说完，拉开门。走廊的白光和空调的低频嗡鸣涌进来一瞬，又随着门板的合拢被隔断在外面。


  门锁咔哒一声扣上。


  脚步声沿着走廊向远处移动。每一步之间的间距均匀，节奏稳定。不快不慢的，代行者的步伐。


  直到听不见了。


  立香坐在床上。


  房间里恢复了只有一个人的安静。空调的出风口吹着恒温的冷气，刚才被两个人的体温和呼吸暖起来的空气正在一点一点降回去。床头柜上的蛋糕碟和杯子都已经被收走了，柜面上只剩下一圈浅淡的水痕和一小块被蹭掉的奶油渍。


  她抬起手，摸了摸自己的嘴角。


  纸巾擦过的地方，皮肤上还残留着一点被按压过的触感。不痛不痒。很轻的、日常的、像顺手整理衣领或者拨开挡住视线的碎发一样理所当然的接触。


  看你开心，我就开心。


  寻找到属于我的愉悦。


  立香慢慢地把手放下来。


  她的手落在床面上，掌心朝下。五根手指在被单上张了张，又收拢了。


  “……什么嘛。“


  声音很小。小到只有她自己和这个房间的四面墙壁听得见。


  她侧过身，拉起被子盖到了肩膀。脸埋进枕头里的时候，枕套的棉布面料吸走了她鼻腔里最后一点酸涩的残余。她闭上眼睛，黑暗涌上来，把凌晨两点十分的迦勒底宿舍兜底包裹住了。


  走廊里什么声音都没有了。


  空调的恒温气流在头顶无声地循环着。


  很久之后，她的呼吸变深了。'

content: '“本质上，这触发装置是那位Ruler留下的最后手段，是绝境中的无奈之举。如果你们不来，一旦言峰士郎濒死，就几乎等同于彻底败北，没有挽回的余地。”他顿了顿，脚尖轻轻点了点脚下的黑泥，“你们若是打算把他摔在这黑泥上面，那可惜了，只会彻底失败。这黑泥会直接吞噬他的生命力，而非让他达到生理性濒死，这点，你们明白吗？”


  “什？”玛修满脸错愕，下意识地愣了一下，脚步微微后退了半步。就在这一瞬间，灵长类杀手抓住破绽猛扑而来，锋利的利爪直逼玛修面门，却被Alterego反手一剑挡下，黑泥飞溅。


  “看来，那位弓已经把关键的扳机送过来了~”Alterego语气里的戏谑更浓了，目光望向天空，轻轻嗤笑一声，“还用了魔术缓冲速度，倒是比看上去更在乎那小子的死活。”


  “你要做什么？”玛修立刻回过神，握紧手中的盾牌，语气紧绷得几乎要断裂，眼神里满是警惕与愤怒，“如果你敢伤害士郎前辈，我绝对不会放过你！”


  “放心，我可没那么傻。”Alterego轻笑一声，语气里带着几分不屑，“直接杀了他，不就等于和迦勒底彻底宣战？我可没打算给自己找麻烦。”他顿了顿，语气变得严肃了些许，“撑住这灵长类杀手半分钟，别让它干扰我。”


  话音刚落，他便挥出两剑，凌厉的刃风逼退扑来的灵长类杀手，随后纵身一跃，身形如离弦之箭般冲向天空，转瞬便消失在云层之下。


  另一边，希耶尔双手托着言峰士郎的身体，神色凝重，沉声道：“我会用魔术控制你的下落速度，尽量缓冲冲击力，不至于让你摔得太惨，能最大程度保留触发宝具的可能。”


  “没事的，希耶尔前辈。”言峰士郎微微垂眸，声音平静得没有一丝波澜，仿佛早已做好了赴死的准备，没有丝毫畏惧。


  “那出发了，士郎……”希耶尔看着他平静的侧脸，语气复杂，既有担忧，也有无奈，“我不确定你能否活下来，能否成功触发宝具，但我会拼尽全力，用魔术帮你稳住性命。”


  “啊，我早该想到会是这样。”言峰士郎轻轻应了一声，语气里没有丝毫抱怨，只有一种尘埃落定的平静，仿佛早已预料到这一切。


  希耶尔不再多言，深吸一口气，眼中闪过一丝决绝，依言将言峰士郎狠狠掷向天空，同时催动魔术，一道淡蓝色的魔力光晕包裹住他的身体，缓冲着下落的速度。


  言峰士郎在空中悬浮了片刻，起初并未多想，脑海里只有触发月虹、击败灵长类杀手的念头，直到他低头瞥见地面上那片粘稠如沥青的黑泥，心头骤然一沉，一个不好的预感涌上心头——【糟了……】


  他虽不知这黑泥的具体危害，却隐约察觉到不对劲，这般粘稠的物质，恐怕会干扰濒死状态的触发，无法稳定激活Ruler的宝具。他咬紧牙关，牙齿紧紧抵在舌根，随时准备咬舌自尽，以此强行达到濒死状态。


  “不管怎么样，必须触发月虹……”他在心中默念着，指尖微微蜷缩，做好了咬舌的准备，语气里满是决绝。


  话音未落，一只强有力的手臂突然从旁伸出，死死扣住他的胳膊，巨大的拉力几乎要扯碎他的骨骼，疼痛感瞬间席卷全身。戏谑的男声在他耳边响起，带着几分嘲讽：“看样子你已经发现了？即便有必死的觉悟，也挡不住情报不足的致命缺陷啊。”


  “你……Alterego？”言峰士郎被那股巨大的力量攥得几乎喘不过气，艰难地转动脖颈，看向身旁的人，语气里满是错愕与警惕。


  Alterego在空中死死扼住他的脖颈，指尖微微用力，杀意毫不掩饰地从周身散发出来，语气却依旧轻松慵懒：“没错，职介Alterego。你该也看到了，地面上的是圣杯黑泥，你若是摔下去，只会被黑泥吞噬，绝对达不到濒死状态，更别说触发月虹了。”


  “既然你们没本事让你达到濒死，那我来帮你。”Alterego嘴角勾起一抹冰冷的笑意，语气里没有丝毫温度。


  言峰士郎被他死死捏住脖颈，呼吸愈发困难，只能眼睁睁看着Alterego手中浮现出一柄闪着寒光的小刀，刀刃锋利得能映出他苍白的脸庞。小刀精准地划过他的右胸，紧接着是腰间、肝脏——除了心脏之外的所有脏器尽数被剖开，鲜血瞬间喷涌而出，随后是手臂上的血管、腿上的动脉，最后是喉管，每一刀都精准狠辣，没有丝毫留情。


  “你要是死了，我可不好向迦勒底交代，更没法完成我的目的。”Alterego看着他满身是血的模样，语气平淡，没有丝毫怜悯。'

content: '“不……不太一样。”希耶尔顿了顿，仔细斟酌着措辞，“他身上有种说不清楚的奇怪，用‘信条’形容也不太贴切。他表面上是个虔诚的信徒，但我总觉得，他并不是真的信仰什么，只是单纯觉得，自己应该这么做，或许……是习惯了吧。”


  “哦……”立香挠了挠下巴，又开始回想之前发生的一切，小声呢喃道，“只是觉得应该这么做吗……”


  【怎么可能有人会下意识地觉得自己必须去拯救别人呢？】


  “不过话说回来，目前来看，后背倒是可以交给他。”希耶尔话锋一转，语气认真了几分，“但据我所知，尽量不要让他参与重大决策。”


  “他就是个烂好人，有时候冲动起来，甚至会不惜赔上自己的性命。”希耶尔点了点头，语气肯定，随即又笑了起来，“好了，不说这些沉重的了，要不要听听言峰士郎的小趣事？”


  “欸？希耶尔前辈……不太好吧，刚才在那边不还是说言峰先生不要告诉我们你的事情吗？“玛修皱着眉开口道。


  “不，我觉得可以，只要我们不让言峰知道不就好了。“立香一下子提起来了兴趣。


  “哼哼……我就知道，毕竟你们是这个年纪啊……“希耶尔笑了笑开口道，”我想想……他之前……哦，那是第五次圣杯战争之后的事情了。在一户人家当了半年管家来着。“


  “管家？“


  “嗯。“希耶尔捏着下巴开口道，”这件事我还是听吉尔伽美什说的，我也很好奇，他为什么会去当管家，明明他压根不缺钱的。“


  “后面我问他了，他的回答是在那里当管家并没有影响到他什么，而且主人家过的很开心。”


  立香好像忽然想到什么似的。


  “希耶尔前辈，你说言峰有没有可能是享受自己给他人带来快乐的那种人。”她兴致勃勃的开口道，“而且是亲手给他人制造的开心，他就会很幸福呢？”


  “不好说，我和他虽然很熟但没有到交心的那种程度，只能说有这种趋向，你和他才认识多久？”希耶尔捶了一下立香的脑袋，“很晚了，该睡觉了。”


  “是的，前辈，别像昨天一样又睡着了。”


  “我知道了……”'

content: '“没想到你的机体竟然还留着。”她停住脚步，仰起头看着面前的庞然机体。那个机体的轮廓从甲板上升起来，底部的结构在云层映出的微光里拉出一排排极长的阴影，从朱月的脚尖一直延伸到甲板的边缘然后坠入云里。“在众神陨落的游星尖兵战役里，你是怎么活下来的？”


  一个声音从她身侧响了起来。那是一个半金属半女性的声音——金属的共鸣声在下半段，女性轻柔的语调在音节的上半段，两者被某种精密的算法缝合在同一个发声点上。“并没有活下来。所有的机神都陨落了。”


  “哦？那这个战舰是怎么做到留下来的？”朱月看着漂浮在甲板边缘的光球。光球的表面荡漾着一层不断自我牵引又重新弥合的淡蓝色光弧，那光弧上写着某种不属于人类文字体系的符号。


  “作为卫星。利用舰体自带的AI摄取宇宙垃圾修复了不知道多少年才修复的。”那个AI的女声又开了腔，语调不紧不慢，没有骄傲没有悲伤。每一个句子被说出来之后就消散在空气里，不留一点回响。


  “这样啊——”朱月把手指抵在自己的下巴上，指尖在皮肤上戳出一个小小的凹陷。“他所要的真祖的魔力大概是复活了你吧，本身数据就存在了这个战舰里面——这就是终端吗？”


  “不过你们？”她顿了顿，然后歪过脑袋看着那团光球。她的红瞳在甲板上的冷光里亮得像两块倒映着火光的冰片。“真的算人吗？”


  珀耳塞福涅没有回答。光球表面的蓝色的光弧在那一瞬间慢了半拍，然后继续平稳地荡漾，仿佛什么都没有被问到一样。


  “当然不算吧——”朱月把身子往后一甩，整个人仰头看向甲板上空那片没有星的黑穹。“不管是神琦灰的‘绝对人类至上主义’里面的狭义人类，或者是当代的人类理论，你们机神怎么说都称不上是人或者神。人起码要是碳基的。”她把“碳基”两个字从舌尖上推出来的时候语调里带着一层纯正的轻蔑——不是刻薄，是她作为月球的触觉对有机生命和金属物体的本能划分。“神起码要是信仰诞生的。而你们希腊的机神作为外来的产物，被人类信仰获得了权限，可以说是人神都不是了。”她说完这句话后将头偏回那团光球的方向。


  沉默在甲板上拉了三拍。珀耳塞福涅没有发出任何声音，连光弧的流淌声都静了下来。


  “不要大放厥词了，朱月。”哈迪斯的声音从甲板的外沿一步踏进来。他没有走过来——他直接出现在了朱月的面前，黑色的战袍在无风的空间中纹丝不动。语气冷到他周围的空气都往下降了一度。那是存在本身的冷，是站在他旁边连血液都会被冻结的冷。“你没资格评价我们。”


  “好的好的，开玩笑的啦——”朱月轻轻笑了起来，把手从下巴上放下去摆了摆。“这么在意干什么呢？我们目前是盟友对吧。”她把最后一个音节的音量收得恰到好处，刚好够传到哈迪斯耳中然后消散。


  哈迪斯冷冷地看着她。他的瞳孔里没有任何可以被称为情绪的波动。那不是压抑，是本来就没有。“我知道你想从什么地方羞辱我。”


  “那你说说看咯？”朱月把下巴微微抬起来，红瞳对上了哈迪斯的眼睛。她的嘴角还挂着刚才那个轻笑的残影。


  “那场战争我们确实是彻彻底底地输了。在宙斯败阵之后。”哈迪斯开口道。他说话的语气像是在复述一段被写进某个数据库里的战报。每个词都精准、干燥、没有任何多余的颤动。“圣剑使出世，利用星之圣剑Excalibur解决了游星尖兵。”


  “嗯哼？”朱月歪过头去。”这我当然知道啊。”


  “你不好奇为什么我们在败阵之后圣剑使才出世吗？”哈迪斯淡淡地说着。他在说完这句话后稍微停顿了一拍，像是在等朱月自己把这句话咀嚼完再给他下一步的反应。


  朱月看着哈迪斯，眯起眼睛，她的瞳孔在眼缝里微微收窄了一瞬。“因为，盖亚想要除掉你们？”


  “可能是除掉所有外来的神明吧，包括南美洲的细菌成神。”哈迪斯说着。他没有肯定朱月的推测，也没有否定它。他把这句话放在那里，让朱月自己去理解。“但是，战舰作为行星保留在外面的原因——”


  朱月愣了一下。她在把刚才听到的所有信息拼成一张完整的时间线：宙斯战败、机神全陨、圣剑使才出世——这个顺序如果反过来，历史会完全不同。她仔细地回想着那个时间点上的格局，然后抬起头重新看向哈迪斯。


  “是威慑？”


  “没错。”哈迪斯淡淡地开口。他的声音在这一刻比刚才稍微降了一个调的重量，像是在说一个不该被任何人小觑的事实。“圣剑使修好了冥王哈迪斯战舰上的AI系统，并且将其的轨道安排在地球的轨道上，作为地球的卫星——来威慑其余的外星生物。”'

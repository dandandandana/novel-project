writing_context:
  immediate_previous_scene: 天照命败北为普通黑金孔雀，杨浞与吉尔伽美什重伤，弥勒佛掌仍压伊耶那岐宫，创造白火沿古刀痕燃烧
  active_conflict: 弥勒被降格与主炮重创后仍以近千代文明武艺和极乐佛身进行最后硬战
  participant_roles:
    fujimaru_ritsuka: 指挥、降格、英杰之帜；后退到被保护的坐标中心
    qihuang: 守坐标、阵型、感知现时欲望并保护立香
    kotomine_shirou: 负伤参战；以投影装填王戟及李周巍参数
    mash_kyrielight: 防护核心；接受英杰之帜；参与最终宝具对轰
    kotomine_shirou_ae: 疏散、近战牵制、最终解放天丛云村正伪
    artoria_pendragon_alter: 疏散、突进与火力；不打开潘多拉
    sengo_muramasa: 维持创造之禊祓，进入战场，完成最终天羽羽斩
    yang_zhuo: 重伤留在后方，提供王戟情报
    gilgamesh: 重伤留在后方，从王之财宝取出王戟原型
    maitreya: 真诚爱人类但剥夺其选择；降格后仍具压倒性基础战力
  style_parameters:
    - 三章分别建立计划成立、战法突破、世界自由三个中心
    - 战斗写清距离、伤势、借力与结果；宝具大场面同时给核心动作、近身反馈和远景后果
    - 对白避免翻译腔与概念播报，允许打断、省略、回嘴和沉默
    - 不平均分配描写，不把十五条大纲各写成孤立镜头
